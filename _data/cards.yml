      JSON·plain text를 지원하고 `--mcp`로 MCP 서버로도 띄울 수 있다. (스타 수는 README가 밝힌 수치다.)
    points:
      - "MIT 오픈소스, 26.3k★(README) — `npx repomix@latest` 한 줄로 레포를 단일 파일로 패킹"
      - "`--compress`(Tree-sitter)로 토큰 절감 / Secretlint로 비밀정보 차단 / .gitignore 존중"
      - "`--remote`로 클론 없이 원격 레포 패킹, 출력 XML·MD·JSON, `--mcp`로 MCP 서버 제공"
    source: "https://github.com/yamadashy/repomix"

