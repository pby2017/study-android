  title: Codex PAYG 좌석 — 파일럿 비용을 좌석비가 아니라 토큰 원장으로 보기
  summary: OpenAI는 2026-04-02 ChatGPT Business·Enterprise 워크스페이스에 Codex-only pay-as-you-go 좌석을 도입했다. 고정 좌석비 없이 Codex 전체 접근을 주고, 별도 rate limit 대신 토큰 사용량으로 과금해 파일럿 팀이 예산·워크플로·팀 단위 비용을 더 직접 추적하게 하려는 모델이었다. 다만 같은 글의 2026-06-24 업데이트는 새 Business 플랜 PAYG 좌석 제공을 중단했고, 기존 PAYG 좌석은 영향 없다고 밝혔다. 그래서 교훈은 "싸게 시작한다"가 아니라, 코딩 에이전트 도입을 계약·좌석·토큰 원장·spend control이 바뀔 수 있는 운영 체계로 봐야 한다는 점이다. 반복 자동화나 장기 에이전트 작업은 seat count보다 token consumption, 팀별 budget owner, workflow별 ROI 태그가 중요하다. OpenAI는 같은 글에서 paying business user 900만+와 주간 Codex builder 200만+, Business·Enterprise 내 Codex 사용자 1월 이후 6배 성장을 adoption signal로 제시했다.
  points:
