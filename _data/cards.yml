  - category: ai
    title: "openskills — Claude Code 스킬을 Cursor·Codex·Aider까지 그대로 쓰게 해주는 범용 로더"
    summary: >
      openskills는 Anthropic의 SKILL.md 스킬 시스템을 Claude Code 밖의 다른 에이전트에서도 쓰게 해주는 CLI 도구다(Apache 2.0, GitHub 10.4k★, TypeScript).
      핵심은 "범용 SKILL.md 설치기" — 스킬을 받아 `AGENTS.md`에 Claude Code와 똑같은 `<available_skills>` XML 포맷으로 박아 넣어, AGENTS.md를 읽는 모든 호환 에이전트가 같은 스킬을 쓰게 만든다.
      지원 대상은 Claude Code·Cursor·Windsurf·Aider·Codex 등이고, `npm i -g openskills` 후 `npx openskills install anthropics/skills`로 공식 스킬 모음을 한 번에 깔 수 있다.
      Claude Code의 점진적 공개(progressive disclosure) 방식을 그대로 따라 평소엔 이름·설명만 로드하고 필요할 때만 본문을 읽으므로, 여러 도구를 오가며 작업하는 팀이 스킬 자산을 한 벌로 공유하기 좋다. Anthropic 비공식 프로젝트다.
    points:
      - "SKILL.md를 AGENTS.md의 <available_skills> XML로 변환 — Cursor·Windsurf·Aider·Codex 등 AGENTS.md 읽는 에이전트가 공유"
      - "설치: npm i -g openskills → npx openskills install anthropics/skills / npx openskills sync (Apache 2.0, 10.4k★)"
      - "점진적 공개 유지 — 평소 이름·설명만, 필요 시 본문만 로드 / Anthropic 비공식"
    source: "https://github.com/numman-ali/openskills"

  - category: ai
    title: "mini-swe-agent — 단 100줄 파이썬으로 SWE-bench Verified 74% 넘긴 에이전트"
    summary: >
      mini-swe-agent는 SWE-bench·SWE-agent를 만든 프린스턴·스탠퍼드 팀이 내놓은 극단적으로 단순한 코딩 에이전트로, 에이전트 핵심 로직이 약 100줄 파이썬에 불과한데도 SWE-bench Verified 74%를 넘긴다(MIT 라이선스).
      차별점은 "bash 외에 도구가 없다"는 것 — LM의 tool-calling 인터페이스를 안 써서 litellm·openrouter로 거의 모든 모델에 그대로 붙고, 각 동작을 subprocess.run으로 독립 실행해 샌드박싱이 쉽다.
      대화 이력이 완전히 선형(매 스텝이 메시지에 append만)이라 디버깅·파인튜닝에도 유리하다. 복잡한 스캐폴딩 없이도 최신 모델이면 높은 점수가 나온다는 것을 보여주는 레퍼런스라, 자체 에이전트를 처음 짜보려는 팀의 출발점으로 좋다.
    points:
      - "에이전트 핵심 ~100줄 파이썬으로 SWE-bench Verified 74%↑ — 'bash 외 도구 없음'이 핵심 설계(MIT)"
      - "tool-calling 미사용 → litellm·openrouter로 모든 모델 호환 / subprocess.run 독립 실행로 샌드박싱 용이"
      - "완전 선형 이력(스텝마다 append)으로 디버깅·파인튜닝 유리 / SWE-bench·SWE-agent 만든 프린스턴·스탠퍼드 팀"
    source: "https://github.com/SWE-agent/mini-swe-agent"

  - category: ai
    title: "Memory Bank — 세션이 바뀌어도 프로젝트 맥락을 잃지 않게 하는 마크다운 메모리 패턴"
    summary: >
      Memory Bank는 에이전트가 세션·컨텍스트 리셋을 넘어 프로젝트 맥락을 유지하도록, 핵심 정보를 프로젝트 루트의 구조화된 마크다운 파일 묶음으로 외부화하는 패턴이다.
      에이전트는 매 세션 시작 때 이 파일들을 먼저 읽어 '소스 오브 트루스'로 삼아, 불완전한 이해에서 나오는 잘못된 가정을 막는다.
      RooCode 구현(GreatScottyMac/roo-code-memory-bank)은 `memory-bank/` 디렉터리에 다섯 개 코어 파일을 둔다 — activeContext.md(현재 목표·세션 상태), decisionLog.md(아키텍처 결정과 근거), productContext.md(상위 프로젝트 맥락), progress.md(완료 작업), systemPatterns.md(코딩 패턴). 루트의 projectBrief.md는 초기화 시 즉시 맥락을 준다.
      Cline·RooCode·KiloCode·Cursor가 비슷한 방식을 쓰며, 핵심은 프롬프트(휘발성)가 아니라 대화 밖에 존재하는 영속 메모리라는 점이다. Claude Code의 MEMORY.md와 같은 계열의 발상이다.
    points:
      - "맥락을 프로젝트 루트 마크다운으로 외부화 → 세션·리셋을 넘어 유지, 매 세션 시작 시 먼저 읽어 가정 오류 방지"
      - "RooCode 코어 5종: activeContext / decisionLog / productContext / progress / systemPatterns + 루트 projectBrief"
      - "Cline·RooCode·KiloCode·Cursor 공통 패턴 — 프롬프트(휘발) 아닌 대화 밖 영속 메모리 / Claude Code MEMORY.md와 동류"
    source: "https://github.com/GreatScottyMac/roo-code-memory-bank"

  - category: ai
    title: "Windsurf Cascade Workflows — 반복 작업을 .md 레시피로 만들어 /슬래시로 부르기"
    summary: >
      Windsurf(VS Code 포크, Codeium이 만들고 2025년 12월 Devin 제작사 Cognition이 인수)의 에이전트 모드 Cascade에는 'Workflows'가 있다.
      배포·PR 코멘트 대응처럼 반복되는 멀티스텝 작업을 마크다운(.md) 파일 하나에 제목·설명·단계 시퀀스로 정의해 두고, `/[워크플로명]` 슬래시 커맨드로 호출하는 기능이다.
      에이전트가 알아서 부르지 않는 '수동 전용(manual-only)'이라 의도치 않은 실행이 없고, 파일당 12,000자 제한이며 워크플로 안에서 다른 워크플로를 호출할 수도 있다.
      저장 위치는 워크스페이스(`.windsurf/workflows/*.md`)와 글로벌(`~/.codeium/windsurf/global_workflows/*.md`)로 나뉘어, 레포에 커밋해 팀과 버전관리하며 공유할 수 있다. Claude Code의 슬래시 커맨드, Windsurf 자체 Workflow와 같은 계열의 '반복 작업 재사용' 패턴이다.
    points:
      - "반복 멀티스텝(배포·PR 대응)을 .md 한 파일에 제목·설명·단계로 정의 → `/워크플로명`으로 호출"
      - "수동 전용(에이전트가 자동 호출 안 함) / 파일당 12,000자 / 워크플로가 다른 워크플로 호출 가능"
      - "워크스페이스 `.windsurf/workflows/*.md`는 레포 커밋으로 팀 공유·버전관리, 글로벌은 `~/.codeium/...`"
    source: "https://docs.devin.ai/desktop/cascade/workflows"

  - category: ai
    title: "Cursor 규칙(.mdc) — 한 덩어리 지침을 '언제 켤지'로 쪼개 토큰 아끼기"
    summary: >
      Cursor의 프로젝트 규칙은 `.cursor/rules/*.mdc` 파일로 둔다(확장자가 `.mdc`여야 함 — 프런트매터가 없는 `.md`는 무시됨). 핵심은 AGENTS.md·CLAUDE.md처럼 모든 세션에 통째로 들어가는 게 아니라, 프런트매터 3필드(`description`·`globs`·`alwaysApply`) 조합으로 '언제 끌어올지'를 규칙마다 따로 정한다는 점이다.
      활성 방식은 네 가지: ① Always(`alwaysApply:true`) 매 세션 포함 ② Auto Attached(`globs` 매칭 파일이 컨텍스트에 들어올 때만) ③ Agent Requested(`description` 보고 에이전트가 필요하다 판단하면) ④ Manual(`@규칙명`으로 직접 부를 때만).
      덕분에 "테스트 파일 만질 때만 보는 규칙"을 평소 컨텍스트에서 빼둘 수 있어, 거대한 단일 규칙 파일이 매번 토큰을 먹는 문제를 피한다. 우선순위는 Team → Project → User 순으로 병합되며 앞쪽이 충돌 시 이긴다.
    points:
      - "`.cursor/rules/*.mdc`(버전관리), 프런트매터 `description`·`globs`·`alwaysApply` 조합으로 적용 시점 결정 — `.md`는 무시"
      - "4가지: Always / Auto Attached(globs 매칭) / Agent Requested(description 판단) / Manual(@멘션)"
      - "globs로 '특정 파일 만질 때만' 켜서 평소 컨텍스트 절약 / 우선순위 Team→Project→User"
    source: "https://cursor.com/docs/context/rules"

  - category: ai
    title: "claude-code-router — Claude Code를 DeepSeek·Ollama 등 다른 모델로 갈아끼우기"
    summary: >
      claude-code-router(musistudio, MIT, 35k★)는 Claude Code의 요청을 가로채 Anthropic이 아닌 다른 모델로 보내주는 프록시다. `npm install -g @musistudio/claude-code-router`로 깔고 `~/.claude-code-router/config.json`에 공급자를 적으면, Claude Code의 UX는 그대로 두고 뒤에서 도는 모델만 바꾼다.
      핵심은 작업 종류별로 모델을 따로 지정하는 라우팅이다. `default`(일반 작업), `background`(가벼운/로컬 모델로 비용 절감), `think`(Plan Mode 같은 추론 작업), `longContext`(60K 토큰 초과 긴 컨텍스트) 네 카테고리에 서로 다른 모델을 매핑할 수 있고, 세션 중에도 `/model` 명령으로 즉시 전환된다.
      지원 공급자는 OpenRouter·DeepSeek·Ollama·Gemini·Volcengine·SiliconFlow 등이며, 커스텀 트랜스포머 플러그인으로 요청을 변형할 수도 있다. 가벼운 잡일은 로컬 모델, 무거운 추론만 비싼 모델로 돌려 비용을 깎는 식의 운용이 가능하다.
    points:
      - "Claude Code 요청을 프록시해 다른 모델로 라우팅 — UX는 그대로, 뒷단 모델만 교체(MIT, 35k★)"
      - "작업별 모델 분리: default / background(저비용·로컬) / think(추론) / longContext(60K+) + `/model`로 즉시 전환"
      - "OpenRouter·DeepSeek·Ollama·Gemini 등 지원 / 가벼운 일은 로컬 모델로 비용 절감"
    source: "https://github.com/musistudio/claude-code-router"
  - category: ai
    title: "Cline 서브에이전트 — 메인 에이전트의 컨텍스트를 지키는 '읽기 전용 탐색대'"
    summary: >
      Cline(VS Code 오픈소스 에이전트)이 추가한 서브에이전트는, 메인 에이전트가 명시적으로 시킬 때 띄우는 병렬 탐색 에이전트다. 각 서브에이전트는 자기만의 컨텍스트 창을 가지고 코드베이스를 독립적으로 뒤진 뒤, 결과 요약만 메인 에이전트에게 돌려준다.
      핵심 설계는 '읽기 전용'이다. 서브에이전트는 프로젝트 파일을 읽을 수만 있고, 파일을 쓰거나 파괴적 명령을 실행하거나 MCP 서버에 접근할 수 없다. 그래서 메인 에이전트의 컨텍스트를 광범위한 정보 수집으로 더럽히지 않으면서, 교차 관심사 추적이나 영향 범위 조사 같은 탐색 작업을 여러 갈래로 동시에 돌릴 수 있다.
      이는 Claude Code의 서브에이전트와 같은 발상(컨텍스트 격리 + 분업)이지만, 쓰기 권한을 아예 빼서 '탐색 전용'으로 좁힌 점이 다르다. 무거운 조사는 서브에이전트에게 넘기고 메인 컨텍스트는 실제 작업에 남겨 두는 운용이 가능하다.
    points:
      - "메인 에이전트가 명시적으로 띄우는 병렬 탐색 에이전트 — 각자 별도 컨텍스트 창을 가짐"
      - "읽기 전용: 파일 읽기만 가능, 쓰기·파괴적 명령·MCP 접근 불가 → 결과 요약만 메인에 반환"
      - "컨텍스트 격리로 메인 창을 깨끗이 유지 / 교차 관심사·영향 범위 조사를 여러 갈래 병렬로"
    source: "https://docs.cline.bot/features/subagents"
  - category: ai
    title: "Pydantic AI — 'FastAPI 느낌'으로 타입 안전하게 짜는 모델-비종속 에이전트 프레임워크"
    summary: >
      Pydantic AI는 Pydantic 검증 라이브러리를 만든 팀이 내놓은 파이썬 에이전트 프레임워크다. README는 스스로를 "프로덕션급 GenAI 애플리케이션을 빠르고 자신 있게 짜도록 돕는" 프레임워크라 소개하며, 목표는 웹 개발의 FastAPI가 주던 '이게 되네' 하는 개발 경험을 LLM 앱에 가져오는 것이다.
      핵심은 타입 안전성이다. 에이전트의 입력·도구·출력을 Pydantic 모델로 정의하면 LLM 응답이 그 스키마에 맞게 검증되고, 안 맞으면 모델에 자동 재요청한다. 덕분에 "문자열 받아서 파싱하다 터지는" 흔한 실패가 컴파일 타임 가까이로 당겨진다. 모델에도 안 묶여서 OpenAI·Anthropic·Gemini·DeepSeek 등을 같은 코드로 갈아끼울 수 있고, 타입 안전한 의존성 주입, MCP/A2A 연동, Logfire(OpenTelemetry) 관측이 기본 제공된다.
      코딩 에이전트를 '쓰는' 도구가 아니라 '만드는' 토대라서, 사내 자동화나 커스텀 에이전트를 직접 구축할 때 LangChain의 대안으로 자주 거론된다. MIT 라이선스, 약 17.8k★.
    points:
      - "Pydantic 팀의 파이썬 에이전트 프레임워크 — 입력·도구·출력을 Pydantic 모델로 정의하고 LLM 응답을 스키마 검증(안 맞으면 자동 재요청)"
      - "모델 비종속: OpenAI·Anthropic·Gemini·DeepSeek 등을 같은 코드로 교체 / 타입 안전 의존성 주입 + Logfire 관측 기본"
      - "에이전트를 '쓰는' 게 아니라 '만드는' 토대 — MIT, 약 17.8k★ (수치는 레포 주장)"
    source: "https://github.com/pydantic/pydantic-ai"
  - category: ai
    title: "Aider 아키텍트 모드 — 비싼 모델로 '계획', 싼 모델로 '편집' 둘로 쪼개기"
    summary: >
      Aider(터미널 기반 오픈소스 페어 프로그래밍 도구)의 아키텍트 모드는 한 요청을 두 모델로 분업시킨다. 공식 문서에 따르면 메인 모델(아키텍트)이 "문제를 어떻게 풀지" 먼저 제안하고, 두 번째 요청에서 에디터 모델이 그 제안을 실제 파일 편집 명령으로 변환한다.
      이유는 단순하다 — 많은 LLM이 '추론'과 '정확한 파일 편집'을 한 번에 잘 해내지 못한다. 역할을 나누면 결과가 더 좋아질 수 있다는 것이 문서의 설명이다. 흥미롭게도 같은 모델을 양쪽에 써도 '두 번 보는' 효과로 결과가 나아지는 경우가 있다고 한다. 대신 요청이 두 번 나가니 시간·비용은 더 든다.
      실무 포인트는 비용 최적화다. 아키텍트엔 추론 강한 비싼 모델, 에디터엔 빠르고 싼 모델을 붙이면 '비싼 모델 품질의 계획 + 싼 모델 가격의 편집'을 노릴 수 있다. `--architect`는 `--chat-mode architect`의 단축키이고, `--editor-model`로 편집 담당 모델을 따로 지정한다(안 주면 메인 모델에 맞춰 자동 선택).
    points:
      - "한 요청 → 두 모델: 아키텍트 모델이 해법을 제안하고, 에디터 모델이 그걸 파일 편집으로 변환 (요청 2회)"
      - "추론과 정확한 편집을 한 번에 못하는 LLM에 효과 — 같은 모델을 양쪽에 써도 '두 번 보기'로 개선되는 경우 있음(공식 문서, 수치 없는 정성적 주장)"
      - "`--architect` = `--chat-mode architect` 단축키 / `--editor-model`로 편집 모델 지정 → 비싼 계획 + 싼 편집으로 비용 절감"
    source: "https://aider.chat/docs/usage/modes.html"

  - category: ai
    title: "Backlog.md — 깃 레포를 사람·AI 공용 칸반 보드로 바꾸는 마크다운 태스크 매니저"
    summary: >
      Backlog.md는 별도 서버나 SaaS 없이, 깃 저장소 안에서 작업(task)을 평범한 마크다운 `.md` 파일로 관리하는 오픈소스 도구다(MIT 라이선스). README에 따르면 모든 이슈가 깃에 커밋되는 .md 파일이라 PR·브랜치·히스토리와 자연스럽게 묶이고, 제로 설정 CLI로 터미널 칸반 보드와 웹 UI를 띄울 수 있다.
      핵심은 'AI 에이전트와 사람이 같은 작업 목록을 공유'한다는 점이다. Claude Code·Gemini CLI·Codex·Kiro 등 MCP/CLI 호환 어시스턴트를 지원하며, MCP 커넥터를 쓰면 이 도구들에 워크플로 지침까지 자동 주입된다. 에이전트가 작업을 To Do→In Progress→Done으로 옮기고 진행 상황을 파일에 남기므로, 세션이 바뀌어도 '무엇을 하던 중이었나'가 레포에 그대로 남는다.
      실무 포인트는 핸드오프다. 사람이 잘게 쪼갠 태스크를 에이전트에 넘기고, 에이전트가 작업하며 상태를 갱신하면, 별도 트래커 없이 깃 하나로 사람-AI 협업의 단일 진실 공급원(source of truth)을 만들 수 있다.
    points:
      - "작업 = 깃에 커밋되는 마크다운 .md 파일 — 서버·SaaS 없이 레포 안에서 칸반·진행 추적(MIT 라이선스)"
      - "Claude Code·Gemini CLI·Codex·Kiro 등 지원, MCP 커넥터가 에이전트에 워크플로 지침 자동 설정"
      - "사람이 태스크 쪼개 핸드오프 → 에이전트가 To Do→In Progress→Done 갱신 → 세션 바뀌어도 맥락이 레포에 남음"
    source: "https://github.com/MrLesk/Backlog.md"
  - category: ai
    title: "Ralph Wiggum 루프 — 코딩 에이전트를 '끝날 때까지' 새 컨텍스트로 다시 돌리는 패턴"
    summary: >
      Geoffrey Huntley가 심슨 캐릭터 이름을 따 정리한 'Ralph'는 본질적으로 `while :; do cat PROMPT.md | claude-code; done` 한 줄이다.
      매 반복마다 새 컨텍스트 윈도로 에이전트를 다시 띄워 한 번에 한 가지 일만 시키고, 작업이 끝날 때까지 같은 프롬프트를 계속 먹인다.
      핵심은 긴 실행에서 컨텍스트가 오염·압축되며 모델이 길을 잃는 문제를 '상태를 파일에 두고 매번 새 컨텍스트로 리셋'해 우회한다는 점이다.
      상태(우선순위 TODO·스펙·빌드 지침)는 fix_plan.md·AGENT.md 같은 파일에 두고, 테스트·타입체커·정적분석을 backpressure로 걸어 잘못된 생성을 거른다.
      Anthropic은 이 기법을 공식 `ralph-wiggum` 플러그인으로 구현했다 — `/ralph-loop`로 시작하면 Stop 훅이 종료를 가로채 완료 조건까지 같은 작업을 세션 안에서 반복시킨다.
    points:
      - "Geoffrey Huntley가 명명, 본질은 '프롬프트 파일을 에이전트에 반복 투입하는 루프' — 매 회 새 컨텍스트로 컨텍스트 오염을 우회"
      - "상태는 파일에(fix_plan.md·specs·AGENT.md), 검증은 test/build·타입·정적분석으로 — 저자는 신규(greenfield) 프로젝트·시니어 감독을 전제, '90%까지'로 평가"
      - "Anthropic 공식 ralph-wiggum 플러그인: /ralph-loop 시작·/cancel-ralph 중단, Stop 훅이 완료 조건까지 세션 내 반복(작성자 Daisy Hollman)"
    source: "https://ghuntley.com/ralph/"

  - category: ai
    title: "Claude Code 비용 줄이기 — 공식 문서가 권하는 실전 체크리스트"
    summary: >
      Claude Code는 API 토큰 소비량으로 과금되는데, Anthropic 공식 'Manage costs' 문서는 개발자 1인 평균 비용을 활동일당 약 $13, 월 $150~250로 제시하고 사용자 90%는 활동일당 $30 미만이라고 밝힌다.
      비용을 줄이는 1순위는 모델 라우팅이다 — 대부분의 코딩은 Sonnet으로 처리하고 Opus는 복잡한 아키텍처 결정·다단계 추론에만 아껴 쓰며, `/model`로 세션 중 전환하거나 서브에이전트엔 `model: haiku`를 지정한다.
      컨텍스트 관리도 핵심이다 — `/context`로 무엇이 공간을 잡아먹는지 보고, CLAUDE.md는 핵심만 담아 200줄 이하로 유지하며, 안 쓰는 MCP 서버는 `/mcp`로 끈다.
      도구는 MCP보다 `gh`·`aws`·`gcloud` 같은 CLI를 선호하면 도구 목록이 컨텍스트에 안 올라가 토큰을 아낀다. 어디서 새는지는 `/usage`(스킬·서브에이전트·플러그인·MCP별 % 분해)로 추적한다.
    points:
      - "공식 기준치: 개발자 1인 활동일당 약 $13, 월 $150~250 / 사용자 90%는 활동일당 $30 미만 (Anthropic 'Manage costs' 문서)"
      - "1순위는 모델 라우팅 — 기본 Sonnet, Opus는 아키텍처·다단계 추론만, 서브에이전트엔 model: haiku"
      - "컨텍스트 절약: /context로 점유 확인 · CLAUDE.md 200줄 이하 · 안 쓰는 MCP는 /mcp로 끄기 · 도구는 MCP보다 gh/aws/gcloud 같은 CLI 선호(목록이 컨텍스트에 안 올라감)"
    source: "https://code.claude.com/docs/en/costs"

  - category: ai
    title: "LangGraph — 상태를 가진 에이전트를 '저수준'에서 직접 짜는 오케스트레이션 프레임워크(34.8k★)"
    summary: >
      LangGraph는 LangChain Inc이 만든 '상태를 가진(stateful) 에이전트를 위한 저수준 오케스트레이션 프레임워크'로, 깃허브 스타 34.8k(MIT 라이선스)다. CrewAI·AutoGen처럼 '에이전트 역할'을 추상화해 떠먹여 주기보다, 에이전트의 흐름을 그래프(노드·엣지)로 직접 설계하게 해 제어권을 개발자에게 준다.
      핵심은 'durable execution' — 실행 상태를 영속화(checkpoint)해 중간에 실패하거나 며칠씩 걸려도 멈춘 지점부터 정확히 재개한다. 여기에 human-in-the-loop(에이전트 상태를 사람이 들여다보고 수정), 단기·장기 메모리, 토큰 단위 스트리밍이 붙는다.
      LangChain 위에서 돌지만 LangChain 없이도 단독으로 쓸 수 있고, Klarna·Replit·Elastic 등이 프로덕션에 채택했다고 README가 밝힌다. 멀티주차 장기 워크플로, 조건부 분기, 사람 승인 게이트가 필요한 에이전트에 특히 많이 쓰인다.
    points:
      - "'상태를 가진 에이전트를 위한 저수준 오케스트레이션 프레임워크' — 흐름을 그래프로 직접 설계(34.8k★·MIT)"
      - "durable execution: 실행 상태를 checkpoint로 영속화해 실패·장기 실행 후 멈춘 지점부터 재개 + human-in-the-loop·메모리·스트리밍"
      - "LangChain 위에서 돌지만 단독 사용 가능 / Klarna·Replit·Elastic 등 프로덕션 채택(README 주장)"
    source: "https://github.com/langchain-ai/langgraph"

  - category: ai
    title: "GitHub Copilot 코딩 에이전트 — 이슈를 던지면 알아서 PR을 올리는 비동기 에이전트"
    summary: >
      터미널 CLI 에이전트와 달리, GitHub Copilot 코딩 에이전트는 깃허브 안에서 '비동기'로 도는 자율 에이전트다. 이슈를 `@copilot`에게 할당하거나 Agents 패널에서 작업을 주면, 에이전트가 백그라운드에서 레포를 조사하고 구현 계획을 세운 뒤 브랜치에 코드를 고쳐 초안 PR(draft pull request)을 연다.
      실행은 GitHub Actions 위에서 돌아 격리된 환경에서 빌드·테스트를 거치고, 사람은 결과 PR을 리뷰만 하면 된다. 즉 '내가 옆에서 지켜보며 짜는' 동기식 페어 프로그래밍이 아니라, '일을 맡겨두고 다른 일을 하다 PR로 받는' 워크플로다.
      VS Code·GitHub.com·이슈 어디서든 `@copilot` 멘션으로 호출할 수 있어, 자잘한 버그·반복 작업을 사람 손에서 떼어내 백로그를 비우는 용도에 맞는다.
    points:
      - "이슈 할당 또는 @copilot 멘션 → 에이전트가 레포 조사·계획·브랜치 수정 후 초안 PR을 자동 생성"
      - "GitHub Actions 위에서 격리 실행(빌드·테스트), 사람은 PR 리뷰만 — '동기식 페어'가 아닌 '비동기 위임' 워크플로"
      - "Agents 패널·GitHub.com·VS Code·이슈 등 여러 진입점에서 @copilot으로 호출 가능"
    source: "https://docs.github.com/en/copilot/concepts/agents/coding-agent/about-coding-agent"

  - category: ai
    title: "npx skills — 에이전트 스킬의 '패키지 매니저'(vercel-labs·22.5k★)"
    summary: >
      스킬(SKILL.md)이 쏟아지면서 생긴 문제는 '어떤 걸 어떻게 깔지'다. Vercel Labs의 skills CLI는 스스로를 '오픈 에이전트 스킬 생태계를 위한 CLI'라 부르며, npm 패키지처럼 스킬을 검색·설치·갱신하게 해준다(깃허브 22.5k★·MIT).
      핵심 명령은 `npx skills find`(키워드·대화형 검색), `add`(설치, 예: `npx skills add vercel-labs/agent-skills`), `use`(설치 없이 1회 실행), `list`/`update`/`remove`/`init`이다. 설치 방식은 심링크(권장)와 복사 두 가지를 지원한다.
      특히 한 도구에 묶이지 않는다 — README는 Claude Code·Codex·Cursor·OpenCode를 비롯해 Gemini CLI·Copilot·Windsurf·Zed 등 71개 이상의 에이전트에 같은 스킬을 깔 수 있다고 밝힌다. 동반 디렉터리 skills.sh에서 공개 스킬을 둘러볼 수 있다.
    points:
      - "스킬을 npm처럼 다루는 CLI: find(검색)·add(설치)·use(1회 실행)·update·remove·init (22.5k★·MIT)"
      - "한 도구 전용이 아님 — Claude Code·Codex·Cursor·OpenCode 등 71개+ 에이전트에 동일 스킬 설치(README 주장)"
      - "심링크(권장)/복사 설치 지원, 공개 스킬은 skills.sh 디렉터리에서 탐색"
    source: "https://github.com/vercel-labs/skills"

  - category: ai
    title: "Superpowers — 코딩 에이전트에 '방법론'을 스킬로 주입하는 프레임워크(obra)"
    summary: >
      Superpowers(obra/superpowers)는 단발성 도구가 아니라 AI 코딩 에이전트를 위한 '개발 방법론 + 스킬 프레임워크'다. 단순히 코드를 더 빨리 짜게 하는 게 아니라, 무작정 코딩에 뛰어들기 전에 브레인스토밍→스펙 설계→승인 같은 절차를 거치도록 에이전트의 행동 규율 자체를 바꾼다.
      대표 스킬로는 작업 시작 시 관련 스킬을 먼저 찾게 하는 using-superpowers, 구현 전 의도·요구사항을 먼저 정리하는 brainstorming, 독립 작업을 서브에이전트로 나눠 실행하는 subagent-driven-development, TDD·체계적 디버깅 등이 있다. 스킬은 키워드에 따라 자동으로 트리거된다.
      한 도구에 묶이지 않는 것이 강점이다 — README는 Claude Code뿐 아니라 Codex CLI/App, Gemini CLI, OpenCode, Cursor, GitHub Copilot CLI, Factory Droid 등 여러 에이전트에서 같은 스킬을 쓸 수 있다고 밝힌다. 깃허브 스타는 README 기준 22만 개 이상으로 집계되는 고주목 프로젝트다(수치는 주장).
    points:
      - "코드 가속이 아니라 '에이전트 작업 규율'을 바꾸는 방법론 프레임워크 — 코딩 전 브레인스토밍·스펙·승인 절차 강제"
      - "대표 스킬: using-superpowers(스킬 먼저 찾기)·brainstorming·subagent-driven-development·TDD·systematic-debugging, 키워드로 자동 트리거"
      - "Claude Code 전용이 아님 — Codex·Gemini CLI·OpenCode·Cursor·Copilot CLI·Factory Droid 등 다중 하네스 지원(README 주장, 22만★+)"
    source: "https://github.com/obra/superpowers"
  - category: ai
    title: "코딩 에이전트 프롬프트 인젝션 방어 — Claude Code가 실제로 거는 안전장치"
    summary: >
      프롬프트 인젝션은 공격자가 코드·웹페이지·파일에 악성 지시를 숨겨 에이전트의 원래 명령을 가로채는 기법이다. 코딩 에이전트를 실무에 들일 때 "이거 안전한가"가 첫 관문인데, Claude Code 공식 보안 문서는 마법이 아니라 '읽을 수 있는 구체적 안전장치'들로 답한다.
      핵심은 권한 시스템(민감 작업은 명시적 승인)·컨텍스트 인식 분석(전체 요청을 보고 위험 지시 탐지)·입력 새니타이즈다. 특히 curl·wget 같은 네트워크 명령은 기본 자동승인이 안 되고, 웹 fetch는 별도 컨텍스트 창에서 처리해 악성 프롬프트가 본 세션에 섞이지 않게 격리한다.
      그 위에 fail-closed 매칭(매칭 안 된 명령은 기본 수동승인)·명령 인젝션 탐지(이미 허용한 명령도 수상하면 다시 승인)·첫 코드베이스/새 MCP 서버 trust 검증이 더해진다. 단 trust 검증은 -p(헤드리스) 실행 시 비활성화되니 자동화 파이프라인은 그만큼 더 조심해야 한다. 어떤 방어도 100%는 아니므로 신뢰 불가 콘텐츠를 Claude에 직접 파이프하지 말 것을 공식 베스트 프랙티스로 권한다.
    points:
      - "권한 시스템·컨텍스트 인식 분석·입력 새니타이즈가 1차 방어, curl/wget 네트워크 명령은 기본 자동승인 제외"
      - "웹 fetch는 '격리된 컨텍스트 창'에서 처리 — 악성 페이지 지시가 메인 세션에 주입되는 걸 차단"
      - "fail-closed(미매칭 명령 수동승인)·명령 인젝션 탐지·첫 코드베이스/MCP trust 검증. 단 trust 검증은 -p 헤드리스에선 꺼짐"
    source: "https://code.claude.com/docs/en/security"

  - category: ai
    title: "Devin 가격표 다시 읽기 — Free·Pro 20·Max 200달러, 그리고 Windsurf 흡수 흔적"
    summary: >
      Cognition의 자율 코딩 에이전트 Devin은 한때 월 500달러 단일 요금으로 악명 높았지만, 지금 공식 가격표는 4단계로 바뀌었다. Free(0달러)는 가벼운 쿼터로 에이전트를 맛보고, 인라인 편집과 Tab 자동완성은 무제한이다. Pro(월 20달러)는 OpenAI·Claude·Gemini 프런티어 모델 풀 액세스에 Devin Cloud 클라우드 에이전트·동시 세션이 열린다.
      그 위로 Max(월 200달러)와 Teams(기본 80달러 + 시트당 40달러)가 있고, 쿼터는 매일·매주 자동 리필되며 초과분은 API 단가로 과금된다. 실무 판단 포인트: 진입 비용이 20달러로 내려와 "일단 붙여본다"가 쉬워졌지만, 사용량 기반이라 복잡한 작업은 청구액이 튈 수 있다.
      가격표에 'SWE 1.6 모델 무료', 'Tab 자동완성' 같은 항목이 보이는 건 Cognition이 Windsurf 자산을 흡수한 흔적이다. 즉 Devin은 이제 비동기 클라우드 에이전트와 에디터형 자동완성을 한 우산 아래 묶어 판다.
    points:
      - "4단계: Free 0달러 / Pro 20달러 / Max 200달러 / Teams 80달러+시트당 40달러 — 옛 단일 500달러에서 전면 개편"
      - "Pro부터 OpenAI·Claude·Gemini 프런티어 모델 풀 액세스 + Devin Cloud·동시 세션, 쿼터는 매일·매주 자동 리필·초과는 API 단가"
      - "'SWE 1.6 무료'·'Tab 자동완성'은 Windsurf 흡수 흔적 — 사용량 기반이라 복잡 작업은 비용이 튈 수 있음에 유의"
    source: "https://devin.ai/pricing"

  - category: ai
    title: "AGENTS.md — 한 파일로 모든 코딩 에이전트에 같은 규칙을 주는 오픈 표준"
    summary: >
      AGENTS.md는 '에이전트용 README'다. 빌드·테스트 명령, 코드 컨벤션, 보안 주의사항 같은 에이전트 전용 맥락을 사람용 README와 분리해 레포 루트의 한 파일에 모아두면, 도구마다 다른 규칙 파일(CLAUDE.md·.cursorrules 등)을 따로 관리할 필요가 줄어든다. 형식은 그냥 마크다운이라 필수 필드가 없고, 에이전트가 헤딩과 본문을 알아서 읽는다.
      핵심은 '한 번 쓰면 여러 도구가 읽는다'는 점이다. 공식 사이트 기준 Codex(OpenAI)·Cursor·Gemini CLI·Jules(Google)·Devin·Junie(JetBrains)·Aider·goose·opencode·Zed·GitHub Copilot 코딩 에이전트·Windsurf·Kilo Code 등이 지원 목록에 올라 있고, 60k개 넘는 오픈소스 프로젝트가 쓴다고 명시한다.
      모노레포에서는 하위 디렉터리마다 AGENTS.md를 더 둘 수 있고, 편집 중인 파일에 '가장 가까운' 파일이 우선한다. 단 사용자가 채팅으로 직접 내린 지시는 어떤 AGENTS.md보다 우선한다. 표준 운영은 현재 Linux Foundation 산하 Agentic AI Foundation이 맡는다.
    points:
      - "에이전트 전용 규칙(빌드·테스트·컨벤션)을 레포 루트 마크다운 한 파일에 모으는 오픈 표준 — 도구별 규칙 파일 난립을 정리"
      - "Codex·Cursor·Gemini CLI·Devin·Copilot 코딩 에이전트·Aider·Zed 등 다수 지원, 60k+ 오픈소스 프로젝트가 채택(공식 주장)"
      - "모노레포는 가장 가까운 AGENTS.md가 우선, 단 사용자의 채팅 지시가 모든 파일을 덮어씀 — 표준은 Linux Foundation 산하에서 관리"
    source: "https://agents.md/"

  - category: ai
    title: "CodeRabbit — 공개 레포는 무료, PR마다 줄 단위로 달라붙는 AI 리뷰어"
    summary: >
      CodeRabbit은 GitHub·GitLab에 붙어 PR이 열릴 때마다 자동으로 코드 변경을 분석하고, 변경 라인 옆에 인라인 코멘트와 PR 요약을 달아주는 AI 코드 리뷰 도구다.
      가장 큰 미끼는 가격이다. 공식 가격표 기준 '공개 저장소는 영원히 무료(free reviews forever for public repositories)'라서 오픈소스·사이드 프로젝트에 비용 없이 붙일 수 있다.
      유료는 Pro가 연간 결제 시 사용자당 월 24달러, Pro Plus가 48달러이며, 무료 티어도 공개·비공개 저장소 수 제한 없이 PR 요약과 IDE·CLI 리뷰를 제공한다.
      즉 '에이전트가 코드를 짠다'가 아니라 '에이전트가 사람·AI가 짠 코드를 사람 대신 1차로 리뷰한다'는 쪽이라, 작성과 검토를 다른 주체로 분리하고 싶을 때 들어맞는다.
    points:
      - "PR 열릴 때마다 변경 라인 옆에 인라인 코멘트 + PR 요약 자동 생성 (GitHub·GitLab)"
      - "공개 저장소는 영원히 무료 — OSS·개인 프로젝트에 비용 0으로 리뷰 봇 추가(공식 가격표 명시)"
      - "유료 Pro 연 결제 시 월 $24/인, Pro Plus $48/인; 무료 티어도 공개·비공개 무제한 + IDE·CLI 리뷰 포함"
    source: "https://www.coderabbit.ai/pricing"

