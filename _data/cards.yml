- category: ai
  title: Project Solara — Android 기반 MDEP 위에 올라가는 에이전트 우선 디바이스
  summary: Project Solara는 Microsoft가 Build 2026에서 공개한 "agent-first" 프로토타입 디바이스다. 핵심은 새 앱 하나가 아니라, Microsoft Device Ecosystem Platform(MDEP)이라는 Android Open Source Project 기반 OS 계층 위에서 음성·시각·터치 입력을 Copilot 에이전트 경험과 묶는 방향이다. Microsoft는 Solara가 화면 안의 앱을 여는 대신, 주변 맥락을 보고 듣고 이해해 작업을 돕는 디바이스 비전을 보여준다고 설명한다. Android 개발자 관점의 교훈은 명확하다. AI+Android 제품은 Activity나 레이아웃만의 문제가 아니라, OS 신뢰 경계, device management, 입력 센서, 온디바이스/클라우드 에이전트 호출, 사용자 동의 UI를 한 설계로 묶어야 한다.
  points:
  - MDEP는 AOSP 기반 엔터프라이즈 디바이스 플랫폼 — Android 파생 OS 위 에이전트 경험
  - Solara는 음성·시각·터치 입력을 Copilot형 에이전트 UX로 묶는 프로토타입
  - AI+Android 설계 포인트는 앱 화면보다 OS 권한·센서·관리·동의 경계
  source: https://commandline.microsoft.com/project-solara-build-2026/
- category: ai
  title: N-Version Coding Agents — 한 에이전트 정답보다 3개 구현 majority vote
  summary: N-Version Programming with Coding Agents(arXiv 2606.20158)는 고전적인 N-version programming을 최신 코딩 에이전트에 다시 적용한 실험이다. 저자들은 Knight-Leveson Launch Interceptor 명세를 대상으로 에이전트가 만든 48개 구현을 같은 oracle과 1,000,000개 랜덤 입력으로 검사했다. 결과는 양면적이다. 실패가 서로 독립적이지 않아 공통 실패 모드가 여전히 많이 나왔고, 애매한 명세 구간에서 실패가 함께 몰렸다. 그래도 3개 구현을 majority vote로 묶으면 평균 실패 수가 단일 구현 387.44에서 triple 130.99로 줄었고, 11,844개 N-version unit은 관측 실패가 0이었다. 교훈은 "에이전트를 여러 번 돌리면 무조건 안전"이 아니라, 서로 다른 모델·도구·언어로 만든 구현을 독립 oracle과 투표기로 묶어야 redundancy가 의미를 갖는다는 점이다.
  points:
  - 48개 에이전트 생성 구현·공유 oracle·랜덤 입력 1,000,000개로 실패 모드 비교
  - 단일 구현 평균 실패 387.44 → 3-version majority vote 130.99, 하지만 공통 실패 모드는 남음
  - 실무 적용은 같은 프롬프트 재시도보다 diverse implementation + independent oracle + voter
  source: https://arxiv.org/abs/2606.20158
