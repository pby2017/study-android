- category: ai
  title: OpenAI on OCI — 모델 도입은 API 키보다 구매 경로가 막는다
  summary: 'OpenAI와 Oracle은 2026년 6월 10일 Oracle Cloud Infrastructure 고객이 기존 Oracle Universal Credits를 OpenAI 모델과 Codex 접근에 적용할 수 있는 경로를 예고했다. 개발자에게 중요한 교육 포인트는 기술 통합보다 조달·거버넌스다. 기업 AI 에이전트 도입은 "어떤 SDK를 붙일까"보다 기존 클라우드 약정, 승인된 구매 프로세스, 비용 귀속, 보안 심사 안에서 모델과 Codex를 쓸 수 있는지가 먼저 병목이 된다. 자동화 계획에는 코드뿐 아니라 사용량 관측, 예산 주체, 클라우드 계약 경계도 포함해야 한다.

    '
  points:
  - OCI 고객은 적격 Oracle Universal Credits를 OpenAI 모델·Codex에 적용 예정
  - 기존 구매 워크플로와 클라우드 약정 안에서 AI 도입 마찰을 줄이는 전략
  - 에이전트 운영 설계에는 SDK 선택뿐 아니라 조달·예산·거버넌스 경계를 포함
  source: https://openai.com/index/openai-on-oracle-cloud/
- category: ai
  title: Notion Codex 워크플로 — 스펙과 검증 방법을 같이 주면 에이전트가 오래 간다
  summary: 'OpenAI의 2026년 6월 9일 Notion 사례는 코딩 에이전트 운용법을 잘 보여준다. Notion은 모바일에 이미 있던 AI voice input을 웹으로 옮길 때 Codex에 모바일 코드베이스, 웹에서 필요한 모양, 결과 검증 방법을 함께 제공했다. Codex는 모바일 구현을 탐색한 뒤 웹 구현 초안을 만들었고, Notion은 예전이면 2주 걸릴 일을 3~4시간 정도에 끝냈다고 설명했다. 핵심은 "한 줄 지시"가 아니라, 비교할 기존 구현과 성공 판정 루프를 같이 주면 에이전트가 코드베이스 규칙을 따라갈 가능성이 커진다는 점이다.

    '
  points:
  - 기존 모바일 구현 + 웹 요구사항 + 검증 방법을 함께 제공
  - 'Notion 사례: 2주 예상 작업을 3~4시간 수준으로 단축했다고 보고'
  - 에이전트에게는 요청보다 스펙·참조 구현·검증 루프가 중요
  source: https://openai.com/index/notion/
- category: ai
  title: Codex Security — threat model·격리 검증·SARIF export까지 AI 보안 자동화 파이프라인
  summary: OpenAI Codex Security(2026)는 코드베이스별 threat model을 만들고 attack path를 탐색한 뒤, 격리 환경에서 이슈를 검증하고 사람이 리뷰할 패치를 제안한다. Trusted Access for Cyber·GPT-5.5-Cyber처럼 보안 작업 권한을 단계화하며, "AI에게 취약점 찾아줘" 전에 소유권·권한 등급·격리·사람 리뷰를 먼저 정해야 한다. plugin 0.1.9부터는 findings workspace에서 coverage·severity·confidence·evidence를 함께 검토하고 JSON·CSV·SARIF로 export — scan-manifest.json·findings.json·coverage.json 맥락 보존. backlog triage는 scanner·advisory·bug bounty·GitHub/Jira/Linear 결과를 현재 코드와 대조해 confirmed·needs_review·not_actionable verdict·우선순위 큐 생성. Linear/GitHub/Jira issue·private draft GitHub Security Advisory는 승인 전 쓰지 않음. claude-code-security-review(Anthropic PR diff)와 달리 threat model 기반 proactive scan + portable artifact handoff.
  points:
  - Threat model→attack path→격리 검증→패치 제안, Trusted Access for Cyber 권한 등급
  - Findings workspace + SARIF/JSON/CSV export, manifest·coverage 맥락 보존
  - 'Triage/Track: verdict·priority 큐, 티켓·GSA 쓰기는 approval-gated'
  source: https://developers.openai.com/codex/security/plugin/changelog
