- category: ai
  title: OmniCode — bug-fix·test-gen·code-review·style 1794 task·Python/Java/C++
  summary: OmniCode(ACL 2026 Findings·arXiv 2602.02262·seal-research/OmniCode) — SWE-bench가 patch generation에 치우친 공백을 4 category로 메움. 1794 manually validated task — bug fixing·test generation·code review response·style fixing across Python·Java·C++. synthetic augmentation of 494 base GitHub issues — ill-defined problem 제거·data leakage 방지. SWE-Agent DeepSeek-V3.1 — Python bug-fix OK but C++ test-gen 25%·Java style 8%. vs SWE-Atlas(Q&A·refactor) ·FeatureBench(multi-PR feature) — OmniCode=day-to-day SE task diversity not single-issue patch.
  points:
  - 4 categories — patch만 잘하는 agent는 test-gen/style에서 무너짐
  - 3 languages — Java/C++ gap exposes Python-only overfit
  - Containerized env — executable test suite per instance
  source: https://github.com/seal-research/OmniCode
- category: ai
  title: JetBrains Air — multi-agent ADE·Docker/worktree isolation·ACP agent-agnostic
  summary: JetBrains Air(air.dev·2026-03 public preview·macOS+Linux) — Agentic Development Environment, IDE를 대체하지 않고 agent orchestration layer. Codex·Claude Agent·Gemini CLI·Junie concurrent task — Docker container·Git worktree·.air/docker.json·.air/worktree.json pre-config. code-aware task definition(symbol·class·method·commit)·Open In JetBrains IDE side-by-side. ACP+Agent Registry roadmap·cloud execution tech preview. vs Cursor(IDE-first) ·Junie(single agent) ·Conductor(local parallel) — Air=harness-neutral fleet manager with JetBrains code intelligence.
  points:
  - Agent-agnostic — switch/compare Codex vs Claude vs Junie per task
  - Isolation — worktree or Docker per agent, no branch collision
  - IDE complement — Air orchestrates, IntelliJ/Android Studio for hands-on edit
  source: https://blog.jetbrains.com/air/2026/03/air-launches-as-public-preview-a-new-wave-of-dev-tooling-built-on-26-years-of-experience/
- category: ai
  title: Cursor Design Mode 3.7 — browser multi-select·voice queue·Cmd+Shift+D
  summary: Cursor Design Mode(3.0 Apr 2026·3.7 Jun 5 2026) — Agents Window built-in browser에서 UI element click·draw·voice로 agent에 visual context 전달. 3.7 — multi-select 2+ elements(code·layout·visual relationship bundle), voice mic stays on during agent run→queue next edit without waiting. Cmd+Shift+D toggle·Shift+drag area annotate·Option+click add to input. live dev server required — static file edit 불가. vs v0 Design Mode(generate component) ·Figma — Cursor=existing app pixel-level steer agent patch. Composer 2.5 recommended for UI work.
