      - "추론은 강하지만 파일 편집이 약한 모델(예: OpenAI o1)에 특히 유용하다고 공식 문서가 명시(다만 2회 요청이라 더 느리고 비쌀 수 있음)"
      - "모든 변경을 LLM이 쓴 커밋 메시지로 원자적 커밋 → git diff/undo로 AI 작업을 그대로 관리, VS Code·JetBrains·Vim 등 쓰던 에디터와 병행"
    source: "https://aider.chat/docs/usage/modes.html"
  - category: ai
    title: "Context7 — '환각 API'를 막으려 최신 버전별 공식 문서를 에이전트 컨텍스트에 꽂아주는 MCP(57k★)"
    summary: >
      Context7은 Upstash가 만든 MIT 오픈소스로, LLM이 옛 학습 데이터에 기대 '없는 API'나 낡은 코드를 뱉는 문제를
      라이브러리의 최신·버전별 공식 문서를 실시간으로 끌어와 컨텍스트에 넣어 해결한다. GitHub 약 57k★로 MCP 서버
      생태계에서 가장 많이 쓰이는 도구 중 하나다. 쓰는 법은 두 가지 — 코딩 에이전트에 MCP 서버로 등록하거나(예:
      claude mcp add ... npx -y @upstash/context7-mcp), CLI/Skills 모드로 ctx7를 설치해 직접 문서를 조회한다.
      "use context7" 한마디를 프롬프트에 붙이면 에이전트가 해당 라이브러리 문서를 가져와 코드를 생성한다.
    points:
      - "핵심 도구 2개: resolve-library-id(라이브러리 이름→Context7 ID 해석)와 query-docs(그 ID로 버전별 문서 조회)"
      - "MCP 등록은 `npx ctx7 setup` 또는 원격 엔드포인트 https://mcp.context7.com/mcp — Claude Code·Cursor 등 MCP 클라이언트면 다 붙는다"
      - "API 키 없이도 기본 rate limit으로 무료 사용 가능, 무료 키 발급 시 한도 상향 — MCP 서버 코드는 오픈소스지만 크롤링·파싱 백엔드는 비공개"
    source: "https://github.com/upstash/context7"
  - category: ai
    title: "awesome-claude-code-subagents(VoltAgent) — 100여 개 전문 서브에이전트를 통째로 받아 쓰는 카탈로그"
    summary: >
      서브에이전트는 좋은데 매번 직접 작성하기 번거롭다는 문제를 푸는 큐레이션 레포다. backend-architect,
      code-reviewer, security-auditor, devops-engineer 같은 도메인별 서브에이전트 정의(.md 파일)를
      10개 카테고리로 묶어 제공한다. 각 정의는 역할·도구 접근 권한·시스템 프롬프트가 적힌 마크다운 한 장이라,
      `.claude/agents/`에 떨궈 두면 Claude Code가 적절한 상황에 자동 호출하거나 직접 지정해 쓸 수 있다.
      팀이 같은 정의를 공유하면 코드리뷰·아키텍처 같은 반복 작업의 접근 방식을 통일할 수 있다는 게 핵심 효용.
    points:
      - "10개 카테고리(코어 개발, 언어 전문가, 인프라, 품질·보안, 데이터·AI 등)로 분류된 100여 개 서브에이전트 정의"
      - "각 에이전트는 frontmatter(이름·설명·tools 권한)+시스템 프롬프트로 된 마크다운 — 도구 접근을 역할별로 제한 가능"
      - "MIT 라이선스, 21.8k★(주장) — 플러그인/`.claude/agents` 디렉터리에 복사하는 방식으로 즉시 사용"
    source: "https://github.com/VoltAgent/awesome-claude-code-subagents"
  - category: ai
    title: "Jules(Google) — 계획을 먼저 보여주고 VM에서 자율로 도는 GitHub 코딩 에이전트"
    summary: >
      Jules는 구글이 만든 자율 코딩 에이전트로, GitHub에 연동해 클라우드 VM에서 레포를
      클론하고 의존성을 설치한 뒤 파일을 고친다. 작업을 던지면 코드를 건드리기 전에
      '계획(plan)'을 먼저 생성해 사람이 검토·승인하게 하고, 레포 루트의 AGENTS.md를
      자동으로 읽어 코드베이스 규칙을 파악한다. 모델은 무료 등급이 Gemini 2.5 Pro,
      유료 등급은 Gemini 3 Pro 계열을 쓴다.
    points:
      - "등급별 한도(공식): 무료 하루 15작업·동시 3개 / Pro 100작업·동시 15개 / Ultra 300작업·동시 60개"
      - "유료 등급은 별도 구독이 아니라 Google AI Pro/Ultra 플랜에 포함 — 현재 개인 @gmail 계정만"
      - "코드를 바꾸기 전 계획 승인 단계가 있고, private 코드로 학습하지 않으며 VM 안에 격리"
    source: "https://jules.google/docs/usage-limits/"
  - category: ai
    title: "/fork — 서브에이전트와 달리 '대화 전체'를 물려받는 분신 띄우기"
    summary: >
      서브에이전트는 빈 컨텍스트에서 새로 시작하지만, fork(/fork)는 지금까지의 대화 전체
      — 시스템 프롬프트·도구·모델·메시지 히스토리 — 를 그대로 물려받은 분신이다.
      상황을 다시 설명할 필요 없이 곁다리 작업을 던질 수 있고, fork의 도구 호출은
      메인 대화에 안 섞이고 최종 결과만 돌아와 컨텍스트 창은 깨끗하게 유지된다.
      시스템 프롬프트·도구가 부모와 동일해 첫 요청이 부모의 프롬프트 캐시를 재사용하므로,
      같은 맥락이 필요한 작업이면 새 서브에이전트보다 싸다.
    points:
      - "공식 비교: fork=대화 전체+캐시 공유 / 명명된 서브에이전트=새 컨텍스트+별도 캐시"
      - "`/fork <지시>`로 백그라운드 분신 실행 — 끝나면 결과가 메인 대화에 메시지로 도착"
      - "v2.1.117+ 필요(2.1.161부터 기본 활성), CLAUDE_CODE_FORK_SUBAGENT=1로 강제 on/off"
    source: "https://code.claude.com/docs/en/sub-agents"
  - category: ai
    title: "Task Master — PRD를 던지면 '의존성 달린 태스크 목록'으로 쪼개주는 에이전트(MIT+CC)"
    summary: >
      Task Master(eyaltoledano/claude-task-master)는 PRD 문서 하나를 넣으면
      `task-master parse-prd`로 작업을 잘게 나누고, 태스크 사이 의존성·우선순위까지
      정리해 에이전트가 예측 가능하게 일하도록 구조를 잡아주는 태스크 매니저다.
      Cursor·Claude Code·Windsurf·VS Code 등에 MCP로 붙거나 `npm i -g task-master-ai`로
      CLI로 쓸 수 있고, `task-master next`로 다음 할 일을, `list`로 전체를 본다.
      모델은 main·research·fallback 세 역할로 나눠 쓰며, Claude Code나 Codex의
      OAuth를 쓰면 별도 API 키 없이도 돌릴 수 있다.
    points:
      - "PRD→태스크 분해 + 의존성/복잡도 분석이 핵심 — `parse-prd`, `next`, `expand`, `move`"
      - "MCP로 에디터에 직접 붙고(CLI도 지원), 모델 역할을 main/research/fallback로 분리"
      - "라이선스는 MIT + Commons Clause(호스팅 서비스·경쟁 제품화는 제한), 레포 표기 27.5k★ 주장"
    source: "https://github.com/eyaltoledano/claude-task-master"
  - category: ai
    title: "Kilo Code — Cline·Roo Code 계보의 오픈소스 VS Code 코딩 에이전트(MIT·20k★)"
    summary: >
      Kilo Code(Kilo-Org/kilocode)는 VS Code·JetBrains에서 도는 MIT 라이선스
      오픈소스 AI 코딩 에이전트로, 코드 제안만이 아니라 계획·실행·디버깅을 스스로
      도는 '에이전트형'이다. 모드를 Architect(계획)·Coder(구현)·Debugger(디버깅)로
      나눠 쓰고 커스텀 모드도 만들 수 있으며, 타이핑 중 인라인 자동완성과
      MCP 서버 마켓플레이스로 도구를 확장한다. 가격은 "프로바이더 요금과 똑같이
      맞춘 투명 과금"을 내세워 마진을 얹지 않는다고 README가 밝힌다.
    points:
      - "Architect/Coder/Debugger 멀티 모드 + 커스텀 모드, 인라인 자동완성까지 한 확장에"
      - "MCP 서버 마켓플레이스로 에이전트 도구를 끼워 확장 — VS Code·JetBrains 지원"
      - "라이선스 MIT, 레포 표기 약 20k★, '프로바이더 요금 그대로' 투명 과금 표방"
    source: "https://github.com/Kilo-Org/kilocode"
  - category: ai
    title: "Zed — Atom·Tree-sitter 제작진의 에디터, Claude Code·Codex·Gemini를 '패널'에 품다(GPL-3.0·85k★)"
    summary: >
      Zed(zed-industries/zed)는 Atom·Tree-sitter를 만든 팀의 고성능 오픈소스 코드
      에디터(GPL-3.0, 레포 표기 약 85k★)다. 핵심은 자체 AI만 미는 게 아니라
      Agent Client Protocol(ACP)로 외부 코딩 에이전트를 에디터 안 Agent Panel에
      그대로 띄운다는 점 — Claude Code·Codex·OpenCode·Copilot·Cursor·Gemini CLI를
      ACP Registry에서 설치해 쓴다. 외부 에이전트는 별도 프로세스로 돌고
      인증·과금·모델선택·도구를 각자 소유하며, Zed는 스레드만 호스팅한다.
      Zed는 외부 에이전트 사용에 과금하지 않는다고 문서가 명시한다(과금은 에이전트 제공자와 사용자 사이).
    points:
      - "ACP로 Claude Code·Codex·Gemini CLI·Cursor·OpenCode를 에디터 Agent Panel에 통합"
      - "외부 에이전트는 별도 프로세스 — 인증(예: Claude는 /login)·과금·모델을 에이전트가 직접 소유"
      - "Zed가 설정한 MCP 서버를 ACP로 외부 에이전트에 전달 가능, dev: open acp logs로 통신 디버깅"
    source: "https://zed.dev/docs/ai/external-agents"
  - category: ai
    title: "Claude Agent SDK — 'Claude Code를 라이브러리로' 받아 자체 에이전트를 짜는 공식 SDK"
    summary: >
      Claude Agent SDK는 Claude Code를 구동하는 도구·에이전트 루프·컨텍스트 관리를
      Python·TypeScript 라이브러리로 그대로 노출한 Anthropic 공식 SDK다. CLI는 사람이
      타이핑하는 셸이고, 이 SDK는 같은 엔진을 코드에서 query()로 호출하는 형태 —
      `query(prompt=..., options=ClaudeAgentOptions(allowed_tools=["Read","Edit","Bash"]))`
      한 줄로 파일을 읽고 버그를 찾아 고치는 에이전트가 돈다. 핵심은 모델을 직접
      부르는 게 아니라 '에이전트 루프'를 SDK가 대신 돌려준다는 점이다. Anthropic이
      직접 운영하는 Managed Agents(호스티드 REST API)와 달리, Agent SDK는 에이전트
      루프를 내 프로세스 안에서 돌린다고 공식 문서가 구분한다.
    points:
      - "Read·Write·Edit·Bash·Glob·Grep 등 Claude Code 내장 도구와 에이전트 루프를 그대로 제공"
      - "Hooks(PreToolUse·PostToolUse·Stop·SessionStart 등)로 도구 호출을 검증·로깅·차단·변형"
      - "Subagents·MCP·Permissions(allowed_tools)·Sessions(resume/fork)와 .claude/ 설정(스킬·명령·CLAUDE.md) 로드 지원"
    source: "https://code.claude.com/docs/en/agent-sdk/overview"
  - category: ai
    title: "AI 랩이 개발 툴체인을 사들이는 중 — Anthropic→Bun, OpenAI→Astral(uv·ruff)"
    summary: >
      2025년 12월 Anthropic이 첫 인수로 JavaScript 런타임 Bun(MIT)을, 비슷한 시기
      OpenAI가 Python 툴링 회사 Astral(uv·ruff·ty 제작)을 인수한다고 발표했다.
      이유는 같다 — 코딩 에이전트가 곧 회사 매출의 핵심이 됐고(Claude Code는 발표
      당시 연 환산 10억 달러), 에이전트가 코드를 생성·설치·린트·타입체크하는 토대를
      직접 소유해야 빠르고 안정적이기 때문이다. Anthropic은 "Claude Code가 Bun
      실행 파일로 배포된다 — Bun이 깨지면 Claude Code가 깨진다"고 명시했다. 실무
      포인트: 당신이 매일 쓰는 uv·ruff·Bun이 특정 AI 랩의 전략 자산이 됐다는 뜻 —
      양쪽 모두 오픈소스·기존 라이선스 유지를 약속했지만, 로드맵 우선순위가 그 랩의
      에이전트에 맞춰질 수 있음을 감안해 도구 선택을 하라.
    points:
      - "Anthropic→Bun(2025-12, MIT 유지·기존 팀 잔류), OpenAI→Astral(uv·ruff·ty, 오픈소스 지속 지원 약속) — 둘 다 '첫 인수'급 전략 거래"
      - "동기는 수직 통합: 에이전트의 코드 생성→의존성→린트→타입체크 루프를 자사 툴로 닫아 속도·안정성 확보"
      - "오픈소스·permissive 라이선스라 커뮤니티 포크는 언제든 가능 — 단 로드맵이 인수사 에이전트 우선순위로 기울 리스크는 남는다"
    source: "https://www.anthropic.com/news/anthropic-acquires-bun-as-claude-code-reaches-usd1b-milestone"
  - category: ai
    title: "ccpi + tonsofskills.com — 플러그인·스킬·에이전트를 키워드로 검색·설치하는 오픈소스 마켓플레이스 CLI"
    summary: >
      Claude Code 플러그인 생태계가 커지면서, 흩어진 플러그인을 '검색→설치→업데이트'로
      다루는 패키지 매니저식 도구가 등장했다. jeremylongshore의 claude-code-plugins-plus-skills
      레포(MIT)는 ccpi라는 CLI와 tonsofskills.com 호스팅 마켓플레이스를 함께 제공한다.
      ccpi는 `ccpi search devops`로 키워드 검색, `ccpi install <pack>`로 설치,
      `ccpi list --installed`·`ccpi update`로 관리, `ccpi validate ./my-plugin`로 자작 플러그인
      검증까지 한다. 실무 포인트: `/plugin marketplace add`로 GitHub 레포를 마켓플레이스로
      붙이면 Discover 탭에 공식 플러그인과 나란히 뜨므로, 팀 공용 플러그인을 한 소스로 배포·갱신하기 좋다.
    points:
      - "ccpi 설치: `pnpm add -g @intentsolutionsio/ccpi` — search/install/list/update/validate 서브커맨드 제공(MIT)"
      - "마켓플레이스 추가는 Claude Code 내장 명령으로도 가능: `/plugin marketplace add jeremylongshore/claude-code-plugins`"
      - "레포 README 주장 규모(검증 시점 기준): 플러그인 425개·스킬 약 2,800개·에이전트 200개, 별 2.4k★ — 숫자는 갱신될 수 있어 참고치"
    source: "https://github.com/jeremylongshore/claude-code-plugins-plus-skills"
  - category: ai
    title: "BMAD-METHOD — '애자일 팀 전체'를 에이전트로 흉내 내는 IDE 비종속 개발 방법론(49k★)"
    summary: >
      BMAD-METHOD(Breakthrough Method for Agile AI-Driven Development)는 단일 코딩 툴이 아니라
      PM·아키텍트·개발자·UX·QA 등 12종 이상 역할 에이전트를 오케스트레이션하는 방법론 프레임워크다(MIT, 약 49.2k★).
      핵심은 2단계 분업: 먼저 웹 LLM(Gemini Gems·ChatGPT Custom GPT 등)에서 브레인스토밍→제품 브리프→PRD→아키텍처
      문서를 만들고, 그 '폴리시된 산출물'을 IDE로 가져와 구현한다. Scrum Master 에이전트가 이 문서를 잘게 쪼갠
      '개발 스토리'로 바꿔 dev 에이전트에 통째로 넘기는 게 특징이라, 컨텍스트 누락이 줄어든다.
      Claude Code·Cursor·Cline·Roo·Aider 등 에이전트를 가리지 않고 `npx bmad-method install`로 붙는다.
    points:
      - "2단계 워크플로: (1)웹 LLM에서 기획·아키텍처 문서 작성 → (2)IDE에서 구현. Scrum Master가 문서를 '개발 스토리'로 분해해 dev에 전달"
      - "12+ 역할 에이전트(PM·Architect·Developer·UX·QA…)와 여러 페르소나를 한 세션에 모으는 'Party Mode' 제공"
      - "IDE 비종속(Claude Code·Cursor·Cline·Roo·Aider 등) — `npx bmad-method install`로 설치, 라이선스 MIT(공식 레포 bmad-code-org, 약 49.2k★)"
    source: "https://github.com/bmad-code-org/BMAD-METHOD"
  - category: ai
    title: "OpenSpec — Spec Kit보다 가볍게, 코드 짜기 전에 '무엇을 만들지'부터 합의하는 SDD(55k★)"
    summary: >
      OpenSpec은 AI 코딩 에이전트용 명세 주도 개발(SDD) 프레임워크다(MIT, 약 55k★). 이미 다룬 GitHub Spec Kit이
      파이썬 설치·엄격한 단계 게이트의 '무거운' 쪽이라면, OpenSpec은 'fluid not rigid, brownfield not just greenfield'를
      내세워 더 가볍게 자유롭게 반복하도록 설계됐다. 핵심은 변경(change) 단위 워크플로: `/opsx:propose`로 제안·스펙·설계·태스크가
      담긴 변경 폴더를 만들고, `/opsx:apply`로 태스크를 구현하고, `/opsx:archive`로 완료된 변경을 정리하면서 진짜 스펙을 갱신한다.
      Claude Code·Cursor 등 25개 이상 도구와 npm/pnpm/bun/nix로 붙는다(Node 20.19+).
    points:
      - "변경 단위 워크플로 3종: /opsx:propose(제안·스펙·설계·태스크 생성) → /opsx:apply(구현) → /opsx:archive(완료분 정리·스펙 갱신)"
