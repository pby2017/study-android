      - "토대가 먼저: 2022년부터의 Fleet Management 위에 얹음. AST·정규식 기반 자체 변환의 한계(복잡한 다단계 편집)를 Claude Code 기반으로 대체"
      - "효과·주의: 마이그레이션류에서 60~90% 시간 절감(Spotify 블로그). '월 650 PR·Claude Agent SDK'는 Anthropic 고객 사례 출처 — 구분해서 인용"
