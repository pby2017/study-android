      넘어 컨텍스트를 유지한다. 원래 이름은 'Claude-Flow'였으나 Claude 전용이라는 오해를 피하려
      2026년 Ruflo로 리브랜딩했고, npm 패키지·CLI는 하위 호환을 위해 claude-flow 이름을 그대로 둔다.
      다만 84.8% SWE-bench·75% 비용 절감 같은 헤드라인 수치는 독립 감사에서 반박된 적이 있어,
      도입 전 '내 워크로드에서 직접' 재보는 게 안전하다.
    points:
      - "구조: 여왕 에이전트가 계획·분배, 일꾼들이 병렬 실행, 합의 프로토콜(Raft·Byzantine·Gossip)로 조율 — 한 버그 고치는 일엔 과한 헤비급(레포 README 확인)"
      - "리브랜딩: Claude-Flow→Ruflo, 모델도 Claude 전용이 아니라 다중 제공사 라우팅 / npm·CLI는 claude-flow 이름 유지"
      - "주의(주장): 84.8% SWE-bench·75% 비용절감은 마케팅 수치이고 독립 감사가 반박 — 실측 전엔 곧이곧대로 믿지 말 것"
    source: "https://github.com/ruvnet/ruflo"

