  answer: "`disallowed-tools`는 그 스킬을 실행하는 동안 도구를 사용 가능 목록에서 빼며, 다음 사용자 메시지에 해제된다. 여러 스킬과 프롬프트에 계속 적용할 차단은 permission deny로 설정한다. `allowed-tools`는 지정 도구를 호출한 턴 동안 승인 없이 쓰도록 허용할 뿐, 나머지 도구를 제한하지 않으며 기본 권한 규칙도 적용된다."
- category: ai
  level: "중급"
  title: StopFailure 훅 — API 에러로 턴이 끝날 때만 잡아내기
  summary: 'StopFailure는 턴이 API 오류로 끝날 때 Stop 대신 실행된다. 입력의 `error` 값으로 `rate_limit`, `authentication_failed`, `billing_error`, `server_error` 등을 구분해 알림이나 복구 작업을 연결할 수 있다. HTTP 529 과부하는 `server_error`로 분류된다. 이 이벤트는 결정을 제어하지 않으며 출력·종료 코드는 무시된다. 단, 터미널 알림용 `terminalSequence` 출력은 예외다.'
  points:
  - Stop은 응답 완료 시 실행 / API 오류로 종료되면 StopFailure가 대신 실행
  - '`error` matcher 예: rate_limit, authentication_failed, billing_error, server_error; HTTP 529도 server_error'
  - '결정 제어 없음; 출력·종료 코드는 무시되지만 terminalSequence 알림은 지원'
  source: https://code.claude.com/docs/en/hooks
  interview: "API 오류로 Claude Code 턴이 끝날 때 StopFailure 훅은 어떤 역할을 하며, 오류 유형을 어떻게 구분하나요?"
  answer: "Stop 대신 실행되어 로그·알림·복구 작업을 수행한다. 입력의 `error` 값과 matcher로 rate limit, 인증 실패, 결제 오류, 서버 오류 등을 구분한다. 이 이벤트는 턴의 진행 여부를 차단하지 않으며 출력과 종료 코드는 무시된다."
- category: ai
  level: "고급"
  title: 서브에이전트 중첩 — 서브에이전트가 또 서브에이전트를 띄우기
  summary: '서브에이전트는 허용된 경우 하위 서브에이전트를 다시 실행해 리뷰 발견 사항별 검증처럼 계층형 작업을 나눌 수 있다. 기본 깊이는 메인 대화 아래 3단계이며 `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH`로 조정할 수 있다. 깊이 제한에 도달하면 일반 서브에이전트는 Agent 도구를 받지 않는다. 대화형 세션에서는 하위 작업의 중간 내용 대신 최상위 서브에이전트의 요약이 메인 대화에 돌아온다.

    '
  points:
  - 기본은 메인 대화 아래 3단계; `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH`로 조정 가능
  - 깊이 제한에 도달한 일반 서브에이전트에는 Agent 도구를 제공하지 않는다.
  - '하위 작업은 중간 산출물을 격리하고 최상위 서브에이전트가 결과를 요약한다.'
  source: https://code.claude.com/docs/en/sub-agents
  interview: "서브에이전트가 다시 서브에이전트를 실행할 때 기본 깊이 제한은 얼마이며, 제한에 도달하면 어떻게 되나요?"
  answer: "기본 한도는 메인 대화 아래 3단계이며 `CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH`로 변경할 수 있다. 한도에 도달한 일반 서브에이전트에는 Agent 도구가 제공되지 않아 더 위임하지 못한다. 대화형 세션에서는 하위 결과를 최상위 서브에이전트가 요약해 반환한다."
- category: ai
  level: "중급"
