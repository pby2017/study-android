      LangGraph 위 `create_agent`에 네 가지 기본기 — ① 할 일 계획(todo) 도구
      ② 컨텍스트가 격리된 서브에이전트 ③ 읽기·쓰기·편집·검색되는 가상 파일시스템
      ④ 빡빡하게 튜닝된 시스템 프롬프트 — 를 미리 끼워 넣었다.
      `uv add deepagents` 한 줄로 받고, 거기에 컨텍스트 관리·셸·영속 메모리·스킬·MCP를 더 붙일 수 있다.
    points:
