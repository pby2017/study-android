- category: ai
  title: Dagster — 데이터 자산 중심 파이프라인 오케스트레이터, dbt 네이티브·리니지·품질 검증 내장(Apache-2.0)
  summary: 'Dagster는 태스크가 아니라 데이터 자산(테이블·모델·리포트)을 1등 시민으로 다루는 오케스트레이터다. @asset 데코레이터로 파이프라인을 선언적으로 정의하고, 자산 간 의존성·리니지·품질 검증을 내장. dbt와 네이티브 통합(dbt 모델 = Dagster 자산). AI 에이전트 워크플로우에 자연스럽게 적용 가능 (에이전트가 자산 선언을 이해하기 쉬움). Airflow(태스크 중심)·Prefect(플로우 중심) 대비 자산 중심이 차별점. Dagster 1.13: Components + dg CLI GA, Compass AI 어시스턴트.

    '
  points:
  - '자산 중심: @asset 선언적 정의, 리니지·품질 검증 내장'
  - 'dbt 네이티브: dbt 모델 = Dagster 자산, 컬럼 레벨 리니지'
  - 'AI 친화: 에이전트가 자산 선언을 이해하기 쉬운 구조'
  source: https://dagster.io/learn/data-pipeline-orchestration-tools
- category: ai
  title: AutoSchemaKG — 사전 정의 스키마 없이 비정형 텍스트에서 지식 그래프를 자동 구축하는 프레임워크(MIT·~755★)
  summary: 'AutoSchemaKG는 HKUST가 만든 자동 지식 그래프 구축 프레임워크다. 사전 정의 스키마 없이 LLM으로 비정형 텍스트에서 엔티티·이벤트 트리플을 추출하고, 개념화(conceptualization)를 통해 스키마를 자동 유도한다. 서로 다른 도메인의 정보를 시맨틱 브릿지로 연결해 제로샷 크로스 도메인 추론 가능. ATLAS는 Wikipedia·PeS2o·Common Crawl에서 구축한 대규모 지식 그래프 패밀리. RAG 검색 지원.

    '
  points:
  - '스키마 없이: LLM 트리플 추출 + 자동 스키마 유도'
  - '시맨틱 브릿지: 도메인 간 정보 연결, 제로샷 추론'
  - 'ATLAS: Wikipedia·PeS2o·Common Crawl 대규모 KG'
  source: https://github.com/HKUST-KnowComp/AutoSchemaKG
- category: ai
  title: Wan2.2(Alibaba) — MoE 기반 오픈소스 비디오 생성, 5B 밀집+14B MoE 모델·시네마틱 스타일 제어(Apache-2.0·~16k★)
  summary: 'Wan2.2는 Alibaba가 만든 대규모 오픈소스 비디오 생성 모델이다. Mixture-of-Experts(MoE) 아키텍처로 5B 밀집 모델(TI2V-5B)과 14B MoE 모델(T2V-A14B)을 제공. 텍스트→비디오·이미지→비디오를 단일 프레임 워크로 통합. 시네마틱 조명·구도·색감 제어 가능. TI2V-5B는 소비자 GPU(RTX 4090)에서 5초 720P 비디오를 ~9분에 생성. 4×32×32 압축 비율 달성. Diffusers·ComfyUI 호환.

    '
  points:
  - 'MoE: 5B 밀집 + 14B MoE, 텍스트/이미지→비디오 통합'
  - '소비자 GPU: TI2V-5B, RTX 4090에서 720P 생성 가능'
  - '시네마틱 제어: 조명·구도·색감·콘트라스트 라벨'
  source: https://github.com/Wan-Video/Wan2.2
- category: ai
  title: Mochi 1(Genmo) — 10B 파라미터 비디오 생성, 비대칭 확산 트랜스포머로 높은 모션 충실도(Apache-2.0)
  summary: 'Mochi 1은 Genmo가 만든 10B 파라미터 비디오 생성 모델이다. 비대칭 확산 트랜스포머(AsymmDiT) 아키텍처로 처음부터 학습되었으며, 높은 모션 충실도와 강한 프롬프트 준수가 특징. 사실적 스타일에 최적화(애니메이션은 약함). 학습 코드 포함 공개, LoRA 파인튜닝 지원(H100/A100 80GB). Apache-2.0으로 상업 이용 가능. ComfyUI 네이티브 통합. 오픈소스와 상용 비디오 생성의 격차를 크게 좁힘.

    '
  points:
  - '10B AsymmDiT: 높은 모션 충실도 + 프롬프트 준수'
  - '학습 코드 공개: LoRA 파인튜닝, H100/A100 80GB'
  - 'Apache-2.0: 상업 이용 가능, ComfyUI 통합'
  source: https://github.com/genmoai/mochi
- category: ai
  title: vLLM — 프로덕션 LLM 추론의 사실상 표준, PagedAttention으로 GPU 메모리 효율 극대화(Apache-2.0)
  summary: 'vLLM은 2026년 프로덕션 LLM 추론의 사실상 표준 오픈소스 엔진이다. PagedAttention으로 GPU 메모리 낭비를 제거해 같은 하드웨어에서 더 많은 동시 요청 처리. NVIDIA·AMD·Intel·Trainium·TPU 최광범위 하드웨어 지원. OpenAI 호환 API, H100에서 Llama 8B 기준 ~12,500 tok/s. v0.17.1에서 Model Runner V2로 56% 처리량 향상. SGLang(멀티턴·구조화 출력 특화) 대비 범용성·커뮤니티·배포 성숙도가 장점.

    '
  points:
  - 'PagedAttention: GPU 메모리 낭비 제거, 동시 요청↑'
  - '최광범위 HW: NVIDIA·AMD·Intel·Trainium·TPU'
  - '사실상 표준: HuggingFace 공식 추천(TGI 후속)'
  source: https://effloow.com/articles/vllm-production-inference-guide-2026
- category: ai
  title: Docling(IBM) — PDF·DOCX·PPTX를 통합 구조화 문서로 변환, 테이블·수식·OCR 내장(MIT·~62k★)
  summary: 'Docling은 IBM Research가 만든 AI 기반 문서 변환 오픈소스 툴킷이다. PDF·DOCX·PPTX·XLSX·HTML·EPUB· 이메일·이미지·LaTeX 등 다양한 형식을 통합 DoclingDocument 구조로 변환. DocLayNet(레이아웃 분석)+ TableFormer(테이블 인식) AI 모델 내장. Markdown·HTML·JSON·DocTags 등 다양한 출력 형식. LangChain· LlamaIndex·Crew AI·Haystack 플러그인 통합. RAG 파이프라인용 시맨틱 청킹 네이티브 지원.

    '
  points:
  - '다형식: PDF·DOCX·PPTX·이미지·이메일·LaTeX 등 변환'
  - 'AI 내장: DocLayNet(레이아웃) + TableFormer(테이블) 모델'
  - 'RAG 통합: LangChain·LlamaIndex 네이티브, 시맨틱 청킹'
