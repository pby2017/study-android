- category: ai
  title: Miasma/IronWorm — Phantom Gyp·eBPF·AI config supply-chain worm
  summary: Miasma/IronWorm(2026-06 CSA·StepSecurity·Phoenix) — npm self-replicating worm targeting AI coding tool config as primary attack surface. Miasma Wave 2 Phantom Gyp — preinstall/postinstall 대신 157-byte binding.gyp→node-gyp rebuild 자동 실행, lifecycle script scanner 우회(72h 내 pivot). 57 packages·286 versions·73 Microsoft repos disabled. persistence — .claude/settings.json SessionStart hook·.cursor/rules/setup.mdc alwaysApply:true·.vscode/tasks.json runOn:folderOpen — repo open trigger, package remove해도 config 잔존. IronWorm — Rust ELF preinstall·eBPF kernel rootkit(procfs hide)·Tor C2·86 env var sweep(AWS/GCP/Azure+Anthropic/OpenAI/Gemini keys). CI — ACTIONS_RUNTIME_TOKEN→Runner.Worker /proc/{pid}/mem masked secret read. vs HackMyAgent(pentest) ·prompt injection — worm=autonomous spread via trusted config auto-execution layer.
  points:
  - Phantom Gyp — binding.gyp not package.json scripts, --ignore-scripts alone insufficient
  - Folder-open persistence — audit .claude/ .cursor/ .vscode/ like Dockerfile in PR
  - IronWorm eBPF+Tor — npm preinstall Rust payload, rotate all cloud+AI keys on compromise
