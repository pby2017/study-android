  - 'Android SDK: 리소스 ID에 대응하는 Tolgee 키를 사용하고, 번역이 없으면 Android 리소스로 대체'
  - '검수 기준: Sprintf/ICU 포맷 일치, 언어별 복수형, 버튼·화면 길이를 확인'
  source: https://docs.tolgee.io/platform/translation_process/ai_translator
  interview: "Tolgee가 Android의 %1$s placeholder를 내부에서 ICU 형식으로 바꾸면 앱에서도 formatter를 바꿔야 하나요?"
  answer: "가져오기 때 Android printf placeholder를 Tolgee ICU placeholder로 바꿀 수 있고, XML 내보내기 때 원래 형식으로 되돌린다. Android SDK는 기본적으로 Sprintf formatter를 사용한다. 프로젝트에서 ICU 형식을 유지한다면 SDK formatter도 ICU로 맞춘다. 또 resource ID에서 Tolgee 키를 찾으므로 두 쪽의 키 이름이 일치하는지 확인한다."
- category: ai
  title: 'RevenueCat 2026 — AI 앱은 더 벌지만 구독 유지율은 낮다'
  level: "중급"
  summary: 'RevenueCat 표본에서 AI 앱의 첫해 결제자 실현 매출 중앙값은 비AI보다 41% 높았다($30.16 vs. $21.37). 그러나 12개월 구독 유지율은 AI 앱이 월간 6.1%, 연간 21.1%로 비AI 앱(각 9.5%, 30.7%)보다 낮았다. 매출은 결제자당, 유지율은 구독 플랜별 지표이므로 함께 보고 판단한다.'
  points:
  - 'AI 표본 3,519개 설정: iOS 2,633개, Android 886개; 구독 시작 기간은 2024년 7월~2025년 6월'
  - '첫 갱신 전에 반복 사용 이유를 만들고, 월간·연간 플랜별 12개월 유지율을 따로 추적'
  - '벤치마크는 RevenueCat 사용 앱의 관측값이다. 앱별·플랫폼별 결과나 인과효과로 일반화하지 않기'
