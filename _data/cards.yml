  - '15~20% 에너지 회수: 태스크 완료율 <5% 하락'
  - '실시간 감독: 성공 가능성 예측 → 낭비적 추론 조기 종료'
  - 'Brave 검증: SWE-Bench, 코딩 에이전트 실전 테스트'
