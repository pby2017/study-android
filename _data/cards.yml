  - '생성 시점 제약: FSM/grammar로 허용 토큰만 남겨 구조화 출력'
  - '`model(prompt, output_type)` 패턴으로 JSON Schema·regex·CFG를 직접 지정'
  - 'Instructor(후처리 검증+재시도)와 대비되는 generation-time structured generation'
  source: https://github.com/dottxt-ai/outlines
