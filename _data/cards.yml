  title: Codex 경제 리서치 — 에이전트 작업은 '질문 수'보다 위임 시간으로 봐야 한다
  summary: 'OpenAI의 2026년 6월 경제 리서치는 Codex 사용을 단순 채팅 횟수가 아니라 "사람이 했다면 걸렸을 작업 시간"으로 해석한다. 핵심 신호는 짧은 답변보다 장기 위임이다. 2026년 5월 기준 표본 개인 사용자의 80.6%가 30분 초과 작업, 70.2%가 1시간 초과 작업, 25.6%가 8시간 초과 작업으로 추정되는 Codex 요청을 최소 1번 보냈다. OpenAI 내부에서도 Codex는 엔지니어링을 넘어 법무·재무·리크루팅까지 주 도구가 됐고, 2026년 6월 99퍼센타일 활성 사용자는 하루 60시간이 넘는 병렬 에이전트 턴을 만들었다. 단, 작업 시간은 transcript를 본 LLM 판정이고 개인 사용자 0.1% 표본 기반이라 정밀 KPI가 아니라 방향 신호로 읽어야 한다. 실무 교훈은 에이전트 도입 지표를 "프롬프트 몇 번"이 아니라 장기 작업 위임, 병렬 세션, 검증 가능한 산출물로 잡아야 한다는 점이다.

    '
  points:
  - 2026-05 표본 개인 사용자 기준 30분+ 80.6%, 1시간+ 70.2%, 8시간+ 25.6%가 장기 Codex 요청을 최소 1회 보냄
  - OpenAI 내부는 엔지니어링뿐 아니라 법무·재무·리크루팅도 Codex를 주 도구로 사용, 99퍼센타일은 하루 60시간+ 병렬 에이전트 턴
  - 수치는 LLM-as-judge와 0.1% 표본 기반 방향 신호 — 운영 KPI는 위임 시간+검증 산출물+리뷰 통과율로 설계
