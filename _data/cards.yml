  - category: ai
    title: "SWE-bench Multimodal — 스크린샷 보고 'JS UI 버그'를 고치는 능력을 따로 재는 벤치마크"
    summary: >
      SWE-bench Multimodal(SWE-bench M)은 텍스트·파이썬 위주의 원조 SWE-bench를
      "비주얼·사용자 대면 JavaScript 소프트웨어"로 확장한 벤치마크다. 각 과제에는
      문제 설명이나 단위테스트에 이미지(버그 스크린샷·목업·다이어그램 등)가 최소 1장씩 들어 있어,
      에이전트가 화면을 보고 UI 버그를 고치게 만든다. 핵심은 '코드를 짤 줄 안다'와 '화면 문제를 보고
      이해한다'가 별개 능력임을 드러낸다는 것 — 논문은 기존 상위 SWE-bench 시스템들이 여기서 크게
      고전한다고 보고한다. 도구를 고를 때 'Verified 점수'만 보면 시각·다언어 일반화 약점이 가려진다.
    points:
      - "구성: 17개 JavaScript 라이브러리(웹 UI·다이어그램·데이터 시각화·구문 강조·인터랙티브 지도 등)에서 모은 617개 과제, 각 과제마다 문제 설명/테스트에 이미지 최소 1장(논문 abs/2410.03859)"
      - "왜 어려운가: 시각 추론 + 언어 일반화 둘 다 요구. 논문은 '상위 SWE-bench 시스템이 SWE-bench M에서 고전한다'고 명시 — 언어 비종속 설계의 SWE-agent가 12% 해결, 차순위 시스템은 6%에 그쳤다(발표 당시 수치)"
      - "실무 함의: Python 단일 이슈 기준인 Verified와 다른 축을 잰다. 프런트엔드·다언어 코드베이스에 에이전트를 붙일 거면 Verified 점수만으로 판단하지 말 것. 공식 사이트는 paper·GitHub·HuggingFace 데이터셋 링크를 함께 제공"
    source: "https://arxiv.org/abs/2410.03859"
  - category: ai
    title: "컨텍스트 엔지니어링(Anthropic) — '프롬프트를 잘 쓰기'에서 '에이전트가 보는 토큰 전체를 설계하기'로"
    summary: >
      Anthropic이 정리한 컨텍스트 엔지니어링은 한 번의 추론에서 모델이 보는 토큰 전체를
      큐레이션·정렬·가지치기하는 작업이다. 한 메시지를 다듬는 프롬프트 엔지니어링과 달리,
      여러 턴·도구호출·서브에이전트가 누적되는 에이전트에서는 컨텍스트가 한정된 자원이라
      "원하는 결과가 나올 가능성을 극대화하는, 가능한 한 작은 고신호 토큰 집합"을 찾는 게 핵심이다.
      많이 넣는 게 아니라 정확히 넣는 것 — 컨텍스트가 길어질수록 정밀도가 떨어지는 'context rot'가 실재한다.
    points:
      - "Just-in-time 로딩: 데이터를 미리 다 채우지 말고 파일경로·쿼리·링크 같은 가벼운 식별자만 들고 있다가 런타임에 도구로 끌어온다. Claude Code도 head/tail·targeted 쿼리로 큰 데이터를 통째로 안 올리고 다룬다"
      - "긴 작업 3종 도구: ①Compaction(한도 임박 시 대화를 요약해 새 창으로 재시작, 단 과압축은 나중에야 중요해질 맥락을 잃음) ②구조화된 노트테이킹(외부 메모리에 진행상황 기록) ③서브에이전트(각자 깊이 탐색 후 1,000~2,000 토큰 요약만 반환)"
      - "흔한 실패: 도구셋 비대화('사람도 어떤 도구 쓸지 못 정하면 에이전트도 못 정한다'), 시스템 프롬프트 고도(altitude) 오류 — 너무 브리틀한 로직 하드코딩 또는 너무 모호한 지시. 첫 버전의 적정 도구 수는 대개 생각보다 적다"
    source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
  - category: ai
    title: "claude --worktree — 한 레포에서 여러 Claude 세션을 'git 워크트리'로 격리해 동시에 돌리기"
    summary: >
      한 터미널에서 기능을 만들면서 다른 터미널에선 Claude가 버그를 고치게 하되, 편집이 서로 충돌하지 않게 하는 워크플로.
      `claude --worktree <이름>`을 실행하면 각 워크트리가 자기 브랜치를 가진 별도 체크아웃으로 생성되어 한 작업 트리에서 파일이 엉키지 않는다.
      다른 이름으로 같은 명령을 두 번째 터미널에서 돌리면 격리된 병렬 세션이 하나 더 뜬다.
      서브에이전트·백그라운드 세션도 같은 방식으로 격리할 수 있어, 오래 걸리는 작업이 메인 브랜치를 막지 않는다.
    points:
      - "기본 동작: `claude --worktree feature-auth`는 `.claude/worktrees/`에 새 브랜치로 워크트리를 만든다. 이름을 비우면 `bright-running-fox` 같은 이름을 자동 생성. baseRef 설정으로 HEAD에서 분기할지 지정 가능"
      - "PR에서 바로: `claude --worktree \"#1234\"`는 origin에서 `pull/1234/head`를 받아 `.claude/worktrees/pr-1234`에 워크트리를 만든다. 세션 안에서 '워크트리에서 작업해'라고 말하면 EnterWorktree로도 생성됨"
      - ".worktreeinclude로 .env·secrets 같은 gitignore 파일을 워크트리에 복사(수동 `git worktree add` 경로일 때). git이 아니면 WorktreeCreate/WorktreeRemove 훅으로 SVN·Perforce·Mercurial 지원. 수동 정리는 `git worktree remove <경로>`"
    source: "https://code.claude.com/docs/en/worktrees"
  - category: ai
    title: "Context Rot(Chroma 연구) — '컨텍스트만 길어져도' 18개 모델 전부 정확도가 무너진다"
    summary: >
      Chroma가 발표한 독립 벤치마크 연구로, "긴 컨텍스트 윈도우가 곧 안정적인 성능"이라는 가정을 깬다.
      과제 난이도는 그대로 두고 입력 길이만 늘렸을 때, Claude·GPT·Gemini·Qwen 등 18개 모델 모두에서 정확도가 길이가 길어질수록 떨어졌다.
      핵심은 모델이 컨텍스트를 균일하게 처리하지 않는다는 것 — 토큰이 '있다'가 아니라 '어떻게 제시됐는가'가 성능을 가른다.
      그래서 결론은 컨텍스트 윈도우를 키우는 게 아니라, 무엇을 어떻게 넣을지 설계하는 '컨텍스트 엔지니어링'이다.
    points:
      - "확장된 NIAH(바늘 찾기) 실험: 질문과 바늘의 의미 유사도가 낮을수록, distractor(헷갈리는 문장)가 1개만 있어도 성능이 떨어지고 4개면 가중된다. Claude는 환각률이 가장 낮고 불확실하면 답을 보류(abstain)하는 경향, GPT는 환각률이 가장 높았다"
      - "반직관적 결과: 논리적으로 잘 구성된 haystack보다 '섞어서 뒤죽박죽인' haystack에서 18개 모델 전부 더 정확했다. LongMemEval에선 11.3만 토큰 전체를 넣을 때보다 핵심 300토큰만 넣을 때 모든 모델이 훨씬 높은 점수"
      - "주장(연구 수치): 총 194,480회 호출 중 거부는 0.035%로 드물었다. 실제 과제는 이 최소 실험보다 복잡하므로 현업에서의 열화는 더 심할 것이라고 저자는 명시. 코드 전체 오픈소스로 재현 가능"
    source: "https://www.trychroma.com/research/context-rot"
