  - category: ai
    title: "CodeRabbit 'AI vs 사람 코드' 리포트 — AI가 쓴 코드는 PR당 이슈가 1.7배 더 많다"
    summary: >
      코드리뷰 플랫폼 CodeRabbit이 2025년 12월, 실제 PR 470개를 AI 작성과 사람 작성으로 갈라
      어떤 결함이 얼마나 더 나오는지 정량 비교한 리포트를 냈다. 결론은 'AI가 더 빠르지만 더 많은 이슈를 남긴다' —
      AI 작성 PR은 사람 작성 대비 PR당 이슈가 약 1.7배 많았고, 특히 한 PR에 결함이 몰린 '고이슈 아웃라이어'가
      AI 쪽에서 더 흔해 리뷰 부담이 한쪽으로 쏠렸다(주장). 실무 시사점은 명확하다:
      AI 코드를 막연히 믿지 말고 '모든 PR에 자동 코드리뷰를 품질 게이트로' 걸고,
      에이전트에게 아키텍처 제약·코딩 표준·설정 패턴 같은 컨텍스트를 더 주면 AI가 자주 내는 실수 유형이 줄어든다는 것.
    points:
      - "표본: 실제 PR 470개를 AI 작성 vs 사람 작성으로 분류해 비교 — 추측이 아니라 머지된 변경에서 잡힌 이슈 기반(CodeRabbit 자체 데이터·주장)"
      - "핵심 수치: AI 작성 PR이 사람 대비 이슈 약 1.7배. '결함이 몰린 PR'이 AI 쪽에서 더 흔해 리뷰 워크로드가 한쪽으로 쏠림(주장)"
      - "권고: ①모든 PR에 AI 코드리뷰를 품질 게이트로 상시 적용 ②에이전트에 아키텍처 제약·코딩 표준·설정 패턴 컨텍스트를 주입해 빈발 실수 줄이기. 단, CodeRabbit이 코드리뷰 벤더라는 이해관계는 감안할 것"
    source: "https://www.coderabbit.ai/blog"
  - category: ai
    title: "security-guidance 플러그인 — Claude가 짠 코드의 취약점을 같은 세션에서 잡아 고치게 하기"
    summary: >
      Anthropic 공식 마켓플레이스 플러그인으로, Claude Code가 코드를 짜는 동안 자기 변경을 스스로 보안 검토해
      인젝션·안전하지 않은 역직렬화·DOM 주입 같은 취약점을 PR에 도달하기 전에 같은 세션에서 고치게 한다.
      검토는 깊이가 다른 3단계로 돈다 — ①파일 편집마다 모델 호출 없는 정규식 패턴 매치(비용 0),
      ②턴이 끝날 때 그 턴의 git diff를 백그라운드에서 별도 Claude가 보안 관점으로 리뷰,
      ③Claude가 git commit·push를 할 때 주변 코드(호출부·새니타이저)까지 읽는 더 깊은 에이전틱 리뷰.
      핵심은 코드를 짠 같은 인스턴스가 자기를 채점하지 않는다는 점 — 리뷰는 새 컨텍스트의 독립 Claude 호출이다.
      `/plugin install security-guidance@claude-plugins-official`로 깐다.
    points:
      - "독립 리뷰어: 짠 Claude가 자기 채점 안 함. 턴 끝·커밋 리뷰는 diff에서 출발하는 별도 Claude 호출(신선한 컨텍스트, '문제만 찾으라'는 보안 프롬프트). 모델 기본값은 Claude Opus 4.7(SECURITY_REVIEW_MODEL·SG_AGENTIC_MODEL로 교체)"
      - "막지는 않음(공식 명시): 어느 단계도 쓰기·커밋을 차단하지 않는다. 발견은 '지시'로 Claude에 전달돼 대화 안에서 고쳐지고, 리뷰 모델은 놓칠 수 있음 → 방어선의 한 겹일 뿐, 완전한 보안책 아님. 한도: 턴당 변경 30파일·연속 3회, 커밋 리뷰 시간당 20회"
      - "본인 셸 커밋은 제외: Bash 도구로 Claude가 한 commit·push만 리뷰됨(`!` 셸 이스케이프·직접 셸 커밋은 안 봄). 전부 훅(SessionStart·UserPromptSubmit·Stop·PostToolUse)으로 구현 — 소스가 '훅에서 별도 모델 호출' 예제. PR엔 Code Review, CI엔 기존 스캐너로 단계 분담"
    source: "https://code.claude.com/docs/en/security-guidance"
  - category: ai
    title: "Tabby(TabbyML) — 코드를 남의 클라우드에 안 보내는 self-hosted 코딩 어시스턴트(~33.6k★)"
    summary: >
      Tabby는 GitHub Copilot의 오픈소스·자체호스팅 대안을 표방하는 코딩 어시스턴트다.
      Rust로 짠 단일 바이너리(또는 Docker)로 돌고, 외부 DBMS나 클라우드 서비스 없이
      내 하드웨어·사내 인프라에서 완결되게 동작하는 게 핵심 — 규제·IP·에어갭 환경에서
      코드를 외부로 내보내지 않고 인라인 자동완성과 채팅을 쓰려는 5~50인 팀이 주 타깃이다.
      VS Code·JetBrains·Vim/Neovim·Eclipse 확장을 제공하고, 라이선스는 코어가 Apache-2.0(오픈코어:
      enterprise용 ee/ 디렉터리는 별도 라이선스)이다. (별 수는 GitHub 기준 대략치)
    points:
      - "왜 쓰나: '내 코드를 남의 클라우드에 안 보낸다'가 전부. 단일 바이너리/Docker로 띄우고, 외부 DBMS·클라우드 불필요(공식 README 'no need for external DBMS or cloud services'). NVIDIA(CUDA)·Apple M칩(Metal) 등 컨슈머 GPU로도 구동"
      - "기능 3종: ① 코드 자동완성(컨텍스트 인지 실시간 제안) ② Answer Engine(IDE 안에서 질문에 답) ③ 인라인 채팅. 빌트인 admin 패널로 사용자·토큰 관리, /admin에서 API 토큰 발급해 확장이 엔드포인트로 인증"
      - "위치: 셀프호스트 진영의 '턴키 팀 솔루션'으로 분류(vs Continue+Ollama 조립형, Void Editor IDE형). Claude Code 같은 자율 에이전트가 아니라 Copilot류 보조 도구 — '코드 유출 못 하는 환경'에서 에이전트 도구의 빈자리를 메운다"
    source: "https://github.com/TabbyML/tabby"
  - category: ai
    title: "Continue(continuedev) — IDE 확장에서 'cn' CLI로 무게중심을 옮긴 오픈소스 코딩 에이전트(~33.7k★)"
    summary: >
      Continue는 "pioneering open-source coding agent"를 표방하는 Apache-2.0 프로젝트로,
      이제 CLI·VS Code 확장·JetBrains 플러그인 세 갈래로 제공된다. 특히 2026년 들어
      터미널 CLI('cn')에 무게가 실렸는데, 대화형 TUI 모드와 스크립트로 돌리는 헤드리스 모드를
      함께 갖춰 로컬 개발과 CI 자동화 양쪽에 쓰게 했다. 모델을 안 가리는 게 핵심 — 어떤 LLM이든
      붙일 수 있고 Ollama 같은 로컬 모델로 코드를 외부에 안 보내고도 돌릴 수 있다.
    points:
      - "세 갈래 배포: CLI('cn')·VS Code 확장·JetBrains 플러그인(공식 README 'available as CLI, VS Code extension, and JetBrains plugin'). 라이선스 Apache-2.0(© 2023-2026 Continue Dev, Inc.), GitHub 별 약 33.7k(대략치)"
      - "CLI 두 모드: 사람이 터미널에서 대화하는 TUI 모드와, 출력만 받아 파이프라인에 꽂는 헤드리스 모드. 같은 에이전트를 로컬 손작업과 CI 무인 실행 양쪽에 재사용 — Claude Code의 headless(`-p`)와 같은 발상"
      - "모델 안 가림(open architecture): 100+ LLM 연결, 로컬 Ollama로 코드 유출 없이 구동 가능. 자체 모델·라우팅을 쥐려는 팀, JetBrains 사용자, 프라이버시·예산 제약 팀에 자주 추천되는 자리"
    source: "https://github.com/continuedev/continue"
  - category: ai
    title: "AGENTS.md 실전 — 'README for agents'를 모노레포에 어떻게 까는가(중첩·우선순위 규칙)"
    summary: >
      AGENTS.md는 "코딩 에이전트를 안내하는 단순·개방 포맷"으로, 공식 사이트가
      "a README for agents"라 부른다. README와 분리해 사람용 문서는 짧게 두고, 빌드·테스트·컨벤션
      같은 에이전트용 상세 지침을 에이전트가 확실히 찾는 곳에 둔다는 발상이다. 필수 필드는 없고
      "그냥 표준 Markdown"이라, 핵심은 양식이 아니라 '어디에 두느냐'다. 공식 사이트 기준
      Codex·Jules·Cursor·Gemini CLI·Copilot 등 다수 도구가 지원하고 6만+ 오픈소스 프로젝트가 쓴다고 명시한다.
    points:
      - "중첩이 핵심: 패키지마다 AGENTS.md를 따로 두면 에이전트는 '편집 중인 파일에서 가장 가까운 파일'을 자동으로 읽는다 — 모노레포는 서브프로젝트별 맞춤 지침을 각자 싣는 게 정석(예시로 사이트는 'OpenAI 메인 레포에 88개 AGENTS.md'라 명시)"
      - "우선순위 규칙(충돌 시): 편집 파일에 가장 가까운 AGENTS.md가 이긴다. 단 '사용자 채팅 프롬프트가 모든 것을 덮는다(override everything)' — 즉 직접 지시 > 가까운 파일 > 먼 파일"
      - "테스트 자동 실행: 거기 적힌 테스트 명령을 에이전트가 알아서 돌리고 '작업 끝내기 전에 관련 프로그래매틱 체크를 실행해 실패를 고치려 시도'한다. AAIF(리눅스재단) 거버넌스로 이관돼 CLAUDE.md와도 사실상 호환되는 공용 표준 위치"
    source: "https://agents.md"
  - category: ai
    title: "SWE-bench Multimodal — 스크린샷 보고 'JS UI 버그'를 고치는 능력을 따로 재는 벤치마크"
    summary: >
      SWE-bench Multimodal(SWE-bench M)은 텍스트·파이썬 위주의 원조 SWE-bench를
      "비주얼·사용자 대면 JavaScript 소프트웨어"로 확장한 벤치마크다. 각 과제에는
      문제 설명이나 단위테스트에 이미지(버그 스크린샷·목업·다이어그램 등)가 최소 1장씩 들어 있어,
      에이전트가 화면을 보고 UI 버그를 고치게 만든다. 핵심은 '코드를 짤 줄 안다'와 '화면 문제를 보고
      이해한다'가 별개 능력임을 드러낸다는 것 — 논문은 기존 상위 SWE-bench 시스템들이 여기서 크게
      고전한다고 보고한다. 도구를 고를 때 'Verified 점수'만 보면 시각·다언어 일반화 약점이 가려진다.
    points:
      - "구성: 17개 JavaScript 라이브러리(웹 UI·다이어그램·데이터 시각화·구문 강조·인터랙티브 지도 등)에서 모은 617개 과제, 각 과제마다 문제 설명/테스트에 이미지 최소 1장(논문 abs/2410.03859)"
      - "왜 어려운가: 시각 추론 + 언어 일반화 둘 다 요구. 논문은 '상위 SWE-bench 시스템이 SWE-bench M에서 고전한다'고 명시 — 언어 비종속 설계의 SWE-agent가 12% 해결, 차순위 시스템은 6%에 그쳤다(발표 당시 수치)"
      - "실무 함의: Python 단일 이슈 기준인 Verified와 다른 축을 잰다. 프런트엔드·다언어 코드베이스에 에이전트를 붙일 거면 Verified 점수만으로 판단하지 말 것. 공식 사이트는 paper·GitHub·HuggingFace 데이터셋 링크를 함께 제공"
    source: "https://arxiv.org/abs/2410.03859"
  - category: ai
    title: "컨텍스트 엔지니어링(Anthropic) — '프롬프트를 잘 쓰기'에서 '에이전트가 보는 토큰 전체를 설계하기'로"
    summary: >
      Anthropic이 정리한 컨텍스트 엔지니어링은 한 번의 추론에서 모델이 보는 토큰 전체를
      큐레이션·정렬·가지치기하는 작업이다. 한 메시지를 다듬는 프롬프트 엔지니어링과 달리,
      여러 턴·도구호출·서브에이전트가 누적되는 에이전트에서는 컨텍스트가 한정된 자원이라
      "원하는 결과가 나올 가능성을 극대화하는, 가능한 한 작은 고신호 토큰 집합"을 찾는 게 핵심이다.
      많이 넣는 게 아니라 정확히 넣는 것 — 컨텍스트가 길어질수록 정밀도가 떨어지는 'context rot'가 실재한다.
    points:
      - "Just-in-time 로딩: 데이터를 미리 다 채우지 말고 파일경로·쿼리·링크 같은 가벼운 식별자만 들고 있다가 런타임에 도구로 끌어온다. Claude Code도 head/tail·targeted 쿼리로 큰 데이터를 통째로 안 올리고 다룬다"
      - "긴 작업 3종 도구: ①Compaction(한도 임박 시 대화를 요약해 새 창으로 재시작, 단 과압축은 나중에야 중요해질 맥락을 잃음) ②구조화된 노트테이킹(외부 메모리에 진행상황 기록) ③서브에이전트(각자 깊이 탐색 후 1,000~2,000 토큰 요약만 반환)"
      - "흔한 실패: 도구셋 비대화('사람도 어떤 도구 쓸지 못 정하면 에이전트도 못 정한다'), 시스템 프롬프트 고도(altitude) 오류 — 너무 브리틀한 로직 하드코딩 또는 너무 모호한 지시. 첫 버전의 적정 도구 수는 대개 생각보다 적다"
    source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
  - category: ai
    title: "claude --worktree — 한 레포에서 여러 Claude 세션을 'git 워크트리'로 격리해 동시에 돌리기"
    summary: >
      한 터미널에서 기능을 만들면서 다른 터미널에선 Claude가 버그를 고치게 하되, 편집이 서로 충돌하지 않게 하는 워크플로.
      `claude --worktree <이름>`을 실행하면 각 워크트리가 자기 브랜치를 가진 별도 체크아웃으로 생성되어 한 작업 트리에서 파일이 엉키지 않는다.
      다른 이름으로 같은 명령을 두 번째 터미널에서 돌리면 격리된 병렬 세션이 하나 더 뜬다.
      서브에이전트·백그라운드 세션도 같은 방식으로 격리할 수 있어, 오래 걸리는 작업이 메인 브랜치를 막지 않는다.
    points:
      - "기본 동작: `claude --worktree feature-auth`는 `.claude/worktrees/`에 새 브랜치로 워크트리를 만든다. 이름을 비우면 `bright-running-fox` 같은 이름을 자동 생성. baseRef 설정으로 HEAD에서 분기할지 지정 가능"
      - "PR에서 바로: `claude --worktree \"#1234\"`는 origin에서 `pull/1234/head`를 받아 `.claude/worktrees/pr-1234`에 워크트리를 만든다. 세션 안에서 '워크트리에서 작업해'라고 말하면 EnterWorktree로도 생성됨"
      - ".worktreeinclude로 .env·secrets 같은 gitignore 파일을 워크트리에 복사(수동 `git worktree add` 경로일 때). git이 아니면 WorktreeCreate/WorktreeRemove 훅으로 SVN·Perforce·Mercurial 지원. 수동 정리는 `git worktree remove <경로>`"
    source: "https://code.claude.com/docs/en/worktrees"
  - category: ai
    title: "Context Rot(Chroma 연구) — '컨텍스트만 길어져도' 18개 모델 전부 정확도가 무너진다"
    summary: >
      Chroma가 발표한 독립 벤치마크 연구로, "긴 컨텍스트 윈도우가 곧 안정적인 성능"이라는 가정을 깬다.
      과제 난이도는 그대로 두고 입력 길이만 늘렸을 때, Claude·GPT·Gemini·Qwen 등 18개 모델 모두에서 정확도가 길이가 길어질수록 떨어졌다.
      핵심은 모델이 컨텍스트를 균일하게 처리하지 않는다는 것 — 토큰이 '있다'가 아니라 '어떻게 제시됐는가'가 성능을 가른다.
      그래서 결론은 컨텍스트 윈도우를 키우는 게 아니라, 무엇을 어떻게 넣을지 설계하는 '컨텍스트 엔지니어링'이다.
    points:
      - "확장된 NIAH(바늘 찾기) 실험: 질문과 바늘의 의미 유사도가 낮을수록, distractor(헷갈리는 문장)가 1개만 있어도 성능이 떨어지고 4개면 가중된다. Claude는 환각률이 가장 낮고 불확실하면 답을 보류(abstain)하는 경향, GPT는 환각률이 가장 높았다"
      - "반직관적 결과: 논리적으로 잘 구성된 haystack보다 '섞어서 뒤죽박죽인' haystack에서 18개 모델 전부 더 정확했다. LongMemEval에선 11.3만 토큰 전체를 넣을 때보다 핵심 300토큰만 넣을 때 모든 모델이 훨씬 높은 점수"
      - "주장(연구 수치): 총 194,480회 호출 중 거부는 0.035%로 드물었다. 실제 과제는 이 최소 실험보다 복잡하므로 현업에서의 열화는 더 심할 것이라고 저자는 명시. 코드 전체 오픈소스로 재현 가능"
    source: "https://www.trychroma.com/research/context-rot"
  - category: ai
    title: "claude-code-workflows(OneRedOak) — 디자인을 '눈으로' 자동 리뷰시키는 Playwright 기반 워크플로(3.8k★)"
    summary: >
      OneRedOak/claude-code-workflows는 Claude Code용 워크플로 모음을 공유하는 MIT 라이선스 레포다(별 약 3.8k·포크 약 567).
      핵심은 'design-review' 워크플로 — Claude Code가 Playwright MCP로 실제 브라우저를 띄워 변경된 UI를
      직접 클릭·스크린샷하며 디자인 일관성·접근성·반응형을 검토하게 만든다.
      텍스트 diff만 읽고 "괜찮아 보인다"고 말하는 코드 리뷰의 사각지대(렌더링 결과)를 사람 대신 에이전트가 눈으로 메우는 패턴이다.
    points:
      - "구성: 슬래시 커맨드 + 서브에이전트 + 룰 파일을 묶은 워크플로 3종(대표가 design-review). Playwright MCP를 통해 페이지를 띄우고 상호작용·스크린샷을 찍어 시각적으로 검증한다"
      - "쓰임새: PR이나 작업 브랜치의 UI 변경을 머지 전에 에이전트가 라이브 브라우저로 점검 — 정적 diff로는 못 잡는 레이아웃 깨짐·대비·반응형 문제를 잡는 게 목적"
      - "별 수·포크 수는 현재 기준 주장이며 변동한다. 본인 프로젝트의 디자인 가이드에 맞춰 룰을 고쳐 쓰는 출발점으로 의도된 레퍼런스 모음"
    source: "https://github.com/OneRedOak/claude-code-workflows"
  - category: ai
    title: "goose(Block→AAIF) — Rust로 짠 모델 비종속 오픈소스 에이전트, 데스크톱·CLI·API로 다 쓴다(49.5k★)"
    summary: >
      goose는 Block이 만들어 공개한 Apache-2.0 오픈소스 AI 에이전트로, 깃허브 별이 약 49.5k다.
      레포 태그라인은 "코드 제안을 넘어 — 어떤 LLM으로든 설치·실행·편집·테스트하는 확장 가능한 오픈소스 에이전트"로,
      코드 한 줄 추천이 아니라 명령 실행·파일 편집·테스트까지 직접 하는 범용 에이전트를 표방한다.
      Rust(약 64%)로 작성됐고 데스크톱 앱(맥·리눅스·윈도)·CLI·임베더블 API 세 형태로 제공되며,
      MCP로 70여 개 확장을 물리고 Anthropic·OpenAI·구글·Ollama·Bedrock 등 15개 이상 모델 공급자를 갈아끼울 수 있다.
      최근 레포는 block/goose에서 리눅스재단 산하 Agentic AI Foundation(AAIF·aaif-goose/goose)으로 이관됐다.
