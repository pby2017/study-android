  - 'Custom Agent 빌더: System Instructions·Tasks·Tools로 반복 작업용 맞춤 에이전트 설계'
  - '모델 비종속: openai·ollama·anthropic·openrouter (LiteLLM provider/model_name 형식)'
  source: https://github.com/potpie-ai/potpie
- category: ai
  title: 'Rawdog: CLI 요청에 답하려 파이썬 스크립트를 즉석 생성·자동 실행하고 그 출력을 맥락에 넣어 스스로 재호출하는 어시스턴트'
