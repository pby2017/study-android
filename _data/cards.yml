- category: ai
  title: AAHP v3 — sequential agent handoff·MANIFEST.json·98% token cut
  summary: AAHP AI-to-AI Handoff Protocol(homeofe/AAHP·v3) — file-based sequential context transfer between coding agents replacing verbose chat history. outgoing agent writes MANIFEST.json(checksum·task dependency graph·NEXT_ACTIONS.md) + HANDOFF.lock single-writer gate — receiving agent reads MANIFEST first canonical gate. empirical dev session — AAHP v3 consumed 2% tokens vs unmediated native agent teams(98% reduction). v3 adds stable task IDs·machine-readable dependency graph for parallel task selection. vs Multi-Agent Handoff Integration Testing(seam assert pattern) ·MCP Handoff SEP(proposed) ·Memory Bank(single-agent) — AAHP=git-native sequential handoff file protocol.
