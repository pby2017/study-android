      - "구성: 모델 라우팅(40+ 공급사)·Agent·그래프형 Workflow·human-in-the-loop·RAG/메모리·MCP 서버·evals/옵저버빌리티"
      - "라이선스: 코어 Apache-2.0, 'ee/' 코드만 엔터프라이즈(개발·테스트 무료·프로덕션 유료)"
