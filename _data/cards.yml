  summary: 'Apple AFM 3(2026, Google 협력 5-model family)은 on-device AFM 3 Core(3B dense)·AFM 3 Core Advanced(20B sparse·1-4B active·multimodal)와 Private Cloud Compute model(32K ctx·reasoning)로 구성. Foundation Models framework(Swift): LanguageModelSession·tool calling·guided generation·stateful sessions. iOS 26.4+ token counting·context size inspection API, guardrail false positive 개선(iOS 27). PrivateCloudComputeLanguageModel + reasoningLevel(deep reasoning). Core AI(WWDC26)와 LanguageModel protocol 연동 — custom on-device model을 system session infra에 plug. Core AI card와 complement: FM framework=Apple Intelligence API, Core AI=bring-your-own-model inference.'
  points:
  - 'AFM 3 Core Advanced: 20B sparse, M5+ silicon, voice·dictation·multimodal on-device'
  - 'Private Cloud Compute: 32K ctx reasoning model, reasoningLevel on contextOptions'
  - 'Developer: Foundation Models framework(Swift) + Core AI custom model via LanguageModel protocol'
  source: https://developer.apple.com/videos/play/wwdc2026/241/
- category: ai
  title: RAGAS — RAG 파이프라인을 faithfulness·context precision으로 자동 평가하는 프레임워크
  summary: RAGAS(Retrieval Augmented Generation Assessment)는 ground truth 없이 RAG 품질을 측정하는 오픈소스 평가 프레임워크다. retriever(검색)와 generator(생성)를 분리·통합 평가하며, faithfulness·answer relevancy·context precision·context recall 등 LLM-as-judge 메트릭을 제공한다. LangChain·LlamaIndex와 통합되고, ragas quickstart rag_eval CLI로 프로젝트 템플릿을 생성해 @experiment 데코레이터로 CI 친화적 eval 루프를 만든다. DeepEval(Pytest 스타일)과 상호보완 — RAGAS는 RAG 특화, DeepEval은 범용 LLM 품질 게이트.
  points:
  - '핵심 메트릭: faithfulness(환각)·answer relevancy·context precision/recall — retriever vs generator 병목 분리'
  - ragas quickstart rag_eval -o ./my-project → evals.py·CSV 실험 추적·LangChain/LlamaIndex 통합
  - reference-free 평가로 golden set 없이도 반복 개선 루프 가능 — 프로덕션 RAG 필수 도구
  source: https://docs.ragas.io/en/stable/
- category: ai
  title: Anthropic Computer Use — 스크린샷·마우스·키보드로 데스크톱을 조작하는 API 도구(베타)
  summary: 'Claude Computer Use는 API 베타 기능으로, 에이전트가 스크린샷 캡처·마우스 이동·키보드 입력으로 데스크투를 자동화한다. Claude가 tool_use를 반환하면 애플리케이션이 VM/컨테이너에서 실행하고 tool_result를 돌려주는 agent loop 구조다. computer_20251124 타입 + anthropic-beta: computer-use-2025-11-24 헤더. Opus 4.8·Sonnet 4.6 등 지원. Cowork/Claude Code(데스크톱 제품)와 구분 — API는 빌더가 샌드박스·allowlist·human-in-the-loop·max_iterations를 직접 설계해야 한다.'
  points:
  - 'API 계약: Claude→tool_use→앱이 VM에서 실행→tool_result→루프. Claude가 직접 실행하지 않음'
  - '프로덕션: Docker/VM 격리·도메인 allowlist·max_iterations·민감 작업 human checkpoint 필수'
  - Cowork(맥/윈도 데스크톱 위임) vs API(자체 제품 임베드) — 실행 주체가 다름
  source: https://platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool
- category: ai
  title: LlamaIndex vs LangChain — 2026년 RAG·에이전트 하이브리드 스택 선택 가이드
  summary: '2026년 LlamaIndex와 LangChain은 각각 RAG·에이전트 플랫폼으로 수렴했지만 강점이 다르다. LlamaIndex는 문서 ingestion·청킹·하이브리드 검색·LlamaParse에 특화 — retrieval 품질·토큰 효율(~33%↓) 우위. LangChain+LangGraph는 상태 머신·체크포인팅·human-in-the-loop·멀티에이전트 오케스트레이션 표준. 시니어 패턴: LlamaIndex=데이터 레이어, LangGraph=실행 레이어, LangSmith=옵저버빌리티 — 단일 프레임워크 고집보다 하이브리드가 프로덕션 정답.'
  points:
  - 'LlamaIndex: 대량 PDF·엔터프라이즈 문서·복잡 retrieval(재귀·sub-question) → 데이터 레이어'
  - 'LangGraph: 분기·상태·승인 게이트·장기 에이전트 → 실행 레이어'
  - '하이브리드: QueryEngine을 LangGraph 노드에 넣어 retrieval+orchestration 분리'
  source: https://axiomlogica.com/ai-ml/langchain-vs-llamaindex-production-rag-2026
- category: ai
  title: Meticulous — 테스트 코드 없이 실제 세션을 녹화·재생하는 AI 프론트엔드 E2E 테스트
  summary: Meticulous는 JS recorder snippet으로 staging/preview에서 사용자 세션을 캡처하고, PR마다 동일 interaction을 결정론적으로 재생해 visual regression을 잡는 AI 테스트 플랫form이다. 네트워크 응답을 mock/replay해 flaky·데이터 의존성을 제거하고, Chromium 레벨 deterministic scheduling으로 flake-free를 목표한다. QA Wolf(Playwright 코드 생성)와 달리 "테스트를 쓰지 않는" 세션 리플레이 접근 — 버그 재현·UI regression에 특화.
  points:
  - recorder snippet → PR 시 relevant 세션 subset 재생 → 스크린샷 diff를 PR 코멘트로
  - 네트워크 mock/replay로 백엔드 side-effect 없이 프론트엔드 격리 테스트
  - 'CI: meticulous.yaml + static assets/Docker/Vercel preview URL 중 선택 — 120초 내 1000+ 화면'
  source: https://www.meticulous.ai/
- category: ai
  title: Modal vs Baseten vs Replicate — GPU 추론·파인튜닝 플랫폼 2026 선택 가이드
  summary: '2026년 AI 모델 서빙 플랫폼은 추상화 수준이 다르다. Replicate(Cloudflare): 5만+ 커뮤니티 모델·Cog 패키징·per-GPU-second 과금 — 프로토타입·이미지/비디오 모델에 최적, H100 $5.49/hr. Modal: Python decorator 서버less·per-second 과금·배치/파인튜닝/멀티스텝 파이프라인 — bursty·고볼륨에 유리, H100 ~$3.95/hr. Baseten: Truss+TensorRT-LLM/SGLang/vLLM·SOC2/HIPAA·per-minute dedicated — steady high-throughput 엔터프라이즈, H100 $6.50/hr.'
  points:
  - 'Replicate: 모델 마켓플레이스·빠른 API·Cog push — 프로토타입·생성 AI'
  - 'Modal: @app.function GPU decorator·scale-to-zero·파인튜닝 job — Python 네이티브 파이프라인'
  - 'Baseten: Truss 엔진 선택·엔터프라이즈 SLA·token-priced Model API — 프로덕션 steady inference'
  source: https://hostfleet.net/serverless-gpu-pricing-matrix-2026/
- category: ai
  title: Arize Phoenix — OTel 기반 오픈소스 LLM 트레이싱·평가·프롬프트 관리(ELv2·~10k★)
  summary: Phoenix는 Arize AI의 오픈소스 LLM 옵저버빌리티 플랫폼으로, OpenInference+OpenTelemetry로 prompt·retrieval·tool call·output 전 과정을 트레이스한다. 로컬·셀프호스팅(Single container·SQLite/Postgres)에 특화 — Langfuse(MIT)와 달리 Elastic License 2.0. phoenix-evals로 RAG relevance·answer relevance 등 LLM-as-judge 평가, 2026년 prompt management까지 확장. 상용 Arize AX와 별개 제품 — Phoenix→AX는 업그레이드가 아니라 마이그레이션.
  points:
  - OpenInference OTel 표준 — LangChain·LlamaIndex·에이전트 tool call 전 과정 시각화
  - 'phoenix-evals + @experiment: traced data 위에서 regression eval, prompt 버전 A/B'
  - Langfuse(MIT·프로덕션) vs Phoenix(ELv2·로컬 디버깅·노트북) — 용도가 다름
  source: https://github.com/Arize-ai/phoenix
- category: ai
  title: Unstructured.io — 64+ 파일형식을 RAG-ready JSON으로 변환하는 엔터프라이즈 ETL
  summary: Unstructured는 PDF·DOCX·PPTX·HTML·이메일 등 64+ 형식을 canonical JSON(Header·Table·NarrativeText 등 20+ element)으로 변환하는 GenAI 데이터 플랫폼이다. Auto/Fast/High Res/VLM 4종 partitioning 전략, By Title semantic chunking, 30+ connector·1,250+ pipeline으로 vector DB·data lake에 적재. Docling(IBM)·LlamaParse와 경쟁 — Unstructured는 엔터프라이즈 connector·거overnance·no-code UI+API 양쪽 제공. DIY 파싱 파이프라인 대신 표준 JSON+metadata로 RAG retrieval latency·품질을 안정화.
  points:
  - 'Auto partitioning: PDF 페이지별 Fast/VLM/High Res 자동 라우팅 — 품질·비용 최적'
  - 'canonical JSON: Header·Table·Image 등 typed element + lineage metadata → chunking·filter'
  - 30+ connector·vector store 적재 — DIY 파싱 rat's nest 대체
  source: https://docs.unstructured.io/pipelines/overview
- category: ai
  title: Lovable — React+Supabase 풀스택을 자연어로 생성하는 AI 앱 빌더
  summary: Lovable(구 GPT Engineer)는 자연어로 React·TypeScript·Tailwind·Supabase 풀스택 웹앱을 생성하는 AI 플랫폼이다. Agent Mode(자율)·Chat Mode(반복)·Visual Edits(UI 직접 수정), GitHub sync로 코드 소유권 확보. bolt.new(WebContainers 풀스택)·v0(Vercel UI 컴포넌트)와 비교 — Lovable은 Supabase BaaS 통합·비개발자 MVP에 특화. 2026년 BOLA·RLS 미설정 이슈가 보고됐으므로 프로덕션 배포 전 credential rotation·row-level security 필수.
  points:
  - React+TS+Vite+Tailwind+Supabase — GitHub sync로 코드 portability
  - bolt.new=브라우저 풀스택·v0=UI 컴포넌트·Lovable=Supabase BaaS MVP
  - '보안: legacy public project BOLA 이슈 — RLS·credential audit 필수(2026)'
  source: https://docs.lovable.dev/introduction/welcome
- category: ai
  title: Claude Community Marketplace — 분산형 플러그인 생태계와 /plugin marketplace add
  summary: 'Claude Code 플러그인은 단일 스토어가 아니라 marketplace.json 레지스트리를 가진 GitHub repo 분산 구조다. 공식: claude-plugins-official(자동 제공)·anthropics/claude-plugins-community(수동 add·자동 검증). 커뮤니티: claudemarketplaces.com·SkillsMP(120만+ skill)·ccpi 등 — /plugin marketplace add owner/repo로 구독. marketplace.json→plugin.json→skills/agents/hooks/MCP 번들. 팀은 자체 marketplace repo로 내부 플러그인 배포 가능.'
  points:
  - /plugin marketplace add owner/repo → /plugin install name@marketplace — Git·URL·로컬 경로 지원
  - '공식 vs community: community는 Anthropic 자동 검증+commit SHA pin, 그래도 출처 검증 필수'
  - SkillsMP·claudemarketplaces.com — 21k+ skill·2.5k+ marketplace 큐레이션(2026-06)
  source: https://code.claude.com/docs/en/discover-plugins
- category: ai
  title: Braintrust — eval-first LLM 앱 개발·CI 게이트·프롬프트 Playground 통합 플랫폼
  summary: Braintrust는 LLM 앱을 "먼저 eval하고 ship"하는 eval-first 플랫form이다. Playground에서 prompt·model·tool 변형을 A/B하고, dataset+scorer로 CI/CD 품질 게이트를 걸며, production trace를 dataset으로 환류(feedback loop)한다. LangSmith(프레임워크 종속)·RAGAS(RAG 특화)와 달리 범용 LLM+에이전트 eval·regression·human review 큐를 한 UI에 통합. Loop(2026)로 에이전트 eval 자동화 확장.
  points:
  - 'eval-first: prompt/model 변경마다 dataset+scorer로 regression gate — ship 전 품질 보장'
  - production log→dataset 환류 — 실패 케이스가 다음 eval에 자동 반영
  - LangSmith=LangChain 생태계·RAGAS=RAG·Braintrust=범용 eval CI·Playground
  source: https://www.braintrust.dev/docs
- category: ai
  title: Claude Tag — Slack에서 @Claude를 팀원처럼 호출하는 협업 에이전트
  summary: Claude Tag는 Claude를 Slack 채널에 초대해 팀 대화, 선택한 도구, 데이터, 코드베이스 맥락 위에서 작업을 위임하는 Anthropic의 팀 협업 기능이다. 채널 멤버가 `@Claude`를 태그하면 Claude가 PR 작성·머지, 데이터 분석, 장애 원인 조사 같은 일을 맡고, 채널 기록을 따라가며 매번 배경 설명을 다시 요구하지 않도록 컨텍스트를 쌓는다. ambient behavior를 켜면 조용해진 스레드나 관련 정보를 먼저 짚어 주는 더 능동적인 패턴도 가능하다. 개발자 교훈은 "코딩 에이전트는 IDE 안 개인 도구"에서 "팀 채널의 공유 작업자"로 이동 중이라는 점이다. 단, 채널·도구 접근권한을 어디까지 줄지와 사람이 승인해야 할 작업 경계를 먼저 설계해야 한다.
  points:
  - Slack 채널에서 `@Claude` 호출 → 선택한 채널·도구·데이터·코드베이스 맥락으로 작업 위임
  - PR 작성·머지, 데이터 분석, 장애 조사처럼 팀 대화와 코드 작업을 잇는 협업형 에이전트
  - '운영 포인트: 채널 접근권한·도구 권한·승인 게이트를 설계해야 팀 맥락이 과노출되지 않는다'
  source: https://www.anthropic.com/news/introducing-claude-tag
- category: ai
  title: Copilot enterprise-managed plugins — VS Code까지 내려오는 조직 표준 에이전트 배포
  summary: GitHub Copilot의 enterprise-managed plugins는 기업 관리자가 플러그인 마켓플레이스, 자동 설치 플러그인, hooks, MCP 설정을 한 번 정의해 Copilot CLI와 VS Code 사용자에게 같이 배포하는 기능이다. VS Code 1.122부터 Copilot CLI에서 시작한 enterprise-managed capability를 지원하며, 설정 파일은 `.github-private/.github/copilot/settings.json` 위치에 둔다. 플러그인은 custom agents와 skills를 자동 설치해 온보딩을 줄이고, 항상 켜야 하는 hook·MCP 구성을 조직 표준으로 밀어 넣을 수 있다. 교훈은 AI 도구 도입이 개인 설정 싸움에서 끝나지 않고, 보안·리뷰·도메인 지식을 중앙 정책으로 배포하는 플랫폼 운영 문제가 된다는 점이다.
  points:
  - '`.github-private/.github/copilot/settings.json`으로 marketplace·자동 설치·hook·MCP 표준을 정의'
  - Copilot Business/Enterprise 사용자의 Copilot CLI와 VS Code가 같은 조직 플러그인 정책을 적용
  - custom agents·skills를 자동 배포해 온보딩을 줄이고 리뷰·보안 기준을 도구 안에 고정
  source: https://github.blog/changelog/2026-06-05-enterprise-managed-plugins-in-vs-code-in-public-preview/
- category: ai
  title: AI-native engineering team — 코딩 에이전트는 SDLC 전체의 첫 패스가 된다
  summary: 'OpenAI의 AI-native engineering guide는 코딩 에이전트를 "코드 생성기"가 아니라 계획·설계·빌드·테스트·리뷰·문서·운영을 가로지르는 SDLC 첫 패스 실행자로 본다. 에이전트는 스펙을 코드베이스에 대조해 모호함과 의존성을 찾고, 디자인을 컴포넌트로 옮기며, 구현·테스트·문서 초안을 만들고, 로그·배포 이력·코드를 연결해 운영 원인 분석을 돕는다. 하지만 최종 소유권은 여전히 엔지니어에게 있다. 실무 적용은 큰 조직 개편보다 작은 워크플로부터 시작한다: 이슈 dedupe, 설계 초안, red-first 테스트, PR baseline review, 릴리스 노트처럼 검증 가능한 반복 작업을 에이전트에 맡기고 사람이 방향·품질·승인을 닫는다.'
  points:
  - 에이전트 역할이 자동완성에서 계획·설계·빌드·테스트·리뷰·문서·운영 첫 패스로 확장
  - 테스트·스캐너·MCP·로그 도구를 직접 실행해야 정적 제안이 아니라 검증 가능한 결과가 된다
  - 사람은 아키텍처·제품 의도·최종 품질을 소유하고, 에이전트는 반복 가능한 하위 워크플로부터 맡긴다
  source: https://developers.openai.com/codex/guides/build-ai-native-engineering-team
- category: ai
  title: Cody(Sourcegraph) — 코드베이스 검색 API로 @-mention 멀티레포 컨텍스트를 IDE에 끼워 넣는 AI 어시스턴트
  summary: Sourcegraph Cody는 VS Code·JetBrains·Visual Studio·웹에서 동작하는 AI 코딩 어시스턴트다. 핵심 차별점은 Sourcegraph Search API — 로컬·원격 코드베이스 전체에서 API·심볼·사용 패턴을 검색해 @-mention으로 채팅·자동완성·Smart Apply에 끼워 넣는다. Enterprise는 멀티레포 컨텍스트, Context Filters로 특정 레포 제외, LLM 선택·프롬프트 라이브러리·MCP 지원. Auto-edit은 커서 이동·타이핑을 분석해 맥락 수정 제안. Amp(에이전트)와 달리 '코드 이해·검색'에 특화.
  points:
  - Sourcegraph Search API — @-mention으로 파일·심볼·원격 레포 컨텍스트 주입
  - Chat·Autocomplete·Smart Apply·Auto-edit·프롬프트 라이브러리·MCP
  - 'Enterprise: 멀티레포·Context Filters·온프레미스 추론(Ollama) — Amp와 역할 분리'
  source: https://sourcegraph.com/docs/cody
- category: ai
  title: Sweep AI — GitHub 이슈·Jira 티켓을 'Sweep:' 라벨만으로 PR까지 자동 생성하는 AI 주니어 개발자
  summary: 'Sweep AI는 GitHub App + JetBrains 플러그인으로 동작하는 AI 코딩 어시스턴트(Y Combinator). 핵심 워크플로: 이슈에 ''Sweep'' 라벨 또는 제목 ''Sweep:'' 접두 → 코드베이스 읽기 → 변경 계획 → PR 생성 → CI 자동 수정·머지 충돌 해결. 주니어 개발자에게 일을 맡기듯 버그·소규모 기능·리팩터링을 자연어로 설명하면 된다. JetBrains 쪽은 에이전트 모드·무제한 autocomplete·Privacy Mode. Copilot 코딩 에이전트·SWE-agent와 달리 GitHub-native 이슈→PR 파이프라인에 특화.'
  points:
  - 'GitHub App: ''Sweep'' 라벨·''Sweep:'' 접두 → 코드베이스 분석 → PR 자동 생성'
  - CI 자동 수정·머지 충돌 해결 PR — PR 코멘트로 피드백 반복
  - 'JetBrains 플러그인: 에이전트 모드·autocomplete·Privacy Mode — GitHub-native 자동 PR'
  source: https://docs.sweep.dev/
- category: ai
  title: Tabnine Enterprise — VPC·온프rem·air-gapped에서 전 스택(모델·Context Engine·거버넌스)을 로컬 실행
  summary: 'Tabnine Enterprise는 코드·프롬프트·텔레메트리가 기본적으로 환경 밖으로 나가지 않는 셀프호스팅 AI 코딩 플랫폼이다. 2026년 GA: 모델 추론·Context Engine(조직 지식 그래프)·거버넌스·정책 평가·오케스트레이션이 전부 고객 trust boundary 안에서 동작. VPC(AWS/GCP/Azure)·온프rem Kubernetes·완전 air-gapped 배포. Tabby(자동완성 서버)와 달리 Context Engine·코딩 에이전트·MCP·SSO·SOC2/ISO27001까지 엔터프라이즈 풀스택.'
  points:
  - 로컬 퍼스트 — 추론·인덱싱·정책 평가·검색 전부 trust boundary 내부, air-gapped 지원
  - Context Engine = 아키텍처 결정·코딩 표준·의존성 정책·인시던트 이력 조직 지식 그래프
  - Tabby(자동완성)와 차별 — 에이전트·MCP·SSO·컴플라이언스 풀스택
  source: https://docs.tabnine.com/main/welcome/readme/tabnine-subscription-plans/enterprise-private-installation
- category: ai
  title: Temporal + AI — 크래시·rate limit에도 에이전트 상태가 살아남는 durable execution 오케스트레이션
  summary: LLM 에이전트를 프로덕션에 올리면 rate limit·서버 크래시·장시간 대기에서 상태가 유실된다. Temporal은 Workflow(결정적 오케스트레이션)·Activity(비결정적 LLM·도구 호출·자동 재시도)·Signal/Query(외부·휴먼 인터랙션)로 durable execution을 제공한다. OpenAI Agents SDK·Google ADK와 공식 통합. Nexus로 팀 간 에이전트 서비스 호출, workflow.patched()로 버전 마이그레이션. CrewAI·LangGraph와 달리 '에이전트 프레임워크'가 아니라 '에이전트가 돌아가는 인프라 레이어'.
  points:
  - Workflow = 오케스트레이션·상태, Activity = LLM·도구(자동 재시도·Event History)
  - Signal/Query = 휴먼 인더 루프, Nexus = 팀 간 버전드 에이전트 서비스 호출
  - OpenAI Agents SDK·ADK 통합 — 프레임워크가 아닌 durable execution 인프라
  source: https://temporal.io/blog/from-agent-zoo-to-agent-orchestra-temporal-agentic-control-plane
- category: ai
  title: ChromaDB — pip install 한 줄로 시작하는 임베디드 벡터 DB, dev→server→Cloud 동일 API
  summary: 'Chroma는 AI-native 오픈소스 임베딩 DB(Apache-2.0·16k★+)로, RAG 프로토타입의 사실상 기본 선택지다. 핵심 API 4개(add/query/update/delete), 자동 임베딩·메타데이터 필터·LangChain/LlamaIndex 통합. 배포 3패턴: Embedded(PersistentClient·로컬 폴더)·Server(HttpClient·Docker)·Chroma Cloud(관리형). 2026년 hybrid retrieval(벡터+BM25+sparse), collection forking, object storage tiering 추가. ''벡터 DB 선택 2026'' 비교 카드와 달리 ''로컬 임베디드→프로덕션'' 마이그레이션 경로에 특화.'
  points:
  - Embedded(PersistentClient) → Server(HttpClient) → Cloud — 동일 API, 스레드-safe·프로세스-safe 주의
  - 자동 임베딩·메타데이터 필터·LangChain/LlamaIndex 1급 통합
  - '2026: hybrid retrieval·collection forking·object storage tiering'
  source: https://cookbook.chromadb.dev/running/deployment-patterns/
- category: ai
  title: Milvus 3.0 — External Collection·Snapshot으로 벡터 DB를 데이터 레이크와 zero-copy 통합(Zilliz Lakebase)
  summary: Milvus 3.0-beta(2026-05)는 벡터 DB를 Zilliz Vector Lakebase의 코어 커널로 확장한다. External Collection = Parquet·Iceberg·Lance 파일을 복사 없이 zero-copy 참조, Milvus는 스키마·인덱스·쿼리만 관리. Snapshot = MVCC 격리 read-only 뷰로 배치 분석·A/B 평가. EmbList+DiskANN(변长 벡터·ColBERT), nullable vector(온라인 컬럼 추가), MinHash dedup, Storage V3(manifest 기반 columnar). Qdrant·Pinecone 비교 카드와 달리 '레이크-native·대규모 배치+서빙 통합'에 특화.
  points:
  - External Collection — Parquet/Iceberg/Lance zero-copy, Refresh로 동기화
  - Snapshot — MVCC read-only 뷰, 라이브 Collection 쓰기와 병행
  - EmbList+DiskANN·nullable vector·MinHash·Storage V3 — Zilliz Lakebase 코어
  source: https://milvus.io/docs/release_notes.md
