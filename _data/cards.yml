  title: Sim 3만★ — AI 워크플로 초안과 배포본은 별개다
  summary: 'Sim(simstudioai/sim)은 채팅·비주얼 빌더·API로 AI 에이전트 워크플로를 만들고 API·채팅·MCP로 배포하는 Apache-2.0 오픈소스다. GitHub API 기준 2026-11-22에 30,174★·3,917 forks를 기록했고, 저장소는 같은 날 갱신됐다. 운영 시 핵심은 초안과 배포본의 분리다. 편집기에서 바꾼 내용은 실행 중인 배포에 자동 반영되지 않으므로, 초안을 시험한 뒤 새 버전을 배포해야 호출자가 변경을 사용한다.'
