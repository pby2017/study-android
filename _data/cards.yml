  summary: '2026년 LLM observability 3대 선택지. Langfuse(MIT·~2.3k org) — OTel 기반 self-host, prompt management·eval·cost tracking, EU on-prem·데이터 주권. LangSmith(LangChain) — managed SaaS, OpenAI·Anthropic·CrewAI·Pydantic AI 등 80+ 프레임워크·@traceable 계측, SmithDB+Polly+Insights Agent로 nested agent trace·failure cluster, online eval·PagerDuty. Arize Phoenix(ELv2·~10k★) — OpenInference OTel, single container·SQLite/Postgres 로컬 셀프호스팅, phoenix-evals RAG relevance·@experiment regression, RAG/embedding drift 특화 — Langfuse(프로덕션 SaaS/self-host) vs LangSmith(enterprise eval loop) vs Phoenix(로컬 디버깅·노트북). OpenLLMetry(instrumentation SDK)와 spec(GenAI semconv) 분리. 하이브리드: Phoenix(trace)+Langfuse(prompt)+DeepEval(CI) 조합 흔함.'
