- category: ai
  title: Anthropic Computer Use — 스크린샷·마우스·키보드로 데스크톱을 조작하는 API 도구(베타)
  summary: 'Claude Computer Use는 API 베타 기능으로, 에이전트가 스크린샷 캡처·마우스 이동·키보드 입력으로 데스크투를 자동화한다. Claude가 tool_use를 반환하면 애플리케이션이 VM/컨테이너에서 실행하고 tool_result를 돌려주는 agent loop 구조다. computer_20251124 타입 + anthropic-beta: computer-use-2025-11-24 헤더. Opus 4.8·Sonnet 4.6 등 지원. Cowork/Claude Code(데스크톱 제품)와 구분 — API는 빌더가 샌드박스·allowlist·human-in-the-loop·max_iterations를 직접 설계해야 한다.'
  points:
  - 'API 계약: Claude→tool_use→앱이 VM에서 실행→tool_result→루프. Claude가 직접 실행하지 않음'
  - '프로덕션: Docker/VM 격리·도메인 allowlist·max_iterations·민감 작업 human checkpoint 필수'
