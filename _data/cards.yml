  title: 프롬프트 캐싱 2026 — Anthropic 90% 할인·OpenAI 자동 50%·Gemini 명시적 캐시, API 비용 70~90% 절감
  summary: '프롬프트 캐싱은 2026년 LLM API 비용 절감의 가장 높은 ROI 수단이다. 반복되는 프롬프트 프리픽스 (시스템 프롬프트·도구 정의·참조 문서)를 저장해 할인 적용. Anthropic: cache_control 마커 명시, 읽기 90% 할인, 쓰기 1.25x(5분)/2x(1시간) 서차지. OpenAI: 1,024+ 토큰 자동 캐싱, 50% 할인, 마커 불필요. Gemini: 명시적 캐시 객체 생성, 시간당 스토리지 요금. 핵심: 정적 콘텐츠를 프롬프트 맨 앞에 배치.

    '
  points:
  - 'Anthropic: 90% 할인, cache_control 마커 명시'
  - 'OpenAI: 자동 캐싱, 50% 할인, 설정 불필요'
  - '핵심 규칙: 정적 콘텐츠 프롬프트 맨 앞 배치'
  source: https://leanlm.ai/blog/prompt-caching
