cards:
- category: kotlin
  title: 코틀린이란 — 정적 타입 + 함수형
  summary: '코틀린은 JVM에서 도는 언어로, 자바와의 상호운용성을 중시한다. 핵심은 ''정적 타입 지정''이라 컴파일 시점에 타입이 확정돼 성능·신뢰성·유지보수·도구지원이 좋아진다. 동시에 타입 추론을 제공해 코드는 짧게 유지된다. 함수를 변수처럼 다루는 일급 함수, 불변성, 부수효과 없는 순수 함수 같은 함수형 개념도 지원한다. 자바엔 없는 nullable 타입과 함수 타입이 컴파일 단계에서 NPE 위험을 잡아준다.

    '
  points:
  - 정적 타입 + 타입 추론 = 안전하면서 간결
  - nullable 타입(?)으로 NPE를 컴파일 시점에 차단
  - 일급 함수·불변성·순수 함수 = 함수형 지원
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/1장-코틀린이란_무엇이며_왜_필요한가.md
- category: kotlin
  title: 문(statement)과 식(expression)
  summary: '자바는 if/제어구조가 값을 만들지 않는 ''문''이지만, 코틀린은 루프를 뺀 대부분의 제어구조가 값을 만드는 ''식''이다. 그래서 `return if(cond) A else B`가 가능하다. 함수도 두 종류 — 중괄호로 감싼 ''블록 본문 함수''와 등호로 잇는 ''식 본문 함수''. 식 본문 함수는 타입 추론 덕에 반환형을 생략할 수 있다(블록 본문은 불가). 이 차이가 코틀린 특유의 간결함의 출발점이다.

    '
  points:
  - 코틀린의 if/when은 값을 반환하는 '식'
  - 식 본문 함수 `fun f() = 1` 은 반환형 생략 가능
  - 변수도 타입 추론으로 생략 가능
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/2장-코틀린_기초.md
- category: kotlin
  title: 컬렉션 생성 함수 — setOf/hashSetOf/arrayListOf
  summary: '코틀린은 컬렉션을 만드는 팩토리 함수를 제공한다. setOf·hashSetOf는 내부적으로 LinkedHashSet, arrayListOf는 ArrayList를 돌려준다. 코틀린은 자체 컬렉션을 새로 만들지 않고 자바 표준 컬렉션을 그대로 활용하면서, 정렬·필터 같은 유용한 확장 함수를 얹는 방식이다. `.plus()` 같은 연산은 원본을 바꾸지 않고 새 컬렉션을 반환한다(불변성 지향).

    '
  points:
  - 코틀린 컬렉션 = 자바 컬렉션 + 확장 함수
  - .plus()는 원본 불변, 새 컬렉션 반환
  - 제네릭 원소 모임 + 알고리즘 메서드 제공
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/3장-함수_정의와_호출.md
- category: kotlin
  title: 클래스·인터페이스 — 자바와 무엇이 다른가
  summary: '코틀린 인터페이스는 자바 8의 default 메서드처럼 구현이 있는 메서드를 가질 수 있지만, 상태(필드)는 가질 수 없다. 자바의 extends/implements는 모두 콜론(:)으로 대체되고, 확장 클래스 뒤엔 괄호()를 붙인다. 인터페이스 구현은 개수 제한이 없지만 클래스 확장은 1번만 가능하다. 자바의 @Override는 코틀린에서 `override` 변경자가 된다. 본문 없는 멤버는 추상, default는 키워드 없이 본문만 주면 된다.

    '
  points:
  - 인터페이스에 구현은 OK, 상태(필드)는 불가
  - extends/implements → 콜론(:) 하나로 통일
  - '@Override → override 변경자'
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/4장-클래스,_객체,_인터페이스.md
- category: kotlin
  title: 람다 — 코드 블록을 인자로 넘기기
  summary: '람다는 다른 함수에 넘길 수 있는 작은 코드 조각이다. 자바 8처럼 코드 블록을 함수 인자로 직접 전달할 수 있어, 안드로이드의 setOnClickListener 같은 ''메서드 하나뿐인 익명 객체''를 람다로 대체해 코드를 확 줄인다. 컬렉션에선 maxBy처럼 기준을 람다로 받는 라이브러리 함수가 있어 `list.maxBy { it.age }` 식으로 짧게 쓴다. 멤버 참조(Person::age)로 더 줄일 수도 있다.

    '
  points:
  - 익명 객체 → 람다로 보일러플레이트 제거
  - list.maxBy { it.age } 처럼 기준을 람다로
  - 멤버 참조(::)로 한 번 더 축약
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/5장-람다로_프로그래밍.md
- category: kotlin
  title: '널 가능성 — ?. 와 ?: 로 NPE 방어'
  summary: '코틀린 타입 시스템은 널 가능 여부를 타입에 담아 NPE를 컴파일 시점에 잡는다. 타입 뒤에 ?를 붙이면 null을 담을 수 있는 타입이 된다. 안전한 호출 `?.`는 null 검사와 호출을 한 번에 — `a?.length`는 a가 null이면 그대로 null을 반환한다(결과 타입도 nullable). 엘비스 연산자 `?:`는 null일 때 기본값을 지정한다. 이 조합이 코틀린이 자바보다 NPE에 강한 핵심 이유다.

    '
  points:
  - 타입 뒤 ? = 널 가능 타입
  - ?. = null이면 호출 건너뛰고 null 반환
  - '?: = null일 때 기본값 제공(엘비스)'
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/6장-코틀린_타입_시스템.md
- category: android
  title: 액티비티 생명주기
  summary: '액티비티는 보통 한 화면을 대표하며 AppCompatActivity를 상속한다. 생명주기 콜백은 쌍으로 관리한다 — onCreate↔onDestroy, onStart↔onStop. onCreate(초기화·뷰 생성), onStart(아직 비표시, 센서·통신 시작), onResume(표시·화면 갱신), onPause(포커스 상실·리소스 해제·저장), onStop(통신 정지), onDestroy(참조 정리). 다른 클래스가 액티비티 인스턴스를 참조하면 폐기 후에도 메모리에 남아 누수가 생긴다.

    '
  points:
  - 콜백은 쌍으로 — onCreate↔onDestroy, onStart↔onStop
  - onPause에서 저장·리소스 해제
  - 외부 참조가 남으면 메모리 누수
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_02(액티비티와프래그먼트).md
- category: android
  title: 화면 회전과 상태 복원 — onSaveInstanceState
  summary: '화면 가로/세로 전환 같은 디바이스 설정 변경이 일어나면 기존 액티비티는 폐기되고 새로 생성된다. 그래서 입력값 등이 사라진다. onSaveInstanceState/onRestoreInstanceState 콜백으로 데이터를 저장·복구할 수 있다. 저장 가능한 자료형은 기본형·문자열·리스트, 그리고 Parcelable을 구현한 인스턴스다. 시스템 임시 영역에 IPC로 주고받기 때문에 전달 규약이 필요하고, 그게 Parcelable 인터페이스다. 단, 뒤로가기로 명시적으로 폐기하면 호출되지 않는다.

    '
  points:
  - 설정 변경 = 액티비티 재생성 → 상태 유실
  - onSaveInstanceState로 저장, Parcelable로 전달
  - 뒤로가기 폐기 시엔 호출 안 됨
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_02(액티비티와프래그먼트).md
- category: android
  title: 레이아웃 선택 — Linear vs Constraint
  summary: 'LinearLayout은 depth가 얕고 순차적으로 뷰를 나열할 때, 단순한 화면에 적합하다. 복잡한 화면엔 RelativeLayout/ConstraintLayout을 쓴다. 사진 주변에 여러 뷰를 배치하는 상황은 예전엔 RelativeLayout이었지만 요즘은 ConstraintLayout이 표준 — 깊어지기 쉬운 계층을 1단계로 평탄화하는 게 장점이다. 속도도 다르다: LinearLayout은 사이즈를 2번 측정해 상대적으로 느리고, ConstraintLayout은 최적화로 1번만 측정해 더 빠르다.

    '
  points:
  - 단순·순차 = Linear, 복잡 = Constraint
  - Constraint는 계층을 평탄화(depth↓)
  - '측정 횟수: Linear 2회 vs Constraint 1회'
  source: https://github.com/pby2017/study-android/blob/master/legacy/QnA/android/layout.md
- category: android
  title: 머티리얼 디자인 — 일관된 시각 언어
  summary: '스큐어모픽(실물 모사)→플랫(평면)을 거쳐, 구글은 ''프로젝트 케네디''로 디자인을 통일했고 그 위에 학습 부담을 줄인 머티리얼 디자인을 내놨다. 핵심은 시각 디자인의 공통 언어와 ''이디엄''(단순 조작을 조합해 의미 있는 조작을 만드는 관용구)으로 사용자가 UI 동작을 예측하게 하는 것. 대표 컴포넌트는 리스트/그리드/카드, 그리고 FAB·Raised·Flat 버튼. 카드엔 정보를 의미 단위로 묶는 ''청킹''을 적용한다.

    '
  points:
  - '케네디 → 머티리얼: 일관성 + 학습부담↓'
  - 이디엄으로 동작을 예측 가능하게
  - 카드·리스트·FAB가 대표 컴포넌트
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_11(머티리얼디자인).md
- category: architecture
  title: 왜 설계 기법을 쓰나 — 액티비티 비대화 방지
  summary: '액티비티는 화면 로직, 사용자 액션 처리, 뷰 데이터 반영 등 너무 많은 역할을 떠안는다. 전부 액티비티에 넣으면 변경이 어렵고 관리가 힘들다. 그래서 역할을 분리해 변경에 강한 코드를 만드는 게 설계 기법의 목적이다. 대표적으로 MVP(Model-View-Presenter)와 MVVM(Model-View-ViewModel)이 있다. 둘 다 ''뷰는 표시, 비즈니스/데이터는 분리''라는 원칙을 공유한다.

    '
  points:
  - '문제: 액티비티가 모든 역할을 떠안음'
  - '해결: 역할 분리로 변경에 강하게'
  - '대표 패턴: MVP, MVVM'
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_05(설계기법과라이브러리활용).md
- category: architecture
  title: MVP 패턴 — 장점과 함정
  summary: 'MVP는 Model(DB·API 접근, UI 로직 없음), View(데이터 표시, 액션은 Presenter에 위임), Presenter(Model·View 중개, 이벤트 처리)로 나눈다. Presenter가 인터페이스로만 접근하게 하면 테스트가 쉬워진다. 장점은 역할 분리로 액티비티가 작아지고 View-Model 의존이 사라지는 것. 단점은 인터페이스 정의로 코드가 길어지고, 데이터를 뷰에 꽂는 로직을 직접 짜야 하며, 표준 프레임워크가 없어 분리 방식을 매번 고민해야 한다는 점이다.

    '
  points:
  - Model/View/Presenter로 역할 3분할
  - 인터페이스 접근 → 테스트 용이
  - '단점: 코드량↑, 표준 프레임워크 부재'
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_05(설계기법과라이브러리활용).md
- category: architecture
  title: 그레이들(Gradle)의 이해
  summary: 'Gradle은 안드로이드의 빌드 시스템으로, 어떤 라이브러리를 쓰고 어떻게 컴파일·패키징할지를 선언한다. 프로젝트 수준과 모듈(app) 수준 build.gradle로 나뉘며, dependencies 블록에 의존성을 적으면 자동으로 받아온다. minSdk/targetSdk로 지원 범위를 정하고, productFlavor로 같은 코드에서 여러 빌드 변형(무료/유료 등)을 만든다. 이 학습 레포의 ProductFlavorApp 예제가 그 실습이다.

    '
  points:
  - 프로젝트/모듈 build.gradle 2단계
  - dependencies로 라이브러리 선언·자동 수신
  - productFlavor로 빌드 변형 생성
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_06(그레이들의이해).md
- category: ai
  title: diagnose — 디버깅을 규율로 만드는 스킬
  summary: 'mattpocock/skills의 diagnosing-bugs는 어려운 버그를 "재현 가능한 실패 신호"에서 시작하게 만드는 디버깅 루프다. 순서는 재현·최소화 → 3~5개 가설 → 한 변수씩 계측 → 수정 → 회귀 테스트 → 정리로 이어진다. 좋은 점은 버그를 설명하는 말솜씨보다, 같은 명령으로 빨간불과 초록불을 반복해서 볼 수 있는지를 먼저 묻는다는 것이다. 그래서 AI에게 바로 코드를 고치게 하기보다, 실패를 빠르게 보여주는 테스트·스크립트·로그 지점을 먼저 만들고 그 신호 하나로 가설을 줄여 간다.

    '
  points:
  - '출발점: 재현 가능한 red/pass 신호를 먼저 만든다'
  - 가설은 3~5개로 제한하고, 계측은 한 변수씩만 바꾼다
  - 수정 뒤에는 같은 실패 신호를 회귀 테스트로 남긴다
  source: https://github.com/mattpocock/skills
- category: ai
  title: Spec Kit — 명세 주도 개발(SDD)
  summary: 'GitHub Spec Kit은 AI에게 바로 구현을 맡기기 전에, 요구사항과 기술 결정을 파일로 고정하는 Spec-Driven Development 도구다. 흐름은 constitution으로 프로젝트 원칙을 세우고, specify로 "무엇과 왜"를 적은 뒤, plan에서 기술 선택을 붙이고, tasks로 실행 가능한 작업 목록을 만든 다음 implement로 들어간다. `specify init`은 Copilot, Codex, Claude Code, Gemini CLI 등 30개 이상 에이전트 통합을 지원하고, 스킬 모드에서는 `/speckit.*` 명령 대신 `speckit-*` 스킬을 설치할 수 있다. 교훈은 "명세 문서"가 산출물 보관용이 아니라, AI가 추측으로 코드를 시작하지 못하게 하는 실행 경계라는 점이다.

    '
  points:
  - constitution→specify→plan→tasks→implement로 요구사항과 구현을 분리
  - '`specify init`은 30+ 에이전트 통합과 skills 모드 설치를 지원'
  - '핵심 가치: AI 코딩 전에 원칙·요구사항·작업 단위를 버전 관리'
  source: https://github.com/github/spec-kit
- category: ai
  title: Karpathy-inspired CLAUDE.md — 에이전트 행동을 네 규칙으로 좁히기
  summary: 'multica-ai/andrej-karpathy-skills는 Karpathy의 LLM 코딩 실패 관찰에서 출발한 짧은 CLAUDE.md 가이드다. 네 규칙은 ① Think Before Coding(가정·모호함·트레이드오프를 먼저 드러내기), ② Simplicity First(요청 밖 기능과 1회용 추상화 금지), ③ Surgical Changes(요청과 직접 연결된 줄만 바꾸기), ④ Goal-Driven Execution(성공 기준을 정하고 검증될 때까지 반복)이다. 교훈은 특정 도구보다 "에이전트가 어떤 행동을 하지 말아야 하는지"를 작고 검증 가능한 규칙으로 쓰는 것이 결과를 바꾼다는 점이다.

    '
  points:
  - '4규칙: 먼저 이해·최소 코드·수술적 변경·목표 기반 검증'
  - 모호하면 추측하지 않고 가정과 선택지를 드러내게 함
  - 규칙 파일은 작을수록 행동 경계가 선명해진다는 사례
  source: https://github.com/multica-ai/andrej-karpathy-skills
- category: ai
  title: Ouroboros — 모호함을 수치로
  summary: 'Ouroboros는 코딩 에이전트가 막연한 요청에서 바로 구현으로 뛰지 않게 만드는 명세 우선 워크플로 엔진이다. 흐름은 interview로 숨은 가정을 드러내고, seed로 확정된 스펙을 만들고, run/evaluate로 실행과 검증을 반복하는 구조다. 핵심은 인터뷰를 감으로 끝내지 않는 점이다. 목표·제약·성공 기준·기존 코드베이스 이해 같은 차원을 0.0~1.0으로 채점하고, `Ambiguity = 1 - Σ(clarity_i × weight_i)`로 남은 불확실성을 계산한다. Ambiguity가 0.2 이하가 되어야 Seed를 만들 수 있고, 유사도 0.95 이상이면 온톨로지가 수렴했다고 본다. 즉 질문을 오래 하는 도구가 아니라, 구현해도 되는 상태를 수치로 가르는 장치다.

    '
  points:
  - interview→seed→run→evaluate로 질문·명세·실행·검증을 분리
  - 'Seed 생성 임계값: Ambiguity <= 0.2, 수렴 기준: Similarity >= 0.95'
  - Brownfield는 목표·제약·성공 기준에 코드베이스 컨텍스트까지 가중 평가
  source: https://github.com/Q00/ouroboros/blob/main/README.ko.md
- category: ai
  title: 서브에이전트 — 컨텍스트를 지키는 분업
  summary: 'Claude Code의 서브에이전트는 자체 컨텍스트 창, 전용 시스템 프롬프트, 별도 도구 권한을 가진 작업 단위다. 검색·코드 탐색·보안 검토처럼 로그와 파일 내용이 많이 쌓이는 일을 분리하면, 메인 세션에는 결과 요약만 돌아와 컨텍스트를 보존한다. 정의 파일은 프로젝트 `.claude/agents/`나 사용자 `~/.claude/agents/`에 두고, 중복 이름이 있으면 더 가까운 프로젝트 정의가 우선한다. 실무 포인트는 병렬화보다 권한과 비용 라우팅이다. `tools` allowlist, `disallowedTools` denylist, MCP 서버 범위, `model` 필드로 읽기 전용 탐색대·로컬 전용 조사원·저비용 요약 에이전트를 분리해 설계한다.

    '
  points:
  - '정의 위치: 프로젝트 `.claude/agents/`가 사용자 `~/.claude/agents/`보다 우선'
  - '권한 설계: `tools`/`disallowedTools`와 MCP 서버 범위로 읽기·쓰기·외부도구를 제한'
  - '비용 설계: `model` 또는 `CLAUDE_CODE_SUBAGENT_MODEL`로 반복 탐색은 더 빠른 모델에 라우팅'
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: reloadSkills — SessionStart 훅으로 같은 세션에서 스킬 즉시 반영
  summary: 'Claude Code의 스킬 탐색은 보통 SessionStart 훅이 끝나기 전에 한 번만 돌기 때문에, 훅이 ~/.claude/skills/ 나 .claude/skills/ 에 새 스킬을 써넣어도 다음 세션에야 나타난다. 이를 해결하려고 SessionStart 훅이 JSON으로 `reloadSkills: true`를 반환하면, 훅 완료 후 Claude Code가 스킬·커맨드 디렉터리를 다시 스캔해 방금 설치한 스킬을 같은 세션에서 바로 쓸 수 있다. 팀 스킬 레포를 git pull로 동기화한 뒤 즉시 적용하는 부트스트랩 패턴에 유용하다.

    '
  points:
  - 스킬 탐색은 SessionStart 훅 종료 전에 1회 실행 — 새 스킬은 원래 다음 세션에야 보임
  - SessionStart 훅이 hookSpecificOutput에 reloadSkills:true 반환 시 디렉터리 재스캔
  - git pull로 팀 스킬 받아 같은 세션에 즉시 반영하는 부트스트랩에 적합
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: --safe-mode — 커스터마이징 다 끄고 설정 문제 격리
  summary: 'Claude Code(v2.1.169+)의 `--safe-mode`는 모든 커스터마이징을 로드하지 않고 시작하는 플래그다. CLAUDE.md·스킬·플러그인·훅·MCP 서버·커스텀 커맨드/에이전트·출력 스타일·워크플로·커스텀 테마/키바인딩· 상태줄·LSP 서버·자동 메모리가 전부 비활성화된다. 반면 인증·모델 선택·내장 도구·권한은 정상 동작해서, 모든 것을 끄는 `--bare`와는 다르다. 어떤 커스터마이징이 설정을 망가뜨렸는지 이분법으로 좁힐 때 쓴다. 관리(managed) 정책 훅·상태줄·커맨드는 안전 모드에서도 여전히 적용된다.

    '
  points:
  - '끄는 것: CLAUDE.md·스킬·플러그인·훅·MCP·커스텀 커맨드/에이전트·출력스타일·테마·상태줄·자동메모리'
  - '유지: 인증·모델 선택·내장 도구·권한 (그래서 전부 끄는 --bare와 다름)'
  - 관리 정책 항목은 예외로 적용 / 실행 시 CLAUDE_CODE_SAFE_MODE 설정됨
  source: https://code.claude.com/docs/en/cli-reference
- category: ai
  title: /cd — 프롬프트 캐시 깨지 않고 작업 디렉터리 옮기기
  summary: 'Claude Code(v2.1.169+)의 `/cd <path>`는 세션을 통째로 새 작업 디렉터리로 옮긴다. 핵심은 대화의 프롬프트 캐시가 유지된다는 점이다. 시스템 프롬프트를 다시 만드는 대신, 새 디렉터리의 CLAUDE.md를 메시지로 덧붙이는 방식이라 세션 중간에 캐시가 깨지지 않는다. 세션은 새 디렉터리의 프로젝트 저장소로 이동해서 `--resume`/`--continue`도 거기서 찾는다. 처음 가는 디렉터리면 신뢰 여부를 물어본다. 세션 이동 없이 디렉터리 접근만 추가하려면 `/add-dir`를 쓴다.

    '
  points:
  - 세션을 새 작업 디렉터리로 이동 — 프롬프트 캐시 보존(CLAUDE.md를 메시지로 append)
  - 세션이 새 디렉터리 저장소로 옮겨져 --resume/--continue도 거기서 인식
  - 접근만 추가는 /add-dir / Cd 권한 규칙으로 대상 제한 가능 / v2.1.169 미만은 Unknown command
  source: https://code.claude.com/docs/en/commands
- category: ai
  title: 출력 스타일(Output Styles) — Claude의 역할·말투를 시스템 프롬프트째 바꾸기
  summary: '출력 스타일은 Claude가 ''무엇을 아는지''가 아니라 ''어떻게 응답하는지''를 바꾼다. 시스템 프롬프트를 직접 수정해 역할·톤·출력 형식을 매 턴 고정한다. 내장 스타일은 Default 외에 Proactive(즉시 실행), Explanatory(코딩 중 ''Insights'' 설명), Learning(직접 코드 일부를 짜도록 TODO(human) 마커를 남김) 세 가지가 있다. `/config`의 Output style에서 고르며 선택은 .claude/settings.local.json의 outputStyle에 저장된다. 세션 시작 시 한 번 읽으므로 변경은 /clear 후 적용된다. 커스텀 스타일은 .claude/output-styles의 마크다운 파일로 만들고, keep-coding-instructions: true면 코딩 지침을 유지한다.

    '
  points:
  - '내장: Default / Proactive(즉시 실행) / Explanatory(설명) / Learning(TODO(human) 마커로 직접 작성 유도)'
  - CLAUDE.md(프로젝트 컨텍스트)와 달리 시스템 프롬프트 자체를 수정 — 매 응답에 적용, /clear 후 반영
  - '커스텀은 .claude/output-styles 마크다운 / 기본은 코딩 지침 제외, keep-coding-instructions: true로 유지'
  source: https://code.claude.com/docs/en/output-styles
- category: ai
  title: fallbackModel — 기본 모델이 막힐 때 대체 모델로 자동 전환
  summary: 'fallbackModel은 기본 모델이 과부하(overloaded)거나 사용 불가일 때 쓸 백업 모델을 지정하는 설정이다. settings.json에 모델 이름 배열로 적으면 적힌 순서대로 시도하고, 전환되면 알림(notice)을 보여준다. 체인은 최대 3개까지만 적용되고 그 이상은 무시된다. `"default"`는 기본 모델로 확장된다. 이 키는 설정 파일 간 병합되지 않아서, 우선순위가 가장 높은 파일이 체인 전체를 결정한다. 한 세션만 바꾸려면 `--fallback-model` 플래그로 덮어쓸 수 있다.

    '
  points:
  - 기본 모델 과부하·불가 시 배열 순서대로 백업 모델 시도 + 전환 알림 표시
  - 체인 최대 3개(초과 무시) / "default"는 기본 모델로 확장 / 병합 안 됨(최상위 파일이 전체 결정)
  - 단발성 변경은 --fallback-model 플래그로 한 세션만 덮어쓰기
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: Stop 훅 additionalContext — 턴 끝에 컨텍스트 주입해 작업 이어가기
  summary: 'Stop·SubagentStop 훅은 hookSpecificOutput.additionalContext로 문자열을 돌려줄 수 있다. Claude Code는 이 문자열을 시스템 리마인더로 감싸 턴이 끝나는 지점에 끼워 넣고, 대화가 계속되어 Claude가 그 내용을 보고 작업을 이어간다. decision: "block"이 오류 피드백으로 강제 계속시키는 것과 달리, additionalContext는 오류가 아닌 정보성 피드백이다. 한 이벤트에 여러 훅이 값을 돌려주면 Claude는 전부 받고, 한 값이 10,000자를 넘으면 전체 텍스트는 세션 디렉터리 파일로 저장되고 미리보기와 파일 경로만 전달된다.

    '
  points:
  - Stop·SubagentStop은 hookSpecificOutput.additionalContext로 턴 끝에 컨텍스트 주입 가능
  - block(오류 피드백) vs additionalContext(정보성 피드백) — 둘 다 대화를 계속시키지만 성격이 다름
  - 값 10,000자 초과 시 파일로 저장 후 경로+미리보기만 전달 / 여러 훅 값은 모두 수신
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: 상태줄 rate_limits — 5시간·7일 사용량을 항상 눈에 보이게
  summary: '상태줄(statusline) 스크립트는 stdin으로 받는 JSON에 rate_limits 필드를 포함한다. rate_limits.five_hour와 rate_limits.seven_day 각각에 used_percentage(0~100)와 resets_at(Unix epoch 초)가 들어 있어, 5시간·7일 사용 한도를 몇 % 썼고 언제 리셋되는지 바닥에 상시 표시할 수 있다. 단 이 필드는 Claude.ai 구독자(Pro/Max)에게만, 그것도 세션 첫 API 응답 이후에 나타나며 각 윈도우가 독립적으로 없을 수 있어 jq에서 // empty로 부재를 처리해야 한다. 상태줄은 로컬에서 돌고 API 토큰을 쓰지 않으니 한도 추적에 부담이 없다.

    '
  points:
  - rate_limits.five_hour / seven_day → used_percentage(0~100) + resets_at(Unix epoch 초)
  - Pro/Max 구독자 한정, 세션 첫 API 응답 후에만 등장 / 각 윈도우 독립적으로 부재 가능 → jq '// empty'
  - 상태줄은 로컬 실행이라 API 토큰 미소비 / context_window.used_percentage로 컨텍스트 사용량도 함께 표시 가능
  source: https://code.claude.com/docs/en/statusline
- category: ai
  title: disableBundledSkills — 번들 스킬·내장 명령을 모델 눈앞에서 치우기
  summary: 'Claude Code에는 기본 제공되는 번들 스킬·워크플로와 /init 같은 내장 슬래시 명령이 딸려 온다. settings.json에서 disableBundledSkills를 true로 두면 번들 스킬·워크플로는 통째로 제거되고, 내장 슬래시 명령은 여전히 타이핑은 되지만 모델 목록에서는 숨겨진다. 이때 설치한 Skills 플러그인, .claude/skills/, .claude/commands/의 내 스킬·명령은 영향을 받지 않는다. 환경변수 CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1로도 같은 효과를 낼 수 있어, 내 워크플로만 깔끔히 노출하고 싶을 때 쓴다.

    '
  points:
  - true 시 번들 스킬·워크플로는 완전 제거, 내장 슬래시 명령(/init 등)은 타이핑 가능하나 숨김
  - 내 것(플러그인·.claude/skills·.claude/commands)은 영향 없음
  - 환경변수 CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1로 동일 효과
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: 스킬 호출 권한 — disable-model-invocation / user-invocable
  summary: '커스텀 명령이 스킬로 통합되면서, 스킬 프런트매터로 "누가 이 스킬을 부를 수 있는가"를 제어할 수 있다. 기본값은 사용자와 Claude 둘 다 호출 가능이지만, disable-model-invocation을 true로 두면 오직 사용자가 /이름으로만 부를 수 있고 Claude가 자동으로 실행하지 못한다. 배포·커밋·슬랙 전송처럼 부작용이 있거나 타이밍을 직접 잡아야 하는 작업에 쓰면, 코드가 준비돼 보인다고 Claude가 멋대로 배포하는 일을 막는다. 반대로 user-invocable을 false로 두면 / 메뉴에서 숨겨져 Claude만 쓸 수 있어, 명령이 아닌 배경 지식용 스킬(예: 레거시 시스템 설명)에 적합하다.

    '
  points:
  - 'disable-model-invocation: true → 사용자만 /이름으로 호출, Claude 자동 실행 차단(서브에이전트 프리로드도 막음)'
  - 'user-invocable: false → / 메뉴에서 숨김, Claude만 사용(배경 지식용)'
  - 둘 다 기본 false/true → 기본은 양쪽 모두 호출 가능 / 부작용 있는 /deploy·/commit에 disable-model-invocation 권장
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: 스킬 effort 프런트매터 — 명령마다 추론 강도 따로 주기
  summary: '스킬(=통합된 커스텀 슬래시 명령)의 프런트매터에 effort 필드를 두면, 그 스킬이 활성화된 동안만 세션의 추론 강도(effort level)를 덮어쓴다. 값은 low·medium·high·xhigh·max 중 모델이 지원하는 범위에서 고르며, 지정하지 않으면 세션 설정을 그대로 따른다. 가벼운 포맷 정리·로그 한 줄 추가 같은 스킬엔 low를, 아키텍처 설계·보안 점검처럼 깊은 사고가 필요한 스킬엔 high 이상을 박아두면 매번 /model로 바꿀 필요가 없다. 비슷하게 model 필드로 그 스킬이 도는 동안의 모델 자체를 바꿀 수도 있고, 본문에서는 ${CLAUDE_EFFORT}로 현재 강도를 읽어 지시를 분기할 수 있다.

    '
  points:
  - 'effort: low/medium/high/xhigh/max — 스킬 활성 동안만 세션 effort 덮어씀(미지정 시 세션 상속)'
  - model 필드와 짝 — 스킬 도는 동안의 모델까지 바꾸고 턴 끝나면 세션 모델 복귀
  - 본문에서 ${CLAUDE_EFFORT}로 현재 강도 읽어 지시 분기 가능(ultracode는 xhigh로 표시)
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: PreCompact 훅 — 압축 직전, 컨텍스트를 지킬 마지막 기회
  summary: 'PreCompact 훅은 컨텍스트 압축(compaction)이 일어나기 직전에 실행된다. matcher로 무엇이 압축을 일으켰는지 구분할 수 있는데, 사용자가 직접 친 /compact는 manual, 컨텍스트가 차서 자동으로 도는 압축은 auto다. PreCompact는 블로킹 가능한 이벤트라서, 훅이 exit code 2로 끝나거나 JSON으로 decision:"block"을 돌려주면 압축 자체를 막을 수 있다. 그래서 "압축으로 대화 일부가 요약되어 사라지기 전, 중요한 컨텍스트를 파일로 저장하는 마지막 기회"로 쓰는 패턴이 대표적이다. SessionStart 훅과 짝지으면 다음 세션에서 그 컨텍스트를 다시 불러와 이어갈 수 있다.

    '
  points:
  - 압축 직전 실행 / matcher로 manual(/compact 수동) vs auto(컨텍스트 참) 구분
  - 블로킹 가능 — exit 2 또는 decision:"block"으로 압축 자체를 막을 수 있음
  - 압축으로 요약돼 사라질 컨텍스트를 미리 저장하는 '마지막 기회' 패턴 (SessionStart와 짝)
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: 훅 핸들러 5종 — 셸 말고도 HTTP·MCP 도구·프롬프트·에이전트로 받기
  summary: '훅은 더 이상 셸 명령(command)만 부르는 게 아니다. 핸들러 type이 5종으로 늘었다. command(셸/실행파일), http(설정에 적은 URL로 POST), mcp_tool(이미 연결된 MCP 서버의 도구 호출), prompt(프롬프트 텍스트를 빠른 모델에 보내 평가), agent(서브에이전트로 평가)다. prompt/agent는 $ARGUMENTS 자리에 훅 입력 JSON이 들어가고 model 필드로 평가 모델을 고를 수 있다(기본은 빠른 모델). 단, /hooks 대화형 메뉴는 다섯 종을 다 보여주지만 실제로 추가·편집할 수 있는 건 command와 mcp_tool 둘뿐이라, http·prompt·agent는 settings.json에 직접 적어야 한다.

    '
  points:
  - '5종: command(셸) / http(URL POST) / mcp_tool(연결된 MCP 도구) / prompt / agent'
  - prompt·agent는 $ARGUMENTS로 훅 입력 JSON 주입, model 필드로 평가 모델 지정(기본 빠른 모델)
  - /hooks 메뉴는 5종 다 표시하나 추가·편집은 command·mcp_tool만 — 나머지는 settings.json 직접 작성
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: 스킬 disallowed-tools — 활성 동안 도구를 아예 풀에서 빼기
  summary: '스킬 프런트매터의 `allowed-tools`와 `disallowed-tools`는 정반대 일을 한다. `allowed-tools`는 스킬이 활성인 동안 적힌 도구를 승인 없이 쓰게 해주지만 제한은 아니다 — 모든 도구는 여전히 호출 가능하고 권한 설정이 그대로 적용된다. 반면 `disallowed-tools`는 적힌 도구를 활성 동안 모델의 가용 풀에서 통째로 제거한다. 공식 문서가 든 예는 배경 루프에서 `AskUserQuestion`을 못 부르게 막는 것 — 사람이 안 보는 자율 스킬에 유용하다. 단, 이 제한은 다음 메시지를 보내면 풀린다. 모든 스킬·프롬프트에 영구 적용하려면 권한 설정의 deny 규칙을 써야 한다.

    '
  points:
  - 'allowed-tools: 승인 없이 쓰게 허용(제한 아님) / disallowed-tools: 풀에서 제거(진짜 제한)'
  - '예: 자율 배경 루프에서 AskUserQuestion 차단 — 사람 개입 호출 자체를 막음'
  - 제한은 다음 메시지에 해제 / 영구 차단은 권한 설정 deny 규칙
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: StopFailure 훅 — API 에러로 턴이 끝날 때만 잡아내기
  summary: 'Stop 훅은 Claude가 정상적으로 턴을 마칠 때 돌지만, API 에러로 턴이 죽으면 안 돈다. 그 빈틈을 메우는 게 StopFailure 훅이다 — 턴이 API 에러로 끝날 때 발화한다. matcher로 에러 종류를 구분할 수 있어서, rate_limit·overloaded·billing_error·authentication_failed·server_error 등으로 골라 받을 수 있다. 단 이 훅은 출력과 종료 코드가 무시되는 ''사이드 이펙트 전용'' 이벤트라 턴을 막거나 흐름을 바꾸진 못한다. 로깅·알림·정리 용도다.

    '
  points:
  - Stop은 정상 종료에만 발화 / StopFailure는 API 에러로 끝날 때 발화
  - 'matcher로 에러 종류 구분: rate_limit·overloaded·billing_error·server_error 등'
  - 출력·종료 코드 무시 — 막기 불가, 로깅·알림·정리 같은 사이드 이펙트 전용
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: 서브에이전트 중첩 — 서브에이전트가 또 서브에이전트를 띄우기
  summary: 'v2.1.172부터 서브에이전트가 자기만의 서브에이전트를 스폰할 수 있다. 위임한 작업이 다시 병렬 하위작업으로 갈라질 때(예: 발견 항목마다 검증 에이전트를 붙이는 리뷰어) 쓴다. 중간 산출물은 메인 대화에 닿지 않고, 최상위 서브에이전트의 요약만 돌아온다. 포그라운드는 부모를 블로킹하며 사슬처럼 이어져 자기제한적이라 깊이 제한이 없지만, 백그라운드는 깊이 5에서 Agent 도구를 못 받아 더 못 띄운다(고정·설정 불가).

    '
  points:
  - v2.1.172부터 — 서브에이전트가 중첩 서브에이전트 스폰 가능
  - 포그라운드는 깊이 무제한(블로킹·자기제한), 백그라운드는 깊이 5에서 차단
  - '특정 서브에이전트 차단: tools에서 Agent 빼거나 disallowedTools에 추가'
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: subagentStatusLine — 서브에이전트 행마다 표시 내용 직접 그리기
  summary: 'subagentStatusLine은 프롬프트 아래 에이전트 패널에서 각 서브에이전트 행의 본문을 기본 ''name · description · token count'' 대신 내 포맷으로 바꾸는 설정이다. settings.json에 type "command"로 스크립트를 등록하면, 새로고침 틱마다 한 번 실행되며 보이는 모든 서브에이전트 행이 stdin에 단일 JSON으로 들어온다. 입력에는 공통 훅 필드 외에 columns(행 너비)와 tasks 배열(각 항목에 id·name·type·status·description·label·startTime·tokenCount·tokenSamples·cwd)이 담긴다. stdout에 행마다 {"id":..., "content":...} 한 줄씩 출력하면 그 행만 덮어쓴다.

    '
  points:
  - 서브에이전트 패널 행 본문 커스터마이즈 — 기본은 name·description·token count
  - 'stdin: columns + tasks 배열(id·status·tokenCount 등), stdout: {"id","content"} 줄 단위'
  - id 생략 시 기본 렌더 유지, content 빈 문자열이면 행 숨김 / statusLine과 동일한 trust·disableAllHooks 적용
  source: https://code.claude.com/docs/en/statusline
- category: ai
  title: 플러그인 마켓플레이스 — marketplace.json 하나로 팀에 플러그인 배포하기
  summary: '마켓플레이스는 플러그인을 남에게 나눠주는 카탈로그다. 레포 루트의 `.claude-plugin/marketplace.json`에 name·owner·plugins 세 필드를 채우면 되고, 각 plugin 항목은 최소 name과 source(어디서 가져올지)만 있으면 된다. source는 같은 레포의 상대경로(`./plugins/x`)부터 github·url·git-subdir·npm까지 지원하며, github/url 소스는 ref(브랜치·태그)와 sha(정확한 커밋)로 버전을 고정할 수 있다. 쓰는 쪽은 `/plugin marketplace add owner/repo`로 등록하고 `/plugin install <플러그인>@<마켓플레이스>`로 깔며, `/plugin marketplace update`로 갱신한다.

    '
  points:
  - 'marketplace.json 필수 필드: name(kebab-case) · owner · plugins[] / 각 plugin은 name+source'
  - 'source 종류: 상대경로(./) · github · url · git-subdir · npm — github/url은 ref·sha로 핀 고정'
  - 버전 미설정 시 git 커밋 SHA가 버전 — 핀 걸린 plugin.json version은 바꿔야 업데이트 전파
  source: https://code.claude.com/docs/en/plugin-marketplaces
- category: ai
  title: MessageDisplay 훅 — 화면에 보이는 답변 텍스트만 바꿔치기
  summary: 'MessageDisplay는 어시스턴트 메시지 텍스트가 화면에 출력되는 동안 도는 표시 전용(display-only) 훅이다. hookSpecificOutput.displayContent로 문자열을 돌려주면 화면에 보이는 텍스트가 그것으로 교체된다. 단 트랜스크립트와 Claude가 보는 내용은 원본 그대로 유지돼, 모델의 판단에는 영향을 주지 않고 사람 눈에 보이는 것만 손댄다. matcher를 지원하지 않아 매번 발생하고, 기본 타임아웃이 10초로 낮게 잡혀 있으며, 블로킹은 불가(exit 2면 원본이 그대로 표시).

    '
  points:
  - displayContent로 화면 출력 텍스트만 교체 — 트랜스크립트·모델 시야는 원본 유지
  - matcher 미지원, 항상 발생 / 기본 타임아웃 10초로 낮음
  - 블로킹 불가 — exit code 2여도 원본 텍스트가 그대로 표시됨
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: --exclude-dynamic-system-prompt-sections — 프롬프트 캐시 재사용률 높이기
  summary: '이 플래그는 머신마다 달라지는 시스템 프롬프트 조각(작업 디렉터리, 환경 정보, 메모리 경로, git 레포 여부)을 시스템 프롬프트에서 빼서 첫 번째 사용자 메시지로 옮긴다. 시스템 프롬프트가 사용자·머신에 상관없이 동일해지므로, 같은 작업을 여러 사람·여러 머신이 돌릴 때 프롬프트 캐시가 더 잘 재사용된다. 기본 시스템 프롬프트에서만 동작하고 `--system-prompt`/`--system-prompt-file`를 쓰면 무시되며, `-p`(print) 스크립트의 다중 사용자 워크로드에 쓰라고 안내된다.

    '
  points:
  - 머신별 조각(cwd·환경·메모리경로·git여부)을 시스템 프롬프트 → 첫 사용자 메시지로 이동
  - 시스템 프롬프트가 동일해져 사용자·머신 간 프롬프트 캐시 히트율 상승
  - 기본 프롬프트에서만 작동(--system-prompt류 쓰면 무시) / -p 다중사용자 스크립트용
  source: https://code.claude.com/docs/en/cli-reference
- category: ai
  title: Setup 훅 — 세션 시작 전 init·maintenance 준비 작업 자동 실행
  summary: 'Setup은 세션이 시작되기 ''전''에 도는 훅 이벤트로, CLI 플래그로 트리거된다. `claude -p --init`은 matcher가 `init`인 Setup 훅을, `claude -p --maintenance`는 matcher가 `maintenance`인 Setup 훅을 세션 시작 전에 실행한다(둘 다 print 모드 전용). `claude --init-only`는 Setup과 SessionStart 훅만 돌리고 대화는 시작하지 않은 채 종료하므로, 의존성 설치·캐시 워밍 같은 준비 작업을 CI에서 한 번만 돌리기 좋다.

    '
  points:
  - Setup은 세션 시작 전 실행되는 훅 이벤트 / 입력 JSON에 hook_event_name:"Setup", trigger 포함
  - --init → matcher 'init', --maintenance → matcher 'maintenance' (둘 다 -p print 모드 전용)
  - --init-only는 Setup+SessionStart만 돌리고 대화 없이 종료 — CI 준비 단계용
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: skillOverrides — SKILL.md 안 건드리고 settings에서 스킬 노출 조정하기
  summary: 'skillOverrides는 settings.json에서 스킬 이름별로 노출 방식을 덮어쓰는 설정이다. 각 스킬에 "on", "name-only", "user-invocable-only", "off" 네 값 중 하나를 줄 수 있어서, SKILL.md의 프런트매터를 고치지 않고도 특정 스킬을 완전히 끄거나(off), 이름만 보이게 하거나(name-only), 사용자가 직접 호출할 때만 쓰게(user-invocable-only) 제한할 수 있다. 팀이 받은 플러그인 스킬이 너무 많아 모델이 엉뚱한 걸 자동으로 부를 때, 원본을 수정하지 않고 프로젝트 설정만으로 정리하기 좋다.

    '
  points:
  - 스킬 이름별 노출 오버라이드 — 값은 on / name-only / user-invocable-only / off 네 가지
  - SKILL.md 프런트매터 수정 없이 settings.json만으로 스킬 가시성 조정
  - off=완전 숨김, name-only=이름만, user-invocable-only=수동 호출만 / 단 매니지드 스킬은 예외
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: claudeMdExcludes — 특정 CLAUDE.md를 메모리 로딩에서 빼기
  summary: 'claudeMdExcludes는 settings.json에서 메모리 로딩 시 건너뛸 CLAUDE.md 파일을 글롭 패턴이나 절대경로로 지정하는 설정이다. 패턴은 파일의 절대경로에 매칭되며, 예컨대 ["**/vendor/**/CLAUDE.md"]처럼 적으면 의존성 디렉터리에 딸려 온 CLAUDE.md가 컨텍스트에 안 실린다. 유저·프로젝트·로컬 메모리에만 적용되고, 매니지드 정책 파일은 제외할 수 없다. 서브모듈이나 vendor 트리에 박힌 남의 CLAUDE.md가 컨텍스트 창을 잡아먹을 때, 원본을 지우지 않고 프로젝트 설정만으로 솎아내기 좋다.

    '
  points:
  - 메모리 로딩에서 건너뛸 CLAUDE.md를 글롭/절대경로로 지정 — 패턴은 절대경로에 매칭
  - 유저·프로젝트·로컬 메모리에만 적용 / 매니지드 정책 파일은 제외 불가
  - '예: ["**/vendor/**/CLAUDE.md"] — vendor 트리의 CLAUDE.md를 컨텍스트에서 빼기'
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: Playwright CLI + MCP — Microsoft의 코딩·LLM 에이전트용 브라우저 제어 2종(접근성 트리·토큰 효율)
  summary: Playwright가 테스트 프레임워크를 넘어 에이전트 전용 브라우저 인터페이스 2종을 공식 출시했다. Playwright MCP는 LLM 에이전트용 — 접근성 트리 스냅샷으로 픽셀·비전 모델 없이 클릭·입력·탭·네트워크·콘솔 확인(Apache-2.0·34k★). Playwright CLI는 Claude Code·Copilot 같은 코딩 에이전트용 — MCP 대비 토큰 효율적(대형 도구 스키마·접근성 트리를 컨텍스트에 안 넣음). MCP와 CLI 두 레이어로 에이전트 유형별 브라우저 자동화를 분리한 설계가 핵심.
  points:
  - Playwright MCP = 접근성 트리 스냅샷, 비전 불필요, 클릭·입력·탭·네트워크·콘솔
  - Playwright CLI = 코딩 에이전트용, MCP 대비 토큰 효율적 브라우저 제어
  - 테스트 프레임워크 → 에이전트 인프라로 역할 확장
  source: https://playwright.dev/docs/test-agents
- category: ai
  title: allowManagedHooksOnly — 조직이 승인한 훅만 돌게 잠그기
  summary: 'allowManagedHooksOnly는 settings.json에서 켜면 매니지드 훅, SDK 훅, 그리고 매니지드 설정의 enabledPlugins로 강제 활성화된 플러그인 훅만 로드하는 설정이다. 유저·프로젝트·로컬에 정의된 일반 훅은 전부 차단된다. 훅은 사용자 권한으로 임의 셸 명령을 실행할 수 있어 보안 위험이 큰데, 이 설정으로 개인이 끼워 넣은 훅을 막고 조직이 검수한 훅만 허용하는 화이트리스트를 만든다. 훅을 통째로 끄는 disableAllHooks와 달리, 승인된 훅은 살려 두면서 비승인 훅만 거른다.

    '
  points:
  - 매니지드 훅·SDK 훅·매니지드 enabledPlugins 훅만 로드 / 유저·프로젝트·로컬 훅은 차단
  - 훅은 사용자 권한 셸 실행 — 비승인 훅 차단으로 공급망/내부자 위험 축소
  - disableAllHooks(전부 끄기)와 달리 승인된 훅은 유지하는 화이트리스트 방식
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: MCP 리소스·프롬프트 — 서버를 @멘션과 슬래시 커맨드로 쓰기
  summary: 'MCP 서버는 도구만이 아니라 ''리소스''와 ''프롬프트''도 노출하는데, 둘 다 일상 입력에서 바로 끌어 쓸 수 있다. 리소스는 파일처럼 @멘션으로 참조한다 — 프롬프트에 `@`를 치면 연결된 모든 서버의 리소스가 자동완성에 뜨고, `@server:protocol://resource/path` 형식(예: `@github:issue://123`)으로 적으면 해당 내용이 자동으로 가져와져 첨부된다. 한 프롬프트에서 여러 개를 동시에 참조할 수도 있다. 프롬프트는 슬래시 커맨드가 된다 — `/`를 치면 `/mcp__서버명__프롬프트명` 형태로 나타나고, 인자는 그 뒤에 공백으로 구분해 넘긴다. 둘 다 연결된 서버에서 동적으로 발견되므로 별도 설정이 필요 없다.

    '
  points:
  - '리소스 = @멘션: `@server:protocol://resource/path` (예: @github:issue://123), 참조 시 자동 fetch·첨부'
  - '프롬프트 = 슬래시 커맨드: `/mcp__servername__promptname`, 인자는 뒤에 공백 구분으로 전달'
  - 둘 다 연결된 서버에서 동적 발견 — 설정 불필요, 한 프롬프트에 리소스 여러 개 참조 가능
  source: https://code.claude.com/docs/en/mcp
- category: ai
  title: /btw — 대화 흐름 안 깨고 곁다리 질문 던지기
  summary: '긴 작업 중간에 빠른 질문 하나가 필요한데 본 대화를 어지럽히고 싶지 않을 때 `/btw`를 쓴다. `/btw 그 설정 파일 이름이 뭐였지?`처럼 치면, 현재 대화 전체를 보면서 답하지만 그 질문·답변은 대화 기록에 남지 않고 닫을 수 있는 오버레이로만 뜬다. Claude가 한창 응답 중일 때도 실행 가능하며 메인 턴을 끊지 않고 따로 돈다. 단 곁다리 질문은 도구 접근이 없어 — 파일 읽기·명령 실행·검색을 못 하고 이미 컨텍스트에 있는 것만으로 답한다. 답이 뜨면 `f`로 새 세션으로 포크해 풀 도구 권한으로 이어갈 수 있다. 서브에이전트의 정반대다 — 서브에이전트는 빈 컨텍스트 + 풀 도구, `/btw`는 풀 컨텍스트 + 도구 없음.

    '
  points:
  - 본 대화 기록에 안 남는 일회성 곁다리 질문 — 오버레이로만 표시
  - Claude 작업 중에도 실행 가능, 메인 턴 안 끊고 독립 실행 / 도구 접근은 없음(컨텍스트만으로 답)
  - '`f`로 새 세션 포크해 풀 도구로 이어가기 — 프롬프트 캐시 재사용해 비용 낮음'
  source: https://code.claude.com/docs/en/interactive-mode
- category: ai
  title: claude -p --bare — CI에서 매번 같은 결과 나오게 잠그기
  summary: '`claude -p`(헤드리스)는 기본적으로 대화형 세션과 똑같은 컨텍스트를 읽는다 — 작업 디렉터리나 `~/.claude`의 훅·스킬·플러그인·MCP 서버·자동 메모리·CLAUDE.md를 전부 자동 발견한다. 문제는 CI에서다. 동료의 `~/.claude` 훅이나 프로젝트 `.mcp.json`이 끼면 머신마다 결과가 달라진다. `--bare`를 붙이면 이 자동 발견을 통째로 건너뛰어, 명시적으로 넘긴 플래그만 적용된다. bare 모드에서도 Bash·파일 읽기·편집 도구는 쓸 수 있고, 컨텍스트는 `--append-system-prompt`, `--mcp-config`, `--settings`, `--agents` 같은 플래그로 직접 주입한다. 출력은 `--output-format json`으로 받으면 `result`·`session_id`와 `total_cost_usd`(모델별 비용 분해 포함)가 들어와 스크립트가 결과·지출을 파싱할 수 있다.

    '
  points:
  - '--bare: 훅·스킬·플러그인·MCP·자동 메모리·CLAUDE.md 자동 발견을 모두 건너뜀 — 머신 무관 재현성'
  - bare는 Bash·읽기·편집만 기본 제공, 나머지는 --mcp-config/--settings/--agents/--append-system-prompt로 명시 주입
  - --output-format json → result·session_id·total_cost_usd(모델별 분해)로 결과·비용 추적 / 파이프 stdin은 10MB 상한(v2.1.128)
  source: https://code.claude.com/docs/en/headless
- category: ai
  title: /usage — 플랜 한도가 스킬·서브에이전트·플러그인·MCP 중 어디로 새는지 % 분해
  summary: '`/cost`가 이번 세션의 달러·소요 시간(API 시간·실제 경과 시간) 요약을 보여준다면, `/usage`는 다른 일을 한다. Pro·Max·Team·Enterprise 플랜에서 `/usage`는 최근 사용량이 내 플랜 한도에 얼마나 잡아먹었는지를 보여주는데, 핵심은 그 사용량을 스킬·서브에이전트·플러그인·개별 MCP 서버별로 전체 대비 퍼센트로 쪼개 준다는 점이다. 즉 "한도가 빨리 차는 범인"이 어떤 스킬이나 어떤 MCP 서버인지 눈으로 짚어낼 수 있다. 화면에서 `d`/`w` 키로 최근 24시간과 7일을 전환할 수 있고, 다른 기기나 claude.ai에서 쓴 사용량은 포함되지 않는다. 이 기능은 Claude Code v2.1.174 이상에서 동작한다.

    '
  points:
  - /usage = 플랜 한도 기준 사용량을 스킬·서브에이전트·플러그인·MCP 서버별 % 로 분해 (≠ /cost의 달러·시간 요약)
  - d/w 키로 최근 24시간 ↔ 7일 전환 / 다른 기기·claude.ai 사용량은 미포함
  - Pro·Max·Team·Enterprise 플랜, Claude Code v2.1.174 이상 필요
  source: https://code.claude.com/docs/en/costs
- category: ai
  title: 오토 메모리 — Claude가 스스로 적는 MEMORY.md로 세션 넘어 학습하기
  summary: 'Claude Code 메모리는 두 갈래다. CLAUDE.md는 내가 직접 쓰는 규칙이고, 오토 메모리(auto memory)는 Claude가 내 교정·선호를 보고 스스로 적어 두는 메모다. 빌드 명령, 디버깅에서 알아낸 점, 코드 스타일 선호 같은 걸 "다음 대화에서 쓸모 있겠다" 싶을 때만 저장한다(매 세션 저장하는 게 아님). 저장 위치는 `~/.claude/projects/<project>/memory/`이고, 인덱스 격인 `MEMORY.md`와 주제별 파일들로 나뉜다. 세션 시작 때는 `MEMORY.md`의 앞 200줄(또는 25KB)만 불러오고 나머지 주제 파일은 필요할 때 그때그때 읽는다. 전부 평범한 마크다운이라 `/memory`로 열어 직접 보고 고치거나 지울 수 있다.

    '
  points:
  - CLAUDE.md(내가 씀) vs 오토 메모리(Claude가 씀) — 후자는 기본 on, 끄려면 autoMemoryEnabled:false 또는 CLAUDE_CODE_DISABLE_AUTO_MEMORY=1
  - '저장: ~/.claude/projects/<project>/memory/ (git 레포 기준이라 워크트리·하위폴더가 한 디렉터리 공유, 머신 로컬)'
  - 세션엔 MEMORY.md 앞 200줄/25KB만 로드 — 주제 파일은 온디맨드 / Claude Code v2.1.59 이상 필요
  source: https://code.claude.com/docs/en/memory
- category: ai
  title: 내장 ide MCP 서버 — 외부 터미널 CLI를 /ide로 VS Code에 붙이기
  summary: 'VS Code 확장이 켜져 있으면 로컬 MCP 서버 하나(이름 `ide`)가 돌고, CLI가 여기에 자동으로 붙는다. 이 연결 덕에 CLI가 만든 diff가 VS Code 네이티브 diff 뷰어로 열리고, 지금 에디터에서 선택한 텍스트와 열린 파일 경로가 매 프롬프트에 컨텍스트로 따라붙는다(트랜스크립트에 `⧉ Selected N lines from <file>` 표시). 통합 터미널에서 `claude`를 돌리면 IDE 연동이 자동이지만, 외부 터미널을 쓸 땐 Claude 안에서 `/ide`를 실행해 VS Code에 연결한다. `ide` 서버는 설정할 게 없어 `/mcp` 목록에선 숨겨지고, `127.0.0.1` 랜덤 포트에 바인딩되며 활성화 때마다 새 토큰을 발급한다. 모델에 노출되는 도구는 둘뿐 — 진단을 읽는 `mcp__ide__getDiagnostics`와 주피터 셀을 실행하는 `mcp__ide__executeCode`(실행 전 항상 확인 받음).

    '
  points:
  - 확장 활성 시 로컬 MCP 서버 `ide` 가동 — CLI 자동 연결 / diff는 VS Code 네이티브 뷰어로 열림
  - 외부 터미널이면 Claude 안에서 `/ide` 실행해 연결 / 선택 텍스트·열린 파일이 프롬프트 컨텍스트로 첨부 (.env 등은 Read deny 규칙으로 제외)
  - '모델 노출 도구는 2개뿐: getDiagnostics(읽기), executeCode(주피터, 실행 전 Quick Pick 확인) / 127.0.0.1 랜덤 포트+세션별 토큰'
  source: https://code.claude.com/docs/en/ide-integrations
- category: ai
  title: 동적 컨텍스트 주입 — 슬래시 커맨드에 셸 출력·인자를 미리 끼워 넣기
  summary: '커스텀 슬래시 커맨드(스킬)의 본문에 `!`명령`` 형태를 쓰면, Claude가 그 내용을 보기 전에 Claude Code가 먼저 그 셸 명령을 실행하고 출력으로 자리표시자를 갈아끼운다. 즉 모델은 명령어가 아니라 이미 실행된 ''실제 데이터''를 받는다 — 예를 들어 `- PR diff: !`gh pr diff``라고 적으면 진짜 diff가 프롬프트에 인라인된 채로 도착한다. 인자도 같은 식으로 미리 박힌다: `$ARGUMENTS`는 넘긴 인자 전체로, `$1`·`$2`는 셸식 따옴표 규칙대로 쪼갠 위치 인자로 치환된다(`\$1`로 리터럴 `$` 이스케이프 가능). 치환은 원본 파일에 딱 한 번만 돌아서, 명령 출력 안의 자리표시자는 다시 펼쳐지지 않는다. 또 인라인 `!`는 줄 맨 앞이나 공백 바로 뒤에 있을 때만 인식되고, 여러 줄 명령은 ` ```! ` 펜스 블록으로 감싼다.

    '
  points:
  - '`!`명령``: Claude가 보기 전 셸 실행 → 출력으로 치환 / 모델은 명령이 아닌 실제 데이터를 받음 (예: !`gh pr diff`)'
  - '인자 치환: $ARGUMENTS=인자 전체, $1·$2=따옴표 규칙대로 쪼갠 위치 인자 / \$1로 리터럴 $ 이스케이프'
  - 치환은 원본에 1회만 — 출력 속 자리표시자는 재확장 안 됨 / 인라인 !는 줄 앞·공백 뒤만 인식, 여러 줄은 ```! 블록
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: 이미지로 대화하기 — 스크린샷·목업·다이어그램을 컨텍스트로 넣기
  summary: 'Claude Code는 터미널 CLI지만 이미지를 컨텍스트로 받는다. 넣는 방법은 셋 — 창에 드래그 앤 드롭, `ctrl+v`로 붙여넣기(맥에서도 `cmd+v`가 아니라 `ctrl+v`다), 또는 경로를 직접 주기("이 이미지 분석해줘: /path/to/image.png"). 에러 스크린샷을 던지며 "이거 왜 나는 거야?"라고 묻거나, 디자인 목업을 주고 "이걸 만드는 CSS 짜줘", DB 스키마 다이어그램을 주고 "새 기능에 맞게 어떻게 고칠까?"처럼 텍스트로 설명하기 번거로운 맥락을 그림 하나로 전달할 수 있다. 한 대화에서 이미지 여러 개를 다룰 수 있고, Claude가 답에서 `[Image #1]`처럼 가리키면 그 링크를 맥에서 `Cmd+Click`(윈도·리눅스는 `Ctrl+Click`)해 기본 뷰어로 연다.

    '
  points:
  - '넣는 법 3가지: 드래그 앤 드롭 / ctrl+v 붙여넣기(맥도 cmd+v 아님) / 경로 직접 전달'
  - '용도: 에러 스크린샷·UI 목업·다이어그램·스키마 — 텍스트로 설명하기 번거로운 맥락을 그림으로 / 목업→CSS·HTML 생성도 가능'
  - '한 대화에 이미지 여러 개 / 답의 `[Image #1]` 링크는 Cmd+Click(맥)·Ctrl+Click(윈·리눅스)으로 뷰어에서 열기'
  source: https://code.claude.com/docs/en/common-workflows
- category: ai
  title: /branch — 대화를 통째로 복제해 다른 접근을 따로 시도하기
  summary: '세션 중 다른 방법을 실험하고 싶지만 지금까지의 대화 흐름은 잃고 싶지 않을 때 `/branch`를 쓴다. `/branch try-streaming-approach`처럼 치면 그 시점까지의 대화를 복제한 새 가지로 옮겨 가고, 원본 세션은 그대로 남아 세션 피커에 보존된다. CLI에서는 `claude --continue --fork-session`처럼 `--fork-session`을 붙여 같은 효과를 낸다. `/branch` 확정 시 새 가지와 원본 두 개의 세션 ID가 찍히며, 원본으로 돌아가려면 그 ID나 이름을 `/resume`에 넘긴다. 단 "이 세션 동안 허용"으로 승인한 권한은 새 가지로 넘어가지 않는다. 한편 포크 없이 두 터미널에서 같은 세션을 동시에 이어가면 양쪽 메시지가 한 트랜스크립트에 뒤섞이니 주의. 코드까지 되감는 건 별개의 체크포인트/rewind 기능이다 — `/branch`는 대화 트리를 가르는 쪽이다.

    '
  points:
  - '`/branch [이름]`: 그 시점까지 대화를 복제한 새 가지로 이동, 원본은 피커에 그대로 / CLI는 --fork-session'
  - 포크·rewind·--fork-session으로 만든 가지는 세션 피커에서 root 세션 아래 묶여 표시(→로 펼침)
  - '''이 세션 허용'' 권한은 새 가지로 미승계 / 포크 없이 두 터미널에서 같은 세션 이어가면 트랜스크립트 뒤섞임'
  source: https://code.claude.com/docs/en/sessions
- category: ai
  title: 셸 모드 — 프롬프트 앞에 `!`로 명령 실행하고 출력까지 컨텍스트에 넣기
  summary: '입력 프롬프트 맨 앞에 `!`를 치면 셸 모드로 들어간다. 여기서 친 명령은 Claude가 해석하거나 승인 절차를 거치지 않고 바로 실행되며, 실행한 명령과 그 출력이 둘 다 대화 컨텍스트에 추가된다. 즉 `!npm test` 한 줄이면 결과가 모델 눈앞에 그대로 쌓여, 이어서 "이 실패 고쳐줘"처럼 바로 물어볼 수 있다. 실행 중에는 실시간 진행 출력이 보이고, 오래 걸리는 명령은 `Ctrl+B`로 백그라운드로 돌릴 수 있다. 입력 중 `Tab`을 누르면 과거 명령 기반 자동완성이 뜨고, 셸 모드는 `Escape`·`Backspace`·`Ctrl+U`로 빠져나온다.

    '
  points:
  - 프롬프트 맨 앞 `!` → 셸 모드 / 명령은 Claude 해석·승인 없이 즉시 실행, 명령과 출력이 모두 컨텍스트에 추가
  - 실시간 진행 출력 표시 / 긴 명령은 Ctrl+B로 백그라운드 전환, Tab은 과거 명령 기반 자동완성
  - Escape·Backspace·Ctrl+U로 셸 모드 종료 / 슬래시 커맨드 파일의 `!`명령``(미리 실행해 치환)과는 별개
  source: https://code.claude.com/docs/en/interactive-mode
- category: ai
  title: MCP 설치 스코프 — local·project·user 셋 중 어디에 서버를 둘지
  summary: 'MCP 서버는 세 스코프 중 하나로 설치하고, 스코프가 ''어느 프로젝트에서 뜨는지''와 ''팀과 공유되는지''를 결정한다. 기본값인 local은 추가한 그 프로젝트에서만 뜨고 내게만 보이며 `~/.claude.json`에 저장돼 버전 관리에 안 올라간다 — 개인용·실험용·자격증명 든 서버에 쓴다. project는 프로젝트 루트의 `.mcp.json`에 저장돼 버전 관리로 팀 전체가 같은 도구를 공유하고, user는 `~/.claude.json`에 저장돼 내 모든 프로젝트에서 뜬다. `claude mcp add --transport http <이름> --scope project <url>` 식으로 스코프를 지정한다. 보안상 `.mcp.json`의 project 스코프 서버는 쓰기 전에 승인을 받고, 승인 선택을 초기화하려면 `claude mcp reset-project-choices`를 쓴다.

    '
  points:
  - local(기본·`~/.claude.json`·그 프로젝트만·비공유) / project(`.mcp.json`·버전관리로 팀 공유) / user(`~/.claude.json`·내 모든 프로젝트)
  - '지정: `claude mcp add --transport http <이름> --scope project <url>` / local 스코프는 일반 로컬 설정(.claude/settings.local.json)과 다른 ~/.claude.json에 저장'
  - project 서버는 보안상 쓰기 전 승인 필요 / `claude mcp reset-project-choices`로 승인 선택 초기화
  source: https://code.claude.com/docs/en/mcp
- category: ai
  title: Claude를 정기 실행하는 4가지 — 어디서 도느냐로 고른다
  summary: 'Claude Code로 PR 리뷰·의존성 점검·CI 실패 확인 같은 일을 주기적으로 돌리는 방법은 네 가지이고, 고르는 기준은 ''어디서 도느냐''다. Routines는 Anthropic 관리 인프라에서 돌아 내 컴퓨터가 꺼져 있어도 실행되고, 일정뿐 아니라 API 호출·GitHub 이벤트로도 트리거된다(claude.ai/code/routines에서 설정). Desktop scheduled tasks는 데스크톱 앱이 내 머신에서 돌려서 로컬 파일·커밋 안 된 변경에 직접 접근해야 할 때 쓴다. GitHub Actions는 CI 파이프라인에서 돌아 열린 PR 같은 레포 이벤트나 워크플로 설정 옆에 둘 cron에 맞는다. `/loop`는 지금 열려 있는 CLI 세션 안에서 가볍게 폴링하는 용도로, 새 대화를 시작하면 멈추지만 만료 전이면 `--resume`/`--continue`로 되살아난다.

    '
  points:
  - Routines = Anthropic 인프라(컴퓨터 꺼져도 실행) / 일정·API 호출·GitHub 이벤트 트리거 — claude.ai/code/routines
  - Desktop scheduled tasks = 데스크톱 앱·내 머신(로컬 파일·미커밋 변경 접근) / GitHub Actions = CI 파이프라인(레포 이벤트·cron)
  - '`/loop` = 현재 CLI 세션 폴링 / 새 대화 시작 시 중단, 만료 전이면 --resume·--continue로 복원 / 자동 실행 프롬프트엔 성공 기준·결과 처리를 명시'
  source: https://code.claude.com/docs/en/common-workflows
- category: ai
  title: 커스텀 커맨드 인자 — $ARGUMENTS 한 덩어리 vs 위치 인자로 쪼개 받기
  summary: '커스텀 슬래시 커맨드(이제 스킬과 통합)는 호출할 때 넘긴 인자를 본문에 끼워 넣을 수 있다. `$ARGUMENTS`는 입력 전체를 타이핑한 그대로 한 덩어리로 받는다 — 본문에 `$ARGUMENTS`가 없으면 끝에 `ARGUMENTS: <값>`이 자동으로 붙는다. 여러 인자를 따로 받고 싶으면 `$ARGUMENTS[N]` 또는 짧게 `$N`을 쓰는데, 인덱스는 0부터다 — `$0`이 첫 번째, `$1`이 두 번째다(셸의 $1과 헷갈리기 쉬움). 인덱스 인자는 셸식 따옴표 규칙을 따라서 여러 단어를 한 인자로 넘기려면 `"hello world"`처럼 감싸야 하고, 산문 속 `\$1.00` 같은 리터럴 $는 백슬래시로 이스케이프한다.

    '
  points:
  - '`$ARGUMENTS` = 입력 전체 한 덩어리(타이핑 그대로) / 본문에 없으면 끝에 `ARGUMENTS: <값>` 자동 추가'
  - '`$ARGUMENTS[N]`·`$N` = 위치별 인자, 인덱스 0부터 — `$0`=첫째, `$1`=둘째(셸 $1과 다름) / 프런트매터 `arguments`로 이름 붙은 위치 인자도 선언 가능'
  - 여러 단어 한 인자는 `"..."`로 감싸기 / 산문의 리터럴 `$`는 `\$1.00`처럼 백슬래시로 이스케이프
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: 커스텀 서브에이전트 만들기 — 자주 쓰는 일꾼을 파일로 굳히기
  summary: '같은 지시를 가진 일꾼을 매번 새로 띄우게 된다면, 그걸 커스텀 서브에이전트로 파일에 굳힌다. 서브에이전트는 YAML 프런트매터 + 본문(시스템 프롬프트)으로 된 마크다운 파일이고, `name`과 `description` 둘만 필수다. `tools`(허용 도구 allowlist)·`disallowedTools`(차단 denylist)·`model`로 권한과 모델을 좁히는데, model에 `inherit`을 주면 메인 대화와 같은 모델을 쓴다. Claude는 작업이 들어오면 각 서브에이전트의 `description`을 보고 위임할지 판단하므로, description은 페르소나가 아니라 ''언제 이걸 쓰는지''를 또렷이 적어야 한다. 저장 위치는 프로젝트용 `.claude/agents/`(버전 관리로 팀 공유)와 개인용 `~/.claude/agents/`(내 모든 프로젝트)가 있고, `/agents` 명령으로 가이드 따라 만들고 관리한다.

    '
  points:
  - 마크다운 + YAML 프런트매터, 필수는 `name`·`description`뿐 / 본문이 시스템 프롬프트 / `/agents`로 생성·편집·삭제
  - '도구 좁히기: `tools`(allowlist) 또는 `disallowedTools`(denylist) / `model: inherit`로 메인 대화 모델 따라가기'
  - '위치·우선순위: managed(1·조직) > --agents 플래그(2·세션) > `.claude/agents/`(3·프로젝트, 팀 공유) > `~/.claude/agents/`(4·내 전체) > 플러그인(5)'
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: '@로 파일·디렉터리 참조 — Claude가 읽기를 기다리지 않고 내용을 미리 넣기'
  summary: '프롬프트에 `@`를 쓰면 Claude가 Read 도구로 파일을 찾아 읽기를 기다리지 않고, 그 자리에 내용을 바로 끼워 넣을 수 있다. `@src/utils/auth.js`처럼 파일을 가리키면 그 파일 전체 내용이 대화에 포함되고, `@src/components`처럼 디렉터리를 가리키면 내용이 아니라 그 안의 파일 목록(파일 정보 포함)이 들어온다. 중요한 부가 효과 하나 — `@`로 파일을 참조하면 그 파일이 있는 디렉터리와 상위 디렉터리들의 `CLAUDE.md`도 함께 컨텍스트에 딸려 붙는다(그 하위트리 규칙을 자동으로 끌어옴). 경로는 상대·절대 둘 다 되고, 한 메시지에서 여러 개를 동시에 참조할 수 있다(예: "@file1.js and @file2.js"). 같은 `@` 문법으로 연결된 MCP 서버의 리소스(`@server:resource`)도 끌어올 수 있다.

    '
  points:
  - '`@파일경로` = 파일 전체 내용을 그 자리에 인라인(Read 기다릴 필요 없음) / `@디렉터리` = 내용 아닌 파일 목록(파일 정보 포함)'
  - '부가 효과: `@`로 파일 참조 시 그 파일 디렉터리+상위 디렉터리의 CLAUDE.md도 함께 컨텍스트에 추가'
  - 상대·절대 경로 모두 가능 / 한 메시지에 여러 개(`@file1.js and @file2.js`) / `@server:resource`로 MCP 리소스도 동일 문법으로 참조
  source: https://code.claude.com/docs/en/common-workflows
- category: ai
  title: 원격 MCP 서버 인증 — /mcp로 OAuth 2.0 로그인하기
  summary: 'Sentry·Notion 같은 클라우드 MCP 서버는 대개 인증을 요구하는데, Claude Code는 OAuth 2.0을 지원한다. `claude mcp add --transport http <이름> <url>`로 서버를 붙인 뒤 Claude 안에서 `/mcp`를 실행하면 브라우저가 열려 로그인 흐름이 진행된다. 서버가 `401 Unauthorized`나 `403 Forbidden`을 돌려주면 Claude Code가 그 서버를 ''인증 필요''로 표시하고 `/mcp`에서 OAuth 흐름을 밟게 해준다. 발급된 토큰은 안전하게 저장되고 자동으로 갱신되며, 접근을 끊으려면 `/mcp` 메뉴의 "Clear authentication"을 쓴다. 브라우저 리다이렉트가 연결 오류로 실패하면 주소창의 콜백 URL 전체를 Claude의 URL 프롬프트에 붙여 넣으면 된다.

    '
  points:
  - '흐름: `claude mcp add --transport http <이름> <url>` → Claude 안에서 `/mcp` 실행 → 브라우저 로그인 / 401·403 응답 시 자동으로 ''인증 필요'' 표시'
  - 토큰은 안전 저장·자동 갱신 / 접근 해제는 `/mcp` 메뉴의 "Clear authentication" / OAuth는 HTTP 서버에서 동작
  - 사전 등록 리다이렉트 URI가 필요하면 `--callback-port`로 포트 고정(`http://localhost:PORT/callback`) / DCR 미지원 서버는 `--client-id`·`--client-secret`로 자격증명 직접 제공
  source: https://code.claude.com/docs/en/mcp
- category: ai
  title: claude --from-pr — PR에 묶인 그 작업 세션으로 곧장 되돌아가기
  summary: '`gh pr create`로 PR을 만들면 그때 돌던 세션이 그 PR에 자동으로 연결된다. 나중에 그 PR 작업을 이어가려면 `claude --from-pr <번호>`로 곧장 연결된 세션을 되살리거나, PR URL을 `/resume` 피커 검색창에 붙여 넣어 찾는다. 피커는 GitHub·GitHub Enterprise·GitLab·Bitbucket의 pull/merge request URL을 받아 그에 연결된 세션을 짚어 준다. 디렉터리 단위로 흩어진 여러 세션 중 "어느 게 이 PR 작업이었지?"를 헤매지 않고, PR 하나를 키로 삼아 대화·컨텍스트를 그대로 복원하는 워크플로다.

    '
  points:
  - '`gh pr create`로 PR 생성 시 그 세션이 PR에 자동 연결 — 별도 설정 불필요'
  - '복원: `claude --from-pr <번호>` 또는 `/resume` 피커 검색창에 PR URL 붙여넣기'
  - 피커는 GitHub·GitHub Enterprise·GitLab·Bitbucket의 PR/MR URL을 받아 연결 세션을 찾아줌
  source: https://code.claude.com/docs/en/common-workflows
- category: ai
  title: --json-schema — claude -p 출력을 스키마에 맞춰 받아 스크립트로 바로 파싱
  summary: '`claude -p`를 스크립트에서 쓸 때 자유 텍스트 답을 정규식으로 긁는 대신, 출력 형태를 JSON 스키마로 못박을 수 있다. `--output-format json`에 `--json-schema ''<JSON Schema>''`를 같이 주면, Claude의 구조화된 결과가 응답의 `structured_output` 필드에 그 스키마 형태로 담겨 온다(`result`엔 텍스트, 그 외 session ID·usage 같은 메타데이터도 함께). 예컨대 `{"type":"object","properties":{"functions":{"type":"array","items":{"type":"string"}}},"required":["functions"]}` 스키마를 주고 "auth.py의 함수 이름 뽑아줘"라고 하면, 함수명 배열이 구조화돼 돌아온다. 받은 다음엔 `jq ''.structured_output''`로 그 필드만 꺼내 후속 처리에 넘기면 된다. CI·배치 파이프라인에서 LLM 출력을 안정적으로 소비하기 좋은 방식이다.

    '
  points:
  - '`--output-format json` + `--json-schema ''<스키마>''` → 결과가 응답의 `structured_output` 필드에 스키마 형태로 담김'
  - 응답엔 텍스트(`result`)·session ID·usage 등 메타데이터도 함께 / `jq '.structured_output'`로 해당 필드만 추출
  - 자유 텍스트 파싱(정규식) 대신 형태를 못박아 CI·배치에서 LLM 출력을 안정적으로 소비
  source: https://code.claude.com/docs/en/headless
- category: ai
  title: 멀티에이전트 오케스트레이션 — 리드 에이전트가 서브에이전트에게 일을 쪼개 맡기는 패턴
  summary: 'Anthropic 엔지니어링 블로그가 자사 리서치 기능을 만들며 정리한 ''오케스트레이터-워커'' 패턴이다. 리드 에이전트(LeadResearcher)가 계획을 세워 메모리에 저장하고, 전문 서브에이전트들을 병렬로 띄워 각자 조사하게 한 뒤 결과를 종합하고, 마지막에 CitationAgent가 출처를 붙여 답을 돌려준다. 내부 평가에서 이 멀티에이전트 구성(리드=Opus 4, 서브=Sonnet 4)이 단일 Opus 4 대비 90.2% 더 나은 성능을 냈고, BrowseComp 분석에선 ''토큰 사용량 하나만으로 성능 분산의 80%가 설명''됐다 — 다만 채팅 대비 토큰을 약 15배 더 먹는다. 그래서 만능이 아니라, 병렬화가 잘 되고 단일 컨텍스트를 넘는 정보를 다루며 과제 가치가 높을 때만 값을 한다 — 공유 컨텍스트나 에이전트 간 의존이 많은 일(대부분의 코딩 포함)엔 오히려 안 맞는다고 명시한다.

    '
  points:
  - '구조: 리드가 계획→서브에이전트 병렬 스폰→종합→CitationAgent 출처 부여 / 성능 +90.2%(단일 Opus 4 대비, 내부 평가)'
  - '비용·변수: 채팅 대비 토큰 약 15배 / ''토큰량만으로 성능 분산의 80% 설명'', 토큰+도구호출+모델로 95% 설명'
  - '위임의 핵심: 각 서브에이전트에 목표·출력형식·도구안내·작업경계를 줘야 중복 안 함 / 난이도별 에이전트 수 규칙(단순=1, 비교=2~4, 복잡=10+)'
  - '안 맞는 경우: 공유 컨텍스트·에이전트 간 의존이 많은 일 — 코딩 대부분은 병렬화 가능한 부분이 적어 부적합'
  source: https://www.anthropic.com/engineering/built-multi-agent-research-system
- category: ai
  title: 작성과 리뷰를 분리하라 — 짠 세션 말고 새 세션이 검토해야 하는 이유
  summary: 'Anthropic의 Claude Code 베스트 프랙티스는 ''코드를 짠 맥락''과 ''그 코드를 리뷰하는 맥락''을 일부러 나누라고 권한다. 이유는 편향이다 — 방금 자기가 작성한 코드를 같은 세션이 다시 보면 "맞게 짰다"는 가정에 끌려 결함을 놓치기 쉽다. 그래서 리뷰는 깨끗한 컨텍스트의 별도 서브에이전트에게 맡긴다. 리뷰어는 추론 과정이 아니라 ''결과 diff와 합격 기준''만 보고 판정하므로, 작성자가 못 본 문제를 독립적으로 잡아낸다. 실전에서는 구현 후 "이 변경을 서브에이전트로 리뷰해줘"처럼 별도 패스를 돌리거나, 번들된 `/code-review` 스킬로 현재 diff를 새 서브에이전트가 검토하게 한다 — 무인 실행이 길어질수록 이 독립 검증이 중요해진다.

    '
  points:
  - '원리: 같은 세션은 자기가 쓴 코드에 편향 → 리뷰는 깨끗한 컨텍스트의 별도 서브에이전트로 분리(작성≠검증)'
  - 리뷰어는 추론 말고 '결과 diff + 합격 기준'만 본다 — 그래서 작성자가 놓친 결함을 독립적으로 잡음
  - '실전: `/code-review` 스킬(새 서브에이전트가 현재 diff 검토) 또는 ''PLAN.md 대비 리뷰'' 프롬프트 직접 작성 / 무인 실행일수록 필수'
  source: https://code.claude.com/docs/en/best-practices
- category: ai
  title: Cursor Composer + Claude Code 듀얼 스택 — 도구를 고르지 말고 일로 나눠라
  summary: '2026년 실무에서 굳어진 패턴은 ''Cursor냐 Claude Code냐''가 아니라 둘을 작업 유형으로 라우팅하는 것이다. 두 도구가 스택의 다른 층에 있기 때문이다 — Cursor는 IDE 중심(에디터 안에서 자체 모델 Composer로 빠른 초안·스캐폴딩·리팩터), Claude Code는 터미널/CLI 중심(멀티레포 오케스트레이션, 서브에이전트, CI 자동화, git에 남는 워크플로 산출물). Cursor는 GPT·Claude·Composer를 작업마다 갈아끼우는 ''모델 유연성''을, Claude Code는 단일 최상위 모델에 에이전트 루프를 최적화한 ''깊이''를 준다. 이미 CLAUDE.md·스킬·훅으로 레포에 워크플로를 박아뒀다면 전면 이전 비용이 가장 크다 — 그래서 한쪽으로 갈아타기보다 둘을 함께 쓰는 쪽이 자주 이긴다.

    '
  points:
  - '라우팅: 에디터 안 빠른 초안·스캐폴딩·리팩터 → Cursor / 멀티레포·서브에이전트·CI·git 산출물 → Claude Code'
  - '성격 차이: Cursor는 모델 갈아끼우는 유연성(GPT·Claude·Composer), Claude Code는 단일 모델 깊이(긴 호흡 에이전트 작업)'
  - Composer 2.5 = 2026-05-18 출시, Kimi K2.5 베이스 / CLAUDE.md·스킬·훅 투자분이 있으면 전면 이전 비용이 커 듀얼 스택이 유리
  source: https://cursor.com/blog/composer-2-5
- category: ai
  title: Agent SDK 별도 크레딧 — 2026-06-15부터 claude -p·자동화는 구독 한도와 분리
  summary: '2026년 6월 15일부터 Anthropic은 ''대화형''과 ''프로그래밍 방식'' 사용을 분리한다. Claude Agent SDK, `claude -p`(Claude Code 비대화 모드), Claude Code GitHub Actions, 그리고 구독으로 인증하는 서드파티 앱은 이제 구독 사용 한도가 아니라 ''월별 Agent SDK 크레딧''에서 차감된다 — Pro $20, Max 5x $100, Max 20x $200(전액 API 요금 기준). 반대로 터미널·IDE에서 직접 타이핑하는 ''대화형 Claude Code''는 종전대로 구독 한도를 그대로 쓰며 영향이 없고, API 키로 인증하면 크레딧 없이 기존 종량제가 유지된다. 크레딧이 소진되면 ''사용 크레딧(usage credits)''을 켜둔 경우에만 API 요금으로 계속 돌고, 안 켰으면 다음 주기까지 요청이 멈춘다.

    '
  points:
  - '차감 대상: Agent SDK·`claude -p`·Claude Code GitHub Actions·구독 인증 서드파티 앱 / 월 크레딧 Pro $20·Max 5x $100·Max 20x $200(롤오버 없음, 매월 초기화)'
  - '영향 없음: 대화형 Claude Code(터미널·IDE)는 구독 한도 그대로 / API 키 인증은 종량제 유지(크레딧 미지급)'
  - '소진 후: ''사용 크레딧''을 켰으면 API 요금으로 계속, 안 켰으면 주기 갱신까지 중단 / 크레딧은 1회 신청(opt-in) 후 자동 갱신'
  - '주의: 좌석제 Enterprise의 Standard 좌석은 이 크레딧 신청 불가'
  source: https://support.claude.com/en/articles/15036540-use-the-claude-agent-sdk-with-your-claude-plan
- category: ai
  title: Firecrawl MCP — 에이전트에 '웹 읽기'를 붙이는 가장 인기 있는 MCP 서버
  summary: 'Firecrawl은 자바스크립트 렌더링·페이지네이션·레이트리밋을 대신 처리하고 웹페이지를 깨끗한 마크다운으로 변환해 주는 웹 스크래핑·검색 API다. 공식 MCP 서버(firecrawl-mcp-server, GitHub 6.6k★)를 붙이면 Claude·Cursor·Windsurf 등 MCP 호환 도구에서 에이전트가 직접 웹을 검색하고 긁어올 수 있다. 설치는 별도 빌드 없이 `npx -y firecrawl-mcp` 한 줄에 `FIRECRAWL_API_KEY`만 환경변수로 넣으면 끝 — Claude Desktop은 `claude_desktop_config.json`에 npx 명령으로 등록한다. 단, MCP 서버를 여럿 붙일수록 도구 정의가 컨텍스트를 잡아먹어(데이터DB·파일시스템과 같이 쓰면 7.5만 토큰대) 에이전트 성능이 떨어진다는 점은 감안해야 한다.

    '
  points:
  - '노출 도구: firecrawl_scrape·search·map·crawl·extract와 자율 수집용 firecrawl_agent, 변경 감시용 firecrawl_monitor_* 등'
  - '설치: `env FIRECRAWL_API_KEY=fc-... npx -y firecrawl-mcp` 또는 `npm i -g firecrawl-mcp` — Cursor·Claude Desktop은 npx 명령으로 config 등록'
  - '주의(주장): MCP 도구 정의 자체가 컨텍스트 오버헤드 — 도구가 많을수록 에이전트가 헷갈린다, 필요한 서버만 켜라'
  source: https://github.com/firecrawl/firecrawl-mcp-server
- category: ai
  title: Aider 레포 맵 — 코드베이스 전체를 안 넣고도 LLM에 '뼈대'만 보여주는 법
  summary: 'Aider가 다른 터미널 에이전트와 갈리는 핵심 기술이 ''레포 맵(repo map)''이다. 매 요청마다 전체 코드베이스를 다 넣는 대신, 저장소의 파일 목록과 각 파일의 핵심 심볼(클래스·함수의 시그니처와 정의 한 줄)만 추려 컨텍스트로 보낸다. tree-sitter로 심볼을 파싱하고, 파일을 노드·참조를 엣지로 한 의존성 그래프에 그래프 랭킹(PageRank류)을 돌려 ''가장 많이 참조되는 중요한 심볼''만 골라낸다. 덕분에 LLM은 코드 전체를 안 봐도 API 형태를 파악하고, 더 봐야 할 파일만 콕 집어 요청한다 — 전부 넣어 비용 폭증/혼란을 막는 컨텍스트 엔지니어링의 실전 예다.

    '
  points:
  - 매 요청에 레포 맵 전송 = 파일 목록 + 핵심 심볼 시그니처(정의 한 줄)만, 전체 소스 아님
  - tree-sitter 파싱 → 파일=노드·참조=엣지 그래프에 랭킹 → 토큰 예산 안에서 중요 심볼만 선별
  - 맵 크기는 `--map-tokens`로 조절(기본 1k 토큰), 채팅에 파일 없으면 자동으로 키움 / 부족하면 `/add`로 파일 직접 추가
  source: https://aider.chat/docs/repomap.html
- category: ai
  title: llms.txt — 사이트 문서를 에이전트가 토큰 낭비 없이 읽게 하는 표준
  summary: 'llms.txt는 fast.ai·Answer.AI의 Jeremy Howard가 2024년 9월 3일 제안한 표준으로, 사이트 루트(`/llms.txt`)에 두는 마크다운 파일이다. 사람용 HTML은 내비게이션·CSS·광고가 대부분이라 LLM 컨텍스트 창을 낭비하는데, llms.txt는 핵심 문서로 가는 ''큐레이션된 안내문''만 깔끔히 담아 코딩 에이전트(Cursor·Copilot·Claude 등)가 실시간으로 올바른 페이지를 적은 토큰으로 찾게 한다. 형식이 엄격하다: H1 프로젝트명 1개, 인용블록(`>`)으로 한 줄 요약, 그다음 H2 섹션마다 `[제목](URL): 설명` 형태의 링크 목록. `## Optional` 섹션은 컨텍스트가 빠듯할 때 건너뛰어도 되는 링크를 모으는 자리다.

    '
  points:
  - '위치·이름 고정: 도메인 루트의 `/llms.txt`, 소문자, 유효한 마크다운(파일명 없는 URL은 `index.html.md`로 마크다운 버전 제공)'
  - '구조: H1(프로젝트명) → 인용블록 요약 → H2 섹션별 링크 목록 / `## Optional`은 건너뛰어도 되는 링크'
  - 전문(全文)을 한 파일에 담는 `llms-full.txt` 동반 포맷도 있음 — Mintlify·Vercel·Supabase 등 문서 플랫폼이 기본 생성(Anthropic·Cursor 문서도 보유)
  source: https://llmstxt.org/
- category: ai
  title: 'Agent Teams — 서브에이전트와 뭐가 다른가: 서로 대화하고 일을 나눠 갖는 팀'
  summary: 'Claude Code의 Agent Teams는 여러 Claude 세션을 ''팀''으로 묶어 한 세션이 팀 리드가 되어 작업을 배분·종합하는 실험적 기능이다(환경변수 `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`로 활성화). 서브에이전트와의 핵심 차이는 ''협업''이다. 서브에이전트는 각자 독립 컨텍스트에서 일하고 결과만 리드에게 보고하지만, 팀원들은 서로 직접 메시지를 주고받고 공유 작업 목록(shared task list)을 보며 스스로 조율한다. 그래서 단순히 결과만 필요한 작업엔 서브에이전트가, 토론·상호 반박·조율이 필요한 복잡한 일엔 팀이 적합하다 — 대신 팀원마다 별도 Claude 인스턴스라 토큰 비용이 더 든다. 팀원은 CLAUDE.md·MCP·스킬 같은 프로젝트 컨텍스트는 자동 로드하지만 리드의 대화 기록은 상속하지 않으므로, 스폰 프롬프트에 작업 세부사항을 직접 담아야 한다.

    '
  points:
  - '활성화: `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1` (실험적). 팀원 실행 방식은 `teammateMode`(in-process 등)로 설정, split-pane은 tmux/iTerm2 필요'
  - '고급 운영: 리드가 팀원 계획을 승인/반려하는 plan-approval(''테스트 커버리지 포함한 계획만 승인'' 같은 기준 지정 가능), 파일 충돌은 팀원마다 다른 파일을 맡겨 회피'
  - '활용 패턴: PR 리뷰를 보안·성능·테스트 렌즈로 나눠 동시 검토, 또는 여러 팀원이 서로 가설을 반박하는 ''과학적 토론''식 근본원인 디버깅(앵커링 회피)'
  source: https://code.claude.com/docs/en/agent-teams
- category: ai
  title: Anthropic 내부 팀 활용법 — 코드 안 짜는 팀까지 Claude Code를 쓰는 실전 패턴
  summary: 'Anthropic이 자사 10개 팀(데이터 인프라·보안·제품 엔지니어링·디자인·추론·그로스 마케팅·법무 등)의 Claude Code 실사용 사례를 공개했다. 핵심은 ''코드 생성기''가 아니라 ''사고 파트너''로 쓴다는 것 — 그리고 비개발 직군도 워크플로를 자동화한다. 보안팀은 인시던트 때 스택트레이스+문서를 던져 제어 흐름을 추적해 10~15분 걸리던 이슈를 3배 빠르게 해결하고, 추론팀 비ML 인력은 모델 함수 설명을 받아 리서치 시간을 80% 줄였다. 그로스 마케팅팀은 서브에이전트 2개로 광고 CSV 수백 건을 분류·재생성하는 에이전틱 워크플로를 짰고, 법무팀은 개발 리소스 없이 담당 변호사 라우팅 ''폰 트리''를 프로토타이핑했다.

    '
  points:
  - '범용 패턴: CLAUDE.md로 온보딩 컨텍스트 모으기 / 인시던트에 스택트레이스+문서 투입 / GitHub Actions로 PR 코멘트 코드리뷰 자동화 / write→test→iterate 자율 루프'
  - '검증된 수치(자사 주장): 보안 인시던트 3배 빠른 해결, 추론 리서치 시간 ~80% 단축(1시간→10~20분), 쿠버네티스 장애 진단 20분 절약'
  - 비개발 직군도 사용 — 디자인팀은 Figma 파일을 자율 루프에 넣어 코드·테스트 반복, 마케팅은 광고 변형 최대 100개 자동 생성
  source: https://claude.com/blog/how-anthropic-teams-use-claude-code
- category: ai
  title: Continue(continuedev) — AI Checks 피벗·read-only 보관·CLI 유산(~33.7k★)
  summary: 한때 VS Code·JetBrains·CLI로 성장한 오픈소스 코딩 에이전트 Continue(Apache-2.0·~33.7k★)는 2026년 두 갈래 변화를 겪었다. 첫째, 제품 핵심이 IDE 채팅·자동완성에서 '모든 PR에 AI 검사를 돌리는' AI Checks로 피벗 — `.continue/checks/` 마크다운 하나가 검사 규칙이 되고 GitHub 상태 체크·CI에서 실행된다. 둘째, 메인 레포(continuedev/continue)는 2.0.0 최종 릴리스 후 read-only 보관 — 더 이상 능동 유지보수 없음. CLI(cn)는 모듈형 터미널 에이전트(TUI·헤드리스 `-p`)로 100+ LLM·Ollama 지원했으나 같은 운명. JetBrains는 @continuedev/cli 사용 권장. Roo Code·Zoo Code와 함께 'OSS 에이전트 도입 시 archived 여부'를 PoC 단계에서 확인해야 하는 대표 사례.
  points:
  - AI Checks = `.continue/checks/` 마크다운 → PR마다 자연어 규칙 검사, GitHub 상태 체크·CI 연동
  - 메인 레포 read-only(2.0.0 최종) — 스타·라이선스만 보지 말고 유지보수 상태·포크 경로 확인
  - CLI(cn) = 모듈형 TUI·헤드리스, 100+ LLM·Ollama — 같은 보관 상태, @continuedev/cli 권장
  source: https://docs.continue.dev/
- category: ai
  title: MCP 도구를 코드로 호출하기 — 토큰 150k→2k로 줄인 'Code execution with MCP'
  summary: 'Anthropic이 2025년 11월 공개한 패턴. 에이전트가 MCP 도구를 하나씩 직접 호출하는 대신, MCP 서버를 ''파일시스템 위의 코드 API''로 노출하고 에이전트가 그 API를 호출하는 코드를 직접 작성하게 한다. 도구가 수백~수천 개로 늘면 ① 모든 도구 정의를 미리 로딩하느라 컨텍스트가 터지고 ② 중간 결과가 매번 모델을 거치며 토큰을 잡아먹는데, 이 패턴이 둘 다 해결한다. 도구마다 파일 하나(예: `servers/google-drive/getDocument.ts`)로 두고 에이전트가 필요한 파일만 탐색해 읽는 ''점진적 공개(progressive disclosure)'' 방식이다. 회의록 처리 예시에서 토큰을 150,000 → 2,000으로 줄여 98.7% 절감을 주장한다(Anthropic 측 주장). 단, 에이전트가 생성한 코드를 돌리려면 샌드박스 실행 환경이 필요하다.

    '
  points:
  - MCP 서버를 코드 API로 노출 → 에이전트가 도구를 '호출'이 아니라 '코드로 조합'(루프·조건·에러처리 그대로)
  - 필요한 도구 파일만 읽는 점진적 공개로 컨텍스트 절약 / 중간 결과를 코드 안에서 필터·집계 후 요약만 반환(1만 행 → 5행)
  - 회의록 예시 150k→2k 토큰(98.7% 절감) 주장 / PII를 모델에 안 흘리고 토큰화 가능 / Cloudflare도 'Code Mode'로 동일 결론. 단 샌드박스 실행 환경 필요
  source: https://www.anthropic.com/engineering/code-execution-with-mcp
- category: ai
  title: Aider Polyglot 벤치마크 — Python 점수에 가려진 '편집 포맷' 실력을 6개 언어로 잰다
  summary: 'Aider의 Polyglot 리더보드는 모델이 ''코드를 잘 짜느냐''가 아니라 ''사람 개입 없이 지시를 따라 파일을 제대로 편집하느냐''를 잰다. Exercism에서 가장 어려운 225문제를 C++·Go·Java·JavaScript·Python·Rust 6개 언어로 풀린다. 각 문제는 두 번까지 시도하는데, 1차에서 실패하면 유닛 테스트 결과를 보여주고 스스로 고치게 한다 — 헤드라인 점수(Percent correct)는 이 2차 시도 후 통과율이다. 별도로 ''Percent cases well formed'' 지표가 있어, 모델이 diff/whole 같은 기대 포맷으로 문법에 맞는 편집을 내놓았는지를 정답률과 분리해서 본다(포맷은 맞췄지만 테스트는 틀릴 수 있으므로). 대부분의 LLM이 Python에 편향 학습돼 Python 단일 벤치는 실제 실력을 과대평가하기 쉬운데, 6개 언어 구성이 이 착시를 드러낸다.

    '
  points:
  - '측정 대상: ''코드 생성''이 아니라 ''지시 따라 파일을 자동 편집하는 능력'' — 에이전트형 코딩에 직결'
  - '구성: Exercism 최난도 225문제 × 6개 언어 / 2회 시도(1차 실패 시 테스트 결과 보고 자가 수정)'
  - '두 지표 분리: Percent correct(정답률, 2차 통과 기준) vs Percent cases well formed(편집 포맷 유효성) — 포맷만 맞고 오답일 수 있음'
  source: https://aider.chat/docs/leaderboards/
- category: ai
  title: Claude Code GitHub Action — PR에 @claude 부르면 알아서 고치고 리뷰까지
  summary: 'anthropics/claude-code-action는 Claude Code를 깃허브 액션 안에서 자율 에이전트로 돌리는 공식 액션이다. 이슈나 PR 코멘트에서 `@claude`로 부르면(또는 이슈를 Claude에 배정하면) 코드를 읽고, 변경을 만들고, PR을 올리거나 코멘트로 답한다. 별도 prompt 입력을 주면 멘션 없이도 PR마다 자동 코드리뷰·CI 수정·이슈 분류 같은 워크플로를 돌릴 수 있다. 설치는 Claude Code에서 `/install-github-app`를 실행하면 깃허브 앱과 시크릿까지 안내해 깔아 준다. 에이전트는 사내(자체) 러너에서 실행되고, Anthropic API·Bedrock·Vertex 등 여러 인증 방식을 지원하며 라이선스는 MIT다.

    '
  points:
  - '트리거: PR·이슈에서 @claude 멘션 / 이슈를 Claude에 배정 / prompt 입력으로 자동 실행 — 코드 수정·PR 생성·리뷰 코멘트'
  - '설치: Claude Code에서 /install-github-app 한 줄 — 깃허브 앱과 시크릿 설정까지 안내(레퍼런스 anthropics/claude-code-action@v1)'
  - 자체 GitHub 러너에서 실행, MIT 라이선스(약 8k★). '월 50 PR 기준 API 비용 $5 미만'은 공식 문서의 주장
  source: https://github.com/anthropics/claude-code-action
- category: ai
  title: 멀티에이전트 3-티어 — 인세션·로컬 워크트리·클라우드를 일에 맞게 갈아끼우기
  summary: 'Addy Osmani가 정리한 2026년 멀티에이전트 코딩 도구 지형은 셋업·격리·동시성을 기준으로 3티어로 나뉜다. 티어1은 추가 셋업 없이 한 세션 안에서 도는 Claude Code 서브에이전트·Agent Teams — 상호작용 작업의 출발점. 티어2는 내 머신에서 에이전트마다 별도 git 워크트리를 띄워 충돌 없이 3~10개를 병렬로 굴리는 로컬 오케스트레이션(Conductor·Claude Squad·Vibe Kanban 등). 티어3은 클라우드 VM에서 비동기로 돌려 PR로 받아 보는 도구(Claude Code Web·Copilot Coding Agent·Jules·Codex Web) — 백로그를 밤새 비울 때. 핵심은 ''하나만 고르기''가 아니라 일의 성격에 따라 세 티어를 갈아끼우는 것이며, 동시성은 3~5개가 스위트스폿이고 10개를 넘기면 비용만 늘기 쉽다.

    '
  points:
  - 티어1(제로 셋업)=서브에이전트·Agent Teams / 티어2(로컬 워크트리, 3~10개)=Conductor·Claude Squad·Vibe Kanban / 티어3(클라우드 비동기)=Claude Code Web·Copilot·Jules·Codex Web
  - 격리는 에이전트마다 별도 git 워크트리로 — 머지 충돌 없이 깔끔하게 통합(Conductor 류는 자동 처리)
  - 동시성 스위트스폿 3~5개, 10개 초과는 이득 적고 비용↑ / 품질 게이트(테스트 훅·플랜 승인)와 AGENTS.md로 세션마다 학습 누적
  source: https://addyosmani.com/blog/code-agent-orchestra/
- category: ai
  title: 12-Factor Agents — 믿을 만한 에이전트는 '대부분 그냥 소프트웨어'다
  summary: 'HumanLayer의 Dex(Dexter Horthy)가 정리한, 프로덕션급 LLM 에이전트를 만드는 12가지 원칙(GitHub 23.3k★). 핵심 주장은 "여기 프롬프트, 여기 도구 한 보따리, 목표 칠 때까지 루프"라는 순진한 에이전트 루프는 70~80% 품질에서 막히고, 고객 대면 제품엔 그 80%로는 부족하다는 것 — 잘 도는 에이전트는 사실 ''대부분 결정론적 소프트웨어''에 LLM 단계를 전략적으로 끼워 넣은 형태라고 본다. 그래서 프레임워크에 맡기지 말고 프롬프트·컨텍스트 창·제어 흐름을 직접 소유하고, 실행 상태를 비즈니스 상태와 합쳐 launch/pause/resume 가능한 단순 API로 만들라고 말한다.

    '
  points:
  - '원칙 일부: 프롬프트를 소유하라 / 컨텍스트 창을 소유하라 / 제어 흐름을 소유하라 / 도구는 그냥 ''구조화된 출력''일 뿐'
  - 작고 집중된 에이전트로 쪼개고, 에러는 컨텍스트 창에 압축해 넣고, 사람 호출도 도구 콜로 처리하라
  - 에이전트를 '무상태 리듀서(stateless reducer)'로 만들어 어디서든 트리거·재개 가능하게
  source: https://github.com/humanlayer/12-factor-agents
- category: ai
  title: awesome-claude-code-subagents — 154개 전문 서브에이전트를 플러그인으로 한 번에 까는 컬렉션
  summary: 'VoltAgent가 큐레이션하는 Claude Code 서브에이전트 모음으로, 154개 이상의 특화 에이전트를 10개 카테고리(Core Development, Language Specialists, Infrastructure, Quality 등)로 분류해 둔다. api-designer·backend-developer·typescript-pro·swift-expert처럼 역할별로 시스템 프롬프트가 미리 짜여 있어, 직접 에이전트를 정의하지 않고도 도메인 전문가를 골라 쓸 수 있다. Claude Code 플러그인 마켓플레이스로 카테고리 단위 설치가 되고, 수동으로 .claude/agents/에 파일을 복사해도 된다. GitHub 21.8k★(주장, 2026-06 기준).

    '
  points:
  - '설치: claude plugin marketplace add VoltAgent/awesome-claude-code-subagents 후 voltagent-lang 같은 카테고리 플러그인 install — 또는 에이전트 .md를 ~/.claude/agents/(전역)·.claude/agents/(프로젝트)에 복사'
  - '10개 카테고리·154+ 에이전트: 언어별(typescript-pro/swift-expert), 인프라, 품질, 메타-오케스트레이션 등 — 09-meta의 agent-installer로 ''PHP 에이전트 찾아 설치해줘''식 자연어 설치도 지원'
  - 서브에이전트 = 별도 컨텍스트 창에서 도는 전문 일꾼. 직접 system prompt를 작성하는 대신 검증된 역할 정의를 가져다 쓰는 게 핵심 이점
  source: https://github.com/VoltAgent/awesome-claude-code-subagents
- category: ai
  title: Cursor 공식 에이전트 활용법 — 한 프롬프트를 여러 모델에 동시에 던지고 제일 나은 답을 고르기
  summary: 'Cursor가 공식 블로그에 정리한 ''에이전트로 코딩하는 베스트 프랙티스''다. 가장 임팩트 큰 변화로 꼽는 건 ''코드부터 짜지 말고 계획부터'' — 숙련 개발자일수록 생성 전에 플랜을 먼저 만든다고 본다. Plan Mode(Shift+Tab)로 에이전트가 코드를 조사하고 질문한 뒤 승인 대기하는 계획을 세우게 하고, 그 플랜은 .cursor/plans/에 저장해 둔다. 병렬 작업에서는 워크트리로 각 에이전트의 파일을 격리하고, 같은 프롬프트를 여러 모델에 동시에 돌려 가장 좋은 결과를 고르게 하는 패턴을 권한다.

    '
  points:
  - '계획 우선: Plan Mode(Shift+Tab)로 조사→질문→승인 대기 계획을 만들고 .cursor/plans/에 저장. Cursor는 ''계획을 먼저 세우는 것''을 가장 임팩트 큰 변화로 꼽음 — 막 코드부터 짜는 대신 큰 변경엔 아키텍처 다이어그램까지 붙이라고 권장'
  - '여러 모델 동시 실행: 같은 프롬프트를 여러 모델에 한 번에 돌리고 Cursor가 가장 나은 결과를 제안 — ''경쟁시켜 최종 출력 품질을 높이는'' 패턴. 병렬 에이전트는 네이티브 워크트리로 파일 충돌 없이 격리'
  - '그 외: 잘못 들어가면 @Branch로 컨텍스트 되돌리기, 백로그성 작업은 클라우드 에이전트(@Cursor)로 원격 샌드박스 실행, Debug Mode는 가설→로깅→런타임 데이터 수집으로 레이스컨디션·성능·회귀에 강함'
  source: https://cursor.com/blog/agent-best-practices
- category: ai
  title: 대형 코드베이스에서 Claude Code — CLAUDE.md를 루트가 아니라 하위 디렉터리에 두라
  summary: 'Anthropic이 모노레포·레거시·마이크로서비스 같은 대형 코드베이스 운영 패턴을 공식 정리했다. Claude Code는 인덱스(RAG/임베딩) 없이 파일을 직접 traverse하고 grep하는 ''에이전틱 검색''으로 도므로, ''어디를 봐야 할지'' 알려 주는 시작 컨텍스트의 품질이 성능을 좌우한다. 가장 실용적인 조언은 CLAUDE.md를 레포 루트에 몰아넣지 말고 하위 디렉터리에 두라는 것 — Claude가 현재 위치에서 디렉터리 트리를 거슬러 올라가며 만나는 모든 CLAUDE.md를 누적해 읽기 때문에 루트 컨텍스트는 사라지지 않는다. 또 모델이 바뀌면 옛 지침이 새 모델을 오히려 방해할 수 있어 주기적으로 설정을 재검토하라고 권한다.

    '
  points:
  - 'CLAUDE.md는 얇게·계층적으로: 루트엔 ''포인터와 치명적 함정''만, 세부 규칙은 하위 디렉터리 CLAUDE.md에. 초기화도 루트가 아니라 하위 디렉터리에서 — 트리를 거슬러 올라가며 누적 로딩되므로 루트 컨텍스트는 유지됨'
  - '탐색을 좁혀라: 테스트·린트 명령은 디렉터리별로 스코프(타임아웃·컨텍스트 낭비 방지), 빌드 산출물·서드파티 코드는 검색에서 제외, 구조가 자명하지 않으면 폴더별 한 줄 설명을 적은 ''코드베이스 맵'' 마크다운을 추가해 에이전틱 검색의 출발점을 만든다'
  - '유지보수: 한 모델용으로 쓴 워크어라운드 지침이 다음 모델을 오히려 제약할 수 있으니 곧 obsolete로 보고 주기적으로 리뷰. 검색·읽기는 read-only 서브에이전트에, 편집은 메인 에이전트에 분리 (출처: Anthropic 블로그, 2026-05-14)'
  source: https://claude.com/blog/how-claude-code-works-in-large-codebases-best-practices-and-where-to-start
- category: ai
  title: SWE-EVO — '단일 이슈'를 넘어 코드베이스를 여러 번 진화시키는 장기 과제 벤치마크
  summary: 'SWE-bench Verified가 최상위 모델들로 포화(Opus 4.8 88%대)되자, 연구자들은 실무에 더 가까운 ''장기(long-horizon) 소프트웨어 진화''를 재는 SWE-EVO를 내놨다. 성숙한 오픈소스 파이썬 프로젝트 7개의 릴리스 노트에서 뽑은 48개 과제로, 과제 하나가 평균 21개 파일에 걸친 다단계 변경을 요구하고 인스턴스당 평균 874개 테스트로 검증된다. 결과는 냉정하다 — OpenHands+GPT-5.4 조합이 25%밖에 못 풀었고, 같은 계열 GPT-5.2가 SWE-bench Verified에서 72.8%를 받던 것과 극명히 대비된다. "이슈 하나→패치 하나"가 아니라 "여러 파일을 조율해 코드베이스를 진화시키기"가 진짜 병목임을 보여 준다.

    '
  points:
  - '구조 차이: SWE-bench는 깃 이슈 1개를 해결해 패치 1개를 내는 격리된 과제. SWE-EVO는 릴리스 노트 기반으로 다파일·다단계 진화를 요구 — 평균 21개 파일 수정, 인스턴스당 ~874개 테스트로 검증'
  - '점수 급락: 같은 기반 모델이라도 SWE-bench Verified 72.8%(GPT-5.2) → SWE-EVO 22.92%로 추락. 최고 성적도 GPT-5.4+OpenHands의 25% 수준 — 장기·복잡 과제에서 현 에이전트의 한계가 그대로 드러남'
  - '시사점: Verified 고득점을 ''실무 준비 완료''로 읽으면 안 된다. 벤치마크 포화는 곧 ''다음 난도''를 만들고, 실제 병목은 단발 버그픽스가 아니라 여러 반복에 걸친 코드베이스 진화 (출처: arXiv 2512.18470, 48 tasks/7 projects)'
  source: https://arxiv.org/abs/2512.18470
- category: ai
  title: 'SuperClaude — /sc: 명령·에이전트·모드를 주입해 Claude Code를 ''개발 플랫폼''으로 바꾸는 프레임워크'
  summary: 'SuperClaude는 Claude Code의 코드를 고치지 않고 행동 지침(behavioral instruction)을 주입해 구조화된 개발 워크플로를 얹는 오픈소스 프레임워크다(현재 기준 GitHub 약 2.3만 ★, MIT, Anthropic 비공식). 핵심은 `/sc:` 접두사로 붙는 슬래시 명령 모음 — 구현·분석·문서화 같은 작업을 명령 하나로 트리거하고, 그에 맞는 전문 에이전트와 ''행동 모드''가 함께 활성화된다. 구성은 30여 개 명령, 20여 개 전문 에이전트, 7개 행동 모드(브레인스토밍·태스크 관리 등), 그리고 Context7·Sequential 등 6~8종 MCP 서버 연동. 설치는 파이썬 쪽 pipx/PyPI(`SuperClaude install`) 또는 npm으로 한다. 같은 ''스킬 묶음'' 계열인 Superpowers와 달리, 명령·에이전트·모드를 하나의 네임스페이스(/sc:)로 패키징한 점이 차별점이다.

    '
  points:
  - '동작 방식: Claude Code 본체 수정 없이 행동 지침을 주입 — `/sc:` 접두 명령으로 작업을 트리거하면 해당 전문 에이전트+행동 모드가 함께 켜짐'
  - '구성(저장소 명시): 명령 ~30개, 전문 에이전트 ~20개, 행동 모드 7개, MCP 서버 6~8종(Context7·Sequential 등) / MIT·Anthropic 비공식'
  - '설치: pipx 또는 PyPI(`SuperClaude install`), npm 경로도 제공 / Superpowers와 차이는 명령·에이전트·모드를 /sc: 네임스페이스로 일괄 패키징한 점 (별 수는 현재 기준·변동)'
  source: https://github.com/SuperClaude-Org/SuperClaude_Framework
- category: ai
  title: Claude Code 공식 플러그인 마켓플레이스 — 개발자가 실제로 가장 많이 까는 8개
  summary: 'Claude Code에는 `claude-plugins-official` 마켓플레이스가 내장돼 있고, `/plugin`으로 둘러보거나 claude.com/plugins 공개 디렉터리에서 설치 수를 확인할 수 있다. 플러그인은 ''배포 단위''이고 스킬·MCP 서버·서브에이전트·훅을 묶을 수 있는 그릇 — 설치하는 건 플러그인, 쓰는 건 그 안의 스킬이다. 공개 디렉터리 기준 설치 수 상위는 Frontend Design(약 90만), Superpowers(약 82만), Code Review(약 37만), Context7(약 37만), Skill Creator(약 31만), Code Simplifier(약 30만), GitHub(약 28만), Playwright(약 27만) 순이다(수치는 변동·증가 중인 주장). Frontend Design는 프로덕션급 프런트엔드 제작, Superpowers는 브레인스토밍·디버깅·TDD·스킬 작성 워크플로를 얹는 묶음이다.

    '
  points:
  - 내장 마켓플레이스 `claude-plugins-official` — `/plugin`으로 탐색·설치, 공개 디렉터리는 claude.com/plugins (설치 수 공개)
  - '설치 수 상위(공개 디렉터리 기준·증가 중 주장): Frontend Design ~90만, Superpowers ~82만, Code Review ~37만, Context7 ~37만, Skill Creator ~31만, Code Simplifier ~30만, GitHub ~28만, Playwright ~27만'
  - 플러그인=배포 단위(스킬·MCP·서브에이전트·훅을 묶음), 스킬=실제 쓰는 내용 — 과적재(훅+MCP+스킬 중첩)는 체감 속도를 떨어뜨리니 주의
  source: https://claude.com/plugins
- category: ai
  title: SWE-Perf — '버그 수정' 말고 '성능 최적화'를 재는 첫 저장소급 벤치마크
  summary: 'SWE-bench류 벤치마크는 대부분 ''GitHub 이슈를 고쳐 테스트를 통과시키는가''(정확성)를 잰다. SWE-Perf는 결이 다르다 — 실제 코드를 더 빠르게 만드는 능력, 즉 성능 최적화를 잰다. 인기 Python 저장소 9개에서 실제로 실행 속도를 개선한 PR들을 모아 만들었고, 10만 건이 넘는 PR(102,241건)을 필터링해 140개의 검증된 과제로 추렸다. 과제는 ''버그를 안 만들면서 테스트 실행 시간을 줄이는 패치''를 저장소 전체 맥락에서 생성하는 것이다. 결과적으로 현재 최고 AI 모델과 사람 전문가 사이에 성능 개선 격차가 남아 있어, 정확성 벤치마크가 포화돼도 ''빠르게 만들기''는 아직 사람이 앞선다는 신호다.

    '
  points:
  - 정확성(버그 고치기)이 아니라 성능(코드를 더 빠르게)을 재는 첫 저장소급 벤치마크 — 스니펫이 아닌 코드베이스 전체 맥락에서 동작
  - '구성(프로젝트 페이지 주장): Python 저장소 9개, PR 102,241건을 필터링해 140개 인스턴스, 각 인스턴스는 실제 성능 개선 PR 기반'
  - 최고 AI 모델 vs 사람 전문가 사이 성능 개선 격차(약 8.59%p 주장)가 남음 — 정확성은 포화돼도 최적화는 여전히 난제
  source: https://swe-perf.github.io/
- category: ai
  title: Dynamic Workflows(ultracode) — Claude가 직접 스크립트를 짜서 서브에이전트 수십~수백 개를 굴리는 법
  summary: 'Dynamic workflow는 Claude가 작업 설명을 받아 직접 짜는 JavaScript 오케스트레이션 스크립트다. 런타임이 백그라운드에서 돌리는 동안 본 세션은 계속 응답 가능하며, 서브에이전트/스킬과 달리 루프·분기·중간 결과를 스크립트 변수에 담아 Claude 컨텍스트에는 최종 답만 남긴다. Anthropic 공식 사례로 Bun 제작자 Jarred Sumner가 ultracode로 Zig→Rust 75만 줄 포팅을 11일 만에 완료했다 — Rust 테스트 99.8% 통과, 파일마다 리뷰어 2명이 병렬 검수. 3단계는 ①struct 필드별 Rust lifetime 매핑 → ②.zig→.rs 동작동일 포팅 → ③rustc 진단 루프. 켜는 법: 프롬프트에 ultracode 키워드 또는 /effort ultracode.'
  points:
  - '요건: v2.1.154+ · 유료 플랜. 동시 에이전트 최대 16개, 런당 총 1,000개 상한'
  - '공식 사례: Bun Zig→Rust ~75만 줄, 테스트 99.8% 통과, 11일·파일당 리뷰어 2명(2026-05-28)'
  - 스크립트는 ~/.claude/projects/에 저장 → /workflows에서 진행·일시정지·/<이름>으로 재사용
  source: https://code.claude.com/docs/en/workflows
- category: ai
  title: /context — 200k 컨텍스트가 어디로 새는지 한눈에 보고 막는 진단 명령
  summary: '에이전트 성능이 떨어지는 흔한 원인은 모델이 아니라 컨텍스트 창이 잡동사니로 꽉 찬 것이다. Claude Code의 `/context`는 시스템 프롬프트·기본 도구·MCP 도구·메모리(CLAUDE.md)·스킬·대화 기록·남은 공간이 각각 토큰을 얼마나 먹는지 분해해서 보여준다. 공식 비용 문서도 "무엇이 공간을 잡아먹는지 보려면 `/context`를 실행하라"고 안내한다. 과거엔 MCP 서버가 컨텍스트의 절반을 먹는다는 사례가 많았는데, 지금은 MCP 도구 정의가 기본적으로 ''지연 로딩''이라 실제로 쓰기 전까진 도구 이름만 들어간다. 그래도 안 쓰는 서버는 `/mcp`로 끄는 게 좋고, 공식 문서는 MCP보다 `gh`·`aws`·`gcloud` 같은 CLI를 쓰면 도구 목록이 컨텍스트에 안 쌓인다고 권한다. 실무 처방은 단순하다. `/context`로 범인을 찾고 → 안 쓰는 MCP를 끄고 → CLAUDE.md는 핵심만 200줄 이내로 → 남은 공간이 줄면 `/compact`나 새 세션으로 정리. 토큰을 아끼는 게 아니라 모델이 집중할 ''깨끗한 작업 공간''을 지키는 일이다.

    '
  points:
  - '`/context`: 시스템·도구·MCP·메모리·대화별 토큰 점유율을 분해 — 공식 비용 문서가 진단 도구로 안내'
  - MCP 도구 정의는 기본 지연 로딩(쓰기 전엔 이름만) — 그래도 안 쓰는 서버는 `/mcp`로 끄고, CLI(gh·aws)는 목록을 안 쌓아 더 가벼움
  - '처방: 범인 찾기→불필요 MCP off→CLAUDE.md 200줄 이내→공간 줄면 /compact·새 세션'
  source: https://code.claude.com/docs/en/costs
- category: ai
  title: UI UX Pro Max — '디자인 안목'을 스킬로 주입해 매번 비슷한 AI 화면을 벗어나기
  summary: 'AI에 UI를 맡기면 어디서 본 듯한 보라색 그라데이션·똑같은 카드 레이아웃이 반복되는 게 흔한 불만이다. UI UX Pro Max는 이 ''디자인 안목 부재''를 메우는 오픈소스(MIT) Claude Code 스킬로, 프로젝트 요구사항을 분석해 제품 유형에 맞는 디자인 시스템(스타일·색·타이포·간격·접근성)을 자동으로 골라준다. README 기준 67가지 UI 스타일(글래스모피즘·브루탈리즘·벤토 그리드 등), 161개 산업별 컬러 팔레트, 57개 폰트 페어링, 25종 차트, 15개 기술 스택(React·Next·Vue·SwiftUI·Flutter 등), 99개 UX 가이드라인, 161개 추론 규칙을 내장한다. 요청이 오면 제품 유형·스타일·팔레트·패턴·타이포를 병렬 검색하고, 업종에 안 맞는 ''안티패턴''을 걸러낸 뒤 코드로 뽑는 식이다. 설치는 Claude Code에서 `/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill` 후 `/plugin install`. 단, 떠도는 스타/설치 수치는 출처마다 8만~19만으로 들쭉날쭉하니 ''인기 지표''는 걸러 보고, 핵심은 검증된 기능 범위로 판단하라.

    '
  points:
  - 제품 유형→스타일·팔레트·폰트·패턴을 병렬 매칭하고 업종 부적합 안티패턴을 걸러 코드 생성 (MIT 오픈소스)
  - 'README 명시: 67 스타일·161 팔레트·57 폰트쌍·25 차트·15 스택·99 UX 규칙·161 추론 규칙'
  - '설치: `/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill` → `/plugin install` · 떠도는 별·설치수는 편차 커서 신뢰 말 것'
  source: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
- category: ai
  title: wshobson/agents — 에이전트·스킬·커맨드를 여러 도구에 한 번에 까는 멀티하네스 마켓플레이스
  summary: 'Claude Code뿐 아니라 Codex CLI·Cursor·OpenCode·GitHub Copilot·Gemini CLI까지 같은 에이전트 구성을 공유하려는 시도가 wshobson/agents다. 도메인 전문가 서브에이전트, 스킬, 슬래시 커맨드를 ''플러그인'' 단위로 묶어, 한 소스에서 여러 하네스로 배포한다. 특정 도구에 종속되지 않고 팀이 쓰는 에이전트 자산을 한곳에서 버전 관리하려는 사람에게 맞는다. README 기준 플러그인 84개, 에이전트 192개, 스킬 156개를 제공하며 라이선스는 MIT다. 작업 난이도에 따라 모델 티어를 갈아끼우는 라우팅도 포함한다.

    '
  points:
  - 1개 소스 → Claude Code·Codex CLI·Cursor·OpenCode·GitHub Copilot·Gemini CLI 6개 하네스로 같은 구성 배포 (MIT)
  - 'README 명시: 플러그인 84개·에이전트 192개·스킬 156개 — 도메인 전문가 단위로 묶어 제공'
  - 작업 난이도별 모델 티어 라우팅 내장 — 도구 락인 없이 팀 에이전트 자산을 한곳에서 버전 관리
  source: https://github.com/wshobson/agents
- category: ai
  title: 공식 MCP 레지스트리 — 흩어진 MCP 서버를 한 API로 찾는 '소스 오브 트루스'
  summary: 'MCP 서버가 폭증하면서 ''어디서 신뢰할 만한 서버를 찾나''가 문제가 됐다. 그 답이 2025-09-08 프리뷰로 공개된 공식 MCP 레지스트리다. registry.modelcontextprotocol.io에서 공개 MCP 서버의 메타데이터(엔드포인트·기능·버전)를 한곳에 모아 REST API로 검색하게 한다. 기존 레지스트리(클라이언트별 마켓플레이스 등)를 대체하지 않고 그 위에 쌓이는 ''업스트림 단일 출처'' 역할이다. 클라이언트는 여기서 받아 자기만의 서브레지스트리로 가공하고, 사내용 비공개 서브레지스트리도 같은 스키마로 운영할 수 있다. MCP 오픈소스 커뮤니티 소유로 Anthropic·GitHub·PulseMCP·Microsoft·Block 등이 참여한다. 단, 아직 GA가 아닌 프리뷰라 데이터 리셋·호환성 깨짐 가능성이 명시돼 있어 프로덕션 의존은 주의해야 한다.

    '
  points:
  - '검색: curl "https://registry.modelcontextprotocol.io/v0/servers?limit=10" — 서버 목록을 REST API로 조회'
  - 기존 레지스트리 대체 아님 — 업스트림 단일 출처, 공개·사내 서브레지스트리가 같은 스키마로 위에 쌓임
  - MCP 커뮤니티 소유(Anthropic·GitHub·PulseMCP·Microsoft·Block 등 참여), 레포 약 6.9k★ — 단 아직 프리뷰(데이터 리셋·breaking change 가능)
  source: https://blog.modelcontextprotocol.io/posts/2025-09-08-mcp-registry-preview/
- category: ai
  title: Zed Parallel Agents — 한 창에서 에이전트 여러 개를 동시에 굴리는 첫 에디터
  summary: 'Zed는 Rust로 새로 짠 GPU 렌더링 오픈소스 에디터(에디터는 GPL, GPUI 프레임워크는 Apache/MIT)다. 2026-04-22 ''Parallel Agents''를 내놓으며 한 창에서 여러 에이전트를 동시에 오케스트레이션하는 기능을 공식 지원했다. 새 Threads Sidebar가 모든 스레드를 프로젝트별로 묶어 보여주고, 스레드마다 어떤 폴더·레포에 접근할지 통제한다. 스레드별로 다른 에이전트를 섞어 쓸 수 있고, 한 스레드가 여러 레포를 가로질러 읽고 쓰게 하거나, 실행 중인 스레드를 모니터링·중단할 수 있다. 원할 때 스레드마다 워크트리를 격리하는 것도 선택 가능하다. 외부 에이전트는 ACP(Agent Client Protocol)로 붙는데, Claude Code·Codex·Gemini CLI를 그대로 연결할 수 있다. 자기 API 키를 쓰는 AI 기능은 무료이며, 자체 오픈소스 보완 모델 Zeta도 제공한다.

    '
  points:
  - 2026-04-22 Parallel Agents — 한 창에서 여러 에이전트 동시 실행, Threads Sidebar로 프로젝트별 묶음·접근 레포 통제(opt-cmd-j)
  - 스레드별로 에이전트 갈아끼우기·워크트리 격리 선택 가능, 한 스레드가 여러 레포 가로질러 읽기·쓰기
  - ACP로 Claude Code·Codex·Gemini CLI 연결, 자기 키 쓰면 AI 무료 — 에디터는 GPL 오픈소스(Zed·Zeta·ACP 공개)
  source: https://zed.dev/blog/parallel-agents
- category: ai
  title: openskills — Claude Code 스킬을 Cursor·Codex·Aider까지 그대로 쓰게 해주는 범용 로더
  summary: 'openskills는 Anthropic의 SKILL.md 스킬 시스템을 Claude Code 밖의 다른 에이전트에서도 쓰게 해주는 CLI 도구다(Apache 2.0, GitHub 10.4k★, TypeScript). 핵심은 "범용 SKILL.md 설치기" — 스킬을 받아 `AGENTS.md`에 Claude Code와 똑같은 `<available_skills>` XML 포맷으로 박아 넣어, AGENTS.md를 읽는 모든 호환 에이전트가 같은 스킬을 쓰게 만든다. 지원 대상은 Claude Code·Cursor·Windsurf·Aider·Codex 등이고, `npm i -g openskills` 후 `npx openskills install anthropics/skills`로 공식 스킬 모음을 한 번에 깔 수 있다. Claude Code의 점진적 공개(progressive disclosure) 방식을 그대로 따라 평소엔 이름·설명만 로드하고 필요할 때만 본문을 읽으므로, 여러 도구를 오가며 작업하는 팀이 스킬 자산을 한 벌로 공유하기 좋다. Anthropic 비공식 프로젝트다.

    '
  points:
  - SKILL.md를 AGENTS.md의 <available_skills> XML로 변환 — Cursor·Windsurf·Aider·Codex 등 AGENTS.md 읽는 에이전트가 공유
  - '설치: npm i -g openskills → npx openskills install anthropics/skills / npx openskills sync (Apache 2.0, 10.4k★)'
  - 점진적 공개 유지 — 평소 이름·설명만, 필요 시 본문만 로드 / Anthropic 비공식
  source: https://github.com/numman-ali/openskills
- category: ai
  title: Memory Bank — 세션이 바뀌어도 프로젝트 맥락을 잃지 않게 하는 마크다운 메모리 패턴
  summary: 'Memory Bank는 에이전트가 세션·컨텍스트 리셋을 넘어 프로젝트 맥락을 유지하도록, 핵심 정보를 프로젝트 루트의 구조화된 마크다운 파일 묶음으로 외부화하는 패턴이다. 에이전트는 매 세션 시작 때 이 파일들을 먼저 읽어 ''소스 오브 트루스''로 삼아, 불완전한 이해에서 나오는 잘못된 가정을 막는다. RooCode 구현(GreatScottyMac/roo-code-memory-bank)은 `memory-bank/` 디렉터리에 다섯 개 코어 파일을 둔다 — activeContext.md(현재 목표·세션 상태), decisionLog.md(아키텍처 결정과 근거), productContext.md(상위 프로젝트 맥락), progress.md(완료 작업), systemPatterns.md(코딩 패턴). 루트의 projectBrief.md는 초기화 시 즉시 맥락을 준다. Cline·RooCode·KiloCode·Cursor가 비슷한 방식을 쓰며, 핵심은 프롬프트(휘발성)가 아니라 대화 밖에 존재하는 영속 메모리라는 점이다. Claude Code의 MEMORY.md와 같은 계열의 발상이다.

    '
  points:
  - 맥락을 프로젝트 루트 마크다운으로 외부화 → 세션·리셋을 넘어 유지, 매 세션 시작 시 먼저 읽어 가정 오류 방지
  - 'RooCode 코어 5종: activeContext / decisionLog / productContext / progress / systemPatterns + 루트 projectBrief'
  - Cline·RooCode·KiloCode·Cursor 공통 패턴 — 프롬프트(휘발) 아닌 대화 밖 영속 메모리 / Claude Code MEMORY.md와 동류
  source: https://github.com/GreatScottyMac/roo-code-memory-bank
- category: ai
  title: Windsurf Cascade Workflows — 반복 작업을 .md 레시피로 만들어 /슬래시로 부르기
  summary: 'Windsurf(VS Code 포크, Codeium이 만들고 2025년 12월 Devin 제작사 Cognition이 인수)의 에이전트 모드 Cascade에는 ''Workflows''가 있다. 배포·PR 코멘트 대응처럼 반복되는 멀티스텝 작업을 마크다운(.md) 파일 하나에 제목·설명·단계 시퀀스로 정의해 두고, `/[워크플로명]` 슬래시 커맨드로 호출하는 기능이다. 에이전트가 알아서 부르지 않는 ''수동 전용(manual-only)''이라 의도치 않은 실행이 없고, 파일당 12,000자 제한이며 워크플로 안에서 다른 워크플로를 호출할 수도 있다. 저장 위치는 워크스페이스(`.windsurf/workflows/*.md`)와 글로벌(`~/.codeium/windsurf/global_workflows/*.md`)로 나뉘어, 레포에 커밋해 팀과 버전관리하며 공유할 수 있다. Claude Code의 슬래시 커맨드, Windsurf 자체 Workflow와 같은 계열의 ''반복 작업 재사용'' 패턴이다.

    '
  points:
  - 반복 멀티스텝(배포·PR 대응)을 .md 한 파일에 제목·설명·단계로 정의 → `/워크플로명`으로 호출
  - 수동 전용(에이전트가 자동 호출 안 함) / 파일당 12,000자 / 워크플로가 다른 워크플로 호출 가능
  - 워크스페이스 `.windsurf/workflows/*.md`는 레포 커밋으로 팀 공유·버전관리, 글로벌은 `~/.codeium/...`
  source: https://docs.devin.ai/desktop/cascade/workflows
- category: ai
  title: Cursor 규칙(.mdc) — 한 덩어리 지침을 '언제 켤지'로 쪼개 토큰 아끼기
  summary: 'Cursor의 프로젝트 규칙은 `.cursor/rules/*.mdc` 파일로 둔다(확장자가 `.mdc`여야 함 — 프런트매터가 없는 `.md`는 무시됨). 핵심은 AGENTS.md·CLAUDE.md처럼 모든 세션에 통째로 들어가는 게 아니라, 프런트매터 3필드(`description`·`globs`·`alwaysApply`) 조합으로 ''언제 끌어올지''를 규칙마다 따로 정한다는 점이다. 활성 방식은 네 가지: ① Always(`alwaysApply:true`) 매 세션 포함 ② Auto Attached(`globs` 매칭 파일이 컨텍스트에 들어올 때만) ③ Agent Requested(`description` 보고 에이전트가 필요하다 판단하면) ④ Manual(`@규칙명`으로 직접 부를 때만). 덕분에 "테스트 파일 만질 때만 보는 규칙"을 평소 컨텍스트에서 빼둘 수 있어, 거대한 단일 규칙 파일이 매번 토큰을 먹는 문제를 피한다. 우선순위는 Team → Project → User 순으로 병합되며 앞쪽이 충돌 시 이긴다.

    '
  points:
  - '`.cursor/rules/*.mdc`(버전관리), 프런트매터 `description`·`globs`·`alwaysApply` 조합으로 적용 시점 결정 — `.md`는 무시'
  - '4가지: Always / Auto Attached(globs 매칭) / Agent Requested(description 판단) / Manual(@멘션)'
  - globs로 '특정 파일 만질 때만' 켜서 평소 컨텍스트 절약 / 우선순위 Team→Project→User
  source: https://cursor.com/docs/context/rules
- category: ai
  title: Cline 서브에이전트 — 메인 에이전트의 컨텍스트를 지키는 '읽기 전용 탐색대'
  summary: 'Cline(VS Code 오픈소스 에이전트)이 추가한 서브에이전트는, 메인 에이전트가 명시적으로 시킬 때 띄우는 병렬 탐색 에이전트다. 각 서브에이전트는 자기만의 컨텍스트 창을 가지고 코드베이스를 독립적으로 뒤진 뒤, 결과 요약만 메인 에이전트에게 돌려준다. 핵심 설계는 ''읽기 전용''이다. 서브에이전트는 프로젝트 파일을 읽을 수만 있고, 파일을 쓰거나 파괴적 명령을 실행하거나 MCP 서버에 접근할 수 없다. 그래서 메인 에이전트의 컨텍스트를 광범위한 정보 수집으로 더럽히지 않으면서, 교차 관심사 추적이나 영향 범위 조사 같은 탐색 작업을 여러 갈래로 동시에 돌릴 수 있다. 이는 Claude Code의 서브에이전트와 같은 발상(컨텍스트 격리 + 분업)이지만, 쓰기 권한을 아예 빼서 ''탐색 전용''으로 좁힌 점이 다르다. 무거운 조사는 서브에이전트에게 넘기고 메인 컨텍스트는 실제 작업에 남겨 두는 운용이 가능하다.

    '
  points:
  - 메인 에이전트가 명시적으로 띄우는 병렬 탐색 에이전트 — 각자 별도 컨텍스트 창을 가짐
  - '읽기 전용: 파일 읽기만 가능, 쓰기·파괴적 명령·MCP 접근 불가 → 결과 요약만 메인에 반환'
  - 컨텍스트 격리로 메인 창을 깨끗이 유지 / 교차 관심사·영향 범위 조사를 여러 갈래 병렬로
  source: https://docs.cline.bot/features/subagents
- category: ai
  title: Pydantic AI — 'FastAPI 느낌'으로 타입 안전하게 짜는 모델-비종속 에이전트 프레임워크
  summary: 'Pydantic AI는 Pydantic 검증 라이브러리를 만든 팀이 내놓은 파이썬 에이전트 프레임워크다. README는 스스로를 "프로덕션급 GenAI 애플리케이션을 빠르고 자신 있게 짜도록 돕는" 프레임워크라 소개하며, 목표는 웹 개발의 FastAPI가 주던 ''이게 되네'' 하는 개발 경험을 LLM 앱에 가져오는 것이다. 핵심은 타입 안전성이다. 에이전트의 입력·도구·출력을 Pydantic 모델로 정의하면 LLM 응답이 그 스키마에 맞게 검증되고, 안 맞으면 모델에 자동 재요청한다. 덕분에 "문자열 받아서 파싱하다 터지는" 흔한 실패가 컴파일 타임 가까이로 당겨진다. 모델에도 안 묶여서 OpenAI·Anthropic·Gemini·DeepSeek 등을 같은 코드로 갈아끼울 수 있고, 타입 안전한 의존성 주입, MCP/A2A 연동, Logfire(OpenTelemetry) 관측이 기본 제공된다. 코딩 에이전트를 ''쓰는'' 도구가 아니라 ''만드는'' 토대라서, 사내 자동화나 커스텀 에이전트를 직접 구축할 때 LangChain의 대안으로 자주 거론된다. MIT 라이선스, 약 17.8k★.

    '
  points:
  - Pydantic 팀의 파이썬 에이전트 프레임워크 — 입력·도구·출력을 Pydantic 모델로 정의하고 LLM 응답을 스키마 검증(안 맞으면 자동 재요청)
  - '모델 비종속: OpenAI·Anthropic·Gemini·DeepSeek 등을 같은 코드로 교체 / 타입 안전 의존성 주입 + Logfire 관측 기본'
  - 에이전트를 '쓰는' 게 아니라 '만드는' 토대 — MIT, 약 17.8k★ (수치는 레포 주장)
  source: https://github.com/pydantic/pydantic-ai
- category: ai
  title: Aider 아키텍트 모드 — 비싼 모델로 '계획', 싼 모델로 '편집' 둘로 쪼개기
  summary: 'Aider(터미널 기반 오픈소스 페어 프로그래밍 도구)의 아키텍트 모드는 한 요청을 두 모델로 분업시킨다. 공식 문서에 따르면 메인 모델(아키텍트)이 "문제를 어떻게 풀지" 먼저 제안하고, 두 번째 요청에서 에디터 모델이 그 제안을 실제 파일 편집 명령으로 변환한다. 이유는 단순하다 — 많은 LLM이 ''추론''과 ''정확한 파일 편집''을 한 번에 잘 해내지 못한다. 역할을 나누면 결과가 더 좋아질 수 있다는 것이 문서의 설명이다. 흥미롭게도 같은 모델을 양쪽에 써도 ''두 번 보는'' 효과로 결과가 나아지는 경우가 있다고 한다. 대신 요청이 두 번 나가니 시간·비용은 더 든다. 실무 포인트는 비용 최적화다. 아키텍트엔 추론 강한 비싼 모델, 에디터엔 빠르고 싼 모델을 붙이면 ''비싼 모델 품질의 계획 + 싼 모델 가격의 편집''을 노릴 수 있다. `--architect`는 `--chat-mode architect`의 단축키이고, `--editor-model`로 편집 담당 모델을 따로 지정한다(안 주면 메인 모델에 맞춰 자동 선택).

    '
  points:
  - '한 요청 → 두 모델: 아키텍트 모델이 해법을 제안하고, 에디터 모델이 그걸 파일 편집으로 변환 (요청 2회)'
  - 추론과 정확한 편집을 한 번에 못하는 LLM에 효과 — 같은 모델을 양쪽에 써도 '두 번 보기'로 개선되는 경우 있음(공식 문서, 수치 없는 정성적 주장)
  - '`--architect` = `--chat-mode architect` 단축키 / `--editor-model`로 편집 모델 지정 → 비싼 계획 + 싼 편집으로 비용 절감'
  source: https://aider.chat/docs/usage/modes.html
- category: ai
  title: Backlog.md — 깃 레포를 사람·AI 공용 칸반 보드로 바꾸는 마크다운 태스크 매니저
  summary: 'Backlog.md는 별도 서버나 SaaS 없이, 깃 저장소 안에서 작업(task)을 평범한 마크다운 `.md` 파일로 관리하는 오픈소스 도구다(MIT 라이선스). README에 따르면 모든 이슈가 깃에 커밋되는 .md 파일이라 PR·브랜치·히스토리와 자연스럽게 묶이고, 제로 설정 CLI로 터미널 칸반 보드와 웹 UI를 띄울 수 있다. 핵심은 ''AI 에이전트와 사람이 같은 작업 목록을 공유''한다는 점이다. Claude Code·Gemini CLI·Codex·Kiro 등 MCP/CLI 호환 어시스턴트를 지원하며, MCP 커넥터를 쓰면 이 도구들에 워크플로 지침까지 자동 주입된다. 에이전트가 작업을 To Do→In Progress→Done으로 옮기고 진행 상황을 파일에 남기므로, 세션이 바뀌어도 ''무엇을 하던 중이었나''가 레포에 그대로 남는다. 실무 포인트는 핸드오프다. 사람이 잘게 쪼갠 태스크를 에이전트에 넘기고, 에이전트가 작업하며 상태를 갱신하면, 별도 트래커 없이 깃 하나로 사람-AI 협업의 단일 진실 공급원(source of truth)을 만들 수 있다.

    '
  points:
  - 작업 = 깃에 커밋되는 마크다운 .md 파일 — 서버·SaaS 없이 레포 안에서 칸반·진행 추적(MIT 라이선스)
  - Claude Code·Gemini CLI·Codex·Kiro 등 지원, MCP 커넥터가 에이전트에 워크플로 지침 자동 설정
  - 사람이 태스크 쪼개 핸드오프 → 에이전트가 To Do→In Progress→Done 갱신 → 세션 바뀌어도 맥락이 레포에 남음
  source: https://github.com/MrLesk/Backlog.md
- category: ai
  title: Ralph Wiggum 루프 — '멍청하지만 절대 안 멈추는' 에이전트 bash 패턴
  summary: Geoffrey Huntley가 심pson 캐릭터 이름을 따 정리한 Ralph는 본질적으로 `while :; do cat PROMPT.md | claude-code; done` 한 줄이다. 매 반복마다 새 컨텍스트로 에이전트를 띄워 한 번에 한 가지만 시키고, 상태는 fix_plan.md·AGENT.md·git 히스토리에 두어 컨텍스트 rot를 우회한다. 테스트·타입체커·정적분석을 backpressure로 걸어 잘못된 생성을 거른다. Anthropic은 2025-12 공식 ralph-wiggum 플러그인(/ralph-loop·Stop 훅)으로 채택했고, Continuous Claude는 PR·CI·머지까지 붙인 확장이다.
  points:
  - '순루프: 작업 1개→구현→검증(테스트/타입/린트)→통과 시 커밋→상태 갱신→컨텍스트 리셋→반복'
  - 'stateless 핵심: 진행은 LLM 컨텍스트가 아니라 git·파일에 — 매 반복 새 인스턴스'
  - 공식 ralph-wiggum 플러그인(/ralph-loop), Continuous Claude는 PR·CI·머지까지 확장
  source: https://ghuntley.com/ralph/
- category: ai
  title: Claude Code 비용 줄이기 — 공식 문서가 권하는 실전 체크리스트
  summary: 'Claude Code는 API 토큰 소비량으로 과금되는데, Anthropic 공식 ''Manage costs'' 문서는 개발자 1인 평균 비용을 활동일당 약 $13, 월 $150~250로 제시하고 사용자 90%는 활동일당 $30 미만이라고 밝힌다. 비용을 줄이는 1순위는 모델 라우팅이다 — 대부분의 코딩은 Sonnet으로 처리하고 Opus는 복잡한 아키텍처 결정·다단계 추론에만 아껴 쓰며, `/model`로 세션 중 전환하거나 서브에이전트엔 `model: haiku`를 지정한다. 컨텍스트 관리도 핵심이다 — `/context`로 무엇이 공간을 잡아먹는지 보고, CLAUDE.md는 핵심만 담아 200줄 이하로 유지하며, 안 쓰는 MCP 서버는 `/mcp`로 끈다. 도구는 MCP보다 `gh`·`aws`·`gcloud` 같은 CLI를 선호하면 도구 목록이 컨텍스트에 안 올라가 토큰을 아낀다. 어디서 새는지는 `/usage`(스킬·서브에이전트·플러그인·MCP별 % 분해)로 추적한다.

    '
  points:
  - '공식 기준치: 개발자 1인 활동일당 약 $13, 월 $150~250 / 사용자 90%는 활동일당 $30 미만 (Anthropic ''Manage costs'' 문서)'
  - '1순위는 모델 라우팅 — 기본 Sonnet, Opus는 아키텍처·다단계 추론만, 서브에이전트엔 model: haiku'
  - '컨텍스트 절약: /context로 점유 확인 · CLAUDE.md 200줄 이하 · 안 쓰는 MCP는 /mcp로 끄기 · 도구는 MCP보다 gh/aws/gcloud 같은 CLI 선호(목록이 컨텍스트에 안 올라감)'
  source: https://code.claude.com/docs/en/costs
- category: ai
  title: GitHub Copilot 코딩 에이전트 — 이슈를 던지면 알아서 PR을 올리는 비동기 에이전트
  summary: '터미널 CLI 에이전트와 달리, GitHub Copilot 코딩 에이전트는 깃허브 안에서 ''비동기''로 도는 자율 에이전트다. 이슈를 `@copilot`에게 할당하거나 Agents 패널에서 작업을 주면, 에이전트가 백그라운드에서 레포를 조사하고 구현 계획을 세운 뒤 브랜치에 코드를 고쳐 초안 PR(draft pull request)을 연다. 실행은 GitHub Actions 위에서 돌아 격리된 환경에서 빌드·테스트를 거치고, 사람은 결과 PR을 리뷰만 하면 된다. 즉 ''내가 옆에서 지켜보며 짜는'' 동기식 페어 프로그래밍이 아니라, ''일을 맡겨두고 다른 일을 하다 PR로 받는'' 워크플로다. VS Code·GitHub.com·이슈 어디서든 `@copilot` 멘션으로 호출할 수 있어, 자잘한 버그·반복 작업을 사람 손에서 떼어내 백로그를 비우는 용도에 맞는다.

    '
  points:
  - 이슈 할당 또는 @copilot 멘션 → 에이전트가 레포 조사·계획·브랜치 수정 후 초안 PR을 자동 생성
  - GitHub Actions 위에서 격리 실행(빌드·테스트), 사람은 PR 리뷰만 — '동기식 페어'가 아닌 '비동기 위임' 워크플로
  - Agents 패널·GitHub.com·VS Code·이슈 등 여러 진입점에서 @copilot으로 호출 가능
  source: https://docs.github.com/en/copilot/concepts/agents/coding-agent/about-coding-agent
- category: ai
  title: skills.sh / npx skills — SKILL.md를 70+ 에이전트에 npm처럼 까는 스킬 패키지 매니저(Vercel·~22.6k★)
  summary: 스킬(SKILL.md)이 쏟아지면서 생긴 문제는 '어떤 걸 어떻게 깔지'다. Vercel Labs의 skills CLI(skills.sh)는 오픈 에이전트 스킬 생태계를 위한 npm식 패키지 매니저(MIT·~22.6k★)다. `npx skills add <owner/repo>` 한 줄로 Claude Code·Codex·Cursor·OpenCode 등 70여 개 에이전트 폴더에 심볼릭 링크 설치. find·use(1회)·list·update·remove·init 서브커맨드, `-g`(전역)·`-a`(대상 에이전트)·`-y`(비대화형) 플래그. GitHub·GitLab·URL·로컬 경로 지원. SKILL.md 표준을 '설치·배포 레이어'로 묶어 도구 비종속 스킬 공유를 가능하게 한다.
  points:
  - '`npx skills add/find/use/update/remove/init` — npm처럼 스킬 검색·설치·갱신(MIT·~22.6k★)'
  - 70+ 에이전트 비종속 — Claude Code·Cursor·Codex·OpenCode 등에 심볼릭 링크로 동일 SKILL.md 공유
  - '`-g` 전역 / 프로젝트 스코프, skills.sh 디렉터리에서 공개 스킬 탐색'
  source: https://github.com/vercel-labs/skills
- category: ai
  title: 코딩 에이전트 프롬프트 인젝션 방어 — Claude Code가 실제로 거는 안전장치
  summary: '프롬프트 인젝션은 공격자가 코드·웹페이지·파일에 악성 지시를 숨겨 에이전트의 원래 명령을 가로채는 기법이다. 코딩 에이전트를 실무에 들일 때 "이거 안전한가"가 첫 관문인데, Claude Code 공식 보안 문서는 마법이 아니라 ''읽을 수 있는 구체적 안전장치''들로 답한다. 핵심은 권한 시스템(민감 작업은 명시적 승인)·컨텍스트 인식 분석(전체 요청을 보고 위험 지시 탐지)·입력 새니타이즈다. 특히 curl·wget 같은 네트워크 명령은 기본 자동승인이 안 되고, 웹 fetch는 별도 컨텍스트 창에서 처리해 악성 프롬프트가 본 세션에 섞이지 않게 격리한다. 그 위에 fail-closed 매칭(매칭 안 된 명령은 기본 수동승인)·명령 인젝션 탐지(이미 허용한 명령도 수상하면 다시 승인)·첫 코드베이스/새 MCP 서버 trust 검증이 더해진다. 단 trust 검증은 -p(헤드리스) 실행 시 비활성화되니 자동화 파이프라인은 그만큼 더 조심해야 한다. 어떤 방어도 100%는 아니므로 신뢰 불가 콘텐츠를 Claude에 직접 파이프하지 말 것을 공식 베스트 프랙티스로 권한다.

    '
  points:
  - 권한 시스템·컨텍스트 인식 분석·입력 새니타이즈가 1차 방어, curl/wget 네트워크 명령은 기본 자동승인 제외
  - 웹 fetch는 '격리된 컨텍스트 창'에서 처리 — 악성 페이지 지시가 메인 세션에 주입되는 걸 차단
  - fail-closed(미매칭 명령 수동승인)·명령 인젝션 탐지·첫 코드베이스/MCP trust 검증. 단 trust 검증은 -p 헤드리스에선 꺼짐
  source: https://code.claude.com/docs/en/security
- category: ai
  title: Cognition Devin 2.0 — ACU 과금·DeepWiki·67% PR merge(2026)
  summary: 'Devin은 Cognition Labs의 자율 AI 소프트웨어 엔지니어로, 샌드박스(터미널·에디터·브라우저)에서 계획→코드→테스트→PR까지 비동기로 수행한다. Devin 2.0(2025-04)은 $20/월 Core(ACU $2.25)로 진입장벽을 낮췄다. 18개월 성과: PR merge율 34%→67%, 4x 빠른 문제해결. DeepWiki(코드베이스 자동 문서·다이어그램), AskDevin(아키텍처 Q&A), Windsurf 통합(계획→Devin 실행). 3시간 이내 bounded task에 최적.'
  points:
  - Core $20/월·Team $500(250 ACU) — ACU 1개≈15분 active work
  - 'DeepWiki: 5M줄 COBOL·500GB repo도 자동 문서·시스템 다이어그램'
  - 67% PR merge(2025 리뷰) — bounded·well-defined task에 ROI, 복잡·모호 task는 Claude Code 대안
  source: https://cognition.ai/blog/devin-annual-performance-review-2025
- category: ai
  title: CodeRabbit — 공개 레포는 무료, PR마다 줄 단위로 달라붙는 AI 리뷰어
  summary: 'CodeRabbit은 GitHub·GitLab에 붙어 PR이 열릴 때마다 자동으로 코드 변경을 분석하고, 변경 라인 옆에 인라인 코멘트와 PR 요약을 달아주는 AI 코드 리뷰 도구다. 가장 큰 미끼는 가격이다. 공식 가격표 기준 ''공개 저장소는 영원히 무료(free reviews forever for public repositories)''라서 오픈소스·사이드 프로젝트에 비용 없이 붙일 수 있다. 유료는 Pro가 연간 결제 시 사용자당 월 24달러, Pro Plus가 48달러이며, 무료 티어도 공개·비공개 저장소 수 제한 없이 PR 요약과 IDE·CLI 리뷰를 제공한다. 즉 ''에이전트가 코드를 짠다''가 아니라 ''에이전트가 사람·AI가 짠 코드를 사람 대신 1차로 리뷰한다''는 쪽이라, 작성과 검토를 다른 주체로 분리하고 싶을 때 들어맞는다.

    '
  points:
  - PR 열릴 때마다 변경 라인 옆에 인라인 코멘트 + PR 요약 자동 생성 (GitHub·GitLab)
  - 공개 저장소는 영원히 무료 — OSS·개인 프로젝트에 비용 0으로 리뷰 봇 추가(공식 가격표 명시)
  - 유료 Pro 연 결제 시 월 $24/인, Pro Plus $48/인; 무료 티어도 공개·비공개 무제한 + IDE·CLI 리뷰 포함
  source: https://www.coderabbit.ai/pricing
- category: ai
  title: Codex CLI — Rust 네이티브 로컬 코딩 에이전트(92k+★)
  summary: 'Codex CLI는 OpenAI가 만든 "내 컴퓨터에서 도는" 터미널 코딩 에이전트다. GitHub 저장소 기준 Apache-2.0 오픈소스이고, 2026-06-23 조회 시 92.8k★·13.7k forks·Rust 96.3%·최신 릴리스 0.142.0(2026-06-22)로 활발히 유지되고 있다. 실무 포인트는 설치 경로보다 운영 경계다. CLI는 셸 설치 스크립트, npm, Homebrew, GitHub Release 바이너리를 제공하고, 인증은 ChatGPT Plus·Pro·Business·Edu·Enterprise 로그인 또는 API 키로 나뉜다. 같은 README가 VS Code·Cursor·Windsurf IDE 통합과 클라우드 Codex Web을 별도 표면으로 안내하므로, 팀은 "로컬 CLI에서 할 일", "IDE에서 리뷰할 일", "클라우드 에이전트에 맡길 일"을 권한과 비용 기준으로 나눠야 한다.

    '
  points:
  - '같은 런 검증: 92.8k★, 13.7k forks, Rust 96.3%, 최신 0.142.0(2026-06-22)'
  - '설치 표면: 셸 스크립트·npm·Homebrew·GitHub Release 바이너리'
  - '운영 경계: ChatGPT 로그인/API 키, IDE 통합, Codex Web을 작업 성격별로 분리'
  source: https://github.com/openai/codex
- category: ai
  title: promptfoo — 프롬프트·모델을 바꿔도 품질이 안 깨졌는지 자동으로 재는 eval 툴
  summary: '코딩 에이전트/LLM 기능을 실무에 넣으면 곧 "프롬프트나 모델을 바꿨는데 결과가 더 나빠지진 않았나"라는 회귀 문제에 부딪힌다. promptfoo는 그 지점을 테스트 주도 개발처럼 다루는 오픈소스 CLI·라이브러리다. 2026-06-23 재검증 기준 GitHub 22,490★·MIT이고, 2026-03-09 OpenAI 인수 발표 뒤에도 오픈소스와 멀티모델 지원을 유지한다고 공지했다. 핵심은 선언적 테스트 케이스로 여러 프롬프트·입력·모델을 한 번에 돌리고, matrix/side-by-side 뷰로 비교하는 것이다. 단순 문자열 일치만이 아니라 metrics와 model-graded 평가로 정답이 하나로 떨어지지 않는 생성 결과도 점수화한다. 자동 레드티밍·펜테스팅은 보안 취약점을 찾고, CLI·라이브러리·CI/CD 통합은 프롬프트 변경을 배포 전 회귀 게이트로 만든다. eval은 로컬에서 실행되고 LLM과 직접 통신하므로, 평가 데이터를 불필요하게 외부 평가 SaaS에 밀어 넣지 않아도 된다.

    '
  points:
  - '같은 런 검증: 22,490★, MIT, OpenAI 인수 뒤에도 오픈소스 유지 공지'
  - 선언적 테스트로 프롬프트·입력·모델을 matrix/side-by-side 비교
  - metrics·model-graded 평가·레드티밍을 CI 회귀 게이트로 연결
  source: https://www.promptfoo.dev/docs/intro/
- category: ai
  title: awesome-agent-skills — 코딩 에이전트 가리지 않고 쓰는 스킬 1400+개 모음(VoltAgent·25k★)
  summary: '스킬(SKILL.md)이 Claude Code·Codex·Cursor·Gemini CLI 등에서 공통 표준이 되면서, "어떤 스킬을 깔지"가 새 고민거리가 됐다. VoltAgent의 awesome-agent-skills는 이 문제를 풀려는 큐레이션 레포다. 2026-06-23 재검증 기준 README 배지는 1497개+ 스킬을 표시하고, GitHub API로 26,182★·2,801 forks·MIT·같은 날 push를 확인했다. 핵심은 특정 에이전트 전용 프롬프트 모음이 아니라는 점이다. README는 Claude Code, Codex, Antigravity, Gemini CLI, Cursor, GitHub Copilot, OpenCode, Windsurf 등과 호환된다고 설명한다. Anthropic, Google Labs, Vercel, Stripe, Cloudflare, Netlify, Trail of Bits, Sentry, Expo, Hugging Face, Figma 같은 조직 발행 스킬과 커뮤니티 스킬을 함께 싣되, 대량 AI 생성물이 아니라 실제 팀이 쓰는 스킬을 손으로 고른다는 기준을 내세운다. 실무 교훈은 에이전트별 설정을 복붙하기보다, 검증된 SKILL.md를 공용 지식 단위로 관리하고 출처·라이선스·호환 도구를 같이 확인하라는 것이다.

    '
  points:
  - '같은 런 검증: README 1497+ skills, GitHub 26,182★·2,801 forks·MIT·2026-06-23 push'
  - Claude Code·Codex·Antigravity·Gemini CLI·Cursor·Copilot·OpenCode·Windsurf 호환 표방
  - 공식 조직 발행 스킬과 커뮤니티 스킬을 함께 싣되, 출처와 라이선스를 보고 골라 쓰는 카탈로그
  source: https://github.com/VoltAgent/awesome-agent-skills
- category: ai
  title: Roo Code 종료 → Zoo Code — 24k★ OSS 에디터 에이전트의 archive·커뮤니티 포크 생존
  summary: Cline에서 갈라진 VS Code 코딩 에이전트 Roo Code(24k★·Apache-2.0)는 Code·Architect·Ask·Debug·Custom 5모드·MCP·자연어 생성·리팩터링을 제공했다. 2026-05-15 v3.54.0을 마지막으로 저장소 archive(read-only) — 메인테이너는 Roomote 등 다른 프로젝트로 이동. 공식 README는 Zoo Code(커뮤니티 포크, 2026-04-23 기존 기여자 인계·v3.54.0 이어받음)와 Cline을 대안으로 안내. export→import로 설정 이주 가능. 계보 Cline→Roo→Zoo는 BYOK+오픈 라이선스+설정 이식성이 포크 생존을 보장하는 실제 사례.
  points:
  - 2026-05-15 archive — 24k★·Apache-2.0, 공식 대안 Zoo Code·Cline
  - Zoo Code = 기존 Roo 기여자 포크, 5모드·설정 그대로, export→import 이주
  - '교훈: OSS 에이전트는 archived 여부·포크 경로를 PoC 단계에서 확인'
  source: https://github.com/RooCodeInc/Roo-Code
- category: ai
  title: Ruler — CLAUDE.md·AGENTS.md·.cursorrules를 한 곳에서 써서 모든 에이전트에 뿌리기
  summary: 'Ruler는 코딩 에이전트 지침을 도구별 파일에 손으로 복붙하지 않게 해 주는 "single source of truth" CLI다. `.ruler/AGENTS.md`와 하위 마크다운을 기준 순서대로 합치고, `ruler.toml` 설정에 따라 Claude Code, Codex CLI, Copilot, Cursor, Gemini CLI, Aider, Zed 등 30개 안팎의 에이전트 파일로 배포한다. 최신 README 기준 루트 `AGENTS.md`가 있으면 가장 높은 우선순위로 prepend되고, `.ruler/` 안의 파일에는 출처 주석이 붙어 traceability가 남는다. MCP 설정도 에이전트별 native 위치로 전파할 수 있고, nested rule loading은 모노레포·컴포넌트별 규칙을 다룰 수 있지만 아직 experimental로 표시된다. 2026-06-23 같은 런에서 2,773★·150 forks·MIT·archived=false·당일 push를 확인했다.

    '
  points:
  - '입력 우선순위: 루트 AGENTS.md → `.ruler/AGENTS.md` → legacy instructions.md → 나머지 `.ruler/**/*.md`'
  - '출력 범위: Claude Code·Codex CLI·Copilot·Cursor·Gemini CLI·Aider·Zed 등 30개 안팎 에이전트 지침/MCP/skills 위치'
  - '실무 포인트: nested rule loading은 유용하지만 experimental, `--dry-run`으로 배포 diff를 먼저 확인'
  source: https://github.com/intellectronica/ruler
- category: ai
  title: Pi — '고쳐 쓰라고' 만든 자기확장형 터미널 코딩 에이전트(earendil-works·65k+★)
  summary: 'Pi는 earendil-works가 만든 오픈소스 AI 에이전트 하네스다. 2026-06-24 같은 런에서 GitHub 65,018★·7,927 forks·MIT·archived=false·2026-06-23 push를 확인했다. README는 Pi를 "self extensible coding agent"로 설명하고, 모노레포를 pi-ai(OpenAI·Anthropic·Google 등 멀티프로바이더 LLM API), pi-agent-core(툴 호출·상태 관리 런타임), pi-tui(터미널 UI), pi-coding-agent(대화형 코딩 CLI)로 나눈다. 실무 포인트는 "확장 가능"이 곧 "안전"은 아니라는 점이다. Pi는 파일시스템·프로세스·네트워크·자격증명 접근을 제한하는 내장 권한 시스템이 없고, 필요하면 Gondolin micro-VM, Docker, OpenShell 같은 외부 샌드박스로 경계를 치라고 안내한다. 공급망 쪽도 직접 의존성 exact pin, min-release-age, shrinkwrap, lifecycle-script allowlist, audit/signature checks를 README에 공개하므로, 자기확장형 에이전트를 도입할 때는 기능 확장성과 실행 경계를 같은 설계 항목으로 봐야 한다.

    '
  points:
  - '같은 런 검증: 65,018★, 7,927 forks, MIT, archived=false, 2026-06-23 push'
  - '모노레포 4축: pi-ai(멀티프로바이더 LLM API)·pi-agent-core(런타임)·pi-tui(UI)·pi-coding-agent(CLI)'
  - '교훈: self extensible 구조는 외부 샌드박싱과 dependency supply-chain review를 함께 설계해야 안전하다'
  source: https://github.com/earendil-works/pi
- category: ai
  title: Cursor 코드베이스 인덱싱 — 임베딩으로 '의미 검색'하되 원문은 서버에 안 남긴다
  summary: '대형 레포에서 에이전트가 "인증 실패는 어디서 처리하지?" 같은 행동·개념 질문을 받으면 문자열 grep만으로는 부족하다. Cursor의 현재 Search 문서는 Agent가 프롬프트 성격에 따라 Instant Grep, semantic search, 파일 읽기, Explore subagent를 조합한다고 설명한다. 시맨틱 검색은 코드를 함수·클래스·논리 블록 같은 의미 있는 청크로 나누고, 각 청크를 벡터 임베딩으로 만들어 벡터DB에 저장한 뒤, 질문도 같은 모델로 벡터화해 가까운 청크를 찾는 방식이다. 인덱싱은 워크스페이스를 열면 자동 시작되고 80% 완료 시점부터 검색 가능하며, 5분마다 바뀐 파일만 다시 처리한다. 프라이버시 경계도 중요하다. 파일 경로는 서버 전송 전 암호화되고, 원문 코드는 평문 저장되지 않으며, 인덱싱 중 메모리에만 있다가 폐기된다. 실무 교훈은 "시맨틱 검색이면 grep이 필요 없다"가 아니라, 정확한 심볼은 grep으로, 흐름·책임·개념 탐색은 시맨틱 검색과 Explore subagent로 분리해 컨텍스트를 아끼는 것이다.

    '
  points:
  - 코드 청크를 벡터 임베딩으로 저장하고, 질문도 벡터화해 의미가 가까운 위치를 찾는다
  - 자동 인덱싱, 80%부터 검색 가능, 5분 증분 동기화, .gitignore·.cursorignore로 제외
  - Agent는 심볼/string은 grep, 개념/행동은 semantic search, 넓은 탐색은 Explore subagent로 조합
  source: https://cursor.com/docs/agent/tools/search
- category: ai
  title: Continuous Claude — Ralph 루프에 PR·CI·머지까지 붙인 '무인 개발 파이프라인'
  summary: 'Ralph 루프가 "끝날 때까지 새 컨텍스트로 다시 돌리는" 패턴이라면, Continuous Claude(AnandChowdhary)는 그 루프에 GitHub PR 생명주기를 붙인 CLI다. 매 반복마다 Claude Code 또는 Codex CLI가 작업하고, 새 브랜치에 커밋한 뒤 `gh pr create`로 PR을 열고, `gh pr checks`와 리뷰 통과를 기다린다. 초록불이면 머지하고, 실패하면 PR을 닫고 작업을 버린 뒤 다음 반복에서 실패 지식을 반영한다. 반복 사이 맥락은 기본 `SHARED_TASK_NOTES.md`에 남겨 컨텍스트 드리프트를 줄이고, `--worktree`로 병렬 실행도 지원한다. 현재 README 기준 GitHub PR 자동화가 핵심 경로이며 self-hosted forge는 미지원이다. 로컬 검증이나 안전한 시험 운전은 `--dry-run`, `--disable-commits`, `--disable-branches`, `--max-runs`, `--max-duration`, `--max-cost` 같은 제한 플래그로 먼저 좁히는 편이 낫다.

    '
  points:
  - '같은 런 검증: MIT, 1.4k★, Claude Code/Codex provider 지원, GitHub CLI PR 자동화'
  - 맥락 보존은 기본 SHARED_TASK_NOTES.md, 병렬 실행은 `--worktree`, 완료 판단은 연속 completion signal
  - '안전장치: `--dry-run`, `--max-runs`, `--max-duration`, `--max-cost`, `--stall-threshold`로 무한 루프를 제한'
  source: https://github.com/AnandChowdhary/continuous-claude
- category: ai
  title: Google Antigravity — Gemini CLI를 접고 갈아타라는 '에디터·터미널·브라우저' 통합 에이전트 플랫폼
  summary: '구글이 2026 I/O(2026-05-19)에서 Antigravity를 ''agent-first development platform''으로 다시 밀었다. 핵심은 IDE 하나가 아니라 개발 표면 묶음이라는 점이다. Antigravity 2.0 데스크톱 앱은 여러 에이전트를 병렬로 오케스트레이션하고, dynamic subagents·scheduled tasks·Google AI Studio/Android/Firebase 연동을 담는다. Antigravity CLI는 GUI 없이 터미널에서 에이전트를 만들고 실행하는 경량 표면이며, 구글은 Gemini CLI 사용자에게 이 CLI로 이전하라고 안내한다. Antigravity SDK는 구글 제품을 움직이는 같은 agent harness를 프로그래밍 가능한 형태로 제공해 커스텀 에이전트 동작과 자체 인프라 호스팅을 열어 둔다. 워크호스 모델은 Gemini 3.5 Flash이고, 구글은 Gemini 3.1 Pro보다 대부분 벤치마크에서 앞서며 다른 frontier 모델보다 4배 빠르다고 주장한다. 실무 교훈은 "CLI 대체재"가 아니라 데스크톱·CLI·SDK·호스팅 환경을 함께 보는 에이전트 플랫폼 전환이라는 점이다.

    '
  points:
  - '데스크톱 앱: 여러 에이전트 병렬 오케스트레이션, dynamic subagents, scheduled tasks, AI Studio/Android/Firebase 연동'
  - 'CLI: GUI 없이 터미널에서 에이전트 생성·실행 / 구글은 Gemini CLI 사용자에게 Antigravity CLI 이전 안내'
  - 'SDK: Antigravity agent harness를 커스텀 동작·자체 인프라 호스팅에 사용 / 모델은 Gemini 3.5 Flash'
  source: https://blog.google/innovation-and-ai/technology/developers-tools/google-io-2026-developer-highlights/
- category: ai
  title: Mastra — 'Gatsby 팀'이 만든 TypeScript용 AI 에이전트 프레임워크
  summary: 'Mastra(mastra-ai)는 터미널 코딩 에이전트가 아니라, 제품 안에 AI 에이전트와 워크플로를 직접 넣을 때 쓰는 TypeScript 프레임워크다. React·Next.js·Node 앱에 붙이거나 독립 서버로 배포할 수 있고, YC W25 배지를 단 Gatsby 출신 팀의 프로젝트다. 핵심은 "모델 호출 래퍼"보다 넓다 — 40개 이상 모델 공급자를 한 인터페이스로 라우팅하고, 도구를 쓰는 Agent를 만들며, `.then()`·`.branch()`·`.parallel()`로 그래프형 Workflow를 짠다. 오래 걸리는 실행은 storage에 상태를 남기고 suspend/resume으로 사람 승인 뒤 이어갈 수 있다. 여기에 대화 기록·RAG·메모리, MCP 서버 작성, evals와 observability까지 묶어 "에이전트 앱의 백엔드 프레임워크"처럼 쓴다. 2026-06-24 GitHub API 기준 25,394★이고, 코어는 Apache-2.0이지만 `ee/` 디렉터리는 엔터프라이즈 라이선스라 프로덕션 사용 조건을 분리해서 봐야 한다.

    '
  points:
  - 코딩 CLI가 아니라 제품 안 AI 에이전트·워크플로를 짜는 TS 백엔드 프레임워크
  - '구성: 40+ 모델 라우팅·Agent·그래프 Workflow·suspend/resume HITL·RAG/메모리·MCP·evals/observability'
  - '라이선스 확인: 코어 Apache-2.0, `ee/`는 엔터프라이즈 라이선스 / 25,394★(2026-06-24 API 확인)'
  source: https://github.com/mastra-ai/mastra
- category: ai
  title: Cursor CLI 헤드리스 모드 — `agent -p`로 CI·스크립트에서 코드 작업 자동화
  summary: 'Cursor의 Headless CLI는 에디터 안 대화형 에이전트를 CI·스크립트용 비대화형 작업자로 꺼내 쓰는 방식이다. 설치 후 `agent`를 그냥 실행하면 대화형 세션이고, `-p`/`--print`를 붙이면 프롬프트를 받아 최종 결과를 출력하는 자동화 모드가 된다. 중요한 분기점은 권한이다. 기본은 사람이 검토할 여지를 남기지만, `--force`(별칭 `--yolo`)를 주면 확인 없이 파일 편집까지 허용하므로 신뢰된 브랜치·격리된 워크스페이스에서만 써야 한다. 결과 소비 방식도 운영 포인트다. `--output-format`은 text·json·stream-json을 제공하고, stream-json에 `--stream-partial-output`을 더하면 긴 작업의 진행을 메시지/델타 단위로 추적할 수 있다. 인증은 `CURSOR_API_KEY` 환경변수로 처리한다. 즉 핵심은 "Cursor를 CI에 붙인다"가 아니라, 출력 형식과 편집 권한을 명시해 에이전트를 파이프라인 구성요소로 다루는 것이다.

    '
  points:
  - '`-p/--print` = CI·스크립트용 비대화형 실행, 인자 없이 실행하면 대화형 세션'
  - '`--force`/`--yolo`는 직접 편집 권한이므로 격리된 워크스페이스와 명시적 승인 정책이 필요'
  - '`--output-format` text·json·stream-json + `--stream-partial-output`로 자동화가 진행 상태를 읽게 한다'
  source: https://cursor.com/docs/cli/headless
- category: ai
  title: Gartner가 'AI 코드 어시스턴트'를 'AI 코딩 에이전트'로 다시 부르다 — 4강 굳히기
  summary: 'GitHub가 공개한 2026 Gartner Magic Quadrant 요약에서 눈에 띄는 점은 카테고리명이 ''AI Code Assistants''가 아니라 ''Enterprise AI Coding Agents''라는 것이다. GitHub 글은 Gartner가 2026-05-20 보고서에서 12개 벤더를 실행력과 비전 완성도 기준으로 평가했고, GitHub·Anthropic·Cursor·OpenAI를 Leader 사분면에 뒀다고 설명한다. 다만 이 글은 GitHub의 해설이므로 "GitHub가 1위라서 좋다"가 교훈은 아니다. 더 실용적인 신호는 시장의 평가 단위가 자동완성·채팅에서 이슈 처리, 코드 리뷰, PR, 보안, 거버넌스까지 포함한 에이전트 워크플로로 넓어졌다는 점이다. 도구를 고를 때도 모델 품질 하나보다 멀티모델 선택, 감사·통제, SDLC 표면 통합을 같이 봐야 한다.

    '
  points:
  - '공개 출처 기준: 2026-05-20 Gartner 보고서명은 Enterprise AI Coding Agents'
  - GitHub 글은 12개 벤더 평가와 Leader 4곳(GitHub·Anthropic·Cursor·OpenAI)을 설명
  - '실무 함의: 자동완성보다 이슈→리뷰→PR→보안→거버넌스까지 이어지는 에이전트 표면을 평가'
  source: https://github.blog/ai-and-ml/github-copilot/github-recognized-as-a-leader-in-the-gartner-magic-quadrant-for-enterprise-ai-coding-agents-for-the-third-year-in-a-row/
- category: ai
  title: ETH Zurich 연구 — AGENTS.md를 LLM에게 자동 생성시키면 오히려 성공률이 떨어진다
  summary: 'ETH Zurich·LogicStar.ai 팀이 실제 코딩 태스크에서 AGENTS.md(레포 컨텍스트 파일)가 코딩 에이전트에 도움이 되는지 처음으로 엄밀하게 측정했다(arXiv 2602.11988). 결론은 직관과 반대다: `/init` 류로 LLM이 자동 생성한 컨텍스트 파일은 성공률을 높이기는커녕 오히려 낮추는 경향을 보였고, 에이전트가 더 많은 단계를 밟게 만들어 추론 비용을 20% 넘게 끌어올렸다. 사람이 손으로 쓴 파일은 소폭의 이득은 있었지만 그 역시 탐색 단계와 비용을 함께 늘렸다. 60,000개 넘는 공개 레포가 이미 이런 파일을 두고 있는데, "있으면 좋다"는 가정이 데이터로 흔들린 셈이다.

    '
  points:
  - '핵심 발견: LLM이 자동 생성한 AGENTS.md는 컨텍스트 파일 없는 경우보다 성공률을 떨어뜨리는 경향 + 추론 비용 20%↑(논문 abstract 확인)'
  - '원인 추정: ''전체 테스트 돌려라''·''관련 모듈 다 봐라'' 같은 지시가 에이전트를 불필요한 탐색으로 몰아 단계·비용을 늘림'
  - '권고: LLM 자동 생성 파일은 빼고, 사람이 추론 불가능한 정보(특수 빌드·툴 커맨드)만 짧게 적어라 — ''자동 생성 디테일''은 독'
  source: https://arxiv.org/abs/2602.11988
- category: ai
  title: Dreams(Anthropic) — 에이전트가 세션 사이에 '잠자며' 메모리를 정리하는 리서치 프리뷰
  summary: 'Dreams는 Anthropic Managed Agents의 리서치 프리뷰 기능으로, 에이전트가 일하며 쌓은 메모리 스토어를 세션 밖에서 한 번에 정리한다. 에이전트는 평소 메모리에 점진적·국소적으로 기록하기 때문에 세션이 쌓일수록 중복·모순·낡은 항목이 누적되는데, 한 번의 ''dream''이 기존 메모리 스토어와 과거 세션 기록(1~100개)을 함께 읽어 중복은 병합하고 낡거나 어긋난 값은 최신으로 바꾸고 새 인사이트는 끌어올린 ''새 메모리 스토어''를 만들어 낸다. 핵심은 입력 스토어를 절대 건드리지 않는다는 점 — 결과를 검토하고 마음에 안 들면 버리면 된다. 모델을 재학습하는 게 아니라 비동기 잡으로 수 분~수십 분 돌아가며, API 토큰 표준 요율로 과금된다.

    '
  points:
  - 입력=기존 메모리 스토어 + 세션 1~100개 → 출력=재정리된 '새' 스토어(입력은 불변, 버려도 됨)
  - '비동기 잡: pending→running→completed/failed/canceled, 수 분~수십 분 / instructions로 정리 방향 조정'
  - 리서치 프리뷰(별도 베타 헤더 dreaming-2026-04-21), 모델 재학습 아님 · 표준 토큰 요율 과금
  source: https://platform.claude.com/docs/en/managed-agents/dreams
- category: ai
  title: OpenClaw — 메신저로 부리는 self-hosted·모델 비종속 에이전트(MIT)
  summary: 'OpenClaw는 Peter Steinberger와 커뮤니티가 만든 오픈소스 개인 AI 어시스턴트로, "자기 기기에서 돌리는 개인 AI 어시스턴트"를 표방한다. WhatsApp·Telegram·Slack·Discord· Signal·iMessage 등 이미 쓰는 메신저 채널을 격리된 에이전트로 라우팅한다. 핵심은 Gateway라는 로컬-퍼스트 컨트롤 플레인(launchd/systemd 데몬)이 세션·채널·도구·이벤트를 한 곳에서 관리한다는 점이다. 모델 비종속이고, 메인 세션에선 도구가 호스트에서 직접 돌아 에이전트가 bash·read·write·edit 같은 권한을 갖는다(샌드박스 설정 가능). MIT 라이선스이며 GitHub 별은 37만 개 이상(README 기준 주장)으로 2026년 초 폭발적으로 늘었다.

    '
  points:
  - 메신저(WhatsApp·Telegram·Slack·Signal·iMessage 등) → 격리된 에이전트로 라우팅
  - Gateway = 로컬-퍼스트 컨트롤 플레인(데몬) / 모델 비종속 / MIT 라이선스
  - 메인 세션은 호스트에서 bash·read·write·edit 직접 실행(샌드박스 설정 가능)·별 37만+ 주장
  source: https://github.com/openclaw/openclaw
- category: ai
  title: ccusage — 코딩 에이전트 토큰·비용을 로컬 로그만으로 집계하는 CLI(16.2k★)
  summary: 'ccusage(ryoppippi)는 "코딩 에이전트 CLI의 토큰 사용량·비용을 로컬 데이터에서 분석"하는 CLI다. API 호출 없이 ~/.claude 같은 로컬 사용 기록(JSONL)을 읽어 일·주·월·세션 단위 리포트와 USD 비용을 보여준다. `bunx ccusage`로 바로 실행되고, `blocks`는 Claude Code의 5시간 과금 창을 추적하며 활성 블록을 모니터링한다. `--offline`으로 네트워크 없이 번들된 LiteLLM 가격표를 쓰고, `--json`·`--breakdown`(모델별)·`--since/--until` 필터, 그리고 상태줄(statusline, 베타) 표시도 지원한다. MIT 라이선스, README 기준 별 16.2k개. Claude Code뿐 아니라 Codex·OpenCode·Amp·Goose·Gemini CLI·Copilot CLI 등 다수 에이전트를 통합 리포트로 묶는다.

    '
  points:
  - 로컬 JSONL만 읽어 일·주·월·세션 비용 집계 — API 호출 없이 동작, `--offline` 지원
  - '`blocks`로 Claude Code 5시간 과금 창 추적 / `--breakdown`은 모델별 분해'
  - Claude Code·Codex·OpenCode·Amp·Goose·Gemini/Copilot CLI 등 통합 / MIT·16.2k★(주장)
  source: https://github.com/ryoppippi/ccusage
- category: ai
  title: Claude Code on the web — 터미널 안 열고 브라우저·모바일에서 작업을 클라우드에 던지기
  summary: 'Claude Code를 터미널 없이 claude.ai/code에서 돌리는 리서치 프리뷰다. GitHub 레포를 연결하고 할 일을 적으면, Anthropic이 관리하는 클라우드 VM에 레포가 클론된 채 작업이 돌고 끝나면 PR 초안까지 자동으로 만들어 준다. 여러 작업을 여러 레포에 걸쳐 병렬로 띄울 수 있어 버그 백로그·반복 수정 같은 일을 한 화면에서 한꺼번에 굴리기 좋다. 세션은 브라우저를 닫아도 유지되고 Claude 모바일 앱에서 모니터링된다. Pro·Max·Team과 일부 Enterprise 좌석이 대상이다.

    '
  points:
  - 각 세션은 격리된 Anthropic 관리 VM에서 실행 / GitHub은 보안 프록시로 인증돼 토큰이 컨테이너에 안 들어감
  - 터미널의 `--remote`로 클라우드 작업을 띄우고 `--teleport`로 웹↔터미널 세션을 옮긴다
  - 네트워크는 기본 Trusted 허용목록(npm·PyPI·crates.io 등)으로 제한, 환경별로 조정 / 리서치 프리뷰
  source: https://code.claude.com/docs/en/claude-code-on-the-web
- category: ai
  title: AI-research-SKILLs(Orchestra Research) — 에이전트를 'AI 리서치 전문가'로 만드는 98개 스킬 묶음(9.7k★)
  summary: '코딩 에이전트에 파인튜닝·분산학습·RAG·평가 같은 AI 리서치/엔지니어링 지식을 SKILL.md 형태로 주입하는 오픈소스 라이브러리다. README 기준 98개 스킬을 23개 카테고리(파인튜닝, 포스트트레이닝, 추론 서빙, 토크나이저, 평가, 안전·정렬, RAG, 멀티모달, MLOps, 메카닉 인터프 등)로 나눠 담았고, 깃허브 별 9.7k(주장)를 받았다. 스킬은 표준 SKILL.md 포맷이라 Claude Code뿐 아니라 OpenCode·Cursor·Codex·Gemini CLI·Qwen Code 등 여러 에이전트에서 그대로 쓸 수 있다.

    '
  points:
  - 'Claude Code 설치: `/plugin marketplace add orchestra-research/AI-research-SKILLs` 후 카테고리별로 `/plugin install fine-tuning@ai-research-skills`'
  - 범용 SKILL.md 표준이라 OpenCode·Cursor·Codex·Gemini CLI·Qwen Code 등에서 동일하게 사용(README 명시)
  - '''어떤 스킬을 쓸지'' 에이전트가 알 필요 없게 리서치 생애주기(서베이→아이디어→실험→합성→논문)를 자동 라우팅'
  source: https://github.com/Orchestra-Research/AI-research-SKILLs
- category: ai
  title: 서브레시피 파이프라인 — 복잡한 작업을 'YAML 레시피'로 쪼개 단계·병렬로 돌리기
  summary: '코딩 에이전트 워크플로를 한 프롬프트에 욱여넣는 대신, 단계를 파일로 굳혀 조립하는 패턴이다. Goose(현 Linux Foundation AAIF) 레시피가 대표 구현으로, 메인 레시피의 `sub_recipes` 필드에 `name`/`path`/`values`를 적으면 각 서브레시피가 ''도구''로 등록된다. 호출되면 서브레시피는 메인과 대화 이력·메모리·상태를 공유하지 않는 ''별도 세션''에서 격리 실행되고 결과만 메인으로 돌려준다 — 즉 컨텍스트 오염 없이 "보안 스캔 → 품질 검사" 같은 전문 단계를 파이프라인으로 엮을 수 있다. 서로 다른 서브레시피는 기본적으로 순차 실행이고, 같은 서브레시피를 여러 입력으로 돌리면 최대 10개 워커로 자동 병렬화된다(공식 문서: 실험적 기능, 동작이 바뀔 수 있음).

    '
  points:
  - '메인 레시피의 sub_recipes: {name, path, values}로 등록 → 각 서브레시피가 도구로 노출됨'
  - 서브레시피는 별도 세션에서 격리 실행(이력·메모리 비공유), 결과만 반환 / 중첩(서브의 서브) 금지
  - 서로 다른 레시피=기본 순차, 같은 레시피 반복=기본 병렬(최대 10워커) — 모두 실험적 기능(공식 문서)
  source: https://github.com/aaif-goose/goose/blob/main/documentation/docs/guides/recipes/subrecipes.md
- category: ai
  title: GNAP — git 저장소 하나로 AI·사람 에이전트를 조율하는 프로토콜
  summary: 'GNAP(Git-Native Agent Protocol)은 서버·DB 없이 오직 git만으로 여러 에이전트를 협업시키는 MIT 라이선스 프로토콜이다. "JSON 파일 네 개가 프로토콜 전부"라는 게 모토로, .gnap/ 폴더 안의 agents.json(팀), tasks/(할 일), runs/(시도), messages/(소통) 만으로 돌아간다. 각 에이전트는 git pull→agents.json에서 자기 활성 여부 확인→ tasks/에서 맡은 일·messages/ 확인→작업 후 커밋·push를 하트비트처럼 반복하고, git 히스토리 자체가 감사 로그가 된다. 만든 곳(Farol Labs)에서는 AI 2 + 사람 2, 총 4 에이전트가 같은 레포로 50개 넘는 작업을 굴리고 있다.

    '
  points:
  - '엔티티 4종: Agent(agents.json)·Task(tasks/*.json)·Run(runs/*.json)·Message(messages/*.json)'
  - '오프라인·벤더 종속 없음: git push만 할 수 있으면 사람이든 AI든 동등하게 참여'
  - '버전 안전장치: .gnap/version이 자기가 지원하는 버전보다 높으면 작동을 거부하게 권고'
  source: https://github.com/farol-team/gnap
- category: ai
  title: Open SWE(LangChain) — 깃허브 이슈에 라벨만 붙이면 도는 비동기 클라우드 코딩 에이전트
  summary: 'Open SWE는 LangChain이 ''org 내부 코딩 에이전트를 만드는 프레임워크''로 공개한 오픈소스 프로젝트(MIT). 터미널에 붙어 있지 않아도 깃허브 이슈에 `open-swe-auto` 같은 라벨을 붙이면 알아서 작업해 PR을 올리는 비동기·클라우드 호스팅 방식이다. LangGraph(Deep Agents) 위에서 Manager→Planner→Programmer→Reviewer 네 에이전트가 역할을 나눠 돈다. 모든 작업은 Daytona 같은 격리 샌드박스 안에서 실행돼 내 머신을 건드리지 않고, 계획이 나오면 멈춰 사람이 수정·승인할 수 있게 끊어 준다.

    '
  points:
  - '비동기: 깃허브 이슈에 라벨 붙이면 백그라운드에서 돌아 PR 생성(터미널 상주 불필요)'
  - '역할 분업: Manager(라우팅)→Planner(계획)→Programmer(실행)→Reviewer(품질 검토)'
  - 격리 샌드박스(Daytona 등) + 계획 단계에서 멈춰 사람이 accept/edit/reject
  source: https://www.langchain.com/blog/introducing-open-swe-an-open-source-asynchronous-coding-agent
- category: ai
  title: DX 도구별 PR 처리량 벤치마크 — '얼마나 자주 쓰느냐'가 도구 이름보다 크다
  summary: '개발자 생산성 분석 회사 DX가 219개 기업·6만4,680명 개발자의 ''실제 머지된 PR'' 데이터를 도구별로 집계해 공개했다(2026 Q1, 2026-01-21 갱신). 핵심은 도구를 매일 쓰는 ''빈번 사용자''의 주당 머지 PR 중앙값이 모든 주요 도구에서 함께 올랐다는 것 — Cursor는 2.8→4.1(46% 증가), Claude는 2.6→4.0 이상, GitHub Copilot은 2.5→3.61로 뛰었다. 즉 어떤 도구를 고르느냐보다 ''매일 손에 붙이느냐''가 처리량 차이를 더 크게 가른다는 게 데이터의 메시지다. 단, DX 스스로도 PR 수는 ''움직임''이지 제품 가치·품질의 증거는 아니라고 단서를 단다.

    '
  points:
  - '표본: 219개 기업·64,680명 개발자의 실제 머지된 PR(자기보고 아님), 2026 Q1'
  - '빈번 사용자 주당 PR 중앙값: Cursor 4.1(+46%)·Claude 4.0+·Copilot 3.61 — 전 도구 동반 상승'
  - 'DX 단서: PR 수는 ''코드 변경량''일 뿐 품질·고객가치의 척도가 아님'
  source: https://getdx.com/blog/ai-tooling-benchmarks-pr-throughput-and-usage-by-tool/
- category: ai
  title: Everything Claude Code(ECC) — 200k★ 넘긴 '에이전트 설정 모음', AgentShield 보안 감사기까지
  summary: 'Affaan Mustafa가 만든 ECC는 코딩 에이전트용 설정·자산을 한 레포에 모은 MIT 라이선스 프로젝트로, GitHub 스타 200k 이상을 주장하는 최상위 인기 저장소다. 약 67개 서브에이전트, 260여 개 스킬, 80여 개 슬래시 커맨드 호환 심(shim), 훅·MCP 설정을 담고 있고 Claude Code뿐 아니라 Codex·Cursor· OpenCode·Gemini·Zed·Copilot 등 여러 하네스에 걸쳐 동작한다고 명시한다(하네스별 자산 수는 다름). 특히 AgentShield라는 보안 감사 도구가 함께 들어 있어 CLAUDE.md·settings.json·MCP 설정·훅·에이전트 정의·스킬을 정적 분석해 비밀키 노출·권한·훅 인젝션 위험 등을 등급(A~F)으로 리포트한다. 단, README 자체가 섹션마다 수치(에이전트·스킬 개수)가 달라 정확한 숫자는 ''대략''으로 받아들이는 게 안전하다.

    '
  points:
  - 'MIT·크로스하네스: Claude Code/Codex/Cursor/OpenCode/Gemini/Zed/Copilot 지원, 자산 수는 하네스별로 다름'
  - '구성(README 기준 대략): 서브에이전트 ~67개, 스킬 260여 개, 슬래시 커맨드 심 80여 개 + 훅·MCP 설정'
  - 'AgentShield: 설정·훅·MCP를 정적 분석(102개 룰·비밀키 14패턴), A~F 등급 리포트·critical 시 exit 2'
  source: https://github.com/affaan-m/everything-claude-code
- category: ai
  title: Sim — '채팅·비주얼·코드'로 AI 에이전트를 짜는 오픈소스 워크스페이스(simstudioai·28.8k★)
  summary: 'Sim(simstudioai/sim)은 팀이 AI 에이전트를 만들고 배포·운영하는 Apache-2.0 오픈소스 워크스페이스로, README 기준 GitHub 스타 28.8k·포크 3.7k를 보인다. "Build, deploy, and orchestrate AI agents"를 내걸고 대화(Chat)·블록 단위 비주얼 캔버스(Workflow builder)·코드 세 방식으로 에이전트를 구성하게 한다. RAG용 지식베이스, 내장 DB격 Tables, 프롬프트로 파일·문서 생성 같은 기능을 갖췄고 1,000개 이상의 통합을 연결한다고 명시한다. 로컬 실행은 Docker가 깔린 상태에서 `npx simstudio`(http://localhost:3000) 한 줄이면 되고, Ollama·vLLM로 로컬 모델도 붙일 수 있어(docker-compose.ollama.yml) 데이터를 밖으로 안 내보내고 self-host 할 수 있다. (스타·통합 수는 README가 주장하는 수치다.)

    '
  points:
  - Apache-2.0 오픈소스, 28.8k★(README 기준) — 에이전트 빌드·배포·오케스트레이션 워크스페이스
  - '구성 3방식: 대화형 Chat·블록 비주얼 캔버스·코드 / RAG 지식베이스·Tables·1,000+ 통합'
  - '로컬: Docker 위 `npx simstudio`로 :3000 / Ollama·vLLM로 로컬 모델 self-host 가능'
  source: https://github.com/simstudioai/sim
- category: ai
  title: Sentry Seer — 프로덕션 텔레메트리로 근본원인을 찾아 코딩 에이전트에 넘기는 디버깅 에이전트
  summary: 'Seer(옛 Autofix)는 Sentry가 만든 AI 디버깅 에이전트로, 스택트레이스를 챗봇에 붙여넣는 대신 Sentry가 이미 수집한 에러·트레이스·로그·커밋 같은 프로덕션 컨텍스트 위에서 직접 추론해 근본원인을 짚는다. 2026-01-27 발표로 활동 범위가 프로덕션을 넘어 로컬 개발과 코드리뷰까지 확장됐고, 로컬에서는 Sentry MCP 서버를 통해 코딩 에이전트에 붙는다. 핵심은 정적 코드 분석만으로는 안 잡히는 런타임·분산 시스템 버그까지 실제 운영 데이터로 좁힌다는 점이다. 요금은 기여자(active contributor) 1명당 월 $40 무제한 정액제다.

    '
  points:
  - 스택트레이스 붙여넣기 대신 Sentry의 프로덕션 텔레메트리(에러·트레이스·로그·커밋) 위에서 근본원인 추론
  - 근본원인 분석을 Claude·Cursor·GitHub Copilot 에이전트에 넘겨 자동으로 수정·PR 생성(공식 통합)
  - 프로덕션·로컬(Sentry MCP)·코드리뷰 3면 커버, 요금은 활동 기여자당 월 $40 무제한 정액
  source: https://sentry.io/about/press-releases/sentry-expands-seer-ai-debugging-agent
- category: ai
  title: Jules(Google) — 계획을 먼저 보여주고 VM에서 자율로 도는 GitHub 코딩 에이전트
  summary: 'Jules는 구글이 만든 자율 코딩 에이전트로, GitHub에 연동해 클라우드 VM에서 레포를 클론하고 의존성을 설치한 뒤 파일을 고친다. 작업을 던지면 코드를 건드리기 전에 ''계획(plan)''을 먼저 생성해 사람이 검토·승인하게 하고, 레포 루트의 AGENTS.md를 자동으로 읽어 코드베이스 규칙을 파악한다. 모델은 무료 등급이 Gemini 2.5 Pro, 유료 등급은 Gemini 3 Pro 계열을 쓴다.

    '
  points:
  - '등급별 한도(공식): 무료 하루 15작업·동시 3개 / Pro 100작업·동시 15개 / Ultra 300작업·동시 60개'
  - 유료 등급은 별도 구독이 아니라 Google AI Pro/Ultra 플랜에 포함 — 현재 개인 @gmail 계정만
  - 코드를 바꾸기 전 계획 승인 단계가 있고, private 코드로 학습하지 않으며 VM 안에 격리
  source: https://jules.google/docs/usage-limits/
- category: ai
  title: /fork — 서브에이전트와 달리 '대화 전체'를 물려받는 분신 띄우기
  summary: '서브에이전트는 빈 컨텍스트에서 새로 시작하지만, fork(/fork)는 지금까지의 대화 전체 — 시스템 프롬프트·도구·모델·메시지 히스토리 — 를 그대로 물려받은 분신이다. 상황을 다시 설명할 필요 없이 곁다리 작업을 던질 수 있고, fork의 도구 호출은 메인 대화에 안 섞이고 최종 결과만 돌아와 컨텍스트 창은 깨끗하게 유지된다. 시스템 프롬프트·도구가 부모와 동일해 첫 요청이 부모의 프롬프트 캐시를 재사용하므로, 같은 맥락이 필요한 작업이면 새 서브에이전트보다 싸다.

    '
  points:
  - '공식 비교: fork=대화 전체+캐시 공유 / 명명된 서브에이전트=새 컨텍스트+별도 캐시'
  - '`/fork <지시>`로 백그라운드 분신 실행 — 끝나면 결과가 메인 대화에 메시지로 도착'
  - v2.1.117+ 필요(2.1.161부터 기본 활성), CLAUDE_CODE_FORK_SUBAGENT=1로 강제 on/off
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: Task Master — PRD를 던지면 '의존성 달린 태스크 목록'으로 쪼개주는 에이전트(MIT+CC)
  summary: 'Task Master(eyaltoledano/claude-task-master)는 PRD 문서 하나를 넣으면 `task-master parse-prd`로 작업을 잘게 나누고, 태스크 사이 의존성·우선순위까지 정리해 에이전트가 예측 가능하게 일하도록 구조를 잡아주는 태스크 매니저다. Cursor·Claude Code·Windsurf·VS Code 등에 MCP로 붙거나 `npm i -g task-master-ai`로 CLI로 쓸 수 있고, `task-master next`로 다음 할 일을, `list`로 전체를 본다. 모델은 main·research·fallback 세 역할로 나눠 쓰며, Claude Code나 Codex의 OAuth를 쓰면 별도 API 키 없이도 돌릴 수 있다.

    '
  points:
  - PRD→태스크 분해 + 의존성/복잡도 분석이 핵심 — `parse-prd`, `next`, `expand`, `move`
  - MCP로 에디터에 직접 붙고(CLI도 지원), 모델 역할을 main/research/fallback로 분리
  - 라이선스는 MIT + Commons Clause(호스팅 서비스·경쟁 제품화는 제한), 레포 표기 27.5k★ 주장
  source: https://github.com/eyaltoledano/claude-task-master
- category: ai
  title: Zed — Atom·Tree-sitter 제작진의 에디터, Claude Code·Codex·Gemini를 '패널'에 품다(GPL-3.0·85k★)
  summary: 'Zed(zed-industries/zed)는 Atom·Tree-sitter를 만든 팀의 고성능 오픈소스 코드 에디터(GPL-3.0, 레포 표기 약 85k★)다. 핵심은 자체 AI만 미는 게 아니라 Agent Client Protocol(ACP)로 외부 코딩 에이전트를 에디터 안 Agent Panel에 그대로 띄운다는 점 — Claude Code·Codex·OpenCode·Copilot·Cursor·Gemini CLI를 ACP Registry에서 설치해 쓴다. 외부 에이전트는 별도 프로세스로 돌고 인증·과금·모델선택·도구를 각자 소유하며, Zed는 스레드만 호스팅한다. Zed는 외부 에이전트 사용에 과금하지 않는다고 문서가 명시한다(과금은 에이전트 제공자와 사용자 사이).

    '
  points:
  - ACP로 Claude Code·Codex·Gemini CLI·Cursor·OpenCode를 에디터 Agent Panel에 통합
  - '외부 에이전트는 별도 프로세스 — 인증(예: Claude는 /login)·과금·모델을 에이전트가 직접 소유'
  - 'Zed가 설정한 MCP 서버를 ACP로 외부 에이전트에 전달 가능, dev: open acp logs로 통신 디버깅'
  source: https://zed.dev/docs/ai/external-agents
- category: ai
  title: Claude Agent SDK — 'Claude Code를 라이브러리로' 받아 자체 에이전트를 짜는 공식 SDK
  summary: 'Claude Agent SDK는 Claude Code를 구동하는 도구·에이전트 루프·컨텍스트 관리를 Python·TypeScript 라이브러리로 그대로 노출한 Anthropic 공식 SDK다. CLI는 사람이 타이핑하는 셸이고, 이 SDK는 같은 엔진을 코드에서 query()로 호출하는 형태 — `query(prompt=..., options=ClaudeAgentOptions(allowed_tools=["Read","Edit","Bash"]))` 한 줄로 파일을 읽고 버그를 찾아 고치는 에이전트가 돈다. 핵심은 모델을 직접 부르는 게 아니라 ''에이전트 루프''를 SDK가 대신 돌려준다는 점이다. Anthropic이 직접 운영하는 Managed Agents(호스티드 REST API)와 달리, Agent SDK는 에이전트 루프를 내 프로세스 안에서 돌린다고 공식 문서가 구분한다.

    '
  points:
  - Read·Write·Edit·Bash·Glob·Grep 등 Claude Code 내장 도구와 에이전트 루프를 그대로 제공
  - Hooks(PreToolUse·PostToolUse·Stop·SessionStart 등)로 도구 호출을 검증·로깅·차단·변형
  - Subagents·MCP·Permissions(allowed_tools)·Sessions(resume/fork)와 .claude/ 설정(스킬·명령·CLAUDE.md) 로드 지원
  source: https://code.claude.com/docs/en/agent-sdk/overview
- category: ai
  title: AI 랩이 개발 툴체인을 사들이는 중 — Anthropic→Bun, OpenAI→Astral(uv·ruff)
  summary: '2025년 12월 Anthropic이 첫 인수로 JavaScript 런타임 Bun(MIT)을, 비슷한 시기 OpenAI가 Python 툴링 회사 Astral(uv·ruff·ty 제작)을 인수한다고 발표했다. 이유는 같다 — 코딩 에이전트가 곧 회사 매출의 핵심이 됐고(Claude Code는 발표 당시 연 환산 10억 달러), 에이전트가 코드를 생성·설치·린트·타입체크하는 토대를 직접 소유해야 빠르고 안정적이기 때문이다. Anthropic은 "Claude Code가 Bun 실행 파일로 배포된다 — Bun이 깨지면 Claude Code가 깨진다"고 명시했다. 실무 포인트: 당신이 매일 쓰는 uv·ruff·Bun이 특정 AI 랩의 전략 자산이 됐다는 뜻 — 양쪽 모두 오픈소스·기존 라이선스 유지를 약속했지만, 로드맵 우선순위가 그 랩의 에이전트에 맞춰질 수 있음을 감안해 도구 선택을 하라.

    '
  points:
  - Anthropic→Bun(2025-12, MIT 유지·기존 팀 잔류), OpenAI→Astral(uv·ruff·ty, 오픈소스 지속 지원 약속) — 둘 다 '첫 인수'급 전략 거래
  - '동기는 수직 통합: 에이전트의 코드 생성→의존성→린트→타입체크 루프를 자사 툴로 닫아 속도·안정성 확보'
  - 오픈소스·permissive 라이선스라 커뮤니티 포크는 언제든 가능 — 단 로드맵이 인수사 에이전트 우선순위로 기울 리스크는 남는다
  source: https://www.anthropic.com/news/anthropic-acquires-bun-as-claude-code-reaches-usd1b-milestone
- category: ai
  title: ccpi + tonsofskills.com — 플러그인·스킬·에이전트를 키워드로 검색·설치하는 오픈소스 마켓플레이스 CLI
  summary: 'Claude Code 플러그인 생태계가 커지면서, 흩어진 플러그인을 ''검색→설치→업데이트''로 다루는 패키지 매니저식 도구가 등장했다. jeremylongshore의 claude-code-plugins-plus-skills 레포(MIT)는 ccpi라는 CLI와 tonsofskills.com 호스팅 마켓플레이스를 함께 제공한다. ccpi는 `ccpi search devops`로 키워드 검색, `ccpi install <pack>`로 설치, `ccpi list --installed`·`ccpi update`로 관리, `ccpi validate ./my-plugin`로 자작 플러그인 검증까지 한다. 실무 포인트: `/plugin marketplace add`로 GitHub 레포를 마켓플레이스로 붙이면 Discover 탭에 공식 플러그인과 나란히 뜨므로, 팀 공용 플러그인을 한 소스로 배포·갱신하기 좋다.

    '
  points:
  - 'ccpi 설치: `pnpm add -g @intentsolutionsio/ccpi` — search/install/list/update/validate 서브커맨드 제공(MIT)'
  - '마켓플레이스 추가는 Claude Code 내장 명령으로도 가능: `/plugin marketplace add jeremylongshore/claude-code-plugins`'
  - '레포 README 주장 규모(검증 시점 기준): 플러그인 425개·스킬 약 2,800개·에이전트 200개, 별 2.4k★ — 숫자는 갱신될 수 있어 참고치'
  source: https://github.com/jeremylongshore/claude-code-plugins-plus-skills
- category: ai
  title: BMAD-METHOD — '애자일 팀 전체'를 에이전트로 흉내 내는 IDE 비종속 개발 방법론(49k★)
  summary: 'BMAD-METHOD(Breakthrough Method for Agile AI-Driven Development)는 단일 코딩 툴이 아니라 PM·아키텍트·개발자·UX·QA 등 12종 이상 역할 에이전트를 오케스트레이션하는 방법론 프레임워크다(MIT, 약 49.2k★). 핵심은 2단계 분업: 먼저 웹 LLM(Gemini Gems·ChatGPT Custom GPT 등)에서 브레인스토밍→제품 브리프→PRD→아키텍처 문서를 만들고, 그 ''폴리시된 산출물''을 IDE로 가져와 구현한다. Scrum Master 에이전트가 이 문서를 잘게 쪼갠 ''개발 스토리''로 바꿔 dev 에이전트에 통째로 넘기는 게 특징이라, 컨텍스트 누락이 줄어든다. Claude Code·Cursor·Cline·Roo·Aider 등 에이전트를 가리지 않고 `npx bmad-method install`로 붙는다.

    '
  points:
  - '2단계 워크플로: (1)웹 LLM에서 기획·아키텍처 문서 작성 → (2)IDE에서 구현. Scrum Master가 문서를 ''개발 스토리''로 분해해 dev에 전달'
  - 12+ 역할 에이전트(PM·Architect·Developer·UX·QA…)와 여러 페르소나를 한 세션에 모으는 'Party Mode' 제공
  - IDE 비종속(Claude Code·Cursor·Cline·Roo·Aider 등) — `npx bmad-method install`로 설치, 라이선스 MIT(공식 레포 bmad-code-org, 약 49.2k★)
  source: https://github.com/bmad-code-org/BMAD-METHOD
- category: ai
  title: OpenSpec — Spec Kit보다 가볍게, 코드 짜기 전에 '무엇을 만들지'부터 합의하는 SDD(55k★)
  summary: 'OpenSpec은 AI 코딩 에이전트용 명세 주도 개발(SDD) 프레임워크다(MIT, 약 55k★). 이미 다룬 GitHub Spec Kit이 파이썬 설치·엄격한 단계 게이트의 ''무거운'' 쪽이라면, OpenSpec은 ''fluid not rigid, brownfield not just greenfield''를 내세워 더 가볍게 자유롭게 반복하도록 설계됐다. 핵심은 변경(change) 단위 워크플로: `/opsx:propose`로 제안·스펙·설계·태스크가 담긴 변경 폴더를 만들고, `/opsx:apply`로 태스크를 구현하고, `/opsx:archive`로 완료된 변경을 정리하면서 진짜 스펙을 갱신한다. Claude Code·Cursor 등 25개 이상 도구와 npm/pnpm/bun/nix로 붙는다(Node 20.19+).

    '
  points:
  - '변경 단위 워크플로 3종: /opsx:propose(제안·스펙·설계·태스크 생성) → /opsx:apply(구현) → /opsx:archive(완료분 정리·스펙 갱신)'
  - 'Spec Kit과의 차이: Spec Kit은 파이썬·엄격한 단계 게이트의 ''무거운'' SDD, OpenSpec은 단계 게이트 없이 산출물을 자유롭게 수정하는 ''가벼운'' SDD'
  - 25+ 도구 지원(Claude Code·Cursor 등), MIT 라이선스, Node 20.19+ 필요(공식 레포 Fission-AI/OpenSpec, 약 55k★)
  source: https://github.com/Fission-AI/OpenSpec
- category: ai
  title: Code Mode(Cloudflare) — MCP 도구를 'TypeScript API'로 바꿔 LLM에게 코드로 호출하게 하기
  summary: 'Cloudflare가 제안한 패턴으로, MCP 도구를 LLM에게 직접 노출해 ''tool call''을 시키는 대신 도구 스키마를 doc 주석 달린 TypeScript API로 변환한 뒤 LLM이 그 API를 호출하는 코드를 짜게 한다. 근거는 "LLM은 tool call보다 코드를 훨씬 많이 학습했다"는 것 — tool 호출보다 코드 작성을 더 잘한다는 가정이다. 여러 도구를 한 번에 엮어 호출해 왕복 횟수·토큰 낭비를 줄이며, 생성된 코드는 컨테이너가 아니라 V8 isolate 샌드박스(Worker Loader API)에서 수 ms 만에 띄워 실행한다.

    '
  points:
  - Agents SDK가 MCP 서버 스키마를 가져와 TypeScript API(doc 주석 포함)로 변환 → 에이전트엔 '그 코드를 샌드박스에서 실행하는 도구' 하나만 준다
  - 직접 tool call 대신 코드로 도구를 엮어 호출 → 여러 단계를 한 번에 처리해 왕복·토큰 절감(글은 정량 %는 제시 안 함, 정성적 주장)
  - 샌드박스는 컨테이너가 아닌 V8 isolate — 수 ms·수 MB로 기동(Worker Loader API). 저자 Kenton Varda·Sunil Pai, 2025-09-26 공개
  source: https://blog.cloudflare.com/code-mode/
- category: ai
  title: 에이전트 팀으로 C 컴파일러 짜기(Anthropic) — 병렬 자율 에이전트 '하네스'를 설계하는 실전 교훈
  summary: 'Anthropic 연구원 Nicholas Carlini가 Claude 에이전트 16개를 동시에 돌려, Linux 6.9를 x86·ARM·RISC-V에서 빌드하는 10만 줄짜리 Rust C 컴파일러를 만든 실험 기록이다(약 2,000세션·약 $20,000 소요). 핵심 교훈은 도구 이름이 아니라 ''하네스(작업 환경)''를 어떻게 설계하느냐에 있다. 검증기(verifier)가 거의 완벽해야 하며 그렇지 않으면 "Claude가 엉뚱한 문제를 푼다". 또 Claude는 시간 감각이 없어("can''t tell time") 방치하면 진척 대신 테스트만 몇 시간씩 돌리므로, 1%·10% 무작위 샘플을 도는 --fast 옵션으로 회귀를 빨리 잡게 했다.

    '
  points:
  - 검증기가 곧 목표 — "task verifier가 거의 완벽하지 않으면 Claude는 엉뚱한 문제를 푼다". 기능 추가가 기존 동작을 자주 깨뜨려 결국 CI를 붙임
  - '병렬화: 테스트가 많이 깨질 땐 각 에이전트가 하나씩 집어 쉽지만, 단일 Linux 빌드는 서로 덮어써 충돌 → GCC를 ''known-good 오라클''로 실패 파일 격리'
  - '하네스 위생: 출력 범람 막으려 파일로 로깅·에러는 grep으로 찾게 표시, 작업 점유는 current_tasks/에 파일을 써서 잠금(git이 충돌 시 다른 작업 고르게 강제)'
  source: https://www.anthropic.com/engineering/building-c-compiler
- category: ai
  title: 서브에이전트 4가지 패턴(Philipp Schmid) — '메인 에이전트가 쥔 통제권' 순으로 줄 세우기
  summary: '구글 딥마인드 Philipp Schmid가 2026-05-05에 정리한, 멀티에이전트를 짤 때 고를 수 있는 4가지 패턴이다. 메인 에이전트가 서브에이전트의 생애주기를 얼마나 쥐고 있느냐(통제 수준) 순으로 배열했고, 그에 따라 메인의 역할도 호출자→디스패처→코디네이터→감독자로 바뀐다. 핵심 조언은 "무조건 패턴 1부터 시작하라" — 멀티에이전트처럼 보이는 작업 대부분은 잘 짠 인라인 도구 호출 하나로 끝나며, 위로 올라갈수록 더 센 모델이 필요하다.

    '
  points:
  - '패턴1 인라인 툴: 서브에이전트를 도구 호출 하나로 부르고 결과를 받음 — 리서치·코드리뷰·테스트 생성 같은 자기완결 작업'
  - '패턴2 팬아웃: 여러 서브에이전트를 동시에 띄우고 나중에 결과를 모음 — 서로 의존 없는 독립 작업의 병렬화'
  - '패턴3 에이전트 풀: 장수명 서브에이전트들과 메시지를 주고받으며 다단계 협업 / 패턴4 팀: 서브들끼리 직접 대화하고 메인은 역할만 세팅 후 빠짐 — 조정 로직이 한 에이전트 한계를 넘을 때만'
  source: https://www.philschmid.de/subagent-patterns-2026
- category: ai
  title: 에이전트 코딩의 '80% 문제' — 보이는 80%는 끝내고 안 보이는 20%(인증·DTO·타 레포)를 빼먹는다
  summary: 'Sourcegraph의 Matt Tanner가 2026-05-21에 올린 ''Agentic Coding in 2026'' 글의 핵심은, 에이전트 생산성을 좌우하는 건 모델 성능이 아니라 ''컨텍스트''라는 것이다. 에이전트는 작업의 눈에 보이는 80%는 안정적으로 끝내지만, 인증 미들웨어·API DTO·감사 로그·형제 레포의 통합 테스트 같은 안 보이는 20%를 빼먹는데 — 글은 이를 ''80% 문제''라 부른다. 사이드 프로젝트에선 안 드러나지만 레포 수가 1을 넘는 순간부터 급격히 비용이 커진다. 해법으로 임베딩 기반 근사 검색이 아닌 ''심볼 정확 검색(모든 callsite·구현체)''을 권한다.

    '
  points:
  - '''완료''를 의심하라: 에이전트가 끝났다 하면, 손댄 심볼들을 코드베이스 전체에서 검색해 에이전트가 안 연 파일이 나오면 작업은 미완 — 글이 꼽은 가장 실천적 습관'
  - '권장 운영법: ①과제 블래스트 반경을 레포 전역 검색으로 미리 스코프 ②에이전트 커밋도 사람 커밋과 ''같은 CI''로 게이트 ③에이전트를 외주 계약자처럼 다뤄 diff 리뷰·활동 감사 ④프롬프트가 아니라 ''컨텍스트 레이어''에 투자'
  - 대규모/멀티레포에선 임베딩 근사 검색보다 '결정적·전수(deterministic, exhaustive) 검색'을 권장 — 단 Sourcegraph 자사(코드검색 제품) 글이라 제품 포지셔닝은 감안할 것
  source: https://sourcegraph.com/blog/agentic-coding
- category: ai
  title: chrome-devtools-mcp(Google) — 에이전트가 '생성한 코드가 브라우저에서 실제로 뭘 하는지' 직접 들여다보게 하는 MCP(43.7k★)
  summary: 'chrome-devtools-mcp는 Chrome DevTools 공식 조직이 내놓은 MCP 서버로, 코딩 에이전트(Claude·Cursor·Copilot·Antigravity 등)가 ''살아 있는 Chrome''을 직접 제어·검사하게 해준다. 에이전트가 코드를 짜고도 그게 브라우저에서 실제로 어떻게 동작하는지 못 봐서 생기는 ''AI 생성→사람이 테스트→에러 보고→다시 시도''의 왕복을 없애는 것이 목적이다. puppeteer로 동작을 자동화하고 결과를 자동 대기하며, 네트워크 요청 분석·콘솔 메시지 확인·성능 트레이스 기록까지 한다. 라이선스는 Apache-2.0.

    '
  points:
  - 약 48개 도구를 카테고리로 제공 — 입력 자동화(click·fill·type 등 10개)·내비게이션(6)·성능 트레이스(3)·네트워크(2)·디버깅(evaluate_script·take_screenshot·list_console_messages·lighthouse_audit 등 8)·메모리 힙스냅샷(8) 등
  - Playwright MCP가 '크로스브라우저 사용자 플로 실행'에 강하다면, 이쪽은 'Chrome 한 페이지를 DevTools 깊이로 디버깅·성능 프로파일링'에 특화 — 둘은 겹치되 용도가 다름
  - Claude Code·Cursor·Gemini CLI·Copilot 등 다수 클라이언트 지원 — 별 수 약 43.7k★, 포크 2.8k(레포 표기 기준)
  source: https://github.com/ChromeDevTools/chrome-devtools-mcp
- category: ai
  title: Cipher → ByteRover CLI — 도구가 바뀌어도 따라다니는 '코딩 에이전트용 휴대 메모리 레이어'
  summary: 'Cipher는 코딩 에이전트에 영속적·구조적 메모리를 붙여주는 오픈소스 프로젝트로, 지금은 ByteRover CLI(brv)로 리브랜딩됐다(ByteRover 팀). 핵심 발상은 프로젝트 지식을 ''컨텍스트 트리''에 담고 git처럼 branch·commit·merge·push/pull로 버전 관리하며, 이를 클라우드에 동기화해 도구·팀 간에 공유하는 것이다. 덕분에 Cursor에서 쌓은 맥락을 Claude Code·Windsurf·Cline에서도 그대로 이어 쓸 수 있다 — 에이전트마다 컨텍스트를 처음부터 다시 쌓을 필요가 없다. MCP로 연동하고 20개 LLM 제공사·24개 내장 도구를 지원하며, 22개 이상의 AI 코딩 에이전트와 붙는다. 라이선스는 Elastic License 2.0.

    '
  points:
  - 컨텍스트 트리 + git식 버전 관리(branch·commit·merge·push/pull) + 클라우드 동기화 — 도구를 갈아타도 메모리가 따라다니는 게 핵심
  - MCP 연동, LLM 20개사(Anthropic·OpenAI·Google 등)·내장 도구 24종 지원, 22+ 코딩 에이전트(Cursor·Claude Code·Windsurf·Cline 등)와 호환
  - '메모리 벤치마크 자체 주장: LoCoMo 96.1%·LongMemEval-S 92.8%(레포 표기) — 별 수 약 4.9k★, TypeScript, 설치는 `npm i -g byterover-cli`(Node 20+)'
  source: https://github.com/campfirein/cipher
- category: ai
  title: Kilo Code — VS Code·JetBrains에서 모드를 갈아끼우며 도는 올인원 오픈소스 코딩 에이전트(MIT·20k★)
  summary: 'Kilo Code는 자연어로 코드를 생성하고, 터미널 명령을 실행하고, 브라우저를 자동화하고, 인라인 자동완성까지 제공하는 MIT 오픈소스 ''올인원 에이전트 엔지니어링 플랫폼''이다. Cline·Roo Code 계열처럼 하나의 만능 챗봇이 아니라 작업 성격에 따라 모드를 바꿔 쓴다 — 설계는 Architect로 계획하고, 구현은 Coder로 짜고, 버그는 Debugger로 잡으며, 직접 커스텀 모드도 만들 수 있다. 모델·도구 비종속이라 500개 이상 LLM을 BYO 키로 꽂거나 키 없이도 시작할 수 있고, MCP 마켓플레이스로 기능을 확장한다.

    '
  points:
  - VS Code·JetBrains 확장에 더해 CLI·Slack·Cloud까지 — Kilo CLI는 OpenCode를 포크해 만들었다(공식 README)
  - '멀티 모드: Architect(계획)/Coder(구현)/Debugger(디버그) + 커스텀 모드 — 작업 단계별로 발판을 갈아끼우는 하네스 패턴'
  - 500+ 모델·BYO 키(키 옵션)·MCP 서버 마켓플레이스 — 별 수 약 20.1k★ 주장, MIT 라이선스
  source: https://github.com/Kilo-Org/kilocode
- category: ai
  title: Bumblebee(Perplexity) — 에이전트가 깐 MCP 서버·확장을 '코드 실행 없이' 훑어 공급망 노출을 잡는 스캐너
  summary: '코딩 에이전트를 쓰다 보면 MCP 서버, VS Code·Cursor·Windsurf 확장, npm·PyPI 패키지를 검증 없이 잔뜩 깔게 되는데, 정작 ''내 머신에 뭐가 깔려 있는지'' 알기 어렵다. Bumblebee는 Perplexity가 공개한 Apache-2.0 스캐너로, 이 표면들을 한 번에 인벤토리한다. 핵심은 ''읽기 전용'' 설계 — `npm ls`·`pip show` 같은 패키지 매니저를 실행하지 않고, 락파일·설치 메타데이터·확장 매니페스트·MCP JSON 설정만 읽어 (생태계, 이름, 버전) 목록을 NDJSON으로 뽑는다. 자체 CVE DB는 없고, 사용자가 준 ''노출 카탈로그(JSON)''와 정확히 일치하는 것만 플래그한다.

    '
  points:
  - '스캔 표면: npm·PyPI·Go·RubyGems·Composer·Bun·pnpm·Yarn·Homebrew + MCP 설정·에디터 확장(VS Code/Cursor/Windsurf)·브라우저 확장·에이전트 스킬'
  - '읽기 전용: 패키지 매니저 실행 없음·소스 파일 안 읽음 — 락파일과 매니페스트만 파싱, MCP env 블록의 자격증명은 출력 안 함'
  - Go 1.25+·비표준 의존성 0개, 일회성 스캐너(반복은 cron/launchd 책임), 탐지는 PR로 갱신되는 노출 카탈로그에 의존
  source: https://github.com/perplexityai/bumblebee
- category: ai
  title: Deep Agents(LangChain) — 'Claude Code에서 영감받아' 만든 범용 에이전트 하네스(MIT)
  summary: '그냥 LLM에 도구만 물려 루프 돌리면(ReAct) 멀티스텝 장기 작업에서 금방 헤맨다. LangChain의 Deep Agents는 Claude Code 같은 도구가 왜 잘 도는지를 일반화해 ''바로 쓸 수 있는, 의견이 들어간 하네스''로 묶었다. LangGraph 위 `create_agent`에 네 가지 기본기 — ① 할 일 계획(todo) 도구 ② 컨텍스트가 격리된 서브에이전트 ③ 읽기·쓰기·편집·검색되는 가상 파일시스템 ④ 빡빡하게 튜닝된 시스템 프롬프트 — 를 미리 끼워 넣었다. `uv add deepagents` 한 줄로 받고, 거기에 컨텍스트 관리·셸·영속 메모리·스킬·MCP를 더 붙일 수 있다.

    '
  points:
  - '핵심 네 기둥: 계획(todo) 도구 + 서브에이전트(컨텍스트 격리) + 가상 파일시스템 + 상세 시스템 프롬프트 — ''장기·멀티스텝 작업''에 맞춰 튜닝'
  - LangGraph 런타임 위 LangChain `create_agent`를 더 의견 있게 감싼 층, 'Claude Code에서 영감받음'을 명시 — 무엇이 그런 도구를 범용으로 만드는지를 일반화한 시도
  - MIT 라이선스, `uv add deepagents`로 설치, 파일시스템은 로컬·샌드박스·원격 백엔드로 교체 가능(pluggable)
  source: https://github.com/langchain-ai/deepagents
- category: ai
  title: Agentic AI Foundation(AAIF) — MCP·goose·AGENTS.md가 리눅스재단 중립 거버넌스로 모이다
  summary: '2025년 12월 9일, 리눅스재단이 ''Agentic AI Foundation(AAIF)''을 출범하며 에이전트 시대의 ''기초 배관'' 격인 오픈 프로젝트 셋을 한데 모았다. Anthropic이 MCP(도구·데이터 연결 표준), Block이 goose(로컬 우선 에이전트 프레임워크), OpenAI가 AGENTS.md(레포별 에이전트 지침 표준)를 각각 기증했다 — 서로 경쟁사인 세 곳이 핵심 자산을 중립 거버넌스에 내놓은 점이 핵심이다. 실무자 입장에선, 지금 쓰는 코딩 에이전트가 의존하는 표준들이 한 벤더에 묶이지 않고 개방·중립으로 유지된다는 신호이자, AGENTS.md를 레포에 두는 관행이 ''사실상 표준''으로 굳어졌다는 뜻이다.

    '
  points:
  - '세 기증 프로젝트와 기증자: MCP(Anthropic)·goose(Block)·AGENTS.md(OpenAI). TechCrunch 표현으로 ''에이전트 시대의 기본 배관'''
  - AGENTS.md는 2025년 8월 이후 '6만 개 넘는 오픈소스 프로젝트'가 채택했다고 재단이 명시(주장) — 레포마다 일관된 에이전트 지침 파일을 두는 관행
  - '플래티넘 멤버: AWS·Anthropic·Block·Bloomberg·Cloudflare·Google·Microsoft·OpenAI. 리눅스재단 산하 directed fund로 운영(MCP는 2024년 11월 오픈소스화)'
  source: https://www.linuxfoundation.org/press/linux-foundation-announces-the-formation-of-the-agentic-ai-foundation
- category: ai
  title: security-guidance 플러그인 — Claude가 짠 코드의 취약점을 같은 세션에서 잡아 고치게 하기
  summary: 'Anthropic 공식 마켓플레이스 플러그인으로, Claude Code가 코드를 짜는 동안 자기 변경을 스스로 보안 검토해 인젝션·안전하지 않은 역직렬화·DOM 주입 같은 취약점을 PR에 도달하기 전에 같은 세션에서 고치게 한다. 검토는 깊이가 다른 3단계로 돈다 — ①파일 편집마다 모델 호출 없는 정규식 패턴 매치(비용 0), ②턴이 끝날 때 그 턴의 git diff를 백그라운드에서 별도 Claude가 보안 관점으로 리뷰, ③Claude가 git commit·push를 할 때 주변 코드(호출부·새니타이저)까지 읽는 더 깊은 에이전틱 리뷰. 핵심은 코드를 짠 같은 인스턴스가 자기를 채점하지 않는다는 점 — 리뷰는 새 컨텍스트의 독립 Claude 호출이다. `/plugin install security-guidance@claude-plugins-official`로 깐다.

    '
  points:
  - '독립 리뷰어: 짠 Claude가 자기 채점 안 함. 턴 끝·커밋 리뷰는 diff에서 출발하는 별도 Claude 호출(신선한 컨텍스트, ''문제만 찾으라''는 보안 프롬프트). 모델 기본값은 Claude Opus 4.7(SECURITY_REVIEW_MODEL·SG_AGENTIC_MODEL로 교체)'
  - '막지는 않음(공식 명시): 어느 단계도 쓰기·커밋을 차단하지 않는다. 발견은 ''지시''로 Claude에 전달돼 대화 안에서 고쳐지고, 리뷰 모델은 놓칠 수 있음 → 방어선의 한 겹일 뿐, 완전한 보안책 아님. 한도: 턴당 변경 30파일·연속 3회, 커밋 리뷰 시간당 20회'
  - '본인 셸 커밋은 제외: Bash 도구로 Claude가 한 commit·push만 리뷰됨(`!` 셸 이스케이프·직접 셸 커밋은 안 봄). 전부 훅(SessionStart·UserPromptSubmit·Stop·PostToolUse)으로 구현 — 소스가 ''훅에서 별도 모델 호출'' 예제. PR엔 Code Review, CI엔 기존 스캐너로 단계 분담'
  source: https://code.claude.com/docs/en/security-guidance
- category: ai
  title: AGENTS.md 실전 — 'README for agents'를 모노레포에 어떻게 까는가(중첩·우선순위 규칙)
  summary: 'AGENTS.md는 "코딩 에이전트를 안내하는 단순·개방 포맷"으로, 공식 사이트가 "a README for agents"라 부른다. README와 분리해 사람용 문서는 짧게 두고, 빌드·테스트·컨벤션 같은 에이전트용 상세 지침을 에이전트가 확실히 찾는 곳에 둔다는 발상이다. 필수 필드는 없고 "그냥 표준 Markdown"이라, 핵심은 양식이 아니라 ''어디에 두느냐''다. 공식 사이트 기준 Codex·Jules·Cursor·Gemini CLI·Copilot 등 다수 도구가 지원하고 6만+ 오픈소스 프로젝트가 쓴다고 명시한다.

    '
  points:
  - '중첩이 핵심: 패키지마다 AGENTS.md를 따로 두면 에이전트는 ''편집 중인 파일에서 가장 가까운 파일''을 자동으로 읽는다 — 모노레포는 서브프로젝트별 맞춤 지침을 각자 싣는 게 정석(예시로 사이트는 ''OpenAI 메인 레포에 88개 AGENTS.md''라 명시)'
  - '우선순위 규칙(충돌 시): 편집 파일에 가장 가까운 AGENTS.md가 이긴다. 단 ''사용자 채팅 프롬프트가 모든 것을 덮는다(override everything)'' — 즉 직접 지시 > 가까운 파일 > 먼 파일'
  - '테스트 자동 실행: 거기 적힌 테스트 명령을 에이전트가 알아서 돌리고 ''작업 끝내기 전에 관련 프로그래매틱 체크를 실행해 실패를 고치려 시도''한다. AAIF(리눅스재단) 거버넌스로 이관돼 CLAUDE.md와도 사실상 호환되는 공용 표준 위치'
  source: https://agents.md
- category: ai
  title: Factory droid — Terminal-Bench 1위·Mission·Custom Droid로 미는 모델 비종속 엔터프라이즈 코딩 플랫폼
  summary: 'Factory AI의 터미널 코딩 에이전트 droid는 Terminal-Bench core v0.1.1에서 Opus 4.1 조합 58.8%로 1위 — 성능 차이의 핵심은 모델 선택보다 에이전트 설계(계층형 프롬프트·모델별 편집·경로 처리·최소 도구 스키마·환경 부트스트랩). `curl -fsSL https://app.factory.ai/cli | sh` 또는 `npm i -g droid`로 설치. 대화형 `droid`·헤드리스 `droid exec`·다단계 `droid exec --mission`. Custom Droid로 팀 규칙·도구 커스터마이즈. 단일 AI 공급자 락인 없이 작업별 모델 라우팅.

    '
  points:
  - Terminal-Bench 1위(58.8%) — 하네스·도구 스키마·환경 부트스트랩이 모델보다 중요
  - '`droid` 대화형 + `droid exec` 헤드리스 + `--mission` 다단계 워크플로'
  - Custom Droid·모델 비종속 라우팅 — 엔터프라이즈 코딩 플랫폼
  source: https://docs.factory.ai/cli/getting-started/overview
- category: ai
  title: Terminal-Bench 2.x — 셸 전체가 문제 공간, '에이전트+모델 쌍'으로 재는 벤치마크(Stanford×Laude·89태스크)
  summary: Terminal-Bench는 Stanford×Laude Institute가 만든, 코딩 에이전트를 실제 터미널 환경에서 평가하는 벤치마크다. SWE-bench가 레포 경계 안 코드 수정이라면, Terminal-Bench는 환경 전체가 문제 — 커널 빌드·서버 배포·모델 학습 같은 end-to-end 시스템 작업을 Bash만으로 풀게 한다. 2.0은 229개 후보 중 3명 리뷰로 89개 하드 태스크만 채택, Harbor 하네스(tb CLI)로 Claude Code·Codex CLI·OpenHands 등을 그대로 붙인다. 2.1 리더보드(tbench.ai)는 측정 단위가 '모델'이 아니라 '에이전트+모델 쌍' — Codex CLI+GPT-5.5 83.4% > Claude Code+Opus 4.8 78.9% > Terminus 2+GPT-5.5 78.2%. 같은 GPT-5.5도 에이전트에 따라 5%p+ 갈려 하네스 설계가 모델만큼 중요함을 보여준다.
  points:
  - 환경 전체가 문제 — Docker+자동 테스트 판정, SWE-bench(레포 수정)와 다른 '돌아가는 시스템' 과제
  - Harbor 하네스 — tb CLI로 에이전트 교체·Terminus 2 중립 스캐폴드, 2.0은 89개 큐레이션 태스크
  - 2.1 리더보드 — '에이전트+모델 쌍' 측정, 벤더 자체발표·버전 간 절대 수치 직접 비교 불가
  source: https://www.tbench.ai/leaderboard/terminal-bench/2.1
- category: ai
  title: SWE-bench Multimodal — 스크린샷 보고 'JS UI 버그'를 고치는 능력을 따로 재는 벤치마크
  summary: 'SWE-bench Multimodal(SWE-bench M)은 텍스트·파이썬 위주의 원조 SWE-bench를 "비주얼·사용자 대면 JavaScript 소프트웨어"로 확장한 벤치마크다. 각 과제에는 문제 설명이나 단위테스트에 이미지(버그 스크린샷·목업·다이어그램 등)가 최소 1장씩 들어 있어, 에이전트가 화면을 보고 UI 버그를 고치게 만든다. 핵심은 ''코드를 짤 줄 안다''와 ''화면 문제를 보고 이해한다''가 별개 능력임을 드러낸다는 것 — 논문은 기존 상위 SWE-bench 시스템들이 여기서 크게 고전한다고 보고한다. 도구를 고를 때 ''Verified 점수''만 보면 시각·다언어 일반화 약점이 가려진다.

    '
  points:
  - '구성: 17개 JavaScript 라이브러리(웹 UI·다이어그램·데이터 시각화·구문 강조·인터랙티브 지도 등)에서 모은 617개 과제, 각 과제마다 문제 설명/테스트에 이미지 최소 1장(논문 abs/2410.03859)'
  - '왜 어려운가: 시각 추론 + 언어 일반화 둘 다 요구. 논문은 ''상위 SWE-bench 시스템이 SWE-bench M에서 고전한다''고 명시 — 언어 비종속 설계의 SWE-agent가 12% 해결, 차순위 시스템은 6%에 그쳤다(발표 당시 수치)'
  - '실무 함의: Python 단일 이슈 기준인 Verified와 다른 축을 잰다. 프런트엔드·다언어 코드베이스에 에이전트를 붙일 거면 Verified 점수만으로 판단하지 말 것. 공식 사이트는 paper·GitHub·HuggingFace 데이터셋 링크를 함께 제공'
  source: https://arxiv.org/abs/2410.03859
- category: ai
  title: claude --worktree — 한 레포에서 여러 Claude 세션을 'git 워크트리'로 격리해 동시에 돌리기
  summary: '한 터미널에서 기능을 만들면서 다른 터미널에선 Claude가 버그를 고치게 하되, 편집이 서로 충돌하지 않게 하는 워크플로. `claude --worktree <이름>`을 실행하면 각 워크트리가 자기 브랜치를 가진 별도 체크아웃으로 생성되어 한 작업 트리에서 파일이 엉키지 않는다. 다른 이름으로 같은 명령을 두 번째 터미널에서 돌리면 격리된 병렬 세션이 하나 더 뜬다. 서브에이전트·백그라운드 세션도 같은 방식으로 격리할 수 있어, 오래 걸리는 작업이 메인 브랜치를 막지 않는다.

    '
  points:
  - '기본 동작: `claude --worktree feature-auth`는 `.claude/worktrees/`에 새 브랜치로 워크트리를 만든다. 이름을 비우면 `bright-running-fox` 같은 이름을 자동 생성. baseRef 설정으로 HEAD에서 분기할지 지정 가능'
  - 'PR에서 바로: `claude --worktree "#1234"`는 origin에서 `pull/1234/head`를 받아 `.claude/worktrees/pr-1234`에 워크트리를 만든다. 세션 안에서 ''워크트리에서 작업해''라고 말하면 EnterWorktree로도 생성됨'
  - .worktreeinclude로 .env·secrets 같은 gitignore 파일을 워크트리에 복사(수동 `git worktree add` 경로일 때). git이 아니면 WorktreeCreate/WorktreeRemove 훅으로 SVN·Perforce·Mercurial 지원. 수동 정리는 `git worktree remove <경로>`
  source: https://code.claude.com/docs/en/worktrees
- category: ai
  title: Context Rot(Chroma 연구) — '컨텍스트만 길어져도' 18개 모델 전부 정확도가 무너진다
  summary: 'Chroma가 발표한 독립 벤치마크 연구로, "긴 컨텍스트 윈도우가 곧 안정적인 성능"이라는 가정을 깬다. 과제 난이도는 그대로 두고 입력 길이만 늘렸을 때, Claude·GPT·Gemini·Qwen 등 18개 모델 모두에서 정확도가 길이가 길어질수록 떨어졌다. 핵심은 모델이 컨텍스트를 균일하게 처리하지 않는다는 것 — 토큰이 ''있다''가 아니라 ''어떻게 제시됐는가''가 성능을 가른다. 그래서 결론은 컨텍스트 윈도우를 키우는 게 아니라, 무엇을 어떻게 넣을지 설계하는 ''컨텍스트 엔지니어링''이다.

    '
  points:
  - '확장된 NIAH(바늘 찾기) 실험: 질문과 바늘의 의미 유사도가 낮을수록, distractor(헷갈리는 문장)가 1개만 있어도 성능이 떨어지고 4개면 가중된다. Claude는 환각률이 가장 낮고 불확실하면 답을 보류(abstain)하는 경향, GPT는 환각률이 가장 높았다'
  - '반직관적 결과: 논리적으로 잘 구성된 haystack보다 ''섞어서 뒤죽박죽인'' haystack에서 18개 모델 전부 더 정확했다. LongMemEval에선 11.3만 토큰 전체를 넣을 때보다 핵심 300토큰만 넣을 때 모든 모델이 훨씬 높은 점수'
  - '주장(연구 수치): 총 194,480회 호출 중 거부는 0.035%로 드물었다. 실제 과제는 이 최소 실험보다 복잡하므로 현업에서의 열화는 더 심할 것이라고 저자는 명시. 코드 전체 오픈소스로 재현 가능'
  source: https://www.trychroma.com/research/context-rot
- category: ai
  title: claude-code-workflows(OneRedOak) — 디자인을 '눈으로' 자동 리뷰시키는 Playwright 기반 워크플로(3.8k★)
  summary: 'OneRedOak/claude-code-workflows는 Claude Code용 워크플로 모음을 공유하는 MIT 라이선스 레포다(별 약 3.8k·포크 약 567). 핵심은 ''design-review'' 워크플로 — Claude Code가 Playwright MCP로 실제 브라우저를 띄워 변경된 UI를 직접 클릭·스크린샷하며 디자인 일관성·접근성·반응형을 검토하게 만든다. 텍스트 diff만 읽고 "괜찮아 보인다"고 말하는 코드 리뷰의 사각지대(렌더링 결과)를 사람 대신 에이전트가 눈으로 메우는 패턴이다.

    '
  points:
  - '구성: 슬래시 커맨드 + 서브에이전트 + 룰 파일을 묶은 워크플로 3종(대표가 design-review). Playwright MCP를 통해 페이지를 띄우고 상호작용·스크린샷을 찍어 시각적으로 검증한다'
  - '쓰임새: PR이나 작업 브랜치의 UI 변경을 머지 전에 에이전트가 라이브 브라우저로 점검 — 정적 diff로는 못 잡는 레이아웃 깨짐·대비·반응형 문제를 잡는 게 목적'
  - 별 수·포크 수는 현재 기준 주장이며 변동한다. 본인 프로젝트의 디자인 가이드에 맞춰 룰을 고쳐 쓰는 출발점으로 의도된 레퍼런스 모음
  source: https://github.com/OneRedOak/claude-code-workflows
- category: ai
  title: goose(Block→AAIF) — Rust로 짠 모델 비종속 오픈소스 에이전트, 데스크톱·CLI·API로 다 쓴다(49.5k★)
  summary: 'goose는 Block이 만들어 공개한 Apache-2.0 오픈소스 AI 에이전트로, 깃허브 별이 약 49.5k다. 레포 태그라인은 "코드 제안을 넘어 — 어떤 LLM으로든 설치·실행·편집·테스트하는 확장 가능한 오픈소스 에이전트"로, 코드 한 줄 추천이 아니라 명령 실행·파일 편집·테스트까지 직접 하는 범용 에이전트를 표방한다. Rust(약 64%)로 작성됐고 데스크톱 앱(맥·리눅스·윈도)·CLI·임베더블 API 세 형태로 제공되며, MCP로 70여 개 확장을 물리고 Anthropic·OpenAI·구글·Ollama·Bedrock 등 15개 이상 모델 공급자를 갈아끼울 수 있다. 최근 레포는 block/goose에서 리눅스재단 산하 Agentic AI Foundation(AAIF·aaif-goose/goose)으로 이관됐다.

    '
  points:
  - '정체성: ''BYO-LLM'' 범용 로컬 에이전트 — 특정 모델·클라우드에 묶이지 않고 API 키든 기존 Claude·ChatGPT·Gemini 구독이든(ACP 경유) 꽂아 쓴다. Cursor류 IDE 확장이 아니라 데스크톱 앱+CLI+API 묶음이다'
  - '확장: MCP 표준으로 70여 개 익스텐션을 붙여 깃허브·브라우저·셸 등 외부 도구를 도구로 노출. Rust 코어라 단일 바이너리로 가볍게 돈다'
  - '거버넌스: 원래 Block 사내 도구였다가 오픈소스화, 이제 MCP·AGENTS.md와 함께 리눅스재단 중립 거버넌스(AAIF)로 옮겨졌다. 별 수·공급자 수는 레포 표기 기준 주장이며 변동한다'
  source: https://github.com/aaif-goose/goose
- category: ai
  title: Pi(Mario Zechner) — 도구 4개·'역대 최단 시스템 프롬프트'로 미는 미니멀 코딩 에이전트(badlogic/pi-mono)
  summary: 'Pi는 Mario Zechner가 만든 TypeScript 기반 미니멀 코딩 에이전트로, Flask·Jinja2 제작자 Armin Ronacher가 블로그로 알리며 주목받았다. 핵심 철학은 ''도구를 잔뜩 박지 말고 에이전트가 스스로 코드를 짜 확장하게 하라''다. 그래서 내장 도구가 Read·Write·Edit·Bash 단 4개뿐이고, Ronacher는 "내가 아는 어떤 에이전트보다 시스템 프롬프트가 짧다"고 주장한다. 추가 기능이 필요하면 플러그인을 받는 게 아니라 에이전트에게 "너 자신을 확장해줘"라고 시켜 .ts 익스텐션·슬래시 커맨드를 직접 작성하게 한다. MCP는 설계상 빼버렸고, 세션이 ''트리''라 분기·탐색이 되며 핫 리로딩으로 짜고-테스트하고-다시 로드하는 루프가 빠르다.

    '
  points:
  - '정체성: ''도구 최소·프롬프트 최소''로 모델 능력을 신뢰하는 BYO-LLM 터미널 에이전트. 내장 도구는 Read/Write/Edit/Bash 4개가 전부 — 나머지는 모델이 Bash로 코드를 짜 해결한다고 본다(MCP는 의도적으로 미지원)'
  - '확장 방식: 마켓플레이스에서 받는 대신 에이전트가 자기 기능을 TypeScript로 직접 작성(/answer·/todos·/review 같은 .ts 익스텐션). ''코드가 코드를 쓰고 실행한다''는 발상'
  - '주의: 파일·프로세스·네트워크·크리덴셜을 막는 내장 권한 시스템이 없어 README가 컨테이너 격리(Docker 등)를 권한다. 레포는 badlogic/pi-mono(MIT·TypeScript)이며 별 수 약 63k는 레포 표기 기준 주장으로 변동한다'
  source: https://github.com/badlogic/pi-mono
- category: ai
  title: 서브에이전트 모델 라우팅 — 탐색은 Haiku, 리뷰는 Sonnet으로 강제해 비용 천장을 거는 법
  summary: 'Claude Code 서브에이전트는 정의 파일 프런트매터의 model 필드로 각자 다른 모델을 쓸 수 있고, 값은 sonnet·opus·haiku·fable·전체 모델 ID(예: claude-opus-4-8)·inherit이며 생략 시 기본은 inherit(메인 대화와 동일 모델)이다. 공식 문서는 서브에이전트의 핵심 이점 중 하나로 "Haiku 같은 더 빠르고 저렴한 모델로 작업을 라우팅해 비용을 통제"하는 것을 명시한다. 즉 매번 같은 종류의 일(탐색·린트·요약)은 값싼 모델 서브에이전트에 정의 파일로 박아두면, 개발자가 일일이 모델을 고르지 않아도 설정만으로 비용 천장이 걸린다. 서브에이전트가 자체 격리 컨텍스트 창에서 돌아 메인 대화 히스토리를 안 보는 구조라 탐색 같은 토큰 폭증 작업을 메인에서 떼어내는 효과까지 겹친다.

    '
  points:
  - '모델 결정 우선순위(공식 문서): 1) CLAUDE_CODE_SUBAGENT_MODEL 환경변수 → 2) 호출 시 per-invocation model 파라미터 → 3) 서브에이전트 정의의 model 프런트매터 순. 환경변수로 세션 전체 모델을 한 값으로 강제해 조직 비용 천장·컴플라이언스에 쓸 수 있다'
  - 정의 파일에 model을 커밋해 두면 '모두가 제일 비싼 모델로 기본 세팅하는' 사고를 의지가 아니라 설정으로 막는다 — 코드리뷰는 Sonnet, 빠른 작업은 Haiku 식으로 역할별 분리
  - '컨텍스트 격리: 서브에이전트는 fresh·isolated 컨텍스트 창에서 시작해 부모 대화·이미 읽은 파일을 보지 않고 요약 결과만 돌려준다(예외: fork는 전체 대화를 상속). 탐색 같은 대량 토큰 작업을 메인 창 밖으로 빼는 게 비용 절감의 본질'
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: 에이전트 스킬의 '점진적 로딩' — 메타 100토큰만 항상 보이고, 본문은 필요할 때만 끌어오기
  summary: 'Agent Skills는 SKILL.md 한 장(name·description YAML 프런트매터 + 마크다운 본문)에 스크립트·레퍼런스를 묶은 폴더로, 2025-10 Anthropic이 도입해 2025-12 오픈 표준으로 공개했고 지금은 Claude Code·Claude.ai·API·Codex·Cursor 등에서 동작한다. 핵심은 점진적 공개(progressive disclosure)다 — 세션 시작 시 에이전트는 각 스킬의 name·description(스킬당 대략 100토큰)만 본다. 본문(보통 5천 토큰 미만)은 에이전트가 그 스킬이 지금 작업에 필요하다고 판단할 때만 로드된다. 덕분에 스킬을 수십~수백 개 깔아둬도 컨텍스트 창은 거의 비어 있고, 정작 쓸 때만 토큰을 먹는다 — MCP 도구 정의가 항상 컨텍스트를 차지하는 것과 대비된다. 이 메커니즘 때문에 description 한 줄을 어떻게 쓰느냐가 스킬이 제때 발동하느냐를 가른다.

    '
  points:
  - '토큰 회계: 항상 보이는 건 스킬당 약 100토큰(name+description)뿐, 본문(<5k토큰)은 ''관련 있다''고 판단될 때만 로드 → 스킬 수백 개도 컨텍스트 부담이 거의 없다'
  - 발동 트리거는 본문이 아니라 description이 쥔다. 에이전트는 메타데이터만 보고 로드 여부를 정하므로, 언제 써야 하는지를 description에 구체적으로 써야 제때 켜진다
  - '보안 주의: 스킬은 에이전트 환경에서 임의 코드를 실행할 수 있다 — ''믿을 수 있는 출처''에서만 설치하라. 큐레이션 목록 travisvn/awesome-claude-skills(약 13.5k★) 등이 모음집 역할'
  source: https://github.com/travisvn/awesome-claude-skills
- category: ai
  title: Frequent Intentional Compaction — 컨텍스트를 40~60%로 유지하며 리뷰는 코드 아닌 '리서치·플랜'에 거는 워크플로
  summary: 'humanlayer가 공개한 ace-fca 문서(약 1.7k★)는 코딩 에이전트 생산성의 핵심을 "컨텍스트 관리를 개발 워크플로 전체로 끌어올리는 것"으로 본다. 핵심 원칙은 컨텍스트 사용률을 40~60% 구간으로 유지하는 것 — Geoff Huntley의 "약 170k 컨텍스트 창에서, 많이 쓸수록 결과가 나빠진다"는 제약을 전제로 한다. 작업은 리서치 → 플랜 → 구현 3단계로 쪼개고, 구현 단계는 검증된 페이즈마다 진행 상황을 원래 플랜 파일(progress.md)로 다시 compaction해 컨텍스트를 비운다. 가장 큰 통찰은 인간 리뷰의 레버리지다 — 나쁜 코드 한 줄은 그냥 한 줄이지만, 나쁜 플랜 한 줄은 코드 수백 줄을, 나쁜 리서치 한 줄은 수천 줄을 낳는다. 그래서 코드보다 리서치·플랜을 리뷰하는 게 이득이다.

    '
  points:
  - '구체 사례(문서 주장): 30만 LOC Rust 프로젝트(BAML)에서 Rust 초보가 취소+WASM 기능 약 3.5만 LOC를 7시간(리서치·플랜 3h + 구현 4h)에 작업, 팀은 PR당 시니어 3~5일치로 추정. 단 ''마법이 아니다''라며 7시간 깊은 몰입과 코드베이스 전문가 한 명이 필요함을 명시'
  - 'compaction 트리거: 파일 검색·코드 흐름 파악·테스트/빌드 로그·대형 JSON 도구 출력처럼 토큰을 먹는 활동을 progress.md(목표·접근·완료 단계·현재 실패) 같은 구조화 산출물로 증류. 구현만 git worktree로 격리하고 리서치·플랜은 main에서 한다'
  - 서브에이전트는 '역할 흉내'가 아니라 '컨텍스트 제어' 수단 — Glob/Grep/Read 잡동사니를 fresh 컨텍스트에서 돌려 부모 에이전트 창을 깨끗이 유지하는 게 가장 흔한 용도. 팀 비용은 3인 기준 월 약 $12k(Opus), 전환에 약 8주 걸렸다고 밝힘
  source: https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/ace-fca.md
- category: ai
  title: claude-code-security-review — PR마다 도는 Anthropic 공식 AI 보안 리뷰 액션(diff 인지·오탐 필터)
  summary: 'Anthropic이 공개한 claude-code-security-review(약 5.3k★, MIT, 주로 파이썬)는 PR이 올라올 때마다 변경 diff를 Claude로 의미 분석해 취약점을 찾고 해당 라인에 코멘트를 다는 GitHub Action이다. 단순 패턴 매칭이 아니라 코드 맥락을 읽어 인젝션(SQL·command·XXE 등), 인증·인가 결함, 비밀정보·PII 노출, 암호화 오용, RCE·역직렬화, XSS, TOCTOU 같은 로직 결함까지 본다. 핵심은 오탐 억제다 — 발견된 항목은 별도 검증 서브태스크가 실제 코드 동작에 비춰 다시 분석하고, 확신도 점수가 낮으면(8점 미만) 버린다. DoS·레이트리밋·입증 안 된 입력검증·대부분의 open-redirect는 기본 제외 카테고리다. 같은 엔진을 Claude Code의 내장 `/security-review` 슬래시 명령으로 개발 중에도 돌릴 수 있고, security-review.md를 `.claude/commands/`에 복사해 분석 기준을 커스텀할 수 있다.

    '
  points:
  - '도입은 워크플로 YAML 한 조각 — `anthropics/claude-code-security-review@main`에 `comment-pr: true`와 API 키를 넘기면 PR head를 체크아웃해 변경분만 검토하고 라인 코멘트를 남긴다'
  - '★보안 경고(공식): 이 액션은 ''프롬프트 인젝션에 하드닝되지 않았다'' — 신뢰할 수 있는 PR에만 쓰고, 외부 기여자 PR은 깃허브 ''Require approval for all external contributors''로 메인테이너 승인 후에만 돌게 막으라고 권고한다'
  - GitHub Action(PR 게이트)과 `/security-review` 슬래시 명령(개발 중 로컬)은 같은 분석을 두 지점에 배치한 것 — '짠 세션 말고 별도 패스가 검토한다'는 원칙을 보안에 적용한 사례다
  source: https://github.com/anthropics/claude-code-security-review
- category: ai
  title: Serena(oraios) — 에이전트에게 IDE급 '심볼 단위' 코드 탐색·편집을 주는 MCP 툴킷(~24k★)
  summary: 'Serena는 독일 Oraios가 만든 오픈소스 MCP 툴킷으로, 스스로를 "에이전트를 위한 IDE"라 부른다(약 24k★, MIT). 핵심은 에이전트가 파일을 통째로 읽는 대신, 언어 서버 프로토콜(LSP)을 백엔드로 써서 함수·클래스 같은 ''심볼'' 단위로 코드를 찾고·읽고·고치게 한다는 점이다. 줄번호나 단순 grep 같은 저수준 방식 대신 코드의 구조와 참조 관계를 따라가므로, 큰 코드베이스에서 더 빠르고 토큰 효율적으로 동작한다. Claude Code·Codex·Gemini CLI·Cursor·Cline·Roo Code 등 MCP를 받는 거의 모든 클라이언트에 붙고, Cursor·Windsurf 같은 유료 어시스턴트의 무료 대안을 표방한다. 기본 LSP 백엔드는 Python·TypeScript·Java·Go·Rust 등 40여 개 언어를 지원한다.

    '
  points:
  - '동작 원리: ''파일을 다 읽지 말고 심볼만 집어라'' — find_symbol / find_referencing_symbols 같은 도구로 정의·호출처를 LSP로 질의해 필요한 조각만 컨텍스트에 올린다. 이게 큰 레포에서 토큰을 아끼는 핵심'
  - '백엔드 2종: 기본은 무료 오픈소스 LSP, 별도로 JetBrains 분석엔진을 쓰는 유료 플러그인이 move·inline 같은 더 깊은 리팩터링을 제공'
  - '★설치 주의(공식): MCP/플러그인 마켓플레이스의 설치 명령은 ''오래되고 부적절''하니 쓰지 말고, PyPI에서 `uv tool install -p 3.13 serena-agent` 후 `serena init`으로 깔라고 메인테이너가 명시한다'
  source: https://github.com/oraios/serena
- category: ai
  title: claude-code-templates(aitmpl) — 에이전트·커맨드·MCP를 골라 깔고, 사용량을 대시보드로 보는 CLI(~28k★)
  summary: 'claude-code-templates는 Daniel Avila가 만든 오픈소스 CLI(약 28.1k★, MIT)로, Claude Code용 ''바로 쓰는 설정 마켓플레이스''를 표방한다. `npx claude-code-templates@latest` 한 줄이면 100개 넘는 컴포넌트(전문 서브에이전트·슬래시 커맨드·설정·MCP 구성 등)를 골라 현재 프로젝트에 설치해 준다 — 직접 .claude 디렉터리를 손으로 채울 필요 없이 검증된 구성을 받아 시작하는 식이다. 단순 설치기를 넘어 운영 도구도 들어 있다. `--analytics` 플래그는 로컬 세션 로그를 읽어 실시간 사용량·대화 모니터링 대시보드를 띄우고, `--health-check`는 설치·설정 상태를 점검해 무엇이 빠졌는지 알려준다. aitmpl.com에서 웹으로 컴포넌트를 둘러볼 수도 있다.

    '
  points:
  - '설치: `npx claude-code-templates@latest` — 100+ 컴포넌트(서브에이전트·커맨드·설정·MCP)를 대화형으로 골라 프로젝트에 주입. 별도 글로벌 설치 불필요'
  - '운영 플래그 2종: `--analytics`=로컬 로그 기반 실시간 사용량·대화 모니터링 대시보드 / `--health-check`=설치·설정 상태 진단'
  - MIT 라이선스·약 28.1k★(레포 기준 주장값) · 웹 카탈로그 aitmpl.com에서 컴포넌트를 미리 탐색 가능
  source: https://github.com/davila7/claude-code-templates
- category: ai
  title: Agent Client Protocol(ACP) — '에디터'와 '코딩 에이전트'를 분리하는 개방형 표준(Zed·JetBrains)
  summary: 'ACP(Agent Client Protocol)는 Zed가 만들고 JetBrains와 함께 미는 개방형 표준으로, 코딩 에이전트와 그것을 띄우는 에디터(클라이언트) 사이를 표준 JSON-RPC 인터페이스로 갈라놓는다. 목표는 ''LSP가 언어 서버를 에디터에서 떼어낸 것''을 에이전트에도 하는 것 — 에이전트는 한 번만 ACP를 구현하면 ACP를 지원하는 모든 에디터에서 돌고, 에디터는 한 번만 구현하면 어떤 ACP 에이전트든 꽂아 쓴다. 그래서 한 에디터 안에서 어려운 리팩터링은 Claude Code로, 테스트 스윕은 다른 에이전트로 갈아끼우는 식의 ''에이전트 자유 교체''가 가능해진다. 특정 모델·도구에 묶이는 락인을 줄이는 게 핵심이다.

    '
  points:
  - '무엇을 표준화하나: 에이전트↔에디터 간 통신을 JSON-RPC 기반 개방 프로토콜로 고정 → 에이전트는 1회 구현으로 모든 ACP 에디터에서 동작(LSP의 에이전트판)'
  - '주도: Zed가 설계, JetBrains와 협업으로 확장 중. Zed의 Agent Panel이 ACP로 외부 에이전트(예: Claude Code·Gemini CLI 등)를 네이티브로 띄움'
  - '실무 효과: 작업별로 최적 에이전트를 갈아끼우는 ''중립 호스트'' 전략 — VS Code 포크+단일 모델 결합형 락인의 반대 방향'
  source: https://zed.dev/acp
- category: ai
  title: Conductor — 한 화면에서 Claude Code·Codex·Cursor를 '병렬로' 돌리는 맥용 오케스트레이터
  summary: 'Conductor(conductor.build)는 여러 코딩 에이전트를 동시에 돌리기 위한 맥용 데스크톱 앱으로, Claude Code·Codex·Cursor를 한 인터페이스에서 병렬 실행한다. 핵심은 작업 격리다 — "각 태스크가 자기만의 workspace·브랜치·파일·터미널·diff·리뷰 경로를 받는다"고 공식 문서가 밝힌다. 그래서 에이전트들이 서로의 파일을 덮어쓰지 않고 독립적으로 굴러가고, 사람은 작업이 끝난 순서대로 diff를 리뷰하고 PR로 만들어 머지하면 된다. 이는 ''에이전트는 싸지만 사람의 리뷰·통합 시간이 병목''이라는 2026년 병렬 에이전트 워크플로의 전제를 그대로 제품화한 것 — 단일 작업 디렉터리를 공유하는 데서 오는 동시 편집 충돌을 작업별 격리 workspace로 푼다.

    '
  points:
  - '무엇을: Claude Code·Codex·Cursor를 한 맥 앱에서 병렬 실행(공식 표현 ''run ... in parallel''). 모델·에이전트를 직접 가져와(BYO) 꽂는 호스트 레이어'
  - '격리 방식(1차 출처): ''각 태스크가 자기 workspace·브랜치·파일·터미널·diff·리뷰 경로를 가진다'' → 병렬 에이전트의 동시 편집 충돌을 작업별 격리로 차단'
  - '운영 흐름: 여러 에이전트를 띄워두고 → 끝난 작업의 diff를 리뷰 → PR 생성·머지. ''사람의 리뷰·통합''을 병목으로 보고 그 단계를 줄이는 설계. 현재 맥 중심·v0.65.0대'
  source: https://www.conductor.build/
- category: ai
  title: MCP Tool Search — MCP 서버 수십 개 붙여도 컨텍스트가 안 터지는 'on-demand 로딩'(Claude Code 기본값)
  summary: 'MCP 서버를 여러 개 붙이면 세션 시작 전에 도구 정의가 컨텍스트를 다 잡아먹는 ''context pollution''이 오래 문제였다(한 개발자는 첫 프롬프트도 치기 전에 6.6만 토큰이 사라졌다고 기록). Claude Code의 MCP Tool Search는 세션 시작 시 도구 이름과 서버 instructions만 올리고, 실제 도구 정의는 Claude가 필요할 때 검색해서 불러온다. Anthropic은 2026-01-14에 이 기능을 공개했고, 공식 문서 기준 현재 기본값으로 켜져 있다. 실무 효과는 ''MCP 서버를 더 붙여도 컨텍스트 영향이 거의 없다''는 것 — 그래서 서버 개수보다 서버 instructions를 잘 써두는 게 중요해진다.

    '
  points:
  - '기본 동작(공식): 세션 시작 땐 도구 이름+서버 instructions만 로드, 정의는 ToolSearch로 필요할 때만 expand. Claude Code는 서버별 도구 수 상한을 두지 않고 ''컨텍스트 예산''이 실질 한계'
  - 'ENABLE_TOOL_SEARCH로 조절: unset/true=전부 지연, auto=정의가 컨텍스트 10% 안에 들면 미리 로드(auto:N으로 % 지정), false=전부 미리 로드. Vertex AI·비1차 ANTHROPIC_BASE_URL 프록시에선 기본 비활성'
  - '제약(공식): tool_reference 블록을 지원하는 모델만 가능 — Haiku는 미지원, Vertex는 Sonnet 4.5·Opus 4.5 이상. 서버 작성자는 instructions를 스킬처럼 ''언제 이 도구를 찾아야 하는지'' 설명하게 쓰는 게 핵심'
  source: https://code.claude.com/docs/en/mcp
- category: ai
  title: DeepSWE(Datacurve) — 채점기 오류를 줄이고 '오래 걸리는 일'로 다시 줄 세운 코딩 에이전트 벤치마크
  summary: '포화된 SWE-bench류 리더보드는 프런티어 모델들이 좁은 구간에 몰려 ''어느 에이전트가 우리 코드베이스에서 더 나은지''를 가리기 어렵다는 비판을 받아 왔다. 스타트업 Datacurve가 공개한 DeepSWE는 이를 두 축으로 다시 짠다 — ① 과제를 과거 이슈·PR에서 캐오지 않고 새로 작성해 학습데이터 오염을 줄이고, ② 채점기(verifier) 정확도를 올렸다. Datacurve의 자체 감사에 따르면 SWE-Bench Pro의 자동 채점기는 정답을 24% 오탈락(false negative), 오답을 8.5% 오인정(false positive)했는데 DeepSWE는 둘 다 0에 가깝게 낮췄다고 주장한다. 대표 사례로, 정답 PR이 비공개 헬퍼를 리팩터한 과제에서, 같은 로직을 인라인해 ''유효하게'' 푼 에이전트가 원저자 구현에만 있던 심볼 import에 막혀 오탈락한 경우를 든다. 리더보드(공개 기준)에서는 GPT-5.5가 70%±4%로 선두, GPT-5.4 56%±5%, Claude Opus 4.7 54%±5%로 뒤를 잇는다. 단, 이는 Datacurve의 ''주장''이며 독립 재현 전이고, 모든 모델을 단일 하네스(bash 편집)로 묶어 모델별 네이티브 도구(Codex CLI·Claude Code 등) 성능을 반영하지 못한다는 한계가 있다.

    '
  points:
  - '구성(공식): 113개 과제·91개 저장소, TypeScript/Go/Python/JavaScript/Rust 5개 언어. 별 500개 이상 활동 저장소에서만 추림(C++·Java 미포함)'
  - '핵심 주장: SWE-Bench Pro 채점기는 정답 24% 오탈락·오답 8.5% 오인정 → DeepSWE는 둘 다 ≈0. ''비공개 헬퍼 인라인'' 같은 유효한 해법이 import 심볼 불일치로 떨어지던 문제를 노린다'
  - '리더보드(주장·미재현): GPT-5.5 70%±4%(중앙값 47k 출력토큰으로 가장 토큰효율적) > GPT-5.4 56% > Claude Opus 4.7 54%. 단일 bash 하네스라 네이티브 도구 성능은 반영 안 됨 — 사설 eval·사람 리뷰와 병행이 권장'
  source: https://deepswe.datacurve.ai/blog
- category: ai
  title: Context7(Upstash) — '낡은·환각 API'를 막으려 버전별 최신 문서를 매 요청에 끼워 넣는 MCP 서버(MIT)
  summary: 'Context7은 Upstash가 만든 오픈소스 MCP 서버로, LLM이 학습 시점에 멈춘 옛 문서나 ''존재하지 않는 API''를 지어내는 문제를 노린다(라이선스 MIT). 라이브러리의 버전별 최신 문서와 코드 예제를 에이전트 컨텍스트에 직접 끌어와, 탭 전환·환각 없이 그 버전에 맞는 코드를 짜게 한다. 쓰는 법은 두 도구로 끝난다 — 먼저 ''react'' 같은 일반 이름을 Context7 라이브러리 ID로 해석하고(resolve-library-id), 그 ID로 토픽을 지정해 문서를 조회한다. Claude Code·Cursor·OpenCode·Windsurf 등과 호환되고, `npx ctx7 setup` 한 줄로 깔거나 MCP URL `https://mcp.context7.com/mcp`를 직접 붙일 수 있으며, MCP 대신 CLI(`ctx7 docs`) 모드도 있다. 주목도(주장·secondary 출처): 2026년 들어 GitHub 5.4만~5.6만★대로 ''MCP 서버 중 1위'' 노출이 잦고 ThoughtWorks Tech Radar에도 올랐다. 단, 코어 MCP 서버만 오픈소스이고 크롤링·파싱·API 백엔드는 비공개라는 점은 감안해야 한다.

    '
  points:
  - '정체(공식): 버전별 최신 라이브러리 문서·예제를 컨텍스트에 주입해 ''낡은/환각 API''를 막는 MCP 서버. MIT, Claude Code·Cursor·OpenCode·Windsurf 호환'
  - '쓰는 법: ①이름→라이브러리 ID 해석(resolve-library-id) ②그 ID로 토픽 지정해 문서 조회, 두 도구뿐. 설치는 `npx ctx7 setup` 또는 MCP URL https://mcp.context7.com/mcp, CLI 모드도 제공'
  - '주목도(주장·미검증): 2026년 GitHub 5.4만~5.6만★대로 ''MCP 1위'' 노출 잦고 ThoughtWorks Tech Radar 등재. 단 코어만 OSS고 크롤·파싱·백엔드는 비공개'
  source: https://github.com/upstash/context7
- category: ai
  title: 공식 /code-review 플러그인 — '리뷰 4개 병렬 → 한 건씩 재검증'으로 오탐을 떨궈내는 구조
  summary: 'anthropics/claude-code 레포에 들어있는 공식 code-review 플러그인은 ''AI 코드리뷰가 nitpick·오탐을 쏟아낸다''는 문제를 구조로 푼다. 핵심은 작업과 검증을 단계로 분리한 파이프라인이다 — 먼저 haiku가 ''PR이 닫힘·드래프트·이미 리뷰됨''인지 스킵 판단을 하고(불필요하면 종료), 변경 파일과 같은 경로의 CLAUDE.md만 찾아낸 뒤, sonnet이 변경 요약을 만든다. 그다음이 본체다 — 리뷰 에이전트 4개를 병렬로 띄운다. 2개는 sonnet으로 CLAUDE.md 준수 여부를, 2개는 Opus로 버그를 본다. 이때 버그 에이전트는 ''diff 바깥 컨텍스트를 읽지 말고 변경된 코드 안에서만, 컴파일 불가·무조건 틀린 결과 같은 HIGH SIGNAL만 보고하라(확신 없으면 보고 금지)''는 제약을 받는다. 스타일·취향 지적과 기존 코드 문제는 명시적으로 제외된다. 마지막으로 발견된 이슈마다 별도 검증 서브에이전트를 다시 병렬로 돌려(버그는 Opus, CLAUDE.md는 sonnet) 확신 가능한 것만 통과시키고 나머지는 버린다. 결과는 터미널 출력이 기본이고, `--comment`를 줘야 PR에 인라인 코멘트를 단다(이슈당 코멘트 1개, 작은 수정은 적용 가능한 suggestion 블록으로).

    '
  points:
  - '파이프라인(공식): ①haiku 스킵판단 ②haiku로 관련 CLAUDE.md 경로만 수집 ③sonnet 변경요약 ④리뷰 4병렬 ⑤이슈별 재검증 ⑥미검증분 폐기 ⑦터미널 출력(--comment시 인라인)'
  - '4 병렬 리뷰: CLAUDE.md 준수 2개(sonnet) + 버그 2개(Opus). 버그 에이전트는 ''diff 밖 안 읽기·변경 코드 안에서만·컴파일 불가/무조건 오답 같은 HIGH SIGNAL만, 확신 없으면 보고 금지'''
  - '오탐 제거가 핵심: 발견 이슈마다 검증 서브에이전트를 다시 병렬로 띄워(버그 Opus·룰 sonnet) 통과 못 한 건 드롭. 스타일·nitpick·기존 코드 문제는 처음부터 제외'
  source: https://github.com/anthropics/claude-code/blob/main/plugins/code-review/commands/code-review.md
- category: ai
  title: Spotify 'Honk' — Claude Code를 샌드박스에 넣고 PR 1,500+개를 자동 머지한 백그라운드 코딩 에이전트
  summary: 'Spotify가 사내 ''백그라운드 코딩 에이전트''(코드네임 Honk)를 공개했다(엔지니어링 블로그 2025-11-06). 사람이 IDE에서 직접 짜는 게 아니라, 엔지니어가 Slack 메시지나 Git에 커밋한 프롬프트 파일로 작업을 던지면 에이전트가 알아서 돌고 결과를 PR로 올리는 구조다. 공개 시점까지 1,500개 이상의 에이전트 생성 PR이 머지됐다. 핵심은 ''AI가 잘나서''가 아니라 ''받칠 인프라가 있어서''다 — Honk는 2022년부터 운영한 Fleet Management(대규모 자동 코드 변환) 위에 얹혀 있고, 그 전엔 AST 조작·정규식으로 변환을 정의했지만 복잡한 다단계 수정에선 한계가 있었다. 그래서 ''지나치게 경직된 지시가 필요하고 멀티스텝 편집에 약했던'' 자체 방식을 버리고 Claude Code 기반으로 갈아탔다고 밝혔다. 효과는 마이그레이션 같은 반복 변환에서 손코딩 대비 60~90% 시간 절감이라고 보고했다. 별도로 Anthropic 고객 사례 페이지는 이 시스템이 ''Claude Agent SDK로 매달 650개 이상의 PR을 머지한다''고 적었다(이 월 650건·SDK 수치는 Spotify 블로그가 아니라 Anthropic 측 출처다). 교훈: 에이전트 자동화는 표준 빌드·탄탄한 테스트·플릿 관리 같은 토대가 먼저 깔려야 굴러간다.

    '
  points:
  - '트리거→실행→PR: Slack/Git 프롬프트로 작업 투입 → 샌드박스에서 에이전트 자율 실행 → PR 생성. 공개 시점 누적 1,500+ PR 머지'
  - '토대가 먼저: 2022년부터의 Fleet Management 위에 얹음. AST·정규식 기반 자체 변환의 한계(복잡한 다단계 편집)를 Claude Code 기반으로 대체'
  - '효과·주의: 마이그레이션류에서 60~90% 시간 절감(Spotify 블로그). ''월 650 PR·Claude Agent SDK''는 Anthropic 고객 사례 출처 — 구분해서 인용'
  source: https://engineering.atspotify.com/2025/11/spotifys-background-coding-agent-part-1
- category: ai
  title: mini-SWE-agent — '도구·설정 다 빼고' 100줄 bash만으로 SWE-bench 74%를 찍은 미니멀 에이전트(SWE-agent 후속)
  summary: 'SWE-agent(프린스턴·~19.5k★)를 만든 팀이 내놓은 후속작으로, 에이전트 핵심 로직을 파이썬 약 100줄로 줄인 미니멀 코딩 에이전트다. 가장 큰 설계 선택은 ''도구(tool-calling) 인터페이스를 안 쓴다''는 것 — 커스텀 툴이나 함수 호출 API 없이 오직 bash 명령만으로 동작하고, 액션은 subprocess.run으로 실행하며 대화 이력도 선형(linear)으로 단순하게 유지한다. 스캐폴드를 깎아내고 LM 자체의 능력에 집중하자는 철학으로, 그럼에도 SWE-bench에서 74%를 넘는 점수를 주장한다. 라이선스는 MIT, GitHub 스타는 약 5.2k(2026-06 기준).

    '
  points:
  - '100줄·bash-only: 커스텀 도구도, 함수 호출 API도 없음. 모델이 bash 명령을 내면 subprocess.run으로 돌리고 결과를 다시 먹이는 단순 루프 — 어떤 LM에든 꽂기 쉬움'
  - '주장 수치: SWE-bench 74%+ 점수를 README에서 주장(모델·구성에 따라 달라짐). 전작 SWE-agent(~19.5k★)와 별개 레포로, mini 쪽은 ~5.2k★'
  - '도입처: Meta·NVIDIA·IBM·Anyscale·프린스턴·스탠퍼드 등이 SWE-bench 평가용으로 쓴다고 명시. ''스캐폴드보다 모델''이라는 벤치마킹 철학의 레퍼런스 구현'
  source: https://github.com/SWE-agent/mini-swe-agent
- category: ai
  title: Kiro(AWS) — '코드가 아니라 스펙이 산출물'이라며 requirements→design→tasks 3단계를 강제하는 Spec-Driven 에이전트
  summary: Kiro는 AWS가 내놓은 에이전트형 IDE·CLI·웹 도구로, 프롬프트를 받으면 코드를 바로 짜지 않고 requirements.md→design.md→tasks.md 3단계 스펙을 먼저 생성해 개발자 승인을 받는다. VS Code 포크 기반, Autopilot 모드에서 승인된 태스크를 자율 실행. Kiro Autonomous Agent는 Jira 티켓을 받아 비동기로 PR까지 올리는 장기 에이전트. Amazon Bedrock AgentCore·Claude Sonnet 4.5/4.6. cc-sdd 오픈소스로 동일 워크플로를 Claude Code·Copilot·Gemini CLI에서도 재현 가능.
  points:
  - '스펙 3단계: requirements.md(수용 기준) → design.md(아키텍처) → tasks.md(구현 계획)'
  - Autopilot·Kiro Autonomous Agent — Jira→비동기 PR, Bedrock AgentCore 기반
  - cc-sdd로 Kiro 워크플로를 다른 코딩 에이전트에 이식 — 큰 기능에만 스펙 오버헤드 투자
  source: https://kiro.dev/docs
- category: ai
  title: Cursor 2.0 — 'git 워크트리'로 에이전트 여러 개를 동시에·충돌 없이 돌리고 '제일 잘한 놈'을 고르는 IDE
  summary: 'Cursor 2.0(2025-10-29)은 인터페이스를 ''파일 중심''에서 ''에이전트 중심''으로 갈아엎고, 에이전트 여러 개를 동시에 돌리는 멀티 에이전트를 핵심으로 내세웠다. 여러 에이전트가 서로 충돌하지 않는 비결은 ''git 워크트리(또는 원격 머신)''로 작업 공간을 격리하는 것 — 같은 레포에서 여러 시도가 병렬로 돈다. Cursor는 "여러 모델이 같은 문제를 풀게 한 뒤 결과가 제일 좋은 걸 고르면" 특히 어려운 작업의 품질이 크게 오른다는 걸 발견했다고 밝혔다. 에이전트 사용이 늘며 생긴 새 병목 — 코드 리뷰와 테스트 — 을 위해 변경 검토를 빠르게 하는 UI와, 에이전트가 자기 결과를 직접 테스트하는 네이티브 브라우저 도구도 같이 넣었다.

    '
  points:
  - '병렬 격리 메커니즘: 동시에 도는 에이전트들이 충돌 안 나는 건 ''git worktrees 또는 원격 머신''으로 작업 공간을 분리하기 때문 — Conductor·claude --worktree와 같은 발상을 IDE에 기본 내장'
  - '''best-of-N'' 패턴: 여러 모델이 같은 문제를 동시에 풀고 그중 최선을 채택 → 어려운 작업일수록 품질↑(Cursor 공식 주장). 자체 모델 Composer는 대부분 턴을 ''30초 미만''에 끝내는 저지연 에이전트 코딩용이라고 소개'
  - '새 병목=리뷰+테스트: 에이전트가 짠 코드를 빠르게 검토하는 UI와, 에이전트가 직접 브라우저로 자기 결과를 테스트·반복하는 네이티브 도구를 같이 탑재. 깊은 코드 작업엔 ''클래식 IDE''로 토글 가능'
  source: https://cursor.com/blog/2-0
- category: ai
  title: Amp(Sourcegraph) — '토큰 아끼지 마라'를 철학으로 내건, 스레드·서브에이전트·Oracle로 미는 프런티어 코딩 에이전트
  summary: 'Amp는 Sourcegraph가 만든 터미널·에디터용 코딩 에이전트로, "프런티어 모델과 그다음에 올 것을 위해 만든 에이전트"를 표방한다. 설계 철학이 다른 도구와 갈리는데, 토큰을 아끼려 컨텍스트를 깎기보다 ''제약 없이'' 쓰는 쪽에 무게를 둔다 — 작업 품질을 위해 토큰 비용을 감수한다는 입장이다. 작업 단위는 ''스레드(Thread)''로, 대화·작업 맥락이 영속 저장돼 살아있는 메모리이자 팀 협업·공유 수단이 된다(스레드 포킹으로 대안 시도도 가능). 서브에이전트는 전문 작업을 떼어 맡고 메인 스레드에 결과를 보고하며, 읽기·검색·진단 같은 독립 작업은 기본적으로 병렬로 돌린다(같은 파일·공유 계약을 건드리는 쓰기만 직렬화). ''Oracle''이라는 별도 도구로 더 강한 추론 모델에 어려운 분석을 위임할 수 있고, AGENT.md 파일로 규칙·제약을 코드베이스에 박아 둔다.

    '
  points:
  - '철학적 차별점: 컨텍스트를 깎아 토큰을 아끼는 대신 ''제약 없는 토큰 사용''으로 품질을 우선 — 비용보다 결과를 택하는 트레이드오프. CLI 실행 모드 `amp -x`는 유료 크레딧을 쓰고, Amp Free는 대화형에만 적용'
  - '구조: ''스레드''가 영속 메모리이자 협업 단위(포킹 지원) + 서브에이전트가 전문 작업을 병렬로 처리하고 메인에 보고. 독립 작업(읽기·검색·진단)은 기본 병렬, 같은 파일·타입·DB스키마·공개 API를 건드리는 쓰기만 직렬화'
  - '도구·환경: 어려운 추론은 ''Oracle'' 도구로 더 강한 모델에 위임, AGENT.md로 규칙 주입, MCP 지원(`amp mcp add`). macOS·Linux·Windows(WSL)·JetBrains 2025.1+ 지원, `--stream-json`은 `--execute`와 함께 사용'
  source: https://ampcode.com/manual
- category: ai
  title: Repomix — 레포 전체를 'AI 친화 단일 파일' 하나로 싸서 LLM에 통째로 먹이는 패커(MIT·~26.3k★)
  summary: 'Repomix는 코드베이스 전체를 LLM이 소화하기 좋게 단일 파일 하나(repomix-output.xml 등)로 묶어주는 오픈소스 도구로, GitHub ~26.3k★·MIT 라이선스다(yamadashy/repomix). 에이전트가 도구로 코드를 탐색하지 않는 상황 — ChatGPT·Gemini·Claude 웹/데스크톱에 레포 맥락을 통째로 붙여 넣고 싶을 때 — 이 진가를 발휘한다. `npx repomix`만 치면 현재 디렉터리를 한 파일로 패킹한다. 수작업 파일 복사·붙여넣기를 없애주고, 버그 조사·보안 감사·구현 계획·서드파티 라이브러리 문서화 같은 ''레포 스냅샷이 필요한'' 작업에 그대로 쓰인다. LLM 친화 출력을 위해 XML/Markdown/플레인 등 포맷을 고르고, 토큰 수를 세어주며, 보안상 민감 정보(시크릿) 탐지·코드 압축으로 토큰을 줄이는 옵션도 제공한다.

    '
  points:
  - '사용법: `npx repomix`로 설치 없이 현재 레포를 단일 파일로 패킹 → 그 파일을 LLM 채팅에 붙여 넣으면 전체 프로젝트 맥락 확보. repomix.com 웹 인터페이스와 GitHub 페이지에 ''Pack'' 버튼을 다는 크롬 확장도 있음'
  - 'AI 친화 출력: XML·Markdown·플레인 등 포맷 선택, 토큰 카운팅으로 컨텍스트 예산 가늠, 코드 압축(주석 제거 등)으로 토큰 절감 — ''에이전트가 못 도는'' 모델에 레포를 통째로 넣을 때의 비용/한도 문제를 직접 다룸'
  - '안전장치·용도: 시크릿 탐지로 민감 정보 유출 방지, 클론 없이 원격 레포 패킹 지원. 권장 용도는 버그 조사·보안 감사·구현 계획·서드파티 라이브러리 문서화 등 레포 스냅샷이 필요한 작업(JSNation Open Source Awards 2025 ''Powered by AI'' 후보)'
  source: https://github.com/yamadashy/repomix
- category: ai
  title: 하네스 엔지니어링(Harness Engineering) — '모델 말고 모델 둘러싼 모든 것'을 설계해 에이전트 실패를 구조로 막기
  summary: 'Martin Fowler 사이트(Birgitta Böckeler, 2026-04-02)는 ''하네스(harness)''를 "AI 에이전트에서 모델을 뺀 모든 것"으로 정의한다 — 즉 도구·피드백 루프·안전 경계·검증 시스템 전체. 핵심 발상은 "에이전트가 실수하면 그때그때 고치지 말고, 그 실수를 두 번 다시 못 하게 하는 해법(주로 더 나은 하네스)을 만든다"는 것으로, 같은 모델을 그대로 두고 하네스만 바꿔도 성능이 크게 움직인다. 실제로 LangChain은 모델이 아니라 하네스를 바꿔 Terminal-Bench 2.0 점수를 52.8%→66.5%로 끌어올렸다(주장). Fowler 글은 자기교정 확률을 높이는 ''builder harness''와 사람의 개입을 꼭 필요한 곳에만 두는 ''user harness''를 구분하고, 환경을 에이전트가 읽고 다루기 쉽게 만드는 ''ambient affordances''와 토폴로지를 좁혀 가변성을 줄이는 접근을 제시한다.

    '
  points:
  - '정의: 하네스 = 에이전트에서 ''모델을 제외한 전부''(도구 오케스트레이션·검증 루프·컨텍스트/메모리·가드레일·관측성). ''AI 에이전트 성능은 모델이 아니라 하네스가 결정한다''가 2026년의 합의'
  - '핵심 원칙: 에이전트가 실수하면 즉석 수정이 아니라 ''다시는 그 실수를 못 하게 하는 해법''을 하네스로 만들어 영구화 — 같은 모델로도 점수가 출렁(LangChain Terminal-Bench 52.8%→66.5%는 하네스만 교체한 결과라는 주장)'
  - 'Fowler/Böckeler 프레임: ''builder harness''(자기교정 유도)와 ''user harness''(사람 개입을 필요한 지점에만)로 분리, ''ambient affordances''(환경을 에이전트가 읽기 쉽게)·토폴로지 고정으로 가변성 축소 — 좋은 하네스는 사람 입력을 없애는 게 아니라 ''중요한 곳으로'' 돌린다'
  source: https://martinfowler.com/articles/harness-engineering.html
- category: ai
  title: Agent Skills(SKILL.md) — Anthropic가 연 'Skill 한 번 만들면 어떤 에이전트서나' 오픈 표준, Cursor·Codex·Gemini CLI까지 채택
  summary: 'Agent Skills는 Anthropic이 만들어 오픈 표준으로 공개한, AI 에이전트에 전문 지식·워크플로를 주입하는 경량 포맷이다. 핵심은 SKILL.md 한 파일을 담은 폴더 — 메타데이터(name·description)와 지침을 적고, 스크립트·참고문서·템플릿을 함께 묶을 수 있다. Claude Code 전용이 아니라 Cursor·OpenAI Codex·Gemini CLI·GitHub Copilot·VS Code·OpenHands·Goose·Roo Code 등 수십 개 도구가 같은 포맷을 채택해, "한 번 만들면 어디서나 쓰는" 크로스 제품 재사용이 핵심 가치다.

    '
  points:
  - '구조: 폴더 + 필수 SKILL.md(메타 name·description + 지침), 선택적으로 scripts/·references/·assets/ 번들. 별도 SDK·플러그인 형식이 아니라 마크다운 파일 하나가 진입점'
  - '동작은 ''점진적 공개(progressive disclosure)'' 3단계 — ①Discovery: 시작 시 name·description만 로드 ②Activation: 작업이 description과 매칭되면 본문 전체를 컨텍스트로 ③Execution: 필요할 때만 번들 코드·참고파일 로드. 그래서 스킬 수십 개를 달아도 컨텍스트 footprint가 작다'
  - '표준 채택 현황(agentskills.io 클라이언트 쇼케이스 기준): Claude Code/Claude·Cursor·OpenAI Codex·Gemini CLI·GitHub Copilot·VS Code·OpenHands·Goose·Roo Code·Amp·Factory·Kiro·Letta 등. openai/skills(Codex용 Skills Catalog)는 22.3k★. Anthropic이 발원해 오픈 표준으로 풀고 생태계가 확장 중'
  source: https://agentskills.io
- category: ai
  title: OpenHands(All-Hands-AI) — 에이전트의 모든 행동을 'Docker 샌드박스'에서 돌리는 오픈소스 코딩 에이전트(MIT·~77k★)
  summary: 'OpenHands(옛 OpenDevin)는 코드를 짜고 수정할 뿐 아니라 명령 실행·웹 브라우징·API 호출까지 사람 개발자처럼 하는 오픈소스 자율 코딩 에이전트다. 핵심 차별점은 에이전트의 모든 행동을 격리된 Docker 런타임(샌드박스)에서 실행한다는 점 — 로컬 환경을 직접 건드리지 않고 컨테이너 안에서 셸·파일 편집·브라우저를 돌린다. CLI·웹 GUI·Cloud·Agent SDK 등 여러 형태로 쓰며 특정 모델에 묶이지 않고 다양한 LLM 공급자를 붙일 수 있다. 라이선스는 MIT(단, enterprise/ 디렉터리는 별도)이며 README 기준 약 77k★다.

    '
  points:
  - 샌드박스 우선 설계 — 에이전트의 bash 실행·파일 편집·브라우징이 격리된 Docker 컨테이너 런타임 안에서 일어나, 자율 에이전트가 호스트를 망칠 위험을 구조로 줄인다(표준 설치도 Docker 기반)
  - 한 코어, 여러 표면 — 동일 엔진을 CLI(헤드리스 포함)·웹 GUI·OpenHands Cloud·파이썬 Software Agent SDK로 노출. 모델 비종속이라 Claude·GPT 등 원하는 LLM 공급자를 끼운다
  - SWE-bench Verified 상위권을 '주장' — 공식은 77.6% 해결(검증된 리더보드 수치라기보다 프로젝트 측 주장으로 받아들일 것). 라이선스 MIT·~77k★, '87% 버그 티켓 당일 해결' 류 마케팅 수치는 검증 안 됨
  source: https://github.com/All-Hands-AI/OpenHands
- category: ai
  title: android/skills(Google 공식) — Android 개발 베스트프랙티스를 'SKILL.md'로 에이전트에 주입하는 공식 스킬 묶음(Apache-2.0·~5.8k★)
  summary: 'Google Android 팀이 직접 내는 공식 에이전트 스킬 저장소다. developer.android.com의 모범 사례를 Agent Skills 오픈 표준(SKILL.md) 형식으로 묶어, LLM이 약한 Android 작업에서 헛짚지 않도록 ''근거''를 깔아 준다. Expo의 expo/skills에 대응하는 네이티브 Android판 격으로, 2026-04-20 발표 뒤 빠르게 성장했고 현재 약 5.8k★·Apache-2.0 라이선스다. CLI가 감지된 모든 에이전트에 스킬을 깔아 주며(기본값 Gemini·Antigravity), LLM이 이미 잘하는 영역이 아니라 ''평가상 못하는 워크플로''를 골라 채우는 게 설계 방향이다.

    '
  points:
  - 공식·검증된 정보만 — Apache-2.0, 최신 릴리스 v1.0.2(2026-06-11), Agent Skills(SKILL.md) 오픈 표준 사용. 별 수(~5.8k★)는 시점에 따라 변하는 GitHub 수치이니 '주장'으로 볼 것
  - 실제 수록 스킬 예시 — jetpack-compose, navigation/navigation-3, performance/r8-analyzer, testing/testing-setup, system/edge-to-edge, build/agp/agp-9-upgrade, camera/camera1-to-camerax, wear/jetpack-compose-m3 등 마이그레이션·도구 워크플로 중심
  - 설계 철학 — 'LLM이 못하는 곳을 메운다'. 이미 잘하는 영역이 아니라 평가에서 underperform하는 use case를 겨냥하고, 외부 공개 기여는 현재 받지 않는다(공식 README 기준)
  source: https://github.com/android/skills
- category: ai
  title: Vibe Kanban(BloopAI) — Claude Code·Codex·Gemini CLI 여러 에이전트를 '칸반 보드'로 병렬 돌리는 오케스트레이션 레이어(Apache-2.0·~27k★)
  summary: '여러 코딩 에이전트를 한 칸반 보드 위에서 동시에 굴리는 오픈소스 오케스트레이션 도구다. 각 작업을 ''workspace''로 띄우는데, workspace마다 별도 git 브랜치·터미널·dev 서버가 붙고 내부적으로 git worktree로 격리돼 에이전트들이 서로의 작업을 침범하지 못한다. 그 위에서 diff 리뷰, 앱 프리뷰, PR 생성까지 한 화면에서 한다. `npx vibe-kanban` 한 줄로 실행되고 Claude Code·Codex·Gemini CLI·Copilot· Amp·Cursor·OpenCode·Droid 등 10여 개 에이전트를 지원한다(공식 README 기준). 다만 README는 현재 "Vibe Kanban is sunsetting"이라 밝혀, 오픈소스 도구의 운영 지속성을 함께 따져야 하는 사례이기도 하다.

    '
  points:
  - 격리 모델 — workspace = 브랜치+터미널+dev서버 한 묶음, 그 토대가 git worktree. 에이전트가 main을 건드리지 않고 병렬로 돌게 만드는 게 핵심(Cursor 2.0·Conductor와 같은 worktree 계열 패턴)
  - 도구 비종속 — 한 보드에서 Claude Code·Codex·Gemini CLI·GitHub Copilot·Amp·Cursor·OpenCode·Droid·CCR·Qwen Code 등 '10+ 코딩 에이전트'를 섞어 쓴다. Rust(~50%)+TypeScript(~46%)로 작성
  - 지속성 주의 — README가 'Vibe Kanban is sunsetting'이라 명시하고 외부 PR도 사전 논의 없이는 받지 않는다. 별 수(~27k★)는 시점에 따라 변하는 GitHub 수치이니 '주장'으로 볼 것
  source: https://github.com/BloopAI/vibe-kanban
- category: ai
  title: 토스의 'Claude Code를 레이어드 아키텍처처럼' — 팀 지식을 Global/Domain/Local 3계층 플러그인으로 굳히기
  summary: '토스 기술블로그(toss.tech)는 코딩 에이전트를 ''개인 생산성 도구''에서 ''팀의 일하는 방식''으로 끌어올리는 패턴을 제안한다. 핵심은 흩어진 규칙·노하우를 Claude Code 플러그인에 담되, 그 지식을 세 계층으로 나누는 것이다 — 전사 공통(보안·코딩 스타일)은 Global, 결제·정산·회원 같은 도메인 로직은 Domain, 특정 레포의 구현 디테일은 Local. 이렇게 계층화된 플러그인이 모이면 그 자체로 ''살아있는 지식 베이스(Living Knowledge Base)''가 되고, 나아가 조직의 워크플로(예: /new-feature)를 배포하는 사내 마켓플레이스로 확장한다는 구상이다.

    '
  points:
  - 지식 3계층 — Global(전사 보안·코딩 스타일) / Domain(팀·비즈니스 도메인 로직) / Local(레포별 구현 디테일·프로젝트 규칙). 한 CLAUDE.md에 다 밀어넣지 말고 책임에 따라 쪼개라는 게 요지
  - 비유의 출처 — '이전 글에서 Claude Code 구조를 레이어드 아키텍처에 비유했듯, 플러그인이 담는 지식도 계층화할 수 있다'. 코드 아키텍처 사고를 '지식 관리'에 그대로 적용
  - 팀 스케일 — 계층화된 플러그인 묶음 = Living Knowledge Base → 워크플로를 배포하는 '마켓플레이스 1.0'으로 확장. 개인 팁이 아니라 조직 차원 표준화가 목표 (toss.tech 자체 글, 수치 주장 없음)
  source: https://toss.tech/article/harness-for-team-productivity
- category: ai
  title: Ruflo(전 claude-flow) — Claude Code 위에 'queen 에이전트가 worker 떼를 지휘하는' 멀티에이전트 스웜 하네스(MIT·~59.8k★)
  summary: 'Reuven Cohen(ruvnet)이 만든 오픈소스 멀티에이전트 오케스트레이션 레이어로, 2026년 초 ''claude-flow''에서 ''Ruflo''로 개명했다(README 기준 ~59.8k★, MIT). 핵심 구조는 queen 에이전트가 계획·위임하고 다수 worker 에이전트가 병렬 실행하는 hierarchical 스웜이며, mesh·ring·star 등 토폴로지와 합의 프로토콜을 지원한다. Claude뿐 아니라 GPT·Gemini·Cohere·Ollama로 라우팅되는 모델 비종속 하네스이고, npm 패키지는 ruflo(구 claude-flow 이름도 호환 유지)로 깐다. 단, 성능·도구 수치는 프로젝트 자체 주장이며 한 외부 감사는 ''주장된 MCP 도구 다수가 실제로는 동작 안 한다''고 지적했으니 수치는 그대로 믿지 말고 검증해서 쓰는 게 안전하다.

    '
  points:
  - '구조 — queen-led hierarchical 스웜: 한 에이전트가 작업을 쪼개 위임하고 worker들이 병렬 처리, SQLite/임베딩 기반 메모리로 세션 간 컨텍스트를 유지한다고 README가 설명. 100+ 에이전트·다수 플러그인·MCP 도구를 묶어 제공한다고 주장'
  - 모델 비종속 — 이름이 'Claude만'을 함의해 Ruflo로 개명. Claude·GPT·Gemini·Cohere·Ollama를 smart routing으로 갈아끼우며, npx ruflo / npx claude-flow 둘 다 같은 도구를 호출(하위호환)
  - 수치는 '주장'으로 — 속도·비용 절감·SWE 점수 등은 프로젝트 자체 벤치 주장이고, 2026년 한 독립 감사는 '광고된 MCP 도구·비용절감 수치가 실측과 어긋난다'고 반박. 도입 전 자기 환경에서 직접 측정 권장
  source: https://github.com/ruvnet/claude-flow
- category: ai
  title: Crush(Charm/charmbracelet) — Go로 짠 '예쁜 터미널' 코딩 에이전트, 세션 중에 LLM을 갈아끼우는 모델 비종속 TUI(~25.4k★)
  summary: 'TUI 라이브러리로 유명한 Charm(charmbracelet)이 만든 터미널 기반 코딩 에이전트로, Go로 작성됐고 README 기준 ~25.4k★·라이선스는 FSL-1.1-MIT다. 다른 터미널 에이전트들과 묶이는 범주(OpenCode·goose·Aider 부류)지만 차별점은 ''Charm다운'' 글래머러스한 TUI와 모델 비종속성이다. Anthropic·OpenAI·Groq·OpenRouter 등 다수 공급자를 지원하고 OpenAI/Anthropic 호환 엔드포인트면 뭐든 붙으며, 한 세션 안에서 LLM을 바꿔 끼울 수 있다. 프로젝트별로 컨텍스트가 분리되는 세션 기반이고, MCP를 http·stdio·sse 세 전송으로 확장한다.

    '
  points:
  - 정체성 — Charm 생태계(Bubble Tea 등 TUI 도구로 유명)가 내놓은 코딩 에이전트. Go 98%대, 라이선스 FSL-1.1-MIT, README상 ~25.4k★, macOS·Linux·Windows·BSD 계열까지 지원
  - 모델 비종속·세션 중 전환 — Anthropic/OpenAI/Groq/OpenRouter/Vercel AI Gateway 등 여러 공급자 지원, OpenAI·Anthropic 호환이면 연결, '세션 도중 LLM 교체' 가능. 프로젝트별 컨텍스트가 나뉘는 세션 기반
  - 설치·확장 — brew/npm(@charmland/crush)/winget/Arch/Nix/FreeBSD 등 패키지 다양, 'no configuration'으로도 동작하고 crush.json으로 설정. MCP를 http·stdio·sse로 붙여 도구 확장
  source: https://github.com/charmbracelet/crush
- category: ai
  title: Zed 1.0 — Rust로 5년 짠 고성능 에디터가 '에이전트 호스트'로 1.0을 찍다(Atom·Tree-sitter 제작진·~85k★)
  summary: 'Atom·Tree-sitter를 만든 Zed Industries가 2026-04-29 에디터 Zed의 1.0을 발표했다. Atom 시절의 ''Electron 위 JS''를 버리고 GPUI라는 렌더링 프레임워크를 Rust로 바닥부터 새로 짜, 5년·100만 줄 넘는 코드로 GPU 가속 에디터를 만든 게 핵심이다(GitHub ~85.4k★·주로 GPL-3.0). 코딩 에이전트 관점의 차별점은 Zed가 ''에이전트를 직접 만든 게 아니라 호스트''라는 점이다 — 자체 표준 ACP(Agent Client Protocol)로 Claude Code·Codex·Gemini CLI·goose 같은 외부 에이전트를 에디터 안에서 네이티브로 돌리고, Agent Panel에서 여러 에이전트를 병렬로 띄운다. 즉 ''터미널 에이전트 vs IDE''가 아니라, 빠른 에디터를 에이전트들의 공용 작업대로 쓰는 방향이다.

    '
  points:
  - 정체성 — Nathan Sobo(전 Atom 공동제작) 팀의 Zed Industries 작품. 2026-04-29 1.0, Rust 97%대·GPUI를 Rust로 자작, mac·Windows·Linux, GitHub ~85.4k★·라이선스 주로 GPL-3.0
  - 에이전트 호스트 모델 — 자체 에이전트를 강제하지 않고 ACP로 Claude Code·Codex·Gemini CLI·OpenCode·goose·Cline 등 외부 에이전트를 에디터에 붙여 씀. JetBrains도 ACP 채택, 양사 공동 에이전트 레지스트리
  - 병렬 에이전트 — Agent Panel에서 여러 에이전트를 한 창에서 동시에 실행(Parallel Agents). 코드 검색·파일 편집·터미널 실행 같은 내장 툴을 에이전트가 호출하는 agentic editing 지원
  source: https://zed.dev/blog/zed-1-0
- category: ai
  title: '''Coding Beyond Your Training''(arXiv 2026) — Claude Code 도입이 개발자의 ''쓰는 언어·레포 폭''을 넓힌다는 5,838명 패널 연구'
  summary: '이코노미스트 Alexander Quispe가 2026년 5월 arXiv에 올린 워킹페이퍼로, AI 코딩 어시스턴트 도입이 개발자 개인의 ''기술적 프런티어''(다루는 언어·레포·커밋량)를 넓히는지를 GitHub 데이터로 추정한다. 2025-05~2026-01 사이 Claude Code가 GitHub에 퍼진 staggered rollout을 활용해, 개발자 5,838명을 28개월간 월 단위로 추적했다. ''첫 Claude 공동저자(Co-authored) 커밋'' 시점을 도입 기준으로 잡고, 아직 도입 안 한 개발자를 대조군으로 쓰는 staggered DiD 방식이다. 도입 후 월 커밋 +41개, 기여 레포 +1.5개, 사용 언어 수 +0.83, 신규 언어 +0.31 등 ''양''과 ''다양성''이 모두 늘었다고 보고한다.

    '
  points:
  - 데이터 — 개발자 5,838명을 28개월 월 단위 패널로 추적, 처치는 '첫 Claude-co-authored 커밋' 시점으로 정의, not-yet-treated를 대조군으로 쓰는 staggered DiD
  - 효과(추정치) — 월 커밋 +41, 기여 레포 +1.5, 사용 언어 +0.83, 신규 언어 +0.31. '많이 짠다'를 넘어 '안 쓰던 언어·레포로 폭이 넓어진다'가 핵심
  - 한계 — 단독 저자 워킹페이퍼(미동료심사)이고 관측 데이터 기반 인과 추정이라 '도입이 원인'이라 단정 말 것. 실무 함의는 '에이전트가 개발자의 기술 반경을 넓힌다'는 가설 정도로
  source: https://arxiv.org/abs/2605.25438
- category: ai
  title: superpowers(obra) — 'TDD·브레인스토밍·서브에이전트 리뷰'를 스킬로 강제하는 에이전트 방법론 프레임워크(MIT·~22.9만★)
  summary: 'Jesse Vincent(obra)이 만든 ''에이전트 스킬 프레임워크이자 소프트웨어 개발 방법론''으로, 깔아두면 코딩 에이전트가 작업을 시작할 때 자동으로 트리거되는 스킬 묶음을 준다. 핵심은 도구가 아니라 ''강제되는 워크플로''다. 에이전트는 먼저 목표를 캐묻고(brainstorming), 스펙·구현 계획을 만든 뒤, 작업마다 새 서브에이전트를 띄워 ''스펙 준수 → 코드 품질'' 2단계 리뷰를 거치며 자율적으로 진행한다. TDD 스킬은 RED-GREEN-REFACTOR를 강제하고 ''테스트 전에 짠 코드는 삭제''한다고까지 명시한다. 특정 도구에 묶이지 않고 Claude Code·Codex·Gemini CLI· Factory Droid·OpenCode·Pi 등에 각각 설치해 쓴다. GitHub API 기준 ~229.8k★·MIT, 최신 v6.0.0(2026-06-16).

    '
  points:
  - 강제되는 워크플로 — brainstorming(목표 캐묻고 대안 탐색→스펙), writing-plans, test-driven-development(RED-GREEN-REFACTOR 강제·테스트 전 코드는 삭제), systematic-debugging, requesting/receiving-code-review가 자동 트리거
  - 서브에이전트 주도 개발 — 작업마다 '새 서브에이전트'를 띄워 '스펙 준수 검토 → 코드 품질 검토' 2단계로 리뷰. 작성 패스와 리뷰 패스를 같은 컨텍스트에서 섞지 않는 게 설계 핵심
  - 도구 비종속 — Claude Code(/plugin install superpowers@claude-plugins-official)·Codex·Gemini(gemini extensions install)·Antigravity·Factory Droid·OpenCode·Pi 등 하네스별로 따로 설치. 사용자 지시가 항상 스킬보다 우선(CLAUDE.md가 'TDD 쓰지마'면 그게 이긴다)
  source: https://github.com/obra/superpowers
- category: ai
  title: claude-code-router(musistudio) — Claude Code 요청을 가로채 '작업 종류별로' 다른·싼 모델로 흘려보내는 라우팅 프록시(MIT)
  summary: 'Claude Code를 Anthropic 모델에만 묶지 않고, 로컬 프록시를 끼워 요청을 다른 공급자/모델로 라우팅하는 오픈소스 도구다. Anthropic ↔ OpenAI 포맷을 변환해주기 때문에 OpenRouter·DeepSeek· Ollama·Gemini 등 OpenAI 호환 API면 Claude Code 인터페이스 그대로 붙는다. 핵심은 ''한 모델로 다 처리''가 아니라 작업 성격에 따라 모델을 갈아끼우는 라우팅 규칙이다 — 기본 모델 외에 background(가벼운 백그라운드 작업), think(추론), longContext(긴 컨텍스트)처럼 라우터를 나눠, 백그라운드성 작업은 더 싸거나 로컬인 모델로 흘려보내 비용 천장을 거는 식이다. 세션 중 /model로 즉시 전환할 수도 있다. MIT 라이선스이며 Anthropic 공식 도구가 아닌 서드파티 프록시다.

    '
  points:
  - 동작 방식 — Claude Code와 모델 사이에 로컬 프록시를 두고 Anthropic↔OpenAI 포맷을 번역. OpenRouter·DeepSeek·Ollama·Gemini 등 OpenAI 호환 API면 무엇이든 백엔드로 붙는다
  - 작업별 라우팅(비용 최적화 핵심) — default 외에 background·think·longContext 등 라우터를 나눠, 가벼운 백그라운드 작업은 싸거나 로컬인 모델로 보내고 무거운 추론만 비싼 모델에 맡기는 식으로 천장을 건다. /model로 세션 중 즉시 전환도 가능
  - 주의 — 비공식 서드파티 프록시(MIT). 라우팅 대상에 비(非)Anthropic·로컬 모델을 섞을 수 있다는 게 장점이자, 모델별 출력 품질·포맷 호환은 사용자가 검증해야 한다는 뜻
  source: https://github.com/musistudio/claude-code-router
- category: ai
  title: ast-grep — 에이전트의 '찾아 바꾸기'를 텍스트가 아니라 '문법 트리(AST)'로 시키는 구조적 검색·치환 도구(Rust·MIT·~14.5k★)
  summary: 'ast-grep(명령어 sg)는 코드를 문자열이 아니라 tree-sitter로 파싱한 AST로 보고, ''패턴 매칭''으로 검색·린트·치환을 하는 Rust CLI다. 패턴은 평범한 코드처럼 쓰되 $MATCH 같은 ''$+대문자'' 와일드카드로 임의의 AST 노드 하나를 잡는다. 텍스트 정규식과 달리 언어 문법을 알기 때문에, 함수 호출·인자 구조 같은 ''의미 단위''를 정확히 잡아 대규모로 바꿀 수 있다. 그래서 LLM 에이전트가 ''sed로 막 치환하다 줄 어긋나는'' 실수 없이 코드를 안전하게 일괄 수정하게 하는 도구로 쓰인다(공식 agent-skill 저장소도 운영). 멀티코어를 쓰고 CLI로도 라이브러리로도 동작한다. (MIT, GitHub 기준)

    '
  points:
  - 무엇 — tree-sitter 기반 AST 패턴 매칭 CLI. 패턴을 코드처럼 쓰고 $MATCH/$$$ 같은 와일드카드로 노드를 잡아 search·lint·rewrite. YAML로 린트 규칙도 정의. 멀티코어 활용·jQuery식 AST 순회 API 제공
  - 왜 에이전트에 좋나 — 정규식/sed는 '텍스트'만 보니 들여쓰기·괄호·동일 이름 변수에서 오작동하기 쉽지만, ast-grep은 언어 문법을 알아 '구조 단위'로 정확히 치환한다. LLM이 대규모 리팩터를 줄 어긋남 없이 시키는 데 적합(ast-grep 공식 agent-skill 저장소 존재)
  - 한계(공식 명시) — 타입·제어흐름·데이터흐름·테인트 분석 같은 깊은 의미 정보는 없다(그쪽은 Semgrep 영역). 즉 '구문은 정확하지만 의미 추론은 못 한다'. 보안 룰셋이 필요하면 ast-grep만으론 부족
  source: https://github.com/ast-grep/ast-grep
- category: ai
  title: 컨텍스트 엔지니어링(Anthropic 공식) — '프롬프트 한 줄' 말고 '에이전트가 매 턴 보는 전체 토큰'을 설계하는 법
  summary: 'Anthropic 응용AI팀이 2025-09-29에 낸 엔지니어링 글로, 프롬프트 엔지니어링의 다음 단계를 ''컨텍스트 엔지니어링''으로 규정한다. 프롬프트가 ''잘 쓴 한 번의 지시''라면, 컨텍스트 엔지니어링은 추론 매 순간 컨텍스트 창에 무엇을 넣을지 ''큐레이션''하는 일이다. 핵심 원칙은 "원하는 결과가 나올 확률을 최대화하는, 가장 작은 고신호(high-signal) 토큰 집합"을 찾는 것 — LLM의 ''주의 예산(attention budget)''은 유한하고, 토큰이 많아질수록 성능이 떨어지는 ''context rot''이 생기기 때문이다. 길게 돌아가는 에이전트를 위해 compaction(대화 압축)·note-taking(외부 메모)·멀티에이전트(서브에이전트가 요약만 반환)·just-in-time 검색을 작업 유형별로 골라 쓰라고 권한다. (Anthropic 엔지니어링 블로그 기준)

    '
  points:
  - 정의 — 프롬프트 엔지니어링은 '한 번의 지시를 잘 쓰기', 컨텍스트 엔지니어링은 '에이전트가 매 턴 보는 컨텍스트 창 전체(시스템 프롬프트·도구 결과·히스토리·검색물)를 매 순간 큐레이션'하기. 시스템 프롬프트는 하드코딩 로직과 모호한 지침 사이 'right altitude(적정 고도)'를 노려라
  - 핵심 원칙 — '주의 예산'은 유한하고 토큰이 늘면 'context rot'으로 성능이 떨어진다. 그래서 목표는 '원하는 결과 확률을 최대화하는 가장 작은 고신호 토큰 집합'. 데이터는 미리 다 채우지 말고 lightweight identifier(파일경로 등)만 들고 런타임에 끌어오는 just-in-time 방식
  - '긴 작업용 3패턴 — ① compaction: 왕복 대화는 요약해 다시 채운다 ② note-taking: 마일스톤형 작업은 외부 메모로 기억 ③ 멀티에이전트: 서브에이전트가 수만 토큰을 쓰되 메인엔 1,000~2,000토큰 요약만 반환하고 리드가 종합. 작업 성격에 맞춰 골라 써라'
  source: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
- category: ai
  title: Roo Code의 '코드베이스 인덱싱' — 'grep만 쓰는' 에이전트 시대에 굳이 벡터DB(Qdrant)로 의미 검색을 거는 선택(Apache-2.0·~24.2k★)
  summary: '요즘 Claude Code·Cursor류 에이전트가 벡터DB를 안 띄우고 grep·파일트리·find으로 코드를 찾는 쪽으로 기울었지만, VS Code용 오픈소스 에이전트 Roo Code(Cline 포크)는 여전히 ''코드베이스 인덱싱''으로 의미 기반(semantic) 검색을 건다. 동작은 ① tree-sitter로 코드를 함수·클래스 같은 의미 블록(100~1000자)으로 쪼개고 ② 임베딩을 떠서 ③ Qdrant 벡터DB에 저장한 뒤, 에이전트에게 codebase_search 도구를 쥐여 준다. 그러면 "사용자 인증은 어디서 처리하나" 같은 자연어 질의로 정확한 텍스트 일치가 아니라 ''의미''로 코드를 찾는다. 대형·비공개·낯선 레포에서 grep으로 키워드를 모를 때 유리하다는 게 이 방식의 포지션이다. (GitHub·공식 문서 기준)

    '
  points:
  - 동작 3단계 — tree-sitter로 의미 블록(100~1000자, 미지원 언어는 줄 단위 폴백) 분할 → 임베딩 → Qdrant 벡터DB 저장. 에이전트엔 codebase_search 도구로 노출돼, 텍스트 일치 아닌 '의미'로 관련 코드를 찾게 한다
  - 임베딩은 8종 선택 — OpenAI·Google Gemini·Ollama·OpenAI Compatible·Mistral·Vercel AI Gateway·Bedrock·OpenRouter. 공식 문서는 '현재 무료'인 Gemini를 권하고, Ollama로는 완전 로컬 임베딩도 가능. Qdrant는 클라우드나 Docker 로컬로 띄운다
  - 왜 지금 논쟁거리냐 — 다수 프런티어 에이전트(Claude Code·Cursor류)는 벡터RAG 대신 grep/파일트리로 회귀했다는 평가가 많다. Roo Code는 반대로 '키워드를 모르는 대형·비공개 레포'에선 의미 검색이 낫다는 쪽. tree-sitter 기반이라 코드를 '문법 단위'로 잘라 인덱싱한다
  source: https://roocodeinc.github.io/Roo-Code/features/codebase-indexing
- category: ai
  title: Cline — VS Code 안에서 'Plan→Act'로 끊어 가는 오픈소스 코딩 에이전트(Apache-2.0·~63k★)
  summary: 'Cline은 VS Code·JetBrains 확장이자 CLI/SDK로 동작하는 오픈소스 코딩 에이전트다(라이선스 Apache-2.0, GitHub ~63.4k★). 마켓플레이스 ID가 saoudrizwan.claude-dev인 데서 보이듯 초기엔 ''Claude Dev''로 출발했고, 특정 모델에 묶이지 않는 BYOK 멀티프로바이더가 핵심이다. 가장 큰 특징은 ''Plan/Act'' 2모드 — Plan에서 코드베이스를 훑고 질문하며 전략을 세운 뒤 Act로 전환해 실행하고, 모든 편집·명령은 기본적으로 사람 승인을 거친다(auto-approve로 풀 수 있음).

    '
  points:
  - Plan/Act 2모드 — Plan에서 레포 탐색·질의·전략 수립, Act에서 실제 파일 편집과 명령 실행. 각 diff·터미널 명령·웹 패치를 실행 전에 승인/거부하는 human-in-the-loop이 기본값
  - 모델 비종속 BYOK — Anthropic·OpenAI·Google Gemini·OpenRouter(200+ 모델)·Bedrock·Azure/Vertex·Groq·Cerebras, 그리고 Ollama/LM Studio로 완전 로컬까지. 'AI 프로바이더 하나에 잠기지 않는다'를 명시
  - 도구 — 터미널 명령을 돌리고 출력을 실시간 관찰(설치·테스트·배포), 웹 브라우징, MCP 서버 연결(DB·API·클라우드, CLI에선 cline mcp로 관리). SDK·CLI·Kanban·VS Code·JetBrains 등 형태로 제공
  source: https://github.com/cline/cline
- category: ai
  title: Claude Squad — tmux+git worktree로 여러 코딩 에이전트를 한 터미널에서 병렬로 돌리는 TUI(AGPL·~7.8k★)
  summary: 'Claude Squad는 Claude Code·Codex·Gemini·OpenCode/Amp·Aider 같은 여러 AI 코딩 에이전트를 각자 격리된 작업공간에서 동시에 띄워 한 TUI로 관리하는 터미널 앱이다. 내부적으로 tmux로 각 에이전트 세션을 분리하고 git worktree로 작업물을 격리해, 한 레포 안에서 여러 태스크를 충돌 없이 병렬 진행한다. Conductor·Vibe Kanban 같은 GUI 오케스트레이터와 달리 터미널만으로 돌아가는 게 특징이며, 실행에는 tmux와 gh(GitHub CLI)가 필요하다.

    '
  points:
  - 여러 에이전트를 한 화면에서 — Claude Code 한 칸, Codex 한 칸, OpenCode 한 칸 식으로 각 태스크를 독립 세션으로 띄워 동시에 돌리고 TUI에서 전환
  - tmux + git worktree 격리 — 세션 분리는 tmux가, 작업물 충돌 방지는 worktree가 담당. -p(profile) 플래그로 에이전트별 설정 지정
  - 주의점 — tmux 의존이라 네이티브 Windows 미지원, 프롬프트 자동수락(--autoyes)은 실험적, 라이선스가 AGPL이라 이를 네트워크 서비스로 확장할 땐 검토 필요
  source: https://github.com/smtg-ai/claude-squad
- category: ai
  title: claude-plugins-official — 회사들이 직접 올린 177+ 플러그인이 모이는 Anthropic 공식 마켓플레이스(~30k★)
  summary: 'anthropics/claude-plugins-official은 Anthropic이 직접 큐레이션하는 Claude Code 플러그인 공식 마켓플레이스다. AWS·Microsoft·MongoDB·Cloudflare·Figma·Atlassian·Notion·Playwright 등 회사들이 자사 도구를 스킬·서브에이전트·MCP 서버·LSP 묶음으로 올려두고, 한 줄 명령으로 골라 깐다. 거기에 Anthropic이 직접 번들한 code-review·frontend-design·ralph-loop·claude-md-management, 그리고 Python·Rust·Go·Java 등 언어별 LSP 플러그인까지 들어 있다. 이름이 비슷한 claude-plugins-community(3rd party 검수본)와는 별개다.

    '
  points:
  - 설치 흐름 — 인터랙티브 첫 실행 시 자동 등록되며, 헤드리스/CI에선 `claude plugin marketplace add anthropics/claude-plugins-official`로 추가한 뒤 `/plugin install <이름>@claude-plugins-official`로 깐다(또는 `/plugin > Discover`로 탐색)
  - 무엇이 들었나 — 벤더 통합(aws-core·azure·mongodb·cloudflare·figma·github·playwright·context7·firecrawl…)부터 Anthropic 자체 워크플로(code-review·pr-review-toolkit·feature-dev·hookify·ralph-loop)와 사전제작 LSP(pyright·rust-analyzer·gopls·jdtls 등)까지 177개 이상
  - 주의 — 공식 마켓플레이스라도 Anthropic이 각 플러그인의 MCP 서버·코드를 통제하지 않는다고 명시. 설치·사용 전 신뢰할 수 있는 플러그인인지 직접 확인하라는 경고가 붙는다
  source: https://github.com/anthropics/claude-plugins-official
- category: ai
  title: Rakuten 도입 사례 — Claude Code가 1,250만 줄 vLLM에서 '7시간 무인 코딩'으로 기능 하나를 끝낸 기업 레퍼런스
  summary: 'Anthropic이 공개한 Rakuten 고객 사례다. ML 엔지니어 Kenta Naruse가 1,250만 줄 규모의 오픈소스 라이브러리 vLLM에 활성화 벡터 추출 기능을 구현하라고 시키자, Claude Code가 사람이 코드를 직접 안 쓰고 가끔 가이드만 주는 상태로 7시간을 연속 자율 작업해 한 번에 완성했다고 한다. 결과물은 레퍼런스 대비 99.9% 수치 정확도였고, 회사 전체로는 신규 기능의 출시 소요가 24일→5일(79% 단축)로 줄었다는 게 사례가 내세우는 지표다. 단 이는 Opus 4 출시 시점(2025)에 함께 발표된 벤더 측 마케팅 사례이며, 수치는 Rakuten·Anthropic의 자체 주장임에 유의.

    '
  points:
  - 핵심 수치(벤더 주장) — 7시간 연속 무인 코딩 / 출시 24일→5일(79%↓) / 복잡한 코드 수정 99.9% 정확도
  - '운영 패턴 — AI 담당 GM Yusuke Kaji의 표현: ''Claude Code에 4개를 위임하고 나는 1개에 집중해, 5개 작업을 병렬로 굴린다'''
  - 맥락·한계 — Opus 4 발표(2025)와 묶여 나온 고객 레퍼런스다. 1,250만 줄 코드베이스에서의 단일 작업 일화이며 통제된 벤치마크가 아니므로, 일반 성능 보장이 아니라 '엔터프라이즈 자율 코딩이 가능했다'는 사례로 읽어야 한다
  source: https://claude.com/customers/rakuten
- category: ai
  title: Claude Code 사용량 한도 읽는 법 — '5시간 세션 + 주간 한도' 두 버킷에 Opus는 따로 카운트(공식 문서)
  summary: 'Pro/Max 플랜의 Claude Code 사용량은 단일 숫자가 아니라 두 개의 윈도가 동시에 돈다고 Anthropic 공식 지원 문서가 명시한다. 하나는 ''5시간 롤링 세션'', 다른 하나는 ''주간 한도''이며, 설정의 Usage 페이지에서 두 진행바를 각각 보고 리셋 시각도 확인할 수 있다. 특히 주간 한도는 ''Opus 전용''과 ''그 외 모든 모델''이 별도 버킷으로 추적돼, Opus를 다 써도 Sonnet/Haiku로는 계속 작업할 수 있다. Anthropic은 정확한 토큰 쿼터를 공개하지 않고 플랜 배수(Pro 1x, Max 5x/20x)만 제시하므로, 실제 소진 속도는 모델·대화 길이·툴 사용·effort에 따라 달라진다.

    '
  points:
  - 두 윈도 동시 적용 — 5시간 세션 한도와 주간 한도가 따로 존재하고, `/usage`(또는 웹 Usage 설정)에서 각 진행바와 리셋 시점을 본다. 주간 버킷은 'Opus 전용 / 그 외 모델'로 분리 카운트
  - 절약 패턴(문서 권장) — 관련 질문은 한 메시지로 묶고, 프로젝트에 올린 내용은 캐싱돼 재사용 시 한도에 안 잡힌다. 모델·effort를 낮추고 첨부 크기를 줄이는 것도 직접적 효과
  - 정량 쿼터는 비공개 — Anthropic은 토큰 수가 아니라 배수(Pro 1x / Max 5x / Max 20x)만 발표. '몇 토큰'이 아니라 '내 진행바가 어디까지 찼나'로 관리하는 게 현실적
  source: https://support.claude.com/en/articles/9797557-usage-limit-best-practices
- category: ai
  title: Gemini CLI(google-gemini) — '개인 구글 계정 로그인'만으로 Gemini 2.5 Pro·1M 컨텍스트를 무료로 터미널에 꽂는 오픈소스 에이전트(Apache-2.0·~105k★)
  summary: 'Gemini CLI는 구글이 2025년 6월 공개한 터미널 네이티브 코딩 에이전트로, GitHub에서 Apache-2.0 라이선스·약 10.5만 스타에 v0.46.0까지 활발히 릴리스되고 있다(주장이 아니라 레포에서 직접 확인되는 사실). 가장 실무적인 포인트는 진입 장벽이 거의 없다는 것 — 개인 구글 계정으로 로그인하면 Gemini Code Assist 무료 라이선스가 딸려와 분당 60요청·하루 1,000요청까지 비용 없이 쓸 수 있다고 구글 공식 블로그가 명시한다. 모델은 100만 토큰 컨텍스트의 Gemini 2.5 Pro에 무료로 접근하며, MCP(Model Context Protocol)를 기본 지원해 Claude Code·Codex와 같은 도구·서버 생태계를 그대로 붙일 수 있다. 더 많은 한도가 필요하면 Google AI Studio/Vertex AI 키로 사용량 과금 모드로 전환한다. Claude Code의 무료 대안이나 멀티 에이전트 스택의 한 축으로 평가해 볼 만하다.

    '
  points:
  - 무료 진입 — 개인 구글 계정 로그인만으로 분당 60·하루 1,000 요청을 무과금 사용(공식 블로그 수치). API 키나 결제 등록 없이 바로 시작
  - 스펙 — Gemini 2.5 Pro + 1M 토큰 컨텍스트, MCP 기본 지원으로 기존 MCP 서버/도구를 그대로 연결. VS Code(Gemini Code Assist)와 기술 공유
  - 오픈소스 사실 — Apache-2.0, github.com/google-gemini/gemini-cli에서 ~105k★·523개 릴리스(v0.46.0, 2026-06). 일부 블로그의 '서비스 종료설'은 레포에 deprecation 표기가 없어 1차 출처로는 미확인 — 카드에서 제외
  source: https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-cli-open-source-ai-agent/
- category: ai
  title: awesome-claude-code(hesreallyhim) — 스킬·훅·슬래시커맨드·오케스트레이터를 '한 분류에 검증된 하나'로 골라주는 정전(正典) 큐레이션 목록(CC BY-NC-ND·~46.6k★)
  summary: 'awesome-claude-code는 hesreallyhim이 관리하는 Claude Code 생태계의 ''정전'' 큐레이션 목록으로, GitHub에서 약 46.6k 스타·4.1k 포크·1,157 커밋까지 활발히 갱신되고 있다(레포에서 직접 확인되는 사실). 단순 링크 덤프가 아니라 스킬·훅·슬래시커맨드·에이전트 오케스트레이터·애플리케이션·플러그인·상태줄·개발 도구를 분류별로 모으고, 동작하지 않는 도구는 잘라내고 동작하는 것만 ''무슨 용도인지'' 태깅하는 방식이라 ''분류당 하나만 고르기''에 적합하다는 평가를 받는다. 이슈가 1,000건을 넘길 만큼 제출·검증이 활발하며, 레포 자체는 Python 98%로 구성된 자동 검증 파이프라인으로 목록을 관리한다. 라이선스는 CC BY-NC-ND 4.0(저작자표시·비영리·변경금지)이라 그대로 재배포·상업적 가공에는 제약이 있으니 ''읽고 도구를 고르는'' 용도로 쓰는 게 맞다.

    '
  points:
  - 쓰는 법 — 새 도구를 막 깔기 전에 '이 분류에서 이미 검증된 것'을 먼저 확인하는 색인으로 사용. 동작 안 하는 건 컷, 동작하는 건 용도 태깅(주장이 아닌 큐레이션 정책)
  - 범위 — 스킬·훅·슬래시커맨드·오케스트레이터·플러그인·상태줄·앱·개발툴을 한곳에. 비슷한 aggregator(everything-claude-code 등)는 '전부 쏟아내기'라 성격이 다름
  - 사실 — github.com/hesreallyhim/awesome-claude-code, ~46.6k★·4.1k fork·480 open issues, 라이선스 CC BY-NC-ND 4.0(비영리·변경금지라 재배포 제약 있음)
  source: https://github.com/hesreallyhim/awesome-claude-code
- category: ai
  title: OpenAI가 SWE-bench Verified를 버렸다 — '실패한 테스트 중 59%가 결함, 모델이 정답을 외운다'며 공식 점수 보고 중단(2026-02)
  summary: '2026년 2월, OpenAI의 Frontier Evals 팀은 코딩 에이전트 사실상 표준 지표였던 SWE-bench Verified의 점수 보고를 중단한다고 공식 발표했다(OpenAI 주장). 이유는 두 가지다. ① 결함 있는 테스트 — 자주 실패하던 어려운 문제 일부(전체의 약 27.6%)를 감사했더니, 기능적으로 맞는 답을 거부하는 결함 테스트가 그중 약 59.4%였다(문제 설명에 없는 정확한 함수명을 요구하거나, 무관한 동작을 검사). ② 학습 데이터 오염 — Django·Astropy 등 유명 오픈소스 파이썬 레포에서 문제를 뽑은 탓에, 주요 프런티어 모델들이 ''태스크 ID''만 주면 정답 패치를 그대로 재현했다(OpenAI 주장). 결론은 "Verified 점수 개선은 더 이상 실제 개발 능력 향상이 아니라 ''벤치를 얼마나 학습 때 봤는가''를 반영한다"이며, OpenAI는 비공개·카피레프트로 오염이 덜한 SWE-bench Pro로의 전환을 권한다.

    '
  points:
  - '교훈 — 굿하트의 법칙: 지표가 목표가 되면 지표이길 멈춘다. AI 코딩 도구를 ''Verified 80%'' 같은 단일 숫자로 고르지 말 것'
  - 수치 격차(보도된 OpenAI 감사값) — Verified ~80%대 모델이 오염에 강한 SWE-bench Pro 공개셋에선 ~23%로 급락. 감사 표본은 64회 독립 실행·138문항
  - 실무 — 사내 도구 평가는 공개 벤치 대신 '우리 비공개 레포로 만든 자체 태스크'를 쓰는 게 오염·과적합을 피하는 길. OpenAI도 전문가가 원본 태스크를 짜는 GDPVal 류로 투자 이동
  source: https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/
- category: ai
  title: Codebuff(CodebuffAI) — '한 모델'이 아니라 파일선택·계획·편집·검토 4개 에이전트가 분업하는 오픈소스 코딩 에이전트(Apache-2.0·~6.5k★)
  summary: 'Codebuff는 자연어 지시로 코드베이스를 고치는 오픈소스 AI 코딩 에이전트로, 단일 모델에 다 맡기는 대신 역할이 다른 에이전트 여러 개가 협업하는 구조를 핵심으로 내세운다(README 주장). 예컨대 ''인증 추가'' 같은 작업이 들어오면 ① File Picker가 레포를 훑어 아키텍처를 파악하고 관련 파일을 찾고 ② Planner가 어떤 파일을 어떤 순서로 고칠지 계획하고 ③ Editor가 정밀 편집을 하고 ④ Reviewer가 변경을 검증한다. 이렇게 나누면 단일 모델 도구보다 컨텍스트 이해가 낫고 편집이 정확하며 오류가 적다는 게 프로젝트의 설명이다. CLI(`npm i -g codebuff`)뿐 아니라 SDK(`@codebuff/sdk`)로 에이전트를 프로덕션에 임베드할 수 있고, `/init`를 돌리면 knowledge.md와 `.agents/` 디렉터리(TypeScript 타입 정의)가 생겨 자기만의 커스텀 에이전트를 정의할 수 있다.

    '
  points:
  - 핵심 구조 — File Picker(탐색)→Planner(계획)→Editor(편집)→Reviewer(검증) 분업. '서브에이전트로 컨텍스트를 나눠 오염을 막는' 멀티에이전트 패턴을 도구 자체가 기본값으로 박아둠
  - 확장 — CLI와 SDK 둘 다 제공(SDK로 앱에 코딩 에이전트 임베드). `/init`로 .agents/ TS 정의를 만들어 에이전트 행동을 직접 커스터마이즈, 광고 기반 무료판 Freebuff도 별도 존재
  - 사실 — github.com/CodebuffAI/codebuff, Apache-2.0, ~6.5k★. '단일 모델보다 낫다'는 정확도 우위는 벤치 수치가 아니라 프로젝트 주장이니 도입 전 자체 검증 권장
  source: https://github.com/CodebuffAI/codebuff
- category: ai
  title: CodeRabbit '인간 vs AI 코드' 리포트 — AI가 짠 PR이 결함 1.7배(PR당 10.83 vs 6.45건), '리뷰를 줄이지 말고 늘려라'
  summary: 'AI 코드리뷰 도구를 만드는 CodeRabbit가 2025년 12월 17일 발표한 ''State of AI vs Human Code Generation'' 리포트는, 오픈소스 PR을 자사 리뷰 엔진으로 분석해 AI가 관여한 코드가 사람만 짠 코드보다 결함이 더 많다고 보고했다. 핵심 수치는 AI-coauthored PR이 PR당 평균 10.83건의 문제를, 사람만 짠 PR은 6.45건을 내 약 1.7배 차이가 났다는 것. 유형별로는 가독성 문제가 약 3.15배로 가장 크게 벌어졌고, 로직·정확성 결함이 늘었으며 보안 취약점도 1.5~2배대로 증가했다. 함의는 분명하다 — AI로 ''쓰는 시간''은 줄지만 ''찾아 고치는 시간''이 늘어나므로, AI 도입 효과는 리뷰·검증 자동화를 함께 깔았는지에 달려 있다(리포트는 당연히 자사 도구에 유리한 프레이밍이니 숫자는 한 벤더의 주장으로 받아들일 것).

    '
  points:
  - 수치(CodeRabbit 주장) — AI 관여 PR 10.83건/PR vs 사람 6.45건/PR ≈ 1.7배. 가독성 ~3.15배, 로직 결함 증가, 보안 1.5~2배대. 자사 리뷰 엔진으로 오픈소스 PR을 분석한 결과
  - 실무 교훈 — 'AI가 짰으니 리뷰 덜 해도 된다'는 정반대. AI 코드일수록 자동 코드리뷰(claude-code-security-review·Bugbot·/code-review 등)와 테스트 게이트를 PR 단계에 강제하라
  - 측정 — ROI를 보려면 'AI 작성 코드 비율 / PR당 결함 수 / 보안 발견 수'를 같이 추적. 도입률만 보면 품질 꼬리(review tail)가 숨는다. 단일 벤더 수치이니 사내 데이터로 교차검증
  source: https://www.businesswire.com/news/home/20251217666881/en/CodeRabbits-State-of-AI-vs-Human-Code-Generation-Report-Finds-That-AI-Written-Code-Produces-1.7x-More-Issues-Than-Human-Code
- category: ai
  title: Cursor 3 'Glass'(2026-04-02) — 사이드 'Composer'를 접고, 로컬·worktree·클라우드·SSH 에이전트를 한 'Agents Window'에서 병렬로 돌리는 IDE
  summary: 'Cursor가 2026년 4월 2일 내놓은 3.0(''Glass'')은 모델이 아니라 ''IDE의 모양''을 바꾼 릴리스다. 2024년부터 Cursor를 정의하던 사이드 패널 Composer 대신, 에이전트를 1급 시민으로 두는 별도 표면 ''Agents Window''가 중심이 됐다. 공식 체인지로그에 따르면 Agents Window(Cmd+Shift+P → Agents Window)는 에이전트 여러 개를 "로컬·git worktree·클라우드·원격 SSH"에서 동시에 돌릴 수 있고, 기존 에디터로 되돌아가거나 둘을 같이 켤 수도 있다. 실무 핵심은 두 슬래시 커맨드다. /worktree는 변경을 격리하는 별도 worktree를 만들고, /best-of-n은 같은 작업을 여러 모델에 각자 worktree로 병렬 시켜 결과를 비교한다. 에디터 안의 기존 worktree/best-of-n 선택 UI는 폐기됐고, 클라우드 에이전트는 에디터에서 빠져 Agents Window로 옮겨졌다. 브라우저 UI 요소를 집어 에이전트에 피드백하는 Design Mode(⌘+Shift+D), 백그라운드 작업 완료를 기다리는 Await 도구도 함께 들어왔다.

    '
  points:
  - 구조 변화 — 사이드 패널 Composer(UI) → Agents Window(병렬 에이전트 표면). 단 in-house 코딩 모델 'Composer 2'는 그대로 남음(UI 이름과 모델 이름을 구분할 것)
  - 병렬 격리 — /worktree로 변경 격리, /best-of-n으로 한 작업을 여러 모델·각자 worktree에 돌려 'best one' 고르기. 클라우드 에이전트는 이제 Agents Window 전용
  - 도입 — 기존 구독자 무료 업데이트, Agents Window·Composer 2·worktree는 Pro/Pro+/Ultra/Teams에서 제공(가격·플랜 범위는 Cursor 공지 기준)
  source: https://cursor.com/changelog/3-0
- category: ai
  title: Google Antigravity 2.0 — IDE 하나가 '데스크톱·CLI·SDK' 3종 플랫폼으로 벌어지다(I/O 2026)
  summary: '구글이 2026-05-19 I/O에서 에이전트 우선 IDE Antigravity의 2.0을 공개했다. 단일 에디터였던 1.0(2025-11)을 ''리뉴얼된 데스크톱 앱 + Go로 새로 짠 CLI + 커스텀 에이전트용 SDK'' 3개 표면으로 확장한 것이 핵심이다. 모델은 Gemini 3.1 Pro보다 거의 전 벤치마크에서 앞서고 4배 빠르다고 주장하는 Gemini 3.5 Flash로 갈아탔다. 커스텀 서브에이전트 워크플로 설계, 백그라운드 예약 작업, 네이티브 음성 명령이 새로 들어왔다. 같은 날, Gemini CLI·Code Assist의 소비자(AI Pro/Ultra/무료) 접근은 2026-06-18부터 끊고 Antigravity로 몰아간다고 못박았다.

    '
  points:
  - 1.0 '에디터' → 2.0 '데스크톱·CLI(Go)·SDK' 3표면 플랫폼으로 확장
  - 모델은 Gemini 3.5 Flash — '3.1 Pro보다 빠르고 강하다'는 건 구글 주장
  - Gemini CLI 소비자 접근은 2026-06-18 차단, Antigravity로 이주 강제
  source: https://thenextweb.com/news/google-antigravity-2-desktop-cli-sdk-io-2026
- category: ai
  title: GitHub Copilot, 정액제를 버리다 — 2026-06-01부터 'AI 크레딧' 사용량 과금으로 전환
  summary: 'GitHub가 2026-06-01부터 Copilot 전 요금제를 ''프리미엄 리퀘스트 수''가 아니라 ''소비한 토큰(=AI 크레딧)'' 기반 사용량 과금으로 바꿨다. 모델과 입력·출력·캐시 토큰 양에 따라 비용이 매겨지고, 각 요금제에는 월 크레딧 할당량이 포함되며 초과분은 예산을 걸어 추가 구매한다. 고정 구독료는 그대로지만 ''측정 단위''가 바뀐 셈이라, 에이전트 워크플로를 많이 돌리는 헤비 유저의 청구서가 출렁일 수 있다는 우려가 컸다(공식 디스커션에 400+ 댓글). 헤비 워크플로용 상위 ''Copilot Max'' 티어도 신설됐고, 코드 리뷰는 크레딧에 더해 Actions 분까지 소비하게 됐다.

    '
  points:
  - 프리미엄 리퀘스트 → 토큰 기반 'AI 크레딧' 사용량 과금(2026-06-01)
  - 구독료는 유지·측정 단위만 변경 → 에이전트 헤비 유저 비용 변동성↑
  - 신규 'Copilot Max' 티어 추가, 코드 리뷰는 Actions 분도 소모
  source: https://github.blog/changelog/2026-06-01-updates-to-github-copilot-billing-and-plans/
- category: ai
  title: Anthropic, '코드의 80%를 Claude가 쓴다' — 그리고 API 에러 800건을 자율로 고친 사례
  summary: 'Anthropic은 2026년 5월에 자사가 머지한 코드의 80% 이상을 Claude가 작성했다고 밝혔다. 대표 사례로, 한 엔지니어가 Claude를 붙여 끈질긴 API 에러군에 대해 800건 넘는 수정을 자율로 내보내 에러율을 1,000분의 1로 줄였다(엔지니어는 일감 선택·리뷰·머지 결정으로 루프 안에 남았다). 사양이 처음부터 명확하지 않은 가장 열린 사내 엔지니어링 과제에서의 성공률도 5월 76%로 6개월 만에 50%p 올랐다고 한다. 다만 보도는 ''80% 작성·76% 성공''이 곧 ''안전·유지보수·머지 가능''을 뜻하진 않는다고 분명히 선을 긋는다.

    '
  points:
  - 2026-05 머지 코드의 80%+를 Claude가 작성(Anthropic 주장)
  - 엔지니어 1명이 Claude로 API 에러 800+건 자율 수정, 에러율 1/1000
  - '''작성 비중·성공률''이 코드 품질·머지 적합성을 보장하진 않음(보도 명시)'
  source: https://winbuzzer.com/2026/06/05/claude-writes-80-of-anthropic-code-raising-review-stakes-xcxwbn/
- category: ai
  title: AGENTS.md는 정말 도움이 되나 — 실제 PR 124건으로 잰 '시간·토큰' 실증 연구(arXiv 2026)
  summary: '에이전트 지침 파일 AGENTS.md를 두면 정말 빨라지는지를 실제 머지된 GitHub PR로 처음 정량 측정한 arXiv 연구다. 10개 레포·124개 PR을 골라 코드를 머지 직전 상태로 되돌린 뒤, AGENTS.md 유무만 다르게 해 OpenAI Codex(gpt-5.2-codex)를 도커에서 동일 조건으로 돌려 비교했다. 결과 AGENTS.md가 있을 때 실행 시간 중앙값이 약 28.6%(98.6s→70.3s) 줄고 출력 토큰 중앙값도 약 16.6% 감소했으며, 둘 다 통계적으로 유의했다. 다만 입력 토큰 중앙값은 거의 그대로였고, 토큰 절감은 ''소수의 고비용 실행''에서 주로 나왔다. 정답 여부(정확성)는 50건 샘플로 ''비어있지 않은 코드 변경''만 확인했을 뿐 본격 평가는 후속 과제로 남겼다.

    '
  points:
  - 10레포·124 PR을 페어 설계로 비교(AGENTS.md 유무만 차이)
  - 실행 시간 중앙값 ≈ -28.6%, 출력 토큰 중앙값 ≈ -16.6%(유의)
  - 절감은 '소수 고비용 실행'에 집중, 정확성 평가는 후속 과제
  source: https://arxiv.org/html/2601.20404v2
- category: ai
  title: 코딩 에이전트 7종 MCP 클라이언트 보안 비교 — '버그'가 아니라 '구조'가 뚫린다(arXiv 2026)
  summary: '''AI 개발 도구는 프롬프트 인젝션에 면역인가''를 묻는 arXiv 연구가 MCP 클라이언트 7종(Claude Desktop, Claude Code, Cursor, Cline, Continue, Gemini CLI, Langflow)을 적대적으로 비교 테스트했다. Cursor(1.6.45)는 네 가지 공격이 모두 통해 가장 취약했고, Claude Code(2.0.25)는 ''낮음~중간'' 위험으로 결과가 갈렸다. 핵심 결론은 대부분의 취약점이 구현 버그가 아니라 ''신뢰 모델·검증 계층 부재·샌드박싱 부재'' 같은 근본 아키텍처 결정에서 나온다는 것 — LLM이 명령과 데이터를 같은 경로로 읽어 둘을 완벽히 구분하지 못하기 때문이다. 따라서 보안은 사후 추가가 아니라 설계 단계부터 넣어야 한다고 못박는다.

    '
  points:
  - 'MCP 클라이언트 7종 적대 테스트: Cursor가 4개 공격 모두 통과(최취약)'
  - 취약점 대부분은 구현 버그 아닌 '신뢰모델·검증·샌드박스 부재' 구조 문제
  - LLM이 명령·데이터를 한 경로로 읽음 → 보안은 설계 단계부터 넣어야
  source: https://arxiv.org/html/2603.21642v1
- category: ai
  title: PewDiePie의 'Odysseus' — 유튜버가 던진 MIT 라이선스 self-hosted AI 워크스페이스(2026-05-31)
  summary: '구독자 최다 유튜버 Felix Kjellberg(PewDiePie)이 2026-05-31 자기 기기에서 통째로 돌리는 오픈소스 AI 워크스페이스 Odysseus를 공개했다. 채팅·자율 에이전트·딥리서치·문서·이메일·캘린더·노트에 더해, 에이전트가 파일 찾기·포맷 변환·코드 실행·웹 브라우징을 알아서 하고 영속 메모리로 학습한다. Python·FastAPI·SQLite·ChromaDB·Docker 스택에 Ollama·llama.cpp·vLLM 로컬 구동과 OpenAI·OpenRouter API를 함께 물린다(MIT). ''데이터를 회사 서버에 안 넘긴다''는 프라이버시·소유권이 철학이지만, 클라우드 API를 붙이면 데이터가 외부로 나간다는 단서가 붙는다. 출시 48시간에 별 3만, 6/4 기준 4.4만+로 폭발적 관심을 모았다(주장).

    '
  points:
  - 유튜버 PewDiePie가 만든 self-hosted AI 워크스페이스(MIT, 2026-05-31)
  - Python/FastAPI/SQLite/ChromaDB/Docker + Ollama·llama.cpp·vLLM 로컬 구동
  - '''로컬이면'' 프라이버시지만 클라우드 API 연결 시 데이터는 외부로'
  source: https://github.com/pewdiepie-archdaemon/odysseus
- category: ai
  title: OpenAI GPT-5.5 'Spud' — GPT-4.5 이후 첫 완전 재학습 에이전트 모델(2026-04-23)
  summary: 'OpenAI가 2026-04-23 코드네임 ''Spud''로 GPT-5.5를 공개했다. GPT-4.5 이후 첫 ''처음부터 다시 학습한'' 베이스 모델이라는 점이 핵심으로, 최소한의 사람 개입으로 다단계 컴퓨터 작업을 끝내도록 설계된 에이전트형 모델이다. 공식 발표 기준 Terminal-Bench 2.0에서 82.7%, GDPval 84.9%를 찍었다고 한다(OpenAI 주장). ChatGPT의 Plus·Pro·Business·Enterprise와 Codex에 함께 풀렸다. 벤치마크는 ''모델 단독''이 아니라 ''에이전트+모델 쌍''으로 읽어야 하며, 같은 시점 Terminal-Bench 2.1 공개 리더보드에서는 Codex CLI+GPT-5.5가 1위(83.4%)로 보고됐다.

    '
  points:
  - GPT-4.5 이후 첫 완전 재학습 베이스 모델, 코드네임 'Spud'(2026-04-23)
  - Terminal-Bench 2.0 82.7%·GDPval 84.9%(OpenAI 공식 발표 주장)
  - ChatGPT 유료 티어·Codex에 동시 배포, 에이전트형 다단계 작업 지향
  source: https://openai.com/index/introducing-gpt-5-5/
- category: ai
  title: Cursor Composer 2.5 — 'Composer 2 두 달 만'에 나온 자체 모델, Bugbot까지 갈아끼우다
  summary: 'Cursor가 자체 에이전트 모델 Composer 2를 낸 지 약 두 달 만에 Composer 2.5를 내놨다. CursorBench 과제를 평균 1달러 미만으로 끝낸다고 주장하는데, 같은 과제에서 Opus 4.7·GPT-5.5는 3~11달러가 든다는 비교를 함께 내세운다. 가격은 Standard 티어가 입력 100만 토큰당 $0.50·출력 $2.50, Fast 티어가 입력 $3.00·출력 $15.00다. Composer 2.5는 Cursor의 PR 리뷰 봇 Bugbot도 구동하게 됐는데, 평균 리뷰 시간이 약 5분에서 ~90초로 줄고 리뷰당 버그 검출이 평균 0.56→0.62로 10% 늘면서 실행 비용은 ~22% 낮아졌다고 한다(모두 Cursor 주장).

    '
  points:
  - Composer 2 출시 ~2개월 만의 자체 모델, CursorBench 과제 평균 <$1 주장
  - '가격: Standard 입력 $0.50/출력 $2.50, Fast 입력 $3.00/출력 $15.00(100만 토큰)'
  - Bugbot도 2.5로 전환 → 리뷰 ~90초·검출 +10%·비용 -22%(주장)
  source: https://cursor.com/changelog
- category: ai
  title: SlopCodeBench — 코딩 에이전트가 '오래 고칠수록' 코드가 망가지는 걸 재는 벤치마크(arXiv 2026)
  summary: '장기·반복 작업에서 코딩 에이전트가 시간이 갈수록 코드를 어떻게 퇴화시키는지를 따로 재겠다는 언어 비종속 벤치마크 SlopCodeBench(SCBench)다. 20개 문제를 93개 체크포인트로 쪼개, ''정확성 테스트는 통과하지만 구조는 침식되는'' 구간을 추적한다. 핵심 관찰은 (1)코드가 특정 ''구조적 끌개(attractor)''로 수렴하고, (2)품질이 실행 궤적마다 갈라지며, (3)리팩터링·개선이 정확성 테스트로는 안 잡히는 결함을 새로 들여온다는 것. 기존 연구가 시간에 따른 장황함·구조 침식을 추적하지 않았다는 공백을 메운다고 주장한다.

    '
  points:
  - 장기 반복 작업의 '코드 퇴화'를 20문제·93체크포인트로 추적
  - 정확성 테스트는 통과해도 구조가 침식 → 새 결함이 숨어듦
  - 기존 벤치마크가 안 보던 '시간에 따른 구조 침식'을 겨냥
  source: https://arxiv.org/html/2603.24755v1
- category: ai
  title: Builder Methods 'Agent OS v3' — 스펙 작성은 'Plan Mode'에 넘기고 표준만 주입하는 SDD 키트(2026)
  summary: '스펙 주도 개발(SDD) 도구 Agent OS가 ''2026용으로 더 가볍고 정렬된'' v3를 냈다. 가장 큰 변화는 스펙 작성을 Agent OS 명령이 직접 하지 않고 Claude Code(또는 Cursor 등)의 Plan Mode에 위임한다는 점 — 대신 /shape-spec이 표준·제품 미션을 고려한 질문을 던져 더 정렬된 스펙을 만들고 그 계획을 Agent OS 스펙 폴더에 자동 저장한다. /discover-standards로 코드베이스에서 표준을 발굴·제안·생성하고, /inject-standards로 대화·플랜·스킬 어디에든 index.yml 기반으로 관련 표준만 골라 주입한다. 산출물이 전부 마크다운이라 도구를 안 가린다.

    '
  points:
  - 'v3 핵심: 스펙 작성을 에이전트의 ''Plan Mode''에 위임'
  - /shape-spec(정렬된 스펙)·/discover-standards·/inject-standards(index.yml)
  - 산출물이 마크다운 → Claude Code·Cursor 등 도구 비종속
  source: https://github.com/buildermethods/agent-os/discussions/310
- category: ai
  title: SWE-bench Pro 공개셋 현황(2026-06) — 1위 GPT-5.4도 60% 못 넘고, 비공개셋은 더 떨어진다
  summary: '오염(학습 시 정답 노출)에 강한 차세대 벤치마크 SWE-bench Pro의 공개셋(731 태스크, Pass@1) 2026-06-09 기준 현황이다. GPT-5.4(xHigh)가 59.1%로 1위로, 신규 Muse Spark보다 4.1%p, 최고 Claude 런(Opus 4.6 thinking, 51.9%)보다 7.2%p 앞선다. 핵심은 오염 통제용 ''비공개 상용셋''으로, 인터넷에 없는 스타트업 18곳의 비공개 코드베이스 276 태스크에서 점수가 크게 떨어진다는 점 — 가장 강한 오염 통제 장치라는 주장이다. 오픈웨이트는 Pro에서 크게 밀려, 표준 스캐폴딩 리더보드 1위가 qwen3-coder-480b로 38.7%에 그친다.

    '
  points:
  - 공개셋(731태스크) 1위 GPT-5.4 59.1% — 최고 Claude 51.9%(Opus 4.6)
  - 비공개 상용셋 276태스크(스타트업 18곳)에서 점수 급락 = 오염 통제
  - 오픈웨이트는 Pro에서 부진(표준 스캐폴딩 1위 qwen3-coder 38.7%)
  source: https://www.morphllm.com/swe-bench-pro
- category: ai
  title: Claude Code Review — Anthropic이 직접 굴리는 'PR 열면 자동 리뷰' 매니지드 서비스(2026-03)
  summary: 'Anthropic이 2026-03 PR이 열리면 자동으로 코드 리뷰를 도는 매니지드(서버형) 멀티에이전트 서비스 Claude Code Review를 내놨다. 직접 설정·운영하는 오픈소스 리뷰 워크플로와 달리, 관리자가 Claude Code 설정에서 켜고 GitHub 앱을 깐 뒤 레포만 고르면 새 PR마다 리뷰가 자동으로 돈다. Team·Enterprise 고객 대상 리서치 프리뷰로, 출시 시점엔 GitHub 전용(GitLab·Azure DevOps·Bitbucket 미지원)이며 Zero Data Retention과는 호환되지 않는다. 과금은 토큰 기반으로 리뷰당 평균 $15~25이며, 월 지출 상한·레포 단위 우선순위를 걸 수 있다(주장). ''리뷰를 사람이 직접 거는 부담''을 서비스로 떠넘기되, 리뷰마다 실제 비용이 든다는 게 핵심 트레이드오프다.

    '
  points:
  - PR 열면 자동으로 도는 '매니지드' 멀티에이전트 리뷰(직접 운영 아님)
  - Team·Enterprise 리서치 프리뷰, 출시 시 GitHub 전용·ZDR 비호환
  - 토큰 과금 리뷰당 평균 $15~25 + 월 상한·레포 우선순위(주장)
  source: https://www.anthropic.com/news/claude-code-review
- category: ai
  title: 백그라운드 코딩 에이전트 — '맡기고 잊는' 비동기 에이전트가 2026 주류가 되다
  summary: '백그라운드 코딩 에이전트란 격리된 클라우드 샌드박스에서 비동기로 도는 ''AI 소프트웨어 엔지니어''다. GitHub 이슈·Linear 티켓·Slack 메시지 같은 일감을 맡기면 수 분~수 시간 혼자 일한 뒤 PR을 돌려준다 — 타이핑을 보조하는 인라인 도구와 정반대로 ''티켓→클라우드 샌드박스→자율 편집→PR→사람 리뷰'' 한 사이클을 돈다. Devin(2024 말)으로 장기 에이전트 역량이 무르익은 뒤 2025년 Codex Cloud·Cursor Background Agents·Jules가 쌓였고, Anthropic의 Claude Code Remote Tasks가 2026-03-20 합류하며 카테고리가 주류가 됐다. 다만 모든 백그라운드 에이전트는 레포·CI 시크릿을 만지려 ''범위가 좁고 회수 가능한 비인간 ID''가 필요해, 기업이 보안 통제로 다루기 시작했다.

    '
  points:
  - '''티켓→클라우드 샌드박스→자율 편집→PR→리뷰'' 비동기 사이클'
  - Devin→Codex Cloud·Cursor BG·Jules→Claude Code Remote Tasks(2026-03-20)
  - 에이전트마다 '범위 좁고 회수 가능한 비인간 ID'가 새 보안 통제 지점
  source: https://securityboulevard.com/2026/06/6-background-ai-agents-for-async-development/
- category: ai
  title: Greptile — 디프가 아니라 '레포 전체'를 인덱싱해 파일·서비스 사이 버그를 잡는 코드리뷰 봇
  summary: 'Greptile은 PR의 디프만 보는 게 아니라 코드베이스 전체를 인덱싱해, 파일·서비스·의존성 ''사이''에 숨은 버그를 찾는 AI 코드리뷰 도구다. 변경이 아키텍처를 타고 어떻게 번지는지를 추적하고, 발견을 심각도로 분류해 신호 대 잡음비를 높이려 한다. 가격은 사용자당 월 $30(오픈소스·시리즈A 이전 스타트업은 무료/할인). 독립 평가에서 ''버그 검출률이 가장 높지만 오탐률도 가장 높다''는 트레이드오프가 거론된다 — 진짜 버그도, 잡음도 더 많이 나온다는 뜻(평가 출처별 편차 큼). 2026년 코드리뷰 시장은 PR 리뷰 댓글의 상당수를 자동 리뷰어가 다는 단계로 성숙했다.

    '
  points:
  - 디프가 아니라 '레포 전체 인덱싱'으로 파일·서비스 간 결함 추적
  - 가격 사용자당 월 $30(OSS·초기 스타트업 무료/할인)
  - '''최고 검출률 ↔ 최고 오탐률'' 트레이드오프(평가 출처별 편차)'
  source: https://www.greptile.com/content-library/best-ai-code-review-tools
- category: ai
  title: 한국 IT 기업 코딩 에이전트 도입 사례 — 토스페이먼츠·당근·채널톡의 공통 원칙
  summary: '2026년 한국 IT 기업들의 코딩 에이전트 도입 사례에서 공통 패턴이 보인다. 토스페이먼츠는 MCP 기반 AI 연동 서버를 만들어 PG 연동을 자동화하되, 아키텍처 설계와 결제 안정성 판단은 엔지니어가 쥐었다. 당근은 전사 AI 전환을 선언하고 해커톤·피처톤으로 지표 요약·에러 분석·매물 요약 같은 반복 업무를 자동화해 실험·배포 주기를 높이되 제품 방향과 핵심 의사결정은 사람 중심으로 뒀다. 채널톡은 Cursor를 전사 도구로 도입해 IDE까지 바꾸고 온보딩·리팩터링·PR 리뷰·UI 구현을 AI 중심으로 재설계했지만 구조 설계·품질 최종 책임은 사람이 진다. 세 사례의 공통 원칙: ''정형·반복 작업은 위임하되, 설계·품질·핵심 판단은 사람이 책임진다.''

    '
  points:
  - '토스페이먼츠: MCP 연동 서버로 PG 연동 자동화(안정성 판단은 사람)'
  - '당근: 전사 전환·해커톤으로 반복 업무 자동화(의사결정은 사람 중심)'
  - '채널톡: Cursor 전사 도입으로 IDE까지 교체(품질 책임은 사람)'
  source: https://www.codetree.ai/blog/2026-%EB%B0%94%EC%9D%B4%EB%B8%8C-%EC%BD%94%EB%94%A9-%ED%88%B4-5%EA%B0%80%EC%A7%80-%EC%B6%94%EC%B2%9C-ai-%EC%BD%94%EB%94%A9-%ED%88%B4%EB%A1%9C-%EB%8B%AC%EB%9D%BC%EC%A7%84-%EA%B0%9C%EB%B0%9C%EC%9E%90/
- category: ai
  title: Claude Code hooks — 에이전트 행동을 '기억' 말고 이벤트로 고정하기
  summary: 'Claude Code hooks는 모델이 규칙을 기억하길 기대하는 대신, 특정 생명주기 이벤트에서 사용자가 정한 명령을 실행하게 하는 자동화 장치다. 공식 문서는 PreToolUse, PostToolUse, UserPromptSubmit, Stop, SessionStart, PreCompact 같은 이벤트를 설정 파일에 등록하고, 이벤트→매처→핸들러 순서로 실행한다고 설명한다. 그래서 파일 수정 뒤 포맷, 위험 명령 차단, 세션 시작 컨텍스트 주입, 압축 전 메모 백업처럼 "매번 해야 하는 일"을 모델 판단 밖으로 빼낼 수 있다. 실전 포인트는 훅을 프롬프트가 아니라 작고 결정적인 제어면으로 보는 것이다.

    '
  points:
  - 생명주기 이벤트에 명령을 걸어 반복 작업을 자동 실행
  - PreToolUse·PostToolUse·Stop·SessionStart·PreCompact 등 지원
  - 규칙 기억에 의존하지 않고 포맷·차단·컨텍스트 주입을 고정
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: Aider — 변경마다 자동 git 커밋해 'diff/undo'를 보장하는 터미널 페어 프로그래머(Apache-2.0·~46.4k★)
  summary: 'Aider는 터미널에서 LLM과 짝 코딩하는 오픈소스 도구다. 공식 태그라인은 "aider is AI pair programming in your terminal". 가장 차별적인 설계는 ''git 일등 시민''이다 — 에이전트가 코드를 고칠 때마다 의미 있는 메시지로 자동 커밋하므로, 마음에 안 들면 그 단위로 diff·undo가 된다(에이전트의 무분별한 수정에 대한 안전망). 또 레포 전체의 ''맵(repo map)''을 만들어 큰 코드베이스에서도 관련 파일을 집어주고, 100개 이상 언어를 지원하며, 클라우드·로컬 LLM을 모두 붙일 수 있다. 그 밖에 자동 린트·테스트 후 문제 자동 수정, 이미지·웹페이지 입력, 음성 코딩, 에디터 코멘트로 IDE 안에서 호출까지 제공한다. 라이선스 Apache-2.0, 주 언어 Python, GitHub ~46.4k★(레포 표시 기준).

    '
  points:
  - 변경마다 자동 git 커밋 → 단위별 diff/undo 안전망(가장 큰 차별점)
  - repo map으로 큰 코드베이스의 관련 파일 자동 선별·100+ 언어
  - 클라우드·로컬 LLM 양쪽 지원 + 자동 린트/테스트 후 수정
  source: https://github.com/Aider-AI/aider
- category: ai
  title: SWE-Skills-Bench — 에이전트 스킬은 만능 부스터가 아니라 '맞춤 지식'이다
  summary: 'SWE-Skills-Bench는 SKILL.md 같은 절차 지식이 실제 소프트웨어 작업에 얼마나 도움 되는지 재는 벤치마크다. 공개 레포의 고정 커밋, 명확한 요구사항, 검증 테스트, 스킬 문서를 짝지어 ''스킬 있음/없음''을 비교한다. 논문 초록의 핵심 결과는 차갑다: 49개 스킬 중 39개는 pass-rate 향상이 0이고 평균 이득은 +1.2%에 그쳤다. 토큰 오버헤드는 경우에 따라 451%까지 늘었고, 버전이 안 맞는 지침은 오히려 성능을 깎았다. 교훈은 스킬을 많이 까는 게 아니라, 현재 레포·버전·작업에 정확히 맞는 좁은 스킬만 쓰는 것이다.

    '
  points:
  - 49개 public SWE skills + 고정 커밋 레포 + 요구사항 + 실행 테스트로 paired 평가
  - 39/49 스킬은 pass-rate 향상 0, 평균 이득 +1.2%; 일부는 버전 불일치로 성능 하락
  - 스킬은 범용 마법이 아니라 도메인·버전·작업 적합성이 맞을 때만 값이 난다
  source: https://github.com/GeniusHTX/SWE-Skills-Bench
- category: ai
  title: Codex /usage — 토큰 활동을 CLI 안에서 바로 보는 새 계기판
  summary: 'OpenAI Codex CLI 0.140.0은 `/usage` 뷰를 추가해 계정 토큰 활동을 일간·주간·누적 단위로 볼 수 있게 했다. 코딩 에이전트를 오래 돌릴 때 가장 먼저 무너지는 것은 코드가 아니라 운영 가시성이다. 사용량을 외부 대시보드나 추측에 맡기면 자동화 루프가 한도에 부딪힌 뒤에야 멈춘다. `/usage`는 터미널 작업 흐름 안에서 비용·한도 신호를 바로 확인하게 해, 긴 세션·서브에이전트·반복 검증을 어디까지 밀어도 되는지 판단하는 작은 제어면이 된다. 같은 릴리스는 `/goal` 대용량 입력 보존, 영구 세션 삭제, Claude Code 설정 가져오기 같은 운영 기능도 함께 넣었다. GitHub 레포는 2026-06-18 조회 기준 91.8k★, 최신 릴리스 0.140.0(2026-06-15)으로 활발히 유지되고 있다.

    '
  points:
  - '0.140.0 신기능: `/usage`로 일간·주간·누적 토큰 활동 확인'
  - 긴 자동화 루프에서 비용·한도 신호를 터미널 안에 고정
  - GitHub 91.8k★·848 릴리스, 최신 0.140.0(2026-06-15) 기준
  source: https://github.com/openai/codex/releases
- category: ai
  title: GitHub Agent Apps — 마켓플레이스 앱처럼 설치하는 코딩 에이전트
  summary: 'GitHub Agent Apps는 AI 에이전트를 GitHub App처럼 설치해 이슈·PR·Agents UI에서 바로 호출하게 하는 기능이다. GitHub의 2026-06-02 changelog는 첫 파트너 앱을 Marketplace에서 설치하고, 관리자가 활성화하면 세 가지 진입점 — 이슈 assignee로 지정, PR 댓글에서 @멘션, Agents UI에서 프롬프트 입력 — 으로 쓸 수 있다고 설명한다. 중요한 변화는 에이전트가 IDE 밖으로 나와 GitHub 워크플로 자체의 ''할당 가능한 작업자''가 된다는 점이다. Amplitude, Bright Security, Endor Labs, LaunchDarkly, Miro, Sonar, PagerDuty, Packfiles, Octopus Deploy가 첫 wave로 공개됐고, GitHub Docs는 사용량이 Copilot cloud agent와 같은 방식으로 AI credits를 소비한다고 못박는다.

    '
  points:
  - '설치 모델: GitHub Marketplace의 GitHub App처럼 설치·관리자 활성화'
  - '진입점: 이슈 assignee, PR @멘션, Agents UI 프롬프트'
  - 첫 wave 9개 파트너, 사용량은 Copilot cloud agent처럼 AI credits 과금
  source: https://github.blog/changelog/2026-06-02-extend-github-with-agent-apps/
- category: ai
  title: GitHub Agentic Workflows — 자연어 마크다운을 Actions YAML로 컴파일하는 에이전트 자동화
  summary: 'GitHub Agentic Workflows는 이슈 분류, CI 실패 분석, 문서 업데이트처럼 추론이 필요한 반복 작업을 GitHub Actions 안의 코딩 에이전트로 자동화하는 public preview다. 핵심은 자동화를 자연어 Markdown 파일로 정의하면 표준 Actions YAML로 컴파일된다는 점이다. 그래서 새 에이전트 플랫폼을 따로 운영하는 대신 기존 runner group, 정책, Actions 승인 흐름을 재사용한다. 보안 장치도 제품의 중심에 있다: 기본 읽기 전용 권한, sandboxed container, Agent Workflow Firewall, safe outputs, threat detection 작업을 거친다. 같은 날 업데이트로 장기 PAT 없이 Actions 기본 GITHUB_TOKEN을 쓸 수 있게 됐고, 조직 과금은 copilot-requests: write 권한과 비용 관리 도구로 통제한다.

    '
  points:
  - 자연어 Markdown 자동화 정의 → 표준 GitHub Actions YAML로 컴파일
  - 기본 read-only, sandbox, firewall, safe outputs, threat detection으로 안전장치 내장
  - PAT 없이 GITHUB_TOKEN 사용 가능, 조직 AI credits 과금·사용량 cap 관리
  source: https://github.blog/changelog/2026-06-11-github-agentic-workflows-is-now-in-public-preview/
- category: ai
  title: Supabase Agent Plugin — MCP 서버와 스킬을 한 번에 까는 백엔드 작업 키트
  summary: 'Supabase Agent Plugin은 AI 코딩 에이전트가 Supabase 프로젝트를 다룰 때 필요한 MCP 서버와 agent skills를 한 번에 설치하게 해주는 공식 플러그인이다. MCP 서버는 테이블 조회, SQL 실행, 마이그레이션 적용, 로그·보안/성능 advisor 조회 같은 도구를 에이전트에 붙이고, 스킬은 Supabase·Postgres 작업 절차와 베스트프랙티스를 컨텍스트로 준다. 핵심은 "DB를 아는 척하는 에이전트"가 아니라 실제 프로젝트에 연결된 도구와 좁은 절차 지식을 함께 주는 것. 공식 배포 repo는 Claude Code, Cursor, Codex, GitHub Copilot, Gemini용 매니페스트와 MCP 어댑터를 나눠 둔다.

    '
  points:
  - 한 번 설치로 Supabase MCP 서버 + agent skills를 함께 제공
  - '도구: 테이블/확장/마이그레이션/SQL/로그/advisor 등 프로젝트 직접 조작'
  - '지원 표면: Claude Code·Cursor·Codex·GitHub Copilot·Gemini 배포 repo'
  source: https://supabase.com/docs/guides/ai-tools/plugins
- category: ai
  title: GitHub Code Quality GA — AI 리뷰도 품질 예산으로 관리한다
  summary: 'GitHub Code Quality는 유지보수성·신뢰성·커버리지 문제를 PR 품질 게이트와 조직 대시보드로 관리하는 GitHub의 코드 품질 제품이다. 2026-07-20부터 public preview를 끝내고 유료 GA로 전환되며, 가격은 활성 커미터당 월 10달러 기본 구독 + AI 기능 사용량 과금이다. 중요한 포인트는 Copilot code review, AI-assisted detection, Copilot Autofix 같은 AI 작업이 별도 사용량으로 잡히고, CodeQL 기반의 결정적 분석은 GitHub Actions minutes를 쓴다는 점. 에이전트 리뷰를 켜는 팀은 이제 "좋아 보이면 켠다"가 아니라 커버리지 게이트, PR 차단 기준, AI 사용량 예산을 함께 설계해야 한다.

    '
  points:
  - '2026-07-20 GA: 활성 커미터당 월 10달러 + AI 기능 사용량 과금'
  - AI 리뷰·Autofix는 사용량 과금, CodeQL 분석은 Actions minutes 사용
  - 10,000+ 엔터프라이즈 preview 사용 신호, Team/Enterprise Cloud 대상
  source: https://github.blog/changelog/2026-06-16-github-code-quality-generally-available-july-20-2026/
- category: ai
  title: ARD(Agentic Resource Discovery) — AI 에이전트가 필요한 도구를 '런타임에 직접 찾는' 개방형 표준(Apache-2.0·MS+Google+HF 공동)
  summary: 'ARD는 AI 에이전트가 MCP 서버·스킬·API를 런타임에 동적으로 발견·검증·연결할 수 있게 하는 개방형 사양이다. Microsoft·Google·GitHub·Hugging Face·Nvidia·Salesforce 등이 공동 개발했고, ai-catalog.json 매니페스트 파일 하나로 조직이 자체 레지스트리를 운영할 수 있다. GitHub Agent Finder가 첫 번째 상용 구현으로 Copilot이 필요한 도구를 자동 검색해 context window에 주입한다. 에이전트 생태계가 "미리 설치" 모델에서 "필요할 때 발견" 모델로 전환되는 인프라 시그널이다.

    '
  points:
  - MS·Google·GitHub·HF·Nvidia 등 11개사 공동 개발, Apache-2.0
  - ai-catalog.json 매니페스트 기반 연합형(federated) 레지스트리
  - 'GitHub Agent Finder: Copilot이 ARD로 도구를 런타임 검색 → context window 절약'
  source: https://commandline.microsoft.com/agentic-resource-discovery-specification-ard/
- category: ai
  title: MCP 2026-07-28 RC — 세션을 죽이고 Stateless로 전환, '가장 큰 프로토콜 개정'(Anthropic)
  summary: 'MCP의 2026-07-28 릴리스 후보는 프로토콜 출시 이후 최대 규모 개정이다. 핵심은 stateless 코어 전환: initialize 핸드셰이크와 Mcp-Session-Id 헤더가 사라지고, 모든 요청이 Mcp-Method·Mcp-Name 헤더를 담아 표준 HTTP 로드밸런서 뒤에서 라운드로빈으로 동작한다. MCP Apps(서버 렌더링 UI)와 Tasks(장기 실행 작업 핸들)가 공식 Extensions 프레임워크로 승격됐고, Roots·Sampling·Logging은 deprecated(12개월 유예). 원격 MCP 서버 운영자는 7월 28일 전까지 세션 의존 코드를 명시적 핸들로 마이그레이션해야 한다.

    '
  points:
  - 'Stateless 코어: Mcp-Session-Id 제거 → 표준 라운드로빈 LB로 운영 가능'
  - 'Extensions 프레임워크: MCP Apps(샌드박스 UI) + Tasks(장기 작업) 공식화'
  - 12개월 deprecation 정책 도입 — Roots·Sampling·Logging 폐지 예고
  source: https://blog.modelcontextprotocol.io/posts/2026-07-28-release-candidate/
- category: ai
  title: Open Code Review(Alibaba) — 수백만 건 실전 검증 AI 코드리뷰 CLI(Apache-2.0·~8k★)
  summary: 'Alibaba 내부에서 2년간 수만 명 개발자, 수백만 건 결함 탐지에 사용된 AI 코드리뷰 도구가 오픈소스로 공개됐다. 결정론적 파이프라인 + LLM 에이전트 하이브리드 아키텍처로, 에이전트가 파일 전체 읽기·코드베이스 검색·다른 변경 파일 교차 참조를 수행해 line 단위 정밀 코멘트를 생성한다. NPE·스레드 안전성·XSS·SQL 인젝션 등 내장 규칙셋을 포함하고, OpenAI·Anthropic API 호환. Claude Code의 /code-review보다 벤치마크 점수가 높다는 자체 평가(200 PR·50개 OSS 저장소)도 공개했다.

    '
  points:
  - 'Alibaba 내부 2년: 수만 명 개발자·수백만 건 결함 탐지, 결정론적 규칙(NPE·XSS·SQLi)+LLM 에이전트 하이브리드'
  - Git diff 기반 라인 레벨 코멘트, 파일 전체·코드베이스 검색·교차 참조 도구 사용
  - 200 PR·50 OSS repo 자체 벤치에서 Claude Code /code-review 상회(자체 평가)
  source: https://github.com/alibaba/open-code-review
- category: ai
  title: ProjDevBench — 버그 패치가 아닌 '프로젝트를 처음부터 통째로 만들기'를 평가하는 코딩 에이전트 벤치마크
  summary: '기존 SWE-bench는 이미 있는 코드베이스에서 버그를 고치는 패치 생성 능력만 측정한다. ProjDevBench는 이와 달리 ''프로젝트 스펙을 받고 전체 레포지토리를 처음부터 구축''하는 end-to-end 개발 능력을 평가한다. Online Judge 실행 검증과 LLM 기반 코드리뷰를 결합한 이중 평가, 틀린 유형별 진단(Wrong Answer·TLE·MLE· Runtime Error) 피드백이 특징이다. Claude Code·Cursor·Codex·Augment 등 6종 에이전트를 평가할 수 있고, 현재 최고 점수는 Codex+GPT-5의 77.85%다.

    '
  points:
  - 'SWE-bench와 반대: ''패치''가 아닌 ''처음부터 전체 레포 구축'' 평가'
  - '이중 평가: Online Judge 실행 검증 + LLM 코드리뷰'
  - 현재 1위 Codex+GPT-5 77.85%, Cursor+Gemini 75.32%
  source: https://github.com/zsworld6/projdevbench
- category: ai
  title: Roborev — AI 코딩 에이전트가 짠 코드를 '쓰는 즉시 백그라운드에서 리뷰'하는 도구(MIT·~1.4k★)
  summary: 'Roborev는 코딩 에이전트(Claude Code·Codex·Cursor 등)가 코드를 생성하는 동안 백그라운드에서 매 커밋을 리뷰하고, 이슈를 초 단위로 표면화하는 도구다. 핵심은 "컨텍스트가 신선할 때 리뷰"—에이전트가 방금 짠 코드를 에이전트 루프 안에서 바로 검토해 문제가 쌓이기 전에 잡는다. vim 스타일 TUI로 리뷰 큐를 탐색하고, roborev fix로 자동 수정, roborev refine으로 수정→재리뷰 반복 루프도 지원한다. Codex·Claude Code· Gemini·Copilot·Cursor 등 10개+ 에이전트와 호환된다.

    '
  points:
  - '백그라운드 상시 리뷰: 에이전트가 코드 생성하는 동안 커밋 단위로 리뷰'
  - 'refine 루프: 자동 수정 → 재리뷰 → 반복으로 품질 수렴'
  - '10개+ 에이전트 호환: Codex·Claude Code·Gemini·Copilot·Cursor 등'
  source: https://github.com/kenn-io/roborev
- category: ai
  title: nit — 프로젝트 스택을 자동 감지해 unit~E2E 테스트를 생성하는 로컬 AI 품질 에이전트(MIT·~3.5k★)
  summary: 'nit은 프로젝트에 떨어뜨리면 언어·프레임워크·테스트 인프라를 자동 감지하고, 커버리지 갭을 찾아 Vitest· pytest·Jest·Playwright 등 네이티브 프레임워크 테스트를 생성하는 로컬 AI 에이전트다. 생성된 테스트를 실행해 실패하면 최대 3회 자동 수정하고, 기존 테스트 패턴을 학습해 프로젝트 스타일에 맞춘다. 모노레포(Turborepo·Nx·Cargo 등)도 지원하며, Python·TS·Go·Rust·Java·C++ 등 주요 언어를 커버한다. SaaS 의존 없이 로컬에서 돌아가는 점이 차별점이다.

    '
  points:
  - '스택 자동 감지: 언어·프레임워크·테스트 러너를 config 없이 탐지'
  - '자가 반복: 생성 → 실행 → 실패 시 최대 3회 자동 수정'
  - '로컬 퍼스트: SaaS 의존 없이 로컬 실행, 모노레포 지원'
  source: https://github.com/getnit-dev/nit
- category: ai
  title: Augment Code — 40만+ 파일 모노레포를 통째로 이해하는 엔터프라이즈 코딩 에이전트(ISO 42001 인증)
  summary: 'Augment Code는 ''에이전트 자율 실행''보다 ''코드베이스 깊은 이해''에 베팅한 코딩 에이전트다. 40만+ 파일 규모의 레거시 모노레포를 인덱싱해 정확한 컨텍스트를 제공하는 게 핵심이고, ISO/IEC 42001 인증을 받아 규제 산업 엔터프라이즈를 타깃한다. Windsurf가 자율 실행 속도에 강하다면, Augment는 복잡한 레거시 코드베이스에서 AI 정확도가 강점. 규모와 규제가 병목인 조직에 적합하다.

    '
  points:
  - 40만+ 파일 모노레포 인덱싱 — 레거시 코드베이스 정확도에 특화
  - ISO/IEC 42001 인증 — 규제 산업 엔터프라이즈 대상
  - 자율 실행보다 '이해 기반 어시스트' — Windsurf와 반대 전략
  source: https://www.lowcode.agency/blog/windsurf-vs-augment-code
- category: ai
  title: Unsloth — 소비자 GPU 1장으로 LLM 파인튜닝 2~5배 가속, MoE 모델 12배 빠른 학습(MIT·~54k★)
  summary: 'Unsloth은 LLM 파인튜닝 속도와 VRAM 효율을 극한까지 끌어올린 오픈소스 도구다. 커스텀 Triton 커널로 역전파를 수동 재작성해 LoRA/QLoRA 학습을 2~5배 가속하고 VRAM 35% 절감. 2026년 2월 MoE 학습 지원을 추가해 DeepSeek 스타일 모델에서 12배 가속을 달성했다. PyTorch 공식 생태계에도 합류(2026-05). Axolotl YAML에서 unsloth: true 한 줄로 속도 이점을 그대로 가져올 수 있다.

    '
  points:
  - '커스텀 Triton 커널: LoRA/QLoRA 2~5배 가속 + VRAM 35% 절감'
  - '2026-02 MoE 학습: DeepSeek 스타일 12배 가속, 50k★ 돌파'
  - 'Axolotl 백엔드 호환: YAML에 unsloth: true 한 줄이면 속도 이점 적용'
  source: https://unsloth.ai/
- category: ai
  title: RAGFlow — 8만★ 돌파, '딥 문서 이해' 특화 RAG 엔진(Apache-2.0·InfiniFlow)
  summary: 'RAGFlow는 복잡한 레이아웃(표·이미지·수기 노트)의 문서를 정밀 파싱하는 데 특화된 오픈소스 RAG 엔진이다. 커버가능 파이프라인과 에이전트 템플릿을 내장하고, 2026년 6월 기준 Feishu·Discord·Telegram·Line 등 다채널 챗봇 연동을 지원한다. 에이전트 워크플로우 + MCP + Python/JS 코드 실행기를 갖춰 단순 검색을 넘어선 자율 행동이 가능하다. LangChain이 오케스트레이션, LlamaIndex가 인덱싱이라면, RAGFlow는 ''문서 파싱 품질''이 핵심.

    '
  points:
  - '82k★: 가장 빠르게 성장하는 RAG 엔진, Apache-2.0'
  - '딥 문서 이해: 표·이미지·수기 노트 포함 PDF/DOCX 정밀 파싱'
  - '에이전트 + MCP + 코드 실행: 검색 넘어 자율 행동 가능'
  source: https://github.com/infiniflow/ragflow
- category: ai
  title: cc-sdd(Spec-Driven Development) — Kiro의 '스펙→설계→태스크' 워크플로우를 아무 코딩 에이전트에서 쓰기(오픈소스)
  summary: 'cc-sdd는 AWS Kiro IDE가 도입한 spec-driven development 워크플로우(requirements.md → design.md → tasks.md)를 Claude Code·Copilot·Gemini CLI·Windsurf 등 어떤 코딩 에이전트에서든 쓸 수 있게 만든 오픈소스 CLI 도구다. npx cc-sdd@latest --claude "프롬프트" 한 줄이면 3종 스펙 문서가 생성된다. AWS Labs의 aidlc-workflows도 유사하게 ADLC 가드레일을 제공한다. 핵심은 "프롬프트를 바로 코드로 바꾸지 말고, 요구사항·설계·태스크로 구조화한 뒤 코드를 생성하라"는 원칙.

    '
  points:
  - 'npx cc-sdd@latest: Claude Code·Copilot·Gemini CLI 모두 지원'
  - '출력: requirements.md + design.md + tasks.md 3종 스펙 문서'
  - 'Kiro 워크플로우 → 범용화: 스펙 먼저, 코드 나중'
  source: https://skarlekar.medium.com/aws-kiro-vs-claude-code-vs-github-copilot-42a502119438
- category: ai
  title: Axolotl — YAML 한 장으로 멀티GPU LLM 파인튜닝 파이프라인을 관리하는 엔터프라이즈 오케스트레이터(Apache-2.0·~11k★)
  summary: 'Axolotl은 LLM 파인튜닝의 ''엔터프라이즈 오케스트레이터''다. YAML 설정 파일 하나로 데이터 전처리·멀티GPU 분산 학습(DeepSpeed·FSDP)·체크포인팅·평가까지 전체 학습 파이프라인을 재현 가능하게 관리한다. SFT·DPO·PPO· LoRA·QLoRA·풀 파인튜닝을 모두 지원하고, YAML에 unsloth: true 한 줄 추가하면 Unsloth 가속을 백엔드로 결합할 수 있다. Unsloth이 ''속도 최적화 엔진''이라면 Axolotl은 ''파이프라인 관리 프레임워크''. 복잡한 멀티노드 학습이나 재현성이 중요한 프로덕션 팀에 적합하다.

    '
  points:
  - 'YAML 기반: 학습 파이프라인 전체를 설정 파일 하나로 재현 가능'
  - '멀티GPU/노드: DeepSpeed·FSDP 네이티브, 대규모 분산 학습 지원'
  - 'Unsloth 백엔드 호환: unsloth: true로 속도 이점 결합'
  source: https://github.com/axolotl-ai-cloud/axolotl
- category: ai
  title: Qwen3-Coder-Next — 80B MoE에서 3B만 활성화, 로컬 GPU로 프론티어급 코딩 에이전트(오픈웨이트·256K ctx)
  summary: 'Qwen3-Coder-Next는 Alibaba Qwen 팀이 만든 코딩 에이전트 전용 오픈웨이트 모델이다. 80B 전체 파라미터 중 3B만 활성화하는 MoE 구조로 추론 비용이 극도로 낮고, 256K 네이티브 컨텍스트(1M 확장 가능). SWE-Bench· Terminal-Bench에서 프론티어 모델과 경쟁하는 성능을 보이며, Ollama q4_K_M 패키지 52GB로 로컬 실행 가능. 에이전트 학습 데이터로 대규모 검증 가능 코딩 태스크를 합성해 환경 피드백 기반 강화학습을 적용했다.

    '
  points:
  - '80B MoE / 3B 활성: 로컬 GPU에서 프론티어급 코딩 에이전트 실행'
  - 256K 네이티브 컨텍스트, 1M 확장 가능
  - '에이전트 훈련: 대규모 코딩 태스크 합성 + 환경 피드백 강화학습'
  source: https://github.com/qwenlm/qwen3-coder
- category: ai
  title: DSPy — '프롬프트를 짜지 말고 프로그래밍하라', Stanford NLP의 LLM 파이프라인 최적화 프레임워크(MIT·~35k★)
  summary: 'DSPy는 Stanford NLP에서 만든 Python 프레임워크로, 수동 프롬프트 엔지니어링을 모듈화된 프로그램으로 대체한다. 태스크를 Signature(입출력 스키마)로 정의하고, Module(Predict·ReAct·ChainOfThought)로 조합한 뒤, Optimizer가 메트릭 기준으로 프롬프트를 자동 튜닝한다. Assertion 기능으로 출력 제약을 자동 백트래킹·재시도하고, TypedPredictor로 Pydantic 기반 구조화 출력을 강제할 수 있다. 프롬프트 시행착오를 측정 가능한 파이프라인으로 전환하는 핵심 도구.

    '
  points:
  - 'Signature → Module → Optimizer: 프롬프트를 자동 튜닝하는 3단계'
  - 'Assertion: 출력 제약 위반 시 자동 백트래킹 + 재시도'
  - ReActV2, TypedPredictor 등 에이전트·구조화 출력 프리미티브 내장
  source: https://github.com/stanfordnlp/dspy
- category: ai
  title: LiteLLM — 100+ LLM 프로바이더를 OpenAI 호환 API 하나로 통합하는 셀프호스팅 게이트웨이(MIT·~40k★)
  summary: 'LiteLLM은 OpenAI·Anthropic·Bedrock·Azure·Cohere·Ollama 등 100+ 프로바이더를 단일 OpenAI 호환 엔드포인트로 묶는 MIT 오픈소스 프록시다. 가상 키·팀별 예산·비용 추적·자동 폴백을 기본 제공하고, Docker 한 줄이면 셀프호스팅 가능. MCP Gateway도 내장. Python 기반이라 500+ RPS 이상에서는 Go 기반 Bifrost 등이 유리하지만, 대다수 팀에는 가장 범용적인 LLM 게이트웨이. Portkey(가드레일 특화)와 상호보완.

    '
  points:
  - 'MIT 오픈소스: 100+ 프로바이더, OpenAI 호환 API, 셀프호스팅'
  - 가상 키·팀 예산·비용 추적·자동 폴백 기본 내장
  - MCP Gateway 내장, Docker 한 줄 배포
  source: https://github.com/BerriAI/litellm
- category: ai
  title: E2B — AI 에이전트가 생성한 코드를 Firecracker microVM에서 안전하게 실행하는 클라우드 샌드박스(Apache-2.0·~13k★)
  summary: 'E2B는 AI 에이전트가 생성한 코드를 Firecracker microVM(AWS Lambda와 동일 기술)에서 격리 실행하는 오픈소스 인프라다. 세션당 전용 커널을 부여해 하드웨어 수준 격리를 보장하고, ~150ms 콜드스타트로 빠르게 시작. Fortune 100 기업 88%가 가입. Python/TypeScript SDK 제공, Terraform으로 셀프호스팅 가능. Daytona(72k★)가 Docker 기반 영속 워크스페이스라면, E2B는 ephemeral microVM 기반 보안 실행에 특화.

    '
  points:
  - 'Firecracker microVM: 세션당 전용 커널, 하드웨어 수준 격리'
  - ~150ms 콜드스타트, Python/TypeScript SDK
  - '셀프호스팅 가능: Terraform 기반 인프라 배포'
  source: https://github.com/e2b-dev/E2B
