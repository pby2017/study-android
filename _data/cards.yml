  - '포화: MMLU 93%+, GSM8K 99%+, 프론티어 구분 불가'
  - '유의미: SWE-bench·GPQA·HLE·LiveCodeBench'
  - '포트폴리오: 학술+에이전트+선호도 삼각 검증'
  source: https://tokenmix.ai/blog/llm-leaderboard-2026
- category: ai
  title: Structured Outputs — LLM에서 스키마 준수 JSON을 보장하는 프로덕션 패턴, strict:true로 제약 디코딩
  summary: 'Structured Outputs는 LLM이 JSON 스키마를 토큰 생성 레벨에서 강제 준수하게 하는 기능이다. OpenAI response_format(type:json_schema, strict:true)로 정확한 스키마 출력 보장. Function Calling(tool use)은 모델이 외부 도구 호출을 결정할 때 사용. JSON 모드는 ''아무 JSON'', Structured Outputs는 ''정확한 스키마 JSON'', Function Calling은 ''액션 결정''. 프로덕션 패턴: Function Calling(라우팅) + Structured Outputs(포맷 보장). Instructor 라이브러리로 Pydantic 검증+자동 재시도.

    '
  points:
  - 'strict:true: 토큰 레벨 스키마 강제(제약 디코딩)'
  - '3가지 구분: JSON 모드 vs Structured Outputs vs Function Calling'
  - '프로덕션: FC(라우팅) + SO(포맷) + Instructor(검증)'
  source: https://wolf-tech.io/blog/structured-llm-outputs-in-production-json-mode-tool-use-and-validation-patterns
- category: ai
  title: DeepSeek R1 — 오픈웨이트 추론 모델, 671B MoE에서 37B만 활성·투명한 CoT·o3 대비 73% 저렴(MIT)
  summary: 'DeepSeek R1은 오픈웨이트 추론 모델로 GRPO 강화학습으로 학습되었다. 671B MoE 아키텍처에서 토큰당 37B만 활성화하여 비용 효율적. 핵심 차별점: 추론 과정(Chain-of-Thought)이 완전 투명하게 스트리밍되어 디버깅·감사·컴플라이언스에 유리. o3 대비 토큰당 73% 저렴($0.55/$2.19 vs $2/$8). 대부분의 실무 추론 태스크에서 o3의 85~97% 성능. 의료·법률·금융 분야에서 감사 가능성 때문에 R1 선호.

    '
  points:
  - 'MoE: 671B 중 37B만 활성, 73% 저렴'
  - '투명 CoT: 추론 과정 완전 공개, 감사 가능'
  - '오픈웨이트(MIT): 셀프호스팅, 커스터마이징 가능'
  source: https://tokenmix.ai/blog/deepseek-r1-vs-o3
- category: ai
  title: Semblance — 완전 로컬 주권형 개인 AI, 네트워크 접근 아키텍처적 불가능·이메일/캘린더/건강 데이터 통합
  summary: 'Semblance는 완전 로컬에서 실행되는 주권형 개인 AI 어시스턴트다. AI 코어 프로세스가 아키텍처적으로 네트워크 접근 불가능(HTTP 라이브러리 없음, OS 샌드박스 격리). 이메일·파일·캘린더·메시지·건강· 금융 데이터를 로컬 지식 그래프에 수집하여 추론. 외부 통신은 단일 Gateway 프로세스를 통해 사용자 허용 서비스만 가능. LanceDB(벡터)+SQLite(구조화) 로컬 저장. Ollama/llama.cpp/MLX 선택. React Native 모바일은 로컬 추론 피어 디바이스로 동작.

    '
  points:
  - '제로 네트워크: AI 코어에 HTTP 라이브러리 없음'
  - '로컬 지식 그래프: 이메일·캘린더·건강·금융 통합'
  - 'Gateway 격리: 사용자 허용 서비스만 외부 통신'
  source: https://github.com/skygkruger/semblance-core
- category: ai
  title: CodeGraph — 코드베이스를 시맨틱 그래프로 변환, 37언어·45 MCP 도구·호출 체인·아키텍처 문서 자동 생성
  summary: 'CodeGraph는 코드베이스를 시맨틱 그래프로 구축하고 AI 에이전트에게 구조화된 코드 이해를 제공하는 도구다. tree-sitter로 37개 언어 파싱. symbol_search(BM25+시맨틱 하이브리드), get_callers/callees (호출 체인), get_dependency_graph(의존성), blast_radius(영향 범위 분석) 등 45개 MCP 도구. verify_design(문서↔코드 교차 검증), generate_architecture_doc(ARCHITECTURE.md 자동 생성). 파일 grep 대신 구조화된 심볼 조회로 토큰 최대 5,700x 절감(GraphMind 유사).

    '
  points:
  - '37언어·45 MCP 도구: 심볼 검색·호출 체인·의존성'
  - '토큰 절감: grep 대비 최대 5,700x 적은 컨텍스트'
  - '아키텍처 자동 생성: 코드 그래프 기반 ARCHITECTURE.md'
  source: https://github.com/codegraph-ai/CodeGraph
- category: ai
  title: Auto-Use — 접근성 트리+비전 하이브리드로 OS 전체를 AI 에이전트가 제어, macOS/Windows 통합(MIT)
  summary: 'Auto-Use는 AI가 데스크톱 OS 전체를 제어하는 Computer Use 에이전트다. 3단계 하이브리드: ①접근성 트리(AXUIElement) 추출 → ②마젠타 바운딩 박스 오버레이 스크린샷 생성 → ③비전 모델(Claude/GPT-4o/ Gemini)에 번호 인덱스+엘리먼트 트리 전송. 순수 스크린샷(비주얼봇) 대비 안정적이고 정확한 요소 타게팅. 브라우저 자동화+시스템 제어+코딩 태스크를 단일 에이전트로 통합. macOS+Windows 빌드 통합. Python app.py(데스크톱 UI) 또는 main.py(터미널) 실행.

    '
  points:
  - '하이브리드: 접근성 트리 + 비전, 순수 스크린샷 대비 정확'
  - 'OS 전체 제어: 브라우저+시스템+코딩 단일 에이전트'
  - '번호 인덱스: 오버레이 번호로 요소 타게팅, 좌표 불필요'
  source: https://github.com/auto-use/auto-use
- category: ai
  title: 'GPT Researcher: 웹/로컬을 깊게 조사해 인용 달린 리포트를 자동 생성'
  summary: '"the first open deep research agent" — planner가 연구 질문을 만들고 execution 에이전트들이 정보를 수집, publisher가 종합 리포트로 묶는다. 20+ 소스를 모아 2,000단어 이상 리포트 생성. Apache-2.0.

