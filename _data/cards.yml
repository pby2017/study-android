- category: ai
  level: 중급
  title: promptfoo — 테스트 사례로 프롬프트·모델 변경을 평가하는 LLM eval 도구
  summary: 'promptfoo는 LLM 앱의 프롬프트·모델·RAG 결과를 반복 평가하고 레드팀 테스트를 실행하는 오픈소스 CLI·라이브러리다. YAML 설정에 입력 사례, 프롬프트, provider, assertion을 선언하면 조합별 결과를 표로 비교하고 CLI·코드·CI에서 다시 실행할 수 있다. 점수는 테스트 사례와 assertion이 검사한 범위에만 의미가 있으므로, 대표 사례를 늘리고 중요한 결과는 직접 검토해야 한다. 기본 eval runner는 로컬에서 실행되지만 모델 요청은 설정한 provider로 전송된다. 레드팀 테스트 생성·채점은 설정에 따라 Promptfoo 호스팅 서비스로 나갈 수 있어 데이터 경로를 별도로 확인한다. GitHub 저장소는 MIT 라이선스이며 약 27.5k★를 표시한다(2026-11-22 확인). Promptfoo는 현재 OpenAI에 합류했지만 오픈소스 프로젝트를 계속 운영한다고 안내한다.'
  points:
  - '입력 사례 × 프롬프트 × provider를 함께 실행해 변경 전후 결과를 비교'
  - 'assertion·metric은 명시한 조건만 검사 — 통과가 전체 품질을 보증하지 않음'
  - '대상 eval은 로컬 runner에서 실행; provider 호출 및 일부 레드팀 생성·채점은 외부 전송 가능'
  source: https://www.promptfoo.dev/docs/intro/
  sources:
