      @mention하거나, Agents UI에서 에이전트를 선택해 프롬프트를 줄 수 있다. 실무 포인트는 "모든 일을
      하나의 범용 코딩 에이전트에 맡기기"보다 보안, 관측, 배포, 제품 분석처럼 도메인 지식이 강한 일을
      전문 에이전트 앱에 라우팅하는 운영 모델이 생기고 있다는 점이다.
    points:
