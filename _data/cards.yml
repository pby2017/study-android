  title: BGE-M3 — 100+ 언어·밀집+희소+멀티벡터를 하나의 모델로, RAG 임베딩의 사실상 표준(MIT·BAAI)
  summary: 'BGE-M3(BAAI)는 단일 모델로 밀집(dense)·희소(sparse)·멀티벡터(ColBERT) 3가지 검색 방식을 모두 지원하는 임베딩 모델이다. 100+ 언어, 8192 토큰 컨텍스트. 2026년 기준 ''범용 RAG 임베딩을 하나만 고르라면 BGE-M3''가 업계 컨센서스. 568M 파라미터로 GPU 없이도 실행 가능. Qwen3-Embedding-8B(MTEB 70.6)가 정확도 최강이라면, BGE-M3는 다용도·다국어·하이브리드 검색의 최적점.

