  title: GritQL — 백틱 패턴 하나로 10M+ LOC 코드베이스를 검색·치환하는 선언적 마이그레이션 언어
  summary: Grit(GritQL)은 코드를 텍스트가 아니라 구조로 매칭하는 선언적 query language다. `grit apply '`console.log($msg)` => `winston.log($msg)`'`처럼 백틱에 코드 스니펫을 쓰고 $msg metavariable로 임의 노드를 잡는다. where 절로 test/it 블록 내부는 제외 같은 side condition을 붙이고, 200+ standard library pattern을 재사용한다. Rust 엔진으로 10M+ LOC 레포에서도 동작하며 JS/TS·Python·Java·Go·Rust·Terraform·Solidity·YAML 등 12+ 언어를 지원한다(MIT·~4.5k★). ast-grep(sg CLI·agent-skill) ·Codemod Platform(AI workflow) ·Semgrep(보안 taint)와 역할 분리 — GritQL=declarative pattern migration at repo scale.
  points:
  - 백틱 패턴 + $metavariable + where — regex보다 syntax-safe
  - 200+ stdlib pattern — API upgrade·dependency migration 재사용
