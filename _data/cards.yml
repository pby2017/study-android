  - category: ai
    title: "LiteRT QNN Accelerator — Android 온디바이스 GenAI를 NPU 경로로 보내기"
    summary: >
      Google은 Qualcomm NPU용 LiteRT QNN Accelerator를 공개하며 Android 온디바이스 AI 배포의 핵심 병목을
      "모델 호출"이 아니라 하드웨어 경로 선택으로 설명했다. LiteRT는 SoC별 SDK와 컴파일러 차이를 감추고,
      AOT 또는 on-device compilation으로 `.tflite` 모델을 여러 Qualcomm SoC에 배포하게 한다. Google 측
      벤치마크는 72개 모델에서 NPU가 CPU 대비 최대 100배, GPU 대비 최대 10배 빠른 결과를 보였고, FastVLM
      데모는 Snapdragon 8 Elite Gen 5 NPU에서 0.12초 TTFT와 초당 100개 이상 decode token을 기록했다.
      Android AI 앱에서는 CPU/GPU fallback까지 포함해 NPU를 선택 가능한 실행 경로로 설계해야 한다.
    points:
      - "LiteRT가 Qualcomm SoC별 NPU 컴파일·런타임 차이를 통합 API로 감춤"
      - "AOT 또는 on-device compilation 후 Google Play AI Pack으로 배포 가능"
      - "NPU 우선 실행과 CPU/GPU fallback을 함께 설계해야 실사용성이 올라감"
    source: "https://developers.googleblog.com/unlocking-peak-performance-on-qualcomm-npu-with-litert/"

  - category: ai
    title: "Agents SDK Sandbox — 에이전트 실행 환경을 코드보다 먼저 설계하기"
    summary: >
      OpenAI는 2026년 4월 Agents SDK에 native sandbox execution을 추가했다고 설명했다. 핵심은 모델에게
      파일·명령·패치 도구를 그냥 주는 것이 아니라, controlled workspace와 Manifest로 입력 디렉터리,
      출력 위치, 외부 저장소 마운트를 명시하는 것이다. Blaxel, Cloudflare, Daytona, E2B, Modal, Runloop,
      Vercel 같은 샌드박스 제공자를 붙일 수 있고, agent state를 외부화하면 컨테이너가 만료돼도 snapshot과
      rehydration으로 재개할 수 있다. 실무 포인트는 "에이전트가 코드를 실행한다"가 아니라, credential이
      있는 harness와 모델 생성 코드가 도는 compute를 분리해 prompt injection·exfiltration 피해를 줄이는 것이다.
    points:
      - "Manifest로 입력·출력·마운트 구조를 선언해 작업공간을 예측 가능하게 만듦"
      - "built-in sandbox provider와 bring-your-own sandbox를 모두 지원"
      - "harness와 compute를 분리해 credential 노출과 컨테이너 장애 리스크를 낮춤"
    source: "https://openai.com/index/the-next-evolution-of-the-agents-sdk/"

