  title: Cursor Tab — 272K 컨텍스트+온라인 RL로 에디터 행동을 예측하는 AI 자동완성(일 4억 요청)
  summary: 'Cursor Tab은 단순 코드 삽입이 아닌 ''다음 편집 행동''을 예측하는 AI 자동완성이다. 272K 토큰 컨텍스트 윈도우로 현재 파일·열린 탭·최근 편집·프로젝트 구조·린터 에러를 종합. 키 입력/커서 이동마다 Tab 모델이 실행되며 일 4억+ 요청 처리. 멀티라인 diff, 파일 간 점프, import 자동 추가 지원. 온라인 RL로 모델을 매일 수차례 업데이트: 사용자 수락/거절 데이터로 학습 → 제안 21% 감소, 수락률 28% 향상. 높은 예측 수락률의 제안만 표시해 노이즈 최소화.

