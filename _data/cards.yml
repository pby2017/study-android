  - category: ai
    title: "Deep Agents(LangChain) — 'Claude Code에서 영감받아' 만든 범용 에이전트 하네스(MIT)"
    summary: >
      그냥 LLM에 도구만 물려 루프 돌리면(ReAct) 멀티스텝 장기 작업에서 금방 헤맨다.
