  interview: '멀티하네스 플러그인을 설치할 때 README 숫자만 보지 말고 도구별 기능표를 확인해야 하는 이유는 무엇인가요?'
  answer: '각 도구가 지원하는 에이전트·명령·권한·모델 표현이 다르므로 어댑터가 일부 기능을 바꾸거나 생략할 수 있다. 예를 들어 Codex의 네이티브 마켓플레이스는 스킬 중심이고, 에이전트 등 생성 파일은 별도 경로를 쓴다. 실제 설치 경로와 런타임 동작을 검증해야 한다.'
- category: ai
  title: 공식 MCP 레지스트리 — 서버 코드가 아닌 발견용 메타데이터 허브
  level: "중급"
  summary: '공식 MCP Registry는 MCP 서버를 실행하거나 보안 인증하는 서비스가 아니라, 공개 서버의 `server.json` 메타데이터를 모아 클라이언트와 하위 레지스트리가 검색하도록 돕는 메타레지스트리다. API 예: `curl "https://registry.modelcontextprotocol.io/v0/servers?limit=10"`. 클라이언트 마켓플레이스와 조직별 사설 하위 레지스트리는 이 데이터를 가져와 각자의 기준으로 큐레이션할 수 있다. 현재 API는 v0.1 동결 상태라고 안내되지만, 프로젝트는 여전히 프리뷰로 표시하며 데이터 지속성 보장이나 GA를 약속하지 않는다. 등록 정보는 서버 제작자가 제공하는 것이므로 목록에 있다는 사실만으로 안전성이 검증된 것은 아니다. 도구를 연결하기 전 운영자·패키지·권한·네트워크 동작을 별도로 검토한다.'
  points:
  - '역할: MCP 서버 메타데이터의 공개 업스트림. npm·PyPI·컨테이너 저장소처럼 서버 코드나 바이너리를 호스팅하지 않는다.'
  - '상태 읽기: API v0.1 동결 안내와 별개로 서비스 문서는 프리뷰·데이터 지속성 미보장을 명시한다. 구현체 릴리스 번호를 API 안정성으로 오해하지 않는다.'
  - '신뢰 경계: 공식 레지스트리는 발견과 기본 메타데이터에 초점을 둔다. 등록 여부는 보안 심사 통과를 의미하지 않으므로 서버 출처·권한·데이터 흐름을 확인한다.'
  source: https://blog.modelcontextprotocol.io/posts/2025-09-08-mcp-registry-preview/
  sources:
