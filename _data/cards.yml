- category: ai
  title: Copilot CLI steering — 긴 에이전트 작업을 끊지 않고 방향 전환
  summary: 'GitHub Copilot CLI는 오래 걸리는 에이전트 작업 중에도 사용자가 새 지시를 넣어 흐름을 조정하는 steering/queueing 표면을 키우고 있다. 2026-06-22 JetBrains/Copilot 업데이트는 실행 중 Send 버튼에 Add to Queue, Steer with Message, Stop and Send 선택지를 추가했다고 설명한다. GitHub Docs도 Copilot이 생각하는 동안 입력한 프롬프트를 현재 작업 맥락의 steering으로 처리하고, 명령 참조에서 Ctrl+Enter 또는 Ctrl+Q로 바쁜 에이전트에게 보낼 메시지를 큐에 넣을 수 있다고 안내한다. 교훈은 긴 에이전트 세션을 "시작 후 방치"로 보지 말고, 중간 개입·후속 지시·즉시 중단을 별도 조작으로 설계해야 한다는 점이다.

    '
  points:
  - 'Add to Queue: 현재 응답 뒤 처리할 후속 지시를 쌓는다'
  - 'Steer with Message: 실행 중인 작업이 빗나갈 때 다음 도구 실행 뒤 방향을 바꾼다'
  - 'Stop and Send: 현재 턴을 끊고 새 지시를 즉시 보낸다'
  source: https://github.blog/changelog/2026-06-22-new-features-and-claude-as-agent-provider-preview-in-jetbrains-ides/
