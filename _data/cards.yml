  title: Android Studio Agent Skills — 필요한 Android 전문 지침만 작업 중 불러오기
  summary: 'Agent Skill은 전문 절차를 `SKILL.md`와 관련 자료로 패키징하고, 요청과 설명이 맞을 때 에이전트가 지침을 추가로 읽게 하는 방식이다. 따라서 모든 Android 규칙을 매번 기본 프롬프트에 넣지 않고, Compose 마이그레이션이나 AGP 업그레이드처럼 특정 작업에 필요한 지식만 불러올 수 있다. Android Studio Rabbit 2 stable에는 skill 관리자와 Android·Firebase skill이 포함되며, 관련 요청에서 자동 선택하거나 `@`로 직접 호출할 수 있다. Android CLI는 skill 설치·갱신 경로를 제공해 여러 에이전트에서 재사용할 수 있다.'
  points:
  - 'skill은 상시 지시문과 구분되는 on-demand 전문 지식 — 관련 요청에서 전체 절차를 로드'
  - '`SKILL.md`에 이름·설명·절차를 두고 scripts·references·assets를 함께 패키징'
  - 'Rabbit 2 stable skill manager에서 관리; 자동 선택 또는 `@skill-name` 호출, Android CLI로 에이전트 간 설치'
  source: https://developer.android.com/studio/gemini/skills
  interview: "Android Studio Agent Skill은 반복 작업을 어떤 방식으로 재사용하나요?"
  answer: "반복 절차를 이름과 설명이 있는 `SKILL.md` 및 필요한 자료로 패키징한다. 에이전트는 요청이 설명에 맞으면 전체 내용을 필요할 때 불러오고, 사용자는 `@skill-name`으로 직접 호출할 수 있다. 이 방식은 모든 전문 절차를 기본 컨텍스트에 항상 넣는 것보다 지침을 작업별로 분리해 재사용하게 한다."
