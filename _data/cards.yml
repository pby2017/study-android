  title: PowerLens — LLM 에이전트로 Android 전력 관리를 자동화, 38.8% 에너지 절감·0.5% 배터리 소모(학술)
  summary: 'PowerLens는 LLM 에이전트가 UI 시맨틱과 사용자 활동을 인식해 18개 디바이스 파라미터에 걸쳐 개인화된 전력 정책을 생성하는 Android 시스템이다. PDL 기반 제약 프레임워크가 모든 액션을 실행 전 검증하고, 2계층 메모리(STM+LPM)가 3~5일 내에 사용자 선호도를 학습. 주식 Android 대비 38.8% 에너지 절감, 81.7% 액션 정확도, 시스템 자체는 일일 배터리의 0.5%만 소모. 루팅 Android 디바이스에서 검증.

    '
  points:
  - '38.8% 에너지 절감: 18개 파라미터 개인화 전력 정책'
  - 'PDL 안전 검증: 모든 액션을 실행 전 제약 조건 체크'
  - '2계층 메모리: 3~5일 내 사용자 선호도 자동 학습'
  source: https://arxiv.org/pdf/2603.19584
- category: ai
  title: MNN-AECS — 모바일 LLM 디코딩 에너지를 23% 절감, 루트 없이 엔진 레벨 코어 선택 최적화
  summary: 'MNN-AECS는 모바일 디바이스에서 LLM 디코딩 시 에너지를 절감하는 최초의 엔진 레벨 솔루션이다. 메모리 바운드인 디코드 페이즈에서 저전력 CPU 코어를 동적으로 선택해, 속도 저하 없이 평균 23% 에너지 절감(7대 Android·iOS 디바이스, 5개 LLM). llama.cpp·ExecuTorch·MediaPipe 대비 39~78% 에너지 절감 + 12~363% 속도 향상. 루트 접근·OS 수정 불필요. MNN 엔진에 통합.

    '
  points:
  - '23% 에너지 절감: 디코드 페이즈 저전력 코어 동적 선택'
  - '루트 불필요: 앱 레벨에서 엔진 내 AECS 적용'
  - '경쟁 엔진 대비: llama.cpp 대비 39~78% 에너지 절감'
  source: https://arxiv.org/html/2506.19884
- category: ai
  title: AgentStop(Brave) — 온디바이스 AI 에이전트의 낭비적 추론을 조기 종료해 15~20% 에너지 회수
  summary: 'AgentStop는 Brave가 만든 경량 효율성 감독자(supervisor)로, 로컬 AI 에이전트의 LLM 추론을 실시간 모니터링하다가 성공 가능성이 낮은 체인을 조기 종료해 배터리를 절약한다. 실패한 코딩 시도 하나가 ~3,000mWh(100Wh 노트북의 ~3%)를 소모하는 문제를 해결. 태스크 완료율 5% 미만 하락으로 15~20% 낭비 에너지 회수. SWE-Bench Verified(Qwen3-Coder-30B-A3B)에서 검증.

    '
