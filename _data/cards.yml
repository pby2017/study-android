  title: Dify — LLM 앱을 비주얼 워크플로우로 빌드·배포하는 LLMOps 플랫폼(100k★·Apache-2.0 기반)
  summary: 'Dify는 RAG 파이프라인·에이전트 워크플로우·프롬프트 관리·모델 라우팅을 비주얼 UI에서 원스톱으로 제공하는 LLM 앱 개발 플랫폼이다. 100k+ GitHub 스타, 18만 개발자 커뮤니티. 챗봇·문서 인텔리전스·멀티에이전트 추론 앱을 코드 없이 만들 수 있고, 모든 앱에 API가 자동 생성된다. n8n이 SaaS 연결 자동화(Zapier 대체)라면, Dify는 AI 네이티브 앱 빌드에 특화. MCP 연동 지원, GPT·Claude·Llama·로컬 모델 교체 가능.

    '
