  title: OWASP MASVS-RESILIENCE + R8 — 모바일 앱 리버스 엔지니어링 방어의 2026년 표준 가이드
  summary: 'OWASP MASVS v2.0의 MASVS-RESILIENCE 카테고리는 모바일 앱의 리버스 엔지니어링·변조 방어 표준이다. Layer 1: R8(ProGuard 후속)로 이름 난독화·데드 코드 제거(무료, 필수), Layer 2: RASP(루트·디버거· Frida 후킹 탐지), Layer 3: Google Play Integrity API·Apple App Attest로 서버사이드 검증. R8는 제어 흐름 난독화·문자열 암호화 미지원 → jadx로 디컴파일 시 구조 노출. 핵심 로직은 서버에.

    '
  points:
  - '3단계 방어: R8(난독화) → RASP(런타임) → Play Integrity(검증)'
  - 'R8 한계: 이름 변경만, 제어 흐름·문자열 암호화 없음'
  - 'OWASP MASVS v2.0: RESILIENCE-1~4, 모든 모바일 앱 보안 기준'
  source: https://mas.owasp.org/MASVS/11-MASVS-RESILIENCE/
- category: ai
  title: ML Kit Text Recognition + Apple Vision — 모바일 온디바이스 OCR 양대 표준, 외부 의존성 없이 텍스트 인식
  summary: 'Google ML Kit Text Recognition v2와 Apple Vision VNRecognizeTextRequest는 모바일 온디바이스 OCR의 양대 표준이다. ML Kit는 Latin·중국어·일본어·한국어·데바나가리 5개 스크립트를 지원하고, Android는 번들/언번들 선택 가능, iOS는 38MB 정적 링크. Apple Vision은 OS 내장이라 의존성 $0, fast/accurate 두 경로 제공. react-native-nitro-ocr는 두 API를 통합 래핑. Tesseract 대비 네이티브 NPU 가속 우위.

    '
  points:
  - 'ML Kit v2: 5개 스크립트, Android 번들/언번들, iOS 정적 링크'
  - 'Apple Vision: OS 내장 $0, fast/accurate 경로, VNRecognizeTextRequest'
  - 'react-native-nitro-ocr: 두 API 통합, 오프라인 완전 지원'
  source: https://developers.google.com/ml-kit/vision/text-recognition/v2/ios
- category: ai
  title: ObjectBox — 모바일/엣지 온디바이스 벡터 DB, HNSW 검색 + ACID + 오프라인 우선(Apache-2.0·~4.6k★)
  summary: 'ObjectBox는 Java·Kotlin·Swift·Flutter·C/C++용 온디바이스 NoSQL+벡터 데이터베이스다. HNSW 인덱스로 ANN 검색을 지원하고, 바이너리 <8MB·동적 RAM KB 수준으로 모바일에 최적화. ACID 트랜잭션·양방향 동기화· 오프라인 우선 설계. 벡터와 일반 객체 데이터를 함께 저장 가능해 RAG·시맨틱 검색에 적합. LG G8S(5년 전 단말)에서 쿼리당 ~0.25ms, 4,000 QPS 달성. LangChain VectorStore 통합.

    '
  points:
  - '온디바이스 벡터 DB: HNSW ANN, <8MB 바이너리, KB급 RAM'
  - ACID + 오프라인 우선 + 양방향 동기화
  - 'LangChain 통합: from_documents/from_texts로 RAG 구성'
  source: https://github.com/objectbox/objectbox-java
- category: ai
  title: sqlite-vector — SQLite에 벡터 검색 추가, 30MB RAM으로 온디바이스 Edge AI(크로스플랫폼)
  summary: 'sqlite-vector는 SQLite에 벡터 검색 기능을 추가하는 크로스플랫폼 C 확장이다. Float32·Float16·BFloat16· Int8·1Bit·TurboQuant 2/3/4bit 양자화를 지원하고, SIMD 가속으로 초고속 거리 계산. 30MB RAM으로 동작하며, 가상 테이블 없이 일반 테이블의 BLOB 컬럼에 벡터를 저장. iOS·Android·Windows·Linux·macOS 모두 지원. sqlite-ai(온디바이스 LLM)·sqlite-agent·sqlite-mcp와 연동해 로컬 AI 에이전트 구성 가능.

    '
  points:
  - 'SQLite 확장: 30MB RAM, BLOB 컬럼에 벡터 저장, 가상 테이블 불필요'
  - 'TurboQuant: SIMD 2/3/4bit 양자화 스캔 지원'
  - '생태계: sqlite-ai·sqlite-agent·sqlite-mcp 로컬 AI 연동'
  source: https://github.com/sqliteai/sqlite-vector
- category: ai
  title: Aide — Gemma 4 온디바이스로 구동하는 안드로이드 AI 키보드·어시스턴트, 37개 언어 번역(오프라인)
  summary: 'Aide는 Gemma 4를 LiteRT-LM으로 온디바이스 실행하는 Android AI 앱이다. 시스템 키보드(InputMethodService)· 음성 어시스턴트·채팅을 하나의 모델로 통합. 키보드 트랜스폼 바에서 재작성·요약·문법 교정·톤 변경·번역 (37개 언어)을 로컬에서 처리. Sherpa-ONNX로 STT·TTS·VAD까지 온디바이스. Gemma 4 Function Calling으로 알람·캘린더·연락처·파일시스템·웹 검색까지 도구 호출. 모든 처리가 디바이스를 떠나지 않는다.

    '
  points:
  - '키보드+어시스턴트+채팅: 하나의 Gemma 4 모델로 통합'
  - '37개 언어 번역·재작성·요약·문법 교정: 완전 온디바이스'
  - 'Function Calling: 알람·캘린더·연락처·웹 검색 도구 호출'
  source: https://github.com/swaptr/aide
- category: ai
  title: AppFollow — App Store·Google Play 리뷰를 AI로 자동 분석·태깅·응답, ASO까지 통합(Discord·Opera 사용)
  summary: 'AppFollow는 App Store·Google Play·Amazon 등 앱 스토어 리뷰를 단일 인박스에서 관리하는 플랫폼이다. AI가 리뷰를 자동 태깅(버그·기능 요청·가격·온보딩)하고, 감정 분석·트렌드 대시보드·경쟁사 리뷰 비교를 제공. AI 자동 응답은 감정·언어·앱 컨텍스트에 맞춰 초안을 생성하고, Zendesk·Slack·Jira 연동으로 워크플로우 자동화. Discord·Flo·Opera 등 사용. Google 데이터 기준 응답 시 평점 +0.7★ 상승 효과.

    '
  points:
  - '단일 인박스: App Store·Google Play·Amazon 리뷰 통합 관리'
  - AI 자동 태깅+감정 분석+자동 응답 초안 생성
  - '응답 효과: Google 데이터 기준 평점 +0.7★ 상승'
  source: https://appfollow.io/
