      논문 초록의 핵심 결과는 차갑다: 49개 스킬 중 39개는 pass-rate 향상이 0이고 평균 이득은 +1.2%에 그쳤다.
      토큰 오버헤드는 경우에 따라 451%까지 늘었고, 버전이 안 맞는 지침은 오히려 성능을 깎았다. 교훈은
      스킬을 많이 까는 게 아니라, 현재 레포·버전·작업에 정확히 맞는 좁은 스킬만 쓰는 것이다.
    points:
      - "49개 public SWE skills + 고정 커밋 레포 + 요구사항 + 실행 테스트로 paired 평가"
      - "39/49 스킬은 pass-rate 향상 0, 평균 이득 +1.2%; 일부는 버전 불일치로 성능 하락"
      - "스킬은 범용 마법이 아니라 도메인·버전·작업 적합성이 맞을 때만 값이 난다"
