- category: ai
  title: RigorBench — 코딩 에이전트 평가를 pass/fail에서 계획·검증·중단 품질로 넓히기
  summary: RigorBench(arXiv 2606.22678)는 코딩 에이전트를 최종 정답률만으로 보지 말고 실행 궤적 전체로 평가하자는 벤치마크다. 논문은 30개 작업을 Plan-Then-Build, Verify-Or-Die, Doom Loop Gauntlet, Know When to Fold, Don't Break the Build 5범주로 나누고, Planning Fidelity·Verification Coverage·Recovery Efficiency·Abstention Quality·Atomic Transition Integrity 5축을 RigorScore로 합친다. 교육 포인트는 간단하다. 테스트 통과 패치라도 계획 없이 여러 번 찔러 맞혔거나, 불가능한 요구에 멈추지 못했거나, 중간 상태마다 빌드를 깨면 운영용 에이전트로는 낮게 봐야 한다는 것이다. 저자들은 구조화된 discipline이 process quality를 평균 41%, outcome correctness를 17% 높였다고 보고한다.
  points:
  - '5축 평가: 계획·검증·회복·중단·원자적 전환'
  - 30개 작업·120개 실행 궤적을 계획/편집/테스트/복구 로그로 채점
  - '교훈: pass/fail 벤치마크 옆에 프로세스 로그 점수를 붙여야 production risk가 보임'
  source: https://arxiv.org/abs/2606.22678
