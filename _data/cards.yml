  - CodeQL=Actions minutes, AI review·Autofix=별도 사용량 모델
  - PR quality gate·coverage threshold·Autofix 권한을 운영 정책으로 정의
  source: https://github.blog/changelog/2026-06-16-github-code-quality-generally-available-july-20-2026/
- category: ai
  title: ARD(Agentic Resource Discovery) — AI 에이전트가 필요한 도구를 '런타임에 직접 찾는' 개방형 표준(Apache-2.0·MS+Google+HF 공동)
  summary: 'ARD는 AI 에이전트가 MCP 서버·스킬·API를 런타임에 동적으로 발견·검증·연결할 수 있게 하는 개방형 사양이다. Microsoft·Google·GitHub·Hugging Face·Nvidia·Salesforce 등이 공동 개발했고, ai-catalog.json 매니페스트 파일 하나로 조직이 자체 레지스트리를 운영할 수 있다. GitHub Agent Finder가 첫 번째 상용 구현으로 Copilot이 필요한 도구를 자동 검색해 context window에 주입한다. 에이전트 생태계가 "미리 설치" 모델에서 "필요할 때 발견" 모델로 전환되는 인프라 시그널이다.

    '
  points:
  - MS·Google·GitHub·HF·Nvidia 등 11개사 공동 개발, Apache-2.0
  - ai-catalog.json 매니페스트 기반 연합형(federated) 레지스트리
  - 'GitHub Agent Finder: Copilot이 ARD로 도구를 런타임 검색 → context window 절약'
  source: https://commandline.microsoft.com/agentic-resource-discovery-specification-ard/
