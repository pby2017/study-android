  title: Argilla — LLM 파인튜닝용 데이터를 사람이 검수·큐레이션하는 오픈소스 플랫폼(Apache-2.0·HuggingFace)
  summary: 'Argilla는 LLM 파인튜닝에 쓸 instruction·preference 데이터를 사람이 직접 검수·라벨링·큐레이션하는 오픈소스 도구다. RLHF용 선호도 랭킹(chosen/rejected)을 네이티브 지원하고, distilabel과 연동해 합성 데이터 생성 → 사람 검수 파이프라인을 구성할 수 있다. Label Studio(27k★)가 이미지·오디오 등 범용 라벨링이라면, Argilla는 LLM/NLP 피드백에 특화. HuggingFace 산하 프로젝트로 Spaces에서 즉시 배포 가능.

    '
  points:
  - 'LLM 특화: RLHF 선호도 랭킹·instruction 라벨링 네이티브 지원'
  - 'distilabel 연동: 합성 데이터 생성 → 사람 검수 파이프라인'
  - 'HuggingFace 산하: Spaces 즉시 배포, Apache-2.0'
  source: https://github.com/argilla-io/argilla
