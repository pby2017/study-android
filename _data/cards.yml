      핵심은 'AI가 잘나서'가 아니라 '받칠 인프라가 있어서'다 — Honk는 2022년부터 운영한 Fleet Management(대규모 자동 코드 변환) 위에 얹혀 있고, 그 전엔 AST 조작·정규식으로 변환을 정의했지만 복잡한 다단계 수정에선 한계가 있었다. 그래서 '지나치게 경직된 지시가 필요하고 멀티스텝 편집에 약했던' 자체 방식을 버리고 Claude Code 기반으로 갈아탔다고 밝혔다.
