  title: E2B — AI 에이전트가 생성한 코드를 Firecracker 샌드박스에서 실행하는 클라우드 인프라(Apache-2.0·~12.8k★)
  summary: 'E2B는 AI 에이전트가 생성한 코드를 클라우드의 격리 샌드박스에서 실행하게 해 주는 오픈소스 인프라다. JavaScript/TypeScript와 Python SDK로 sandbox를 만들고 `commands.run()`으로 셸 명령을 실행하거나, 별도 Code Interpreter SDK의 `runCode()`로 코드 실행 결과를 받을 수 있다. 셀프호스팅은 별도 `e2b-dev/infra` 저장소에서 Terraform 기반으로 안내되고, AWS/GCP 배포와 Firecracker 구성 요소 복사를 포함한다. 현재 README가 직접 보장하지 않는 "Fortune 100 88%" 같은 마케팅 숫자보다, 실무 포인트는 LLM이 만든 코드를 앱 서버가 아니라 짧게 사는 격리 실행면으로 밀어 넣고 API 키·네트워크·템플릿 경계를 따로 설계하는 것이다.

    '
  points:
