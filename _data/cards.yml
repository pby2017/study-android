  source: https://github.com/danielmiessler/fabric
- category: ai
  title: 'tgpt: 터미널에서 AI를 쓰는 크로스플랫폼 CLI'
  summary: '"a Cross-platform Command-Line Interface (CLI) tool that allows you to use AI in your Terminal." 별도 페이지에 정리된 여러 provider를 골라 터미널에서 바로 AI를 호출하는 Go 기반 도구. GPL-3.0.

    '
