    url: https://registry.npmjs.org/openskills/latest
  interview: 'OpenSkills가 같은 `SKILL.md` 포맷을 쓴다고 해서 Codex나 다른 에이전트에서 네이티브 스킬처럼 자동 호출된다고 단정할 수 없는 이유는 무엇인가요?'
  answer: 'OpenSkills는 `AGENTS.md`에 목록과 호출 지침을 기록하고, 에이전트가 지침을 따라 `openskills read`를 실행하게 한다. 자동 사용에는 AGENTS.md 로딩과 셸 실행 능력이 필요하다. 호스트별 네이티브 발견·권한 체계와는 별개이므로 실제 호출 경로를 확인해야 한다.'
- category: ai
  level: 중급
  title: Memory Bank — 세션이 바뀌어도 프로젝트 맥락을 잃지 않게 하는 마크다운 메모리 패턴
  summary: 'Memory Bank는 프로젝트 맥락을 대화 기록에만 두지 않고 저장소의 문서로 남겨, 세션이 바뀌어도 다시 참조할 수 있게 하는 패턴이다. Roo Code용 `roo-code-memory-bank`는 Roo의 모드별 사용자 지침에 이 파일을 읽고 갱신하는 절차를 넣는다. 구현 문서상 `memory-bank/`의 핵심은 네 파일이다: `activeContext.md`(현재 목표·상태), `decisionLog.md`(결정과 이유), `productContext.md`(프로젝트 맥락), `progress.md`(완료·다음 작업). 루트 `projectBrief.md`와 `systemPatterns.md`는 선택 파일이다. 파일이 있다고 에이전트가 자동으로 읽는 것은 아니다. 호스트의 지침·도구가 읽기와 갱신을 실행해야 하며, 오래된 기록은 오히려 잘못된 맥락이 될 수 있으므로 현재 사실과 결정 이력을 구분해 관리한다.'
  points:
  - 'Roo Code 예시: 핵심 4파일은 activeContext / decisionLog / productContext / progress; projectBrief·systemPatterns는 선택'
  - '자동 로딩은 파일 자체의 기능이 아님 — Roo 모드별 지침에 초기화·읽기·갱신 절차를 설정'
  - '실무 적용: 현재 상태는 짧게 갱신하고, 결정 기록은 근거와 함께 남기며, 민감 정보·오래된 전제는 제외'
  source: https://github.com/GreatScottyMac/roo-code-memory-bank
  sources:
  - label: Roo Code Memory Bank README — 설치 지침, 핵심·선택 파일 구성
    url: https://github.com/GreatScottyMac/roo-code-memory-bank#readme
  - label: Context Portal MCP — 파일 기반 기억과 구분되는 DB·검색 기반 대안
    url: https://github.com/GreatScottyMac/context-portal
  interview: 'Memory Bank 문서를 저장소에 두기만 하면 모든 AI 세션에서 자동으로 활용된다고 할 수 없는 이유는 무엇인가요?'
  answer: '저장은 지속성을 제공하지만 로딩은 호스트 에이전트의 지침과 도구 실행에 달려 있다. 예를 들어 Roo 구현은 모드별 지침으로 파일을 읽고 갱신한다. 따라서 실제 시작 시 로딩 여부와 갱신 규칙을 설정하고, 오래된 맥락을 검토해야 한다.'
- category: ai
  level: 중급
  title: Cursor 규칙(.mdc) — 한 덩어리 지침을 '언제 켤지'로 쪼개 토큰 아끼기
  summary: 'Cursor Project Rules는 `.cursor/rules/`의 `.mdc` 파일로 저장하고 Git으로 공유하는 지침이다. 프런트매터의 `alwaysApply`, `globs`, `description` 조합으로 적용 시점을 정한다. 네 방식은 Always(매 세션), Apply to Specific Files(glob 일치 파일이 컨텍스트에 있을 때), Apply Intelligently(설명을 보고 에이전트가 관련성을 판단), Apply Manually(`@규칙` 호출)다. `alwaysApply: true`이면 다른 두 필드는 적용 조건에 영향을 주지 않는다. 규칙에서 `@파일`을 참조하면 파일 내용이 규칙에 미리 삽입되는 것이 아니라, 적용된 에이전트가 필요할 때 도구로 읽는다. 간단한 지침은 Cursor가 지원하는 `AGENTS.md`로도 둘 수 있다. 반복 적용이 필요한 규칙만 좁게 나누고, 보안 경계처럼 반드시 지켜야 할 요구는 프롬프트 규칙만으로 강제하지 않는다.'
  points:
  - '`.cursor/rules/*.mdc`는 프로젝트 규칙 파일. `.md`는 규칙 frontmatter가 없으므로 이 시스템에서 무시되며, 단순 지침에는 `AGENTS.md` 대안이 있음'
  - 'Always / Specific Files(globs) / Intelligently(description) / Manually(@멘션) — 필요한 범위만 적용해 지침 중복과 불필요한 컨텍스트를 줄인다'
  - '팀·프로젝트·사용자 규칙은 함께 적용되며 충돌 시 Team → Project → User 순으로 앞선 지침이 우선'
  source: https://cursor.com/docs/context/rules
  sources:
  - label: Cursor Rules 공식 문서 — 규칙 유형·frontmatter·적용 우선순위
    url: https://cursor.com/docs/rules
  - label: Cursor AGENTS.md 공식 문서 — 단순 지침과 하위 경로 지원
    url: https://cursor.com/docs/rules#agentsmd
  interview: 'Cursor 규칙 frontmatter에서 `alwaysApply`, `globs`, `description`은 적용 시점을 어떻게 나누며, `@파일` 참조는 언제 내용을 컨텍스트에 넣나요?'
  answer: '`alwaysApply: true`는 매 세션 포함하고 다른 필드는 조건으로 쓰지 않는다. `globs`는 일치 파일이 컨텍스트에 있을 때 적용하며, `description`은 에이전트가 관련성을 판단할 때 사용한다. 셋 다 없으면 `@규칙`으로 수동 호출한다. 규칙의 `@파일`은 내용을 미리 삽입하지 않고, 규칙이 적용된 뒤 에이전트가 필요할 때 도구로 읽는다.'
- category: ai
  level: 중급
  title: Pydantic AI — 'FastAPI 느낌'으로 타입 안전하게 짜는 모델-비종속 에이전트 프레임워크
  summary: 'Pydantic AI는 Pydantic 팀의 Python 에이전트 프레임워크다. `Agent`에 출력 타입(예: Pydantic `BaseModel`)을 지정하면 응답을 구조화된 값으로 다루고, Python 타입 검사와 검증기를 사용해 코드 경계에서 확인할 수 있다. 단, 이는 컴파일 타임 검증이 아니며 모델이 항상 올바른 값을 만든다는 보장도 아니다. 사용자 정의 `output_validator`에서 `ModelRetry`를 발생시키면 모델에 다시 요청할 수 있고, 재시도 예산은 기본값과 설정에 따라 제한된다. 여러 모델·제공자를 지원하지만 실제 교체 가능 범위는 각 제공자의 기능과 모델별 차이에 좌우된다. MIT 라이선스이며, GitHub 저장소는 확인일 기준 약 21.3k stars로 높은 관심도를 보인다.'
  points:
  - '출력 타입을 선언해 구조화된 응답을 받고, Python/Pydantic 검증으로 실행 중 값의 모양과 제약을 확인'
  - '`ModelRetry`는 검증 실패를 모델에 되돌려 다시 생성하게 하는 명시적 경로 — 횟수는 재시도 예산이 제한'
  - '다양한 모델·제공자를 지원하는 MIT 라이선스 프레임워크 — 저장소 관심 신호 약 21.3k★(2026-11-22 확인)'
  source: https://github.com/pydantic/pydantic-ai
  sources:
  - label: Pydantic AI 공식 Output 문서 — 구조화 출력과 output validator 재시도
    url: https://ai.pydantic.dev/output/
  - label: Pydantic AI 공식 개요 — 타입 안전성·제공자 지원·OpenTelemetry
    url: https://ai.pydantic.dev/
  - label: GitHub 저장소 — MIT 라이선스와 관심도 스냅샷
    url: https://github.com/pydantic/pydantic-ai
  interview: 'Pydantic AI의 구조화 출력은 모델 응답을 컴파일 타임에 안전하게 만들며, 검증에 실패하면 항상 자동 재요청하나요?'
  answer: '아니다. 출력 타입은 응답을 구조화하고 실행 중 검증하는 데 도움을 주지만 컴파일 타임 보장이나 의미적 정확성을 보장하지 않는다. 사용자 정의 output validator가 `ModelRetry`를 발생시켜야 재요청하며, 이 재시도는 설정된 제한 예산을 사용한다.'
- category: ai
  level: 중급
  title: Backlog.md — 깃 레포를 사람·AI 공용 칸반 보드로 바꾸는 마크다운 태스크 매니저
  summary: 'Backlog.md는 Git 저장소의 작업을 프로젝트 내부 Markdown 파일로 관리하는 로컬 우선 태스크 보드다. CLI와 터미널 칸반, 로컬 웹 보드를 제공하며, Git 원격 동기화는 선택 사항이다. AI 연결도 필수 MCP가 아니다. 초기 설정에서 권장되는 CLI 지침 파일을 만들거나, 선택적으로 MCP 커넥터를 구성하거나, AI 설정을 건너뛸 수 있다. AI 작업 흐름은 태스크와 수용 기준을 먼저 검토하고, 계획을 확인한 뒤 구현·테스트를 리뷰하는 체크포인트를 둔다. 작업 기록이 저장소에 남아 다음 세션에서도 이어볼 수 있지만, 에이전트가 항상 자동으로 상태를 정확히 갱신하는 것은 아니므로 사람이 완료 기준과 결과를 검증해야 한다.'
  points:
  - '작업은 레포 내부 Markdown으로 기록하고 CLI·터미널 칸반·로컬 웹 보드로 관리; 원격 Git과 MCP는 필수가 아님'
  - 'AI 연결 선택지: CLI 지침 파일(권장) / MCP 커넥터(선택) / AI 설정 생략'
  - '태스크·수용 기준 → 계획 → 구현·테스트를 사람 검토 지점으로 나눠 작업 범위와 핸드오프를 명확히 한다'
  source: https://github.com/MrLesk/Backlog.md
  sources:
  - label: Backlog.md README — 설치·AI 연결 방식·검토 단계
    url: https://github.com/MrLesk/Backlog.md#readme
  - label: Backlog.md GitHub 저장소 — 라이선스·관심도 스냅샷
    url: https://github.com/MrLesk/Backlog.md
  interview: 'Backlog.md에서 AI 에이전트와 작업 목록을 공유할 때 MCP가 필수인가요? 사람이 검토해야 할 핵심은 무엇인가요?'
  answer: 'MCP는 선택 사항이다. 권장 흐름은 저장소에 CLI 지침을 설정하고 에이전트가 `backlog instructions overview`를 실행하게 하는 것이다. MCP 없이도 AI 설정을 생략하거나 CLI 지침을 쓸 수 있다. 사람은 태스크·수용 기준, 구현 전 계획, 코드·테스트 결과를 각각 검토하고 완료 상태가 실제 기준을 만족하는지 확인한다.'
- category: ai
  level: 중급
  title: Ralph Wiggum 루프 — '멍청하지만 절대 안 멈추는' 에이전트 bash 패턴
  summary: 'Ralph Wiggum은 코딩 에이전트에 같은 목표를 반복해서 주고, 이전 작업과 검증 결과를 바탕으로 다음 단계를 수행하게 하는 반복 개발 기법이다. Geoffrey Huntley가 설명한 원형은 Bash 루프에서 프롬프트를 매번 다시 전달하는 방식이며, 한 번에 작은 작업을 맡기고 계획·명세를 파일로 유지한다. 테스트·타입 검사·정적 분석 같은 자동 검증은 잘못된 출력을 되돌리는 backpressure가 된다. Anthropic의 공식 Ralph Loop 플러그인은 비슷한 아이디어를 Claude Code의 Stop hook으로 구현해 현재 세션 안에서 같은 프롬프트를 반복한다. 따라서 모든 Ralph가 매 반복 새 세션·새 컨텍스트를 만든다고 보면 안 된다. 명확한 완료 조건과 반복 한도를 두지 않으면 오류를 되풀이하거나 비용을 계속 쓸 수 있다.'
  points:
  - '원형은 외부 루프가 프롬프트를 다시 전달; Claude Code 공식 플러그인은 Stop hook으로 현재 세션에서 반복 — 구현마다 컨텍스트 수명이 다름'
  - '작업을 작게 나누고 계획·명세를 파일에 보존; 테스트·린트 등 자동 검증으로 실패를 감지해 다음 반복에 피드백'
  - '명확한 완료 조건과 최대 반복 횟수를 설정하고, 사람 검토가 필요한 판단·위험한 작업은 무한 자동화하지 않는다'
  source: https://ghuntley.com/ralph/
  sources:
  - label: Geoffrey Huntley — Ralph 원형·한 작업씩 진행·외부 Bash 루프·검증 backpressure
    url: https://ghuntley.com/ralph/
  - label: Anthropic 공식 Ralph Loop 플러그인 — Stop hook 기반 구현과 반복 제한
    url: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/ralph-loop
  interview: 'Ralph Wiggum 루프의 핵심은 매 반복 새 컨텍스트를 만드는 것인가요? 반복을 안전하게 운용하려면 무엇을 정해야 하나요?'
  answer: '아니다. 원형의 외부 Bash 루프는 매 호출에 프롬프트를 다시 전달하지만, Claude Code 공식 플러그인은 Stop hook으로 현재 세션에서 반복하므로 구현별 컨텍스트 수명이 다르다. 작업을 작게 나누고 자동 검증, 명시적 완료 조건, 최대 반복 횟수를 설정해야 실패 반복과 무제한 비용을 줄일 수 있다.'
- category: ai
  level: 중급
  title: GitHub Copilot 클라우드 에이전트 — 백그라운드 작업을 맡기고 변경을 검토
  summary: 'GitHub Copilot의 클라우드 에이전트는 저장소 작업을 맡아 원격 개발 환경에서 코드를 조사·수정하고 테스트나 린트를 실행하는 위임형 에이전트다. GitHub.com, 모바일, IDE 등 지원 클라이언트에서 세션을 시작할 수 있으며, 이슈에서 할당하거나 대화로 작업을 요청할 수 있다. 실행 환경은 기능·클라이언트에 따라 GitHub 호스팅 클라우드 샌드박스 또는 GitHub Actions일 수 있다. Copilot CLI·앱의 로컬 세션은 별도 실행 방식이다. 변경 브랜치나 PR은 자동으로 항상 생성되는 것이 아니라 요청과 작업 흐름에 따라 다르다. 에이전트 결과에는 오류나 보안 결함이 있을 수 있으므로, 테스트와 diff를 사람이 검토한 뒤 병합해야 한다.'
  points:
  - '작업을 클라우드 세션에 위임해 저장소를 조사·수정하고 테스트/린트를 실행 — 실행 환경은 Cloud·Actions 등에서 선택되며 클라이언트별 지원이 다름'
  - '이슈·PR·Agents 화면 또는 지원 클라이언트에서 시작할 수 있다. 작업 결과가 항상 자동 PR이라는 가정 대신 세션에서 결과와 PR 생성 여부를 확인'
  - '생성 코드·테스트 결과는 틀릴 수 있고 취약점도 포함할 수 있음 — diff, 테스트, 보안 영향 검토 후 병합'
  source: https://docs.github.com/en/copilot/concepts/copilot-surfaces/copilot-on-github
  sources:
  - label: GitHub Copilot on GitHub.com and Mobile — 위임 세션, 시작점, 리뷰 한계
    url: https://docs.github.com/en/copilot/concepts/copilot-surfaces/copilot-on-github
  - label: GitHub Copilot cloud sandboxes — Cloud·Actions·로컬 실행 환경 구분
    url: https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/about-cloud-sandboxes
  interview: 'GitHub Copilot 클라우드 에이전트는 항상 GitHub Actions에서 실행해 자동으로 PR을 생성하나요? 결과를 병합하기 전에 무엇을 검증해야 하나요?'
  answer: '아니다. 기능과 시작 클라이언트에 따라 Cloud 샌드박스, GitHub Actions, 로컬 또는 사용자 지정 환경에서 실행될 수 있고, PR 생성 여부도 요청 흐름에 따라 달라진다. 변경 diff와 테스트·린트 결과를 확인하고, 보안 취약점이나 요구사항 누락을 사람이 검토한 뒤 병합해야 한다.'
- category: ai
  level: 중급
  title: skills.sh / npx skills — 여러 코딩 에이전트에 SKILL.md를 설치·관리하는 CLI
  summary: Vercel Labs의 오픈소스 `skills` CLI는 SKILL.md 기반 에이전트 스킬을 찾고 프로젝트나 사용자 전역에 설치·갱신하는 도구다. `npx skills add <owner/repo>`로 저장소를 지정하면 설치할 스킬과 대상 에이전트를 선택할 수 있다. 기본 설치는 프로젝트 범위이며, `-g`는 전역 설치다. 기본 방식은 공유 스킬 디렉터리와 에이전트별 경로를 심볼릭 링크로 연결하고, `--copy`를 선택하면 파일을 복사한다. `find`, `list`, `check`, `update`, `remove`, `init` 명령과 GitHub·GitLab·로컬 경로 등을 지원한다. 같은 파일을 여러 도구에 배치해도 각 호스트의 스킬 탐색·호출 규칙까지 같아지는 것은 아니다. 설치 전에는 스킬 지침과 실행할 명령을 검토한다.
  points:
  - '`npx skills find/add/list/check/update/remove/init` — 검색·설치·점검·갱신·삭제·초기화'
  - 기본은 프로젝트 설치, `-g`는 사용자 전역 설치; 기본 링크 방식 대신 `--copy` 가능
  - README는 Codex·Claude Code·Cursor·OpenCode 등 75+ 에이전트 지원을 명시한다. 저장소는 MIT, Node.js 22.20+ 필요
  - 'GitHub 저장소의 현재 표시: 약 40.4k★ (2026-11-22 확인; 인기 지표이지 품질·안전성 보증은 아님)'
  source: https://github.com/vercel-labs/skills
  sources:
  - label: 'Vercel Labs skills — README, 지원 에이전트·Node 요구사항·라이선스·명령'
    url: https://github.com/vercel-labs/skills#readme
  - label: 'skills CLI command reference — 설치 범위·링크/복사·지원 소스'
    url: https://github.com/vercel-labs/skills/blob/main/docs/commands.md
  - label: 'skills.sh — 공개 스킬 디렉터리·인기도 지표'
    url: https://skills.sh/
  interview: 'skills CLI로 하나의 SKILL.md를 여러 에이전트에 설치하면 동작과 보안도 동일하게 보장되나요? 프로젝트 설치와 전역 설치의 차이는 무엇인가요?'
  answer: '아니다. CLI는 파일을 에이전트별 위치에 링크하거나 복사하지만, 스킬 검색·호출 방식은 각 호스트에 따라 다르고 스킬 자체의 안전성도 보증하지 않는다. 기본은 현재 프로젝트 범위에 설치하며 `-g`를 지정하면 사용자 전역에 설치한다. 출처와 지침, 실행 명령을 검토한 뒤 필요한 도구에만 설치한다.'
