      한 모델이 다 하는 게 아니라 역할이 갈린 에이전트들을 조율한다 — 파일을 훑는 File Picker, 변경 계획을 짜는 Planner,
      실제로 편집하는 Editor, 결과를 검증하는 Reviewer가 협업하고, 각 에이전트는 다시 서브에이전트를 띄우거나(spawn) 조건 분기·다단계 실행을 한다.
      TypeScript 제너레이터로 'AI 생성 + 프로그램적 제어'를 섞은 커스텀 워크플로를 짤 수 있고, '@codebuff/sdk'로 앱·CI에 끼워 넣을 수도 있다.
