  title: Uizard Autodesigner 2.0 — 손그림·스크린샷 스캔으로 multi-screen prototype
  summary: Uizard는 AI로 wireframe·mockup을 만드는 design tool로, Autodesigner 2.0(2024)이 text prompt에서 multi-screen clickable prototype을 한 번에 생성한다. Wireframe Scanner는 손그림 sketch를 digitize하고, Screenshot Scanner는 기존 UI 캡처를 editable mockup으로 변환한다. vector editor 대신 drag-and-drop component editor를 써서 비개발자 진입 장벽을 낮췄고, Figma·Miro export로 design handoff를 이어간다. Visily(code gen·Plan Mode) ·Stitch(모바일) ·v0(React code)와 complement — Uizard=sketch/screenshot heavy rapid ideation·clickable demo, production code export는 약함.
