  title: W&B Weave — LLM 옵저버빌리티+평가를 기존 ML 실험 트래킹과 한 UI에 통합(Weights & Biases)
  summary: 'W&B Weave는 Weights & Biases의 LLM 옵저버빌리티·평가 플랫폼이다. @weave.op 한 줄로 모든 LLM 호출 트레이싱. weave.Evaluation으로 데이터셋+스코어러 파이프라인 구축 → 버전별 비교 대시보드 자동 생성. 커스텀 스코어러(함수/@weave.op)·내장 스코어러(exact match·regex·LLM-graded· 임베딩 유사도) 제공. Python+TypeScript SDK. 기존 W&B 학습 실험 UI와 동일 워크스페이스에서 LLM eval 관리 → ML 팀 전환 비용 최소. Langfuse(오픈소스 특화), Arize Phoenix(드리프트 감지)와 경쟁하나, 이미 W&B 사용 팀에는 가장 자연스러운 확장.

    '
