      - "LangGraph 런타임 위 LangChain `create_agent`를 더 의견 있게 감싼 층, 'Claude Code에서 영감받음'을 명시 — 무엇이 그런 도구를 범용으로 만드는지를 일반화한 시도"
      - "MIT 라이선스, `uv add deepagents`로 설치, 파일시스템은 로컬·샌드박스·원격 백엔드로 교체 가능(pluggable)"
