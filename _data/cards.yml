  title: AI Coding Agent CI 보안 — tag pinning만으론 부족, 런타임 egress까지 본다
  summary: StepSecurity의 2026년 글은 Claude Code·Cursor·Codex·Gemini·Copilot 같은 AI coding agent가 개발자 머신, PR, GitHub Actions까지 이어지는 3단계 공격면을 만든다고 정리한다. 에이전트는 패키지를 설치하고, MCP 서버·IDE 확장에 연결하고, CI에서 GITHUB_TOKEN 권한으로 branch push·dependency install·GitHub API 호출까지 수행한다. 그래서 방어도 "생성 코드 스캔"만으로는 부족하다. GitHub 공식 Actions 보안 문서는 third-party action을 full-length commit SHA로 pinning하라고 권고하지만, 2026-06-24 compromised action 사례처럼 tag가 repoint되면 tag pin은 깨진다. 실전 교훈은 agent workflow를 privileged build system으로 보고, dependency cooldown/PR block, least-privilege GITHUB_TOKEN, full SHA pin, runner network egress policy, process/network attribution을 한 묶음으로 설계하는 것이다.
  points:
  - 3단계 공격면 — dev machine/MCP·repo dependency PR·CI runner secret/GITHUB_TOKEN
  - GitHub 공식 권고 — third-party action은 tag보다 full-length commit SHA pinning
  - AI agent CI는 runtime 관측 필요 — outbound endpoint·spawned process·package install을 step 단위로 추적
