  title: Maestro MCP — 코딩 에이전트가 Android 앱을 직접 조작하고 E2E 테스트를 남기기
  summary: 'Maestro MCP는 코딩 에이전트에 실행 중인 Android 기기나 에뮬레이터를 연결해 화면을 확인하고 탭·스크롤·검증을 수행하게 한다. 에이전트는 반복 가능한 E2E 테스트를 YAML flow로 작성하고 실행할 수 있다. MCP가 테스트 품질을 보장하지는 않는다. 생성된 흐름의 전제와 단언(assertion)을 개발자가 검토하고, CI에서 안정적으로 재실행되는지 확인해야 한다.'
  points:
  - 'Maestro CLI에 MCP 서버가 포함되어 별도 MCP 서버 설치 없이 에이전트 연결'
  - '실행 중인 앱에서 화면 확인·탭·스크롤·assert 수행'
  - '에이전트가 생성한 YAML flow를 저장해 반복 가능한 E2E 테스트로 사용'
  - '기기 제어 권한을 제한하고, 흐름·단언·재실행 결과를 사람이 검토'
  source: https://github.com/mobile-dev-inc/maestro
  interview: "AI 에이전트가 Maestro로 앱을 조작해 테스트를 통과시키면 기능이 검증된 것인가요?"
  answer: "그 자체로 충분하지 않다. 에이전트가 잘못된 화면 상태를 성공으로 판단하거나 중요한 실패 경로를 놓칠 수 있다. 요구사항에 맞는 단언과 실패 사례를 사람이 검토하고, 생성된 YAML을 고정한 뒤 여러 번 실행해 재현성과 CI 안정성을 확인한다."

- category: ai
  level: "중급"
  title: Koog — Kotlin Android 앱에서 AI 에이전트를 만들 때 확인할 것
  summary: 'Koog는 JetBrains의 Kotlin 기반 AI 에이전트 프레임워크로, 도구 호출·워크플로·대화 상태를 Kotlin 코드로 구성한다. 공식 문서는 Kotlin Multiplatform의 Android 타깃을 언급하지만, 저장소 README의 지원 타깃 목록에는 Android가 빠져 있다. 따라서 실제 도입 전 사용할 Koog 버전과 artifact의 Android 변형을 Gradle에서 확인하고 샘플 앱으로 빌드해야 한다. Koog는 에이전트 오케스트레이션 도구이지 온디바이스 LLM 런타임은 아니다.'
  points:
  - 'Kotlin DSL로 LLM 에이전트·도구·상태 기반 워크플로 구성'
  - '모델 제공자 연결, MCP 도구, 스트리밍 등을 통합할 수 있음'
  - 'Android 지원은 공식 문서와 README의 타깃 목록이 다르므로 버전별 빌드 확인'
  - '원격 LLM을 쓸 때 API 비밀키를 APK에 넣지 말고 신뢰할 수 있는 서버에서 관리'
  source: https://docs.koog.ai/
  interview: "Koog가 Kotlin Multiplatform 기반이면 모든 모듈과 LLM 연결이 Android에서 그대로 동작하나요?"
  answer: "그렇다고 단정할 수 없다. 각 모듈과 제공자 통합이 Android 타깃을 지원하는지 사용하는 버전의 Gradle metadata와 문서에서 확인하고 실제 Android 앱으로 컴파일·실행한다. Koog는 에이전트 실행 흐름을 구성하는 프레임워크이지 모델을 자동으로 기기 안에서 추론하는 런타임은 아니다. 원격 LLM 자격 증명도 앱에 포함하지 않는다."

- category: ai
  level: "중급"
  title: Google Stitch — AI 디자인 캔버스에서 UI 아이디어를 프로토타입으로 검증하기
  summary: 'Stitch는 Google Labs의 AI-native 디자인 캔버스다. 자연어와 이미지·텍스트·코드를 맥락으로 제공해 고해상도 UI 시안을 만들고, 음성 대화와 디자인 에이전트로 반복 수정할 수 있다. 화면을 연결해 인터랙티브 프로토타입을 미리 보고, DESIGN.md로 디자인 규칙을 다른 도구와 공유하거나 MCP·SDK로 연결한다. 생성된 화면은 검증된 Android 구현 코드가 아니므로 접근성·반응형 동작·실기기 UI는 별도로 확인한다.'
  points:
  - '요구사항과 참고 이미지·코드를 캔버스에 넣어 UI 시안 생성·수정'
  - '화면을 연결하고 Play로 사용자 흐름 프로토타입 미리보기'
  - 'DESIGN.md, MCP 서버, SDK를 통해 디자인 컨텍스트를 다른 도구와 연결'
  - '실제 구현 전 접근성·화면 크기·상태별 동작을 Android에서 검증'
  source: https://blog.google/innovation-and-ai/models-and-research/google-labs/stitch-ai-ui-design/
  interview: "Stitch가 화면을 연결한 인터랙티브 프로토타입을 만들었다면, Android 구현 검증도 끝난 건가요?"
  answer: "아니다. 프로토타입은 아이디어와 사용자 흐름을 빠르게 검토하는 도구다. 실제 앱은 다양한 화면 크기와 글자 크기, 접근성, 로딩·오류 상태, 시스템 동작을 지원해야 한다. 디자인 규칙과 사용자 흐름을 참고해 Android UI를 구현한 뒤 에뮬레이터와 실기기에서 별도로 검증한다."

