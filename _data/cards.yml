- category: ai
  title: OpenAI Triton — Python DSL로 GPU 커널 작성, Blackwell CUDA Tile IR 백엔드(2026)
  summary: OpenAI Triton은 타일 기반 Python DSL로 CUDA 경험 없이 GPU 커널을 작성하는 오픈소스 컴파일러(MIT). PyTorch·vLLM·FlashAttention 등 AI 스택의 커스텀 연산 기반. 2026 NVIDIA가 Triton-to-TileIR 백엔드를 공식 통합 — ENABLE_TILE=1로 Blackwell GPU에서 CUDA Tile IR 직접 타겟(CUDA 13.1+). AMD ROCm·NVIDIA PTX 양쪽 지원으로 벤더 락인 완화. occupancy·num_ctas 튜닝이 Tile IR 성능의 핵심 — tensor-of-pointer 패턴은 TMA API 전환 전까지 비효율.
  points:
  - 타일 기반 Python DSL — MLIR→PTX/Tile IR, CUDA 전문 지식 없이 커널 작성
  - NVIDIA Triton-to-TileIR — Blackwell·CUDA 13.1, ENABLE_TILE=1로 차세대 Tensor Core
  - MIT·멀티벤더(AMD·NVIDIA) — AI 프레임워크 커스텀 연산의 사실상 표준
  source: https://github.com/triton-lang/triton
- category: ai
  title: TensorRT-LLM — NVIDIA GPU LLM 추론 최적화, AutoDeploy·FP4·PD 분리(2026)
  summary: NVIDIA의 오픈소스 LLM 추론 가속 라이브러리. PagedAttention·in-flight batching·FP8/FP4/NVFP4 양자화·speculative decoding(EAGLE-3)·TP/PP/EP/CP 병렬. v1.0은 PyTorch-native 모델 작성+안정 LLM API — vLLM·SGLang·Triton Server·NVIDIA Dynamo와 통합. 2026 AutoDeploy(beta)는 off-the-shelf PyTorch 모델을 컴파일러가 자동 최적화(수동 재구현 불필요). Disaggregated serving(beta)로 prefill·decode GPU 분리. B200 FP4·H100 FP8 네이티브.
  points:
  - Paged KV·in-flight batching·FP4/FP8·speculative decoding — NVIDIA HW 특화
  - AutoDeploy(beta) — PyTorch 모델→추론 최적화 그래프 자동 컴파일
  - vLLM 대비 — NVIDIA GPU·엔터프라이즈 멀티노드·NIM/Triton 생태계 깊이
  source: https://nvidia.github.io/TensorRT-LLM/latest/overview.html
