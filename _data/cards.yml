  title: OD-LLM — 온디바이스 LLM 순차 추천을 위한 태스크 적응형 압축 프레임워크(학술 논문)
  summary: 'OD-LLM은 LLM을 모바일 디바이스에서 순차 추천(Sequential Recommendation)에 사용하기 위해 설계된 최초의 태스크 적응형 압축 프레임워크다. 토큰 레벨 정규화·저랭크 구조 분해(SVD)·점진적 정렬을 통합해 사용자-아이템 상호작용의 시간적 패턴을 보존하면서 모델을 대폭 압축. 기존 범용 양자화(GPTQ·AWQ)와 달리 추천 시스템의 행동 민감성에 맞춤 설계. 프라이버시 보장·실시간 개인화·오프라인 추천을 동시에 달성.

    '
  points:
  - '태스크 적응형: 추천 시스템의 행동 민감성에 맞춘 LLM 압축'
  - '3가지 기법 통합: 토큰 정규화 + SVD 분해 + 점진적 정렬'
  - '프라이버시+실시간: 데이터가 디바이스를 안 떠남, 오프라인 동작'
