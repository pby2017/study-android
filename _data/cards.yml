  title: Augment Code — 40만+ 파일 모노레포를 통째로 이해하는 엔터프라이즈 코딩 에이전트(ISO 42001 인증)
  summary: 'Augment Code는 ''에이전트 자율 실행''보다 ''코드베이스 깊은 이해''에 베팅한 코딩 에이전트다. 40만+ 파일 규모의 레거시 모노레포를 인덱싱해 정확한 컨텍스트를 제공하는 게 핵심이고, ISO/IEC 42001 인증을 받아 규제 산업 엔터프라이즈를 타깃한다. Windsurf가 자율 실행 속도에 강하다면, Augment는 복잡한 레거시 코드베이스에서 AI 정확도가 강점. 규모와 규제가 병목인 조직에 적합하다.

    '
  points:
