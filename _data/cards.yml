  title: GraphRAG(Microsoft) — 지식 그래프로 RAG를 강화, '벡터만으로는 못 잡는 관계'를 추론(오픈소스)
  summary: 'Microsoft GraphRAG는 텍스트에서 지식 그래프를 추출하고 Leiden 알고리즘으로 커뮤니티를 계층화한 뒤, 커뮤니티 요약을 쿼리 시점에 활용하는 구조화 RAG 기법이다. 벡터 유사도만으로는 답할 수 없는 ''여러 문서에 걸친 관계 추론'' 질문에 강점. Neo4j(Cypher 기반 그래프 순회 + 벡터 인덱스 하이브리드)가 프로덕션에서 가장 널리 쓰이는 GraphRAG 백엔드. LazyGraphRAG는 그래프 구축을 쿼리 시점까지 지연시켜 초기 비용을 대폭 절감.

    '
  points:
  - '지식 그래프 + 커뮤니티 요약: 멀티홉 관계 추론 RAG'
  - 'Neo4j: 프로덕션 GraphRAG 표준 백엔드 (Cypher + 벡터)'
  - 'LazyGraphRAG: 그래프 구축을 쿼리 시점까지 지연 → 초기 비용 절감'
  source: https://microsoft.github.io/graphrag/
