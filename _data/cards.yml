- category: ai
  title: Tree of Thoughts (ToT) — 다중 reasoning path 탐색·backtrack, beam search prompting
  summary: 'Tree of Thoughts(Yao et al., NeurIPS 2023)는 Chain-of-Thought의 단일 선형 추론을 tree search로 일반화한 prompting/orchestration 패턴이다. 매 step마다 LLM이 k개 candidate ''thought''를 생성하고, evaluator(LLM-judge 또는 deterministic checker)가 점수를 매긴 뒤 BFS/DFS/beam search로 promising branch만 확장·prune한다. Game of 24에서 CoT 4%→ToT 74%(GPT-4). 2026 실무: frontier reasoning model(GPT-5·Claude extended thinking)이 내부적으로 유사 search를 수행하므로, 투명성·제어·proposer/evaluator 모델 분리가 필요할 때만 explicit ToT. 비용 10~100× CoT — planning·combinatorial·architecture tradeoff에만. CoT first → eval fail 시 ToT escalation이 production-safe 패턴.'
  points:
  - 3 knobs — branching factor k, beam width/depth, evaluator(LLM-judge vs verifier)
  - Search policy — BFS·DFS·best-first·bounded beam(프로덕션 최다)
  - ReAct/LATS와 분리 — ToT=reasoning search, LATS=agent tree+tool, ReAct=single-path loop
  source: https://arxiv.org/abs/2305.10601
- category: ai
  title: Self-Consistency Decoding — CoT 다중 샘플→majority vote, GSM8K +17.9%
  summary: 'Self-Consistency(Wang et al., ICLR 2023)는 CoT prompting에 greedy decode 대신 temperature>0으로 diverse reasoning path N개를 샘플링하고, final answer를 majority vote로 선택하는 decoding strategy다. GSM8K +17.9%, SVAMP +11%, StrategyQA +6.4%. 2025 효율 변형: CISC(Confidence-Informed, ACL 2025) — confidence-weighted vote로 sample 40%↓, RASC(NAACL 2025) — reasoning quality 평가+early stop으로 70%↓, DSC(Difficulty-Adaptive) — easy question은 1-shot·hard만 N-sample. Instructor(validate-after)·Outlines(constrain-during)와 달리 ''추론 다양성→합의'' 패턴. Tree of Thoughts(탐색)와 조합 가능.'
  points:
  - CoT + N samples(temp>0) → extract final answer → majority vote
  - 2025 효율 — CISC(confidence weight)·RASC(early stop)·DSC(difficulty-adaptive)
  - ToT(탐색)·Reflexion(자기비평)과 역할 분리 — SC=answer-level consensus
  source: https://arxiv.org/abs/2203.11171
- category: ai
  title: Chain-of-Thought Prompting — zero-shot·few-shot·Auto-CoT, 중간 추론을 명시하는 기본 패턴
  summary: 'Chain-of-Thought(Wei et al., 2022)는 LLM이 final answer 전 intermediate reasoning step을 출력하게 해 multi-step task 정확도를 10~40%p 올리는 prompting 패턴이다. Zero-shot CoT — ''Let''s think step by step'' 한 줄 trigger, exemplar 불필요·latency 최소(GSM8K 10.4→40.7%). Few-shot CoT — domain-specific worked example로 step 정의·format lock-in. Auto-CoT — question cluster→representative example 자동 선택. DeepSeek R1(투명 CoT stream)과 달리 ''prompt engineering technique'' — 모델 무관·API 호출 1회. Self-Consistency(N-sample vote)·ToT(tree search)·Least-to-Most(decompose)의 기반. production: CoT output을 log/eval에 저장해 reasoning trace debug.'
  points:
  - Zero-shot — trigger phrase 1줄, few-shot — worked example로 domain step 정의
  - Auto-CoT — question clustering→representative exemplar 자동 생성
  - Self-Consistency·ToT·LtM의 기반 — DeepSeek R1(내장 reasoning)과 prompt-level CoT 분리
  source: https://learn.microsoft.com/en-us/dotnet/ai/conceptual/chain-of-thought-prompting
- category: ai
  title: Few-Shot vs Zero-Shot — eval baseline 먼저, example은 측정 후에만 추가
  summary: 'Zero-shot은 instruction만, few-shot은 2~5 input-output example을 prompt에 포함하는 in-context learning(ICL) 방식이다. 2026 production-safe protocol: (1) representative eval set으로 zero-shot baseline 측정 (2) 1→2→3→4 example sweep, peak 이후 decline(''few-shot collapse'') 확인 (3) 도움이 증명될 때만 static few-shot 유지. Zero-shot 장점 — token 절약·model version change에 robust. Few-shot 장점 — format·tone·edge case·custom taxonomy lock-in. 85~95% 필요→few-shot 3~5개, 99%+→fine-tuning. DSPy(자동 optimize)와 달리 ''수동 example curation decision framework''.'
  points:
  - Zero-shot first — eval baseline 없이 4 example 넣지 말 것
  - Non-monotonic — example 수↑가 항상 quality↑ 아님, peak 찾아 stop
  - Dynamic retrieval(Dynamic Few-Shot) — task diversity↑ 시 static→retrieved examples
  source: https://tianpan.co/blog/2026-04-17-zero-shot-vs-few-shot-production-decision
- category: ai
  title: Dynamic Few-Shot Retrieval — query별 embedding 유사 example 선택, static 대비 double-digit↑
  summary: 'Dynamic few-shot는 고정 example 대신 live query와 embedding cosine similarity로 example library에서 k개를 retrieve해 prompt에 주입하는 ICL 기법이다. Static few-shot의 input distribution mismatch·token waste를 줄여 classification·extraction 등 diverse task에서 double-digit quality margin 보고. Production 주의: (1) retrieved example을 system prompt가 아닌 user message 직전에 inject — KV cache on static prefix (2) 3~5 example sweet spot, 10+는 fine-tuning 검토 (3) retrieval quality 별도 eval — bad retrieval > no examples. Embedchain(RAG ingestion)과 달리 ''prompt-level example selection''. Few-Shot vs Zero-Shot 카드의 dynamic escalation path.'
  points:
  - Embedding retrieval — example library→cosine top-k→prompt inject
  - KV cache — static system prompt + dynamic example을 user turn 직전 배치
  - Static few-shot(validation) → dynamic(when diversity exceeds static coverage)
  source: https://tianpan.co/blog/2026-04-12-dynamic-few-shot-retrieval-static-examples-accuracy
- category: ai
  title: Least-to-Most Prompting — decompose→sequential solve, CoT보다 compositional generalization↑
  summary: 'Least-to-Most(Zhou et al., ICLR 2023)는 complex problem을 2-stage로 푸는 prompting 기법: (1) Decomposition — subproblem list 생성 (2) Subproblem Solving — 이전 subproblem answer를 context로 다음 solve. CoT는 demonstration보다 hard한 compositional task에서 generalization 실패 — LtM은 SCAN 76%(CoT 6%), code-davinci-002 99.7%. Plan-and-Execute(agent planner·executor 분리)와 달리 ''single LLM prompt pattern'', training 불필요. Self-Consistency·CoT와 조합 가능. 실무: ETL step chain·multi-file refactor plan·math word problem decomposition.'
  points:
  - Stage 1 decompose → Stage 2 sequential solve(previous answers as context)
  - CoT 대비 — easy-to-hard generalization·compositional task에서 우위
  - Plan-and-Execute(agent) ·ReAct(tool loop)와 분리 — prompt-only decomposition
  source: https://arxiv.org/abs/2205.10625
- category: ai
  title: OpenAI Realtime API — native speech-to-speech, WebRTC/WebSocket·Agents SDK(2026 GA)
  summary: 'OpenAI Realtime API는 audio를 first-class modality로 처리하는 speech-to-speech API다(2026 GA, gpt-realtime-2). STT→LLM→TTS pipeline 없이 단일 session에서 barge-in·turn-taking·tool call·MCP 지원. Transport: WebRTC(브라우저·모바일, ~300-500ms TTFA, ephemeral client secret) vs WebSocket(서버-side orchestration·compliance logging·+80~150ms). POST /v1/realtime/client_secrets로 ephemeral key 발급, Agents SDK RealtimeSession으로 tool·handoff·guardrail 연결. Gemini Live API(Android on-device)와 분리 — OpenAI ecosystem·SIP(beta) telephony·server-side tool mediation.'
  points:
  - Speech-to-speech native — barge-in·turn-taking·tool/MCP in audio session
  - WebRTC(browser direct) vs WebSocket(server mediate) transport 선택
  - Gemini Live(on-device) ·chained VoicePipeline(STT→LLM→TTS)과 역할 분리
  source: https://developers.openai.com/api/docs/guides/voice-agents
- category: ai
  title: LLM API Retry & Exponential Backoff — 429/5xx만 retry, jitter+Retry-After 필수
  summary: 'Production LLM integration의 baseline resilience: retry with exponential backoff + full jitter. Retryable — 429(rate limit)·500/502/503/504·timeout. Non-retryable(fail fast) — 400·401/403·content policy. Config — base 1~2s, multiplier 2×, max 30~60s, full jitter(0~base random), max 3~5 attempts, Retry-After header 우선. Thundering herd 방지 — jitter 없으면 outage 시 모든 client 동시 retry. Portkey(circuit breaker 내장) ·Temporal(durable retry) ·LiteLLM(auto retry)과 달리 ''애플리케이션 레벨 패턴''. Circuit breaker(>10% fail/60s→open) + fallback chain과 3-layer 조합.'
  points:
  - 429/5xx/timeout만 retry — 400/401/403/content policy는 즉시 fail
  - Exponential backoff + full jitter + Retry-After header respect
  - Circuit breaker + fallback chain과 3-layer — Portkey/Temporal은 infra 구현
  source: https://www.learnwithparam.com/blog/retry-patterns-llm-api-errors-production
- category: ai
  title: Skeleton-of-Thought (SoT) — answer skeleton→parallel expand, latency 2.39×↓(ICLR 2024)
  summary: Skeleton-of-Thought(Microsoft+Tsinghua, ICLR 2024)는 LLM sequential decoding latency를 줄이는 data-centric prompting 기법. Stage 1 — answer skeleton(구조 outline) 생성, Stage 2 — 각 skeleton point를 parallel API call 또는 batched decode로 동시 expand. 12 LLM에서 up to 2.39× speed-up, GPT-3.5/4에서 2× 가속+품질 개선 사례. SoT-R(router) — step-by-step reasoning·short answer는 standard decode fallback. Chain-of-Thought(순차 reasoning) ·Tree of Thoughts(search)와 달리 'parallel generation for structured long answers'. asyncio.gather로 point별 parallel API call 구현.
  points:
  - Skeleton outline → parallel point expansion — black-box LLM, model 수정 불필요
  - Up to 2.39× latency↓ — long structured answer(list·report·consulting)에 최적
  - SoT-R router — reasoning-heavy task는 sequential fallback
  source: https://arxiv.org/abs/2307.15337
- category: ai
  title: In-Context Learning — example curation·ordering·3~8 sweet spot, ICL production playbook
  summary: 'In-Context Learning(ICL)은 fine-tuning 없이 prompt 내 demonstration으로 task를 학습하는 LLM emergent capability(Brown et al., 2020)다. Production playbook: (1) relevance — production input distribution과 semantic match (2) quality — label·format·delimiter 일관, edge case 포함 (3) count — 3~8 sweet spot, sweep으로 peak 찾기 (4) ordering — strongest example last(recency bias) (5) dynamic selection — embedding retrieval로 query별 example. Negative demo·noisy example은 accuracy regress. Few-Shot vs Zero-Shot(결정 framework) ·Dynamic Few-Shot Retrieval(구현) ·DSPy(auto optimize)와 역할 분리 — ICL은 ''example design 원칙''.'
  points:
  - 3~8 examples — token/latency vs accuracy trade-off, peak 이후 regress
  - Strongest example last ·consistent format/delimiter ·edge case 포함
  - Dynamic retrieval + offline eval replay + production A/B로 drift monitor
  source: https://byaiteam.com/blog/2025/12/18/few-shot-learning-in-production-design-in-context-examples/
- category: ai
  title: Modern Web Guidance — Chrome 팀의 웹 플랫폼 스킬을 코딩 에이전트에 설치하기
  summary: Chrome Modern Web Guidance는 접근성·성능·보안·브라우저 호환성 지식을 코딩 에이전트가 바로 호출할 수 있는 skills 묶음으로 제공하는 early preview다. `npx modern-web-guidance@latest install` 또는 Vercel `npx skills add GoogleChrome/modern-web-guidance`, Claude Code/Copilot CLI plugin marketplace, Antigravity CLI로 설치한다. 공식 I/O 2026 글은 Baseline과 연결해 목표 브라우저 범위에 맞는 기능·fallback을 고르게 하고, 100개 이상 use case를 계속 업데이트한다고 설명한다. Chrome DevTools for agents와 함께 쓰면 콘솔 로그·네트워크·접근성 트리·성능 audit을 읽고 modern CSS/API 수정까지 이어갈 수 있다. 2026-06-24 GitHub API 기준 Apache-2.0, 1,424★다.
  points:
  - '설치: npx CLI, npx skills, Claude/Copilot plugin marketplace, Antigravity CLI 지원'
  - '내용: 접근성·성능·보안·Baseline 호환성 지식을 에이전트 skill로 패키징'
  - '실무 포인트: 에이전트에게 최신 웹 API 사용 여부를 맡기되 DevTools evidence로 검증'
  source: https://developer.chrome.com/docs/modern-web-guidance
- category: ai
  title: Writing Effective MCP Tools — agent-native 설계, namespacing·pagination·high-signal output
  summary: 'Anthropic "Writing effective tools for AI agents"(2025)는 MCP 도구를 API wrapper가 아니라 agent-native interface로 설계하라고 강조한다. 핵심: (1) verb-noun snake_case 이름·enum으로 입력 제약·description에 concrete example (2) multi-action tool(action 파라미터) 대신 narrow single-purpose tool 분리 (3) pagination·filtering·truncation으로 25k token 응답 상한 (4) uuid·mime_type 대신 name·file_type 등 agent-actionable 필드 반환 (5) namespacing(asana_search vs jira_search)으로 tool selection 정확도↑. MCP Tool Search(on-demand loading) ·Code execution with MCP(programmatic compose)와 조합하면 context bloat 없이 수십 개 도구 운용.'
  points:
  - verb-noun naming + enum + example in description — model tool selection 정확도
  - multi-action tool 분리·pagination/truncation — context 25k token 상한
  - high-signal 필드만 반환 — MCP Tool Search·programmatic calling과 조합
  source: https://www.anthropic.com/engineering/writing-tools-for-agents
- category: ai
  title: Human-in-the-Loop Approval — policy gate·HumanLayer·Permit Access Request MCP
  summary: Production HITL은 "모든 action 승인"이 아니라 action manifest(severity×reversibility)로 high-stakes write만 pause한다. OpenAI Agents SDK needs_approval→RunState.approve/reject, LangGraph interrupt()+PostgresSaver durable checkpointer. Policy layer는 allow/deny/approval_required 3-state+audit. HumanLayer(humanlayer·~11k★)는 require_approval()로 send_email·deploy 같은 high-stakes tool을 Slack·email·web dashboard에서 productized pause. Permit Access Request MCP는 LangGraph+policy engine 위에 agent가 sensitive action을 request→human final decision workflow. Async 202+approval_timeout SLA, side effect는 interrupt 이후 idempotent batch.
  points:
  - action manifest — severity×reversibility, HumanLayer=productized Slack/email channel
  - durable checkpointer(Postgres/SQLite) + interrupt/resume — InMemorySaver dev only
  - Permit Access Request MCP — policy-backed approval, LangChain MCP Adapters 연동
  source: https://www.permit.io/blog/delegating-ai-permissions-to-human-users-with-permitios-access-request-mcp
- category: ai
  title: Agent Graceful Degradation — 4 service level·fallback chain·user disclosure
  summary: 'Graceful degradation은 dependency failure 시 terminal error 대신 reduced-but-truthful answer를 제공하는 설계 모드다. 4 service level: Full(모든 tool healthy) → Reduced(non-critical tool skip/mock) → Fallback(secondary model/cached decision) → Refusal(primary+secondary unavailable). Fallback chain: primary model → secondary provider(different vendor) → cached structured-intent decision → templated refusal. Circuit breaker(>10% fail/60s→open) + semantic quality failure(schema violation·hallucination rate) 감지. User disclosure 필수 — silent degradation은 trust erosion. Per-feature fallback: vision fail→text-only, retrieval fail→no citations, code exec fail→simple summary.'
  points:
  - '4 level: Full→Reduced→Fallback→Refusal — 각 level마다 user disclosure 규칙'
  - 'fallback chain: primary→secondary vendor→cached decision→refusal'
  - circuit breaker + per-feature downgrade — silent failure 금지
  source: https://www.agentpatternscatalog.org/patterns/graceful-degradation/
- category: ai
  title: AI Agent Audit Logging — tool invocation을 first-class event로, append-only storage
  summary: 'Chat-only audit log(input/output)는 agent compliance에 불충분 — EU AI Act Article 12는 tool call·delegation chain까지 기록을 요구한다. First-class audit event: tool name·arguments·return/error·duration·reasoning step link를 단일 trace event로 emit. Write-once storage(S3 Object Lock) + append-only permission — agent runtime account는 delete 불가. Cryptographic chaining(hash chain) + meta-audit trail(reviewer access log). OpenTelemetry AgentTrace(2026) — cognitive/operational/contextual 3-surface taxonomy. SignalVault: "financial systems treat transactions"처럼 agent behavior를 material decision 단위로 capture.'
  points:
  - tool call = first-class event — name·args·result·duration·reasoning step join
  - append-only write-once storage — agent가 자신의 audit trail 수정 불가
  - hash chain + meta-audit + OpenTelemetry AgentTrace 3-surface
  source: https://signalvault.io/blog/ai-audit-logging-agent-era
- category: ai
  title: Session·Harness·Sandbox Separation — append-only log·wake(sessionId)·crash recovery
  summary: 'Long-running agent architecture(Anthropic 2026)는 3 primitive로 분리: Session(append-only event log, authoritative state), Harness(stateless loop, wake(sessionId)로 replay resume), Sandbox(provisioned execution env, uniform tool interface). Crash recovery: failed harness→replacement harness.wake(sessionId)→getEvents() replay→resume at next tool call. Inference-sandbox decoupling: model call은 sandbox provisioning과 병렬(~60% p50 TTFT↓). Horizontal scaling trivial — any harness picks up any session. Trade-off: unbounded log growth→compaction with irreversible decisions. GNAP(git-native) ·AgentOps Replay(hash-chained)과 다른 enterprise-scale 패턴.'
  points:
  - Session(log) ·Harness(stateless) ·Sandbox(execution) — 3 primitive 분리
  - wake(sessionId) + event replay — crash recovery·horizontal scaling
  - inference∥provisioning — TTFT↓, log growth→compaction trade-off
  source: https://agentpatterns.ai/agent-design/session-harness-sandbox-separation/
- category: ai
  title: Zod + LLM Structured Output — TypeScript validation layer, z.toJSONSchema()·safeParse retry
  summary: 'Zod는 TypeScript LLM integration의 single source of truth — schema 1회 정의로 compile-time type + runtime parse 동시 확보. 2026 패턴: (1) Zod schema 정의 (2) z.toJSONSchema()(Zod v4 native)로 provider JSON Schema 생성 (3) OpenAI strict:true / Anthropic tool use로 constrained decoding (4) safeParse() + ZodError detail을 retry prompt에 포함. Vercel AI SDK generateObject()가 provider별 best strategy 자동 선택. Instructor(Python/Pydantic) ·Structured Outputs(provider-level)와 분리 — Zod는 TypeScript app validation layer. Constrained decoding도 logical error·data hallucination은 못 잡으므로 post-validation 필수.'
  points:
  - Zod schema → z.toJSONSchema() → provider strict mode → safeParse() 4-layer
  - safeParse + ZodError retry — constrained decoding 후에도 logical error catch
  - Instructor(Python) ·Structured Outputs(provider)와 역할 분리 — TS app layer
  source: https://techsy.io/en/blog/llm-structured-outputs-guide
- category: ai
  title: AI Agent Error Handling — circuit breaker·validation gate·idempotent saga·budget guardrail
  summary: 'Production agent error handling 5-pattern(Kevin Tan 2026): (1) Circuit breaker — HTTP error뿐 아니라 schema violation·hallucination rate 등 semantic quality failure도 track (2) Validation gate — write tool 전 Pydantic/Zod schema check, destructive tool은 interrupt() (3) Idempotent saga — partial failure 시 rollback, side effect는 validation 통과 후 (4) Budget guardrail — max turns·max tokens·max tool calls hard limit (5) Human escalation — confidence×blast-radius matrix로 agent가 stop deciding. LLM API Retry(429/5xx backoff) ·Graceful Degradation(fallback chain)과 3-layer: retry→degrade→escalate.'
  points:
  - circuit breaker — HTTP + semantic quality failure(schema·hallucination rate)
  - validation gate(write前) + idempotent saga(partial rollback) + budget guardrail
  - 'LLM API Retry ·Graceful Degradation과 3-layer: retry→degrade→escalate'
  source: https://blog.jztan.com/ai-agent-error-handling-patterns/
- category: ai
  title: Context Window Compaction — observation masking vs LLM summarization, multi-pass pipeline
  summary: 'Long-running agent context management(2026 research): observation masking(old tool output→placeholder)가 LLM summarization과 동등 이상 성능·비용 1/10(JetBrains 500 SWE-bench). Multi-pass pipeline: (1) tool result collapse (2) LLM structured summarization (3) truncation last resort. Proactive compaction at 60% budget > reactive at 95%. Anthropic: compaction=high-fidelity distill→new window+recent files. Microsoft Agent Framework: Truncation·SlidingWindow·ToolCallCollapsing·Summarization 4 strategy. Frequent Intentional Compaction(40-60% workflow) ·/context(diagnosis)과 분리 — 이 카드는 technical strategy 선택 framework.'
  points:
  - observation masking ≥ LLM summarization — cost 1/10, trajectory elongation 방지
  - 'multi-pass: tool collapse→summarize→truncate — 60% budget에서 proactive'
  - Frequent Intentional Compaction(workflow) ·/context(diagnosis)과 역할 분리
  source: https://arxiv.org/html/2508.21433v1
- category: ai
  title: Codex enterprise 확장 — Samsung 전사 배포·지식작업 20%·500만 WAU(2026-06)
  summary: OpenAI는 2026년 6월 Codex가 주간 활성 사용자 500만 명을 넘었고, 비개발 지식작업자가 약 20%를 차지하며 개발자보다 3배 빠르게 성장한다고 밝혔다. 같은 달 Samsung Electronics는 한국 전 임직원과 전 세계 DX 부문에 ChatGPT Enterprise·Codex를 제공한다고 발표했다. 핵심은 "대기업도 Codex를 쓴다"가 아니라, 코딩 에이전트가 R&D·제조·마케팅·사내 도구 자동화·리서치·분석·문서까지 넓어질 때 데이터 보호·접근 관리·보안 통제 같은 엔터프라이즈 경계가 먼저 필요하다는 점이다. 한국 주간 활성 사용자는 2026년 2월 1일 이후 약 800% 증가했다고 OpenAI는 밝혔다.
  points:
  - Samsung — 한국 전 임직원 + DX 부문 ChatGPT Enterprise·Codex, 데이터 보호·접근 관리·보안 정책이 전사 배포 핵심
  - 500만+ WAU — 비개발 지식작업 20%, 개발자보다 3배 성장, 리서치·분석·문서·내부 도구가 같은 워크스페이스로
  - 백그라운드 코딩 에이전트 카드와 역할 분리 — 이 카드는 enterprise adoption·비개발 확장 트렌드
  source: https://openai.com/index/codex-for-knowledge-work/
- category: ai
  title: Cursor 병렬 에이전트 — git worktree→Agents Window·/best-of-n·Plan Mode(2.0→3.0)
  summary: Cursor는 2025-10 2.0에서 git worktree로 에이전트 병렬 격리·best-of-N을 내세웠고, 2026-04 3.0(Glass)은 사이드 Composer를 접고 Agents Window(Cmd+Shift+P)로 로컬·worktree·클라우드·SSH 에이전트를 한 표면에서 돌린다. /worktree로 변경 격리, /best-of-n으로 같은 작업을 여러 모델·각자 worktree에 병렬 시켜 최선을 고른다. 공식 베스트 프랙티스는 Plan Mode(Shift+Tab)로 조사→질문→승인 대기 계획을 .cursor/plans/에 저장한 뒤 실행하고, 같은 프롬프트를 여러 모델에 동시에 돌려 품질을 높이는 패턴을 권한다. Conductor·claude --worktree와 같은 worktree 격리 발상을 IDE에 기본 내장한 셈이다.
  points:
  - 2.0→3.0 — worktree 병렬 격리(2.0) → Agents Window·/worktree·/best-of-n(3.0), 클라우드 에이전트는 Agents Window 전용
  - Plan Mode(Shift+Tab) — 코드 전 계획·.cursor/plans/ 저장, @Branch로 컨텍스트 되돌리기·Debug Mode 가설→로깅
  - Cursor Composer 2.5(모델) ·Cursor Tab(자동완성)과 UI/모델 축 분리 — 이 카드는 병렬 에이전트 orchestration
  source: https://cursor.com/changelog/3-0
- category: ai
  title: LLM Batch API — OpenAI vs Anthropic async 50% 할인·rate limit pool 분리
  summary: 'OpenAI·Anthropic Batch API는 동기 chat completion과 별도 async pool로 대량 offline inference를 50% 할인에 처리한다. OpenAI — POST /v1/batches, JSONL input file(최대 50K requests), 24h completion window, sync rate limit과 완전 분리된 batch quota. Anthropic Message Batches — 100K requests/batch, 50% discount, prompt caching과 stack 가능, 결과 29일 보관. 용도: eval suite overnight run, embedding bulk, fine-tuning data generation, log replay. 실시간 user-facing은 sync/stream, batch는 cost-optimized background. OpenAI Realtime API(stream) ·Batch API(async bulk) 역할 분리 — prod UX vs offline compute.'
  points:
  - OpenAI JSONL 50K·24h window ·Anthropic 100K·29d retention·prompt cache stack
  - Sync rate limit pool과 분리 — eval·embedding bulk에 50% 할인
  - User-facing sync/stream vs offline batch — latency vs cost 분리
  source: https://platform.openai.com/docs/guides/batch
- category: ai
  title: LakeFS for Agentic AI — zero-copy branch·agent sandbox·Git-for-data governance
  summary: LakeFS는 object storage 위 Git-like data version control control plane으로, 2026년 Agentic AI용으로 agent별 zero-copy branch·pre-merge validation·immutable commit·agent identity/run ID attribution을 제공한다. 에이전트는 표준 file operation으로 branch-scoped credential workspace에 read/write — custom MCP/SDK 불필요. Parquet·Iceberg·Delta·PDF·이미지 등 structured/unstructured 통합 버전. DVC(Git+LFS artifact) ·Milvus External Collection(lake query)과 달리 "agent가 production data를 안전하게 변경"하는 merge gate·audit trail 레이어.
  points:
  - agent당 zero-copy branch — 실수 격리·seconds rollback·pre-merge hook(schema·row count)
  - commit = immutable data version — debug/audit/replay에 exact input state 재현
  - DVC(artifact versioning) ·Mem0(agent memory)와 역할 분리 — data layer governance
  source: https://lakefs.io/blog/agentic-ai-will-make-or-break-on-the-data-layer-meet-lakefs-for-agentic-ai/
- category: ai
  title: Celery + Redis LLM Inference Queue — GPU worker pool·prefetch=1·broker/backend 분리
  summary: Celery 5.4 + Redis 7.2는 LLM inference를 HTTP gateway에서 decouple하는 production queue 패턴이다. FastAPI가 job을 Redis list/stream에 push, GPU worker는 --pool=solo --concurrency=1 --prefetch=1로 모델 1개만 VRAM에 로드. task_acks_late=True + task_reject_on_worker_lost=True로 worker crash 시 재큐. broker(Redis Streams consumer group)와 result backend를 별도 Redis instance로 분리, result_expires=3600·allkeys-lru. CPU preprocessing queue와 GPU inference queue를 route 분리해 head-of-line blocking 방지. Temporal(durable workflow) ·W&B Launch(experiment queue)와 달리 Python-native inference decoupling.
  points:
  - GPU worker — concurrency=1·prefetch=1·CUDA_VISIBLE_DEVICES pin, gevent=I/O preprocessing
  - Redis Streams > simple list — exactly-once·XACK·consumer group for retry traceability
  - Temporal+AI(durable agent state) ·OpenAI Batch(async provider job)와 역할 분리
  source: https://markaicode.com/architecture/celery-llm-architecture/
- category: ai
  title: KEDA + Redis LLM Autoscaling — queue depth ScaledObject·cold start vs minReplica=1
  summary: KEDA 2.14 Redis scaler는 inference_queue listLength를 polling(15s)해 LLM worker Deployment replica를 1~N으로 autoscale한다. vLLM pending queue(Prometheus scaler) 또는 Redis BLPOP queue depth 중 signal 선택. GPU cold start(모델 load 60~90s+) 때문에 user-facing prod는 minReplicaCount=1 권장 — scale-to-zero는 dev/staging. Karpenter/GKE Cluster Autoscaler와 조합해 pending GPU pod→node provision(~2min). cooldownPeriod=300으로 scale-down thrashing 방지. Celery(queue consumer) ·AI deployment patterns(topology)와 달리 K8s event-driven autoscaling 구현.
  points:
  - 'ScaledObject redis trigger — listName·listLength(예: 5 items/pod)·activationListLength'
  - minReplicaCount=1 for prod — cold start TTFT vs idle GPU cost trade-off, CronTrigger peak pre-warm
  - Celery(worker app) ·Ray Serve(orchestrated serving)와 역 role — infra autoscaling layer
  source: https://agentbus.sh/posts/how-to-autoscale-llm-inference-on-kubernetes/
- category: ai
  title: Runloop Devbox — microVM sandbox·Blueprint·suspend/resume·OpenAI Agents SDK native
  summary: Runloop은 AI agent용 hardware-isolated microVM Devbox를 API-first로 제공한다. Blueprint(Dockerfile-as-code)·Snapshot(point-in-time fork)·Suspend-Resume(idle compute 절감·state 유지)·Network egress policy(per-Devbox allowlist)가 composable primitive. OpenAI Agents SDK native sandbox backend(2026-04) — Blaxel·Cloudflare·Daytona·E2B·Modal·Vercel과 BYO provider. Agent Gateway·MCP Hub로 credential을 devbox 밖에 두고 LLM·tool 접근. E2B(ephemeral microVM·~150ms) ·Daytona(persistent Docker·sub-90ms) ·Agents SDK Sandbox(generic manifest)와 역할 분리 — enterprise devbox·SOC2·10K+ parallel.
  points:
  - Devbox lifecycle — create→shell.exec→snapshot→suspend→resume→shutdown, Docker-in-Docker 지원
  - OpenAI Agents SDK RunloopSandbox — cloud-native, local Docker 불필요, session serialize/rehydrate
  - E2B(microVM ephemeral) ·Daytona(OCI persistent) ·Copilot Sandboxes(IDE)와 sandbox 축 분리
  source: https://docs.runloop.ai/docs/tutorials/openai-agentssdk-runloop
- category: ai
  title: Daytona Sandbox — sub-90ms OCI·persistent agent workspace·2026 closed-source pivot
  summary: Daytona(daytona.io)는 AI agent용 secure elastic sandbox infrastructure다. OCI/Docker-compatible isolated VM, sub-90ms creation, unlimited persistence, snapshot fork·GPU sandbox(H100·RTX PRO). File·Git·LSP·Execute API, per-sandbox network allowlist. Open SWE·pydantic-ai CompositeBackend cloud execution backend. 2026-06 production isolation layer closed-source — legacy daytonaio/daytona OSS repo public 유지·fork 가능, ongoing SDK/docs는 github.com/daytona. E2B(Firecracker microVM) ·Microsandbox(self-host libkrun) ·OpenSandbox(Alibaba K8s)와 역할 분리 — Daytona=managed persistent composable computer·Computer Use desktop, E2B/Microsandbox=hardware isolation self-host option.
  points:
  - daytona.create() — Python/TS SDK, snapshot fork·GPU·mid-execution pause/resume
  - 2026 closed-source — isolation blueprint 공개 방지, legacy OSS repo fork·self-host 경로 유지
  - E2B(microVM) ·Microsandbox(libkrun) ·OpenSandbox(K8s credential vault)와 축 분리
  source: https://www.daytona.io/dotfiles/updates/daytona-is-going-closed-source
- category: ai
  title: LLM Load Testing — TTFT·ITL·TPS·soak test, k6/Locust 한계와 LLM Locust·GenAI-Perf
  summary: LLM load test는 HTTP latency가 아니라 TTFT(Time to First Token)·ITL(inter-token latency)·TPS(tokens/s)·cache warm/cold 분리·soak(4h+)가 핵심이다. k6(SSE·Grafana CI)와 Locust(GIL bottleneck on tokenization)는 LLM-native metric이 없어 total response time만 재면 "통과했지만 신호 없음". LLM Locust(TrueFoundry, Locust extension) — streaming TTFT/TPS native. NVIDIA GenAI-Perf — Triton/vLLM/NIM backend inference layer. vLLM bench — server canonical. production-representative prompt distribution(길이·multi-turn) 없으면 saturation 예측 실패. Meticulous(frontend E2E) ·Claw-Eval(agent eval)과 역할 분리 — inference throughput·latency SLO.
  points:
  - Metric — TTFT(user-perceived) ·ITL(stream consistency) ·TPS(GPU saturation) ·soak 4h+ for memory leak
  - Tool — LLM Locust(streaming native) ·GenAI-Perf(self-host) ·k6+xk6-sse(infra layer) ·vLLM bench
  - Meticulous(UI replay) ·Inspect AI(agent eval)와 역할 분리 — LLM serving capacity planning
  source: https://valuestreamai.com/blog/load-testing-ai-applications-2026
- category: ai
  title: Delta Lake Catalog-Managed Tables — Unity Catalog commit·AI Gateway·Iceberg 정렬(4.1.0)
  summary: Delta Lake 4.1.0 catalog-managed tables는 commit coordination을 filesystem→catalog(Unity Catalog 0.4.0)로 이동 — inline commit·faster query planning·multi-table transaction boundary. delta.feature.catalogManaged=supported로 opt-in. 2026 Databricks Unity AI Gateway — models·agents·tools·MCP runtime governance. Predictive optimization(AI-driven OPTIMIZE/VACUUM/ANALYZE) GA on managed tables. Iceberg v3·Managed Iceberg·multimodal FILE type(Beta). DVC(data artifact Git) ·LakeFS(agent branch) ·Milvus External Collection(vector on lake)와 달리 Delta+Unity=enterprise lakehouse catalog+AI governance stack.
  points:
  - Catalog commits — Unity Catalog = source of truth, skip cloud storage metadata latency
  - Unity AI Gateway(2026) — model·agent·tool·MCP runtime governance on same catalog
  - DVC ·LakeFS ·HuggingFace Datasets v5(Iceberg read)와 역할 분리 — Delta catalog-managed OLAP
  source: https://delta.io/blog/2026-02-02-delta-catalog-managed-tables
- category: ai
  title: AI Pipeline Orchestration 비교 — Temporal·Prefect·Flyte·Dagster·Airflow·n8n 역할 분리(2026)
  summary: '2026 AI pipeline orchestration은 "에이전트 프레임워크" vs "durable execution 인프라" vs "데이터 자산 DAG" 3층으로 나뉜다. Temporal — Workflow/Activity/Signal, OpenAI Agents SDK·Google ADK 공식 통합, CQRS durable execution 인프라. Prefect — Python @flow/@task, Pydantic AI PrefectAgent state recovery. Flyte 2 — pure Python asyncio agent runtime, self-healing checkpoint. Dagster — @asset 데이터 자산 1등 시민, dbt native. Airflow Common AI Provider — Pydantic AI HookToolset·350+ hook. n8n — 400+ integration 로우코드, LangChain AI node. 선택: agent state machine→Flyte/Temporal, Python ML team→Prefect/ZenML, data asset lineage→Dagster, hook ecosystem→Airflow, non-dev automation→n8n.'
  points:
  - Temporal/Prefect/Flyte — durable agent execution(retry·resume·human gate), framework 아님 infra
  - Dagster/ZenML/Kubeflow — ML/data asset pipeline, agent fan-out budget limit
  - n8n/Apache Airflow — integration breadth vs Python-native, 개별 카드와 이 카드=선택 framework
  source: https://temporal.io/blog/from-agent-zoo-to-agent-orchestra-temporal-agentic-control-plane
- category: ai
  title: Mobile MCP — Android/iOS 기기를 에이전트 도구로 여는 MCP 서버(5.3k★)
  summary: mobile-next/mobile-mcp는 Android 에뮬레이터·실기기와 iOS 시뮬레이터·실기기를 MCP 도구로 노출하는 Apache-2.0 서버다. 에이전트는 모바일 화면을 비전 모델에만 맡기지 않고 접근성 트리, 화면 좌표, 스크린샷 fallback을 함께 써서 앱 실행·종료·설치·삭제, 화면 요소 열람, 탭·롱프레스·스와이프·텍스트 입력 같은 조작을 수행한다. Claude Code, Codex, Gemini CLI, Cursor, Copilot, Goose 등에는 `npx @mobilenext/mobile-mcp@latest` 형태로 붙인다. 실무 포인트는 모바일 QA를 "테스트 코드 생성"만으로 보지 말고, 실제 기기를 LLM 도구 표면으로 열어 관찰→행동→증거 수집을 반복하게 하는 것이다. 2026-06-25 GitHub API 기준 5,269★, Apache-2.0, 최신 push는 2026-06-15다.
  points:
  - '도구 표면: list devices/apps, launch/install/uninstall, screenshot, element list, tap/swipe/type'
  - 'Android 경로: ADB + UI Automator, iOS 경로: native accessibility + WebDriverAgent'
  - '학습 포인트: screenshot-only 자동화보다 접근성 트리와 deterministic tool call을 우선'
  source: https://github.com/mobile-next/mobile-mcp
- category: ai
  title: mobile-use — 자연어로 실제 Android 앱을 조작하는 오픈소스 모바일 에이전트(2.6k★)
  summary: minitap-ai/mobile-use는 자연어 명령으로 Android/iOS 앱 UI를 조작하는 Apache-2.0 모바일 에이전트다. README 기준 Android 실기기·에뮬레이터와 iOS 시뮬레이터를 지원하고, UI-aware navigation, 앱 데이터 스크래핑, JSON 같은 구조화 출력, OpenAI·Google·xAI·OpenRouter·MiniMax 등 모델 설정을 제공한다. Android 빠른 실행은 USB 디버깅이 켜진 기기나 에뮬레이터를 Docker 스크립트로 붙이는 방식이다. 기존 agent-device/Mobilerun 카드가 "테스트 검증 도구 선택"에 초점이었다면, 이 카드는 자연어 작업을 실제 모바일 앱 행동으로 바꾸는 agent runtime 패턴을 보여준다. 2026-06-25 GitHub API 기준 2,624★, Apache-2.0, 최신 push는 2026-06-24다.
  points:
  - '자연어→모바일 UI 행동: 메시지 전송, 앱 탐색, 데이터 추출 같은 실제 앱 흐름 수행'
