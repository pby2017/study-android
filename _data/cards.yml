  - category: ai
    title: "Code Mode(Cloudflare) — MCP 도구를 'TypeScript API'로 바꿔 LLM에게 코드로 호출하게 하기"
    summary: >
      Cloudflare가 제안한 패턴으로, MCP 도구를 LLM에게 직접 노출해 'tool call'을 시키는 대신
      도구 스키마를 doc 주석 달린 TypeScript API로 변환한 뒤 LLM이 그 API를 호출하는 코드를 짜게 한다.
      근거는 "LLM은 tool call보다 코드를 훨씬 많이 학습했다"는 것 — tool 호출보다 코드 작성을 더 잘한다는 가정이다.
      여러 도구를 한 번에 엮어 호출해 왕복 횟수·토큰 낭비를 줄이며, 생성된 코드는 컨테이너가 아니라 V8 isolate 샌드박스(Worker Loader API)에서 수 ms 만에 띄워 실행한다.
    points:
      - "Agents SDK가 MCP 서버 스키마를 가져와 TypeScript API(doc 주석 포함)로 변환 → 에이전트엔 '그 코드를 샌드박스에서 실행하는 도구' 하나만 준다"
      - "직접 tool call 대신 코드로 도구를 엮어 호출 → 여러 단계를 한 번에 처리해 왕복·토큰 절감(글은 정량 %는 제시 안 함, 정성적 주장)"
      - "샌드박스는 컨테이너가 아닌 V8 isolate — 수 ms·수 MB로 기동(Worker Loader API). 저자 Kenton Varda·Sunil Pai, 2025-09-26 공개"
    source: "https://blog.cloudflare.com/code-mode/"
  - category: ai
    title: "에이전트 팀으로 C 컴파일러 짜기(Anthropic) — 병렬 자율 에이전트 '하네스'를 설계하는 실전 교훈"
    summary: >
      Anthropic 연구원 Nicholas Carlini가 Claude 에이전트 16개를 동시에 돌려, Linux 6.9를 x86·ARM·RISC-V에서 빌드하는
      10만 줄짜리 Rust C 컴파일러를 만든 실험 기록이다(약 2,000세션·약 $20,000 소요). 핵심 교훈은 도구 이름이 아니라
      '하네스(작업 환경)'를 어떻게 설계하느냐에 있다. 검증기(verifier)가 거의 완벽해야 하며 그렇지 않으면
      "Claude가 엉뚱한 문제를 푼다". 또 Claude는 시간 감각이 없어("can't tell time") 방치하면 진척 대신 테스트만
      몇 시간씩 돌리므로, 1%·10% 무작위 샘플을 도는 --fast 옵션으로 회귀를 빨리 잡게 했다.
    points:
      - "검증기가 곧 목표 — \"task verifier가 거의 완벽하지 않으면 Claude는 엉뚱한 문제를 푼다\". 기능 추가가 기존 동작을 자주 깨뜨려 결국 CI를 붙임"
      - "병렬화: 테스트가 많이 깨질 땐 각 에이전트가 하나씩 집어 쉽지만, 단일 Linux 빌드는 서로 덮어써 충돌 → GCC를 'known-good 오라클'로 실패 파일 격리"
      - "하네스 위생: 출력 범람 막으려 파일로 로깅·에러는 grep으로 찾게 표시, 작업 점유는 current_tasks/에 파일을 써서 잠금(git이 충돌 시 다른 작업 고르게 강제)"
    source: "https://www.anthropic.com/engineering/building-c-compiler"
  - category: ai
    title: "서브에이전트 4가지 패턴(Philipp Schmid) — '메인 에이전트가 쥔 통제권' 순으로 줄 세우기"
    summary: >
      구글 딥마인드 Philipp Schmid가 2026-05-05에 정리한, 멀티에이전트를 짤 때 고를 수 있는 4가지 패턴이다.
      메인 에이전트가 서브에이전트의 생애주기를 얼마나 쥐고 있느냐(통제 수준) 순으로 배열했고,
      그에 따라 메인의 역할도 호출자→디스패처→코디네이터→감독자로 바뀐다. 핵심 조언은
      "무조건 패턴 1부터 시작하라" — 멀티에이전트처럼 보이는 작업 대부분은 잘 짠 인라인 도구 호출 하나로 끝나며,
      위로 올라갈수록 더 센 모델이 필요하다.
    points:
      - "패턴1 인라인 툴: 서브에이전트를 도구 호출 하나로 부르고 결과를 받음 — 리서치·코드리뷰·테스트 생성 같은 자기완결 작업"
      - "패턴2 팬아웃: 여러 서브에이전트를 동시에 띄우고 나중에 결과를 모음 — 서로 의존 없는 독립 작업의 병렬화"
      - "패턴3 에이전트 풀: 장수명 서브에이전트들과 메시지를 주고받으며 다단계 협업 / 패턴4 팀: 서브들끼리 직접 대화하고 메인은 역할만 세팅 후 빠짐 — 조정 로직이 한 에이전트 한계를 넘을 때만"
    source: "https://www.philschmid.de/subagent-patterns-2026"

