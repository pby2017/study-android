  - '무제한은 총 사용량 기준이며 개발자별 시간당 포함량은 플랜별로 다름; 추가 사용 리뷰는 관리자가 켜고 예산 상한을 설정할 수 있음'
  source: https://www.coderabbit.ai/pricing
  sources:
