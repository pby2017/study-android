  title: ColPali — OCR 없이 문서 이미지를 직접 검색, VLM+ColBERT MaxSim으로 레이아웃·표·차트 포함 임베딩
  summary: 'ColPali는 VLM(PaliGemma-3B 등)으로 문서 페이지를 이미지 그대로 인덱싱하는 멀티모달 검색 기법이다. OCR·레이아웃 분석·텍스트 추출 파이프라인 불필요. 페이지를 이미지 패치로 분할 → 각 패치를 128차원 멀티벡터 임베딩 → ColBERT late-interaction(MaxSim)으로 쿼리 토큰과 패치 간 세밀한 유사도 계산. ViDoRe 벤치마크에서 텍스트 기반 검색+OCR 파이프라인 상회. Qdrant·Milvus·Vespa 등 벡터DB와 통합. 표·차트·수식·레이아웃이 많은 문서(재무·법률·의료)에서 기존 RAG 대비 검색 품질 획기적 개선.

    '
  points:
  - 'OCR 불필요: 페이지 이미지 직접 임베딩'
  - 'ColBERT MaxSim: 패치↔쿼리 토큰 세밀 매칭'
  - 'ViDoRe 1위: 기존 텍스트+OCR 파이프라인 상회'
  source: https://arxiv.org/html/2407.01449v4
