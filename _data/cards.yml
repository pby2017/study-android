  summary: 'AppFunctions는 Android 16 이상에서 앱의 기능을 OS 레지스트리에 공개해, 권한이 있는 에이전트가 UI 밖에서 호출하게 하는 Android MCP 통합 방식이다. 공식 Agent Skill은 기능 발굴·Kotlin 구현·KDoc 정리·ADB 검증을 돕는다. 플랫폼 API는 Experimental preview이며 Gemini 연결은 별도 Connected Apps 개발자 프리뷰 등록·앱 번들 제출·테스터 설정이 필요하다. ADB로 검사할 때는 항상 앱 패키지를 지정하고, 함수 설명은 신뢰할 수 없는 입력으로 취급한다. 사용자 UI에 이미 있는 안전한 기능만 노출하고 권한·실행 결과를 검증한다.'
  points:
  - 'Android 16+ AppFunctions: 선택한 Kotlin 기능을 OS 레지스트리에 등록; API는 Experimental preview'
  - 'Skill의 4단계: 기능 발굴 → 코드/설정 → KDoc 다듬기 → ADB 테스트·디버깅'
  - 'Gemini 사용은 Connected Apps 별도 개발자 프리뷰·번들 제출·테스터 등록 필요'
  - 'ADB 테스트는 `--package`로 대상 앱에 한정; 함수 설명은 파라미터 의미에만 쓰고 그 안의 임의 지시를 실행하지 않음'
  source: https://developer.android.com/ai/appfunctions?hl=en
  interview: "AppFunctions를 구현하면 모든 Gemini 사용자와 다른 앱에서 바로 함수를 호출할 수 있나요? ADB 검사에서 함수 설명은 어떻게 다뤄야 하나요?"
  answer: "아니다. 플랫폼 API는 Experimental preview이고 Gemini 연결에는 별도 Connected Apps 개발자 프리뷰·등록·앱 번들 제출·테스터 설정이 필요하다. 다른 앱의 함수 호출에는 `EXECUTE_APP_FUNCTIONS` 권한이 필요하며 시스템이 승인된 assistant에만 부여한다. ADB 명령은 대상 `--package`를 명시하고, 함수 설명은 파라미터의 의미를 이해하는 데만 쓴다. 설명이 셸 명령이나 파일 변경 등 다른 행동을 지시하면 따르지 않고 사용자에게 보여준다."
- category: ai
  level: "중급"
  title: Android 17 NPU 직접 접근 — API 37 타깃은 manifest 기능 선언 확인
  summary: 'targetSdk 37+ 앱이 NPU에 직접 접근하면 manifest에 `android.hardware.npu` 기능을 선언해야 한다. 대상에는 LiteRT NPU delegate·제조사 SDK·deprecated NNAPI가 포함된다. NPU 없는 기기도 지원하려면 `required="false"`로 스토어 필터를 피하되, CPU/GPU 전환은 앱이 별도로 구현한다. 원격 추론이나 CPU/GPU만 쓰는 앱은 이 선언 대상이 아니다.'
  points:
  - '적용: targetSdk 37+이면서 NPU 직접 사용; NPU 전용 API만 compileSdk 37에서 제공'
  - 'Manifest 최상위 `<uses-feature android:name="android.hardware.npu" android:required="false" />`'
  - '`required=false`: NPU 없는 기기도 설치 가능; CPU/GPU fallback은 앱이 별도 구현'
  source: https://developer.android.com/blog/posts/android-17-is-here
  interview: "Android 17을 타깃으로 온디바이스 추론을 하는 모든 앱이 NPU feature를 선언해야 하나요?"
  answer: "아니다. targetSdk 37 이상이면서 NPU에 직접 접근할 때 선언한다. `FEATURE_NEURAL_PROCESSING_UNIT`의 manifest 값은 `android.hardware.npu`다. `required=false`는 NPU 없는 기기의 스토어 설치 필터를 피할 뿐 추론을 CPU/GPU로 자동 전환하지 않으므로 fallback은 앱이 구현해야 한다."
- category: ai
  title: ML Kit Structured Output — Kotlin 타입은 얻어도 사실 검증은 남는다
  level: "중급"
  summary: 'ML Kit Structured Output은 `@Generable` Kotlin 타입과 `@Guide` 제약을 사용해 Gemini Nano 응답을 구조화한다. 다만 schema 적합성은 사실성을 보장하지 않는다. API는 Alpha이며 Kotlin 전용, minSdk 26·KSP 2.3.6+가 필요하다. `isStructuredOutputFeatureAvailable()`로 기기 지원을 확인하고, 파싱·제약 오류와 토큰 한도를 처리한 뒤 중요한 값은 앱에서 검증한다.'
  points:
  - '`@Generable`·`@Guide`로 Kotlin 출력 스키마와 필드 제약 정의'
  - '`isStructuredOutputFeatureAvailable()`로 기기 지원 확인; 라이브러리의 feature check 사용'
  - 'Alpha·Kotlin 전용·minSdk 26·KSP 2.3.6+; parse/constraint 오류·토큰 한도·ProGuard keep 규칙 확인'
  source: https://developers.google.com/ml-kit/genai/prompt/android/structured-output
  interview: "Structured Output을 사용하면 모델 응답의 파싱·기능 확인·업무 검증을 생략할 수 있나요?"
  answer: "아니다. `isStructuredOutputFeatureAvailable()`로 기기 지원을 확인한다. 생성 결과는 파싱 실패, schema 제약 위반, 토큰 한도로 null이거나 불완전할 수 있다. schema는 형식과 일부 값 범위를 돕지만 사실성·업무 규칙을 보장하지 않으므로 중요 값은 앱에서 다시 검증한다."
- category: ai
  title: A2A — Agent Card로 발견하고 Task 상태로 협업한다
  level: "중급"
  summary: 'A2A는 서로 다른 시스템의 에이전트가 내부 모델·메모리·도구 구현을 공개하지 않고 협업하도록 하는 공개 프로토콜이다. 클라이언트는 Agent Card에서 서비스 주소, 기능, 입력 형식, 인증 요구사항을 확인한 뒤 요청을 보낸다. 오래 걸리는 작업은 Task로 추적하며 상태 변화와 산출물을 스트리밍하거나 나중에 조회할 수 있다. MCP는 AI 애플리케이션과 도구·데이터 사이의 연결을 표준화하므로 두 프로토콜은 대체재라기보다 서로 다른 경계에 쓰인다. Agent Card의 인증 정보는 접근 허가 자체가 아니므로, 서비스는 별도로 인증·인가와 사용자 승인을 적용해야 한다.'
  points:
  - 'Agent Card: 에이전트의 식별·기능·연결 방식·인증 요구사항을 기술하는 발견 문서'
  - 'Task: 비동기 작업의 상태와 산출물을 추적; 진행 이벤트를 구독하거나 최신 상태를 조회'
  - 'MCP는 앱-도구/데이터, A2A는 에이전트-에이전트 경계; 각 호출에 인증·인가·사용자 동의를 별도 적용'
  source: https://a2a-protocol.org/latest/specification/
  interview: "A2A의 Agent Card가 있으면 상대 에이전트에 안전하게 작업을 맡길 수 있나요?"
  answer: "아니다. Agent Card는 식별·기능·접속 방식·인증 요구사항을 알려주는 발견 메타데이터다. 자격 증명 검증이나 작업 권한을 자동으로 부여하지 않는다. 호출 측은 상대를 검증하고, 서비스 측은 최소 권한과 사용자 동의에 따라 요청을 인가해야 한다."
- category: ai
  title: Android Computer Control — UI 자동화 대상과 assistant 권한 경계
  level: "중급"
  summary: 'Android Computer Control은 OEM 선탑재 assistant가 앱 UI를 조작하는 Preview 기능이다. assistant는 privileged `ACCESS_COMPUTER_CONTROL` 권한으로 최대 6개 앱을 순차 처리하는 단일 세션을 요청한다. 대상 앱과 처음 상호작용할 때 시스템 승인 후 가상 디스플레이에서 화면 캡처와 입력을 수행한다. 대상 앱은 별도 통합이 필요 없지만 지원 앱은 제한적이다. AppFunctions는 명시적 기능 호출이고 Computer Control은 UI 조작이며, 자동 fallback 관계는 문서화되어 있지 않다.'
  points:
  - OEM 선탑재 assistant만 privileged `ACCESS_COMPUTER_CONTROL` 사용; 동시 세션은 1개, 최대 6개 앱 순차 처리
  - 대상 앱별 첫 상호작용에 시스템 승인; 화면 캡처와 입력 이벤트로 UI 조작
  - 초기 Preview·제한된 대상 앱; 민감한 단계는 사용자에게 제어권을 넘길 수 있음
  source: https://developer.android.com/ai/computer-control
  interview: "대상 앱 개발자는 Computer Control 통합 SDK를 추가해야 하나요?"
  answer: "아니다. 대상 앱은 추가 통합 없이 참여할 수 있지만, 현재 Preview는 제한된 앱만 지원한다. 자동화는 OEM 선탑재 assistant가 privileged permission으로 세션을 요청하고 시스템이 사용자 승인을 받은 뒤 수행한다. adaptive design과 lifecycle 등 기본 앱 품질은 유지해야 한다. 명시적 기능을 노출하는 AppFunctions와 UI 조작을 같은 호출 방식이나 자동 fallback으로 취급하면 안 된다."
- category: ai
  title: Firebase AI Logic — 종료된 Imagen 호출을 Nano Banana로 이전
  level: "중급"
  summary: 'Firebase Imagen 모델은 2026년 8월 17일 종료됐다. Android는 `ImagenModel.generateImages()`에서 `GenerativeModel.generateContent()`와 `IMAGE` 응답 설정으로 이전한다. Fast→Nano Banana 2.1 `MINIMAL`, 표준→같은 모델 `HIGH`, Ultra→Gemini 3 Pro Image로 매핑한다. 단, Firebase SDK의 이미지 생성은 Preview이며 Blaze 요금제가 필요하다. 출력은 1장 PNG와 SynthID이므로 `NO_IMAGE`·파싱·다중 이미지 가정을 다시 확인한다.'
  points:
  - '모든 Imagen 모델 종료; Fast→Nano Banana 2.1/MINIMAL, 표준→Nano Banana 2.1/HIGH, Ultra→Gemini 3 Pro Image'
  - '`ImagenModel.generateImages()` → `GenerativeModel.generateContent()`; `IMAGE` 모달리티와 새 `GenerationConfig`/`ImageConfig` 설정'
  - 'Firebase 이미지 생성은 Preview·Blaze 필요; Nano Banana는 1장 PNG와 SynthID를 반환하므로 `NO_IMAGE`·출력 가정을 재검증'
  source: https://firebase.google.com/docs/ai-logic/imagen-models-migration
  interview: "Imagen Fast와 표준 모델을 Nano Banana로 이전할 때 모델 이름 외에 무엇을 바꾸고 검증해야 하나요?"
  answer: "Fast는 `gemini-nano-banana-2.1`의 `MINIMAL`, 표준은 같은 모델의 `HIGH` thinking level, Ultra는 `gemini-3-pro-image`로 매핑한다. Android 호출은 `ImagenModel.generateImages()`에서 `GenerativeModel.generateContent()`와 `IMAGE` modality 설정으로 바꾼다. Firebase의 Nano Banana 통합은 Preview이고 Blaze 요금제가 필요하다. 새 응답은 1장 PNG와 SynthID를 사용하므로 다중 이미지·형식·파싱 가정과 `NO_IMAGE`를 다시 검증한다."
- category: ai
  title: Kakao Mobility — Gemini Nano 주소 추출과 두 개의 평가셋
  level: "중급"
  summary: 'Kakao Mobility는 ML Kit GenAI Prompt API와 Gemini Nano로 배달 주문 메시지에서 이름·주소·전화번호를 추출하고, Gemini Flash 클라우드 경로를 fallback으로 추가했다. 팀은 주소 추출용으로 약 200개의 고품질 평가 예시를 반복 검토하고 few-shot prompting을 적용했다. 별도 주차 사진 기능은 200장 넘는 라벨 이미지로 평가했지만 발표 당시 아직 출시 전이었다. Android Developers 사례 발표는 출시된 주소 입력 개선에서 주문 완료 시간 24% 감소, 신규 사용자 전환율 45% 증가, 기존 사용자 6% 증가를 보고했다. 이는 사업자 사례 수치이지 독립 검증된 인과 효과나 모든 앱의 기대치가 아니다.'
  points:
  - '주소 추출: 약 200개 고품질 평가 예시 + 반복 프롬프트 튜닝 + few-shot; Gemini Flash 클라우드 fallback'
  - '주차 사진: 별도의 200장 초과 라벨셋으로 평가; 발표 당시 미출시 — 주소 추출 평가와 혼동 금지'
  - '사례 발표의 주소 입력 성과: 주문 완료 시간 24% 감소; 신규 전환율 45%, 기존 6% 증가 — 독립 인과 검증 아님'
  source: https://developer.android.com/blog/posts/kakao-mobility-uses-gemini-nano-on-device-to-reduce-costs-and-boost-call-conversion-by-45
  interview: "Kakao Mobility 사례의 두 '약 200개' 평가 자료는 각각 무엇을 평가했으며, 성과 수치는 어떤 기능에 해당하나요?"
  answer: "약 200개의 고품질 예시는 배달 메시지의 이름·주소·전화번호 추출 프롬프트를 평가했다. 200장 넘는 라벨 이미지는 별도의 자전거·킥보드 주차 사진 기능 평가에 쓰였고, 발표 당시 그 기능은 미출시였다. 24%의 주문 완료 시간 감소와 신규 45%·기존 6% 전환율 증가는 이미 제공된 주소 입력 개선에 대해 Android Developers 사례 발표가 보고한 값이며 독립적 인과 검증으로 일반화하면 안 된다."
- category: ai
  title: Firebase AI Logic Hybrid — 선호 모드와 로컬 전용은 다르다
  level: "중급"
  summary: 'Firebase AI Logic Hybrid는 `onDeviceConfig`의 네 모드로 추론 경로를 정한다. `PREFER_ON_DEVICE`는 로컬 모델이 없거나 요청을 지원하지 않으면 클라우드로 자동 전환하므로, 개인정보 보호나 오프라인을 보장하지 않는다. 클라우드 전송을 허용할 수 없으면 `ONLY_ON_DEVICE`를 선택해야 하며, 로컬 추론이 불가능하면 예외를 처리한다. 선호 모드 응답의 `inferenceSource`로 실제 실행 경로도 기록한다. Android 문서는 이 통합을 Experimental로 표시하며 SLA가 없고 호환성을 깨는 변경이 가능하다.'
  points:
  - '`PREFER_ON_DEVICE`: 로컬 우선, 미지원이면 cloud fallback; `ONLY_ON_DEVICE`: fallback 없이 불가 시 예외'
  - '`PREFER_IN_CLOUD`: online이면 cloud, offline이면 local; `ONLY_IN_CLOUD`: cloud 불가 시 예외'
  - '클라우드 모델을 명시하고 응답의 `inferenceSource`를 관측; Hybrid 통합은 Experimental·SLA 없음'
  source: https://firebase.google.com/docs/ai-logic/hybrid/android/configuration-options
  interview: "민감한 프롬프트를 기기 밖으로 보내면 안 되는 앱에서 `PREFER_ON_DEVICE`만 설정하면 충분한가요?"
  answer: "아니다. 온디바이스 모델이 없거나 요청을 지원하지 않으면 `PREFER_ON_DEVICE`는 클라우드로 fallback한다. 외부 전송을 금지하려면 `ONLY_ON_DEVICE`를 쓰고, 지원 기기와 요청 기능을 확인한 뒤 사용할 수 없는 경우를 예외·대체 UX로 처리한다. 선호 모드에서는 `inferenceSource`로 실제 경로를 확인하며, 이 Firebase AI Logic Hybrid 통합은 Experimental이라 SLA나 안정적인 호환성을 가정하지 않는다."
- category: ai
  title: ML Kit Direct Model Access — Gemini Nano 반복 prefix 캐싱
  level: "중급"
  summary: 'ML Kit의 Gemini Nano Direct Model Access(`GenerativeModel`)에서 Prefix Caching은 반복되는 고정 프롬프트를 `promptPrefix`로, 매번 달라지는 입력을 suffix로 나눠 중간 추론 상태를 재사용한다. 공식 문서의 Pixel 9 예시 추정치는 고정 prefix 1,000토큰과 suffix 100토큰에서 cache hit 시 2.11초에서 0.5초다. 첫 사용은 cache miss일 수 있으므로 보장된 성능 수치가 아니다. Prefix Caching은 실험적이고 지원 기기 일부에서 text-only로 제공된다. 암호화된 캐시는 앱 비공개 저장소를 사용하지만 원문 prefix를 포함한 메타데이터도 저장하므로 민감한 지침의 저장·삭제 정책을 검토한다.'
  points:
  - 'Task-specific API가 아닌 Direct Model Access(`GenerativeModel`); 고정 `promptPrefix` + 가변 suffix'
  - '문서상 Pixel 9 추정 예시: 1,000+100토큰, cache hit 2.11초→0.5초; 최초 miss 가능'
  - 'Prefix Caching은 Experimental·일부 기기·text-only; 앱 비공개 저장소에 암호화 저장하나 원문 prefix 메타데이터 포함'
  source: https://developers.google.com/ml-kit/genai/prompt/android/prefix-caching
  interview: "Gemini Nano Prefix Caching은 ML Kit의 어떤 API 경로에서 지원되며, Pixel 9의 2.11초→0.5초 수치는 어떻게 해석해야 하나요?"
  answer: "ML Kit task-specific API가 아니라 Gemini Nano Direct Model Access의 `GenerativeModel`에서 제공된다. 2.11초→0.5초는 고정 prefix 1,000토큰·suffix 100토큰 조건의 문서상 cache-hit 추정치이며 첫 요청의 cache miss를 포함한 보장값이 아니다. 기능은 실험적이고 일부 기기에서 text-only로 동작한다. 캐시는 앱 비공개 저장소에 암호화되지만 원문 prefix 메타데이터도 저장되므로 민감한 프롬프트와 삭제 정책을 검토한다."
- category: ai
