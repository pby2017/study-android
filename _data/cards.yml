  - 'ACI: 채널별 메시지를 공통 대화 형식으로 정규화해 기존 에이전트에 전달하고 응답을 돌려보냄'
  - 'Android 푸시: 서버 SDK/REST API와 FCM 사용; Inbox가 필요하면 REST API로 UI를 직접 구현'
  - '보안 경계: Novu Secret key는 모바일 앱이 아니라 백엔드에 보관'
  source: https://docs.novu.co/platform/build-with-ai/mcp
  interview: "Android 앱에서 Novu의 AI 에이전트 대화를 쓰려면 Secret key와 Inbox 화면을 어디서 처리해야 하나요?"
  answer: "Secret key는 전체 환경 접근 권한을 가지므로 백엔드에만 둔다. 백엔드는 Novu SDK나 REST API로 워크플로를 실행하고 FCM 토큰에 푸시를 보낼 수 있다. 현재 Novu는 네이티브 Android 클라이언트 SDK나 기본 Inbox UI를 제공하지 않으므로 앱 안의 대화함이 필요하면 Inbox REST API를 연결해 직접 구현한다. 에이전트의 모델·추론 로직은 별도로 구성한다."
- category: ai
  title: 'Firebase Remote Config — Android AI 설정 실험과 서버 모델 라우팅'
  level: "중급"
  summary: 'Firebase Remote Config는 앱이나 백엔드의 매개변수를 원격으로 바꾼다. Android 클라이언트 템플릿으로 공개 가능한 모델 ID·프롬프트 변형을 가져와 A/B 테스트할 수 있고, 서버 템플릿은 Admin SDK로 백엔드의 모델·프롬프트 선택에 쓴다. 두 템플릿은 SDK와 타깃 조건이 다르다. 클라이언트에 전달된 값은 사용자가 볼 수 있으므로 비밀값은 두지 않는다.'
  points:
  - 'Android 클라이언트 템플릿: fetch 후 activate; 새 앱 버전 없이 설정 변경'
  - 'A/B Testing: Analytics 목표 이벤트로 클라이언트 설정 변형을 비교'
  - 'Personalization: Analytics로 측정하는 목표에 맞춰 매개변수 값을 최적화; 결과는 데이터량·목표에 좌우'
  - '서버 템플릿: 백엔드에서 모델·프롬프트를 선택; Admin SDK와 서버 타깃 조건 사용'
  - '요금·보안: A/B Testing은 무료, Remote Config는 2026-09-01부터 하루 프로젝트당 10만 fetch 초과분 과금; 클라이언트 값에 비밀정보 금지'
  source: https://firebase.google.com/docs/remote-config/parameters
  interview: "Android 앱의 Remote Config에 AI system prompt와 API key를 함께 저장해도 되나요?"
  answer: "안 된다. 클라이언트 템플릿에서 앱에 전달된 값은 사용자가 확인할 수 있으므로 공개 가능한 설정만 둔다. API key나 비공개 prompt는 백엔드에 보관하고, 서버 템플릿과 Admin SDK로 모델·prompt 선택을 처리한다. Android 사용자 대상 실험은 클라이언트 템플릿의 A/B Testing으로 Analytics 목표를 측정하고, 변경값은 적절한 시점에 activate한다."
- category: ai
  title: 'Tolgee — 화면 문맥을 활용해 Android 번역을 AI로 제안하고 검수하기'
  level: "중급"
  summary: 'Tolgee AI Translator는 화면 캡처, 키·프로젝트 설명, 언어별 지침, 번역 메모리를 LLM에 제공해 짧고 모호한 문구의 뜻을 좁힌다. Android XML의 문자열·배열·복수형을 가져오고 내보낼 수 있으며, Android SDK는 번역을 제공하고 리소스 문자열로 대체하는 경로도 지원한다. 문맥은 번역 품질을 돕지만 정답을 보장하지 않으므로 placeholder·복수형·화면 길이를 검수한다.'
  points:
