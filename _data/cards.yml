  title: llama.cpp + GGUF — CPU·맥·엣지에서 LLM을 돌리는 사실상 표준, Q4_K_M이 2026년 최적 균형점
  summary: 'llama.cpp는 C/C++로 작성된 LLM 추론 엔진으로, GGUF 포맷을 통해 CPU·Apple Silicon·NVIDIA·AMD·Intel 등 거의 모든 하드웨어에서 LLM을 실행한다. 2026년 기준 양자화 최적점은 Q4_K_M(4bit)으로, FP16 대비 퍼플렉시티 1~3% 손실에 VRAM 3.5~4배 절감. Ollama·LM Studio·KoboldCpp의 백엔드 엔진이기도 하다. 프로덕션 GPU 서빙은 AWQ+vLLM이 표준이지만, 로컬/엣지/맥에서는 llama.cpp+GGUF가 유일한 선택.

    '
  points:
  - '범용 하드웨어: CPU·Mac·NVIDIA·AMD·Intel 모두 지원'
  - 'Q4_K_M: 품질 대비 최적 양자화, FP16 대비 1~3% 손실'
  - 'Ollama·LM Studio 백엔드: 소비자 LLM 생태계의 기반'
  source: https://github.com/ggml-org/llama.cpp
