  interview: '공식 MCP Registry에서 서버를 찾았다는 사실만으로 그 서버를 안전하다고 판단할 수 없는 이유는 무엇인가요?'
  answer: '레지스트리는 서버 코드가 아닌 메타데이터를 모으고, 서버 제작자가 정보를 게시한다. 발견 경로와 보안 검증은 별개이므로 패키지 출처·실행 권한·전송 데이터·서버 동작을 따로 평가해야 한다.'
- category: ai
  title: 'Zed ACP — IDE에서 외부 코딩 에이전트를 골라 병렬 작업하기'
  level: "중급"
  summary: 'Zed는 Rust로 만든 GPUI 기반 코드 편집기다. 2026-04-29에 1.0을 발표하며, ACP(Agent Client Protocol)로 Claude·Codex·OpenCode 등 외부 에이전트를 Agent Panel과 Threads Sidebar에서 실행하는 방향을 강조했다. ACP 에이전트는 보통 자체 실행 프로세스·인증·모델 선택·도구 설정을 유지한다. Zed는 외부 에이전트 이용료를 청구하지 않지만, 실제 과금·약관·데이터 처리는 해당 에이전트 제공자와의 관계를 따른다. 여러 스레드에서 다른 에이전트를 선택하고 저장소 접근 범위를 정리할 수 있으며, worktree 격리는 선택 기능이다. 따라서 Zed를 특정 모델에 묶이지 않는 에이전트 작업대로 활용할 수 있지만, 각 에이전트의 권한과 비용은 따로 관리해야 한다.'
  points:
  - 'ACP 외부 에이전트: Zed는 대화 스레드를 호스팅하고, 에이전트는 일반적으로 자체 런타임·인증·모델·도구 설정을 관리한다.'
  - 'Threads Sidebar는 프로젝트별 작업을 모아 보여주고 에이전트 선택과 저장소 접근을 다룬다. 에이전트는 여러 저장소를 함께 다룰 수 있고 worktree 분리는 사용자가 선택한다.'
  - '2026-11-22 저장소 스냅샷: 95,493 stars. Zed 1.0은 4월 29일 발표된 제품 이정표이며 최신 소프트웨어 버전과 혼동하지 않는다. 소스는 주로 GPL-3.0-or-later이고 일부 재사용 구성요소는 Apache-2.0이다.'
  source: https://zed.dev/docs/ai/external-agents
