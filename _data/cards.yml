  source: https://github.com/langgenius/dify
- category: ai
  title: Keploy — 실제 트래픽을 eBPF로 녹화해 API·통합 테스트와 mocks를 만드는 AI 테스트 도구(~17.8k★)
  summary: 'Keploy는 실제 API 호출, DB query, streaming event를 기록해 테스트와 data mock으로 replay하는 API·통합 테스트 도구다. README는 eBPF로 네트워크 계층 트래픽을 잡기 때문에 SDK 삽입이나 코드 변경 없이 `keploy record -c "CMD"`로 시작한다고 설명한다. AI 각도는 UI locator가 아니라 API coverage 확장이다. 기존 recording과 Swagger/OpenAPI schema를 이용해 boundary value, 누락/추가 필드, 타입 오류, 순서 뒤집힘, retry/timeout 같은 케이스를 찾아 schema·statement·branch coverage를 넓힌다. 실무 교훈은 에이전트가 테스트를 "상상해서" 쓰게 하기보다, 운영에 가까운 트래픽을 재현 가능한 회귀 테스트와 mock으로 먼저 고정하고 그 위에서 AI로 빈 구간을 채우는 것이다.

    '
  points:
  - 'eBPF traffic capture — API 호출·DB query·streaming event를 코드 변경 없이 record/replay'
  - 'AI coverage expansion — OpenAPI와 recording에서 boundary·누락 필드·타입 오류·retry/timeout 케이스 생성'
