  - category: ai
    title: "Superpowers — 브레인스토밍→플랜→TDD→서브에이전트까지 '개발 방법론 전체'를 스킬로 묶은 프레임워크(MIT)"
    summary: >
      Superpowers는 Jesse Vincent(Prime Radiant)가 만든 오픈소스 에이전트 스킬 프레임워크로, 단일 스킬이 아니라
      '코드를 짜기 전부터'를 강제하는 소프트웨어 개발 방법론 전체를 합성 가능한 스킬들로 엮은 것이다.
      흐름은 brainstorming(질문으로 아이디어를 다듬어 설계문서 저장) → git worktree로 격리 작업공간 확보 →
      writing-plans(2~5분짜리 태스크로 쪼개고 경로·검증 단계까지 명시) → 태스크마다 새 서브에이전트를 띄워 '스펙 준수→코드 품질' 2단계 리뷰 →
      TDD(RED-GREEN-REFACTOR 강제) → 코드리뷰 → 브랜치 마무리 순이다. 라이선스는 MIT.
      Claude Code뿐 아니라 Codex·Gemini CLI·Cursor·Copilot CLI·Factory Droid·OpenCode 등에 플러그인으로 설치된다.
    points:
      - "핵심 철학: 'TDD·임시변통 대신 체계·복잡도 감소·주장 대신 증거(Evidence over claims)' — 계획 단계에서 모호한 결정을 미리 확정해 둠"
      - "서브에이전트는 태스크당 1개씩 새로 띄워 격리 실행하고 통합은 오케스트레이터(메인)가 담당 — 서브에이전트에게 통합을 맡기지 않는 게 원칙"
      - "설치는 Claude Code 기준 `/plugin install superpowers@claude-plugins-official` (또는 obra/superpowers-marketplace 추가 후 설치) — 레포 표기 별 수는 약 229k★ 주장"
    source: "https://github.com/obra/superpowers"
  - category: ai
    title: "에이전트 코딩의 '80% 문제' — 보이는 80%는 끝내고 안 보이는 20%(인증·DTO·타 레포)를 빼먹는다"
    summary: >
      Sourcegraph의 Matt Tanner가 2026-05-21에 올린 'Agentic Coding in 2026' 글의 핵심은,
      에이전트 생산성을 좌우하는 건 모델 성능이 아니라 '컨텍스트'라는 것이다.
      에이전트는 작업의 눈에 보이는 80%는 안정적으로 끝내지만, 인증 미들웨어·API DTO·감사 로그·형제 레포의 통합 테스트 같은
      안 보이는 20%를 빼먹는데 — 글은 이를 '80% 문제'라 부른다. 사이드 프로젝트에선 안 드러나지만 레포 수가 1을 넘는 순간부터
      급격히 비용이 커진다. 해법으로 임베딩 기반 근사 검색이 아닌 '심볼 정확 검색(모든 callsite·구현체)'을 권한다.
    points:
      - "'완료'를 의심하라: 에이전트가 끝났다 하면, 손댄 심볼들을 코드베이스 전체에서 검색해 에이전트가 안 연 파일이 나오면 작업은 미완 — 글이 꼽은 가장 실천적 습관"
      - "권장 운영법: ①과제 블래스트 반경을 레포 전역 검색으로 미리 스코프 ②에이전트 커밋도 사람 커밋과 '같은 CI'로 게이트 ③에이전트를 외주 계약자처럼 다뤄 diff 리뷰·활동 감사 ④프롬프트가 아니라 '컨텍스트 레이어'에 투자"
      - "대규모/멀티레포에선 임베딩 근사 검색보다 '결정적·전수(deterministic, exhaustive) 검색'을 권장 — 단 Sourcegraph 자사(코드검색 제품) 글이라 제품 포지셔닝은 감안할 것"
    source: "https://sourcegraph.com/blog/agentic-coding"
  - category: ai
    title: "CrewAI — '역할 가진 에이전트 팀(Crew)'과 '결정적 워크플로(Flow)'를 한 프레임워크에 담은 멀티에이전트 도구(MIT·53.7k★)"
    summary: >
      CrewAI는 여러 AI 에이전트가 협업하도록 오케스트레이션하는 파이썬 프레임워크로,
      LangChain 등 다른 에이전트 프레임워크에 의존하지 않고 '처음부터(from scratch)' 새로 짠 것이 특징이다.
      두 축으로 동작한다 — (1) Crew: 역할(role)·목표(goal)·배경(backstory)을 가진 에이전트들이 자율적으로 의사결정하며 협업하는 팀,
      (2) Flow: 이벤트 기반으로 실행 경로와 상태를 정밀 제어하는 프로덕션용 워크플로. 이 둘을 조합해 '자율성'과 '통제'를 함께 잡는 게 핵심 설계다.
