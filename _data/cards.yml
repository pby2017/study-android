  title: W&B 생태계 개요 — Weave·Registry·Sweeps·Artifacts·Reports·Launch를 한 UI로
  summary: Weights & Biases는 ML 실험 tracking부터 LLM 에이전트 eval·모델 CI/CD·원격 GPU 실행까지 한 워크스페이스로 묶는 MLOps/LLMOps 플랫폼이다. Weave는 @weave.op·start_session/start_turn/start_llm/start_tool로 에이전트 session→turn→LLM→tool 계층 trace와 weave.Evaluation 스코어링. Run+Artifacts는 dataset·model v1,v2… 버전·lineage — 프로덕션에서 :latest 금지, alias(staging/production) 또는 pinned version. Model Registry는 run.link_artifact() promote로 artifact CI/CD gate. Sweeps는 bayes/grid/random+Hyperband HP 탐색, wandb agent로 multi-GPU 병렬. Tables·Panels·Reports는 row-level 탐색·live metric dashboard·스냅샷 공유 문서. Launch는 Git/Docker Job Artifact→Queue→kubernetes|SageMaker|Vertex dispatch. Langfuse(OSS LLM trace)·MLflow(LF·셀프호스트)와 달리 ML+LLM eval+artifact lifecycle+compute dispatch 통합 SaaS.
  points:
  - Weave — @weave.op + Agents SDK(session/turn/llm/tool), Evaluation+스코어러
  - Artifacts+Registry — lineage·alias CI/CD gate, :latest race condition 금지
  - Sweeps+Launch — HP 탐색+원격 cluster dispatch, Reports/Tables/Panels 협업 UI
  source: https://docs.wandb.ai/weave
