- category: ai
  title: DVC — Git for Data, ML 파이프라인·실험·대용량 아티팩트 버전 관리
  summary: Data Version Control(DVC)은 Git이 못 다루는 대용량 데이터·모델·실험을 메타파일(.dvc·dvc.yaml·dvc.lock)로 Git에 연결하고 실제 파일은 S3·GCS·Drive 등 원격 저장소에 둔다. dvc stage add→dvc repro로 Makefile형 ML 파이프라인 DAG — 변경된 스테이지만 재실행. dvc exp run으로 실험 분기·하이퍼파라미터 비교. LLM 파인튜닝·LoRA 체크포인트·데이터셋도 CI/CD(dvc push/pull)로 자동 버전 관리. MLflow(실험 추적)와 상호보완 — DVC는 데이터·파이프라인 재현성.
  points:
  - dvc.yaml DAG — dvc repro로 변경 스테이지만 재실행, dvc.lock으로 재현성
  - 원격 저장(S3·GCS·Drive) — Git에는 메타만, 대용량은 클라우드
