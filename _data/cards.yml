      걸친 관계 추론' 질문에 강점. Neo4j(Cypher 기반 그래프 순회 + 벡터 인덱스 하이브리드)가 프로덕션에서 가장
      널리 쓰이는 GraphRAG 백엔드. LazyGraphRAG는 그래프 구축을 쿼리 시점까지 지연시켜 초기 비용을 대폭 절감.
