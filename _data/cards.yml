  title: DeepSWE(Datacurve) — 채점기 오류를 줄이고 '오래 걸리는 일'로 다시 줄 세운 코딩 에이전트 벤치마크
  summary: 포화된 SWE-bench류 리더보드는 프런티어 모델들이 좁은 구간에 몰려 '어느 에이전트가 우리 코드베이스에서 더 나은지'를 가리기 어렵다는 비판을 받아 왔다. Datacurve DeepSWE v1.1(2026-06-24) — 113 original task·91 repo·5 language·program-based verifier·contamination-free. Artificial Analysis Coding Agent Index v1.1이 SWE-Bench-Pro-Hard-AA를 DeepSWE로 교체. v1.1 leaderboard(mini-swe-agent harness) — claude-fable-5[xhigh] 69.9% > gpt-5.5[xhigh] 67.0% > claude-opus-4-8[max] 59.0%·kimi-k2.7-code·glm-5.2 추가. Pier(Harbor fork) — per-agent network allowlist·modal parallel. vs SWE-rebench(rolling fresh issues) ·ProgramBench(cleanroom build) — DeepSWE=verifier accuracy+long-horizon original tasks.
