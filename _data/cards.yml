  - Windsurf/Cursor 대비 무료 모델 접근 — ByteDance 텔레메트리·프라이버시 주의
  source: https://www.trae.ai/
- category: ai
  title: Function Calling vs Tool Use — OpenAI·Anthropic·Gemini 프로덕션 패턴 비교(2026)
  summary: '세 제공자 모두 JSON Schema 기반 도구 호출을 지원하지만 API 설계가 다르다. OpenAI: tools+tool_calls, arguments는 JSON string(파싱 필요), strict:true로 스키마 강제. Anthropic: tool_use content block, arguments는 dict(사전 파싱), Tool Search로 대규모 레지스트리 lazy-load, 텍스트·도구 혼합 응답. Gemini: function_declarations, Google 서비스 통합. 공통: parallel tool calls, agentic loop는 직접 구현 또는 LiteLLM/Vercel AI SDK. Gemma·Qwen 모델별 언급과 달리 ''크로스 프로바이더 프로덕션'' 관점.'
  points:
  - 'OpenAI: tool_calls·JSON string args·strict:true / Anthropic: tool_use block·dict args·Tool Search'
  - 'Gemini: function_declarations·Google 서비스 grounding — parallel calls 공통'
  - '프로덕션: agentic loop 직접 구현 또는 LiteLLM 추상화, is_error 플래그(Anthropic) 주의'
  source: https://ofox.ai/blog/function-calling-tool-use-complete-guide-2026/
- category: ai
  title: MMLU-Pro·HumanEval+ — 정적 벤치마크 포화와 EvalPlus 80x 테스트 강화(2026)
  summary: 기존 MMLU·HumanEval은 프론티어 모델이 88-94%에 몰려 변별력이 사라졌다. MMLU-Pro = 12,000 graduate-level·10지선다·추론 중심(MMLU 대비 16-33%p 하락). HumanEval+ = EvalPlus 프레임워크로 테스트 케이스 80배 확장, 기능 정확도 엄격 평가. 그러나 2026년 MMLU-Pro도 88-94% 밴드로 재포화 중 — 정적 벤치 단독 신뢰 불가. SWE-bench·Terminal-Bench·Arena Elo와 포트폴리오로 triangulate해야 한다.
  points:
  - MMLU-Pro — 12k문항·10지선다·추론, 원 MMLU 16-33%p harder, 그러나 2026 재포화
  - HumanEval+ — EvalPlus 80x 테스트, Phi-4 Reasoning ~92.9% 등 코딩 정확도 엄격 측정
  - 정적 벤치 단독 금지 — SWE-bench·GPQA·Arena·자체 50-500 prompt eval 병행
  source: https://www.digitalapplied.com/blog/llm-benchmark-methodology-2026-contamination-leaderboard-guide
- category: ai
  title: Mojo — Python 문법·C++ 속도의 AI 네이티브 언어, 1.0 beta(2026-05)
  summary: Modular(Swift·LLVM 창시자)가 MLIR 기반으로 만든 AI 네이티브 프로그래밍 언어. Python과 자연 상호운용(import/export)하면서 컴파일·정적 타입으로 GPU·CPU·ASIC 커널을 한 언어에서 작성. 2026-05 Mojo 1.0.0 beta 1 출시, 표준 라이브러리는 Apache-2.0 오픈소스, 컴파일러는 Fall 2026 오픈소스 예정. 두 언어 문제(Python 프로토타입→C++/CUDA 재작성)를 줄이려는 목표 — AI 인프라·커스텀 연산·HPC에 적합, 아직 프로덕션 기반으로 쓰기엔 API 변동·컴파일러 클로즈드 소스 리스크.
  points:
  - MLIR 기반 — CPU·GPU·가속기 하드웨어 비종속, Python 생태계와 양방향 interop
  - 2026-05 1.0.0b1 — 핵심 언어 기능 안정화 목표, stdlib Apache-2.0
  - Fall 2026 컴파일러 OSS 예정 — 현재는 beta·closed compiler, AI 커널/HPC 학습용
  source: https://mojolang.org/
- category: ai
  title: Haystack — deepset의 프로덕션 RAG·에이전트 오케스트레이션 프레임워크(Apache-2.0)
  summary: deepset의 오픈소스 Python AI 오케스트레이션 프레임워크. 컴포넌트+파이프라인(DAG)으로 retrieval·routing·memory·generation을 명시적으로 조합 — LangChain/LlamaIndex와 달리 프로덕션 RAG에 특화. 내장 hybrid retrieval(BM25+밀집·RRF), YAML 정의 파이프라인, MRR/NDCG/faithfulness 평가 프레임워크. v2.30+(2026-06) 에이전트 워크플로·멀티모달·160+ 커넥터. Hayhooks로 REST API 노출, Enterprise Platform으로 거버넌스·관측성.
  points:
  - 컴포넌트 DAG — retrieval·router·memory·generator를 독립 교체·테스트
  - 내장 hybrid search·평가(MRR·faithfulness) — YAML 파이프라인 버전 관리
  - LlamaIndex(데이터)·LangChain(에이전트)과 하이브리드 스택으로 조합 가능
  source: https://haystack.deepset.ai/overview/intro
