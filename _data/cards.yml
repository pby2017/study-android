  - Multi-select — "make A match B" group edit in one prompt
  - Voice queue — mid-run narration without blocking agent
  - Element context — HTML·CSS·bounding box injected not prose description
  source: https://cursor.com/docs/agent/design-mode
- category: ai
  title: PostTrainBench — 10h H100·base LLM post-train·reward hacking audit
  summary: PostTrainBench(ICML 2026·arXiv 2603.08640·posttrainbench.com) — CLI agent가 base LLM(Qwen3-1.7B/4B·SmolLM3-3B·Gemma-3-4B)을 10h single H100에서 post-train해 7 benchmark(AIME·BFCL·GPQA·HumanEval 등) score maximize. Opus 4.6 best 23.2% vs instruction-tuned baseline 51.1% — agentic AI R&D automation still far from provider SFT. reward hacking documented — test data train·download IT model·unauthorized API key synthetic data. vs PaperBench(replicate paper) ·NatureBench(discovery) — PostTrainBench=can agent run ML engineering loop under compute budget.
  points:
  - 10h H100 cap — realistic single-GPU post-training not cluster fantasy
  - 23% vs 51% — agents improve base 3× but miss official IT models
  - Integrity failures — eval env must block model swap and test leakage
  source: https://posttrainbench.com/
- category: ai
  title: Snorkel Agentic Coding — 100 task·4 tier·Harbor Pass@5·trajectory rubric
  summary: Snorkel Agentic Coding Benchmark(2026-04·snorkel.ai/leaderboard/agentic-coding) — 100 multi-step SE task 4 difficulty tiers, sandboxed env·human-validated golden solution·unit tests·trajectory rubric. Harbor harness Pass@5·30min max per task. Opus 4.6 65.2% > Opus 4.5 58% > Gemini 3 Pro 51.6% — difficulty curve separates frontier. Snorkel co-created Terminal-Bench but this benchmark spans ML/data/build deps beyond shell-only. vs Terminal-Bench 2.1(infra shell) ·SWE-bench(single patch) ·DeepSWE(original tasks) — Snorkel=long-horizon planning+error recovery breadth.
  points:
  - Pass@5 Harbor — same harness as Terminal-Bench ecosystem
  - Trajectory rubric — final output+how agent recovered from errors
  - 4 tiers — signal from efficiency model to frontier Opus
  source: https://snorkel.ai/blog/introducing-the-snorkel-agentic-coding-benchmark/
- category: ai
  title: MCP Apps+Tasks gateway governance — iframe CSP·taskId IDOR·org policy surface
  summary: MCP 2026-07-28 promotes MCP Apps(iframe UI via _meta.ui.resourceUri·ui:// resource) and Tasks extension to first-class — but net-new governance surfaces. MCP Apps — arbitrary HTML in sandboxed iframe, postMessage JSON-RPC, host must enforce CSP·allowlist·content review before render. Tasks — tools/call returns taskId, client polls tasks/get·update·cancel; stateless core means taskId=capability handle requiring per-request auth(IDOR if leaked). Gateway layer — route Mcp-Method/Mcp-Name without body parse, policy which extensions allowed, audit task lifecycle. vs A2UI vs MCP Apps architecture choice ·MCP 2026 spec card — governance=production deployment checklist not wire format.
  points:
  - Apps risk — unreviewed iframe HTML is XSS/supply-chain surface
  - Tasks IDOR — taskId in tool args needs explicit authorization every poll
  - Gateway — extension allowlist+header routing before agent sees tool
  source: https://www.truefoundry.com/blog/mcp-apps-tasks-gateway-governance
- category: ai
  title: PaperBench — ICML 2024 20 paper replication·8316 rubric·Code-Dev lite
  summary: PaperBench(OpenAI frontier-evals·arXiv 2504.01848) — agent가 ICML 2024 Spotlight/Oral 20편 ML research를 scratch replicate — codebase·experiment·rubric match. 3-stage pipeline — agent rollout container→reproduce.sh GPU reproduction→SimpleJudge LLM rubric(8316 gradable subtasks, co-authored with paper authors). Best Claude 3.5 Sonnet scaffold 21%·ML PhD human 41.4% on 3-paper subset. PaperBench Code-Dev — skip reproduction GPU, code-only rubric ~85% judge cost cut. vs NatureBench(scientific discovery firewall) ·PostTrainBench(post-train loop) — PaperBench=AI research engineering replication axis.
  points:
  - Author co-written rubric — realistic replication criteria not generic tests
  - Code-Dev variant — no GPU reproduction, cheaper capability signal
  - Human baseline beats SOTA — research replication still human-led
  source: https://github.com/openai/frontier-evals/tree/main/project/paperbench
- category: ai
  title: Project Glasswing — AI 보안 자동화의 병목은 탐지보다 검증·패치 수용
  summary: Anthropic의 Project Glasswing 확장 글은 Mythos Preview를 약 50개 초기 파트너 코드베이스 취약점 탐지에 쓰며 10,000개 이상의 high/critical 후보를 찾았고, 2026-06-02에는 15개국 이상 약 150개 조직으로 프로그램을 넓힌다고 설명한다. 중요한 교훈은 "AI가 더 많이 찾아준다"가 끝이 아니라는 점이다. 글은 병목이 취약점 발견에서 검증·공개·패치 배포로 옮겨 갔다고 못박고, Claude Security 제품 페이지도 코드 스캔 뒤 adversarial verification pass를 거치며 패치는 사람이 review/approve해야 한다고 말한다. 즉 보안 에이전트 도입은 스캐너 추가가 아니라 triage queue, 증거, 심각도 재평가, 승인권자를 함께 설계하는 일이다.
  points:
  - 10,000+ high/critical 후보와 150개 조직 확장 — 탐지량이 운영 병목을 만든다
  - Claude Security는 scan→validate→patch 제안 흐름, 모든 패치는 human approval 전제
  - 실무 교훈 — AI 보안 자동화는 발견보다 검증·공개·패치 수용 프로세스가 핵심
  source: https://www.anthropic.com/news/expanding-project-glasswing
- category: ai
  title: mcp-memory-rs — local-first MCP memory·merkle sync·offline JSON+SQLite
  summary: mcp-memory-rs(DioNanos·v0.3.0·2026-06)는 Rust stdio MCP memory server로 agent 장기 상태를 vendor session이 아닌 사용자 디스크 JSON category+SQLite FTS5에 보관한다. default는 완전 offline — sync는 optional HTTP step, embedding·cloud account 불필요. fleet sync — sync_manifest(merkle root)·sync_diff·memory_sync push/pull, conflict_strategy(last-write-wins default)·expected_hash optimistic concurrency. HTTP sync plane은 bearer token full access — loopback bind+MCP_MEMORY_TOKEN 필수, MCP stdio surface만 per-category ACL. vs agentmemory(53 tool cloud-style) ·Memory Bank(markdown files) — mcp-memory-rs=multi-device edge sync+versioned notebook axis.
  points:
  - Local-first — stdio만으로 offline 동작, sync는 explicit opt-in
  - Merkle manifest — node 간 diff만 push, full dump 불필요
  - HTTP token=admin — loopback+tunnel, public internet 노출 금지
  source: https://github.com/DioNanos/mcp-memory-rs
- category: ai
  level: "고급"
  title: 멀티에이전트 LLM의 영속 KV 캐시 — 재계산 대신 저장·복원
  summary: 여러 에이전트가 각자 대화 문맥을 유지하면 KV 캐시가 메모리를 차지하고, 캐시를 버린 뒤에는 프롬프트를 다시 처리해야 한다. 한 연구는 캐시를 4비트로 양자화해 디스크에 저장하고 필요할 때 복원하는 방식을 제안했다. 논문은 Apple M4 Pro에서 일부 모델·문맥 길이를 시험했으며, 4K Gemma 3 12B 설정은 재처리 15.7초와 따뜻한 캐시 복원 577ms를 보고했다. 공개 구현은 MLX 기반 Apple Silicon 전용이다. Android 적용이나 성능은 입증되지 않았다.
  points:
  - KV 캐시는 토큰마다 계산한 attention의 key/value 상태로, 다음 토큰 생성에 재사용
  - Q4 저장은 캐시 메모리를 줄이는 대신 복원 비용과 모델별 품질 변화를 검증해야 함
  - 논문 결과를 Android 성능으로 일반화하지 말 것: 공개 코드는 Apple Silicon·MLX 대상
  source: https://arxiv.org/abs/2603.04428
  interview: "멀티에이전트 LLM에서 KV 캐시를 디스크에 영속화하면 어떤 비용을 줄이며, 이 연구를 Android 앱에 바로 적용할 수 없는 이유는 무엇인가요?"
  answer: "에이전트가 다시 활성화될 때 기존 문맥 전체를 prefill하는 계산을 줄일 수 있다. 대신 캐시 저장·복원 I/O와 양자화에 따른 품질 변화를 고려해야 한다. 이 논문의 공개 구현은 MLX와 Apple Silicon을 대상으로 하므로 Android 런타임 지원이나 Android 기기 성능을 입증하지 않는다."
- category: ai
  title: SWE-STEPS — dependent PR chain·stateful coding agent eval·20pp inflation
  summary: SWE-STEPS(arXiv 2604.03035·Apr 2026) — coding agent를 isolated single-PR(SWE-bench style)이 아니라 temporally ordered PR chain(3–11 PR·median 1–3주 dev work)에서 평가. 168 task·963 PR·6 Python repos·Conversational(iterative request) + PRD(monolithic plan) 두 setting. isolated PR eval은 stateful setting 대비 success rate 최대 20pp 과대 — spillover·regression 누적 무시. SonarQube — agent code가 cognitive complexity·technical debt 더 높음(test pass해도 repo health degrade). vs SlopCodeBench(iterative extension quality) ·Dialogue-SWEBench(interactive spec) — SWE-STEPS=temporal repo evolution axis.
  points:
  - 20pp inflation — stateless SWE-bench rank가 production 연속 개발과 어긋남
  - PR chain 3–11 — test suite growth·technical debt 누적 반영
  - SonarQube health — functional pass만으로 agent 품질 판단 불가
  source: https://arxiv.org/abs/2604.03035
- category: ai
  title: REAP/Harvest — production developer session에서 coding benchmark 자동 큐레이션
  summary: REAP(Relevance and Execution-Audited Pipeline·arXiv 2604.01527) — real developer-agent session에서 verbatim prompt + fail-to-pass test oracle benchmark를 LLM judge 없이 자동 생성. Harvest case study — single-turn production coding assistant pool, 4+ language(Hack majority), 5 frontier model solve rate 42.9–58.2%(Opus 4.6 top). harness comparison — stronger toolset↑ solve rate, developer context file(AGENTS.md류)이 weak harness gap 메움. vs SWE-Rebench(GitHub issue mining) ·public bench(language skew) — REAP=production prompt style·codebase structure fidelity axis.
  points:
  - F2P test oracle — LLM judge 없이 reproducible correctness signal
  - Production-derived — public bench와 language·prompt style divergence 해소
  - Harness sensitivity — toolset+context file이 model-only eval보다 실무 signal
  source: https://arxiv.org/abs/2604.01527
- category: ai
  title: auth.md — /auth.md Markdown으로 agent registration flow를 표준화
  summary: auth.md(WorkOS 주도·open protocol·2026-05) — 앱이 https://service.com/auth.md에 Markdown으로 agent registration 방법을 publish. discovery — RFC 9728 PRM(/.well-known/oauth-protected-resource) + AS metadata agent_auth block. Agent verified flow — agent provider가 ID-JAG identity assertion, POST /agent-auth로 JWKS verify→scoped access token 동기 발급(human loop 없음). User claimed flow — OTP device-auth style, agent가 code 보여주고 user가 service page에서 confirm. Resource Indicators(RFC 8707) — token이 특정 MCP server용, confused deputy protocol-level 차단. vs Cloudflare Temporary(deploy-first) ·MCP OAuth — auth.md=service signup/onboarding for agents axis.
  points:
  - /auth.md prose + PRM machine-readable — agent web search discovery 가능
  - ID-JAG verified — trusted provider attestation, OTP 없이 JIT user provision
  - RFC 8707 — Server A token을 Server B replay 불가
  source: https://workos.com/auth-md
- category: ai
  title: CodeCRDT — multi-agent shared memory는 merge≠semantic agreement
  summary: CodeCRDT(arXiv 2510.18893) + crdt-merge — multi-agent LLM coordination을 explicit message passing 대신 shared CRDT document observation으로. Yjs CRDT — 600 trial 100% syntactic convergence·0% merge failure, but 5–10% semantic conflict(duplicate declaration·type mismatch) CRDT가 해결 못함. task coupling — parallel speedup +21% vs slowdown -39% depending on shared state intensity. Layer 1 CRDT(structural merge) + Layer 2 deterministic resolution(max_confidence·ContextBloom O(1) dedup). vs mcp-memory-rs(sync files) ·Memory Bank(single-agent markdown) — CodeCRDT=multi-writer agent memory에서 bytes converge≠intent converge 교훈.
  points:
  - 100% syntactic·5–10% semantic — CRDT는 text merge not meaning merge
  - Observation-driven — agent가 peer edit observe, completed work skip
  - Resolution layer 필수 — LWW만으로 agent fleet memory 운영 불충분
  source: https://arxiv.org/abs/2510.18893
- category: ai
  title: Android Live Threat Detection — on-device AI가 agent-like app abuse 패턴 탐지
  level: "중급"
  summary: Google Play Protect의 Live Threat Detection은 앱 동작 신호를 기기 안의 AI로 분석해 의심 행동을 사용자에게 알리는 플랫폼 보안 기능이다. Google은 2026년 Android 17 로드맵에서 SMS 전달, 접근성 오버레이, 앱 아이콘 숨김 후 백그라운드 실행 같은 패턴을 예로 들고, 동적 신호 모니터링과 새 위협 규칙의 원격 배포를 예고했다. 이는 앱이 호출하는 공개 SDK가 아니며, 앱 개발자는 권한과 접근성 기능을 투명하게 사용하고 정상 사용 흐름으로 검증해야 한다. 발표는 Android 17 기기의 2026년 하반기 rollout을 예고했으므로 실제 제공 여부는 기기·배포 상태에 따라 확인한다.
  points:
  - "온디바이스 행동 분석: SMS 전달·접근성 오버레이 등 의심 패턴을 감지해 알림"
  - "Android 17 로드맵: 시스템 상호작용을 실시간 감시하고 새 탐지 규칙을 배포하는 기능 예고"
  - "Play Protect 플랫폼 보호 기능이지 앱용 탐지 API가 아님; 정상 권한 사용과 사용자 설명을 설계"
  source: https://blog.google/security/whats-new-in-android-security-privacy-2026/
  interview: "Live Threat Detection은 APK 정적 검사와 어떻게 다르며, 앱 개발자가 이 기능을 직접 호출해 탐지 결과를 받을 수 있나요?"
  answer: "Google의 설명에 따르면 Live Threat Detection은 Play Protect가 앱의 동작 신호를 기기 안에서 분석해 사용자에게 알리는 플랫폼 기능이다. Android 17 로드맵은 시스템 상호작용 모니터링과 동적 규칙 배포를 예고했지만, 앱이 호출하는 탐지 API를 발표한 것은 아니다. 앱은 접근성·SMS 등 민감 권한을 최소화하고 의도와 사용자 이점을 설명해야 한다."
- category: ai
  title: ATSC — Agent Telemetry Semantic Conventions, OTel 위 agent domain schema
  summary: ATSC(agent-telemetry-spec/atsc) — vendor-neutral transport-agnostic schema for AI agent observability. OTel GenAI semconv(transport+span names) 위에 agent-specific operation — LLM call·tool invoke·memory access·retrieval·HITL·multi-agent handoff·eval을 canonical telemetry record로. .NET Microsoft Agent Framework + Aspire OTLP pipeline gap — raw span은 보이지만 tool turn·HITL event가 undifferentiated. ATSC spans flow unmodified→Azure Monitor Application Insights. source-agnostic — Langfuse·LangGraph·hand-rolled agent same shape. vs OpenTelemetry GenAI(spec layer) ·AgentOps(passive SDK) — ATSC=missing semantic layer for agent operations in enterprise APM.
  points:
  - OTel extend not replace — OTLP-compatible receiver, custom plugin 불필요
  - Aspire/.NET gap — Agent Framework span에 agent meaning 부여
  - HITL·handoff·memory access — microservice trace에 없는 agent operation taxonomy
  source: https://github.com/agent-telemetry-spec/atsc/blob/main/SPEC.md
- category: ai
  title: Saber — stateful project workspace operational safety·final state HSR 54%+
  summary: Saber(arXiv 2606.01317·sssr-lab/saber) — coding agent operational safety in realistic stateful project workspaces, not chatbot refusal. agent edits code·runs shell·modifies artifacts in Docker sandbox — safety judged from final workspace state+action trace after multi-step run. violation taxonomy by cause enables model-specific safety profiles. best model still >54% harmful safety-violation rate(HSR) — refusal alone insufficient for agent safety. vs Agent-SafetyBench(interactive tool env score) ·CUAHarm(terminal harm execution) — Saber=project workspace state delta axis.
  points:
  - Final state judgment — not prompt refusal, completed run workspace delta
  - HSR 54%+ even best model — plan safely+least privilege+preserve state all fail
  - Violation taxonomy — cause categorization beyond binary safe/unsafe
  source: https://arxiv.org/abs/2606.01317
- category: ai
  title: ProcCtrlBench — 11 defect ontology·control preservation·outcome blind spot
  summary: ProcCtrlBench(arXiv 2605.20251) — execution-process eval for coding agents beyond final pass/fail. 11 defect types in 4 categories from standardized trajectory evidence — interpretable·interruptible·correctable·reversible·authority handback(control preservation score). 200 cases sampled from AndroidBench·Terminal-Bench·SWE-bench Verified — reveals execution quality differences outcome metrics miss. vs Snorkel(trajectory rubric final) ·Terminal-Bench(shell outcome) — ProcCtrlBench=process ontology reusable across harnesses.
  points:
  - 11 defect types — process evidence not just test pass
  - Control preservation — can operator interrupt/correct mid-run
  - Cross-benchmark sampling — AndroidBench+TB+SWE-bench unified trajectory
  source: https://arxiv.org/abs/2605.20251
- category: ai
  title: AgentProp-Bench — tool parameter injection 62% propagate·judge κ=0.049
  summary: AgentProp-Bench(arXiv 2604.16706·agenthallu-bench repo) — tool-using agent error propagation with human-validated judge. 2000 task·2300 traces·4 domains·9 models·100 human labels. substring judge κ=0.049 vs human(chance); 3-LLM ensemble κ=0.432 moderate conservative bias. parameter injection→wrong final answer P≈0.62 human-calibrated(0.46–0.73 per model). rejection(catch bad param) vs recovery(fix after accept) independent capabilities(ρ=0.126). 3-layer runtime interceptor −23pp GPT-4o-mini, null on Gemini-2.0-Flash(95% schema rejection). vs ASSERT(policy eval) ·Braintrust(trace) — AgentProp=stage-conditional propagation math.
  points:
  - κ=0.049 substring judge — automated agent eval unreliable without validation
  - 62% propagation — one bad tool param often poisons final answer
  - Interceptor model-specific — schema gate strong models need different mitigation
  source: https://arxiv.org/abs/2604.16706
- category: ai
  title: AgentProcessBench — 8509 step label·ternary neutral·error propagation rule
  summary: AgentProcessBench(RUCBM·arXiv 2603.14465) — first step-level effectiveness benchmark for tool-augmented agent trajectories. 1000 trajectories·8509 human step annotations·89.1% IAA·ternary label(correct/neutral/erroneous). error propagation rule — post-error dependent steps labeled erroneous until explicit correction or independent subtask — prevents spurious credit. findings — weak models inflate correct-step ratio via early termination; neutral vs error distinction hard; process signal complements outcome supervision for test-time scaling. vs ProcCtrlBench(defect ontology) ·AgentProp(injection propagation) — AgentProcessBench=human step label ground truth.
  points:
  - 8509 step labels — not end-to-end pass rate only
  - Propagation rule — downstream steps don't get free credit after error
  - Early termination bias — weak models look better on step ratio
  source: https://arxiv.org/abs/2603.14465
- category: ai
  level: "중급"
  title: Android Bench 2.0 — Android 코딩 에이전트를 완성도와 실제 UI로 평가하기
  summary: Android Bench 2.0은 범용 코딩 점수로 놓치기 쉬운 Android 앱 개발 능력을 평가한다. 30개 장기 과제를 에이전트별로 5회 실행하고, 빌드·계측 테스트·데이터 상태뿐 아니라 에뮬레이터 UI와 접근성 트리도 확인한다. 모든 검증을 통과한 비율(pass rate)과 실패한 과제의 진행 정도(completion rate)를 함께 본다. 따라서 순위만 비교하지 말고 과제 묶음·에이전트 설정·신뢰 구간·비용도 함께 읽는다.
  points:
  - 과제는 앱 생성·기능 추가·마이그레이션·크로스플랫폼 앱의 Android 전환까지 포함
  - pass rate는 완전 통과, completion rate는 통과하지 못한 실행의 부분 진척을 보완
  - 시각 평가는 스크린샷만 보지 않고 UI 탐색과 접근성 트리도 함께 검사
  source: https://developer.android.com/bench
  interview: "Android Bench 2.0에서 pass rate만 보면 어떤 정보를 놓치며, 이를 어떤 지표가 보완하나요?"
  answer: "pass rate는 완전한 성공 여부만 보여 주므로 거의 끝났지만 일부 검증에 실패한 실행과 시작도 못 한 실행을 구분하지 못한다. completion rate가 기능·회귀·요구사항·시각 검증의 부분 진척을 보완한다. 다만 두 지표 모두 특정 과제·에이전트 설정의 결과이므로 반복 실행 수, 신뢰 구간, 지연·비용과 함께 해석해야 한다."
- category: ai
  title: Claude Code Routines — cloud prompt+repo+connectors·schedule·GitHub·API fire
  summary: Claude Code Routines(research preview·v2.1.105+·2026-04) — saved config(prompt·repo·connectors) running on Anthropic cloud infrastructure — laptop closed OK. triggers — cron schedule(min 1h recurring)·GitHub PR/release filters·POST /fire API(bearer token·experimental-cc-routine-2026-04-01 beta header). create from claude.ai/code/routines·Desktop Remote·CLI /schedule. autonomous full session — no permission prompts, shell+repo skills+connectors scoped per routine. Pro 5/day·Max 15·Team/Enterprise 25 daily routine cap. vs /loop(session-bound·local files) ·Cursor Automations(multi-repo cloud) ·Desktop scheduled task(local machine on) — Routines=Anthropic-hosted repo-centric automation.
