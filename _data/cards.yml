  title: flutter_doclayout_kit — PP-DocLayout ONNX로 문서 구조를 온디바이스 분석, 23종 요소 감지(Flutter)
  summary: 'flutter_doclayout_kit는 PaddlePaddle의 PP-DocLayout 모델을 ONNX Runtime으로 모바일에서 실행해 문서 레이아웃을 분석하는 Flutter 플러그인이다. 텍스트·제목·표·수식·그림 등 23종 문서 요소를 감지. Medium 모델(22MB)과 Large 모델(123MB) 선택 가능. 오프라인 완전 지원, iOS는 Core ML Execution Provider로 가속(메모리 ~1.5GB). 카메라 실시간 스캔·정적 이미지 분석·폼 재구성까지 엔드투엔드 워크플로우.

    '
  points:
  - '23종 요소 감지: 텍스트·제목·표·수식·그림·헤더·참조·방정식'
  - 'PP-DocLayout: Medium(22MB, 빠름) / Large(123MB, 정확)'
  - iOS Core ML 가속 + Android ONNX Runtime, 완전 오프라인
  source: https://github.com/robert008/flutter_doclayout_kit
