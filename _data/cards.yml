- category: ai
  title: 'Codex Record & Replay: 손으로 보여 준 반복 업무를 재사용 스킬로 바꾸기'
  summary: 'OpenAI Codex의 Record & Replay는 말로 설명하기 애매한 반복 업무를 한 번 시연한 뒤, 다시 쓸 수 있는 스킬로 포장하는 macOS 기능이다. 2026-06-18 Codex changelog에 추가됐고, 초기 제공 지역은 EEA·영국·스위스를 제외하며 Computer Use가 켜져 있어야 한다. 사용자는 지출 처리, 이슈 생성, 리포트 다운로드처럼 선호도와 입력값이 섞인 워크플로를 짧게 녹화하고, Codex는 필요한 입력, 실행 단계, 검증 방법을 담은 skill 초안을 만든다. 재실행 때는 새 날짜·파일·이슈 제목처럼 달라지는 값만 주고 Computer Use, 브라우저 액션, 설치된 플러그인을 조합해 흐름을 반복한다. 실무 교훈은 "자동화 스크립트를 먼저 짜기"가 아니라, 안정적인 성공 기준이 있는 수작업을 시연-스킬-검증 루프로 작게 캡처한 뒤 팀에 배포할 것은 별도 플러그인으로 승격하라는 점이다.

    '
  points:
  - '공식 changelog: 2026-06-18 Codex app 26.616에서 Record & Replay 추가'
  - '조건: macOS, Computer Use enabled, 초기 제공 지역은 EEA·UK·Switzerland 제외'
  - 짧고 완결된 시연 → 입력·단계·검증을 담은 reusable skill 초안 생성
  source: https://developers.openai.com/codex/record-and-replay
- category: ai
  title: 'Codex App Server: Codex를 제품 안 리치 클라이언트로 붙이는 프로토콜'
  summary: 'Codex App Server는 Codex VS Code 확장 같은 리치 클라이언트를 구동하는 공식 인터페이스다. OpenAI 문서는 제품 안에 Codex를 깊게 붙이고 싶을 때 인증, 대화 기록, 승인, 스트리밍 에이전트 이벤트를 다루는 경로로 app-server를 설명한다. 같은 런에서 openai/codex는 92,966★, 13,757 forks, Apache-2.0, 2026-06-23 push를 확인했고, app-server 디렉터리도 같은 날 커밋이 있었다. 프로토콜은 MCP처럼 JSON-RPC 2.0 기반 양방향 통신을 쓰며, 기본 stdio(JSONL), 실험적 WebSocket, Unix socket transport를 지원한다. 중요한 경계는 CI나 백그라운드 자동화에는 Codex SDK를 쓰고, 사용자가 보는 대화형 제품 통합에는 app-server를 쓰라는 점이다.

    '
  points:
  - '공식 용도: 인증·대화 기록·승인·streamed agent events가 필요한 제품 내 Codex 통합'
  - '프로토콜: JSON-RPC 2.0, stdio 기본, WebSocket은 experimental/unsupported, Unix socket 지원'
  - '같은 런 검증: openai/codex 92,966★, 13,757 forks, Apache-2.0, app-server 2026-06-23 커밋'
  source: https://developers.openai.com/codex/app-server
- category: ai
  title: 'Assistants API 종료 D-64: Responses API 이주는 모델 교체가 아니라 상태 모델 교체'
  summary: 'OpenAI 공식 migration guide는 Assistants API가 Responses API와 기능 동등성에 도달한 뒤 deprecated 되었고, 2026-08-26에 종료된다고 명시한다. 이주는 단순히 엔드포인트 이름을 바꾸는 작업이 아니다. Assistants는 Assistant/Thread/Run/Run step 중심이었지만, 새 구조는 Prompt/Conversation/Response/Item으로 바뀐다. 도구 호출 루프도 더 명시적으로 관리하고, Responses API 쪽에서 deep research, MCP, computer use 같은 새 기능을 받는다. 따라서 마이그레이션 체크리스트는 "호출 API 교체"보다 먼저 상태 저장 위치, 대화 객체 수명, tool call 재시도, 파일 검색/검색 도구 사용법, 기존 thread 데이터 전환 여부를 분리해 보는 것이 안전하다.

    '
  points:
  - '공식 종료일: Assistants API shutdown 2026-08-26'
  - '개념 매핑: Assistants→Prompts, Threads→Conversations, Runs→Responses, Run steps→Items'
  - '실무 포인트: tool loop·conversation state·file/search 도구를 별도 마이그레이션 항목으로 분리'
  source: https://developers.openai.com/api/docs/assistants/migration
- category: ai
  title: agent-browser — 브라우저 자동화를 AI 에이전트용 CLI로 얇게 빼기
  summary: 'Vercel Labs의 agent-browser는 AI 에이전트가 브라우저를 조작하기 위한 Rust 네이티브 CLI다. 2026-06-24 같은 런에서 GitHub 36,900★, 2,348 forks, Apache-2.0, 최신 릴리스 v0.29.0 (2026-06-21)을 확인했다. README 기준 핵심은 Playwright 스크립트를 매번 새로 짜는 것이 아니라 `snapshot`으로 접근성 트리와 `@e2` 같은 ref를 받고, `click`·`fill`·`get`·`screenshot`·`batch` 명령을 작은 도구 호출처럼 조합하는 것이다. Chrome for Testing을 내려받아 쓰고, 기존 Chrome, Brave, Playwright, Puppeteer 설치도 감지한다. 브라우저 상태 저장, 네트워크 route/HAR, 콘솔·에러, visual diff, React tree/Web Vitals까지 CLI 표면으로 노출하므로, 에이전트 브라우저 QA는 "비전으로 화면을 맞히기"보다 접근성 snapshot, 안정 ref, 재현 가능한 batch, 필요한 순간의 증거 캡처를 우선 설계하는 편이 낫다.

    '
  points:
  - '같은 런 검증: 36,900★, 2,348 forks, Apache-2.0, v0.29.0(2026-06-21)'
  - 'AI 친화 조작: accessibility snapshot refs + click/fill/get/screenshot + batch 실행'
  - '검증 표면: state, network route/HAR, console/errors, visual diff, React tree, Web Vitals'
  source: https://github.com/vercel-labs/agent-browser
- category: ai
  title: 'DeepMind AI Control Roadmap: 에이전트를 ''잠재적 내부자 위협''으로 다루는 보안 설계'
  summary: 'Google DeepMind가 2026-06-18 공개한 AI Control Roadmap은 강력한 에이전트가 완벽히 정렬되어 있다고 가정하지 않고, 내부 시스템에 접근한 잠재적 insider threat처럼 다루는 방어 심층 전략이다. 전통 보안(샌드박스·엔드포인트 보안·프롬프트 인젝션 저항) 위에 alignment를 1차 방어로 두되, 실패할 수 있다고 보고 supervisor AI가 에이전트의 reasoning·action·plan을 감시한다. 위험도는 detection evasion 능력(D1-D4)과 attack execution 능력(R1-R3)에 맞춰 올리고, 저위험 작업은 사후 transcript 리뷰·알림으로, 고위험 작업은 실시간 차단·접근 제한·종료 인프라로 대응한다. 실무 교훈은 에이전트 권한을 사람 계정과 똑같이 복사하지 말고, coverage·recall·time-to-response로 감시 품질을 재며 점진적으로 권한을 열어야 한다는 점이다.

    '
  points:
  - '공식 발표: 2026-06-18 AI Control Roadmap, 내부 에이전트를 잠재적 insider threat로 threat-modeling'
  - '통제 축: supervisor AI monitoring, asynchronous alert, synchronous block/response, capability-based escalation'
  - '운영 지표: coverage·recall·time-to-response로 에이전트 보안 통제가 실제로 작동하는지 측정'
  source: https://deepmind.google/blog/securing-the-future-of-ai-agents/
- category: ai
  title: 'Copilot CLI GA: 터미널 에이전트도 이슈·MCP·스킬을 한 화면에서 다룬다'
  summary: 'GitHub은 2026-06-23 Copilot CLI의 새 터미널 인터페이스를 GA로 전환했다. 핵심은 코딩 에이전트를 "프롬프트 입력창"이 아니라 GitHub 작업 큐와 도구 구성을 함께 보는 운영 표면으로 만든 점이다. 저장소 안에서 CLI를 열면 Session, Issues, Pull requests, Gists 탭을 오가며 항목을 찾고, 선택한 이슈나 PR을 프롬프트에 참조로 넣어 조사·수정·댓글·리뷰를 요청할 수 있다. 도구 설정도 파일 편집 대신 세션 안 명령으로 옮겼다. `/mcp search`는 GitHub MCP Registry에서 서버를 찾아 설치하고, `/mcp add`는 MCP 서버 추가를 안내하며, 새 서버는 CLI 재시작 없이 바로 쓸 수 있다. `/skills`는 스킬 토글, `/plugin`은 마켓플레이스·레포·로컬 경로 플러그인 설치를 맡는다. 교훈은 터미널 AI 에이전트 UX가 모델 답변 품질만이 아니라 작업 선택, 컨텍스트 참조, 도구 설치, 접근성까지 포함한 제어면이 되어 간다는 점이다.

    '
  points:
  - 'GA 공지: 2026-06-23, Build 2026 preview였던 redesigned Copilot CLI terminal interface'
  - '작업 표면: Session/Issues/Pull requests/Gists 탭에서 이슈·PR을 프롬프트 참조로 삽입'
  - '도구 표면: /mcp search·/mcp add, /skills, /plugin, /settings를 CLI 세션 안에서 처리'
  source: https://github.blog/changelog/2026-06-23-copilot-cli-new-terminal-interface-is-generally-available/
- category: ai
  title: 'Agent Finder/ARD: 에이전트 도구를 미리 다 꽂지 말고 검색해서 붙인다'
  summary: 'GitHub이 2026-06-17 공개한 Agent Finder는 Copilot이 MCP 서버, 스킬, 캔버스, 에이전트, 도구를 매번 설정 파일에 미리 꽂아 두는 대신 작업 설명으로 검색해 찾는 기능이다. 사용자가 자연어로 일을 설명하면 Agent Finder가 선택한 레지스트리의 AI 리소스 인덱스를 검색하고, Copilot이 필요할 때 끌어올 수 있는 후보를 순위화한다. 중요한 점은 "자동 설치"가 아니라는 경계다. GitHub 공지는 엔터프라이즈 관리 설정으로 허용된 리소스만 보이게 하고, 연결 여부는 사용자가 통제한다고 설명한다. 기반 표준은 Google·GitHub·GoDaddy·Hugging Face·Microsoft가 함께 발표한 open Agentic Resource Discovery(ARD)이며, Google 발표는 ARD를 조직 도메인 아래 게시한 catalog와 이를 색인하는 registry의 조합으로 설명한다. 같은 런에서 GitHub Agent Finder 공개 카탈로그 293개 리소스, ards-project/ard-spec 268★, Apache-2.0을 확인했다. 실무 교훈은 에이전트 확장이 "컨텍스트에 도구 전부 적재"에서 "검증 가능한 카탈로그를 검색해 필요한 것만 연결"하는 거버넌스 문제로 이동한다는 점이다.

    '
  points:
  - '공식 공지: 2026-06-17 GitHub Agent Finder, Copilot이 작업에 맞는 MCP·skills·agents·tools를 검색'
  - '운영 경계: 선택한 public/private registry 안에서만 검색, managed settings로 허용 범위 제한, 자동 설치 없음'
  - 'ARD 패턴: domain-hosted catalogs + federated registries + native protocol handoff; 같은 런 검증 293 catalog resources, ard-spec 268★'
  source: https://github.blog/changelog/2026-06-17-agent-finder-for-github-copilot-now-available/
- category: ai
  title: 'Reusable prompts 종료: 프롬프트도 코드 리뷰·테스트 대상이 된다'
  summary: 'OpenAI는 2026-06-03 reusable prompt objects의 deprecation을 공지했고, `v1/prompts` API와 reusable prompt objects를 2026-11-30에 종료할 예정이라고 문서화했다. 최신 prompt engineering 가이드는 새 작업에서 production prompt를 대시보드 객체로 저장하지 말고 애플리케이션 코드 안의 작은 prompt builder로 옮기라고 권한다. 동적 값은 typed function argument나 schema로 받고, 생성된 `instructions`와 `input`을 Responses API에 직접 넘기며, 변경 전에는 대표 fixture, 테스트, evaluation check를 붙이라는 흐름이다. 실무 교훈은 "프롬프트 관리 UI"에 의존하지 말고 프롬프트를 코드 변경처럼 diff, 리뷰, 테스트, feature flag, 배포 파이프라인으로 다루라는 점이다.

    '
  points:
  - '공식 일정: 2026-06-03 deprecation 공지, 2026-11-30 `v1/prompts`/reusable prompt objects 종료 예정'
  - '이주 방향: prompt content를 application code로 옮기고 Responses API에 instructions/input으로 전달'
  - '운영 원칙: typed inputs, fixtures, tests, eval checks, staged rollout로 프롬프트 변경을 관리'
  source: https://developers.openai.com/api/docs/deprecations
- category: ai
  title: 'Codex rollout token budgets: 에이전트 루프를 토큰 예산으로 강제 중단하기'
  summary: 'OpenAI Codex CLI 0.142.0은 "rollout token budget"을 추가해 여러 agent thread에 걸친 사용량을 추적하고, 남은 예산을 알려 주며, 예산이 끝나면 turn을 중단할 수 있게 했다. 같은 릴리스는 app-server 클라이언트가 multi-agent delegation을 thread/turn 단위로 disabled, explicit-request-only, proactive 중 하나로 설정할 수 있게 했고, indexed web-search mode도 추가했다. 개발자에게 중요한 점은 에이전트 자동화를 "열심히 돌리기"가 아니라 예산·위임 수준·웹 접근 경계를 먼저 정한 뒤 실행하는 운영 문제로 본다는 것이다. 같은 런에서 openai/codex는 Apache-2.0, 93,151★, 13,776 forks, 2026-06-24 push를 확인했다.

    '
  points:
  - '0.142.0: agent threads 전체 token budget 추적, remaining reminder, exhausted turn abort'
  - 'app-server: multi-agent delegation을 thread/turn별 disabled·explicit-request-only·proactive로 제어'
  - '운영 교훈: 장기 에이전트 실행은 모델명보다 예산·위임·웹 접근 정책을 먼저 고정'
  source: https://developers.openai.com/codex/changelog
- category: ai
  title: 'Codex Security artifacts: AI 보안 스캔 결과를 SARIF·백로그 티켓으로 넘기기'
  summary: 'Codex Security plugin 0.1.9의 중요한 변화는 "AI가 취약점을 찾았다"에서 끝내지 않고, 결과를 다른 보안 운영 도구가 읽을 수 있는 산출물로 고정하는 흐름이다. 완료된 scan은 findings workspace에서 findings, coverage, severity, confidence, scan artifact를 함께 검토하고, export 단계에서 JSON·CSV·SARIF로 내보낼 수 있다. 전체 맥락이 필요하면 `scan-manifest.json`, `findings.json`, `coverage.json`을 같이 보관한다. backlog triage는 scanner, advisory, bug bounty, GitHub/Jira/Linear, Codex Security 결과를 현재 코드베이스와 대조해 confirmed·needs_review·not_actionable verdict와 우선순위 큐를 만든다. track findings는 Linear/GitHub/Jira issue나 private draft GitHub Security Advisory payload를 만들되, 중복 확인, destination visibility, 정확한 본문을 보여 주고 승인 전에는 쓰지 않는다. 교훈은 AI 보안 자동화의 핵심이 "탐지"보다 traceable evidence, portable format, approval-gated handoff라는 점이다.

    '
  points:
  - '0.1.9: findings workspace에서 coverage·severity·confidence·evidence·scan artifacts를 함께 검토'
  - 'Export: sealed scan 결과를 JSON·CSV·SARIF로 내보내고 manifest/findings/coverage 맥락 보존'
  - 'Triage/Track: 기존 finding을 코드베이스에 대조해 verdict·priority를 만들고, 티켓/보안권고 쓰기는 승인 후 실행'
  source: https://developers.openai.com/codex/security/plugin/changelog
- category: ai
  title: Claude Artifacts — 대화 옆에서 코드·앱·대시보드를 미리보기·편집·공유하는 인터랙티브 출력 패널
  summary: 'Claude Artifacts는 HTML·React·SVG·Mermaid·Markdown 등 독립 콘텐츠를 대화 옆 패널에 렌더링하는 출력 형식이다. 2024년 GA 이후 2026년에는 Live Artifacts(MCP로 Google Sheets·Linear 등 실시간 데이터 연동), 세션 간 20MB persistent storage(Pro+), 공개 링크 공유가 추가됐다. 백엔드 없이 브라우저 샌드박스에서 동작하며 CDN 라이브러리(React·Tailwind·Recharts) 사용 가능. Projects·Skills와 구분: Artifacts는 ''작업 결과물'', Skills는 ''반복 절차'', Projects는 ''지속 컨텍스트 방''.'
  points:
  - 'Live Artifacts: MCP 연결로 재오픈 시 데이터 자동 갱신(2026-04)'
  - 'Persistent storage: Pro+에서 아티팩트당 20MB, 상태ful 앱 가능'
  - '공개 링크: Claude 계정 없이도 열람·리믹스 가능'
  source: https://www.anthropic.com/news/projects
- category: ai
