- category: android
  level: "중급"
  title: "Android App Links — 도메인 검증으로 HTTPS 링크 연결"
  summary: "Android App Links는 웹 도메인과 앱의 연결을 검증하는 HTTPS 딥링크다. 매니페스트의 `android:autoVerify=\"true\"`만으로는 부족하며, 도메인에 앱 패키지와 서명 지문을 담은 `assetlinks.json`을 게시해야 한다."
