      - "모델 비종속 BYOK — Anthropic·OpenAI·Google Gemini·OpenRouter(200+ 모델)·Bedrock·Azure/Vertex·Groq·Cerebras, 그리고 Ollama/LM Studio로 완전 로컬까지. 'AI 프로바이더 하나에 잠기지 않는다'를 명시"
      - "도구 — 터미널 명령을 돌리고 출력을 실시간 관찰(설치·테스트·배포), 웹 브라우징, MCP 서버 연결(DB·API·클라우드, CLI에선 cline mcp로 관리). SDK·CLI·Kanban·VS Code·JetBrains 등 형태로 제공"
    source: "https://github.com/cline/cline"
  - category: ai
    title: "Claude Squad — tmux+git worktree로 여러 코딩 에이전트를 한 터미널에서 병렬로 돌리는 TUI(AGPL·~7.8k★)"
