  title: AI 모바일 테스트 2026 — Vision AI(Drizz·Quash)·에이전틱 LLM(QA Wolf)·디바이스 클라우드 3축
  summary: '2026년 AI 모바일 테스트 도구는 3축으로 분류된다. Vision AI 네이티브(Drizz·Quash): 자연어로 테스트 의도 기술, 셀렉터 없이 비전 AI가 실행·자가 수정, 5% 플레이크율. 에이전틱 LLM(QA Wolf· Panto AI): LLM이 Playwright/Appium 코드를 생성, 결정론적 실행+코드 감사 가능. AI 강화 디바이스 클라우드(BrowserStack·Sauce Labs): 30K+ 실제 디바이스에 셀프힐링 로케이터 적용. PRD/Figma에서 자동 테스트 생성(Quash), 자연어 E2E(testRigor·Autonoma), CI/CD 파이프라인 통합이 공통 트렌드.

    '
