  summary: MCP 2025-06-18의 Elicitation은 서버가 도구·워크플로 실행 중 빠진 정보를 클라이언트를 통해 사용자에게 다시 물을 수 있게 하는 기능이다. 서버는 `elicitation/create` 요청에 메시지와 `requestedSchema`를 담고, 클라이언트는 사용자가 검토·수정·거절·취소할 수 있는 UI를 제공한다. 스키마는 구현 부담을 줄이려고 평평한 object와 string/number/boolean/enum 같은 primitive 중심으로 제한된다. 교훈은 "처음 프롬프트에 모든 경우의 질문을 우겨 넣기"가 아니라, 툴 실행 지점에서 필요한 필드만 구조화해 물어보는 것이다. 단, spec은 elicitation으로 비밀번호·API 키·토큰·결제 정보 같은 민감 정보를 요구하지 말라고 못박고, 클라이언트가 어떤 서버가 묻는지 명확히 보여주고 decline/cancel을 지원해야 한다고 요구한다.
