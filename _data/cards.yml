  title: Structured Outputs — LLM에서 스키마 준수 JSON을 보장하는 프로덕션 패턴, strict:true로 제약 디코딩
  summary: 'Structured Outputs는 LLM이 JSON 스키마를 토큰 생성 레벨에서 강제 준수하게 하는 기능이다. OpenAI response_format(type:json_schema, strict:true)로 정확한 스키마 출력 보장. Function Calling(tool use)은 모델이 외부 도구 호출을 결정할 때 사용. JSON 모드는 ''아무 JSON'', Structured Outputs는 ''정확한 스키마 JSON'', Function Calling은 ''액션 결정''. 프로덕션 패턴: Function Calling(라우팅) + Structured Outputs(포맷 보장). Instructor 라이브러리로 Pydantic 검증+자동 재시도.

    '
  points:
  - 'strict:true: 토큰 레벨 스키마 강제(제약 디코딩)'
  - '3가지 구분: JSON 모드 vs Structured Outputs vs Function Calling'
  - '프로덕션: FC(라우팅) + SO(포맷) + Instructor(검증)'
  source: https://wolf-tech.io/blog/structured-llm-outputs-in-production-json-mode-tool-use-and-validation-patterns
