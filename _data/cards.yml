      마크다운 규칙을 한 번만 써두고 `npx @intellectronica/ruler apply`로 각 에이전트의 설정 파일에 자동 배포한다.
      `.ruler/`의 .md들을 정해진 순서로 합쳐 출처 주석을 달아 내보내고, ruler.toml로 어떤 에이전트에 보낼지·MCP 서버
      설정까지 함께 뿌릴 수 있다(merge/overwrite). MIT·2.7k★(2026-06 1차 출처 확인).
