  summary: 프롬프트 맨 앞에 `!`를 입력하면 셸 모드로 전환된다. 명령을 입력하고 실행하면 명령과 출력이 대화에 추가되므로, 결과를 Claude에게 이어서 분석해 달라고 요청할 수 있다.
  points:
  - "Enter로 명령을 실행하는 사용자 주도 입력 모드이며, 슬래시 스킬의 사전 셸 삽입(`!`명령``)과 다름"
  - "긴 실행은 `Ctrl+B`로 백그라운드 전환 가능; tmux에서는 두 번 누름"
  - "`Escape`로 현재 셸 입력을 취소하고 일반 프롬프트로 돌아감"
  source: https://code.claude.com/docs/en/interactive-mode
  interview: "프롬프트 첫 글자의 `!` 셸 모드와 스킬 본문 안 `!`명령``은 언제 실행되며 무엇이 다른가요?"
  answer: "첫 번째는 사용자가 셸 모드에서 명령을 입력하고 Enter로 실행하는 대화 입력 방식이다. 스킬 본문의 삽입 명령은 스킬 내용이 Claude에게 전달되기 전에 실행되어 그 출력으로 본문을 채운다."
- category: ai
