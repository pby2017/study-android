  title: Sentry Seer — Android 장애는 텔레메트리로 진단하고 에이전트에 넘긴다
  summary: 'Sentry 모바일 모니터링은 Android 크래시·ANR와 함께 스택 트레이스, 기기·OS, 사용자 동작 등의 맥락을 모은다. Seer는 이런 오류·트레이스·로그·프로파일과 연결된 코드를 분석해 원인과 수정 계획을 만든다. Sentry MCP/에이전트 플러그인으로 진단 결과를 익숙한 코딩 에이전트에 넘겨 구현하게 하거나, Seer Autofix가 PR 초안을 만들 수 있다. 단순한 이벤트 조회와 근본원인 분석은 다른 단계이므로, 문제 복잡도에 따라 적절한 도구를 고른다.'
  points:
  - 'Seer: 연결된 런타임 증거를 엮어 원인과 수정 계획을 도출; 단순 오류는 MCP 이벤트 조회만으로 충분할 수 있음'
  - '구현: 코딩 에이전트에 구조화된 진단을 전달하거나 Seer Autofix에 PR 생성을 맡김'
  - '권한: Seer Agent의 Sentry 쓰기 작업은 사용자 권한을 따르고, 필요한 권한이 없으면 실행 전 확인'
  source: https://sentry.io/about/press-releases/sentry-expands-seer-ai-debugging-agent
  sources:
  - label: 'Sentry 공식 블로그 — Seer, MCP, CLI와 코딩 에이전트의 역할 구분'
    url: https://blog.sentry.io/seer-mcp-cli-or-coding-agent/
  - label: 'Sentry Android 모니터링 — 크래시·ANR 및 기기·사용자 맥락'
    url: https://sentry.io/solutions/mobile-developers/
  - label: 'Seer Agent 업데이트 — 쓰기 권한은 사용자 권한을 따르고 부족한 권한은 확인'
    url: https://sentry.io/changelog/seer-agent-updates/
  - label: 'Sentry 발표 — MCP를 통한 로컬 코딩 에이전트 연결과 텔레메트리 기반 RCA'
    url: https://sentry.io/about/press-releases/sentry-expands-seer-ai-debugging-agent/
  interview: 'Android 앱에서 발생한 복합 장애를 코딩 에이전트가 수정하게 하려면, 크래시 스택만 넘기는 대신 Sentry Seer와 MCP를 어떻게 나눠 쓸 수 있나요?'
  answer: 'Sentry MCP로 관련 이벤트와 런타임 맥락을 연결하고, Seer가 여러 텔레메트리와 코드를 바탕으로 근본원인·수정 계획을 만들게 한다. 그 결과를 코딩 에이전트에 넘겨 구현·검증하게 하거나 Seer Autofix에 PR 초안 작성을 맡길 수 있다. 단순 조회에는 전체 RCA가 필요하지 않을 수 있다.'
- category: ai
  level: 초급
  title: Google Jules 서비스 종료 — GitHub 코드와 에이전트 기록은 따로 보존
  summary: 'Google은 Jules를 2026-12-31에 종료한다고 10월 29일 발표했고, 11월 11일부터 읽기 전용으로 전환했다. 저장소 코드·브랜치·PR은 GitHub에 남지만, Jules 안의 설정·환경 변수·예약 작업·연결 저장소·메모리·셋업 스크립트·세션 기록은 별도로 내보내야 한다. Jules Tools의 공식 내보내기 절차를 종료 전에 실행하고, 내보낸 파일에는 민감한 값이 포함될 수 있으므로 내용을 확인해 안전하게 보관한다.'
  points:
  - '상태: 2026-11-22 기준 읽기 전용; 서비스 종료 예정일은 2026-12-31'
  - 'GitHub에 남는 것: 저장소 코드·브랜치·pull request'
  - '내보낼 것: 환경 변수·예약 작업·메모리·셋업 스크립트·프롬프트·계획·세션 이력'
  source: https://jules.google/docs/changelog/
  sources:
  - label: 'Jules 공식 종료 공지 — 읽기 전환일, 종료일, 데이터 내보내기 범위'
    url: https://jules.google/docs/changelog/
  - label: 'Jules Tools 공식 CLI — 설치·로그인·세션 조회와 코드 pull'
    url: https://jules.google/docs/cli/reference
  interview: 'Jules가 종료되면 기존 GitHub PR과 Jules의 예약 작업·세션 기록도 모두 같은 방식으로 보존되나요?'
  answer: '아니다. 코드·브랜치·PR은 GitHub에 남지만 예약 작업, 설정, 메모리, 셋업 스크립트, 세션의 프롬프트·계획·활동 이력은 Jules에 저장된다. 공식 내보내기를 종료 전에 실행하고, 환경 변수 등 민감한 값은 안전하게 관리해야 한다.'
- category: ai
  level: "중급"
  title: /fork — 서브에이전트와 달리 '대화 전체'를 물려받는 분신 띄우기
  summary: 'Claude Code의 fork는 새 컨텍스트로 시작하는 일반 서브에이전트와 달리 부모의 대화 기록·시스템 프롬프트·도구·모델을 이어받는 병렬 작업이다. 같은 배경을 다시 전달할 필요가 있는 조사나 여러 접근법 비교에 적합하다. fork가 만든 도구 호출은 부모 대화에 섞이지 않고 최종 결과만 돌아오며, 실행 중에는 패널에서 기록을 열어 추가 지시를 보낼 수 있다. Agent 도구로 fork를 시작할 때 `isolation: "worktree"`를 지정하면 파일 변경을 별도 worktree에서 할 수 있다. fork의 첫 요청은 부모와 시스템 프롬프트·도구 정의가 같아 prompt cache를 재사용하지만, 이 맥락 상속 때문에 독립된 권한·지침이 필요한 작업에는 일반 서브에이전트가 더 알맞다.'
  points:
  - "fork는 전체 대화 맥락을 상속하고, 일반 서브에이전트는 전달한 요청으로 새 컨텍스트를 시작한다."
  - "fork의 도구 호출은 부모 대화와 분리되며 완료된 최종 결과가 돌아온다."
  - "Agent 도구에서 `isolation: \"worktree\"`를 지정하면 fork의 파일 편집을 별도 worktree로 격리할 수 있다."
  source: https://code.claude.com/docs/en/sub-agents
  interview: "같은 긴 대화 맥락을 그대로 활용해 여러 해결책을 병렬로 검토하려면 fork와 일반 서브에이전트 중 무엇을 고르며, 작업 파일은 어떻게 격리할 수 있나요?"
  answer: "대화 전체를 물려받는 fork를 고른다. 파일 변경이 필요하면 Agent 도구의 `isolation: \"worktree\"`를 지정해 별도 worktree에서 실행할 수 있다."
- category: ai
  level: "중급"
  title: "Microsoft Agent Framework 악성 PyPI 릴리스 — 패키지 import 전에도 실행되는 `.pth` 훅"
  summary: "Microsoft Agent Framework의 PyPI 배포물 중 `1.26.1`과 `1.26.2`에는 Python 시작 때 실행되는 악성 `.pth` 훅이 들어가 `agent_framework`를 import하지 않아도 토큰·환경변수·자격 증명 파일을 수집할 수 있었다. GitHub Advisory Database는 두 버전을 영향 범위로 지정하고, 마지막 정상 버전을 `1.26.0`으로 기록했으며 현재 패치 버전은 없다고 표시한다. 따라서 에이전트 프레임워크 같은 개발 의존성도 lockfile에서 정확한 버전을 확인하고, 설치가 확인되면 버전만 내리는 데 그치지 말고 자격 증명 노출 대응을 해야 한다."
  points:
  - "영향 버전은 `1.26.1`·`1.26.2`; advisory 기준 정상 버전은 `1.26.0`이며 패치 버전은 아직 지정되지 않았다."
  - "`.pth` 시작 훅은 패키지를 직접 import하기 전에도 Python 시작 시 실행될 수 있다."
  - "영향 버전이 설치된 환경은 노출된 것으로 간주해 접근 가능한 자격 증명을 교체하고 CI·캐시·이미지도 조사한다."
  source: https://github.com/advisories/GHSA-764m-3ppc-5m73
  sources:
  - label: GitHub Advisory Database — 영향 범위와 대응
    url: https://github.com/advisories/GHSA-764m-3ppc-5m73
  - label: Python 공식 문서 — `.pth` 실행문은 시작 때 처리됨
    url: https://docs.python.org/3/library/site.html
  - label: PyPI — 현재 배포 이력과 패키지 보안 한계
    url: https://pypi.org/project/agent-framework/
  - label: BleepingComputer — 사고 보도와 개발 환경 대응
    url: https://www.bleepingcomputer.com/news/security/microsofts-agent-framework-pypi-package-compromised-to-steal-credentials/
  interview: "`agent-framework`를 코드에서 import하지 않았더라도 악성 `1.26.1` 설치가 위험한 이유는 무엇이며, advisory가 제시한 정상 버전은 무엇인가요?"
  answer: "Python은 site 초기화 중 `.pth` 파일의 실행문을 처리할 수 있어 import 전에 악성 코드가 실행될 수 있다. advisory는 `1.26.1`·`1.26.2`를 영향 버전, `1.26.0`을 마지막 정상 버전으로 지정한다."
- category: ai
  level: 중급
  title: Task Master — PRD를 의존성 그래프로 바꾸고 다음 실행 가능 작업 찾기
  summary: 'Task Master는 PRD를 AI 기반 작업 목록으로 변환하고, 작업마다 우선순위·상태·선행 작업을 기록한다. `task-master next`는 선행 작업이 끝난 항목 중 다음 작업을 추천한다. 단, 생성된 분해와 의존성은 초안이므로 구현 전에 검토하고, 복잡한 작업만 세부 단계로 확장한다. MCP로 연결할 때 `TASK_MASTER_TOOLS`를 설정하면 필요한 도구만 불러와 컨텍스트 사용량을 조절할 수 있다.'
  points:
  - "PRD를 작업 목록으로 만들고, 의존성으로 실행 순서를 표현한다."
  - "`task-master next`는 완료된 선행 작업을 기준으로 진행 가능한 작업을 찾는다."
  - "MCP 도구는 `TASK_MASTER_TOOLS`로 core·standard·all 또는 필요한 목록만 선택할 수 있다."
  source: https://github.com/eyaltoledano/claude-task-master
  sources:
  - label: GitHub 저장소 — 프로젝트 설명 및 실시간 stars 확인
    url: https://github.com/eyaltoledano/claude-task-master
  - label: Task Master 공식 모범 사례 — PRD 분해 후 검토·복잡도 분석·작업 갱신
    url: https://tryhamster.com/docs/taskmaster/best-practices/index
  - label: Task Master 공식 의존성 가이드 — 선행 조건과 실행 가능 작업 선택
    url: https://tryhamster.com/docs/taskmaster/task-workflow/dependencies
  - label: Task Master 공식 MCP 가이드 — 필요한 도구만 선택
    url: https://tryhamster.com/docs/taskmaster/capabilities/mcp
  interview: 'Task Master가 PRD를 작업으로 나눈 뒤에도 개발자가 의존성을 검토해야 하는 이유는 무엇인가요?'
  answer: 'AI가 만든 작업 분해와 선행 관계는 초안이다. 잘못된 의존성은 실행 순서를 막거나 잘못된 작업을 다음 단계로 추천할 수 있으므로, 검토·검증한 뒤 `task-master next`를 작업 흐름에 사용한다.'
- category: ai
  level: 고급
  title: Claude Agent SDK — 무상태 API 래퍼가 아닌 CLI 프로세스 런타임
  summary: 'Claude Agent SDK는 Python·TypeScript 앱에서 Claude Code 에이전트 루프를 실행한다. `query()`는 별도 `claude` 프로세스를 띄우며, 이 프로세스가 도구·작업 디렉터리·JSONL 세션 기록을 소유한다. 따라서 무상태 API처럼 다루지 말고 동시 실행 수, 세션 영속성, 사용자별 격리를 설계한다. 에이전트 루프 운영을 직접 맡고 싶지 않다면 Anthropic이 호스팅하는 Managed Agents와 구분해 검토한다.'
  points:
  - "`query()` 세션마다 CLI 자식 프로세스가 생기며, 기본적으로 작업 디렉터리와 세션 기록을 로컬에 둔다."
  - "Agent SDK는 도구 루프를 제공하고, Client SDK는 Messages API 호출용이다."
  - "자체 호스팅은 프로세스 수·상태 저장·테넌트 격리를 설계한다. Managed Agents는 호스팅형 대안이다."
  source: https://code.claude.com/docs/en/agent-sdk/overview
  sources:
  - label: Claude Agent SDK 공식 개요 — Agent SDK·Client SDK·CLI·Managed Agents 비교
    url: https://code.claude.com/docs/en/agent-sdk/overview
  - label: 공식 배포 가이드 — query() 프로세스 구조와 로컬 세션 상태
    url: https://code.claude.com/docs/en/agent-sdk/hosting
  - label: 공식 보안 배포 가이드 — 격리와 자격 증명 경계
    url: https://code.claude.com/docs/en/agent-sdk/secure-deployment
  interview: 'Agent SDK를 여러 사용자가 쓰는 API 서버에 붙일 때, `query()`를 무상태 함수처럼만 감싸면 놓치는 것은 무엇인가요?'
  answer: '각 세션은 별도 CLI 프로세스와 로컬 작업 디렉터리·세션 파일을 사용한다. 동시 프로세스 자원, 컨테이너 재시작 뒤의 기록 보존, 사용자 간 파일·자격 증명 격리를 함께 설계해야 한다.'
- category: ai
  level: 중급
  title: AI 코딩 에이전트의 실행 도구도 경쟁력이다 — Bun·Astral
  summary: '코딩 에이전트는 코드를 쓰는 데서 끝나지 않고, 의존성을 설치하고 코드를 실행·검증한다. Anthropic은 Claude Code 인프라에서 Bun이 맡은 역할을 밝히고 Bun 인수를 발표했다. OpenAI도 Python 도구 uv·Ruff·ty를 만든 Astral 인수를 발표했고, 창업자 Charlie Marsh는 이후 팀이 OpenAI에 합류했다고 말했다. 그렇다고 Bun·uv가 모든 프로젝트의 기본 도구라는 뜻은 아니다. 기존 프로젝트의 호환성·재현성·유지보수 기준으로 선택한다.'
  points:
  - Bun은 JavaScript/TypeScript 런타임·패키지 관리자·번들러·테스트 러너이며, Anthropic은 Claude Code 인프라 확장에 Bun이 기여했다고 밝혔다.
  - Astral의 도구는 Python 작업 흐름을 나눈다: uv는 패키지·프로젝트 관리, Ruff는 lint·format, ty는 타입 검사다.
  - 에이전트 도입 시 도구 소유권만 보지 말고 lockfile·검증 명령·라이선스·유지보수와 기존 환경 호환성을 확인한다.
  source: https://openai.com/index/openai-to-acquire-astral/
  sources:
  - label: Anthropic — Bun 인수 및 Claude Code 인프라에서의 역할
    url: https://www.anthropic.com/news/anthropic-acquires-bun-as-claude-code-reaches-usd1b-milestone
