  - '교훈: 장기 기억은 프롬프트가 아니라 검색 가능한 도구 계층으로 설계'
  source: https://github.com/rohitg00/agentmemory
- category: ai
  title: 'MCP Toolbox for Databases: 에이전트 DB 접근을 즉흥 SQL에서 구조화 도구로 바꾸기'
  summary: 'Google의 MCP Toolbox for Databases는 AI 에이전트·IDE·애플리케이션을 엔터프라이즈 데이터베이스에 연결하는 오픈소스 MCP 서버다. 같은 런에서 GitHub 15,685★, 1,612 forks, Apache-2.0, 최신 릴리스 v1.5.0(2026-06-18)을 확인했다. 빌드 타임에는 Gemini CLI, Google Antigravity, Claude Code, Codex 같은 MCP 클라이언트가 list_tables·execute_sql 같은 prebuilt 도구로 스키마를 탐색하고, 런타임에는 tools.yaml로 제한된 쿼리·시맨틱 검색·NL2SQL 도구를 정의한다. 핵심은 "에이전트에게 DB 접속 문자열을 주기"가 아니라, 권한·쿼리 형태·관측성을 가진 데이터 접근 API를 만들어 주는 것이다.

    '
  points:
  - '같은 런 검증: 15,685★, 1,612 forks, Apache-2.0, v1.5.0(2026-06-18)'
  - prebuilt 도구로 스키마 탐색·SQL 실행, custom tools로 제한된 프로덕션 도구 정의
  - '지원 범위: AlloyDB·BigQuery·Cloud SQL·Spanner·PostgreSQL·MySQL·Oracle·MongoDB·Redis 등'
  source: https://github.com/googleapis/mcp-toolbox
- category: ai
  title: 'MobileWorld: MCP까지 포함한 모바일 에이전트 벤치마크'
  summary: 'MobileWorld는 AndroidWorld 이후 모바일 에이전트 평가가 더 어려워져야 하는 이유를 보여 주는 ACL 2026 벤치마크다. arXiv v3는 201개 태스크, 20개 앱, 평균 27.8 step 장기 작업, 멀티앱 태스크 62.2%, agent-user interaction, MCP-augmented task를 제시한다. GitHub는 같은 런에서 Apache-2.0, 224★, 2026-06-23 push를 확인했다. 환경은 Docker-in-Docker 안에 rooted AVD, Mattermost·Mastodon·Mall4Uni 같은 오픈소스 앱 백엔드, API 서버를 넣고, DB 검증·로컬 저장소 검사·앱 콜백으로 성공 여부를 판정한다. 교훈은 모바일 에이전트 성능을 단일 앱 클릭 성공률로 재지 말고, 사용자와 대화하고 MCP 도구를 섞는 장기·교차앱 흐름으로 검증해야 한다는 점이다.

    '
