  title: ProjDevBench — 버그 패치가 아닌 '프로젝트를 처음부터 통째로 만들기'를 평가하는 코딩 에이전트 벤치마크
  summary: '기존 SWE-bench는 이미 있는 코드베이스에서 버그를 고치는 패치 생성 능력만 측정한다. ProjDevBench는 이와 달리 ''프로젝트 스펙을 받고 전체 레포지토리를 처음부터 구축''하는 end-to-end 개발 능력을 평가한다. Online Judge 실행 검증과 LLM 기반 코드리뷰를 결합한 이중 평가, 틀린 유형별 진단(Wrong Answer·TLE·MLE· Runtime Error) 피드백이 특징이다. Claude Code·Cursor·Codex·Augment 등 6종 에이전트를 평가할 수 있고, 현재 최고 점수는 Codex+GPT-5의 77.85%다.

    '
