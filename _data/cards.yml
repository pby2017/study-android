  title: Keploy — 실제 API 트래픽을 녹화해서 테스트 케이스를 자동 생성하는 오픈소스 AI 테스트 도구
  summary: 'Keploy는 실제 API 트래픽을 녹화(record)해서 테스트 케이스를 자동 생성하는 오픈소스 도구다. 개발자가 테스트를 직접 작성하지 않아도 실제 요청/응답 패턴에서 regression 테스트를 만들어준다. AI 기반 self-healing 로케이터와 데이터 필터링을 지원하고, Jenkins·GitHub Actions·GitLab CI/CD 등 CI/CD 파이프라인 통합이 기본. 마이크로서비스 API 테스트에 특히 적합하며, 커뮤니티 에디션은 완전 무료.

    '
  points:
  - '트래픽 녹화 → 테스트 자동 생성: 수동 테스트 작성 제거'
  - 'AI self-healing: 변경에 따라 테스트 자동 보정'
  - 'CI/CD 네이티브: Jenkins·GitHub Actions·GitLab 통합'
  source: https://keploy.io/
