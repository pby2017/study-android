cards:
- category: android
  level: "중급"
  title: android:exported — 매니페스트로 컴포넌트 공개 범위 지정
  summary: "`android:exported`는 activity, service, receiver를 다른 앱이 실행할 수 있는지 정한다. `true`는 외부 앱에 공개하므로 실제 외부 진입이 필요한 컴포넌트에만 사용하고, 내부 전용은 `false`로 둔다. Android 12 이상을 대상으로 하며 intent filter가 있는 컴포넌트는 값을 명시해야 한다. intent filter는 요청을 매칭할 뿐 호출자를 인증하지 않으므로 외부 입력도 검증한다."
  points:
  - 외부 앱 진입이 필요한 구성요소만 `android:exported="true"`로 공개
  - 내부 전용 구성요소는 `false`; 외부 공개가 필요하면 permission도 검토
  - Android 12/API 31 이상 대상 + intent filter라면 속성값을 반드시 명시
  source: https://developer.android.com/about/versions/12/behavior-changes-12#exported
  interview: "intent filter가 있으면 외부 앱의 호출이 안전하다고 볼 수 있나요?"
  answer: "아니다. intent filter는 요청을 매칭하는 규칙이지 호출자 인증이 아니다. 공개 여부를 exported로 결정하고, 필요한 경우 permission을 적용하며, 전달된 입력도 검증해야 한다."
- category: kotlin
  level: "초급"
  title: Kotlin — 정적 타입·다중 플랫폼·Java 상호운용
  summary: "Kotlin은 정적 타입의 다중 플랫폼 언어다. 타입 추론으로 표기를 줄이면서 대부분의 타입 오류를 컴파일 시점에 확인한다. JVM/Android뿐 아니라 JavaScript·Wasm·Native도 대상으로 삼으며 Java와 상호운용할 수 있다. 객체지향과 함수형 기능을 함께 지원하고, 함수형 스타일을 강제하지는 않는다. nullable 타입은 null 처리 누락을 줄이지만 `!!`와 Java의 platform type 경계에서는 NPE가 발생할 수 있다."
  points:
  - "정적 타입 + 타입 추론: 대부분의 타입 오류를 일찍 찾고 표기를 줄임"
  - "JVM/Android, JavaScript, Wasm, Native 대상으로 컴파일; Java와 상호운용"
  - "객체지향·함수형 기능을 함께 지원; null-safety는 NPE를 줄이지만 없애지는 않음"
  source: https://kotlinlang.org/docs/faq.html
  interview: "정적 타입 언어에서 컴파일 전에 타입을 아는 장점은?"
  answer: "타입 오류를 더 일찍 찾고, IDE와 컴파일러가 안전한 코드 분석을 할 수 있다. 다만 Kotlin도 `!!`나 Java 상호운용의 platform type에서는 NPE가 발생할 수 있다."
- category: kotlin
  level: "초급"
  title: Kotlin의 if·when은 값을 만드는 식
  summary: '`if`와 `when`은 조건에 맞는 분기의 값을 반환하므로 변수에 대입하거나 함수 인자로 전달할 수 있다. 식으로 쓸 때 `if`는 `else`가 필요하고, `when`은 모든 경우를 다뤄야 한다. 분기 블록에서는 마지막 식이 결과가 된다. 반면 `for`·`while` 반복문은 값을 돌려주는 식이 아니다.'
  points:
  - '`val max = if (a > b) a else b`처럼 조건 결과를 바로 대입한다.'
  - '`when`은 식과 문(statement) 양쪽으로 쓸 수 있다.'
  - 식으로 쓰는 `when`은 모든 경우를 처리해야 한다.
  source: https://kotlinlang.org/docs/control-flow.html
  interview: "`if` 결과를 변수에 대입할 때 `else`가 필요한 이유는?"
  answer: "식은 모든 경로에서 값을 정해야 한다. 조건이 거짓일 때 돌려줄 분기가 없으면 결과가 정해지지 않기 때문이다."
- category: kotlin
  level: "초급"
  title: 'Kotlin 컬렉션 — 읽기 전용과 변경'
  summary: '`List`는 읽기 작업만 노출하고 `MutableList`는 추가·삭제·수정도 허용한다. `List` 타입은 객체가 불변임을 보장하지 않는다. 다른 `MutableList` 참조가 같은 객체를 바꿀 수 있다. `list + item`은 새 읽기 전용 리스트를 만든다. 따라서 `var list: List<T>`의 `list += item`은 새 결과를 변수에 재할당하지만, `val list: MutableList<T>`의 `list += item`은 기존 리스트를 바꾼다.'
  points:
  - '`List`는 수정 API를 제공하지 않고, `MutableList`는 제공한다.'
  - '`+`는 새 컬렉션을 반환한다. 읽기 전용 `var`의 `+=`는 그 결과를 재할당한다.'
  - '변경 가능한 `val`의 `+=`는 컬렉션 객체를 직접 바꾼다.'
  source: https://kotlinlang.org/docs/collection-write.html
  interview: '`val items: MutableList<Int> = mutableListOf(1)`에서 `items += 2`는 변수를 재할당하는가?'
  answer: '아니다. `val`은 참조 재할당을 막지만 객체 변경은 막지 않는다. `MutableList`의 `+=`는 `plusAssign`으로 기존 리스트를 수정한다. 반대로 `var items: List<Int>`이면 `+=`가 `plus` 결과를 변수에 다시 대입한다.'
- category: kotlin
  level: "초급"
  title: 클래스·인터페이스 — 자바와 무엇이 다른가
  summary: 'Kotlin 클래스는 기본적으로 상속할 수 없으며, 상속을 허용하려면 `open`이 필요하다. 클래스는 클래스 하나만 상속할 수 있지만 인터페이스는 여러 개 구현할 수 있다. 인터페이스는 프로퍼티 선언과 기본 구현을 제공할 수 있지만, 자체 backing field에 상태를 저장하지는 못한다. 상속·구현은 콜론(`:`)으로 선언하고 재정의에는 `override`를 쓴다.'
  points:
  - '기본은 `final`; 상속을 허용할 클래스는 `open`으로 선언한다.'
  - '직접 상속하는 클래스는 최대 하나, 인터페이스는 여러 개 가능하다.'
  - '인터페이스 프로퍼티는 선언할 수 있지만 backing field는 가질 수 없다.'
  - '재정의에는 `override`가 필요하다.'
  source: https://kotlinlang.org/docs/interfaces.html
  interview: "인터페이스에 프로퍼티를 선언할 수 있는데도 자체 상태를 저장할 수 없는 이유는?"
  answer: "인터페이스의 프로퍼티는 구현 클래스가 제공할 접근자 계약이다. 인터페이스 자체에는 backing field를 둘 수 없으므로, 값을 저장하려면 구현 클래스가 프로퍼티를 구현해야 한다."
- category: kotlin
  level: "초급"
  title: 'Kotlin 생성자 — 매개변수와 프로퍼티'
  summary: '주 생성자는 클래스 헤더에 선언한다. 매개변수에 `val` 또는 `var`를 붙이면 인스턴스 프로퍼티가 되며, 없으면 생성과 초기화에 사용할 매개변수일 뿐 프로퍼티는 아니다. 본문 속 프로퍼티 초기화와 `init` 블록은 작성한 순서대로 실행되므로, `init`은 입력 검증에 활용할 수 있다.'
  points:
  - '`class User(name: String)`의 `name`은 생성자 매개변수다.'
  - '`class User(val name: String)`은 `name` 프로퍼티를 만든다.'
  - '`init { require(name.isNotBlank()) }`처럼 생성 시 불변 조건을 검사한다.'
  - '프로퍼티 초기화와 `init` 블록은 클래스 본문에 나온 순서대로 실행된다.'
  source: https://kotlinlang.org/docs/classes.html
  interview: '`class User(name: String)`에서 `name`을 `user.name`으로 읽을 수 없는 이유는?'
  answer: '생성자 매개변수는 `val`이나 `var`를 붙여야 프로퍼티가 된다. `val`/`var`가 없으면 생성·초기화 시점에 쓸 수 있지만 인스턴스 프로퍼티로 저장되지는 않는다.'
- category: android
  level: "중급"
  title: 'Cold Flow와 Hot Flow — 재실행과 공유'
  summary: '`flow { ... }`로 만든 cold Flow는 terminal 연산자마다 producer를 다시 실행한다. 따라서 두 collector가 같은 cold Flow를 수집하면 원본 작업도 각각 수행될 수 있다. `StateFlow`와 `SharedFlow`는 hot Flow로, collector가 producer를 새로 시작하지 않는다. cold Flow의 결과를 여러 소비자와 공유하려면 `shareIn(scope, started, replay)`를 사용하고 공유 수명과 재생 정책을 정한다.'
  points:
  - '`flow { ... }.collect()`를 두 번 호출하면 cold producer가 두 번 실행된다.'
  - '`StateFlow`는 현재 상태를, `SharedFlow`는 replay 설정에 따른 공유 값을 제공한다.'
  - '`shareIn`은 scope·시작 정책·replay 수를 지정해 cold Flow를 공유한다.'
  source: https://developer.android.com/kotlin/flow
  interview: '두 화면 구성 요소가 같은 cold Flow를 수집할 때 producer를 한 번만 실행하고 공유하려면 어떻게 하는가?'
  answer: '공유 수명이 필요한 CoroutineScope에서 `shareIn`을 적용한다. 시작 정책과 새 collector에 전달할 replay 수를 함께 정한다. `StateFlow`와 `SharedFlow`는 이미 hot Flow지만, 상태 최신값 보관과 replay 동작은 다르다.'
- category: android
  level: "중급"
  title: '`flowOn` — Flow의 upstream 컨텍스트만 바꾼다'
  summary: '`flowOn(dispatcher)`는 연산자보다 앞에 있는 upstream Flow의 실행 컨텍스트를 바꾸며, 뒤쪽 연산자와 collector에는 영향을 주지 않는다. 예를 들어 `map { ... }.flowOn(Dispatchers.IO).collect { ... }`에서 `map`은 IO 컨텍스트에서 실행되고 `collect`는 호출자의 컨텍스트에서 실행된다. 단순히 `suspend`를 선언하거나 `withContext`를 쓴다고 Flow 전체의 컨텍스트가 자동으로 이동하는 것은 아니다.'
  points:
  - '`flowOn`은 앞쪽 연산자에만 적용된다.'
  - '뒤쪽 연산자와 collector는 호출자의 컨텍스트를 유지한다.'
  - 'Dispatcher가 바뀌면 upstream과 downstream 사이에 코루틴 경계가 생길 수 있다.'
  source: https://kotlinlang.org/docs/flow.html
  interview: '`map { ... }.flowOn(Dispatchers.IO).collect { ... }`에서 `map`과 `collect`는 각각 어떤 컨텍스트에서 실행되는가?'
  answer: '`map`은 `flowOn`이 지정한 IO 컨텍스트에서 실행된다. `collect`는 collector가 호출된 원래 컨텍스트에서 실행된다. `flowOn`은 downstream으로 컨텍스트를 누출하지 않는다.'
- category: android
  level: "중급"
  title: 'withContext — main-safe 함수와 Dispatcher 경계'
  summary: 'Dispatcher는 코루틴이 실행될 스레드나 스레드 풀을 결정한다. ViewModel의 `viewModelScope`는 기본적으로 Main에서 시작하므로, 저장소의 suspend 함수가 blocking I/O를 한다면 함수 내부에서 `withContext(ioDispatcher)`로 이동해 main-safe하게 만든다. 호출자가 매번 Dispatcher를 바꾸게 하기보다 작업을 소유한 계층이 책임지고, 테스트를 위해 Dispatcher를 주입한다.'
  points:
  - '`suspend`는 호출 가능성을 나타내며 스레드를 바꾸지 않는다.'
  - '`withContext`는 해당 블록의 context를 바꾸고 완료될 때까지 suspend한다.'
  - 'blocking I/O는 IO, CPU 집약 계산은 Default를 고려한다.'
  - 'Dispatcher를 주입하면 테스트에서 TestDispatcher로 대체하기 쉽다.'
  source: https://developer.android.com/kotlin/coroutines/coroutines-best-practices
  interview: '`viewModelScope.launch` 안에서 Repository suspend 함수를 호출하면 Repository는 왜 자체적으로 main-safe해야 하는가?'
  answer: '`viewModelScope`는 기본적으로 Main에서 시작하고 호출자는 Repository가 blocking인지 알 필요가 없어야 한다. Repository가 blocking 구간을 `withContext(ioDispatcher)`로 감싸면 어느 호출 위치에서도 Main을 막지 않고, 주입된 Dispatcher는 테스트에서 교체할 수 있다.'
- category: android
  level: "중급"
  title: '코루틴 취소 — 협력적으로 멈추고 취소 예외는 전달'
  summary: '코루틴 취소는 협력적이다. 취소된 Job도 suspend 지점에 도달하거나 `ensureActive()` 등으로 취소를 확인할 때 멈춘다. 긴 비중단 반복 작업은 주기적으로 취소를 확인해야 한다. `CancellationException`을 잡아서 삼키면 취소 전파가 깨질 수 있으므로, 예외를 잡아야 한다면 다시 던지고 예상한 오류만 구체적으로 처리한다.'
  points:
  - '`delay`·`withContext` 같은 kotlinx.coroutines suspend 함수는 취소 가능하다.'
  - '긴 비중단 작업에서는 `ensureActive()` 또는 `isActive`로 취소를 확인한다.'
  - '`CancellationException`은 소비하지 말고 다시 throw한다.'
  source: https://developer.android.com/kotlin/coroutines/coroutines-best-practices
  interview: '왜 `catch (e: Exception)`에서 `CancellationException`을 삼키면 안 되는가?'
  answer: '취소도 `CancellationException`으로 전달되기 때문이다. 이를 처리 완료처럼 삼키면 부모나 lifecycle이 요청한 취소가 작업에 반영되지 않을 수 있다. 구체적 예외를 잡고 취소 예외는 전파해야 한다.'
- category: kotlin
  level: "중급"
  title: 'Android 코루틴 — suspend는 백그라운드 실행이 아니다'
  summary: '`suspend`는 함수가 중단·재개될 수 있음을 표시할 뿐, 그 자체로 새 스레드나 백그라운드 실행을 만들지 않는다. 코루틴은 `CoroutineScope` 안에서 시작하고, 부모·자식 작업의 생명주기를 연결하는 구조화된 동시성을 따른다. 화면에 필요한 작업은 `viewModelScope`처럼 화면 수명과 맞는 스코프에서 시작하면 ViewModel이 정리될 때 취소된다.'
  points:
  - '`suspend` 함수는 다른 suspend 함수나 코루틴에서 호출한다.'
  - '중단은 스레드를 막지 않는 것과 같으며, 스레드 전환을 자동 보장하지 않는다.'
  - '`viewModelScope`의 작업은 ViewModel이 clear될 때 취소된다.'
  source: https://developer.android.com/kotlin/coroutines
  interview: '`suspend fun load()`를 선언하면 호출 작업은 자동으로 백그라운드 스레드에서 실행되는가?'
  answer: '아니다. `suspend`는 중단 가능한 호출을 표현한다. 실행 스레드나 디스패처는 코루틴 컨텍스트가 결정하며, Android에서는 적절한 스코프와 디스패처를 선택해야 한다.'
- category: kotlin
  level: "중급"
  title: 'Kotlin Sequence — 지연 처리와 조기 종료'
  summary: '`List`의 `filter`·`map` 같은 연산은 각 단계를 즉시 실행하고 중간 컬렉션을 만든다. `asSequence()`로 바꾸면 연산은 최종 결과를 요청할 때 실행되며, 원소 하나씩 여러 단계를 통과한다. 따라서 `take(n)` 뒤에서 멈춰 필요한 원소만 처리할 수 있다. 다만 작은 데이터나 단순 연산에서는 지연 처리의 오버헤드가 더 클 수 있다.'
  points:
  - '`asSequence()`는 기존 컬렉션을 Sequence 처리로 연결한다.'
  - '`filter`·`map`은 중간 연산, `toList()`·`sum()`은 최종 연산이다.'
  - 'Sequence는 보통 원소별로 연산을 이어가고 `take`에서 일찍 멈출 수 있다.'
  source: https://kotlinlang.org/docs/sequences.html
  interview: '많은 원소에서 `filter { ... }.map { ... }.take(5)`를 처리할 때 Sequence가 줄일 수 있는 비용과 주의점은?'
  answer: 'Sequence는 중간 컬렉션 생성을 피하고 필요한 5개 원소를 찾으면 처리를 멈출 수 있다. 하지만 지연 평가 자체의 오버헤드가 있어 작은 컬렉션이나 단순한 연산이 항상 더 빨라지는 것은 아니다.'
- category: kotlin
  level: "초급"
  title: 'Kotlin 람다 — 함수 값과 Android SAM 변환'
  summary: '람다는 이름 없이 만든 함수 값이며, 함수 타입 매개변수로 전달할 수 있다. 마지막 매개변수가 함수이면 람다를 괄호 밖에 둘 수 있다. Android의 `setOnClickListener { ... }`는 단일 추상 메서드(`OnClickListener`)를 람다로 구현하는 SAM 변환이다. 콜백에는 이벤트가 발생했을 때 실행할 동작을 작성한다.'
  points:
  - '함수 타입 예: `(Int) -> String` — 정수 하나를 받아 문자열을 반환한다.'
  - '마지막 매개변수가 함수면 `{ ... }` 람다를 괄호 뒤에 쓸 수 있다.'
  - '`setOnClickListener { view -> ... }`는 Android SAM 변환 예다.'
  source: https://kotlinlang.org/docs/lambdas.html
  interview: 'Android의 `setOnClickListener { ... }`에서 람다를 받을 수 있는 이유는?'
  answer: '`OnClickListener`가 하나의 추상 메서드만 가진 인터페이스이므로 Kotlin이 람다를 해당 인터페이스 구현으로 SAM 변환한다.'
- category: kotlin
  level: "초급"
  title: 'Kotlin null 안전성 — ?.와 ?:의 역할'
  summary: '널 가능 타입(`T?`)은 null일 수 있음을 타입에 드러낸다. 안전 호출 `a?.length`는 `a`가 null이면 호출을 건너뛰고 null을 반환한다. Elvis 연산자 `a ?: fallback`은 null일 때 대체값을 선택한다. 이 연산자들은 nullable 값을 다루는 문법이지, 모든 NPE를 막는 보장은 아니다.'
  points:
  - '`T?`는 null을 허용하는 타입이다.'
  - '`?.`는 null이면 호출하지 않고 null을 반환한다.'
  - '`?:`는 왼쪽 값이 null일 때 대체값을 선택한다.'
  - '`!!`와 Java platform type 경계 등에서는 NPE가 여전히 가능하다.'
  source: https://kotlinlang.org/docs/null-safety.html
  interview: "`?.`와 `?:`는 각각 null을 어떻게 처리하며, 이것만으로 NPE가 사라지지 않는 이유는?"
  answer: "`?.`는 수신자가 null이면 호출을 건너뛰고 null을 반환하며, `?:`는 null일 때 대체값을 쓴다. `!!`는 null을 강제 역참조하고 Java platform type에는 Kotlin이 null 여부를 완전히 알 수 없어 NPE가 가능하다."
- category: android
  level: "초급"
  title: "Activity 생명주기 — 보임과 포커스는 다르다"
  summary: "Activity는 onCreate에서 초기화되고 onStart부터 보인다. onResume은 사용자와 상호작용할 수 있는 상태다. onPause는 포커스를 잃었다는 뜻이며 멀티윈도우에서는 여전히 보일 수 있다. onStop은 화면이 더 이상 보이지 않을 때 호출된다. 시스템은 프로세스를 종료하기 전에 onDestroy를 호출하지 않을 수 있다."
  points:
  - "onStart: 화면에 보임 · onResume: 상호작용 가능"
  - "onPause ≠ 화면이 사라짐 — 포그라운드 전용 작업만 빠르게 중지"
  - "onStop: 비표시 리소스 해제 · 프로세스 종료 콜백은 보장되지 않음"
  source: https://developer.android.com/guide/components/activities/activity-lifecycle
  interview: "onPause와 onStop은 어떻게 다른가?"
  answer: "onPause는 포커스를 잃은 상태이며 화면에 보일 수 있다. onStop은 화면이 더 이상 보이지 않는 상태다."
- category: android
  level: "중급"
  title: "화면 상태 복원 — ViewModel·SavedState·DB의 수명 구분"
  summary: "ViewModel은 회전 같은 구성 변경 동안 메모리 상태를 유지하지만 시스템이 프로세스를 종료하면 사라진다. `SavedStateHandle`이나 Compose의 `rememberSaveable`은 프로세스 복원을 위한 작고 단순한 UI 상태를 보관한다. 이 상태는 Activity가 중지될 때 저장되고, 사용자가 화면을 완전히 닫으면 복원되지 않는다. 큰 데이터와 앱의 핵심 정보는 DB 같은 영구 저장소에 두고 복원 상태에는 다시 읽을 ID 등만 저장한다."
  points:
  - "ViewModel: 구성 변경 동안 유지; 프로세스 사망 시 소멸"
  - "SavedStateHandle·rememberSaveable: 시스템 복원용 작은 UI 상태; 완전 종료 뒤에는 복원 안 됨"
  - "DB/DataStore: 앱 핵심 데이터의 영구 저장; 복원 상태에는 ID 등 최소값을 보관"
  source: https://developer.android.com/topic/libraries/architecture/saving-states
  interview: "시스템 프로세스 종료와 사용자가 앱을 최근 앱 화면에서 제거한 경우, `SavedStateHandle`은 두 경우 모두 상태를 복원하나요?"
  answer: "아니다. 시스템이 백그라운드 프로세스를 종료한 경우에는 task가 유지되면 작은 저장 상태를 복원할 수 있다. 사용자가 앱을 최근 앱에서 제거하거나 task를 끝내면 해당 저장 상태도 사라진다. 앱의 핵심 데이터는 DB 같은 영구 저장소에 둔다."
- category: android
  level: "초급"
  title: "View 레이아웃 선택 — 단순함과 계층 깊이를 기준으로"
  summary: "단순한 한 방향 배치는 LinearLayout로 충분하다. 여러 뷰를 복잡하게 정렬해야 한다면 ConstraintLayout으로 중첩 계층을 줄일 수 있다. 단, 레이아웃 종류만으로 실제 성능을 단정하지 말고 Layout Inspector나 프로파일러로 병목을 확인한다."
  points:
  - "단순한 배치: 가장 읽기 쉬운 구조를 선택"
  - "복잡한 관계: ConstraintLayout으로 불필요한 중첩을 줄이기"
  - "성능 이슈: 기기에서 측정하고 병목을 확인"
  source: https://developer.android.com/topic/performance/rendering/optimizing-view-hierarchies
  interview: "ConstraintLayout으로 바꾸면 항상 더 빠른가?"
  answer: "아니다. 계층 평탄화에 도움이 될 수 있지만 실제 비용은 기기에서 측정해야 한다."
- category: android
  level: "초급"
  title: "Material 3 — 색상·서체·형태를 하나의 테마로"
  summary: "Jetpack Compose의 Material 3는 색상 체계, 타이포그래피, 형태를 MaterialTheme에서 함께 제공한다. 테마 값을 바꾸면 그 테마를 사용하는 Material 컴포넌트에 일관되게 반영된다. 브랜드 색만 교체하는 것이 아니라 의미 색과 텍스트 위계, 모서리 형태를 함께 설계한다."
  points:
  - "MaterialTheme의 축: colorScheme · typography · shapes"
  - "기본 컴포넌트가 테마 값을 사용하도록 구성"
  - "화면별 임의 색상보다 의미 있는 테마 토큰 사용"
  interview: "Compose Material 3 테마의 핵심 세 축은 무엇인가?"
  answer: "색상 체계(colorScheme), 타이포그래피(typography), 형태(shapes)."
  source: https://developer.android.com/develop/ui/compose/designsystems/material3
- category: architecture
  level: "초급"
  title: "관심사 분리 — 화면 클래스가 모든 책임을 갖지 않게"
  summary: "화면 클래스에 표시, 입력 처리, 데이터 로딩, 정책을 모두 넣으면 변경 이유와 테스트 범위가 한곳에 모인다. 역할을 나누면 UI 동작과 데이터/비즈니스 규칙을 독립적으로 바꾸고 검증하기 쉽다. 분리는 목적이 아니라 결합도와 변경 비용을 낮추는 수단이다."
  points:
  - "화면: 상태 표시와 사용자 이벤트 전달"
  - "데이터/도메인: 데이터 접근과 재사용 규칙"
  - "작은 기능은 과도한 계층보다 필요한 경계부터 분리"
  interview: "관심사 분리는 왜 하는가?"
  answer: "각 역할의 변경 범위와 테스트 경계를 분리해 한쪽 변경이 다른 쪽에 번지는 결합을 줄인다."
  source: https://developer.android.com/topic/architecture/recommendations
- category: architecture
  level: "중급"
  title: "MVP — Presenter를 UI 계약으로 테스트하기"
  summary: "Model은 데이터를 제공하고, View는 화면을 표시하며, Presenter는 사용자 이벤트에 따라 Model을 호출하고 View 갱신을 지시한다. View를 인터페이스로 추상화하면 Presenter를 화면 프레임워크 없이 테스트하기 쉽다. 대신 인터페이스와 수동 연결 코드가 늘 수 있어 현재 앱 구조와 팀에 맞는지 판단해야 한다."
  points:
  - "Presenter가 View 인터페이스와 Model 사이를 조정"
  - "UI 프레임워크 의존을 낮춰 Presenter 테스트 가능"
  - "단점: 보일러플레이트와 수동 생명주기 관리"
  interview: "MVP에서 View 인터페이스가 테스트에 주는 이점은?"
  answer: "테스트에서 실제 Activity 대신 가짜 View를 주입해 Presenter의 이벤트 처리와 출력 명령을 검증할 수 있다."
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_05(설계기법과라이브러리활용).md
- category: architecture
  level: "중급"
  title: "Android Gradle 설정 — 모듈 DSL에서 앱 변형까지"
  summary: "Android 빌드 설정은 모듈의 Gradle DSL에서 namespace, applicationId, SDK 범위, 의존성을 정의한다. Build type(예: debug/release)과 product flavor를 조합하면 서로 다른 앱 변형을 만든다. 설정은 프로젝트 전체가 아니라 모듈과 변형의 책임에 맞게 둔다."
  points:
  - "모듈 설정에서 앱 ID·SDK·의존성 정의"
  - "Build type과 flavor 조합이 build variant를 구성"
  - "변형별 source set으로 코드·리소스 차이를 분리"
  interview: "Build variant는 어떤 설정의 조합인가?"
  answer: "빌드 타입 하나와 각 flavor dimension에서 선택된 product flavor들의 조합."
  source: https://developer.android.com/build/build-variants
- category: architecture
  level: "중급"
  title: "Android 계층형 아키텍처 — UI와 데이터 소스를 직접 연결하지 않기"
  summary: "UI는 화면 상태를 그리고 사용자 입력을 전달한다. 데이터 계층은 저장소를 통해 앱 데이터를 제공하고 대부분의 비즈니스 규칙을 소유한다. 여러 ViewModel에서 같은 규칙을 재사용하거나 복잡도를 낮춰야 할 때만 도메인 계층을 둔다."
  points:
  - "UI → (선택) Domain → Data 방향으로 의존을 정리"
  - "UI에서 Room·DataStore·네트워크 API를 직접 호출하지 않기"
  - "작은 앱은 패키지로 시작하고 필요할 때 모듈로 분리"
  source: https://developer.android.com/topic/architecture/recommendations
  interview: "도메인 계층은 모든 앱에 필요한가?"
  answer: "아니다. 여러 화면에서 공통 로직을 재사용하거나 복잡한 ViewModel 로직을 줄일 때 추가한다."
- category: android
  level: "중급"
  title: "UDF — 불변 UI 상태를 한 방향으로 갱신"
  summary: "단방향 데이터 흐름(UDF)에서는 ViewModel이 화면에 필요한 불변 UI 상태를 소유하고, UI는 그 상태를 렌더링한다. UI의 사용자 이벤트는 ViewModel 메서드로 전달하고, ViewModel은 새 상태를 만들어 다시 노출한다. 보통 private MutableStateFlow를 읽기 전용 StateFlow로 공개하고 update { it.copy(...) }로 갱신해 한 곳에서 상태 변경을 관리한다."
  points:
  - "State down: ViewModel → UI; event up: UI → ViewModel"
  - "private MutableStateFlow를 StateFlow로 노출해 변경 권한을 감춘다."
  - "불변 상태는 update { current -> current.copy(...) }로 새 스냅샷을 만든다."
  - "UI는 상태를 직접 바꾸지 않고 사용자 의도만 전달한다."
  source: https://developer.android.com/topic/architecture/ui-layer/state-production
  interview: "UI가 ViewModel의 UI 상태를 직접 수정하지 않고 이벤트를 보내야 하는 이유는?"
  answer: "ViewModel을 상태 변경의 단일 소유자로 두면 여러 계층이 같은 값을 따로 수정하는 일을 막고, 일관된 새 상태를 UI에 다시 전달할 수 있다."
- category: architecture
  level: "고급"
  title: "Repository와 단일 진실 공급원 — 캐시·네트워크 충돌을 한곳에서 정리"
  summary: "Repository는 여러 데이터 소스를 조정하고 나머지 계층에 앱 데이터를 제공한다. 각 Repository는 일관되고 최신인 데이터를 내보낼 단일 진실 공급원(SSOT)을 정해야 한다. 오프라인 우선 앱에서는 로컬 데이터베이스를 SSOT로 두는 방식을 권장한다."
  points:
  - "UI는 데이터 소스 대신 Repository에 접근"
  - "Repository마다 데이터가 최종적으로 일치할 SSOT를 정의"
  - "오프라인 우선이라면 로컬 DB를 SSOT로 고려"
  source: https://developer.android.com/topic/architecture/data-layer
  interview: "Repository가 여러 데이터 소스를 조정할 때 무엇을 일관된 읽기 기준으로 삼는가?"
  answer: "Repository가 정한 단일 진실 공급원(SSOT)을 기준으로 읽고, 충돌 시 그곳을 갱신한다."
- category: android
  level: "초급"
  title: "Compose 상태 끌어올리기 — value와 이벤트 콜백으로 분리"
  summary: "Composable 내부 상태를 호출자로 옮기면 화면은 값을 그리는 역할에 집중한다. 호출자는 현재 value와 변경 요청 콜백을 전달한다. 여러 UI가 같은 값을 읽거나 변경할 때 상태를 공통 부모로 올려 단일 진실 공급원을 만든다."
  points:
  - "상태를 읽는 컴포저블들의 가장 가까운 공통 조상으로 올리기"
  - "자식은 불변 value를 받고 변경 이벤트를 콜백으로 전달"
  - "공유할 필요 없는 단순 UI 상태는 억지로 올리지 않기"
  source: https://developer.android.com/develop/ui/compose/state-hoisting
  interview: "Compose 상태를 항상 ViewModel까지 끌어올려야 하는가?"
  answer: "아니다. 읽고 쓰는 가장 가까운 공통 소유자에 두고, 여러 화면 공유나 비즈니스 로직이 있을 때 더 올린다."
- category: architecture
  level: "고급"
  title: "오프라인 우선 읽기 — 네트워크 응답도 먼저 로컬 저장소에 반영"
  summary: "네트워크를 사용하는 오프라인 우선 Repository는 로컬과 원격 데이터 소스를 조정한다. UI를 포함한 상위 계층은 로컬 데이터 소스만 읽고, 서버 응답은 로컬 저장소를 갱신해 화면에 반영한다. 최소 요구는 네트워크가 없어도 핵심 데이터를 읽을 수 있는 것이다."
  points:
  - "네트워크 사용 Repository는 로컬·원격 데이터 소스를 함께 둔다"
  - "상위 계층은 로컬 SSOT만 읽어 연결 상태와 무관하게 일관성 유지"
  - "동기화 정책은 충돌 해결과 재시도 전략까지 명시"
  source: https://developer.android.com/topic/architecture/data-layer/offline-first
  interview: "오프라인 우선 앱에서 UI가 네트워크 응답을 직접 읽으면 왜 문제가 되는가?"
  answer: "상위 계층의 읽기 기준이 로컬과 서버로 갈라져 연결 상태에 따라 화면이 달라질 수 있다."
- category: android
  level: "중급"
  title: "Compose UI 테스트 — 사용자가 보는 의미를 검증"
  summary: "Compose의 Semantics tree는 UI 요소의 의미를 접근성 서비스와 테스트 프레임워크에 제공한다. UI 테스트는 기본적으로 자식 의미를 합친 merged tree를 조회한다. 따라서 클릭 가능한 부모 안의 자식 노드가 검색되지 않으면 내부 구현을 먼저 바꾸지 말고 unmerged tree를 출력해 병합 상태를 확인한다. 직접 그리는 custom UI에는 필요한 역할·레이블·동작 의미를 직접 제공한다."
  points:
  - "Semantics의 역할·상태·동작은 접근성 서비스와 UI 테스트가 함께 사용"
  - "테스트 기본값은 merged tree; 자식 노드 탐색 문제는 unmerged tree로 진단"
  - "custom Canvas/UI에는 접근성에 필요한 semantics를 직접 제공"
  interview: "클릭 가능한 Compose 부모 안의 Text를 `onNodeWithText()`가 찾지 못하면 무엇을 먼저 확인하나요?"
  answer: "테스트는 기본적으로 merged Semantics tree를 사용하고 클릭 가능한 부모는 자식 semantics를 합칠 수 있다. `onRoot(useUnmergedTree = true).printToLog()`로 unmerged tree를 확인한다. 사용자가 보는 의미를 유지하면서 필요한 matcher나 semantics를 조정한다."
  source: https://developer.android.com/develop/ui/compose/accessibility/semantics
- category: android
  level: "중급"
  title: "메인 스레드와 ANR — 느려짐은 입력 지연에서 시작"
  summary: "Android 메인(UI) 스레드는 입력 처리와 화면 그리기를 담당한다. 긴 계산이나 동기 I/O가 이 스레드를 막으면 프레임이 늦고 입력을 처리하지 못한다. 60Hz 화면의 프레임 예산은 약 16ms이며, 입력 응답 지연이 보통 수 초 이어지면 ANR이 발생할 수 있다."
  points:
  - "메인 스레드에서는 UI를 갱신하고 오래 걸리는 작업은 피하기"
  - "네트워크·디스크 I/O와 긴 계산은 적절한 백그라운드 dispatcher로 이동"
  - "ANR은 단순히 “느린 프레임”이 아니라 응답 타임아웃 문제"
  interview: "DB 조회를 Dispatchers.IO로 옮겼는데도 ANR이 날 수 있는가?"
  answer: "가능하다. 락 경합, Binder 대기 등 메인 스레드를 간접적으로 막는 원인도 추적해야 한다."
  source: https://developer.android.com/topic/performance/threads
- category: android
  level: "중급"
  title: 'repeatOnLifecycle — 여러 Flow를 동시에 수집하기'
  summary: 'Views UI에서 여러 Flow를 lifecycle에 맞춰 병렬 수집하려면 `lifecycleScope.launch` 안의 `repeatOnLifecycle(STARTED)` 블록에서 Flow마다 `launch { collect() }`를 호출한다. `collect()`는 종료될 때까지 suspend하므로 첫 수집을 순서대로 호출하면 다음 Flow에 도달하지 못한다. Lifecycle이 `STARTED` 아래로 내려가면 블록의 자식 수집이 취소되고, 다시 올라오면 새로 시작한다.'
  points:
  - '`repeatOnLifecycle`은 지정 상태에 들어갈 때 블록을 시작하고 벗어나면 취소한다.'
  - '각 Flow의 `collect`를 별도 `launch`로 감싸 병렬 수집한다.'
  - '이 패턴은 Views 기반 UI용이며 Compose에서는 `collectAsStateWithLifecycle()`을 사용한다.'
  source: https://developer.android.com/topic/libraries/architecture/views/coroutines-views
  interview: '`repeatOnLifecycle` 안에서 두 Flow를 차례로 `collect()`하면 왜 두 번째 Flow 수집이 시작되지 않는가?'
  answer: '`collect()`는 Flow가 완료될 때까지 suspend한다. 첫 Flow가 계속 방출하면 다음 줄로 진행하지 않으므로 각 수집을 자식 `launch`로 분리해야 병렬로 처리된다.'
- category: android
  level: "중급"
  title: "Compose Flow 수집 — 화면 생명주기에 맞추기"
  summary: "Compose UI에서 Flow를 상태로 읽을 때 `collectAsStateWithLifecycle()`은 기본적으로 Lifecycle이 `STARTED` 이상일 때 수집하고, 그보다 낮아지면 멈춘다. 다시 활성화되면 수집을 재개한다. `StateFlow`는 현재 값을 초기 UI 상태로 쓰지만, 일반 cold Flow는 다시 수집될 때 upstream 작업이 재실행될 수 있다. 화면의 수집 수명과 데이터 작업의 수명을 구분하고, 긴 작업은 적절한 ViewModel·공유 Flow 수명에 둔다."
  points:
  - '`collectAsStateWithLifecycle()`: 기본 `STARTED`부터 수집, 그보다 낮으면 중지; 재진입 시 재수집'
  - '`StateFlow`의 현재 값은 초기 UI 상태; cold Flow는 재수집 때 upstream을 다시 실행할 수 있음'
  - "UI 수집이 멈춰도 계속되어야 할 데이터 작업은 화면 수집기와 별도 수명으로 설계"
  source: https://developer.android.com/reference/kotlin/androidx/lifecycle/compose/collectAsStateWithLifecycle.composable
  interview: "화면이 백그라운드로 갔다 돌아오면 `collectAsStateWithLifecycle()`과 cold Flow는 어떻게 동작하나요?"
  answer: "기본 설정에서는 lifecycle이 STARTED 아래로 내려갈 때 수집을 멈추고, 다시 STARTED가 되면 Flow를 다시 수집한다. StateFlow는 최신 값을 초기 UI 상태로 제공하지만, cold Flow는 upstream 작업을 다시 수행할 수 있으므로 네트워크·데이터 작업의 소유 수명을 따로 설계해야 한다."
- category: android
  level: "고급"
  title: "Compose 부수 효과 — 작업 수명에 맞는 API 선택"
  summary: "Compose 함수 본문은 재구성될 수 있으므로 직접 부수 효과를 실행하지 않는다. Composition과 함께 시작·취소할 코루틴은 `LaunchedEffect`, 클릭 뒤 시작할 코루틴은 `rememberCoroutineScope`, 등록과 해제가 필요한 리스너는 `DisposableEffect`를 사용한다."
  points:
  - "LaunchedEffect(key): 진입 시 시작, 키 변경 시 재시작"
  - "rememberCoroutineScope: UI 이벤트에서 코루틴 시작"
  - "DisposableEffect: 외부 리스너 등록 후 onDispose에서 해제"
  source: https://developer.android.com/develop/ui/compose/side-effects
  interview: "버튼을 눌렀을 때 Snackbar를 띄우는 코루틴에 LaunchedEffect 대신 무엇을 쓸까?"
  answer: "rememberCoroutineScope을 사용한다. 작업 시작이 Composition 진입이 아니라 버튼 이벤트에 달려 있기 때문이다."
- category: android
  level: "중급"
  title: "WorkManager — 보장은 하되 정확한 시각은 약속하지 않는다"
  summary: "앱이 화면을 떠나거나 프로세스가 재시작된 뒤에도 이어져야 하는 작업에는 WorkManager를 사용한다. 작업은 제약 조건과 절전 정책을 따르므로 실행 시각은 정확히 보장되지 않는다."
  points:
  - "영속 작업은 앱 재시작·기기 재부팅 뒤에도 예약을 유지한다"
  - "네트워크·충전 등 제약 조건이 만족될 때 실행한다"
  - "정확한 시각이 필요한 알람의 대체재로 쓰지 않는다"
  source: https://developer.android.com/develop/background-work/background-tasks/persistent
  interview: "WorkManager에 1시간 주기 작업을 등록하면 매시간 정각에 실행되는가?"
  answer: "아니다. WorkManager는 전력·제약 조건을 고려해 유연한 실행 시간을 사용하며 정확한 시각을 보장하지 않는다."
- category: android
  level: "고급"
  title: "Baseline Profile — 첫 실행 경로를 미리 최적화"
  summary: "Baseline Profile은 자주 쓰는 코드 경로를 ART가 미리 최적화하도록 안내한다. 시작·탐색·스크롤 경로를 포함해 첫 실행부터 체감 성능을 개선할 수 있지만, 효과는 앱과 측정 조건에 따라 달라진다."
  points:
  - "앱에 프로필 규칙을 포함하면 ART가 대상 경로를 AOT 최적화한다"
  - "실제 대표 사용자 흐름을 프로필에 담는다"
  - "최적화 전후는 실제 기기에서 벤치마크로 확인한다"
  source: https://developer.android.com/topic/performance/baselineprofiles/overview
  interview: "Baseline Profile은 모든 앱에서 시작 시간을 일정 비율만큼 줄여 주는가?"
  answer: "아니다. 효과는 포함한 코드 경로, 라이브러리, 기기와 측정 조건에 따라 달라지므로 대표 흐름을 측정해 검증한다."
- category: android
  level: "고급"
  title: "Compose Stability — 건너뛰기는 목적이 아니라 최적화 수단"
  summary: "Compose는 재구성 시 입력이 바뀌지 않은 Composable의 실행을 생략할 수 있다. Kotlin 2.0.20부터 Strong Skipping이 기본이며, 불안정한 입력도 인스턴스 동일성으로 비교해 건너뛸 수 있다. 그렇다고 모든 타입에 안정성 어노테이션을 붙이지는 않는다. 먼저 실제 병목을 측정한다."
  points:
  - "Kotlin 2.0.20+: restartable Composable은 Strong Skipping 대상이 된다"
  - "불안정한 값은 참조 동일성(===), 안정한 값은 equals()로 비교한다"
  - "재구성 횟수만 보고 @Stable·@Immutable을 추가하지 말고 프로파일·벤치마크로 검증한다"
  source: https://developer.android.com/develop/ui/compose/performance/stability/fix
  interview: "Compose에서 재구성이 자주 보이면 모든 모델에 @Stable을 붙여야 하나?"
  answer: "아니다. 재구성 자체는 오류가 아니다. 먼저 실제 성능 병목인지 추적·측정하고, 안정성 계약과 비교 비용까지 고려해 필요한 타입만 개선한다."
- category: android
  level: "고급"
  title: "Room 스키마 마이그레이션 — 업데이트에서 데이터를 보존"
  summary: "Room 엔티티를 바꾸면 앱에 이미 저장된 DB도 새 스키마로 옮겨야 한다. 단순 변경은 자동 마이그레이션을 쓸 수 있지만, 이름 변경이나 테이블 분할처럼 의도가 모호한 변경은 직접 경로를 정의하고 기존 데이터가 보존되는지 테스트한다."
  points:
  - "DB 버전을 올릴 때 기존 버전에서 새 버전으로 가는 migration 경로를 제공한다"
  - "단순 스키마 변경은 @AutoMigration, 이름 변경·분할 등은 수동 Migration을 검토한다"
  - "MigrationTestHelper로 스키마와 행 데이터를 검증하고, destructive fallback은 데이터 삭제를 이해한 뒤 사용한다"
  source: https://developer.android.com/training/data-storage/room/migrating-db-versions
  interview: "Room DB 버전만 올리고 마이그레이션 경로를 등록하지 않으면 어떻게 되는가?"
  answer: "Room은 사용할 migration 경로가 없으면 IllegalStateException을 던진다. destructive fallback을 설정하면 누락 경로에서 테이블을 다시 만들며 기존 데이터가 삭제될 수 있다."
- category: android
  level: "고급"
  title: "PendingIntent — 앱 동작을 넘기는 위임 토큰"
  summary: "`PendingIntent`는 다른 앱에 내 앱의 정해진 동작을 대신 실행하도록 넘기는 시스템 토큰이다. 변경 가능한 토큰은 수신자가 비어 있는 Intent 필드를 채울 수 있어, 의도하지 않은 동작으로 이어질 수 있다."
  points:
  - "토큰을 받은 앱은 생성 앱 프로세스가 종료된 뒤에도 해당 동작을 요청할 수 있다"
  - "기본은 FLAG_IMMUTABLE; 인라인 답장처럼 필요한 기능에만 FLAG_MUTABLE 사용"
  - "mutable이 필요하면 대상 컴포넌트를 명시하고 action·component·package를 제한한다"
  source: https://developer.android.com/privacy-and-security/risks/pending-intent
  interview: "알림의 PendingIntent를 기본적으로 immutable로 만드는 이유는?"
  answer: "수신 앱이 fill-in 값으로 작업 대상을 바꾸지 못하게 해 위임 권한의 범위를 제한한다. 인라인 답장처럼 수신자 입력이 필요한 기능에서만 mutable을 검토한다."
- category: android
  level: "중급"
  title: "Edge-to-edge — 시스템 UI와 겹치는 콘텐츠에 Insets 적용"
