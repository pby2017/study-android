  - category: ai
    title: "공식 MCP 레지스트리 — 흩어진 MCP 서버를 한 API로 찾는 '소스 오브 트루스'"
    summary: >
      MCP 서버가 폭증하면서 '어디서 신뢰할 만한 서버를 찾나'가 문제가 됐다. 그 답이 2025-09-08 프리뷰로 공개된 공식 MCP 레지스트리다. registry.modelcontextprotocol.io에서 공개 MCP 서버의 메타데이터(엔드포인트·기능·버전)를 한곳에 모아 REST API로 검색하게 한다.
      기존 레지스트리(클라이언트별 마켓플레이스 등)를 대체하지 않고 그 위에 쌓이는 '업스트림 단일 출처' 역할이다. 클라이언트는 여기서 받아 자기만의 서브레지스트리로 가공하고, 사내용 비공개 서브레지스트리도 같은 스키마로 운영할 수 있다.
      MCP 오픈소스 커뮤니티 소유로 Anthropic·GitHub·PulseMCP·Microsoft·Block 등이 참여한다. 단, 아직 GA가 아닌 프리뷰라 데이터 리셋·호환성 깨짐 가능성이 명시돼 있어 프로덕션 의존은 주의해야 한다.
    points:
      - "검색: curl \"https://registry.modelcontextprotocol.io/v0/servers?limit=10\" — 서버 목록을 REST API로 조회"
      - "기존 레지스트리 대체 아님 — 업스트림 단일 출처, 공개·사내 서브레지스트리가 같은 스키마로 위에 쌓임"
      - "MCP 커뮤니티 소유(Anthropic·GitHub·PulseMCP·Microsoft·Block 등 참여), 레포 약 6.9k★ — 단 아직 프리뷰(데이터 리셋·breaking change 가능)"
    source: "https://blog.modelcontextprotocol.io/posts/2025-09-08-mcp-registry-preview/"
