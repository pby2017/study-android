      Zed는 Rust로 새로 짠 GPU 렌더링 오픈소스 에디터(에디터는 GPL, GPUI 프레임워크는 Apache/MIT)다. 2026-04-22 'Parallel Agents'를 내놓으며 한 창에서 여러 에이전트를 동시에 오케스트레이션하는 기능을 공식 지원했다.
      새 Threads Sidebar가 모든 스레드를 프로젝트별로 묶어 보여주고, 스레드마다 어떤 폴더·레포에 접근할지 통제한다. 스레드별로 다른 에이전트를 섞어 쓸 수 있고, 한 스레드가 여러 레포를 가로질러 읽고 쓰게 하거나, 실행 중인 스레드를 모니터링·중단할 수 있다. 원할 때 스레드마다 워크트리를 격리하는 것도 선택 가능하다.
