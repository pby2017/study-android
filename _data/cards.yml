  title: ORB-SLAM2s(Android) — 모든 Android 폰에서 6DoF SLAM·포인트 클라우드·재위치 추정(오픈소스)
  summary: 'ORB-SLAM2s는 ORB-SLAM2를 Android에 이식한 공간 컴퓨팅 도구다. 단안 카메라 입력으로 실시간 희소 포인트 클라우드 매핑, 맵 저장·로드, 재위치 추정(Relocalization)을 수행. 키포인트 시각화·매칭 통계· 바닥/표면 평면 감지·OpenGL ES AR 렌더링까지 지원. 어두운 프레임 자동 스킵으로 SLAM 스레드 블로킹 방지. VIO(Visual-Inertial Odometry) 통합과 FPS 최적화가 로드맵에 있음.

    '
