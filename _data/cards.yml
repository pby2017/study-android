    url: https://www.langchain.com/blog/introducing-open-swe-an-open-source-asynchronous-coding-agent
  interview: 'Robin/Open SWE를 팀에 배포할 때 sandbox의 GitHub 토큰과 승인 프롬프트를 사용자별 접근 제어로 간주해도 될까요?'
  answer: '아니다. 기본 sandbox 자격 증명은 개인 권한이 아니라 GitHub App 설치 범위를 따를 수 있고, push 승인은 모든 셸/API 쓰기를 통제하지 않는다. App 설치 저장소를 최소화하고 신뢰 그룹별 배포를 분리하며, 저장소 보호 규칙 등 실제 권한 경계를 적용해야 한다.'
