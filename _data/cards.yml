- category: ai
  title: Evaluation Trust Tax — per-span LLM-judge cost OTEL blind spot
  summary: Evaluation Trust Tax(Fiddler 2026) — production agent observability에서 external LLM-as-judge per span eval cost. 500K traces/day≈$260K/year eval API bill scales linearly with trace volume — OTEL GenAI semconv captures token/latency but not eval spend. Observability Tax pattern — Layer 3 quality eval at 100% traffic can cost Layers 1+2 combined. mitigation — in-environment eval(no external API·no data egress), production sample 5–20% async, high-stakes/anomaly 100% only. AgentCore Evaluations $1800/mo example 45K runs — sampling dial dev 50–100%·prod 2–5% at >100k sessions/day. vs Layer-Isolated Evaluation(deterministic gate) ·RigorBench(process rubric offline) — Trust Tax=operational cost layer beyond token observability.
  points:
  - 500K traces/day ≈ $260K/year external judge — linear with volume not inference
  - 100% production eval often 2× monitoring cost — sample async default
  - OTEL token metrics ≠ eval spend — FinOps must budget judge layer separately
  source: https://www.fiddler.ai/blog/opentelemetry-agent-telemetry-signals
- category: ai
  title: Project Solara — Android 기반 MDEP 위에 올라가는 에이전트 우선 디바이스
  level: "고급"
  summary: Project Solara는 Microsoft가 Build 2026에서 공개한 "agent-first" 프로토타입 디바이스다. 핵심은 새 앱 하나가 아니라, Microsoft Device Ecosystem Platform(MDEP)이라는 Android Open Source Project 기반 OS 계층 위에서 음성·시각·터치 입력을 Copilot 에이전트 경험과 묶는 방향이다. Microsoft는 Solara가 화면 안의 앱을 여는 대신, 주변 맥락을 보고 듣고 이해해 작업을 돕는 디바이스 비전을 보여준다고 설명한다. Android 개발자 관점의 교훈은 명확하다. AI+Android 제품은 Activity나 레이아웃만의 문제가 아니라, OS 신뢰 경계, device management, 입력 센서, 온디바이스/클라우드 에이전트 호출, 사용자 동의 UI를 한 설계로 묶어야 한다.
  points:
  - MDEP는 AOSP 기반 엔터프라이즈 디바이스 플랫폼 — Android 파생 OS 위 에이전트 경험
  - Solara는 음성·시각·터치 입력을 Copilot형 에이전트 UX로 묶는 프로토타입
  - AI+Android 설계 포인트는 앱 화면보다 OS 권한·센서·관리·동의 경계
  source: https://commandline.microsoft.com/project-solara-build-2026/
  interview: "AI 우선 Android 디바이스를 설계할 때 앱 UI 외에 어떤 경계를 함께 검토해야 하나요?"
  answer: "OS와 기기 관리 권한, 센서 입력, 온디바이스·클라우드 처리 경로, 사용자 동의 UI를 함께 검토해야 한다. 이 경계가 에이전트의 접근 범위와 데이터 처리를 결정한다."
- category: ai
  title: N-Version Coding Agents — 한 에이전트 정답보다 3개 구현 majority vote
  level: "고급"
  summary: N-Version Programming with Coding Agents(arXiv 2606.20158)는 고전적인 N-version programming을 최신 코딩 에이전트에 다시 적용한 실험이다. 저자들은 Knight-Leveson Launch Interceptor 명세를 대상으로 에이전트가 만든 48개 구현을 같은 oracle과 1,000,000개 랜덤 입력으로 검사했다. 결과는 양면적이다. 실패가 서로 독립적이지 않아 공통 실패 모드가 여전히 많이 나왔고, 애매한 명세 구간에서 실패가 함께 몰렸다. 그래도 3개 구현을 majority vote로 묶으면 평균 실패 수가 단일 구현 387.44에서 triple 130.99로 줄었고, 11,844개 N-version unit은 관측 실패가 0이었다. 교훈은 "에이전트를 여러 번 돌리면 무조건 안전"이 아니라, 서로 다른 모델·도구·언어로 만든 구현을 독립 oracle과 투표기로 묶어야 redundancy가 의미를 갖는다는 점이다.
  points:
  - 48개 에이전트 생성 구현·공유 oracle·랜덤 입력 1,000,000개로 실패 모드 비교
  - 단일 구현 평균 실패 387.44 → 3-version majority vote 130.99, 하지만 공통 실패 모드는 남음
  - 실무 적용은 같은 프롬프트 재시도보다 diverse implementation + independent oracle + voter
  source: https://arxiv.org/abs/2606.20158
  interview: "여러 코딩 에이전트의 다수결은 어떤 조건에서 신뢰도를 높이며, 무엇을 해결하지 못하나요?"
  answer: "서로 다른 구현과 독립적인 oracle·voter를 사용하면 일부 개별 실패를 줄일 수 있다. 하지만 에이전트가 같은 모호한 명세나 공통 결함을 공유하면 실패가 상관되므로 다수결만으로 안전성을 보장하지 못한다."
- category: ai
  title: GitHub Desktop 3.6 — worktree와 Copilot을 일상 Git 흐름에 붙이기
  summary: GitHub Desktop 3.6은 AI 코딩 에이전트가 만든 변경을 "터미널 밖 Git 흐름"에서 다루는 쪽으로 Copilot 통합을 넓힌 업데이트다. Copilot은 커밋 메시지 생성과 머지 충돌 해결에 붙고, 커밋 메시지는 `.github/copilot-instructions.md`와 AGENTS.md, 레포의 커밋 메타데이터 규칙을 참고한다. 충돌이 나면 Desktop이 충돌 내용을 설명하고 해결안을 제안하지만, 사용자가 검토·수정·수락한 뒤 머지를 끝낸다. 동시에 Git worktree를 UI에서 지원해 여러 브랜치를 stash·clone 없이 병렬로 열 수 있다. 교훈은 코딩 에이전트 도입이 "코드 생성"만의 문제가 아니라, 커밋 규칙·충돌 리뷰·worktree 격리 같은 평범한 Git 운영면까지 AI 흐름에 맞춰져야 한다는 점이다.
  points:
  - Copilot SDK 기반 — commit message·merge conflict 기능마다 모델 선택과 BYOK/로컬 모델 연결 지원
  - 커밋 작성은 AGENTS.md와 copilot-instructions.md를 참고해 레포 규칙에 맞춘다
  - worktree UI는 에이전트 병렬 세션과 사람의 브랜치 작업을 같은 Git 격리 모델로 다룬다
  source: https://github.blog/changelog/2026-06-26-github-desktop-3-6-worktrees-and-deeper-copilot-integration/
- category: ai
  title: VS Code Copilot 토큰 효율 — prompt cache·tool search·WebSocket이 하네스 비용을 깎는다
  summary: VS Code 팀은 Copilot 에이전트 비용을 모델 문제가 아니라 하네스 문제로 다룬다. 반복되는 system/tool/repo/conversation prefix는 prompt cache hit-rate를 높여 재계산을 줄이고, tool search는 MCP·확장 도구의 전체 JSON schema를 매 턴 넣지 않고 필요할 때만 불러온다. OpenAI 모델에서는 24h prompt_cache_retention과 WebSocket continuation을 붙였고, GPT-5.4/5.5 실험에서 median session token usage가 각각 8.97%, 10.92% 줄었다. Anthropic 쪽은 cache_control breakpoint와 deferred tool search를 조합해 agentic workload cache hit-rate를 약 94%까지 올렸고, 7일 실험에서 median session total-token usage가 약 18% 줄었다. 교훈은 "프롬프트를 줄여라"보다 구체적이다. 긴 에이전트 세션은 prefix 안정성, 도구 지연 로딩, transport 재사용, subagent 분리가 실제 비용 구조를 바꾼다.
  points:
  - Tool search — 전체 도구 schema 대신 이름·설명만 먼저 보여주고 필요할 때 load
  - OpenAI GPT-5.4/5.5 — median session token usage 8.97%/10.92% 감소
  - Anthropic deferred tools — median total-token usage 약 18% 감소, cache hit-rate 약 94%
  source: https://code.visualstudio.com/blogs/2026/06/17/improving-token-efficiency-in-github-copilot
- category: ai
  title: AIware agent config dataset — 4,741개 repo가 말하는 AGENTS.md·Skills·Hooks 사용법
  summary: AIware 2026 Benchmark & Dataset Track의 "A Dataset of Agentic AI Coding Tool Configurations"는 Claude Code, GitHub Copilot, OpenAI Codex, Cursor, Gemini 설정 파일을 GitHub 공개 저장소에서 모은 데이터셋이다. 범위는 4,741개 repo, 8개 설정 메커니즘, 15,612개 configuration artifact, 관련 파일 원문 45,126개, AI instruction 148,551개다. 교훈은 단순하다. AGENTS.md·Skills·Rules·Hooks는 개인 취향 파일이 아니라, 에이전트 도입 방식과 팀 협업 규칙을 관찰할 수 있는 데이터가 됐다. 우리 레포도 "에이전트가 무엇을 해야 하는가"뿐 아니라 "어떤 설정 표면을 어떤 범위에 둘 것인가"를 버전 관리해야 한다.
  points:
  - Claude Code·Copilot·Codex·Cursor·Gemini 5개 도구 설정을 공개 repo에서 수집
  - 4,741 repo·15,612 artifact·45,126 config file·148,551 AI instruction
  - Zenodo CC BY 4.0 공개 데이터셋 — 에이전트 설정을 연구·리뷰 대상으로 다루기
  source: https://2026.aiwareconf.org/details/aiware-2026-benchmark---dataset-track/1/A-Dataset-of-Agentic-AI-Coding-Tool-Configurations
- category: ai
  title: Cursor 3.9 Customize — 플러그인·스킬·MCP를 팀 설정 화면으로 모으기
  summary: Cursor 3.9의 Customize 화면은 AI 코딩 에이전트 설정을 개인 dotfile이 아니라 팀 운영 표면으로 끌어올린 업데이트다. 한곳에서 플러그인, 스킬, MCP, 서브에이전트, 룰, 커맨드, 훅을 추가·관리하고, 팀에서 많이 쓰는 플러그인·스킬·MCP를 leaderboard로 보여준다. 플러그인은 rules·skills·subagents·commands·MCP servers·hooks를 묶어 배포하는 단위이고, Team Marketplace는 GitLab·Bitbucket·Azure DevOps의 플러그인 저장소도 가져올 수 있다. 실무 교훈은 "에이전트 설정 파일을 각자 복사"하는 단계를 넘어서, 팀 단위 검토·배포·필수/선택 설치·스코프 필터를 운영해야 한다는 점이다.
  points:
  - Customize 한 화면에서 plugins·skills·MCPs·rules·commands·hooks·subagents 관리
  - Team leaderboard로 많이 쓰는 플러그인·스킬·MCP를 발견하고 1클릭 설치
  - Team Marketplace는 GitLab·Bitbucket·Azure DevOps 플러그인 저장소 import 지원
  source: https://cursor.com/changelog/customize
- category: ai
  title: VS Code 5-line eval — 50,974회 HELLO.txt가 드러낸 에이전트 과잉사고
  summary: VS Code 팀은 6개월 동안 같은 초소형 smoke eval을 50,974회 돌렸다. 빈 워크스페이스에서 "HELLO.txt에 HELLO를 넣어라"는 5글자 작업이고, 정답 경로는 create_file 한 번이면 끝난다. 그런데 30개 모델의 통과 여부보다 더 유용했던 신호는 "어떻게 통과했는가"였다. 어떤 모델은 매번 1회 도구 호출로 끝냈지만, 어떤 모델은 빈 폴더를 탐색하고 계획을 쓰고 더 비싼 편집 경로를 탔다. 가장 가벼운 통과 경로는 출력 토큰 약 50개였고, 무거운 그룹은 같은 결과에 평균 수천 토큰까지 썼다. 교훈은 작은 평가라도 tool-call trace를 남기면 모델 선택·자동 라우팅·하네스 회귀를 비용 관점에서 볼 수 있다는 점이다.
  points:
  - say_hello — 빈 workspace, 고정 prompt, HELLO.txt 존재와 내용 2개 assertion만 검사
  - 50,974 runs across 30 models — pass rate보다 direct path·tool sequence·output tokens가 더 큰 운영 신호
  - 실무 적용 — nightly eval 전 stable smoke test를 두고 pass/fail뿐 아니라 계획·탐색·도구 선택까지 기록
  source: https://code.visualstudio.com/blogs/2026/06/19/what-50000-runs-taught-us
- category: ai
  title: VS Code BYOK·로컬 모델 — Copilot 없이도 agent chat은 돌리고, 임베딩 기능은 분리해서 보기
  level: "중급"
  summary: VS Code의 2026-06 BYOK 업데이트는 AI 에디터를 "Copilot 계정에 붙은 모델 목록"이 아니라 모델 브로커로 바꾼다. Language Models editor에서 Azure·Anthropic·Gemini·OpenAI·OpenRouter 같은 provider 키나 Ollama·Foundry Local 같은 로컬 모델을 추가하면 Chat 모델 피커에서 바로 고를 수 있다. 중요한 경계도 분명하다. BYOK와 로컬 모델은 chat·agent workflow·utility task에는 쓸 수 있고, GitHub 로그인이나 Copilot plan 없이도 오프라인 로컬 chat이 가능하다. 하지만 semantic search, inline suggestions, embeddings 기반 기능은 여전히 GitHub/Copilot 지원이 필요하다. 실무 교훈은 모델 선택을 에디터 UI 하나로 모으되, agent chat과 코드완성·검색을 같은 보안/비용 경계로 착각하지 말라는 점이다.
  points:
  - Language Models editor — provider 키·custom endpoint·extension 모델·로컬 모델을 한 피커에 모음
  - BYOK/local은 chat·agent workflow·utility task용, 표준 code completion·semantic search는 별도 경계
  - chat.utilityModel/chat.utilitySmallModel을 로컬·저가 모델로 바꾸면 제목·커밋 메시지 같은 작은 작업 비용을 분리 가능
  source: https://code.visualstudio.com/blogs/2026/06/18/byok-vscode
  interview: "VS Code에서 BYOK 모델로 채팅할 수 있다면 모든 AI 기능도 같은 계정 없이 동작하나요?"
  answer: "아니다. BYOK나 로컬 모델은 채팅·에이전트 작업에 쓸 수 있지만, 임베딩 기반 검색이나 일부 코드완성 기능은 별도 Copilot 지원이 필요할 수 있다. 기능별 provider 경계를 확인해야 한다."
- category: ai
  title: Copilot Agentic Harness — 모델 이름보다 harness·task 난이도·토큰 효율을 같이 보기
  level: "고급"
  summary: GitHub의 2026-06-25 Copilot agentic harness 평가 글은 "어떤 모델이 제일 좋나"보다, 같은 하네스에서 모델·작업·비용을 같이 보라는 신호다. GitHub은 20개 이상 최신 모델을 Copilot의 실제 agentic workflow 하네스에서 돌리고, GitHub 내부 task suite와 SWE-bench Verified를 함께 비교했다. 결과 해석의 핵심은 단일 승자가 아니다. 한 모델이 모든 축에서 이기지 않고, 작업 난이도·도구 사용·컨텍스트 처리·토큰 사용량에 따라 순위가 갈린다. 실무 교훈은 에이전트 모델 교체를 리더보드 하나로 결정하지 말고, 우리 레포의 대표 작업·도구 경로·토큰 예산을 넣은 작은 하네스에서 pass rate와 비용을 동시에 기록하라는 것이다.
  points:
  - 20+ 모델을 Copilot 실제 agentic workflow 하네스에서 비교 — 모델 단독 점수가 아니라 harness 안 성능
  - GitHub internal task suite + SWE-bench Verified — 쉬운 작업과 어려운 작업에서 순위가 달라질 수 있음
  - 운영 지표는 pass rate만이 아니라 token use, tool path, latency, task 난이도를 같이 봐야 함
  source: https://github.blog/ai-and-ml/github-copilot/evaluating-performance-and-efficiency-of-the-github-copilot-agentic-harness-across-models-and-tasks/
  interview: "코딩 에이전트용 모델을 고를 때 공개 리더보드 점수만으로 결정하기 어려운 이유는 무엇인가요?"
  answer: "실제 성공률은 모델뿐 아니라 하네스, 도구 경로, 작업 난이도와 컨텍스트에 좌우된다. 대표적인 저장소 작업으로 pass rate·토큰·지연시간을 함께 재야 운영 비용과 성능을 비교할 수 있다."
- category: ai
  title: Claude Code 실사용 연구 — 에이전트 시대에도 도메인 전문성은 수익률이 남는다
  level: "중급"
  summary: Anthropic의 "Agentic coding and persistent returns to expertise" 연구는 Claude Code를 추상 벤치마크가 아니라 실제 대화형 세션으로 본다. 2025-10부터 2026-04까지 약 40만 개 세션을 privacy-preserving 방식으로 분석했고, 전형적인 세션에서는 사람이 "무엇을 할지"를 정하고 Claude가 "어떻게 할지" 실행 결정을 더 많이 맡는다고 정리한다. 흥미로운 결론은 비개발자도 많은 코딩 작업을 성공시키지만, 도메인 전문성이 높을수록 한 지시당 Claude가 더 많은 일을 하고 성공률도 더 높다는 점이다. 즉 에이전트 도입의 실전 역량은 프롬프트 문장술보다 문제를 잘 고르고, 성공 증거를 요구하고, 결과를 검토할 수 있는 업무 지식에 가깝다.
  points:
  - 약 40만 Claude Code 세션 분석 — 작업 구성, 인간-AI 협업, 성공률을 실제 사용 로그에서 관찰
  - 사람은 planning, Claude는 execution 쪽 결정을 더 많이 담당하는 패턴
  - 전문성이 높을수록 지시당 산출과 성공률이 올라감 — 에이전트 운영도 도메인 지식이 병목
  source: https://www.anthropic.com/research/claude-code-expertise
  interview: "코딩 에이전트가 실행을 더 맡는 환경에서 개발자의 도메인 전문성은 왜 여전히 중요한가요?"
  answer: "전문성은 올바른 문제·제약·성공 기준을 정하고 결과를 검증하는 데 필요하다. 연구는 실제 사용에서도 전문성이 높은 사람이 더 많은 작업을 맡기고 더 높은 성공률을 보이는 경향을 관찰했다."
- category: ai
  title: Copilot strictKnownMarketplaces — 에이전트 플러그인 공급망을 허용목록으로 잠그기
  summary: GitHub Copilot의 enterprise plugin standards는 Copilot 플러그인을 "누가 어떤 marketplace에서 설치해도 되는가"의 문제로 다룬다. Enterprise owner는 `.github-private` 저장소의 `copilot/managed-settings.json`에 정책을 두고, `extraKnownMarketplaces`로 허용 marketplace를 추가하거나 `strictKnownMarketplaces`로 명시한 marketplace만 설치 가능하게 제한한다. `enabledPlugins`는 `PLUGIN-NAME@MARKETPLACE-NAME` 형식으로 모든 enterprise 사용자에게 기본 설치할 플러그인을 지정한다. 기능은 public preview라 변할 수 있지만, 교훈은 이미 분명하다. 에이전트 플러그인·스킬·MCP는 코드 실행 전 권한면이므로, 개인 설치 편의보다 검토된 marketplace·기본 설치·청구 주체를 먼저 정책으로 고정해야 한다.
  points:
  - '`.github-private/copilot/managed-settings.json`에서 enterprise Copilot 플러그인 정책 관리'
  - '`strictKnownMarketplaces`는 명시된 GitHub/git marketplace 외 플러그인 설치를 차단'
  - '`enabledPlugins`로 검토된 플러그인을 기본 설치 — public preview라 운영 전 변경 가능성 확인'
  source: https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/configure-enterprise-plugin-standards
- category: ai
  title: Stack Overflow for Agents — 에이전트 지식을 '생성'보다 '검증'으로 쌓기
  level: "중급"
  summary: Stack Overflow는 2026-06-10 Stack Overflow for Agents 베타를 공개했다. 핵심은 사람용 Q&A를 그대로 에이전트에게 먹이는 게 아니라, API-first 지식 교환소를 만들어 에이전트가 먼저 검증된 해법을 검색하고, 없으면 TIL·Question·Blueprint 형태로 초안을 만들며, 사람이 승인한 뒤 다른 에이전트와 개발자가 적용 결과를 되돌려주는 구조다. 공식 글은 plausible answer 생성은 싸졌지만 production에서 진짜 통하는지 검증하는 일은 여전히 비싸다고 본다. 별도 skill.md도 공개돼 vote, verify, reply, create post의 차이와 trust_summary·reputation을 "보증"이 아니라 우선순위 신호로 쓰라고 안내한다. 교훈은 코딩 에이전트 운영의 병목이 답변 생성보다 재현 가능한 실패·수정·검증 기록을 공유하는 쪽으로 옮겨간다는 점이다.
  points:
  - 베타 범위 — API-first 지식 교환, agent search → human-reviewed draft → verification feedback loop
  - post type — TIL·Question·Blueprint로 에이전트가 배운 해법을 맥락별로 기록
  - 운영 포인트 — trust_summary·reputation은 참고 신호일 뿐, 공개 에이전트 글은 읽고 검증한 뒤 적용
  source: https://stackoverflow.blog/2026/06/10/announcing-stack-overflow-for-agents/
  interview: "에이전트가 가져온 커뮤니티 지식의 reputation이나 trust 점수만 믿으면 안 되는 이유는 무엇인가요?"
  answer: "점수는 참고 신호이지 현재 코드·버전·환경에서 해법이 동작한다는 보증이 아니다. 제안의 근거를 확인하고 테스트나 재현으로 검증한 뒤 적용해야 한다."
- category: ai
  title: Claude Code Agent View — 백그라운드 세션을 한 화면에서 dispatch·attach
  summary: Claude Code의 Agent View는 `claude agents`로 여는 백그라운드 세션 대시보드다. 새 작업을 dispatch하면 각 작업이 터미널에 붙어 있지 않아도 full Claude Code conversation으로 계속 돌고, 화면에는 running·waiting for input·done 상태가 모인다. 세션에는 attach·peek·reply로 다시 들어갈 수 있고, 내부 세션에서는 `/bg`나 왼쪽 화살표로 agent view로 빠져나온다. 단 연구 프리뷰(v2.1.139+)이고 세션은 로컬 머신에서 돈다. sleep은 보존되지만 shutdown 때는 중단되며, 병렬 10개는 구독 사용량도 대략 10배로 태운다. Claude가 만든 worktree는 session 삭제 때 같이 지워질 수 있으니 merge·push·검토 경계를 먼저 정해야 한다.
  points:
  - claude agents — 여러 background session의 running/input/done 상태를 한 화면에서 관리
  - attach·peek·reply·/bg — 터미널 점유 없이 오래 가는 작업을 중간중간 확인
  - 한계 — local research preview, quota는 병렬 수만큼 소모, session 삭제 전 worktree 변경 보호 필요
  source: https://code.claude.com/docs/en/agent-view
- category: ai
  title: Spotify LLM Evals — A/B 테스트를 대체하지 말고 앞단 필터로 쓰기
  level: "중급"
  summary: 'Spotify Engineering의 2026-05-18 글은 LLM eval을 온라인 실험의 대체물이 아니라 "funnel"로 다루라고 정리한다. LLM judge는 relevance·coherence·tone·intent alignment처럼 사람 검수로는 크게 확장하기 어려운 품질 차원을 빠르게 점수화해, 실험에 올릴 후보의 hit rate를 높인다. 하지만 eval이 검증하는 것은 "출력이 의도한 품질 기준에 맞는가"이고, A/B 테스트가 검증하는 것은 "실제 사용자와 시스템 지표가 좋아졌는가"다. 그래서 eval은 실험 전에 나쁜 후보를 버리고, 실험 뒤에는 judge가 선호한 버전이 실제 outcome과 맞았는지 calibration loop로 다시 점검해야 한다. 글은 Spotify 실험에서 positive ship으로 끝나는 비율은 약 12%지만, 약 64%는 회귀 발견·가설 수정 같은 valid learning을 만든다고 말한다. 또 출시 실험의 약 42%는 secondary metric 회귀를 막기 위해 rollback된다고 설명한다. 실무 교훈은 간단하다. AI 기능을 "eval 점수 통과"만으로 배포하지 말고, eval→온라인 실험→guardrail metric→judge calibration을 한 루프로 묶어야 한다.

    '
  points:
  - LLM eval = 실험 전 후보 필터와 품질 검증, A/B test = 실제 사용자 outcome 검증
  - judge 점수와 온라인 지표가 어긋나는 구간이 calibration 신호 — eval도 계속 검증 대상
  - guardrail metric을 함께 봐야 eval이 못 잡는 crash·retention·session length 회귀를 막을 수 있음
  source: https://engineering.atspotify.com/2026/5/better-experiments-with-llm-evals-a-funnel-not-a-fork
  interview: "LLM 평가 점수가 좋아졌다면 바로 기능을 출시해도 되나요?"
  answer: "아니다. 평가 점수는 정해진 품질 기준에 맞는지 보는 사전 필터다. 실제 사용자 결과는 온라인 실험으로 확인하고, guardrail 지표와 평가자 보정도 함께 봐야 한다."
- category: ai
  title: OpenAI Secure MCP Tunnel — 사내 MCP를 공개하지 않고 ChatGPT·Codex에 연결하기
  level: "고급"
  summary: OpenAI의 Secure MCP Tunnel은 사내망·로컬호스트의 MCP 서버를 public endpoint로 열지 않고도 ChatGPT, Codex, Responses API, AgentKit에서 쓰게 하는 연결 방식이다. 고객이 실행하는 tunnel-client가 OpenAI tunnel service로 outbound HTTPS long-poll을 만들고, OpenAI 제품은 tunnel_id가 붙은 OpenAI-hosted MCP URL만 호출한다. 실제 사내 MCP URL은 tunnel-client가 있는 네트워크 안에서만 쓰인다. 그래서 방화벽 inbound rule을 새로 열지 않고, Streamable HTTP·stdio MCP 요청을 전달하며, `/healthz`, `/readyz`, `/metrics`, `/ui`로 운영 상태를 볼 수 있다. 교훈은 MCP 도입을 "서버 하나 더 공개"가 아니라 네트워크 경계·권한·운영 관측성을 함께 설계하는 integration 문제로 보라는 점이다.
  points:
  - outbound-only tunnel-client — 사내 MCP 서버는 public listener 없이 유지
  - 대상 표면 — ChatGPT, Codex, Responses API, AgentKit에서 같은 tunnel_id 기반 MCP endpoint 사용
  - 운영 경계 — runtime key는 Tunnels Read+Use, 관리자는 Read+Manage; health/metrics/UI로 연결 상태 확인
  source: https://developers.openai.com/blog/connect-private-mcp-servers-to-openai-products
  interview: "사내 MCP 서버를 외부 제품에서 쓰면서 인바운드 포트를 열지 않는 연결의 핵심은 무엇인가요?"
  answer: "내부 네트워크의 tunnel client가 외부로 아웃바운드 연결을 만들고, 외부 제품은 호스트된 터널 주소를 호출한다. 클라이언트가 내부 MCP로 요청을 전달하므로 서버 자체를 공개 리스너로 노출하지 않는다."
- category: ai
  title: Copilot adoption phase metrics — AI 에이전트 도입을 PR 병합 기여도로 보기
  summary: GitHub는 Copilot usage metrics API의 `totals_by_ai_adoption_phase`에 `total_pull_requests_merged`를 추가했다. 2026-05-29에 도입된 AI adoption phase는 사용자를 최근 28일 사용 표면에 따라 Code first, Agent first, Multi-agent 등으로 나누고, 2026-06-26 업데이트는 각 phase가 하루 또는 28일 동안 실제로 병합한 PR 총량을 함께 보여준다. 이전의 `avg_pull_requests_merged`가 phase 안 사용자 평균을 봤다면, 새 필드는 전체 병합 PR 중 어느 adoption phase가 얼마나 기여했는지 계산하게 해 준다. 실무 교훈은 에이전트 도입률을 "누가 많이 썼나"에서 멈추지 말고, code-first에서 agent-first/multi-agent로 이동할수록 실제 delivery 지표가 어떻게 바뀌는지 추적하라는 점이다.
  points:
  - "`ai_adoption_phase` — Code first, Agent first, Multi-agent 등 28일 사용 표면 기반 cohort"
  - "`total_pull_requests_merged` — phase별 병합 PR 총량, 1일·28일 report에서 사용"
  - "평균 사용량과 절대 처리량을 분리해 rollout 교육·예산·효과 측정을 설계"
  source: https://github.blog/changelog/2026-06-26-track-total-merges-by-adoption-phase-in-enterprise-and-organization-reports
- category: ai
  title: Mellum2(JetBrains) — 12B MoE지만 토큰당 2.5B처럼 도는 소프트웨어 엔지니어링 모델
  summary: JetBrains의 Mellum2는 Apache-2.0으로 공개된 12B Mixture-of-Experts 모델이다. 토큰마다 64개 expert 중 8개만 켜서 active parameter는 2.5B이고, 코드 생성·편집·디버깅·tool/function calling·agentic coding에 맞춰 학습됐다. arXiv 기술 보고서는 128K context, Instruct/Thinking 변형, speculative decoding용 Multi-Token Prediction head를 공개하고, Hugging Face 모델 카드도 같은 라이선스와 체크포인트를 제공한다. 실무 포인트는 "큰 코딩 모델"보다 "작은 active compute + 긴 컨텍스트 + 도구 호출" 조합이다. IDE/에이전트 안에서 빠른 반복 작업을 맡길 로컬·오픈웨이트 후보를 평가할 때, 파라미터 총량보다 active parameter와 실제 latency를 같이 봐야 한다.
  points:
  - 12B MoE, 토큰당 2.5B active — 64 experts 중 8개만 사용
  - software engineering 특화 — code edit, debugging, tool/function calling, agentic coding
  - Apache-2.0 open weights, 128K context, Instruct/Thinking 변형 공개
  source: https://arxiv.org/abs/2605.31268
- category: ai
  title: STATE-Bench — 에이전트 메모리는 대화 요약이 아니라 최종 상태로 평가해야 한다
  level: "고급"
  summary: Microsoft의 STATE-Bench는 에이전트가 긴 업무 흐름에서 "무엇을 기억했는가"를 최종 데이터 상태로 재는 벤치마크다. travel, customer support, shopping assistant 3개 도메인에 각 150개씩 총 450개 enterprise task를 두고, 에이전트는 task-local sandbox DB, 도메인 도구, simulated user를 상대한다. 통과하려면 필요한 정보를 도구로 모으고, 정책을 적용하고, 필요하면 DB를 올바른 final state로 갱신하면서 대화 절차도 지켜야 한다. Agent Learning Track은 같은 simulator와 judge에 train trajectories와 retrieval hook을 더해 memory, skill, prompt optimization을 비교한다. 교훈은 "좋은 답변"만 보지 말고, 에이전트가 도구 호출 뒤 시스템 상태를 맞게 바꿨는지 pass@1, pass^5, UX, cost per task로 같이 보라는 점이다.
  points:
  - 450 task — travel·customer support·shopping assistant 각 150개 enterprise workflow
