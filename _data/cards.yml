  title: DeepSeek-V4 — 1.6T MoE(49B 활성), CSA+HCA로 KV캐시 90% 절감·1M 컨텍스트·FP4 MoE(MIT)
  summary: 'DeepSeek-V4는 2026-04 출시된 차세대 MoE 모델이다. V4-Pro(1.6T/49B 활성)와 V4-Flash(284B/13B 활성) 2종. CSA(Compressed Sparse Attention)+HCA(Heavily Compressed Attention) 하이브리드로 1M 토큰 컨텍스트에서 V3.2 대비 KV캐시 90% 절감, 추론 FLOPs 73% 감소. mHC(Manifold-Constrained Hyper-Connections)로 잔차 연결 개선, Muon 옵티마이저로 32T+ 토큰 학습 안정화. MoE 전문가 FP4+나머지 FP8 혼합 정밀도. Non-think/Think High/Think Max 3단계 추론 모드. GPQA Diamond 94.3%, SWE Verified 80.6%. GB200 NVL72에서 150+ tok/s/user.

    '
  points:
  - 'CSA+HCA: KV캐시 90% 절감, FLOPs 73% 감소'
  - '1.6T/49B 활성: MIT 라이선스 오픈웨이트'
  - '3단계 추론: Non-think → Think High → Think Max'
  source: https://deepinfra.com/blog/deepseek-v4-pro-model-overview
- category: ai
  title: Mistral Large 3 — EU 오픈웨이트 675B MoE(41B 활성), 네이티브 비전·256K·Apache-2.0
  summary: 'Mistral Large 3는 Mistral AI의 플래그십 멀티모달 MoE 모델이다. 675B 총 파라미터/41B 활성, 256K 컨텍스트, Apache-2.0 라이선스. 2.5B 비전 인코더가 아키텍처에 퓨전되어 이미지·PDF·차트·OCR을 1등 시민으로 처리. H200 3,000장으로 학습. 8xH100 단일 노드(FP8/NVFP4)에 배포 가능. Function calling·Structured Outputs·FIM·OCR·오디오 전사·TTS 엔드포인트 내장. 23개 언어 지원으로 비영어권 멀티링구얼 최강. GDPR 민감 엔터프라이즈에 적합한 유일한 EU 프론티어 오픈웨이트.

    '
