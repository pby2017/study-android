- category: ai
  title: TEBench — project-level test evolution·Breaking/Stale/Missing 314 task
  summary: TEBench(arXiv 2605.06125·iSEngLab/TEBench) — 첫 project-level test evolution benchmark. production code commit 후 전 repo에서 어떤 test를 고치고 어디에 새 test가 필요한지 autonomously identify+patch — method-level pre-paired ⟨m,m',t⟩ 벤치마크와 달리 whole-project reasoning. 314 instances·10 Defects4J Java projects·developer GT. 3 type — Test-Breaking(compile/exec fail), Test-Stale(pass but semantic outdated, avg F1≈36%), Test-Missing(new coverage). identification F1 45.7–49.4% ceiling across Claude Code/Codex/OpenCode — reactive execute-fail-fix loop는 stale/missing structurally unreachable. 2D metric — identification P/R/F1 + update(executability×coverage×modification similarity). vs c-CRAB(review oracle) ·SWE-bench(bug fix) — TEBench=test suite co-evolution with production code.
  points:
  - Test-Stale hardest — no execution failure signal, proactive semantic reasoning required
  - Identification F1 ~48% ceiling — framework+model converge, shared inductive bias
  - Update Overall Score headline — executability gates non-compiling patches to 0
