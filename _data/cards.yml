- category: ai
  title: 'DeepMind AI Control Roadmap: 에이전트를 ''잠재적 내부자 위협''으로 다루는 보안 설계'
  summary: 'Google DeepMind가 2026-06-18 공개한 AI Control Roadmap은 강력한 에이전트가 완벽히 정렬되어 있다고 가정하지 않고, 내부 시스템에 접근한 잠재적 insider threat처럼 다루는 방어 심층 전략이다. 전통 보안(샌드박스·엔드포인트 보안·프롬프트 인젝션 저항) 위에 alignment를 1차 방어로 두되, 실패할 수 있다고 보고 supervisor AI가 에이전트의 reasoning·action·plan을 감시한다. 위험도는 detection evasion 능력(D1-D4)과 attack execution 능력(R1-R3)에 맞춰 올리고, 저위험 작업은 사후 transcript 리뷰·알림으로, 고위험 작업은 실시간 차단·접근 제한·종료 인프라로 대응한다. 실무 교훈은 에이전트 권한을 사람 계정과 똑같이 복사하지 말고, coverage·recall·time-to-response로 감시 품질을 재며 점진적으로 권한을 열어야 한다는 점이다.

    '
  points:
  - '공식 발표: 2026-06-18 AI Control Roadmap, 내부 에이전트를 잠재적 insider threat로 threat-modeling'
  - '통제 축: supervisor AI monitoring, asynchronous alert, synchronous block/response, capability-based escalation'
  - '운영 지표: coverage·recall·time-to-response로 에이전트 보안 통제가 실제로 작동하는지 측정'
  source: https://deepmind.google/blog/securing-the-future-of-ai-agents/
- category: ai
  title: Agent Finder/ARD — Copilot·Gemini Enterprise runtime discovery, context bloat 방지
  summary: 'Agentic Resource Discovery(ARD·Apache-2.0·Microsoft+Google+GitHub+HF+GoDaddy·2026-06-17) — domain-hosted catalogs + federated registries로 MCP·skills·agents·tools를 publish/index/discover. GitHub Agent Finder — Copilot이 task description으로 registry 검색→ranked matches on-demand inject, auto-install 없음·managed settings gate. Google Gemini Enterprise Agent Registry — hosted search/onboarding, native ARD months内. 문제 정의: single client가 explicit wiring한 수십 도구 vs ecosystem 수십만 리소스 — orders-of-magnitude gap. vs MCP Tool Search(Claude preload) ·pre-wired MCP list — ARD=runtime catalog search across registries.'
  points:
  - ARD spec — catalogs on org domain + registry index + client discovery handoff
  - GitHub Agent Finder — public 293 resources or private enterprise registry, no silent install
  - Google Agent Registry — Gemini Enterprise ARD backing, federated discovery same model
  source: https://commandline.microsoft.com/agentic-resource-discovery-specification-ard/
- category: ai
  title: 'Reusable prompts 종료: 프롬프트도 코드 리뷰·테스트 대상이 된다'
  summary: 'OpenAI는 2026-06-03 reusable prompt objects의 deprecation을 공지했고, `v1/prompts` API와 reusable prompt objects를 2026-11-30에 종료할 예정이라고 문서화했다. 최신 prompt engineering 가이드는 새 작업에서 production prompt를 대시보드 객체로 저장하지 말고 애플리케이션 코드 안의 작은 prompt builder로 옮기라고 권한다. 동적 값은 typed function argument나 schema로 받고, 생성된 `instructions`와 `input`을 Responses API에 직접 넘기며, 변경 전에는 대표 fixture, 테스트, evaluation check를 붙이라는 흐름이다. 실무 교훈은 "프롬프트 관리 UI"에 의존하지 말고 프롬프트를 코드 변경처럼 diff, 리뷰, 테스트, feature flag, 배포 파이프라인으로 다루라는 점이다.

    '
  points:
  - '공식 일정: 2026-06-03 deprecation 공지, 2026-11-30 `v1/prompts`/reusable prompt objects 종료 예정'
  - '이주 방향: prompt content를 application code로 옮기고 Responses API에 instructions/input으로 전달'
  - '운영 원칙: typed inputs, fixtures, tests, eval checks, staged rollout로 프롬프트 변경을 관리'
  source: https://developers.openai.com/api/docs/deprecations
- category: ai
  title: 'Codex rollout token budgets: 에이전트 루프를 토큰 예산으로 강제 중단하기'
  summary: 'OpenAI Codex CLI 0.142.0은 "rollout token budget"을 추가해 여러 agent thread·sub-agent usage가 같은 shared ledger를 소비하고, 남은 예산을 알려 주며, exhausted 시 다음 usage-accounting boundary에서 TurnAborted로 cleanly 중단한다. app-server는 multi-agent delegation을 thread/turn별 disabled·explicit-request-only·proactive로 제어하고 indexed web-search mode를 추가했다. 0.142.2(2026-06-25)는 MCP tools에 tool search by default — 지원 모델·provider에서 전체 tool schema dump 대신 discovery 검색으로 context 절약·구형 모델 호환 fallback. 개발자에게 중요한 점은 에이전트 자동화를 "열심히 돌리기"가 아니라 예산·위임·MCP tool surface·웹 접근 경계를 먼저 정한 뒤 실행하는 운영 문제로 본다는 것이다.

    '
  points:
  - '0.142.0: shared ledger token budget·sub-agent draw·TurnAborted clean abort'
  - 'app-server: multi-agent delegation disabled·explicit-request-only·proactive'
  - '0.142.2: MCP tool search default — schema dump→searchable discovery'
  source: https://developers.openai.com/codex/changelog
