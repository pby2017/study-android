- category: ai
  level: "중급"
  title: Copilot CLI Remote Control — 실행 중인 세션을 Android에서 조종하기
  summary: "GitHub Mobile은 실행 중인 Copilot CLI 세션에 연결해 진행 상황을 보고 permission 요청에 답하거나 작업을 이어가게 한다. 세션 기록이 동기화되어 보이는 것만으로 조작 권한이 생기지는 않는다. 대화형 세션에서 `/remote on`을 켜야 하며, 조직 계정은 관리자가 `View and control` 정책을 허용해야 한다. 명령과 파일 작업은 계속 호스트에서 실행되고 세션 이벤트는 GitHub로 전송된다. 따라서 호스트는 온라인·실행 상태를 유지해야 하며, 이는 cloud sandbox와 다르다."
  points:
  - "대화형 세션에서만 사용 가능 — `/remote on`; `--prompt` 기반 CLI 자동화는 대상이 아님"
  - "동기화된 기록은 view-only; 조직 좌석은 `View and control` 정책 필요. 세션 이벤트는 GitHub로, 명령 실행은 호스트에 남음"
  - "호스트 컴퓨터는 온라인·실행 상태 유지; 필요하면 `/keep-alive busy`로 작업 중 절전 방지"
  source: https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/steer-remotely
  interview: "CLI 세션이 GitHub Mobile에 보이면 그 세션을 바로 조작할 수 있나요? 휴대폰에서 조작하는 동안 개발 컴퓨터를 꺼도 되나요?"
  answer: "아니다. 동기화된 세션은 보기만 가능할 수 있고, 조작하려면 대화형 CLI에서 `/remote on`을 켜야 한다. 조직 계정은 관리자 정책이 `View and control`이어야 한다. 세션 이벤트는 GitHub로 보내지만 명령·파일 작업은 호스트에서 계속 실행되므로 기기가 온라인이고 CLI가 살아 있어야 한다. 호스트 없이 실행하려면 별도 cloud sandbox를 선택하고 과금·정책을 확인한다."
- category: ai
  level: "고급"
  title: AI 도입과 개발자 채용 — 채용 건수·주니어 비중·연구 설계를 구분하기
  summary: "AI 개발자 채용 연구는 감소와 증가로 엇갈리지만, 서로 다른 대상을 측정한다. MIT는 Copilot 도입 기업의 분기 신규 채용, Stanford는 AI 채택 기업의 주니어 고용 구성, LinkedIn·GitHub 연구는 SWE 월별 채용 확률을 본다. 효과를 한 결론으로 합치지 말고 표본·채택 정의·인과 설계를 비교한다. 이 연구들은 Android 채용률을 직접 입증하지 않는다."
  points:
  - "MIT: Copilot 조기 도입 유도 기업의 분기별 기술직 채용 -29%; 퇴사·전체 인원 효과는 관찰되지 않음"
  - "Stanford: 주니어 비중 -1.9%p는 주로 시니어 증가에 기인; 주니어 인원 -2.5% 추정은 통계적으로 유의하지 않음"
  - "LinkedIn·GitHub 논문: SWE 월별 채용 확률 +3~5% 연관성; 관찰 자료이므로 인과 효과로 단정하지 않음"
  - "면접 준비: 코드 작성뿐 아니라 AI 산출물 검증, 시스템 설계, 디버깅, 비코딩 협업 역량을 실제 사례로 설명"
  source: https://economics.mit.edu/sites/default/files/2026-11/AILaborDemand_06Nov2026.pdf
  sources:
  - label: MIT·Microsoft Research working paper (2026-11)
    url: https://economics.mit.edu/sites/default/files/2026-11/AILaborDemand_06Nov2026.pdf
  - label: Stanford Digital Economy Lab working paper (2026-11)
    url: https://digitaleconomy.stanford.edu/publication/how-does-ai-change-labor-demand/
  - label: Contemporary Economic Policy 논문 (2026-04)
    url: https://doi.org/10.1111/coep.70035
  interview: "AI 도입 기업의 주니어 채용이 줄었다는 연구와 SWE 채용이 늘었다는 연구를 어떻게 함께 해석해야 하나요?"
  answer: "연구마다 Copilot 도입 여부와 AI 채택의 정의, 기업·국가 표본, 측정 결과가 다르다. 분기별 신규 채용 감소가 전체 인원 감소를 뜻하지 않을 수 있고, 주니어 비중 하락도 시니어 증가에서 올 수 있다. 반대로 관찰된 채용 확률 증가는 인과관계를 증명하지 않는다. 지표와 설계를 나란히 비교하고 Android 직군에 그대로 일반화하지 않는다."
- category: ai
  level: "중급"
  title: AI 허용 기술 면접 — Android 개발자는 생성보다 검증 과정을 보여주기
  summary: "CoderPad의 2026년 글로벌 기술 채용 설문(개발자·채용 담당자 등 약 650명)에서 면접 중 AI 사용 정책은 금지 34%, 제약 허용 29%, 폭넓게 허용 17%, 사례별 판단 20%로 나뉘었다. AI를 허용하는 채용 리더가 기술 신호로 꼽은 것은 AI 오류를 찾아 고치기(66%)와 trade-off·정확성 설명(56%)이었다. Android 면접에서는 먼저 AI 사용 가능 범위를 확인하고, 허용된다면 생성 코드의 lifecycle·동시성·권한·기기/API 호환성을 점검한 뒤 테스트와 판단 근거를 설명한다. 이는 Android 면접만 조사한 결과가 아니라 일반 기술직 설문을 Android에 적용한 준비 전략이다."
  points:
  - "정책 확인: AI 금지 34%, 조건부 허용 29%, 광범위 허용 17%, 사례별 판단 20% — 일관된 단일 규칙이 없음"
  - "평가 신호: AI 오류 수정 66%, trade-off·정확성 설명 56%; 면접관에게 검증 과정과 대안을 말로 보여준다"
  - "Android 적용 예: lifecycle·Coroutine 취소·권한/API 호환성 확인 → 관련 테스트 실행 → 실패와 수정 이유 설명"
  - "설문 한계: 글로벌·여러 기술직을 섞은 약 650명 표본이며 Android 전용 또는 한국 채용시장 통계가 아님"
  source: https://coderpad.io/survey-reports/coderpad-state-of-tech-hiring-2026/
  sources:
  - label: CoderPad State of Tech Hiring 2026 — AI 허용 정책·평가 신호
    url: https://coderpad.io/survey-reports/coderpad-state-of-tech-hiring-2026/
  interview: "면접에서 AI가 허용될 때 생성 결과 외에 어떤 역량을 보여줘야 하나요?"
  answer: "먼저 허용 범위와 공개할 사용 방식을 확인한다. 이후 생성 코드의 정확성·예외·보안·설계 trade-off를 검토하고, Android라면 lifecycle·Coroutine 취소·권한·API 호환성을 점검한다. 테스트로 확인한 결과와 수정 이유를 설명해 AI 사용과 독립적인 엔지니어링 판단을 함께 보여준다."
