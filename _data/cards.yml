- category: ai
  level: "중급"
  title: Android Studio Agent Mode 병렬 대화 — 스레드 분리와 파일 격리는 다르다
  level: "중급"
  summary: 'Agent Mode의 여러 대화는 테스트 작성과 기능 계획처럼 서로 다른 작업을 동시에 진행하고 기록을 나누는 기능이다. 대화가 분리된다고 각 작업이 별도 Git worktree나 파일 복사본에서 실행된다고 단정할 수는 없다. Quail 2 발표 당시 Google은 worktree 미지원과 같은 파일의 동시 수정 충돌 위험을 명시했다. Quail 4는 Recent Chats의 실행 상태와 변경 요약을 개선했지만, 해당 릴리스 자료는 worktree 지원 여부를 설명하지 않는다. 현재 IDE 버전의 격리 동작을 확인하고 겹치는 수정은 순차적으로 검토한다.'
