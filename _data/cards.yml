- category: ai
  title: Copilot Sandboxes — 에이전트 명령 실행을 로컬·클라우드 격리층에 넣기
  summary: >-
    GitHub Copilot의 local sandbox와 cloud sandbox는 서로 다른 실행 경계다. CLI의 `/sandbox enable`은 로컬 명령을 OS 수준에서 제한하며 별도 VM을 만들지 않는다. CLI 내장 파일 도구는 프로세스 안에서 실행되고 정책을 자체 적용하므로 OS sandbox와 같은 강제 경계가 아니다. 반면 `copilot --cloud`는 세션 전체를 GitHub 호스팅 Linux 환경에서 실행하고, 중지한 세션의 snapshot으로 나중에 이어갈 수 있다. 이 옵션은 해당 대화형 세션에만 적용되며 `-p`나 `-i`와 함께 쓸 수 없다. CLI 세션은 기본적으로 로컬 실행이다. Cloud compute와 할당 memory는 월간 포함 compute 사용량을 표준 runner와 공유하고 초과분은 과금될 수 있다. 중지된 snapshot storage는 포함 compute와 별도로 측정·과금되므로 예산과 보존 상태를 확인한다.
  points:
  - '로컬: CLI `/sandbox enable`; `/sandbox status`·`/sandbox policy`로 적용 상태와 권한 확인'
  - 'Cloud: 기본은 로컬; `copilot --cloud`로 대화형 세션만 원격 Linux에서 실행하고 snapshot으로 재개'
  - 'Compute·할당 memory는 포함 allowance 공유; 중지 snapshot storage는 별도 측정·과금'
  source: https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/about-cloud-and-local-sandboxes
  level: "중급"
  interview: "`copilot --cloud`는 CLI의 기본 실행 방식인가요? Local sandbox와 cloud sandbox, 그리고 cloud의 과금 항목은 어떻게 다른가요?"
  answer: "아니다. CLI는 기본적으로 로컬에서 실행되고, `copilot --cloud`를 지정한 대화형 세션만 GitHub 호스팅 Linux sandbox로 옮긴다. `-p`·`-i` 모드와 함께 쓸 수 없다. Local sandbox는 같은 기기에서 OS 수준으로 명령 접근을 제한하지만, CLI 내장 파일 도구는 별도로 정책을 적용하므로 VM과 동일한 격리가 아니다. Cloud에서는 실행 중 compute와 할당 memory가 월간 포함 compute allowance를 공유하고, 중지된 세션의 snapshot storage는 포함 allowance와 별도로 측정·과금된다. 예상 비용·budget을 확인한다."
- category: ai
  title: Copilot AI credits API — 에이전트 비용을 사람·팀 단위로 관측하기
  summary: >-
    Copilot usage metrics API의 사용자별 1일·28일 보고서에는 `ai_credits_used`가 포함된다. 이 값은 해당 기간 사용자의 Copilot 전체 활동에서 소비한 credit 합계이며, 기능·모델·제품 표면별 세부 내역은 제공하지 않는다. 관리자는 사용량과 활용 지표를 함께 살펴 채택 현황이나 예산 범위를 파악할 수 있지만, 이 값은 청구서의 과금 총액이 아니다. 정산은 별도의 billing API·보고서에서 확인한다. 팀별 분석이 필요하면 사용자-팀 보고서와 사용자별 사용량을 연결한다.
  points:
  - '`ai_credits_used`: 사용자별 보고 기간 내 credit 합계; 기능·모델·표면별 분해 없음'
  - enterprise/org 권한 있는 관리자가 Copilot usage metrics API로 조회
  - '소비 분석용 지표다. 실제 청구액은 별도 billing 자료로 확인'
