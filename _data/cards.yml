- category: ai
  title: RAGFlow — 8만★ 돌파, '딥 문서 이해' 특화 RAG 엔진(Apache-2.0·InfiniFlow)
  summary: 'RAGFlow는 복잡한 레이아웃(표·이미지·수기 노트)의 문서를 정밀 파싱하는 데 특화된 오픈소스 RAG 엔진이다. 커버가능 파이프라인과 에이전트 템플릿을 내장하고, 2026년 6월 기준 Feishu·Discord·Telegram·Line 등 다채널 챗봇 연동을 지원한다. 에이전트 워크플로우 + MCP + Python/JS 코드 실행기를 갖춰 단순 검색을 넘어선 자율 행동이 가능하다. LangChain이 오케스트레이션, LlamaIndex가 인덱싱이라면, RAGFlow는 ''문서 파싱 품질''이 핵심.

