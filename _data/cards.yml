  answer: '로컬 CLI/IDE 리뷰는 push 전 작업 트리 변경의 finding을 보여주며, PR 리뷰는 요약·walkthrough·PR 대화 기능을 더한다. “무제한”은 전체 PR 수 제한이 없다는 뜻이지만 개발자별 시간당 포함량이 있고 초과분은 사용량 과금될 수 있다. 플랜·예산 설정을 확인하고 AI 지적은 사람이 검증해야 한다.'

- category: ai
  level: 중급
  title: Codex CLI — 로컬 저장소에서 코드를 읽고 바꾸는 OpenAI 터미널 에이전트
  summary: Codex CLI는 터미널에서 현재 컴퓨터의 저장소를 읽고, 파일을 수정하고, 설치된 개발 도구를 실행하는 OpenAI 코딩 에이전트다. 대화형 `codex`는 작업을 함께 진행하고, `codex exec`는 반복 가능한 비대화형 작업에 쓸 수 있다. “로컬에서 실행”은 작업 공간과 명령 실행 위치를 뜻하며, 오프라인 로컬 LLM이란 뜻은 아니다. 기본 시작은 ChatGPT 계정 로그인이고, API key 경로도 별도 설정으로 지원한다. 작업 전 권한과 sandbox 설정을 확인하고, 변경 diff와 테스트 결과를 직접 검토한다.
  points:
  - '`codex`: 저장소를 탐색·수정하고 로컬 도구를 실행하는 대화형 터미널 loop'
  - '`codex exec`: 스크립트·반복 workflow에서 비대화형으로 실행'
  - 'ChatGPT 로그인 또는 별도 설정한 API key로 인증; 저장소는 Apache-2.0이며 GitHub는 약 136.1k★ 표시 (2026-11-22 확인)'
  source: https://github.com/openai/codex
