- category: ai
  title: 'ShellSage: tmux 히스토리·패널을 읽어 현재 작업 맥락을 이해하는 터미널 네이티브 AI 어시스턴트'
  summary: '"AI-powered command-line assistant that integrates seamlessly with your terminal workflow through tmux." tmux 히스토리(여러 패널 포함)를 자동으로 읽어 지금 무슨 일이 벌어지는지 맥락을 잡고 도와준다. Answer.AI(Jeremy Howard 랩) 작품, nbdev로 개발. License: MIT.

    '
  points:
  - tmux 패널 히스토리 자동 판독 + 특정 패널 지정(ssage --pid %2)으로 그 패널 상황 분석
  - '제안 명령 추출: Ctrl+B E 후 블록 인덱스 입력하면 해당 명령을 바로 전송'
  - 실행 전 curated allow-list로 명령 검증(safecmd), 모든 상호작용을 SQLite로 로깅 가능
  - '모델 비종속: Claude·GPT·Ollama 등 여러 LLM 제공자 지원, 기본은 Claude'
  source: https://github.com/AnswerDotAI/shell_sage
- category: ai
  title: 'bolt.new: 브라우저 안 WebContainers에서 풀스택 웹앱을 프롬프트로 만들고 실행·배포하는 AI 개발 에이전트'
  summary: '"AI-Powered Full-Stack Web Development in the Browser." StackBlitz WebContainers 위에서 로컬 설치 없이 브라우저만으로 풀스택 개발을 한다. AI에게 환경 전체의 제어권을 줘서 프롬프트→실행→편집→배포를 한자리에서 처리한다.

