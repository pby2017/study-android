  title: Mistral Large 3 — EU 오픈웨이트 675B MoE(41B 활성), 네이티브 비전·256K·Apache-2.0
  summary: 'Mistral Large 3는 Mistral AI의 플래그십 멀티모달 MoE 모델이다. 675B 총 파라미터/41B 활성, 256K 컨텍스트, Apache-2.0 라이선스. 2.5B 비전 인코더가 아키텍처에 퓨전되어 이미지·PDF·차트·OCR을 1등 시민으로 처리. H200 3,000장으로 학습. 8xH100 단일 노드(FP8/NVFP4)에 배포 가능. Function calling·Structured Outputs·FIM·OCR·오디오 전사·TTS 엔드포인트 내장. 23개 언어 지원으로 비영어권 멀티링구얼 최강. GDPR 민감 엔터프라이즈에 적합한 유일한 EU 프론티어 오픈웨이트.

