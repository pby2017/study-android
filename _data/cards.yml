  title: Speculative Decoding — 드래프트 모델이 미리 예측, 타겟 모델이 한 번에 검증해 추론 2~3배 가속(무손실)
  summary: 'Speculative Decoding은 작은 드래프트 모델(0.5~2B)이 3~5토큰을 투기적으로 생성하고, 큰 타겟 모델이 단일 포워드 패스로 병렬 검증하는 추론 최적화 기법이다. 출력 품질은 표준 자기회귀와 동일(무손실). 수락률 60~80%에서 배치 사이즈 1~4 기준 2~3배 속도 향상. 배치 32+에서는 효과 감소. EAGLE-3가 2026년 산업 표준: 타겟 모델 내부 레이어에 경량 예측 헤드를 부착해 별도 드래프트 모델 불필요. vLLM·SGLang·TensorRT-LLM에 프로덕션 구현. 코드 생성·요약 등 예측 가능한 태스크에 최적.

    '
  points:
  - '무손실 2~3배: 드래프트 예측 → 타겟 병렬 검증'
  - 'EAGLE-3: 별도 드래프트 모델 불필요, 산업 표준'
  - '배치 1~4 최적: 고처리량 환경은 양자화 우선'
  source: https://blog.premai.io/speculative-decoding-2-3x-faster-llm-inference-2026/
