      기존 ML Kit GenAI가 요약·이미지 설명처럼 정해진 기능을 제공했다면, Prompt API는 영수증 OCR 결과를
      카테고리화하거나 긴 글을 알림 제목으로 바꾸고, 리뷰 감정 분류나 이메일 일정 정보 추출처럼 앱별 변환
      로직을 로컬에서 처리한다. 처리가 디바이스에서 실행되므로 오프라인 동작과 개인정보 보호에 유리하다.
      단, Alpha 단계이고 지원 기기 확인이 필요하므로 프로덕션에서는 device support와 fallback 설계를 함께
      봐야 한다.
    points:
