  title: 1/W Law — LLM 추론 에너지, ctx 2배마다 tok/W 절반·라우팅이 GPU 세대보다 강력
  summary: '2026년 LLM inference 에너지 연구의 핵심 발견. 1/W Law: serving context window가 2배될 때마다 tokens-per-watt 효율이 절반으로 떨어진다 — KV-cache concurrency 한계 때문. FleetOpt two-pool routing(짧은 ctx pool + 긴 ctx pool)은 homogeneous fleet 대비 ~2.5× tok/W, H100→B200 GPU 업그레이드는 ~1.7× — 독립적으로 곱해져 ~4.25×. Watt Counts 벤치(5,000+ 실험·50 LLM·10 GPU)는 server scenario에서 UX 손실 없이 70%·batch 20% 에너지 절감 가능을 보여준다. ML 커뮤니티는 J/token·PUE·utilization을 accuracy/latency와 동등 1급 지표로 보고하자는 Position Paper(2026)도 제안.'
  points:
  - '1/W Law: ctx 2× → tok/W ½ — agent 워크로드 전환 시 2~4× 효율 하락'
  - Two-pool routing ~2.5× > GPU gen upgrade ~1.7× — gains multiply
  - 'Watt Counts: 50 LLM×10 GPU 에너지 DB, server -70%·batch -20% 가능'
