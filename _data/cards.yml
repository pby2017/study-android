- category: ai
  title: AI PR 수락률 Task-Stratified — 에이전트별 1위가 작업 유형마다 바뀐다
  summary: AIDev 7,156 PR 분석(arXiv 2602.08915)은 AI 코딩 에이전트 PR merge율이 작업 유형에 따라 29pp까지 갈린다는 걸 보여준다. documentation 82.1% vs feature 66.1%(16pp), chore 84% vs perf 55.4%. Codex는 9개 카테고리 전반 59.6~88.6%로 안정적이나, Claude Code는 documentation 92.3%·feature 72.6% 1위, Cursor는 fix 80.4% 1위 — '하나만 고르기'가 아니라 task type별 라우팅이 맞다. Devin만 32주간 +0.77%/week 상승 추세, 나머지는 plateau.
  points:
  - '작업 유형 격차: doc 82% vs feature 66% — inter-agent variance보다 task type이 dominant'
  - '에이전트별 강점: Claude Code=doc/feature · Cursor=fix · Codex=전 카테고리 안정'
  - Devin만 +0.77%/week 상승 — 나머지 agent는 32주 plateau
  source: https://arxiv.org/html/2602.08915
- category: ai
  title: AI Code Turnover Rate — 30~90일 내 AI 코드 재작성 비율로 진짜 품질 잰다
  summary: Opsera 2026 AI Coding Impact Benchmark는 acceptance rate 대신 code turnover rate를 핵심 품질 지표로 제시한다. AI 생성 코드가 30일 내 재작성되는 비율 — 건강 목표 15% 미만(30일)·22% 미만(90일), AI:human turnover ratio 1.5× 미만. AI 도입 후 22~24% 이슈가 장기 잔존하고, AI PR은 리뷰 대기가 4.6× 길어 time-to-PR 48~58% 개선이 review 병목에 상쇄된다. velocity vanity metric 대신 retention·wait time·vulnerability density·realized ROI를 executive reporting에 포함하라.
  points:
  - 'Turnover: 30일 <15%, 90일 <22%, AI:human ratio <1.5× — acceptance보다 장기 품질 신호'
  - AI PR review wait 4.6× — coding 50% 빨라져도 throughput neutralization
  - 'Executive metric: retention + wait time + change failure + vulnerability density'
  source: https://ajoconnell.com/wp-content/uploads/2026/02/opsera-2026-AI-coding-impact-benchmark-report.pdf
- category: ai
  title: ghostcall — LLM이 지어낸 API 호출을 설치된 패키지로 검증하는 Python CLI
  summary: ghostcall(linosorice)는 LLM 생성 Python 코드에서 hallucinated API call을 잡는 오픈소스 CLI다. ast로 import chain을 추적하고 importlib+getattr로 실제 설치된 패키지 버전과 대조한다. mypy/pyright(타입·프로젝트 컨텍스트)와 달리 snippet 단위 existence check — `pd.DataFrame.to_jsonl` 같은 phantom method를 difflib로 유사 제안까지 한다. 로컬 변수 체인(`df.fake()`)·import *·`__getattr__` magic module은 한계.
  points:
  - '동작: AST import chain → importlib introspection — snippet 단위 phantom API 탐지'
  - 'mypy/pyright와 분리: existence vs type — Copilot/ChatGPT 디버깅 20분 절약 목적'
  - '한계: 로컬 변수 chain·import *·magic module skip — auto-fix 없음'
  source: https://github.com/linosorice/ghostcall
- category: ai
  title: wraith — AI 생성 Python의 hallucinated API·phantom package를 Rust로 350ms 스캔
  summary: 'wraith(PyPI v0.2.0)는 AI 생성 Python 코드용 deterministic linter(Rust·tree-sitter)다. 20규칙: hallucinated API(introspection)·phantom package(PyPI 검증·typosquatting)·secret detection(4-layer)·taint analysis·AI artifact cleanup(`# Generated by Claude` 제거). 1121 FastAPI 파일 350ms, zero config. arXiv 2601.19106 AST hallucination guard와 ghostcall(existence)과 complement — wraith는 프로젝트 전체 린트·supply chain까지.'
  points:
  - 'Rust+tree-sitter: 1121 files/350ms — hallucinated API·phantom PyPI·secret·taint 20 rules'
  - 'ghostcall complement: snippet existence vs project-wide lint + supply chain'
  - arXiv 2601.19106 AST KCH detection(87.6% recall)과 같은 hallucination defense 축
  source: https://pypi.org/project/wraith/
- category: ai
  title: SWE-PRBench — AI 코드리뷰는 diff만으로도 human expert의 15~31%만 잡는다
  summary: SWE-PRBench(arXiv 2603.26130)는 350 PR human annotation으로 AI 코드리뷰 품질을 재는 벤치마크다. 8 frontier model이 diff-only(config_A)에서 human-flagged issue 15~31%만 탐지 — code generation 벤치마크와 달리 review는 human expert에 한참 못 미친다. config_A→config_C(전체 컨텍스트)로 갈수록 모든 모델 monotonic degrade — attention dilution으로 Type2_Contextual issue detection collapse. 구조화 2,000-token diff+summary가 2,500-token full context보다 8모델 전부 우수.
  points:
  - 350 PR·κ=0.75 LLM judge — diff-only 15~31% human issue detection
  - 'Context 역설: full context > diff — attention dilution, Type2_Contextual collapse'
  - '교훈: structured diff+summary > raw full context — review는 generation과 다른 난이도'
  source: https://arxiv.org/pdf/2603.26130
- category: ai
  title: CR-Bench — 코드리뷰 에이전트는 usefulness rate·SNR로 개발자 신뢰를 잰다
  summary: CR-Bench(arXiv 2603.11078)는 AI 코드리뷰 에이전트의 real-world utility를 재는 데이터셋+평가기다. Precision·Recall·F1 외 usefulness rate(개발자가 실제로 고친 비율)와 signal-to-noise ratio(SNR)를 도입 — Reflexion agent(GPT-5.2)는 recall 32.76%·F1 8.83%로 bug를 더 찾지만 SNR 1.95, single-shot은 recall 27%·SNR 5.11로 noise 적음. '더 많이 찾기'와 '신뢰할 수 있는 신호' 사이 sweet spot이 production adoption의 핵심이다.
  points:
  - 'CR-Evaluator: P/R/F1 + usefulness rate + SNR — developer trust metric'
  - 'Reflexion: recall↑ SNR↓(1.95) vs single-shot: recall↓ SNR↑(5.11) — pressure spectrum'
  - 'Production: precision alone insufficient — accepted issue rate + SNR pair'
  source: https://arxiv.org/pdf/2603.11078
- category: ai
  title: CodeReviewBench — 오프라인 golden comment + 온라인 fresh PR로 AI 리뷰 도구 평가
  summary: 'withmartian/code-review-benchmark는 AI 코드리뷰 도구 평가를 오픈소스로 공개한다. 오프라인: 50 human-verified PR + severity-labeled golden comments, LLM judge가 tool comment와 match해 precision/recall. 온라인: GitHub fresh PR을 continuous sampling — training data leakage 방지. Recall = bot이 잡은 golden/total golden, precision = useful bot comment/total bot comment. Post-review commit diff로 ''개발자가 실제로 고친 것''과 bot suggestion을 매칭.'
  points:
  - 'Dual pipeline: offline 50 PR golden comments + online fresh PR continuous'
  - 'Judge: bot suggestion ↔ post-review human fix matching — accepted issue proxy'
  - 'Training leakage 방지: online benchmark는 recent PR only — memorization 차단'
  source: https://github.com/withmartian/code-review-benchmark/
- category: ai
  title: SWE-Mutation — LLM 생성 테스트는 mutant 10%만 검증·36%만 탐지한다
  summary: SWE-Mutation(ACL Findings 2026)은 LLM 생성 test suite의 discriminative power를 재는 벤치마크다. 800 instance에서 agentic mutation으로 2,636 variant 생성 — mutant가 test를 속이는지 검증. DeepSeek-V3.1도 verification 10.20%·detection 36.15% — current LLM test generation inadequacy. Agentic mutation은 conventional 대비 detection 71%→40%로 realism↑ — superficial test를 걸러낸다. 9개 언어 multilingual subset 포함.
  points:
  - 2,636 mutants from 800 instances — test가 mutant를 속이는지 discriminative power
  - 'DeepSeek-V3.1: verification 10.2%, detection 36.2% — even top model inadequate'
  - 'Agentic mutation: realism↑ detection 71→40% — superficial test filter'
  source: https://aclanthology.org/2026.findings-acl.1976/
- category: ai
  title: CSAP — 코드 제안 수락 예측으로 거절될 suggestion을 표시 전에 필터링
  summary: FSE 2026 CSAP(Code Suggestion Acceptance Prediction)은 66,329 industrial developer-AI interaction 데이터로 제안 표시 전 수락 여부를 예측한다. 수락 suggestion은 historical acceptance count/ratio↑, generation interval↑, preceding context↓ 특성. imbalanced dataset accuracy 0.973, in-production industrial filter 대비 +69.5% — developer interruption 감소. LLM baseline 대비 +12.6%. 범용 booster가 아니라 personalization/filtering이 acceptance rate 개선의 실제 레버.
  points:
  - 66,329 industrial interactions — display-before-accept prediction, accuracy 0.973
  - 'Features: dev/project historical acceptance, gen interval, context length'
  - In-production filter +69.5% vs industrial baseline — interruption reduction lever
  source: https://conf.researchr.org/details/fse-2026/fse-2026-research-papers/46/Understanding-and-Predicting-Accepted-Code-Suggestions-in-AI-Assisted-Programming
- category: ai
  title: ABC-Bench — 백엔드 에이전트를 repo 탐색→컨테이너 서비스→E2E API 테스트까지 평가
  summary: ABC-Bench(ACL 2026 Findings)는 정적 코드 생성 벤치마크가 놓치는 백엔드 실무 — 환경 설정·컨테이너 서비스 기동·외부 E2E API 테스트 — 를 224개 태스크(8언어·19프레임워크)로 평가한다. 에이전트는 레포 탐색부터 docker compose up까지 전체 lifecycle을 스스로 수행해야 pass. OpenHands≈50% vs mini-SWE-agent+GPT-5<20% — 같은 모델도 프레임워크 interaction strategy가 성공률을 2.5배 이상 가른다. SWE-bench(패치)·ProjDevBench(그린필드)와 달리 '실행 가능한 백엔드 서비스' holisticsystem 평가.
  points:
  - 224 tasks / 8 langs / 19 frameworks — containerized service + external API test
  - Framework-sensitive — OpenHands peak ~50%, mini-SWE-agent drops GPT-5 below 20%
  - SWE-bench·ProjDevBench와 역할 분리 — backend lifecycle·executable workflow
  source: https://aclanthology.org/2026.findings-acl.1142.pdf
- category: ai
  title: EvoCodeBench — Harbor multi-step·MT@4 vs SR 22–40pp·grader leak audit
  summary: EvoCodeBench(EvoCode-Bench·UniPat-AI·Harbor official multi-step) — 26 stateful task·227 steps·5–15 rounds per task, single persistent workspace+cumulative executable tests. MT@4(fail-stop multi-round) vs SR(single-round from reference state) — most agents SR exceeds MT@4 by 22–40pp, highest SR(78.9) ranks 3rd in MT@4(44.0). Round-5 aggregate pass < half of round-1. June 2026 integrity audit — Harbor shared multi-step grader script leak in agent workspace(12/26 tasks), upstream fix PR
  points:
  - MT@4 vs SR ranking inversion — single-round overstates persistent reliability
  - Harbor native [[steps]] — no fork for full task, mean multi_step_reward_strategy
  - Grader leak lesson — benchmark trust requires harness workspace isolation audit
  source: https://arxiv.org/html/2605.24110
- category: ai
  title: RoadmapBench — 실제 버전 업그레이드 roadmap을 에이전트가 얼마나 구현하는가
  summary: RoadmapBench(arxiv 2605.15846)는 17 OSS repo·5언어·115 task에서 V_OLD 스냅샷과 multi-target roadmap instruction만 주고 target-version 코드·테스트·oracle patch 접근을 차단한다. subtask 순서는 강제하지 않아 에이전트가 planning·우선순위를 스스로 정해야 한다. Resolved Rate(전 subtask pass)와 Completion Score(가중 partial credit)를 동시 보고 — Claude-4.7·GPT-5.4가 30~39% resolved, median ~3,700 LOC·51 files. SWE-EVO(48 Python version)·ProjDevBench(그린필드)와 달리 real upstream test suite 기반 version evolution.
  points:
  - 115 tasks / 17 repos / 5 langs — V_OLD snapshot, target code blocked
  - Resolved Rate + Completion Score — unordered multi-target planning
  - SWE-EVO·ProjDevBench와 역할 분리 — real version-upgrade roadmap
  source: https://github.com/UniPat-AI/RoadmapBench
- category: ai
  title: Omnionix AgentBench — MCP·reliability·long-session을 재는 production harness
  summary: Omnionix AgentBench(v0.2.9)는 one-shot answer prompt가 아니라 coding·data workflow·MCP tool use·persistent memory drift·resumed-session reliability·public leaderboard reproducibility hash를 first-class track으로 평가하는 production-oriented harness다. CLI·Docker·Python adapter 3가지 agent-exec contract, GitHub Actions regression compare, family/tag slice(mcp·reliability·long-session·workflow·coding·data). THUDM AgentBench FC(8환경 LLM-as-Agent·ICLR'24)와 이름은 같지만 축이 다르다 — Omnionix는 MCP+운영 신뢰성+재현성 pipeline.
  points:
  - Tracks — MCP·reliability·long-session·workflow·coding·data tag slice
  - Leaderboard pipeline — reproducibility hash·signed attestation·regression compare
  - THUDM AgentBench FC와 역할 분리 — production harness·MCP·session resume
  source: https://github.com/OmnionixAI/AgentBench
- category: ai
  title: holster-scan — slopsquat 패키지·에이전트 boundary를 로컬에서 먼저 검사
  summary: holster-scan(nauta-ai)은 AI 생성 코드의 hallucinated/typosquatted import와 에이전트가 상속하는 shell env·MCP tool·cloud cred blast radius를 로컬·무료·no-signup으로 preflight한다. 10 major repo에서 95% recall·0.36% FP — Semgrep(generic SAST)이 못 잡는 slopsquat 축. safe-to-run vs safe-to-share를 분리하고 .holster.yml allow-list로 private package noise 제거. ghostcall(snippet API check)·wraith(Python linter)와 complement — repo+agent config boundary preflight.
  points:
  - Slopsquat detection — 95% recall / 0.36% FP on 10 major repos
  - Agent boundary — shell·MCP·cred blast radius, safe-to-run vs safe-to-share
  - ghostcall·wraith와 역할 분리 — repo-level preflight + allow-list
  source: https://github.com/nauta-ai/holster-scan
- category: ai
  title: pkgguard — AI가 추천한 패키지 8개 생태계를 설치 전에 vet
  summary: pkgguard(Highcrypto7)는 PyPI·npm·crates.io·Go·RubyGems·Packagist·NuGet·pub.dev 8 ecosystem에서 existence·typosquat·homoglyph·OSV CVE·license trap·maintenance·popularity·repo health를 API key 없이 10-check pipeline으로 판정한다. optional --scan은 archive static malware scan, --deep는 fake star detection. 에이전트가 prose로 패키지명을 제시할 때 ecosystem 미명시면 PyPI+npm 동시 검사. ghostcall(import snippet)·wraith(Python-only linter)와 달리 multi-ecosystem install vet.
  points:
  - 8 registries — existence·typosquat·CVE·license trap·maintenance, no API key
  - Optional --scan static malware · --deep fake stars
  - ghostcall·wraith와 역할 분리 — multi-ecosystem pre-install vet
  source: https://github.com/Highcrypto7/pkgguard
- category: ai
  title: safedeps — npm lockfile closure 검증·자동 rollback으로 에이전트 supply chain gate
  summary: safedeps(aldegad)는 Claude Code·Codex CLI install hook으로 pkg@version과 transitive closure를 OSV·CISA KEV·GitHub Advisory에 pre-approve하고, PostToolUse에서 실제 package-lock.json closure를 re-verify한다. unapproved·KEV·vulnerable package가 lockfile에 들어가면 last-known-safe snapshot으로 auto-reorg — Claude Code는 --ignore-scripts로 rejected package lifecycle script 차단. AgentGuard(install intercept)와 달리 npm effect gate — '명령은 통과했지만 lockfile이 다른 closure' 우회를 fail-closed.
  points:
  - Pre-approve direct+transitive npm closure against OSV·KEV·GHSA
  - PostToolUse lockfile re-verify → auto-reorg to safe snapshot
  - AgentGuard·holster-scan과 역할 분리 — npm closure effect gate
  source: https://github.com/aldegad/safedeps
- category: android
  title: Compose Testing v2 — StandardTestDispatcher 기본, advanceUntilIdle이 필수
  summary: Jetpack Compose 1.11(April '26)은 v2 testing API를 default로 전환하고 v1을 deprecated했다. 핵심 변화는 UnconfinedTestDispatcher(즉시 실행) → StandardTestDispatcher(큐잉) — waitForIdle()만 쓰는 테스트는 대부분 그대로지만 LaunchedEffect·rememberCoroutineScope 직접 검증은 advanceUntilIdle() 또는 runCurrent()가 필요하다. race condition을 숨기던 v1 false green을 제거해 production-like timing에 가까워진다. LookaheadAnimationVisualDebugging·performTrackpadInput도 같은 릴리스에 추가.
  points:
  - v2 default — StandardTestDispatcher queues coroutines until clock advance
  - LaunchedEffect 테스트 — advanceUntilIdle/runCurrent 명시 필요
  - v1 UnconfinedTestDispatcher deprecated — hidden race condition 제거
  source: https://developer.android.com/develop/ui/compose/testing/migrate-v2
- category: ai
  title: Copilot /fleet — 같은 작업을 병렬 subagent에 던져 best-of-N 수렴
  summary: GitHub Copilot CLI /fleet는 동일 task를 여러 subagent·여러 model에 병렬 실행하고 decision-ready result 하나로 수렴시키는 command다. /model로 모델을 바꾼 뒤 /fleet로 parallelize — branch 생성·implement·PR까지 background subagent coordination. Copilot CLI 선택적 위임(좁은 탐색은 inline·넓은 탐색만 subagent)과 complement — /fleet는 '같은 문제를 여러 관점에서 동시에' best-of-N. Cursor /best-of-n·Claude Agent Teams(상호 대화)와 달리 GitHub-native terminal fleet.
  points:
  - /fleet — parallel subagents on same task, converge to one decision-ready result
  - /model + /fleet — multi-model parallel compare in terminal
  - 선택적 위임·Agent Teams와 역할 분분 — best-of-N terminal fleet
  source: https://github.com/features/copilot/cli
- category: ai
  title: Copilot Critic·Rubber Duck — complementary model이 plan·구현을 자동 검토
  summary: Copilot CLI 1.0.60+(experimental) Critic agent는 Claude model에서 plan·complex implementation을 complementary model로 자동 review해 early error catch. Rubber Duck agent는 builtInAgents.rubberDuckAutoInvoke 설정으로 critical reviewer 역할 — 2026-06 기본 enabled. Plan mode→Autopilot handoff 전에 '다른 모델이 틀린 가정을 잡아내는' self-review layer. 공식 /code-review 플러그인(4 parallel reviewer→재검증)과 complement — 내장 critic은 plan/implement 단계 inline gate.
  points:
  - Critic agent — complementary model reviews plan·complex implementation (experimental)
  - Rubber Duck — critical reviewer, rubberDuckAutoInvoke setting
  - /code-review plugin과 역할 분리 — inline plan/implement self-review gate
  source: https://github.com/github/copilot-cli/blob/main/changelog.md
- category: ai
  title: Aider 생태계 개요 — git 커밋·레포 맵·아키텍트·Polyglot을 한 터미널 페어 프로그래머로
  summary: Aider(Aider-AI/aider·Apache-2.0·~46k★)는 터미널 LLM 페어 프로그래밍 도구로, 가장 큰 차별점은 변경마다 자동 git 커밋으로 diff/undo 안전망을 만드는 것이다. repo map은 tree-sitter+PageRank로 파일·심볼 시그니처만 보내 전체 코드베이스를 안 넣어도 관련 파일을 집는다. architect 모드는 비싼 모델로 해법을 제안하고 `--editor-model`로 싼 모델이 편집을 변환하는 2-pass 분업. Polyglot 벤치마크는 Exercism 225문제×6언어로 코드 생성이 아니라 지시 따라 파일 편집 능력과 well-formed edit rate를 분리 측정한다. 100+ 언어·클라우드/로컬 LLM·자동 lint/test 후 수정까지 지원.
  points:
  - git 일등 시민 — 매 편집 자동 커밋, 단위별 diff/undo
  - repo map — tree-sitter+랭킹, `--map-tokens`로 토큰 예산 조절
  - architect+Polyglot — 2-pass 모델 분업·6언어 편집 벤치로 실력 검증
  source: https://github.com/Aider-AI/aider
- category: ai
  title: Copilot CLI 생태계 개요 — TUI GA·Issues/PR 탭·/mcp add·LSP·steering
