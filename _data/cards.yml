  title: Copilot JetBrains 6월 업데이트 — 에이전트 선택·중간 개입·권한 상태를 한 화면에서 다루기
  summary: 'GitHub의 2026년 6월 22일 JetBrains Copilot 업데이트는 코딩 에이전트를 "채팅창 기능"이 아니라 운영 가능한 세션으로 다루게 만드는 변화다. 조직·엔터프라이즈 관리자가 배포한 custom agent를 JetBrains IDE 안의 agent picker에서 고르고, Copilot CLI 세션이 도는 중에도 메시지를 큐에 넣거나 현재 요청을 다음 도구 실행 뒤 방향 전환시킬 수 있다. Agent Debug 패널은 세션 활동 요약을 보여주고, Claude Code CLI를 agent provider로 붙이는 공개 프리뷰도 제공한다. 단, GitHub는 Claude provider가 현재 bypass permissions mode로 실행되어 파일 편집과 도구 호출이 자동 승인된다고 명시한다.

    '
  points:
  - 조직/엔터프라이즈 custom agent를 JetBrains IDE의 agent picker에서 선택
  - 긴 Copilot CLI 실행 중 Add to Queue / Steer with Message / Stop and Send로 개입
  - Claude provider preview는 현재 bypass permissions mode라 권한 정책 확인이 선행
