  - category: ai
    title: "ML Kit Prefix Caching — 반복 프롬프트를 캐시해 Gemini Nano 지연 줄이기"
    summary: >
      ML Kit Prompt API의 Prefix Caching은 반복되는 프롬프트 앞부분을 static prefix로 분리하고, 매번 바뀌는
      내용만 dynamic suffix로 보내 온디바이스 LLM의 중간 상태를 재사용한다. 문서 기준 Pixel 9 예시에서
      300토큰 prefix+50토큰 suffix는 0.82초에서 cache hit 0.45초, 1000토큰 prefix+100토큰 suffix는
      2.11초에서 0.5초로 줄었다. 단, 현재 experimental이고 일부 기기에서만 가능하며 text-only 입력만
      지원한다. 앱 설계 관점에서는 긴 시스템 지침, 고정 분류 기준, 반복 템플릿을 prefix로 빼고 이미지 입력이나
      민감 prefix 저장 정책은 별도로 검토해야 한다.
    points:
      - "반복 promptPrefix + 매번 바뀌는 dynamicSuffix로 중간 LLM 상태 재사용"
      - "Pixel 9 예시: 2.11초 → cache hit 0.5초(1000+100토큰)"
      - "Experimental·일부 기기·text-only 제한, 캐시 저장 정책 검토 필요"
    source: "https://developers.google.com/ml-kit/genai/prompt/android/prefix-caching"

  - category: ai
    title: "GitHub third-party agent security validation — Codex·Claude PR도 CodeQL·의존성·secret 검사"
    summary: >
      GitHub는 2026년 6월 9일 third-party coding agents 보안 검증을 일반 제공한다고 발표했다. Claude나
      OpenAI Codex처럼 저장소에서 직접 기능 구현, 버그 수정, 테스트 보강을 수행하는 에이전트가 만든 코드도
      Copilot cloud agent와 같은 자동 보안 검증을 받는다. 검증은 CodeQL 취약점 분석, GitHub Advisory
      Database 기반 신규 의존성 확인, secret scanning으로 API 키·토큰 노출 탐지를 포함한다. 설정은 기존
      Copilot validation 설정을 따르고 Advanced Security 라이선스가 필요 없다고 설명된다. 실무 포인트는
      에이전트 산출물을 신뢰하는 대신, PR 완료 전 자동 검증을 기본 안전망으로 두는 것이다.
    points:
      - "third-party coding agents 코드도 Copilot cloud agent와 같은 보안 검증 적용"
      - "CodeQL, GitHub Advisory Database, secret scanning으로 신규 위험 확인"
      - "Copilot 설정을 따르며 Advanced Security 라이선스 없이 사용 가능"
    source: "https://github.blog/changelog/2026-06-09-security-validation-for-third-party-coding-agents/"

  - category: ai
    title: "Google Agents CLI — 코딩 에이전트에게 Agent Platform 빌드·평가·배포 명령을 주입"
    summary: >
