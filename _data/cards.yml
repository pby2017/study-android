  - category: ai
    title: "Aider — 변경마다 자동 git 커밋해 'diff/undo'를 보장하는 터미널 페어 프로그래머(Apache-2.0·~46.4k★)"
    summary: >
      Aider는 터미널에서 LLM과 짝 코딩하는 오픈소스 도구다. 공식 태그라인은 "aider is AI pair programming in your terminal". 가장 차별적인 설계는 'git 일등 시민'이다 — 에이전트가 코드를 고칠 때마다 의미 있는 메시지로 자동 커밋하므로, 마음에 안 들면 그 단위로 diff·undo가 된다(에이전트의 무분별한 수정에 대한 안전망). 또 레포 전체의 '맵(repo map)'을 만들어 큰 코드베이스에서도 관련 파일을 집어주고, 100개 이상 언어를 지원하며, 클라우드·로컬 LLM을 모두 붙일 수 있다. 그 밖에 자동 린트·테스트 후 문제 자동 수정, 이미지·웹페이지 입력, 음성 코딩, 에디터 코멘트로 IDE 안에서 호출까지 제공한다. 라이선스 Apache-2.0, 주 언어 Python, GitHub ~46.4k★(레포 표시 기준).
    points:
      - "변경마다 자동 git 커밋 → 단위별 diff/undo 안전망(가장 큰 차별점)"
      - "repo map으로 큰 코드베이스의 관련 파일 자동 선별·100+ 언어"
      - "클라우드·로컬 LLM 양쪽 지원 + 자동 린트/테스트 후 수정"
    source: "https://github.com/Aider-AI/aider"
  - category: ai
    title: "Prompt caching — 에이전트 비용을 줄이는 첫 번째 레버"
    summary: >
      프롬프트 캐싱은 긴 시스템 프롬프트·도구 정의·고정 컨텍스트처럼 반복되는 앞부분을 다시 계산하지 않게
      해 비용과 지연을 낮추는 방법이다. OpenAI 문서는 1,024토큰 이상 공통 prefix에서 자동으로 캐시가
      걸리고, Anthropic 문서는 cache_control로 재사용 구간을 표시하되 tools→system→messages 순서의
      계층을 따른다고 설명한다. 에이전트 실전 포인트는 "동적인 것은 뒤로, 안정적인 것은 앞으로"다.
      도구 목록·시스템 지침을 매 턴 흔들면 캐시가 깨져 긴 세션일수록 같은 토큰을 계속 다시 산다.
    points:
      - "공통 prefix 재사용: 긴 시스템 프롬프트·도구 정의 비용/지연 감소"
      - "Anthropic 계층: tools → system → messages, 변화 지점 뒤 캐시 무효화"
      - "실전 규칙: 고정 컨텍스트는 앞, 사용자별·도구결과 같은 동적 내용은 뒤"
    source: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"
  - category: ai
    title: "SWE-Skills-Bench — 에이전트 스킬은 만능 부스터가 아니라 '맞춤 지식'이다"
    summary: >
      SWE-Skills-Bench는 SKILL.md 같은 절차 지식이 실제 소프트웨어 작업에 얼마나 도움 되는지 재는 벤치마크다.
