  title: Gartner가 'AI 코드 어시스턴트'를 'AI 코딩 에이전트'로 다시 부르다 — 4강 굳히기
  summary: 'GitHub가 공개한 2026 Gartner Magic Quadrant 요약에서 눈에 띄는 점은 카테고리명이 ''AI Code Assistants''가 아니라 ''Enterprise AI Coding Agents''라는 것이다. GitHub 글은 Gartner가 2026-05-20 보고서에서 12개 벤더를 실행력과 비전 완성도 기준으로 평가했고, GitHub·Anthropic·Cursor·OpenAI를 Leader 사분면에 뒀다고 설명한다. 다만 이 글은 GitHub의 해설이므로 "GitHub가 1위라서 좋다"가 교훈은 아니다. 더 실용적인 신호는 시장의 평가 단위가 자동완성·채팅에서 이슈 처리, 코드 리뷰, PR, 보안, 거버넌스까지 포함한 에이전트 워크플로로 넓어졌다는 점이다. 도구를 고를 때도 모델 품질 하나보다 멀티모델 선택, 감사·통제, SDLC 표면 통합을 같이 봐야 한다.

    '
  points:
  - '공개 출처 기준: 2026-05-20 Gartner 보고서명은 Enterprise AI Coding Agents'
  - GitHub 글은 12개 벤더 평가와 Leader 4곳(GitHub·Anthropic·Cursor·OpenAI)을 설명
  - '실무 함의: 자동완성보다 이슈→리뷰→PR→보안→거버넌스까지 이어지는 에이전트 표면을 평가'
  source: https://github.blog/ai-and-ml/github-copilot/github-recognized-as-a-leader-in-the-gartner-magic-quadrant-for-enterprise-ai-coding-agents-for-the-third-year-in-a-row/
- category: ai
  title: ETH Zurich 연구 — AGENTS.md를 LLM에게 자동 생성시키면 오히려 성공률이 떨어진다
  summary: 'ETH Zurich·LogicStar.ai 팀이 실제 코딩 태스크에서 AGENTS.md(레포 컨텍스트 파일)가 코딩 에이전트에 도움이 되는지 처음으로 엄밀하게 측정했다(arXiv 2602.11988). 결론은 직관과 반대다: `/init` 류로 LLM이 자동 생성한 컨텍스트 파일은 성공률을 높이기는커녕 오히려 낮추는 경향을 보였고, 에이전트가 더 많은 단계를 밟게 만들어 추론 비용을 20% 넘게 끌어올렸다. 사람이 손으로 쓴 파일은 소폭의 이득은 있었지만 그 역시 탐색 단계와 비용을 함께 늘렸다. 60,000개 넘는 공개 레포가 이미 이런 파일을 두고 있는데, "있으면 좋다"는 가정이 데이터로 흔들린 셈이다.

    '
  points:
  - '핵심 발견: LLM이 자동 생성한 AGENTS.md는 컨텍스트 파일 없는 경우보다 성공률을 떨어뜨리는 경향 + 추론 비용 20%↑(논문 abstract 확인)'
  - '원인 추정: ''전체 테스트 돌려라''·''관련 모듈 다 봐라'' 같은 지시가 에이전트를 불필요한 탐색으로 몰아 단계·비용을 늘림'
  - '권고: LLM 자동 생성 파일은 빼고, 사람이 추론 불가능한 정보(특수 빌드·툴 커맨드)만 짧게 적어라 — ''자동 생성 디테일''은 독'
  source: https://arxiv.org/abs/2602.11988
