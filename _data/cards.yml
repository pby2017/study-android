- category: ai
  title: Figma Code Layers — Config 2026, 코드를 design material로 캔버스에 올리다
  summary: Figma Config 2026은 'design vs code' 이분법을 깨고 code layers를 canvas에 도입했다. design layer를 클릭 한 번(또는 prompt)으로 interactive code layer로 전환하고, side-by-side duplicate로 여러 implementation direction을 frame처럼 탐색한다. Figma Motion timeline은 Dev Mode에서 easing·keyframe·timing을 inspectable하게 노출하고 CSS·JSON·React animation code를 copy하며 MCP-compatible frame을 coding agent에 전달한다. generative plugins·Weave tools·shader·motion이 같은 canvas material family로 묶인다. bolt.new(WebContainers) ·v0(React gen) ·Figma MCP(read/write loop)와 complement — Code Layers=design process 안에서 code prototype을 first-class layer로 다루는 패러다임 shift.
  points:
