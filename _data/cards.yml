  title: FLUX.2 — Black Forest Labs 오픈소스 이미지 생성, Klein 4B(Apache-2.0)는 8GB GPU에서 실시간(ComfyUI)
  summary: 'FLUX.2는 Black Forest Labs가 만든 최신 오픈소스 이미지 생성 모델 패밀리다. Klein 4B(Apache-2.0)는 ~8GB VRAM의 소비자 GPU(RTX 4070/3090)에서 서브초 생성 가능. Klein 9B(16GB)와 Dev 32B(고품질· 비상업)도 제공. 텍스트→이미지+이미지 편집(단일/다중 참조)을 단일 모델로 통합. ComfyUI가 표준 인터페이스. Stable Diffusion 3.5(LoRA/ControlNet 생태계 최대) 대비 포토리얼리즘·텍스트 렌더링 우수.

    '
  points:
  - 'Klein 4B: Apache-2.0, 8GB GPU에서 서브초 생성'
  - '통합: 텍스트→이미지 + 이미지 편집, 단일 모델'
  - 'ComfyUI 표준: 노드 기반 워크플로우, 커스터마이징'
  source: https://github.com/black-forest-labs/flux2
