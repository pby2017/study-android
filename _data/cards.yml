    '
  points:
  - '동작: 스크립트를 실행해 결과를 출력·대화에 추가 후 자기 자신을 재호출(self-select context)'
  - '안전 경고 명시: 지시에 따라 해를 끼칠 수 있으니 주의 / --leash로 스크립트마다 수동 승인, --retries(기본 2)로 에러 시 재시도'
  - '두 모드: Direct(단일 프롬프트 실행 후 종료)·Conversation(왕복 대화, 자기 스크립트·출력 참조)'
  - litellm 사용, 기본 gpt-4-turbo-preview / Ollama로 Mixtral 로컬 실행·Anthropic claude 설정 가능
  source: https://github.com/AbanteAI/rawdog
