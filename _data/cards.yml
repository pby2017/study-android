  title: Distilabel — LLM을 교사로 활용해 파인튜닝·RLHF용 합성 데이터셋을 자동 생성하는 파이프라인 프레임워크(Apache-2.0·Argilla)
  summary: 'Distilabel은 Argilla가 만든 합성 데이터 생성 프레임워크로, LLM 생성기와 판정기(judge)를 체인으로 엮어 instruction·preference·임베딩 학습용 데이터셋을 자동 생성한다. Evol-Instruct·UltraFeedback·Magpie 등 검증된 연구 기법을 내장하고, 모든 교사 모델(OpenAI·Anthropic·Ollama)을 사용 가능. Argilla(인간 검수)와 연동하면 합성→검수 파이프라인이 완성된다. 직접 프롬프팅은 빠르지만 재현 불가, Distilabel은 감사 가능한 재현 파이프라인이 핵심 차별점.

    '
  points:
  - '연구 기반: Evol-Instruct·UltraFeedback·Magpie 내장'
  - 'Argilla 연동: 합성 → 인간 검수 파이프라인'
  - Apache-2.0, 모든 교사 모델 사용 가능
  source: https://github.com/argilla-io/distilabel
