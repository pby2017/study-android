  title: Visily — PM·비개발자용 AI wireframe, screenshot·diagram·text→UI
  summary: Visily는 'UI design tool for non-designers'를 표방하는 AI wireframing·prototyping 도구다. text prompt·screenshot·diagram·template·조합 입력에서 wireframe을 생성하고, Smart Components·Auto-Prototyping·AI chat edit으로 canvas에서 바로 다듬는다. 2025-2026 업데이트로 code generation from design·Plan Mode(prompt structuring)·Deep Design(aesthetic polish)·Figma import·Slack/Jira/Notion 연동을 추가 — Uizard(Autodesigner)보다 design-to-code 쪽으로 확장 중. Figma export·on-canvas chat·follower mode로 PM이 spec document를 engineer handoff 전에 clickable prototype으로 만든다. v0(개발자 React gen) ·Stitch(모바일) ·Figma Make(Figma-native)와 complement — Visily=non-designer ideation·wireframe·collaboration layer.
  points:
