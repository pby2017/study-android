  title: Chainlit — Python만으로 ChatGPT급 LLM 앱 UI, 2025-05부터 커뮤니티 유지보수
  summary: '@cl.on_message·@cl.step 데코레이터로 프론트엔드 없이 대화형 LLM 앱을 만드는 오픈소스 Python 프레임워크. LangChain·LlamaIndex·MCP·RAG 통합, 중간 단계(step) 시각화, 파일 업로드·인증·세션 지속. 2025-05-01 원 팀이 후퇴하고 @Chainlit/chainlit-maintainers가 공식 인계 — v2.11+ 유지보수·보안 패치(CVE-2026-22218/22219) 필수. Gradio(데모·API)와 달리 에이전트 워크플로 중간 과정 노출에 강점 — 내부 도구·RAG PoC에 적합.'
