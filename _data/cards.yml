  title: Cloudflare Temporary Accounts — 에이전트가 OAuth 없이 배포·검증하고 60분 안에 사람이 claim
  summary: Cloudflare Temporary Accounts for AI agents는 코딩 에이전트의 배포 루프에서 사람용 가입·OAuth·API 토큰 복사를 걷어내는 Workers 기능이다. Wrangler 4.102.0+에서 로그인 없이 배포를 시도하면 `--temporary` 플래그를 안내하고, 에이전트는 `wrangler deploy --temporary`로 임시 계정에 Worker를 배포한다. 결과는 live Worker URL과 claim URL이다. 임시 배포는 60분 동안 살아 있고, 그 안에 사람이 claim URL로 로그인·가입하면 영구 계정으로 가져갈 수 있으며, 아니면 만료된다. 교육 포인트는 "에이전트에게 production credential을 주기"가 아니라, throwaway 배포 타깃을 만들어 write→deploy→curl verify→redeploy 루프를 credential 없이 돌리게 하는 것이다.
  points:
  - Wrangler 4.102.0+ — unauthenticated deploy가 `--temporary` 재시도를 안내
  - 60분 preview account — live URL+claim URL 반환, unclaimed 배포는 자동 만료
