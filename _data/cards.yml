  title: Hybrid Search — BM25+vector 병렬·RRF(k=60) 융합, RAG 1-stage retrieval 표준(2026)
  summary: 'Hybrid Search(하이브리드 검색)는 dense vector(semantic)와 sparse BM25(lexical)를 병렬 실행 후 Reciprocal Rank Fusion으로 합치는 RAG 1-stage retrieval 아키텍처다. 2026년 RAG 프로덕션의 사실상 기본값. Bi-encoder cosine은 product code·에러 메시지·고유명사에서 실패, BM25는 paraphrase에서 실패 — 병렬+RRF가 양쪽 강점 결합. RRF score = Σ 1/(k+rank), k=60 기본(튜닝 불필요·raw score scale 불일치 해결). Elasticsearch·OpenSearch·Qdrant·Weaviate·Pinecone·MongoDB Atlas native hybrid 지원. 최적화 경로: RRF 베이스라인 → 레이블 있으면 alpha/convex combination → cross-encoder rerank(2-stage). Pure vector RAG 대비 WANDS e-commerce NDCG 7.4%↑. Cross-encoder rerank(2-stage precision)와 역할 분리 — hybrid=recall top-50, rerank=precision top-10.'
  points:
  - BM25 + vector 병렬 → RRF(k=60) rank-based fusion
  - product code·고유명사(BM25) + paraphrase(vector) 동시 커버
  - Elasticsearch·Qdrant·Weaviate·Pinecone native 지원
  - Cross-encoder rerank과 2-stage — hybrid top-50→rerank top-10
  source: https://denser.ai/blog/hybrid-search-for-rag/
- category: ai
  title: Cross-encoder Reranking — RAG 2-stage precision, BGE-Reranker·Cohere Rerank·Jina v3
  summary: 'Cross-encoder reranking은 hybrid/vector 1-stage top-50~100 후보를 query-document pair로 joint scoring해 top-5~10을 LLM에 전달하는 RAG 2-stage precision layer다. Bi-encoder는 query·doc을 독립 encode(빠르지만 nuance 손실), cross-encoder는 pair-wise attention(느리지만 hyper-accurate). OSS: BGE-Reranker-v2-m3(568M·multilingual·~80ms/50doc CPU), Jina Reranker v3(listwise·nDCG@10 61.94). Managed: Cohere Rerank API($1/1k search). TEI(Text Embeddings Inference)로 production batching. Latency budget(<200ms)+circuit breaker fallback 필수. Jina Reranker v3(제품)와 달리 2-stage funnel 아키텍처 패턴.'
  points:
  - 2-stage funnel — retrieve 50-100 → cross-encoder → top 5-10
  - BGE-Reranker-v2-m3(OSS) vs Cohere Rerank(managed) vs Jina v3(listwise)
  - Hybrid search(1-stage recall)과 짝 — NDCG@10 +5~15pt typical lift
  source: https://localaimaster.com/blog/reranking-cross-encoders-guide
