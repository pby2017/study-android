- category: ai
  title: Inngest — step.run()으로 LLM·tool loop를 crash-safe durable execution으로
  summary: Inngest는 AI agent loop의 LLM call·tool execution·save를 각각 step.run()으로 감싸 crash 후 마지막 completed step부터 resume한다. iteration 7에서 죽어도 iteration 1-6 LLM/tool 비용을 재지불하지 않는다. step.invoke()는 sub-agent를 sync delegate, step.sendEvent()는 async fire-and-forget. 2026-06 Agent Loop Architecture 블로그는 loop·skill(durable workflow)·orchestrator 3-layer를 정의하고 Inngest를 orchestration engine으로 포지셔닝. Temporal(generic durable workflow) 카드와 달리 AI agent tool-loop·context pruning·token budget 패턴이 docs-first.
  points:
  - step.run per LLM/tool — memoized resume, no duplicate token spend
  - step.invoke sub-agent · step.sendEvent async delegate
  - Agent loop architecture — loop unit + skill asset + orchestrator engine
  source: https://www.inngest.com/docs/ai-patterns/agent-tool-loops
