- category: ai
  title: React Native ExecuTorch + RAG — 모바일 앱에 로컬 임베딩·검색·생성을 연결하기
  level: "중급"
  summary: 'Software Mansion의 `react-native-rag`는 임베딩, 벡터 저장소, 텍스트 분할, LLM을 조합해 React Native 앱에 RAG를 구성한다. `@react-native-rag/executorch`로 모델 추론을 기기에서 실행할 수 있고, 공식 예시는 ALL_MINILM_L6_V2 임베딩과 LFM2_5_1_2B LLM을 사용한다. 모델은 첫 `load()` 때 다운로드되어 기기에 캐시된다. 따라서 추론을 로컬에서 할 수 있어도 첫 다운로드와 앱의 다른 네트워크 동작까지 자동으로 오프라인·비용 0·데이터 완전 비전송이 보장되는 것은 아니다. 모델 크기·기기 성능·메모리·배터리와 데이터 보관 정책을 함께 검증해야 한다.'
  points:
  - 'RAG 구성: 임베딩으로 문서를 색인하고, 벡터 검색 결과를 LLM 문맥으로 전달'
  - 'Android는 Vulkan, iOS는 Core ML 또는 MLX를 선택할 수 있고 XNNPACK은 범용 fallback으로 제공'
  - 'RN 0.83+/Expo SDK 55+ dev build, New Architecture 필요; Expo Go는 미지원'
  - '예제 MemoryVectorStore는 메모리 저장소이므로, 재실행 후에도 보존하려면 SQLite 등 영속 저장소를 구성'
  source: https://github.com/software-mansion-labs/react-native-rag/blob/main/packages/executorch/README.md
  interview: "온디바이스 RAG를 적용하면 사용자 데이터가 절대로 네트워크로 전송되지 않는다고 말할 수 있나요?"
  answer: "아니다. 모델 추론과 벡터 검색을 기기에서 실행할 수 있지만, 모델 첫 다운로드·앱의 다른 API 호출·분석 전송은 네트워크를 쓸 수 있다. 데이터 흐름과 저장소, telemetry 설정을 확인하고 네트워크 차단 테스트로 검증해야 한다."
