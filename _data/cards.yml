      대신 기존 runner group, 정책, Actions 승인 흐름을 재사용한다. 보안 장치도 제품의 중심에 있다:
      기본 읽기 전용 권한, sandboxed container, Agent Workflow Firewall, safe outputs, threat detection
      작업을 거친다. 같은 날 업데이트로 장기 PAT 없이 Actions 기본 GITHUB_TOKEN을 쓸 수 있게 됐고,
      조직 과금은 copilot-requests: write 권한과 비용 관리 도구로 통제한다.
