  summary: Voyage AI 4 시리즈(2026-01, MongoDB 인수)는 industry-first shared embedding space를 도입한 차세대 text embedding이다. voyage-4-large(MoE·40% 저비용)·voyage-4·voyage-4-lite·voyage-4-nano(Apache-2.0 HF) — 4시리즈 내 모든 모델 embedding 호환. index는 voyage-4-large, query는 voyage-4-lite로 asymmetric retrieval — re-index 없이 quality-latency-cost 트레이드오프. 32K context·Matryoshka 256/512/1024/2048·int8/binary quantization. MongoDB Atlas·GCP Vertex·AWS Marketplace. Cohere Embed v4(API multimodal)와 달리 text retrieval 특화·shared space asymmetric.
