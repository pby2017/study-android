- category: ai
  title: Gemini Live API on Android — 실시간 음성 에이전트를 백엔드 없이 붙이기
  summary: 'Android Developers의 Gemini Live API 가이드는 Firebase AI Logic을 통해 Android 앱에서 Gemini Live API를 직접 호출하는 흐름을 보여준다. 목적은 일반 텍스트 챗봇이 아니라 실시간·저지연 음성 지원이 필요한 챗봇이나 에이전트 상호작용이다. 앱은 Firebase BoM과 `firebase-ai`를 추가하고, `RECORD_AUDIO` 권한을 선언한 뒤 `LiveModel`을 초기화해 오디오 응답 모델을 스트리밍한다. 단, Firebase AI Logic의 Live API 사용은 개발자 프리뷰라 호환성 변경 가능성과 제한이 있다. Android AI 설계 포인트는 "마이크 권한을 붙인다"가 아니라, 음성 UX·세션 수명·비용/쿼터·모델명 원격 변경을 제품 요구사항으로 다뤄야 한다는 점이다.

    '
  points:
  - Firebase AI Logic으로 Android 앱에서 Gemini Live API를 직접 호출
  - '`firebase-ai` 의존성 + RECORD_AUDIO 권한 + LiveModel 초기화가 기본 흐름'
  - '개발자 프리뷰: 세션·쿼터·비용·호환성 변경을 출시 전 리스크로 관리'
  source: https://developer.android.com/ai/gemini/live
- category: ai
  title: TPU Developer Hub — AI 가속기는 코드 레시피와 관측 도구까지 같이 배워야 한다
  summary: 'Google은 2026년 6월 16일 TPU Developer Hub를 공식 출시했다. 이 허브는 Cloud TPU를 단순한 하드웨어 소개가 아니라, 사전학습·후학습·추론까지 이어지는 AI 개발 생애주기 자료로 묶는다. 범위는 TPU 하드웨어와 인프라 선택, XLA와 컴파일러 스택, PyTorch의 TPU 이전, XProf 기반 tracing/debugging, 멀티칩 병렬화, Pallas 커널 최적화, KV cache offloading, 네트워킹과 보안까지 포함한다. 개발자에게 중요한 점은 "더 빠른 칩을 쓰자"가 아니라, 모델 코드·컴파일러·프로파일러·네트워크를 한 루프로 보고 병목을 추적해야 TPU 성능이 실제 제품 추론과 학습 처리량으로 이어진다는 것이다.

    '
  points:
  - '공식 출시: 2026-06-16, Cloud TPU용 중앙 교육/레시피 허브'
  - '범위: pre-training, post-training, inference, XLA, PyTorch, XProf, Pallas, KV cache offloading'
  - 자료는 code-first와 agent-ingestion friendly를 지향해 AI 보조 개발 도구가 읽기 쉽게 설계
  source: https://developers.googleblog.com/unlocking-the-power-of-the-tpu-stack-introducing-our-new-developer-hub/
- category: ai
  title: Colab MCP Server — 에이전트에게 클라우드 노트북을 실행 도구로 붙이기
  summary: 'Google은 2026년 3월 Colab MCP Server를 공개해, Gemini CLI·Claude Code 같은 MCP 호환 에이전트가 로컬 터미널에서 Google Colab 노트북을 직접 제어하게 했다. 핵심은 "코드 조각을 복사해 Colab에 붙여넣기"가 아니라, 에이전트가 .ipynb 셀을 만들고, 마크다운 설명을 넣고, Python 코드를 실행하고, 의존성을 설치하며, 결과 노트북을 클라우드 실행 산출물로 남기는 흐름이다. 로컬 머신에서 무거운 GPU/데이터 작업을 돌리거나 자율 에이전트에게 직접 하드웨어 접근을 주기 부담스러울 때, Colab을 MCP 도구화된 샌드박스로 쓰는 패턴이다. 공개 GitHub 저장소는 Apache-2.0이고, 같은 런에서 691★를 확인했다.

    '
  points:
  - '공식 발표: 2026-03-17, Colab을 MCP 호환 에이전트의 클라우드 작업공간으로 연결'
  - '기능: 셀 생성·정렬, 코드 실행, 의존성 설치, 재현 가능한 노트북 산출물 생성'
  - '실무 포인트: 로컬 에이전트와 GPU/노트북 환경을 복사-붙여넣기 없이 분리'
  source: https://developers.googleblog.com/announcing-the-colab-mcp-server-connect-any-ai-agent-to-google-colab/
- category: ai
  title: Qubot — 데이터 분석 에이전트는 쿼리보다 컨텍스트 계층이 먼저다
  summary: 'GitHub은 2026년 6월 19일 내부 Copilot 기반 데이터 분석 에이전트 Qubot의 설계를 공개했다. Qubot은 Slack, VS Code, Copilot CLI에서 자연어 질문을 받아 GitHub 데이터 웨어하우스의 Kusto와 Trino 쿼리로 답한다. 핵심 구조는 UI, 컨텍스트 계층, 쿼리 엔진 세 부분이다. 컨텍스트 계층은 bronze 원시 이벤트, silver 공통 fact/dimension, gold 비즈니스 지표 정의를 나눠 문서·예시 쿼리·필수 필터·메타데이터를 런타임에 MCP 서버로 공급한다. 실무 교훈은 모델에게 SQL을 잘 쓰라고만 시키는 것이 아니라, 데이터 모델의 grain, 필터, 지표 정의, 평가 케이스를 버전 관리되는 컨텍스트로 만들어야 분석 에이전트가 빨라지고 회귀를 막을 수 있다는 점이다.

    '
  points:
  - '구조: Slack/VS Code/Copilot CLI UI + federated context layer + Kusto/Trino query engine'
  - 컨텍스트는 MCP 서버로 런타임 주입, 팀별 문서와 지표 정의를 표준 형식으로 정규화
  - '변경 전 offline eval: 정답 SQL·메타데이터가 있는 테스트 케이스로 정확도·지연·회귀를 비교'
  source: https://github.blog/ai-and-ml/github-copilot/how-we-built-an-internal-data-analytics-agent/
- category: ai
  title: Deployment Simulation — 에이전트 모델 출시 전에 실제 분포를 재생하기
  summary: 'OpenAI의 Deployment Simulation은 새 모델을 배포하기 전에 과거 대화에서 기존 assistant 답변을 제거하고, 후보 모델이 같은 맥락에 어떻게 답하는지 재생해 위험을 추정하는 방법이다. 전통적인 eval은 어렵고 위험한 케이스를 잘 찌르지만, 실제 배포 분포에서 어떤 실패가 얼마나 자주 나올지는 놓칠 수 있다. OpenAI는 GPT-5 계열 Thinking 배포 연구에서 약 130만 개 비식별 대화를 분석했고, 이 방법을 도구 사용이 포함된 agentic coding 설정에도 적용할 수 있다고 설명했다. 실무 교훈은 코딩 에이전트 평가도 문제집 점수만 볼 것이 아니라, 실제 작업 로그와 도구 환경을 재현해 배포 전 행동 빈도를 예측해야 한다는 점이다.

    '
  points:
  - '방법: 과거 대화 prefix를 후보 모델로 재생해 배포 전 행동을 추정'
  - '장점: synthetic eval보다 실제 사용 분포의 비꼬리 위험을 보기 좋음'
  - '에이전트 적용: tool simulation이 있으면 agentic coding rollout 위험 평가에도 확장 가능'
  source: https://openai.com/index/deployment-simulation/
