  title: Qwen3-Embedding — MTEB 70.6으로 OpenAI·Google을 넘은 오픈소스 임베딩 모델 1위(Apache-2.0·Alibaba)
  summary: 'Qwen3-Embedding-8B는 2026년 6월 기준 MTEB 벤치마크 70.6점으로 오픈소스 임베딩 모델 중 1위다. OpenAI text-embedding-3-large(64.6)과 Google Gemini Embedding(68.3)을 모두 추월. 차원 수를 32~4096으로 자유롭게 설정 가능하고, 40K 토큰 컨텍스트·다국어 지원. Ollama에서 qwen3-embedding:8b(4.7GB)·4b(2.5GB)·0.6b(639MB) 3가지 사이즈로 로컬 실행 가능. 정확도가 최우선이면 Qwen3, 범용 하이브리드라면 BGE-M3.

    '
