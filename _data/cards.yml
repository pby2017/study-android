    url: https://api.github.com/repos/zed-industries/zed
  interview: 'Zed에서 ACP 외부 에이전트를 실행할 때 Zed와 에이전트 제공자 중 누가 모델 과금·인증·데이터 처리를 담당하는지 왜 확인해야 하나요?'
  answer: 'Zed는 외부 에이전트 스레드를 표시하지만, 보통 에이전트가 자체 프로세스·인증·모델·도구 설정을 소유한다. Zed는 외부 에이전트 사용료를 청구하지 않으므로 실제 요금, 약관, 데이터 보존과 권한은 해당 제공자 기준으로 확인해야 한다.'
- category: ai
  title: 'OpenSkills — 여러 코딩 에이전트에서 SKILL.md 절차를 재사용하기'
  level: "중급"
  summary: 'OpenSkills는 `SKILL.md` 폴더를 설치하고, `sync`로 `AGENTS.md`에 사용 가능한 스킬 목록과 호출 방법을 기록하는 오픈소스 CLI다. 에이전트가 그 지침을 읽고 셸 명령을 실행할 수 있으면 `npx openskills read <이름>`으로 선택한 스킬 본문을 불러온다. 따라서 스킬 포맷은 공유해도 에이전트마다 네이티브 스킬 등록·호출 방식이 똑같아지는 것은 아니다. 기본 설치는 프로젝트의 `.claude/skills/`, `--universal`은 `.agent/skills/`를 사용한다. GitHub 저장소는 2026-11-22 조회 시 10,830 stars였지만, 최신 릴리스는 v1.5.0(2026-01-17)이다. 별 수는 관심도이지 유지보수나 품질 보증이 아니다. 프로젝트에 설치하기 전 스킬의 지침과 스크립트 출처를 검토한다. OpenSkills는 Anthropic 공식 제품이 아니다.'
  points:
  - '설치 흐름: `npx openskills install <저장소>` → `npx openskills sync` → 선택 시 `npx openskills read <스킬명>`. `<available_skills>` 목록은 에이전트가 실행할 절차를 안내한다.'
  - '범용성 조건: 에이전트가 `AGENTS.md` 지침을 읽고 해당 CLI를 실행할 수 있어야 한다. 이는 Codex나 다른 도구의 네이티브 스킬 설치·권한 체계를 대체하지 않는다.'
  - '이 도구는 스킬의 코드를 검증하거나 권한을 부여하지 않는다. 신뢰할 저장소만 설치하고 지침·포함 스크립트를 확인한 뒤, 실행 권한은 호스트 도구에서 관리한다.'
  source: https://github.com/numman-ali/openskills
  sources:
