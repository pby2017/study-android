  title: 벡터 DB 선택 2026 — Qdrant(성능)·Weaviate(하이브리드)·Pinecone(매니지드)·pgvector(50M 이하 기본)
  summary: '2026년 벡터 DB는 용도별 선택이 핵심이다. pgvector(PostgreSQL 확장): 50M 벡터 이하에서 별도 DB 없이 가장 효율적. Pinecone: 제로 운영 매니지드, SOC2/HIPAA, 빠른 시작. Qdrant(Rust): 셀프호스트 성능 1위, p99 6~15ms, 고급 페이로드 필터링. Weaviate: 네이티브 BM25+벡터 하이브리드 검색 최강. Milvus/Zilliz: 10B+ 벡터 대규모 분산 배포. Chroma: 로컬 프로토타이핑. 대부분 프로덕션 RAG에서 매니지드 벡터 DB + 리랭커(Cohere/Voyage) 조합.

    '
