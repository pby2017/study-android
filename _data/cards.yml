  title: nit — 프로젝트 스택을 자동 감지해 unit~E2E 테스트를 생성하는 로컬 AI 품질 에이전트(MIT·~3.5k★)
  summary: 'nit은 프로젝트에 떨어뜨리면 언어·프레임워크·테스트 인프라를 자동 감지하고, 커버리지 갭을 찾아 Vitest· pytest·Jest·Playwright 등 네이티브 프레임워크 테스트를 생성하는 로컬 AI 에이전트다. 생성된 테스트를 실행해 실패하면 최대 3회 자동 수정하고, 기존 테스트 패턴을 학습해 프로젝트 스타일에 맞춘다. 모노레포(Turborepo·Nx·Cargo 등)도 지원하며, Python·TS·Go·Rust·Java·C++ 등 주요 언어를 커버한다. SaaS 의존 없이 로컬에서 돌아가는 점이 차별점이다.

    '
