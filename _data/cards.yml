  title: LlamaIndex — RAG 데이터 프레임워크의 골드 스탠다드, 160+ 커넥터·하이브리드 검색·LlamaParse(Apache-2.0)
  summary: 'LlamaIndex는 2026년 RAG 프레임워크의 사실상 표준이다. 160+ 데이터 커넥터(LlamaHub)로 PDF·DB·API· 비정형 텍스트를 인덱싱. Sentence Window·하이브리드 검색·계층적 검색·Auto-Merging 등 고급 검색 전략 내장. LlamaParse는 복잡한 테이블·이미지·레이아웃 포함 문서를 기존 텍스트 파싱 대비 10x 정확도로 처리. LangChain(에이전트 오케스트레이션) 대비 검색 깊이가 차별점. 많은 팀이 LlamaIndex(검색) + LangChain(오케스트레이션) 조합 사용.

    '
  points:
  - '160+ 커넥터: PDF·DB·API·비정형 텍스트 인덱싱'
  - '고급 검색: Sentence Window·하이브리드·계층적·Auto-Merging'
  - 'LlamaParse: 복잡 문서 10x 정확도 파싱'
  source: https://toolhalla.ai/blog/langchain-vs-llamaindex-vs-haystack-2026
- category: ai
  title: LangGraph 1.0 — durable agent runtime GA, checkpointing·HITL·LangChain 상호운용
  summary: LangGraph 1.0(2025-10 GA)은 production-ready durable agent framework 첫 stable major — 1년+ Uber·LinkedIn·Klarna·Replit adoption 후 semver 보장. 방향 그래프(상태 머신)로 분기·루프·human-in-the-loop·streaming·persistence를 low-level 제어. Postgres checkpointing으로 crash·multi-day resume. langgraph.prebuilt deprecated→langchain.agents로 이동 — LangChain 1.0 create_agent(high-level)와 LangGraph(custom graph) composable, lock-in 없이 drop-down. Deep Agents·LangSmith Deployment·Temporal integration과 3층 — LangGraph=OSS runtime, LangChain=agent loop abstraction, LangSmith=obs+deploy+Engine.
  points:
  - v1.0 GA 2025-10 — first stable durable agent framework semver
  - langgraph.prebuilt→langchain.agents — high-level/low-level composable stack
  - Postgres checkpoint ·HITL ·Klarna/Uber/LinkedIn production
  source: https://www.langchain.com/blog/langchain-langgraph-1dot0
- category: ai
  title: Mobile-O — 온디바이스 통합 멀티모달(VLM+확산 생성), iPhone에서 이미지 생성 3초·VQA 0.4초(1.6B)
  summary: 'Mobile-O는 온디바이스용 통합 비전-언어-확산 모델이다. FastVLM(FastViT+Qwen2-0.5B) 기반 멀티모달 이해(VQA·OCR·추론)와 SANA(600M DiT) 기반 512×512 이미지 생성을 단일 아키텍처로 통합. iPhone 15 Pro에서 이미지 생성 ~3초, 시각 이해 ~0.4초. 메모리 2GB 미만. MLP 커넥터(~2.4M)가 VLM과 확산 디코더를 경량 연결. MLX+CoreML 최적화. 클라우드 의존 없이 완전 온디바이스 실행.

    '
  points:
  - '통합: VLM(이해) + 확산(생성), 단일 아키텍처'
  - 'iPhone 실시간: 이미지 생성 3초, VQA 0.4초'
  - '경량: 1.6B 파라미터, 메모리 2GB 미만'
  source: https://github.com/Amshaker/Mobile-O
- category: ai
  title: DeepEval — LLM용 Pytest, CI/CD에서 품질 게이트로 50+ 메트릭·Ragas와 상호보완(Apache-2.0)
  summary: 'DeepEval은 Confident AI가 만든 오픈소스 LLM 평가 프레임워크로 ''LLM용 Pytest''를 표방한다. Pytest 네이티브 통합으로 LLM 테스트를 유닛 테스트처럼 작성하고 CI/CD 파이프라인에서 빌드 실패 트리거. 50+ 메트릭: RAG(faithfulness·context precision·recall), 에이전트(tool selection·planning quality), safety(hallucination·bias·toxicity). G-Eval로 커스텀 메트릭 생성. Ragas(RAG 학술 메트릭 특화)와 상호보완: DeepEval=CI 게이트, Ragas=프로덕션 모니터링.

    '
  points:
  - 'Pytest 네이티브: LLM 테스트를 유닛 테스트처럼 CI/CD'
  - '50+ 메트릭: RAG·에이전트·safety·hallucination'
  - 'Ragas 상호보완: DeepEval=CI, Ragas=프로덕션 모니터링'
  source: https://genai.qa/blog/deepeval-vs-ragas/
- category: ai
  title: FLUX.2 — Black Forest Labs 오픈소스 이미지 생성, Klein 4B(Apache-2.0)는 8GB GPU에서 실시간(ComfyUI)
  summary: 'FLUX.2는 Black Forest Labs가 만든 최신 오픈소스 이미지 생성 모델 패밀리다. Klein 4B(Apache-2.0)는 ~8GB VRAM의 소비자 GPU(RTX 4070/3090)에서 서브초 생성 가능. Klein 9B(16GB)와 Dev 32B(고품질· 비상업)도 제공. 텍스트→이미지+이미지 편집(단일/다중 참조)을 단일 모델로 통합. ComfyUI가 표준 인터페이스. Stable Diffusion 3.5(LoRA/ControlNet 생태계 최대) 대비 포토리얼리즘·텍스트 렌더링 우수.

    '
  points:
  - 'Klein 4B: Apache-2.0, 8GB GPU에서 서브초 생성'
  - '통합: 텍스트→이미지 + 이미지 편집, 단일 모델'
  - 'ComfyUI 표준: 노드 기반 워크플로우, 커스터마이징'
  source: https://github.com/black-forest-labs/flux2
