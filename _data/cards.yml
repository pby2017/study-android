  - '50KB 런타임: MCU부터 스마트폰까지 배포'
  - '12+ HW 백엔드: CoreML·QNN·MediaTek·XNNPACK'
  - 'Meta 스케일: Instagram·WhatsApp·Messenger 프로덕션'
