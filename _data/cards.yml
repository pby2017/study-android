  - 'Quail 2는 worktree 미지원이라고 명시; 이후 버전의 지원 여부는 해당 버전 문서에서 재확인'
  - '파일 격리를 확인하지 못했다면 같은 파일 수정은 피하고 각 변경 diff를 검토·테스트'
  source: https://developer.android.com/blog/posts/android-studio-quail-2-is-stable-multi-task-with-the-android-studio-ai-agent
  interview: "Android Studio Agent Mode에서 병렬 대화를 열면 작업 디렉터리도 자동으로 격리되나요?"
  answer: "병렬 대화는 작업 맥락과 진행 상태를 나누지만, 이것만으로 별도 worktree나 파일 격리가 보장되지는 않는다. Google은 Quail 2에서 worktree 미지원과 같은 파일 동시 수정의 충돌 위험을 명시했다. Quail 4 자료는 상태·변경 요약 UI 개선을 설명하지만 worktree 여부는 밝히지 않으므로, 사용 중인 버전 문서나 실제 동작으로 확인한다. 확인 전에는 파일이 겹치는 작업을 순차로 수행하고 diff와 테스트를 검토한다."
- category: ai
  level: "고급"
  title: Android XR + Gemini — 위치 정확도는 신뢰도 반경, JSON은 형식만 보장
  summary: 'ARCore for Jetpack XR Geospatial API는 XR 기기 위치에서 GPS·센서와 VPS를 결합하며, 현재 문서는 Preview로 안내한다. `horizontalAccuracy`와 `orientationYawAccuracy`는 각각 수평 위치의 미터 반경과 yaw의 도 단위 오차 추정치이며, 68% 신뢰 수준으로 해석한다. 예시 투어는 기준에 도달할 때까지 기다린 뒤 좌표를 Firebase AI Logic의 Gemini 요청과 Google Maps grounding에 전달하고 JSON schema로 응답 구조를 제한한다. schema는 장소의 실재나 도보 경로의 안전을 증명하지 않는다. 추적이 RUNNING인지 확인하고, 부정확·미지원 지역에서는 재시도 또는 기능 중단을 제공하며, 정밀 위치를 전송하기 전 데이터 사용 동의를 받아야 한다.'
  points:
  - '`horizontalAccuracy`(m)·`orientationYawAccuracy`(°): 68% 신뢰 반경/오차 추정치; 값이 낮을수록 정확'
  - 'Geospatial API 조회는 추적 상태 `RUNNING`에서만; tracking/VPS 미준비면 사용자 안내·재시도'
  - 'Maps grounding은 장소 근거 보강, JSON schema는 응답 형태 제한 — 실제성·경로 안전 검증은 별도'
  source: https://developer.android.com/develop/xr/jetpack-xr-sdk/arcore/geospatial/setup
  interview: "위치 기반 XR 투어에서 정확도 값과 JSON schema를 어떻게 해석하고, 어떤 실패 경로를 설계해야 하나요?"
  answer: "두 정확도 값은 68% 신뢰 수준의 위치 반경과 방향 오차 추정치이며 낮을수록 좋다. 제품 요구에 맞는 임계값을 정하고 API가 RUNNING일 때만 좌표를 사용한다. VPS 미지원·추적 미준비·정확도 부족 시 재시도나 기능 중단을 제공한다. Maps grounding은 장소 근거를 보강하고 schema는 응답 모양만 제한하므로 장소·경로를 별도 확인해야 한다. 좌표를 클라우드 모델에 보낼 때 데이터 사용 동의를 받아야 한다."
