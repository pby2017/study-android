  - category: ai
    title: "Firebase AI Logic Hybrid API — Android AI 추론을 온디바이스·클라우드로 라우팅"
    summary: >
      Firebase AI Logic Hybrid API는 Android 앱에서 Gemini API 호출을 온디바이스와 클라우드 사이에 나누는
      단일 인터페이스다. onDeviceConfig의 inference mode로 PREFER_ON_DEVICE, PREFER_IN_CLOUD,
      ONLY_ON_DEVICE, ONLY_IN_CLOUD를 고를 수 있고, Gemini Nano 같은 온디바이스 모델이 없거나 요청을
      지원하지 않을 때 클라우드 fallback을 설계할 수 있다. 공식 문서는 이 기능을 experimental로 표시하므로
      SLA나 호환성 보장을 전제하면 안 된다. 실무 포인트는 '항상 로컬'이 아니라 개인정보·오프라인·비용이 중요한
      요청은 로컬 우선, 고성능·범용성이 필요한 요청은 클라우드 우선으로 정책을 명시하는 것이다.
    points:
      - "onDeviceConfig로 PREFER/ONLY 온디바이스·클라우드 모드 선택"
      - "온디바이스 모델 미지원 시 클라우드 fallback으로 도달 범위 확대"
