  title: Claude Projects + Artifacts — 지속 워크스페이스와 인터랙티브 출력 패널
  summary: 'Claude Projects는 관련 대화·커스텀 지침·참조 문서를 한 공간에 모아 세션 간 컨텍스트를 유지하는 워크스페이스다. Pro/Team 무제한, Free 5개. 200K 컨텍스트(Enterprise 500K), RAG 방식으로 관련 섹션만 주입, Project-scoped memory로 채팅 간 학습 유지. Claude Artifacts는 HTML·React·SVG·Mermaid 등 독립 콘텐츠를 대화 옆 패널에 렌더링 — 2026년 Live Artifacts(MCP로 Google Sheets·Linear 실시간 연동), Pro+ 20MB persistent storage, 공개 링크 공유. 역할 분리: Projects=지속 컨텍스트 방, Artifacts=작업 결과물, Skills=반복 절차.'
