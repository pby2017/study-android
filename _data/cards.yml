cards:
  # ===================== KOTLIN =====================
  - category: kotlin
    title: 코틀린이란 — 정적 타입 + 함수형
    summary: >
      코틀린은 JVM에서 도는 언어로, 자바와의 상호운용성을 중시한다. 핵심은 '정적 타입 지정'이라 컴파일
      시점에 타입이 확정돼 성능·신뢰성·유지보수·도구지원이 좋아진다. 동시에 타입 추론을 제공해 코드는
      짧게 유지된다. 함수를 변수처럼 다루는 일급 함수, 불변성, 부수효과 없는 순수 함수 같은 함수형
      개념도 지원한다. 자바엔 없는 nullable 타입과 함수 타입이 컴파일 단계에서 NPE 위험을 잡아준다.
    points:
      - "정적 타입 + 타입 추론 = 안전하면서 간결"
      - "nullable 타입(?)으로 NPE를 컴파일 시점에 차단"
      - "일급 함수·불변성·순수 함수 = 함수형 지원"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/1장-코틀린이란_무엇이며_왜_필요한가.md"

  - category: kotlin
    title: 문(statement)과 식(expression)
    summary: >
      자바는 if/제어구조가 값을 만들지 않는 '문'이지만, 코틀린은 루프를 뺀 대부분의 제어구조가 값을
      만드는 '식'이다. 그래서 `return if(cond) A else B`가 가능하다. 함수도 두 종류 — 중괄호로 감싼
      '블록 본문 함수'와 등호로 잇는 '식 본문 함수'. 식 본문 함수는 타입 추론 덕에 반환형을 생략할 수
      있다(블록 본문은 불가). 이 차이가 코틀린 특유의 간결함의 출발점이다.
    points:
      - "코틀린의 if/when은 값을 반환하는 '식'"
      - "식 본문 함수 `fun f() = 1` 은 반환형 생략 가능"
      - "변수도 타입 추론으로 생략 가능"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/2장-코틀린_기초.md"

  - category: kotlin
    title: 컬렉션 생성 함수 — setOf/hashSetOf/arrayListOf
    summary: >
      코틀린은 컬렉션을 만드는 팩토리 함수를 제공한다. setOf·hashSetOf는 내부적으로 LinkedHashSet,
      arrayListOf는 ArrayList를 돌려준다. 코틀린은 자체 컬렉션을 새로 만들지 않고 자바 표준
      컬렉션을 그대로 활용하면서, 정렬·필터 같은 유용한 확장 함수를 얹는 방식이다. `.plus()` 같은
      연산은 원본을 바꾸지 않고 새 컬렉션을 반환한다(불변성 지향).
    points:
      - "코틀린 컬렉션 = 자바 컬렉션 + 확장 함수"
      - ".plus()는 원본 불변, 새 컬렉션 반환"
      - "제네릭 원소 모임 + 알고리즘 메서드 제공"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/3장-함수_정의와_호출.md"

  - category: kotlin
    title: 클래스·인터페이스 — 자바와 무엇이 다른가
    summary: >
      코틀린 인터페이스는 자바 8의 default 메서드처럼 구현이 있는 메서드를 가질 수 있지만, 상태(필드)는
      가질 수 없다. 자바의 extends/implements는 모두 콜론(:)으로 대체되고, 확장 클래스 뒤엔 괄호()를
      붙인다. 인터페이스 구현은 개수 제한이 없지만 클래스 확장은 1번만 가능하다. 자바의 @Override는
      코틀린에서 `override` 변경자가 된다. 본문 없는 멤버는 추상, default는 키워드 없이 본문만 주면 된다.
    points:
      - "인터페이스에 구현은 OK, 상태(필드)는 불가"
      - "extends/implements → 콜론(:) 하나로 통일"
      - "@Override → override 변경자"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/4장-클래스,_객체,_인터페이스.md"

  - category: kotlin
    title: 람다 — 코드 블록을 인자로 넘기기
    summary: >
      람다는 다른 함수에 넘길 수 있는 작은 코드 조각이다. 자바 8처럼 코드 블록을 함수 인자로 직접
      전달할 수 있어, 안드로이드의 setOnClickListener 같은 '메서드 하나뿐인 익명 객체'를 람다로
      대체해 코드를 확 줄인다. 컬렉션에선 maxBy처럼 기준을 람다로 받는 라이브러리 함수가 있어
      `list.maxBy { it.age }` 식으로 짧게 쓴다. 멤버 참조(Person::age)로 더 줄일 수도 있다.
    points:
      - "익명 객체 → 람다로 보일러플레이트 제거"
      - "list.maxBy { it.age } 처럼 기준을 람다로"
      - "멤버 참조(::)로 한 번 더 축약"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/5장-람다로_프로그래밍.md"

  - category: kotlin
    title: "널 가능성 — ?. 와 ?: 로 NPE 방어"
    summary: >
      코틀린 타입 시스템은 널 가능 여부를 타입에 담아 NPE를 컴파일 시점에 잡는다. 타입 뒤에 ?를 붙이면
      null을 담을 수 있는 타입이 된다. 안전한 호출 `?.`는 null 검사와 호출을 한 번에 — `a?.length`는
      a가 null이면 그대로 null을 반환한다(결과 타입도 nullable). 엘비스 연산자 `?:`는 null일 때
      기본값을 지정한다. 이 조합이 코틀린이 자바보다 NPE에 강한 핵심 이유다.
    points:
      - "타입 뒤 ? = 널 가능 타입"
      - "?. = null이면 호출 건너뛰고 null 반환"
      - "?: = null일 때 기본값 제공(엘비스)"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/6장-코틀린_타입_시스템.md"

  # ===================== ANDROID =====================
  - category: android
    title: 액티비티 생명주기
    summary: >
      액티비티는 보통 한 화면을 대표하며 AppCompatActivity를 상속한다. 생명주기 콜백은 쌍으로
      관리한다 — onCreate↔onDestroy, onStart↔onStop. onCreate(초기화·뷰 생성), onStart(아직
      비표시, 센서·통신 시작), onResume(표시·화면 갱신), onPause(포커스 상실·리소스 해제·저장),
      onStop(통신 정지), onDestroy(참조 정리). 다른 클래스가 액티비티 인스턴스를 참조하면 폐기 후에도
      메모리에 남아 누수가 생긴다.
    points:
      - "콜백은 쌍으로 — onCreate↔onDestroy, onStart↔onStop"
      - "onPause에서 저장·리소스 해제"
      - "외부 참조가 남으면 메모리 누수"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_02(액티비티와프래그먼트).md"

  - category: android
    title: 화면 회전과 상태 복원 — onSaveInstanceState
    summary: >
      화면 가로/세로 전환 같은 디바이스 설정 변경이 일어나면 기존 액티비티는 폐기되고 새로 생성된다.
      그래서 입력값 등이 사라진다. onSaveInstanceState/onRestoreInstanceState 콜백으로 데이터를
      저장·복구할 수 있다. 저장 가능한 자료형은 기본형·문자열·리스트, 그리고 Parcelable을 구현한
      인스턴스다. 시스템 임시 영역에 IPC로 주고받기 때문에 전달 규약이 필요하고, 그게 Parcelable
      인터페이스다. 단, 뒤로가기로 명시적으로 폐기하면 호출되지 않는다.
    points:
      - "설정 변경 = 액티비티 재생성 → 상태 유실"
      - "onSaveInstanceState로 저장, Parcelable로 전달"
      - "뒤로가기 폐기 시엔 호출 안 됨"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_02(액티비티와프래그먼트).md"

  - category: android
    title: 레이아웃 선택 — Linear vs Constraint
    summary: >
      LinearLayout은 depth가 얕고 순차적으로 뷰를 나열할 때, 단순한 화면에 적합하다. 복잡한 화면엔
      RelativeLayout/ConstraintLayout을 쓴다. 사진 주변에 여러 뷰를 배치하는 상황은 예전엔
      RelativeLayout이었지만 요즘은 ConstraintLayout이 표준 — 깊어지기 쉬운 계층을 1단계로
      평탄화하는 게 장점이다. 속도도 다르다: LinearLayout은 사이즈를 2번 측정해 상대적으로 느리고,
      ConstraintLayout은 최적화로 1번만 측정해 더 빠르다.
    points:
      - "단순·순차 = Linear, 복잡 = Constraint"
      - "Constraint는 계층을 평탄화(depth↓)"
      - "측정 횟수: Linear 2회 vs Constraint 1회"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/QnA/android/layout.md"

  - category: android
    title: 머티리얼 디자인 — 일관된 시각 언어
    summary: >
      스큐어모픽(실물 모사)→플랫(평면)을 거쳐, 구글은 '프로젝트 케네디'로 디자인을 통일했고 그 위에
      학습 부담을 줄인 머티리얼 디자인을 내놨다. 핵심은 시각 디자인의 공통 언어와 '이디엄'(단순 조작을
      조합해 의미 있는 조작을 만드는 관용구)으로 사용자가 UI 동작을 예측하게 하는 것. 대표 컴포넌트는
      리스트/그리드/카드, 그리고 FAB·Raised·Flat 버튼. 카드엔 정보를 의미 단위로 묶는 '청킹'을 적용한다.
    points:
      - "케네디 → 머티리얼: 일관성 + 학습부담↓"
      - "이디엄으로 동작을 예측 가능하게"
      - "카드·리스트·FAB가 대표 컴포넌트"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_11(머티리얼디자인).md"

  # ===================== ARCHITECTURE =====================
  - category: architecture
    title: 왜 설계 기법을 쓰나 — 액티비티 비대화 방지
    summary: >
      액티비티는 화면 로직, 사용자 액션 처리, 뷰 데이터 반영 등 너무 많은 역할을 떠안는다. 전부
      액티비티에 넣으면 변경이 어렵고 관리가 힘들다. 그래서 역할을 분리해 변경에 강한 코드를 만드는
      게 설계 기법의 목적이다. 대표적으로 MVP(Model-View-Presenter)와 MVVM(Model-View-ViewModel)이
      있다. 둘 다 '뷰는 표시, 비즈니스/데이터는 분리'라는 원칙을 공유한다.
    points:
      - "문제: 액티비티가 모든 역할을 떠안음"
      - "해결: 역할 분리로 변경에 강하게"
      - "대표 패턴: MVP, MVVM"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_05(설계기법과라이브러리활용).md"

  - category: architecture
    title: MVP 패턴 — 장점과 함정
    summary: >
      MVP는 Model(DB·API 접근, UI 로직 없음), View(데이터 표시, 액션은 Presenter에 위임),
      Presenter(Model·View 중개, 이벤트 처리)로 나눈다. Presenter가 인터페이스로만 접근하게 하면
      테스트가 쉬워진다. 장점은 역할 분리로 액티비티가 작아지고 View-Model 의존이 사라지는 것.
      단점은 인터페이스 정의로 코드가 길어지고, 데이터를 뷰에 꽂는 로직을 직접 짜야 하며, 표준
      프레임워크가 없어 분리 방식을 매번 고민해야 한다는 점이다.
    points:
      - "Model/View/Presenter로 역할 3분할"
      - "인터페이스 접근 → 테스트 용이"
      - "단점: 코드량↑, 표준 프레임워크 부재"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_05(설계기법과라이브러리활용).md"

  - category: architecture
    title: 그레이들(Gradle)의 이해
    summary: >
      Gradle은 안드로이드의 빌드 시스템으로, 어떤 라이브러리를 쓰고 어떻게 컴파일·패키징할지를
      선언한다. 프로젝트 수준과 모듈(app) 수준 build.gradle로 나뉘며, dependencies 블록에 의존성을
      적으면 자동으로 받아온다. minSdk/targetSdk로 지원 범위를 정하고, productFlavor로 같은 코드에서
      여러 빌드 변형(무료/유료 등)을 만든다. 이 학습 레포의 ProductFlavorApp 예제가 그 실습이다.
    points:
      - "프로젝트/모듈 build.gradle 2단계"
      - "dependencies로 라이브러리 선언·자동 수신"
      - "productFlavor로 빌드 변형 생성"
    source: "https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_06(그레이들의이해).md"

  # ===================== AI 코딩 도구 (이 세션에서 팩트체크한 week7 조사 기반) =====================
  - category: ai
    title: diagnose — 디버깅을 규율로 만드는 스킬
    summary: >
      mattpocock/skills의 diagnose는 어려운 버그를 6단계로 푼다 — 재현 가능한 피드백 루프 만들기 →
      재현 → 가설 3~5개 → 계측 → 수정+회귀 테스트 → 정리·포스트모템. 핵심 통찰은 "피드백 루프 자체가
      스킬"이라는 것: 빠르고 결정적인 pass/fail 신호만 있으면 이분법·가설검증·계측이 전부 그 신호를
      소비할 뿐이다. SKILL.md는 "루프를 만들기 전엔 Phase 2로 넘어가지 말라"고 못박는다.
    points:
      - "6단계: 루프→재현→가설→계측→수정→정리"
      - "'피드백 루프가 곧 스킬' — 90%는 루프에서 끝"
      - "루프 없이 가설 단계로 진행 금지(SKILL.md 명시)"
    source: "https://github.com/mattpocock/skills"

  - category: ai
    title: Spec Kit — 명세 주도 개발(SDD)
    summary: >
      GitHub의 specify-cli는 코드 전에 명세를 먼저 쓰게 한다: specify→plan→tasks→implement 4단계.
      `specify init <name> --integration claude`로 설치하면 /speckit-specify 같은 스킬이 생긴다(명령어가
      아니라 스킬로 설치됨, 하이픈 표기). 각 단계 프롬프트는 $ARGUMENTS로 사용자 입력을 받아 구조화된
      산출물을 만든다. "AI가 추측해서 짜기 전에 명세로 합의한다"는 게 핵심 가치다.
    points:
      - "specify → plan → tasks → implement"
      - "설치: --integration claude (스킬로 설치, /speckit-specify)"
      - "$ARGUMENTS로 단계별 입력 구조화"
    source: "https://github.com/github/spec-kit"

  - category: ai
    title: Karpathy의 65줄 CLAUDE.md
    summary: >
      안드레 카파시가 공유한 짧은 CLAUDE.md가 깃헙 스타 다수를 받으며 화제가 됐다. 핵심은 4규칙 —
      ① Think Before Coding(추측 말고 먼저 이해), ② Simplicity First(문제를 푸는 최소 코드),
      ③ Surgical Changes(꼭 필요한 곳만 건드림), ④ Goal-Driven Execution(성공 기준을 정하고 검증될
      때까지 반복). 규칙 ④는 diagnose의 '피드백 루프' 원리와 같다 — 검증 가능한 목표가 곧 자동화의
      엔진이다. 도구가 아니라 '지시 방식'이 결과를 바꾼다는 사례.
    points:
      - "4규칙: 이해먼저·단순함·수술적변경·목표주도"
      - "규칙④ = diagnose의 검증 루프와 동일 원리"
      - "도구가 아니라 '룰 한 장'이 결과를 바꾼다"
    source: "https://github.com/AndrejKarpathy"

  - category: ai
    title: Ouroboros — 모호함을 수치로
    summary: >
      Ouroboros(Q00 제작, 한국어 README 있음)는 요청의 모호함을 정량화한다. 명확도를 1 − Σ(clarity×weight)
      로 계산해 임계값(0.2)을 넘으면 "더 물어봐야 한다"고 판단한다. AI가 모호한 요청에 멋대로 추측하는
      대신, 불명확함을 숫자로 드러내 사용자에게 되묻게 만드는 장치다. diagnose·Spec Kit·Karpathy 규칙과
      한 줄로 꿰면 — 모두 "AI가 추측하지 않게 만드는" 같은 철학의 다른 구현이다.
    points:
      - "모호도 = 1 − Σ(clarity×weight), 임계값 0.2"
      - "추측 대신 '되묻기'를 트리거"
      - "diagnose/SpecKit/Karpathy와 같은 철학"
    source: "https://github.com/Q00/ouroboros/blob/main/README.ko.md"

  - category: ai
    title: "서브에이전트 — 컨텍스트를 지키는 분업"
    summary: >
      Claude Code의 서브에이전트는 자기만의 컨텍스트 창·시스템 프롬프트·도구 접근·권한을 가진 별도
      인스턴스다. 검색·로그·파일 읽기처럼 본 대화를 어지럽힐 곁가지 작업을 서브에이전트에 맡기면, 그
      과정의 잡음은 서브에이전트 안에 갇히고 메인 대화에는 '요약 결과'만 돌아온다. 즉 똑똑하게
      만드는 게 아니라 '이미 쌓인 컨텍스트의 품질을 보존'하는 장치다. Read·Grep만 주는 식으로 도구를
      좁히면 의도치 않은 수정도 막는다.
    points:
      - "정의: .claude/agents/(프로젝트) 또는 ~/.claude/agents/(전체)에 YAML 프런트매터 .md"
      - "필드: name·description·tools(생략 시 전부 상속)·model / 본문=시스템 프롬프트"
      - "호출: 자연어 언급, @멘션(해당 작업 보장), --agent(세션 전체) / 파일 직접 편집 후엔 재시작"
    source: "https://code.claude.com/docs/en/sub-agents"

  - category: ai
    title: "Claude Code GitHub Action — PR에 부르면 자동 수정·리뷰"
    summary: >
      Claude Code GitHub Action은 PR이나 이슈에 @claude 같은 방식으로 반응해 수정과 리뷰를 자동화한다.
      사람이 매번 에디터를 열지 않아도, 저장소 안에서 일어난 변경 요청을 바탕으로 코드 수정을 제안하고
      리뷰 코멘트를 달 수 있어 반복적 작업을 줄인다. 팀 입장에선 '대화형 에이전트'를 GitHub 이벤트에
      직접 연결하는 대표 패턴이다.
    points:
      - "GitHub 이벤트(PR/issue) -> 에이전트 작업 자동화"
      - "수정 제안 + 리뷰 코멘트로 반복 작업 절감"
      - "저장소 안에서 바로 쓰는 대표적 에이전트 통합"
    source: "https://github.com/anthropics/claude-code-action"

  - category: ai
    title: "Gemini CLI — 빠른 무료 한도 + 터미널 에이전트"
    summary: >
      Gemini CLI는 구글이 직접 제공하는 터미널형 AI 에이전트다. CLI 중심이라 스크립트·셸·리포
      작업에 바로 붙이기 쉽고, 무료 한도가 넉넉한 편이라 실험 비용 부담이 낮다. '모델 공급자
      종속 없이 터미널에서 바로 쓰는 에이전트'라는 점에서 팀 일상 작업용으로 자주 비교 대상이 된다.
    points:
      - "터미널 중심이라 자동화/스크립트와 궁합이 좋음"
      - "직접 제공 서비스라 초기 도입 장벽이 낮음"
      - "무료 한도 체감이 좋아 실험용으로 많이 씀"
    source: "https://github.com/google-gemini/gemini-cli"

  - category: ai
    title: "Codex CLI — Rust 기반 터미널 코딩 에이전트"
    summary: >
      Codex CLI는 OpenAI가 공개한 터미널 코딩 에이전트로, Rust와 Apache-2.0 라이선스를 쓰는 것이
      특징이다. 코드 수정, 리팩터링, 테스트, 자동화 작업을 셸 흐름에 붙이기 좋고, headless 실행
      패턴과도 잘 맞는다. 터미널 안에서 바로 돌리는 개발 에이전트의 대표주자로 자주 언급된다.
    points:
      - "Rust + Apache-2.0"
      - "셸 기반 작업/자동화에 적합"
      - "headless 실행과 궁합 좋음"
    source: "https://github.com/openai/codex"

  - category: ai
    title: "OpenHands — 오픈소스 자율 코딩 에이전트"
    summary: >
      OpenHands는 GitHub 이슈나 버그 수정 같은 개발 작업을 자율적으로 수행하는 오픈소스 에이전트다.
      모델 자체보다도 에이전트 실행 흐름, 도구 호출, 작업 분해를 직접 다루는 쪽에 관심이 많은 팀에서
      많이 본다. 상용 서비스 대안이 필요할 때 검토하는 대표 OSS 중 하나다.
    points:
      - "자율 작업 흐름 중심의 오픈소스 에이전트"
      - "이슈 처리·버그 수정 같은 실전 작업에 초점"
      - "상용 대안 비교군으로 자주 거론"
    source: "https://github.com/All-Hands-AI/OpenHands"

  - category: ai
    title: "Aider — git 중심 페어 프로그래머"
    summary: >
      Aider는 git을 기반으로 코드를 수정하고 커밋까지 자연스럽게 이어가는 터미널형 페어 프로그래머다.
      레포 구조를 통째로 넣지 않아도 맵과 diff 중심으로 작업해 토큰을 아끼는 방향이 강하다. 개발자
      입장에선 '작은 변경을 빠르게 쌓는 자동 편집기'로 체감하기 쉽다.
    points:
      - "git/diff 중심 작업"
      - "레포 전체 투입 없이도 편집 가능"
      - "작은 변경을 빠르게 누적"
    source: "https://github.com/Aider-AI/aider"

  - category: ai
    title: "Context7 MCP — 최신 문서 끌어오는 실전 패턴"
    summary: >
      Context7 MCP는 에이전트가 라이브러리의 최신 문서를 그때그때 가져오게 하는 서버다. 프롬프트에
      오래된 지식을 담아두는 대신, 실행 시점에 최신 사용법을 읽게 해서 환각과 버전 불일치를 줄인다.
      라이브러리 변경이 잦은 팀에서 특히 유용한 '문서 주입' 패턴이다.
    points:
      - "최신 버전 문서 on-demand 조회"
      - "버전 불일치/환각 감소"
      - "라이브러리 빠른 팀에 유용"
    source: "https://github.com/upstash/context7"

  - category: ai
    title: "Repomix — 레포 전체를 LLM용 단일 파일로 압축"
    summary: >
      Repomix는 코드베이스를 LLM이 읽기 쉬운 단일 파일 형태로 묶어준다. 에이전트에게 리포 구조와
      핵심 파일만 효율적으로 전달할 수 있어, 긴 맥락을 한 번에 보내야 하는 분석·리뷰 작업에 유리하다.
      컨텍스트 비용이 큰 프로젝트에서 자주 쓰는 전처리 도구다.
    points:
      - "코드베이스 -> 단일 LLM 친화 파일"
      - "긴 맥락 전달 비용 절감"
      - "분석/리뷰 전처리 도구로 유용"
    source: "https://github.com/yamadashy/repomix"

  - category: ai
    title: "공식 MCP 레지스트리 — 서버 찾기 소스 오브 트루스"
    summary: >
      공식 MCP 레지스트리는 흩어진 MCP 서버를 한곳에서 찾게 해 주는 인덱스 성격의 자료다. MCP가
      늘어날수록 '어떤 서버를 어디서 찾아야 하는가'가 문제인데, 레지스트리는 이 탐색 비용을 줄인다.
      툴 체인 표준화가 필요한 팀에 특히 중요하다.
    points:
      - "흩어진 MCP 서버 탐색 비용 감소"
      - "표준화된 검색 نقطة"
      - "툴 체인 확장할수록 가치↑"
    source: "https://blog.modelcontextprotocol.io/posts/2025-09-08-mcp-registry-preview/"

  - category: ai
    title: "Claude Code 비용 줄이기 — 컨텍스트 예산 관리"
    summary: >
      에이전트를 오래 돌릴수록 비용은 모델 호출보다도 컨텍스트 낭비에서 커진다. 공식 가이드는 무엇을
      넣고 뺄지, 스킬·훅·출력 스타일을 어떻게 조절할지에 초점을 맞춘다. 즉, '더 큰 모델'보다
      '덜 새는 세션'이 더 싸게 먹힌다는 실전 체크리스트다.
    points:
      - "비용의 핵심 = 컨텍스트 낭비 관리"
      - "스킬·훅·프롬프트 캐시 조절"
      - "큰 모델보다 덜 새는 세션이 중요"
    source: "https://code.claude.com/docs/en/costs"

  - category: ai
    title: "reloadSkills — SessionStart 훅으로 같은 세션에서 스킬 즉시 반영"
    summary: >
      Claude Code의 스킬 탐색은 보통 SessionStart 훅이 끝나기 전에 한 번만 돌기 때문에,
      훅이 ~/.claude/skills/ 나 .claude/skills/ 에 새 스킬을 써넣어도 다음 세션에야 나타난다.
      이를 해결하려고 SessionStart 훅이 JSON으로 `reloadSkills: true`를 반환하면, 훅 완료 후
      Claude Code가 스킬·커맨드 디렉터리를 다시 스캔해 방금 설치한 스킬을 같은 세션에서 바로 쓸 수 있다.
      팀 스킬 레포를 git pull로 동기화한 뒤 즉시 적용하는 부트스트랩 패턴에 유용하다.
    points:
      - "스킬 탐색은 SessionStart 훅 종료 전에 1회 실행 — 새 스킬은 원래 다음 세션에야 보임"
      - "SessionStart 훅이 hookSpecificOutput에 reloadSkills:true 반환 시 디렉터리 재스캔"
      - "git pull로 팀 스킬 받아 같은 세션에 즉시 반영하는 부트스트랩에 적합"
    source: "https://code.claude.com/docs/en/hooks"

  - category: ai
    title: "--safe-mode — 커스터마이징 다 끄고 설정 문제 격리"
    summary: >
      Claude Code(v2.1.169+)의 `--safe-mode`는 모든 커스터마이징을 로드하지 않고 시작하는 플래그다.
      CLAUDE.md·스킬·플러그인·훅·MCP 서버·커스텀 커맨드/에이전트·출력 스타일·워크플로·커스텀 테마/키바인딩·
      상태줄·LSP 서버·자동 메모리가 전부 비활성화된다. 반면 인증·모델 선택·내장 도구·권한은 정상 동작해서,
      모든 것을 끄는 `--bare`와는 다르다. 어떤 커스터마이징이 설정을 망가뜨렸는지 이분법으로 좁힐 때 쓴다.
      관리(managed) 정책 훅·상태줄·커맨드는 안전 모드에서도 여전히 적용된다.
    points:
      - "끄는 것: CLAUDE.md·스킬·플러그인·훅·MCP·커스텀 커맨드/에이전트·출력스타일·테마·상태줄·자동메모리"
      - "유지: 인증·모델 선택·내장 도구·권한 (그래서 전부 끄는 --bare와 다름)"
      - "관리 정책 항목은 예외로 적용 / 실행 시 CLAUDE_CODE_SAFE_MODE 설정됨"
    source: "https://code.claude.com/docs/en/cli-reference"
  - category: ai
    title: "/cd — 프롬프트 캐시 깨지 않고 작업 디렉터리 옮기기"
    summary: >
      Claude Code(v2.1.169+)의 `/cd <path>`는 세션을 통째로 새 작업 디렉터리로 옮긴다.
      핵심은 대화의 프롬프트 캐시가 유지된다는 점이다. 시스템 프롬프트를 다시 만드는 대신,
      새 디렉터리의 CLAUDE.md를 메시지로 덧붙이는 방식이라 세션 중간에 캐시가 깨지지 않는다.
      세션은 새 디렉터리의 프로젝트 저장소로 이동해서 `--resume`/`--continue`도 거기서 찾는다.
      처음 가는 디렉터리면 신뢰 여부를 물어본다. 세션 이동 없이 디렉터리 접근만 추가하려면 `/add-dir`를 쓴다.
    points:
      - "세션을 새 작업 디렉터리로 이동 — 프롬프트 캐시 보존(CLAUDE.md를 메시지로 append)"
      - "세션이 새 디렉터리 저장소로 옮겨져 --resume/--continue도 거기서 인식"
      - "접근만 추가는 /add-dir / Cd 권한 규칙으로 대상 제한 가능 / v2.1.169 미만은 Unknown command"
    source: "https://code.claude.com/docs/en/commands"
  - category: ai
    title: "출력 스타일(Output Styles) — Claude의 역할·말투를 시스템 프롬프트째 바꾸기"
    summary: >
      출력 스타일은 Claude가 '무엇을 아는지'가 아니라 '어떻게 응답하는지'를 바꾼다. 시스템 프롬프트를 직접 수정해
      역할·톤·출력 형식을 매 턴 고정한다. 내장 스타일은 Default 외에 Proactive(즉시 실행), Explanatory(코딩 중 'Insights' 설명),
      Learning(직접 코드 일부를 짜도록 TODO(human) 마커를 남김) 세 가지가 있다. `/config`의 Output style에서 고르며
      선택은 .claude/settings.local.json의 outputStyle에 저장된다. 세션 시작 시 한 번 읽으므로 변경은 /clear 후 적용된다.
      커스텀 스타일은 .claude/output-styles의 마크다운 파일로 만들고, keep-coding-instructions: true면 코딩 지침을 유지한다.
    points:
      - "내장: Default / Proactive(즉시 실행) / Explanatory(설명) / Learning(TODO(human) 마커로 직접 작성 유도)"
      - "CLAUDE.md(프로젝트 컨텍스트)와 달리 시스템 프롬프트 자체를 수정 — 매 응답에 적용, /clear 후 반영"
      - "커스텀은 .claude/output-styles 마크다운 / 기본은 코딩 지침 제외, keep-coding-instructions: true로 유지"
    source: "https://code.claude.com/docs/en/output-styles"
  - category: ai
    title: "fallbackModel — 기본 모델이 막힐 때 대체 모델로 자동 전환"
    summary: >
      fallbackModel은 기본 모델이 과부하(overloaded)거나 사용 불가일 때 쓸 백업 모델을 지정하는 설정이다.
      settings.json에 모델 이름 배열로 적으면 적힌 순서대로 시도하고, 전환되면 알림(notice)을 보여준다.
      체인은 최대 3개까지만 적용되고 그 이상은 무시된다. `"default"`는 기본 모델로 확장된다.
      이 키는 설정 파일 간 병합되지 않아서, 우선순위가 가장 높은 파일이 체인 전체를 결정한다.
      한 세션만 바꾸려면 `--fallback-model` 플래그로 덮어쓸 수 있다.
    points:
      - "기본 모델 과부하·불가 시 배열 순서대로 백업 모델 시도 + 전환 알림 표시"
      - "체인 최대 3개(초과 무시) / \"default\"는 기본 모델로 확장 / 병합 안 됨(최상위 파일이 전체 결정)"
      - "단발성 변경은 --fallback-model 플래그로 한 세션만 덮어쓰기"
    source: "https://code.claude.com/docs/en/settings"
  - category: ai
    title: "Stop 훅 additionalContext — 턴 끝에 컨텍스트 주입해 작업 이어가기"
    summary: >
      Stop·SubagentStop 훅은 hookSpecificOutput.additionalContext로 문자열을 돌려줄 수 있다.
      Claude Code는 이 문자열을 시스템 리마인더로 감싸 턴이 끝나는 지점에 끼워 넣고, 대화가 계속되어 Claude가 그 내용을 보고 작업을 이어간다.
      decision: "block"이 오류 피드백으로 강제 계속시키는 것과 달리, additionalContext는 오류가 아닌 정보성 피드백이다.
      한 이벤트에 여러 훅이 값을 돌려주면 Claude는 전부 받고, 한 값이 10,000자를 넘으면 전체 텍스트는 세션 디렉터리 파일로 저장되고 미리보기와 파일 경로만 전달된다.
    points:
      - "Stop·SubagentStop은 hookSpecificOutput.additionalContext로 턴 끝에 컨텍스트 주입 가능"
      - "block(오류 피드백) vs additionalContext(정보성 피드백) — 둘 다 대화를 계속시키지만 성격이 다름"
      - "값 10,000자 초과 시 파일로 저장 후 경로+미리보기만 전달 / 여러 훅 값은 모두 수신"
    source: "https://code.claude.com/docs/en/hooks"
  - category: ai
    title: "상태줄 rate_limits — 5시간·7일 사용량을 항상 눈에 보이게"
    summary: >
      상태줄(statusline) 스크립트는 stdin으로 받는 JSON에 rate_limits 필드를 포함한다.
      rate_limits.five_hour와 rate_limits.seven_day 각각에 used_percentage(0~100)와 resets_at(Unix epoch 초)가 들어 있어, 5시간·7일 사용 한도를 몇 % 썼고 언제 리셋되는지 바닥에 상시 표시할 수 있다.
      단 이 필드는 Claude.ai 구독자(Pro/Max)에게만, 그것도 세션 첫 API 응답 이후에 나타나며 각 윈도우가 독립적으로 없을 수 있어 jq에서 // empty로 부재를 처리해야 한다.
      상태줄은 로컬에서 돌고 API 토큰을 쓰지 않으니 한도 추적에 부담이 없다.
    points:
      - "rate_limits.five_hour / seven_day → used_percentage(0~100) + resets_at(Unix epoch 초)"
      - "Pro/Max 구독자 한정, 세션 첫 API 응답 후에만 등장 / 각 윈도우 독립적으로 부재 가능 → jq '// empty'"
      - "상태줄은 로컬 실행이라 API 토큰 미소비 / context_window.used_percentage로 컨텍스트 사용량도 함께 표시 가능"
    source: "https://code.claude.com/docs/en/statusline"
  - category: ai
    title: "disableBundledSkills — 번들 스킬·내장 명령을 모델 눈앞에서 치우기"
    summary: >
      Claude Code에는 기본 제공되는 번들 스킬·워크플로와 /init 같은 내장 슬래시 명령이 딸려 온다.
      settings.json에서 disableBundledSkills를 true로 두면 번들 스킬·워크플로는 통째로 제거되고, 내장 슬래시 명령은 여전히 타이핑은 되지만 모델 목록에서는 숨겨진다.
      이때 설치한 Skills 플러그인, .claude/skills/, .claude/commands/의 내 스킬·명령은 영향을 받지 않는다.
      환경변수 CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1로도 같은 효과를 낼 수 있어, 내 워크플로만 깔끔히 노출하고 싶을 때 쓴다.
    points:
      - "true 시 번들 스킬·워크플로는 완전 제거, 내장 슬래시 명령(/init 등)은 타이핑 가능하나 숨김"
      - "내 것(플러그인·.claude/skills·.claude/commands)은 영향 없음"
      - "환경변수 CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1로 동일 효과"
    source: "https://code.claude.com/docs/en/settings"
  - category: ai
    title: "스킬 호출 권한 — disable-model-invocation / user-invocable"
    summary: >
      커스텀 명령이 스킬로 통합되면서, 스킬 프런트매터로 "누가 이 스킬을 부를 수 있는가"를 제어할 수 있다.
      기본값은 사용자와 Claude 둘 다 호출 가능이지만, disable-model-invocation을 true로 두면 오직 사용자가 /이름으로만 부를 수 있고 Claude가 자동으로 실행하지 못한다.
      배포·커밋·슬랙 전송처럼 부작용이 있거나 타이밍을 직접 잡아야 하는 작업에 쓰면, 코드가 준비돼 보인다고 Claude가 멋대로 배포하는 일을 막는다.
      반대로 user-invocable을 false로 두면 / 메뉴에서 숨겨져 Claude만 쓸 수 있어, 명령이 아닌 배경 지식용 스킬(예: 레거시 시스템 설명)에 적합하다.
    points:
      - "disable-model-invocation: true → 사용자만 /이름으로 호출, Claude 자동 실행 차단(서브에이전트 프리로드도 막음)"
      - "user-invocable: false → / 메뉴에서 숨김, Claude만 사용(배경 지식용)"
      - "둘 다 기본 false/true → 기본은 양쪽 모두 호출 가능 / 부작용 있는 /deploy·/commit에 disable-model-invocation 권장"
    source: "https://code.claude.com/docs/en/slash-commands"
  - category: ai
    title: "스킬 effort 프런트매터 — 명령마다 추론 강도 따로 주기"
    summary: >
      스킬(=통합된 커스텀 슬래시 명령)의 프런트매터에 effort 필드를 두면, 그 스킬이 활성화된 동안만 세션의 추론 강도(effort level)를 덮어쓴다.
      값은 low·medium·high·xhigh·max 중 모델이 지원하는 범위에서 고르며, 지정하지 않으면 세션 설정을 그대로 따른다.
      가벼운 포맷 정리·로그 한 줄 추가 같은 스킬엔 low를, 아키텍처 설계·보안 점검처럼 깊은 사고가 필요한 스킬엔 high 이상을 박아두면 매번 /model로 바꿀 필요가 없다.
      비슷하게 model 필드로 그 스킬이 도는 동안의 모델 자체를 바꿀 수도 있고, 본문에서는 ${CLAUDE_EFFORT}로 현재 강도를 읽어 지시를 분기할 수 있다.
    points:
      - "effort: low/medium/high/xhigh/max — 스킬 활성 동안만 세션 effort 덮어씀(미지정 시 세션 상속)"
      - "model 필드와 짝 — 스킬 도는 동안의 모델까지 바꾸고 턴 끝나면 세션 모델 복귀"
      - "본문에서 ${CLAUDE_EFFORT}로 현재 강도 읽어 지시 분기 가능(ultracode는 xhigh로 표시)"
    source: "https://code.claude.com/docs/en/slash-commands"
  - category: ai
    title: "PreCompact 훅 — 압축 직전, 컨텍스트를 지킬 마지막 기회"
    summary: >
      PreCompact 훅은 컨텍스트 압축(compaction)이 일어나기 직전에 실행된다.
      matcher로 무엇이 압축을 일으켰는지 구분할 수 있는데, 사용자가 직접 친 /compact는 manual, 컨텍스트가 차서 자동으로 도는 압축은 auto다.
      PreCompact는 블로킹 가능한 이벤트라서, 훅이 exit code 2로 끝나거나 JSON으로 decision:"block"을 돌려주면 압축 자체를 막을 수 있다.
      그래서 "압축으로 대화 일부가 요약되어 사라지기 전, 중요한 컨텍스트를 파일로 저장하는 마지막 기회"로 쓰는 패턴이 대표적이다. SessionStart 훅과 짝지으면 다음 세션에서 그 컨텍스트를 다시 불러와 이어갈 수 있다.
    points:
      - "압축 직전 실행 / matcher로 manual(/compact 수동) vs auto(컨텍스트 참) 구분"
      - "블로킹 가능 — exit 2 또는 decision:\"block\"으로 압축 자체를 막을 수 있음"
      - "압축으로 요약돼 사라질 컨텍스트를 미리 저장하는 '마지막 기회' 패턴 (SessionStart와 짝)"
    source: "https://code.claude.com/docs/en/hooks"

  - category: ai
    title: "훅 핸들러 5종 — 셸 말고도 HTTP·MCP 도구·프롬프트·에이전트로 받기"
    summary: >
      훅은 더 이상 셸 명령(command)만 부르는 게 아니다. 핸들러 type이 5종으로 늘었다.
      command(셸/실행파일), http(설정에 적은 URL로 POST), mcp_tool(이미 연결된 MCP 서버의 도구 호출), prompt(프롬프트 텍스트를 빠른 모델에 보내 평가), agent(서브에이전트로 평가)다.
      prompt/agent는 $ARGUMENTS 자리에 훅 입력 JSON이 들어가고 model 필드로 평가 모델을 고를 수 있다(기본은 빠른 모델).
      단, /hooks 대화형 메뉴는 다섯 종을 다 보여주지만 실제로 추가·편집할 수 있는 건 command와 mcp_tool 둘뿐이라, http·prompt·agent는 settings.json에 직접 적어야 한다.
    points:
      - "5종: command(셸) / http(URL POST) / mcp_tool(연결된 MCP 도구) / prompt / agent"
      - "prompt·agent는 $ARGUMENTS로 훅 입력 JSON 주입, model 필드로 평가 모델 지정(기본 빠른 모델)"
      - "/hooks 메뉴는 5종 다 표시하나 추가·편집은 command·mcp_tool만 — 나머지는 settings.json 직접 작성"
    source: "https://code.claude.com/docs/en/hooks"

  - category: ai
    title: "claude --worktree — 작업끼리 안 부딪히는 격리 세션 한 줄로 띄우기"
    summary: >
      `claude --worktree <이름>`(또는 `-w`)은 그 자리에서 git worktree를 새로 만들고 거기서 세션을 연다.
      한 터미널에서 기능을 짜는 동안 다른 터미널에서 버그를 고쳐도 편집이 충돌하지 않는다 — 각 worktree가 자기 브랜치를 가진 독립 체크아웃이기 때문이다.
      이름을 생략하면 `bright-running-fox` 같은 걸 자동 생성하고, `--worktree "#1234"`처럼 PR 번호(#붙여)나 GitHub PR URL을 주면 `pull/<번호>/head`를 받아 `.claude/worktrees/pr-<번호>`에 worktree를 만든다.
      .gitignore에 걸린 로컬 설정(.env 등)은 안 따라오므로, repo 루트의 `.worktreeinclude`에 적은 파일만 worktree로 복사된다.
      git이 아닌 SVN·Perforce·Mercurial은 `WorktreeCreate`/`WorktreeRemove` 훅으로 생성·정리 로직을 직접 꽂으면 된다.
    points:
      - "--worktree(-w): 즉석에서 git worktree 생성 후 그 안에서 세션 시작 — 병렬 작업 충돌 방지"
      - "이름 생략 시 자동 생성, '#1234'·PR URL 주면 pull/<번호>/head를 .claude/worktrees/pr-<번호>에 체크아웃"
      - ".worktreeinclude로 .gitignore된 로컬 파일(.env 등)만 골라 복사 / 비-git VCS는 WorktreeCreate 훅"
    source: "https://code.claude.com/docs/en/worktrees"

  - category: ai
    title: "스킬 disallowed-tools — 활성 동안 도구를 아예 풀에서 빼기"
    summary: >
      스킬 프런트매터의 `allowed-tools`와 `disallowed-tools`는 정반대 일을 한다.
      `allowed-tools`는 스킬이 활성인 동안 적힌 도구를 승인 없이 쓰게 해주지만 제한은 아니다 — 모든 도구는 여전히 호출 가능하고 권한 설정이 그대로 적용된다.
      반면 `disallowed-tools`는 적힌 도구를 활성 동안 모델의 가용 풀에서 통째로 제거한다. 공식 문서가 든 예는 배경 루프에서 `AskUserQuestion`을 못 부르게 막는 것 — 사람이 안 보는 자율 스킬에 유용하다.
      단, 이 제한은 다음 메시지를 보내면 풀린다. 모든 스킬·프롬프트에 영구 적용하려면 권한 설정의 deny 규칙을 써야 한다.
    points:
      - "allowed-tools: 승인 없이 쓰게 허용(제한 아님) / disallowed-tools: 풀에서 제거(진짜 제한)"
      - "예: 자율 배경 루프에서 AskUserQuestion 차단 — 사람 개입 호출 자체를 막음"
      - "제한은 다음 메시지에 해제 / 영구 차단은 권한 설정 deny 규칙"
    source: "https://code.claude.com/docs/en/slash-commands"

  - category: ai
    title: "StopFailure 훅 — API 에러로 턴이 끝날 때만 잡아내기"
    summary: >
      Stop 훅은 Claude가 정상적으로 턴을 마칠 때 돌지만, API 에러로 턴이 죽으면 안 돈다.
      그 빈틈을 메우는 게 StopFailure 훅이다 — 턴이 API 에러로 끝날 때 발화한다.
      matcher로 에러 종류를 구분할 수 있어서, rate_limit·overloaded·billing_error·authentication_failed·server_error 등으로 골라 받을 수 있다.
      단 이 훅은 출력과 종료 코드가 무시되는 '사이드 이펙트 전용' 이벤트라 턴을 막거나 흐름을 바꾸진 못한다. 로깅·알림·정리 용도다.
    points:
      - "Stop은 정상 종료에만 발화 / StopFailure는 API 에러로 끝날 때 발화"
      - "matcher로 에러 종류 구분: rate_limit·overloaded·billing_error·server_error 등"
      - "출력·종료 코드 무시 — 막기 불가, 로깅·알림·정리 같은 사이드 이펙트 전용"
    source: "https://code.claude.com/docs/en/hooks"

  - category: ai
    title: "서브에이전트 중첩 — 서브에이전트가 또 서브에이전트를 띄우기"
    summary: >
      v2.1.172부터 서브에이전트가 자기만의 서브에이전트를 스폰할 수 있다. 위임한 작업이
      다시 병렬 하위작업으로 갈라질 때(예: 발견 항목마다 검증 에이전트를 붙이는 리뷰어) 쓴다.
      중간 산출물은 메인 대화에 닿지 않고, 최상위 서브에이전트의 요약만 돌아온다.
      포그라운드는 부모를 블로킹하며 사슬처럼 이어져 자기제한적이라 깊이 제한이 없지만,
      백그라운드는 깊이 5에서 Agent 도구를 못 받아 더 못 띄운다(고정·설정 불가).
    points:
      - "v2.1.172부터 — 서브에이전트가 중첩 서브에이전트 스폰 가능"
      - "포그라운드는 깊이 무제한(블로킹·자기제한), 백그라운드는 깊이 5에서 차단"
      - "특정 서브에이전트 차단: tools에서 Agent 빼거나 disallowedTools에 추가"
    source: "https://code.claude.com/docs/en/sub-agents"
  - category: ai
    title: "/context — 컨텍스트 창이 어디로 새는지 색깔 격자로 보기"
    summary: >
      대화가 길어져 응답이 느려지거나 자꾸 압축될 때, /context는 지금 컨텍스트 창이
      무엇으로 차 있는지 색깔 격자로 시각화한다. 컨텍스트를 많이 먹는 도구, 메모리 파일
      비대화(memory bloat), 용량 경고에 대한 최적화 제안도 함께 띄운다. 기본은 항목별
      요약을 접어 격자를 크게 보여주고, all 인자를 주면 펼친다. 비우는 게 아니라 '어디가
      문제인지'를 보는 진단 도구라, 실제로 줄이려면 /compact(요약)나 /clear(초기화)를 쓴다.
    points:
      - "/context — 현재 컨텍스트 사용량을 색깔 격자로 시각화, 최적화 제안 표시"
      - "/context all — 풀스크린에서 접힌 항목별 breakdown 펼치기"
      - "진단만 함 — 실제로 줄이려면 /compact(요약 후 계속) 또는 /clear(빈 컨텍스트로 새 대화)"
    source: "https://code.claude.com/docs/en/commands"
  - category: ai
    title: "subagentStatusLine — 서브에이전트 행마다 표시 내용 직접 그리기"
    summary: >
      subagentStatusLine은 프롬프트 아래 에이전트 패널에서 각 서브에이전트 행의 본문을
      기본 'name · description · token count' 대신 내 포맷으로 바꾸는 설정이다.
      settings.json에 type "command"로 스크립트를 등록하면, 새로고침 틱마다 한 번 실행되며
      보이는 모든 서브에이전트 행이 stdin에 단일 JSON으로 들어온다. 입력에는 공통 훅 필드 외에
      columns(행 너비)와 tasks 배열(각 항목에 id·name·type·status·description·label·startTime·tokenCount·tokenSamples·cwd)이 담긴다.
      stdout에 행마다 {"id":..., "content":...} 한 줄씩 출력하면 그 행만 덮어쓴다.
    points:
      - "서브에이전트 패널 행 본문 커스터마이즈 — 기본은 name·description·token count"
      - "stdin: columns + tasks 배열(id·status·tokenCount 등), stdout: {\"id\",\"content\"} 줄 단위"
      - "id 생략 시 기본 렌더 유지, content 빈 문자열이면 행 숨김 / statusLine과 동일한 trust·disableAllHooks 적용"
    source: "https://code.claude.com/docs/en/statusline"
  - category: ai
    title: "플러그인 마켓플레이스 — marketplace.json 하나로 팀에 플러그인 배포하기"
    summary: >
      마켓플레이스는 플러그인을 남에게 나눠주는 카탈로그다. 레포 루트의
      `.claude-plugin/marketplace.json`에 name·owner·plugins 세 필드를 채우면 되고,
      각 plugin 항목은 최소 name과 source(어디서 가져올지)만 있으면 된다. source는 같은
      레포의 상대경로(`./plugins/x`)부터 github·url·git-subdir·npm까지 지원하며,
      github/url 소스는 ref(브랜치·태그)와 sha(정확한 커밋)로 버전을 고정할 수 있다.
      쓰는 쪽은 `/plugin marketplace add owner/repo`로 등록하고
      `/plugin install <플러그인>@<마켓플레이스>`로 깔며, `/plugin marketplace update`로 갱신한다.
    points:
      - "marketplace.json 필수 필드: name(kebab-case) · owner · plugins[] / 각 plugin은 name+source"
      - "source 종류: 상대경로(./) · github · url · git-subdir · npm — github/url은 ref·sha로 핀 고정"
      - "버전 미설정 시 git 커밋 SHA가 버전 — 핀 걸린 plugin.json version은 바꿔야 업데이트 전파"
    source: "https://code.claude.com/docs/en/plugin-marketplaces"

  - category: ai
    title: "다이내믹 워크플로 — Claude가 짠 스크립트로 서브에이전트 수십~수백 개 굴리기"
    summary: >
      다이내믹 워크플로는 서브에이전트를 대량으로 오케스트레이션하는 자바스크립트 스크립트다.
      Claude가 작업에 맞는 스크립트를 직접 작성하고, 런타임이 그걸 백그라운드에서 돌려서
      세션은 그대로 응답 가능한 상태로 남는다. 한 대화가 조율하기엔 에이전트가 너무 많이 필요할 때
      쓴다 — 레포 전체 버그 훑기, 500개 파일 마이그레이션, 출처 교차검증이 필요한 리서치 같은 것.
      `/workflows`로 실행·완료된 워크플로 목록을 보고 진행 상황을 드릴다운할 수 있고,
      `/effort` 의 ultracode 모드를 켜면 Claude가 작업마다 워크플로를 띄울지 알아서 판단한다.
    points:
      - "Claude가 JS 스크립트를 작성 → 런타임이 백그라운드 실행, 세션은 계속 응답 가능"
      - "`/workflows`로 실행·완료 목록 확인 / 저장하면 `/<이름>` 명령이 되고 args로 입력 받음"
      - "에이전트를 많이 띄워 토큰 사용 큼 — 작은 슬라이스(디렉터리 하나)부터 시험 권장"
    source: "https://code.claude.com/docs/en/workflows"

  - category: ai
    title: "MessageDisplay 훅 — 화면에 보이는 답변 텍스트만 바꿔치기"
    summary: >
      MessageDisplay는 어시스턴트 메시지 텍스트가 화면에 출력되는 동안 도는 표시 전용(display-only) 훅이다.
      hookSpecificOutput.displayContent로 문자열을 돌려주면 화면에 보이는 텍스트가 그것으로 교체된다.
      단 트랜스크립트와 Claude가 보는 내용은 원본 그대로 유지돼, 모델의 판단에는 영향을 주지 않고 사람 눈에 보이는 것만 손댄다.
      matcher를 지원하지 않아 매번 발생하고, 기본 타임아웃이 10초로 낮게 잡혀 있으며, 블로킹은 불가(exit 2면 원본이 그대로 표시).
    points:
      - "displayContent로 화면 출력 텍스트만 교체 — 트랜스크립트·모델 시야는 원본 유지"
      - "matcher 미지원, 항상 발생 / 기본 타임아웃 10초로 낮음"
      - "블로킹 불가 — exit code 2여도 원본 텍스트가 그대로 표시됨"
    source: "https://code.claude.com/docs/en/hooks"

  - category: ai
    title: "--exclude-dynamic-system-prompt-sections — 프롬프트 캐시 재사용률 높이기"
    summary: >
      이 플래그는 머신마다 달라지는 시스템 프롬프트 조각(작업 디렉터리, 환경 정보, 메모리 경로, git 레포 여부)을
      시스템 프롬프트에서 빼서 첫 번째 사용자 메시지로 옮긴다.
      시스템 프롬프트가 사용자·머신에 상관없이 동일해지므로, 같은 작업을 여러 사람·여러 머신이 돌릴 때 프롬프트 캐시가 더 잘 재사용된다.
      기본 시스템 프롬프트에서만 동작하고 `--system-prompt`/`--system-prompt-file`를 쓰면 무시되며, `-p`(print) 스크립트의 다중 사용자 워크로드에 쓰라고 안내된다.
    points:
      - "머신별 조각(cwd·환경·메모리경로·git여부)을 시스템 프롬프트 → 첫 사용자 메시지로 이동"
      - "시스템 프롬프트가 동일해져 사용자·머신 간 프롬프트 캐시 히트율 상승"
      - "기본 프롬프트에서만 작동(--system-prompt류 쓰면 무시) / -p 다중사용자 스크립트용"
    source: "https://code.claude.com/docs/en/cli-reference"

  - category: ai
    title: "Setup 훅 — 세션 시작 전 init·maintenance 준비 작업 자동 실행"
    summary: >
      Setup은 세션이 시작되기 '전'에 도는 훅 이벤트로, CLI 플래그로 트리거된다.
      `claude -p --init`은 matcher가 `init`인 Setup 훅을, `claude -p --maintenance`는 matcher가
      `maintenance`인 Setup 훅을 세션 시작 전에 실행한다(둘 다 print 모드 전용).
      `claude --init-only`는 Setup과 SessionStart 훅만 돌리고 대화는 시작하지 않은 채 종료하므로,
      의존성 설치·캐시 워밍 같은 준비 작업을 CI에서 한 번만 돌리기 좋다.
    points:
      - "Setup은 세션 시작 전 실행되는 훅 이벤트 / 입력 JSON에 hook_event_name:\"Setup\", trigger 포함"
      - "--init → matcher 'init', --maintenance → matcher 'maintenance' (둘 다 -p print 모드 전용)"
      - "--init-only는 Setup+SessionStart만 돌리고 대화 없이 종료 — CI 준비 단계용"
    source: "https://code.claude.com/docs/en/hooks"

  - category: ai
    title: "skillOverrides — SKILL.md 안 건드리고 settings에서 스킬 노출 조정하기"
    summary: >
      skillOverrides는 settings.json에서 스킬 이름별로 노출 방식을 덮어쓰는 설정이다.
      각 스킬에 "on", "name-only", "user-invocable-only", "off" 네 값 중 하나를 줄 수 있어서,
      SKILL.md의 프런트매터를 고치지 않고도 특정 스킬을 완전히 끄거나(off), 이름만 보이게 하거나(name-only),
      사용자가 직접 호출할 때만 쓰게(user-invocable-only) 제한할 수 있다.
      팀이 받은 플러그인 스킬이 너무 많아 모델이 엉뚱한 걸 자동으로 부를 때, 원본을 수정하지 않고 프로젝트 설정만으로 정리하기 좋다.
    points:
      - "스킬 이름별 노출 오버라이드 — 값은 on / name-only / user-invocable-only / off 네 가지"
      - "SKILL.md 프런트매터 수정 없이 settings.json만으로 스킬 가시성 조정"
      - "off=완전 숨김, name-only=이름만, user-invocable-only=수동 호출만 / 단 매니지드 스킬은 예외"
    source: "https://code.claude.com/docs/en/settings"

  - category: ai
    title: "claudeMdExcludes — 특정 CLAUDE.md를 메모리 로딩에서 빼기"
    summary: >
      claudeMdExcludes는 settings.json에서 메모리 로딩 시 건너뛸 CLAUDE.md 파일을 글롭 패턴이나 절대경로로 지정하는 설정이다.
      패턴은 파일의 절대경로에 매칭되며, 예컨대 ["**/vendor/**/CLAUDE.md"]처럼 적으면 의존성 디렉터리에 딸려 온 CLAUDE.md가 컨텍스트에 안 실린다.
      유저·프로젝트·로컬 메모리에만 적용되고, 매니지드 정책 파일은 제외할 수 없다.
      서브모듈이나 vendor 트리에 박힌 남의 CLAUDE.md가 컨텍스트 창을 잡아먹을 때, 원본을 지우지 않고 프로젝트 설정만으로 솎아내기 좋다.
    points:
      - "메모리 로딩에서 건너뛸 CLAUDE.md를 글롭/절대경로로 지정 — 패턴은 절대경로에 매칭"
      - "유저·프로젝트·로컬 메모리에만 적용 / 매니지드 정책 파일은 제외 불가"
      - "예: [\"**/vendor/**/CLAUDE.md\"] — vendor 트리의 CLAUDE.md를 컨텍스트에서 빼기"
    source: "https://code.claude.com/docs/en/settings"

  - category: ai
    title: "Playwright MCP — 스크린샷 대신 접근성 트리로 브라우저 조작"
    summary: >
      Playwright MCP는 LLM에게 브라우저 자동화 도구를 MCP로 열어 주는 공식 서버다. 핵심은 화면 픽셀을
      추측하는 대신 페이지의 접근성 트리 스냅샷을 읽고, 그 안의 역할·텍스트·참조값으로 클릭·입력·탭
      전환·네트워크 확인을 수행한다는 점이다. 그래서 비전 모델 없이도 Todo 입력칸 같은 요소를 안정적으로
      찾아 조작할 수 있다. 공식 문서는 VS Code·Cursor·Windsurf·Claude Code·Codex 같은 MCP 클라이언트에서
      `npx @playwright/mcp@latest`로 붙이는 구성을 제시한다. 단, 임의 Playwright 코드를 실행하는
      browser_run_code_unsafe는 RCE와 같으므로 신뢰한 클라이언트에서만 켜야 한다.
    points:
      - "접근성 트리 스냅샷 기반 — 픽셀/스크린샷 추측 의존↓"
      - "클릭·입력·탭·스크린샷·네트워크/콘솔 확인까지 MCP 도구로 제공"
      - "공식 GitHub: Apache-2.0, 2026-06-18 확인 34,069★ / unsafe 코드 실행은 신뢰 클라이언트 전용"
    source: "https://playwright.dev/docs/getting-started-mcp"

  - category: ai
    title: "allowManagedHooksOnly — 조직이 승인한 훅만 돌게 잠그기"
    summary: >
      allowManagedHooksOnly는 settings.json에서 켜면 매니지드 훅, SDK 훅, 그리고 매니지드 설정의 enabledPlugins로 강제 활성화된 플러그인 훅만 로드하는 설정이다.
      유저·프로젝트·로컬에 정의된 일반 훅은 전부 차단된다.
      훅은 사용자 권한으로 임의 셸 명령을 실행할 수 있어 보안 위험이 큰데, 이 설정으로 개인이 끼워 넣은 훅을 막고 조직이 검수한 훅만 허용하는 화이트리스트를 만든다.
      훅을 통째로 끄는 disableAllHooks와 달리, 승인된 훅은 살려 두면서 비승인 훅만 거른다.
    points:
      - "매니지드 훅·SDK 훅·매니지드 enabledPlugins 훅만 로드 / 유저·프로젝트·로컬 훅은 차단"
      - "훅은 사용자 권한 셸 실행 — 비승인 훅 차단으로 공급망/내부자 위험 축소"
      - "disableAllHooks(전부 끄기)와 달리 승인된 훅은 유지하는 화이트리스트 방식"
    source: "https://code.claude.com/docs/en/settings"

  - category: ai
    title: "MCP 리소스·프롬프트 — 서버를 @멘션과 슬래시 커맨드로 쓰기"
    summary: >
      MCP 서버는 도구만이 아니라 '리소스'와 '프롬프트'도 노출하는데, 둘 다 일상 입력에서 바로 끌어 쓸 수 있다.
      리소스는 파일처럼 @멘션으로 참조한다 — 프롬프트에 `@`를 치면 연결된 모든 서버의 리소스가 자동완성에 뜨고,
      `@server:protocol://resource/path` 형식(예: `@github:issue://123`)으로 적으면 해당 내용이 자동으로 가져와져 첨부된다. 한 프롬프트에서 여러 개를 동시에 참조할 수도 있다.
      프롬프트는 슬래시 커맨드가 된다 — `/`를 치면 `/mcp__서버명__프롬프트명` 형태로 나타나고, 인자는 그 뒤에 공백으로 구분해 넘긴다.
      둘 다 연결된 서버에서 동적으로 발견되므로 별도 설정이 필요 없다.
    points:
      - "리소스 = @멘션: `@server:protocol://resource/path` (예: @github:issue://123), 참조 시 자동 fetch·첨부"
      - "프롬프트 = 슬래시 커맨드: `/mcp__servername__promptname`, 인자는 뒤에 공백 구분으로 전달"
      - "둘 다 연결된 서버에서 동적 발견 — 설정 불필요, 한 프롬프트에 리소스 여러 개 참조 가능"
    source: "https://code.claude.com/docs/en/mcp"

  - category: ai
    title: "/btw — 대화 흐름 안 깨고 곁다리 질문 던지기"
    summary: >
      긴 작업 중간에 빠른 질문 하나가 필요한데 본 대화를 어지럽히고 싶지 않을 때 `/btw`를 쓴다.
      `/btw 그 설정 파일 이름이 뭐였지?`처럼 치면, 현재 대화 전체를 보면서 답하지만 그 질문·답변은
      대화 기록에 남지 않고 닫을 수 있는 오버레이로만 뜬다. Claude가 한창 응답 중일 때도 실행 가능하며
      메인 턴을 끊지 않고 따로 돈다. 단 곁다리 질문은 도구 접근이 없어 — 파일 읽기·명령 실행·검색을 못 하고
      이미 컨텍스트에 있는 것만으로 답한다. 답이 뜨면 `f`로 새 세션으로 포크해 풀 도구 권한으로 이어갈 수 있다.
      서브에이전트의 정반대다 — 서브에이전트는 빈 컨텍스트 + 풀 도구, `/btw`는 풀 컨텍스트 + 도구 없음.
    points:
      - "본 대화 기록에 안 남는 일회성 곁다리 질문 — 오버레이로만 표시"
      - "Claude 작업 중에도 실행 가능, 메인 턴 안 끊고 독립 실행 / 도구 접근은 없음(컨텍스트만으로 답)"
      - "`f`로 새 세션 포크해 풀 도구로 이어가기 — 프롬프트 캐시 재사용해 비용 낮음"
    source: "https://code.claude.com/docs/en/interactive-mode"

  - category: ai
    title: "claude -p --bare — CI에서 매번 같은 결과 나오게 잠그기"
    summary: >
      `claude -p`(헤드리스)는 기본적으로 대화형 세션과 똑같은 컨텍스트를 읽는다 — 작업 디렉터리나
      `~/.claude`의 훅·스킬·플러그인·MCP 서버·자동 메모리·CLAUDE.md를 전부 자동 발견한다.
      문제는 CI에서다. 동료의 `~/.claude` 훅이나 프로젝트 `.mcp.json`이 끼면 머신마다 결과가 달라진다.
      `--bare`를 붙이면 이 자동 발견을 통째로 건너뛰어, 명시적으로 넘긴 플래그만 적용된다.
      bare 모드에서도 Bash·파일 읽기·편집 도구는 쓸 수 있고, 컨텍스트는 `--append-system-prompt`,
      `--mcp-config`, `--settings`, `--agents` 같은 플래그로 직접 주입한다. 출력은 `--output-format json`으로
      받으면 `result`·`session_id`와 `total_cost_usd`(모델별 비용 분해 포함)가 들어와 스크립트가 결과·지출을 파싱할 수 있다.
    points:
      - "--bare: 훅·스킬·플러그인·MCP·자동 메모리·CLAUDE.md 자동 발견을 모두 건너뜀 — 머신 무관 재현성"
      - "bare는 Bash·읽기·편집만 기본 제공, 나머지는 --mcp-config/--settings/--agents/--append-system-prompt로 명시 주입"
      - "--output-format json → result·session_id·total_cost_usd(모델별 분해)로 결과·비용 추적 / 파이프 stdin은 10MB 상한(v2.1.128)"
    source: "https://code.claude.com/docs/en/headless"

  - category: ai
    title: "/usage — 플랜 한도가 스킬·서브에이전트·플러그인·MCP 중 어디로 새는지 % 분해"
    summary: >
      `/cost`가 이번 세션의 달러·소요 시간(API 시간·실제 경과 시간) 요약을 보여준다면, `/usage`는 다른 일을 한다.
      Pro·Max·Team·Enterprise 플랜에서 `/usage`는 최근 사용량이 내 플랜 한도에 얼마나 잡아먹었는지를 보여주는데,
      핵심은 그 사용량을 스킬·서브에이전트·플러그인·개별 MCP 서버별로 전체 대비 퍼센트로 쪼개 준다는 점이다.
      즉 "한도가 빨리 차는 범인"이 어떤 스킬이나 어떤 MCP 서버인지 눈으로 짚어낼 수 있다.
      화면에서 `d`/`w` 키로 최근 24시간과 7일을 전환할 수 있고, 다른 기기나 claude.ai에서 쓴 사용량은 포함되지 않는다.
      이 기능은 Claude Code v2.1.174 이상에서 동작한다.
    points:
      - "/usage = 플랜 한도 기준 사용량을 스킬·서브에이전트·플러그인·MCP 서버별 % 로 분해 (≠ /cost의 달러·시간 요약)"
      - "d/w 키로 최근 24시간 ↔ 7일 전환 / 다른 기기·claude.ai 사용량은 미포함"
      - "Pro·Max·Team·Enterprise 플랜, Claude Code v2.1.174 이상 필요"
    source: "https://code.claude.com/docs/en/costs"

  - category: ai
    title: "오토 메모리 — Claude가 스스로 적는 MEMORY.md로 세션 넘어 학습하기"
    summary: >
      Claude Code 메모리는 두 갈래다. CLAUDE.md는 내가 직접 쓰는 규칙이고, 오토 메모리(auto memory)는 Claude가
      내 교정·선호를 보고 스스로 적어 두는 메모다. 빌드 명령, 디버깅에서 알아낸 점, 코드 스타일 선호 같은 걸
      "다음 대화에서 쓸모 있겠다" 싶을 때만 저장한다(매 세션 저장하는 게 아님). 저장 위치는
      `~/.claude/projects/<project>/memory/`이고, 인덱스 격인 `MEMORY.md`와 주제별 파일들로 나뉜다.
      세션 시작 때는 `MEMORY.md`의 앞 200줄(또는 25KB)만 불러오고 나머지 주제 파일은 필요할 때 그때그때 읽는다.
      전부 평범한 마크다운이라 `/memory`로 열어 직접 보고 고치거나 지울 수 있다.
    points:
      - "CLAUDE.md(내가 씀) vs 오토 메모리(Claude가 씀) — 후자는 기본 on, 끄려면 autoMemoryEnabled:false 또는 CLAUDE_CODE_DISABLE_AUTO_MEMORY=1"
      - "저장: ~/.claude/projects/<project>/memory/ (git 레포 기준이라 워크트리·하위폴더가 한 디렉터리 공유, 머신 로컬)"
      - "세션엔 MEMORY.md 앞 200줄/25KB만 로드 — 주제 파일은 온디맨드 / Claude Code v2.1.59 이상 필요"
    source: "https://code.claude.com/docs/en/memory"

  - category: ai
    title: "내장 ide MCP 서버 — 외부 터미널 CLI를 /ide로 VS Code에 붙이기"
    summary: >
      VS Code 확장이 켜져 있으면 로컬 MCP 서버 하나(이름 `ide`)가 돌고, CLI가 여기에 자동으로 붙는다.
      이 연결 덕에 CLI가 만든 diff가 VS Code 네이티브 diff 뷰어로 열리고, 지금 에디터에서 선택한 텍스트와
      열린 파일 경로가 매 프롬프트에 컨텍스트로 따라붙는다(트랜스크립트에 `⧉ Selected N lines from <file>` 표시).
      통합 터미널에서 `claude`를 돌리면 IDE 연동이 자동이지만, 외부 터미널을 쓸 땐 Claude 안에서 `/ide`를 실행해 VS Code에 연결한다.
      `ide` 서버는 설정할 게 없어 `/mcp` 목록에선 숨겨지고, `127.0.0.1` 랜덤 포트에 바인딩되며 활성화 때마다 새 토큰을 발급한다.
      모델에 노출되는 도구는 둘뿐 — 진단을 읽는 `mcp__ide__getDiagnostics`와 주피터 셀을 실행하는 `mcp__ide__executeCode`(실행 전 항상 확인 받음).
    points:
      - "확장 활성 시 로컬 MCP 서버 `ide` 가동 — CLI 자동 연결 / diff는 VS Code 네이티브 뷰어로 열림"
      - "외부 터미널이면 Claude 안에서 `/ide` 실행해 연결 / 선택 텍스트·열린 파일이 프롬프트 컨텍스트로 첨부 (.env 등은 Read deny 규칙으로 제외)"
      - "모델 노출 도구는 2개뿐: getDiagnostics(읽기), executeCode(주피터, 실행 전 Quick Pick 확인) / 127.0.0.1 랜덤 포트+세션별 토큰"
    source: "https://code.claude.com/docs/en/ide-integrations"

  - category: ai
    title: "동적 컨텍스트 주입 — 슬래시 커맨드에 셸 출력·인자를 미리 끼워 넣기"
    summary: >
      커스텀 슬래시 커맨드(스킬)의 본문에 `!`명령`` 형태를 쓰면, Claude가 그 내용을 보기 전에
      Claude Code가 먼저 그 셸 명령을 실행하고 출력으로 자리표시자를 갈아끼운다. 즉 모델은 명령어가 아니라
      이미 실행된 '실제 데이터'를 받는다 — 예를 들어 `- PR diff: !`gh pr diff``라고 적으면 진짜 diff가
      프롬프트에 인라인된 채로 도착한다. 인자도 같은 식으로 미리 박힌다: `$ARGUMENTS`는 넘긴 인자 전체로,
      `$1`·`$2`는 셸식 따옴표 규칙대로 쪼갠 위치 인자로 치환된다(`\$1`로 리터럴 `$` 이스케이프 가능).
      치환은 원본 파일에 딱 한 번만 돌아서, 명령 출력 안의 자리표시자는 다시 펼쳐지지 않는다. 또 인라인 `!`는
      줄 맨 앞이나 공백 바로 뒤에 있을 때만 인식되고, 여러 줄 명령은 ` ```! ` 펜스 블록으로 감싼다.
    points:
      - "`!`명령``: Claude가 보기 전 셸 실행 → 출력으로 치환 / 모델은 명령이 아닌 실제 데이터를 받음 (예: !`gh pr diff`)"
      - "인자 치환: $ARGUMENTS=인자 전체, $1·$2=따옴표 규칙대로 쪼갠 위치 인자 / \\$1로 리터럴 $ 이스케이프"
      - "치환은 원본에 1회만 — 출력 속 자리표시자는 재확장 안 됨 / 인라인 !는 줄 앞·공백 뒤만 인식, 여러 줄은 ```! 블록"
    source: "https://code.claude.com/docs/en/slash-commands"

  - category: ai
    title: "이미지로 대화하기 — 스크린샷·목업·다이어그램을 컨텍스트로 넣기"
    summary: >
      Claude Code는 터미널 CLI지만 이미지를 컨텍스트로 받는다. 넣는 방법은 셋 — 창에 드래그 앤 드롭,
      `ctrl+v`로 붙여넣기(맥에서도 `cmd+v`가 아니라 `ctrl+v`다), 또는 경로를 직접 주기("이 이미지 분석해줘: /path/to/image.png").
      에러 스크린샷을 던지며 "이거 왜 나는 거야?"라고 묻거나, 디자인 목업을 주고 "이걸 만드는 CSS 짜줘",
      DB 스키마 다이어그램을 주고 "새 기능에 맞게 어떻게 고칠까?"처럼 텍스트로 설명하기 번거로운 맥락을 그림 하나로 전달할 수 있다.
      한 대화에서 이미지 여러 개를 다룰 수 있고, Claude가 답에서 `[Image #1]`처럼 가리키면 그 링크를 맥에서 `Cmd+Click`(윈도·리눅스는 `Ctrl+Click`)해 기본 뷰어로 연다.
    points:
      - "넣는 법 3가지: 드래그 앤 드롭 / ctrl+v 붙여넣기(맥도 cmd+v 아님) / 경로 직접 전달"
      - "용도: 에러 스크린샷·UI 목업·다이어그램·스키마 — 텍스트로 설명하기 번거로운 맥락을 그림으로 / 목업→CSS·HTML 생성도 가능"
      - "한 대화에 이미지 여러 개 / 답의 `[Image #1]` 링크는 Cmd+Click(맥)·Ctrl+Click(윈·리눅스)으로 뷰어에서 열기"
    source: "https://code.claude.com/docs/en/common-workflows"

  - category: ai
    title: "/branch — 대화를 통째로 복제해 다른 접근을 따로 시도하기"
    summary: >
      세션 중 다른 방법을 실험하고 싶지만 지금까지의 대화 흐름은 잃고 싶지 않을 때 `/branch`를 쓴다.
      `/branch try-streaming-approach`처럼 치면 그 시점까지의 대화를 복제한 새 가지로 옮겨 가고, 원본 세션은 그대로 남아 세션 피커에 보존된다.
      CLI에서는 `claude --continue --fork-session`처럼 `--fork-session`을 붙여 같은 효과를 낸다. `/branch` 확정 시 새 가지와 원본 두 개의 세션 ID가 찍히며, 원본으로 돌아가려면 그 ID나 이름을 `/resume`에 넘긴다.
      단 "이 세션 동안 허용"으로 승인한 권한은 새 가지로 넘어가지 않는다. 한편 포크 없이 두 터미널에서 같은 세션을 동시에 이어가면 양쪽 메시지가 한 트랜스크립트에 뒤섞이니 주의.
      코드까지 되감는 건 별개의 체크포인트/rewind 기능이다 — `/branch`는 대화 트리를 가르는 쪽이다.
    points:
      - "`/branch [이름]`: 그 시점까지 대화를 복제한 새 가지로 이동, 원본은 피커에 그대로 / CLI는 --fork-session"
      - "포크·rewind·--fork-session으로 만든 가지는 세션 피커에서 root 세션 아래 묶여 표시(→로 펼침)"
      - "'이 세션 허용' 권한은 새 가지로 미승계 / 포크 없이 두 터미널에서 같은 세션 이어가면 트랜스크립트 뒤섞임"
    source: "https://code.claude.com/docs/en/sessions"

  - category: ai
    title: "셸 모드 — 프롬프트 앞에 `!`로 명령 실행하고 출력까지 컨텍스트에 넣기"
    summary: >
      입력 프롬프트 맨 앞에 `!`를 치면 셸 모드로 들어간다. 여기서 친 명령은 Claude가 해석하거나
      승인 절차를 거치지 않고 바로 실행되며, 실행한 명령과 그 출력이 둘 다 대화 컨텍스트에 추가된다.
      즉 `!npm test` 한 줄이면 결과가 모델 눈앞에 그대로 쌓여, 이어서 "이 실패 고쳐줘"처럼 바로 물어볼 수 있다.
      실행 중에는 실시간 진행 출력이 보이고, 오래 걸리는 명령은 `Ctrl+B`로 백그라운드로 돌릴 수 있다.
      입력 중 `Tab`을 누르면 과거 명령 기반 자동완성이 뜨고, 셸 모드는 `Escape`·`Backspace`·`Ctrl+U`로 빠져나온다.
    points:
      - "프롬프트 맨 앞 `!` → 셸 모드 / 명령은 Claude 해석·승인 없이 즉시 실행, 명령과 출력이 모두 컨텍스트에 추가"
      - "실시간 진행 출력 표시 / 긴 명령은 Ctrl+B로 백그라운드 전환, Tab은 과거 명령 기반 자동완성"
      - "Escape·Backspace·Ctrl+U로 셸 모드 종료 / 슬래시 커맨드 파일의 `!`명령``(미리 실행해 치환)과는 별개"
    source: "https://code.claude.com/docs/en/interactive-mode"

  - category: ai
    title: "MCP 설치 스코프 — local·project·user 셋 중 어디에 서버를 둘지"
    summary: >
      MCP 서버는 세 스코프 중 하나로 설치하고, 스코프가 '어느 프로젝트에서 뜨는지'와 '팀과 공유되는지'를 결정한다.
      기본값인 local은 추가한 그 프로젝트에서만 뜨고 내게만 보이며 `~/.claude.json`에 저장돼 버전 관리에 안 올라간다 — 개인용·실험용·자격증명 든 서버에 쓴다.
      project는 프로젝트 루트의 `.mcp.json`에 저장돼 버전 관리로 팀 전체가 같은 도구를 공유하고, user는 `~/.claude.json`에 저장돼 내 모든 프로젝트에서 뜬다.
      `claude mcp add --transport http <이름> --scope project <url>` 식으로 스코프를 지정한다.
      보안상 `.mcp.json`의 project 스코프 서버는 쓰기 전에 승인을 받고, 승인 선택을 초기화하려면 `claude mcp reset-project-choices`를 쓴다.
    points:
      - "local(기본·`~/.claude.json`·그 프로젝트만·비공유) / project(`.mcp.json`·버전관리로 팀 공유) / user(`~/.claude.json`·내 모든 프로젝트)"
      - "지정: `claude mcp add --transport http <이름> --scope project <url>` / local 스코프는 일반 로컬 설정(.claude/settings.local.json)과 다른 ~/.claude.json에 저장"
      - "project 서버는 보안상 쓰기 전 승인 필요 / `claude mcp reset-project-choices`로 승인 선택 초기화"
    source: "https://code.claude.com/docs/en/mcp"

  - category: ai
    title: "Claude를 정기 실행하는 4가지 — 어디서 도느냐로 고른다"
    summary: >
      Claude Code로 PR 리뷰·의존성 점검·CI 실패 확인 같은 일을 주기적으로 돌리는 방법은 네 가지이고,
      고르는 기준은 '어디서 도느냐'다. Routines는 Anthropic 관리 인프라에서 돌아 내 컴퓨터가 꺼져 있어도 실행되고,
      일정뿐 아니라 API 호출·GitHub 이벤트로도 트리거된다(claude.ai/code/routines에서 설정).
      Desktop scheduled tasks는 데스크톱 앱이 내 머신에서 돌려서 로컬 파일·커밋 안 된 변경에 직접 접근해야 할 때 쓴다.
      GitHub Actions는 CI 파이프라인에서 돌아 열린 PR 같은 레포 이벤트나 워크플로 설정 옆에 둘 cron에 맞는다.
      `/loop`는 지금 열려 있는 CLI 세션 안에서 가볍게 폴링하는 용도로, 새 대화를 시작하면 멈추지만 만료 전이면 `--resume`/`--continue`로 되살아난다.
    points:
      - "Routines = Anthropic 인프라(컴퓨터 꺼져도 실행) / 일정·API 호출·GitHub 이벤트 트리거 — claude.ai/code/routines"
      - "Desktop scheduled tasks = 데스크톱 앱·내 머신(로컬 파일·미커밋 변경 접근) / GitHub Actions = CI 파이프라인(레포 이벤트·cron)"
      - "`/loop` = 현재 CLI 세션 폴링 / 새 대화 시작 시 중단, 만료 전이면 --resume·--continue로 복원 / 자동 실행 프롬프트엔 성공 기준·결과 처리를 명시"
    source: "https://code.claude.com/docs/en/common-workflows"

  - category: ai
    title: "커스텀 커맨드 인자 — $ARGUMENTS 한 덩어리 vs 위치 인자로 쪼개 받기"
    summary: >
      커스텀 슬래시 커맨드(이제 스킬과 통합)는 호출할 때 넘긴 인자를 본문에 끼워 넣을 수 있다.
      `$ARGUMENTS`는 입력 전체를 타이핑한 그대로 한 덩어리로 받는다 — 본문에 `$ARGUMENTS`가 없으면 끝에 `ARGUMENTS: <값>`이 자동으로 붙는다.
      여러 인자를 따로 받고 싶으면 `$ARGUMENTS[N]` 또는 짧게 `$N`을 쓰는데, 인덱스는 0부터다 — `$0`이 첫 번째, `$1`이 두 번째다(셸의 $1과 헷갈리기 쉬움).
      인덱스 인자는 셸식 따옴표 규칙을 따라서 여러 단어를 한 인자로 넘기려면 `"hello world"`처럼 감싸야 하고, 산문 속 `\$1.00` 같은 리터럴 $는 백슬래시로 이스케이프한다.
    points:
      - "`$ARGUMENTS` = 입력 전체 한 덩어리(타이핑 그대로) / 본문에 없으면 끝에 `ARGUMENTS: <값>` 자동 추가"
      - "`$ARGUMENTS[N]`·`$N` = 위치별 인자, 인덱스 0부터 — `$0`=첫째, `$1`=둘째(셸 $1과 다름) / 프런트매터 `arguments`로 이름 붙은 위치 인자도 선언 가능"
      - "여러 단어 한 인자는 `\"...\"`로 감싸기 / 산문의 리터럴 `$`는 `\\$1.00`처럼 백슬래시로 이스케이프"
    source: "https://code.claude.com/docs/en/slash-commands"

  - category: ai
    title: "커스텀 서브에이전트 만들기 — 자주 쓰는 일꾼을 파일로 굳히기"
    summary: >
      같은 지시를 가진 일꾼을 매번 새로 띄우게 된다면, 그걸 커스텀 서브에이전트로 파일에 굳힌다.
      서브에이전트는 YAML 프런트매터 + 본문(시스템 프롬프트)으로 된 마크다운 파일이고, `name`과 `description` 둘만 필수다.
      `tools`(허용 도구 allowlist)·`disallowedTools`(차단 denylist)·`model`로 권한과 모델을 좁히는데, model에 `inherit`을 주면 메인 대화와 같은 모델을 쓴다.
      Claude는 작업이 들어오면 각 서브에이전트의 `description`을 보고 위임할지 판단하므로, description은 페르소나가 아니라 '언제 이걸 쓰는지'를 또렷이 적어야 한다.
      저장 위치는 프로젝트용 `.claude/agents/`(버전 관리로 팀 공유)와 개인용 `~/.claude/agents/`(내 모든 프로젝트)가 있고, `/agents` 명령으로 가이드 따라 만들고 관리한다.
    points:
      - "마크다운 + YAML 프런트매터, 필수는 `name`·`description`뿐 / 본문이 시스템 프롬프트 / `/agents`로 생성·편집·삭제"
      - "도구 좁히기: `tools`(allowlist) 또는 `disallowedTools`(denylist) / `model: inherit`로 메인 대화 모델 따라가기"
      - "위치·우선순위: managed(1·조직) > --agents 플래그(2·세션) > `.claude/agents/`(3·프로젝트, 팀 공유) > `~/.claude/agents/`(4·내 전체) > 플러그인(5)"
    source: "https://code.claude.com/docs/en/sub-agents"

  - category: ai
    title: "@로 파일·디렉터리 참조 — Claude가 읽기를 기다리지 않고 내용을 미리 넣기"
    summary: >
      프롬프트에 `@`를 쓰면 Claude가 Read 도구로 파일을 찾아 읽기를 기다리지 않고, 그 자리에 내용을 바로 끼워 넣을 수 있다.
      `@src/utils/auth.js`처럼 파일을 가리키면 그 파일 전체 내용이 대화에 포함되고, `@src/components`처럼 디렉터리를 가리키면 내용이 아니라 그 안의 파일 목록(파일 정보 포함)이 들어온다.
      중요한 부가 효과 하나 — `@`로 파일을 참조하면 그 파일이 있는 디렉터리와 상위 디렉터리들의 `CLAUDE.md`도 함께 컨텍스트에 딸려 붙는다(그 하위트리 규칙을 자동으로 끌어옴).
      경로는 상대·절대 둘 다 되고, 한 메시지에서 여러 개를 동시에 참조할 수 있다(예: "@file1.js and @file2.js").
      같은 `@` 문법으로 연결된 MCP 서버의 리소스(`@server:resource`)도 끌어올 수 있다.
    points:
      - "`@파일경로` = 파일 전체 내용을 그 자리에 인라인(Read 기다릴 필요 없음) / `@디렉터리` = 내용 아닌 파일 목록(파일 정보 포함)"
      - "부가 효과: `@`로 파일 참조 시 그 파일 디렉터리+상위 디렉터리의 CLAUDE.md도 함께 컨텍스트에 추가"
      - "상대·절대 경로 모두 가능 / 한 메시지에 여러 개(`@file1.js and @file2.js`) / `@server:resource`로 MCP 리소스도 동일 문법으로 참조"
    source: "https://code.claude.com/docs/en/common-workflows"

  - category: ai
    title: "원격 MCP 서버 인증 — /mcp로 OAuth 2.0 로그인하기"
    summary: >
      Sentry·Notion 같은 클라우드 MCP 서버는 대개 인증을 요구하는데, Claude Code는 OAuth 2.0을 지원한다.
      `claude mcp add --transport http <이름> <url>`로 서버를 붙인 뒤 Claude 안에서 `/mcp`를 실행하면 브라우저가 열려 로그인 흐름이 진행된다.
      서버가 `401 Unauthorized`나 `403 Forbidden`을 돌려주면 Claude Code가 그 서버를 '인증 필요'로 표시하고 `/mcp`에서 OAuth 흐름을 밟게 해준다.
      발급된 토큰은 안전하게 저장되고 자동으로 갱신되며, 접근을 끊으려면 `/mcp` 메뉴의 "Clear authentication"을 쓴다.
      브라우저 리다이렉트가 연결 오류로 실패하면 주소창의 콜백 URL 전체를 Claude의 URL 프롬프트에 붙여 넣으면 된다.
    points:
      - "흐름: `claude mcp add --transport http <이름> <url>` → Claude 안에서 `/mcp` 실행 → 브라우저 로그인 / 401·403 응답 시 자동으로 '인증 필요' 표시"
      - "토큰은 안전 저장·자동 갱신 / 접근 해제는 `/mcp` 메뉴의 \"Clear authentication\" / OAuth는 HTTP 서버에서 동작"
      - "사전 등록 리다이렉트 URI가 필요하면 `--callback-port`로 포트 고정(`http://localhost:PORT/callback`) / DCR 미지원 서버는 `--client-id`·`--client-secret`로 자격증명 직접 제공"
    source: "https://code.claude.com/docs/en/mcp"

  - category: ai
    title: "claude --from-pr — PR에 묶인 그 작업 세션으로 곧장 되돌아가기"
    summary: >
      `gh pr create`로 PR을 만들면 그때 돌던 세션이 그 PR에 자동으로 연결된다.
      나중에 그 PR 작업을 이어가려면 `claude --from-pr <번호>`로 곧장 연결된 세션을 되살리거나, PR URL을 `/resume` 피커 검색창에 붙여 넣어 찾는다.
      피커는 GitHub·GitHub Enterprise·GitLab·Bitbucket의 pull/merge request URL을 받아 그에 연결된 세션을 짚어 준다.
      디렉터리 단위로 흩어진 여러 세션 중 "어느 게 이 PR 작업이었지?"를 헤매지 않고, PR 하나를 키로 삼아 대화·컨텍스트를 그대로 복원하는 워크플로다.
    points:
      - "`gh pr create`로 PR 생성 시 그 세션이 PR에 자동 연결 — 별도 설정 불필요"
      - "복원: `claude --from-pr <번호>` 또는 `/resume` 피커 검색창에 PR URL 붙여넣기"
      - "피커는 GitHub·GitHub Enterprise·GitLab·Bitbucket의 PR/MR URL을 받아 연결 세션을 찾아줌"
    source: "https://code.claude.com/docs/en/common-workflows"

  - category: ai
    title: "--json-schema — claude -p 출력을 스키마에 맞춰 받아 스크립트로 바로 파싱"
    summary: >
      `claude -p`를 스크립트에서 쓸 때 자유 텍스트 답을 정규식으로 긁는 대신, 출력 형태를 JSON 스키마로 못박을 수 있다.
      `--output-format json`에 `--json-schema '<JSON Schema>'`를 같이 주면, Claude의 구조화된 결과가 응답의 `structured_output` 필드에 그 스키마 형태로 담겨 온다(`result`엔 텍스트, 그 외 session ID·usage 같은 메타데이터도 함께).
      예컨대 `{"type":"object","properties":{"functions":{"type":"array","items":{"type":"string"}}},"required":["functions"]}` 스키마를 주고 "auth.py의 함수 이름 뽑아줘"라고 하면, 함수명 배열이 구조화돼 돌아온다.
      받은 다음엔 `jq '.structured_output'`로 그 필드만 꺼내 후속 처리에 넘기면 된다. CI·배치 파이프라인에서 LLM 출력을 안정적으로 소비하기 좋은 방식이다.
    points:
      - "`--output-format json` + `--json-schema '<스키마>'` → 결과가 응답의 `structured_output` 필드에 스키마 형태로 담김"
      - "응답엔 텍스트(`result`)·session ID·usage 등 메타데이터도 함께 / `jq '.structured_output'`로 해당 필드만 추출"
      - "자유 텍스트 파싱(정규식) 대신 형태를 못박아 CI·배치에서 LLM 출력을 안정적으로 소비"
    source: "https://code.claude.com/docs/en/headless"

  - category: ai
    title: "Superpowers — 스킬을 엮어 만든 '개발 방법론' 프레임워크"
    summary: >
      Superpowers(obra/superpowers)는 단일 스킬이 아니라, 개발 생명주기를 강제 워크플로로 엮은 오픈소스 프레임워크다(MIT).
      바로 코딩에 뛰어들지 않고 "정말 뭘 하려는 건지" 되묻는 브레인스토밍으로 시작해 스펙을 함께 다듬고,
      그다음 워크트리 격리 → 잘게 쪼갠 구현 계획 → 서브에이전트가 작업당 하나씩 도는 2단계 리뷰(스펙 준수 → 코드 품질) → TDD → 코드리뷰 → 브랜치 마무리로 이어진다.
      README는 이걸 "제안이 아니라 강제 워크플로(Mandatory workflows, not suggestions)"라고 못박고, 스킬은 별도 조작 없이 자동 트리거된다고 설명한다.
      Claude Code뿐 아니라 Codex·Gemini CLI·Factory Droid·OpenCode·Cursor·Copilot CLI 등 여러 하네스에 각각 설치할 수 있다.
    points:
      - "단일 스킬이 아닌 개발 생명주기 강제 워크플로 묶음 — 브레인스토밍→워크트리→계획→서브에이전트 실행→TDD→리뷰→마무리"
      - "원칙: TDD 먼저·항상 / 추측보다 체계 / 복잡도 축소 / 주장보다 증거(검증 후 완료 선언)"
      - "Claude Code 설치: `/plugin install superpowers@claude-plugins-official` — Codex·Gemini·Droid 등 하네스별 설치법 별도 제공"
    source: "https://github.com/obra/superpowers"

  - category: ai
    title: "Cline — 모델에 안 묶인 오픈소스 코딩 에이전트"
    summary: >
      Cline(cline/cline)은 IDE·터미널에서 도는 오픈소스 자율 코딩 에이전트다(Apache-2.0, GitHub 63.3k★).
      Claude Code가 Anthropic 모델 중심인 것과 달리 '모델에 안 묶인' 게 핵심 — Anthropic(Opus·Sonnet·Haiku)뿐 아니라
      OpenAI·Gemini·OpenRouter·Bedrock·Vertex, 그리고 Ollama·LM Studio 같은 로컬 모델까지 어떤 OpenAI 호환 API든 붙는다.
      VS Code 확장, JetBrains 플러그인(IntelliJ·PyCharm·WebStorm 등), 그리고 CI/CD용 헤드리스 모드까지 갖춘 CLI로 실행된다.
      Plan 모드(탐색·전략 수립)와 Act 모드(실행)를 토글하고, 편집마다 승인을 받거나 자동 승인으로 풀 수 있다 — 모델을 갈아끼우거나 플랫폼 마진을 피하고 싶을 때의 대표적 대안이다.
    points:
