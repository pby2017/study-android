- category: ai
  title: 하이브리드 검색(BM25+벡터) — RAG의 프로덕션 기본값, RRF 퓨전으로 키워드 정밀도+시맨틱 리콜 통합
  summary: '하이브리드 검색은 BM25(키워드)와 벡터(시맨틱)를 병렬 실행 후 하나의 랭킹으로 퓨전하는 아키텍처다. 2026년 RAG 프로덕션의 사실상 기본값. Reciprocal Rank Fusion(RRF, k=60)이 표준 퓨전 방법으로 점수 스케일 차이 문제를 순위 기반으로 해결. Elasticsearch·OpenSearch·Qdrant·Weaviate·Pinecone이 네이티브 지원. 최적화: RRF 베이스라인 → 레이블 데이터 있으면 convex combination → cross-encoder 리랭커 추가.

    '
  points:
  - 'RRF(k=60): 순위 기반 퓨전, 점수 스케일 무관'
  - '네이티브 지원: Elasticsearch·Qdrant·Weaviate·Pinecone'
  - '최적화: RRF → alpha 퓨전 → cross-encoder 리랭커'
  source: https://tianpan.co/blog/2026-04-12-hybrid-search-production-bm25-dense-embeddings
