  title: 'agentmemory: 코딩 에이전트 기억을 MCP 서버로 분리하기'
  summary: 'agentmemory는 Claude Code, Codex CLI, Copilot CLI, Cursor, Gemini CLI, OpenCode 같은 코딩 에이전트가 공유할 수 있는 지속 메모리 서버다. 같은 런에서 GitHub 23,739★, 1,952 forks, Apache-2.0, 최신 릴리스 v0.9.27(2026-06-07)을 확인했다. README 기준 핵심 구성은 MCP 서버, REST API, 에이전트별 hook/skill 연결, 53개 MCP 도구, 12개 자동 hook이다. 실무 교훈은 기억을 프롬프트 맨 위에 계속 붙이는 방식이 아니라, 검색·신뢰도·생명주기·지식 그래프를 가진 별도 도구 계층으로 빼야 반복 설명과 컨텍스트 낭비를 줄일 수 있다는 점이다.

    '
