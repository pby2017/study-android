- category: ai
  title: RigorBench — 코딩 에이전트 평가를 pass/fail에서 계획·검증·중단 품질로 넓히기
  summary: RigorBench(arXiv 2606.22678)는 코딩 에이전트를 최종 정답률만으로 보지 말고 실행 궤적 전체로 평가하자는 벤치마크다. 논문은 30개 작업을 Plan-Then-Build, Verify-Or-Die, Doom Loop Gauntlet, Know When to Fold, Don't Break the Build 5범주로 나누고, Planning Fidelity·Verification Coverage·Recovery Efficiency·Abstention Quality·Atomic Transition Integrity 5축을 RigorScore로 합친다. 교육 포인트는 간단하다. 테스트 통과 패치라도 계획 없이 여러 번 찔러 맞혔거나, 불가능한 요구에 멈추지 못했거나, 중간 상태마다 빌드를 깨면 운영용 에이전트로는 낮게 봐야 한다는 것이다. 저자들은 구조화된 discipline이 process quality를 평균 41%, outcome correctness를 17% 높였다고 보고한다.
  points:
  - '5축 평가: 계획·검증·회복·중단·원자적 전환'
  - 30개 작업·120개 실행 궤적을 계획/편집/테스트/복구 로그로 채점
  - '교훈: pass/fail 벤치마크 옆에 프로세스 로그 점수를 붙여야 production risk가 보임'
  source: https://arxiv.org/abs/2606.22678
- category: ai
  title: AgeMem — LTM·STM을 tool action으로 통합·step-wise GRPO
  summary: AgeMem(ACL 2026·arXiv 2601.01885·y1y5/AgeMem) — heuristic memory pipeline 대신 LLM agent policy에 memory operation을 tool-based action으로 통합. Add·Update·Delete(LTM) + Retrieve·Summary·Filter(STM) 6 tools — agent가 task structure에 맞게 store/retrieve/summarize/discard autonomously. three-stage progressive RL — LTM storage→STM context→full coordination, step-wise GRPO가 sparse·discontinuous memory reward를 prior decision에 backprop. 5 long-horizon benchmark에서 memory-augmented baseline 일관 outperform. vs Mem0(external DB) ·Memory Bank(markdown) ·mcp-memory-rs(local sync) — AgeMem=learnable unified memory policy not retrieval heuristic.
  points:
  - 6 memory tools — LTM persist + STM context in one action space
  - Step-wise GRPO — memory ops credit from final task reward
  - Progressive RL stages — fragmented experience across stages handled
  source: https://aclanthology.org/2026.acl-long.981/
- category: ai
  title: MemAct — Memory-as-Action·DCPO·51% token cut vs 16× model
  summary: MemAct(ACL 2026 Findings·arXiv 2510.12635·ADaM-BJTU/MemAct) — working memory management를 external heuristic이 아닌 learnable policy action으로. in-place context editing — delete·insert·summarize function-call actions, agent가 retention vs task reward trade-off end-to-end RL. Dynamic Context Policy Optimization(DCPO) — memory action 시 trajectory fracture에서 stable gradient, GRPO pipeline compatible. MemAct-RL-14B avg 8.2×10⁴ tokens vs Qwen3-235B 16.7×10⁴ — 51% context cut, accuracy matches 16× larger model. vs AgeMem(tool LTM+STM) ·context compaction heuristics — MemAct=in-place edit ops + DCPO for non-prefix histories.
  points:
  - Trajectory fracture — append-only context broken by edit actions
  - DCPO — segment history at curation points for stable RL
  - 51% token reduction — learned curation beats bigger model full history
  source: https://aclanthology.org/2026.findings-acl.956/
- category: ai
  title: HarnessX — composable evolvable harness foundry·AEGIS +14.5%
  summary: HarnessX(arXiv 2606.14249·Darwin-Agent/HarnessX·Xiaomi) — agent runtime harness(prompt·tools·memory·control flow)를 hand-crafted static이 아닌 composable·evolvable object로. typed harness primitives + substitution algebra, AEGIS meta-engine(Digester·Planner·Evolver·Critic)가 execution trace feedback으로 harness evolve. harness evolution + model co-evolution loop — trajectory→harness update + RL training signal. 5 benchmark(ALFWorld·GAIA·WebShop·τ³-Bench·SWE-bench Verified) avg +14.5% absolute(up to +44% Qwen3.5-9B ALFWorld). weakest baseline gains most — harness evolution complements model scaling. vs Harbor(eval adapter) ·MiMo Code(product harness) ·dynamic workflows(Claude JS) — HarnessX=trace-driven harness foundry research.
  points:
  - +44% weakest model — harness not model is bottleneck on low baseline
  - AEGIS 4-stage — trace→plan→evolve→critic closed loop
  - Co-evolution +4.7% — harness traces also train open-weight model
  source: https://arxiv.org/html/2606.14249
- category: ai
  title: Layer-Isolated Evaluation — production agent deterministic scaffold 238-case gate
  summary: Layer-Isolated Evaluation(arXiv 2606.11686·June 2026) — production LLM agent의 deterministic scaffold layer를 no-LLM regression-locked pytest harness로 per-layer gate. 238 locked baseline pure cases(~1ms/case) — aggregate pass rate masks layer-specific −25~−91pp regression crater. controlled injection proves green aggregate can hide foundational layer drift. layer-decomposed harness + coverage-honest baseline = drift detector not outcome oracle. vs AgentProp-Bench(propagation math) ·Braintrust(trace eval) ·mcp-eval(MCP server) — Layer-Isolated=deterministic production scaffold unit test without LLM in loop.
  points:
  - 238-case locked baseline — per-layer pure runner, legacy lane separate
  - Aggregate metric blind spot — −25pp localized while slice green
  - No-LLM harness — ~1ms/case, CI-friendly deterministic gate
  source: https://arxiv.org/html/2606.11686
- category: ai
  title: FIDES — Agent Framework information-flow labels·deterministic tool gate
  summary: FIDES Flow Integrity Deterministic Enforcement System(Microsoft Agent Framework·devblogs 2026-06·agent_framework.security experimental) — prompt injection defense를 heuristic system prompt 대신 information-flow control middleware. every content carries integrity(trusted/untrusted)·confidentiality(public/private) labels — labels propagate through tool calls automatically. PolicyEnforcementFunctionMiddleware blocks privileged sink(e.g. post_comment·write_file) when untrusted issue body still in scope — model can summarize but cannot act on poisoned input. approval_on_violation=True → human-in-loop function approval with violation reason. vs Claude Code sandbox ·Cedar AgentCore ·prompt injection guardrails — FIDES=deterministic label propagation not probabilistic classifier.
  points:
  - Label propagation — read_issue output tagged untrusted at return
  - Privileged sink block — deterministic before tool executes
  - Experimental middleware — agent_framework.security behind feature flag
  source: https://devblogs.microsoft.com/agent-framework/fides/
