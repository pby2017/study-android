  - category: ai
    title: "OpenAI가 SWE-bench Verified를 버렸다 — '실패한 테스트 중 59%가 결함, 모델이 정답을 외운다'며 공식 점수 보고 중단(2026-02)"
    summary: >
      2026년 2월, OpenAI의 Frontier Evals 팀은 코딩 에이전트 사실상 표준 지표였던 SWE-bench Verified의 점수 보고를 중단한다고 공식 발표했다(OpenAI 주장).
      이유는 두 가지다. ① 결함 있는 테스트 — 자주 실패하던 어려운 문제 일부(전체의 약 27.6%)를 감사했더니, 기능적으로 맞는 답을 거부하는 결함 테스트가 그중 약 59.4%였다(문제 설명에 없는 정확한 함수명을 요구하거나, 무관한 동작을 검사).
      ② 학습 데이터 오염 — Django·Astropy 등 유명 오픈소스 파이썬 레포에서 문제를 뽑은 탓에, 주요 프런티어 모델들이 '태스크 ID'만 주면 정답 패치를 그대로 재현했다(OpenAI 주장).
      결론은 "Verified 점수 개선은 더 이상 실제 개발 능력 향상이 아니라 '벤치를 얼마나 학습 때 봤는가'를 반영한다"이며, OpenAI는 비공개·카피레프트로 오염이 덜한 SWE-bench Pro로의 전환을 권한다.
    points:
      - "교훈 — 굿하트의 법칙: 지표가 목표가 되면 지표이길 멈춘다. AI 코딩 도구를 'Verified 80%' 같은 단일 숫자로 고르지 말 것"
      - "수치 격차(보도된 OpenAI 감사값) — Verified ~80%대 모델이 오염에 강한 SWE-bench Pro 공개셋에선 ~23%로 급락. 감사 표본은 64회 독립 실행·138문항"
      - "실무 — 사내 도구 평가는 공개 벤치 대신 '우리 비공개 레포로 만든 자체 태스크'를 쓰는 게 오염·과적합을 피하는 길. OpenAI도 전문가가 원본 태스크를 짜는 GDPVal 류로 투자 이동"
    source: "https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/"
  - category: ai
    title: "Codebuff(CodebuffAI) — '한 모델'이 아니라 파일선택·계획·편집·검토 4개 에이전트가 분업하는 오픈소스 코딩 에이전트(Apache-2.0·~6.5k★)"
    summary: >
      Codebuff는 자연어 지시로 코드베이스를 고치는 오픈소스 AI 코딩 에이전트로, 단일 모델에 다 맡기는 대신 역할이 다른 에이전트 여러 개가 협업하는 구조를 핵심으로 내세운다(README 주장).
      예컨대 '인증 추가' 같은 작업이 들어오면 ① File Picker가 레포를 훑어 아키텍처를 파악하고 관련 파일을 찾고 ② Planner가 어떤 파일을 어떤 순서로 고칠지 계획하고 ③ Editor가 정밀 편집을 하고 ④ Reviewer가 변경을 검증한다.
      이렇게 나누면 단일 모델 도구보다 컨텍스트 이해가 낫고 편집이 정확하며 오류가 적다는 게 프로젝트의 설명이다.
      CLI(`npm i -g codebuff`)뿐 아니라 SDK(`@codebuff/sdk`)로 에이전트를 프로덕션에 임베드할 수 있고, `/init`를 돌리면 knowledge.md와 `.agents/` 디렉터리(TypeScript 타입 정의)가 생겨 자기만의 커스텀 에이전트를 정의할 수 있다.
    points:
      - "핵심 구조 — File Picker(탐색)→Planner(계획)→Editor(편집)→Reviewer(검증) 분업. '서브에이전트로 컨텍스트를 나눠 오염을 막는' 멀티에이전트 패턴을 도구 자체가 기본값으로 박아둠"
      - "확장 — CLI와 SDK 둘 다 제공(SDK로 앱에 코딩 에이전트 임베드). `/init`로 .agents/ TS 정의를 만들어 에이전트 행동을 직접 커스터마이즈, 광고 기반 무료판 Freebuff도 별도 존재"
      - "사실 — github.com/CodebuffAI/codebuff, Apache-2.0, ~6.5k★. '단일 모델보다 낫다'는 정확도 우위는 벤치 수치가 아니라 프로젝트 주장이니 도입 전 자체 검증 권장"
    source: "https://github.com/CodebuffAI/codebuff"
  - category: ai
    title: "CodeRabbit '인간 vs AI 코드' 리포트 — AI가 짠 PR이 결함 1.7배(PR당 10.83 vs 6.45건), '리뷰를 줄이지 말고 늘려라'"
    summary: >
      AI 코드리뷰 도구를 만드는 CodeRabbit가 2025년 12월 17일 발표한 'State of AI vs Human Code Generation' 리포트는, 오픈소스 PR을 자사 리뷰 엔진으로 분석해 AI가 관여한 코드가 사람만 짠 코드보다 결함이 더 많다고 보고했다.
      핵심 수치는 AI-coauthored PR이 PR당 평균 10.83건의 문제를, 사람만 짠 PR은 6.45건을 내 약 1.7배 차이가 났다는 것.
      유형별로는 가독성 문제가 약 3.15배로 가장 크게 벌어졌고, 로직·정확성 결함이 늘었으며 보안 취약점도 1.5~2배대로 증가했다.
      함의는 분명하다 — AI로 '쓰는 시간'은 줄지만 '찾아 고치는 시간'이 늘어나므로, AI 도입 효과는 리뷰·검증 자동화를 함께 깔았는지에 달려 있다(리포트는 당연히 자사 도구에 유리한 프레이밍이니 숫자는 한 벤더의 주장으로 받아들일 것).
    points:
      - "수치(CodeRabbit 주장) — AI 관여 PR 10.83건/PR vs 사람 6.45건/PR ≈ 1.7배. 가독성 ~3.15배, 로직 결함 증가, 보안 1.5~2배대. 자사 리뷰 엔진으로 오픈소스 PR을 분석한 결과"
      - "실무 교훈 — 'AI가 짰으니 리뷰 덜 해도 된다'는 정반대. AI 코드일수록 자동 코드리뷰(claude-code-security-review·Bugbot·/code-review 등)와 테스트 게이트를 PR 단계에 강제하라"
      - "측정 — ROI를 보려면 'AI 작성 코드 비율 / PR당 결함 수 / 보안 발견 수'를 같이 추적. 도입률만 보면 품질 꼬리(review tail)가 숨는다. 단일 벤더 수치이니 사내 데이터로 교차검증"
    source: "https://www.businesswire.com/news/home/20251217666881/en/CodeRabbits-State-of-AI-vs-Human-Code-Generation-Report-Finds-That-AI-Written-Code-Produces-1.7x-More-Issues-Than-Human-Code"
  - category: ai
    title: "Cursor 3 'Glass'(2026-04-02) — 사이드 'Composer'를 접고, 로컬·worktree·클라우드·SSH 에이전트를 한 'Agents Window'에서 병렬로 돌리는 IDE"
    summary: >
      Cursor가 2026년 4월 2일 내놓은 3.0('Glass')은 모델이 아니라 'IDE의 모양'을 바꾼 릴리스다. 2024년부터 Cursor를 정의하던 사이드 패널 Composer 대신, 에이전트를 1급 시민으로 두는 별도 표면 'Agents Window'가 중심이 됐다.
      공식 체인지로그에 따르면 Agents Window(Cmd+Shift+P → Agents Window)는 에이전트 여러 개를 "로컬·git worktree·클라우드·원격 SSH"에서 동시에 돌릴 수 있고, 기존 에디터로 되돌아가거나 둘을 같이 켤 수도 있다.
      실무 핵심은 두 슬래시 커맨드다. /worktree는 변경을 격리하는 별도 worktree를 만들고, /best-of-n은 같은 작업을 여러 모델에 각자 worktree로 병렬 시켜 결과를 비교한다.
      에디터 안의 기존 worktree/best-of-n 선택 UI는 폐기됐고, 클라우드 에이전트는 에디터에서 빠져 Agents Window로 옮겨졌다. 브라우저 UI 요소를 집어 에이전트에 피드백하는 Design Mode(⌘+Shift+D), 백그라운드 작업 완료를 기다리는 Await 도구도 함께 들어왔다.
    points:
      - "구조 변화 — 사이드 패널 Composer(UI) → Agents Window(병렬 에이전트 표면). 단 in-house 코딩 모델 'Composer 2'는 그대로 남음(UI 이름과 모델 이름을 구분할 것)"
      - "병렬 격리 — /worktree로 변경 격리, /best-of-n으로 한 작업을 여러 모델·각자 worktree에 돌려 'best one' 고르기. 클라우드 에이전트는 이제 Agents Window 전용"
      - "도입 — 기존 구독자 무료 업데이트, Agents Window·Composer 2·worktree는 Pro/Pro+/Ultra/Teams에서 제공(가격·플랜 범위는 Cursor 공지 기준)"
    source: "https://cursor.com/changelog/3-0"
  - category: ai
    title: "Continue(continuedev) 2.0 — 33.7k★ 오픈소스 IDE 에이전트가 '최종 릴리스 후 read-only'로 보관됨, 또 하나의 OSS 코딩 에이전트 종료 사례"
    summary: >
      Continue는 VS Code·JetBrains·CLI로 제공되던 대표적 오픈소스 코딩 에이전트(Apache-2.0·~33.7k★)다. 2023년 'Claude Dev'류 초기 OSS 에이전트 물결의 일원으로 자동완성·채팅·에이전트 모드·rules/MCP 허브를 무기로 성장했다.
      그러나 메인 레포(github.com/continuedev/continue)는 README가 명시하듯 "더 이상 능동적으로 유지보수되지 않으며 모든 사용자에게 read-only"가 됐다. 팀은 "VS Code 확장·CLI·JetBrains 플러그인의 최종 2.0.0 릴리스"를 내며 익명 텔레메트리 제거·인증 제거·버그 정리로 마무리했다.
      JetBrains 사용자에게는 "플러그인 대신 Continue CLI 사용"을 권한다. README 본문에는 활성 개발을 이어갈 명시적 후속 레포 링크가 없고, 코드베이스가 "다른 이들의 토대로 계속 쓰이길" 바란다고만 적었다.
      실무 시사점: Roo Code(Zoo Code로 부활)·Gemini CLI 차단 사례와 같은 결의 '오픈소스 에이전트는 메인테이너가 손을 떼면 어떻게 되나' 리스크다. 도구를 팀 워크플로에 박아 넣기 전, 라이선스만이 아니라 '유지보수 상태'를 봐야 한다.
    points:
      - "사실(README 인용) — 'continuedev/continue 레포는 더 이상 능동적으로 유지보수되지 않으며 모든 사용자에게 read-only'. VS Code/CLI/JetBrains 최종 2.0.0 릴리스로 텔레메트리·인증 제거 후 보관(Apache-2.0·~33.7k★)"
      - "권고 — JetBrains 플러그인 대신 Continue CLI(@continuedev/cli) 사용 권장. 본문엔 활성 개발을 이어갈 명시적 후속 레포 링크 없음('foundation for others'로 남기길 희망)"
      - "교훈 — OSS 에이전트 도입 시 스타 수·라이선스만 보지 말고 '유지보수 상태(archived/read-only 여부)'를 PoC 단계에서 확인. 종료돼도 포크·CLI 전환 경로가 있는지가 락인 리스크를 가른다"
    source: "https://github.com/continuedev/continue"
