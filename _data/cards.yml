  title: agent-browser — 브라우저 자동화를 AI 에이전트용 CLI로 얇게 빼기
  summary: 'Vercel Labs의 agent-browser는 AI 에이전트가 브라우저를 조작하기 위한 Rust 네이티브 CLI다. 2026-06-24 같은 런에서 GitHub 36,900★, 2,348 forks, Apache-2.0, 최신 릴리스 v0.29.0 (2026-06-21)을 확인했다. README 기준 핵심은 Playwright 스크립트를 매번 새로 짜는 것이 아니라 `snapshot`으로 접근성 트리와 `@e2` 같은 ref를 받고, `click`·`fill`·`get`·`screenshot`·`batch` 명령을 작은 도구 호출처럼 조합하는 것이다. Chrome for Testing을 내려받아 쓰고, 기존 Chrome, Brave, Playwright, Puppeteer 설치도 감지한다. 브라우저 상태 저장, 네트워크 route/HAR, 콘솔·에러, visual diff, React tree/Web Vitals까지 CLI 표면으로 노출하므로, 에이전트 브라우저 QA는 "비전으로 화면을 맞히기"보다 접근성 snapshot, 안정 ref, 재현 가능한 batch, 필요한 순간의 증거 캡처를 우선 설계하는 편이 낫다.

    '
