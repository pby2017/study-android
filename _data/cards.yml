  source: https://arxiv.org/abs/2605.20251
- category: ai
  title: AgentProp-Bench — tool parameter injection 62% propagate·judge κ=0.049
  summary: AgentProp-Bench(arXiv 2604.16706·agenthallu-bench repo) — tool-using agent error propagation with human-validated judge. 2000 task·2300 traces·4 domains·9 models·100 human labels. substring judge κ=0.049 vs human(chance); 3-LLM ensemble κ=0.432 moderate conservative bias. parameter injection→wrong final answer P≈0.62 human-calibrated(0.46–0.73 per model). rejection(catch bad param) vs recovery(fix after accept) independent capabilities(ρ=0.126). 3-layer runtime interceptor −23pp GPT-4o-mini, null on Gemini-2.0-Flash(95% schema rejection). vs ASSERT(policy eval) ·Braintrust(trace) — AgentProp=stage-conditional propagation math.
  points:
  - κ=0.049 substring judge — automated agent eval unreliable without validation
  - 62% propagation — one bad tool param often poisons final answer
  - Interceptor model-specific — schema gate strong models need different mitigation
  source: https://arxiv.org/abs/2604.16706
- category: ai
  title: AgentProcessBench — 8509 step label·ternary neutral·error propagation rule
  summary: AgentProcessBench(RUCBM·arXiv 2603.14465) — first step-level effectiveness benchmark for tool-augmented agent trajectories. 1000 trajectories·8509 human step annotations·89.1% IAA·ternary label(correct/neutral/erroneous). error propagation rule — post-error dependent steps labeled erroneous until explicit correction or independent subtask — prevents spurious credit. findings — weak models inflate correct-step ratio via early termination; neutral vs error distinction hard; process signal complements outcome supervision for test-time scaling. vs ProcCtrlBench(defect ontology) ·AgentProp(injection propagation) — AgentProcessBench=human step label ground truth.
  points:
  - 8509 step labels — not end-to-end pass rate only
  - Propagation rule — downstream steps don't get free credit after error
  - Early termination bias — weak models look better on step ratio
  source: https://arxiv.org/abs/2603.14465
