  title: MLflow — ML 실험 추적·모델 레지스트리·LLM 관측성까지, AI 엔지니어링의 사실상 표준(Apache-2.0·Linux Foundation)
  summary: 'MLflow는 Databricks가 만들고 Linux Foundation에 기증한 오픈소스 ML 플랫폼이다. 실험 추적(파라미터· 메트릭·아티팩트)·모델 레지스트리·배포까지 커버하고, 2026년 기준 LLM 관측성·프롬프트 최적화·AI Gateway도 추가됐다. Apache-2.0으로 셀프호스팅 비용 $0. W&B(SaaS, $50/user/mo)가 UX·협업·시각화 최강이라면, MLflow는 벤더 비종속·데이터 주권·비용 효율의 최적점. 10인 팀 기준 연 $6,000(W&B) vs ~$2,000(MLflow 인프라).

    '
  points:
  - 'Apache-2.0, Linux Foundation: 벤더 비종속, 셀프호스팅 $0'
  - 실험 추적 + 모델 레지스트리 + LLM 관측성 + AI Gateway
  - '비용: 10인 ~$2K/yr vs W&B ~$6K/yr'
  source: https://mlflow.org/
