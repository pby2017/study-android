- category: ai
  title: Autonoma — AI 에이전트가 자연어 시나리오를 실행하는 PR 테스트 플랫폼
  level: "중급"
  summary: 'Autonoma는 PR별 웹 미리보기에서 AI 에이전트가 자연어 E2E 시나리오를 실행하고, 실패 화면·영상·코드 근거를 리뷰에 남기는 테스트 플랫폼이다. 저장소에는 Appium으로 Android·iOS를 실행하는 `engine-mobile` 패키지도 있다. 다만 이 패키지는 배포 서비스가 아닌 라이브러리이며, 모바일 worker를 빌드·배포하는 workflow가 없다고 패키지 문서가 밝힌다. 따라서 모바일 코드가 있다는 사실만으로 현재 제품에서 Android 테스트를 사용할 수 있다고 보면 안 된다. 라이선스는 BSL 1.1이다.'
  points:
  - '주요 PR 흐름은 웹 preview에서 자연어 테스트를 실행하고, 영상·화면 캡처·의심 코드와 함께 결과를 리뷰'
  - '`engine-mobile`은 Appium 기반 Android/iOS 실행 라이브러리다. 문서상 모바일 worker를 빌드·배포하는 workflow는 없어 제품 지원과 구분해야 한다'
  - '도입 전 실제 모바일 실행 경로·기기 지원과 BSL 1.1 조건을 확인하고, AI의 self-healing이 실제 회귀를 숨기지 않는지 검토'
  source: https://github.com/Autonoma-AI/autonoma
  interview: "저장소에 Android Appium 코드가 있으면 Autonoma 제품이 Android PR 테스트를 지원한다고 말할 수 있나요?"
  answer: "아니다. `engine-mobile`의 실행 코드와 테스트만으로 제품에서 배포·실행된다는 증거가 되지 않는다. 모바일 worker의 빌드·배포 workflow, 공식 설정 문서, 실제 기기 실행 결과까지 확인한다."
- category: ai
  title: Luciq Companion + MCP — 모바일 운영 근거를 코딩 에이전트에 전달
  level: "중급"
  summary: 'Luciq Companion은 모바일 앱의 크래시·행(hang)·버그 신고 등 운영 신호를 묶어 원인 설명과 재현 단서를 제공한다. Luciq MCP는 이 관측 데이터를 호환 IDE의 AI 에이전트가 조회하도록 연결한다. MCP는 저장소 소스 코드나 SDK 설정을 읽지 않는다. 따라서 telemetry를 바탕으로 한 진단은 코드 자체의 증명이 아니다. Companion은 맥락을 코딩 에이전트로 넘길 수 있고, 별도 Autopilot은 PR 준비를 지원하므로 각 단계의 실제 권한과 결과를 구분해 검토한다.'
  points:
  - 'MCP는 크래시·발생 건·행·버그 신고·스토어 리뷰 등 5개 관측 영역에 걸친 10개 도구를 제공한다고 안내한다; Luciq 고객 전체에서 사용 가능하다는 안내도 확인한다'
  - 'MCP가 접근하지 않는 데이터: 저장소 소스 코드, SDK 설정, 계정·결제 정보; crash/bug 보고서에 이미 담긴 일부 개인정보는 예외일 수 있다'
  - 'Companion은 Claude/Cursor 등으로 context를 넘기고, Autopilot은 PR 준비 단계다. 진단·handoff·코드 변경·검증을 같은 기능으로 뭉뚱그리지 않는다'
  source: https://help.luciq.ai/en/articles/14727965-your-guide-to-luciq-mcp-server
  interview: "MCP에서 크래시 원인 설명을 받았다면, 그 결과만으로 수정 PR을 승인해도 될까요?"
  answer: "아니다. MCP 결과는 운영 telemetry이며 저장소 코드나 SDK 설정을 증명하지 않는다. 실제 앱 버전·기기·OS·스택·재현 조건을 코드와 대조하고, 변경 diff와 회귀 테스트를 별도로 검토한다. Autopilot이 PR을 준비했더라도 검증 책임은 남는다."
- category: ai
  title: Baidu Stability Analysis Agent — Android 크래시를 근거 기반으로 분석·수정하는 AI 도구
  level: "고급"
  summary: 'Baidu Stability Analysis Agent는 Android `logcat`·tombstone과 일치하는 심볼 파일을 분석해 호출 경로와 소스 문맥을 근거 사슬로 묶고, AI 수정안을 만들 수 있는 오픈소스 안정성 에이전트다. 코드 수정 때는 패치·작업 공간 경계를 확인하지만, 이 안전 검사는 크래시가 해결됐다는 뜻이 아니다. 빌드·재현·회귀 검증은 명시한 provider가 있을 때만 실행된다. 설정이 없으면 결과가 `repair_applied`일 수 있으며, 이는 수정이 적용됐다는 뜻이지 해결 증거가 아니다.'
  points:
  - 'native 주소는 해당 빌드와 일치하는 심볼 파일로 해석해야 함수·소스 위치와 호출 관계를 근거로 쓸 수 있음'
  - '수정 후 안전 검사는 변경 파일·workspace 경계·동기화를 확인; Crash 효과 검증은 별도 설정 필요'
  - '검증 후보 탐색은 명령을 실행하지 않는다. 명시적 profile/provider에 설정한 빌드·재현·회귀 검증이 통과해야 해결로 판정'
  source: https://github.com/baidu-maps/stability-analysis-agent
  interview: "수정된 Android 크래시가 `repair_applied` 상태로 끝났다면, 이를 ‘해결됨’으로 보고할 수 있나요?"
  answer: "아니다. 그 상태는 패치와 안전 검사가 끝났음을 뜻할 뿐, 앱에서 크래시가 사라졌다는 검증은 아니다. 해당 빌드의 심볼과 로그로 원인을 추적하고, 프로젝트에 맞는 빌드·재현·회귀 검증 profile을 설정해 통과 결과를 확인해야 한다."
