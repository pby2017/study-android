  title: Anthropic RSP v3.0 — Frontier Safety Roadmap·Risk Report, ASL-3/4 임계값(2026-02-24)
  summary: 'Anthropic Responsible Scaling Policy v3.0(2026-02-24 발효)은 재앙적 AI 위험 관리 자발적 프레임워크의 전면 개정이다. Frontier Safety Roadmap(보안·정렬·가드레일·정책 목표), 3~6개월마다 Risk Report(능력·위협모델·완화조치). Capability Threshold: CBRN 개발 uplift, AI R&D 2단계(입문 연구 자동화·scaling 가속). ASL-2(현행 Sonnet/Haiku)→ASL-3(Opus 4, Constitutional Classifiers++)→ASL-4(임계값 초과 시, 사전 공개 약속). v2 대비 일방적 pause 약속 축소, 투명성·자기보고 중심으로 전환.'
