  title: Trae AI IDE — ByteDance VS Code 포크, Claude·GPT-4o·DeepSeek 무료 티어·Builder/SOLO 모드
  summary: 'Trae는 ByteDance(TikTok 모회사)가 2025년 출시한 VS Code 포크 AI IDE. Builder Mode로 자연어 한 줄에서 프로젝트 생성, SOLO Mode로 에이전트 병렬 실행. Claude Sonnet 4·GPT-4o·DeepSeek R1·Gemini를 API 키 없이 내장. 2026년 freemium: 무료 5,000 autocomplete/월·10 fast+50 slow premium 요청, Lite $3~Ultra $100. Windsurf·Cursor와 경쟁하나 프라이버시(텔레메트리·5년 데이터 보관) 이슈 — 사이드 프로젝트·학습용 적합, 프로prietary 코드엔 부적합.'
