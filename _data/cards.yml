  title: 'AgenTest — MCP로 Android 앱을 탐색·조작하는 AI 보조 테스트 도구'
  level: "중급"
  summary: 'AgenTest는 MCP 서버를 통해 AI 에이전트가 실행 중인 Android 앱의 UI를 읽고, 탭·입력·스와이프와 기본 검증을 수행하도록 돕는다. Android emulator와 USB 연결 기기를 대상으로 하며, 앱 코드와 현재 UI를 참고해 에이전트가 테스트 흐름을 제안한다. `testID` 없이 탐색을 시작할 수 있지만, 생성된 시나리오가 매번 결정적으로 재현되는 테스트 스위트를 대신하지는 않는다. 화면 접근성 정보와 기기 상태에 의존하므로 회귀 테스트·CI에는 Maestro나 Appium 같은 명시적 테스트와 목적에 맞게 함께 평가한다.'
  points:
  - 'MCP 도구로 UI 트리 조회, 화면 조작, 스크린샷·Logcat 확인, 일부 네트워크 조건 설정 가능'
  - 'README의 ~80ms UI 트리 읽기는 helper APK 경로의 수치; gRPC 입력은 emulator 전용이고 다른 경로는 더 느림'
  - 'Native Android/Compose는 접근성 트리 기반; React Native·Flutter는 debug/release 빌드에 따라 제공 메타데이터가 다름'
  - 'SharedPreferences·SQLite 조회는 debug build에서 지원; 민감 정보와 실제 데이터에 대한 접근 권한을 통제'
  source: https://github.com/arjun-vegeta/agenTest
  interview: "AI가 UI를 보고 테스트를 생성하면 결정적 회귀 테스트를 대체할 수 있나요?"
  answer: "아니다. 에이전트가 현재 UI를 탐색해 빠르게 시나리오를 만들 수 있지만, 결과는 모델·화면·접근성 트리에 영향을 받을 수 있다. 반복 실행이 중요한 CI에는 버전 관리되는 Maestro/Appium 등의 테스트를 두고, AI 탐색은 새 흐름과 실패 원인을 찾는 보조 수단으로 쓴다."
- category: ai
  title: 'MobileSAM — SAM의 이미지 인코더를 경량화한 프롬프트 기반 분할 모델'
  level: "중급"
  summary: 'MobileSAM은 Meta의 Segment Anything Model(SAM)에서 큰 이미지 인코더를 Tiny-ViT로 바꾸고, 프롬프트 기반 마스크 디코더와 나머지 파이프라인은 유지하는 연구 모델이다. 논문은 Tiny-ViT 인코더 5M 파라미터와 단일 GPU에서 이미지당 약 12ms를 보고한다. 이 수치는 Android 기기에서의 속도나 제품 적합성을 뜻하지 않는다. Android 앱에 넣으려면 모델 변환·런타임 호환성, 메모리·발열, 입력 지연과 정확도를 목표 기기에서 별도로 측정해야 한다.'
  points:
  - '역할 분리: 이미지 인코더가 시각 특징을 만들고, prompt와 mask decoder가 분할 마스크를 생성'
  - '논문 수치: Tiny-ViT 5M, 단일 GPU에서 encoder 약 8ms + decoder 약 4ms; 모바일 실측과 구분'
  - '원본 SAM과 같은 파이프라인을 지향하지만, “모든 배포 환경에서 100% 호환”을 보장하는 뜻은 아님'
  - 'Android 적용 전 ONNX 등 내보내기 경로와 선택한 모바일 런타임·연산자 지원을 확인하고 실제 기기에서 프로파일링'
  source: https://arxiv.org/abs/2306.14289
  interview: "논문에서 MobileSAM의 이미지당 12ms를 보고했다면 Android 앱도 12ms로 동작한다고 예상해도 되나요?"
  answer: "아니다. 그 수치는 논문이 밝힌 단일 GPU 환경의 encoder와 decoder 처리시간이다. Android 기기의 칩, 런타임, 입력 해상도, 전처리·후처리와 카메라 파이프라인이 다르므로 목표 기기에서 end-to-end 지연, 메모리, 발열, 마스크 품질을 측정해야 한다."
- category: ai
  title: 'MediaPipe Tasks — Android에서 이미지·영상·실시간 스트림에 온디바이스 ML 적용'
  level: "중급"
  summary: 'MediaPipe Tasks는 이미지·오디오·텍스트 모델을 앱에서 실행하는 Google AI Edge SDK 모음이다. Vision Tasks에는 손·얼굴·포즈 랜드마커, 객체 감지, 분할 등이 있으며, Android에서는 모델 파일과 실행 모드(단일 이미지·영상·라이브 스트림)를 설정해 사용한다. CPU 또는 지원되는 GPU delegate를 선택할 수 있지만 처리 속도는 모델, 기기, 입력 크기, delegate 지원에 따라 달라진다. 실시간 카메라에서는 매 프레임을 처리할지, 바쁜 동안 오래된 프레임을 버려 최신 결과를 유지할지 실행 모드의 동작도 확인한다.'
  points:
  - 'Tasks API가 입력 전처리·LiteRT 추론·결과 후처리를 묶어 플랫폼별 실행 인터페이스 제공'
  - 'Android Vision 예: IMAGE는 단일 프레임, VIDEO는 타임스탬프가 있는 프레임, LIVE_STREAM은 비동기 결과 콜백'
  - 'GPU acceleration은 지원 delegate와 모델에 따라 설정; 고정 FPS나 NPU 자동 디스패치 보장은 아님'
  - '성능은 목표 기기에서 camera→preprocess→inference→postprocess 전체 경로로 측정하고 발열·프레임 드롭도 확인'
  source: https://developers.google.com/edge/mediapipe/solutions
  interview: "라이브 스트림 추론에서 매 카메라 프레임을 처리하는 것과 최신 결과를 유지하는 것의 차이는 무엇인가요?"
  answer: "동기식 VIDEO 모드는 프레임을 순서대로 처리할 수 있지만 입력이 처리 속도보다 빠르면 지연이 누적될 수 있다. LIVE_STREAM은 비동기이며 작업 중 들어온 입력 프레임을 버려 최신 결과를 우선할 수 있다. 정확한 동작과 타임스탬프 요구를 확인해 UI·카메라 파이프라인에 맞는 모드를 선택한다."
- category: ai
  title: 'Genkit Dart — Flutter UI와 Dart AI 백엔드의 흐름·타입을 함께 설계하기'
  level: "중급"
  summary: 'Genkit Dart는 Dart 서버와 Flutter 앱에서 생성형 AI 기능과 흐름을 만드는 Google의 오픈소스 프레임워크다. 안정 버전 1.0은 모델 호출, 스키마 기반 입출력, 도구 호출, 관찰 가능한 flow를 제공하고, 클라이언트는 원격 action으로 백엔드 flow를 호출할 수 있다. Flutter에서 직접 모델 API를 호출하는 방식도 가능하지만, 앱에 API 키를 넣으면 추출될 수 있으므로 공개 앱에서는 키와 민감한 프롬프트를 서버 측에 둔다. 에이전트 API 등 일부 기능은 현재 experimental이므로 안정 API와 구분한다.'
  points:
  - '공유 스키마: Dart 서버 flow와 Flutter 클라이언트가 요청·응답 타입을 맞추는 데 사용'
  - '배치 선택: `defineRemoteAction`은 서버 flow 호출, `defineRemoteModel`은 서버 proxy를 통해 모델 호출'
  - '모델 플러그인은 공통 generate API를 제공하지만, 제공자별 모델·인증·기능 차이는 확인 필요'
  - '1.0 안정 API와 `experimental.dart`의 에이전트·세션 기능을 구분하고, Developer UI로 flow와 trace를 점검'
  source: https://dart.dev/blog/announcing-genkit-dart-1-0
  interview: "Flutter 앱에서 Genkit 모델 호출을 직접 실행할 때 API 키를 앱에 포함해도 되나요?"
  answer: "공개 앱에는 비밀 키를 포함하면 안 된다. 앱 바이너리에서 키를 추출할 수 있으므로, 인증·권한·비용 제한을 적용한 백엔드가 모델 요청을 중계하게 한다. 클라이언트에 AI 로직이 있어도 비밀 정보와 민감한 프롬프트는 서버에 두는 설계를 검토한다."
- category: ai
  title: 'Sentry Seer — 모바일 텔레메트리와 코드 맥락으로 장애 원인 조사 보조'
  level: "중급"
  summary: 'Sentry는 Android·iOS·Flutter·React Native 등에서 오류, 크래시, ANR과 성능 문제를 수집하고 스택 트레이스, 디바이스·앱 상태, breadcrumbs, suspect commit을 연결해 조사하도록 돕는다. Seer는 이 운영 데이터와 코드 저장소 맥락을 사용해 원인 분석과 수정안을 제안하고 GitHub PR을 만들 수 있다. Sentry가 과거 공개한 94.5%는 Autofix 내부 평가의 root-cause 식별 수치이지, 모든 문제에서의 독립 검증 정확도나 수정 성공률이 아니다. 이벤트에 민감 정보가 들어가지 않도록 수집 항목과 마스킹도 설계한다.'
  points:
  - '조사 흐름: 사용자 영향·이벤트 → stack trace/breadcrumbs/device state → suspect commit·코드 맥락'
  - 'Seer는 원인과 수정안을 제안하고 PR 생성 지원; 제안은 개발자가 테스트·리뷰'
  - '94.5%는 Sentry가 내부 Autofix 평가에서 발표한 root-cause 수치; 같은 발표의 수정 성공률 53.6%와 구분'
  - 'Android 적용 시 PII·사용자 입력·세션 데이터의 수집, 보존, 마스킹과 샘플링을 검토'
  source: https://sentry.io/solutions/mobile-developers/
  interview: "Seer의 94.5% root-cause 수치를 Android 앱 장애 분석의 보장된 정확도로 인용해도 되나요?"
  answer: "아니다. 94.5%는 Sentry가 과거 Autofix 내부 평가에서 보고한 원인 식별 결과이며, 독립 벤치마크나 전체 Android 장애 분포에 대한 보장은 아니다. Sentry도 제안된 코드 수정 성공률을 53.6%로 별도 발표했다. 프로젝트 데이터로 유효성과 오탐을 검증하고 수정은 테스트·리뷰해야 한다."
- category: ai
  title: 'Novu MCP·ACI — AI 에이전트를 메시징 채널과 연결하는 대화 인프라'
  level: "중급"
  summary: 'Novu는 MCP 서버로 AI 도구가 구독자·알림 워크플로·에이전트 대화와 전송 기록을 조회·관리하게 하고, Agent Communication Infrastructure(ACI)로 이미 만든 에이전트의 메시지를 여러 채널에서 받아 정규화해 전달한다. Novu가 모델 추론을 수행하는 것은 아니다. Android에서는 서버 SDK나 REST API로 워크플로를 실행하고 FCM 토큰을 구독자에 연결해 푸시를 보낼 수 있지만, 네이티브 Android용 공식 클라이언트 SDK와 기본 Inbox UI는 없다. Secret key는 앱에 넣지 않고 서버에 보관한다.'
