  summary: Google 내부 AI IDE 실험(arXiv 2601.19964)은 acceptance rate(수락÷(수락+거절))를 품질·불쾌감 프록시로 쓰고 FCML(ML이 쓴 코드 비율)을 생산성 지표로 본다. FCML 28.7%(붙여넣기 제외 70.6%), acceptance 45%가 기준치다. Opsera 2026 벤치마크는 업계 acceptance 25~55%가 건강하고 60%↑는 무심사 rubber-stamping, 30%↓는 설정·워크플로 문제 신호라고 경고한다. 수락률만 보면 AI PR이 리뷰 대기 4.6× 길어지는 병목을 놓치므로 review wait time·code turnover·change failure rate와 함께 봐야 한다.
