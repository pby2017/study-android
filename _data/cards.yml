- category: ai
  title: RecGPT-Mobile — Taobao가 실전 검증한 온디바이스 LLM 추천 에이전트, 사용자 의도를 실시간 해석
  summary: 'RecGPT-Mobile은 Taobao(알리바바)가 수백만 실사용자로 검증한 온디바이스 LLM 기반 추천 프레임워크다. 경량 LLM을 디바이스에 배포해 사용자의 암묵적 행동(클릭·스크롤·체류시간)을 명시적 의도 쿼리로 변환하고, 추천 결과를 실시간으로 조정한다. 빈도 제어 메커니즘으로 불필요한 추론을 줄여 디바이스 리소스를 최적화. 클라우드 LLM 추론 대비 레이턴시와 비용을 대폭 절감하면서도 추천 정확도와 해석 가능성 모두 향상.

    '
  points:
  - '온디바이스 의도 에이전트: 암묵적 행동 → 명시적 의도 쿼리 변환'
  - 'Taobao 프로덕션: 수백만 실사용자, 추천 정확도+해석 가능성 향상'
  - '빈도 제어: 중복 추론 방지로 디바이스 리소스 최적화'
  source: https://arxiv.org/html/2605.04726v1
- category: ai
  title: OD-LLM — 온디바이스 LLM 순차 추천을 위한 태스크 적응형 압축 프레임워크(학술 논문)
  summary: 'OD-LLM은 LLM을 모바일 디바이스에서 순차 추천(Sequential Recommendation)에 사용하기 위해 설계된 최초의 태스크 적응형 압축 프레임워크다. 토큰 레벨 정규화·저랭크 구조 분해(SVD)·점진적 정렬을 통합해 사용자-아이템 상호작용의 시간적 패턴을 보존하면서 모델을 대폭 압축. 기존 범용 양자화(GPTQ·AWQ)와 달리 추천 시스템의 행동 민감성에 맞춤 설계. 프라이버시 보장·실시간 개인화·오프라인 추천을 동시에 달성.

    '
  points:
  - '태스크 적응형: 추천 시스템의 행동 민감성에 맞춘 LLM 압축'
  - '3가지 기법 통합: 토큰 정규화 + SVD 분해 + 점진적 정렬'
  - '프라이버시+실시간: 데이터가 디바이스를 안 떠남, 오프라인 동작'
  source: https://arxiv.org/pdf/2601.09306
- category: ai
  title: Project KARL — Kotlin 온디바이스 적응형 AI 라이브러리, 데이터가 디바이스를 절대 안 떠나는 프라이버시 우선(Apache-2.0)
  summary: 'Project KARL은 프라이버시 우선 온디바이스 적응형 AI를 위한 Kotlin 라이브러리다. 모든 학습과 추론이 사용자 디바이스에서만 실행되어 데이터가 절대 외부로 전송되지 않는다(Zero Data Egress). 조합 가능한 컨테이너(Composable Container) 아키텍처로 AI 상태와 로직을 정의된 경계 내에서 관리. 사용자 행동에서 직접 학습해 키보드·생산성·건강·습관 앱 등의 개인화를 구현. Apache-2.0 라이선스.

    '
  points:
  - 'Zero Data Egress: 모든 학습·추론이 디바이스에서만 실행'
  - 'Composable Container: AI 상태·로직을 정의된 경계 내 관리'
  - '온디바이스 적응: 사용자 행동에서 직접 학습, 서버 불필요'
  source: https://github.com/theaniketraj/project-karl
- category: ai
  title: Apple Trust Insights(iOS 27) — 소셜 엔지니어링·코칭 사기를 온디바이스 ML로 탐지하는 프레임워크
  summary: 'Trust Insights는 iOS 27에서 도입된 프레임워크로, 사용자가 사기범에게 코칭 받으면서 위험한 행동을 하는 상황을 온디바이스 ML로 탐지한다. 결제·계정 변경·원격 접근 같은 민감한 순간에 행동 컨텍스트를 분석해 IsLikelyBeingCoachedInsight(unknown/medium/high)를 반환. 개인 콘텐츠(사진·메시지)에 접근하지 않고 인터랙션 패턴·타이밍·센서 데이터만 분석. reportConsumption 필수, Apple Business Register로 오프라인 피드백.

    '
  points:
  - '온디바이스 ML: 행동 패턴·타이밍·센서로 코칭 사기 탐지'
  - '프라이버시: 개인 콘텐츠 접근 없이 위험 신호만 반환'
  - '피드백 루프: reportConsumption(필수) + 오프라인 사기 라벨'
  source: https://developer.apple.com/videos/play/wwdc2026/379/
