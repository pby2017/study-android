  title: Guardrails AI — Validator Hub로 LLM 입출력을 런타임 검증·구조화 출력 강제(MIT)
  summary: Guardrails AI는 LLM 애플리케이션에 런타임 안전장치를 씌우는 Python 프레임워크다. Guard 객체가 LLM 호출 전후로 Input/Output Guard를 실행하고, Guardrails Hub의 Validator(PiiDetection·ToxicLanguage·Jailbreak·Hallucination 등)를 조합해 위험을 탐지·정량화·완화한다. Pydantic/RAIL(XML) 스키마로 구조화 출력을 강제하며, 검증 실패 시 reask·filter·fix·exception 등 on-fail 액션을 설정한다. 2025-02 Guardrails Index 벤치마크로 Validator별 latency·accuracy 공개. 모델 비종속(OpenAI·Anthropic·로컬)이며 REST API 서버로도 배포 가능.
  points:
  - 'Guard + Validator Hub: PII·탈옥·유해·할루시네이션 등 조합'
  - Pydantic/RAIL 스키마 → function calling 또는 prompt optimization
  - 'on-fail: reask·filter·fix·exception — Guardrails Index로 Validator 품질 비교'
  source: https://github.com/guardrails-ai/guardrails
