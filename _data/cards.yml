- category: ai
  title: Dialogue-SWEBench — SWE-bench Verified를 multi-turn user dialogue로 재평가
  summary: Dialogue-SWEBench(arXiv 2606.13995·June 2026) — coding agent가 full spec 없이 simulated user와 대화하며 SWE-bench Verified 500 issue를 해결하는 benchmark. persona-grounded user simulator(U_φ)·message_user action·dialogue quality auto-eval. schema-guided agent 46.9% avg vs OpenHands 32.9% — better coding model≠better dialogue agent(GPT-5-mini>GPT-5 on easy). 핵심 발견 — information-seeking dialogue moves↑ correlates with resolution. vs SWE-bench(autonomous full spec) ·τ-bench(customer service policy) — dialogue=interactive IDE assistant realism axis.
  points:
  - 500 SWE-bench Verified — underspecified task, agent must ask user
  - Coding≠dialogue — leaderboard model rank misleads interactive use
  - Schema-guided agent — slot-filling dialogue state +3–14% over baselines
