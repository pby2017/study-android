  - AA Index v1.1 — DeepSWE replaces SWE-Bench-Pro-Hard in composite
  - Pier eval CLI — harbor-compatible·air-gapped allowlist·codex/claude-code direct
  source: https://deepswe.datacurve.ai/blog
- category: ai
  title: Context7(Upstash) — '낡은·환각 API'를 막으려 버전별 최신 문서를 매 요청에 끼워 넣는 MCP 서버(MIT)
  summary: 'Context7은 Upstash가 만든 오픈소스 MCP 서버로, LLM이 학습 시점에 멈춘 옛 문서나 ''존재하지 않는 API''를 지어내는 문제를 노린다(라이선스 MIT). 라이브러리의 버전별 최신 문서와 코드 예제를 에이전트 컨텍스트에 직접 끌어와, 탭 전환·환각 없이 그 버전에 맞는 코드를 짜게 한다. 쓰는 법은 두 도구로 끝난다 — 먼저 ''react'' 같은 일반 이름을 Context7 라이브러리 ID로 해석하고(resolve-library-id), 그 ID로 토픽을 지정해 문서를 조회한다. Claude Code·Cursor·OpenCode·Windsurf 등과 호환되고, `npx ctx7 setup` 한 줄로 깔거나 MCP URL `https://mcp.context7.com/mcp`를 직접 붙일 수 있으며, MCP 대신 CLI(`ctx7 docs`) 모드도 있다. 주목도(주장·secondary 출처): 2026년 들어 GitHub 5.4만~5.6만★대로 ''MCP 서버 중 1위'' 노출이 잦고 ThoughtWorks Tech Radar에도 올랐다. 단, 코어 MCP 서버만 오픈소스이고 크롤링·파싱·API 백엔드는 비공개라는 점은 감안해야 한다.

    '
  points:
  - '정체(공식): 버전별 최신 라이브러리 문서·예제를 컨텍스트에 주입해 ''낡은/환각 API''를 막는 MCP 서버. MIT, Claude Code·Cursor·OpenCode·Windsurf 호환'
  - '쓰는 법: ①이름→라이브러리 ID 해석(resolve-library-id) ②그 ID로 토픽 지정해 문서 조회, 두 도구뿐. 설치는 `npx ctx7 setup` 또는 MCP URL https://mcp.context7.com/mcp, CLI 모드도 제공'
  - '주목도(주장·미검증): 2026년 GitHub 5.4만~5.6만★대로 ''MCP 1위'' 노출 잦고 ThoughtWorks Tech Radar 등재. 단 코어만 OSS고 크롤·파싱·백엔드는 비공개'
  source: https://github.com/upstash/context7
- category: ai
  title: 공식 /code-review 플러그인 — '리뷰 4개 병렬 → 한 건씩 재검증'으로 오탐을 떨궈내는 구조
  summary: 'anthropics/claude-code 레포에 들어있는 공식 code-review 플러그인은 ''AI 코드리뷰가 nitpick·오탐을 쏟아낸다''는 문제를 구조로 푼다. 핵심은 작업과 검증을 단계로 분리한 파이프라인이다 — 먼저 haiku가 ''PR이 닫힘·드래프트·이미 리뷰됨''인지 스킵 판단을 하고(불필요하면 종료), 변경 파일과 같은 경로의 CLAUDE.md만 찾아낸 뒤, sonnet이 변경 요약을 만든다. 그다음이 본체다 — 리뷰 에이전트 4개를 병렬로 띄운다. 2개는 sonnet으로 CLAUDE.md 준수 여부를, 2개는 Opus로 버그를 본다. 이때 버그 에이전트는 ''diff 바깥 컨텍스트를 읽지 말고 변경된 코드 안에서만, 컴파일 불가·무조건 틀린 결과 같은 HIGH SIGNAL만 보고하라(확신 없으면 보고 금지)''는 제약을 받는다. 스타일·취향 지적과 기존 코드 문제는 명시적으로 제외된다. 마지막으로 발견된 이슈마다 별도 검증 서브에이전트를 다시 병렬로 돌려(버그는 Opus, CLAUDE.md는 sonnet) 확신 가능한 것만 통과시키고 나머지는 버린다. 결과는 터미널 출력이 기본이고, `--comment`를 줘야 PR에 인라인 코멘트를 단다(이슈당 코멘트 1개, 작은 수정은 적용 가능한 suggestion 블록으로).

    '
  points:
  - '파이프라인(공식): ①haiku 스킵판단 ②haiku로 관련 CLAUDE.md 경로만 수집 ③sonnet 변경요약 ④리뷰 4병렬 ⑤이슈별 재검증 ⑥미검증분 폐기 ⑦터미널 출력(--comment시 인라인)'
  - '4 병렬 리뷰: CLAUDE.md 준수 2개(sonnet) + 버그 2개(Opus). 버그 에이전트는 ''diff 밖 안 읽기·변경 코드 안에서만·컴파일 불가/무조건 오답 같은 HIGH SIGNAL만, 확신 없으면 보고 금지'''
  - '오탐 제거가 핵심: 발견 이슈마다 검증 서브에이전트를 다시 병렬로 띄워(버그 Opus·룰 sonnet) 통과 못 한 건 드롭. 스타일·nitpick·기존 코드 문제는 처음부터 제외'
  source: https://github.com/anthropics/claude-code/blob/main/plugins/code-review/commands/code-review.md
- category: ai
  title: Spotify Honk — Agent SDK·K8s pods·Slack @Honk·Fleet Management 위 백그라운드 agent
  summary: Spotify Honk(2025-11 공개·2026-06 Code with Claude keynote) — Claude Agent SDK+자체 harness, Kubernetes pod에서 concurrent session, CI multi-OS build verify. Fleet Management(2022~) 위에 Claude Code로 전환 — AST/regex 한계를 agentic migration으로 대체, 60–90% 시간 절감. Slack @Honk mid-conversation trigger→PR, commute中 iOS fix→merge before office(CEO Gustav Söderström keynote). 누적 1,500+ PR(2025 blog)·월 650+ merge(Anthropic case study). Backstage Portal·Fleetshift로 org-scale code change orchestration. vs generic background agent — Honk=golden path·test·fleet infra 선행 없으면 PR volume만 늘어남.
  points:
  - Agent SDK+K8s — trusted tools, CI verify, many concurrent pods
  - Slack trigger — conversation context as task input, not IDE-only
  - Fleet Management foundation — agent speed follows platform maturity
  source: https://engineering.atspotify.com/2026/6/code-with-claude-coding-is-no-longer-the-constraint
- category: ai
  title: mini-SWE-agent — '도구·설정 다 빼고' 100줄 bash만으로 SWE-bench 74%를 찍은 미니멀 에이전트(SWE-agent 후속)
  summary: 'SWE-agent(프린스턴·~19.5k★)를 만든 팀이 내놓은 후속작으로, 에이전트 핵심 로직을 파이썬 약 100줄로 줄인 미니멀 코딩 에이전트다. 가장 큰 설계 선택은 ''도구(tool-calling) 인터페이스를 안 쓴다''는 것 — 커스텀 툴이나 함수 호출 API 없이 오직 bash 명령만으로 동작하고, 액션은 subprocess.run으로 실행하며 대화 이력도 선형(linear)으로 단순하게 유지한다. 스캐폴드를 깎아내고 LM 자체의 능력에 집중하자는 철학으로, 그럼에도 SWE-bench에서 74%를 넘는 점수를 주장한다. 라이선스는 MIT, GitHub 스타는 약 5.2k(2026-06 기준).

    '
  points:
  - '100줄·bash-only: 커스텀 도구도, 함수 호출 API도 없음. 모델이 bash 명령을 내면 subprocess.run으로 돌리고 결과를 다시 먹이는 단순 루프 — 어떤 LM에든 꽂기 쉬움'
  - '주장 수치: SWE-bench 74%+ 점수를 README에서 주장(모델·구성에 따라 달라짐). 전작 SWE-agent(~19.5k★)와 별개 레포로, mini 쪽은 ~5.2k★'
  - '도입처: Meta·NVIDIA·IBM·Anyscale·프린스턴·스탠퍼드 등이 SWE-bench 평가용으로 쓴다고 명시. ''스캐폴드보다 모델''이라는 벤치마킹 철학의 레퍼런스 구현'
  source: https://github.com/SWE-agent/mini-swe-agent
- category: ai
  title: Kiro(AWS) — '코드가 아니라 스펙이 산출물'이라며 requirements→design→tasks 3단계를 강제하는 Spec-Driven 에이전트
  summary: Kiro는 AWS가 내놓은 에이전트형 IDE·CLI·웹 도구로, 프롬프트를 받으면 코드를 바로 짜지 않고 requirements.md→design.md→tasks.md 3단계 스펙을 먼저 생성해 개발자 승인을 받는다. VS Code 포크 기반, Autopilot 모드에서 승인된 태스크를 자율 실행. Kiro Autonomous Agent는 Jira 티켓을 받아 비동기로 PR까지 올리는 장기 에이전트. Amazon Bedrock AgentCore·Claude Sonnet 4.5/4.6. cc-sdd 오픈소스로 동일 워크플로를 Claude Code·Copilot·Gemini CLI에서도 재현 가능.
  points:
  - '스펙 3단계: requirements.md(수용 기준) → design.md(아키텍처) → tasks.md(구현 계획)'
  - Autopilot·Kiro Autonomous Agent — Jira→비동기 PR, Bedrock AgentCore 기반
  - cc-sdd로 Kiro 워크플로를 다른 코딩 에이전트에 이식 — 큰 기능에만 스펙 오버헤드 투자
  source: https://kiro.dev/docs
- category: ai
  title: Amp(Sourcegraph) — '토큰 아끼지 마라'를 철학으로 내건, 스레드·서브에이전트·Oracle로 미는 프런티어 코딩 에이전트
  summary: 'Amp는 Sourcegraph가 만든 터미널·에디터용 코딩 에이전트로, "프런티어 모델과 그다음에 올 것을 위해 만든 에이전트"를 표방한다. 설계 철학이 다른 도구와 갈리는데, 토큰을 아끼려 컨텍스트를 깎기보다 ''제약 없이'' 쓰는 쪽에 무게를 둔다 — 작업 품질을 위해 토큰 비용을 감수한다는 입장이다. 작업 단위는 ''스레드(Thread)''로, 대화·작업 맥락이 영속 저장돼 살아있는 메모리이자 팀 협업·공유 수단이 된다(스레드 포킹으로 대안 시도도 가능). 서브에이전트는 전문 작업을 떼어 맡고 메인 스레드에 결과를 보고하며, 읽기·검색·진단 같은 독립 작업은 기본적으로 병렬로 돌린다(같은 파일·공유 계약을 건드리는 쓰기만 직렬화). ''Oracle''이라는 별도 도구로 더 강한 추론 모델에 어려운 분석을 위임할 수 있고, AGENT.md 파일로 규칙·제약을 코드베이스에 박아 둔다.

    '
  points:
  - '철학적 차별점: 컨텍스트를 깎아 토큰을 아끼는 대신 ''제약 없는 토큰 사용''으로 품질을 우선 — 비용보다 결과를 택하는 트레이드오프. CLI 실행 모드 `amp -x`는 유료 크레딧을 쓰고, Amp Free는 대화형에만 적용'
  - '구조: ''스레드''가 영속 메모리이자 협업 단위(포킹 지원) + 서브에이전트가 전문 작업을 병렬로 처리하고 메인에 보고. 독립 작업(읽기·검색·진단)은 기본 병렬, 같은 파일·타입·DB스키마·공개 API를 건드리는 쓰기만 직렬화'
  - '도구·환경: 어려운 추론은 ''Oracle'' 도구로 더 강한 모델에 위임, AGENT.md로 규칙 주입, MCP 지원(`amp mcp add`). macOS·Linux·Windows(WSL)·JetBrains 2025.1+ 지원, `--stream-json`은 `--execute`와 함께 사용'
  source: https://ampcode.com/manual
- category: ai
  title: Repomix — 레포 전체를 'AI 친화 단일 파일' 하나로 싸서 LLM에 통째로 먹이는 패커(MIT·~26.3k★)
  summary: 'Repomix는 코드베이스 전체를 LLM이 소화하기 좋게 단일 파일 하나(repomix-output.xml 등)로 묶어주는 오픈소스 도구로, GitHub ~26.3k★·MIT 라이선스다(yamadashy/repomix). 에이전트가 도구로 코드를 탐색하지 않는 상황 — ChatGPT·Gemini·Claude 웹/데스크톱에 레포 맥락을 통째로 붙여 넣고 싶을 때 — 이 진가를 발휘한다. `npx repomix`만 치면 현재 디렉터리를 한 파일로 패킹한다. 수작업 파일 복사·붙여넣기를 없애주고, 버그 조사·보안 감사·구현 계획·서드파티 라이브러리 문서화 같은 ''레포 스냅샷이 필요한'' 작업에 그대로 쓰인다. LLM 친화 출력을 위해 XML/Markdown/플레인 등 포맷을 고르고, 토큰 수를 세어주며, 보안상 민감 정보(시크릿) 탐지·코드 압축으로 토큰을 줄이는 옵션도 제공한다.

    '
  points:
  - '사용법: `npx repomix`로 설치 없이 현재 레포를 단일 파일로 패킹 → 그 파일을 LLM 채팅에 붙여 넣으면 전체 프로젝트 맥락 확보. repomix.com 웹 인터페이스와 GitHub 페이지에 ''Pack'' 버튼을 다는 크롬 확장도 있음'
  - 'AI 친화 출력: XML·Markdown·플레인 등 포맷 선택, 토큰 카운팅으로 컨텍스트 예산 가늠, 코드 압축(주석 제거 등)으로 토큰 절감 — ''에이전트가 못 도는'' 모델에 레포를 통째로 넣을 때의 비용/한도 문제를 직접 다룸'
  - '안전장치·용도: 시크릿 탐지로 민감 정보 유출 방지, 클론 없이 원격 레포 패킹 지원. 권장 용도는 버그 조사·보안 감사·구현 계획·서드파티 라이브러리 문서화 등 레포 스냅샷이 필요한 작업(JSNation Open Source Awards 2025 ''Powered by AI'' 후보)'
  source: https://github.com/yamadashy/repomix
- category: ai
  title: 하네스 엔지니어링(Harness Engineering) — '모델 말고 모델 둘러싼 모든 것'을 설계해 에이전트 실패를 구조로 막기
  summary: 'Martin Fowler 사이트(Birgitta Böckeler, 2026-04-02)는 ''하네스(harness)''를 "AI 에이전트에서 모델을 뺀 모든 것"으로 정의한다 — 즉 도구·피드백 루프·안전 경계·검증 시스템 전체. 핵심 발상은 "에이전트가 실수하면 그때그때 고치지 말고, 그 실수를 두 번 다시 못 하게 하는 해법(주로 더 나은 하네스)을 만든다"는 것으로, 같은 모델을 그대로 두고 하네스만 바꿔도 성능이 크게 움직인다. 실제로 LangChain은 모델이 아니라 하네스를 바꿔 Terminal-Bench 2.0 점수를 52.8%→66.5%로 끌어올렸다(주장). Fowler 글은 자기교정 확률을 높이는 ''builder harness''와 사람의 개입을 꼭 필요한 곳에만 두는 ''user harness''를 구분하고, 환경을 에이전트가 읽고 다루기 쉽게 만드는 ''ambient affordances''와 토폴로지를 좁혀 가변성을 줄이는 접근을 제시한다.

    '
  points:
  - '정의: 하네스 = 에이전트에서 ''모델을 제외한 전부''(도구 오케스트레이션·검증 루프·컨텍스트/메모리·가드레일·관측성). ''AI 에이전트 성능은 모델이 아니라 하네스가 결정한다''가 2026년의 합의'
  - '핵심 원칙: 에이전트가 실수하면 즉석 수정이 아니라 ''다시는 그 실수를 못 하게 하는 해법''을 하네스로 만들어 영구화 — 같은 모델로도 점수가 출렁(LangChain Terminal-Bench 52.8%→66.5%는 하네스만 교체한 결과라는 주장)'
  - 'Fowler/Böckeler 프레임: ''builder harness''(자기교정 유도)와 ''user harness''(사람 개입을 필요한 지점에만)로 분리, ''ambient affordances''(환경을 에이전트가 읽기 쉽게)·토폴로지 고정으로 가변성 축소 — 좋은 하네스는 사람 입력을 없애는 게 아니라 ''중요한 곳으로'' 돌린다'
  source: https://martinfowler.com/articles/harness-engineering.html
- category: ai
  title: Agent Skills(SKILL.md) — Anthropic가 연 'Skill 한 번 만들면 어떤 에이전트서나' 오픈 표준, Cursor·Codex·Gemini CLI까지 채택
  summary: 'Agent Skills는 Anthropic이 만들어 오픈 표준으로 공개한, AI 에이전트에 전문 지식·워크플로를 주입하는 경량 포맷이다. 핵심은 SKILL.md 한 파일을 담은 폴더 — 메타데이터(name·description)와 지침을 적고, 스크립트·참고문서·템플릿을 함께 묶을 수 있다. Claude Code 전용이 아니라 Cursor·OpenAI Codex·Gemini CLI·GitHub Copilot·VS Code·OpenHands·Goose·Roo Code 등 수십 개 도구가 같은 포맷을 채택해, "한 번 만들면 어디서나 쓰는" 크로스 제품 재사용이 핵심 가치다.

    '
  points:
  - '구조: 폴더 + 필수 SKILL.md(메타 name·description + 지침), 선택적으로 scripts/·references/·assets/ 번들. 별도 SDK·플러그인 형식이 아니라 마크다운 파일 하나가 진입점'
  - '동작은 ''점진적 공개(progressive disclosure)'' 3단계 — ①Discovery: 시작 시 name·description만 로드 ②Activation: 작업이 description과 매칭되면 본문 전체를 컨텍스트로 ③Execution: 필요할 때만 번들 코드·참고파일 로드. 그래서 스킬 수십 개를 달아도 컨텍스트 footprint가 작다'
  - '표준 채택 현황(agentskills.io 클라이언트 쇼케이스 기준): Claude Code/Claude·Cursor·OpenAI Codex·Gemini CLI·GitHub Copilot·VS Code·OpenHands·Goose·Roo Code·Amp·Factory·Kiro·Letta 등. openai/skills(Codex용 Skills Catalog)는 22.3k★. Anthropic이 발원해 오픈 표준으로 풀고 생태계가 확장 중'
  source: https://agentskills.io
- category: ai
  title: OpenHands(All-Hands-AI) — 에이전트의 모든 행동을 'Docker 샌드박스'에서 돌리는 오픈소스 코딩 에이전트(MIT·~77k★)
  summary: 'OpenHands(옛 OpenDevin)는 코드를 짜고 수정할 뿐 아니라 명령 실행·웹 브라우징·API 호출까지 사람 개발자처럼 하는 오픈소스 자율 코딩 에이전트다. 핵심 차별점은 에이전트의 모든 행동을 격리된 Docker 런타임(샌드박스)에서 실행한다는 점 — 로컬 환경을 직접 건드리지 않고 컨테이너 안에서 셸·파일 편집·브라우저를 돌린다. CLI·웹 GUI·Cloud·Agent SDK 등 여러 형태로 쓰며 특정 모델에 묶이지 않고 다양한 LLM 공급자를 붙일 수 있다. 라이선스는 MIT(단, enterprise/ 디렉터리는 별도)이며 README 기준 약 77k★다.

    '
  points:
  - 샌드박스 우선 설계 — 에이전트의 bash 실행·파일 편집·브라우징이 격리된 Docker 컨테이너 런타임 안에서 일어나, 자율 에이전트가 호스트를 망칠 위험을 구조로 줄인다(표준 설치도 Docker 기반)
  - 한 코어, 여러 표면 — 동일 엔진을 CLI(헤드리스 포함)·웹 GUI·OpenHands Cloud·파이썬 Software Agent SDK로 노출. 모델 비종속이라 Claude·GPT 등 원하는 LLM 공급자를 끼운다
  - SWE-bench Verified 상위권을 '주장' — 공식은 77.6% 해결(검증된 리더보드 수치라기보다 프로젝트 측 주장으로 받아들일 것). 라이선스 MIT·~77k★, '87% 버그 티켓 당일 해결' 류 마케팅 수치는 검증 안 됨
  source: https://github.com/All-Hands-AI/OpenHands
- category: ai
  title: android/skills(Google 공식) — Android 개발 베스트프랙티스를 'SKILL.md'로 에이전트에 주입하는 공식 스킬 묶음(Apache-2.0·~5.8k★)
  summary: 'Google Android 팀이 직접 내는 공식 에이전트 스킬 저장소다. developer.android.com의 모범 사례를 Agent Skills 오픈 표준(SKILL.md) 형식으로 묶어, LLM이 약한 Android 작업에서 헛짚지 않도록 ''근거''를 깔아 준다. Expo의 expo/skills에 대응하는 네이티브 Android판 격으로, 2026-04-20 발표 뒤 빠르게 성장했고 현재 약 5.8k★·Apache-2.0 라이선스다. CLI가 감지된 모든 에이전트에 스킬을 깔아 주며(기본값 Gemini·Antigravity), LLM이 이미 잘하는 영역이 아니라 ''평가상 못하는 워크플로''를 골라 채우는 게 설계 방향이다.

    '
  points:
  - 공식·검증된 정보만 — Apache-2.0, 최신 릴리스 v1.0.2(2026-06-11), Agent Skills(SKILL.md) 오픈 표준 사용. 별 수(~5.8k★)는 시점에 따라 변하는 GitHub 수치이니 '주장'으로 볼 것
  - 실제 수록 스킬 예시 — jetpack-compose, navigation/navigation-3, performance/r8-analyzer, testing/testing-setup, system/edge-to-edge, build/agp/agp-9-upgrade, camera/camera1-to-camerax, wear/jetpack-compose-m3 등 마이그레이션·도구 워크플로 중심
  - 설계 철학 — 'LLM이 못하는 곳을 메운다'. 이미 잘하는 영역이 아니라 평가에서 underperform하는 use case를 겨냥하고, 외부 공개 기여는 현재 받지 않는다(공식 README 기준)
  source: https://github.com/android/skills
- category: ai
  title: Vibe Kanban(BloopAI) — Claude Code·Codex·Gemini CLI 여러 에이전트를 '칸반 보드'로 병렬 돌리는 오케스트레이션 레이어(Apache-2.0·~27k★)
  summary: '여러 코딩 에이전트를 한 칸반 보드 위에서 동시에 굴리는 오픈소스 오케스트레이션 도구다. 각 작업을 ''workspace''로 띄우는데, workspace마다 별도 git 브랜치·터미널·dev 서버가 붙고 내부적으로 git worktree로 격리돼 에이전트들이 서로의 작업을 침범하지 못한다. 그 위에서 diff 리뷰, 앱 프리뷰, PR 생성까지 한 화면에서 한다. `npx vibe-kanban` 한 줄로 실행되고 Claude Code·Codex·Gemini CLI·Copilot· Amp·Cursor·OpenCode·Droid 등 10여 개 에이전트를 지원한다(공식 README 기준). 다만 README는 현재 "Vibe Kanban is sunsetting"이라 밝혀, 오픈소스 도구의 운영 지속성을 함께 따져야 하는 사례이기도 하다.

    '
  points:
  - 격리 모델 — workspace = 브랜치+터미널+dev서버 한 묶음, 그 토대가 git worktree. 에이전트가 main을 건드리지 않고 병렬로 돌게 만드는 게 핵심(Cursor 2.0·Conductor와 같은 worktree 계열 패턴)
  - 도구 비종속 — 한 보드에서 Claude Code·Codex·Gemini CLI·GitHub Copilot·Amp·Cursor·OpenCode·Droid·CCR·Qwen Code 등 '10+ 코딩 에이전트'를 섞어 쓴다. Rust(~50%)+TypeScript(~46%)로 작성
  - 지속성 주의 — README가 'Vibe Kanban is sunsetting'이라 명시하고 외부 PR도 사전 논의 없이는 받지 않는다. 별 수(~27k★)는 시점에 따라 변하는 GitHub 수치이니 '주장'으로 볼 것
  source: https://github.com/BloopAI/vibe-kanban
- category: ai
  title: 토스의 'Claude Code를 레이어드 아키텍처처럼' — 팀 지식을 Global/Domain/Local 3계층 플러그인으로 굳히기
  summary: '토스 기술블로그(toss.tech)는 코딩 에이전트를 ''개인 생산성 도구''에서 ''팀의 일하는 방식''으로 끌어올리는 패턴을 제안한다. 핵심은 흩어진 규칙·노하우를 Claude Code 플러그인에 담되, 그 지식을 세 계층으로 나누는 것이다 — 전사 공통(보안·코딩 스타일)은 Global, 결제·정산·회원 같은 도메인 로직은 Domain, 특정 레포의 구현 디테일은 Local. 이렇게 계층화된 플러그인이 모이면 그 자체로 ''살아있는 지식 베이스(Living Knowledge Base)''가 되고, 나아가 조직의 워크플로(예: /new-feature)를 배포하는 사내 마켓플레이스로 확장한다는 구상이다.

    '
  points:
  - 지식 3계층 — Global(전사 보안·코딩 스타일) / Domain(팀·비즈니스 도메인 로직) / Local(레포별 구현 디테일·프로젝트 규칙). 한 CLAUDE.md에 다 밀어넣지 말고 책임에 따라 쪼개라는 게 요지
  - 비유의 출처 — '이전 글에서 Claude Code 구조를 레이어드 아키텍처에 비유했듯, 플러그인이 담는 지식도 계층화할 수 있다'. 코드 아키텍처 사고를 '지식 관리'에 그대로 적용
  - 팀 스케일 — 계층화된 플러그인 묶음 = Living Knowledge Base → 워크플로를 배포하는 '마켓플레이스 1.0'으로 확장. 개인 팁이 아니라 조직 차원 표준화가 목표 (toss.tech 자체 글, 수치 주장 없음)
  source: https://toss.tech/article/harness-for-team-productivity
- category: ai
  title: Ruflo(전 claude-flow) — Claude Code 위에 'queen 에이전트가 worker 떼를 지휘하는' 멀티에이전트 스웜 하네스(MIT·~59.8k★)
  summary: 'Reuven Cohen(ruvnet)이 만든 오픈소스 멀티에이전트 오케스트레이션 레이어로, 2026년 초 ''claude-flow''에서 ''Ruflo''로 개명했다(README 기준 ~59.8k★, MIT). 핵심 구조는 queen 에이전트가 계획·위임하고 다수 worker 에이전트가 병렬 실행하는 hierarchical 스웜이며, mesh·ring·star 등 토폴로지와 합의 프로토콜을 지원한다. Claude뿐 아니라 GPT·Gemini·Cohere·Ollama로 라우팅되는 모델 비종속 하네스이고, npm 패키지는 ruflo(구 claude-flow 이름도 호환 유지)로 깐다. 단, 성능·도구 수치는 프로젝트 자체 주장이며 한 외부 감사는 ''주장된 MCP 도구 다수가 실제로는 동작 안 한다''고 지적했으니 수치는 그대로 믿지 말고 검증해서 쓰는 게 안전하다.

    '
  points:
  - '구조 — queen-led hierarchical 스웜: 한 에이전트가 작업을 쪼개 위임하고 worker들이 병렬 처리, SQLite/임베딩 기반 메모리로 세션 간 컨텍스트를 유지한다고 README가 설명. 100+ 에이전트·다수 플러그인·MCP 도구를 묶어 제공한다고 주장'
  - 모델 비종속 — 이름이 'Claude만'을 함의해 Ruflo로 개명. Claude·GPT·Gemini·Cohere·Ollama를 smart routing으로 갈아끼우며, npx ruflo / npx claude-flow 둘 다 같은 도구를 호출(하위호환)
  - 수치는 '주장'으로 — 속도·비용 절감·SWE 점수 등은 프로젝트 자체 벤치 주장이고, 2026년 한 독립 감사는 '광고된 MCP 도구·비용절감 수치가 실측과 어긋난다'고 반박. 도입 전 자기 환경에서 직접 측정 권장
  source: https://github.com/ruvnet/claude-flow
- category: ai
  title: Crush(Charm/charmbracelet) — Go로 짠 '예쁜 터미널' 코딩 에이전트, 세션 중에 LLM을 갈아끼우는 모델 비종속 TUI(~25.4k★)
  summary: 'TUI 라이브러리로 유명한 Charm(charmbracelet)이 만든 터미널 기반 코딩 에이전트로, Go로 작성됐고 README 기준 ~25.4k★·라이선스는 FSL-1.1-MIT다. 다른 터미널 에이전트들과 묶이는 범주(OpenCode·goose·Aider 부류)지만 차별점은 ''Charm다운'' 글래머러스한 TUI와 모델 비종속성이다. Anthropic·OpenAI·Groq·OpenRouter 등 다수 공급자를 지원하고 OpenAI/Anthropic 호환 엔드포인트면 뭐든 붙으며, 한 세션 안에서 LLM을 바꿔 끼울 수 있다. 프로젝트별로 컨텍스트가 분리되는 세션 기반이고, MCP를 http·stdio·sse 세 전송으로 확장한다.

    '
  points:
  - 정체성 — Charm 생태계(Bubble Tea 등 TUI 도구로 유명)가 내놓은 코딩 에이전트. Go 98%대, 라이선스 FSL-1.1-MIT, README상 ~25.4k★, macOS·Linux·Windows·BSD 계열까지 지원
  - 모델 비종속·세션 중 전환 — Anthropic/OpenAI/Groq/OpenRouter/Vercel AI Gateway 등 여러 공급자 지원, OpenAI·Anthropic 호환이면 연결, '세션 도중 LLM 교체' 가능. 프로젝트별 컨텍스트가 나뉘는 세션 기반
  - 설치·확장 — brew/npm(@charmland/crush)/winget/Arch/Nix/FreeBSD 등 패키지 다양, 'no configuration'으로도 동작하고 crush.json으로 설정. MCP를 http·stdio·sse로 붙여 도구 확장
  source: https://github.com/charmbracelet/crush
- category: ai
  title: '''Coding Beyond Your Training''(arXiv 2026) — Claude Code 도입이 개발자의 ''쓰는 언어·레포 폭''을 넓힌다는 5,838명 패널 연구'
  summary: '이코노미스트 Alexander Quispe가 2026년 5월 arXiv에 올린 워킹페이퍼로, AI 코딩 어시스턴트 도입이 개발자 개인의 ''기술적 프런티어''(다루는 언어·레포·커밋량)를 넓히는지를 GitHub 데이터로 추정한다. 2025-05~2026-01 사이 Claude Code가 GitHub에 퍼진 staggered rollout을 활용해, 개발자 5,838명을 28개월간 월 단위로 추적했다. ''첫 Claude 공동저자(Co-authored) 커밋'' 시점을 도입 기준으로 잡고, 아직 도입 안 한 개발자를 대조군으로 쓰는 staggered DiD 방식이다. 도입 후 월 커밋 +41개, 기여 레포 +1.5개, 사용 언어 수 +0.83, 신규 언어 +0.31 등 ''양''과 ''다양성''이 모두 늘었다고 보고한다.

    '
  points:
  - 데이터 — 개발자 5,838명을 28개월 월 단위 패널로 추적, 처치는 '첫 Claude-co-authored 커밋' 시점으로 정의, not-yet-treated를 대조군으로 쓰는 staggered DiD
  - 효과(추정치) — 월 커밋 +41, 기여 레포 +1.5, 사용 언어 +0.83, 신규 언어 +0.31. '많이 짠다'를 넘어 '안 쓰던 언어·레포로 폭이 넓어진다'가 핵심
  - 한계 — 단독 저자 워킹페이퍼(미동료심사)이고 관측 데이터 기반 인과 추정이라 '도입이 원인'이라 단정 말 것. 실무 함의는 '에이전트가 개발자의 기술 반경을 넓힌다'는 가설 정도로
  source: https://arxiv.org/abs/2605.25438
- category: ai
  title: superpowers(obra) — 'TDD·브레인스토밍·서브에이전트 리뷰'를 스킬로 강제하는 에이전트 방법론 프레임워크(MIT·~22.9만★)
  summary: 'Jesse Vincent(obra)이 만든 ''에이전트 스킬 프레임워크이자 소프트웨어 개발 방법론''으로, 깔아두면 코딩 에이전트가 작업을 시작할 때 자동으로 트리거되는 스킬 묶음을 준다. 핵심은 도구가 아니라 ''강제되는 워크플로''다. 에이전트는 먼저 목표를 캐묻고(brainstorming), 스펙·구현 계획을 만든 뒤, 작업마다 새 서브에이전트를 띄워 ''스펙 준수 → 코드 품질'' 2단계 리뷰를 거치며 자율적으로 진행한다. TDD 스킬은 RED-GREEN-REFACTOR를 강제하고 ''테스트 전에 짠 코드는 삭제''한다고까지 명시한다. 특정 도구에 묶이지 않고 Claude Code·Codex·Gemini CLI· Factory Droid·OpenCode·Pi 등에 각각 설치해 쓴다. GitHub API 기준 ~229.8k★·MIT, 최신 v6.0.0(2026-06-16).

    '
  points:
  - 강제되는 워크플로 — brainstorming(목표 캐묻고 대안 탐색→스펙), writing-plans, test-driven-development(RED-GREEN-REFACTOR 강제·테스트 전 코드는 삭제), systematic-debugging, requesting/receiving-code-review가 자동 트리거
  - 서브에이전트 주도 개발 — 작업마다 '새 서브에이전트'를 띄워 '스펙 준수 검토 → 코드 품질 검토' 2단계로 리뷰. 작성 패스와 리뷰 패스를 같은 컨텍스트에서 섞지 않는 게 설계 핵심
  - 도구 비종속 — Claude Code(/plugin install superpowers@claude-plugins-official)·Codex·Gemini(gemini extensions install)·Antigravity·Factory Droid·OpenCode·Pi 등 하네스별로 따로 설치. 사용자 지시가 항상 스킬보다 우선(CLAUDE.md가 'TDD 쓰지마'면 그게 이긴다)
  source: https://github.com/obra/superpowers
- category: ai
  title: claude-code-router(musistudio) — Claude Code 요청을 가로채 '작업 종류별로' 다른·싼 모델로 흘려보내는 라우팅 프록시(MIT)
  summary: 'Claude Code를 Anthropic 모델에만 묶지 않고, 로컬 프록시를 끼워 요청을 다른 공급자/모델로 라우팅하는 오픈소스 도구다. Anthropic ↔ OpenAI 포맷을 변환해주기 때문에 OpenRouter·DeepSeek· Ollama·Gemini 등 OpenAI 호환 API면 Claude Code 인터페이스 그대로 붙는다. 핵심은 ''한 모델로 다 처리''가 아니라 작업 성격에 따라 모델을 갈아끼우는 라우팅 규칙이다 — 기본 모델 외에 background(가벼운 백그라운드 작업), think(추론), longContext(긴 컨텍스트)처럼 라우터를 나눠, 백그라운드성 작업은 더 싸거나 로컬인 모델로 흘려보내 비용 천장을 거는 식이다. 세션 중 /model로 즉시 전환할 수도 있다. MIT 라이선스이며 Anthropic 공식 도구가 아닌 서드파티 프록시다.

    '
  points:
  - 동작 방식 — Claude Code와 모델 사이에 로컬 프록시를 두고 Anthropic↔OpenAI 포맷을 번역. OpenRouter·DeepSeek·Ollama·Gemini 등 OpenAI 호환 API면 무엇이든 백엔드로 붙는다
  - 작업별 라우팅(비용 최적화 핵심) — default 외에 background·think·longContext 등 라우터를 나눠, 가벼운 백그라운드 작업은 싸거나 로컬인 모델로 보내고 무거운 추론만 비싼 모델에 맡기는 식으로 천장을 건다. /model로 세션 중 즉시 전환도 가능
  - 주의 — 비공식 서드파티 프록시(MIT). 라우팅 대상에 비(非)Anthropic·로컬 모델을 섞을 수 있다는 게 장점이자, 모델별 출력 품질·포맷 호환은 사용자가 검증해야 한다는 뜻
  source: https://github.com/musistudio/claude-code-router
- category: ai
  title: ast-grep — 에이전트의 '찾아 바꾸기'를 텍스트가 아니라 '문법 트리(AST)'로 시키는 구조적 검색·치환 도구(Rust·MIT·~14.5k★)
  summary: 'ast-grep(명령어 sg)는 코드를 문자열이 아니라 tree-sitter로 파싱한 AST로 보고, ''패턴 매칭''으로 검색·린트·치환을 하는 Rust CLI다. 패턴은 평범한 코드처럼 쓰되 $MATCH 같은 ''$+대문자'' 와일드카드로 임의의 AST 노드 하나를 잡는다. 텍스트 정규식과 달리 언어 문법을 알기 때문에, 함수 호출·인자 구조 같은 ''의미 단위''를 정확히 잡아 대규모로 바꿀 수 있다. 그래서 LLM 에이전트가 ''sed로 막 치환하다 줄 어긋나는'' 실수 없이 코드를 안전하게 일괄 수정하게 하는 도구로 쓰인다(공식 agent-skill 저장소도 운영). 멀티코어를 쓰고 CLI로도 라이브러리로도 동작한다. (MIT, GitHub 기준)

    '
  points:
  - 무엇 — tree-sitter 기반 AST 패턴 매칭 CLI. 패턴을 코드처럼 쓰고 $MATCH/$$$ 같은 와일드카드로 노드를 잡아 search·lint·rewrite. YAML로 린트 규칙도 정의. 멀티코어 활용·jQuery식 AST 순회 API 제공
  - 왜 에이전트에 좋나 — 정규식/sed는 '텍스트'만 보니 들여쓰기·괄호·동일 이름 변수에서 오작동하기 쉽지만, ast-grep은 언어 문법을 알아 '구조 단위'로 정확히 치환한다. LLM이 대규모 리팩터를 줄 어긋남 없이 시키는 데 적합(ast-grep 공식 agent-skill 저장소 존재)
  - 한계(공식 명시) — 타입·제어흐름·데이터흐름·테인트 분석 같은 깊은 의미 정보는 없다(그쪽은 Semgrep 영역). 즉 '구문은 정확하지만 의미 추론은 못 한다'. 보안 룰셋이 필요하면 ast-grep만으론 부족
  source: https://github.com/ast-grep/ast-grep
- category: ai
  title: 컨텍스트 엔지니어링(Anthropic 공식) — '프롬프트 한 줄' 말고 '에이전트가 매 턴 보는 전체 토큰'을 설계하는 법
  summary: 'Anthropic 응용AI팀이 2025-09-29에 낸 엔지니어링 글로, 프롬프트 엔지니어링의 다음 단계를 ''컨텍스트 엔지니어링''으로 규정한다. 프롬프트가 ''잘 쓴 한 번의 지시''라면, 컨텍스트 엔지니어링은 추론 매 순간 컨텍스트 창에 무엇을 넣을지 ''큐레이션''하는 일이다. 핵심 원칙은 "원하는 결과가 나올 확률을 최대화하는, 가장 작은 고신호(high-signal) 토큰 집합"을 찾는 것 — LLM의 ''주의 예산(attention budget)''은 유한하고, 토큰이 많아질수록 성능이 떨어지는 ''context rot''이 생기기 때문이다. 길게 돌아가는 에이전트를 위해 compaction(대화 압축)·note-taking(외부 메모)·멀티에이전트(서브에이전트가 요약만 반환)·just-in-time 검색을 작업 유형별로 골라 쓰라고 권한다. (Anthropic 엔지니어링 블로그 기준)

    '
  points:
  - 정의 — 프롬프트 엔지니어링은 '한 번의 지시를 잘 쓰기', 컨텍스트 엔지니어링은 '에이전트가 매 턴 보는 컨텍스트 창 전체(시스템 프롬프트·도구 결과·히스토리·검색물)를 매 순간 큐레이션'하기. 시스템 프롬프트는 하드코딩 로직과 모호한 지침 사이 'right altitude(적정 고도)'를 노려라
  - 핵심 원칙 — '주의 예산'은 유한하고 토큰이 늘면 'context rot'으로 성능이 떨어진다. 그래서 목표는 '원하는 결과 확률을 최대화하는 가장 작은 고신호 토큰 집합'. 데이터는 미리 다 채우지 말고 lightweight identifier(파일경로 등)만 들고 런타임에 끌어오는 just-in-time 방식
  - '긴 작업용 3패턴 — ① compaction: 왕복 대화는 요약해 다시 채운다 ② note-taking: 마일스톤형 작업은 외부 메모로 기억 ③ 멀티에이전트: 서브에이전트가 수만 토큰을 쓰되 메인엔 1,000~2,000토큰 요약만 반환하고 리드가 종합. 작업 성격에 맞춰 골라 써라'
  source: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
- category: ai
  title: Roo Code의 '코드베이스 인덱싱' — 'grep만 쓰는' 에이전트 시대에 굳이 벡터DB(Qdrant)로 의미 검색을 거는 선택(Apache-2.0·~24.2k★)
  summary: '요즘 Claude Code·Cursor류 에이전트가 벡터DB를 안 띄우고 grep·파일트리·find으로 코드를 찾는 쪽으로 기울었지만, VS Code용 오픈소스 에이전트 Roo Code(Cline 포크)는 여전히 ''코드베이스 인덱싱''으로 의미 기반(semantic) 검색을 건다. 동작은 ① tree-sitter로 코드를 함수·클래스 같은 의미 블록(100~1000자)으로 쪼개고 ② 임베딩을 떠서 ③ Qdrant 벡터DB에 저장한 뒤, 에이전트에게 codebase_search 도구를 쥐여 준다. 그러면 "사용자 인증은 어디서 처리하나" 같은 자연어 질의로 정확한 텍스트 일치가 아니라 ''의미''로 코드를 찾는다. 대형·비공개·낯선 레포에서 grep으로 키워드를 모를 때 유리하다는 게 이 방식의 포지션이다. (GitHub·공식 문서 기준)

    '
  points:
  - 동작 3단계 — tree-sitter로 의미 블록(100~1000자, 미지원 언어는 줄 단위 폴백) 분할 → 임베딩 → Qdrant 벡터DB 저장. 에이전트엔 codebase_search 도구로 노출돼, 텍스트 일치 아닌 '의미'로 관련 코드를 찾게 한다
  - 임베딩은 8종 선택 — OpenAI·Google Gemini·Ollama·OpenAI Compatible·Mistral·Vercel AI Gateway·Bedrock·OpenRouter. 공식 문서는 '현재 무료'인 Gemini를 권하고, Ollama로는 완전 로컬 임베딩도 가능. Qdrant는 클라우드나 Docker 로컬로 띄운다
  - 왜 지금 논쟁거리냐 — 다수 프런티어 에이전트(Claude Code·Cursor류)는 벡터RAG 대신 grep/파일트리로 회귀했다는 평가가 많다. Roo Code는 반대로 '키워드를 모르는 대형·비공개 레포'에선 의미 검색이 낫다는 쪽. tree-sitter 기반이라 코드를 '문법 단위'로 잘라 인덱싱한다
  source: https://roocodeinc.github.io/Roo-Code/features/codebase-indexing
- category: ai
  title: Cline — VS Code 'Plan→Act' 코딩 에이전트 + 읽기 전용 서브에이전트(Apache-2.0·~63k★)
  summary: 'Cline은 VS Code·JetBrains·CLI/SDK로 동작하는 BYOK 멀티프로바이더 오픈소스 코딩 에이전트(Apache-2.0·~63k★). Plan/Act 2모드 — Plan에서 레포 탐색·질의·전략 수립, Act에서 diff·터미널·MCP 실행(기본 human-in-the-loop). Anthropic·OpenAI·Gemini·OpenRouter(200+)·Ollama/LM Studio까지. 2026 서브에이전트 — 메인이 명시적으로 띄우는 병렬 ''읽기 전용 탐색대'': 별도 컨텍스트로 코드베이스 조사 후 요약만 반환, 쓰기·MCP·파괴적 명령 불가. Claude Code 서브에이전트와 같은 컨텍스트 격리 발상이지만 탐색 전용으로 좁힘. Cursor(IDE)·Claude Code(터미널)와 달리 VS Code 확장+모델 비종속이 핵심.

    '
  points:
  - Plan/Act — Plan에서 전략·Act에서 편집/명령, diff·터미널 승인이 기본값
  - BYOK 멀티프로바이더 — OpenRouter·Ollama·Bedrock·Azure/Vertex, MCP(cline mcp) 지원
  - 읽기 전용 서브에이전트 — 병렬 탐색·영향 범위 조사, 결과 요약만 메인에 반환
  source: https://github.com/cline/cline
- category: ai
  title: Claude Squad — tmux+git worktree로 여러 코딩 에이전트를 한 터미널에서 병렬로 돌리는 TUI(AGPL·~7.8k★)
  summary: 'Claude Squad는 Claude Code·Codex·Gemini·OpenCode/Amp·Aider 같은 여러 AI 코딩 에이전트를 각자 격리된 작업공간에서 동시에 띄워 한 TUI로 관리하는 터미널 앱이다. 내부적으로 tmux로 각 에이전트 세션을 분리하고 git worktree로 작업물을 격리해, 한 레포 안에서 여러 태스크를 충돌 없이 병렬 진행한다. Conductor·Vibe Kanban 같은 GUI 오케스트레이터와 달리 터미널만으로 돌아가는 게 특징이며, 실행에는 tmux와 gh(GitHub CLI)가 필요하다.

    '
  points:
  - 여러 에이전트를 한 화면에서 — Claude Code 한 칸, Codex 한 칸, OpenCode 한 칸 식으로 각 태스크를 독립 세션으로 띄워 동시에 돌리고 TUI에서 전환
  - tmux + git worktree 격리 — 세션 분리는 tmux가, 작업물 충돌 방지는 worktree가 담당. -p(profile) 플래그로 에이전트별 설정 지정
  - 주의점 — tmux 의존이라 네이티브 Windows 미지원, 프롬프트 자동수락(--autoyes)은 실험적, 라이선스가 AGPL이라 이를 네트워크 서비스로 확장할 땐 검토 필요
  source: https://github.com/smtg-ai/claude-squad
- category: ai
  title: claude-plugins-official — 회사들이 직접 올린 177+ 플러그인이 모이는 Anthropic 공식 마켓플레이스(~30k★)
  summary: 'anthropics/claude-plugins-official은 Anthropic이 직접 큐레이션하는 Claude Code 플러그인 공식 마켓플레이스다. AWS·Microsoft·MongoDB·Cloudflare·Figma·Atlassian·Notion·Playwright 등 회사들이 자사 도구를 스킬·서브에이전트·MCP 서버·LSP 묶음으로 올려두고, 한 줄 명령으로 골라 깐다. 거기에 Anthropic이 직접 번들한 code-review·frontend-design·ralph-loop·claude-md-management, 그리고 Python·Rust·Go·Java 등 언어별 LSP 플러그인까지 들어 있다. 이름이 비슷한 claude-plugins-community(3rd party 검수본)와는 별개다.

    '
  points:
  - 설치 흐름 — 인터랙티브 첫 실행 시 자동 등록되며, 헤드리스/CI에선 `claude plugin marketplace add anthropics/claude-plugins-official`로 추가한 뒤 `/plugin install <이름>@claude-plugins-official`로 깐다(또는 `/plugin > Discover`로 탐색)
  - 무엇이 들었나 — 벤더 통합(aws-core·azure·mongodb·cloudflare·figma·github·playwright·context7·firecrawl…)부터 Anthropic 자체 워크플로(code-review·pr-review-toolkit·feature-dev·hookify·ralph-loop)와 사전제작 LSP(pyright·rust-analyzer·gopls·jdtls 등)까지 177개 이상
  - 주의 — 공식 마켓플레이스라도 Anthropic이 각 플러그인의 MCP 서버·코드를 통제하지 않는다고 명시. 설치·사용 전 신뢰할 수 있는 플러그인인지 직접 확인하라는 경고가 붙는다
  source: https://github.com/anthropics/claude-plugins-official
- category: ai
  title: Rakuten 도입 사례 — Claude Code가 1,250만 줄 vLLM에서 '7시간 무인 코딩'으로 기능 하나를 끝낸 기업 레퍼런스
  summary: 'Anthropic이 공개한 Rakuten 고객 사례다. ML 엔지니어 Kenta Naruse가 1,250만 줄 규모의 오픈소스 라이브러리 vLLM에 활성화 벡터 추출 기능을 구현하라고 시키자, Claude Code가 사람이 코드를 직접 안 쓰고 가끔 가이드만 주는 상태로 7시간을 연속 자율 작업해 한 번에 완성했다고 한다. 결과물은 레퍼런스 대비 99.9% 수치 정확도였고, 회사 전체로는 신규 기능의 출시 소요가 24일→5일(79% 단축)로 줄었다는 게 사례가 내세우는 지표다. 단 이는 Opus 4 출시 시점(2025)에 함께 발표된 벤더 측 마케팅 사례이며, 수치는 Rakuten·Anthropic의 자체 주장임에 유의.

    '
  points:
  - 핵심 수치(벤더 주장) — 7시간 연속 무인 코딩 / 출시 24일→5일(79%↓) / 복잡한 코드 수정 99.9% 정확도
  - '운영 패턴 — AI 담당 GM Yusuke Kaji의 표현: ''Claude Code에 4개를 위임하고 나는 1개에 집중해, 5개 작업을 병렬로 굴린다'''
  - 맥락·한계 — Opus 4 발표(2025)와 묶여 나온 고객 레퍼런스다. 1,250만 줄 코드베이스에서의 단일 작업 일화이며 통제된 벤치마크가 아니므로, 일반 성능 보장이 아니라 '엔터프라이즈 자율 코딩이 가능했다'는 사례로 읽어야 한다
  source: https://claude.com/customers/rakuten
- category: ai
  title: awesome-claude-code(hesreallyhim) — 스킬·훅·슬래시커맨드·오케스트레이터를 '한 분류에 검증된 하나'로 골라주는 정전(正典) 큐레이션 목록(CC BY-NC-ND·~46.6k★)
  summary: 'awesome-claude-code는 hesreallyhim이 관리하는 Claude Code 생태계의 ''정전'' 큐레이션 목록으로, GitHub에서 약 46.6k 스타·4.1k 포크·1,157 커밋까지 활발히 갱신되고 있다(레포에서 직접 확인되는 사실). 단순 링크 덤프가 아니라 스킬·훅·슬래시커맨드·에이전트 오케스트레이터·애플리케이션·플러그인·상태줄·개발 도구를 분류별로 모으고, 동작하지 않는 도구는 잘라내고 동작하는 것만 ''무슨 용도인지'' 태깅하는 방식이라 ''분류당 하나만 고르기''에 적합하다는 평가를 받는다. 이슈가 1,000건을 넘길 만큼 제출·검증이 활발하며, 레포 자체는 Python 98%로 구성된 자동 검증 파이프라인으로 목록을 관리한다. 라이선스는 CC BY-NC-ND 4.0(저작자표시·비영리·변경금지)이라 그대로 재배포·상업적 가공에는 제약이 있으니 ''읽고 도구를 고르는'' 용도로 쓰는 게 맞다.

    '
  points:
  - 쓰는 법 — 새 도구를 막 깔기 전에 '이 분류에서 이미 검증된 것'을 먼저 확인하는 색인으로 사용. 동작 안 하는 건 컷, 동작하는 건 용도 태깅(주장이 아닌 큐레이션 정책)
  - 범위 — 스킬·훅·슬래시커맨드·오케스트레이터·플러그인·상태줄·앱·개발툴을 한곳에. 비슷한 aggregator(everything-claude-code 등)는 '전부 쏟아내기'라 성격이 다름
  - 사실 — github.com/hesreallyhim/awesome-claude-code, ~46.6k★·4.1k fork·480 open issues, 라이선스 CC BY-NC-ND 4.0(비영리·변경금지라 재배포 제약 있음)
  source: https://github.com/hesreallyhim/awesome-claude-code
- category: ai
  title: OpenAI가 SWE-bench Verified를 버렸다 — '실패한 테스트 중 59%가 결함, 모델이 정답을 외운다'며 공식 점수 보고 중단(2026-02)
  summary: '2026년 2월, OpenAI의 Frontier Evals 팀은 코딩 에이전트 사실상 표준 지표였던 SWE-bench Verified의 점수 보고를 중단한다고 공식 발표했다(OpenAI 주장). 이유는 두 가지다. ① 결함 있는 테스트 — 자주 실패하던 어려운 문제 일부(전체의 약 27.6%)를 감사했더니, 기능적으로 맞는 답을 거부하는 결함 테스트가 그중 약 59.4%였다(문제 설명에 없는 정확한 함수명을 요구하거나, 무관한 동작을 검사). ② 학습 데이터 오염 — Django·Astropy 등 유명 오픈소스 파이썬 레포에서 문제를 뽑은 탓에, 주요 프런티어 모델들이 ''태스크 ID''만 주면 정답 패치를 그대로 재현했다(OpenAI 주장). 결론은 "Verified 점수 개선은 더 이상 실제 개발 능력 향상이 아니라 ''벤치를 얼마나 학습 때 봤는가''를 반영한다"이며, OpenAI는 비공개·카피레프트로 오염이 덜한 SWE-bench Pro로의 전환을 권한다.

    '
  points:
  - '교훈 — 굿하트의 법칙: 지표가 목표가 되면 지표이길 멈춘다. AI 코딩 도구를 ''Verified 80%'' 같은 단일 숫자로 고르지 말 것'
  - 수치 격차(보도된 OpenAI 감사값) — Verified ~80%대 모델이 오염에 강한 SWE-bench Pro 공개셋에선 ~23%로 급락. 감사 표본은 64회 독립 실행·138문항
  - 실무 — 사내 도구 평가는 공개 벤치 대신 '우리 비공개 레포로 만든 자체 태스크'를 쓰는 게 오염·과적합을 피하는 길. OpenAI도 전문가가 원본 태스크를 짜는 GDPVal 류로 투자 이동
  source: https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/
- category: ai
  title: Codebuff(CodebuffAI) — '한 모델'이 아니라 파일선택·계획·편집·검토 4개 에이전트가 분업하는 오픈소스 코딩 에이전트(Apache-2.0·~6.5k★)
  summary: 'Codebuff는 자연어 지시로 코드베이스를 고치는 오픈소스 AI 코딩 에이전트로, 단일 모델에 다 맡기는 대신 역할이 다른 에이전트 여러 개가 협업하는 구조를 핵심으로 내세운다(README 주장). 예컨대 ''인증 추가'' 같은 작업이 들어오면 ① File Picker가 레포를 훑어 아키텍처를 파악하고 관련 파일을 찾고 ② Planner가 어떤 파일을 어떤 순서로 고칠지 계획하고 ③ Editor가 정밀 편집을 하고 ④ Reviewer가 변경을 검증한다. 이렇게 나누면 단일 모델 도구보다 컨텍스트 이해가 낫고 편집이 정확하며 오류가 적다는 게 프로젝트의 설명이다. CLI(`npm i -g codebuff`)뿐 아니라 SDK(`@codebuff/sdk`)로 에이전트를 프로덕션에 임베드할 수 있고, `/init`를 돌리면 knowledge.md와 `.agents/` 디렉터리(TypeScript 타입 정의)가 생겨 자기만의 커스텀 에이전트를 정의할 수 있다.

    '
  points:
  - 핵심 구조 — File Picker(탐색)→Planner(계획)→Editor(편집)→Reviewer(검증) 분업. '서브에이전트로 컨텍스트를 나눠 오염을 막는' 멀티에이전트 패턴을 도구 자체가 기본값으로 박아둠
  - 확장 — CLI와 SDK 둘 다 제공(SDK로 앱에 코딩 에이전트 임베드). `/init`로 .agents/ TS 정의를 만들어 에이전트 행동을 직접 커스터마이즈, 광고 기반 무료판 Freebuff도 별도 존재
  - 사실 — github.com/CodebuffAI/codebuff, Apache-2.0, ~6.5k★. '단일 모델보다 낫다'는 정확도 우위는 벤치 수치가 아니라 프로젝트 주장이니 도입 전 자체 검증 권장
  source: https://github.com/CodebuffAI/codebuff
- category: ai
  title: CodeRabbit '인간 vs AI 코드' 리포트 — AI가 짠 PR이 결함 1.7배(PR당 10.83 vs 6.45건), '리뷰를 줄이지 말고 늘려라'
  summary: 'AI 코드리뷰 도구를 만드는 CodeRabbit가 2025년 12월 17일 발표한 ''State of AI vs Human Code Generation'' 리포트는, 오픈소스 PR을 자사 리뷰 엔진으로 분석해 AI가 관여한 코드가 사람만 짠 코드보다 결함이 더 많다고 보고했다. 핵심 수치는 AI-coauthored PR이 PR당 평균 10.83건의 문제를, 사람만 짠 PR은 6.45건을 내 약 1.7배 차이가 났다는 것. 유형별로는 가독성 문제가 약 3.15배로 가장 크게 벌어졌고, 로직·정확성 결함이 늘었으며 보안 취약점도 1.5~2배대로 증가했다. 함의는 분명하다 — AI로 ''쓰는 시간''은 줄지만 ''찾아 고치는 시간''이 늘어나므로, AI 도입 효과는 리뷰·검증 자동화를 함께 깔았는지에 달려 있다(리포트는 당연히 자사 도구에 유리한 프레이밍이니 숫자는 한 벤더의 주장으로 받아들일 것).

    '
  points:
  - 수치(CodeRabbit 주장) — AI 관여 PR 10.83건/PR vs 사람 6.45건/PR ≈ 1.7배. 가독성 ~3.15배, 로직 결함 증가, 보안 1.5~2배대. 자사 리뷰 엔진으로 오픈소스 PR을 분석한 결과
  - 실무 교훈 — 'AI가 짰으니 리뷰 덜 해도 된다'는 정반대. AI 코드일수록 자동 코드리뷰(claude-code-security-review·Bugbot·/code-review 등)와 테스트 게이트를 PR 단계에 강제하라
  - 측정 — ROI를 보려면 'AI 작성 코드 비율 / PR당 결함 수 / 보안 발견 수'를 같이 추적. 도입률만 보면 품질 꼬리(review tail)가 숨는다. 단일 벤더 수치이니 사내 데이터로 교차검증
  source: https://www.businesswire.com/news/home/20251217666881/en/CodeRabbits-State-of-AI-vs-Human-Code-Generation-Report-Finds-That-AI-Written-Code-Produces-1.7x-More-Issues-Than-Human-Code
- category: ai
  title: GitHub Copilot, 정액제를 버리다 — 2026-06-01부터 'AI 크레딧' 사용량 과금으로 전환
  summary: 'GitHub가 2026-06-01부터 Copilot 전 요금제를 ''프리미엄 리퀘스트 수''가 아니라 ''소비한 토큰(=AI 크레딧)'' 기반 사용량 과금으로 바꿨다. 모델과 입력·출력·캐시 토큰 양에 따라 비용이 매겨지고, 각 요금제에는 월 크레딧 할당량이 포함되며 초과분은 예산을 걸어 추가 구매한다. 고정 구독료는 그대로지만 ''측정 단위''가 바뀐 셈이라, 에이전트 워크플로를 많이 돌리는 헤비 유저의 청구서가 출렁일 수 있다는 우려가 컸다(공식 디스커션에 400+ 댓글). 헤비 워크플로용 상위 ''Copilot Max'' 티어도 신설됐고, 코드 리뷰는 크레딧에 더해 Actions 분까지 소비하게 됐다.

    '
  points:
  - 프리미엄 리퀘스트 → 토큰 기반 'AI 크레딧' 사용량 과금(2026-06-01)
  - 구독료는 유지·측정 단위만 변경 → 에이전트 헤비 유저 비용 변동성↑
  - 신규 'Copilot Max' 티어 추가, 코드 리뷰는 Actions 분도 소모
  source: https://github.blog/changelog/2026-06-01-updates-to-github-copilot-billing-and-plans/
- category: ai
  title: Anthropic, '코드의 80%를 Claude가 쓴다' — 그리고 API 에러 800건을 자율로 고친 사례
  summary: 'Anthropic은 2026년 5월에 자사가 머지한 코드의 80% 이상을 Claude가 작성했다고 밝혔다. 대표 사례로, 한 엔지니어가 Claude를 붙여 끈질긴 API 에러군에 대해 800건 넘는 수정을 자율로 내보내 에러율을 1,000분의 1로 줄였다(엔지니어는 일감 선택·리뷰·머지 결정으로 루프 안에 남았다). 사양이 처음부터 명확하지 않은 가장 열린 사내 엔지니어링 과제에서의 성공률도 5월 76%로 6개월 만에 50%p 올랐다고 한다. 다만 보도는 ''80% 작성·76% 성공''이 곧 ''안전·유지보수·머지 가능''을 뜻하진 않는다고 분명히 선을 긋는다.

    '
  points:
  - 2026-05 머지 코드의 80%+를 Claude가 작성(Anthropic 주장)
  - 엔지니어 1명이 Claude로 API 에러 800+건 자율 수정, 에러율 1/1000
  - '''작성 비중·성공률''이 코드 품질·머지 적합성을 보장하진 않음(보도 명시)'
  source: https://winbuzzer.com/2026/06/05/claude-writes-80-of-anthropic-code-raising-review-stakes-xcxwbn/
- category: ai
  title: AGENTS.md는 정말 도움이 되나 — 실제 PR 124건으로 잰 '시간·토큰' 실증 연구(arXiv 2026)
  summary: '에이전트 지침 파일 AGENTS.md를 두면 정말 빨라지는지를 실제 머지된 GitHub PR로 처음 정량 측정한 arXiv 연구다. 10개 레포·124개 PR을 골라 코드를 머지 직전 상태로 되돌린 뒤, AGENTS.md 유무만 다르게 해 OpenAI Codex(gpt-5.2-codex)를 도커에서 동일 조건으로 돌려 비교했다. 결과 AGENTS.md가 있을 때 실행 시간 중앙값이 약 28.6%(98.6s→70.3s) 줄고 출력 토큰 중앙값도 약 16.6% 감소했으며, 둘 다 통계적으로 유의했다. 다만 입력 토큰 중앙값은 거의 그대로였고, 토큰 절감은 ''소수의 고비용 실행''에서 주로 나왔다. 정답 여부(정확성)는 50건 샘플로 ''비어있지 않은 코드 변경''만 확인했을 뿐 본격 평가는 후속 과제로 남겼다.

    '
  points:
  - 10레포·124 PR을 페어 설계로 비교(AGENTS.md 유무만 차이)
  - 실행 시간 중앙값 ≈ -28.6%, 출력 토큰 중앙값 ≈ -16.6%(유의)
  - 절감은 '소수 고비용 실행'에 집중, 정확성 평가는 후속 과제
  source: https://arxiv.org/html/2601.20404v2
- category: ai
  title: 코딩 에이전트 7종 MCP 클라이언트 보안 비교 — '버그'가 아니라 '구조'가 뚫린다(arXiv 2026)
  summary: '''AI 개발 도구는 프롬프트 인젝션에 면역인가''를 묻는 arXiv 연구가 MCP 클라이언트 7종(Claude Desktop, Claude Code, Cursor, Cline, Continue, Gemini CLI, Langflow)을 적대적으로 비교 테스트했다. Cursor(1.6.45)는 네 가지 공격이 모두 통해 가장 취약했고, Claude Code(2.0.25)는 ''낮음~중간'' 위험으로 결과가 갈렸다. 핵심 결론은 대부분의 취약점이 구현 버그가 아니라 ''신뢰 모델·검증 계층 부재·샌드박싱 부재'' 같은 근본 아키텍처 결정에서 나온다는 것 — LLM이 명령과 데이터를 같은 경로로 읽어 둘을 완벽히 구분하지 못하기 때문이다. 따라서 보안은 사후 추가가 아니라 설계 단계부터 넣어야 한다고 못박는다.

    '
  points:
  - 'MCP 클라이언트 7종 적대 테스트: Cursor가 4개 공격 모두 통과(최취약)'
  - 취약점 대부분은 구현 버그 아닌 '신뢰모델·검증·샌드박스 부재' 구조 문제
  - LLM이 명령·데이터를 한 경로로 읽음 → 보안은 설계 단계부터 넣어야
  source: https://arxiv.org/html/2603.21642v1
- category: ai
  title: PewDiePie의 'Odysseus' — 유튜버가 던진 MIT 라이선스 self-hosted AI 워크스페이스(2026-05-31)
  summary: '구독자 최다 유튜버 Felix Kjellberg(PewDiePie)이 2026-05-31 자기 기기에서 통째로 돌리는 오픈소스 AI 워크스페이스 Odysseus를 공개했다. 채팅·자율 에이전트·딥리서치·문서·이메일·캘린더·노트에 더해, 에이전트가 파일 찾기·포맷 변환·코드 실행·웹 브라우징을 알아서 하고 영속 메모리로 학습한다. Python·FastAPI·SQLite·ChromaDB·Docker 스택에 Ollama·llama.cpp·vLLM 로컬 구동과 OpenAI·OpenRouter API를 함께 물린다(MIT). ''데이터를 회사 서버에 안 넘긴다''는 프라이버시·소유권이 철학이지만, 클라우드 API를 붙이면 데이터가 외부로 나간다는 단서가 붙는다. 출시 48시간에 별 3만, 6/4 기준 4.4만+로 폭발적 관심을 모았다(주장).

    '
  points:
  - 유튜버 PewDiePie가 만든 self-hosted AI 워크스페이스(MIT, 2026-05-31)
  - Python/FastAPI/SQLite/ChromaDB/Docker + Ollama·llama.cpp·vLLM 로컬 구동
  - '''로컬이면'' 프라이버시지만 클라우드 API 연결 시 데이터는 외부로'
  source: https://github.com/pewdiepie-archdaemon/odysseus
- category: ai
  title: OpenAI GPT-5.5 'Spud' — GPT-4.5 이후 첫 완전 재학습 에이전트 모델(2026-04-23)
  summary: 'OpenAI가 2026-04-23 코드네임 ''Spud''로 GPT-5.5를 공개했다. GPT-4.5 이후 첫 ''처음부터 다시 학습한'' 베이스 모델이라는 점이 핵심으로, 최소한의 사람 개입으로 다단계 컴퓨터 작업을 끝내도록 설계된 에이전트형 모델이다. 공식 발표 기준 Terminal-Bench 2.0에서 82.7%, GDPval 84.9%를 찍었다고 한다(OpenAI 주장). ChatGPT의 Plus·Pro·Business·Enterprise와 Codex에 함께 풀렸다. 벤치마크는 ''모델 단독''이 아니라 ''에이전트+모델 쌍''으로 읽어야 하며, 같은 시점 Terminal-Bench 2.1 공개 리더보드에서는 Codex CLI+GPT-5.5가 1위(83.4%)로 보고됐다.

    '
  points:
  - GPT-4.5 이후 첫 완전 재학습 베이스 모델, 코드네임 'Spud'(2026-04-23)
  - Terminal-Bench 2.0 82.7%·GDPval 84.9%(OpenAI 공식 발표 주장)
  - ChatGPT 유료 티어·Codex에 동시 배포, 에이전트형 다단계 작업 지향
  source: https://openai.com/index/introducing-gpt-5-5/
- category: ai
  title: Cursor Composer 2.5 — 'Composer 2 두 달 만'에 나온 자체 모델, Bugbot까지 갈아끼우다
  summary: 'Cursor가 자체 에이전트 모델 Composer 2를 낸 지 약 두 달 만에 Composer 2.5를 내놨다. CursorBench 과제를 평균 1달러 미만으로 끝낸다고 주장하는데, 같은 과제에서 Opus 4.7·GPT-5.5는 3~11달러가 든다는 비교를 함께 내세운다. 가격은 Standard 티어가 입력 100만 토큰당 $0.50·출력 $2.50, Fast 티어가 입력 $3.00·출력 $15.00다. Composer 2.5는 Cursor의 PR 리뷰 봇 Bugbot도 구동하게 됐는데, 평균 리뷰 시간이 약 5분에서 ~90초로 줄고 리뷰당 버그 검출이 평균 0.56→0.62로 10% 늘면서 실행 비용은 ~22% 낮아졌다고 한다(모두 Cursor 주장).

    '
  points:
  - Composer 2 출시 ~2개월 만의 자체 모델, CursorBench 과제 평균 <$1 주장
  - '가격: Standard 입력 $0.50/출력 $2.50, Fast 입력 $3.00/출력 $15.00(100만 토큰)'
  - Bugbot도 2.5로 전환 → 리뷰 ~90초·검출 +10%·비용 -22%(주장)
  source: https://cursor.com/changelog
- category: ai
  title: SlopCodeBench — 코딩 에이전트가 '오래 고칠수록' 코드가 망가지는 걸 재는 벤치마크(arXiv 2026)
  summary: '장기·반복 작업에서 코딩 에이전트가 시간이 갈수록 코드를 어떻게 퇴화시키는지를 따로 재겠다는 언어 비종속 벤치마크 SlopCodeBench(SCBench)다. 20개 문제를 93개 체크포인트로 쪼개, ''정확성 테스트는 통과하지만 구조는 침식되는'' 구간을 추적한다. 핵심 관찰은 (1)코드가 특정 ''구조적 끌개(attractor)''로 수렴하고, (2)품질이 실행 궤적마다 갈라지며, (3)리팩터링·개선이 정확성 테스트로는 안 잡히는 결함을 새로 들여온다는 것. 기존 연구가 시간에 따른 장황함·구조 침식을 추적하지 않았다는 공백을 메운다고 주장한다.

    '
  points:
  - 장기 반복 작업의 '코드 퇴화'를 20문제·93체크포인트로 추적
  - 정확성 테스트는 통과해도 구조가 침식 → 새 결함이 숨어듦
  - 기존 벤치마크가 안 보던 '시간에 따른 구조 침식'을 겨냥
  source: https://arxiv.org/html/2603.24755v1
- category: ai
  title: Builder Methods 'Agent OS v3' — 스펙 작성은 'Plan Mode'에 넘기고 표준만 주입하는 SDD 키트(2026)
  summary: '스펙 주도 개발(SDD) 도구 Agent OS가 ''2026용으로 더 가볍고 정렬된'' v3를 냈다. 가장 큰 변화는 스펙 작성을 Agent OS 명령이 직접 하지 않고 Claude Code(또는 Cursor 등)의 Plan Mode에 위임한다는 점 — 대신 /shape-spec이 표준·제품 미션을 고려한 질문을 던져 더 정렬된 스펙을 만들고 그 계획을 Agent OS 스펙 폴더에 자동 저장한다. /discover-standards로 코드베이스에서 표준을 발굴·제안·생성하고, /inject-standards로 대화·플랜·스킬 어디에든 index.yml 기반으로 관련 표준만 골라 주입한다. 산출물이 전부 마크다운이라 도구를 안 가린다.

    '
  points:
  - 'v3 핵심: 스펙 작성을 에이전트의 ''Plan Mode''에 위임'
  - /shape-spec(정렬된 스펙)·/discover-standards·/inject-standards(index.yml)
  - 산출물이 마크다운 → Claude Code·Cursor 등 도구 비종속
  source: https://github.com/buildermethods/agent-os/discussions/310
- category: ai
  title: SWE-bench Pro 공개셋 현황(2026-06) — 1위 GPT-5.4도 60% 못 넘고, 비공개셋은 더 떨어진다
  summary: '오염(학습 시 정답 노출)에 강한 차세대 벤치마크 SWE-bench Pro의 공개셋(731 태스크, Pass@1) 2026-06-09 기준 현황이다. GPT-5.4(xHigh)가 59.1%로 1위로, 신규 Muse Spark보다 4.1%p, 최고 Claude 런(Opus 4.6 thinking, 51.9%)보다 7.2%p 앞선다. 핵심은 오염 통제용 ''비공개 상용셋''으로, 인터넷에 없는 스타트업 18곳의 비공개 코드베이스 276 태스크에서 점수가 크게 떨어진다는 점 — 가장 강한 오염 통제 장치라는 주장이다. 오픈웨이트는 Pro에서 크게 밀려, 표준 스캐폴딩 리더보드 1위가 qwen3-coder-480b로 38.7%에 그친다.

    '
  points:
  - 공개셋(731태스크) 1위 GPT-5.4 59.1% — 최고 Claude 51.9%(Opus 4.6)
  - 비공개 상용셋 276태스크(스타트업 18곳)에서 점수 급락 = 오염 통제
  - 오픈웨이트는 Pro에서 부진(표준 스캐폴딩 1위 qwen3-coder 38.7%)
  source: https://www.morphllm.com/swe-bench-pro
- category: ai
  title: 백그라운드 코딩 에이전트 — '맡기고 잊는' 비동기 에이전트가 2026 주류가 되다
  summary: '백그라운드 코딩 에이전트란 격리된 클라우드 샌드박스에서 비동기로 도는 ''AI 소프트웨어 엔지니어''다. GitHub 이슈·Linear 티켓·Slack 메시지 같은 일감을 맡기면 수 분~수 시간 혼자 일한 뒤 PR을 돌려준다 — 타이핑을 보조하는 인라인 도구와 정반대로 ''티켓→클라우드 샌드박스→자율 편집→PR→사람 리뷰'' 한 사이클을 돈다. Devin(2024 말)으로 장기 에이전트 역량이 무르익은 뒤 2025년 Codex Cloud·Cursor Background Agents·Jules가 쌓였고, Anthropic의 Claude Code Remote Tasks가 2026-03-20 합류하며 카테고리가 주류가 됐다. 다만 모든 백그라운드 에이전트는 레포·CI 시크릿을 만지려 ''범위가 좁고 회수 가능한 비인간 ID''가 필요해, 기업이 보안 통제로 다루기 시작했다.

    '
  points:
  - '''티켓→클라우드 샌드박스→자율 편집→PR→리뷰'' 비동기 사이클'
  - Devin→Codex Cloud·Cursor BG·Jules→Claude Code Remote Tasks(2026-03-20)
  - 에이전트마다 '범위 좁고 회수 가능한 비인간 ID'가 새 보안 통제 지점
  source: https://securityboulevard.com/2026/06/6-background-ai-agents-for-async-development/
- category: ai
  title: Greptile — 디프가 아니라 '레포 전체'를 인덱싱해 파일·서비스 사이 버그를 잡는 코드리뷰 봇
  summary: 'Greptile은 PR의 디프만 보는 게 아니라 코드베이스 전체를 인덱싱해, 파일·서비스·의존성 ''사이''에 숨은 버그를 찾는 AI 코드리뷰 도구다. 변경이 아키텍처를 타고 어떻게 번지는지를 추적하고, 발견을 심각도로 분류해 신호 대 잡음비를 높이려 한다. 가격은 사용자당 월 $30(오픈소스·시리즈A 이전 스타트업은 무료/할인). 독립 평가에서 ''버그 검출률이 가장 높지만 오탐률도 가장 높다''는 트레이드오프가 거론된다 — 진짜 버그도, 잡음도 더 많이 나온다는 뜻(평가 출처별 편차 큼). 2026년 코드리뷰 시장은 PR 리뷰 댓글의 상당수를 자동 리뷰어가 다는 단계로 성숙했다.

    '
  points:
  - 디프가 아니라 '레포 전체 인덱싱'으로 파일·서비스 간 결함 추적
  - 가격 사용자당 월 $30(OSS·초기 스타트업 무료/할인)
  - '''최고 검출률 ↔ 최고 오탐률'' 트레이드오프(평가 출처별 편차)'
  source: https://www.greptile.com/content-library/best-ai-code-review-tools
- category: ai
  title: 한국 IT 기업 코딩 에이전트 도입 사례 — 토스페이먼츠·당근·채널톡의 공통 원칙
  summary: '2026년 한국 IT 기업들의 코딩 에이전트 도입 사례에서 공통 패턴이 보인다. 토스페이먼츠는 MCP 기반 AI 연동 서버를 만들어 PG 연동을 자동화하되, 아키텍처 설계와 결제 안정성 판단은 엔지니어가 쥐었다. 당근은 전사 AI 전환을 선언하고 해커톤·피처톤으로 지표 요약·에러 분석·매물 요약 같은 반복 업무를 자동화해 실험·배포 주기를 높이되 제품 방향과 핵심 의사결정은 사람 중심으로 뒀다. 채널톡은 Cursor를 전사 도구로 도입해 IDE까지 바꾸고 온보딩·리팩터링·PR 리뷰·UI 구현을 AI 중심으로 재설계했지만 구조 설계·품질 최종 책임은 사람이 진다. 세 사례의 공통 원칙: ''정형·반복 작업은 위임하되, 설계·품질·핵심 판단은 사람이 책임진다.''

    '
  points:
  - '토스페이먼츠: MCP 연동 서버로 PG 연동 자동화(안정성 판단은 사람)'
  - '당근: 전사 전환·해커톤으로 반복 업무 자동화(의사결정은 사람 중심)'
  - '채널톡: Cursor 전사 도입으로 IDE까지 교체(품질 책임은 사람)'
  source: https://www.codetree.ai/blog/2026-%EB%B0%94%EC%9D%B4%EB%B8%8C-%EC%BD%94%EB%94%A9-%ED%88%B4-5%EA%B0%80%EC%A7%80-%EC%B6%94%EC%B2%9C-ai-%EC%BD%94%EB%94%A9-%ED%88%B4%EB%A1%9C-%EB%8B%AC%EB%9D%BC%EC%A7%84-%EA%B0%9C%EB%B0%9C%EC%9E%90/
- category: ai
  title: SWE-Skills-Bench — 에이전트 스킬은 만능 부스터가 아니라 '맞춤 지식'이다
  summary: 'SWE-Skills-Bench는 SKILL.md 같은 절차 지식이 실제 소프트웨어 작업에 얼마나 도움 되는지 재는 벤치마크다. 공개 레포의 고정 커밋, 명확한 요구사항, 검증 테스트, 스킬 문서를 짝지어 ''스킬 있음/없음''을 비교한다. 논문 초록의 핵심 결과는 차갑다: 49개 스킬 중 39개는 pass-rate 향상이 0이고 평균 이득은 +1.2%에 그쳤다. 토큰 오버헤드는 경우에 따라 451%까지 늘었고, 버전이 안 맞는 지침은 오히려 성능을 깎았다. 교훈은 스킬을 많이 까는 게 아니라, 현재 레포·버전·작업에 정확히 맞는 좁은 스킬만 쓰는 것이다.

    '
  points:
  - 49개 public SWE skills + 고정 커밋 레포 + 요구사항 + 실행 테스트로 paired 평가
  - 39/49 스킬은 pass-rate 향상 0, 평균 이득 +1.2%; 일부는 버전 불일치로 성능 하락
  - 스킬은 범용 마법이 아니라 도메인·버전·작업 적합성이 맞을 때만 값이 난다
  source: https://github.com/GeniusHTX/SWE-Skills-Bench
- category: ai
  title: Codex /usage — 토큰 활동을 CLI 안에서 바로 보는 새 계기판
  summary: 'OpenAI Codex CLI 0.140.0은 `/usage` 뷰를 추가해 계정 토큰 활동을 일간·주간·누적 단위로 볼 수 있게 했다. 코딩 에이전트를 오래 돌릴 때 가장 먼저 무너지는 것은 코드가 아니라 운영 가시성이다. 사용량을 외부 대시보드나 추측에 맡기면 자동화 루프가 한도에 부딪힌 뒤에야 멈춘다. `/usage`는 터미널 작업 흐름 안에서 비용·한도 신호를 바로 확인하게 해, 긴 세션·서브에이전트·반복 검증을 어디까지 밀어도 되는지 판단하는 작은 제어면이 된다. 같은 릴리스는 `/goal` 대용량 입력 보존, 영구 세션 삭제, Claude Code 설정 가져오기 같은 운영 기능도 함께 넣었다. GitHub 레포는 2026-06-18 조회 기준 91.8k★, 최신 릴리스 0.140.0(2026-06-15)으로 활발히 유지되고 있다.

    '
  points:
  - '0.140.0 신기능: `/usage`로 일간·주간·누적 토큰 활동 확인'
  - 긴 자동화 루프에서 비용·한도 신호를 터미널 안에 고정
  - GitHub 91.8k★·848 릴리스, 최신 0.140.0(2026-06-15) 기준
  source: https://github.com/openai/codex/releases
- category: ai
  title: GitHub Agent Apps — 마켓플레이스 앱처럼 설치하는 코딩 에이전트
  summary: 'GitHub Agent Apps는 AI 에이전트를 GitHub App처럼 설치해 이슈·PR·Agents UI에서 바로 호출하게 하는 기능이다. GitHub의 2026-06-02 changelog는 첫 파트너 앱을 Marketplace에서 설치하고, 관리자가 활성화하면 세 가지 진입점 — 이슈 assignee로 지정, PR 댓글에서 @멘션, Agents UI에서 프롬프트 입력 — 으로 쓸 수 있다고 설명한다. 중요한 변화는 에이전트가 IDE 밖으로 나와 GitHub 워크플로 자체의 ''할당 가능한 작업자''가 된다는 점이다. Amplitude, Bright Security, Endor Labs, LaunchDarkly, Miro, Sonar, PagerDuty, Packfiles, Octopus Deploy가 첫 wave로 공개됐고, GitHub Docs는 사용량이 Copilot cloud agent와 같은 방식으로 AI credits를 소비한다고 못박는다.

    '
  points:
  - '설치 모델: GitHub Marketplace의 GitHub App처럼 설치·관리자 활성화'
  - '진입점: 이슈 assignee, PR @멘션, Agents UI 프롬프트'
  - 첫 wave 9개 파트너, 사용량은 Copilot cloud agent처럼 AI credits 과금
  source: https://github.blog/changelog/2026-06-02-extend-github-with-agent-apps/
- category: ai
  title: GitHub Agentic Workflows — 자연어 마크다운을 Actions YAML로 컴파일하는 에이전트 자동화
  summary: 'GitHub Agentic Workflows는 이슈 분류, CI 실패 분석, 문서 업데이트처럼 추론이 필요한 반복 작업을 GitHub Actions 안의 코딩 에이전트로 자동화하는 public preview다. 핵심은 자동화를 자연어 Markdown 파일로 정의하면 표준 Actions YAML로 컴파일된다는 점이다. 그래서 새 에이전트 플랫폼을 따로 운영하는 대신 기존 runner group, 정책, Actions 승인 흐름을 재사용한다. 보안 장치도 제품의 중심에 있다: 기본 읽기 전용 권한, sandboxed container, Agent Workflow Firewall, safe outputs, threat detection 작업을 거친다. 같은 날 업데이트로 장기 PAT 없이 Actions 기본 GITHUB_TOKEN을 쓸 수 있게 됐고, 조직 과금은 copilot-requests: write 권한과 비용 관리 도구로 통제한다.

    '
  points:
  - 자연어 Markdown 자동화 정의 → 표준 GitHub Actions YAML로 컴파일
  - 기본 read-only, sandbox, firewall, safe outputs, threat detection으로 안전장치 내장
  - PAT 없이 GITHUB_TOKEN 사용 가능, 조직 AI credits 과금·사용량 cap 관리
  source: https://github.blog/changelog/2026-06-11-github-agentic-workflows-is-now-in-public-preview/
- category: ai
  title: Supabase Agent Plugin — MCP 서버와 스킬을 한 번에 까는 백엔드 작업 키트
  summary: 'Supabase Agent Plugin은 AI 코딩 에이전트가 Supabase 프로젝트를 다룰 때 필요한 MCP 서버와 agent skills를 한 번에 설치하게 해주는 공식 플러그인이다. MCP 서버는 테이블 조회, SQL 실행, 마이그레이션 적용, 로그·보안/성능 advisor 조회 같은 도구를 에이전트에 붙이고, 스킬은 Supabase·Postgres 작업 절차와 베스트프랙티스를 컨텍스트로 준다. 핵심은 "DB를 아는 척하는 에이전트"가 아니라 실제 프로젝트에 연결된 도구와 좁은 절차 지식을 함께 주는 것. 공식 배포 repo는 Claude Code, Cursor, Codex, GitHub Copilot, Gemini용 매니페스트와 MCP 어댑터를 나눠 둔다.

    '
  points:
  - 한 번 설치로 Supabase MCP 서버 + agent skills를 함께 제공
  - '도구: 테이블/확장/마이그레이션/SQL/로그/advisor 등 프로젝트 직접 조작'
  - '지원 표면: Claude Code·Cursor·Codex·GitHub Copilot·Gemini 배포 repo'
  source: https://supabase.com/docs/guides/ai-tools/plugins
- category: ai
  title: GitHub Code Quality GA — AI 리뷰·품질 게이트·과금 경계를 같이 설계
  summary: GitHub Code Quality는 2026-07-20부터 public preview를 끝내고 GitHub Team·Enterprise Cloud 유료 제품으로 GA 전환된다. 10,000+ enterprise가 preview에서 유지보수성·신뢰성 이슈·quality gate·coverage tracking에 활용했다. GA 뒤 활성 committer당 월 $10 기본 + AI-powered 기능 usage-based billing. CodeQL deterministic 분석은 Actions minutes, Copilot code review·AI-assisted detection·Autofix는 별도 사용량. AI 리뷰를 "공짜 보조 댓글"로 보지 말고 PR ruleset·coverage threshold·Autofix 권한을 비용·품질·책임 경계와 함께 정해야 한다.
  points:
