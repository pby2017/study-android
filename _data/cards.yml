  title: Android Studio BYOA — ACP 코딩 에이전트에 Emulator·Build·Logcat 도구 연결
  level: "중급"
  summary: 'Android Studio Rabbit 2의 Bring Your Own Agent(BYOA)는 Claude Agent·Codex·Junie·Antigravity 등을 포함한 40개 이상의 ACP 호환 코딩 에이전트를 IDE 안에서 선택하게 한다. 연결된 에이전트는 Android Emulator, 빌드 시스템, Logcat 같은 Android Studio 도구와 Android skills를 사용할 수 있다. 핵심은 모델이나 에이전트를 바꾸지 않고도 Android 프로젝트 맥락과 검증 도구를 에이전트 작업 흐름에 붙이는 것이다. 변경 생성 뒤에는 AI Change Review의 추천 수정과 묶음별 walkthrough로 diff를 확인할 수 있다.'
