      코딩 에이전트 실행을 채팅창의 일회성 버튼이 아니라 queue, status, PR output을 가진 운영 리소스로 다루게
      만든다. 개발팀 관점의 핵심은 자동화를 붙일 때 에이전트에게 바로 쓰기 권한을 넓히는 것이 아니라, 어떤
      task가 언제 생성됐고 어떤 PR로 끝났는지 관측 가능한 API 표면을 먼저 확보하는 것이다.
    points:
      - "REST API로 Copilot coding agent task 생성·목록·상태·결과 PR 조회"
      - "채팅 이벤트가 아니라 queue와 lifecycle이 있는 작업 리소스로 모델링"
      - "자동화 전 관측성·권한 경계·PR 추적을 먼저 설계해야 함"
    source: "https://github.blog/changelog/2026-06-19-github-copilot-coding-agent-tasks-rest-api-now-available-in-public-preview/"

  - category: ai
    title: "Copilot Automations — 클라우드 에이전트에게 반복 유지보수를 맡기는 법"
    summary: >
      GitHub은 2026년 6월 20일 Copilot coding agent의 automations public preview를 공개했다. 사용자는
      자연어로 예약 작업을 만들 수 있고, Copilot은 GitHub Actions처럼 repository secrets와 hosted runner를
      이용해 정해진 주기마다 에이전트 작업을 실행한다. 예시는 매주 TODO comments 정리, dependency update,
      failing tests 조사처럼 반복 유지보수에 가깝다. 교육적 포인트는 에이전트 자동화가 cron을 대체한다는 뜻이
      아니라, 반복 작업을 "명령 실행"이 아닌 issue/PR 산출물과 review gate가 있는 maintenance loop로 설계해야
      한다는 점이다.
    points:
      - "자연어로 예약된 Copilot coding agent 작업을 만들 수 있는 public preview"
      - "repository secrets와 hosted runner를 사용해 GitHub Actions와 비슷한 실행 경계 제공"
      - "반복 유지보수는 issue/PR 산출물과 review gate가 있는 루프로 설계"
    source: "https://github.blog/changelog/2026-06-20-github-copilot-coding-agent-automations-in-public-preview/"

  - category: ai
    title: "VS Code Agents Window — 채팅 패널이 아니라 에이전트 작업대"
    summary: >
      Visual Studio Code의 2026년 5월 Copilot 릴리스는 Agents Window, plan mode, remote cloud agent
      sessions, custom instructions, terminal auto-approval controls를 함께 묶어 보여준다. 의미 있는 변화는
      AI가 사이드바에서 답만 하는 형태를 넘어, 계획을 세우고 원격 세션에서 작업하며 터미널 명령 승인 정책을
      따르는 개발 작업대로 들어온다는 점이다. 실무에서는 "에이전트가 알아서 해준다"가 아니라, plan mode로 변경
      의도를 먼저 고정하고 custom instructions와 terminal approval rule로 위험한 실행 경계를 좁힌 뒤 검증
      가능한 단위로 결과를 받는 운영 습관이 필요하다.
    points:
      - "Agents Window와 plan mode로 에이전트 작업을 별도 표면에서 관리"
      - "remote cloud agent sessions와 custom instructions로 작업 컨텍스트를 유지"
      - "terminal auto-approval controls로 명령 실행 경계를 정책화"
    source: "https://github.blog/changelog/2026-06-12-github-copilot-in-visual-studio-code-may-releases/"

  - category: ai
    title: "Copilot Chronicle — 에이전트 세션 기록을 팀 지식으로 바꾸기"
    summary: >
      GitHub은 Copilot CLI의 `/chronicle`이 Copilot cloud agent, code review, Copilot app, VS Code,
      JetBrains 세션까지 더 넓게 읽게 됐다고 밝혔다. Chronicle은 개인 에이전트 세션 기록에서 standup
      summary, personalized tips, custom instructions를 만들어 이전 작업 맥락을 다시 쓰게 한다. 로컬 세션은
      GitHub 계정에 동기화되어 저장소 Agents 탭에서 함께 볼 수 있고, 기본은 개인 비공개이며 필요하면 view-only
      형태로 공유할 수 있다. 실무 포인트는 "채팅 로그 저장"이 아니라, 에이전트가 만든 결정·실패·검증 흔적을
      다음 세션의 지시문과 팀 공유 자료로 승격시키는 운영 루프를 설계하는 것이다.
    points:
      - "`/chronicle`이 여러 Copilot 표면의 세션 기록을 요약·팁·custom instructions로 변환"
      - "로컬 세션도 GitHub 계정과 저장소 Agents 탭에 동기화 가능"
      - "기록은 기본 비공개, 필요할 때 view-only 공유로 팀 맥락 제공"
    source: "https://github.blog/changelog/2026-06-02-gain-insights-across-your-agent-sessions-with-chronicle/"

  - category: ai
    title: "Copilot BYOK 모델 — 기업 모델 정책을 CLI의 /model 선택지로 내리기"
    summary: >
      GitHub은 2026년 6월 17일 Copilot CLI가 enterprise bring your own key 모델을 지원한다고 발표했다.
      관리자가 외부 제공자 모델을 설정하면 개발자는 CLI의 `/model` picker에서 해당 모델을 고를 수 있고,
      별도로 개인 사용자는 클라이언트 쪽에서 로컬 모델이나 외부 모델도 구성할 수 있다. 중요한 변화는 모델
      선택이 개인 취향 프롬프트가 아니라 기업 정책·키 관리·비용 구조와 연결된 실행 옵션이 된다는 점이다.
      에이전트 운영에서는 모델명을 문서에 박아두기보다, 허용 모델 목록과 업무별 선택 기준을 관리 표면에서
      내려보내고 감사 가능한 방식으로 쓰게 해야 한다.
    points:
      - "enterprise admin이 설정한 외부 제공자 모델이 Copilot CLI `/model` picker에 노출"
      - "개인 사용자는 클라이언트 쪽 로컬 모델·외부 모델도 구성 가능"
      - "모델 선택을 프롬프트 상수가 아니라 정책·키·비용 관리 대상으로 다뤄야 함"
    source: "https://github.blog/changelog/2026-06-17-copilot-cli-supports-enterprise-bring-your-own-key-byok-models/"

  - category: ai
    title: "Copilot Bypass Controls — yolo 모드를 조직 정책으로 끄기"
    summary: >
      GitHub은 enterprise-managed settings에 첫 governance capability로 `disableBypassPermissionsMode`를
      추가했다. 관리자가 enterprise-managed `settings.json`에 이 값을 `disable`로 두면 Copilot CLI와
      VS Code가 permission prompt를 자동으로 건너뛰는 auto-approve, 이른바 yolo mode를 막을 수 있다.
      설정은 `.github-private` 기반 관리 저장소에서 배포되고, VS Code 1.122 이상은 해당 정책을 따른다.
      개발팀 관점의 핵심은 에이전트 속도보다 실행 권한 경계를 먼저 표준화하는 것이다. 자동 명령 승인은 개인
      편의 기능이 아니라 보안·감사 정책으로 통제해야 할 운영 리스크다.
    points:
      - "`disableBypassPermissionsMode: disable`로 Copilot CLI·VS Code의 자동 승인 우회를 차단"
      - "enterprise-managed settings와 `.github-private` 관리 저장소로 정책 배포"
      - "에이전트 명령 실행은 개인 습관이 아니라 조직 governance 설정으로 관리"
    source: "https://github.blog/changelog/2026-06-17-enterprise-managed-settings-now-support-bypass-permission-controls/"

  - category: ai
    title: "Codex 자기개선 루프 — 운영 피드백을 eval로 바꿔 다시 고치기"
    summary: >
      OpenAI와 Thrive Holdings는 Tax AI 사례에서 Codex를 이용한 self-improving agent 패턴을 공개했다.
      핵심 구조는 전문가 피드백, production traces, Codex-driven eval iteration 세 가지다. Crete 참여 회계법인
      네트워크에서 파일럿 동안 7,000건의 세무 신고를 처리했고, 작성 시간을 약 3분의 1 줄이며 최대 97% 정확도와
      약 50% 처리량 증가를 보고했다. 더 중요한 교육 포인트는 숫자보다 루프다. 현업 전문가의 수정이 실패 신호가
      되고, 제품 trace가 재현 가능한 eval로 바뀌며, Codex가 그 eval을 넘기도록 제품을 고치는 구조를 만들면
      배포 후 실패가 수동 티켓이 아니라 지속 개선 재료가 된다.
    points:
      - "구조: practitioner feedback + production traces + Codex-driven eval iteration"
      - "파일럿: 7,000건 세무 신고 처리, 최대 97% 정확도와 약 50% 처리량 증가 보고"
      - "운영 실패를 trace와 eval로 보존해야 에이전트가 안전하게 자기개선할 수 있음"
    source: "https://openai.com/index/building-self-improving-tax-agents-with-codex/"

  - category: ai
    title: "Ona + Codex — 오래 걸리는 에이전트 작업은 실행 장소가 제품이다"
    summary: >
      OpenAI는 2026년 6월 11일 Ona 인수 계획을 발표하며, Codex를 단일 노트북·단일 세션에 묶인 도구에서
      보안·거버넌스가 있는 지속 실행 환경으로 확장하겠다고 밝혔다. 핵심은 모델 성능만이 아니라 에이전트가
      몇 시간 또는 며칠 동안 접근할 도구, 시스템, 컨텍스트, 로그, credential scope를 어디서 통제하느냐다.
      개발팀이 배울 점은 "코딩 에이전트를 클라우드에서 돌린다"가 아니라, 장시간 작업을 맡길수록 sandbox,
      리뷰 게이트, 활동 로그, 데이터 경계를 먼저 설계해야 한다는 점이다. 에이전트의 생산성은 프롬프트보다
      신뢰할 수 있는 작업공간에서 결정된다.
    points:
      - "Ona는 Codex에 secure, persistent execution 환경을 붙이는 방향"
      - "장시간 에이전트 작업은 도구 접근·로그·credential scope가 핵심 설계 대상"
      - "모델 선택보다 먼저 실행 장소와 governance 경계를 정해야 함"
    source: "https://openai.com/index/openai-to-acquire-ona/"

  - category: ai
    title: "AgentKit 종료 공지 — 시각 빌더보다 코드로 남는 에이전트가 오래간다"
    summary: >
      OpenAI는 AgentKit 글에 2026년 6월 3일 업데이트를 붙여 Agent Builder와 Evals 제품을 단계적으로
      종료한다고 공지했다. 2026년 11월 30일 이후 OpenAI 플랫폼에서 사용할 수 없으며, 코드로 유지해야 하는
      워크플로는 Agents SDK를 권장한다. 이 카드는 특정 제품 종료 소식보다 운영 교훈이 중요하다. 에이전트
      워크플로가 실험 단계를 지나 반복 운영 자산이 되면, 화면에서 만든 플로우보다 버전 관리되는 코드,
      테스트, 배포 파이프라인, 마이그레이션 가능한 추상화가 오래 버틴다. 에이전트 설계도 결국 소프트웨어
      수명주기 안에 들어와야 한다.
    points:
      - "Agent Builder와 Evals는 2026-11-30 이후 OpenAI 플랫폼에서 제공 중단 예정"
      - "코드로 지속해야 하는 워크플로는 Agents SDK로 이전 권장"
      - "운영 에이전트는 시각 플로우보다 버전 관리·테스트 가능한 코드 자산이어야 함"
    source: "https://openai.com/index/introducing-agentkit/"

  - category: ai
    title: "DiffusionGemma — 토큰을 왼쪽부터 쓰지 않는 LLM 서빙"
    summary: >
      Google의 DiffusionGemma 개발자 가이드는 Gemma 4 기반 실험 모델이 자동회귀식 한 토큰 생성 대신
      256-token canvas를 병렬로 정제하는 구조를 설명한다. GPU에서는 메모리 대역폭 병목을 계산 병목으로
      옮겨 최대 4배 빠른 token generation을 목표로 하고, 26B MoE 중 inference 때 3.8B 파라미터만 활성화해
      quantized 배포를 18GB VRAM 안에 맞추도록 설계됐다. 실무 포인트는 "새 모델이 빠르다"가 아니라, vLLM
      같은 서빙 엔진도 autoregressive 전제에서 벗어나 denoising loop와 block 단위 KV cache를 다뤄야 하는
      시대가 온다는 점이다.
    points:
      - "256-token canvas를 병렬 denoising으로 정제하는 diffusion-style generation"
      - "26B MoE지만 inference 활성 파라미터는 3.8B, quantized 배포는 18GB VRAM 목표"
      - "vLLM 통합처럼 서빙 엔진이 autoregressive 전제 밖의 루프를 지원해야 함"
    source: "https://developers.googleblog.com/diffusiongemma-the-developer-guide/"

  - category: ai
    title: "Copilot-authored PR 검색 — 에이전트 산출물도 사람 책임 뷰에 합치기"
    summary: >
      GitHub은 2026년 6월 18일 `author:` 검색이 Copilot cloud agent가 사용자 지시에 따라 연 PR까지 함께
      보여주도록 바뀌었다고 공지했다. `author:@me`와 Created by me 뷰가 사람이 직접 만든 PR과 Copilot이
      대신 연 PR을 함께 보여주며, GitHub Mobile과 웹 UI에 먼저 적용되고 REST/GraphQL API는 2026년 7월
      16일 rollout 예정이다. 교육 포인트는 에이전트 PR을 별도 봇 산출물로 치워 두지 말라는 것이다. 사람이
      시킨 작업이면 검색, 대시보드, 릴리스 노트, 감사 흐름에서 그 사람의 책임 범위로 함께 보여야 review와
      ownership이 끊기지 않는다.
    points:
      - "`author:@me`가 human-authored PR과 Copilot-authored PR을 함께 반환"
      - "웹 UI와 GitHub Mobile 먼저 적용, REST/GraphQL API는 2026-07-16 rollout 예정"
      - "에이전트 산출물도 요청한 사람의 ownership·review 흐름 안에 보여야 함"
    source: "https://github.blog/changelog/2026-06-18-copilot-authored-pull-requests-now-included-in-author-searches/"

  - category: ai
    title: "Copilot AI credits API — 에이전트 비용을 팀 단위로 관측하기"
    summary: >
      GitHub은 2026년 6월 19일 Copilot usage metrics API의 사용자별 리포트에 `ai_credits_used` 필드를
      추가했다. 이 값은 하루 또는 28일 user-level report에서 각 사용자의 전체 Copilot 활동이 소비한 AI
      credits를 보여준다. 단, 기능·모델·표면별 분해값이나 청구서 자체가 아니라 소비 경향을 보는 운영 지표다.
      실무 포인트는 AI 코딩 도구를 "개인 생산성 도구"로만 두지 않는 것이다. 팀별 채택률, 실제 사용량,
      예산 예측을 같은 리포트에서 보며, 어떤 자동화가 비용 대비 가치가 있는지 관측 가능한 루프로 관리해야 한다.
    points:
      - "`ai_credits_used`가 user-level 1일·28일 Copilot usage report에 추가"
      - "enterprise admin·organization owner가 REST API로 소비 경향을 확인"
      - "청구서가 아니라 adoption·budget planning을 위한 운영 지표로 해석"
    source: "https://github.blog/changelog/2026-06-19-ai-credits-consumed-per-user-now-in-the-copilot-usage-metrics-api/"

  - category: ai
    title: "MAI-Code-1-Flash — 작은 코딩 모델을 표면마다 다르게 쓰기"
    summary: >
      GitHub은 2026년 6월 18일 Microsoft의 소형 코딩 모델 MAI-Code-1-Flash를 더 많은 Copilot 표면에
      확장한다고 공지했다. Copilot CLI, Copilot app, GitHub Chat, Visual Studio, GitHub Mobile, JetBrains,
      Eclipse, Xcode에서 순차 제공되며, 문서상 GA 모델이자 Copilot auto model selection 후보에도 포함된다.
      교육 포인트는 "작은 모델이면 낮은 품질"이 아니라, 짧은 설명·반복 수정·가벼운 CLI 작업처럼 대기시간과
      비용이 중요한 흐름에는 경량 모델을 기본값으로 두고, 복잡한 설계·디버깅은 강한 reasoning 모델로 올리는
      라우팅 전략을 세우는 것이다.
    points:
      - "MAI-Code-1-Flash는 Microsoft 제공 GA 코딩 모델"
      - "Copilot CLI·앱·모바일·IDE 등 여러 표면으로 확장"
      - "가벼운 반복 작업은 경량 모델, 복잡한 판단은 강한 모델로 라우팅"
    source: "https://github.blog/changelog/2026-06-18-mai-code-1-flash-available-on-more-copilot-surfaces/"

  - category: ai
    title: "Tensor SDK Beta + LiteRT — Pixel NPU 배포를 하나의 경로로 묶기"
    summary: >
      Google은 2026년 5월 Tensor ML SDK를 Beta로 올리며 Pixel 10 계열에서 Tensor TPU를 쓰는 온디바이스
      AI 개발 경로를 LiteRT와 통합했다. 개발자는 PyTorch 또는 TFLite 모델을 LiteRT Torch로 변환·컴파일하고,
      Play Feature Delivery와 AI Packs로 런타임·컴파일러·모델 파일을 배포한 뒤 LiteRT Runtime에서 TPU를
      우선 사용하고 CPU/GPU fallback을 지정할 수 있다. Android AI 개발에서 배울 점은 "NPU를 직접 호출"이
      아니라, 변환·배포·fallback까지 같은 파이프라인에 넣어 기기별 가속 실패를 제품 안정성 문제로 관리하는 것이다.
    points:
      - "Tensor ML SDK Beta가 LiteRT와 통합되어 Pixel 10 Tensor TPU 경로 제공"
      - "변환·컴파일·Play Feature Delivery·AI Packs·LiteRT Runtime을 하나로 연결"
      - "TPU 우선 실행 + CPU/GPU fallback을 앱 배포 전략에 포함"
    source: "https://developers.googleblog.com/google-tensor-sdk-beta-with-litert/"

  - category: ai
    title: "LiteRT + Arm SME2 — 모바일 CPU도 GenAI 가속 경로가 된다"
    summary: >
      Google AI Edge와 Arm은 LiteRT가 XNNPACK·KleidiAI 통합을 통해 Arm SME2를 런타임에서 자동 활용하는
      온디바이스 AI 최적화 흐름을 설명했다. Stable Audio Open Small을 PyTorch에서 LiteRT로 변환하고,
      Model Explorer와 AI Edge Quantizer로 quantization-safe layer를 확인한 뒤 INT8/FP16 최적화를 적용한다.
      결과로 DiT submodel은 약 4배 작아지고, Android SME2 기기에서는 14초 작업이 6.6초로 줄었다. 핵심은
      "전용 NPU가 없으면 끝"이 아니라, CPU 경로도 측정·양자화·delegate 자동 선택으로 제품급 fallback이 될 수
      있다는 점이다.
    points:
      - "LiteRT가 XNNPACK·KleidiAI를 통해 Arm SME2 가속을 자동 활용"
      - "Model Explorer로 양자화 안전성을 확인하고 AI Edge Quantizer로 INT8 적용"
      - "Android SME2 기기에서 14초→6.6초, DiT submodel 약 4배 축소 사례"
    source: "https://developers.googleblog.com/accelerating-on-device-ai-a-look-at-arm-and-google-ai-edge-optimization/"

  - category: ai
    title: "Karrot Firebase AI Logic — 번역 AI는 품질보다 배포 경로가 먼저다"
    summary: >
      Google Android Developers Blog의 Karrot 사례는 AI+Android 기능 선택의 기준을 잘 보여준다. Karrot은
      북미 사용자 중 비영어 기기 언어 사용자가 30%라는 문제를 확인했고, ML Kit Translation과 Gemini Nano를
      먼저 시험했지만 품질과 모델 다운로드 장벽 때문에 Firebase AI Logic + Gemini Flash Lite를 선택했다.
      PoC는 3시간 안에 만들었고, 전용 백엔드 없이 2주 만에 프로덕션 기능으로 전환했다. 결과적으로 번역 배너를
      본 비영어 사용자 3명 중 1명이 기능을 사용했고, 번역 기능을 제공받은 구매자는 판매자와 채팅을 시작할
      가능성이 2.4배 높았다. 교훈은 모델 이름보다 배포 경로, UX opt-in, 프롬프트 운영을 먼저 검증하라는 점이다.
    points:
      - "ML Kit Translation·Gemini Nano를 시험한 뒤 Firebase AI Logic + Gemini Flash Lite 선택"
      - "PoC 3시간, 전용 백엔드 없이 2주 만에 프로덕션 반영"
      - "번역 제공 구매자는 판매자 채팅 시작 가능성이 2.4배 높았다고 보고"
    source: "https://android-developers.googleblog.com/2026/05/how-karrot-increased-sales-with-gemini-firebase-ai-translation.html"

  - category: ai
    title: "ML Kit GenAI 지원표 — 기능마다 되는 기기가 다르다"
    summary: >
      ML Kit GenAI API는 "Android에서 Gemini Nano를 쓴다" 한 줄로 끝나지 않는다. 2026년 6월 19일 기준
      공식 문서는 Summarization, Proofreading, Rewriting, Image Description 같은 feature-specific API와
      Prompt API의 지원 기기 목록을 따로 둔다. Prompt API도 nano-v2와 nano-v3 기기가 나뉘며, Speech
      Recognition은 대부분의 API 31+ 기기에서 되는 Basic Mode와 Pixel 10 중심의 Advanced Mode가 갈린다.
      실무 포인트는 출시 전에 기능 단위로 device matrix를 만들라는 것이다. 같은 "온디바이스 GenAI"라도
      요약은 되고 맞춤 프롬프트는 안 되는 기기가 생길 수 있다.
    points:
      - "feature-specific API와 Prompt API는 지원 기기 목록이 다름"
      - "Prompt API는 nano-v2·nano-v3 기기군을 구분"
      - "Speech Recognition은 Basic Mode와 GenAI 기반 Advanced Mode를 분리해서 설계"
    source: "https://developers.google.com/ml-kit/genai"

  - category: ai
    title: "ML Kit GenAI 쿼터 — 온디바이스 AI도 무제한이 아니다"
    summary: >
      온디바이스 AI라고 해서 앱이 마음대로 계속 추론할 수 있는 것은 아니다. ML Kit GenAI 문서는 AICore가
      앱별 inference quota를 강제한다고 설명한다. 짧은 시간에 요청이 많으면 `ErrorCode.BUSY`가 나올 수 있고,
      장시간 quota를 넘기면 `ErrorCode.PER_APP_BATTERY_USE_QUOTA_EXCEEDED`가 반환될 수 있다. 또한 GenAI
      inference는 앱이 top foreground application일 때만 허용되며, foreground service에서 호출해도
      `ErrorCode.BACKGROUND_USE_BLOCKED`가 날 수 있다. Android AI 기능은 모델 호출 코드보다 retry, backoff,
      foreground UX, 배터리 예산을 먼저 제품 요구사항에 넣어야 한다.
    points:
      - "AICore가 앱별 inference quota를 적용"
      - "`BUSY`·`PER_APP_BATTERY_USE_QUOTA_EXCEEDED`를 retry/backoff 설계에 반영"
      - "GenAI inference는 top foreground 앱에서만 허용, 백그라운드 호출은 차단 가능"
    source: "https://developers.google.com/ml-kit/genai"

  - category: ai
    title: "Gemini Nano 버전 체크 — 프롬프트 품질을 기기별로 검증하기"
    summary: >
      ML Kit GenAI 문서는 Gemini Nano 버전에 따라 같은 프롬프트도 다른 출력이 나올 수 있다고 경고한다.
      그래서 기기에서 실행 중인 Nano 버전을 확인하려면 `getBaseModelName()`을 사용하고, 앱의 use case가
      여러 Nano 버전에서 괜찮은지 prompt quality evaluation을 해야 한다. 이건 작은 구현 팁이 아니라 Android
      AI QA의 핵심이다. 서버 모델 하나를 고정하는 방식과 달리 온디바이스 모델은 기기·다운로드 상태·세대에 따라
      달라진다. 따라서 출시 전 테스트 매트릭스에는 OS/API level뿐 아니라 Nano base model, streaming 여부,
      실패 코드, 언어 지원까지 들어가야 한다.
    points:
      - "`getBaseModelName()`으로 기기의 Gemini Nano 버전을 확인"
      - "Nano 버전이 다르면 같은 프롬프트도 출력이 달라질 수 있음"
      - "Android AI QA는 모델 버전별 prompt quality evaluation을 포함해야 함"
    source: "https://developers.google.com/ml-kit/genai"
  - category: ai
    title: "RA.Aid — 연구·계획·구현 3단계로 개발 작업을 자율 수행하는 LangGraph 기반 코딩 에이전트"
    summary: >
