- category: ai
  title: 'fabric: 프롬프트를 Pattern으로 모아 쓰는 AI 증강 프레임워크'
  summary: '"an open-source framework for augmenting humans using AI" — AI의 기본 단위인 프롬프트 자체를 마크다운 ''Pattern''으로 만들어 정리·재사용. summarize·extract_wisdom 등.

    '
  points:
