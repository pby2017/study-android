  - 서버는 `elicitation/create` + JSON Schema로 필요한 추가 입력을 요청
  - 응답은 accept/decline/cancel 3상태 — 사용자가 검토·수정·거절 가능
  - 민감 정보 요청 금지, 서버 표시·스키마 검증·rate limit이 안전 기본값
