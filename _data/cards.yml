  - label: 'OpenAI Codex CLI — 로컬 저장소 작업, codex exec 자동화, 권한 설정'
    url: https://developers.openai.com/codex/cli
  - label: 'Codex authentication — ChatGPT 및 대체 인증 옵션'
    url: https://developers.openai.com/codex/auth
