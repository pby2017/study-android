  title: CodeRabbit — push 전 로컬 리뷰와 PR 리뷰를 나눠 쓰는 AI 코드 리뷰어
  summary: CodeRabbit은 PR 변경을 분석하는 리뷰어이며, CLI·IDE에서 push 전에 로컬 변경을 검사하는 기능도 제공한다. 로컬 리뷰는 finding을 작업 터미널이나 편집기에 보여주고, PR 리뷰는 요약·walkthrough·PR 대화 기능을 더한다. 따라서 비용과 피드백 시점을 따져 필요한 단계에 배치할 수 있다. 공식 요금표는 공개 저장소 리뷰 무료 플랜을 안내하지만, 유료 플랜에도 개발자별 시간당 포함 리뷰 한도가 있고 초과분은 설정에 따라 사용량 과금될 수 있다. 자동 코멘트는 검토 후보이지 merge 승인이나 테스트를 대체하지 않는다.
  points:
