  title: MLX — Apple Silicon 전용 ML 프레임워크, unified memory·lazy compute·M5 Neural Accelerator(MIT·~26k★)
  summary: MLX는 Apple ML Research가 만든 Apple Silicon 전용 array 프레임워크로, unified memory 아키텍처를 활용해 GPU·CPU·Neural Engine 간 데이터 복사 없이 효율적 수치 연산·학습·추론을 제공한다. NumPy-like core + PyTorch/JAX-like nn·optimizer 패키지, lazy computation·automatic differentiation·function transformation을 지원한다. Python·Swift·C++·C API, WWDC25 공식 세션. MLX-LM으로 Hugging Face LLM 텍스트 생성·파인튜닝, macOS 26.2+ JACCL(RDMA over Thunderbolt)로 Mac 간 분산 학습. M5 Neural Accelerator(TensorOps·Metal 4) 지원으로 inference 가속.
