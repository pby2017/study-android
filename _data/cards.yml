- category: ai
  title: Benchmark Misalignment position — harness≠model·component-level eval 필요
  summary: Position paper(arXiv 2606.17799·June 2026) — coding benchmark가 agentic SE와 structurally misaligned. pre-agent era 설계가 model+harness+environment+feedback을 single end-to-end pass rate로 collapse, single reference solution grading, component signal absence 3 symptom. evidence — Claude Opus 4.6 fixed, harness choice alone 58.0–79.8% Terminal-Bench spread(>20pp, adjacent model generation comparable). remedy — submission metadata(model·harness version·env hash·dataset version)+non-model ablation, behavioural spec allowing multiple valid solutions, per-component span grading not monolithic pass/fail. vs RigorBench(process discipline) ·Layer-Isolated(production gate) — position paper=benchmark design philosophy for harness-aware iteration.
  points:
  - Harness spread >20pp same model — leaderboard model credit is misleading
  - Single GT penalizes valid alternatives — apparent capability artificially suppressed
  - Component-level signal — retriever/router/tool/reasoning span metrics for iteration
  source: https://arxiv.org/abs/2606.17799
- category: ai
  title: Token cost write-time attribution — trace_id·event_id·gateway idempotency
  summary: Agent cost attribution is write-time property(UsageBox 2026) — provider invoice·post-hoc log로 tool call·sub-agent branch·retry chain reconstruct 불가. every model call gateway에서 structured usage event emit — trace_id·customer_id·feature_id·agent_step·model dimensions. idempotency — stable event_id, meter counts once(at-least-once delivery dedup); genuine retry=new event_id. hierarchy — virtual key per agent role, run_id in provider user field, step-level x-litellm-response-cost header accumulation. multi-tenant SaaS — interceptor strips business headers before provider, ledger stores tenant_id+feature_id for showback/chargeback. runtime budget reject at gateway when tenant quota exhausted. vs Helicone(proxy FinOps) ·OTEL GenAI(token span) — write-time attribution=billing system not dashboard nicety.
