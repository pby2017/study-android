  title: DeepSeek R1 — 오픈웨이트 추론 모델, 671B MoE에서 37B만 활성·투명한 CoT·o3 대비 73% 저렴(MIT)
  summary: 'DeepSeek R1은 오픈웨이트 추론 모델로 GRPO 강화학습으로 학습되었다. 671B MoE 아키텍처에서 토큰당 37B만 활성화하여 비용 효율적. 핵심 차별점: 추론 과정(Chain-of-Thought)이 완전 투명하게 스트리밍되어 디버깅·감사·컴플라이언스에 유리. o3 대비 토큰당 73% 저렴($0.55/$2.19 vs $2/$8). 대부분의 실무 추론 태스크에서 o3의 85~97% 성능. 의료·법률·금융 분야에서 감사 가능성 때문에 R1 선호.

    '
  points:
  - 'MoE: 671B 중 37B만 활성, 73% 저렴'
  - '투명 CoT: 추론 과정 완전 공개, 감사 가능'
  - '오픈웨이트(MIT): 셀프호스팅, 커스터마이징 가능'
