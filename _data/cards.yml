  title: LoRAX — 단일 GPU에서 수천 개 LoRA 어댑터를 동시 서빙, 이종 연속 배칭으로 처리량 유지
  summary: 'LoRAX(LoRA eXchange)는 Predibase의 오픈소스 추론 서버로, 하나의 베이스 모델 위에 수천 개 파인튜닝 LoRA 어댑터를 동적으로 로딩해 서빙한다. 핵심 기술 3가지: 동적 어댑터 로딩(요청마다 JIT 로드, 동시 요청 미차단), 이종 연속 배칭(서로 다른 어댑터 요청을 같은 배치에 패킹 → 어댑터 수 증가해도 처리량/지연 거의 일정), 티어드 가중치 캐싱(GPU↔CPU 비동기 프리페치). HuggingFace·S3·로컬 파일시스템에서 어댑터 로드. 요청별 어댑터 병합(Linear·TIES·DARE) 지원. 5개 어댑터 → 호스팅 비용 80% 절감.

    '
  points:
  - '이종 배칭: 다른 어댑터 요청을 같은 배치에'
  - 'JIT 로딩: 동시 요청 미차단, GPU↔CPU 캐싱'
