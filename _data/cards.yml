  title: LiteRT(구 TFLite) — Google 온디바이스 ML 표준, CompiledModel·Tensor SDK·Arm SME2
  summary: 'LiteRT는 Google이 TensorFlow Lite를 리브랜딩한 온디바이스 ML 프레임워크다. CompiledModel API가 Interpreter 대체: 자동 HW 선택·비동기 실행으로 NPU CPU 대비 100x·GPU 10x 가속. 2026년 Tensor ML SDK Beta가 LiteRT와 통합 — Pixel 10 Tensor TPU 경로, PyTorch/TFLite→LiteRT Torch 변환, Play Feature Delivery·AI Packs 배포, TPU 우선+CPU/GPU fallback. Arm SME2는 XNNPACK·KleidiAI로 자동 활용, INT8/FP16 양자화로 Android SME2 기기 14초→6.6초 사례. Qualcomm·MediaTek NPU 프로덕션, MediaPipe Tasks(LLM·비전) 조합. Stable Audio Open Small PyTorch→LiteRT 변환·Model Explorer 양자화 검증 사례 포함.'
  points:
  - 'CompiledModel API: NPU 100x, GPU 10x, Qualcomm·MediaTek NPU'
  - 'Tensor SDK Beta: Pixel TPU + LiteRT Torch + Play Feature Delivery'
  - 'Arm SME2: XNNPACK·KleidiAI 자동 delegate, CPU fallback도 제품급'
  - 'Stable Audio→LiteRT: DiT submodel 4x 축소, SME2 Android 14s→6.6s'
