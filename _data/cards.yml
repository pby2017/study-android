  summary: Saber(arXiv 2606.01317·sssr-lab/saber) — coding agent operational safety in realistic stateful project workspaces, not chatbot refusal. agent edits code·runs shell·modifies artifacts in Docker sandbox — safety judged from final workspace state+action trace after multi-step run. violation taxonomy by cause enables model-specific safety profiles. best model still >54% harmful safety-violation rate(HSR) — refusal alone insufficient for agent safety. vs Agent-SafetyBench(interactive tool env score) ·CUAHarm(terminal harm execution) — Saber=project workspace state delta axis.
  points:
  - Final state judgment — not prompt refusal, completed run workspace delta
  - HSR 54%+ even best model — plan safely+least privilege+preserve state all fail
  - Violation taxonomy — cause categorization beyond binary safe/unsafe
  source: https://arxiv.org/abs/2606.01317
- category: ai
  title: ProcCtrlBench — 11 defect ontology·control preservation·outcome blind spot
  summary: ProcCtrlBench(arXiv 2605.20251) — execution-process eval for coding agents beyond final pass/fail. 11 defect types in 4 categories from standardized trajectory evidence — interpretable·interruptible·correctable·reversible·authority handback(control preservation score). 200 cases sampled from AndroidBench·Terminal-Bench·SWE-bench Verified — reveals execution quality differences outcome metrics miss. vs Snorkel(trajectory rubric final) ·Terminal-Bench(shell outcome) — ProcCtrlBench=process ontology reusable across harnesses.
