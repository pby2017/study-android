- category: ai
  title: Claude Code isolation remote — Agent tool CCR sandbox·peer trust rewrite
  summary: 'Claude Code 2.1.181(2026-06-17) — Agent tool isolation remote dispatches subagent to Cloud Compute Resource(CCR) sandbox not local host. remote agents run as background tasks with completion notification — dedicated ephemeral env vs local subagent sharing filesystem+credentials. same release — peer message trust model rewrite: incoming agent messages treated as teammate-on-behalf-of-user not untrusted external — operators must audit disallowedTools explicitly. vs worktree isolation(local repo copy) ·Claude Managed Agents(self-hosted worker) ·Runloop Devbox(microVM) — remote=Anthropic CCR blast-radius containment for untrusted input.'
