  source: https://github.com/keploy/keploy
- category: ai
  title: Instructor — Pydantic 스키마로 LLM JSON 파싱·검증·재시도를 한 API에 묶기(MIT·~13.3k★)
  summary: 'Instructor는 LLM에게 "JSON으로 답해"라고 부탁한 뒤 직접 파싱하는 코드를 줄이는 구조화 출력 라이브러리다. Pydantic 모델을 `response_model`로 넘기면 타입 안전성, validation error 처리, 실패 시 자동 재시도, nested object 추출을 같은 인터페이스로 처리한다. 공식 문서는 OpenAI·Anthropic·Google·Ollama 등 주요 provider를 `from_provider` 하나로 바꾸고, 부분 객체 스트리밍(`Partial`)도 지원한다고 설명한다. README도 에이전트 런타임이 필요하면 PydanticAI를 쓰고, Instructor는 schema-first extraction을 단순하고 싸게 유지하는 도구라고 선을 긋는다. 실무 교훈은 LLM 출력 안정화를 거대한 에이전트 프레임워크로 시작하지 말고, 먼저 스키마·검증·재시도 경계를 함수 호출 한 곳에 고정하라는 것이다.

    '
  points:
  - 'Pydantic `response_model`로 JSON parsing, validation, retry, nested extraction을 통합'
  - '`from_provider`로 OpenAI·Anthropic·Google·Ollama 등 provider 교체, streaming partial object 지원'
  - 2026-06-29 확인 기준 GitHub 13,306★·MIT; agent runtime이 아니라 schema-first extraction용
  source: https://python.useinstructor.com/
- category: ai
  title: Outlines — 로컬 LLM 출력을 FSM·grammar로 제약해 구조화 생성하는 엔진(Apache-2.0·~13k★)
  summary: 'Outlines는 LLM이 토큰을 생성하는 동안 FSM이나 grammar로 허용 토큰만 남겨 구조화 출력을 만드는 Python 라이브러리다. 공식 문서는 이를 "structured outputs during generation"으로 설명하고, `model(prompt, output_type)` 패턴으로 JSON Schema, regex, CFG 같은 구조를 지정하게 해준다. 또한 OpenAI·Ollama·vLLM·transformers·llama.cpp·MLX 같은 백엔드와 함께 동작한다고 안내한다. Instructor가 후처리 검증과 재시도로 형식을 맞춘다면, Outlines는 생성 시점 제약으로 로컬 모델이나 대량 처리 파이프라인의 재시도 비용을 줄이는 쪽에 가깝다.

    '
