  summary: Agent-SafetyBench(thu-coai/Agent-SafetyBench·arXiv 2412.14470·AAAI 2026 TrustAgent) — LLM agent behavioral safety in interactive tool environments. 349 novel environments·2000 test cases·8 safety risk categories·10 failure modes. 16 popular agents evaluated — none exceeds 60% safety score. two fundamental defects — lack of robustness(lacks stable safe behavior under risk) ·lack of risk awareness(fails to recognize danger in time). defense prompt alone insufficient — needs runtime containment+policy. ShieldAgent scorer model for automated grading. vs CUAHarm(CUA harm execution) ·OS-Harm(GUI injection) ·Claw-Eval(general capability+safety) — broad interactive safety unsaturated.
