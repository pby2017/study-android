  - category: ai
    title: "Cursor 코드베이스 인덱싱 — 임베딩으로 '의미 검색'하되 원문은 서버에 안 남긴다"
    summary: >
      대형 레포에서 에이전트가 "인증은 어디서 처리하지?" 같은 자연어 질문으로 코드를 찾으려면 grep만으로는 부족하다. Cursor는 코드베이스를 임베딩으로 인덱싱해 시맨틱 검색을 제공하는데, 그동안 카드엔 Aider 레포 맵(tree-sitter 그래프 랭킹)·Repomix(정적 패킹)는 있어도 '임베딩 기반 의미 검색' 층위는 비어 있었다.
      동작은 이렇다: 파일을 구문 단위 청크로 쪼개 자체 학습한 임베딩 모델로 벡터화하고, 워크스페이스를 열면 백그라운드에서 자동 인덱싱(80% 시점부터 검색 가능)된다. 변경 추적은 Merkle 트리로 해시가 다른 가지만 골라 5분마다 증분 동기화한다. 질문하면 쿼리를 임베딩해 벡터DB에서 유사 청크의 '난독화된 경로·줄번호'만 받아오고, 실제 코드는 내 로컬에서 그 좌표로 조회한다.
      핵심 설계는 프라이버시다 — 원문 코드는 서버에 저장 안 되고, 파일명·경로는 암호화·난독화되며 코드 청크는 인덱싱 중 메모리에만 있다 폐기된다. 검색은 시맨틱+grep을 함께 쓸 때 가장 좋고(공식 블로그는 시맨틱 검색이 정확도 12.5%p↑라 주장), .gitignore·.cursorignore로 인덱싱 대상을 제외할 수 있다.
    points:
      - "파일을 청크→자체 임베딩 모델로 벡터화, 워크스페이스 열면 자동 인덱싱·Merkle 트리로 5분 증분 sync"
      - "벡터DB엔 난독화된 경로·임베딩만 저장(원문 비저장), 실제 코드는 로컬에서 좌표로 조회 — 프라이버시 설계"
      - "시맨틱+grep 결합이 최선(시맨틱 단독 정확도 12.5%p↑ 주장), .gitignore·.cursorignore로 인덱싱 제외"
    source: "https://cursor.com/docs/context/semantic-search"
  - category: ai
    title: "Continue CLI(cn) — 모델·규칙·도구를 끼워 쓰는 모듈형 오픈소스 터미널 에이전트"
    summary: >
      Continue는 원래 VS Code·JetBrains 확장으로 유명했지만, 지금 활발히 미는 건 터미널 에이전트 'Continue CLI(cn)'다.
      공식 문서는 cn을 "오픈소스이며 모듈형인 커맨드라인 코딩 에이전트"로, 검증된 '에이전트 루프(agent loop)'에
      당신의 모델·규칙·도구를 끼워 넣는 구조라고 설명한다. 즉 특정 모델사에 묶이지 않는 bring-your-own-model 설계다.
      쓰는 방식이 둘로 나뉜다 — 사람이 대화하며 쓰는 대화형 TUI 모드와, 출력만 받아 자동화에 쓰는 헤드리스(print) 모드.
      헤드리스 모드는 CI 파이프라인·스크립트·배치 작업처럼 사람이 안 보는 자리에서 에이전트를 돌릴 때 쓴다.
      Claude Code의 'claude -p'와 같은 자리를 노리는 도구로, 모델을 갈아끼울 수 있다는 게 차별점이다.
    points:
      - "cn = 오픈소스 모듈형 터미널 코딩 에이전트, 검증된 agent loop에 모델·규칙·도구를 플러그인"
      - "대화형 TUI 모드 + 헤드리스(print) 모드 — 후자는 CI·스크립트·배치 자동화용"
      - "bring-your-own-model: 특정 모델사 비종속, Claude Code의 claude -p와 같은 자리를 노림"
    source: "https://docs.continue.dev/guides/cli"

  - category: ai
    title: "Continuous Claude — Ralph 루프에 PR·CI·머지까지 붙인 '무인 개발 파이프라인'"
    summary: >
      Ralph 루프가 "끝날 때까지 새 컨텍스트로 다시 돌리는" 패턴이라면, Continuous Claude(AnandChowdhary)는 그 루프에
      깃 워크플로 전체를 붙인 CLI다. 매 반복마다 Claude Code(또는 Codex)가 코드를 고치고 → 새 브랜치에 커밋 → 'gh pr create'로
      PR을 열고 → 'gh pr checks'로 CI·리뷰 통과를 기다린 뒤 → 초록불이면 머지, 실패면 버리고 다시 도는 식이다.
      창작 동기가 구체적이다 — 수십만 줄 코드베이스의 테스트 커버리지를 몇 주 안에 0%→80%로 올려야 하는 계약 때문에 만들었다.
      반복 사이 맥락은 SHARED_TASK_NOTES.md 파일로 이어 붙여 보존하고, 워크트리로 여러 인스턴스를 병렬로 굴릴 수 있다.
      단 완전한 PR 자동화는 GitHub 레포에서만 되고(Gitea 등 self-hosted forge 미지원), 로컬 전용 모드는 --disable-commits/--disable-branches로 쓴다.
    points:
      - "Ralph 루프 + 깃 자동화: 커밋→PR(gh pr create)→CI 대기(gh pr checks)→머지/폐기를 반복(MIT, GitHub Star 약 1.4k 주장)"
      - "맥락 보존은 SHARED_TASK_NOTES.md로, 병렬 실행은 git worktree로 — 필요 도구는 Claude Code CLI·GitHub CLI(gh)·jq"
      - "완전 PR 자동화는 GitHub 전용, self-hosted forge는 로컬 모드(--disable-commits/--disable-branches)만 가능"
    source: "https://github.com/AnandChowdhary/continuous-claude"

  - category: ai
    title: "Codebuff — 단일 모델이 아니라 '에이전트 4종 팀'으로 코드를 고치는 터미널 에이전트"
    summary: >
      Codebuff(CodebuffAI, Apache-2.0, GitHub Star 약 6.4k)는 'npm install -g codebuff'로 깔아 터미널에서 자연어로 코드를 고치는 에이전트인데,
      한 모델이 다 하는 게 아니라 역할이 갈린 에이전트들을 조율한다 — 파일을 훑는 File Picker, 변경 계획을 짜는 Planner,
      실제로 편집하는 Editor, 결과를 검증하는 Reviewer가 협업하고, 각 에이전트는 다시 서브에이전트를 띄우거나(spawn) 조건 분기·다단계 실행을 한다.
      TypeScript 제너레이터로 'AI 생성 + 프로그램적 제어'를 섞은 커스텀 워크플로를 짤 수 있고, '@codebuff/sdk'로 앱·CI에 끼워 넣을 수도 있다.
      모델은 OpenRouter에 있는 건 다 쓸 수 있어(Claude·GPT·Qwen·DeepSeek 등) 한 공급사에 묶이지 않는다.
      README는 '자체 평가(175+ 코딩 과제)에서 Claude Code를 61% vs 53%로 앞섰다'고 주장하는데, 이는 Codebuff 측 자체 벤치마크 주장이다.
    points:
      - "멀티에이전트: File Picker→Planner→Editor→Reviewer로 역할 분담, 각 에이전트가 서브에이전트를 spawn (Apache-2.0, 약 6.4k★)"
      - "모델 비종속: OpenRouter의 어떤 모델이든 사용 / TypeScript 제너레이터로 커스텀 워크플로, @codebuff/sdk로 임베드"
      - "벤치마크는 '주장': 자체 평가에서 Claude Code 대비 61% vs 53% — 제3자 검증 아님"
    source: "https://github.com/CodebuffAI/codebuff"
  - category: ai
