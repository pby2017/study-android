- category: ai
  title: LLM 벤치마크 2026 — SWE-bench·GPQA·HLE만 유의미, MMLU/GSM8K는 포화(상위 93%+), 포트폴리오 접근 필수
  summary: '2026년 LLM 벤치마크에서 MMLU(93%)·GSM8K(99%)·HumanEval은 포화되어 프론티어 모델 구분 불가. 유의미한 벤치마크: SWE-bench Verified(실제 GitHub 버그 수정, Opus 4.6 80.8%), GPQA Diamond(PhD급 과학 추론, Gemini 3.1 94.3%), HLE(전문가 지식, 미포화), LiveCodeBench(월간 갱신 코딩). 평가 시 스캐폴드에 따라 5~15% 점수 변동 가능. 단일 벤치마크가 아닌 학술(GPQA)+에이전트(SWE-bench) +선호도(Chatbot Arena) 포트폴리오 접근 필수.

    '
