  summary: Microsoft Phi-4-mini-instruct(2025-02)는 3.8B dense decoder-only Transformer로 GQA·200K vocab·128K ctx·함수 호출을 지원한다. Phi-3.5-mini 대비 추론·수학·코딩·다국어(23개) 향상. Azure Foundry $0.000075/1K input, Ollama·Hugging Face·NVIDIA API Catalog 배포. Phi-4-multimodal(5.6B, 음성·비전·텍스트)과 Phi-4-mini-reasoning(2025-04, 수학·논리 특화)이 형제 모델. iPhone에서 27~55 tok/s 실시간 추론 가능한 엣지 LLM 리더보드 상위권.
