      빠른 편집, 설명, 반복 질의처럼 지연과 비용이 중요한 작업에는 작은 전용 모델을 우선 배치하고, 아키텍처
      변경·복잡한 디버깅 같은 작업만 큰 추론 모델로 올리는 정책이 필요하다.
