  summary: ZenML은 MLflow·Vertex·K8s·SageMaker 등과 플러그인으로 연결되는 오픈소스 MLOps 프레임워크다. Orchestrator+Artifact Store+Metadata Store 3 Stack Component로 step 단위 캐싱·재현·협업을 제공한다. 2025-2026 Dynamic Pipelines는 런타임에 DAG를 생성 — fan-out/fan-in·step.submit() 병렬·zenml.wait() 휴먼 게이트·에이전트 RAG fan-out에 budget limit을 걸 수 있다. Prefect(범용 durable execution)·MLflow(실험 추적)·DVC(데이터 버전)와 달리 "ML step 파이프라인+클라우드 오케스트레이터" 레이어에 특화.
  points:
  - pip install zenml → Stack(Orchestrator·Artifact·Metadata) 조합으로 재현 가능 파이프라인
  - Dynamic Pipelines — 런타임 DAG·map/reduce·isolated runtime·K8s/Vertex/SageMaker
  - MLflow/W&B experiment tracker 플러그인 — Prefect·DVC와 역할 분리
  source: https://docs.zenml.io/concepts/steps_and_pipelines/dynamic_pipelines
- category: ai
  title: Metaflow — Netflix가 만든 human-centric ML, 노트북처럼 짜고 Maestro로 프로덕션까지(Apache-2.0)
  summary: Metaflow는 Netflix가 2019년 오픈소스한 "데이터 과학자가 인프라 몰라도" 노트북→프로덕션까지 가는 Python ML 프레임워크다. Outerbounds가 유지하며 Netflix 단독 3,000+ ML 프로젝트·수억 job을 처리한다. @step·@batch·@kubernetes 데코레이터로 로컬 실행→클라우드 스케일을 코드 변경 없이 전환, 모든 run의 코드·데이터·아티팩트를 자동 버전. Metaflow 2.19 Spin은 셀 단위처럼 개별 step만 반복 실행해 개발 속도를 높인다. Netflix는 대규모 오케스트레이션을 오픈소스 Maestro와 연동 — ZenML(파이프라인 조립)과 달리 DS 친화적 flow+데코레이터 모델.
  points:
  - '@step/@batch/@kubernetes — 로컬→AWS Step Functions·K8s·Airflow·Maestro'
  - Spin(2.19) — step 단위 iterative debug, 노트북 UX+프로덕션 workflow
  - 자동 run 버전(코드·데이터·아티팩트) — MLflow(추적 UI)와 상호보완
  source: https://github.com/Netflix/metaflow
