  summary: 'SWE-agent는 GitHub 이슈를 입력으로 받아, 선택한 LM이 도구를 자율적으로 사용해 코드를 고치도록 하는 오픈소스(MIT) 에이전트다. 핵심 기여는 에이전트가 쓰기 좋게 설계한 Agent-Computer Interface(ACI)로, NeurIPS 2024 논문으로 발표됐다.

    '
  points:
  - 태그라인 'SWE-agent takes a GitHub issue and tries to automatically fix it, using your LM of choice' · MIT · 약 19.6k★
  - '핵심: Agent-Computer Interface(ACI) — 에이전트가 다루기 쉬운 도구·환경 인터페이스 설계 (논문 NeurIPS 2024)'
  - SWE-bench에서 오픈소스 SOTA급 성능, 단일 yaml로 전체 동작 구성·문서화
  - GPT-4o·Claude 등 모델 선택 가능, 버그수정 외 CTF 보안(EnIGMA 모드)·커스텀 코딩도 지원
  - 프린스턴+스탠퍼드 연구진 작품 · 현재 개발 무게중심은 후속작 mini-swe-agent로 이동했다고 repo가 명시
  source: https://github.com/SWE-agent/SWE-agent
- category: ai
  title: llama.cpp + GGUF — convert→imatrix→quantize, Q4_K_M이 2026년 엣지·로컬 표준
  summary: 'llama.cpp는 C/C++ LLM 추론 엔진으로 GGUF(GPT-Generated Unified Format) 포맷을 통해 CPU·Apple Silicon·NVIDIA·AMD·Intel 등 거의 모든 하드웨어에서 LLM을 실행한다. Ollama·LM Studio·KoboldCpp의 백엔드. 양자화 파이프라인 3단계: 1) convert_hf_to_gguf.py로 HF→GGUF F16, 2) llama-imatrix로 중요도 행렬 생성(4bit 이하 품질 핵심), 3) llama-quantize로 목표 비트폭 압축. Q4_K_M이 2026 기본(8B ~4.7GB, FP16 대비 1~3% perplexity 손실), Q5_K_M은 +15% 크기에 추론·코드 품질↑, IQ4_XS는 imatrix 기반 코드북으로 Q4_K_M보다 작지만 동등. 프로덕션 GPU 서빙은 AWQ+vLLM, 로컬/엣지/맥은 llama.cpp+GGUF.'
  points:
  - '3단계: convert → imatrix → quantize, LoRA는 merge_and_unload() 후 변환'
  - 'Q4_K_M: 8B ~4.7GB 가성비 기본, imatrix가 4bit 품질 좌우'
  - 범용 HW + Ollama/LM Studio 백엔드 — GPU 프로덕션은 AWQ+vLLM
  source: https://github.com/ggml-org/llama.cpp
- category: ai
  title: Qwen3-VL — 오픈소스 비전-언어 모델 1위, OCR 32개 언어·문서·차트·GUI 에이전트까지(Apache-2.0)
  summary: 'Qwen3-VL은 Alibaba가 만든 오픈소스 비전-언어 모델로, 2026년 기준 DocVQA 96.5%·MathVista 85.8%로 오픈소스 VLM 중 최강이다. 72B·32B·7B 사이즈 제공, 256K 네이티브 컨텍스트(1M 확장), OCR 32개 언어 지원. GUI 에이전트·차트 이해·디자인→코드 변환까지 커버한다. InternVL3(OpenGVLab)가 범용 시각 추론에 강하다면, Qwen3-VL은 문서·OCR·수학·에이전트 특화. HuggingFace transformers·vLLM 통합.

    '
  points:
  - 'DocVQA 96.5%: 오픈소스 VLM 최고, 프론티어 모델과 경쟁'
  - OCR 32개 언어 + GUI 에이전트 + 디자인→코드
  - 72B/32B/7B, Apache-2.0, vLLM·transformers 통합
  source: https://github.com/QwenLM/Qwen2-VL
