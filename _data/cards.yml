  summary: "Compose UI 테스트 v2는 composition의 coroutine 실행에 StandardTestDispatcher를 사용해 실행 순서를 명시적으로 제어한다. 코루틴 작업은 큐에 예약되므로 직접 만든 scheduler 작업은 필요할 때 진행해야 한다. 다만 표준 Compose 테스트의 waitForIdle 같은 동기화 API가 처리하는 경우도 있어 매 테스트에 advanceUntilIdle을 넣을 필요는 없다."
  points:
  - "StandardTestDispatcher: 작업을 예약하고 scheduler가 진행"
  - "표준 UI idle 대기와 직접 scheduler 제어를 구분"
  - "실패 원인을 확인한 뒤 필요한 지점만 advance"
  interview: "Compose Test v2로 바꾸면 모든 테스트에 advanceUntilIdle이 필요한가?"
  answer: "아니다. 표준 Compose 동기화 API가 처리하는 경우가 많다. 직접 제어하는 coroutine scheduler의 작업이 남았을 때만 명시적으로 진행한다."
