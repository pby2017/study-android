  title: ccusage — 여러 코딩 에이전트 로그를 한 번에 비교하기
  summary: 'ccusage는 Claude Code·Codex 등 코딩 에이전트가 로컬에 남긴 사용 기록을 읽어 토큰량과 비용을 일·주·월·세션 단위로 묶는 CLI다. `ccusage daily`는 감지된 소스를 합산하고 `ccusage codex daily`처럼 한 소스만 볼 수도 있다. 기본 `auto` 모드는 로그에 저장된 비용을 쓰고, 값이 없으면 토큰과 모델 가격으로 계산한다. 어느 쪽도 실제 청구서가 아니다. Web Search 같은 도구 API 사용량은 포함되지 않을 수 있다. 가격은 설정에 따라 온라인 조회하거나 `--offline`으로 내장 가격 데이터를 쓸 수 있다.'
  points:
  - '`ccusage daily`는 감지된 여러 소스를 합산; `ccusage codex daily`처럼 소스별 분석도 가능'
  - '`ccusage blocks`는 Claude Code 전용 5시간 창이며, Codex 등 다른 소스의 사용 제한 창을 뜻하지 않는다'
  - '비용은 저장값 또는 가격 기반 추정치다; 실제 청구액과 도구 API 호출 비용 전체를 보장하지 않는다'
  - 'GitHub 19.5k★·934 forks 스냅샷(2026-11-22); 오프라인 가격표 사용과 최신 가격 온라인 조회를 구분'
  source: https://github.com/ccusage/ccusage
  sources:
  - label: 'ccusage 공식 README — 지원 소스·리포트와 MIT 라이선스'
    url: https://github.com/ccusage/ccusage
  - label: '공식 사용 안내 — 로컬 데이터 소스, 추정 비용, 한계'
    url: https://github.com/ccusage/ccusage/blob/main/docs/guide/index.md
  - label: 'Codex 데이터 소스 — 세션 로그 위치·소스별 리포트·가격 조회 옵션'
