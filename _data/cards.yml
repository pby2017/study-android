  title: AgeMem — LTM·STM을 tool action으로 통합·step-wise GRPO
  summary: AgeMem(ACL 2026·arXiv 2601.01885·y1y5/AgeMem) — heuristic memory pipeline 대신 LLM agent policy에 memory operation을 tool-based action으로 통합. Add·Update·Delete(LTM) + Retrieve·Summary·Filter(STM) 6 tools — agent가 task structure에 맞게 store/retrieve/summarize/discard autonomously. three-stage progressive RL — LTM storage→STM context→full coordination, step-wise GRPO가 sparse·discontinuous memory reward를 prior decision에 backprop. 5 long-horizon benchmark에서 memory-augmented baseline 일관 outperform. vs Mem0(external DB) ·Memory Bank(markdown) ·mcp-memory-rs(local sync) — AgeMem=learnable unified memory policy not retrieval heuristic.
  points:
  - 6 memory tools — LTM persist + STM context in one action space
  - Step-wise GRPO — memory ops credit from final task reward
  - Progressive RL stages — fragmented experience across stages handled
  source: https://aclanthology.org/2026.acl-long.981/
- category: ai
  title: MemAct — Memory-as-Action·DCPO·51% token cut vs 16× model
  summary: MemAct(ACL 2026 Findings·arXiv 2510.12635·ADaM-BJTU/MemAct) — working memory management를 external heuristic이 아닌 learnable policy action으로. in-place context editing — delete·insert·summarize function-call actions, agent가 retention vs task reward trade-off end-to-end RL. Dynamic Context Policy Optimization(DCPO) — memory action 시 trajectory fracture에서 stable gradient, GRPO pipeline compatible. MemAct-RL-14B avg 8.2×10⁴ tokens vs Qwen3-235B 16.7×10⁴ — 51% context cut, accuracy matches 16× larger model. vs AgeMem(tool LTM+STM) ·context compaction heuristics — MemAct=in-place edit ops + DCPO for non-prefix histories.
  points:
  - Trajectory fracture — append-only context broken by edit actions
  - DCPO — segment history at curation points for stable RL
  - 51% token reduction — learned curation beats bigger model full history
  source: https://aclanthology.org/2026.findings-acl.956/
- category: ai
