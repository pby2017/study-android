  title: Gemma 3n — MatFormer·PLE로 2GB RAM에 8B급, 텍스트·이미지·오디오 온디바이스(Gemma)
  summary: Gemma 3n은 Google DeepMind의 mobile-first 오픈 멀티모달 모델로, Gemini Nano와 공유 아키텍처를 Gemma로 먼저 공개한 버전이다. MatFormer(Matryoshka Transformer)로 E4B(8B raw·4B effective) 안에 E2B(5B raw·2B effective) 서브모델이 중첩되어 latency·품질 트레이드오프를 런타임에 조절한다. Per-Layer Embedding(PLE) caching으로 embedding을 CPU에 두고 accelerator에는 core transformer(~2B/4B)만 로드 — E2B 2GB·E4B 3GB RAM. MobileNet-v5 vision·오디오 encoder, 32K ctx·140개 언어. Google AI Edge·Android Gemma Gallery·LiteRT 배포.
