- category: ai
  title: Braintrust — eval-first + agent observability(trace·drift·online eval) 통합
  summary: Braintrust는 LLM 앱을 "먼저 eval하고 ship"하는 eval-first 플랫form이다. Playground에서 prompt·model·tool 변형을 A/B하고, dataset+scorer로 CI/CD 품질 게이트를 걸며, production trace를 dataset으로 환류(feedback loop)한다. 2026 agent observability guide — LLM 단일 call이 아니라 tool selection·arguments·memory read/write·sub-agent handoff·decision branch를 nested span으로 캡처, trace inspect만으로는 부족한 online eval layer(production trace에 scorer attach→실패 alert→offline eval set 환류)를 같은 UI에 통합. behavioral drift — tool-call frequency·refusal rate·retrieval depth·latency distribution rolling baseline(24h/7d/30d) 이탈을 leading indicator로. LangSmith(프레임워크 종속)·RAGAS(RAG)·Datadog(infra MELT)와 달리 semantic agent behavior+eval gate. Loop(2026)로 에이전트 eval 자동화 확장.
  points:
  - trace+eval loop — production failing trace→dataset→CI gate, uptime만으로 silent failure 못 잡음
  - behavioral drift — tool/refusal/latency baseline shift = model·tool API·RAG corpus change signal
  - LangSmith=LangChain·RAGAS=RAG·Braintrust=범용 eval CI+agent semantic observability
  source: https://www.braintrust.dev/articles/agent-observability-complete-guide-2026
