  - 'Pydantic 검증 + 자동 재시도: 클라우드 API 구조화 출력의 표준'
  - '6개 언어 SDK: Python·TypeScript·Go·Ruby·Elixir·Rust'
  - '15+ 프로바이더: OpenAI·Anthropic·Gemini·Ollama·DeepSeek'
  source: https://python.useinstructor.com/
- category: ai
  title: Outlines — 로컬 LLM 출력을 FSM으로 100% 스키마 준수시키는 구조화 생성 엔진(Apache-2.0·~13k★)
  summary: 'Outlines는 LLM이 토큰을 생성하는 매 스텝에서 유한 상태 오토마타(FSM)로 유효하지 않은 토큰을 마스킹해 100% 스키마 준수 출력을 보장한다. 재시도가 필요 없어 API 비용과 지연을 제거. HuggingFace transformers· llama-cpp-python·vLLM·MLX와 직접 통합되며 Pydantic/JSON Schema를 네이티브 지원한다. Instructor(후처리 검증 + 재시도)와 반대 접근: Outlines는 ''생성 시점에 제약''. 대량 처리 파이프라인과 로컬 모델 환경에 최적.

    '
  points:
  - 'FSM 기반 logit 마스킹: 생성 시점에 100% 스키마 보장, 재시도 제로'
  - vLLM·transformers·llama-cpp·MLX 직접 통합
  - 'Instructor(후처리)와 반대 전략: 대량 처리 + 로컬 모델에 최적'
  source: https://github.com/dottxt-ai/outlines
