- category: ai
  title: Samsung Codex 배포 — 코딩 에이전트도 전사 보안 정책 안에서 굴려야 한다
  summary: 'OpenAI는 2026년 6월 21일 Samsung Electronics가 한국 전 임직원과 전 세계 DX(Device eXperience) 부문 직원에게 ChatGPT Enterprise와 Codex를 제공한다고 발표했다. 포인트는 "대기업도 Codex를 쓴다"가 아니라, 코딩 에이전트가 R&D·제조·마케팅·사내 도구 자동화까지 넓어질 때 데이터 보호, 사용자·접근 관리, 보안 통제 같은 엔터프라이즈 경계가 먼저 필요하다는 점이다. Codex 주간 활성 사용자는 500만 명을 넘었고, 한국 주간 활성 사용자는 2026년 2월 1일 이후 약 800% 증가했다고 OpenAI는 밝혔다.

    '
  points:
  - 한국 전 임직원 + 전 세계 DX 부문에 ChatGPT Enterprise·Codex 제공
  - Codex는 코드 작성·리뷰·디버깅뿐 아니라 사내 도구·웹사이트·워크플로 자동화에 사용
  - 전사 배포의 핵심은 모델 성능보다 데이터 보호·접근 관리·보안 정책
  source: https://openai.com/index/samsung-electronics-chatgpt-codex-deployment/
- category: ai
  title: OpenAI on OCI — 모델 도입은 API 키보다 구매 경로가 막는다
  summary: 'OpenAI와 Oracle은 2026년 6월 10일 Oracle Cloud Infrastructure 고객이 기존 Oracle Universal Credits를 OpenAI 모델과 Codex 접근에 적용할 수 있는 경로를 예고했다. 개발자에게 중요한 교육 포인트는 기술 통합보다 조달·거버넌스다. 기업 AI 에이전트 도입은 "어떤 SDK를 붙일까"보다 기존 클라우드 약정, 승인된 구매 프로세스, 비용 귀속, 보안 심사 안에서 모델과 Codex를 쓸 수 있는지가 먼저 병목이 된다. 자동화 계획에는 코드뿐 아니라 사용량 관측, 예산 주체, 클라우드 계약 경계도 포함해야 한다.

    '
  points:
  - OCI 고객은 적격 Oracle Universal Credits를 OpenAI 모델·Codex에 적용 예정
  - 기존 구매 워크플로와 클라우드 약정 안에서 AI 도입 마찰을 줄이는 전략
  - 에이전트 운영 설계에는 SDK 선택뿐 아니라 조달·예산·거버넌스 경계를 포함
  source: https://openai.com/index/openai-on-oracle-cloud/
- category: ai
  title: Notion Codex 워크플로 — 스펙과 검증 방법을 같이 주면 에이전트가 오래 간다
  summary: 'OpenAI의 2026년 6월 9일 Notion 사례는 코딩 에이전트 운용법을 잘 보여준다. Notion은 모바일에 이미 있던 AI voice input을 웹으로 옮길 때 Codex에 모바일 코드베이스, 웹에서 필요한 모양, 결과 검증 방법을 함께 제공했다. Codex는 모바일 구현을 탐색한 뒤 웹 구현 초안을 만들었고, Notion은 예전이면 2주 걸릴 일을 3~4시간 정도에 끝냈다고 설명했다. 핵심은 "한 줄 지시"가 아니라, 비교할 기존 구현과 성공 판정 루프를 같이 주면 에이전트가 코드베이스 규칙을 따라갈 가능성이 커진다는 점이다.

    '
  points:
  - 기존 모바일 구현 + 웹 요구사항 + 검증 방법을 함께 제공
  - 'Notion 사례: 2주 예상 작업을 3~4시간 수준으로 단축했다고 보고'
  - 에이전트에게는 요청보다 스펙·참조 구현·검증 루프가 중요
  source: https://openai.com/index/notion/
- category: ai
  title: Codex Security — AI 보안 자동화는 권한 등급과 격리 검증이 먼저다
  summary: 'OpenAI는 2026년 5월 Trusted Access for Cyber 글에서 Codex Security가 코드베이스별 threat model을 만들고, 현실적인 attack path를 탐색하며, 격리 환경에서 이슈를 검증하고, 사람이 검토할 패치를 제안한다고 설명했다. 같은 글은 GPT-5.5 기본 접근, Trusted Access for Cyber, GPT-5.5-Cyber처럼 보안 작업 권한을 단계화한다. 실무 포인트는 "AI에게 취약점 찾아줘"가 아니라, 소유한 시스템인지, 어떤 권한 등급인지, 검증 환경이 격리돼 있는지, 패치가 사람 리뷰로 닫히는지를 먼저 정해야 한다는 것이다.

    '
  points:
  - 'Codex Security: threat model→attack path→격리 검증→패치 제안'
  - Trusted Access for Cyber는 검증된 방어자와 승인된 작업 범위를 전제로 함
  - 보안 에이전트 자동화는 권한 등급·대상 소유권·격리 환경·사람 리뷰가 핵심
  source: https://openai.com/index/gpt-5-5-with-trusted-access-for-cyber/
- category: ai
  title: 'Potpie: 코드베이스 전체를 Neo4j 지식 그래프로 인덱싱해 디버깅·Q&A·스펙 전문 에이전트를 붙이는 도구'
  summary: 'Potpie는 저장소를 파싱해 모든 파일·클래스·함수와 호출관계를 담은 지식 그래프(Neo4j)로 만든다. 이 그래프가 모든 에이전트의 컨텍스트 backbone이 되어, 실제 코드에 근거한 답·코드·문서를 낸다. License: Apache 2.0.

    '
