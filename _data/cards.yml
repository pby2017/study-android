  - "시스템 바·컷아웃·시스템 제스처는 서로 다른 inset 유형으로 다룬다"
  - "배경은 뒤로 확장하고 터치 대상은 inset 처리; 중복 padding도 테스트한다"
  source: https://developer.android.com/develop/ui/views/layout/edge-to-edge
  interview: "edge-to-edge 화면에서 모든 콘텐츠에 시스템 바 padding을 적용해야 하는가?"
