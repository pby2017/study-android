      핵심은 에이전트가 코드를 줄 번호로 자르는 평문이 아니라 심볼로 다루게 되는 점: 정의 위치 찾기, 프로젝트 전역 참조 추적, 한 번에 이름 바꾸기, 함수 본문만 교체 같은 작업을 줄 세지 않고 한다.
