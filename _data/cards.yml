  - '벤치마크: 201 tasks / 20 apps / 평균 27.8 step / 멀티앱 62.2%'
  - '새 축: agent-user interaction + MCP-augmented tasks'
  - '검증: 컨테이너 AVD, 자체 앱 백엔드, DB·저장소·콜백 기반 deterministic evaluation'
  source: https://github.com/Tongyi-MAI/MobileWorld
- category: ai
  title: 'Codex Record & Replay: 손으로 보여 준 반복 업무를 재사용 스킬로 바꾸기'
  summary: 'OpenAI Codex의 Record & Replay는 말로 설명하기 애매한 반복 업무를 한 번 시연한 뒤, 다시 쓸 수 있는 스킬로 포장하는 macOS 기능이다. 2026-06-18 Codex changelog에 추가됐고, 초기 제공 지역은 EEA·영국·스위스를 제외하며 Computer Use가 켜져 있어야 한다. 사용자는 지출 처리, 이슈 생성, 리포트 다운로드처럼 선호도와 입력값이 섞인 워크플로를 짧게 녹화하고, Codex는 필요한 입력, 실행 단계, 검증 방법을 담은 skill 초안을 만든다. 재실행 때는 새 날짜·파일·이슈 제목처럼 달라지는 값만 주고 Computer Use, 브라우저 액션, 설치된 플러그인을 조합해 흐름을 반복한다. 실무 교훈은 "자동화 스크립트를 먼저 짜기"가 아니라, 안정적인 성공 기준이 있는 수작업을 시연-스킬-검증 루프로 작게 캡처한 뒤 팀에 배포할 것은 별도 플러그인으로 승격하라는 점이다.

    '
  points:
  - '공식 changelog: 2026-06-18 Codex app 26.616에서 Record & Replay 추가'
  - '조건: macOS, Computer Use enabled, 초기 제공 지역은 EEA·UK·Switzerland 제외'
  - 짧고 완결된 시연 → 입력·단계·검증을 담은 reusable skill 초안 생성
  source: https://developers.openai.com/codex/record-and-replay
- category: ai
  title: 'Codex App Server: Codex를 제품 안 리치 클라이언트로 붙이는 프로토콜'
  summary: 'Codex App Server는 Codex VS Code 확장 같은 리치 클라이언트를 구동하는 공식 인터페이스다. OpenAI 문서는 제품 안에 Codex를 깊게 붙이고 싶을 때 인증, 대화 기록, 승인, 스트리밍 에이전트 이벤트를 다루는 경로로 app-server를 설명한다. 같은 런에서 openai/codex는 92,966★, 13,757 forks, Apache-2.0, 2026-06-23 push를 확인했고, app-server 디렉터리도 같은 날 커밋이 있었다. 프로토콜은 MCP처럼 JSON-RPC 2.0 기반 양방향 통신을 쓰며, 기본 stdio(JSONL), 실험적 WebSocket, Unix socket transport를 지원한다. 중요한 경계는 CI나 백그라운드 자동화에는 Codex SDK를 쓰고, 사용자가 보는 대화형 제품 통합에는 app-server를 쓰라는 점이다.

    '
  points:
  - '공식 용도: 인증·대화 기록·승인·streamed agent events가 필요한 제품 내 Codex 통합'
  - '프로토콜: JSON-RPC 2.0, stdio 기본, WebSocket은 experimental/unsupported, Unix socket 지원'
  - '같은 런 검증: openai/codex 92,966★, 13,757 forks, Apache-2.0, app-server 2026-06-23 커밋'
  source: https://developers.openai.com/codex/app-server
- category: ai
  title: 'Assistants API 종료 D-64: Responses API 이주는 모델 교체가 아니라 상태 모델 교체'
  summary: 'OpenAI 공식 migration guide는 Assistants API가 Responses API와 기능 동등성에 도달한 뒤 deprecated 되었고, 2026-08-26에 종료된다고 명시한다. 이주는 단순히 엔드포인트 이름을 바꾸는 작업이 아니다. Assistants는 Assistant/Thread/Run/Run step 중심이었지만, 새 구조는 Prompt/Conversation/Response/Item으로 바뀐다. 도구 호출 루프도 더 명시적으로 관리하고, Responses API 쪽에서 deep research, MCP, computer use 같은 새 기능을 받는다. 따라서 마이그레이션 체크리스트는 "호출 API 교체"보다 먼저 상태 저장 위치, 대화 객체 수명, tool call 재시도, 파일 검색/검색 도구 사용법, 기존 thread 데이터 전환 여부를 분리해 보는 것이 안전하다.

    '
  points:
  - '공식 종료일: Assistants API shutdown 2026-08-26'
  - '개념 매핑: Assistants→Prompts, Threads→Conversations, Runs→Responses, Run steps→Items'
  - '실무 포인트: tool loop·conversation state·file/search 도구를 별도 마이그레이션 항목으로 분리'
  source: https://developers.openai.com/api/docs/assistants/migration
- category: ai
  title: agent-browser — 브라우저 자동화를 AI 에이전트용 CLI로 얇게 빼기
  summary: 'Vercel Labs의 agent-browser는 AI 에이전트가 브라우저를 조작하기 위한 Rust 네이티브 CLI다. 2026-06-24 같은 런에서 GitHub 36,900★, 2,348 forks, Apache-2.0, 최신 릴리스 v0.29.0 (2026-06-21)을 확인했다. README 기준 핵심은 Playwright 스크립트를 매번 새로 짜는 것이 아니라 `snapshot`으로 접근성 트리와 `@e2` 같은 ref를 받고, `click`·`fill`·`get`·`screenshot`·`batch` 명령을 작은 도구 호출처럼 조합하는 것이다. Chrome for Testing을 내려받아 쓰고, 기존 Chrome, Brave, Playwright, Puppeteer 설치도 감지한다. 브라우저 상태 저장, 네트워크 route/HAR, 콘솔·에러, visual diff, React tree/Web Vitals까지 CLI 표면으로 노출하므로, 에이전트 브라우저 QA는 "비전으로 화면을 맞히기"보다 접근성 snapshot, 안정 ref, 재현 가능한 batch, 필요한 순간의 증거 캡처를 우선 설계하는 편이 낫다.

    '
  points:
  - '같은 런 검증: 36,900★, 2,348 forks, Apache-2.0, v0.29.0(2026-06-21)'
  - 'AI 친화 조작: accessibility snapshot refs + click/fill/get/screenshot + batch 실행'
  - '검증 표면: state, network route/HAR, console/errors, visual diff, React tree, Web Vitals'
  source: https://github.com/vercel-labs/agent-browser
- category: ai
  title: 'DeepMind AI Control Roadmap: 에이전트를 ''잠재적 내부자 위협''으로 다루는 보안 설계'
  summary: 'Google DeepMind가 2026-06-18 공개한 AI Control Roadmap은 강력한 에이전트가 완벽히 정렬되어 있다고 가정하지 않고, 내부 시스템에 접근한 잠재적 insider threat처럼 다루는 방어 심층 전략이다. 전통 보안(샌드박스·엔드포인트 보안·프롬프트 인젝션 저항) 위에 alignment를 1차 방어로 두되, 실패할 수 있다고 보고 supervisor AI가 에이전트의 reasoning·action·plan을 감시한다. 위험도는 detection evasion 능력(D1-D4)과 attack execution 능력(R1-R3)에 맞춰 올리고, 저위험 작업은 사후 transcript 리뷰·알림으로, 고위험 작업은 실시간 차단·접근 제한·종료 인프라로 대응한다. 실무 교훈은 에이전트 권한을 사람 계정과 똑같이 복사하지 말고, coverage·recall·time-to-response로 감시 품질을 재며 점진적으로 권한을 열어야 한다는 점이다.

    '
  points:
  - '공식 발표: 2026-06-18 AI Control Roadmap, 내부 에이전트를 잠재적 insider threat로 threat-modeling'
  - '통제 축: supervisor AI monitoring, asynchronous alert, synchronous block/response, capability-based escalation'
  - '운영 지표: coverage·recall·time-to-response로 에이전트 보안 통제가 실제로 작동하는지 측정'
  source: https://deepmind.google/blog/securing-the-future-of-ai-agents/
- category: ai
  title: Agent Finder/ARD — Copilot·Gemini Enterprise runtime discovery, context bloat 방지
  summary: 'Agentic Resource Discovery(ARD·Apache-2.0·Microsoft+Google+GitHub+HF+GoDaddy·2026-06-17) — domain-hosted catalogs + federated registries로 MCP·skills·agents·tools를 publish/index/discover. GitHub Agent Finder — Copilot이 task description으로 registry 검색→ranked matches on-demand inject, auto-install 없음·managed settings gate. Google Gemini Enterprise Agent Registry — hosted search/onboarding, native ARD months内. 문제 정의: single client가 explicit wiring한 수십 도구 vs ecosystem 수십만 리소스 — orders-of-magnitude gap. vs MCP Tool Search(Claude preload) ·pre-wired MCP list — ARD=runtime catalog search across registries.'
  points:
  - ARD spec — catalogs on org domain + registry index + client discovery handoff
  - GitHub Agent Finder — public 293 resources or private enterprise registry, no silent install
  - Google Agent Registry — Gemini Enterprise ARD backing, federated discovery same model
  source: https://commandline.microsoft.com/agentic-resource-discovery-specification-ard/
- category: ai
  title: 'Reusable prompts 종료: 프롬프트도 코드 리뷰·테스트 대상이 된다'
  summary: 'OpenAI는 2026-06-03 reusable prompt objects의 deprecation을 공지했고, `v1/prompts` API와 reusable prompt objects를 2026-11-30에 종료할 예정이라고 문서화했다. 최신 prompt engineering 가이드는 새 작업에서 production prompt를 대시보드 객체로 저장하지 말고 애플리케이션 코드 안의 작은 prompt builder로 옮기라고 권한다. 동적 값은 typed function argument나 schema로 받고, 생성된 `instructions`와 `input`을 Responses API에 직접 넘기며, 변경 전에는 대표 fixture, 테스트, evaluation check를 붙이라는 흐름이다. 실무 교훈은 "프롬프트 관리 UI"에 의존하지 말고 프롬프트를 코드 변경처럼 diff, 리뷰, 테스트, feature flag, 배포 파이프라인으로 다루라는 점이다.

    '
  points:
  - '공식 일정: 2026-06-03 deprecation 공지, 2026-11-30 `v1/prompts`/reusable prompt objects 종료 예정'
  - '이주 방향: prompt content를 application code로 옮기고 Responses API에 instructions/input으로 전달'
  - '운영 원칙: typed inputs, fixtures, tests, eval checks, staged rollout로 프롬프트 변경을 관리'
  source: https://developers.openai.com/api/docs/deprecations
- category: ai
  title: 'Codex rollout token budgets: 에이전트 루프를 토큰 예산으로 강제 중단하기'
  summary: 'OpenAI Codex CLI 0.142.0은 "rollout token budget"을 추가해 여러 agent thread·sub-agent usage가 같은 shared ledger를 소비하고, 남은 예산을 알려 주며, exhausted 시 다음 usage-accounting boundary에서 TurnAborted로 cleanly 중단한다. app-server는 multi-agent delegation을 thread/turn별 disabled·explicit-request-only·proactive로 제어하고 indexed web-search mode를 추가했다. 0.142.2(2026-06-25)는 MCP tools에 tool search by default — 지원 모델·provider에서 전체 tool schema dump 대신 discovery 검색으로 context 절약·구형 모델 호환 fallback. 개발자에게 중요한 점은 에이전트 자동화를 "열심히 돌리기"가 아니라 예산·위임·MCP tool surface·웹 접근 경계를 먼저 정한 뒤 실행하는 운영 문제로 본다는 것이다.

    '
  points:
  - '0.142.0: shared ledger token budget·sub-agent draw·TurnAborted clean abort'
  - 'app-server: multi-agent delegation disabled·explicit-request-only·proactive'
  - '0.142.2: MCP tool search default — schema dump→searchable discovery'
  source: https://developers.openai.com/codex/changelog
- category: ai
  title: Claude Projects + Artifacts — 지속 워크스페이스와 인터랙티브 출력 패널
  summary: 'Claude Projects는 관련 대화·커스텀 지침·참조 문서를 한 공간에 모아 세션 간 컨텍스트를 유지하는 워크스페이스다. Pro/Team 무제한, Free 5개. 200K 컨텍스트(Enterprise 500K), RAG 방식으로 관련 섹션만 주입, Project-scoped memory로 채팅 간 학습 유지. Claude Artifacts는 HTML·React·SVG·Mermaid 등 독립 콘텐츠를 대화 옆 패널에 렌더링 — 2026년 Live Artifacts(MCP로 Google Sheets·Linear 실시간 연동), Pro+ 20MB persistent storage, 공개 링크 공유. 역할 분리: Projects=지속 컨텍스트 방, Artifacts=작업 결과물, Skills=반복 절차.'
  points:
  - 'Projects: 200K ctx, RAG 주입, Project-scoped memory, Team 공유'
  - 'Artifacts: Live MCP 연동, 20MB persistent storage, 공개 링크'
  - Skills·Projects·Artifacts 3축 역할 분리 — 방·결과물·플레이북
  source: https://www.anthropic.com/news/projects
- category: ai
  title: Llama 4 — Scout(10M ctx)·Maverick(128E MoE)·Behemoth(2T teacher), 네이티브 멀티모달 오픈웨이트
  summary: Meta Llama 4(2025-04-05)는 네이티브 멀티모달 MoE 패밀리다. Scout(109B total, 17B active, 16 experts)는 10M 토큰 컨텍스트·단일 H100(Int4) 배포. Maverick(400B total, 128 experts)는 1M ctx·GPT-4o급 범용·코딩. Behemoth(2T total, 288B active)는 STEM 벤치에서 GPT-4.5·Claude 3.7·Gemini 2.0 Pro 상회하나 아직 미공개(teacher distillation용). Early fusion으로 텍스트·이미지 동시 처리, 12개 언어 fine-tune, Hugging Face·llama.com 배포.
  points:
  - 'Scout 10M ctx: 단일 GPU 4-bit 양자화, 초장문 문서 처리'
  - 'Maverick 128E MoE: 17B active로 400B total, BF16/FP8 배포'
  - 'Behemoth: GPT-4.5 상회 STEM teacher, Scout/Maverick distillation'
  source: https://ai.meta.com/blog/llama-4-multimodal-intelligence/
- category: ai
  title: Phi-4-mini — 3.8B·128K·함수호출, Microsoft SLM 패밀리의 엣지·비용 효율 플래그십
  summary: Microsoft Phi-4-mini-instruct(2025-02)는 3.8B dense decoder-only Transformer로 GQA·200K vocab·128K ctx·함수 호출을 지원한다. Phi-3.5-mini 대비 추론·수학·코딩·다국어(23개) 향상. Azure Foundry $0.000075/1K input, Ollama·Hugging Face·NVIDIA API Catalog 배포. Phi-4-multimodal(5.6B, 음성·비전·텍스트)과 Phi-4-mini-reasoning(2025-04, 수학·논리 특화)이 형제 모델. iPhone에서 27~55 tok/s 실시간 추론 가능한 엣지 LLM 리더보드 상위권.
  points:
  - '3.8B·128K ctx: A100 512 GPU 21일 학습, DPO+SFT'
  - '함수 호출: 에이전트·도구 연동에 SLM로 충분한 성능'
  - 'Phi-4-mini-reasoning: DeepSeek-R1 distillation, MATH 벤치 특화'
  source: https://azure.microsoft.com/en-us/blog/empowering-innovation-the-next-generation-of-the-phi-family/
- category: ai
  title: Whisper large-v3-turbo — 디코더 32→4층·809M, GPU 8배·Apple Silicon 2배 빠른 ASR
  summary: OpenAI Whisper large-v3-turbo(2024-09)는 large-v3의 디코더를 32층→4층으로 축소해 1.55B→809M 파라미터, VRAM ~6GB→~3.5GB. Distil-Whisper 영감, 번역 데이터 제외하고 전사 데이터로 2 epoch fine-tune. LibriSpeech·10시간 혼합 오디오에서 large-v3 대비 WER 1~2%p 차이, GPU ~8x·Apple Silicon ~2x 속도. CLI 기본 모델이 turbo로 변경(20240930+). `--task translate` 미지원(원어 반환). faster-whisper·Hugging Face 배포.
  points:
  - '809M·4-layer decoder: large-v2급 정확도, large-v3 대비 8x GPU'
  - '전사 전용: 번역 task 미지원, multilingual ASR 90+ 언어'
  - 'CLI 기본값: whisper audio.wav → turbo 자동 사용'
  source: https://github.com/openai/whisper/discussions/2363
- category: ai
  title: KAN — Kolmogorov-Arnold Networks, MLP 대신 엣지에 학습 가능 활성함수(ICLR 2025 Oral)
  summary: 'KAN(Liu et al., ICLR 2025 Oral)은 MLP의 고정 노드 활성함수 대신 엣지(가중치)에 스플라인으로 파라미터화된 1D 함수를 배치한다. Kolmogorov-Arnold 표현정리 영감, 동일 정확도에 더 작은 KAN·더 빠른 neural scaling law. 과학 ML·함수 근사·PDE·기호 회귀에서 MLP 대비 우수, 해석 가능성(시각화·인간 협업). 단점: 학습 느림, PolyKAN·G-KAN 등 하드웨어 가속 연구 중. MLP 레이어 drop-in 대체로 CNN·RNN·Transformer에 적용 가능.'
  points:
  - '엣지 활성함수: 선형 weight matrix 없음, 스플라인 1D 함수'
  - 'ICLR 2025 Oral: AI+Science에서 물리·수학 법칙 재발견 사례'
  - '2026 연구: CKAN(Conv+KAN), PDE·시계열·continual learning 확장'
  source: https://arxiv.org/abs/2404.19756
- category: ai
  title: Mixture of Agents(MoA) — 다층 LLM 협업으로 GPT-4o 능가, AlpacaEval 2.0 65.1%(ICLR 2025)
  summary: 'MoA(Wang et al., ICLR 2025)는 추론 시 여러 LLM을 계층(layer)으로 배치해 proposer가 후보 생성→aggregator가 통합하는 프레임워크다. 파인튜닝 없이 프롬프트만으로 동작. 오픈소스만으로 AlpacaEval 2.0 65.1%(GPT-4o 57.5%), Arena-Hard·MT-Bench·FLASK SOTA. MoA-Lite(2층·Qwen-72B aggregator)도 GPT-4o 상회. 2025 후속: Self-MoA(단일 top 모델 다중 샘플이 mixed MoA보다 6.6%p 우수), RMoA(residual+다양성 선택), Attention-MoA(에이전트 간 semantic attention).'
  points:
  - '3층 6-agent: Qwen-110B aggregator + 이종 proposer 혼합'
  - 'Self-MoA: 단일 강력 모델 다중 출력이 이종 혼합보다 나을 수 있음'
  - 'RMoA: ResNet식 residual로 cross-layer 정보 보존, ACL 2025'
  source: https://arxiv.org/abs/2406.04692
- category: ai
  title: RWKV-7 Goose — O(n) 선형시간·KV캐시 없는 RNN, Dynamic State Evolution(ICML 2025)
  summary: 'RWKV-7 "Goose"(2025, ICML)는 generalized delta rule로 벡터값 게이팅·in-context learning rate를 도입한 100% RNN LLM 아키텍처이다. O(n) 시간·O(d²) 상수 메모리(KV캐시 불필요), Transformer급 병렬 학습 가능. Mamba-2(TC0)와 달리 TC0 초월 expressiveness, 3B에서 MMLU 61.2(vs LLaMA-3.2 3B 63.4). 100K+ ctx·엣지 추론·다국어에 강점. BlinkDL/RWKV-LM GitHub, ChatRWKV 데모. v4→v7 진화: WKV→multi-head→data-dependent decay→dynamic state evolution.'
  points:
  - 'KV캐시 제로: 토큰당 일정 메모리, 무한 ctx_len 이론적 가능'
  - 'Mamba-2 대비: 벡터값 decay로 채널별 선택적 상태 업데이트'
  - 'Pile 3B PPL 9.6: Transformer 9.8·RWKV-6 9.9 대비 개선'
  source: https://arxiv.org/abs/2503.14456
- category: ai
  title: Differential Transformer — 두 softmax attention 차분으로 노이즈 제거, Microsoft ICLR 2025
  summary: 'Microsoft Diff Transformer(ICLR 2025)는 Q/K를 두 그룹으로 나눠 두 softmax attention map의 차분을 attention score로 사용한다. 공통모드 노이즈 상쇄(노이즈 캔슬링 헤드폰 유사), sparse attention 유도. 장문 컨텍스트·핵심 정보 검색·할루시네이션 완화·in-context learning 순열 강건성 향상. FlashAttention 호환. Diff V2(2025): GQA 그룹 내 query head 2배, 커스텀 커널 불필요, 디코딩 속도 baseline Transformer 동급, attention sink 제거.'
  points:
  - 'Differential attention: Attn = softmax(Q1K1) − λ·softmax(Q2K2)'
  - '할루시네이션↓: irrelevant context에 대한 over-attention 완화'
  - 'Diff V2: KV head 불변, 디코딩 memory-bound에서 속도 parity'
  source: https://arxiv.org/abs/2410.05258
- category: ai
  title: EU AI Act 2026 시행 — 8/2 투명성·GPAI 벌금, 12/27 고위험(Annex III) 의무
  summary: 'EU AI Act는 2024-08-01 발효, 단계적 적용 중이다. 2025-02-02 금지 관행(AI literacy), 2025-08-02 GPAI 모델 의무(문서화·저작권) 이미 시행. 2026-08-02: Article 50 투명성(합성 콘텐츠 라벨링), GPAI 벌금 집행, AI Sandbox 의무. Digital Omnibus(2026-06 EP 승인): 고위험 Annex III는 2027-12-02, Annex I 제품 내장 AI는 2028-08-02로 연기. 2026-12-02: 기존 GenAI 워터마킹·nudifier 앱 금지. 최대 벌금 GPAI 3%/매출, 고위험 35M€ 또는 7%.'
  points:
  - '2026-08-02: Article 50 투명성 + EU AI Office GPAI 벌금 권한'
  - '2027-12-02: 고위험(채용·교육·생체인식 등 Annex III) 의무'
  - 'Omnibus: 워터마킹 2026-12-02, nudifier·CSAM 생성 AI 금지'
  source: https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
- category: ai
  title: Snyk vs Semgrep — AI 코드 보안 2026, DeepCode AI(SAST+SCA) vs YAML 커스텀 규칙(SAST)
  summary: '2026년 AI 코드 보안의 대표 대결. Snyk Code(DeepCode AI): ML 기반 opaque 엔진, SCA+SAST+컨테이너+IaC 통합, IDE 실시간 autofix(MTTR 84%↓), $59/dev/mo. Semgrep: YAML 패턴 규칙(감사·포크 가능), 10~30초 CI 스캔, 커스텀 규칙 업계 최고, CE 오픈소스 무료, $40/dev/mo. EASE 2024: Semgrep CE가 Snyk Code detection rate 우위. 실무 패턴: Snyk SCA + Semgrep SAST 조합이 Snyk Enterprise 단독보다 저렴. AI 생성 코드 검출: Snyk 92/100, Semgrep 87/100.'
  points:
  - 'Snyk: DeepCode AI ML, autofix 85% 정확, SCA Forrester Leader'
  - 'Semgrep: YAML 규칙 투명, reachability SCA, 20+ 언어'
  - '조합 패턴: Snyk SCA + Semgrep 커스텀 SAST = 비용·커버리지 최적'
  source: https://snyk.io/platform/deepcode-ai/
- category: ai
  title: Anthropic RSP v3.0 — Frontier Safety Roadmap·Risk Report, ASL-3/4 임계값(2026-02-24)
  summary: 'Anthropic Responsible Scaling Policy v3.0(2026-02-24 발효)은 재앙적 AI 위험 관리 자발적 프레임워크의 전면 개정이다. Frontier Safety Roadmap(보안·정렬·가드레일·정책 목표), 3~6개월마다 Risk Report(능력·위협모델·완화조치). Capability Threshold: CBRN 개발 uplift, AI R&D 2단계(입문 연구 자동화·scaling 가속). ASL-2(현행 Sonnet/Haiku)→ASL-3(Opus 4, Constitutional Classifiers++)→ASL-4(임계값 초과 시, 사전 공개 약속). v2 대비 일방적 pause 약속 축소, 투명성·자기보고 중심으로 전환.'
  points:
  - 'Risk Report: 3~6개월 주기, system card 초월 종합 위험 평가'
  - 'CBRN threshold: 중간 자원 국가 프로그램 uplift 가능 수준'
  - 'ASL-3: hardened weight storage, Constitutional Classifiers++ 배포'
  source: https://www.anthropic.com/news/responsible-scaling-policy-v3
- category: ai
  title: Jamba 2 — AI21 SSM+Transformer 하이브리드, 3B 엣지·52B/12A MoE·256K ctx(Apache-2.0)
  summary: AI21 Labs가 2026-01 공개한 Jamba 2는 Mamba SSM과 Transformer attention을 교차 배치한 하이브리드 오픈웨이트 패밀리다. Jamba2 3B(dense)는 iPhone·Mac에서 돌릴 수 있는 엣지 모델, Jamba2 Mini(52B total·12B active MoE)는 256K 컨텍스트에서 reasoning 모델의 thinking token 오버헤드 없이 enterprise QA·RAG·장문 분석에 최적화됐다. 500B 토큰 mid-training(수학·코드·장문 비중↑) 후 on-policy RL(DPO→verifiable reward)로 instruction-following·grounding 벤치(IFBench·FACTS)에서 동급 Ministral3 14B 대비 통계적으로 유의한 우위를 보인다. Apache-2.0, Hugging Face·AI21 Studio·AWS Bedrock 제공.
  points:
  - 3B dense + Mini 52B/12A MoE, 256K ctx, Apache-2.0
  - 'SSM-Transformer 교차: 100K+ ctx에서도 메모리 효율·throughput 유지'
  - Enterprise QA·grounded RAG 특화 — reasoning 모델 대비 낮은 compute
  source: https://www.ai21.com/blog/introducing-jamba2/
- category: ai
  title: Together AI — 200+ 오픈소스 모델 서버리스 추론, OpenAI 호환 API·배치 50% 할인
  summary: Together AI는 오픈소스 LLM 추론·파인튜닝·GPU 클러스터를 한 플랫폼에 묶은 full-stack AI 인프라다. Serverless Inference는 200+ 모델(Qwen·Kimi·DeepSeek·FLUX 등)을 per-token API로 호출하며 OpenAI SDK와 base_url만 바꿔 drop-in 연동 가능하다. Adaptive speculative decoding으로 GPT-OSS·Qwen 등 고난도 모델에서 최대 2.75× 빠른 서버리스 추론을 주장하고, 비실시간 워크로드는 Batch API로 50% 할인된다. Dedicated Endpoints는 GPU를 분 단위로 예약해 steady traffic·파인�uning 모델 서빙에 쓴다. LangChain·Vercel AI SDK·LlamaIndex·Helicone 등 서드파티 통합 제공.
  points:
  - 'OpenAI 호환: base_url=https://api.together.ai/v1, model만 교체'
  - Serverless(per-token) vs Dedicated(GPU/min) — 트래픽 패턴에 선택
  - Batch 50% 할인·Helicone observability·100+ 모델 카탈로그
  source: https://docs.together.ai/docs/inference/overview
- category: ai
  title: Guardrails AI — Validator Hub로 LLM 입출력을 런타임 검증·구조화 출력 강제(MIT)
  summary: Guardrails AI는 LLM 애플리케이션에 런타임 안전장치를 씌우는 Python 프레임워크다. Guard 객체가 LLM 호출 전후로 Input/Output Guard를 실행하고, Guardrails Hub의 Validator(PiiDetection·ToxicLanguage·Jailbreak·Hallucination 등)를 조합해 위험을 탐지·정량화·완화한다. Pydantic/RAIL(XML) 스키마로 구조화 출력을 강제하며, 검증 실패 시 reask·filter·fix·exception 등 on-fail 액션을 설정한다. 2025-02 Guardrails Index 벤치마크로 Validator별 latency·accuracy 공개. 모델 비종속(OpenAI·Anthropic·로컬)이며 REST API 서버로도 배포 가능.
  points:
  - 'Guard + Validator Hub: PII·탈옥·유해·할루시네이션 등 조합'
  - Pydantic/RAIL 스키마 → function calling 또는 prompt optimization
  - 'on-fail: reask·filter·fix·exception — Guardrails Index로 Validator 품질 비교'
  source: https://github.com/guardrails-ai/guardrails
- category: ai
  title: MLX — Apple Silicon 전용 ML 프레임워크, unified memory·lazy compute·M5 Neural Accelerator(MIT·~26k★)
  summary: MLX는 Apple ML Research가 만든 Apple Silicon 전용 array 프레임워크로, unified memory 아키텍처를 활용해 GPU·CPU·Neural Engine 간 데이터 복사 없이 효율적 수치 연산·학습·추론을 제공한다. NumPy-like core + PyTorch/JAX-like nn·optimizer 패키지, lazy computation·automatic differentiation·function transformation을 지원한다. Python·Swift·C++·C API, WWDC25 공식 세션. MLX-LM으로 Hugging Face LLM 텍스트 생성·파인튜닝, macOS 26.2+ JACCL(RDMA over Thunderbolt)로 Mac 간 분산 학습. M5 Neural Accelerator(TensorOps·Metal 4) 지원으로 inference 가속.
  points:
  - 'Unified memory: GPU↔CPU 복사 없이 lazy compute·autograd'
  - 'MLX-LM: HF LLM on-device 생성·파인튜닝, LM Studio·Apple Research 데모'
  - JACCL 분산(Mac Thunderbolt 5)·M5 Neural Accelerator·MIT·26k★
  source: https://github.com/ml-explore/mlx
- category: ai
  title: LangSmith — 프레임워크 비종속 LLM·에이전트 옵저버빌리티·평가·프롬프트 관리 플랫폼
  summary: LangSmith는 LangChain 팀의 managed AI agent engineering platform으로, trace 기반 디버깅·평가·모니터링·프롬프트 관리를 통합한다. OpenAI·Anthropic·CrewAI·Vercel AI SDK·Pydantic AI 등 80+ 프레임워크와 OpenTelemetry 연동, LangChain 종속 없이 @traceable 또는 SDK로 계측 가능. Polly AI assistant로 긴 trace 분석, Insights Agent로 usage pattern·failure mode 클러스터링, SmithDB(purpose-built DB)로 nested agent trace 검색. Online eval(LLM-as-judge·code eval)·dashboard·PagerDuty alert. 2025-10 Series B $125M($1.25B valuation), 월 10억+ trace 처리.
  points:
  - 'Trace-first: conversation thread·tool·sub-agent delegation 1급 개념'
  - SmithDB + Polly + Insights Agent — nested trace 디버깅·패턴 분석
  - Online eval·cost/latency dashboard·OpenTelemetry·80+ framework
  source: https://docs.langchain.com/langsmith/home
- category: ai
  title: Gemma 3n — MatFormer·PLE로 2GB RAM에 8B급, 텍스트·이미지·오디오 온디바이스(Gemma)
  summary: Gemma 3n은 Google DeepMind의 mobile-first 오픈 멀티모달 모델로, Gemini Nano와 공유 아키텍처를 Gemma로 먼저 공개한 버전이다. MatFormer(Matryoshka Transformer)로 E4B(8B raw·4B effective) 안에 E2B(5B raw·2B effective) 서브모델이 중첩되어 latency·품질 트레이드오프를 런타임에 조절한다. Per-Layer Embedding(PLE) caching으로 embedding을 CPU에 두고 accelerator에는 core transformer(~2B/4B)만 로드 — E2B 2GB·E4B 3GB RAM. MobileNet-v5 vision·오디오 encoder, 32K ctx·140개 언어. Google AI Edge·Android Gemma Gallery·LiteRT 배포.
  points:
  - 'MatFormer: E4B 안에 E2B 중첩, Mix-n-Match로 2B~4B 사이 커스텀'
  - 'PLE: 8B raw → 4B effective, 2GB(E2B)·3GB(E4B) RAM'
  - 텍스트·이미지·오디오·Gemini Nano 동일 아키·Android/Chrome 예정
