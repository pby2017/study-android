- category: ai
  title: Codex 지식작업 확장 — 코딩 에이전트도 사내 도구 제작대로 바뀐다
  summary: 'OpenAI는 2026년 6월 Codex가 주간 활성 사용자 500만 명을 넘었고, 비개발 지식작업자가 사용자 중 약 20%를 차지하며 개발자보다 3배 이상 빠르게 늘고 있다고 밝혔다. 핵심은 "코딩 도구가 개발자 밖으로 퍼졌다"가 아니라, 리서치·데이터 분석·보고서·스프레드시트·계약서·가벼운 내부 도구 제작이 같은 에이전트 실행 환경으로 들어온다는 점이다. 개발자는 이제 앱 기능만이 아니라, 반복 업무를 코드·파일·도구 호출이 섞인 작은 자동화로 바꾸는 운영자다.

    '
  points:
  - Codex 주간 활성 사용자 500만+
  - 비개발 지식작업자 약 20%, 개발자보다 3배 이상 빠르게 성장
  - 리서치·분석·문서·내부 도구 제작이 같은 에이전트 워크스페이스로 이동
  source: https://openai.com/index/codex-for-knowledge-work/
- category: ai
  title: Copilot CLI 에이전트 피커 — 실행 전에 모드를 고르는 것이 안전장치다
  summary: 'GitHub의 2026년 6월 JetBrains Copilot 업데이트는 CLI 세션에 agent picker를 넣었다. 사용자는 Agent mode, Ask mode, Custom agents, Plan mode 중에서 작업 성격에 맞는 모드를 고른다. 같은 릴리스에는 `/remote`, `/compact`, `/chronicle`, Agent Debug Panel도 들어갔다. 교육 포인트는 코딩 에이전트 운영을 "항상 자동 실행"으로 두지 않는 것이다. 질문, 계획, 구현, 맞춤 역할, 원격 제어, 로그 관찰을 분리해야 비용·안전·디버깅 경계가 선명해진다.

    '
  points:
  - Agent/Ask/Custom agents/Plan mode를 세션 시작 전에 선택
  - '`/remote`로 진행 중 CLI 세션을 GitHub.com·모바일에서 조정'
  - Agent Debug Panel은 커스텀 에이전트·서브에이전트 흐름 디버깅용
  source: https://github.blog/changelog/2026-06-02-introducing-copilot-cli-and-agentic-capabilities-enhancements-in-jetbrains-ides/
- category: ai
  title: Dell + Codex — 엔터프라이즈 에이전트는 데이터가 있는 곳으로 간다
  summary: 'OpenAI와 Dell은 2026년 5월 Codex를 하이브리드·온프레미스 환경에 더 가깝게 배포하는 협력을 발표했다. 당시 OpenAI는 Codex가 주간 개발자 400만 명 이상을 보유하고, 코드 리뷰·테스트 커버리지·사고 대응·대형 저장소 추론뿐 아니라 보고서 작성, 피드백 라우팅, 영업 리드 선별 같은 업무에도 쓰인다고 설명했다. 실무 포인트는 엔터프라이즈 AI 에이전트의 병목이 모델 호출이 아니라 내부 코드·문서·업무 시스템·거버넌스 데이터에 안전하게 가까워지는 배치 전략이라는 점이다.

    '
  points:
  - Codex 주간 개발자 400만+ 시점의 엔터프라이즈 배포 협력
  - Dell AI Data Platform·AI Factory 같은 하이브리드/온프레미스 경계가 핵심
  - 에이전트 도입은 모델보다 데이터 위치·권한·거버넌스 설계가 먼저
  source: https://openai.com/index/dell-codex-enterprise-partnership/
- category: ai
  title: GPT-5.1-Codex-Max — 긴 작업은 큰 창보다 반복 압축이 핵심이다
  summary: 'OpenAI는 GPT-5.1-Codex-Max를 Codex용 장시간 에이전트 코딩 모델로 소개했다. 핵심은 컨텍스트가 커지는 것보다 compaction이다. 세션이 한계에 가까워지면 중요한 작업 상태를 남기고 새 컨텍스트 창으로 이어가며, 복잡한 리팩터링· 심층 디버깅·멀티아워 에이전트 루프를 지속한다. 공개 수치로는 SWE-bench Verified가 73.7%에서 77.9%, Terminal-Bench 2.0이 52.8%에서 58.1%로 개선됐다. 개발자에게는 "프롬프트를 더 길게"보다 상태 요약·검증 로그·리뷰 루프를 남기는 설계가 더 중요하다.

    '
  points:
  - compaction으로 여러 컨텍스트 창을 이어 장시간 작업 지속
  - SWE-bench Verified 73.7%→77.9%, Terminal-Bench 2.0 52.8%→58.1%
  - '기본 권장 운영: 샌드박스, 도구 로그, 테스트 결과, 사람 리뷰'
  source: https://openai.com/index/gpt-5-1-codex-max/
- category: ai
  title: 'README-AI: 저장소를 분석해 README를 자동 생성하는 CLI'
  summary: '저장소 처리 엔진과 LLM을 결합해 구조화된 README를 명령 한 번에 생성. 배지·프로젝트 구조·기능 표·시작 가이드 등을 자동으로 채워준다. MIT 라이선스.

    '
  points:
  - '설치: pip install -U readmeai (Python 3.9+)'
  - '소스: 로컬 파일시스템·GitHub·GitLab·Bitbucket 지원'
  - model agnostic — OpenAI·Anthropic·Gemini·Ollama, 기본 gpt-3.5-turbo
  - '오프라인 모드(--api offline): LLM API 없이 README 생성'
  source: https://github.com/eli64s/readme-ai
- category: ai
  title: Mem0 — AI 에이전트에 장기 메모리를 추가하는 드롭인 레이어, 벡터+그래프 하이브리드(Apache-2.0·~48k★)
  summary: 'Mem0는 AI 에이전트와 어시스턴트에 장기 메모리를 추가하는 프로덕션급 오픈소스 레이어다. 벡터 검색+ 그래프 기반 하이브리드 아키텍처로, 세션을 넘어 사용자 선호·이전 대화·변경된 사실을 기억한다. 시맨틱 유사성+키워드 매칭+엔티티 매칭으로 관련 메모리를 검색해 context window에 주입. 20개 벡터 스토어 백엔드(Qdrant·Chroma·Pinecone·PGVector 등), 21개 프레임워크 통합. OpenMemory MCP 서버로 Claude Desktop·Cursor·VS Code에서 로컬 메모리 사용 가능.

    '
  points:
  - '하이브리드: 벡터 검색 + 그래프 + 시맨틱/키워드/엔티티 매칭'
  - 20개 벡터 스토어 + 21개 프레임워크 통합
  - 'OpenMemory MCP: Claude·Cursor·VS Code 로컬 메모리'
  source: https://mem0.ai/blog/state-of-ai-agent-memory-2026
- category: ai
  title: Graphiti(Zep) — 시간을 1등 시민으로 다루는 AI 에이전트 메모리, 사실의 유효 기간을 추적하는 시간 지식 그래프
  summary: 'Graphiti는 Zep이 만든 시간 지식 그래프 기반 AI 에이전트 메모리 엔진이다. 모든 사실에 bi-temporal 유효 기간(세계에서 언제 참이었나 + 그래프에서 언제 참이었나)을 부여하고, 모순되는 새 사실이 들어오면 이전 사실을 삭제하지 않고 무효화+경계를 기록. ''지금 참인 것''과 ''3월 5일에 참이었던 것''을 별도로 조회 가능. 시맨틱 임베딩+BM25 키워드+그래프 순회 하이브리드 검색. sub-200ms(관리형), ~700ms p95(OSS).

    '
  points:
  - 'bi-temporal: 사실의 세계 유효 기간 + 그래프 유효 기간 추적'
  - '비파괴 업데이트: 모순 사실 → 이전 사실 무효화, 삭제 안 함'
  - '하이브리드 검색: 시맨틱 + BM25 + 그래프 순회'
  source: https://vectorize.io/articles/best-ai-agent-memory-systems
- category: ai
  title: MLPerf Mobile v6.0 — 온디바이스 LLM 성능을 표준화된 벤치마크로 비교, Llama 3.2·Dimensity 9500 지원
  summary: 'MLPerf Mobile v6.0은 MLCommons가 발표한 온디바이스 GenAI 벤치마크다. Llama 3.2 1B/3B·Llama 3.1 8B로 TinyMMLU·IFEval 데이터셋 기반 성능·정확도를 측정. Qualcomm Snapdragon 8 Elite Gen 5에서 NPU 가속 실행 지원, MediaTek Dimensity 9500·Samsung Exynos 2600도 추가. 이미지 생성·객체 감지·초해상도 벤치마크도 포함. MLPerf Mobile 앱으로 누구나 자기 디바이스에서 테스트 가능.

