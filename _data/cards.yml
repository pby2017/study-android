  - category: ai
    title: "Serena — 코드를 '텍스트 줄'이 아니라 '심볼'로 다루게 해주는 MCP 툴킷"
    summary: >
      Serena(oraios)는 코딩 에이전트에 IDE급 능력을 붙여주는 오픈소스 MCP 서버로, 별 약 25k개를 받았고 MIT 라이선스다.
      README의 한 줄 정의는 "semantic retrieval, editing, refactoring, debugging 도구를 제공하는 코딩 에이전트 툴킷" — Language Server Protocol(LSP)을 써서 코드를 함수·클래스·변수 같은 심볼 단위로 이해시킨다.
      핵심은 에이전트가 코드를 줄 번호로 자르는 평문이 아니라 심볼로 다루게 되는 점: 정의 위치 찾기, 프로젝트 전역 참조 추적, 한 번에 이름 바꾸기, 함수 본문만 교체 같은 작업을 줄 세지 않고 한다.
      Claude Code·Codex 등 MCP를 지원하는 에이전트에 그대로 붙고, 큰 레포일수록 토큰을 아끼고 정확도를 올리는 효과가 크다.
      "Cursor를 안 써도 되게 만든다"는 평가가 나올 만큼, 무료로 의미 기반 코드 탐색·편집을 더하는 출발점으로 둘 만하다.
    points:
      - "LSP 기반으로 코드를 심볼(함수·클래스·변수) 단위로 이해 — 정의/참조 추적·전역 리네임·본문 교체를 줄 세기 없이"
      - "MCP 서버라 Claude Code·Codex 등 MCP 지원 에이전트에 그대로 연결, MIT 라이선스·약 25k★"
      - "평문 편집 대비 큰 레포에서 토큰 절감·정확도 향상이 강점 (작은 프로젝트보다 대형에서 효과 큼)"
    source: "https://github.com/oraios/serena"
  - category: ai
    title: "Cursor CLI 헤드리스 모드 — `agent -p`로 CI·스크립트에서 코드 작업 자동화"
    summary: >
      Cursor도 터미널용 에이전트 CLI를 제공한다. `curl https://cursor.com/install -fsS | bash`로 깔면 `agent` 명령이 생기고, 그냥 치면 대화형 세션, `-p`(`--print`)를 붙이면 비대화형 '프린트 모드'로 돌아 스크립트·자동화에 쓸 수 있다. `claude -p`와 같은 발상이다.
      문서가 명시하는 핵심 플래그는 두 가지. `-p --print`는 사람 개입 없이 최종 답만 깔끔히 내놓는 모드이고, `--force`(별칭 `--yolo`)는 확인 없이 파일을 직접 고치게 허용한다 — 안 붙이면 편집은 '제안'에만 머문다.
      출력 형식은 `--output-format`으로 고른다: 기본 text(최종 답만), json(구조화된 분석 결과), stream-json(메시지 단위 실시간 진행 추적). stream-json에 `--stream-partial-output`을 더하면 델타 단위로 증분 스트리밍된다.
      인증은 CURSOR_API_KEY 환경변수로 한다. 즉 Cursor를 에디터 밖 CI 파이프라인·리팩터링 배치 작업에 끼워 넣을 수 있다는 뜻.
    points:
      - "설치하면 `agent` 명령 — 인자 없이 대화형, `-p/--print`면 비대화형 프린트 모드(스크립트·자동화용)"
      - "`--force`(=`--yolo`)로 확인 없이 직접 파일 편집, 없으면 편집은 '제안'만 / 인증은 CURSOR_API_KEY 환경변수"
      - "`--output-format`: text(기본)·json·stream-json, stream-json+`--stream-partial-output`로 델타 증분 스트리밍"
    source: "https://cursor.com/docs/cli/headless"
  - category: ai
    title: "하네스 엔지니어링 — '모델'이 아니라 '에이전트가 일하는 발판'을 설계하는 분야"
    summary: >
      같은 모델이라도 에이전트의 성능은 천차만별인데, 그 차이를 만드는 게 모델이 아니라 그 모델을 감싼 '하네스(harness)'다. ai-boost/awesome-harness-engineering는 이 하네스 엔지니어링을 하나의 분야로 정리한 큐레이션 목록으로, 하네스를 '컨텍스트 전달·도구 인터페이스·계획 산출물·검증 루프·메모리 시스템·샌드박스'를 설계하는 규율이라고 정의한다.
      핵심 발상은 모델을 더 똑똑하게 만드는 대신 모델이 일하는 '발판'을 잘 짜는 데 집중한다는 것. 어떤 컨텍스트를 언제 넣고(컨텍스트 엔지니어링), 도구를 어떻게 노출하고, 결과를 어떻게 검증·기억하게 할지가 곧 에이전트 품질이라는 관점이다.
      Claude Code·Cursor 같은 도구를 그냥 쓰는 단계를 넘어 '왜 이렇게 동작하나'를 설계 수준에서 다루려는 사람을 위한 지도다. CC0(퍼블릭 도메인) 라이선스라 그대로 가져다 쓰거나 사내 문서로 포크해도 된다.
    points:
      - "하네스 = 모델을 감싼 발판: 컨텍스트 전달·도구 인터페이스·계획 산출물·검증 루프·메모리·샌드박스(README 정의)"
      - "초점은 '더 똑똑한 모델'이 아니라 '같은 모델을 더 잘 일하게 하는 구조' — 컨텍스트 엔지니어링이 그 핵심 축"
      - "CC0 퍼블릭 도메인 큐레이션 목록이라 자유 복제·사내 포크 가능 / 도구 사용자→설계자로 넘어갈 때 보는 지도"
    source: "https://github.com/ai-boost/awesome-harness-engineering"

  - category: ai
    title: "Gartner가 'AI 코드 어시스턴트'를 'AI 코딩 에이전트'로 다시 부르다 — 4강 굳히기"
    summary: >
      Gartner는 2026-05-20 이 분야 매직 쿼드런트의 이름을 'Enterprise AI Coding Agents'로 바꿨다.
      예전의 'AI Code Assistants(자동완성·채팅 보조)'에서 '에이전트(스스로 여러 단계를 수행)'로
      카테고리 정의 자체가 옮겨간 것으로, 자동완성이 아니라 에이전트 능력으로 기업용 도구를 평가하기
      시작했다는 신호다. 12개 벤더를 '실행력(ability to execute)'과 '비전 완성도' 두 축으로 평가했고,
      Leaders는 GitHub·Anthropic·Cursor·OpenAI 네 곳이었다(GitHub가 3년 연속 Leader이자 실행력 1위).
      도구 고를 때 '자동완성 품질'보다 '에이전트로 일을 끝까지 맡길 수 있나'를 먼저 보라는 흐름의 공식 확인이다.
    points:
      - "카테고리명 변경: AI Code Assistants → Enterprise AI Coding Agents(2026-05-20) — 평가 기준이 '보조'에서 '에이전트'로 이동"
      - "Leaders 4곳: GitHub·Anthropic·Cursor·OpenAI / GitHub는 3년 연속 Leader·실행력 최고점(12개 벤더 평가)"
      - "실무 함의: 기업 도구 선정 기준이 '자동완성·채팅'에서 '멀티스텝 자율 실행 능력'으로 재편 중"
    source: "https://github.blog/ai-and-ml/github-copilot/github-recognized-as-a-leader-in-the-gartner-magic-quadrant-for-enterprise-ai-coding-agents-for-the-third-year-in-a-row/"
  - category: ai
    title: "ETH Zurich 연구 — AGENTS.md를 LLM에게 자동 생성시키면 오히려 성공률이 떨어진다"
    summary: >
      ETH Zurich·LogicStar.ai 팀이 실제 코딩 태스크에서 AGENTS.md(레포 컨텍스트 파일)가
      코딩 에이전트에 도움이 되는지 처음으로 엄밀하게 측정했다(arXiv 2602.11988). 결론은 직관과 반대다:
      `/init` 류로 LLM이 자동 생성한 컨텍스트 파일은 성공률을 높이기는커녕 오히려 낮추는 경향을 보였고,
      에이전트가 더 많은 단계를 밟게 만들어 추론 비용을 20% 넘게 끌어올렸다. 사람이 손으로 쓴 파일은
      소폭의 이득은 있었지만 그 역시 탐색 단계와 비용을 함께 늘렸다. 60,000개 넘는 공개 레포가 이미
      이런 파일을 두고 있는데, "있으면 좋다"는 가정이 데이터로 흔들린 셈이다.
    points:
      - "핵심 발견: LLM이 자동 생성한 AGENTS.md는 컨텍스트 파일 없는 경우보다 성공률을 떨어뜨리는 경향 + 추론 비용 20%↑(논문 abstract 확인)"
      - "원인 추정: '전체 테스트 돌려라'·'관련 모듈 다 봐라' 같은 지시가 에이전트를 불필요한 탐색으로 몰아 단계·비용을 늘림"
      - "권고: LLM 자동 생성 파일은 빼고, 사람이 추론 불가능한 정보(특수 빌드·툴 커맨드)만 짧게 적어라 — '자동 생성 디테일'은 독"
    source: "https://arxiv.org/abs/2602.11988"
  - category: ai
    title: "Ruflo(옛 Claude-Flow) — Claude Code 위에 '여왕-일꾼' 스웜을 얹는 59.6k★ 메타하네스"
    summary: >
