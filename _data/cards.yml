  title: Whisper large-v3-turbo — 디코더 32→4층·809M, GPU 8배·Apple Silicon 2배 빠른 ASR
  summary: OpenAI Whisper large-v3-turbo(2024-09)는 large-v3의 디코더를 32층→4층으로 축소해 1.55B→809M 파라미터, VRAM ~6GB→~3.5GB. Distil-Whisper 영감, 번역 데이터 제외하고 전사 데이터로 2 epoch fine-tune. LibriSpeech·10시간 혼합 오디오에서 large-v3 대비 WER 1~2%p 차이, GPU ~8x·Apple Silicon ~2x 속도. CLI 기본 모델이 turbo로 변경(20240930+). `--task translate` 미지원(원어 반환). faster-whisper·Hugging Face 배포.
