  title: LLM API 비용 최적화 — routing·prefix cache·semantic cache·batch 4층 FinOps(2026)
  summary: '2026년 LLM 프로덕션 비용은 routing+caching+batch 4층으로 60~80% 절감 사례가 보고된다. Model routing — 단순 분류·추출은 nano/mini, reasoning만 frontier, cascade(저가→escalate)로 40~60%↓. Prefix cache(프롬프트 캐싱) — 반복 system prompt·도구 정의·참조 문서를 저장: Anthropic cache_control 마커·읽기 90% 할인·쓰기 1.25x(5분)/2x(1h), OpenAI 1,024+ 토큰 자동 50% 할인, Gemini 명시적 cache 객체·시간당 스토리지. 핵심 규칙: 정적 콘텐츠를 프롬프트 맨 앞 배치. Semantic cache — embedding 유사 query hit 시 LLM 생략(GPTCache·Redis VSS) 20~50%↓, prefix cache와 병행. Batch API — async 24h 50% 할인. LiteLLM/Portkey(게이트웨이)와 달리 아키텍처 패턴 — cost per successful outcome·eval-driven routing gate 필수.'
  points:
  - Model routing/cascade — task complexity별 cheapest capable model
  - Prefix cache — Anthropic 90%·OpenAI auto 50%·Gemini explicit, 정적 콘텐츠 맨 앞
  - Semantic cache+Batch 50% — GPTCache/Redis VSS·eval hold-out 200~500 query
  source: https://stochasticsandbox.com/posts/cost-optimization-for-llm-applications-2026-05-26/
