- category: ai
  title: Agent behavioral drift — trace만으로는 silent failure·5 observability primitive
  summary: Agent behavioral drift(2026 production pattern) — agent remains healthy(infra green) but decision quality degrades silently. causes — foundation model update·tool API schema change·RAG corpus growth·prompt drift without deploy event. semantic drift ≠ statistical input drift — same input, different reasoning path. five observability primitives beyond uptime — tool-call trace+authorization audit·retrieval provenance·multi-step replay·behavioral drift detection(rolling baseline on tool frequency·refusal rate·retrieval depth·latency·cost-per-task)·online eval on sampled traces. OTel GenAI span hierarchy enables fingerprint but drift needs eval layer attached. vs Datadog MELT(infra) ·LLM observability(single call) ·Braintrust(trace+eval) — drift=decision integrity monitoring.
  points:
  - Silent failure — wrong decision with 200 OK, dashboards stay green
  - Rolling baseline 24h/7d/30d — leading indicator before user complaints
  - Trace without eval — see what agent did, not whether still correct
  source: https://www.areebi.com/resources/blog/ai-agent-monitoring-observability-2026
