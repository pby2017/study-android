      - "'어떤 스킬을 쓸지' 에이전트가 알 필요 없게 리서치 생애주기(서베이→아이디어→실험→합성→논문)를 자동 라우팅"
    source: "https://github.com/Orchestra-Research/AI-research-SKILLs"

  - category: ai
    title: "Conductor — 한 Mac에서 Claude Code·Codex·Cursor를 '여러 워크스페이스'로 동시에 돌리는 앱"
    summary: >
      Conductor는 'Run parallel coding agents on your Mac'를 표방하는 macOS 앱으로, 코딩
      에이전트를 격리된 워크스페이스 여러 개로 동시에 돌린 뒤 각각의 변경을 검토·머지하게 해준다.
      각 워크스페이스는 '별도 브랜치와 워킹 트리(separate branch and working tree)'를 받아 실험이
      진행 중인 작업과 격리되며, run·review·merge·archive를 스트림별로 독립 스케줄로 굴린다.
      Claude Code·Codex·Cursor 세 에이전트를 지원하고 워크스페이스마다 모델을 바꿔 끼울 수 있다.
      Melty(오픈소스 AI 에디터)를 만든 YC S24 팀이 만들었고, Spark·Matrix로 2200만 달러 시리즈 A를
      유치했다(주장).
    points:
      - "워크스페이스=격리 단위: 각자 별도 브랜치·워킹 트리·앱 상태·PR 경로를 가져 머지 충돌 없이 병렬 작업(공식 문서 인용)"
      - "Claude Code·Codex·Cursor 멀티모델 지원 / 인라인 diff에 클릭해 피드백을 적으면 에이전트가 그 자리에서 반복"
      - "기존 Claude Code 로그인을 그대로 사용 / 2026년 5월 Vercel Sandbox로 클라우드 실행 옵션 추가(주장)"
    source: "https://www.conductor.build/docs/core/parallel-agents"

  - category: ai
    title: "컨텍스트 엔지니어링 — '프롬프트'가 아니라 추론 내내 보이는 토큰 전체를 큐레이팅하기"
    summary: >
      Anthropic은 컨텍스트 엔지니어링을 'LLM 추론 동안 최적의 토큰 집합을 큐레이팅·유지하는 전략'으로
      정의한다(공식 엔지니어링 블로그). 한 번만 잘 쓰면 되는 프롬프트와 달리, 에이전트는 멀티턴 루프를
      돌며 매 스텝 컨텍스트가 쌓이므로 관리 대상이 '문장'이 아니라 '윈도 전체의 상태'가 된다. 핵심 적은
      'context rot' — 토큰이 찰수록 모든 프런티어 모델의 성능이 떨어지는 현상이라, 1M 윈도라도 이를
      없애지 못하고 한계만 늦출 뿐이다. 그래서 목표는 '가장 작은 고신호(high-signal) 토큰 집합'을
      유지하는 것이고, 그 수단으로 필요할 때만 끌어오는 just-in-time 검색, 한도 근처에서의 compaction,
      잡일을 격리하는 서브에이전트, 윈도 밖에 적어두는 structured note-taking을 쓴다.
    points:
      - "정의: '추론 동안 최적 토큰 집합을 큐레이팅·유지' — 프롬프트 엔지니어링의 상위 개념(Anthropic 공식)"
      - "context rot: 윈도가 찰수록 성능 저하 → 절대 토큰 수가 아니라 '채움 비율'을 예산으로 관리"
      - "수단: just-in-time 검색 / compaction / 서브에이전트 격리 / 윈도 밖 노트 적기"
    source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"

  - category: ai
    title: "서브레시피 파이프라인 — 복잡한 작업을 'YAML 레시피'로 쪼개 단계·병렬로 돌리기"
    summary: >
      코딩 에이전트 워크플로를 한 프롬프트에 욱여넣는 대신, 단계를 파일로 굳혀 조립하는 패턴이다.
      Goose(현 Linux Foundation AAIF) 레시피가 대표 구현으로, 메인 레시피의 `sub_recipes` 필드에
      `name`/`path`/`values`를 적으면 각 서브레시피가 '도구'로 등록된다. 호출되면 서브레시피는 메인과
      대화 이력·메모리·상태를 공유하지 않는 '별도 세션'에서 격리 실행되고 결과만 메인으로 돌려준다 —
      즉 컨텍스트 오염 없이 "보안 스캔 → 품질 검사" 같은 전문 단계를 파이프라인으로 엮을 수 있다.
      서로 다른 서브레시피는 기본적으로 순차 실행이고, 같은 서브레시피를 여러 입력으로 돌리면 최대 10개
      워커로 자동 병렬화된다(공식 문서: 실험적 기능, 동작이 바뀔 수 있음).
    points:
      - "메인 레시피의 sub_recipes: {name, path, values}로 등록 → 각 서브레시피가 도구로 노출됨"
      - "서브레시피는 별도 세션에서 격리 실행(이력·메모리 비공유), 결과만 반환 / 중첩(서브의 서브) 금지"
      - "서로 다른 레시피=기본 순차, 같은 레시피 반복=기본 병렬(최대 10워커) — 모두 실험적 기능(공식 문서)"
    source: "https://github.com/aaif-goose/goose/blob/main/documentation/docs/guides/recipes/subrecipes.md"

  - category: ai
    title: "Ralph 기법 — '멍청하지만 절대 안 멈추는' 에이전트 bash 루프"
    summary: >
      Geoffrey Huntley가 제안한 가장 단순한 자율 코딩 패턴이다. 핵심은 단 한 줄
      `while :; do cat PROMPT.md | claude-code ; done` — 같은 프롬프트를 코딩 에이전트에 무한 반복
      투입한다(이름은 심슨의 Ralph Wiggum에서, '똑똑하진 않아도 포기하지 않는다'는 뜻). 설계 핵심은
      매 반복이 깨끗한 컨텍스트로 새로 시작하는 'stateless'라는 점이다 — 진행 상황은 LLM 컨텍스트가
      아니라 git 히스토리·진행 파일(progress/prd)에 쌓이므로 컨텍스트 과적·오염 문제를 피한다.
      Huntley는 반복당 "딱 한 가지(Only one thing)"만 시키고, 메인 컨텍스트는 스케줄러처럼 비싼 일을
      서브에이전트에 떼어 주라고 강조한다. AI가 '끝났다'고 멋대로 멈추는 약점을, 루프로 가둬 검증을
      통과할 때까지 스스로 고치게 만드는 게 노림수다.
    points:
      - "순루프: 작업 1개 고르기→구현→검증(테스트/타입/린트)→통과 시 커밋→상태 갱신→컨텍스트 리셋→반복"
      - "stateless가 핵심: 상태를 git·파일에 두고 매 반복 새 인스턴스로 시작 → 컨텍스트 rot 회피"
      - "비용 주의(루프가 토큰 폭주 가능) — Anthropic이 2025-12 공식 Ralph Wiggum 플러그인으로 채택"
    source: "https://ghuntley.com/ralph/"
  - category: ai
    title: "GNAP — git 저장소 하나로 AI·사람 에이전트를 조율하는 프로토콜"
    summary: >
      GNAP(Git-Native Agent Protocol)은 서버·DB 없이 오직 git만으로 여러 에이전트를 협업시키는 MIT 라이선스 프로토콜이다.
      "JSON 파일 네 개가 프로토콜 전부"라는 게 모토로, .gnap/ 폴더 안의 agents.json(팀), tasks/(할 일),
      runs/(시도), messages/(소통) 만으로 돌아간다. 각 에이전트는 git pull→agents.json에서 자기 활성 여부 확인→
      tasks/에서 맡은 일·messages/ 확인→작업 후 커밋·push를 하트비트처럼 반복하고, git 히스토리 자체가 감사 로그가 된다.
      만든 곳(Farol Labs)에서는 AI 2 + 사람 2, 총 4 에이전트가 같은 레포로 50개 넘는 작업을 굴리고 있다.
    points:
      - "엔티티 4종: Agent(agents.json)·Task(tasks/*.json)·Run(runs/*.json)·Message(messages/*.json)"
      - "오프라인·벤더 종속 없음: git push만 할 수 있으면 사람이든 AI든 동등하게 참여"
      - "버전 안전장치: .gnap/version이 자기가 지원하는 버전보다 높으면 작동을 거부하게 권고"
    source: "https://github.com/farol-team/gnap"

  - category: ai
    title: "Open SWE(LangChain) — 깃허브 이슈에 라벨만 붙이면 도는 비동기 클라우드 코딩 에이전트"
    summary: >
      Open SWE는 LangChain이 'org 내부 코딩 에이전트를 만드는 프레임워크'로 공개한 오픈소스 프로젝트(MIT).
      터미널에 붙어 있지 않아도 깃허브 이슈에 `open-swe-auto` 같은 라벨을 붙이면 알아서 작업해 PR을 올리는
      비동기·클라우드 호스팅 방식이다. LangGraph(Deep Agents) 위에서 Manager→Planner→Programmer→Reviewer
      네 에이전트가 역할을 나눠 돈다. 모든 작업은 Daytona 같은 격리 샌드박스 안에서 실행돼 내 머신을
      건드리지 않고, 계획이 나오면 멈춰 사람이 수정·승인할 수 있게 끊어 준다.
    points:
      - "비동기: 깃허브 이슈에 라벨 붙이면 백그라운드에서 돌아 PR 생성(터미널 상주 불필요)"
      - "역할 분업: Manager(라우팅)→Planner(계획)→Programmer(실행)→Reviewer(품질 검토)"
      - "격리 샌드박스(Daytona 등) + 계획 단계에서 멈춰 사람이 accept/edit/reject"
    source: "https://www.langchain.com/blog/introducing-open-swe-an-open-source-asynchronous-coding-agent"

  - category: ai
    title: "DX 도구별 PR 처리량 벤치마크 — '얼마나 자주 쓰느냐'가 도구 이름보다 크다"
    summary: >
      개발자 생산성 분석 회사 DX가 219개 기업·6만4,680명 개발자의 '실제 머지된 PR' 데이터를 도구별로 집계해
      공개했다(2026 Q1, 2026-01-21 갱신). 핵심은 도구를 매일 쓰는 '빈번 사용자'의 주당 머지 PR 중앙값이
      모든 주요 도구에서 함께 올랐다는 것 — Cursor는 2.8→4.1(46% 증가), Claude는 2.6→4.0 이상,
      GitHub Copilot은 2.5→3.61로 뛰었다. 즉 어떤 도구를 고르느냐보다 '매일 손에 붙이느냐'가 처리량 차이를
      더 크게 가른다는 게 데이터의 메시지다. 단, DX 스스로도 PR 수는 '움직임'이지 제품 가치·품질의 증거는
      아니라고 단서를 단다.
    points:
      - "표본: 219개 기업·64,680명 개발자의 실제 머지된 PR(자기보고 아님), 2026 Q1"
      - "빈번 사용자 주당 PR 중앙값: Cursor 4.1(+46%)·Claude 4.0+·Copilot 3.61 — 전 도구 동반 상승"
      - "DX 단서: PR 수는 '코드 변경량'일 뿐 품질·고객가치의 척도가 아님"
    source: "https://getdx.com/blog/ai-tooling-benchmarks-pr-throughput-and-usage-by-tool/"

  - category: ai
    title: "Everything Claude Code(ECC) — 200k★ 넘긴 '에이전트 설정 모음', AgentShield 보안 감사기까지"
    summary: >
      Affaan Mustafa가 만든 ECC는 코딩 에이전트용 설정·자산을 한 레포에 모은 MIT 라이선스 프로젝트로,
      GitHub 스타 200k 이상을 주장하는 최상위 인기 저장소다. 약 67개 서브에이전트, 260여 개 스킬,
      80여 개 슬래시 커맨드 호환 심(shim), 훅·MCP 설정을 담고 있고 Claude Code뿐 아니라 Codex·Cursor·
      OpenCode·Gemini·Zed·Copilot 등 여러 하네스에 걸쳐 동작한다고 명시한다(하네스별 자산 수는 다름).
      특히 AgentShield라는 보안 감사 도구가 함께 들어 있어 CLAUDE.md·settings.json·MCP 설정·훅·에이전트
      정의·스킬을 정적 분석해 비밀키 노출·권한·훅 인젝션 위험 등을 등급(A~F)으로 리포트한다.
      단, README 자체가 섹션마다 수치(에이전트·스킬 개수)가 달라 정확한 숫자는 '대략'으로 받아들이는 게 안전하다.
    points:
