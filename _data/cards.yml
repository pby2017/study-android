  - category: ai
    title: "Goose — Block이 만든 '터미널 밖에서도 쓰는' 온머신 오픈소스 에이전트"
    summary: >
      Goose는 핀테크 기업 Block(스퀘어·캐시앱)이 만든 오픈소스 AI 에이전트로, 클라우드가 아닌 내 컴퓨터(on-machine)에서 돌며 셸 레벨에서 실제 시스템 작업을 실행한다.
      코드 제안에 그치지 않고 파일 편집·명령 실행·테스트까지 하며, 코딩뿐 아니라 리서치·자동화·데이터 분석 같은 범용 작업도 맡길 수 있다.
      Rust로 작성됐고 Apache-2.0 라이선스이며, Anthropic·OpenAI·Google·Ollama 등 15개 이상 LLM 제공자와 MCP를 지원해 특정 모델·벤더에 묶이지 않는다.
      현재 깃허브 49.4k★를 받았고, 레포가 block/goose에서 리눅스 재단 산하 Agentic AI Foundation(AAIF)으로 이관됐다.
    points:
      - "온머신·셸 레벨 실행 — Cursor/Copilot의 에디터 인라인 보완과 달리 시스템 명령까지 직접 수행, macOS·Linux·Windows 데스크톱 앱+CLI 제공"
      - "모델 비종속: Rust·Apache-2.0, 15개+ 제공자(Anthropic·OpenAI·Google·Ollama·Bedrock 등)와 MCP 지원"
      - "규모/도입(주장): 깃허브 49.4k★, 리눅스 재단 AAIF로 이관 — Block 사내 도입 사례도 공개"
