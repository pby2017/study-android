  answer: "결제자당 매출과 유지율은 분모가 다르므로 하나로 합치지 않는다. 월간·연간 구독 코호트별 첫 갱신과 12개월 유지율을 나누어 보고, 첫 유용한 결과까지 걸린 시간과 갱신 전 재방문 행동을 함께 확인한다. RevenueCat 표본은 관측 자료이므로 가격·페이월 변경의 효과는 자체 코호트나 실험으로 검증한다."
- category: ai
  title: 'Google ADK Kotlin + Android — 온디바이스 모델별 도구 지원 차이'
  level: "중급"
  summary: 'Google ADK Kotlin은 Android에서도 같은 `LlmAgent` API로 클라우드와 온디바이스 모델을 연결한다. 다만 지원 기능은 backend마다 다르다: LiteRT-LM은 기기 내 tool calling을 지원하고, ML Kit GenAI의 Gemini Nano adapter는 현재 beta이며 tool calling을 지원하지 않는다. Firebase AI Logic은 클라우드 모델 경로다. 앱에 클라우드 API key를 넣지 않는다.'
  points:
  - '모델 기능과 기기 조건을 먼저 비교하고, agent에 필요한 도구 호출이 backend에서 동작하는지 검증'
  - 'ML Kit GenAI + `GenaiPrompt`: Gemini Nano 생성 경로; beta이고 tool calling 미지원'
  - 'LiteRT-LM: 오픈 모델을 기기 내에서 실행하고 tool calling 연결; Firebase AI Logic: 클라우드 Gemini'
  source: https://github.com/google/adk-kotlin#on-device-and-cloud-agents-on-android
  interview: "민감한 Android 작업을 오프라인에서도 수행하는 ADK agent를 만들 때 어떤 model backend를 고르고, 무엇을 확인하나요?"
  answer: "함수 도구 호출이 필요하면 LiteRT-LM 같은 tool-capable backend를 우선 검증한다. ML Kit의 Gemini Nano `GenaiPrompt` adapter는 현재 beta이며 tool calling을 지원하지 않으므로 단순 생성 용도로 구분한다. 필요한 모델을 기기가 지원하는지와 메모리·지연을 실기기에서 확인하고, 클라우드 fallback을 쓰면 API key를 앱에 넣지 않고 Firebase AI Logic 또는 backend를 사용한다."
- category: ai
  title: OWASP MASVS-RESILIENCE + R8 — 모바일 앱 리버스 엔지니어링 방어의 2026년 표준 가이드
  summary: 'OWASP MASVS v2.0의 MASVS-RESILIENCE 카테고리는 모바일 앱의 리버스 엔지니어링·변조 방어 표준이다. Layer 1: R8(ProGuard 후속)로 이름 난독화·데드 코드 제거(무료, 필수), Layer 2: RASP(루트·디버거· Frida 후킹 탐지), Layer 3: Google Play Integrity API·Apple App Attest로 서버사이드 검증. R8는 제어 흐름 난독화·문자열 암호화 미지원 → jadx로 디컴파일 시 구조 노출. 핵심 로직은 서버에.

    '
  points:
  - '3단계 방어: R8(난독화) → RASP(런타임) → Play Integrity(검증)'
  - 'R8 한계: 이름 변경만, 제어 흐름·문자열 암호화 없음'
  - 'OWASP MASVS v2.0: RESILIENCE-1~4, 모든 모바일 앱 보안 기준'
  source: https://mas.owasp.org/MASVS/11-MASVS-RESILIENCE/
- category: ai
  title: Android 온디바이스 RAG 벡터 검색 — ObjectBox HNSW vs SQLite-Vector
  summary: 'RAG에서 벡터 저장소는 임베딩 생성이나 답변 생성이 아니라, 질문 임베딩과 가까운 문서를 찾는 역할을 한다. ObjectBox는 Kotlin 객체와 벡터를 함께 저장하고 HNSW 근사 최근접 검색(ANN)을 제공한다. SQLite-Vector는 기존 SQLite의 일반 테이블 BLOB에 벡터를 저장하고 정확 검색 또는 양자화 스캔을 지원한다. 앱의 DB 구조와 검색 품질·메모리 요구에 맞춰 선택한다.'
  points:
  - 'ObjectBox: Kotlin 객체·메타데이터와 벡터를 한 DB에 두고 HNSW ANN 검색'
  - 'SQLite-Vector: Android용 확장 패키지로 SQLite 사용; BLOB 벡터·SQL 검색, 별도 인덱스 사전 구축 불필요'
  - '선택 기준: 기존 SQLite 재사용 vs 객체 모델 통합; 정확도·지연·메모리는 목표 기기와 실제 임베딩으로 측정'
  source: https://github.com/sqliteai/sqlite-vector
  interview: "Android 온디바이스 RAG에서 ObjectBox와 SQLite-Vector 중 무엇을 고르고, 무엇을 검증해야 하나요?"
  answer: "객체 데이터와 벡터를 함께 관리하고 대규모 후보를 빠르게 좁히려면 HNSW 기반 ObjectBox를 검토한다. 기존 SQLite를 유지하고 SQL/BLOB 기반 검색을 원하면 Android 확장 패키지를 제공하는 SQLite-Vector를 검토한다. 두 도구 모두 임베딩 모델이나 LLM을 대신하지 않는다. 실제 단말에서 검색 지연·메모리·회수율을 확인하고, 임베딩 차원과 거리 함수를 맞춘다."
