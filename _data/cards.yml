  answer: '아니다. 기본 `auto`는 로그에 저장된 비용을 우선 사용하고, 값이 없으면 토큰과 모델 가격으로 계산한다. 어느 쪽도 청구서가 아니며, Web Search 등 도구 API 호출은 빠질 수 있다. `blocks`는 Claude Code의 5시간 창 전용이다. Codex는 `ccusage codex daily`나 `session`을 사용한다.'
- category: ai
  level: "중급"
  title: AI Research Skills — 연구 작업에 맞는 에이전트 스킬만 골라 쓰기
  summary: 'Orchestra Research의 AI Research Skills는 모델 설계, 파인튜닝, 평가, RAG, 에이전트 등 AI 연구·엔지니어링 절차를 담은 98개 스킬 라이브러리다. `autoresearch` 스킬은 문헌 조사부터 실험·논문 작성까지의 흐름을 안내하고 관련 전문 스킬로 연결한다. 전부 설치하기보다 필요한 범주를 먼저 고르자. 전역 설치는 에이전트별 링크를 만들고, `--local`은 프로젝트에 파일을 복사해 `.orchestra-skills.json`으로 구성을 추적한다. 이 스킬은 작업 지침이지 연구 결과의 정확성을 보증하는 검증 도구는 아니다. GitHub는 2026-11-22 기준 약 14.7k★·1k forks다.'
  points:
  - '범위: 98개 스킬·23개 범주 — 모델·학습·추론·평가·RAG·안전 등'
  - '선택: `npx @orchestra-research/ai-research-skills`에서 전체·범주·개별 스킬 설치를 고른다'
  - '공유: `--local` 설치는 프로젝트별 파일과 잠금 파일을 커밋해 팀 구성을 재현할 수 있다'
  - '검증: 스킬 지침은 실험·출처·결과를 대신 검증하지 않으므로 출력과 근거를 따로 확인한다'
  source: https://github.com/Orchestra-Research/AI-research-SKILLs
  sources:
  - label: '공식 저장소 — 98개 스킬·23개 범주·MIT 라이선스·별 수'
    url: https://github.com/Orchestra-Research/AI-research-SKILLs
  - label: '공식 패키지 안내 — 에이전트 지원과 전역/프로젝트별 설치 방식'
    url: https://github.com/Orchestra-Research/AI-Research-SKILLs/blob/main/packages/ai-research-skills/README.md
  - label: '프로젝트 README — autoresearch 역할과 연구 흐름'
    url: https://github.com/Orchestra-Research/AI-research-SKILLs/blob/main/README.md
  interview: '팀의 여러 AI 프로젝트에 같은 연구 스킬을 적용하고 싶습니다. 전역 설치와 `--local` 설치 중 무엇을 고르고, 결과의 신뢰성은 어떻게 확인해야 하나요?'
  answer: '프로젝트마다 필요한 스킬이 다르거나 팀이 구성을 재현해야 하면 `--local`로 필요한 범주만 설치하고 `.orchestra-skills.json`과 스킬 파일을 버전 관리한다. 전역 설치는 여러 에이전트가 공유하는 링크 기반 구성에 적합하다. 어느 방식이든 스킬은 절차 안내이므로 실험, 인용, 결과를 별도로 검증한다.'
- category: ai
  level: "중급"
  title: goose oi-kit — Kotlin 바인딩은 전체 에이전트가 아니다
  summary: 'goose 팀의 oi-kit은 AI 에이전트를 앱에 구성하기 위한 재사용 컴포넌트다. Kotlin 바인딩으로 모델 제공자를 만들고 응답을 스트리밍하거나 대화를 압축할 수 있지만, Rust API의 전체 에이전트 상태 머신을 제공하지는 않는다. 따라서 Android 앱에 바로 완성형 에이전트가 들어간다고 가정하지 말고, 필요한 도구 실행·승인·상태 저장은 앱이 구현할 범위를 확인하자. oi-kit은 알파이며 Kotlin 언어 지원만으로 Android 런타임 호환성이 보장되지는 않는다. GitHub 저장소는 2026-11-22 기준 약 56.9k★·6.6k forks다.'
  points:
  - '가능: 모델 제공자 호출, 응답 스트리밍, 대화 압축 등 Kotlin 바인딩 API 사용'
  - '한계: 이 바인딩은 프로세스 안의 네이티브 라이브러리 접근이며 전체 에이전트 런타임은 노출하지 않는다'
  - 'Android 점검: 배포 artifact, ABI·네이티브 라이브러리, 최소 OS 버전, 앱 생명주기·키 보관을 실제 샘플로 검증한다'
  - '주의: oi-kit은 알파라 API가 바뀔 수 있다. Kotlin으로 호출 가능하다는 사실만으로 Android 지원을 확정하지 않는다'
  source: https://github.com/aaif-goose/goose
  sources:
  - label: 'goose 공식 oi-kit 참조 — Kotlin 바인딩 범위와 전체 런타임의 차이'
    url: https://goose-docs.ai/docs/oi-kit/reference/
  - label: 'Kotlin API reference — 제공자·스트리밍·대화 압축 API'
    url: https://goose-docs.ai/docs/oi-kit/sdk/api-reference/?language=kotlin
  - label: '공식 저장소 — AAIF 소속, Apache-2.0, GitHub 관심도'
    url: https://github.com/aaif-goose/goose
  interview: 'goose oi-kit의 Kotlin 바인딩을 Android 앱에 추가하면 Rust 에이전트 런타임 전체를 그대로 쓸 수 있나요?'
  answer: '아니다. 공식 Kotlin 바인딩은 모델 제공자, 스트리밍, 대화 압축 API를 제공하지만 전체 에이전트 상태 머신은 노출하지 않는다. Android 지원도 별도 보장으로 간주하지 말고 artifact와 ABI·최소 OS·네이티브 배포를 검증해야 한다. oi-kit 자체도 알파이므로 버전별 API를 확인한다.'
- category: ai
  level: "고급"
  title: Robin(구 Open SWE) — 코딩 에이전트의 GitHub 권한 경계 설계
  summary: 'LangChain의 오픈소스 코딩 에이전트 저장소는 현재 Robin이라는 소프트웨어 팩토리로 소개된다. 작업별 Linux sandbox에서 코드를 조사·수정·검증하고 PR로 전달하지만, sandbox가 시작 사용자의 GitHub 권한만 갖는다고 가정하면 안 된다. 기본 GitHub App 자격 증명은 설치된 저장소 범위일 수 있고, 승인 프롬프트도 모든 셸/API 변경을 막는 보안 경계는 아니다. App 설치 범위를 제한하고 신뢰 그룹이 다르면 배포를 나누자. 그대로 배포하려면 LangChain Managed Deep Agents가 필요하며, 저장소는 활발히 바뀌고 호환성이 보장되지 않는다고 안내한다. GitHub API는 2026-11-22 기준 11,247★·1,325 forks를 기록했다.'
  points:
  - '실행 흐름: 대시보드·GitHub·Slack 등에서 요청하고, 작업별 영속 sandbox에서 변경과 검증 후 PR을 만든다'
  - '권한 경계: GitHub App 토큰은 사용자 개인 권한보다 넓은 설치 저장소 권한을 가질 수 있다'
  - '승인 한계: 감지된 Git push 승인과 임의 셸/API 쓰기 권한은 다르다. 프롬프트 승인을 인증·인가로 대체하지 않는다'
  - '운영: 설치 저장소·sandbox 이미지·허용 사용자를 최소화한다. 기본 배포는 Managed Deep Agents를 요구한다'
  source: https://github.com/langchain-ai/open-swe
  sources:
