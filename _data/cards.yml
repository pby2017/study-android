  - category: ai
    title: "서브에이전트 모델 라우팅 — 탐색은 Haiku, 리뷰는 Sonnet으로 강제해 비용 천장을 거는 법"
    summary: >
      Claude Code 서브에이전트는 정의 파일 프런트매터의 model 필드로 각자 다른 모델을 쓸 수 있고,
      값은 sonnet·opus·haiku·fable·전체 모델 ID(예: claude-opus-4-8)·inherit이며 생략 시 기본은 inherit(메인 대화와 동일 모델)이다.
      공식 문서는 서브에이전트의 핵심 이점 중 하나로 "Haiku 같은 더 빠르고 저렴한 모델로 작업을 라우팅해 비용을 통제"하는 것을 명시한다.
      즉 매번 같은 종류의 일(탐색·린트·요약)은 값싼 모델 서브에이전트에 정의 파일로 박아두면, 개발자가 일일이 모델을 고르지 않아도 설정만으로 비용 천장이 걸린다.
      서브에이전트가 자체 격리 컨텍스트 창에서 돌아 메인 대화 히스토리를 안 보는 구조라 탐색 같은 토큰 폭증 작업을 메인에서 떼어내는 효과까지 겹친다.
    points:
      - "모델 결정 우선순위(공식 문서): 1) CLAUDE_CODE_SUBAGENT_MODEL 환경변수 → 2) 호출 시 per-invocation model 파라미터 → 3) 서브에이전트 정의의 model 프런트매터 순. 환경변수로 세션 전체 모델을 한 값으로 강제해 조직 비용 천장·컴플라이언스에 쓸 수 있다"
      - "정의 파일에 model을 커밋해 두면 '모두가 제일 비싼 모델로 기본 세팅하는' 사고를 의지가 아니라 설정으로 막는다 — 코드리뷰는 Sonnet, 빠른 작업은 Haiku 식으로 역할별 분리"
      - "컨텍스트 격리: 서브에이전트는 fresh·isolated 컨텍스트 창에서 시작해 부모 대화·이미 읽은 파일을 보지 않고 요약 결과만 돌려준다(예외: fork는 전체 대화를 상속). 탐색 같은 대량 토큰 작업을 메인 창 밖으로 빼는 게 비용 절감의 본질"
    source: "https://code.claude.com/docs/en/sub-agents"
  - category: ai
    title: "에이전트 스킬의 '점진적 로딩' — 메타 100토큰만 항상 보이고, 본문은 필요할 때만 끌어오기"
    summary: >
      Agent Skills는 SKILL.md 한 장(name·description YAML 프런트매터 + 마크다운 본문)에 스크립트·레퍼런스를 묶은 폴더로, 2025-10 Anthropic이 도입해 2025-12 오픈 표준으로 공개했고 지금은 Claude Code·Claude.ai·API·Codex·Cursor 등에서 동작한다.
      핵심은 점진적 공개(progressive disclosure)다 — 세션 시작 시 에이전트는 각 스킬의 name·description(스킬당 대략 100토큰)만 본다. 본문(보통 5천 토큰 미만)은 에이전트가 그 스킬이 지금 작업에 필요하다고 판단할 때만 로드된다.
      덕분에 스킬을 수십~수백 개 깔아둬도 컨텍스트 창은 거의 비어 있고, 정작 쓸 때만 토큰을 먹는다 — MCP 도구 정의가 항상 컨텍스트를 차지하는 것과 대비된다.
      이 메커니즘 때문에 description 한 줄을 어떻게 쓰느냐가 스킬이 제때 발동하느냐를 가른다.
    points:
      - "토큰 회계: 항상 보이는 건 스킬당 약 100토큰(name+description)뿐, 본문(<5k토큰)은 '관련 있다'고 판단될 때만 로드 → 스킬 수백 개도 컨텍스트 부담이 거의 없다"
      - "발동 트리거는 본문이 아니라 description이 쥔다. 에이전트는 메타데이터만 보고 로드 여부를 정하므로, 언제 써야 하는지를 description에 구체적으로 써야 제때 켜진다"
      - "보안 주의: 스킬은 에이전트 환경에서 임의 코드를 실행할 수 있다 — '믿을 수 있는 출처'에서만 설치하라. 큐레이션 목록 travisvn/awesome-claude-skills(약 13.5k★) 등이 모음집 역할"
    source: "https://github.com/travisvn/awesome-claude-skills"
  - category: ai
    title: "Frequent Intentional Compaction — 컨텍스트를 40~60%로 유지하며 리뷰는 코드 아닌 '리서치·플랜'에 거는 워크플로"
    summary: >
      humanlayer가 공개한 ace-fca 문서(약 1.7k★)는 코딩 에이전트 생산성의 핵심을 "컨텍스트 관리를 개발 워크플로 전체로 끌어올리는 것"으로 본다.
      핵심 원칙은 컨텍스트 사용률을 40~60% 구간으로 유지하는 것 — Geoff Huntley의 "약 170k 컨텍스트 창에서, 많이 쓸수록 결과가 나빠진다"는 제약을 전제로 한다.
      작업은 리서치 → 플랜 → 구현 3단계로 쪼개고, 구현 단계는 검증된 페이즈마다 진행 상황을 원래 플랜 파일(progress.md)로 다시 compaction해 컨텍스트를 비운다.
      가장 큰 통찰은 인간 리뷰의 레버리지다 — 나쁜 코드 한 줄은 그냥 한 줄이지만, 나쁜 플랜 한 줄은 코드 수백 줄을, 나쁜 리서치 한 줄은 수천 줄을 낳는다. 그래서 코드보다 리서치·플랜을 리뷰하는 게 이득이다.
    points:
      - "구체 사례(문서 주장): 30만 LOC Rust 프로젝트(BAML)에서 Rust 초보가 취소+WASM 기능 약 3.5만 LOC를 7시간(리서치·플랜 3h + 구현 4h)에 작업, 팀은 PR당 시니어 3~5일치로 추정. 단 '마법이 아니다'라며 7시간 깊은 몰입과 코드베이스 전문가 한 명이 필요함을 명시"
      - "compaction 트리거: 파일 검색·코드 흐름 파악·테스트/빌드 로그·대형 JSON 도구 출력처럼 토큰을 먹는 활동을 progress.md(목표·접근·완료 단계·현재 실패) 같은 구조화 산출물로 증류. 구현만 git worktree로 격리하고 리서치·플랜은 main에서 한다"
      - "서브에이전트는 '역할 흉내'가 아니라 '컨텍스트 제어' 수단 — Glob/Grep/Read 잡동사니를 fresh 컨텍스트에서 돌려 부모 에이전트 창을 깨끗이 유지하는 게 가장 흔한 용도. 팀 비용은 3인 기준 월 약 $12k(Opus), 전환에 약 8주 걸렸다고 밝힘"
    source: "https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/ace-fca.md"
  - category: ai
    title: "claude-code-security-review — PR마다 도는 Anthropic 공식 AI 보안 리뷰 액션(diff 인지·오탐 필터)"
    summary: >
      Anthropic이 공개한 claude-code-security-review(약 5.3k★, MIT, 주로 파이썬)는 PR이 올라올 때마다 변경 diff를 Claude로 의미 분석해 취약점을 찾고 해당 라인에 코멘트를 다는 GitHub Action이다.
      단순 패턴 매칭이 아니라 코드 맥락을 읽어 인젝션(SQL·command·XXE 등), 인증·인가 결함, 비밀정보·PII 노출, 암호화 오용, RCE·역직렬화, XSS, TOCTOU 같은 로직 결함까지 본다.
      핵심은 오탐 억제다 — 발견된 항목은 별도 검증 서브태스크가 실제 코드 동작에 비춰 다시 분석하고, 확신도 점수가 낮으면(8점 미만) 버린다. DoS·레이트리밋·입증 안 된 입력검증·대부분의 open-redirect는 기본 제외 카테고리다.
      같은 엔진을 Claude Code의 내장 `/security-review` 슬래시 명령으로 개발 중에도 돌릴 수 있고, security-review.md를 `.claude/commands/`에 복사해 분석 기준을 커스텀할 수 있다.
    points:
      - "도입은 워크플로 YAML 한 조각 — `anthropics/claude-code-security-review@main`에 `comment-pr: true`와 API 키를 넘기면 PR head를 체크아웃해 변경분만 검토하고 라인 코멘트를 남긴다"
      - "★보안 경고(공식): 이 액션은 '프롬프트 인젝션에 하드닝되지 않았다' — 신뢰할 수 있는 PR에만 쓰고, 외부 기여자 PR은 깃허브 'Require approval for all external contributors'로 메인테이너 승인 후에만 돌게 막으라고 권고한다"
      - "GitHub Action(PR 게이트)과 `/security-review` 슬래시 명령(개발 중 로컬)은 같은 분석을 두 지점에 배치한 것 — '짠 세션 말고 별도 패스가 검토한다'는 원칙을 보안에 적용한 사례다"
    source: "https://github.com/anthropics/claude-code-security-review"
  - category: ai
    title: "Serena(oraios) — 에이전트에게 IDE급 '심볼 단위' 코드 탐색·편집을 주는 MCP 툴킷(~24k★)"
    summary: >
      Serena는 독일 Oraios가 만든 오픈소스 MCP 툴킷으로, 스스로를 "에이전트를 위한 IDE"라 부른다(약 24k★, MIT).
      핵심은 에이전트가 파일을 통째로 읽는 대신, 언어 서버 프로토콜(LSP)을 백엔드로 써서 함수·클래스 같은 '심볼' 단위로 코드를 찾고·읽고·고치게 한다는 점이다. 줄번호나 단순 grep 같은 저수준 방식 대신 코드의 구조와 참조 관계를 따라가므로, 큰 코드베이스에서 더 빠르고 토큰 효율적으로 동작한다.
      Claude Code·Codex·Gemini CLI·Cursor·Cline·Roo Code 등 MCP를 받는 거의 모든 클라이언트에 붙고, Cursor·Windsurf 같은 유료 어시스턴트의 무료 대안을 표방한다. 기본 LSP 백엔드는 Python·TypeScript·Java·Go·Rust 등 40여 개 언어를 지원한다.
    points:
      - "동작 원리: '파일을 다 읽지 말고 심볼만 집어라' — find_symbol / find_referencing_symbols 같은 도구로 정의·호출처를 LSP로 질의해 필요한 조각만 컨텍스트에 올린다. 이게 큰 레포에서 토큰을 아끼는 핵심"
      - "백엔드 2종: 기본은 무료 오픈소스 LSP, 별도로 JetBrains 분석엔진을 쓰는 유료 플러그인이 move·inline 같은 더 깊은 리팩터링을 제공"
      - "★설치 주의(공식): MCP/플러그인 마켓플레이스의 설치 명령은 '오래되고 부적절'하니 쓰지 말고, PyPI에서 `uv tool install -p 3.13 serena-agent` 후 `serena init`으로 깔라고 메인테이너가 명시한다"
    source: "https://github.com/oraios/serena"
  - category: ai
    title: "claude-code-templates(aitmpl) — 에이전트·커맨드·MCP를 골라 깔고, 사용량을 대시보드로 보는 CLI(~28k★)"
    summary: >
      claude-code-templates는 Daniel Avila가 만든 오픈소스 CLI(약 28.1k★, MIT)로, Claude Code용 '바로 쓰는 설정 마켓플레이스'를 표방한다.
      `npx claude-code-templates@latest` 한 줄이면 100개 넘는 컴포넌트(전문 서브에이전트·슬래시 커맨드·설정·MCP 구성 등)를 골라 현재 프로젝트에 설치해 준다 — 직접 .claude 디렉터리를 손으로 채울 필요 없이 검증된 구성을 받아 시작하는 식이다.
      단순 설치기를 넘어 운영 도구도 들어 있다. `--analytics` 플래그는 로컬 세션 로그를 읽어 실시간 사용량·대화 모니터링 대시보드를 띄우고, `--health-check`는 설치·설정 상태를 점검해 무엇이 빠졌는지 알려준다. aitmpl.com에서 웹으로 컴포넌트를 둘러볼 수도 있다.
    points:
      - "설치: `npx claude-code-templates@latest` — 100+ 컴포넌트(서브에이전트·커맨드·설정·MCP)를 대화형으로 골라 프로젝트에 주입. 별도 글로벌 설치 불필요"
      - "운영 플래그 2종: `--analytics`=로컬 로그 기반 실시간 사용량·대화 모니터링 대시보드 / `--health-check`=설치·설정 상태 진단"
      - "MIT 라이선스·약 28.1k★(레포 기준 주장값) · 웹 카탈로그 aitmpl.com에서 컴포넌트를 미리 탐색 가능"
    source: "https://github.com/davila7/claude-code-templates"
  - category: ai
    title: "Agent Client Protocol(ACP) — '에디터'와 '코딩 에이전트'를 분리하는 개방형 표준(Zed·JetBrains)"
    summary: >
      ACP(Agent Client Protocol)는 Zed가 만들고 JetBrains와 함께 미는 개방형 표준으로, 코딩 에이전트와 그것을 띄우는 에디터(클라이언트) 사이를 표준 JSON-RPC 인터페이스로 갈라놓는다.
      목표는 'LSP가 언어 서버를 에디터에서 떼어낸 것'을 에이전트에도 하는 것 — 에이전트는 한 번만 ACP를 구현하면 ACP를 지원하는 모든 에디터에서 돌고, 에디터는 한 번만 구현하면 어떤 ACP 에이전트든 꽂아 쓴다.
      그래서 한 에디터 안에서 어려운 리팩터링은 Claude Code로, 테스트 스윕은 다른 에이전트로 갈아끼우는 식의 '에이전트 자유 교체'가 가능해진다. 특정 모델·도구에 묶이는 락인을 줄이는 게 핵심이다.
    points:
      - "무엇을 표준화하나: 에이전트↔에디터 간 통신을 JSON-RPC 기반 개방 프로토콜로 고정 → 에이전트는 1회 구현으로 모든 ACP 에디터에서 동작(LSP의 에이전트판)"
      - "주도: Zed가 설계, JetBrains와 협업으로 확장 중. Zed의 Agent Panel이 ACP로 외부 에이전트(예: Claude Code·Gemini CLI 등)를 네이티브로 띄움"
      - "실무 효과: 작업별로 최적 에이전트를 갈아끼우는 '중립 호스트' 전략 — VS Code 포크+단일 모델 결합형 락인의 반대 방향"
    source: "https://zed.dev/acp"
  - category: ai
    title: "Roo Code 종료 → Zoo Code로 부활 — '오픈소스 코딩 에이전트는 누가 망하면 어떻게 되나'의 실제 사례"
    summary: >
      Cline에서 갈라져 나온 VS Code 코딩 에이전트 Roo Code(24.2k★, Apache-2.0)가 2026-05-15 마지막 릴리스 v3.54.0을 끝으로 저장소를 읽기 전용으로 보관(archive)했다. 메인테이너들은 다른 프로젝트(Roomote)에 집중하려 개발을 접었고, 공식 README는 이제 사용자를 두 대안으로 안내한다 — 커뮤니티가 띄운 포크 Zoo Code, 그리고 Roo Code의 출발점이었던 Cline.
      Zoo Code는 기존 Roo 기여자들이 2026-04-23 새 저장소를 만들어 공식 인계받은 포크로, 같은 기능·같은 설정 구조·같은 Apache-2.0 라이선스를 유지한다. 버전 번호도 Roo Code 3.53.0에서 이어받아(첫 마켓플레이스 배포 v3.54.0, 2026-05-16) 사용자가 단절감 없이 넘어가게 했다.
      실무 교훈은 '도구 이름'이 아니라 '거버넌스'를 보라는 것 — BYOK·오픈 라이선스·설정 이식성이 있으면 메인테이너가 손을 떼도 커뮤니티 포크로 갈아탈 길이 남는다.
    points:
      - "타임라인(1차 출처 확인): Roo Code 저장소는 2026-05-15 v3.54.0을 마지막으로 archive(read-only)됨. 공식 README가 후속으로 Zoo Code·Cline을 명시"
      - "Zoo Code = 기존 Roo 기여자들의 공식 인계 포크(2026-04-23 개설). 같은 기능·설정·Apache-2.0, Roo의 5개 모드(Code/Architect/Ask/Debug/Custom) 그대로. 설정 export→import로 이주"
      - "교훈: 단일 모델·단일 벤더 락인을 피하려면 BYOK+오픈 라이선스+설정 이식성을 확인하라 — Roo의 계보(Cline→Roo→Zoo) 자체가 포크로 살아남는 길을 보여준다"
    source: "https://github.com/RooCodeInc/Roo-Code"
  - category: ai
    title: "Conductor — 한 화면에서 Claude Code·Codex·Cursor를 '병렬로' 돌리는 맥용 오케스트레이터"
    summary: >
      Conductor(conductor.build)는 여러 코딩 에이전트를 동시에 돌리기 위한 맥용 데스크톱 앱으로, Claude Code·Codex·Cursor를 한 인터페이스에서 병렬 실행한다.
      핵심은 작업 격리다 — "각 태스크가 자기만의 workspace·브랜치·파일·터미널·diff·리뷰 경로를 받는다"고 공식 문서가 밝힌다. 그래서 에이전트들이 서로의 파일을 덮어쓰지 않고 독립적으로 굴러가고, 사람은 작업이 끝난 순서대로 diff를 리뷰하고 PR로 만들어 머지하면 된다.
      이는 '에이전트는 싸지만 사람의 리뷰·통합 시간이 병목'이라는 2026년 병렬 에이전트 워크플로의 전제를 그대로 제품화한 것 — 단일 작업 디렉터리를 공유하는 데서 오는 동시 편집 충돌을 작업별 격리 workspace로 푼다.
    points:
      - "무엇을: Claude Code·Codex·Cursor를 한 맥 앱에서 병렬 실행(공식 표현 'run ... in parallel'). 모델·에이전트를 직접 가져와(BYO) 꽂는 호스트 레이어"
      - "격리 방식(1차 출처): '각 태스크가 자기 workspace·브랜치·파일·터미널·diff·리뷰 경로를 가진다' → 병렬 에이전트의 동시 편집 충돌을 작업별 격리로 차단"
      - "운영 흐름: 여러 에이전트를 띄워두고 → 끝난 작업의 diff를 리뷰 → PR 생성·머지. '사람의 리뷰·통합'을 병목으로 보고 그 단계를 줄이는 설계. 현재 맥 중심·v0.65.0대"
    source: "https://www.conductor.build/"
  - category: ai
    title: "GitHub Octoverse 2025 — 'AI가 기본값'이 된 해, 그리고 그 부작용(타입스크립트 1위·AI slop·Broken Access Control 172%↑)"
    summary: >
      GitHub의 연례 개발자 동향 리포트 Octoverse 2025가 공개됐다. 1년간 신규 개발자 3,600만 명 이상이 합류해(평균 1초에 1명 이상) 전체 1억 8,000만 명을 넘겼고, 저장소는 6억 3,000만 개를 돌파했다.
      핵심은 'AI가 더 이상 옵션이 아니라 기본값'이라는 것 — 신규 개발자의 약 80%가 가입 첫 주에 Copilot을 썼고, LLM SDK를 import하는 공개 저장소는 1년 새 178% 늘어 110만 개를 넘었다. 2026년 실무자에게 직접적인 신호는 두 가지다.
      ① 타입스크립트가 10여 년 만에 파이썬·자바스크립트를 제치고 사용량 1위 — LLM이 만든 코드의 컴파일 오류 상당수가 타입 체크 실패라서 엄격한 타입 시스템이 'AI 코드를 일찍 거르는 안전망'으로 가치가 커졌다는 분석이다.
      ② 부작용도 공식 집계됐다. CodeQL 경보 1위가 Injection에서 Broken Access Control로 바뀌어 15만+ 저장소에서 잡혔고(전년比 172%↑) — GitHub은 그 상당수를 'AI가 생성한 스캐폴드가 인증 체크를 건너뛴' 데서 비롯한다고 짚는다. 동시에 'AI slop'(저품질 자동생성 PR)이 메인테이너 시간을 갉아먹는 문제도 처음 리포트에 명시됐다.
    points:
      - "규모(공식): 신규 개발자 3,600만+(1초당 1명 이상)→누적 1.8억+, 저장소 6.3억+. 신규 개발자 ~80%가 첫 주에 Copilot 사용, LLM SDK import 공개 저장소 110만+(전년比 +178%)"
      - "타입스크립트 1위(10여 년 만의 언어 지각변동): GitHub은 'LLM이 만든 컴파일 오류의 다수가 타입 체크 실패'라는 2025 학술 결과를 근거로, 엄격 타입 시스템이 AI 코드 오류를 파이프라인 초반에 거르는 장치로 부상했다고 분석"
      - "부작용도 공식 집계: CodeQL 경보 1위가 Injection→Broken Access Control(15만+ 저장소, +172% YoY)로 바뀜 — '인증 체크를 건너뛴 AI 스캐폴드'가 원인 다수. 'AI slop' 저품질 PR이 메인테이너 부담으로 처음 명시"
    source: "https://github.blog/news-insights/octoverse/octoverse-a-new-developer-joins-github-every-second-as-ai-leads-typescript-to-1/"
  - category: ai
    title: "MCP Tool Search — MCP 서버 수십 개 붙여도 컨텍스트가 안 터지는 'on-demand 로딩'(Claude Code 기본값)"
    summary: >
      MCP 서버를 여러 개 붙이면 세션 시작 전에 도구 정의가 컨텍스트를 다 잡아먹는 'context pollution'이 오래 문제였다(한 개발자는 첫 프롬프트도 치기 전에 6.6만 토큰이 사라졌다고 기록). Claude Code의 MCP Tool Search는 세션 시작 시 도구 이름과 서버 instructions만 올리고, 실제 도구 정의는 Claude가 필요할 때 검색해서 불러온다. Anthropic은 2026-01-14에 이 기능을 공개했고, 공식 문서 기준 현재 기본값으로 켜져 있다. 실무 효과는 'MCP 서버를 더 붙여도 컨텍스트 영향이 거의 없다'는 것 — 그래서 서버 개수보다 서버 instructions를 잘 써두는 게 중요해진다.
    points:
      - "기본 동작(공식): 세션 시작 땐 도구 이름+서버 instructions만 로드, 정의는 ToolSearch로 필요할 때만 expand. Claude Code는 서버별 도구 수 상한을 두지 않고 '컨텍스트 예산'이 실질 한계"
      - "ENABLE_TOOL_SEARCH로 조절: unset/true=전부 지연, auto=정의가 컨텍스트 10% 안에 들면 미리 로드(auto:N으로 % 지정), false=전부 미리 로드. Vertex AI·비1차 ANTHROPIC_BASE_URL 프록시에선 기본 비활성"
      - "제약(공식): tool_reference 블록을 지원하는 모델만 가능 — Haiku는 미지원, Vertex는 Sonnet 4.5·Opus 4.5 이상. 서버 작성자는 instructions를 스킬처럼 '언제 이 도구를 찾아야 하는지' 설명하게 쓰는 게 핵심"
    source: "https://code.claude.com/docs/en/mcp"
  - category: ai
    title: "DeepSWE(Datacurve) — 채점기 오류를 줄이고 '오래 걸리는 일'로 다시 줄 세운 코딩 에이전트 벤치마크"
    summary: >
      포화된 SWE-bench류 리더보드는 프런티어 모델들이 좁은 구간에 몰려 '어느 에이전트가 우리 코드베이스에서 더 나은지'를 가리기 어렵다는 비판을 받아 왔다. 스타트업 Datacurve가 공개한 DeepSWE는 이를 두 축으로 다시 짠다 — ① 과제를 과거 이슈·PR에서 캐오지 않고 새로 작성해 학습데이터 오염을 줄이고, ② 채점기(verifier) 정확도를 올렸다.
      Datacurve의 자체 감사에 따르면 SWE-Bench Pro의 자동 채점기는 정답을 24% 오탈락(false negative), 오답을 8.5% 오인정(false positive)했는데 DeepSWE는 둘 다 0에 가깝게 낮췄다고 주장한다. 대표 사례로, 정답 PR이 비공개 헬퍼를 리팩터한 과제에서, 같은 로직을 인라인해 '유효하게' 푼 에이전트가 원저자 구현에만 있던 심볼 import에 막혀 오탈락한 경우를 든다.
      리더보드(공개 기준)에서는 GPT-5.5가 70%±4%로 선두, GPT-5.4 56%±5%, Claude Opus 4.7 54%±5%로 뒤를 잇는다. 단, 이는 Datacurve의 '주장'이며 독립 재현 전이고, 모든 모델을 단일 하네스(bash 편집)로 묶어 모델별 네이티브 도구(Codex CLI·Claude Code 등) 성능을 반영하지 못한다는 한계가 있다.
    points:
      - "구성(공식): 113개 과제·91개 저장소, TypeScript/Go/Python/JavaScript/Rust 5개 언어. 별 500개 이상 활동 저장소에서만 추림(C++·Java 미포함)"
      - "핵심 주장: SWE-Bench Pro 채점기는 정답 24% 오탈락·오답 8.5% 오인정 → DeepSWE는 둘 다 ≈0. '비공개 헬퍼 인라인' 같은 유효한 해법이 import 심볼 불일치로 떨어지던 문제를 노린다"
      - "리더보드(주장·미재현): GPT-5.5 70%±4%(중앙값 47k 출력토큰으로 가장 토큰효율적) > GPT-5.4 56% > Claude Opus 4.7 54%. 단일 bash 하네스라 네이티브 도구 성능은 반영 안 됨 — 사설 eval·사람 리뷰와 병행이 권장"
    source: "https://deepswe.datacurve.ai/blog"
  - category: ai
    title: "Dynamic Workflows + ultracode — Bun을 'Claude 에이전트 수백 개'로 Zig→Rust 75만 줄 옮긴 실제 사례"
    summary: >
      Anthropic이 2026-05-28 공개한 Claude Code의 Dynamic Workflows는 한 작업을 결정적(deterministic) 스크립트로 쪼개 서브에이전트 수백~최대 1,000개를 병렬로 돌리는 기능이고, 이를 켜는 설정 이름이 'ultracode'다.
      대표 사례로 Bun 제작자 Jarred Sumner는 이걸로 Bun 런타임을 Zig→Rust로 옮겼다 — Rust 약 75만 줄, 기존 테스트 스위트 99.8% 통과, 첫 커밋부터 머지까지 11일. 그는 "코드를 직접 타이핑하지 않았다(수백 개 에이전트가 병렬로 썼고, 파일마다 리뷰어 2명이 검수)"고 했다.
      워크플로는 ① Zig 구조체 필드마다 맞는 Rust lifetime을 매핑 → ② 각 .zig를 동작 동일한 .rs로 포팅(파일당 리뷰어 2명) → ③ rustc 진단을 먹여 빌드·테스트가 깨끗해질 때까지 도는 수정 루프, 3단계로 진행됐다. 단, 이는 'Anthropic이 인수한 Bun 사내 사례'라는 점과, 외부 보도 기준 unsafe 블록 1.3만여 개·600k 줄 삭제 PR이 GitHub에 'AI slop'으로 자동 차단된 점은 함께 봐야 한다.
    points:
      - "기능(공식): Dynamic Workflows는 작업을 결정적 스크립트로 분해해 병렬 서브에이전트(상한 1,000개)를 오케스트레이션. 켜는 설정 이름이 ultracode (2026-05-28 공개)"
      - "사례(공식): Bun Zig→Rust 포팅 — Rust ~75만 줄, 기존 테스트 99.8% 통과, 첫 커밋→머지 11일. 제작자 본인은 '직접 타이핑 안 함', 파일당 리뷰어 2명"
      - "3단계: ①struct 필드별 Rust lifetime 매핑 → ②.zig→.rs 동작동일 포팅(병렬) → ③rustc stderr 진단 먹여 빌드·테스트 클린까지 도는 fix 루프. 주의: 사내 사례·unsafe 1.3만여 개(외부보도)는 별개로 검증 필요"
    source: "https://claude.com/blog/introducing-dynamic-workflows-in-claude-code"
  - category: ai
    title: "Aider 'repo map' — tree-sitter로 레포 전체를 토큰 1k짜리 '지도'로 압축해 LLM에 매번 먹이는 법(Apache-2.0·46k★)"
    summary: >
      Aider는 터미널에서 도는 오픈소스 AI 페어 프로그래밍 도구로, 로컬 git 파일을 직접 편집하고 자동 커밋한다(Apache-2.0, GitHub 46.3k★, OpenAI·Claude·Gemini 등 다양한 모델 지원). 그 핵심 아이디어가 '컨텍스트 엔지니어링'으로 바로 차용할 만한 repo map이다.
      repo map은 매 요청마다 LLM에게 '레포 전체의 지도'를 함께 보낸다 — 파일별 주요 클래스·함수와 그 시그니처(핵심 정의 라인)만 추려, 모델이 전체 구조와 의존 관계를 파악하고 '어느 파일을 더 봐야 하는지' 스스로 고르게 한다. 정의 추출은 tree-sitter로 소스를 AST로 파싱해 심볼 정의를 뽑아낸다.
      큰 레포에선 전부 보낼 수 없으므로, 파일을 노드로·의존성을 엣지로 둔 그래프에 graph ranking 알고리즘을 돌려 가장 관련 깊은 부분만 골라 넣는다. 분량은 `--map-tokens`로 제어하며 기본 1k 토큰, 채팅에 추가된 파일이 없을 때 등 상황에 따라 동적으로 늘린다.
    points:
      - "정체(공식): 터미널에서 로컬 git 파일을 직접 고치고 자동 커밋하는 AI 페어 프로그래밍 CLI. Apache-2.0, 46.3k★"
      - "repo map: 매 요청에 '파일별 핵심 심볼 시그니처'를 함께 전달 → 모델이 전체 구조를 보고 봐야 할 파일을 스스로 고름. 심볼 추출은 tree-sitter AST 파싱"
      - "스케일링: 파일=노드·의존성=엣지 그래프에 graph ranking을 돌려 관련 높은 부분만 선별. 크기는 --map-tokens(기본 1k 토큰)로 제어, 상황에 따라 동적 확장"
    source: "https://aider.chat/docs/repomap.html"
  - category: ai
    title: "Context7(Upstash) — '낡은·환각 API'를 막으려 버전별 최신 문서를 매 요청에 끼워 넣는 MCP 서버(MIT)"
    summary: >
      Context7은 Upstash가 만든 오픈소스 MCP 서버로, LLM이 학습 시점에 멈춘 옛 문서나 '존재하지 않는 API'를 지어내는 문제를 노린다(라이선스 MIT). 라이브러리의 버전별 최신 문서와 코드 예제를 에이전트 컨텍스트에 직접 끌어와, 탭 전환·환각 없이 그 버전에 맞는 코드를 짜게 한다.
      쓰는 법은 두 도구로 끝난다 — 먼저 'react' 같은 일반 이름을 Context7 라이브러리 ID로 해석하고(resolve-library-id), 그 ID로 토픽을 지정해 문서를 조회한다. Claude Code·Cursor·OpenCode·Windsurf 등과 호환되고, `npx ctx7 setup` 한 줄로 깔거나 MCP URL `https://mcp.context7.com/mcp`를 직접 붙일 수 있으며, MCP 대신 CLI(`ctx7 docs`) 모드도 있다.
      주목도(주장·secondary 출처): 2026년 들어 GitHub 5.4만~5.6만★대로 'MCP 서버 중 1위' 노출이 잦고 ThoughtWorks Tech Radar에도 올랐다. 단, 코어 MCP 서버만 오픈소스이고 크롤링·파싱·API 백엔드는 비공개라는 점은 감안해야 한다.
    points:
      - "정체(공식): 버전별 최신 라이브러리 문서·예제를 컨텍스트에 주입해 '낡은/환각 API'를 막는 MCP 서버. MIT, Claude Code·Cursor·OpenCode·Windsurf 호환"
      - "쓰는 법: ①이름→라이브러리 ID 해석(resolve-library-id) ②그 ID로 토픽 지정해 문서 조회, 두 도구뿐. 설치는 `npx ctx7 setup` 또는 MCP URL https://mcp.context7.com/mcp, CLI 모드도 제공"
      - "주목도(주장·미검증): 2026년 GitHub 5.4만~5.6만★대로 'MCP 1위' 노출 잦고 ThoughtWorks Tech Radar 등재. 단 코어만 OSS고 크롤·파싱·백엔드는 비공개"
    source: "https://github.com/upstash/context7"
  - category: ai
    title: "공식 /code-review 플러그인 — '리뷰 4개 병렬 → 한 건씩 재검증'으로 오탐을 떨궈내는 구조"
    summary: >
      anthropics/claude-code 레포에 들어있는 공식 code-review 플러그인은 'AI 코드리뷰가 nitpick·오탐을 쏟아낸다'는 문제를 구조로 푼다. 핵심은 작업과 검증을 단계로 분리한 파이프라인이다 — 먼저 haiku가 'PR이 닫힘·드래프트·이미 리뷰됨'인지 스킵 판단을 하고(불필요하면 종료), 변경 파일과 같은 경로의 CLAUDE.md만 찾아낸 뒤, sonnet이 변경 요약을 만든다.
      그다음이 본체다 — 리뷰 에이전트 4개를 병렬로 띄운다. 2개는 sonnet으로 CLAUDE.md 준수 여부를, 2개는 Opus로 버그를 본다. 이때 버그 에이전트는 'diff 바깥 컨텍스트를 읽지 말고 변경된 코드 안에서만, 컴파일 불가·무조건 틀린 결과 같은 HIGH SIGNAL만 보고하라(확신 없으면 보고 금지)'는 제약을 받는다. 스타일·취향 지적과 기존 코드 문제는 명시적으로 제외된다.
      마지막으로 발견된 이슈마다 별도 검증 서브에이전트를 다시 병렬로 돌려(버그는 Opus, CLAUDE.md는 sonnet) 확신 가능한 것만 통과시키고 나머지는 버린다. 결과는 터미널 출력이 기본이고, `--comment`를 줘야 PR에 인라인 코멘트를 단다(이슈당 코멘트 1개, 작은 수정은 적용 가능한 suggestion 블록으로).
    points:
      - "파이프라인(공식): ①haiku 스킵판단 ②haiku로 관련 CLAUDE.md 경로만 수집 ③sonnet 변경요약 ④리뷰 4병렬 ⑤이슈별 재검증 ⑥미검증분 폐기 ⑦터미널 출력(--comment시 인라인)"
      - "4 병렬 리뷰: CLAUDE.md 준수 2개(sonnet) + 버그 2개(Opus). 버그 에이전트는 'diff 밖 안 읽기·변경 코드 안에서만·컴파일 불가/무조건 오답 같은 HIGH SIGNAL만, 확신 없으면 보고 금지'"
      - "오탐 제거가 핵심: 발견 이슈마다 검증 서브에이전트를 다시 병렬로 띄워(버그 Opus·룰 sonnet) 통과 못 한 건 드롭. 스타일·nitpick·기존 코드 문제는 처음부터 제외"
    source: "https://github.com/anthropics/claude-code/blob/main/plugins/code-review/commands/code-review.md"
