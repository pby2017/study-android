  - category: ai
    title: "Context7 MCP — 에이전트가 '최신 버전' 라이브러리 문서를 그때그때 끌어오게 하는 서버"
    summary: >
      Context7은 Upstash가 만든 오픈소스 MCP 서버로, AI 코딩 에이전트가 라이브러리 API를 환각하거나 옛 버전으로 짜는 문제를 겨냥한다.
      에이전트가 코드를 쓸 때 해당 라이브러리의 최신·버전별 공식 문서와 예제를 실시간으로 가져와 컨텍스트 창에 직접 주입하므로, 탭 전환이나 복붙 없이 최신 사용법으로 코드가 나온다.
      도구는 두 단계로 동작한다: 라이브러리 이름을 식별자로 바꾸는 resolve-library-id, 그 식별자로 문서를 끌어오는 get-library-docs. 프롬프트에 "use context7"를 붙이는 식으로 쓴다.
      Cursor·Claude Code·Windsurf 등 주요 도구에 붙고, 깃허브 약 57k★(주장)에 10만 개 이상 라이브러리를 색인했으며 라이선스는 MIT다.
    points:
      - "최신 버전 공식 문서를 쿼리 시점에 컨텍스트로 주입 — 오래된/환각 API로 코드 짜는 문제 해소"
      - "2단계 도구: resolve-library-id(이름→식별자) → get-library-docs(문서 fetch), 프롬프트에 'use context7'"
      - "규모(주장): 깃허브 ~57k★·라이브러리 10만+ 색인 / Upstash 제작·MIT / Cursor·Claude Code·Windsurf 연동"
    source: "https://github.com/upstash/context7"

  - category: ai
    title: "Anthropic 내부 팀 활용법 — 코드 안 짜는 팀까지 Claude Code를 쓰는 실전 패턴"
    summary: >
      Anthropic이 자사 10개 팀(데이터 인프라·보안·제품 엔지니어링·디자인·추론·그로스 마케팅·법무 등)의 Claude Code 실사용 사례를 공개했다.
      핵심은 '코드 생성기'가 아니라 '사고 파트너'로 쓴다는 것 — 그리고 비개발 직군도 워크플로를 자동화한다.
      보안팀은 인시던트 때 스택트레이스+문서를 던져 제어 흐름을 추적해 10~15분 걸리던 이슈를 3배 빠르게 해결하고, 추론팀 비ML 인력은 모델 함수 설명을 받아 리서치 시간을 80% 줄였다.
      그로스 마케팅팀은 서브에이전트 2개로 광고 CSV 수백 건을 분류·재생성하는 에이전틱 워크플로를 짰고, 법무팀은 개발 리소스 없이 담당 변호사 라우팅 '폰 트리'를 프로토타이핑했다.
    points:
      - "범용 패턴: CLAUDE.md로 온보딩 컨텍스트 모으기 / 인시던트에 스택트레이스+문서 투입 / GitHub Actions로 PR 코멘트 코드리뷰 자동화 / write→test→iterate 자율 루프"
      - "검증된 수치(자사 주장): 보안 인시던트 3배 빠른 해결, 추론 리서치 시간 ~80% 단축(1시간→10~20분), 쿠버네티스 장애 진단 20분 절약"
      - "비개발 직군도 사용 — 디자인팀은 Figma 파일을 자율 루프에 넣어 코드·테스트 반복, 마케팅은 광고 변형 최대 100개 자동 생성"
    source: "https://claude.com/blog/how-anthropic-teams-use-claude-code"
  - category: ai
    title: "ACP — '아무 에디터에 아무 에이전트' 붙이는 MCP의 에디터판"
    summary: >
      MCP가 에이전트에 '도구'를 붙이는 표준이라면, Agent Client Protocol(ACP)은 에디터(IDE)와 코딩 에이전트 사이를 잇는 표준이다.
      지금까지는 에이전트마다 에디터마다 따로 통합을 짜야 했고(N×M 문제), 그래서 에이전트가 특정 에디터에서만 돌아갔다.
      ACP는 JSON-RPC 기반 공통 프로토콜로 이걸 풀어, 규격을 따르는 에이전트는 규격을 따르는 어떤 에디터에서도 그대로 동작한다.
      Zed Industries(agentclientprotocol 조직)가 만들었고 Apache-2.0, 프로토콜 버전 1, 깃허브 약 3.4k★다.
    points:
      - "MCP의 JSON 표현을 재사용하고, diff 표시 같은 코딩 UX용 커스텀 타입을 더한 보완재 — 경쟁이 아니라 짝"
      - "공식 SDK: Rust·TypeScript·Python·Java·Kotlin (레포는 99.5% Rust)"
      - "라이선스 Apache-2.0, CLA 없음 / 에이전트와 에디터를 분리해 N×M 통합 비용을 N+M으로 줄이는 게 핵심"
    source: "https://github.com/zed-industries/agent-client-protocol"
  - category: ai
    title: "Continue가 'AI 체크'로 피벗 — 채팅·자동완성 말고 PR마다 도는 AI 검사"
    summary: >
      한때 VS Code·JetBrains용 오픈소스 AI 코딩 어시스턴트 중 스타가 가장 많던 Continue(약 33k★, Apache-2.0)가 제품 방향을 크게 틀었다.
      이제 핵심은 IDE 안 채팅·자동완성이 아니라 '모든 PR에서 AI 검사를 돌리는' 것이다.
      각 검사는 레포 안 `.continue/checks/` 폴더의 마크다운 파일 하나로 정의되고, GitHub 상태 체크로 나타난다 — 통과하면 초록, 실패하면 빨강과 함께 수정 제안을 단다.
      검사 규칙을 코드와 같은 레포에 버전 관리한다는 점에서 "소스로 관리되는, CI에서 강제 가능한 AI 검사"라는 슬로건을 단다.
    points:
      - "검사 = 마크다운 1개(`.continue/checks/`)로 정의 → 깃에 커밋되어 코드와 함께 버전 관리·리뷰됨"
      - "GitHub 상태 체크로 표시: 통과=초록, 실패=빨강+수정 제안, CI에서 실행(Run Checks in CI) 가능"
      - "린트가 못 잡는 '팀 규칙'(네이밍·아키텍처·보안 관례 등)을 자연어로 적어 PR 게이트로 거는 용도 / 오픈소스 CLI 기반"
    source: "https://docs.continue.dev/"

  - category: ai
    title: "MCP 도구를 코드로 호출하기 — 토큰 150k→2k로 줄인 'Code execution with MCP'"
    summary: >
      Anthropic이 2025년 11월 공개한 패턴. 에이전트가 MCP 도구를 하나씩 직접 호출하는 대신, MCP 서버를 '파일시스템 위의 코드 API'로 노출하고 에이전트가 그 API를 호출하는 코드를 직접 작성하게 한다.
      도구가 수백~수천 개로 늘면 ① 모든 도구 정의를 미리 로딩하느라 컨텍스트가 터지고 ② 중간 결과가 매번 모델을 거치며 토큰을 잡아먹는데, 이 패턴이 둘 다 해결한다.
      도구마다 파일 하나(예: `servers/google-drive/getDocument.ts`)로 두고 에이전트가 필요한 파일만 탐색해 읽는 '점진적 공개(progressive disclosure)' 방식이다.
      회의록 처리 예시에서 토큰을 150,000 → 2,000으로 줄여 98.7% 절감을 주장한다(Anthropic 측 주장). 단, 에이전트가 생성한 코드를 돌리려면 샌드박스 실행 환경이 필요하다.
    points:
      - "MCP 서버를 코드 API로 노출 → 에이전트가 도구를 '호출'이 아니라 '코드로 조합'(루프·조건·에러처리 그대로)"
      - "필요한 도구 파일만 읽는 점진적 공개로 컨텍스트 절약 / 중간 결과를 코드 안에서 필터·집계 후 요약만 반환(1만 행 → 5행)"
      - "회의록 예시 150k→2k 토큰(98.7% 절감) 주장 / PII를 모델에 안 흘리고 토큰화 가능 / Cloudflare도 'Code Mode'로 동일 결론. 단 샌드박스 실행 환경 필요"
    source: "https://www.anthropic.com/engineering/code-execution-with-mcp"

  - category: ai
    title: "Spotify Honk — 슬랙으로 시키면 PR을 자동으로 올리는 사내 코딩 에이전트"
    summary: >
      Spotify가 Claude Agent SDK를 사내 Fleet Management 인프라에 붙여 만든 자동 코딩 에이전트 'Honk'다.
      엔지니어가 슬랙(또는 깃에 버전 관리되는 프롬프트 파일)으로 "이 마이그레이션 해줘"라고 자연어로 시키면,
      Honk가 샌드박스된 쿠버네티스 Job에서 Claude Code를 돌려 코드를 고치고 포매터·린트·빌드·테스트까지 통과시킨 뒤 PR을 연다.
      핵심 설계는 '에이전트 런타임'과 '검증 런타임'을 분리한 것 — 에이전트가 브랜치를 푸시하면 별도 검증 서비스가 CI를 돌리고, 통과한 것만 PR이 된다(에이전트가 테스트를 주석 처리해 통과시키는 부정을 막는 안전장치).
      대화형 코딩이 아니라 대규모 자동 백그라운드 변환에 초점을 둔 사례로, 도구가 인프라 위에 얹히는 '얇은 래퍼'라는 점이 특징이다.
    points:
      - "구조: 슬랙/깃 프롬프트 → 샌드박스 K8s Job에서 Claude Code 실행(도구는 verify·Git·Bash 허용목록) → 검증 통과분만 PR / 에이전트≠검증 런타임 분리"
      - "Spotify 자체 발표(2026-06 엔지니어링 블로그): 엔지니어 99%+가 주간 AI 코딩 도구 사용, 94%가 생산성 향상 보고, PR 빈도 76% 증가"
      - "Anthropic 고객 사례 주장: Honk가 월 650개+ PR을 프로덕션에 머지, 수작업 마이그레이션 대비 최대 90% 시간 절감 / 단 15년치 Fleet Management 인프라 위에 얹힌 점이 전제"
    source: "https://engineering.atspotify.com/2026/6/code-with-claude-coding-is-no-longer-the-constraint"

  - category: ai
    title: "Aider Polyglot 벤치마크 — Python 점수에 가려진 '편집 포맷' 실력을 6개 언어로 잰다"
    summary: >
      Aider의 Polyglot 리더보드는 모델이 '코드를 잘 짜느냐'가 아니라 '사람 개입 없이 지시를 따라 파일을 제대로 편집하느냐'를 잰다.
      Exercism에서 가장 어려운 225문제를 C++·Go·Java·JavaScript·Python·Rust 6개 언어로 풀린다.
      각 문제는 두 번까지 시도하는데, 1차에서 실패하면 유닛 테스트 결과를 보여주고 스스로 고치게 한다 — 헤드라인 점수(Percent correct)는 이 2차 시도 후 통과율이다.
      별도로 'Percent cases well formed' 지표가 있어, 모델이 diff/whole 같은 기대 포맷으로 문법에 맞는 편집을 내놓았는지를 정답률과 분리해서 본다(포맷은 맞췄지만 테스트는 틀릴 수 있으므로).
      대부분의 LLM이 Python에 편향 학습돼 Python 단일 벤치는 실제 실력을 과대평가하기 쉬운데, 6개 언어 구성이 이 착시를 드러낸다.
    points:
      - "측정 대상: '코드 생성'이 아니라 '지시 따라 파일을 자동 편집하는 능력' — 에이전트형 코딩에 직결"
      - "구성: Exercism 최난도 225문제 × 6개 언어 / 2회 시도(1차 실패 시 테스트 결과 보고 자가 수정)"
      - "두 지표 분리: Percent correct(정답률, 2차 통과 기준) vs Percent cases well formed(편집 포맷 유효성) — 포맷만 맞고 오답일 수 있음"
    source: "https://aider.chat/docs/leaderboards/"

  - category: ai
    title: "하네스 엔지니어링 — 에이전트가 같은 실수를 두 번 못 하게 환경을 고치는 일"
    summary: >
      Mitchell Hashimoto가 2026년 2월 5일 'My AI Adoption Journey' 글에서 이름 붙인 개념으로,
      에이전트가 실수할 때마다 프롬프트로 타이르는 대신 '그 실수를 다시는 못 하게 만드는 장치'를 환경에 심는 실천을 말한다.
      그는 새 용어를 만들 생각은 없고 기존 용어가 있으면 갈아타겠다고 단서를 달면서도, 이 작업을 prompt/context 엔지니어링과 구분되는 별개의 일로 본다.
      가장 신뢰도 높은 방법은 에이전트에게 '빠르고 품질 좋은 도구'를 쥐여줘서 잘못을 스스로(테스트·린터 등으로) 즉시 잡아내게 하는 것이다.
      그가 실력을 끌어올린 훈련법도 인상적이다 — 자기가 손으로 한 커밋을 전부, 에이전트가 자기 답을 안 본 상태에서 똑같이 재현하도록 시켜 본 것.
    points:
      - "핵심 원칙: 에이전트가 틀리면 프롬프트가 아니라 '환경'을 고쳐 같은 실수를 구조적으로 막는다(Hashimoto, 2026-02-05)"
      - "수단: 테스트·린터처럼 빠르고 품질 좋은 도구로 에이전트가 자기 오류를 자동으로 잡게 한다"
      - "훈련법: 손으로 한 커밋을 에이전트에게 (내 답 안 보여주고) 똑같이 재현시켜 보며 하네스를 다듬는다"
    source: "https://mitchellh.com/writing/my-ai-adoption-journey"

  - category: ai
    title: "Claude Code GitHub Action — PR에 @claude 부르면 알아서 고치고 리뷰까지"
    summary: >
      anthropics/claude-code-action는 Claude Code를 깃허브 액션 안에서 자율 에이전트로 돌리는 공식 액션이다.
      이슈나 PR 코멘트에서 `@claude`로 부르면(또는 이슈를 Claude에 배정하면) 코드를 읽고, 변경을 만들고, PR을 올리거나 코멘트로 답한다.
      별도 prompt 입력을 주면 멘션 없이도 PR마다 자동 코드리뷰·CI 수정·이슈 분류 같은 워크플로를 돌릴 수 있다.
      설치는 Claude Code에서 `/install-github-app`를 실행하면 깃허브 앱과 시크릿까지 안내해 깔아 준다.
      에이전트는 사내(자체) 러너에서 실행되고, Anthropic API·Bedrock·Vertex 등 여러 인증 방식을 지원하며 라이선스는 MIT다.
    points:
      - "트리거: PR·이슈에서 @claude 멘션 / 이슈를 Claude에 배정 / prompt 입력으로 자동 실행 — 코드 수정·PR 생성·리뷰 코멘트"
      - "설치: Claude Code에서 /install-github-app 한 줄 — 깃허브 앱과 시크릿 설정까지 안내(레퍼런스 anthropics/claude-code-action@v1)"
      - "자체 GitHub 러너에서 실행, MIT 라이선스(약 8k★). '월 50 PR 기준 API 비용 $5 미만'은 공식 문서의 주장"
    source: "https://github.com/anthropics/claude-code-action"

  - category: ai
    title: "멀티에이전트 3-티어 — 인세션·로컬 워크트리·클라우드를 일에 맞게 갈아끼우기"
    summary: >
      Addy Osmani가 정리한 2026년 멀티에이전트 코딩 도구 지형은 셋업·격리·동시성을 기준으로 3티어로 나뉜다.
      티어1은 추가 셋업 없이 한 세션 안에서 도는 Claude Code 서브에이전트·Agent Teams — 상호작용 작업의 출발점.
      티어2는 내 머신에서 에이전트마다 별도 git 워크트리를 띄워 충돌 없이 3~10개를 병렬로 굴리는 로컬 오케스트레이션(Conductor·Claude Squad·Vibe Kanban 등).
      티어3은 클라우드 VM에서 비동기로 돌려 PR로 받아 보는 도구(Claude Code Web·Copilot Coding Agent·Jules·Codex Web) — 백로그를 밤새 비울 때.
      핵심은 '하나만 고르기'가 아니라 일의 성격에 따라 세 티어를 갈아끼우는 것이며, 동시성은 3~5개가 스위트스폿이고 10개를 넘기면 비용만 늘기 쉽다.
    points:
      - "티어1(제로 셋업)=서브에이전트·Agent Teams / 티어2(로컬 워크트리, 3~10개)=Conductor·Claude Squad·Vibe Kanban / 티어3(클라우드 비동기)=Claude Code Web·Copilot·Jules·Codex Web"
      - "격리는 에이전트마다 별도 git 워크트리로 — 머지 충돌 없이 깔끔하게 통합(Conductor 류는 자동 처리)"
      - "동시성 스위트스폿 3~5개, 10개 초과는 이득 적고 비용↑ / 품질 게이트(테스트 훅·플랜 승인)와 AGENTS.md로 세션마다 학습 누적"
    source: "https://addyosmani.com/blog/code-agent-orchestra/"
  - category: ai
    title: "Conductor — 맥에서 코딩 에이전트 여러 개를 병렬로 굴리는 무료 앱"
    summary: >
      Conductor(Melty Labs)는 Claude Code·Codex·Cursor 에이전트를 한 화면에서 병렬로 돌리는 macOS 앱이다.
      각 작업(task)마다 독립된 워크스페이스가 생기는데 — 자체 브랜치·파일·터미널·diff·리뷰 경로를 따로 가져 서로 안 부딪힌다.
      에이전트가 동시에 여러 기능을 작업하고, 한눈에 진행 상황을 보고, 변경을 검토한 뒤 머지하는 흐름이다.
      앱은 무료이며(시드 펀딩으로 운영, 추후 협업 기능 유료화 계획), 별도 키 발급 없이 머신에 이미 저장된 인증 토큰을 그대로 쓴다.
    points:
      - "Claude Code·Codex·Cursor를 병렬로 — 작업마다 독립 워크스페이스(브랜치·파일·터미널·diff·리뷰)"
      - "무료 + BYO 인증: 머신에 저장된 토큰(API 키·Claude Pro·Max) 그대로 사용, 설정에서 API 키 모드도 가능(Cursor는 자체 키 필요)"
      - "터미널이 못 하던 것 — 여러 에이전트 동시 진행 상황을 보고 검토·머지까지 GUI로"
    source: "https://www.conductor.build/docs/faq"
  - category: ai
    title: "프롬프트 캐시 — tools→system→messages 순서가 비용을 가른다"
    summary: >
      Claude API의 프롬프트 캐시는 캐시 적중 시 입력 토큰을 base 가격의 10%만 받고, 쓰기 시엔 1.25배(5분 TTL)를 받는다.
      핵심은 캐시가 tools → system → messages 순서의 '계층(prefix)'으로 동작한다는 점 — 어느 한 단계를 바꾸면 그 단계와 뒤따르는 모든 단계의 캐시가 무효화된다.
      그래서 앞쪽(tools/system)을 건드리는 습관이 비용을 키운다: 도구 정의를 바꾸거나, tool_choice를 바꾸거나, 프롬프트 어디든 이미지를 넣고 빼면 캐시가 깨진다.
      적중하려면 캐시 컨트롤 지점까지의 세그먼트가 텍스트·이미지까지 100% 동일해야 하고, 기본 수명은 5분(사용할 때마다 무료로 갱신)이다.
    points:
      - "비용: 캐시 읽기 = base 입력의 0.1배(10%), 5분 쓰기 = 1.25배 / 적중하려면 컨트롤 지점까지 100% 동일해야"
      - "계층 무효화: tools → system → messages 순서 — 앞 단계를 바꾸면 그 뒤가 전부 캐시 미스"
      - "조용히 캐시 깨는 것들: 도구 정의 변경, tool_choice 변경, 프롬프트 내 이미지 추가/삭제"
    source: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"

  - category: ai
    title: "12-Factor Agents — 믿을 만한 에이전트는 '대부분 그냥 소프트웨어'다"
    summary: >
      HumanLayer의 Dex(Dexter Horthy)가 정리한, 프로덕션급 LLM 에이전트를 만드는 12가지 원칙(GitHub 23.3k★).
      핵심 주장은 "여기 프롬프트, 여기 도구 한 보따리, 목표 칠 때까지 루프"라는 순진한 에이전트 루프는 70~80% 품질에서 막히고,
      고객 대면 제품엔 그 80%로는 부족하다는 것 — 잘 도는 에이전트는 사실 '대부분 결정론적 소프트웨어'에 LLM 단계를 전략적으로 끼워 넣은 형태라고 본다.
      그래서 프레임워크에 맡기지 말고 프롬프트·컨텍스트 창·제어 흐름을 직접 소유하고, 실행 상태를 비즈니스 상태와 합쳐 launch/pause/resume 가능한 단순 API로 만들라고 말한다.
    points:
      - "원칙 일부: 프롬프트를 소유하라 / 컨텍스트 창을 소유하라 / 제어 흐름을 소유하라 / 도구는 그냥 '구조화된 출력'일 뿐"
      - "작고 집중된 에이전트로 쪼개고, 에러는 컨텍스트 창에 압축해 넣고, 사람 호출도 도구 콜로 처리하라"
      - "에이전트를 '무상태 리듀서(stateless reducer)'로 만들어 어디서든 트리거·재개 가능하게"
    source: "https://github.com/humanlayer/12-factor-agents"

  - category: ai
    title: "컨텍스트 엔지니어링 — 프롬프트 다듬기 다음 단계, '토큰 환경'을 설계하는 일"
    summary: >
      Anthropic이 정리한 개념. 프롬프트 엔지니어링이 '뭐라고 시킬지(instructions)'를 쓰는 일이라면,
      컨텍스트 엔지니어링은 추론 매 턴마다 '컨텍스트 창에 어떤 토큰을 넣을지 큐레이션·관리하는 일'이다 —
      목표는 "원하는 결과를 낼 확률을 최대화하는, 가능한 한 작은 고신호 토큰 집합".
      이게 중요한 이유는 컨텍스트가 길수록 모델이 정보를 정확히 회상하는 능력이 떨어지는 '컨텍스트 로트(context rot)' 때문 —
      트랜스포머는 토큰 n개에 대해 n² 쌍 관계를 만들어 매 토큰이 '주의 예산(attention budget)'을 깎는다.
    points:
      - "컨텍스트 로트: 토큰이 늘수록 회상 정확도 하락 — 창 크기와 무관하게 성능 벽에 부딪힘"
      - "컴팩션(compaction): 대화 내용을 요약해 새 컨텍스트 창으로 재시작 / 서브에이전트는 수만 토큰 탐색 후 1,000~2,000 토큰 요약만 반환"
      - "JIT 검색: 전부 미리 넣지 말고, 파일 경로·식별자만 들고 있다가 필요할 때 끌어오기"
    source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"
  - category: ai
    title: "awesome-claude-code-subagents — 154개 전문 서브에이전트를 플러그인으로 한 번에 까는 컬렉션"
    summary: >
      VoltAgent가 큐레이션하는 Claude Code 서브에이전트 모음으로, 154개 이상의 특화 에이전트를
      10개 카테고리(Core Development, Language Specialists, Infrastructure, Quality 등)로 분류해 둔다.
      api-designer·backend-developer·typescript-pro·swift-expert처럼 역할별로 시스템 프롬프트가
      미리 짜여 있어, 직접 에이전트를 정의하지 않고도 도메인 전문가를 골라 쓸 수 있다.
      Claude Code 플러그인 마켓플레이스로 카테고리 단위 설치가 되고, 수동으로 .claude/agents/에
      파일을 복사해도 된다. GitHub 21.8k★(주장, 2026-06 기준).
    points:
      - "설치: claude plugin marketplace add VoltAgent/awesome-claude-code-subagents 후 voltagent-lang 같은 카테고리 플러그인 install — 또는 에이전트 .md를 ~/.claude/agents/(전역)·.claude/agents/(프로젝트)에 복사"
      - "10개 카테고리·154+ 에이전트: 언어별(typescript-pro/swift-expert), 인프라, 품질, 메타-오케스트레이션 등 — 09-meta의 agent-installer로 'PHP 에이전트 찾아 설치해줘'식 자연어 설치도 지원"
      - "서브에이전트 = 별도 컨텍스트 창에서 도는 전문 일꾼. 직접 system prompt를 작성하는 대신 검증된 역할 정의를 가져다 쓰는 게 핵심 이점"
    source: "https://github.com/VoltAgent/awesome-claude-code-subagents"
  - category: ai
    title: "Repomix — 레포 전체를 LLM이 먹기 좋은 단일 파일로 패킹하기"
    summary: >
      Repomix는 코드베이스 전체를 'AI 친화적인 단일 파일' 하나로 묶어 Claude·ChatGPT·Gemini 같은
      LLM에 통째로 던질 수 있게 해 주는 CLI 도구다. 별도 설치 없이 npx repomix@latest 한 줄이면
      기본으로 repomix-output.xml을 생성하고, XML·Markdown·JSON·Plain Text 출력 포맷을 고를 수 있다.
      토큰 수를 세어 주고, 원격 깃 레포·.gitignore·시크릿 탐지·압축 옵션을 지원하며 MCP 서버(--mcp)로도
      붙는다. GitHub 26.3k★, MIT 라이선스.
    points:
      - "실행: npx repomix@latest (전역 설치는 npm install -g repomix) → 기본 출력은 repomix-output.xml. --style markdown/json/plain 으로 포맷 변경, repomix.config.json으로 무시 패턴·줄번호·주석 제거 설정"
      - "왜 단일 파일인가: 파일을 일일이 붙여넣지 않고 레포 구조+내용을 한 번에 컨텍스트로 넣을 수 있어, 코드 리뷰·전체 맥락 질문에 유리. 토큰 카운트를 같이 출력해 한도 관리에 도움"
      - "실무 기능: 원격 레포 직접 패킹, .gitignore 존중, 시크릿 탐지, MCP 서버(--mcp)로 에이전트에 도구로 노출, GitHub Actions·웹 인터페이스(repomix.com) 지원 (26.3k★·MIT, 주장 2026-06 기준)"
    source: "https://github.com/yamadashy/repomix"
  - category: ai
    title: "Cursor 공식 에이전트 활용법 — 한 프롬프트를 여러 모델에 동시에 던지고 제일 나은 답을 고르기"
    summary: >
      Cursor가 공식 블로그에 정리한 '에이전트로 코딩하는 베스트 프랙티스'다. 가장 임팩트 큰 변화로
      꼽는 건 '코드부터 짜지 말고 계획부터' — 숙련 개발자일수록 생성 전에 플랜을 먼저 만든다고 본다.
      Plan Mode(Shift+Tab)로 에이전트가 코드를 조사하고 질문한 뒤 승인 대기하는 계획을 세우게 하고,
      그 플랜은 .cursor/plans/에 저장해 둔다. 병렬 작업에서는 워크트리로 각 에이전트의 파일을 격리하고,
      같은 프롬프트를 여러 모델에 동시에 돌려 가장 좋은 결과를 고르게 하는 패턴을 권한다.
    points:
      - "계획 우선: Plan Mode(Shift+Tab)로 조사→질문→승인 대기 계획을 만들고 .cursor/plans/에 저장. Cursor는 '계획을 먼저 세우는 것'을 가장 임팩트 큰 변화로 꼽음 — 막 코드부터 짜는 대신 큰 변경엔 아키텍처 다이어그램까지 붙이라고 권장"
      - "여러 모델 동시 실행: 같은 프롬프트를 여러 모델에 한 번에 돌리고 Cursor가 가장 나은 결과를 제안 — '경쟁시켜 최종 출력 품질을 높이는' 패턴. 병렬 에이전트는 네이티브 워크트리로 파일 충돌 없이 격리"
      - "그 외: 잘못 들어가면 @Branch로 컨텍스트 되돌리기, 백로그성 작업은 클라우드 에이전트(@Cursor)로 원격 샌드박스 실행, Debug Mode는 가설→로깅→런타임 데이터 수집으로 레이스컨디션·성능·회귀에 강함"
    source: "https://cursor.com/blog/agent-best-practices"
  - category: ai
    title: "대형 코드베이스에서 Claude Code — CLAUDE.md를 루트가 아니라 하위 디렉터리에 두라"
    summary: >
      Anthropic이 모노레포·레거시·마이크로서비스 같은 대형 코드베이스 운영 패턴을 공식 정리했다.
      Claude Code는 인덱스(RAG/임베딩) 없이 파일을 직접 traverse하고 grep하는 '에이전틱 검색'으로
      도므로, '어디를 봐야 할지' 알려 주는 시작 컨텍스트의 품질이 성능을 좌우한다. 가장 실용적인 조언은
      CLAUDE.md를 레포 루트에 몰아넣지 말고 하위 디렉터리에 두라는 것 — Claude가 현재 위치에서 디렉터리
      트리를 거슬러 올라가며 만나는 모든 CLAUDE.md를 누적해 읽기 때문에 루트 컨텍스트는 사라지지 않는다.
      또 모델이 바뀌면 옛 지침이 새 모델을 오히려 방해할 수 있어 주기적으로 설정을 재검토하라고 권한다.
    points:
      - "CLAUDE.md는 얇게·계층적으로: 루트엔 '포인터와 치명적 함정'만, 세부 규칙은 하위 디렉터리 CLAUDE.md에. 초기화도 루트가 아니라 하위 디렉터리에서 — 트리를 거슬러 올라가며 누적 로딩되므로 루트 컨텍스트는 유지됨"
      - "탐색을 좁혀라: 테스트·린트 명령은 디렉터리별로 스코프(타임아웃·컨텍스트 낭비 방지), 빌드 산출물·서드파티 코드는 검색에서 제외, 구조가 자명하지 않으면 폴더별 한 줄 설명을 적은 '코드베이스 맵' 마크다운을 추가해 에이전틱 검색의 출발점을 만든다"
      - "유지보수: 한 모델용으로 쓴 워크어라운드 지침이 다음 모델을 오히려 제약할 수 있으니 곧 obsolete로 보고 주기적으로 리뷰. 검색·읽기는 read-only 서브에이전트에, 편집은 메인 에이전트에 분리 (출처: Anthropic 블로그, 2026-05-14)"
    source: "https://claude.com/blog/how-claude-code-works-in-large-codebases-best-practices-and-where-to-start"
  - category: ai
    title: "SWE-EVO — '단일 이슈'를 넘어 코드베이스를 여러 번 진화시키는 장기 과제 벤치마크"
    summary: >
      SWE-bench Verified가 최상위 모델들로 포화(Opus 4.8 88%대)되자, 연구자들은 실무에 더 가까운
      '장기(long-horizon) 소프트웨어 진화'를 재는 SWE-EVO를 내놨다. 성숙한 오픈소스 파이썬 프로젝트 7개의
      릴리스 노트에서 뽑은 48개 과제로, 과제 하나가 평균 21개 파일에 걸친 다단계 변경을 요구하고
      인스턴스당 평균 874개 테스트로 검증된다. 결과는 냉정하다 — OpenHands+GPT-5.4 조합이 25%밖에 못 풀었고,
      같은 계열 GPT-5.2가 SWE-bench Verified에서 72.8%를 받던 것과 극명히 대비된다.
      "이슈 하나→패치 하나"가 아니라 "여러 파일을 조율해 코드베이스를 진화시키기"가 진짜 병목임을 보여 준다.
    points:
      - "구조 차이: SWE-bench는 깃 이슈 1개를 해결해 패치 1개를 내는 격리된 과제. SWE-EVO는 릴리스 노트 기반으로 다파일·다단계 진화를 요구 — 평균 21개 파일 수정, 인스턴스당 ~874개 테스트로 검증"
      - "점수 급락: 같은 기반 모델이라도 SWE-bench Verified 72.8%(GPT-5.2) → SWE-EVO 22.92%로 추락. 최고 성적도 GPT-5.4+OpenHands의 25% 수준 — 장기·복잡 과제에서 현 에이전트의 한계가 그대로 드러남"
      - "시사점: Verified 고득점을 '실무 준비 완료'로 읽으면 안 된다. 벤치마크 포화는 곧 '다음 난도'를 만들고, 실제 병목은 단발 버그픽스가 아니라 여러 반복에 걸친 코드베이스 진화 (출처: arXiv 2512.18470, 48 tasks/7 projects)"
    source: "https://arxiv.org/abs/2512.18470"

  - category: ai
    title: "SuperClaude — /sc: 명령·에이전트·모드를 주입해 Claude Code를 '개발 플랫폼'으로 바꾸는 프레임워크"
    summary: >
      SuperClaude는 Claude Code의 코드를 고치지 않고 행동 지침(behavioral instruction)을 주입해 구조화된 개발 워크플로를 얹는
      오픈소스 프레임워크다(현재 기준 GitHub 약 2.3만 ★, MIT, Anthropic 비공식). 핵심은 `/sc:` 접두사로 붙는 슬래시 명령 모음 —
      구현·분석·문서화 같은 작업을 명령 하나로 트리거하고, 그에 맞는 전문 에이전트와 '행동 모드'가 함께 활성화된다.
      구성은 30여 개 명령, 20여 개 전문 에이전트, 7개 행동 모드(브레인스토밍·태스크 관리 등), 그리고 Context7·Sequential 등 6~8종 MCP 서버 연동.
      설치는 파이썬 쪽 pipx/PyPI(`SuperClaude install`) 또는 npm으로 한다. 같은 '스킬 묶음' 계열인 Superpowers와 달리,
      명령·에이전트·모드를 하나의 네임스페이스(/sc:)로 패키징한 점이 차별점이다.
    points:
      - "동작 방식: Claude Code 본체 수정 없이 행동 지침을 주입 — `/sc:` 접두 명령으로 작업을 트리거하면 해당 전문 에이전트+행동 모드가 함께 켜짐"
      - "구성(저장소 명시): 명령 ~30개, 전문 에이전트 ~20개, 행동 모드 7개, MCP 서버 6~8종(Context7·Sequential 등) / MIT·Anthropic 비공식"
      - "설치: pipx 또는 PyPI(`SuperClaude install`), npm 경로도 제공 / Superpowers와 차이는 명령·에이전트·모드를 /sc: 네임스페이스로 일괄 패키징한 점 (별 수는 현재 기준·변동)"
    source: "https://github.com/SuperClaude-Org/SuperClaude_Framework"
  - category: ai
    title: "Claude Code 공식 플러그인 마켓플레이스 — 개발자가 실제로 가장 많이 까는 8개"
    summary: >
      Claude Code에는 `claude-plugins-official` 마켓플레이스가 내장돼 있고, `/plugin`으로 둘러보거나 claude.com/plugins 공개 디렉터리에서 설치 수를 확인할 수 있다.
      플러그인은 '배포 단위'이고 스킬·MCP 서버·서브에이전트·훅을 묶을 수 있는 그릇 — 설치하는 건 플러그인, 쓰는 건 그 안의 스킬이다.
      공개 디렉터리 기준 설치 수 상위는 Frontend Design(약 90만), Superpowers(약 82만), Code Review(약 37만), Context7(약 37만), Skill Creator(약 31만), Code Simplifier(약 30만), GitHub(약 28만), Playwright(약 27만) 순이다(수치는 변동·증가 중인 주장).
      Frontend Design는 프로덕션급 프런트엔드 제작, Superpowers는 브레인스토밍·디버깅·TDD·스킬 작성 워크플로를 얹는 묶음이다.
    points:
      - "내장 마켓플레이스 `claude-plugins-official` — `/plugin`으로 탐색·설치, 공개 디렉터리는 claude.com/plugins (설치 수 공개)"
      - "설치 수 상위(공개 디렉터리 기준·증가 중 주장): Frontend Design ~90만, Superpowers ~82만, Code Review ~37만, Context7 ~37만, Skill Creator ~31만, Code Simplifier ~30만, GitHub ~28만, Playwright ~27만"
      - "플러그인=배포 단위(스킬·MCP·서브에이전트·훅을 묶음), 스킬=실제 쓰는 내용 — 과적재(훅+MCP+스킬 중첩)는 체감 속도를 떨어뜨리니 주의"
    source: "https://claude.com/plugins"
  - category: ai
    title: "SWE-Perf — '버그 수정' 말고 '성능 최적화'를 재는 첫 저장소급 벤치마크"
    summary: >
      SWE-bench류 벤치마크는 대부분 'GitHub 이슈를 고쳐 테스트를 통과시키는가'(정확성)를 잰다. SWE-Perf는 결이 다르다 — 실제 코드를 더 빠르게 만드는 능력, 즉 성능 최적화를 잰다.
      인기 Python 저장소 9개에서 실제로 실행 속도를 개선한 PR들을 모아 만들었고, 10만 건이 넘는 PR(102,241건)을 필터링해 140개의 검증된 과제로 추렸다.
      과제는 '버그를 안 만들면서 테스트 실행 시간을 줄이는 패치'를 저장소 전체 맥락에서 생성하는 것이다. 결과적으로 현재 최고 AI 모델과 사람 전문가 사이에 성능 개선 격차가 남아 있어, 정확성 벤치마크가 포화돼도 '빠르게 만들기'는 아직 사람이 앞선다는 신호다.
    points:
      - "정확성(버그 고치기)이 아니라 성능(코드를 더 빠르게)을 재는 첫 저장소급 벤치마크 — 스니펫이 아닌 코드베이스 전체 맥락에서 동작"
      - "구성(프로젝트 페이지 주장): Python 저장소 9개, PR 102,241건을 필터링해 140개 인스턴스, 각 인스턴스는 실제 성능 개선 PR 기반"
      - "최고 AI 모델 vs 사람 전문가 사이 성능 개선 격차(약 8.59%p 주장)가 남음 — 정확성은 포화돼도 최적화는 여전히 난제"
    source: "https://swe-perf.github.io/"

  - category: ai
    title: "Dynamic Workflows(ultracode) — Claude가 직접 스크립트를 짜서 서브에이전트 수십~수백 개를 굴리는 법"
    summary: >
      Dynamic workflow는 Claude가 작업 설명을 받아 직접 짜는 JavaScript 오케스트레이션 스크립트다. 런타임이 이 스크립트를 백그라운드에서 돌리는 동안 본 세션은 계속 응답 가능하다.
      핵심은 '플랜을 코드로 옮긴다'는 점 — 서브에이전트/스킬/팀에서는 Claude가 매 턴 무엇을 띄울지 정하고 모든 중간 결과가 컨텍스트 창에 쌓이지만, 워크플로는 루프·분기·중간 결과를 스크립트 변수에 담아 Claude 컨텍스트에는 '최종 답'만 남긴다.
      한 코드베이스 전체 버그 스윕, 500파일 마이그레이션, 여러 각도로 교차검증하는 리서치처럼 한 대화로 조율하기엔 에이전트가 너무 많이 필요한 일에 쓴다. 켜는 법은 두 가지 — 프롬프트에 `ultracode` 키워드(또는 "워크플로 써줘"처럼 말로)를 넣어 그 작업만, 또는 `/effort ultracode`로 세션 내 모든 실질 작업에 자동 적용.
    points:
      - "요건(공식 문서): v2.1.154+ · 유료 플랜 전체·API·Bedrock·Vertex·Foundry. Max/Team/Enterprise는 기본 on, Pro는 /config에서 켠다"
      - "스크립트 자체는 파일·셸 직접 접근 불가(에이전트가 읽기·쓰기·실행). 동시 에이전트 최대 16개, 한 런당 총 1,000개 상한으로 폭주 방지"
      - "스폰된 서브에이전트는 세션 권한 모드와 무관하게 항상 acceptEdits로 돌아 파일 편집 자동 승인 — 단, allowlist 밖 셸·웹·MCP는 런 중에도 물어볼 수 있음"
      - "런마다 스크립트를 ~/.claude/projects/ 아래 파일로 저장 → /workflows에서 진행 보기·일시정지·재개, `s`로 /<이름> 커맨드로 저장해 재사용"
    source: "https://code.claude.com/docs/en/workflows"

  - category: ai
    title: "Kilo Code — Roo Code 종료 후 갈아탈 곳으로 꼽히는 오픈소스 에이전트(20k★)"
    summary: >
      Kilo Code는 자신을 'all-in-one agentic engineering platform'으로 소개하는 오픈소스(MIT) 코딩 에이전트로, GitHub 20.1k★를 받았다. VS Code·JetBrains 익스텐션과 별도 CLI로 동작하며, 별도 마크업 없이 모델 제공사가 청구하는 토큰 가격 그대로 받는 'zero-markup' 과금이 특징이다.
      Cline·Roo Code 계열에서 갈라져 나온 도구로, 2026년 5월 원조 Roo Code 레포가 아카이브(read-only)되면서 기존 사용자가 갈아탈 마이그레이션 대상으로 자주 꼽힌다.
      Architect(설계)·Coder(구현)·Debugger 같은 모드를 오가는 멀티모드, MCP 마켓플레이스, BYOK(여러 LLM 제공사 연결)를 지원한다. 단일 IDE 익스텐션을 넘어 '엔지니어링 플랫폼'을 표방한다.
    points:
      - "오픈소스 MIT · GitHub 20.1k★ — VS Code·JetBrains 익스텐션 + 독립 CLI"
      - "zero-markup: 모델 제공사 청구가 그대로 — Claude Code 같은 구독제와 다른 BYOK 종량제"
      - "Architect/Coder/Debugger 멀티모드 + MCP 마켓플레이스 — Roo Code 아카이브(2026-05) 후 대체재로 거론"
    source: "https://github.com/Kilo-Org/kilocode"

  - category: ai
    title: "OpenCode — 모델 제공사에 안 묶이는 터미널 오픈소스 에이전트(SST 팀)"
    summary: >
      OpenCode는 SST(Anomaly) 팀이 만든 터미널용 오픈소스 코딩 에이전트로, 라이선스는 MIT다. Claude Code와 쓰임새는 비슷하지만 결정적 차이는 '특정 제공사에 묶이지 않는다'는 점 — API 키만 꽂으면 Claude·OpenAI·Google은 물론 로컬 모델까지 어떤 LLM 제공사든 붙일 수 있다.
      Tab 키로 오가는 두 가지 내장 에이전트가 핵심이다. build는 전체 접근 권한을 가진 기본 개발 에이전트, plan은 코드를 읽고 분석만 하는 읽기 전용 에이전트라 '계획 먼저, 실행은 따로' 워크플로를 도구 차원에서 강제한다.
      문서상 LSP(언어 서버) 설정과 별도 서버/SDK 페이지가 있어, TUI는 여러 클라이언트 중 하나일 뿐인 클라이언트/서버 구조를 지향한다. 단일 벤더 종속이 부담스럽거나 로컬·사내 모델을 섞어 쓰려는 팀에게 현실적인 오픈소스 대안이다.
    points:
      - "오픈소스 MIT · SST(Anomaly) 팀 — 터미널 TUI 기반, Claude Code와 쓰임새 유사"
      - "provider-agnostic: API 키만 있으면 어떤 LLM 제공사든 연결(Anthropic 전용인 Claude Code와 대비)"
      - "Tab으로 전환하는 build(전체 접근)/plan(읽기 전용) 내장 에이전트 + LSP·서버/SDK 구조"
    source: "https://github.com/sst/opencode"

  - category: ai
    title: "/context — 200k 컨텍스트가 어디로 새는지 한눈에 보고 막는 진단 명령"
    summary: >
      에이전트 성능이 떨어지는 흔한 원인은 모델이 아니라 컨텍스트 창이 잡동사니로 꽉 찬 것이다. Claude Code의 `/context`는 시스템 프롬프트·기본 도구·MCP 도구·메모리(CLAUDE.md)·스킬·대화 기록·남은 공간이 각각 토큰을 얼마나 먹는지 분해해서 보여준다. 공식 비용 문서도 "무엇이 공간을 잡아먹는지 보려면 `/context`를 실행하라"고 안내한다.
      과거엔 MCP 서버가 컨텍스트의 절반을 먹는다는 사례가 많았는데, 지금은 MCP 도구 정의가 기본적으로 '지연 로딩'이라 실제로 쓰기 전까진 도구 이름만 들어간다. 그래도 안 쓰는 서버는 `/mcp`로 끄는 게 좋고, 공식 문서는 MCP보다 `gh`·`aws`·`gcloud` 같은 CLI를 쓰면 도구 목록이 컨텍스트에 안 쌓인다고 권한다.
      실무 처방은 단순하다. `/context`로 범인을 찾고 → 안 쓰는 MCP를 끄고 → CLAUDE.md는 핵심만 200줄 이내로 → 남은 공간이 줄면 `/compact`나 새 세션으로 정리. 토큰을 아끼는 게 아니라 모델이 집중할 '깨끗한 작업 공간'을 지키는 일이다.
    points:
      - "`/context`: 시스템·도구·MCP·메모리·대화별 토큰 점유율을 분해 — 공식 비용 문서가 진단 도구로 안내"
      - "MCP 도구 정의는 기본 지연 로딩(쓰기 전엔 이름만) — 그래도 안 쓰는 서버는 `/mcp`로 끄고, CLI(gh·aws)는 목록을 안 쌓아 더 가벼움"
      - "처방: 범인 찾기→불필요 MCP off→CLAUDE.md 200줄 이내→공간 줄면 /compact·새 세션"
    source: "https://code.claude.com/docs/en/costs"

  - category: ai
    title: "UI UX Pro Max — '디자인 안목'을 스킬로 주입해 매번 비슷한 AI 화면을 벗어나기"
    summary: >
      AI에 UI를 맡기면 어디서 본 듯한 보라색 그라데이션·똑같은 카드 레이아웃이 반복되는 게 흔한 불만이다. UI UX Pro Max는 이 '디자인 안목 부재'를 메우는 오픈소스(MIT) Claude Code 스킬로, 프로젝트 요구사항을 분석해 제품 유형에 맞는 디자인 시스템(스타일·색·타이포·간격·접근성)을 자동으로 골라준다.
      README 기준 67가지 UI 스타일(글래스모피즘·브루탈리즘·벤토 그리드 등), 161개 산업별 컬러 팔레트, 57개 폰트 페어링, 25종 차트, 15개 기술 스택(React·Next·Vue·SwiftUI·Flutter 등), 99개 UX 가이드라인, 161개 추론 규칙을 내장한다. 요청이 오면 제품 유형·스타일·팔레트·패턴·타이포를 병렬 검색하고, 업종에 안 맞는 '안티패턴'을 걸러낸 뒤 코드로 뽑는 식이다.
      설치는 Claude Code에서 `/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill` 후 `/plugin install`. 단, 떠도는 스타/설치 수치는 출처마다 8만~19만으로 들쭉날쭉하니 '인기 지표'는 걸러 보고, 핵심은 검증된 기능 범위로 판단하라.
    points:
      - "제품 유형→스타일·팔레트·폰트·패턴을 병렬 매칭하고 업종 부적합 안티패턴을 걸러 코드 생성 (MIT 오픈소스)"
      - "README 명시: 67 스타일·161 팔레트·57 폰트쌍·25 차트·15 스택·99 UX 규칙·161 추론 규칙"
      - "설치: `/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill` → `/plugin install` · 떠도는 별·설치수는 편차 커서 신뢰 말 것"
    source: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill"
  - category: ai
    title: "wshobson/agents — 에이전트·스킬·커맨드를 여러 도구에 한 번에 까는 멀티하네스 마켓플레이스"
    summary: >
      Claude Code뿐 아니라 Codex CLI·Cursor·OpenCode·GitHub Copilot·Gemini CLI까지 같은 에이전트 구성을 공유하려는 시도가 wshobson/agents다. 도메인 전문가 서브에이전트, 스킬, 슬래시 커맨드를 '플러그인' 단위로 묶어, 한 소스에서 여러 하네스로 배포한다. 특정 도구에 종속되지 않고 팀이 쓰는 에이전트 자산을 한곳에서 버전 관리하려는 사람에게 맞는다.
      README 기준 플러그인 84개, 에이전트 192개, 스킬 156개를 제공하며 라이선스는 MIT다. 작업 난이도에 따라 모델 티어를 갈아끼우는 라우팅도 포함한다.
    points:
      - "1개 소스 → Claude Code·Codex CLI·Cursor·OpenCode·GitHub Copilot·Gemini CLI 6개 하네스로 같은 구성 배포 (MIT)"
      - "README 명시: 플러그인 84개·에이전트 192개·스킬 156개 — 도메인 전문가 단위로 묶어 제공"
      - "작업 난이도별 모델 티어 라우팅 내장 — 도구 락인 없이 팀 에이전트 자산을 한곳에서 버전 관리"
    source: "https://github.com/wshobson/agents"

  - category: ai
    title: "공식 MCP 레지스트리 — 흩어진 MCP 서버를 한 API로 찾는 '소스 오브 트루스'"
    summary: >
      MCP 서버가 폭증하면서 '어디서 신뢰할 만한 서버를 찾나'가 문제가 됐다. 그 답이 2025-09-08 프리뷰로 공개된 공식 MCP 레지스트리다. registry.modelcontextprotocol.io에서 공개 MCP 서버의 메타데이터(엔드포인트·기능·버전)를 한곳에 모아 REST API로 검색하게 한다.
      기존 레지스트리(클라이언트별 마켓플레이스 등)를 대체하지 않고 그 위에 쌓이는 '업스트림 단일 출처' 역할이다. 클라이언트는 여기서 받아 자기만의 서브레지스트리로 가공하고, 사내용 비공개 서브레지스트리도 같은 스키마로 운영할 수 있다.
      MCP 오픈소스 커뮤니티 소유로 Anthropic·GitHub·PulseMCP·Microsoft·Block 등이 참여한다. 단, 아직 GA가 아닌 프리뷰라 데이터 리셋·호환성 깨짐 가능성이 명시돼 있어 프로덕션 의존은 주의해야 한다.
    points:
      - "검색: curl \"https://registry.modelcontextprotocol.io/v0/servers?limit=10\" — 서버 목록을 REST API로 조회"
      - "기존 레지스트리 대체 아님 — 업스트림 단일 출처, 공개·사내 서브레지스트리가 같은 스키마로 위에 쌓임"
