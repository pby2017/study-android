      남은 credit과 요청 사유를 함께 볼 수 있다. 에이전트 운영에서 중요한 점은 비용을 사후 청구서가 아니라
      adoption, 모델 선택, 자동화 범위 조정에 쓰는 관측 신호로 다루는 것이다.
    points:
