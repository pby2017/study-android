    url: https://github.com/oven-sh/bun
  - label: uv GitHub — 현재 저장소 인기 신호와 프로젝트 개요
    url: https://github.com/astral-sh/uv
  - label: Ruff GitHub — Python lint·format 도구 개요
    url: https://github.com/astral-sh/ruff
  interview: 'AI 코딩 에이전트를 도입할 때, 그 에이전트가 쓰는 도구 체인까지 검토해야 하는 이유는 무엇인가요?'
  answer: '에이전트는 코드를 실행하고 테스트·검증하는 도구에 의존한다. 따라서 모델만 평가하지 말고 프로젝트와 도구의 호환성, 재현 가능한 의존성·검증 절차, 라이선스와 유지보수를 함께 확인해야 한다.'
- category: ai
  level: 중급
  title: BMad Method — 작업 규모에 맞춰 AI 개발 계획의 깊이 조절
  summary: 'BMad Method는 모든 변경에 긴 기획 절차를 강제하지 않는다. 작은 변경은 `bmad-build`로 바로 구현하고, 범위가 크거나 불명확한 일은 아이디어 정리·명세·작업 분해를 거쳐 구현과 리뷰로 이어간다. 안정 버전 v6.12와 변경이 잦은 v7 미리보기(alpha)를 구분해 설치하고, 산출물은 의사결정을 다음 단계에 전달하는 데 쓴다. 에이전트 수보다 중요한 것은 문제에 필요한 만큼만 절차를 선택하는 것이다.'
  points:
  - '한 세션에 끝나는 작은 변경은 `bmad-build`; 여러 단계가 필요한 일은 명세와 작업 계획부터 정리한다.'
  - '결정한 내용은 브리프·명세·아키텍처 같은 산출물로 남겨 구현 단계에서 다시 설명하는 비용을 줄인다.'
  - '2026-11-22 기준 안정 v6.12 최신 릴리스 v6.12.4; v7은 preview alpha. v6 설치에는 Node.js 20.12+, Python 3.10+, uv가 필요하다.'
  source: https://github.com/bmad-code-org/BMAD-METHOD
  sources:
  - label: BMad 공식 문서 — 작업 크기별 시작 경로와 build 흐름
    url: https://docs.bmad-method.org/
  - label: BMad GitHub — 안정 v6.12와 v7 preview alpha 경계
    url: https://github.com/bmad-code-org/BMAD-METHOD
  - label: BMad 공식 릴리스 — v6.12.4 등 현재 릴리스 내역
    url: https://github.com/bmad-code-org/BMAD-METHOD/releases
  interview: 'BMad Method에서 작은 수정과 범위가 크거나 불명확한 변경은 왜 다른 시작 경로를 택하나요?'
  answer: '작은 수정에 긴 기획 절차를 적용하면 불필요한 비용이 생긴다. 반대로 큰 변경은 먼저 명세와 작업 계획을 정리해야 가정과 결정을 보존하고 구현·리뷰를 이어가기 쉽다. BMad은 필요한 깊이만 선택하도록 설계됐다.'
- category: ai
  level: 중급
  title: OpenSpec — AI 구현 전에 변경 명세를 합의하고 검증하기
  summary: 'OpenSpec은 AI 코딩 에이전트와 팀이 요구사항·설계·작업을 변경 단위로 기록하고, 구현 중에도 명세를 맞춰가는 도구다. `openspec init`으로 프로젝트를 설정하면 기본 skill 흐름은 `/openspec-explore`(문제 탐색) → `/openspec-propose`(proposal·spec·design·tasks 생성) → `/openspec-apply-change`(작업 구현) → `/openspec-archive-change`(완료 변경 보관)다. 제안 단계는 계획 산출물까지만 만들고 코드는 쓰지 않으므로, 사람은 구현 전에 범위와 수용 기준을 검토할 수 있다. 단, 이 과정은 팀의 작업 절차이지 구현이 명세와 일치함을 자동 보증하지 않는다. v2부터 옛 `/opsx:*` 명령 파일 대신 skill을 사용하며, 검증 skill은 선택 프로필에 포함된다. 2026-11-22 기준 공식 사이트는 v2.1.1과 약 75.3k GitHub stars를 표시한다(인기도 신호이지 품질 보증은 아님).'
  points:
  - '핵심은 코드 생성보다 변경별 기록: `proposal.md`, spec 변경, `design.md`, `tasks.md`를 리뷰 가능한 단위로 남긴다.'
  - '`/openspec-propose`는 계획 문서를 만들고 멈춘다. 검토 후 `/openspec-apply-change`를 실행해 구현을 시작한다.'
  - '기본 profile은 explore·propose·apply·update·sync·archive skill을 설치한다. `/openspec-verify-change`는 선택 skill이다.'
  - 'npm 설치는 Node.js 22.12+ 필요(현재 CLI 문서 기준); standalone 설치는 Node 없이 가능하다. `openspec init` 후 생성 파일을 확인한다.'
  source: https://github.com/Fission-AI/OpenSpec
  sources:
  - label: OpenSpec 공식 Skills 문서 — 기본·선택 workflow와 산출물
    url: https://openspec.dev/docs/skills
  - label: OpenSpec 공식 Setup — 초기화와 skill 설치 범위
    url: https://openspec.dev/docs/setup
  - label: OpenSpec 릴리스 — v2.1.1 및 v2 명령 체계 변경
    url: https://github.com/Fission-AI/OpenSpec/releases
  - label: OpenSpec 공식 사이트 — 현재 버전과 GitHub star 표시
    url: https://openspec.dev/
  interview: 'OpenSpec의 propose와 apply를 분리하는 이유는 무엇이며, 이 분리만으로 결과의 정확성이 보장되나요?'
  answer: 'propose에서 범위·요구사항·설계·작업을 먼저 검토해 구현 전 가정을 조정할 수 있다. 하지만 문서화가 정확성을 보증하지는 않으므로, 테스트와 구현 검토가 별도로 필요하다.'
- category: ai
  level: 중급
  title: Code Mode — MCP 도구를 코드로 묶어 토큰과 왕복을 줄이기
  summary: Code Mode는 에이전트가 도구를 하나씩 호출하는 대신, 여러 도구를 조합하는 짧은 프로그램을 작성해 실행하도록 하는 패턴이다. 예를 들어 Cloudflare MCP는 OpenAPI 전체를 모델에 넣지 않고 `search`로 API를 찾고 `execute` 코드로 요청을 조합한다. 결과적으로 모델은 반복 호출의 중간 자료 대신 필요한 결과를 받는다. Cloudflare 저장소가 공개한 비교표에서는 2,594개 endpoint를 개별 최소 스키마로 노출할 때 약 244k 토큰, Code Mode 도구 설명은 약 1.1k 토큰이라고 추정한다. 이는 해당 구현의 자체 측정치이며 모든 MCP 서버의 절감률을 뜻하지 않는다. 생성 코드는 Dynamic Worker에서 실행할 수 있지만, 샌드박스는 구성한 네트워크·binding 권한에 의존한다. 2026년 Check Point는 workerd의 취약점들을 공개했고 관리형 Workers는 수정됐다고 보고했으므로, 자체 호스팅은 런타임 업데이트와 권한 제한이 필요하다.
  points:
  - '전통적 tool call: 모델이 호출 → 결과 확인 → 다시 호출. Code Mode: 모델이 반복·분기·필터를 코드로 묶어 한 번 실행한다.'
  - 'Cloudflare MCP의 `search`는 명세에서 API를 찾고, `execute`는 찾은 API를 코드에서 호출한다. API 2,500여 개를 개별 tool schema로 모두 펼치지 않는다.'
  - '저장소 자체 비교는 약 1.1k 대 244k 토큰이다. 비교 조건이 해당 서버 기준이므로 다른 제품에 그대로 일반화하지 않는다.'
  - 'AI 생성 코드 실행은 권한 경계가 핵심이다. egress와 bindings를 제한하고, self-hosted workerd는 보안 업데이트를 유지한다.'
  source: https://github.com/cloudflare/mcp
  sources:
  - label: Cloudflare MCP README — 도구 구성과 토큰 비교 기준
    url: https://github.com/cloudflare/mcp/blob/main/README.md
  - label: Cloudflare Dynamic Workers Code Mode 예제 — 생성 코드 실행
    url: https://developers.cloudflare.com/dynamic-workers/examples/codemode/
  - label: Cloudflare Dynamic Workers — egress 제한과 credential proxy
    url: https://developers.cloudflare.com/dynamic-workers/usage/egress-control/
  - label: Check Point Research — workerd 취약점 공개 및 수정 상태
    url: https://research.checkpoint.com/2026/when-agentic-glue-melts/
  interview: 'Code Mode가 일반 MCP tool call과 다른 점은 무엇이며, 생성 코드를 실행할 때 무엇을 검토해야 하나요?'
  answer: '여러 도구 호출을 코드로 조합해 반복 왕복과 중간 결과를 줄인다. 그러나 생성 코드가 사용할 수 있는 네트워크·binding·자격 증명 범위를 제한하고 런타임 보안 업데이트를 유지해야 한다.'
- category: ai
  level: 고급
  title: Claude 에이전트 팀의 C 컴파일러 실험 — 병렬화보다 검증기와 작업 경계
  summary: 'Anthropic 연구원 Nicholas Carlini는 Claude Opus 4.6 에이전트 16개를 병렬 실행해 Rust 기반 C 컴파일러를 만들었다. 약 2주간 2천 회 가까운 세션과 약 2만 달러를 사용했고, 결과물은 여러 플랫폼에서 Linux 6.9를 빌드했지만 완전한 GCC 대체품은 아니었다. 이 실험에서 재사용할 교훈은 에이전트 수가 아니라 작업 환경이다. 거의 정확한 테스트·검증기가 없으면 에이전트는 목표와 다른 문제를 해결할 수 있다. 또 여러 작업이 같은 실패 지점을 수정하면 병렬화가 충돌을 늘린다. 저자는 GCC를 기준 오라클로 사용해 성공한 파일을 분리하고, 각 에이전트가 다른 실패 원인에 집중하게 했다.'
  points:
  - '검증기 품질은 에이전트의 목표를 정한다. 기존 기능 회귀까지 잡는 테스트와 짧고 검색 가능한 오류 출력을 설계한다.'
  - '작업이 독립적이지 않으면 에이전트 수를 늘려도 같은 파일·실패를 두고 충돌할 수 있다. known-good 오라클로 실패 범위를 좁혀 작업을 나눈다.'
  - '결과를 성능 보증으로 오해하지 않는다. 실험은 약 2만 달러를 썼고, 결과물도 GCC가 필요한 단계가 있으며 아직 드롭인 대체품이 아니었다.'
  source: https://www.anthropic.com/engineering/building-c-compiler
  sources:
  - label: Anthropic 원문 — 실험 구성, 테스트 설계, 병렬화와 한계
    url: https://www.anthropic.com/research/building-c-compiler
  - label: 실험 코드 저장소 — 에이전트 하네스와 컴파일러 구현
    url: https://github.com/anthropics/claudes-c-compiler
  interview: '왜 이 실험에서 에이전트 수를 늘리는 것보다 검증기와 작업 경계 설계가 중요했나요?'
  answer: '검증기가 목표를 잘 정의하지 못하면 에이전트가 잘못된 문제를 해결하고, 여러 에이전트가 같은 원인·파일을 수정하면 서로의 작업을 덮어쓴다. 테스트로 목표를 확인하고 오라클로 실패 범위를 나눠야 병렬화가 효과를 낸다.'
- category: ai
  level: 중급
  title: 서브에이전트 4가지 패턴 — 필요한 조정 수준만큼만 통제하기
  summary: 'Philipp Schmid가 2026-05-05 개인 블로그에 정리한 멀티에이전트 설계 패턴이다. 핵심 축은 에이전트 수가 아니라 메인 에이전트가 작업 흐름을 얼마나 조정해야 하는가다. 한 번 호출하고 결과만 받는 인라인형에서 시작해, 독립 작업을 병렬로 모으는 팬아웃, 여러 차례 메시지를 주고받는 지속형 풀, 에이전트끼리 직접 협업하는 팀으로 복잡도가 올라간다. 저자는 먼저 가장 단순한 패턴을 시도하고, 실제 조정 요구가 늘어날 때 다음 단계로 이동하라고 권한다. 상위 패턴은 상태 추적·메시지 전달·충돌 해결을 어렵게 만들며 더 강한 모델과 기반 도구가 필요할 수 있다.'
  points:
  - '인라인 호출: 한 에이전트에 독립적·자기완결 작업을 맡기고 결과를 받는다. 우선 적용할 기본형.'
  - '팬아웃: 서로 의존하지 않는 여러 작업을 병렬로 시작하고 결과를 모은다. 기다리는 동안 메인 작업도 진행할 수 있다.'
  - '지속형 풀: 같은 에이전트와 후속 메시지·상태 확인을 주고받는다. 팀: 에이전트 간 직접 조정까지 맡긴다. 둘 다 조정 실패와 상태 추적 부담이 커진다.'
  - '독립 병렬성·후속 조정·상호 메시징이 실제로 필요한지 확인한 뒤 패턴을 높인다. 큰 패턴이 항상 더 좋은 것은 아니다.'
  source: https://www.philschmid.de/subagent-patterns-2026
  sources:
  - label: Philipp Schmid 개인 블로그 — 네 패턴, 쓰임새와 한계
    url: https://www.philschmid.de/subagent-patterns-2026
  - label: Philipp Schmid 프로필 — Google DeepMind 합류 이력
    url: https://www.philschmid.de/philipp-schmid
  interview: '독립된 두 조사 작업과 여러 차례 상호 조정이 필요한 작업은 각각 어떤 서브에이전트 패턴으로 시작하는 것이 적절한가요?'
  answer: '독립된 작업은 fan-out으로 병렬 실행하고 결과를 모은다. 다단계 조정은 지속형 agent pool을 고려하며, 에이전트 간 직접 소통이 꼭 필요한 경우에만 team 패턴으로 올린다.'
- category: ai
  level: 중급
  title: 에이전트의 '80% 문제' — 변경한 심볼의 영향 범위를 끝까지 확인하기
  summary: 'Sourcegraph의 Matt Tanner는 코드 에이전트가 눈에 보이는 로컬 변경은 끝내도, 다른 호출처·DTO·권한 검사·통합 테스트처럼 현재 컨텍스트 밖의 제약을 놓치는 현상을 “80% 문제”라고 부른다. 여기서 80%는 측정된 성공률이 아니라 현상을 설명하는 비유다. 실전에서는 완료 보고나 통과한 로컬 테스트만으로 충분하다고 판단하지 말고, 수정한 심볼의 호출처와 구현체를 저장소 범위에서 검색하고 변경 영향에 맞는 테스트·리뷰로 빠진 연결을 확인한다. 대규모 코드베이스에서는 검색 도구가 도움이 될 수 있지만, Sourcegraph의 수치와 제품 권고는 자사 글·벤치마크 맥락으로 읽어야 한다.'
  points:
  - '“80%”는 실제 측정 비율이 아니다. 로컬 변경은 맞아도 시스템의 다른 사용처·제약을 놓칠 수 있다는 설명용 이름이다.'
  - '작업 전후에 수정한 심볼의 호출처와 구현체를 전역 검색해 영향 범위를 확인한다. 검색 결과가 기본 상한에서 일찍 끝나는 도구는 전수 검색 옵션도 확인한다.'
  - '완료 조건은 diff 리뷰와 관련 CI까지 포함한다. 검색은 회귀를 찾는 보조 수단이며, 검색 결과만으로 동작 정확성을 증명하지 않는다.'
  source: https://sourcegraph.com/blog/agentic-coding
  sources:
  - label: Sourcegraph — 80% 문제의 비유 설명과 코드베이스 완전성 점검
    url: https://sourcegraph.com/blog/agentic-coding
  - label: Sourcegraph 검색 문법 — 기본 결과 상한과 count:all
    url: https://sourcegraph.com/docs/code-search/queries/language
  interview: '에이전트가 변경을 구현하고 테스트가 통과했는데도 “80% 문제”가 남을 수 있는 이유는 무엇인가요?'
  answer: '현재 파일의 테스트는 통과해도 다른 호출처·권한 검사·DTO·통합 테스트처럼 컨텍스트 밖의 연결을 놓칠 수 있다. 변경 심볼의 사용처를 확인하고 관련 CI와 diff 리뷰로 완전성을 검증해야 한다.'
- category: ai
  level: 중급
  title: Chrome DevTools MCP와 Codex Developer mode — 브라우저 증거를 읽되 권한을 구분하기
  summary: 'Chrome DevTools MCP는 Chrome DevTools Protocol(CDP)을 MCP 도구로 제공해 코딩 에이전트가 실제 DOM·콘솔·네트워크·성능 기록을 확인하고 브라우저를 조작하게 한다. Codex 데스크톱의 Developer mode도 CDP를 쓸 수 있지만, 이는 MCP 서버와 별도의 Browser/Chrome 기능이다. 둘 다 스크린샷 추측 대신 실행 중인 페이지에서 근거를 얻을 수 있는 반면, 브라우저 내용과 민감한 세션 데이터에 접근할 수 있으므로 대상과 권한을 분리해야 한다. 2026-11-22 확인 기준 MCP 저장소는 58.7k stars, 최신 릴리스는 v1.13.0이다.'
  points:
  - 'MCP 서버는 `npx -y chrome-devtools-mcp@latest`로 연결하며 DOM·콘솔·네트워크 디버깅, 성능 trace, 자동화 도구를 제공한다.'
  - '동시 세션에서는 페이지별 `pageId` 라우팅이 기본이다. 각 프로세스에 임시 프로필이 필요하면 `--isolated`를 사용한다.'
  - 'MCP 클라이언트는 브라우저 내용을 읽고 바꿀 수 있다. 개인 정보가 있는 브라우저를 연결하지 말고, 필요하면 격리 프로필을 쓴다. 사용 통계 수집은 기본 활성화이며 `--no-usage-statistics`로 끌 수 있다.'
  - 'Codex Developer mode는 별도 기능이다. Settings > Browser에서 full CDP를 켜며, 민감한 내부에 접근하기 전에 명시 승인을 요청한다. 관리자는 `browser_use_full_cdp_access = false`로 막을 수 있다.'
  source: https://github.com/ChromeDevTools/chrome-devtools-mcp
  sources:
  - label: Chrome DevTools MCP 공식 README — 기능·개인정보·통계 수집
    url: https://github.com/ChromeDevTools/chrome-devtools-mcp
  - label: Chrome DevTools MCP 공식 고급 사용법 — pageId 라우팅·격리 프로필
    url: https://github.com/ChromeDevTools/chrome-devtools-mcp/blob/main/docs/advanced-usage.md
  - label: Chrome DevTools MCP 릴리스 — v1.13.0
    url: https://github.com/ChromeDevTools/chrome-devtools-mcp/releases
  - label: OpenAI/Codex Browser 문서 — Developer mode CDP 권한과 승인
    url: https://developers.openai.com/codex/app/browser
  interview: 'Chrome DevTools MCP와 Codex Developer mode를 같은 것으로 보면 안 되는 이유와, 둘을 쓸 때 가장 먼저 확인할 권한은 무엇인가요?'
  answer: 'MCP는 별도로 연결하는 서버이고 Developer mode는 Codex 데스크톱의 Browser/Chrome 기능이다. 둘 다 페이지 정보와 민감한 브라우저 내부에 닿을 수 있으므로 연결한 브라우저·프로필, CDP 승인 범위, 데이터 수집 설정을 확인해야 한다.'
- category: ai
  level: 중급
  title: Kilo Code — `kilo run --auto`도 권한 규칙은 따른다
  summary: 'Kilo Code는 VS Code·JetBrains·CLI에서 공유하는 오픈소스 코딩 에이전트다. 실무 교훈은 자동 실행과 무제한 실행을 구분하는 것. `kilo run --auto`는 입력을 기다리지 않지만, 도구 동작은 설정된 `allow`·`ask`·`deny` 권한 규칙으로 승인·거부된다. 기본 동작은 확인 요청이며, 자동화 전에 셸·파일 편집·외부 경로 권한을 최소 범위로 설정한다. Kilo는 2026년 7월 Anaconda에 인수됐지만 공식 발표 기준 기존 제품·요금·지원은 그대로 유지됐다.'
  points:
  - '`--auto`는 무인 입력 모드 — 권한 설정이 허용하지 않는 동작까지 열어주지는 않는다'
  - '`allow`는 실행, `ask`는 확인, `deny`는 차단; 자동화 전에는 특히 `bash`·`edit` 권한을 좁힌다'
  - '2026-11-22 확인: 28,081★·3,386 forks·MIT; v7.8.32(11월 20일) 릴리스'
  source: https://github.com/Kilo-Org/kilocode
  interview: '`kilo run --auto`를 CI에서 사용하면 왜 권한 설정을 별도로 점검해야 하나요?'
  answer: '`--auto`는 사용자 입력 없이 진행하게 하지만 권한 정책을 무시하지 않는다. 허용되지 않은 도구 호출은 거부되며, 반대로 넓은 `allow` 규칙은 자동 실행의 영향 범위를 키운다. 따라서 bash·edit·외부 경로 권한을 필요한 작업과 경로로 제한하고, 격리된 환경에서 검증해야 한다.'
- category: ai
  level: 고급
  title: Bumblebee — SBOM·EDR이 놓치는 개발자 머신의 로컬 노출 확인
  summary: '공급망 사고가 나면 “취약 패키지가 배포됐나?”(SBOM)와 “실행됐나?”(EDR)만으로는 개발자 노트북에 남은 상태를 모두 알기 어렵다. Perplexity의 Bumblebee는 macOS·Linux에서 락파일, 설치 메타데이터, 에디터/브라우저 확장, 지원되는 MCP 설정을 읽어 NDJSON 인벤토리를 만든다. 노출 카탈로그를 함께 주면 알려진 이름·버전과 정확히 일치하는 항목을 찾는다. 패키지 매니저를 실행하거나 소스 파일을 읽지는 않지만, Codex `config.toml` 같은 비 JSON 설정은 범위 밖이다. 따라서 일반 취약점 스캐너나 완전한 SBOM 대체재가 아니라, 이미 식별된 위협의 개발자 엔드포인트 노출 확인 도구다.'
  points:
  - '`baseline`·`project`는 반복 인벤토리, `deep`은 지정 경로의 사고 대응 스캔'
  - '패키지 매니저 실행·소스 코드 읽기 없음; 일부 비 JSON 설정과 잠금 파일 없는 Skills는 미수집'
  - '2026-11-22 확인: 5,167★·470 forks·Apache-2.0; v0.1.2(6월 18일)'
  source: https://github.com/perplexityai/bumblebee
  interview: 'Bumblebee 결과가 없으면 해당 개발자 머신에 취약한 도구가 없다고 결론 내려도 될까요?'
  answer: '아니다. Bumblebee는 선택한 프로필과 지원하는 디스크 메타데이터만 읽고, 제공한 노출 카탈로그와 정확히 일치하는 항목을 찾는다. Codex TOML 등 미지원 설정이나 수집되지 않은 설치 경로는 빠질 수 있으므로, 결과 없음은 “이 스캔 범위에서 일치 항목을 못 찾음”으로 해석하고 EDR·SBOM·다른 자산 자료와 함께 판단한다.'
- category: ai
  level: 고급
  title: Deep Agents — 모델을 고정하고 trace로 하네스를 개선하기
  summary: 'LangChain은 코딩 에이전트 deepagents-cli에서 모델을 `gpt-5.2-codex`로 고정하고 프롬프트·도구·middleware를 반복 개선해 Terminal-Bench 2.0 점수가 52.8%에서 66.5%가 됐다고 보고했다. 과정은 LangSmith trace에서 실패 유형을 찾고, 원인에 맞는 변경을 적용한 뒤 같은 평가로 다시 확인하는 것이다. 이 수치는 특정 시점의 자체 실험이지 현재 순위나 다른 작업에서의 개선 보장은 아니다. 실무에서는 검증 체크리스트·작업 맥락·반복 루프 감지처럼 관찰된 실패에 대응하는 작은 변경을 하고, 별도 과제에서 회귀도 확인한다.'
  points:
  - '모델을 고정해 하네스 변경 효과와 모델 변경 효과를 분리'
  - 'trace → 실패 분류 → targeted change → 같은 eval 재실행'
  - '벤치마크 점수는 재현 조건·표본·시점과 함께 해석하고, 별도 과제로 회귀 검사'
  source: https://www.langchain.com/blog/improving-deep-agents-with-harness-engineering
  interview: '코딩 에이전트 성능을 높일 때 모델부터 바꾸지 않고 하네스를 먼저 점검하는 이유는 무엇인가요?'
  answer: '모델과 하네스를 동시에 바꾸면 성능 변화의 원인을 알기 어렵다. 모델을 고정하고 trace에서 반복 실패를 찾아 프롬프트·도구·middleware를 한정적으로 바꾸면 개선 원인을 검증하고 회귀를 추적하기 쉽다. 다만 한 벤치마크 결과만으로 일반 성능을 단정하지 말고 다른 과제에서도 확인해야 한다.'
- category: ai
  level: 중급
  title: AAIF — 프로젝트를 함께 호스팅해도, 상호운용성은 별도로 검증한다
  summary: 'Linux Foundation 산하 Agentic AI Foundation(AAIF)은 오픈소스 에이전트 프로젝트와 표준의 중립 거버넌스를 지원한다. 2025년 출범 때 MCP(도구·데이터 연결), goose(에이전트), AGENTS.md(저장소 지침)가 창립 기여로 합류했다. 현재 공식 목록은 Agent Skills·A2A·Agent Router·agentgateway·Open Responses·OpenEnv·OpenSandbox 등으로 확대됐다. 재단 소속은 협업·공개 거버넌스의 신호이지, 각 프로젝트가 자동으로 호환되거나 보안 검증을 통과했다는 뜻은 아니다. 개발자는 프로토콜·도구를 고를 때 소속만 보지 말고 버전 호환성, 권한 경계, 실제 통합 테스트를 확인한다.'
  points:
  - '창립 기여와 현재 프로젝트 목록을 구분 — A2A 등은 후속 참여 프로젝트'
  - '중립 거버넌스는 협업 틀; 상호운용성·보안은 구현과 검증으로 확인'
  - '2026-10 공식 발표: 첫해 프로젝트 10개 도달; 현재 목록은 AAIF 사이트 기준'
  source: https://aaif.io/projects
  interview: '같은 재단이 호스팅하는 두 에이전트 프로젝트라면 서로 호환된다고 가정해도 될까요?'
  answer: '아니다. 재단은 공개 협업과 거버넌스를 제공하지만, 호환성은 프로토콜 버전·구현 차이·인증 및 통합 테스트에 달려 있다. 실제 연결 경로와 권한·오류 동작을 테스트하고, 지원 범위를 확인해야 한다.'
- category: ai
  level: 고급
  title: Claude security-guidance — 자동 보안 리뷰는 코드 차단기가 아니다
  summary: 'Claude Code의 security-guidance 플러그인은 코드 편집 때 위험 패턴을 알리고, 턴 종료 시 diff를 LLM으로 검토하며, 커밋 때 관련 파일까지 살펴보는 에이전트 리뷰를 제공한다. 하지만 이 결과는 보안 경계가 아니다. 리뷰는 취약점을 놓칠 수 있고 기본 설정은 발견을 Claude에게 전달할 뿐 커밋을 차단하지 않는다. 또한 LLM 리뷰에는 diff와 관련 코드가 설정된 모델 endpoint로 전송되고 추가 토큰 비용이 든다. 신뢰하지 않는 저장소는 먼저 샌드박스에서 열고, 비밀·민감 코드의 전송 정책을 확인하며, 독립적인 테스트·정적 분석·사람 리뷰를 유지한다.'
  points:
  - '패턴 알림 → 턴 종료 diff 리뷰 → 커밋 시 연관 파일을 읽는 에이전트 리뷰'
  - '기본 리뷰는 차단 제어가 아님; 오탐·미탐 가능 — 보안 게이트·테스트를 대체하지 않는다'
  - 'diff·관련 코드가 모델 endpoint로 전송되고 비용 발생; 저장소 신뢰와 데이터 정책을 먼저 확인'
  source: https://github.com/anthropics/claude-plugins-official/tree/main/plugins/security-guidance
  interview: '보안 리뷰 플러그인을 켰다면 왜 CI 보안 검사와 코드 리뷰를 제거하면 안 되나요?'
  answer: '플러그인은 모델이 발견한 문제를 알려주는 보조 도구이며, 완전한 탐지나 커밋 차단을 보장하지 않는다. 미탐을 보완하는 테스트·정적 분석과 독립 리뷰를 유지해야 한다. 또 리뷰 과정에서 diff와 연관 코드가 모델 endpoint로 전송될 수 있으므로 저장소 신뢰와 데이터 처리 정책도 확인해야 한다.'
- category: ai
  level: 중급
  title: AGENTS.md — 저장소 지침을 루트와 하위 폴더에 나누기
  summary: 'AGENTS.md는 코딩 에이전트에 빌드·테스트·코딩 규칙을 전달하는 일반 Markdown 파일이다. 사람용 README에 프로젝트 개요를 두고, 에이전트가 반복해서 알아야 할 저장소 규칙은 루트 AGENTS.md에 둔다. 모노레포는 패키지별 파일로 예외나 고유 명령을 좁혀 적을 수 있다. 다만 파일 이름이 같아도 자동 발견 범위, 병합 순서, 충돌 해결, 명령 실행 여부는 호스트마다 다르다. 예를 들어 Codex는 프로젝트 루트에서 현재 작업 폴더까지 지침을 합치고 더 가까운 파일을 나중에 적용한다. 팀이 쓰는 에이전트에서 실제로 어떤 파일을 읽는지 확인하고, 중복·충돌 규칙과 테스트 동작을 작은 작업으로 점검한다. AGENTS.md 사이트는 6만 개가 넘는 오픈소스 프로젝트가 사용한다고 소개하지만, 이는 채택 신호이지 지침 효과를 보장하는 근거는 아니다.'
  points:
  - '루트에는 공통 빌드·테스트·규칙, 하위 AGENTS.md에는 해당 패키지에만 필요한 지침을 둔다'
  - 'AGENTS.md는 일반 Markdown 포맷이다. 실제 자동 탐색·중첩 병합·충돌 우선순위는 사용하는 에이전트 문서에서 확인한다'
  - '파일에 테스트 명령을 적었다고 모든 호스트가 같은 방식으로 실행하는 것은 아니다. 적용 여부와 결과를 실제 작업으로 검증한다'
  source: https://agents.md
  sources:
  - label: 'AGENTS.md 공식 사이트 — 파일 목적, 모노레포의 중첩 지침, 채택 신호와 FAQ'
    url: https://agents.md
  - label: 'Codex 공식 문서 — 프로젝트 파일 탐색, 루트부터 하위 경로 병합 및 더 가까운 지침의 적용'
    url: https://developers.openai.com/codex/guides/agents-md/
  interview: 'AGENTS.md를 루트와 하위 폴더에 나눠 둔 뒤, 에이전트의 우선순위와 테스트 실행을 별도로 확인해야 하는 이유는 무엇인가요?'
  answer: 'AGENTS.md는 일반 Markdown 포맷이지 모든 호스트의 로딩·실행 정책을 통일하는 설정 파일은 아니다. 루트와 하위 지침의 탐색 및 충돌 처리, 적힌 테스트 명령의 실행 방식은 에이전트별 문서와 작은 실제 작업으로 확인해야 한다.'
- category: ai
  level: 중급
  title: Factory Droid Exec — 무인 실행도 권한 단계를 지킨다
  summary: 'Factory의 `droid exec`는 CI·스크립트용 단발성 실행 모드다. 기본값은 읽기 전용이고, `--auto low|medium|high`로 허용 작업을 단계적으로 넓힌다. 단 `--auto high`도 permission rule의 `ask`를 승인으로 바꾸지는 않는다. 허용 단계 밖 작업을 만나면 비정상 종료할 수 있지만, 그 전에 만든 파일 수정은 작업 트리에 남는다. 자동화 전에는 정책을 미리 확인하고, 실행 뒤 `git diff`와 테스트를 검토한다. `--skip-permissions-unsafe`는 모든 확인을 생략하므로 폐기 가능한 격리 환경에서만 쓴다.'
  points:
  - '기본 read-only → `--auto low/medium/high`로 단계적 권한 부여'
  - '`ask` 정책은 무인 모드에서 자동 승인되지 않으며, 거부 전에 적용한 수정은 남을 수 있음'
  - '명령 정책 미리보기 + diff/test 검토; unsafe 전체 생략은 disposable sandbox 전용'
  source: https://docs.factory.ai/docs/droid-exec/overview
  interview: '`droid exec --auto high`가 실패한 뒤에도 왜 작업 트리를 검사해야 하나요?'
  answer: '권한 위반은 프로세스를 중단시키지만, 중단되기 전에 적용한 파일 수정은 자동으로 롤백되지 않을 수 있다. `git status`와 `git diff`로 부분 변경을 확인하고 테스트해야 한다. 또한 `ask` 규칙은 무인 실행에서 허용이 아니므로 정책을 사전에 점검한다.'
- category: ai
  level: 고급
  title: Terminal-Bench — 리더보드는 모델이 아니라 실행 조합을 비교한다
  summary: 'Terminal-Bench는 터미널 환경에서 에이전트가 실제 작업을 끝내는지 평가한다. 점수는 모델 이름만의 속성이 아니다. 현재 공식 4.1 리더보드는 모델·에이전트 조합과 해상률, 95% 신뢰구간, 토큰·비용을 함께 제시하고, 실행 안내는 Harbor에서 데이터셋 버전·샌드박스·에이전트·모델·시도 횟수를 지정한다. 따라서 비교할 때 벤치마크 버전과 실행 조건을 맞추고, 신뢰구간과 비용도 함께 본다. 예전 2.1 순위나 특정 시점의 1위는 새 버전의 현재 순위로 옮겨 쓸 수 없다.'
  points:
  - '측정 대상은 모델+에이전트 하네스+실행 설정의 조합'
  - '데이터셋 버전·샌드박스·시도 횟수를 기록하고 동등한 조건끼리 비교'
  - '해상률의 95% 신뢰구간과 토큰·비용을 함께 확인; 과거 버전 순위는 별도 표기'
  source: https://www.tbench.ai/
  sources:
  - label: 'Terminal-Bench 공식 리더보드 — 4.1 조합·해상률·95% CI·비용 및 토큰'
    url: https://www.tbench.ai/
  - label: '공식 실행 안내 — Harbor, 데이터셋 버전·샌드박스·agent·model·k 설정'
    url: https://www.tbench.ai/run
  interview: 'Terminal-Bench에서 두 모델의 점수를 비교할 때 모델 이름 외에 어떤 조건을 고정하거나 함께 기록해야 하나요?'
  answer: '벤치마크와 데이터셋 버전, 에이전트/하네스, 샌드박스, reasoning·시도 설정을 맞춰야 한다. 점수의 95% 신뢰구간과 비용·토큰도 함께 봐야 차이가 유의미한지와 운영 효율을 판단할 수 있다. 서로 다른 버전의 순위는 직접 비교하지 않는다.'
- category: ai
  level: 고급
  title: SWE-bench M — 시각 UI 버그는 이미지 이해와 실행 검증이 함께 필요하다
  summary: 'SWE-bench Multimodal은 스크린샷·목업·다이어그램이 포함된 사용자 대면 JavaScript 문제를 평가한다. 공식 Multimodal v2는 flaky하거나 채점하기 어려운 항목을 제외한 재현 가능 480개 task를 제공하고, Docker 환경과 JavaScript 채점도 갱신했다. 교훈은 이미지에서 문제를 찾는 것과 수정 결과를 확인하는 것은 별개라는 점이다. Android UI 버그에도 화면 캡처만 전달하지 말고 재현 단계와 기대 동작을 함께 적고, 수정 후 에뮬레이터 렌더링 및 기능 테스트로 확인한다. 단, 이 벤치마크 자체는 Android 성능을 측정하지 않는다.'
  points:
  - '시각 입력은 코드 이슈의 맥락 — 스크린샷·목업·다이어그램과 문제 설명을 함께 해석'
  - 'Multimodal v2: 재현 가능한 480 tasks; flaky/ungradeable 항목 제거 및 평가 환경 갱신'
  - '이미지 이해와 출력 검증은 별도 — 화면 재현 + 기능 테스트; Android 점수로 오해하지 않기'
  source: https://www.swebench.com/multimodal
  sources:
  - label: 'SWE-bench Multimodal 공식 현행 안내 — v2의 480개 재현 가능 task와 환경 변경'
    url: https://www.swebench.com/multimodal
  - label: 'ICLR 2025 원 논문 — 이미지 필요성, JavaScript·시각 도메인, 일부 pixel-level visual test'
    url: https://proceedings.iclr.cc/paper_files/paper/2025/file/07d6332ae36730707fddddba736d7b6c-Paper-Conference.pdf
  interview: 'SWE-bench Multimodal의 교훈을 Android 화면 버그 수정에 적용한다면, 스크린샷 외에 무엇을 확인해야 하나요?'
  answer: '스크린샷은 문제의 시각적 맥락을 주지만 기대 동작과 재현 절차도 필요하다. 수정 후 에뮬레이터나 실제 기기에서 렌더링 결과를 확인하고, 기능·회귀 테스트를 실행한다. SWE-bench M은 JavaScript 벤치마크이므로 Android 성능의 직접 증거로 사용하지 않는다.'
- category: ai
  level: 중급
  title: claude --worktree — 한 레포에서 여러 Claude 세션을 'git 워크트리'로 격리해 동시에 돌리기
  summary: '`claude --worktree feature-auth`는 `.claude/worktrees/feature-auth`에 `worktree-feature-auth` 브랜치를 만들고 별도 파일 체크아웃에서 세션을 시작한다. 이름 없이 실행하면 이름을 자동 생성하며, `--worktree "#1234"`로 GitHub PR의 head를 가져올 수도 있다. 병렬 작업의 파일 충돌을 줄이는 기능이지 완전한 보안 경계는 아니다. 워크트리는 `.git`과 일부 권한 설정을 공유하고, 셸 명령이 메인 체크아웃에 쓰는 행위까지 모두 차단하지 않는다.'
  points:
  - '`worktree.baseRef: "fresh"`(기본값)는 원격 기본 브랜치 기준, `"head"`는 현재 로컬 HEAD 기준이다. 이름 없는 세션은 종료 시 깨끗하면 자동 정리될 수 있지만, named 세션은 보존 여부를 묻는다'
  - '`.worktreeinclude`에는 복사할 gitignored 파일만 패턴으로 지정한다. 이 설정은 Claude가 만드는 Git 워크트리에 적용되므로 `.env`·비밀키를 넣으면 각 워크트리에 복제된다. 꼭 필요한 로컬 설정만 선택한다'
  - '워크트리는 파일과 브랜치는 분리하지만 `.git` 저장소와 저장된 Bash 권한 승인은 공유한다. Claude의 작업 경로 검사는 셸의 모든 파일 쓰기를 막지 않으므로 민감한 코드 보호가 목적이면 OS sandbox·권한 정책도 별도로 설정한다'
  - '서브에이전트 격리는 `isolation: worktree` 등으로 선택한다. 비대화형 `-p` 실행은 종료 시 정리 프롬프트가 없어 워크트리가 남을 수 있다. 정리 전에 `git worktree list`와 변경 사항을 확인한다'
  source: https://code.claude.com/docs/en/worktrees
  sources:
  - label: 'Claude Code 공식 Worktrees 문서 — 생성·브랜치 기준·정리·격리 제한·ignored 파일 복사'
    url: https://code.claude.com/docs/en/worktrees
  - label: 'Claude Code 공식 settings 문서 — worktree의 권한 설정 저장 위치와 적용 범위'
    url: https://code.claude.com/docs/en/settings
  - label: 'Git 공식 worktree 문서 — 별도 작업 디렉터리와 공유 저장소 구조'
    url: https://git-scm.com/docs/git-worktree
  interview: 'Claude Code worktree를 여러 개 만들어 파일 충돌을 줄였는데도, 왜 이를 보안 샌드박스로 간주하면 안 되나요?'
  answer: '워크트리는 별도 파일 디렉터리와 브랜치를 제공하지만 `.git` 저장소 및 일부 권한 설정은 공유한다. Claude의 경로 검사는 셸 명령이 메인 체크아웃에 쓰는 모든 방법을 차단하지 않는다. 신뢰 경계가 필요하면 별도 OS sandbox와 최소 권한을 적용하고, `.worktreeinclude`에는 비밀 파일을 신중히 선택해야 한다.'
- category: ai
  level: "중급"
  title: 'Context Rot — 긴 context window가 정확도를 보장하지 않는다'
  summary: 'Chroma의 2025년 기술 보고서는 18개 LLM에서 입력 길이·방해 정보·문맥 구조에 따라 성능이 달라짐을 관찰했다. LongMemEval에서는 약 11.3만 토큰 대화 전체보다 질문 관련 내용만 남긴 약 300토큰 입력에서 점수가 높았다. 이는 해당 실험 결과이지 모든 모델·업무의 보편 법칙은 아니다. 에이전트에는 전체 기록을 매번 붙이기보다 관련 근거를 검색·요약하고 실제 업무로 검증한다.'
  points:
  - '컨텍스트 창 크기는 입력 한도이지, 긴 입력에서의 정확도 보증이 아니다.'
  - '전체 대화 입력은 검색과 답변 생성을 함께 요구하고, 무관한 내용은 필요한 근거를 찾기 어렵게 할 수 있다.'
  - '약 300토큰은 연구의 focused prompt 평균이다. 모든 RAG·에이전트에 적용할 고정 예산으로 해석하지 않는다.'
  source: https://www.trychroma.com/research/context-rot
  interview: '모델의 컨텍스트 창이 크면 대화 전체를 매 요청에 넣는 것이 항상 더 정확할까요?'
  answer: '아니다. 컨텍스트 창은 처리 가능한 입력 한도이지 긴 입력에서의 성능 보증이 아니다. 관련 기록을 검색하고 필요한 근거만 요약해 제공한 뒤, 실제 업무 데이터로 전체 입력 방식과 비교 평가한다. 300토큰은 특정 연구의 focused prompt 평균이므로 보편적인 최적 길이로 쓰지 않는다.'
- category: ai
  level: "중급"
  title: 'Claude Code 서브에이전트 모델 라우팅 — 호출·정의·환경변수 우선순위'
  summary: 'Claude Code 서브에이전트는 별도 컨텍스트에서 맡은 일을 처리해 결과를 요약으로 돌려준다. 모델은 기본적으로 부모 대화에서 상속하지만, 호출 인자·에이전트 정의·환경변수로 역할별 모델을 정할 수 있다. 우선순위를 모르면 설정한 환경변수가 정의 파일에 의해 가려질 수 있다.'
  points:
  - '기본 우선순위: 호출별 `model` → 에이전트 정의의 `model` → `CLAUDE_CODE_SUBAGENT_MODEL` → 부모 모델'
  - '정의에는 `haiku` 같은 별칭, 전체 모델 ID, `inherit`를 쓸 수 있다. 호출별 인자는 별칭만 받으며, 별칭은 공급자·시점에 따라 다른 버전으로 해석될 수 있다.'
  - '환경변수만으로 정의를 덮어쓰지 않는다. 전역 강제는 `CLAUDE_CODE_SUBAGENT_MODEL_FORCE=1`을 함께 설정하되, 역할별 분기를 무시할 수 있다.'
  - '내장 Explore는 기본적으로 부모 모델을 사용한다. 별도 컨텍스트는 메인 대화 부담을 줄이지만 요청은 사용량 한도에 포함된다. `/tasks`에서 실제 모델을 확인한다.'
  source: https://code.claude.com/docs/en/sub-agents
  interview: '`CLAUDE_CODE_SUBAGENT_MODEL=haiku`인데 에이전트 정의에 `model: opus`가 있으면 어느 모델이 적용되나요?'
  answer: '호출별 모델 지정이 없다면 정의의 `opus`가 환경변수 `haiku`보다 우선한다. `CLAUDE_CODE_SUBAGENT_MODEL_FORCE=1`을 함께 설정하면 전역 모델을 강제할 수 있지만, 에이전트별 모델 선택도 덮어쓸 수 있다. 별칭의 실제 버전은 공급자와 설정에 따라 달라지므로 `/tasks`에서 실행 결과를 확인한다.'
- category: ai
  level: 중급
  title: Agent Skills 점진 공개 — 설명으로 고르고, 필요할 때 지침과 자료를 읽기
  summary: 'Agent Skills 표준은 스킬을 메타데이터, 지침, 추가 자료의 단계로 구성한다. 지원하는 에이전트는 보통 시작할 때 name·description을 먼저 읽고, 관련 작업에서 SKILL.md를 연 뒤, 필요한 참조 파일만 더 불러온다. 따라서 description은 스킬을 언제 선택할지 알려주는 라우팅 문구다. 다만 구체적인 로딩 동작과 토큰 비용은 제품별 구현에 따라 달라진다.'
  points:
  - '단계: name·description → 활성화된 SKILL.md 지침 → 필요할 때 scripts·references·assets. 표준의 메타데이터 비용 추정은 스킬당 약 100 tokens다.'
  - 'description에는 기능뿐 아니라 적용할 작업과 호출 조건을 적는다. 그래야 스킬 선택과 본문 로딩이 적절해진다.'
  - '추가 파일은 토큰 비용이 0이라고 단정하지 않는다. 에이전트가 읽는 참조 내용과 실행 결과는 context에 들어갈 수 있다.'
  - '스킬은 지침과 실행 코드를 포함할 수 있다. 설치 전 전체 파일과 권한·네트워크 동작을 검토한다.'
  source: https://agentskills.io/specification
  sources:
  - label: Agent Skills specification — progressive disclosure
    url: https://agentskills.io/specification
  - label: Anthropic Agent Skills — load levels and security
    url: https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview
  interview: "스킬의 description을 구체적으로 써야 하는 이유와, 참조 파일을 둘 때 주의할 점은 무엇인가요?"
  answer: '지원하는 에이전트가 description을 스킬 선택 신호로 사용하므로, 기능과 적용 조건을 명확히 적어야 한다. 참조 파일은 필요할 때만 읽도록 나눌 수 있지만, 읽은 내용과 실행 출력은 context에 들어간다. 로딩·토큰 동작은 제품별로 확인하고, 스킬의 코드와 권한도 설치 전에 검토한다.'
- category: ai
  level: 고급
  title: Frequent Intentional Compaction — 조사·계획·검증 결과를 다음 context로 넘기기
  summary: 'Humanlayer의 코딩 에이전트 워크플로는 context가 가득 차기 전에 결과를 구조화해 다음 단계로 넘긴다. 작성자는 복잡도에 따라 context 사용률 40~60%를 참고 범위로 제시하고, 조사 → 계획 → 구현을 나눠 앞 단계의 산출물을 사람이 확인한다. 이는 보편적인 최적 수치나 자동 압축 규칙이 아니라, 해당 팀의 경험에서 나온 작업 방식이다.'
  points:
  - '조사: 관련 모듈·데이터 흐름·실패 원인을 찾아 근거와 불확실성을 기록한다.'
  - '계획: 수정 위치, 단계, 테스트를 제안하고 구현 전에 사람이 조사·계획의 핵심 가정을 검토한다.'
  - '구현과 전환: 검증된 단계마다 목표·결정·완료·남은 오류를 짧은 문서에 저장해 새 context에서 이어 간다. 로그 전체보다 재현에 필요한 상태만 남긴다.'
  - 'BAML 사례의 300k LOC·35k LOC·약 7시간은 저자의 특정 공동 작업 보고다. 통제 실험이나 일반적인 생산성 보장은 아니며, 저자도 충분한 조사와 전문가 검토, 실패 사례를 함께 설명한다.'
  source: https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/ace-fca.md
  sources:
  - label: Humanlayer — workflow and author-reported BAML case
    url: https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/ace-fca.md
  - label: BAML merged cancellation implementation PR
    url: https://github.com/BoundaryML/baml/pull/2357
  interview: "에이전트 작업에서 구현보다 조사·계획 산출물을 먼저 검토하면 어떤 실패를 줄일 수 있나요? context를 새로 시작할 때 무엇을 남겨야 하나요?"
  answer: '조사나 계획의 잘못된 가정은 많은 코드 변경으로 확대될 수 있으므로, 구현 전에 근거와 수정·검증 계획을 검토하면 오류를 일찍 발견할 수 있다. 새 context에는 목표, 결정 근거, 완료한 검증 단계, 재현 가능한 현재 실패, 다음 작업을 남기고 불필요한 탐색 로그는 버린다. 40~60%는 저자의 경험적 참고치이지 고정 임계값이 아니다.'
- category: ai
  level: 중급
  title: Claude Code Security Review — PR diff를 AI로 점검하되 신뢰 경계는 직접 설계하기 (~7.1k★)
  summary: 'Anthropic의 MIT 라이선스 GitHub Action은 PR의 변경 diff를 Claude Code로 분석해 취약점 후보를 만들고, 설정에 따라 PR 주석이나 결과 artifact로 남긴다. 컨텍스트를 고려한 보안 리뷰를 자동화하지만, SAST·테스트·사람의 판단을 대체하거나 취약점 부재를 증명하지는 않는다. 저장소 README는 prompt injection에 하드닝되지 않았다고 경고하므로, 특히 외부 PR이 비밀 키와 쓰기 권한을 가진 runner에서 실행되지 않도록 워크플로 경계를 먼저 설계해야 한다.'
  points:
  - '범위: 변경 diff를 분석하고 finding 주석 또는 JSON 결과를 남긴다. 기본 제외·필터 지침은 노이즈를 줄이지만, 탐지 누락과 오탐은 가능하다.'
  - '보완재: 결과를 보안 검토의 입력으로 사용한다. 기존 SAST, 테스트, 위협 모델링, 사람의 확인을 대체하는 통과 판정으로 쓰지 않는다.'
  - '권한·공급망: 주석 작성에 필요한 최소 `pull-requests: write`만 허용하고, 예제의 `@main` 대신 검토한 Action commit SHA에 고정한다. API key는 필요한 trusted workflow에만 노출한다.'
  - '프롬프트 인젝션 경계: 공식 README는 하드닝되지 않았다고 명시한다. 외부 PR 코드를 key가 있는 권한 runner에서 실행하지 말고, GitHub의 fork workflow 승인 정책을 설정한다.'
  source: https://github.com/anthropics/claude-code-security-review
  sources:
  - label: Action README — workflow, capabilities, explicit prompt-injection warning
    url: https://github.com/anthropics/claude-code-security-review
  - label: Action inputs and API-key requirements
    url: https://github.com/anthropics/claude-code-security-review/blob/main/action.yml
  - label: GitHub Actions — fork PR workflow approval and secrets boundary
    url: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository
  interview: "AI 보안 리뷰 Action을 외부 PR에서 실행할 때 어떤 공격 경계와 권한을 확인해야 하며, 결과를 어떻게 해석해야 하나요?"
  answer: 'Action의 prompt가 PR diff에 영향을 받을 수 있고 공식 프로젝트는 prompt injection에 하드닝되지 않았다고 경고한다. 외부 코드가 API key나 write token에 접근하지 않게 하고 fork workflow 승인 정책과 최소 권한을 설정한다. 결과는 후보 finding이므로 SAST·테스트와 사람의 검토로 확인하며, 경고가 없다고 안전을 증명하지 않는다.'
- category: ai
  level: 중급
  title: Serena MCP — 텍스트 검색 대신 심볼 관계로 에이전트의 코드 탐색·수정을 돕기 (~31.6k★)
  summary: 'Serena는 LLM이 코드베이스에서 심볼을 찾고, 참조를 따라가며, 안전하게 수정하도록 돕는 MCP 서버다. LSP backend는 40개 이상의 언어에서 심볼 기반 검색·편집을 제공하고, 별도의 유료 JetBrains plugin은 IDE 분석을 이용해 이동·인라인 리팩터링과 대화형 디버깅을 추가한다. 두 backend의 기능은 같지 않다. 라이선스도 단순한 MIT가 아니다: Serena 애플리케이션은 GPL-3.0-or-later이고 SolidLSP만 MIT이며, 둘을 결합한 배포물은 GPL 조건을 따른다.'
  points:
  - '탐색: `find_symbol`과 참조 검색으로 함수·클래스 정의와 사용처를 좁혀, 에이전트가 파일 전체를 반복 검색하는 일을 줄인다.'
  - 'backend 선택: 기본 LSP는 무료·오픈소스이며 40+ 언어를 지원한다. 유료 JetBrains plugin은 IDE 분석을 활용해 이동·인라인과 대화형 디버깅을 더한다. 정확한 지원 범위는 언어와 backend마다 다르다.'
  - '설치: 공식 README는 오래된 MCP/플러그인 마켓플레이스 설치 안내를 피하고 `uv tool install -p 3.13 serena-agent` 후 `serena init`을 권한다. 특정 LSP에는 별도 의존성이 필요할 수 있다.'
  - '도입 전 라이선스 확인: 앱은 GPL-3.0-or-later, SolidLSP는 MIT. GitHub 저장소는 확인 시 약 31.6k stars였지만 이는 사용량이나 Android 개발 채택률을 증명하지 않는다.'
  source: https://github.com/oraios/serena
  sources:
  - label: Serena README — current v2, setup, feature matrix, and license summary
    url: https://github.com/oraios/serena
  - label: Serena license documentation
    url: https://oraios.github.io/serena/01-about/060_license.html
  interview: "Serena의 LSP와 JetBrains backend는 무엇이 다르며, 팀에서 도입하기 전에 어떤 호환성을 확인해야 하나요?"
  answer: 'LSP backend는 여러 언어 서버를 통해 심볼 검색과 기본 편집을 제공한다. JetBrains plugin은 IDE 분석을 이용해 더 깊은 이동·인라인 리팩터링과 디버깅을 제공하지만 유료이고 IDE/언어 지원이 다르다. 목표 레포의 언어 서버와 실제 기능을 확인하고, Serena 앱의 GPL-3.0-or-later 조건이 배포 방식과 맞는지도 검토한다.'
- category: ai
  level: 중급
  title: Agent Client Protocol — IDE와 코딩 에이전트 사이의 대화 규약 (~4.7k★)
  summary: 'Agent Client Protocol(ACP)은 IDE/client와 AI coding agent가 JSON-RPC 2.0 메시지로 대화하는 공개 프로토콜이다. 연결 시 버전과 capability를 협상한 뒤 세션을 만들거나 불러오고, prompt와 진행 업데이트·권한 요청을 교환한다. 핵심 이점은 호환성이지 기능 동일성이 아니다: client와 agent가 광고·지원하는 기능을 연결별로 확인해야 한다. 현재 문서에서 v1이 최신이며 v2는 preview다. 기본 transport는 로컬 stdio이고, HTTP/WebSocket 원격 transport는 별도 제안·실험 상태라 ACP core 기능처럼 가정하지 않는다.'
  points:
  - '흐름: `initialize`로 protocol version/capability 협상 → 인증이 필요하면 완료 → `session/new` 또는 지원 시 `session/load` → `session/prompt`. 진행 중에는 `session/update`가 오고, 필요하면 client가 권한을 확인한다.'
  - '호환성 검사: handshake에서 합의한 capability가 실제 기능 범위다. 예를 들어 세션 재개, 파일 접근, terminal 도구는 모든 ACP agent/client 조합에서 지원되지 않는다.'
  - '전송: 기본 표준은 client가 agent subprocess를 띄우는 newline-delimited JSON-RPC over stdio다. HTTP/WebSocket은 별도 원격 transport 제안이며 core 표준으로 간주하지 않는다.'
  - 'ACP Registry는 인증을 지원하는 agent를 선별해 배포하는 목록이다. 확인 시 protocol 저장소는 약 4.7k stars였지만, 별 수나 registry 등록이 실제 호환성·품질을 보장하지 않는다.'
  source: https://agentclientprotocol.com/protocol
  sources:
  - label: ACP protocol overview and v1 message flow
    url: https://agentclientprotocol.com/protocol
  - label: ACP transport specification
    url: https://agentclientprotocol.com/protocol/transports
  - label: ACP Registry scope and available agents
    url: https://agentclientprotocol.com/registry
  - label: Protocol repository and current star signal
    url: https://github.com/agentclientprotocol/agent-client-protocol
  interview: "ACP를 지원하는 agent와 IDE라면 모든 기능이 서로 동일하게 동작하나요? 먼저 어떤 정보를 확인해야 하나요?"
  answer: '아니다. ACP는 통신 형식을 표준화하지만 기능 지원은 agent/client가 연결 초기화에서 광고·협상한 capability에 달려 있다. protocol version, 인증 방식, session load/resume, 파일·terminal 권한, transport를 확인한다. 현재 공개 문서는 v1이 최신이고 v2는 preview이며, 원격 HTTP/WebSocket은 core transport로 가정하지 않는다.'
- category: ai
  level: 중급
  title: Conductor — 격리 workspace에서 AI 코딩 작업을 병렬로 운영하기
  summary: 'Conductor는 macOS에서 여러 AI 코딩 에이전트 세션을 저장소 workspace별로 운영하는 개발 환경이다. workspace는 별도 Git worktree와 branch를 사용하므로 독립 작업을 나눠 실행하고 diff·테스트·PR 상태를 한곳에서 검토할 수 있다. Conductor는 에이전트 모델을 제공하는 서비스가 아니다. 앱 사용료는 무료이며 모델 사용료와 계정은 연결한 제공자 기준이다. worktree는 파일·branch 격리이지 보안 sandbox가 아니므로 에이전트 권한과 공유 자원은 별도로 관리한다.'
  points:
  - '작업 단위: 독립적인 이슈는 각각 workspace·branch·worktree로 분리하고, 같은 branch를 공유해야 하는 구현·리뷰는 한 workspace에서 수행한다.'
  - '실행 계층: Claude Code·Codex·Cursor·OpenCode를 연결한다. Claude Code·Codex·OpenCode는 앱에 포함되며, Cursor는 Cursor API 연결을 사용한다.'
  - '검토 흐름: Diff Viewer와 Checks에서 변경·테스트·PR 상태를 확인한 뒤 사람이 merge하고 workspace를 정리한다. 동시 실행 수보다 리뷰와 검증 용량을 먼저 계획한다.'
  source: https://www.conductor.build/
  sources:
  - label: Conductor 문서 — workspace·agent 지원·비용 경계
    url: https://www.conductor.build/docs/first-workspace
  - label: Harness 문서 — 에이전트 실행 계층 및 요금 구분
    url: https://www.conductor.build/docs/reference/harnesses
  - label: Diff·Checks·PR 검토 및 merge 절차
    url: https://www.conductor.build/docs/guides/review-and-merge
  interview: 'Git worktree 기반 AI 에이전트 병렬 실행에서 worktree 격리가 보장하는 것과 보장하지 않는 것은 무엇인가요?'
  answer: 'worktree는 작업 파일과 branch를 분리해 변경 충돌을 줄인다. 그러나 실행 권한, 비밀정보 접근, 포트·DB 같은 공유 자원까지 격리하는 보안 sandbox는 아니다. 별도 workspace별 환경과 최소 권한을 설정하고, diff·테스트를 검토한 뒤 사람이 merge해야 한다.'
- category: ai
  level: 중급
  title: MCP Tool Search — 필요한 도구 정의만 찾아 컨텍스트에 불러오기
  summary: 'MCP 서버를 여러 개 연결하면 도구 이름·설명·입력 schema가 모델의 컨텍스트를 차지하고, 비슷한 도구 사이에서 잘못 고를 수도 있다. Claude Code의 Tool Search는 지원 모델에서 MCP 도구를 기본적으로 지연 로드하고, 작업에 필요한 도구 정의를 검색한 뒤 전체 schema를 불러온다. 도구를 없애는 기능은 아니며 검색 단계가 추가되고 선택된 정의는 여전히 컨텍스트를 쓴다. 작은 도구 묶음이나 매번 필요한 핵심 도구는 검색 지연보다 상시 로드가 더 적합할 수 있다.'
  points:
  - '`ENABLE_TOOL_SEARCH`가 unset/`true`이면 지원 환경에서 지연 로드한다. `auto`는 정의가 context 10% 미만이면 미리 로드하고, `auto:N`은 임계값을 바꾸며, `false`는 모두 미리 로드한다. `alwaysLoad: true` 서버는 예외다.'
  - '모델·호스팅·정책에 따라 동작이 다르다. 공식 지원 목록보다 오래된 모델, 특정 Vertex AI·Microsoft Foundry 경로, HIPAA 설정이나 beta 비활성화는 도구를 미리 로드하거나 검색을 끌 수 있다.'
  - '검색에는 추가 단계가 필요하다. 도구가 적고 자주 쓰이면 핵심 서버만 `alwaysLoad`로 두고 나머지는 지연 로드한다. gateway를 쓴다면 `defer_loading`과 `tool_reference` 전달을 확인한다.'
  source: https://code.claude.com/docs/en/mcp
  sources:
  - label: Claude Code MCP — Tool Search 기본 동작·환경 차이·설정
    url: https://code.claude.com/docs/en/mcp
  - label: Anthropic — Advanced Tool Use 설계와 내부 평가의 범위
    url: https://www.anthropic.com/research/advanced-tool-use
  interview: 'MCP Tool Search가 컨텍스트 사용량을 줄이는 방식과, 항상 켜 두지 않을 수 있는 경우를 설명해 보세요.'
  answer: '도구 정의를 모두 처음부터 넣지 않고 작업 중 필요한 도구를 검색해 schema를 추가하므로 초기 context 부담을 줄인다. 검색 자체의 지연이 있고, 선택된 schema도 context를 차지한다. 도구가 적거나 거의 매번 쓰는 경우에는 핵심 도구를 상시 로드할 수 있다. 모델·gateway·조직 정책이 지연 로드를 지원하는지도 확인한다.'
- category: ai
  level: 고급
  title: DeepSWE — 긴 코딩 과제 벤치마크도 채점기 검증이 필요하다
  summary: 'DeepSWE v1.1은 91개 저장소의 직접 작성한 113개 장기 소프트웨어 과제를 코딩 에이전트로 평가한다. 에이전트의 commit patch를 별도 깨끗한 컨테이너에 적용해 verifier를 실행하는 것이 설계의 장점이다. 그러나 Epoch AI는 독립 리뷰에서 최소 23개 과제의 false negative를 확인하고 v1.1을 “Flawed”로 분류했다. 그중 18개는 에이전트가 추가한 테스트와 verifier가 주입한 테스트가 충돌하는 유형이었다. 따라서 긴 과제와 격리 채점만으로 점수가 신뢰할 만해지는 것은 아니다. 리더보드를 읽을 때 verifier 결함, harness·모델 설정, 비용과 작업 수를 함께 확인한다.'
  points:
  - '과제·채점 구조: 113개 과제는 91개 저장소와 5개 언어를 다루며, v1.1은 에이전트가 제출한 commit patch를 별도 verifier 환경에서 검사한다.'
  - '독립 검토: Epoch AI는 최소 23/113 과제에서 false negative를 보고했다. 이 중 18건은 모델이 만든 테스트와 verifier의 hidden test가 이름·파일·도우미 함수에서 충돌한 사례였다.'
  - '해석 원칙: false negative는 올바른 패치가 실패로 채점될 수 있음을 뜻한다. 점수 차이를 모델 능력의 확정적 순위로 보지 말고, task 표본·grader·공통 harness 및 설정을 확인한다.'
  source: https://deepswe.datacurve.ai/blog/deepswe-v1-1
  sources:
  - label: Datacurve — DeepSWE 태스크·v1.1 verifier 구조
    url: https://github.com/datacurve-ai/deep-swe
  - label: Datacurve — live leaderboard와 갱신일
    url: https://deepswe.datacurve.ai/
  - label: Epoch AI — 독립 DeepSWE v1.1 benchmark review
    url: https://epoch.ai/benchmarks/deepswe/review
  interview: '벤치마크 점수에서 false negative가 반복되면 모델 비교와 리더보드 해석에 어떤 영향을 주나요?'
  answer: '정답에 맞는 패치도 grader 결함 때문에 실패로 기록되어 pass rate가 낮아질 수 있고, 모델별 테스트 작성 습관이 다르면 비교 편향도 생긴다. 따라서 점수만 보지 말고 verifier가 패치를 어떻게 적용하는지, hidden test와 충돌하는지, 문제 사례가 어느 정도인지 독립 검토와 원시 결과로 확인한다.'
- category: ai
  level: 중급
  title: Context7 — 버전별 라이브러리 문서를 에이전트에 연결하고 결과를 검증하기
  summary: 'Context7은 코딩 에이전트가 라이브러리 문서와 예제를 검색하도록 돕는 Upstash 서비스다. MCP로 `resolve-library-id`와 `query-docs`를 호출하거나, CLI의 `ctx7 library`와 `ctx7 docs`를 쓸 수 있다. 프로젝트 버전을 지정하면 해당 버전 문서를 우선 검색하지만, 가장 가까운 색인 버전이 반환될 수 있고 색인 갱신 주기도 보장되지 않는다. 검색 결과는 정답이 아니므로 중요한 API는 공식 원문과 설치된 의존성 버전으로 대조한다.'
  points:
  - '선택 흐름: MCP 또는 CLI+Skills에서 라이브러리 ID를 찾고 질문에 맞는 문서·코드 예제를 가져온다. 검색어에 실제 의존성 버전을 지정하고, 반환된 버전과 출처 평판을 확인한다.'
  - '범위 한계: 지정 버전이 없으면 가장 가까운 색인 버전이 쓰일 수 있다. 문서 색인의 갱신 시점은 보장되지 않으며 커뮤니티 기여 문서도 포함될 수 있다. 공식 문서와 실제 빌드 설정으로 교차 검증한다.'
  - '데이터 경계: hosted 서비스에는 검색 query가 전달된다. CLI 사용량 telemetry는 `CTX7_TELEMETRY_DISABLED=1`로 끌 수 있지만, 이는 update check를 끄지 않는다. 민감정보를 query에 넣지 말고 필요하면 on-prem 배포를 검토한다.'
  - '관심 신호: 2026-11-23 GitHub 저장소 약 65.3k★·3.3k forks. MIT 라이선스는 공개 저장소 코드에 적용되며, hosted API·파싱·크롤링 백엔드는 비공개다. 별 수는 채택·정확성의 증거가 아니다.'
  source: https://github.com/upstash/context7
  sources:
  - label: Context7 README — 기능·설치 경로·공개/비공개 범위
    url: https://github.com/upstash/context7
  - label: Context7 CLI — 버전 선택·MCP/CLI setup·telemetry 설정
    url: https://context7.com/docs/clients/cli
  - label: Context7 API Guide — 검색 흐름과 사용량
    url: https://context7.com/docs/api-guide
  - label: Context7 데이터 처리 부록 — query·사용 패턴·출력 정확도 고지
    url: https://upstash.com/trust/context7addendum.pdf
  - label: GitHub Releases — 최근 CLI/MCP 릴리스
    url: https://github.com/upstash/context7/releases
  interview: 'Context7에서 특정 라이브러리 버전 문서를 가져와도 공식 API 사용을 검증해야 하는 이유는 무엇인가요?'
  answer: '버전 지정은 해당 버전 또는 가장 가까운 색인 버전을 고르는 힌트이지 색인 최신성이나 정확성을 보장하지 않는다. 커뮤니티 문서가 포함될 수 있고 hosted 서비스에는 query가 전송된다. 결과의 버전·출처를 확인하고 공식 문서와 실제 의존성으로 대조하며, 비밀정보는 query에 넣지 않는다.'
- category: ai
  level: 고급
  title: Claude Code 코드 리뷰 — 프롬프트가 요구한 에이전트 수와 실제 실행을 대조하기
  summary: 'Claude Code에는 내장 `/code-review`와 별도 공식 플러그인의 리뷰 명령이 있다. 플러그인은 PR 상태 확인, CLAUDE.md 수집, 변경 요약 뒤 네 리뷰 에이전트를 병렬 실행하고, 발견 이슈를 다시 검증해 80점 미만을 걸러내도록 지시한다. 반면 내장 리뷰는 버전과 모델에 따라 여러 subagent 대신 간결한 inline prompt를 사용할 수 있다. 더 중요한 점은 명령 파일의 절차가 매 실행에서 보장되는 것은 아니라는 것이다. GitHub Actions 사용자는 일부 버전에서 리뷰 에이전트가 생략됐는데도 "문제 없음" 코멘트가 게시됐다고 보고했다. 따라서 자동 리뷰를 CI gate로 쓸 때는 성공 종료나 빈 finding만 믿지 말고, 실제 agent 호출·diff 검토 범위·실패 여부를 실행 기록에서 확인한다.'
  points:
  - '명령 구분: 내장 `/code-review`와 플러그인 명령은 별도 구현이다. 플러그인이 활성화된 경우 실제로 선택된 이름과 실행 경로를 확인한다.'
  - '플러그인 문서의 설계: 4개 리뷰 agent, 이슈별 재검증, 0–100 신뢰 점수, 80 미만 필터. 이는 검토 절차이지 그 자체로 실행 증거는 아니다.'
  - '2026-11-23 확인: 공개된 open issue에는 v2.1.316 CI에서 agent 생략 사례가 보고돼 있다. 이는 사용자 보고이며, 모든 버전·모델·실행에서 재현된다는 뜻은 아니다.'
  - '검증 원칙: CI에서 agent 호출·대상 PR의 diff 범위·검토 완료 상태를 로그나 trace로 확인하고, 요구된 단계가 빠지면 “문제 없음”으로 통과시키지 않는다.'
  source: https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-review/README.md
  sources:
  - label: Claude Code 공식 code-review 플러그인 README — 명령과 4-agent 설계
    url: https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-review/README.md
  - label: 공식 플러그인 명령 원문 — 단계·검증·코멘트 조건
    url: https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-review/commands/code-review.md
  - label: Claude Code v2.1.274 릴리스 — 일부 모델에서 inline review prompt 사용
    url: https://github.com/anthropics/claude-code/releases/tag/v2.1.274
  - label: Claude Code issue #100401 — CI에서 리뷰 agent가 생략됐다는 사용자 보고
    url: https://github.com/anthropics/claude-code/issues/100401
  - label: Claude Code issue #69232 — 내장·플러그인 리뷰 명령 구분 혼란
    url: https://github.com/anthropics/claude-code/issues/69232
  interview: 'AI 코드 리뷰 명령의 문서가 네 개의 reviewer agent를 지정하는데 CI가 성공하고 “문제 없음”이라고 끝났다면, 리뷰가 완료됐다고 판단하기 전에 무엇을 확인해야 하나요?'
  answer: '세션 로그나 trace에서 reviewer의 실제 agent 호출과 대상 diff가 충분히 읽혔는지, 필요한 검증 단계가 실행됐는지 확인한다. 성공 종료와 빈 finding은 실행 완료의 증거가 아니므로, 절차가 빠지면 CI를 실패시키거나 사람 검토로 넘긴다.'
- category: ai
  level: 중급
  title: Spotify Honk — Agent SDK·K8s pods·Slack @Honk·Fleet Management 위 백그라운드 agent
  summary: 'Spotify의 백그라운드 코딩 에이전트 Honk는 기존 Fleet Management 플랫폼에 연결된다. Fleetshift가 대상 저장소·일정·진행 상황을 관리하고, Honk가 자연어 지시로 복잡한 코드 변경을 만든다. 2026년 Spotify 글에 따르면 Honk는 Claude Agent SDK를 사내 harness로 감싸 Kubernetes pod에서 병렬 실행하며, trusted tools와 여러 OS의 CI build로 변경을 검증한다. Anthropic 사례 페이지는 agent가 월 650건 이상 PR을 병합하고 복잡한 마이그레이션 시간을 최대 90% 줄였다고 보고한다. 이는 공급자 사례의 수치다. Spotify가 말한 Fleet Management의 누적 250만 건 이상 자동 유지보수 PR은 더 넓은 자동화 시스템의 수치이며 Honk 결과와 합산하면 안 된다. 교훈은 모델보다 대상·검증·소유권 정보를 제공하는 플랫폼과 표준화가 대규모 자동 변경을 가능하게 한다는 점이다.'
  points:
  - '역할 분리: Fleetshift는 대상·스케줄·진행 상황, Honk는 복잡한 의미 기반 코드 변경을 담당한다. 반복 가능한 단순 수정은 기존 자동화로 처리한다.'
  - '실행·검증: Claude Agent SDK + Spotify harness + Kubernetes pod에서 여러 작업을 병렬 실행하고, trusted tools와 여러 OS의 CI build로 결과를 확인한다. Slack 대화에서 @Honk를 부르면 PR 작업을 시작할 수 있다.'
  - '운영 기반: Backstage가 component 소유자·문서·도구를 제공하고, 기술 표준·lint/static analysis가 agent의 변경을 검증하는 guardrail이 된다.'
  - '수치의 범위: Anthropic은 Honk의 월 650+ 병합 PR과 최대 90% 시간 절감을 사례로 제시한다. Spotify의 250만+는 Fleet Management 전체의 누적 자동 유지보수 PR이며 agent 성과와 다른 지표다.'
  source: https://engineering.atspotify.com/2026/6/code-with-claude-coding-is-no-longer-the-constraint
  sources:
  - label: Spotify Engineering — Honk·Fleetshift·Backstage·CI 운영 구조 (2026-06)
    url: https://engineering.atspotify.com/2026/6/code-with-claude-coding-is-no-longer-the-constraint
  - label: Spotify Engineering — 1,500+ AI PR 및 migration 도입 배경 (2025-11)
    url: https://engineering.atspotify.com/2025/11/spotifys-background-coding-agent-part-1
  - label: Anthropic 고객 사례 — Honk의 월간 agent PR 및 migration 시간 수치
    url: https://claude.com/customers/spotify
  interview: 'Spotify의 Honk 사례에서 Fleetshift와 agent harness를 분리한 이유는 무엇이며, PR 생성 후 어떤 증거로 변경을 검증하나요?'
  answer: 'Fleetshift는 저장소 선택·일정·작업 상태 같은 대규모 orchestration을 맡고, Honk는 복잡한 의미 기반 코드 변경을 맡아 각 계층의 책임을 분리한다. 변경은 trusted tools로 실행하고 multi-OS CI build에서 검증한다. Backstage의 소유권·문서와 표준·lint도 guardrail로 쓰며, AI agent PR 수와 전체 Fleet Management 자동 PR 수는 서로 다른 범위의 지표로 비교해야 한다.'
- category: ai
  level: 중급
  title: mini-SWE-agent — 작은 에이전트로 모델·실행 환경을 비교하는 법
  summary: 'mini-SWE-agent v2는 핵심 agent class가 약 100줄인 미니멀 코딩 에이전트다. bash만 도구로 쓰고 각 명령을 독립 실행하며, 대화 이력은 선형으로 쌓인다. 이 단순한 구조는 실행 기록을 추적하고 모델·sandbox 환경을 바꿔 비교하기 좋다. 다만 bash 실행 자체가 sandbox는 아니다. 프로젝트 README의 SWE-bench 점수는 특정 설정의 프로젝트 주장으로 읽고, 현재 leaderboard에서 같은 benchmark·환경·모델 설정인지 확인해야 한다.'
  points:
  - '실행 흐름: bash action을 `subprocess.run`으로 각각 실행해 persistent shell 상태를 줄인다. 컨테이너 등 격리는 실행 환경이 별도로 제공해야 한다.'
  - '관찰 가능성: 선형 대화 이력은 모델에 보낸 입력과 agent trajectory를 맞춰 보기 쉬워 디버깅·fine-tuning baseline에 유용하다.'
  - '벤치마크 읽기: SWE-bench Verified는 500개 human-filtered task다. leaderboard에는 mini-SWE-agent 환경을 공통 적용한 별도 Bash Only 500-task 비교도 있으므로 점수만 떼어 비교하지 않는다.'
  source: https://github.com/SWE-agent/mini-swe-agent
  sources:
  - label: mini-SWE-agent v2 README — 구조·실행 모델·프로젝트 벤치마크 주장
    url: https://github.com/SWE-agent/mini-swe-agent
  - label: SWE-bench 공식 leaderboard — task subset과 비교 환경
    url: https://www.swebench.com/
  interview: 'mini-SWE-agent의 선형 history와 독립 bash 실행은 실험에 어떤 도움을 주나요? README의 74%+ 점수를 다른 에이전트와 비교할 때는 무엇을 확인해야 하나요?'
  answer: '선형 history는 모델 입력과 실행 trajectory를 추적하기 쉽게 하고, 독립 실행은 각 action의 재현·환경 교체를 단순하게 한다. 단, subprocess 실행만으로 격리되는 것은 아니다. 74%+는 README의 프로젝트 주장으로, benchmark subset, 모델, 실행 환경과 harness가 같은지 leaderboard에서 확인한 뒤 비교해야 한다.'
- category: ai
  level: "중급"
  title: Android Studio Gemini — 무료·API 키·Enterprise의 비용과 데이터 경계
  summary: "Android Studio의 Gemini 기능은 계정 티어에 따라 사용량과 코드 데이터 처리 조건이 다르다. 무료 티어에는 제한된 일일 사용량이 있고, 채팅에 직접 입력한 코드는 Gemini 학습에 사용될 수 있다. 개인 API 키는 토큰별 과금과 더 큰 context를 제공하며 입력 코드 학습에 사용하지 않는다. Google One도 더 높은 한도와 확장 context를 제공한다. Android Studio Agent Mode 자체의 구현 흐름은 별도 카드에서 다룬다."
  points:
  - "무료 개인 티어 — 일일 한도와 context가 제한적이며, 입력한 코드가 AI 개선에 사용될 수 있음"
  - "개인 Gemini API 키 — 토큰별 과금; 더 큰 context와 뒤의 모델 사용 가능, 입력 코드는 모델 학습에 사용하지 않음"
  - "Google One AI Pro/Ultra — 높은 사용 한도·확장 context; Business는 Gemini Enterprise 또는 Google Developer Program 경로와 중앙 관리·데이터 거주 옵션 제공"
  - "공통 기능에는 Agent Mode·Compose UI 지원·Gradle/Logcat 문제가 포함되지만, 실제 코드를 보낼 context-awareness는 설정과 `.aiexclude` 경계 확인"
  source: https://developer.android.com/studio/gemini/overview
  sources:
  - label: Android Studio AI tiers and feature comparison
    url: https://developer.android.com/studio/gemini/feature-comparison
  - label: Gemini in Android Studio data and privacy
    url: https://developer.android.com/studio/gemini/data-and-privacy
  - label: Add your own Gemini API key
    url: https://developer.android.com/studio/gemini/add-api-key
  interview: "Android Studio Gemini 무료 티어와 개인 API 키 사용을 비용·코드 데이터 관점에서 비교해보세요."
  answer: "무료 티어는 제한된 일일 한도를 제공하고 직접 입력한 코드는 모델 학습에 사용될 수 있다. 개인 API 키는 토큰별 비용이 발생하지만 더 큰 context와 모델 선택권을 제공하며 입력 코드를 모델 학습에 사용하지 않는다. 코드 context 공유 설정은 별도이므로 필요성을 검토하고 `.aiexclude`로 민감한 파일을 제한한다."
- category: ai
  level: "중급"
  title: Kiro Specs — 요구사항·설계·작업을 검토 가능한 단계로 나누기
  summary: "Kiro Specs는 기능이나 버그 수정을 문서와 추적 가능한 작업으로 바꾼다. Feature Spec은 `requirements.md`(또는 Design-First 흐름) → `design.md` → `tasks.md`, Bugfix Spec은 `bugfix.md` → 설계 → 작업으로 진행한다. 현재 Quick Spec은 이를 한 번에 생성하며 단계별 승인 게이트가 없다. 요구가 불분명하거나 위험이 큰 작업에는 단계별 검토가 가능한 표준 Spec이 더 적합하다."
  points:
  - "Feature: Requirements-First 또는 Design-First로 문제와 수용 기준, 구조를 먼저 검토하고 실행 가능한 task로 쪼갠다."
  - "Bugfix: 현재·기대·유지할 동작을 분석하고 원인·수정·회귀 방지로 계획한다."
  - "Quick Spec은 한 번에 만들고 승인 단계가 없다. 작고 분명한 작업에 쓰고, 불확실하거나 회귀 위험이 큰 변경은 표준 Spec에서 단계별 검토한다."
  - "Run all tasks는 dependency graph 기준으로 독립 작업을 wave 안에서 병렬 실행한다. Free tier는 월 50 credits이며 spec/task 실행도 credits를 쓴다."
  source: https://kiro.dev/docs/specs/
  sources:
  - label: Kiro Specs — artifact, task execution, platform coverage
    url: https://kiro.dev/docs/specs/
  - label: Quick Spec — one-pass generation without approval gates
    url: https://kiro.dev/docs/specs/quick-spec/
  - label: Bugfix Specs — root cause and regression prevention
    url: https://kiro.dev/docs/specs/bugfix-specs/
  - label: Kiro Pricing — current credits and plan allowances
    url: https://kiro.dev/pricing/
  interview: "Kiro에서 요구가 불분명하거나 회귀 위험이 큰 기능을 Quick Spec으로 바로 구현하지 않고 표준 Spec으로 나눌 이유는 무엇인가요?"
  answer: "Quick Spec은 요구사항·설계·작업을 한 번에 만들고 단계별 승인 게이트가 없다. 불확실하거나 위험이 큰 변경은 표준 Feature/Bugfix Spec에서 각 문서를 검토하고 수정한 뒤 실행해야 잘못된 가정이 구현과 병렬 task로 퍼지는 것을 줄일 수 있다. 생성된 task도 결과 검증이 필요하며 Spec과 task 실행은 Kiro credits를 소비한다."
- category: ai
  level: 중급
  title: Amp — 코딩 에이전트에서 작업 스레드·모델 선택·비용 경계를 설계하기
  summary: 'Amp는 로컬 CLI·원격 orb·연결된 runner에서 에이전트를 실행하고, 대화와 도구 실행을 하나의 공유 가능한 thread로 보존한다. thread는 작업 이력이지 자동으로 프로젝트 규칙을 기억하는 전역 메모리는 아니다. 기본 subagent(Task)는 별도 context에서 일을 수행하지만 thread와 같은 모델·추론 수준을 사용한다. Amp는 2025년 Sourcegraph에서 분사한 독립 연구소 제품이며, 예전 “무제한 토큰”·모드별 모델 다이얼 설명은 현재 요금·모델 선택 화면과 다르다.'
  points:
  - '작업 단위: thread는 프롬프트·응답·도구 호출·수정 파일을 보존하며 CLI·웹·모바일에서 이어 볼 수 있다. thread를 팀과 공유할 때 접근 범위를 확인하고, 공개적으로 검색되는 thread 공유와 fork 기능은 현재 제공되지 않는다.'
  - '위임과 모델: Task subagent는 독립 context에서 조사·구현을 맡고 결과를 메인 thread에 돌려준다. 기본적으로 부모와 같은 모델/추론 수준이며, Oracle은 별도 plugin/tool이지 자동으로 더 강한 모델을 보장하는 기능이 아니다.'
  - '비용과 자동화: Hobby는 무료지만 모델 사용에는 자체 provider key/연결된 구독 등을 쓸 수 있고 Amp-hosted orb는 종량 과금이다. 유료 tier에는 포함 사용량이 있다. `amp -x "요청"`은 비대화형으로 한 번 실행하고 종료하며, `AMP_API_KEY`를 사용해 스크립트에서 인증할 수 있다.'
  - '규칙 파일: 프로젝트 지침은 `AGENTS.md`에 둔다. `AGENT.md` 또는 `CLAUDE.md`도 인식될 수 있으므로, 이를 Amp 전용의 보편 규격처럼 혼동하지 않는다.'
  source: https://ampcode.com/docs/threads
  sources:
  - label: Models and subagents
    url: https://ampcode.com/docs/models-and-subagents
  - label: Current pricing and usage
    url: https://ampcode.com/pricing
  - label: Execute mode and API-key authentication
    url: https://ampcode.com/docs/cli/execute-mode
  - label: AGENTS.md guidance
    url: https://ampcode.com/docs/customize/agents-md
  interview: "Amp의 thread, subagent, AGENTS.md는 각각 어떤 문제를 해결하며, 무엇을 보장하지 않나요?"
  answer: "Thread는 작업 기록·재개·공유 단위이고, subagent는 분리된 context에서 일부 작업을 위임하는 수단이다. AGENTS.md는 코드베이스 지침이다. Thread가 자동으로 규칙 메모리가 되거나, 기본 subagent가 다른/더 강한 모델을 쓰거나, 지침이 검증을 대신하지는 않는다. 비용은 선택한 모델·실행 환경·요금제에 따라 확인한다."
- category: ai
  title: Repomix — 레포 전체를 'AI 친화 단일 파일' 하나로 싸서 LLM에 통째로 먹이는 패커(MIT·~26.3k★)
  summary: 'Repomix는 코드베이스 전체를 LLM이 소화하기 좋게 단일 파일 하나(repomix-output.xml 등)로 묶어주는 오픈소스 도구로, GitHub ~26.3k★·MIT 라이선스다(yamadashy/repomix). 에이전트가 도구로 코드를 탐색하지 않는 상황 — ChatGPT·Gemini·Claude 웹/데스크톱에 레포 맥락을 통째로 붙여 넣고 싶을 때 — 이 진가를 발휘한다. `npx repomix`만 치면 현재 디렉터리를 한 파일로 패킹한다. 수작업 파일 복사·붙여넣기를 없애주고, 버그 조사·보안 감사·구현 계획·서드파티 라이브러리 문서화 같은 ''레포 스냅샷이 필요한'' 작업에 그대로 쓰인다. LLM 친화 출력을 위해 XML/Markdown/플레인 등 포맷을 고르고, 토큰 수를 세어주며, 보안상 민감 정보(시크릿) 탐지·코드 압축으로 토큰을 줄이는 옵션도 제공한다.

    '
  points:
  - '사용법: `npx repomix`로 설치 없이 현재 레포를 단일 파일로 패킹 → 그 파일을 LLM 채팅에 붙여 넣으면 전체 프로젝트 맥락 확보. repomix.com 웹 인터페이스와 GitHub 페이지에 ''Pack'' 버튼을 다는 크롬 확장도 있음'
  - 'AI 친화 출력: XML·Markdown·플레인 등 포맷 선택, 토큰 카운팅으로 컨텍스트 예산 가늠, 코드 압축(주석 제거 등)으로 토큰 절감 — ''에이전트가 못 도는'' 모델에 레포를 통째로 넣을 때의 비용/한도 문제를 직접 다룸'
  - '안전장치·용도: 시크릿 탐지로 민감 정보 유출 방지, 클론 없이 원격 레포 패킹 지원. 권장 용도는 버그 조사·보안 감사·구현 계획·서드파티 라이브러리 문서화 등 레포 스냅샷이 필요한 작업(JSNation Open Source Awards 2025 ''Powered by AI'' 후보)'
  source: https://github.com/yamadashy/repomix
- category: ai
  title: 하네스 엔지니어링(Harness Engineering) — '모델 말고 모델 둘러싼 모든 것'을 설계해 에이전트 실패를 구조로 막기
  summary: 'Martin Fowler 사이트(Birgitta Böckeler, 2026-04-02)는 ''하네스(harness)''를 "AI 에이전트에서 모델을 뺀 모든 것"으로 정의한다 — 즉 도구·피드백 루프·안전 경계·검증 시스템 전체. 핵심 발상은 "에이전트가 실수하면 그때그때 고치지 말고, 그 실수를 두 번 다시 못 하게 하는 해법(주로 더 나은 하네스)을 만든다"는 것으로, 같은 모델을 그대로 두고 하네스만 바꿔도 성능이 크게 움직인다. 실제로 LangChain은 모델이 아니라 하네스를 바꿔 Terminal-Bench 2.0 점수를 52.8%→66.5%로 끌어올렸다(주장). Fowler 글은 자기교정 확률을 높이는 ''builder harness''와 사람의 개입을 꼭 필요한 곳에만 두는 ''user harness''를 구분하고, 환경을 에이전트가 읽고 다루기 쉽게 만드는 ''ambient affordances''와 토폴로지를 좁혀 가변성을 줄이는 접근을 제시한다.

    '
  points:
  - '정의: 하네스 = 에이전트에서 ''모델을 제외한 전부''(도구 오케스트레이션·검증 루프·컨텍스트/메모리·가드레일·관측성). ''AI 에이전트 성능은 모델이 아니라 하네스가 결정한다''가 2026년의 합의'
  - '핵심 원칙: 에이전트가 실수하면 즉석 수정이 아니라 ''다시는 그 실수를 못 하게 하는 해법''을 하네스로 만들어 영구화 — 같은 모델로도 점수가 출렁(LangChain Terminal-Bench 52.8%→66.5%는 하네스만 교체한 결과라는 주장)'
  - 'Fowler/Böckeler 프레임: ''builder harness''(자기교정 유도)와 ''user harness''(사람 개입을 필요한 지점에만)로 분리, ''ambient affordances''(환경을 에이전트가 읽기 쉽게)·토폴로지 고정으로 가변성 축소 — 좋은 하네스는 사람 입력을 없애는 게 아니라 ''중요한 곳으로'' 돌린다'
  source: https://martinfowler.com/articles/harness-engineering.html
- category: ai
  title: Agent Skills(SKILL.md) — Anthropic가 연 'Skill 한 번 만들면 어떤 에이전트서나' 오픈 표준, Cursor·Codex·Gemini CLI까지 채택
  summary: 'Agent Skills는 Anthropic이 만들어 오픈 표준으로 공개한, AI 에이전트에 전문 지식·워크플로를 주입하는 경량 포맷이다. 핵심은 SKILL.md 한 파일을 담은 폴더 — 메타데이터(name·description)와 지침을 적고, 스크립트·참고문서·템플릿을 함께 묶을 수 있다. Claude Code 전용이 아니라 Cursor·OpenAI Codex·Gemini CLI·GitHub Copilot·VS Code·OpenHands·Goose·Roo Code 등 수십 개 도구가 같은 포맷을 채택해, "한 번 만들면 어디서나 쓰는" 크로스 제품 재사용이 핵심 가치다.

    '
  points:
  - '구조: 폴더 + 필수 SKILL.md(메타 name·description + 지침), 선택적으로 scripts/·references/·assets/ 번들. 별도 SDK·플러그인 형식이 아니라 마크다운 파일 하나가 진입점'
  - '동작은 ''점진적 공개(progressive disclosure)'' 3단계 — ①Discovery: 시작 시 name·description만 로드 ②Activation: 작업이 description과 매칭되면 본문 전체를 컨텍스트로 ③Execution: 필요할 때만 번들 코드·참고파일 로드. 그래서 스킬 수십 개를 달아도 컨텍스트 footprint가 작다'
  - '표준 채택 현황(agentskills.io 클라이언트 쇼케이스 기준): Claude Code/Claude·Cursor·OpenAI Codex·Gemini CLI·GitHub Copilot·VS Code·OpenHands·Goose·Roo Code·Amp·Factory·Kiro·Letta 등. openai/skills(Codex용 Skills Catalog)는 22.3k★. Anthropic이 발원해 오픈 표준으로 풀고 생태계가 확장 중'
  source: https://agentskills.io
- category: ai
  title: OpenHands(All-Hands-AI) — 에이전트의 모든 행동을 'Docker 샌드박스'에서 돌리는 오픈소스 코딩 에이전트(MIT·~77k★)
  summary: 'OpenHands(옛 OpenDevin)는 코드를 짜고 수정할 뿐 아니라 명령 실행·웹 브라우징·API 호출까지 사람 개발자처럼 하는 오픈소스 자율 코딩 에이전트다. 핵심 차별점은 에이전트의 모든 행동을 격리된 Docker 런타임(샌드박스)에서 실행한다는 점 — 로컬 환경을 직접 건드리지 않고 컨테이너 안에서 셸·파일 편집·브라우저를 돌린다. CLI·웹 GUI·Cloud·Agent SDK 등 여러 형태로 쓰며 특정 모델에 묶이지 않고 다양한 LLM 공급자를 붙일 수 있다. 라이선스는 MIT(단, enterprise/ 디렉터리는 별도)이며 README 기준 약 77k★다.

    '
  points:
  - 샌드박스 우선 설계 — 에이전트의 bash 실행·파일 편집·브라우징이 격리된 Docker 컨테이너 런타임 안에서 일어나, 자율 에이전트가 호스트를 망칠 위험을 구조로 줄인다(표준 설치도 Docker 기반)
  - 한 코어, 여러 표면 — 동일 엔진을 CLI(헤드리스 포함)·웹 GUI·OpenHands Cloud·파이썬 Software Agent SDK로 노출. 모델 비종속이라 Claude·GPT 등 원하는 LLM 공급자를 끼운다
  - SWE-bench Verified 상위권을 '주장' — 공식은 77.6% 해결(검증된 리더보드 수치라기보다 프로젝트 측 주장으로 받아들일 것). 라이선스 MIT·~77k★, '87% 버그 티켓 당일 해결' 류 마케팅 수치는 검증 안 됨
  source: https://github.com/All-Hands-AI/OpenHands
- category: ai
  title: android/skills(Google 공식) — Android 개발 베스트프랙티스를 'SKILL.md'로 에이전트에 주입하는 공식 스킬 묶음(Apache-2.0·~5.8k★)
  summary: 'Google Android 팀이 직접 내는 공식 에이전트 스킬 저장소다. developer.android.com의 모범 사례를 Agent Skills 오픈 표준(SKILL.md) 형식으로 묶어, LLM이 약한 Android 작업에서 헛짚지 않도록 ''근거''를 깔아 준다. Expo의 expo/skills에 대응하는 네이티브 Android판 격으로, 2026-04-20 발표 뒤 빠르게 성장했고 현재 약 5.8k★·Apache-2.0 라이선스다. CLI가 감지된 모든 에이전트에 스킬을 깔아 주며(기본값 Gemini·Antigravity), LLM이 이미 잘하는 영역이 아니라 ''평가상 못하는 워크플로''를 골라 채우는 게 설계 방향이다.

    '
  points:
  - 공식·검증된 정보만 — Apache-2.0, 최신 릴리스 v1.0.2(2026-06-11), Agent Skills(SKILL.md) 오픈 표준 사용. 별 수(~5.8k★)는 시점에 따라 변하는 GitHub 수치이니 '주장'으로 볼 것
  - 실제 수록 스킬 예시 — jetpack-compose, navigation/navigation-3, performance/r8-analyzer, testing/testing-setup, system/edge-to-edge, build/agp/agp-9-upgrade, camera/camera1-to-camerax, wear/jetpack-compose-m3 등 마이그레이션·도구 워크플로 중심
  - 설계 철학 — 'LLM이 못하는 곳을 메운다'. 이미 잘하는 영역이 아니라 평가에서 underperform하는 use case를 겨냥하고, 외부 공개 기여는 현재 받지 않는다(공식 README 기준)
  source: https://github.com/android/skills
- category: ai
  title: Vibe Kanban(BloopAI) — Claude Code·Codex·Gemini CLI 여러 에이전트를 '칸반 보드'로 병렬 돌리는 오케스트레이션 레이어(Apache-2.0·~27k★)
  summary: '여러 코딩 에이전트를 한 칸반 보드 위에서 동시에 굴리는 오픈소스 오케스트레이션 도구다. 각 작업을 ''workspace''로 띄우는데, workspace마다 별도 git 브랜치·터미널·dev 서버가 붙고 내부적으로 git worktree로 격리돼 에이전트들이 서로의 작업을 침범하지 못한다. 그 위에서 diff 리뷰, 앱 프리뷰, PR 생성까지 한 화면에서 한다. `npx vibe-kanban` 한 줄로 실행되고 Claude Code·Codex·Gemini CLI·Copilot· Amp·Cursor·OpenCode·Droid 등 10여 개 에이전트를 지원한다(공식 README 기준). 다만 README는 현재 "Vibe Kanban is sunsetting"이라 밝혀, 오픈소스 도구의 운영 지속성을 함께 따져야 하는 사례이기도 하다.

    '
  points:
  - 격리 모델 — workspace = 브랜치+터미널+dev서버 한 묶음, 그 토대가 git worktree. 에이전트가 main을 건드리지 않고 병렬로 돌게 만드는 게 핵심(Cursor 2.0·Conductor와 같은 worktree 계열 패턴)
  - 도구 비종속 — 한 보드에서 Claude Code·Codex·Gemini CLI·GitHub Copilot·Amp·Cursor·OpenCode·Droid·CCR·Qwen Code 등 '10+ 코딩 에이전트'를 섞어 쓴다. Rust(~50%)+TypeScript(~46%)로 작성
  - 지속성 주의 — README가 'Vibe Kanban is sunsetting'이라 명시하고 외부 PR도 사전 논의 없이는 받지 않는다. 별 수(~27k★)는 시점에 따라 변하는 GitHub 수치이니 '주장'으로 볼 것
  source: https://github.com/BloopAI/vibe-kanban
- category: ai
  title: 토스의 'Claude Code를 레이어드 아키텍처처럼' — 팀 지식을 Global/Domain/Local 3계층 플러그인으로 굳히기
  summary: '토스 기술블로그(toss.tech)는 코딩 에이전트를 ''개인 생산성 도구''에서 ''팀의 일하는 방식''으로 끌어올리는 패턴을 제안한다. 핵심은 흩어진 규칙·노하우를 Claude Code 플러그인에 담되, 그 지식을 세 계층으로 나누는 것이다 — 전사 공통(보안·코딩 스타일)은 Global, 결제·정산·회원 같은 도메인 로직은 Domain, 특정 레포의 구현 디테일은 Local. 이렇게 계층화된 플러그인이 모이면 그 자체로 ''살아있는 지식 베이스(Living Knowledge Base)''가 되고, 나아가 조직의 워크플로(예: /new-feature)를 배포하는 사내 마켓플레이스로 확장한다는 구상이다.

    '
  points:
  - 지식 3계층 — Global(전사 보안·코딩 스타일) / Domain(팀·비즈니스 도메인 로직) / Local(레포별 구현 디테일·프로젝트 규칙). 한 CLAUDE.md에 다 밀어넣지 말고 책임에 따라 쪼개라는 게 요지
  - 비유의 출처 — '이전 글에서 Claude Code 구조를 레이어드 아키텍처에 비유했듯, 플러그인이 담는 지식도 계층화할 수 있다'. 코드 아키텍처 사고를 '지식 관리'에 그대로 적용
  - 팀 스케일 — 계층화된 플러그인 묶음 = Living Knowledge Base → 워크플로를 배포하는 '마켓플레이스 1.0'으로 확장. 개인 팁이 아니라 조직 차원 표준화가 목표 (toss.tech 자체 글, 수치 주장 없음)
  source: https://toss.tech/article/harness-for-team-productivity
- category: ai
  title: Ruflo(전 claude-flow) — Claude Code 위에 'queen 에이전트가 worker 떼를 지휘하는' 멀티에이전트 스웜 하네스(MIT·~59.8k★)
  summary: 'Reuven Cohen(ruvnet)이 만든 오픈소스 멀티에이전트 오케스트레이션 레이어로, 2026년 초 ''claude-flow''에서 ''Ruflo''로 개명했다(README 기준 ~59.8k★, MIT). 핵심 구조는 queen 에이전트가 계획·위임하고 다수 worker 에이전트가 병렬 실행하는 hierarchical 스웜이며, mesh·ring·star 등 토폴로지와 합의 프로토콜을 지원한다. Claude뿐 아니라 GPT·Gemini·Cohere·Ollama로 라우팅되는 모델 비종속 하네스이고, npm 패키지는 ruflo(구 claude-flow 이름도 호환 유지)로 깐다. 단, 성능·도구 수치는 프로젝트 자체 주장이며 한 외부 감사는 ''주장된 MCP 도구 다수가 실제로는 동작 안 한다''고 지적했으니 수치는 그대로 믿지 말고 검증해서 쓰는 게 안전하다.

    '
  points:
  - '구조 — queen-led hierarchical 스웜: 한 에이전트가 작업을 쪼개 위임하고 worker들이 병렬 처리, SQLite/임베딩 기반 메모리로 세션 간 컨텍스트를 유지한다고 README가 설명. 100+ 에이전트·다수 플러그인·MCP 도구를 묶어 제공한다고 주장'
  - 모델 비종속 — 이름이 'Claude만'을 함의해 Ruflo로 개명. Claude·GPT·Gemini·Cohere·Ollama를 smart routing으로 갈아끼우며, npx ruflo / npx claude-flow 둘 다 같은 도구를 호출(하위호환)
  - 수치는 '주장'으로 — 속도·비용 절감·SWE 점수 등은 프로젝트 자체 벤치 주장이고, 2026년 한 독립 감사는 '광고된 MCP 도구·비용절감 수치가 실측과 어긋난다'고 반박. 도입 전 자기 환경에서 직접 측정 권장
  source: https://github.com/ruvnet/claude-flow
- category: ai
  title: Crush(Charm/charmbracelet) — Go로 짠 '예쁜 터미널' 코딩 에이전트, 세션 중에 LLM을 갈아끼우는 모델 비종속 TUI(~25.4k★)
  summary: 'TUI 라이브러리로 유명한 Charm(charmbracelet)이 만든 터미널 기반 코딩 에이전트로, Go로 작성됐고 README 기준 ~25.4k★·라이선스는 FSL-1.1-MIT다. 다른 터미널 에이전트들과 묶이는 범주(OpenCode·goose·Aider 부류)지만 차별점은 ''Charm다운'' 글래머러스한 TUI와 모델 비종속성이다. Anthropic·OpenAI·Groq·OpenRouter 등 다수 공급자를 지원하고 OpenAI/Anthropic 호환 엔드포인트면 뭐든 붙으며, 한 세션 안에서 LLM을 바꿔 끼울 수 있다. 프로젝트별로 컨텍스트가 분리되는 세션 기반이고, MCP를 http·stdio·sse 세 전송으로 확장한다.

    '
  points:
  - 정체성 — Charm 생태계(Bubble Tea 등 TUI 도구로 유명)가 내놓은 코딩 에이전트. Go 98%대, 라이선스 FSL-1.1-MIT, README상 ~25.4k★, macOS·Linux·Windows·BSD 계열까지 지원
  - 모델 비종속·세션 중 전환 — Anthropic/OpenAI/Groq/OpenRouter/Vercel AI Gateway 등 여러 공급자 지원, OpenAI·Anthropic 호환이면 연결, '세션 도중 LLM 교체' 가능. 프로젝트별 컨텍스트가 나뉘는 세션 기반
  - 설치·확장 — brew/npm(@charmland/crush)/winget/Arch/Nix/FreeBSD 등 패키지 다양, 'no configuration'으로도 동작하고 crush.json으로 설정. MCP를 http·stdio·sse로 붙여 도구 확장
  source: https://github.com/charmbracelet/crush
- category: ai
  title: '''Coding Beyond Your Training''(arXiv 2026) — Claude Code 도입이 개발자의 ''쓰는 언어·레포 폭''을 넓힌다는 5,838명 패널 연구'
  summary: '이코노미스트 Alexander Quispe가 2026년 5월 arXiv에 올린 워킹페이퍼로, AI 코딩 어시스턴트 도입이 개발자 개인의 ''기술적 프런티어''(다루는 언어·레포·커밋량)를 넓히는지를 GitHub 데이터로 추정한다. 2025-05~2026-01 사이 Claude Code가 GitHub에 퍼진 staggered rollout을 활용해, 개발자 5,838명을 28개월간 월 단위로 추적했다. ''첫 Claude 공동저자(Co-authored) 커밋'' 시점을 도입 기준으로 잡고, 아직 도입 안 한 개발자를 대조군으로 쓰는 staggered DiD 방식이다. 도입 후 월 커밋 +41개, 기여 레포 +1.5개, 사용 언어 수 +0.83, 신규 언어 +0.31 등 ''양''과 ''다양성''이 모두 늘었다고 보고한다.

    '
  points:
  - 데이터 — 개발자 5,838명을 28개월 월 단위 패널로 추적, 처치는 '첫 Claude-co-authored 커밋' 시점으로 정의, not-yet-treated를 대조군으로 쓰는 staggered DiD
  - 효과(추정치) — 월 커밋 +41, 기여 레포 +1.5, 사용 언어 +0.83, 신규 언어 +0.31. '많이 짠다'를 넘어 '안 쓰던 언어·레포로 폭이 넓어진다'가 핵심
  - 한계 — 단독 저자 워킹페이퍼(미동료심사)이고 관측 데이터 기반 인과 추정이라 '도입이 원인'이라 단정 말 것. 실무 함의는 '에이전트가 개발자의 기술 반경을 넓힌다'는 가설 정도로
  source: https://arxiv.org/abs/2605.25438
- category: ai
  title: superpowers(obra) — 'TDD·브레인스토밍·서브에이전트 리뷰'를 스킬로 강제하는 에이전트 방법론 프레임워크(MIT·~22.9만★)
  summary: 'Jesse Vincent(obra)이 만든 ''에이전트 스킬 프레임워크이자 소프트웨어 개발 방법론''으로, 깔아두면 코딩 에이전트가 작업을 시작할 때 자동으로 트리거되는 스킬 묶음을 준다. 핵심은 도구가 아니라 ''강제되는 워크플로''다. 에이전트는 먼저 목표를 캐묻고(brainstorming), 스펙·구현 계획을 만든 뒤, 작업마다 새 서브에이전트를 띄워 ''스펙 준수 → 코드 품질'' 2단계 리뷰를 거치며 자율적으로 진행한다. TDD 스킬은 RED-GREEN-REFACTOR를 강제하고 ''테스트 전에 짠 코드는 삭제''한다고까지 명시한다. 특정 도구에 묶이지 않고 Claude Code·Codex·Gemini CLI· Factory Droid·OpenCode·Pi 등에 각각 설치해 쓴다. GitHub API 기준 ~229.8k★·MIT, 최신 v6.0.0(2026-06-16).

    '
  points:
  - 강제되는 워크플로 — brainstorming(목표 캐묻고 대안 탐색→스펙), writing-plans, test-driven-development(RED-GREEN-REFACTOR 강제·테스트 전 코드는 삭제), systematic-debugging, requesting/receiving-code-review가 자동 트리거
  - 서브에이전트 주도 개발 — 작업마다 '새 서브에이전트'를 띄워 '스펙 준수 검토 → 코드 품질 검토' 2단계로 리뷰. 작성 패스와 리뷰 패스를 같은 컨텍스트에서 섞지 않는 게 설계 핵심
  - 도구 비종속 — Claude Code(/plugin install superpowers@claude-plugins-official)·Codex·Gemini(gemini extensions install)·Antigravity·Factory Droid·OpenCode·Pi 등 하네스별로 따로 설치. 사용자 지시가 항상 스킬보다 우선(CLAUDE.md가 'TDD 쓰지마'면 그게 이긴다)
  source: https://github.com/obra/superpowers
- category: ai
  title: claude-code-router(musistudio) — Claude Code 요청을 가로채 '작업 종류별로' 다른·싼 모델로 흘려보내는 라우팅 프록시(MIT)
  summary: 'Claude Code를 Anthropic 모델에만 묶지 않고, 로컬 프록시를 끼워 요청을 다른 공급자/모델로 라우팅하는 오픈소스 도구다. Anthropic ↔ OpenAI 포맷을 변환해주기 때문에 OpenRouter·DeepSeek· Ollama·Gemini 등 OpenAI 호환 API면 Claude Code 인터페이스 그대로 붙는다. 핵심은 ''한 모델로 다 처리''가 아니라 작업 성격에 따라 모델을 갈아끼우는 라우팅 규칙이다 — 기본 모델 외에 background(가벼운 백그라운드 작업), think(추론), longContext(긴 컨텍스트)처럼 라우터를 나눠, 백그라운드성 작업은 더 싸거나 로컬인 모델로 흘려보내 비용 천장을 거는 식이다. 세션 중 /model로 즉시 전환할 수도 있다. MIT 라이선스이며 Anthropic 공식 도구가 아닌 서드파티 프록시다.

    '
  points:
  - 동작 방식 — Claude Code와 모델 사이에 로컬 프록시를 두고 Anthropic↔OpenAI 포맷을 번역. OpenRouter·DeepSeek·Ollama·Gemini 등 OpenAI 호환 API면 무엇이든 백엔드로 붙는다
  - 작업별 라우팅(비용 최적화 핵심) — default 외에 background·think·longContext 등 라우터를 나눠, 가벼운 백그라운드 작업은 싸거나 로컬인 모델로 보내고 무거운 추론만 비싼 모델에 맡기는 식으로 천장을 건다. /model로 세션 중 즉시 전환도 가능
  - 주의 — 비공식 서드파티 프록시(MIT). 라우팅 대상에 비(非)Anthropic·로컬 모델을 섞을 수 있다는 게 장점이자, 모델별 출력 품질·포맷 호환은 사용자가 검증해야 한다는 뜻
  source: https://github.com/musistudio/claude-code-router
- category: ai
  title: ast-grep — 에이전트의 '찾아 바꾸기'를 텍스트가 아니라 '문법 트리(AST)'로 시키는 구조적 검색·치환 도구(Rust·MIT·~14.5k★)
  summary: 'ast-grep(명령어 sg)는 코드를 문자열이 아니라 tree-sitter로 파싱한 AST로 보고, ''패턴 매칭''으로 검색·린트·치환을 하는 Rust CLI다. 패턴은 평범한 코드처럼 쓰되 $MATCH 같은 ''$+대문자'' 와일드카드로 임의의 AST 노드 하나를 잡는다. 텍스트 정규식과 달리 언어 문법을 알기 때문에, 함수 호출·인자 구조 같은 ''의미 단위''를 정확히 잡아 대규모로 바꿀 수 있다. 그래서 LLM 에이전트가 ''sed로 막 치환하다 줄 어긋나는'' 실수 없이 코드를 안전하게 일괄 수정하게 하는 도구로 쓰인다(공식 agent-skill 저장소도 운영). 멀티코어를 쓰고 CLI로도 라이브러리로도 동작한다. (MIT, GitHub 기준)

    '
  points:
  - 무엇 — tree-sitter 기반 AST 패턴 매칭 CLI. 패턴을 코드처럼 쓰고 $MATCH/$$$ 같은 와일드카드로 노드를 잡아 search·lint·rewrite. YAML로 린트 규칙도 정의. 멀티코어 활용·jQuery식 AST 순회 API 제공
  - 왜 에이전트에 좋나 — 정규식/sed는 '텍스트'만 보니 들여쓰기·괄호·동일 이름 변수에서 오작동하기 쉽지만, ast-grep은 언어 문법을 알아 '구조 단위'로 정확히 치환한다. LLM이 대규모 리팩터를 줄 어긋남 없이 시키는 데 적합(ast-grep 공식 agent-skill 저장소 존재)
  - 한계(공식 명시) — 타입·제어흐름·데이터흐름·테인트 분석 같은 깊은 의미 정보는 없다(그쪽은 Semgrep 영역). 즉 '구문은 정확하지만 의미 추론은 못 한다'. 보안 룰셋이 필요하면 ast-grep만으론 부족
  source: https://github.com/ast-grep/ast-grep
- category: ai
  title: 컨텍스트 엔지니어링(Anthropic 공식) — '프롬프트 한 줄' 말고 '에이전트가 매 턴 보는 전체 토큰'을 설계하는 법
  summary: 'Anthropic 응용AI팀이 2025-09-29에 낸 엔지니어링 글로, 프롬프트 엔지니어링의 다음 단계를 ''컨텍스트 엔지니어링''으로 규정한다. 프롬프트가 ''잘 쓴 한 번의 지시''라면, 컨텍스트 엔지니어링은 추론 매 순간 컨텍스트 창에 무엇을 넣을지 ''큐레이션''하는 일이다. 핵심 원칙은 "원하는 결과가 나올 확률을 최대화하는, 가장 작은 고신호(high-signal) 토큰 집합"을 찾는 것 — LLM의 ''주의 예산(attention budget)''은 유한하고, 토큰이 많아질수록 성능이 떨어지는 ''context rot''이 생기기 때문이다. 길게 돌아가는 에이전트를 위해 compaction(대화 압축)·note-taking(외부 메모)·멀티에이전트(서브에이전트가 요약만 반환)·just-in-time 검색을 작업 유형별로 골라 쓰라고 권한다. (Anthropic 엔지니어링 블로그 기준)

    '
  points:
  - 정의 — 프롬프트 엔지니어링은 '한 번의 지시를 잘 쓰기', 컨텍스트 엔지니어링은 '에이전트가 매 턴 보는 컨텍스트 창 전체(시스템 프롬프트·도구 결과·히스토리·검색물)를 매 순간 큐레이션'하기. 시스템 프롬프트는 하드코딩 로직과 모호한 지침 사이 'right altitude(적정 고도)'를 노려라
  - 핵심 원칙 — '주의 예산'은 유한하고 토큰이 늘면 'context rot'으로 성능이 떨어진다. 그래서 목표는 '원하는 결과 확률을 최대화하는 가장 작은 고신호 토큰 집합'. 데이터는 미리 다 채우지 말고 lightweight identifier(파일경로 등)만 들고 런타임에 끌어오는 just-in-time 방식
  - '긴 작업용 3패턴 — ① compaction: 왕복 대화는 요약해 다시 채운다 ② note-taking: 마일스톤형 작업은 외부 메모로 기억 ③ 멀티에이전트: 서브에이전트가 수만 토큰을 쓰되 메인엔 1,000~2,000토큰 요약만 반환하고 리드가 종합. 작업 성격에 맞춰 골라 써라'
  source: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
- category: ai
  title: Roo Code의 '코드베이스 인덱싱' — 'grep만 쓰는' 에이전트 시대에 굳이 벡터DB(Qdrant)로 의미 검색을 거는 선택(Apache-2.0·~24.2k★)
  summary: '요즘 Claude Code·Cursor류 에이전트가 벡터DB를 안 띄우고 grep·파일트리·find으로 코드를 찾는 쪽으로 기울었지만, VS Code용 오픈소스 에이전트 Roo Code(Cline 포크)는 여전히 ''코드베이스 인덱싱''으로 의미 기반(semantic) 검색을 건다. 동작은 ① tree-sitter로 코드를 함수·클래스 같은 의미 블록(100~1000자)으로 쪼개고 ② 임베딩을 떠서 ③ Qdrant 벡터DB에 저장한 뒤, 에이전트에게 codebase_search 도구를 쥐여 준다. 그러면 "사용자 인증은 어디서 처리하나" 같은 자연어 질의로 정확한 텍스트 일치가 아니라 ''의미''로 코드를 찾는다. 대형·비공개·낯선 레포에서 grep으로 키워드를 모를 때 유리하다는 게 이 방식의 포지션이다. (GitHub·공식 문서 기준)

    '
  points:
  - 동작 3단계 — tree-sitter로 의미 블록(100~1000자, 미지원 언어는 줄 단위 폴백) 분할 → 임베딩 → Qdrant 벡터DB 저장. 에이전트엔 codebase_search 도구로 노출돼, 텍스트 일치 아닌 '의미'로 관련 코드를 찾게 한다
  - 임베딩은 8종 선택 — OpenAI·Google Gemini·Ollama·OpenAI Compatible·Mistral·Vercel AI Gateway·Bedrock·OpenRouter. 공식 문서는 '현재 무료'인 Gemini를 권하고, Ollama로는 완전 로컬 임베딩도 가능. Qdrant는 클라우드나 Docker 로컬로 띄운다
  - 왜 지금 논쟁거리냐 — 다수 프런티어 에이전트(Claude Code·Cursor류)는 벡터RAG 대신 grep/파일트리로 회귀했다는 평가가 많다. Roo Code는 반대로 '키워드를 모르는 대형·비공개 레포'에선 의미 검색이 낫다는 쪽. tree-sitter 기반이라 코드를 '문법 단위'로 잘라 인덱싱한다
  source: https://roocodeinc.github.io/Roo-Code/features/codebase-indexing
- category: ai
  title: Cline — VS Code 'Plan→Act' 코딩 에이전트 + 읽기 전용 서브에이전트(Apache-2.0·~63k★)
  summary: 'Cline은 VS Code·JetBrains·CLI/SDK로 동작하는 BYOK 멀티프로바이더 오픈소스 코딩 에이전트(Apache-2.0·~63k★). Plan/Act 2모드 — Plan에서 레포 탐색·질의·전략 수립, Act에서 diff·터미널·MCP 실행(기본 human-in-the-loop). Anthropic·OpenAI·Gemini·OpenRouter(200+)·Ollama/LM Studio까지. 2026 서브에이전트 — 메인이 명시적으로 띄우는 병렬 ''읽기 전용 탐색대'': 별도 컨텍스트로 코드베이스 조사 후 요약만 반환, 쓰기·MCP·파괴적 명령 불가. Claude Code 서브에이전트와 같은 컨텍스트 격리 발상이지만 탐색 전용으로 좁힘. Cursor(IDE)·Claude Code(터미널)와 달리 VS Code 확장+모델 비종속이 핵심.

    '
  points:
  - Plan/Act — Plan에서 전략·Act에서 편집/명령, diff·터미널 승인이 기본값
  - BYOK 멀티프로바이더 — OpenRouter·Ollama·Bedrock·Azure/Vertex, MCP(cline mcp) 지원
  - 읽기 전용 서브에이전트 — 병렬 탐색·영향 범위 조사, 결과 요약만 메인에 반환
  source: https://github.com/cline/cline
- category: ai
  title: Claude Squad — tmux+git worktree로 여러 코딩 에이전트를 한 터미널에서 병렬로 돌리는 TUI(AGPL·~7.8k★)
  summary: 'Claude Squad는 Claude Code·Codex·Gemini·OpenCode/Amp·Aider 같은 여러 AI 코딩 에이전트를 각자 격리된 작업공간에서 동시에 띄워 한 TUI로 관리하는 터미널 앱이다. 내부적으로 tmux로 각 에이전트 세션을 분리하고 git worktree로 작업물을 격리해, 한 레포 안에서 여러 태스크를 충돌 없이 병렬 진행한다. Conductor·Vibe Kanban 같은 GUI 오케스트레이터와 달리 터미널만으로 돌아가는 게 특징이며, 실행에는 tmux와 gh(GitHub CLI)가 필요하다.

    '
  points:
  - 여러 에이전트를 한 화면에서 — Claude Code 한 칸, Codex 한 칸, OpenCode 한 칸 식으로 각 태스크를 독립 세션으로 띄워 동시에 돌리고 TUI에서 전환
  - tmux + git worktree 격리 — 세션 분리는 tmux가, 작업물 충돌 방지는 worktree가 담당. -p(profile) 플래그로 에이전트별 설정 지정
  - 주의점 — tmux 의존이라 네이티브 Windows 미지원, 프롬프트 자동수락(--autoyes)은 실험적, 라이선스가 AGPL이라 이를 네트워크 서비스로 확장할 땐 검토 필요
  source: https://github.com/smtg-ai/claude-squad
- category: ai
  title: claude-plugins-official — 회사들이 직접 올린 177+ 플러그인이 모이는 Anthropic 공식 마켓플레이스(~30k★)
  summary: 'anthropics/claude-plugins-official은 Anthropic이 직접 큐레이션하는 Claude Code 플러그인 공식 마켓플레이스다. AWS·Microsoft·MongoDB·Cloudflare·Figma·Atlassian·Notion·Playwright 등 회사들이 자사 도구를 스킬·서브에이전트·MCP 서버·LSP 묶음으로 올려두고, 한 줄 명령으로 골라 깐다. 거기에 Anthropic이 직접 번들한 code-review·frontend-design·ralph-loop·claude-md-management, 그리고 Python·Rust·Go·Java 등 언어별 LSP 플러그인까지 들어 있다. 이름이 비슷한 claude-plugins-community(3rd party 검수본)와는 별개다.

    '
  points:
  - 설치 흐름 — 인터랙티브 첫 실행 시 자동 등록되며, 헤드리스/CI에선 `claude plugin marketplace add anthropics/claude-plugins-official`로 추가한 뒤 `/plugin install <이름>@claude-plugins-official`로 깐다(또는 `/plugin > Discover`로 탐색)
  - 무엇이 들었나 — 벤더 통합(aws-core·azure·mongodb·cloudflare·figma·github·playwright·context7·firecrawl…)부터 Anthropic 자체 워크플로(code-review·pr-review-toolkit·feature-dev·hookify·ralph-loop)와 사전제작 LSP(pyright·rust-analyzer·gopls·jdtls 등)까지 177개 이상
  - 주의 — 공식 마켓플레이스라도 Anthropic이 각 플러그인의 MCP 서버·코드를 통제하지 않는다고 명시. 설치·사용 전 신뢰할 수 있는 플러그인인지 직접 확인하라는 경고가 붙는다
  source: https://github.com/anthropics/claude-plugins-official
- category: ai
  title: Rakuten 도입 사례 — Claude Code가 1,250만 줄 vLLM에서 '7시간 무인 코딩'으로 기능 하나를 끝낸 기업 레퍼런스
  summary: 'Anthropic이 공개한 Rakuten 고객 사례다. ML 엔지니어 Kenta Naruse가 1,250만 줄 규모의 오픈소스 라이브러리 vLLM에 활성화 벡터 추출 기능을 구현하라고 시키자, Claude Code가 사람이 코드를 직접 안 쓰고 가끔 가이드만 주는 상태로 7시간을 연속 자율 작업해 한 번에 완성했다고 한다. 결과물은 레퍼런스 대비 99.9% 수치 정확도였고, 회사 전체로는 신규 기능의 출시 소요가 24일→5일(79% 단축)로 줄었다는 게 사례가 내세우는 지표다. 단 이는 Opus 4 출시 시점(2025)에 함께 발표된 벤더 측 마케팅 사례이며, 수치는 Rakuten·Anthropic의 자체 주장임에 유의.

    '
  points:
  - 핵심 수치(벤더 주장) — 7시간 연속 무인 코딩 / 출시 24일→5일(79%↓) / 복잡한 코드 수정 99.9% 정확도
  - '운영 패턴 — AI 담당 GM Yusuke Kaji의 표현: ''Claude Code에 4개를 위임하고 나는 1개에 집중해, 5개 작업을 병렬로 굴린다'''
  - 맥락·한계 — Opus 4 발표(2025)와 묶여 나온 고객 레퍼런스다. 1,250만 줄 코드베이스에서의 단일 작업 일화이며 통제된 벤치마크가 아니므로, 일반 성능 보장이 아니라 '엔터프라이즈 자율 코딩이 가능했다'는 사례로 읽어야 한다
  source: https://claude.com/customers/rakuten
- category: ai
  title: awesome-claude-code(hesreallyhim) — 스킬·훅·슬래시커맨드·오케스트레이터를 '한 분류에 검증된 하나'로 골라주는 정전(正典) 큐레이션 목록(CC BY-NC-ND·~46.6k★)
  summary: 'awesome-claude-code는 hesreallyhim이 관리하는 Claude Code 생태계의 ''정전'' 큐레이션 목록으로, GitHub에서 약 46.6k 스타·4.1k 포크·1,157 커밋까지 활발히 갱신되고 있다(레포에서 직접 확인되는 사실). 단순 링크 덤프가 아니라 스킬·훅·슬래시커맨드·에이전트 오케스트레이터·애플리케이션·플러그인·상태줄·개발 도구를 분류별로 모으고, 동작하지 않는 도구는 잘라내고 동작하는 것만 ''무슨 용도인지'' 태깅하는 방식이라 ''분류당 하나만 고르기''에 적합하다는 평가를 받는다. 이슈가 1,000건을 넘길 만큼 제출·검증이 활발하며, 레포 자체는 Python 98%로 구성된 자동 검증 파이프라인으로 목록을 관리한다. 라이선스는 CC BY-NC-ND 4.0(저작자표시·비영리·변경금지)이라 그대로 재배포·상업적 가공에는 제약이 있으니 ''읽고 도구를 고르는'' 용도로 쓰는 게 맞다.

    '
  points:
  - 쓰는 법 — 새 도구를 막 깔기 전에 '이 분류에서 이미 검증된 것'을 먼저 확인하는 색인으로 사용. 동작 안 하는 건 컷, 동작하는 건 용도 태깅(주장이 아닌 큐레이션 정책)
  - 범위 — 스킬·훅·슬래시커맨드·오케스트레이터·플러그인·상태줄·앱·개발툴을 한곳에. 비슷한 aggregator(everything-claude-code 등)는 '전부 쏟아내기'라 성격이 다름
  - 사실 — github.com/hesreallyhim/awesome-claude-code, ~46.6k★·4.1k fork·480 open issues, 라이선스 CC BY-NC-ND 4.0(비영리·변경금지라 재배포 제약 있음)
  source: https://github.com/hesreallyhim/awesome-claude-code
- category: ai
  title: OpenAI가 SWE-bench Verified를 버렸다 — '실패한 테스트 중 59%가 결함, 모델이 정답을 외운다'며 공식 점수 보고 중단(2026-02)
  summary: '2026년 2월, OpenAI의 Frontier Evals 팀은 코딩 에이전트 사실상 표준 지표였던 SWE-bench Verified의 점수 보고를 중단한다고 공식 발표했다(OpenAI 주장). 이유는 두 가지다. ① 결함 있는 테스트 — 자주 실패하던 어려운 문제 일부(전체의 약 27.6%)를 감사했더니, 기능적으로 맞는 답을 거부하는 결함 테스트가 그중 약 59.4%였다(문제 설명에 없는 정확한 함수명을 요구하거나, 무관한 동작을 검사). ② 학습 데이터 오염 — Django·Astropy 등 유명 오픈소스 파이썬 레포에서 문제를 뽑은 탓에, 주요 프런티어 모델들이 ''태스크 ID''만 주면 정답 패치를 그대로 재현했다(OpenAI 주장). 결론은 "Verified 점수 개선은 더 이상 실제 개발 능력 향상이 아니라 ''벤치를 얼마나 학습 때 봤는가''를 반영한다"이며, OpenAI는 비공개·카피레프트로 오염이 덜한 SWE-bench Pro로의 전환을 권한다.

    '
  points:
  - '교훈 — 굿하트의 법칙: 지표가 목표가 되면 지표이길 멈춘다. AI 코딩 도구를 ''Verified 80%'' 같은 단일 숫자로 고르지 말 것'
  - 수치 격차(보도된 OpenAI 감사값) — Verified ~80%대 모델이 오염에 강한 SWE-bench Pro 공개셋에선 ~23%로 급락. 감사 표본은 64회 독립 실행·138문항
  - 실무 — 사내 도구 평가는 공개 벤치 대신 '우리 비공개 레포로 만든 자체 태스크'를 쓰는 게 오염·과적합을 피하는 길. OpenAI도 전문가가 원본 태스크를 짜는 GDPVal 류로 투자 이동
  source: https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/
- category: ai
  title: Codebuff(CodebuffAI) — '한 모델'이 아니라 파일선택·계획·편집·검토 4개 에이전트가 분업하는 오픈소스 코딩 에이전트(Apache-2.0·~6.5k★)
  summary: 'Codebuff는 자연어 지시로 코드베이스를 고치는 오픈소스 AI 코딩 에이전트로, 단일 모델에 다 맡기는 대신 역할이 다른 에이전트 여러 개가 협업하는 구조를 핵심으로 내세운다(README 주장). 예컨대 ''인증 추가'' 같은 작업이 들어오면 ① File Picker가 레포를 훑어 아키텍처를 파악하고 관련 파일을 찾고 ② Planner가 어떤 파일을 어떤 순서로 고칠지 계획하고 ③ Editor가 정밀 편집을 하고 ④ Reviewer가 변경을 검증한다. 이렇게 나누면 단일 모델 도구보다 컨텍스트 이해가 낫고 편집이 정확하며 오류가 적다는 게 프로젝트의 설명이다. CLI(`npm i -g codebuff`)뿐 아니라 SDK(`@codebuff/sdk`)로 에이전트를 프로덕션에 임베드할 수 있고, `/init`를 돌리면 knowledge.md와 `.agents/` 디렉터리(TypeScript 타입 정의)가 생겨 자기만의 커스텀 에이전트를 정의할 수 있다.

    '
  points:
  - 핵심 구조 — File Picker(탐색)→Planner(계획)→Editor(편집)→Reviewer(검증) 분업. '서브에이전트로 컨텍스트를 나눠 오염을 막는' 멀티에이전트 패턴을 도구 자체가 기본값으로 박아둠
  - 확장 — CLI와 SDK 둘 다 제공(SDK로 앱에 코딩 에이전트 임베드). `/init`로 .agents/ TS 정의를 만들어 에이전트 행동을 직접 커스터마이즈, 광고 기반 무료판 Freebuff도 별도 존재
  - 사실 — github.com/CodebuffAI/codebuff, Apache-2.0, ~6.5k★. '단일 모델보다 낫다'는 정확도 우위는 벤치 수치가 아니라 프로젝트 주장이니 도입 전 자체 검증 권장
  source: https://github.com/CodebuffAI/codebuff
- category: ai
  title: CodeRabbit '인간 vs AI 코드' 리포트 — AI가 짠 PR이 결함 1.7배(PR당 10.83 vs 6.45건), '리뷰를 줄이지 말고 늘려라'
  summary: 'AI 코드리뷰 도구를 만드는 CodeRabbit가 2025년 12월 17일 발표한 ''State of AI vs Human Code Generation'' 리포트는, 오픈소스 PR을 자사 리뷰 엔진으로 분석해 AI가 관여한 코드가 사람만 짠 코드보다 결함이 더 많다고 보고했다. 핵심 수치는 AI-coauthored PR이 PR당 평균 10.83건의 문제를, 사람만 짠 PR은 6.45건을 내 약 1.7배 차이가 났다는 것. 유형별로는 가독성 문제가 약 3.15배로 가장 크게 벌어졌고, 로직·정확성 결함이 늘었으며 보안 취약점도 1.5~2배대로 증가했다. 함의는 분명하다 — AI로 ''쓰는 시간''은 줄지만 ''찾아 고치는 시간''이 늘어나므로, AI 도입 효과는 리뷰·검증 자동화를 함께 깔았는지에 달려 있다(리포트는 당연히 자사 도구에 유리한 프레이밍이니 숫자는 한 벤더의 주장으로 받아들일 것).

    '
  points:
  - 수치(CodeRabbit 주장) — AI 관여 PR 10.83건/PR vs 사람 6.45건/PR ≈ 1.7배. 가독성 ~3.15배, 로직 결함 증가, 보안 1.5~2배대. 자사 리뷰 엔진으로 오픈소스 PR을 분석한 결과
  - 실무 교훈 — 'AI가 짰으니 리뷰 덜 해도 된다'는 정반대. AI 코드일수록 자동 코드리뷰(claude-code-security-review·Bugbot·/code-review 등)와 테스트 게이트를 PR 단계에 강제하라
  - 측정 — ROI를 보려면 'AI 작성 코드 비율 / PR당 결함 수 / 보안 발견 수'를 같이 추적. 도입률만 보면 품질 꼬리(review tail)가 숨는다. 단일 벤더 수치이니 사내 데이터로 교차검증
  source: https://www.businesswire.com/news/home/20251217666881/en/CodeRabbits-State-of-AI-vs-Human-Code-Generation-Report-Finds-That-AI-Written-Code-Produces-1.7x-More-Issues-Than-Human-Code
- category: ai
  title: GitHub Copilot, 정액제를 버리다 — 2026-06-01부터 'AI 크레딧' 사용량 과금으로 전환
  summary: 'GitHub가 2026-06-01부터 Copilot 전 요금제를 ''프리미엄 리퀘스트 수''가 아니라 ''소비한 토큰(=AI 크레딧)'' 기반 사용량 과금으로 바꿨다. 모델과 입력·출력·캐시 토큰 양에 따라 비용이 매겨지고, 각 요금제에는 월 크레딧 할당량이 포함되며 초과분은 예산을 걸어 추가 구매한다. 고정 구독료는 그대로지만 ''측정 단위''가 바뀐 셈이라, 에이전트 워크플로를 많이 돌리는 헤비 유저의 청구서가 출렁일 수 있다는 우려가 컸다(공식 디스커션에 400+ 댓글). 헤비 워크플로용 상위 ''Copilot Max'' 티어도 신설됐고, 코드 리뷰는 크레딧에 더해 Actions 분까지 소비하게 됐다.

    '
  points:
  - 프리미엄 리퀘스트 → 토큰 기반 'AI 크레딧' 사용량 과금(2026-06-01)
  - 구독료는 유지·측정 단위만 변경 → 에이전트 헤비 유저 비용 변동성↑
  - 신규 'Copilot Max' 티어 추가, 코드 리뷰는 Actions 분도 소모
  source: https://github.blog/changelog/2026-06-01-updates-to-github-copilot-billing-and-plans/
- category: ai
  title: Anthropic, '코드의 80%를 Claude가 쓴다' — 그리고 API 에러 800건을 자율로 고친 사례
  summary: 'Anthropic은 2026년 5월에 자사가 머지한 코드의 80% 이상을 Claude가 작성했다고 밝혔다. 대표 사례로, 한 엔지니어가 Claude를 붙여 끈질긴 API 에러군에 대해 800건 넘는 수정을 자율로 내보내 에러율을 1,000분의 1로 줄였다(엔지니어는 일감 선택·리뷰·머지 결정으로 루프 안에 남았다). 사양이 처음부터 명확하지 않은 가장 열린 사내 엔지니어링 과제에서의 성공률도 5월 76%로 6개월 만에 50%p 올랐다고 한다. 다만 보도는 ''80% 작성·76% 성공''이 곧 ''안전·유지보수·머지 가능''을 뜻하진 않는다고 분명히 선을 긋는다.

    '
  points:
  - 2026-05 머지 코드의 80%+를 Claude가 작성(Anthropic 주장)
  - 엔지니어 1명이 Claude로 API 에러 800+건 자율 수정, 에러율 1/1000
  - '''작성 비중·성공률''이 코드 품질·머지 적합성을 보장하진 않음(보도 명시)'
  source: https://winbuzzer.com/2026/06/05/claude-writes-80-of-anthropic-code-raising-review-stakes-xcxwbn/
- category: ai
  title: AGENTS.md는 정말 도움이 되나 — 실제 PR 124건으로 잰 '시간·토큰' 실증 연구(arXiv 2026)
  summary: '에이전트 지침 파일 AGENTS.md를 두면 정말 빨라지는지를 실제 머지된 GitHub PR로 처음 정량 측정한 arXiv 연구다. 10개 레포·124개 PR을 골라 코드를 머지 직전 상태로 되돌린 뒤, AGENTS.md 유무만 다르게 해 OpenAI Codex(gpt-5.2-codex)를 도커에서 동일 조건으로 돌려 비교했다. 결과 AGENTS.md가 있을 때 실행 시간 중앙값이 약 28.6%(98.6s→70.3s) 줄고 출력 토큰 중앙값도 약 16.6% 감소했으며, 둘 다 통계적으로 유의했다. 다만 입력 토큰 중앙값은 거의 그대로였고, 토큰 절감은 ''소수의 고비용 실행''에서 주로 나왔다. 정답 여부(정확성)는 50건 샘플로 ''비어있지 않은 코드 변경''만 확인했을 뿐 본격 평가는 후속 과제로 남겼다.

    '
  points:
  - 10레포·124 PR을 페어 설계로 비교(AGENTS.md 유무만 차이)
  - 실행 시간 중앙값 ≈ -28.6%, 출력 토큰 중앙값 ≈ -16.6%(유의)
  - 절감은 '소수 고비용 실행'에 집중, 정확성 평가는 후속 과제
  source: https://arxiv.org/html/2601.20404v2
- category: ai
  title: 코딩 에이전트 7종 MCP 클라이언트 보안 비교 — '버그'가 아니라 '구조'가 뚫린다(arXiv 2026)
  summary: '''AI 개발 도구는 프롬프트 인젝션에 면역인가''를 묻는 arXiv 연구가 MCP 클라이언트 7종(Claude Desktop, Claude Code, Cursor, Cline, Continue, Gemini CLI, Langflow)을 적대적으로 비교 테스트했다. Cursor(1.6.45)는 네 가지 공격이 모두 통해 가장 취약했고, Claude Code(2.0.25)는 ''낮음~중간'' 위험으로 결과가 갈렸다. 핵심 결론은 대부분의 취약점이 구현 버그가 아니라 ''신뢰 모델·검증 계층 부재·샌드박싱 부재'' 같은 근본 아키텍처 결정에서 나온다는 것 — LLM이 명령과 데이터를 같은 경로로 읽어 둘을 완벽히 구분하지 못하기 때문이다. 따라서 보안은 사후 추가가 아니라 설계 단계부터 넣어야 한다고 못박는다.

    '
  points:
  - 'MCP 클라이언트 7종 적대 테스트: Cursor가 4개 공격 모두 통과(최취약)'
  - 취약점 대부분은 구현 버그 아닌 '신뢰모델·검증·샌드박스 부재' 구조 문제
  - LLM이 명령·데이터를 한 경로로 읽음 → 보안은 설계 단계부터 넣어야
  source: https://arxiv.org/html/2603.21642v1
- category: ai
  title: PewDiePie의 'Odysseus' — 유튜버가 던진 MIT 라이선스 self-hosted AI 워크스페이스(2026-05-31)
  summary: '구독자 최다 유튜버 Felix Kjellberg(PewDiePie)이 2026-05-31 자기 기기에서 통째로 돌리는 오픈소스 AI 워크스페이스 Odysseus를 공개했다. 채팅·자율 에이전트·딥리서치·문서·이메일·캘린더·노트에 더해, 에이전트가 파일 찾기·포맷 변환·코드 실행·웹 브라우징을 알아서 하고 영속 메모리로 학습한다. Python·FastAPI·SQLite·ChromaDB·Docker 스택에 Ollama·llama.cpp·vLLM 로컬 구동과 OpenAI·OpenRouter API를 함께 물린다(MIT). ''데이터를 회사 서버에 안 넘긴다''는 프라이버시·소유권이 철학이지만, 클라우드 API를 붙이면 데이터가 외부로 나간다는 단서가 붙는다. 출시 48시간에 별 3만, 6/4 기준 4.4만+로 폭발적 관심을 모았다(주장).

    '
  points:
  - 유튜버 PewDiePie가 만든 self-hosted AI 워크스페이스(MIT, 2026-05-31)
  - Python/FastAPI/SQLite/ChromaDB/Docker + Ollama·llama.cpp·vLLM 로컬 구동
  - '''로컬이면'' 프라이버시지만 클라우드 API 연결 시 데이터는 외부로'
  source: https://github.com/pewdiepie-archdaemon/odysseus
- category: ai
  title: OpenAI GPT-5.5 'Spud' — GPT-4.5 이후 첫 완전 재학습 에이전트 모델(2026-04-23)
  summary: 'OpenAI가 2026-04-23 코드네임 ''Spud''로 GPT-5.5를 공개했다. GPT-4.5 이후 첫 ''처음부터 다시 학습한'' 베이스 모델이라는 점이 핵심으로, 최소한의 사람 개입으로 다단계 컴퓨터 작업을 끝내도록 설계된 에이전트형 모델이다. 공식 발표 기준 Terminal-Bench 2.0에서 82.7%, GDPval 84.9%를 찍었다고 한다(OpenAI 주장). ChatGPT의 Plus·Pro·Business·Enterprise와 Codex에 함께 풀렸다. 벤치마크는 ''모델 단독''이 아니라 ''에이전트+모델 쌍''으로 읽어야 하며, 같은 시점 Terminal-Bench 2.1 공개 리더보드에서는 Codex CLI+GPT-5.5가 1위(83.4%)로 보고됐다.

    '
  points:
  - GPT-4.5 이후 첫 완전 재학습 베이스 모델, 코드네임 'Spud'(2026-04-23)
  - Terminal-Bench 2.0 82.7%·GDPval 84.9%(OpenAI 공식 발표 주장)
  - ChatGPT 유료 티어·Codex에 동시 배포, 에이전트형 다단계 작업 지향
  source: https://openai.com/index/introducing-gpt-5-5/
- category: ai
  title: Cursor Composer 2.5 — 'Composer 2 두 달 만'에 나온 자체 모델, Bugbot까지 갈아끼우다
  summary: 'Cursor가 자체 에이전트 모델 Composer 2를 낸 지 약 두 달 만에 Composer 2.5를 내놨다. CursorBench 과제를 평균 1달러 미만으로 끝낸다고 주장하는데, 같은 과제에서 Opus 4.7·GPT-5.5는 3~11달러가 든다는 비교를 함께 내세운다. 가격은 Standard 티어가 입력 100만 토큰당 $0.50·출력 $2.50, Fast 티어가 입력 $3.00·출력 $15.00다. Composer 2.5는 Cursor의 PR 리뷰 봇 Bugbot도 구동하게 됐는데, 평균 리뷰 시간이 약 5분에서 ~90초로 줄고 리뷰당 버그 검출이 평균 0.56→0.62로 10% 늘면서 실행 비용은 ~22% 낮아졌다고 한다(모두 Cursor 주장).

    '
  points:
  - Composer 2 출시 ~2개월 만의 자체 모델, CursorBench 과제 평균 <$1 주장
  - '가격: Standard 입력 $0.50/출력 $2.50, Fast 입력 $3.00/출력 $15.00(100만 토큰)'
  - Bugbot도 2.5로 전환 → 리뷰 ~90초·검출 +10%·비용 -22%(주장)
  source: https://cursor.com/changelog
- category: ai
  title: SlopCodeBench — 코딩 에이전트가 '오래 고칠수록' 코드가 망가지는 걸 재는 벤치마크(arXiv 2026)
  summary: '장기·반복 작업에서 코딩 에이전트가 시간이 갈수록 코드를 어떻게 퇴화시키는지를 따로 재겠다는 언어 비종속 벤치마크 SlopCodeBench(SCBench)다. 20개 문제를 93개 체크포인트로 쪼개, ''정확성 테스트는 통과하지만 구조는 침식되는'' 구간을 추적한다. 핵심 관찰은 (1)코드가 특정 ''구조적 끌개(attractor)''로 수렴하고, (2)품질이 실행 궤적마다 갈라지며, (3)리팩터링·개선이 정확성 테스트로는 안 잡히는 결함을 새로 들여온다는 것. 기존 연구가 시간에 따른 장황함·구조 침식을 추적하지 않았다는 공백을 메운다고 주장한다.

    '
  points:
  - 장기 반복 작업의 '코드 퇴화'를 20문제·93체크포인트로 추적
  - 정확성 테스트는 통과해도 구조가 침식 → 새 결함이 숨어듦
  - 기존 벤치마크가 안 보던 '시간에 따른 구조 침식'을 겨냥
  source: https://arxiv.org/html/2603.24755v1
- category: ai
  title: Builder Methods 'Agent OS v3' — 스펙 작성은 'Plan Mode'에 넘기고 표준만 주입하는 SDD 키트(2026)
  summary: '스펙 주도 개발(SDD) 도구 Agent OS가 ''2026용으로 더 가볍고 정렬된'' v3를 냈다. 가장 큰 변화는 스펙 작성을 Agent OS 명령이 직접 하지 않고 Claude Code(또는 Cursor 등)의 Plan Mode에 위임한다는 점 — 대신 /shape-spec이 표준·제품 미션을 고려한 질문을 던져 더 정렬된 스펙을 만들고 그 계획을 Agent OS 스펙 폴더에 자동 저장한다. /discover-standards로 코드베이스에서 표준을 발굴·제안·생성하고, /inject-standards로 대화·플랜·스킬 어디에든 index.yml 기반으로 관련 표준만 골라 주입한다. 산출물이 전부 마크다운이라 도구를 안 가린다.

    '
  points:
  - 'v3 핵심: 스펙 작성을 에이전트의 ''Plan Mode''에 위임'
  - /shape-spec(정렬된 스펙)·/discover-standards·/inject-standards(index.yml)
  - 산출물이 마크다운 → Claude Code·Cursor 등 도구 비종속
  source: https://github.com/buildermethods/agent-os/discussions/310
- category: ai
  title: SWE-bench Pro 공개셋 현황(2026-06) — 1위 GPT-5.4도 60% 못 넘고, 비공개셋은 더 떨어진다
  summary: '오염(학습 시 정답 노출)에 강한 차세대 벤치마크 SWE-bench Pro의 공개셋(731 태스크, Pass@1) 2026-06-09 기준 현황이다. GPT-5.4(xHigh)가 59.1%로 1위로, 신규 Muse Spark보다 4.1%p, 최고 Claude 런(Opus 4.6 thinking, 51.9%)보다 7.2%p 앞선다. 핵심은 오염 통제용 ''비공개 상용셋''으로, 인터넷에 없는 스타트업 18곳의 비공개 코드베이스 276 태스크에서 점수가 크게 떨어진다는 점 — 가장 강한 오염 통제 장치라는 주장이다. 오픈웨이트는 Pro에서 크게 밀려, 표준 스캐폴딩 리더보드 1위가 qwen3-coder-480b로 38.7%에 그친다.

    '
  points:
  - 공개셋(731태스크) 1위 GPT-5.4 59.1% — 최고 Claude 51.9%(Opus 4.6)
  - 비공개 상용셋 276태스크(스타트업 18곳)에서 점수 급락 = 오염 통제
  - 오픈웨이트는 Pro에서 부진(표준 스캐폴딩 1위 qwen3-coder 38.7%)
  source: https://www.morphllm.com/swe-bench-pro
- category: ai
  title: 백그라운드 코딩 에이전트 — '맡기고 잊는' 비동기 에이전트가 2026 주류가 되다
  summary: '백그라운드 코딩 에이전트란 격리된 클라우드 샌드박스에서 비동기로 도는 ''AI 소프트웨어 엔지니어''다. GitHub 이슈·Linear 티켓·Slack 메시지 같은 일감을 맡기면 수 분~수 시간 혼자 일한 뒤 PR을 돌려준다 — 타이핑을 보조하는 인라인 도구와 정반대로 ''티켓→클라우드 샌드박스→자율 편집→PR→사람 리뷰'' 한 사이클을 돈다. Devin(2024 말)으로 장기 에이전트 역량이 무르익은 뒤 2025년 Codex Cloud·Cursor Background Agents·Jules가 쌓였고, Anthropic의 Claude Code Remote Tasks가 2026-03-20 합류하며 카테고리가 주류가 됐다. 다만 모든 백그라운드 에이전트는 레포·CI 시크릿을 만지려 ''범위가 좁고 회수 가능한 비인간 ID''가 필요해, 기업이 보안 통제로 다루기 시작했다.

    '
  points:
  - '''티켓→클라우드 샌드박스→자율 편집→PR→리뷰'' 비동기 사이클'
  - Devin→Codex Cloud·Cursor BG·Jules→Claude Code Remote Tasks(2026-03-20)
  - 에이전트마다 '범위 좁고 회수 가능한 비인간 ID'가 새 보안 통제 지점
  source: https://securityboulevard.com/2026/06/6-background-ai-agents-for-async-development/
- category: ai
  title: Greptile — 디프가 아니라 '레포 전체'를 인덱싱해 파일·서비스 사이 버그를 잡는 코드리뷰 봇
  summary: 'Greptile은 PR의 디프만 보는 게 아니라 코드베이스 전체를 인덱싱해, 파일·서비스·의존성 ''사이''에 숨은 버그를 찾는 AI 코드리뷰 도구다. 변경이 아키텍처를 타고 어떻게 번지는지를 추적하고, 발견을 심각도로 분류해 신호 대 잡음비를 높이려 한다. 가격은 사용자당 월 $30(오픈소스·시리즈A 이전 스타트업은 무료/할인). 독립 평가에서 ''버그 검출률이 가장 높지만 오탐률도 가장 높다''는 트레이드오프가 거론된다 — 진짜 버그도, 잡음도 더 많이 나온다는 뜻(평가 출처별 편차 큼). 2026년 코드리뷰 시장은 PR 리뷰 댓글의 상당수를 자동 리뷰어가 다는 단계로 성숙했다.

    '
  points:
  - 디프가 아니라 '레포 전체 인덱싱'으로 파일·서비스 간 결함 추적
  - 가격 사용자당 월 $30(OSS·초기 스타트업 무료/할인)
  - '''최고 검출률 ↔ 최고 오탐률'' 트레이드오프(평가 출처별 편차)'
  source: https://www.greptile.com/content-library/best-ai-code-review-tools
- category: ai
  title: 한국 IT 기업 코딩 에이전트 도입 사례 — 토스페이먼츠·당근·채널톡의 공통 원칙
  summary: '2026년 한국 IT 기업들의 코딩 에이전트 도입 사례에서 공통 패턴이 보인다. 토스페이먼츠는 MCP 기반 AI 연동 서버를 만들어 PG 연동을 자동화하되, 아키텍처 설계와 결제 안정성 판단은 엔지니어가 쥐었다. 당근은 전사 AI 전환을 선언하고 해커톤·피처톤으로 지표 요약·에러 분석·매물 요약 같은 반복 업무를 자동화해 실험·배포 주기를 높이되 제품 방향과 핵심 의사결정은 사람 중심으로 뒀다. 채널톡은 Cursor를 전사 도구로 도입해 IDE까지 바꾸고 온보딩·리팩터링·PR 리뷰·UI 구현을 AI 중심으로 재설계했지만 구조 설계·품질 최종 책임은 사람이 진다. 세 사례의 공통 원칙: ''정형·반복 작업은 위임하되, 설계·품질·핵심 판단은 사람이 책임진다.''

    '
  points:
  - '토스페이먼츠: MCP 연동 서버로 PG 연동 자동화(안정성 판단은 사람)'
  - '당근: 전사 전환·해커톤으로 반복 업무 자동화(의사결정은 사람 중심)'
  - '채널톡: Cursor 전사 도입으로 IDE까지 교체(품질 책임은 사람)'
  source: https://www.codetree.ai/blog/2026-%EB%B0%94%EC%9D%B4%EB%B8%8C-%EC%BD%94%EB%94%A9-%ED%88%B4-5%EA%B0%80%EC%A7%80-%EC%B6%94%EC%B2%9C-ai-%EC%BD%94%EB%94%A9-%ED%88%B4%EB%A1%9C-%EB%8B%AC%EB%9D%BC%EC%A7%84-%EA%B0%9C%EB%B0%9C%EC%9E%90/
- category: ai
  title: SWE-Skills-Bench — 에이전트 스킬은 만능 부스터가 아니라 '맞춤 지식'이다
  summary: 'SWE-Skills-Bench는 SKILL.md 같은 절차 지식이 실제 소프트웨어 작업에 얼마나 도움 되는지 재는 벤치마크다. 공개 레포의 고정 커밋, 명확한 요구사항, 검증 테스트, 스킬 문서를 짝지어 ''스킬 있음/없음''을 비교한다. 논문 초록의 핵심 결과는 차갑다: 49개 스킬 중 39개는 pass-rate 향상이 0이고 평균 이득은 +1.2%에 그쳤다. 토큰 오버헤드는 경우에 따라 451%까지 늘었고, 버전이 안 맞는 지침은 오히려 성능을 깎았다. 교훈은 스킬을 많이 까는 게 아니라, 현재 레포·버전·작업에 정확히 맞는 좁은 스킬만 쓰는 것이다.

    '
  points:
  - 49개 public SWE skills + 고정 커밋 레포 + 요구사항 + 실행 테스트로 paired 평가
  - 39/49 스킬은 pass-rate 향상 0, 평균 이득 +1.2%; 일부는 버전 불일치로 성능 하락
  - 스킬은 범용 마법이 아니라 도메인·버전·작업 적합성이 맞을 때만 값이 난다
  source: https://github.com/GeniusHTX/SWE-Skills-Bench
- category: ai
  title: Codex /usage — 토큰 활동을 CLI 안에서 바로 보는 새 계기판
  summary: 'OpenAI Codex CLI 0.140.0은 `/usage` 뷰를 추가해 계정 토큰 활동을 일간·주간·누적 단위로 볼 수 있게 했다. 코딩 에이전트를 오래 돌릴 때 가장 먼저 무너지는 것은 코드가 아니라 운영 가시성이다. 사용량을 외부 대시보드나 추측에 맡기면 자동화 루프가 한도에 부딪힌 뒤에야 멈춘다. `/usage`는 터미널 작업 흐름 안에서 비용·한도 신호를 바로 확인하게 해, 긴 세션·서브에이전트·반복 검증을 어디까지 밀어도 되는지 판단하는 작은 제어면이 된다. 같은 릴리스는 `/goal` 대용량 입력 보존, 영구 세션 삭제, Claude Code 설정 가져오기 같은 운영 기능도 함께 넣었다. GitHub 레포는 2026-06-18 조회 기준 91.8k★, 최신 릴리스 0.140.0(2026-06-15)으로 활발히 유지되고 있다.

    '
  points:
  - '0.140.0 신기능: `/usage`로 일간·주간·누적 토큰 활동 확인'
  - 긴 자동화 루프에서 비용·한도 신호를 터미널 안에 고정
