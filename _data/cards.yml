  title: Claude Tag — Slack에서 @Claude를 팀원처럼 호출하는 협업 에이전트
  summary: Claude Tag는 Claude를 Slack 채널에 초대해 팀 대화, 선택한 도구, 데이터, 코드베이스 맥락 위에서 작업을 위임하는 Anthropic의 팀 협업 기능이다. 채널 멤버가 `@Claude`를 태그하면 Claude가 PR 작성·머지, 데이터 분석, 장애 원인 조사 같은 일을 맡고, 채널 기록을 따라가며 매번 배경 설명을 다시 요구하지 않도록 컨텍스트를 쌓는다. ambient behavior를 켜면 조용해진 스레드나 관련 정보를 먼저 짚어 주는 더 능동적인 패턴도 가능하다. 개발자 교훈은 "코딩 에이전트는 IDE 안 개인 도구"에서 "팀 채널의 공유 작업자"로 이동 중이라는 점이다. 단, 채널·도구 접근권한을 어디까지 줄지와 사람이 승인해야 할 작업 경계를 먼저 설계해야 한다.
  points:
  - Slack 채널에서 `@Claude` 호출 → 선택한 채널·도구·데이터·코드베이스 맥락으로 작업 위임
