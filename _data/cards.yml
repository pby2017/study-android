  title: LlamaIndex vs LangChain — 2026년 RAG·에이전트 하이브리드 스택 선택 가이드
  summary: '2026년 LlamaIndex와 LangChain은 각각 RAG·에이전트 플랫폼으로 수렴했지만 강점이 다르다. LlamaIndex는 문서 ingestion·청킹·하이브리드 검색·LlamaParse에 특화 — retrieval 품질·토큰 효율(~33%↓) 우위. LangChain+LangGraph는 상태 머신·체크포인팅·human-in-the-loop·멀티에이전트 오케스트레이션 표준. 시니어 패턴: LlamaIndex=데이터 레이어, LangGraph=실행 레이어, LangSmith=옵저버빌리티 — 단일 프레임워크 고집보다 하이브리드가 프로덕션 정답.'
  points:
  - 'LlamaIndex: 대량 PDF·엔터프라이즈 문서·복잡 retrieval(재귀·sub-question) → 데이터 레이어'
  - 'LangGraph: 분기·상태·승인 게이트·장기 에이전트 → 실행 레이어'
  - '하이브리드: QueryEngine을 LangGraph 노드에 넣어 retrieval+orchestration 분리'
  source: https://axiomlogica.com/ai-ml/langchain-vs-llamaindex-production-rag-2026
