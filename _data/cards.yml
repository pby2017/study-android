  - category: ai
    title: "Rakuten 도입 사례 — Claude Code가 1,250만 줄 vLLM에서 '7시간 무인 코딩'으로 기능 하나를 끝낸 기업 레퍼런스"
    summary: >
      Anthropic이 공개한 Rakuten 고객 사례다. ML 엔지니어 Kenta Naruse가 1,250만 줄 규모의 오픈소스 라이브러리 vLLM에
      활성화 벡터 추출 기능을 구현하라고 시키자, Claude Code가 사람이 코드를 직접 안 쓰고 가끔 가이드만 주는 상태로
      7시간을 연속 자율 작업해 한 번에 완성했다고 한다. 결과물은 레퍼런스 대비 99.9% 수치 정확도였고, 회사 전체로는
      신규 기능의 출시 소요가 24일→5일(79% 단축)로 줄었다는 게 사례가 내세우는 지표다. 단 이는 Opus 4 출시 시점(2025)에
      함께 발표된 벤더 측 마케팅 사례이며, 수치는 Rakuten·Anthropic의 자체 주장임에 유의.
    points:
      - "핵심 수치(벤더 주장) — 7시간 연속 무인 코딩 / 출시 24일→5일(79%↓) / 복잡한 코드 수정 99.9% 정확도"
      - "운영 패턴 — AI 담당 GM Yusuke Kaji의 표현: 'Claude Code에 4개를 위임하고 나는 1개에 집중해, 5개 작업을 병렬로 굴린다'"
      - "맥락·한계 — Opus 4 발표(2025)와 묶여 나온 고객 레퍼런스다. 1,250만 줄 코드베이스에서의 단일 작업 일화이며 통제된 벤치마크가 아니므로, 일반 성능 보장이 아니라 '엔터프라이즈 자율 코딩이 가능했다'는 사례로 읽어야 한다"
    source: "https://claude.com/customers/rakuten"
  - category: ai
    title: "Claude Code 사용량 한도 읽는 법 — '5시간 세션 + 주간 한도' 두 버킷에 Opus는 따로 카운트(공식 문서)"
    summary: >
      Pro/Max 플랜의 Claude Code 사용량은 단일 숫자가 아니라 두 개의 윈도가 동시에 돈다고 Anthropic 공식 지원 문서가 명시한다.
      하나는 '5시간 롤링 세션', 다른 하나는 '주간 한도'이며, 설정의 Usage 페이지에서 두 진행바를 각각 보고 리셋 시각도 확인할 수 있다.
      특히 주간 한도는 'Opus 전용'과 '그 외 모든 모델'이 별도 버킷으로 추적돼, Opus를 다 써도 Sonnet/Haiku로는 계속 작업할 수 있다.
      Anthropic은 정확한 토큰 쿼터를 공개하지 않고 플랜 배수(Pro 1x, Max 5x/20x)만 제시하므로, 실제 소진 속도는 모델·대화 길이·툴 사용·effort에 따라 달라진다.
    points:
      - "두 윈도 동시 적용 — 5시간 세션 한도와 주간 한도가 따로 존재하고, `/usage`(또는 웹 Usage 설정)에서 각 진행바와 리셋 시점을 본다. 주간 버킷은 'Opus 전용 / 그 외 모델'로 분리 카운트"
      - "절약 패턴(문서 권장) — 관련 질문은 한 메시지로 묶고, 프로젝트에 올린 내용은 캐싱돼 재사용 시 한도에 안 잡힌다. 모델·effort를 낮추고 첨부 크기를 줄이는 것도 직접적 효과"
      - "정량 쿼터는 비공개 — Anthropic은 토큰 수가 아니라 배수(Pro 1x / Max 5x / Max 20x)만 발표. '몇 토큰'이 아니라 '내 진행바가 어디까지 찼나'로 관리하는 게 현실적"
    source: "https://support.claude.com/en/articles/9797557-usage-limit-best-practices"

  - category: ai
    title: "Gemini CLI(google-gemini) — '개인 구글 계정 로그인'만으로 Gemini 2.5 Pro·1M 컨텍스트를 무료로 터미널에 꽂는 오픈소스 에이전트(Apache-2.0·~105k★)"
    summary: >
      Gemini CLI는 구글이 2025년 6월 공개한 터미널 네이티브 코딩 에이전트로, GitHub에서 Apache-2.0 라이선스·약 10.5만 스타에 v0.46.0까지 활발히 릴리스되고 있다(주장이 아니라 레포에서 직접 확인되는 사실).
      가장 실무적인 포인트는 진입 장벽이 거의 없다는 것 — 개인 구글 계정으로 로그인하면 Gemini Code Assist 무료 라이선스가 딸려와 분당 60요청·하루 1,000요청까지 비용 없이 쓸 수 있다고 구글 공식 블로그가 명시한다.
      모델은 100만 토큰 컨텍스트의 Gemini 2.5 Pro에 무료로 접근하며, MCP(Model Context Protocol)를 기본 지원해 Claude Code·Codex와 같은 도구·서버 생태계를 그대로 붙일 수 있다.
      더 많은 한도가 필요하면 Google AI Studio/Vertex AI 키로 사용량 과금 모드로 전환한다. Claude Code의 무료 대안이나 멀티 에이전트 스택의 한 축으로 평가해 볼 만하다.
    points:
      - "무료 진입 — 개인 구글 계정 로그인만으로 분당 60·하루 1,000 요청을 무과금 사용(공식 블로그 수치). API 키나 결제 등록 없이 바로 시작"
      - "스펙 — Gemini 2.5 Pro + 1M 토큰 컨텍스트, MCP 기본 지원으로 기존 MCP 서버/도구를 그대로 연결. VS Code(Gemini Code Assist)와 기술 공유"
      - "오픈소스 사실 — Apache-2.0, github.com/google-gemini/gemini-cli에서 ~105k★·523개 릴리스(v0.46.0, 2026-06). 일부 블로그의 '서비스 종료설'은 레포에 deprecation 표기가 없어 1차 출처로는 미확인 — 카드에서 제외"
    source: "https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-cli-open-source-ai-agent/"
  - category: ai
