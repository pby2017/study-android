  title: GPT-SoVITS — 1분 음성으로 프로덕션급 TTS 클로닝, 5초 제로샷·RTF 0.014(4090)·57k+★(MIT)
  summary: 'GPT-SoVITS는 RVC-Boss 팀이 만든 Few-shot 음성 클로닝+TTS 프레임워크다. 5초 참조 오디오로 제로샷 TTS, 1분 데이터로 고충실도 파인튜닝. GPT 시맨틱 토큰 예측기+SoVITS(VITS 기반) 보코더 결합. 4090에서 RTF 0.014(실시간의 71배 속도). 영어·일본어·한국어·광동어·중국어 크로스링구얼 합성. WebUI로 음원 분리·자동 세그멘테이션·ASR·라벨링 도구 내장. RVC(실시간 음성 변환)와 상호보완.

