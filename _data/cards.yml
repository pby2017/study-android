    '
  points:
  - 'Apple Intelligence 동일 엔진: Swift API, AOT 컴파일, Neural Engine 최적화'
  - 'Core AI Instruments: Xcode에서 텐서 값 → Python 소스 추적 디버깅'
  - 'Core AI Models 리포: Qwen·Mistral·SAM3 변환 스크립트 + Swift 런타임 라이브러리'
