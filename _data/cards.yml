  title: Cohere Command A — 엔터프라이즈 RAG 특화 111B, 할루시네이션 23% 적음·Embed+Rerank 통합 스택
  summary: 'Cohere Command A는 111B 파라미터 엔터프라이즈 LLM으로, RAG·도구 사용·멀티스텝 에이전트에 최적화됐다. 256K 컨텍스트, 23개 언어 지원. A100/H100 2장에 배포 가능(경쟁 모델은 8장 필요). 네이티브 인용 생성으로 그라운딩 정확도 91.3%(GPT-4o 82.4%), 할루시네이션 23% 감소. Embed v3+ Rerank 3.5와 통합 스택(단일 API·SDK·과금)으로 RAG 파이프라인 구축. 일반 벤치마크(MMLU 82.1) 에서는 GPT-4o(88.7)에 뒤지나, RAG 정확도/비용 비율은 2026년 최고. Apache-2.0 웨이트 공개.

