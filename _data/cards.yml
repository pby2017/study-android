  title: Semblance — 완전 로컬 주권형 개인 AI, 네트워크 접근 아키텍처적 불가능·이메일/캘린더/건강 데이터 통합
  summary: 'Semblance는 완전 로컬에서 실행되는 주권형 개인 AI 어시스턴트다. AI 코어 프로세스가 아키텍처적으로 네트워크 접근 불가능(HTTP 라이브러리 없음, OS 샌드박스 격리). 이메일·파일·캘린더·메시지·건강· 금융 데이터를 로컬 지식 그래프에 수집하여 추론. 외부 통신은 단일 Gateway 프로세스를 통해 사용자 허용 서비스만 가능. LanceDB(벡터)+SQLite(구조화) 로컬 저장. Ollama/llama.cpp/MLX 선택. React Native 모바일은 로컬 추론 피어 디바이스로 동작.

    '
  points:
  - '제로 네트워크: AI 코어에 HTTP 라이브러리 없음'
  - '로컬 지식 그래프: 이메일·캘린더·건강·금융 통합'
  - 'Gateway 격리: 사용자 허용 서비스만 외부 통신'
  source: https://github.com/skygkruger/semblance-core
- category: ai
  title: CodeGraph — 코드베이스를 시맨틱 그래프로 변환, 37언어·45 MCP 도구·호출 체인·아키텍처 문서 자동 생성
  summary: 'CodeGraph는 코드베이스를 시맨틱 그래프로 구축하고 AI 에이전트에게 구조화된 코드 이해를 제공하는 도구다. tree-sitter로 37개 언어 파싱. symbol_search(BM25+시맨틱 하이브리드), get_callers/callees (호출 체인), get_dependency_graph(의존성), blast_radius(영향 범위 분석) 등 45개 MCP 도구. verify_design(문서↔코드 교차 검증), generate_architecture_doc(ARCHITECTURE.md 자동 생성). 파일 grep 대신 구조화된 심볼 조회로 토큰 최대 5,700x 절감(GraphMind 유사).

    '
  points:
  - '37언어·45 MCP 도구: 심볼 검색·호출 체인·의존성'
  - '토큰 절감: grep 대비 최대 5,700x 적은 컨텍스트'
  - '아키텍처 자동 생성: 코드 그래프 기반 ARCHITECTURE.md'
  source: https://github.com/codegraph-ai/CodeGraph
- category: ai
  title: Auto-Use — 접근성 트리+비전 하이브리드로 OS 전체를 AI 에이전트가 제어, macOS/Windows 통합(MIT)
  summary: 'Auto-Use는 AI가 데스크톱 OS 전체를 제어하는 Computer Use 에이전트다. 3단계 하이브리드: ①접근성 트리(AXUIElement) 추출 → ②마젠타 바운딩 박스 오버레이 스크린샷 생성 → ③비전 모델(Claude/GPT-4o/ Gemini)에 번호 인덱스+엘리먼트 트리 전송. 순수 스크린샷(비주얼봇) 대비 안정적이고 정확한 요소 타게팅. 브라우저 자동화+시스템 제어+코딩 태스크를 단일 에이전트로 통합. macOS+Windows 빌드 통합. Python app.py(데스크톱 UI) 또는 main.py(터미널) 실행.

    '
  points:
  - '하이브리드: 접근성 트리 + 비전, 순수 스크린샷 대비 정확'
  - 'OS 전체 제어: 브라우저+시스템+코딩 단일 에이전트'
  - '번호 인덱스: 오버레이 번호로 요소 타게팅, 좌표 불필요'
  source: https://github.com/auto-use/auto-use
