  title: Haystack — deepset의 프로덕션 RAG·에이전트 오케스트레이션 프레임워크(Apache-2.0)
  summary: deepset의 오픈소스 Python AI 오케스트레이션 프레임워크. 컴포넌트+파이프라인(DAG)으로 retrieval·routing·memory·generation을 명시적으로 조합 — LangChain/LlamaIndex와 달리 프로덕션 RAG에 특화. 내장 hybrid retrieval(BM25+밀집·RRF), YAML 정의 파이프라인, MRR/NDCG/faithfulness 평가 프레임워크. v2.30+(2026-06) 에이전트 워크플로·멀티모달·160+ 커넥터. Hayhooks로 REST API 노출, Enterprise Platform으로 거버넌스·관측성.
  points:
  - 컴포넌트 DAG — retrieval·router·memory·generator를 독립 교체·테스트
  - 내장 hybrid search·평가(MRR·faithfulness) — YAML 파이프라인 버전 관리
  - LlamaIndex(데이터)·LangChain(에이전트)과 하이브리드 스택으로 조합 가능
  source: https://haystack.deepset.ai/overview/intro
