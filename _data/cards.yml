  points:
  - "local: 한 프로젝트·개인용 / project: 저장소 루트 `.mcp.json`에 저장해 팀과 공유 / user: 내 모든 프로젝트에서 사용"
  - "프로젝트 서버는 저장소를 신뢰한 뒤 별도 승인해야 연결됨; 저장소가 스스로 승인을 제공할 수는 없음"
  - "이 승인은 서버 설정 승인이다. 개별 도구 호출의 권한은 별도 규칙으로 제어됨"
  source: https://code.claude.com/docs/en/mcp
  interview: "프로젝트 `.mcp.json`의 MCP 서버에 동의하면 그 서버의 모든 쓰기 도구도 자동 허용되나요?"
  answer: "아니다. 동의는 프로젝트 서버 설정을 연결하도록 승인하는 단계다. 개별 도구 호출 권한은 별도 permission 규칙이나 확인 흐름이 적용된다."
- category: ai
  level: "초급"
