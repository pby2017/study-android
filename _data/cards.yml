  title: MCP(Model Context Protocol) 2026 — AI-도구 연결 USB-C, 10k+ 서버·97M SDK 다운로드·Linux Foundation 이관
  summary: 'MCP는 Anthropic이 만든 AI 모델↔외부 도구/데이터 연결 오픈 표준이다. 2025년 12월 Linux Foundation (Agentic AI Foundation)에 기증되어 벤더 중립 표준화. Host(AI 앱)→Client→Server(도구/데이터) 3계층 아키텍처, JSON-RPC 기반. 10,000+ 공개 서버, Python/TypeScript SDK 월 97M+ 다운로드. Claude·ChatGPT· Gemini·Cursor·VS Code 등 모든 주요 AI 플랫폼 지원. OAuth 2.1+PKCE 인증. Cloudflare Code Mode에서 도구 동적 디스커버리로 98%+ 토큰 절감 사례.

    '
