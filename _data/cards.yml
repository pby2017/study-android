      CLI다. API 호출 없이 ~/.claude 같은 로컬 사용 기록(JSONL)을 읽어 일·주·월·세션 단위
      리포트와 USD 비용을 보여준다. `bunx ccusage`로 바로 실행되고, `blocks`는 Claude Code의
      5시간 과금 창을 추적하며 활성 블록을 모니터링한다. `--offline`으로 네트워크 없이
      번들된 LiteLLM 가격표를 쓰고, `--json`·`--breakdown`(모델별)·`--since/--until` 필터,
      그리고 상태줄(statusline, 베타) 표시도 지원한다. MIT 라이선스, README 기준 별 16.2k개.
      Claude Code뿐 아니라 Codex·OpenCode·Amp·Goose·Gemini CLI·Copilot CLI 등 다수 에이전트를
      통합 리포트로 묶는다.
    points:
      - "로컬 JSONL만 읽어 일·주·월·세션 비용 집계 — API 호출 없이 동작, `--offline` 지원"
      - "`blocks`로 Claude Code 5시간 과금 창 추적 / `--breakdown`은 모델별 분해"
      - "Claude Code·Codex·OpenCode·Amp·Goose·Gemini/Copilot CLI 등 통합 / MIT·16.2k★(주장)"
    source: "https://github.com/ryoppippi/ccusage"

  - category: ai
    title: "Claude Code on the web — 터미널 안 열고 브라우저·모바일에서 작업을 클라우드에 던지기"
    summary: >
      Claude Code를 터미널 없이 claude.ai/code에서 돌리는 리서치 프리뷰다. GitHub 레포를
      연결하고 할 일을 적으면, Anthropic이 관리하는 클라우드 VM에 레포가 클론된 채 작업이 돌고
      끝나면 PR 초안까지 자동으로 만들어 준다. 여러 작업을 여러 레포에 걸쳐 병렬로 띄울 수 있어
      버그 백로그·반복 수정 같은 일을 한 화면에서 한꺼번에 굴리기 좋다. 세션은 브라우저를 닫아도
      유지되고 Claude 모바일 앱에서 모니터링된다. Pro·Max·Team과 일부 Enterprise 좌석이 대상이다.
    points:
      - "각 세션은 격리된 Anthropic 관리 VM에서 실행 / GitHub은 보안 프록시로 인증돼 토큰이 컨테이너에 안 들어감"
      - "터미널의 `--remote`로 클라우드 작업을 띄우고 `--teleport`로 웹↔터미널 세션을 옮긴다"
      - "네트워크는 기본 Trusted 허용목록(npm·PyPI·crates.io 등)으로 제한, 환경별로 조정 / 리서치 프리뷰"
    source: "https://code.claude.com/docs/en/claude-code-on-the-web"

  - category: ai
    title: "AI-research-SKILLs(Orchestra Research) — 에이전트를 'AI 리서치 전문가'로 만드는 98개 스킬 묶음(9.7k★)"
    summary: >
      코딩 에이전트에 파인튜닝·분산학습·RAG·평가 같은 AI 리서치/엔지니어링 지식을 SKILL.md
      형태로 주입하는 오픈소스 라이브러리다. README 기준 98개 스킬을 23개 카테고리(파인튜닝,
      포스트트레이닝, 추론 서빙, 토크나이저, 평가, 안전·정렬, RAG, 멀티모달, MLOps, 메카닉 인터프
      등)로 나눠 담았고, 깃허브 별 9.7k(주장)를 받았다. 스킬은 표준 SKILL.md 포맷이라 Claude Code뿐
