- category: ai
  title: GNAP — git 저장소 하나로 AI·사람 에이전트를 조율하는 프로토콜
  summary: 'GNAP(Git-Native Agent Protocol)은 별도 서버·DB 없이 git 저장소 자체를 에이전트 조율 계층으로 쓰는 MIT 라이선스 RFC다. `.gnap/`에는 version, agents.json, tasks/, runs/, messages/만 두고, 나머지 예산·대시보드·거버넌스는 애플리케이션 계층으로 남긴다. 에이전트는 heartbeat 루프에서 git pull→자기 활성 상태 확인→할 일과 메시지 읽기→작업→commit/push를 반복한다. 그래서 git history가 감사 로그가 되고, 사람과 AI가 같은 JSON 프로토콜 위에서 동등한 참여자가 된다. README는 Farol Labs가 AI 2명+사람 2명의 4-agent 팀으로 50개 이상 작업을 같은 repo에서 조율한다고 설명한다. 2026-06-25 GitHub API 기준 67★라 대중성은 작지만, 학습 가치는 "에이전트 협업을 SaaS가 아니라 버전관리 가능한 파일 프로토콜로 볼 수 있다"는 점이다.

    '
