  level: 중급
  title: 코딩 에이전트 프롬프트 인젝션 — Claude Code 보호는 권한 모드에 달렸다
  summary: 프롬프트 인젝션은 저장소 파일·웹페이지 같은 신뢰할 수 없는 입력에 악성 지시를 넣어 에이전트의 행동을 바꾸려는 공격이다. Claude Code는 이를 완전히 막는다고 보장하지 않는다. 보호 동작은 권한 모드에 따라 다르다. Manual 모드에서는 민감한 도구 동작을 승인받고, `curl`·`wget` 등 네트워크 명령과 분석할 수 없는 명령은 확인을 요청한다. 웹 페이지 요약은 별도 모델 호출을 거칠 수 있지만, 이것을 프롬프트 인젝션 완전 차단으로 보면 안 된다. 특히 `-p` 세션에는 workspace/MCP trust prompt가 표시되지 않는다. 자동화에서는 최소 권한 규칙과 OS 수준 sandbox를 구성하고, 제안 명령과 변경 diff를 검토한다.
  points:
  - 'Manual 모드: 기본 미승인 동작은 확인을 요청하고, 네트워크/분석 불가 명령도 기본 승인 대상으로 둔다'
  - '`WebFetch`의 별도 요약 호출은 완전한 주입 방지 보증이 아니다. 신뢰하지 않는 내용을 그대로 입력하지 않는다'
  - '`-p`는 workspace/MCP trust prompt를 표시하지 않는다. headless에서는 명시적 권한·sandbox 설정과 결과 검증이 더 중요하다'
  source: https://code.claude.com/docs/en/security
  sources:
  - label: 'Claude Code Security — 모드별 보호, trust prompt의 -p 예외, 신뢰하지 않는 입력 권고'
    url: https://code.claude.com/docs/en/security
  - label: 'Configure permissions — 권한 모드와 규칙의 실제 적용 방식'
    url: https://code.claude.com/docs/en/permissions
  - label: 'Claude Code CLI reference — -p 비대화형 실행'
    url: https://code.claude.com/docs/en/cli-reference
  interview: 'Claude Code에서 프롬프트 인젝션 위험을 줄이려면 보호 기능 중 무엇을 확인해야 하며, `-p`를 쓸 때 어떤 차이를 고려해야 하나요?'
  answer: '권한 모드에 따라 승인·분류 동작이 다르므로 모드를 확인하고, 필요한 도구만 허용하며 sandbox와 deny 규칙을 적용한다. `-p`에서는 workspace/MCP trust prompt가 나타나지 않으므로 이를 대화형 모드와 같은 확인 경계로 간주하면 안 된다. 신뢰하지 않는 입력을 직접 파이프하지 않고 명령과 변경 결과를 검증한다.'

- category: ai
  level: 중급
  title: Devin Desktop — IDE와 여러 코딩 에이전트를 한 작업 공간에서 관리
  summary: Devin Desktop은 Windsurf의 IDE 기반 위에 에이전트 관리 화면을 결합한 개발 환경이다. Kanban형 Agent Command Center와 Spaces에서 로컬·클라우드 세션을 보고, ACP(Agent Client Protocol)를 구현한 외부 에이전트도 연결할 수 있다. 따라서 단순한 클라우드 코딩 에이전트나 IDE 교체로만 이해하기보다, 작업 위치·에이전트 종류·세션 간 공유 문맥을 관리하는 허브로 보는 편이 정확하다. 외부 ACP 에이전트의 실행과 결제는 해당 제공자에 위임되며, Devin의 개인정보 처리·약관이 적용되지 않을 수 있다. 연결 목록만 보지 말고 어떤 바이너리가 실행되고 어떤 권한·계정이 쓰이는지 확인한다.
  points:
  - 'Windsurf의 IDE 기능을 유지하며 로컬·클라우드 에이전트의 세션·PR을 Agent Command Center에서 관리'
  - 'ACP 호환 Codex CLI·Claude Agent·OpenCode 등 외부 에이전트를 연결 가능; 호환 프로토콜이 곧 같은 기능·정책을 뜻하지는 않음'
  - '외부 agent 작업은 해당 agent에 위임되고 결제도 외부 제공자와 직접 처리; Devin의 약관·개인정보 처리 범위와 구분'
  source: https://devin.ai/desktop/
  sources:
  - label: 'Devin Desktop — 공식 제품 개요·Agent Command Center·현재 요금제'
    url: https://devin.ai/desktop/
  - label: 'Windsurf is now Devin Desktop — 리브랜딩·IDE 및 로컬/클라우드 역할'
    url: https://devin.ai/blog/windsurf-is-now-devin-desktop
  - label: 'Agent Client Protocol — 지원 조건과 외부 agent의 실행·결제 경계'
    url: https://docs.devin.ai/desktop/acp
  interview: 'Devin Desktop에 ACP 에이전트를 연결하면 에이전트 실행과 비용은 누가 책임지며, ACP가 보장하지 않는 것은 무엇인가요?'
  answer: '외부 ACP 에이전트의 동작은 해당 에이전트에 위임되고 비용은 제공자와 직접 정산한다. ACP는 편집기와 agent 간 연결 프로토콜이지 동일한 기능·보안·정책을 보장하는 인증이 아니다. 실제 실행 바이너리, 권한, 계정 및 제공자 약관을 확인해야 한다.'

- category: ai
