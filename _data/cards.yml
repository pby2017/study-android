- category: ai
  title: cc-sdd(Spec-Driven Development) — Kiro의 '스펙→설계→태스크' 워크플로우를 아무 코딩 에이전트에서 쓰기(오픈소스)
  summary: 'cc-sdd는 Kiro식 spec-driven development를 여러 코딩 에이전트에 옮기는 MIT 라이선스 CLI다. v3.0부터는 명령 파일보다 Agent Skills 중심으로 재편되어, discovery → requirements → design → tasks → kiro-impl 흐름을 Claude Code·Codex 안정 지원, Cursor·Copilot·Windsurf·OpenCode·Gemini CLI·Antigravity 베타 지원으로 설치한다. 핵심 변화는 "문서 3개 만들기"가 아니라 경계다. design.md의 File Structure Plan과 tasks.md의 Boundary/Depends 표기가 작업 단위를 정하고, kiro-impl은 태스크마다 새 구현자·독립 리뷰어·자동 디버그 패스를 돌린다. 교훈은 스펙을 코드보다 위의 명령서로 보지 말고, AI와 사람이 병렬로 일할 수 있게 파일·책임·의존성 경계를 고정하는 계약으로 보라는 점이다.

    '
  points:
  - 'v3.0: 17개 Agent Skills, Claude Code·Codex stable, Cursor·Copilot·Windsurf·OpenCode·Gemini CLI·Antigravity beta'
