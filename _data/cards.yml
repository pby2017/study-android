  title: LangGraph — 프로덕션 멀티에이전트 표준, 상태 머신 기반·LangSmith 옵저버빌리티·Klarna/Uber 사용
  summary: 'LangGraph는 LangChain 팀이 만든 프로덕션 멀티에이전트 프레임워크의 사실상 표준이다. 에이전트 워크플로우를 방향 그래프(상태 머신)로 모델링하여 결정론적 실행·분기·루프·human-in-the-loop을 명시적으로 제어. Postgres 기반 체크포인팅으로 서버 크래시 후에도 워크플로우 복구. LangSmith 옵저버빌리티 네이티브 통합. Klarna·LinkedIn·Uber·Replit이 프로덕션 사용. CrewAI(빠른 프로토타입) → LangGraph(프로덕션) 마이그레이션 패턴이 업계 표준.

    '
  points:
  - '상태 머신: 결정론적 실행, 분기·루프·HITL 명시적 제어'
  - '체크포인팅: Postgres 기반, 서버 크래시 복구'
  - '프로덕션 검증: Klarna·LinkedIn·Uber·Replit 사용'
  source: https://odsea.com/blog/langgraph-vs-crewai-vs-autogen-production
