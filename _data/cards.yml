- category: ai
  title: Dify — 비주얼 캔버스로 agentic workflow·RAG·LLMOps를 묶는 LLM 앱 플랫폼(~147k★)
  summary: 'Dify는 LLM 앱을 프로토타입에서 운영까지 가져가기 위한 오픈소스 플랫폼이다. README 기준 핵심은 visual workflow canvas, RAG pipeline, Agent capabilities, model management, observability, Backend-as-a-Service API를 한 화면에 묶는 점이다. 에이전트는 Function Calling 또는 ReAct 기반으로 정의하고 50개 이상 내장 도구나 커스텀 도구를 붙일 수 있으며, GPT·Mistral·Llama·OpenAI 호환 모델 같은 여러 provider를 교체한다. 라이선스는 GitHub API가 `NOASSERTION`으로 반환하고, LICENSE는 Apache 2.0 기반이지만 멀티테넌트 운영과 프런트엔드 로고/저작권 조건이 붙은 Dify Open Source License라고 명시한다. 실무 교훈은 "노코드 챗봇"보다, RAG·도구·모델·관측성·API 경계를 한 LLMOps 런타임으로 관리하는 선택지로 봐야 한다는 점이다.

    '
