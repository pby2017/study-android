  summary: 'Open WebUI는 142k+ GitHub 스타의 셀프호스팅 AI 채팅 플랫폼이다. Ollama(로컬 모델)와 OpenAI/ Anthropic 호환 API를 단일 인터페이스에서 통합. 내장 RAG(문서 기반 지식 베이스), 음성·비전·검색 지원. RBAC·SSO·LDAP으로 엔터프라이즈 팀 관리(ChatGPT Team $30+/월 기능을 무료 제공). Docker 원커맨드 배포(pip install open-webui도 가능). Python 파이프라인으로 확장. 주의: 커스텀 라이선스 (MIT 아님), 엄격한 OSS 필요 시 LibreChat 대안.

    '
