  level: 중급
  title: Roo Code → Zoo Code — archived 에이전트에서 커뮤니티 포크로 옮기기
  summary: 'Roo Code는 2026-05-15 저장소와 확장 배포를 종료하고 GitHub를 read-only로 보관했다(당시 24.3k★, Apache-2.0). 원 저장소는 커뮤니티 포크 Zoo Code와 Cline을 대안으로 안내한다. Zoo Code는 Roo 설정 구조와 Apache-2.0 기반을 이어받아 별도 개발을 계속하며, GitHub는 약 2.1k★를 표시한다(2026-11-22 확인). 공식 마이그레이션은 Roo 설정을 파일로 export한 뒤 Zoo에서 import하는 방식이다. export 파일에는 API key가 포함될 수 있으므로 안전하게 보관하고, 가져온 provider·모델·credentials를 다시 확인한다. 설정 호환은 장기적인 기능 동등성이나 유지보수를 보장하지 않는다. 포크를 선택할 때는 현재 릴리스·기여 활동·보안 대응과 전환 비용을 함께 평가한다.'
  points:
  - 'Roo upstream은 2026-05-15 archive; read-only 전환과 대안은 저장소 공지에서 확인'
  - 'Zoo Code는 별도 커뮤니티 포크 — 현재 repo 2.1k★, Apache-2.0 (2026-11-22)'
  - '설정 export/import 전후에 API key 포함 파일을 보호하고 credentials를 재검증'
  source: https://github.com/RooCodeInc/Roo-Code
  sources:
  - label: 'Roo Code — archive 날짜·read-only 상태·공식 대안 안내'
    url: https://github.com/RooCodeInc/Roo-Code
  - label: 'Zoo Code — 커뮤니티 포크·현재 개발 설명·별점 snapshot'
    url: https://github.com/Zoo-Code-Org/Zoo-Code
  - label: 'Zoo Code 공식 이전 안내 — export/import와 API key 주의'
    url: https://docs.zoocode.dev/roo-to-zoo-migration
  interview: 'Roo Code에서 Zoo Code로 설정을 옮길 때, 단순히 export/import만 하면 안전하고 완전히 호환된다고 볼 수 있나요?'
  answer: '아니다. 설정 export 파일에는 API key 같은 민감값이 있을 수 있으므로 안전하게 보관해야 한다. Zoo는 설정 파일을 import해 기존 설정과 병합하므로 가져온 provider·모델·credentials를 직접 확인하고 작은 작업으로 검증한다. 커뮤니티 포크는 별도 프로젝트이므로 릴리스와 보안 유지보수를 계속 평가한다.'
- category: ai
  level: 중급
  title: Ruler — 코딩 에이전트 지침의 공통 원본과 생성 파일 관리
  summary: 'Ruler는 `.ruler/`의 Markdown 지침을 `ruler.toml`에서 선택한 코딩 에이전트 설정 파일로 생성하는 CLI다. 루트 `AGENTS.md`와 `.ruler/AGENTS.md`, 나머지 규칙을 정해진 순서로 합치고 각 원본 경로를 주석으로 남긴다. 단, 기본 동작은 같은 합성 규칙을 여러 에이전트에 배포하는 것이다. Ruler가 에이전트별 실행 정책이나 보안 권한을 강제하지는 않는다. `ruler apply`는 기존 파일을 백업한 뒤 교체할 수 있고 `.gitignore`도 수정할 수 있으므로 `--agents`로 대상을 좁히고 `--dry-run`과 diff를 검토한다. 팀은 `.ruler/` 원본을 공유한 뒤 각 개발자가 apply하거나 생성 파일을 명시적으로 관리해야 한다. GitHub 저장소는 MIT이며 약 3k★를 표시한다(2026-11-22 확인).'
  points:
  - '규칙 원본을 한곳에서 편집하고, 선택한 호스트별 설정 파일은 `ruler apply`로 생성'
  - '대상들은 기본적으로 같은 합성 규칙을 받음 — 호스트별 보안·권한 enforcement는 별도'
  - '`--dry-run` 후 변경 diff 확인; 기존 파일 백업·`.gitignore` 변경·팀 동기화 방식을 점검'
  source: https://github.com/intellectronica/ruler
  sources:
  - label: 'Ruler README — 규칙 입력 순서·배포·기존 파일 백업'
    url: https://github.com/intellectronica/ruler#readme
  - label: 'Ruler README — dry-run·대상 지정·nested 기능의 experimental 상태'
    url: https://github.com/intellectronica/ruler#nested-rule-loading
  - label: 'GitHub 저장소 — MIT 라이선스·별점 snapshot'
    url: https://github.com/intellectronica/ruler
  interview: 'Ruler의 `ruler apply`는 여러 코딩 에이전트에 규칙을 배포할 때 무엇을 보장하지 않나요? 안전한 적용 절차는 무엇인가요?'
  answer: 'Ruler는 선택한 호스트용 지침 파일을 생성하지만, 규칙이 모든 호스트에서 똑같이 로드되거나 보안 권한으로 강제된다고 보장하지 않는다. 기본적으로 같은 규칙을 합쳐 배포한다. `--agents`로 대상을 제한하고 `--dry-run` 및 diff를 확인한 뒤 적용하며, 백업·gitignore 변경과 팀의 generated-file 동기화 방식을 점검한다.'
- category: ai
  level: 중급
  title: Pi — badlogic/pi-mono에서 earendil-works/pi로 이어진 코딩 에이전트
  summary: 'Pi는 서로 다른 두 제품이 아니다. Mario Zechner가 시작한 `badlogic/pi-mono` 저장소가 2026년 Earendil로 이동해 현재 `earendil-works/pi`에서 개발되는 같은 코딩 에이전트다. 현재 저장소는 통합 모델 API(`pi-ai`), 에이전트 런타임, 코딩 CLI, TUI 등을 담은 TypeScript 모노레포이며, 확장·스킬·프롬프트·패키지로 작업 방식을 바꿀 수 있다. GitHub는 약 123k★를 표시했다(2026-11-22 확인). 단, 확장 가능성이 곧 안전한 격리를 뜻하지 않는다. Pi는 실행 사용자 권한으로 동작하며 내장 권한 차단 기능이 없으므로, 신뢰하지 않는 코드·저장소에서는 별도 컨테이너나 VM을 검토한다.'
  points:
  - 저장소 이동은 프로젝트 분화가 아님 — 기존 badlogic 주소는 현재 earendil-works 저장소로 리디렉션
  - CLI부터 TypeScript SDK까지 제공; 확장·스킬·MCP 연결 등 필요한 구성을 선택
  - 프롬프트·확장·저장소 콘텐츠도 신뢰 경계의 일부 — 별도 실행 격리는 사용자가 설계
  source: https://github.com/earendil-works/pi
  sources:
  - label: 'Pi 공식 저장소 — 현재 패키지 구성·기능·별점 snapshot'
    url: https://github.com/earendil-works/pi
  - label: 'Mario Zechner의 이전 공지 — 저장소 이동·프로젝트 의사결정·MIT 코어'
    url: https://mariozechner.at/posts/2026-04-08-ive-sold-out/
  - label: 'Pi 보안 정책 — OS 사용자 권한 경계와 샌드박스 책임'
    url: https://github.com/earendil-works/pi/security/policy
  interview: 'badlogic/pi-mono와 earendil-works/pi는 별개의 에이전트인가요? Pi를 신뢰하지 않는 코드베이스에서 실행할 때 무엇을 추가로 고려해야 하나요?'
  answer: '별개 제품이 아니라 같은 Pi 프로젝트의 이전·현재 저장소 주소다. 현재 구현은 실행한 사용자 계정의 권한으로 동작하고, Pi 자체가 파일·프로세스·네트워크 접근을 차단하는 권한 시스템을 제공하지 않는다. 신뢰하지 않는 작업은 컨테이너나 VM 등 별도 격리 환경을 검토하고, 확장과 저장소 지침도 신뢰성을 확인한다.'
- category: ai
  level: 고급
  title: MCP 2026-07-28 — 전송은 stateless, 앱 상태는 명시적 핸들로
  summary: 'MCP의 2026-07-28 사양은 프로토콜 계층의 세션을 없애고 요청을 독립적으로 처리하도록 바꿨다. 따라서 Streamable HTTP 서버는 `initialize` 핸드셰이크와 `Mcp-Session-Id`에 의존하지 않고, 인스턴스 간 요청을 분산할 수 있다. 상태가 필요한 애플리케이션은 `cart_id` 같은 핸들을 도구 결과로 돌려주고 다음 호출에 다시 받으면 된다. 즉, 전송 계층이 stateless여도 앱은 stateful일 수 있다. 이 버전은 호환성에 영향을 주는 변경을 포함하므로 SDK·호스트·서버가 같은 사양과 기능을 지원하는지 확인해야 한다. Tasks와 MCP Apps는 기본 필수 기능이 아니라 양쪽의 명시적 지원이 필요한 opt-in 확장이다. MCP 표준은 도구 권한이나 사용자 동의를 스스로 강제하지 않으므로, 호스트의 승인·데이터 보호 설계도 별도로 검토한다. GitHub 공식 저장소는 약 9.7k★를 표시했다(2026-11-22 확인).'
  points:
  - '`initialize`와 프로토콜 세션 ID 제거 — Streamable HTTP 로드밸런싱에서 sticky session 의존 감소'
  - 장기 앱 상태는 서버가 만든 명시적 핸들로 전달; 프로토콜 stateless ≠ 애플리케이션 stateless
  - 2026-07-28 대상 구현은 이전 버전과의 호환성을 검증하고, 선택적 확장과 사용자 승인 경계를 각각 확인
  source: https://modelcontextprotocol.io/specification/2026-07-28
  sources:
  - label: 'MCP 2026-07-28 사양 — stateless 요청과 선택적 확장'
    url: https://modelcontextprotocol.io/specification/2026-07-28
  - label: '공식 사양 변경 안내 — breaking changes·HTTP 라우팅·상태 핸들 예시'
    url: https://blog.modelcontextprotocol.io/posts/2026-07-28-release-candidate/
  - label: '공식 GitHub 저장소 — 사양/문서와 별점 snapshot'
    url: https://github.com/modelcontextprotocol/modelcontextprotocol
  interview: 'MCP 2026-07-28에서 프로토콜이 stateless라는 말은 애플리케이션도 상태를 가질 수 없다는 뜻인가요? 업그레이드 시 무엇을 검증해야 하나요?'
  answer: '아니다. 프로토콜 세션은 없어졌지만 서버는 `cart_id` 같은 명시적 핸들을 발급하고 클라이언트가 다음 도구 호출에 전달해 앱 상태를 유지할 수 있다. 업그레이드에서는 사양 버전이 맞는지, `initialize`·`Mcp-Session-Id` 의존을 제거했는지, Streamable HTTP 헤더와 클라이언트·서버 SDK의 호환성을 확인한다. Tasks나 MCP Apps 같은 opt-in 확장은 양쪽 지원과 사용자 승인 경계를 별도로 검증한다.'

- category: ai
  level: 중급
  title: Cursor Agent 검색 — 서버 임베딩에서 로컬 Instant Grep로
  summary: 'Cursor의 검색 방식은 바뀌었다. 현재 Agent는 심볼명·오류 문자열처럼 정확한 단서에는 Instant Grep를 쓰고, 넓은 탐색에는 여러 검색과 파일 읽기를 조합하거나 Explore subagent를 사용할 수 있다. Cursor 팀은 2026년 7월 별도 시맨틱 임베딩 인덱싱을 줄이고 grep 기반 검색으로 전환한다고 안내했다. 현재 문서에 따르면 검색 인덱스는 로컬에서 만들며, 인덱스 구축을 위해 코드나 경로를 업로드하거나 코드 임베딩을 저장하지 않는다. 단, Agent가 파일을 열면 그 내용은 모델 요청에 포함될 수 있다. 그러므로 “검색 인덱스가 로컬”이라는 사실만으로 모델 처리까지 로컬이라고 판단하면 안 된다.'
  points:
  - '심볼·문자열이 분명하면 Instant Grep; 탐색 질문은 여러 검색어·디렉터리 탐색·파일 읽기·Explore를 조합'
  - '현재 검색 인덱스는 로컬이며 .gitignore·.cursorignore가 검색 대상에 적용됨'
  - '인덱스 프라이버시와 모델 요청 데이터는 별도 경계 — Agent가 읽은 코드가 모델로 전송될 수 있음'
  source: https://cursor.com/docs/agent/tools/search
  sources:
  - label: 'Cursor Search 문서 — Instant Grep·로컬 인덱스·파일 내용의 모델 전송 구분'
    url: https://cursor.com/docs/agent/tools/search
  - label: 'Cursor 팀 답변 — 2026년 7월 시맨틱 임베딩 검색에서 grep 기반 검색으로 전환'
    url: https://forum.cursor.com/t/what-do-you-think-about-cursor-removing-the-codebase-indexing-settings/165899
  interview: 'Cursor의 검색 인덱스가 로컬에 있다는 사실만으로 코드가 모델 제공자에게 전혀 전송되지 않는다고 결론내릴 수 있나요?'
  answer: '아니다. 현재 Cursor 문서는 검색 인덱스 구축을 위해 코드·경로를 업로드하거나 임베딩을 저장하지 않는다고 설명한다. 하지만 Agent가 검색 결과 파일을 열면 파일 내용이 모델 요청에 포함될 수 있다. 검색 인덱스 저장 위치와 모델 요청 데이터 처리는 별도로 확인해야 한다.'
- category: ai
  level: 중급
  title: Continuous Claude — 반복 실행에 PR·CI 검증과 병합을 연결
  summary: 'Continuous Claude는 Claude Code 또는 Codex CLI를 반복 실행하고, 매 회차의 작업 메모를 SHARED_TASK_NOTES.md에 넘기는 도구다. 설정에 따라 브랜치와 PR을 만들고 GitHub의 필수 체크 및 리뷰가 끝난 뒤 병합을 시도한다. 초록불은 설정된 검사가 통과했다는 뜻이지 코드가 완벽하다는 보증은 아니다. `--max-runs`, `--max-duration`, `--max-cost`, `--stall-threshold`로 실행을 제한하고, 실제 병합 전 저장소의 보호 규칙과 리뷰 요구를 확인한다. 전체 PR 자동화는 GitHub용이며, 로컬 모드도 제공한다. GitHub는 약 1.4k★를 표시했다(2026-11-22 확인).'
  points:
  - '회차별 맥락은 메모 파일로 전달하고, 선택한 Claude/Codex provider로 작업'
  - 'PR 생성·체크·리뷰·병합 자동화는 GitHub 기반; 다른 forge는 전체 PR 흐름을 지원하지 않음'
  - 'Codex의 `--max-cost`는 사용량만으로 자동 환산되지 않으므로 비용 단가를 설정해야 예산 제한으로 동작'
  source: https://github.com/AnandChowdhary/continuous-claude
  sources:
  - label: 'Continuous Claude README — 반복·PR 생명주기·GitHub 지원 범위와 실행 제한'
    url: https://github.com/AnandChowdhary/continuous-claude
  - label: 'Continuous Claude README — Codex 비용 한도는 토큰 단가 설정 필요'
    url: https://github.com/AnandChowdhary/continuous-claude#flags
  interview: 'Continuous Claude에서 PR 체크가 통과하면 자동 병합해도 안전하다고 볼 수 있나요? Codex 사용 시 비용 상한도 자동으로 정확히 계산되나요?'
  answer: '둘 다 단정할 수 없다. 통과는 구성된 체크와 요구된 리뷰 조건의 결과일 뿐, 요구사항·보안·동작이 완전하다는 보증은 아니다. 브랜치 보호와 사람의 리뷰 정책을 저장소에서 확인하고 run·시간·비용 한도를 둔다. Codex는 토큰 사용량을 보고하므로 `--max-cost`를 적용하려면 입력·출력 단가를 제공해야 한다.'
- category: ai
  level: 중급
  title: Google Antigravity — 데스크톱·CLI·SDK·호스팅 에이전트를 구분하기
  summary: 'Antigravity는 하나의 앱 이름만이 아니라 서로 다른 실행 표면을 가진 Google의 에이전트 생태계다. Antigravity 2.0 데스크톱 앱은 병렬 에이전트를 관리하고, CLI는 터미널에서 작업하며, SDK는 애플리케이션에서 에이전트 harness를 사용하게 한다. Gemini API의 Managed Agents는 Google이 제공하는 Linux sandbox에서 코드를 실행하므로 로컬 실행과 혼동하지 않는다. 이 환경은 기본적으로 외부 네트워크 연결이 열려 있다. 필요하면 allowlist로 제한하고 최소 권한 credentials만 제공한다. Android 개발에서는 AI Studio의 prompt 기반 native Android 생성과 Antigravity로 프로젝트를 이어가는 흐름을 구분한다. 생성 결과는 빌드와 테스트로 검증한다.'
  points:
  - '데스크톱 앱=여러 에이전트 관리; CLI=터미널; SDK=자체 앱에서 harness 사용'
  - 'Managed Agents=Google-hosted Linux sandbox — outbound network는 기본 허용, allowlist·최소 권한 자격 증명 적용'
  - 'AI Studio의 Android 생성은 별도 경로; 생성물을 Antigravity로 가져와 이어서 개발하고 실제 빌드·테스트'
  source: https://blog.google/innovation-and-ai/technology/developers-tools/google-io-2026-developer-highlights/
  sources:
  - label: 'Google I/O 2026 공식 발표 — Antigravity 앱·CLI·SDK·Managed Agents·AI Studio Android 지원'
    url: https://blog.google/innovation-and-ai/technology/developers-tools/google-io-2026-developer-highlights/
  - label: 'Gemini API 공식 문서 — Managed Agents sandbox·network 기본값·credentials·human oversight'
    url: https://aistudio.google.com/docs/agents
  - label: 'Antigravity 제품 페이지 — 데스크톱의 병렬 에이전트·Scheduled Tasks·지원 플랫폼'
    url: https://antigravity.google/product/antigravity-2
  interview: 'Managed Agents가 OS 격리 Linux sandbox에서 실행된다는 사실만으로 네트워크 접근과 secrets가 안전하다고 판단할 수 있나요?'
  answer: '아니다. 현재 Gemini API 문서는 outbound network가 기본적으로 열려 있다고 명시한다. 허용 도메인 allowlist를 적용하고, 최소 권한·짧은 수명의 자격 증명만 연결하며, 생성 결과를 배포 전에 검토한다. 또한 Managed Agents는 Google-hosted 실행 환경이므로 로컬 IDE·CLI 실행과 데이터 경계를 구분해야 한다.'
- category: ai
  level: 중급
  title: Mastra — 열린 작업은 Agent, 정해진 절차는 Workflow
  summary: 'Mastra는 TypeScript 제품에 AI Agent와 Workflow를 넣는 프레임워크다. 핵심 선택은 작업이 정해져 있는지다. 목표가 열려 있고 모델이 도구를 골라 반복해야 하면 Agent를 쓰고, 단계·데이터 흐름·분기가 사전에 정해져 있으면 Workflow로 제어한다. Workflow는 스키마가 있는 단계를 조합하고 중단·재개를 지원해 사람 승인을 절차에 넣을 수 있다. 모델 라우팅, 저장소, MCP, evals와 observability도 제공한다. GitHub는 약 29.7k★를 표시했다(2026-11-22 확인). 코어는 Apache-2.0이지만 `ee/` 경로 코드는 별도 Mastra Enterprise License이므로 배포 전에 실제 사용하는 파일의 라이선스를 확인한다.'
  points:
  - 'Agent=열린 목표와 동적 도구 선택; Workflow=미리 정의한 순서·분기·데이터 흐름'
  - 'Workflow의 suspend/resume으로 승인이나 사용자 입력 후 실행을 이어갈 수 있음'
  - '라이선스 경계: 대부분 코어 Apache-2.0, `ee/` 경로는 프로덕션에 별도 계약 필요'
  source: https://github.com/mastra-ai/mastra
  sources:
  - label: 'Mastra README — 제품 범위·모델 라우팅·기능·라이선스와 별점 snapshot'
    url: https://github.com/mastra-ai/mastra
  - label: 'Agent 공식 문서 — 동적 목표 처리와 도구 선택'
    url: https://mastra.ai/docs/agents/overview
  - label: 'Workflow 공식 문서 — 사전 정의한 단계·데이터 흐름·중단/재개'
    url: https://mastra.ai/docs/workflows/overview
  interview: 'Mastra에서 요청을 Agent와 Workflow 중 무엇으로 구현할지 어떤 기준으로 정하나요?'
  answer: '요청의 절차가 사전에 알려져 있는지로 판단한다. 순서·입출력·분기를 개발자가 정의할 수 있으면 Workflow가 실행을 예측하고 검증하기 쉽다. 목표만 주어지고 필요한 도구나 다음 행동을 모델이 선택해야 하면 Agent가 적합하다. 두 방식을 함께 써서 Workflow의 일부 단계에서 Agent를 호출할 수도 있다.'
- category: ai
  level: 중급
  title: Cursor CLI 헤드리스 모드 — `agent -p`를 자동화에 안전하게 쓰기
  summary: 'Cursor CLI의 `agent -p`/`--print`는 대화형 승인 질문 없이 스크립트·CI에서 실행하는 모드다. `--force`가 없어도 허용된 워크스페이스 수정은 실행될 수 있고, 승인이나 허용 규칙이 필요한 동작은 질문하지 못하므로 거부된다. `--force`/`--yolo`는 deny 규칙과 팀 정책을 제외한 동작을 자동 승인하므로 격리된 작업공간에서만 사용한다. 자동화 결과는 `--output-format json`으로 한 번에 파싱하거나 `stream-json`으로 이벤트를 처리하고, 인증 키는 `CURSOR_API_KEY` 환경변수로 전달한다.'
  points:
  - '`-p`는 read-only가 아니다: 허용된 workspace 편집은 실행하고, 승인이 필요한 동작은 비대화형 실행에서 거부한다'
  - '`--force`/`--yolo`는 권한 확인 없이 진행하므로 임시 브랜치·격리 환경을 사용하고 deny/team 제한을 유지한다'
  - '`json`은 완료 결과 1개, `stream-json`은 NDJSON 이벤트이며 실시간 텍스트 조각은 `--stream-partial-output`으로 받는다'
  source: https://cursor.com/docs/cli/headless
  sources:
  - label: 'Cursor CLI Headless — print mode 권한·승인 및 팀 제한'
    url: https://cursor.com/docs/cli/headless
  - label: 'Cursor CLI Output format — JSON·NDJSON·partial output'
    url: https://cursor.com/docs/cli/reference/output-format
  - label: 'Cursor CLI Authentication — API key 환경변수'
    url: https://cursor.com/docs/cli/reference/authentication
  interview: '`agent -p`가 대화형 모드보다 안전하다고 볼 수 있나요? `--force`는 어떤 위험을 추가하나요?'
  answer: '아니다. print mode는 승인 질문을 할 수 없을 뿐, 허용된 workspace 편집은 실행한다. 승인 필요한 동작은 거부한다. `--force`는 deny 규칙과 팀 정책을 제외한 동작을 승인 없이 실행하므로 격리된 작업공간에서 제한적으로 사용해야 한다.'
- category: ai
  level: 중급
  title: Gartner AI 코딩 에이전트 보고서 — 순위보다 팀의 사용 사례를 검증하라
  summary: 'Gartner는 2026년 보고서에서 시장 이름을 Enterprise AI Coding Agents로 정하고 12개 공급자를 비교했다. Magic Quadrant의 두 축은 실행 역량(Ability to Execute)과 비전 완성도(Completeness of Vision)다. 이는 전체 팀에 가장 좋은 제품의 순위가 아니다. Gartner도 예상 성과·배포 제약·우선 사용 사례를 기준으로 후보를 고른 뒤 Proof of Value로 검증하라고 권한다. Android 팀이라면 코드 생성뿐 아니라 저장소 맥락, 테스트·리뷰 흐름, 권한·감사, 비용을 실제 작업으로 비교한다.'
  points:
  - '두 축: 실행 역량과 비전 완성도; 사분면은 특정 평가 기준에 따른 위치이지 만능 점수가 아니다'
  - 'Gartner의 선택 기준: 원하는 결과·배포 제약·주요 사용 사례를 정하고 후보를 PoV로 시험한다'
  - 'Android 실무 검증: 테스트/리뷰 연계, 저장소 접근권한, 감사 기록, 비용을 실제 작업에서 비교한다'
  source: https://www.gartner.com/en/documents/7879277
  sources:
  - label: 'Gartner Magic Quadrant — 보고서명·발행일·12개 공급자·평가 축'
    url: https://www.gartner.com/en/documents/7879277
  - label: 'Gartner 선택 가이드 — 결과·배포 제약·사용 사례와 PoV 검증'
    url: https://www.gartner.com/en/documents/8338717
  - label: 'Gartner newsroom — 개발자 경험 외 거버넌스·가격·지원·상업적 준비도도 강조'
    url: https://www.gartner.com/en/newsroom/press-releases/2026-05-20-gartner-says-the-market-for-enterprise-ai-coding-agents-is-entering-a-new-phase-of-expansion-and-competitive-realignment
  interview: 'Gartner Magic Quadrant에서 Leader로 분류된 도구를 바로 선택하면 안 되는 이유는 무엇인가요?'
  answer: 'Magic Quadrant는 실행 역량과 비전 완성도라는 정해진 축의 비교다. 우리 팀의 작업, 데이터·배포 제약, 권한·비용 요구를 모두 대변하지 않는다. 후보를 실제 저장소의 우선 사용 사례에 적용해 결과와 운영 위험을 Proof of Value로 확인해야 한다.'
- category: ai
  level: 중급
  title: AGENTS.md 연구 — 컨텍스트는 성공률보다 비용을 늘릴 수도 있다
  summary: 'ETH Zurich 연구팀은 SWE-bench와 Python 저장소의 이슈 해결 태스크로 에이전트 컨텍스트 파일을 비교했다. 자동 생성 파일은 태스크 성공률을 유의미하게 높이지 못했지만 추론 비용은 평균 20~23% 증가했다. 개발자가 작성한 파일은 자동 생성본보다 나았으나, 파일이 없는 경우보다 성공률이 높다는 차이는 통계적으로 유의하지 않았다. 따라서 AGENTS.md가 불필요하다는 뜻은 아니다. README에 없는 저장소 고유 규칙만 적고, 실제 태스크로 효과를 검증하라는 결과다. 연구가 Python에 한정되므로 Android/Kotlin에도 그대로 적용된다고 단정할 수 없다.'
  points:
  - '자동 생성 컨텍스트: 성공률 차이는 유의하지 않았고, 비용은 SWE-bench 20%·CTXbench 23% 증가'
  - '개발자 작성본은 자동 생성본보다 평균 7% 나았지만, 무컨텍스트 대비 2.4% 개선은 유의하지 않음'
  - '실무 적용: 특수 빌드·규칙처럼 README에 없는 정보만 적고, 팀 저장소의 실제 작업으로 전후 비교'
  source: https://arxiv.org/abs/2602.11988
  sources:
  - label: 'arXiv 논문 v3 — abstract·수정 이력·핵심 결론'
    url: https://arxiv.org/abs/2602.11988
  - label: '논문 본문 — 벤치마크, 실험 결과, 유의성 검정 및 Python 한계'
    url: https://arxiv.org/html/2602.11988
  interview: '이 연구만으로 Android 프로젝트의 AGENTS.md도 제거해야 한다고 결론 내릴 수 있나요?'
  answer: '아니다. 연구 태스크는 Python 저장소의 이슈 해결에 한정됐다. 자동 생성 개요가 항상 성능을 높인다고 볼 근거는 약하지만 Kotlin·Android 프로젝트까지 일반화할 수는 없다. 비표준 빌드나 팀 규칙처럼 유용할 수 있는 지침은 남기고, 대표 작업에서 성공률·비용을 비교해 판단한다.'
- category: ai
  level: 중급
  title: Claude Dreams — 세션 메모리를 정리해 다음 작업으로 잇기
  summary: 'Dreams는 Claude Managed Agents의 비동기 메모리 정리 API다. 기존 memory store와 1~100개 세션 transcript를 바탕으로 새 출력 store를 만들며, 입력 store는 바꾸지 않는다. 결과를 검토한 뒤 다음 세션에 연결하거나 버릴 수 있다. 모델 가중치를 학습하는 기능은 아니다. Anthropic 자체 연구에서 여러 문서를 연결하는 과제는 wiki 형태의 memory가 도움이 됐지만, 한 문서에서 답을 찾을 수 있는 과제에는 뚜렷한 이득이 없었다. 현재 research preview이며 토큰 과금·ZDR 비대상이므로 데이터 정책도 확인한다.'
  points:
  - '기존 store + 세션 1~100개 → 별도 출력 store; 원본은 유지되므로 결과를 검토·폐기할 수 있다'
  - 'Anthropic 연구: 문서 간 연결이 필요한 과제에 유용했지만, 검색만으로 답할 수 있는 과제에는 이득이 없을 수 있다'
  - 'Harvey는 자사 테스트에서 완료율 약 6배를 보고했지만 보편적 성능 보장은 아니다; 비용은 선택 모델의 토큰 사용량에 비례한다'
  source: https://platform.claude.com/docs/en/managed-agents/dreams
  sources:
  - label: 'Dreams 공식 문서 — 입력·출력 store, 검토 흐름, 미리보기·요금·데이터 정책'
    url: https://platform.claude.com/docs/en/managed-agents/dreams
  - label: 'Anthropic 연구 — 메모리와 dreaming의 태스크별 이점 및 한계'
    url: https://www.anthropic.com/research/components-of-agent-memory
  - label: 'Anthropic 발표 — Harvey의 6배 결과는 고객사의 자체 테스트'
    url: https://claude.com/blog/new-in-claude-managed-agents
  interview: 'Dreams가 Claude 모델 자체를 학습시키나요? 적용 전에 무엇을 확인해야 하나요?'
  answer: '아니다. Dreams는 세션 기록과 기존 memory store를 정리해 별도 출력 store를 만드는 비동기 작업이다. 모델 가중치는 바뀌지 않는다. 출력은 원본과 비교해 검토한 뒤 다음 세션에 붙이거나 폐기한다. 대표 태스크에서 메모리 사용 전후의 정확도와 비용을 비교하고, research preview·토큰 과금·ZDR 비대상이라는 데이터 조건도 확인한다.'
- category: ai
  level: "중급"
  title: OpenClaw — Gateway 하나는 하나의 신뢰 경계
  summary: 'OpenClaw는 메시지 입력을 받아 파일·셸·네트워크·메신저 도구를 실행할 수 있는 상시 AI assistant다. 공식 위협 모델은 Gateway 하나를 운영자 한 명 또는 서로 신뢰하는 팀의 경계로 둔다. 같은 Gateway에 여러 계정을 연결했다고 사용자 간 대화와 도구 접근이 격리되는 것은 아니다. 신뢰 수준이 다르면 Gateway와 자격 증명을 분리하고, 가능하면 OS 사용자나 호스트도 나눈다. 설정 변경이나 외부 공개 전 `openclaw security audit`로 권한·노출 설정을 점검한다.'
  points:
  - '`sessionKey`는 세션 라우팅 값이지 사용자 인증이나 권한 경계가 아니다'
  - '도구가 켜진 에이전트는 기본 설정에서 Gateway의 다른 에이전트 세션에도 접근할 수 있다'
  - '혼합 신뢰 사용자: Gateway·자격 증명을 분리하고, 위협 수준에 따라 OS 사용자·호스트도 격리'
  - '관심 신호: GitHub 저장소 약 394.7k★·82.9k forks 스냅샷(2026-11-22); 인기는 보안성의 증거가 아니다'
  source: https://docs.openclaw.ai/gateway/security/trust-model
  sources:
  - label: 'OpenClaw 공식 보안 신뢰 모델 — Gateway 범위, sessionKey 한계, 위협 모델'
    url: https://docs.openclaw.ai/gateway/security/trust-model
  - label: '보안 감사 — 변경 후 점검할 접근·도구·네트워크·샌드박스 설정'
    url: https://docs.openclaw.ai/gateway/security/running-the-audit
  - label: 'GitHub 저장소 — stars/forks·MIT 라이선스 관심 신호'
    url: https://github.com/openclaw/openclaw
  interview: 'OpenClaw Gateway 하나에 서로 신뢰하지 않는 여러 사용자를 연결할 때 `sessionKey`만 다르게 주면 안전한 tenant 격리가 되나요?'
  answer: '아니다. `sessionKey`는 세션 선택용 라우팅 값이며 인증 경계가 아니다. OpenClaw는 Gateway 하나를 한 신뢰 도메인으로 가정한다. 적대적이거나 신뢰 수준이 다른 사용자는 별도 Gateway와 자격 증명으로 나누고, 필요하면 OS 사용자나 호스트도 분리한다. 설정 변경이나 외부 공개 전 `openclaw security audit`도 실행한다.'
- category: ai
