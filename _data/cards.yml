  - category: ai
    title: "Copilot 모델 폐기 일정 — 자동화 프롬프트의 모델명을 운영 자산으로 관리하기"
    summary: >
      GitHub는 2026년 6월 18일 Opus 4.6 (fast)를 2026년 6월 29일 Copilot 전 표면에서 폐기하고
      Opus 4.8 (fast)를 대안으로 쓰라고 공지했다. 앞서 2026년 6월 2일에는 GPT-4.1도 Copilot Chat,
      inline edits, ask, agent mode, code completions에서 폐기하고 GPT-5.5를 대안으로 제시했다. 이 변경은
      단순 릴리스 노트가 아니라 에이전트 운영 리스크다. 스크립트, 사내 문서, AGENTS.md, CI 프롬프트,
      팀별 워크플로에 모델명을 하드코딩하면 어느 날 같은 자동화가 실패하거나 다른 품질·비용 특성으로
      바뀔 수 있다. 모델명은 설정으로 빼고, 폐기일 전 검증 루틴을 두는 것이 안전하다.
    points:
      - "Opus 4.6 (fast): 2026-06-29 폐기 예정, 대안은 Opus 4.8 (fast)"
      - "GPT-4.1: 2026-06-01 Copilot 전 표면에서 폐기, 대안은 GPT-5.5"
      - "모델명 하드코딩 대신 설정화·폐기일 전 검증 루틴 필요"
    source: "https://github.blog/changelog/2026-06-18-upcoming-deprecation-of-opus-4-6-fast/"

  - category: ai
    title: "ML Kit APO — 온디바이스 Gemini Nano 프롬프트를 서버에서 자동 탐색하기"
    summary: >
      Android Developers Blog는 ML Kit GenAI Prompt API용 Automated Prompt Optimization(APO)을 소개했다.
      Android AICore는 공유 시스템 모델을 우선하므로 앱마다 LoRA adapter를 배포하는 방식은 운영 부담이
      생길 수 있다. APO는 Vertex AI에서 서버 측 모델을 사용해 오류 패턴을 분석하고, 의미 지시문을 추출하고,
      여러 후보 프롬프트를 병렬 테스트해 Gemini Nano v3용 시스템 지시문을 찾는다. 중요한 점은 최종 실행은
      Android의 ML Kit GenAI API와 Gemini Nano 쪽에 남기면서, 품질 개선 탐색은 서버에서 자동화한다는 것이다.
      온디바이스 AI 앱은 "프롬프트도 빌드 산출물"처럼 평가 데이터와 함께 관리해야 한다.
    points:
      - "APO: Vertex AI에서 Gemini Nano v3용 프롬프트 후보를 자동 탐색"
      - "오류 분석·semantic instruction distillation·병렬 후보 테스트"
      - "온디바이스 실행을 유지하면서 프롬프트 품질 개선 루프를 운영"
    source: "https://developer.android.com/blog/posts/how-automated-prompt-optimization-unlocks-quality-gains-for-ml-kit-s-gen-ai-prompt-api"

  - category: ai
    title: "Claude Code Dynamic Workflows — 수백 서브에이전트 실행을 검증 루프로 묶기"
    summary: >
      Claude Code의 dynamic workflows는 큰 작업을 한 번의 대화형 응답이 아니라, 계획·분해·병렬 실행·검증
      루프로 다루는 기능이다. Claude는 작업 중 orchestration script를 만들고, tens to hundreds of parallel
      subagents를 한 세션에서 실행한 뒤 결과를 합쳐 사용자에게 보고한다. Anthropic은 코드베이스 전체 버그
      탐색, 보안 감사, 대규모 마이그레이션, 고위험 작업의 독립 검증에 맞는 패턴이라고 설명한다. 다만 일반
      Claude Code 세션보다 토큰을 많이 쓰므로, 처음에는 범위가 좁고 기존 테스트 스위트가 성공 기준이 되는
      작업부터 적용하는 것이 안전하다.
    points:
      - "계획 → 하위 작업 분해 → 병렬 subagent 실행 → 결과 검증"
      - "대규모 마이그레이션·보안 감사·코드베이스 전체 버그 탐색에 적합"
      - "일반 세션보다 토큰 사용량이 크므로 작은 범위와 테스트 기준부터 시작"
    source: "https://claude.com/blog/introducing-dynamic-workflows-in-claude-code"

  - category: ai
    title: "ADK 장기 실행 에이전트 — 대화 기록 대신 상태 머신으로 재개하기"
    summary: >
      Google의 ADK 장기 실행 에이전트 튜토리얼은 며칠 동안 멈췄다 재개되는 업무를 대화 기록에 맡기지 말라고
      설명한다. 핵심은 START, WELCOME_SENT, DOCUMENTS_SIGNED 같은 명시적 state machine을 만들고, 시스템
      지시문이 현재 단계를 session state에서 읽게 하는 것이다. 각 tool call은 ToolContext.state를 갱신해
      자동 checkpoint가 되고, 세션 저장소를 DatabaseSessionService(SQLite 또는 Cloud SQL)로 바꾸면 컨테이너
      재시작 뒤에도 같은 단계에서 이어갈 수 있다. AI 에이전트 설계 포인트는 "모델이 기억한다"가 아니라
      "워크플로 상태를 코드와 저장소가 소유한다"는 점이다.
    points:
      - "대화 기록이 아니라 명시적 state machine이 진행 상태를 소유"
      - "ToolContext.state 갱신이 tool call마다 자동 checkpoint 역할"
      - "DatabaseSessionService로 SQLite/Cloud SQL에 세션을 영속화"
    source: "https://developers.googleblog.com/build-long-running-ai-agents-that-pause-resume-and-never-lose-context-with-adk/"

  - category: ai
    title: "MCP Enterprise-Managed Auth — 커넥터 권한을 IdP로 중앙 관리하기"
    summary: >
      Anthropic은 2026년 6월 18일 Claude의 MCP connectors에 enterprise-managed authorization을 공개했다.
      이전에는 관리자가 조직 커넥터를 켠 뒤 사용자마다 개별 OAuth 승인이 필요했지만, 새 방식은 관리자가
      IdP에서 한 번 권한을 설정하고 사용자는 첫 로그인부터 커넥터 접근을 상속받는다. Okta가 launch identity
      provider이고 Asana, Atlassian, Canva, Figma, Granola, Linear, Supabase가 시작 MCP provider로 언급됐다.
      실무 포인트는 MCP를 편의 기능이 아니라 권한 표면으로 보고, 그룹 스코프·빠른 토큰 만료·퇴사자 회수를
      일반 SaaS 권한 관리와 같은 평면에 올리는 것이다.
    points:
      - "MCP connector 접근을 사용자별 OAuth가 아니라 IdP 그룹·역할로 provision"
      - "Okta 지원으로 시작, Asana·Atlassian·Figma·Linear·Supabase 등 provider 참여"
      - "토큰 수명 단축과 deprovision 회수를 엔터프라이즈 권한 정책에 통합"
    source: "https://claude.com/blog/enterprise-managed-auth"

  - category: ai
    title: "Claude WIF GA — 에이전트 자동화에서 정적 API 키 없애기"
    summary: >
      Claude Platform의 Workload Identity Federation(WIF)은 2026년 6월 17일 GA가 됐다. WIF는 정적 API 키
      대신 요청 시점에 짧게 살아 있는 scoped credential을 발급하고, AWS IAM role, GCP/Kubernetes service
      account, Azure managed identity, GitHub Actions token, Okta 같은 OIDC 호환 identity provider와 연결된다.
      적용 범위는 Claude API endpoints, first-party SDK, Claude Code 접근까지 포함된다. 에이전트 자동화에서는
      API 키를 저장소·CI 변수·로컬 설정에 오래 보관하지 않고, workload별 service account와 audit log로
      호출 주체를 분리할 수 있다는 점이 핵심이다.
    points:
      - "정적 API key 대신 짧게 살아 있는 scoped credential을 요청 시 발급"
      - "AWS/GCP/Kubernetes/Azure/GitHub Actions/Okta 등 OIDC identity와 연동"
      - "workload별 service account·role·audit trail로 에이전트 호출 주체 분리"
    source: "https://claude.com/blog/workload-identity-federation"

  - category: ai
    title: "A2UI + MCP Apps — 에이전트 UI를 iframe과 네이티브 렌더링 사이에서 설계하기"
    summary: >
      Google Developers Blog의 A2UI + MCP Apps 글은 에이전트 UI가 단순 텍스트를 넘어가면 두 선택지 사이에서
      흔들린다고 설명한다. MCP Apps는 iframe 안에서 HTML/CSS/JavaScript로 자유롭게 만들 수 있지만, 호스트와
      디자인·스크롤·보안 경계가 어긋날 수 있다. A2UI는 JSON payload로 무엇을 렌더링할지 선언하고 호스트가
      네이티브 컴포넌트로 그려 일관성과 보안을 얻지만, 복잡한 클라이언트 로직에는 약하다. 실무 포인트는
      "에이전트가 UI를 만든다"가 아니라, 표·폼·차트 같은 구조 데이터는 A2UI, 복잡한 상호작용은 MCP Apps,
      혼합 화면은 두 방식을 조합하는 아키텍처 문제로 보는 것이다.
    points:
      - "MCP Apps: iframe 기반 자유도는 높지만 디자인·성능·보안 경계 비용이 있음"
      - "A2UI: JSON 선언을 호스트 네이티브 UI로 렌더링해 일관성과 접근성을 얻음"
      - "구조 데이터·복잡한 앱·혼합 화면을 패턴별로 나눠 선택"
    source: "https://developers.googleblog.com/a2ui-and-mcp-apps/"

  - category: ai
    title: "Jetpack Compose Adaptive Skill — Android 17 대화면 대응을 AI 워크플로로 고정하기"
    summary: >
      Android 17은 대화면 resizability를 더 강하게 요구하면서, Jetpack Compose adaptive skill을 함께 공개했다.
      이 스킬은 일반 Android 레이아웃 팁이 아니라 AI-powered developer workflow다. NavigationSuiteScaffold로
      모바일 bottom navigation과 대화면 navigation rail을 전환하고, Navigation 3 Scenes로 list-detail·supporting
      pane을 구성하며, Compose 1.11의 동적 레이아웃·trackpad/mouse 지원·window state 대응까지 점검하게 한다.
      AI+Android 관점의 핵심은 에이전트에게 "화면을 예쁘게 바꿔줘"가 아니라, Android 17 적응형 기준을 체크리스트
      겸 실행 절차로 주는 것이다.
    points:
      - "Android 17의 adaptive-first 요구를 AI-powered developer workflow로 다룸"
      - "NavigationSuiteScaffold·Navigation 3 Scenes·Compose 1.11 동적 레이아웃을 점검"
      - "에이전트 프롬프트를 대화면 기준과 테스트 가능한 작업 목록으로 접지"
    source: "https://android-developers.googleblog.com/2026/06/Android-17.html"

  - category: ai
    title: "R8 Agent Skill — 난해한 keep rule 정리를 AI에게 맡기되 검증은 사람이 닫기"
    summary: >
      Android 17 메모리 효율 가이드는 R8 Configuration Analyzer와 함께 R8 Agent Skill을 언급한다. Analyzer는
      obfuscation, optimization, shrinking 점수와 broad keep rule, redundant rule, unused rule을 보여주고,
      R8 Agent Skill은 Android Studio agent나 다른 AI 도구로 misconfiguration을 해결하고 규칙을 다듬는 흐름에
      붙는다. 중요한 단서도 같이 있다. AI-driven skill의 insight는 기술 검증이 필요하다. 즉 R8 규칙은 앱 동작과
      라이브러리 공개 API를 깨뜨릴 수 있으므로, 에이전트가 후보 패치를 만들고 Configuration Analyzer·릴리즈 빌드·
      회귀 테스트가 최종 판정을 내려야 한다.
    points:
      - "Configuration Analyzer로 broad/redundant/unused keep rule을 먼저 드러냄"
      - "R8 Agent Skill은 misconfiguration 해결과 rule refinement 후보를 생성"
      - "AI 제안은 릴리즈 빌드·회귀 테스트·분석 점수로 반드시 기술 검증"
    source: "https://android-developers.googleblog.com/2026/06/prioritizing-memory-efficiency-steps-for-android-17.html"

