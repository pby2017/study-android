      OpenCode는 터미널에서 도는 오픈소스 AI 코딩 에이전트다. 가장 큰 특징은 '모델 비종속'이다 — 공식 문서가 "With OpenCode you can use any LLM provider by configuring their API keys"라고 못박듯, 한 회사의 모델에 갇히지 않고 API 키만 꽂으면 어떤 LLM 제공자든 붙여 쓸 수 있다. 작업 권한이 다른 두 에이전트를 기본 제공하는데, 'build'는 풀 액세스 기본 에이전트, 'plan'은 읽기 전용으로 코드를 건드리지 않고 계획만 세운다. TUI 외에 macOS·Windows·Linux용 데스크톱 앱(BETA)이 있고, 별도 Server·SDK 문서를 둬 에디터·외부 도구가 코어에 붙을 수 있게 했다. 라이선스 MIT, 주 언어 TypeScript, GitHub 스타 ~176k(레포 표시 기준).
    points:
      - "'any LLM provider' — API 키만 꽂으면 모델 제공자 비종속(공식 문서 verbatim)"
      - "권한 분리: build(풀 액세스 기본) vs plan(읽기 전용·계획만)"
      - "TUI + 데스크톱 앱(BETA, mac/Win/Linux) + 별도 Server·SDK"
    source: "https://github.com/anomalyco/opencode"
  - category: ai
    title: "Claude Code hooks — 에이전트 행동을 '기억' 말고 이벤트로 고정하기"
    summary: >
      Claude Code hooks는 모델이 규칙을 기억하길 기대하는 대신, 특정 생명주기 이벤트에서 사용자가 정한
      명령을 실행하게 하는 자동화 장치다. 공식 문서는 PreToolUse, PostToolUse, UserPromptSubmit,
      Stop, SessionStart, PreCompact 같은 이벤트를 설정 파일에 등록하고, 이벤트→매처→핸들러 순서로
      실행한다고 설명한다. 그래서 파일 수정 뒤 포맷, 위험 명령 차단, 세션 시작 컨텍스트 주입, 압축 전
      메모 백업처럼 "매번 해야 하는 일"을 모델 판단 밖으로 빼낼 수 있다. 실전 포인트는 훅을 프롬프트가
      아니라 작고 결정적인 제어면으로 보는 것이다.
    points:
      - "생명주기 이벤트에 명령을 걸어 반복 작업을 자동 실행"
