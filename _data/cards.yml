    source: "https://agents.md"
  - category: ai
    title: "Agent Skills — SKILL.md 폴더 하나로 에이전트를 도메인 전문가로 만들기"
    summary: >
      Agent Skills는 지침·메타데이터·옵션 자원(스크립트·템플릿)을 폴더 하나로 묶어 Claude에 도메인 전문성을 주입하는 방식이다.
      핵심은 '점진적 공개(progressive disclosure)' — 시작 시엔 YAML 프런트매터의 name·description(스킬당 ~100토큰)만 시스템
      프롬프트에 올라가고, 요청이 description과 맞을 때 비로소 SKILL.md 본문(5k토큰 미만)을 bash로 읽어 들인다. 본문이 참조하는
      FORMS.md·스크립트 같은 번들 파일은 필요할 때만 읽으며, 스크립트는 코드가 아니라 '출력'만 컨텍스트에 들어와 토큰을 거의 안 먹는다.
      덕분에 스킬을 수십 개 깔아도 컨텍스트 부담이 거의 없고, 여러 스킬을 조합해 복잡한 워크플로를 짤 수 있다.
    points:
      - "3단계 로딩: 메타데이터(항상, ~100토큰) → SKILL.md 본문(트리거 시, <5k) → 번들 자원(참조 시, 사실상 무제한)"
      - "필수 필드는 name(소문자·숫자·하이픈, 64자, 'claude'/'anthropic' 금지)과 description(1024자, '무엇을·언제 쓰는지' 명시)뿐"
      - "Claude Code는 ~/.claude/skills(개인)·.claude/skills(프로젝트) 파일 기반 / API·claude.ai는 surface마다 따로 업로드(동기 안 됨)"
      - "보안: 스킬은 코드 실행 권한을 주므로 신뢰된 출처만 — 외부 URL을 가져오는 스킬은 프롬프트 인젝션 위험"
    source: "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview"

  - category: ai
    title: "Terminal-Bench — '모델'이 아니라 '에이전트+모델 쌍'을 재는 벤치마크"
    summary: >
      Terminal-Bench는 스탠퍼드와 Laude Institute가 만든, 에이전트가 실제 터미널을 몰아가며 작업을
      끝내는지(파일 편집·명령 실행·실패 수정)를 재는 벤치마크다. 핵심 발상은 '에이전트와 모델을 함께 묶어
      한 단위로 평가'한다는 점 — 같은 모델이라도 어떤 에이전트(스캐폴드) 안에 넣느냐에 따라 점수가 달라지기
      때문이다. 도구를 고를 때 'GPT-5는 몇 점' 같은 모델 단독 점수보다 '이 에이전트 + 이 모델' 조합 점수를
      봐야 실전에 맞는다는 게 이 벤치마크가 던지는 실무 메시지다. 채점은 각 과제를 도커 환경에서 검증
      스크립트로 프로그래밍적으로 판정한다.
    points:
      - "1.0=80과제 → 2.0=89과제(SW엔지니어링·ML·보안·데이터사이언스 등), 이후 2.1·3.0·Science 진행 중"
      - "평가 단위는 '에이전트+모델 쌍' — 같은 모델도 스캐폴드가 다르면 점수가 갈린다"
      - "SWE-bench Pro(깃 이슈 고치기)와 보상하는 게 다름 — 이쪽은 '터미널을 끝까지 몰아가는 능력'을 잰다"
    source: "https://www.tbench.ai/"

  - category: ai
    title: "컨텍스트 엔지니어링 — 프롬프트보다 '무엇을 넣고 뺄지'가 에이전트 성능을 가른다"
    summary: >
      Anthropic 엔지니어링 블로그가 정리한 개념으로, 프롬프트 엔지니어링이 '지시문을 잘 쓰는 법'이라면
      컨텍스트 엔지니어링은 '추론 시점에 어떤 토큰을 넣고 유지할지를 매번 고르고 관리하는 전략'이다.
      핵심 전제는 LLM에 '주의 예산(attention budget)'이 있다는 것 — 토큰이 늘수록 회수 정확도가 떨어지는
      '컨텍스트 로트(context rot)'가 생기므로, 목표는 '원하는 결과를 낼 가능성을 최대화하는 가장 작은
      고신호 토큰 집합'을 찾는 것이다. 실무 지침은 시스템 프롬프트를 너무 빡빡하지도 너무 모호하지도 않은
      '적절한 고도(Goldilocks zone)'로 쓰고, 도구는 자족적이고 명확한 최소 세트만 두며, 예시는 엣지케이스
      나열 대신 대표 사례 몇 개로 보여주라는 것이다.
    points:
      - "프롬프트=지시문 작성, 컨텍스트 엔지니어링=추론마다 토큰을 고르고 유지하는 반복 작업"
      - "주의 예산은 유한 — 토큰↑ → 회수 정확도↓('context rot'), 'n² 쌍 관계'로 성능 점진 저하"
      - "시스템 프롬프트는 빡빡↔모호 사이 '적절한 고도', 도구는 최소·명확, 예시는 대표 사례로(엣지케이스 나열 금지)"
    source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"

  - category: ai
    title: "멀티에이전트 오케스트레이션 — 리드 에이전트가 서브에이전트에게 일을 쪼개 맡기는 패턴"
    summary: >
      Anthropic 엔지니어링 블로그가 자사 리서치 기능을 만들며 정리한 '오케스트레이터-워커' 패턴이다.
      리드 에이전트(LeadResearcher)가 계획을 세워 메모리에 저장하고, 전문 서브에이전트들을 병렬로 띄워
      각자 조사하게 한 뒤 결과를 종합하고, 마지막에 CitationAgent가 출처를 붙여 답을 돌려준다.
      내부 평가에서 이 멀티에이전트 구성(리드=Opus 4, 서브=Sonnet 4)이 단일 Opus 4 대비 90.2% 더 나은 성능을 냈고,
      BrowseComp 분석에선 '토큰 사용량 하나만으로 성능 분산의 80%가 설명'됐다 — 다만 채팅 대비 토큰을 약 15배 더 먹는다.
      그래서 만능이 아니라, 병렬화가 잘 되고 단일 컨텍스트를 넘는 정보를 다루며 과제 가치가 높을 때만 값을 한다 —
      공유 컨텍스트나 에이전트 간 의존이 많은 일(대부분의 코딩 포함)엔 오히려 안 맞는다고 명시한다.
    points:
      - "구조: 리드가 계획→서브에이전트 병렬 스폰→종합→CitationAgent 출처 부여 / 성능 +90.2%(단일 Opus 4 대비, 내부 평가)"
      - "비용·변수: 채팅 대비 토큰 약 15배 / '토큰량만으로 성능 분산의 80% 설명', 토큰+도구호출+모델로 95% 설명"
      - "위임의 핵심: 각 서브에이전트에 목표·출력형식·도구안내·작업경계를 줘야 중복 안 함 / 난이도별 에이전트 수 규칙(단순=1, 비교=2~4, 복잡=10+)"
      - "안 맞는 경우: 공유 컨텍스트·에이전트 간 의존이 많은 일 — 코딩 대부분은 병렬화 가능한 부분이 적어 부적합"
    source: "https://www.anthropic.com/engineering/built-multi-agent-research-system"

  - category: ai
    title: "Codex CLI — OpenAI가 만든 터미널 코딩 에이전트(Rust·Apache-2.0)"
    summary: >
      OpenAI가 직접 만들어 오픈소스로 공개한 터미널 코딩 에이전트로, Claude Code의 직접 대항마다.
      코드의 96% 이상이 Rust로 작성됐고 라이선스는 Apache-2.0, 깃허브 스타는 9만 개를 넘겼다(2026-06 기준).
      설치는 `npm install -g @openai/codex` 또는 `brew install --cask codex` 한 줄이면 되고,
      인증은 ChatGPT 계정 로그인(Plus·Pro·Business·Edu·Enterprise 플랜)이 권장 방식이라 별도 API 키 없이도 바로 쓸 수 있다.
      편집·명령 실행 전에 '승인 모드(approval mode)'로 어디까지 자동 허용할지 고를 수 있고, VS Code·Cursor·Windsurf용 IDE 연동과 웹·데스크톱 앱도 제공한다.
    points:
      - "정체: OpenAI 공식 오픈소스 터미널 에이전트 / Rust 96%+·Apache-2.0·깃허브 9만★+(2026-06)"
      - "설치: `npm install -g @openai/codex` 또는 `brew install --cask codex` / 인증은 ChatGPT 로그인 권장(API 키도 가능)"
      - "안전장치: 편집·명령 실행 전 '승인 모드'로 자동 허용 범위 선택 / VS Code·Cursor·Windsurf IDE 연동, 웹·데스크톱 앱 제공"
    source: "https://github.com/openai/codex"

  - category: ai
    title: "작성과 리뷰를 분리하라 — 짠 세션 말고 새 세션이 검토해야 하는 이유"
    summary: >
      Anthropic의 Claude Code 베스트 프랙티스는 '코드를 짠 맥락'과 '그 코드를 리뷰하는 맥락'을 일부러 나누라고 권한다.
      이유는 편향이다 — 방금 자기가 작성한 코드를 같은 세션이 다시 보면 "맞게 짰다"는 가정에 끌려 결함을 놓치기 쉽다.
      그래서 리뷰는 깨끗한 컨텍스트의 별도 서브에이전트에게 맡긴다. 리뷰어는 추론 과정이 아니라 '결과 diff와 합격 기준'만 보고 판정하므로, 작성자가 못 본 문제를 독립적으로 잡아낸다.
      실전에서는 구현 후 "이 변경을 서브에이전트로 리뷰해줘"처럼 별도 패스를 돌리거나, 번들된 `/code-review` 스킬로 현재 diff를 새 서브에이전트가 검토하게 한다 — 무인 실행이 길어질수록 이 독립 검증이 중요해진다.
    points:
      - "원리: 같은 세션은 자기가 쓴 코드에 편향 → 리뷰는 깨끗한 컨텍스트의 별도 서브에이전트로 분리(작성≠검증)"
      - "리뷰어는 추론 말고 '결과 diff + 합격 기준'만 본다 — 그래서 작성자가 놓친 결함을 독립적으로 잡음"
      - "실전: `/code-review` 스킬(새 서브에이전트가 현재 diff 검토) 또는 'PLAN.md 대비 리뷰' 프롬프트 직접 작성 / 무인 실행일수록 필수"
    source: "https://code.claude.com/docs/en/best-practices"

  - category: ai
    title: "Cursor Composer + Claude Code 듀얼 스택 — 도구를 고르지 말고 일로 나눠라"
    summary: >
      2026년 실무에서 굳어진 패턴은 'Cursor냐 Claude Code냐'가 아니라 둘을 작업 유형으로 라우팅하는 것이다.
      두 도구가 스택의 다른 층에 있기 때문이다 — Cursor는 IDE 중심(에디터 안에서 자체 모델 Composer로 빠른 초안·스캐폴딩·리팩터), Claude Code는 터미널/CLI 중심(멀티레포 오케스트레이션, 서브에이전트, CI 자동화, git에 남는 워크플로 산출물).
      Cursor는 GPT·Claude·Composer를 작업마다 갈아끼우는 '모델 유연성'을, Claude Code는 단일 최상위 모델에 에이전트 루프를 최적화한 '깊이'를 준다.
      이미 CLAUDE.md·스킬·훅으로 레포에 워크플로를 박아뒀다면 전면 이전 비용이 가장 크다 — 그래서 한쪽으로 갈아타기보다 둘을 함께 쓰는 쪽이 자주 이긴다.
    points:
      - "라우팅: 에디터 안 빠른 초안·스캐폴딩·리팩터 → Cursor / 멀티레포·서브에이전트·CI·git 산출물 → Claude Code"
      - "성격 차이: Cursor는 모델 갈아끼우는 유연성(GPT·Claude·Composer), Claude Code는 단일 모델 깊이(긴 호흡 에이전트 작업)"
      - "Composer 2.5 = 2026-05-18 출시, Kimi K2.5 베이스 / CLAUDE.md·스킬·훅 투자분이 있으면 전면 이전 비용이 커 듀얼 스택이 유리"
    source: "https://cursor.com/blog/composer-2-5"

  - category: ai
    title: "Agent SDK 별도 크레딧 — 2026-06-15부터 claude -p·자동화는 구독 한도와 분리"
    summary: >
      2026년 6월 15일부터 Anthropic은 '대화형'과 '프로그래밍 방식' 사용을 분리한다.
      Claude Agent SDK, `claude -p`(Claude Code 비대화 모드), Claude Code GitHub Actions, 그리고 구독으로 인증하는 서드파티 앱은
      이제 구독 사용 한도가 아니라 '월별 Agent SDK 크레딧'에서 차감된다 — Pro $20, Max 5x $100, Max 20x $200(전액 API 요금 기준).
      반대로 터미널·IDE에서 직접 타이핑하는 '대화형 Claude Code'는 종전대로 구독 한도를 그대로 쓰며 영향이 없고, API 키로 인증하면 크레딧 없이 기존 종량제가 유지된다.
      크레딧이 소진되면 '사용 크레딧(usage credits)'을 켜둔 경우에만 API 요금으로 계속 돌고, 안 켰으면 다음 주기까지 요청이 멈춘다.
    points:
      - "차감 대상: Agent SDK·`claude -p`·Claude Code GitHub Actions·구독 인증 서드파티 앱 / 월 크레딧 Pro $20·Max 5x $100·Max 20x $200(롤오버 없음, 매월 초기화)"
      - "영향 없음: 대화형 Claude Code(터미널·IDE)는 구독 한도 그대로 / API 키 인증은 종량제 유지(크레딧 미지급)"
      - "소진 후: '사용 크레딧'을 켰으면 API 요금으로 계속, 안 켰으면 주기 갱신까지 중단 / 크레딧은 1회 신청(opt-in) 후 자동 갱신"
      - "주의: 좌석제 Enterprise의 Standard 좌석은 이 크레딧 신청 불가"
    source: "https://support.claude.com/en/articles/15036540-use-the-claude-agent-sdk-with-your-claude-plan"
  - category: ai
    title: "Firecrawl MCP — 에이전트에 '웹 읽기'를 붙이는 가장 인기 있는 MCP 서버"
    summary: >
      Firecrawl은 자바스크립트 렌더링·페이지네이션·레이트리밋을 대신 처리하고 웹페이지를 깨끗한 마크다운으로 변환해 주는 웹 스크래핑·검색 API다.
      공식 MCP 서버(firecrawl-mcp-server, GitHub 6.6k★)를 붙이면 Claude·Cursor·Windsurf 등 MCP 호환 도구에서 에이전트가 직접 웹을 검색하고 긁어올 수 있다.
      설치는 별도 빌드 없이 `npx -y firecrawl-mcp` 한 줄에 `FIRECRAWL_API_KEY`만 환경변수로 넣으면 끝 — Claude Desktop은 `claude_desktop_config.json`에 npx 명령으로 등록한다.
      단, MCP 서버를 여럿 붙일수록 도구 정의가 컨텍스트를 잡아먹어(데이터DB·파일시스템과 같이 쓰면 7.5만 토큰대) 에이전트 성능이 떨어진다는 점은 감안해야 한다.
    points:
      - "노출 도구: firecrawl_scrape·search·map·crawl·extract와 자율 수집용 firecrawl_agent, 변경 감시용 firecrawl_monitor_* 등"
      - "설치: `env FIRECRAWL_API_KEY=fc-... npx -y firecrawl-mcp` 또는 `npm i -g firecrawl-mcp` — Cursor·Claude Desktop은 npx 명령으로 config 등록"
      - "주의(주장): MCP 도구 정의 자체가 컨텍스트 오버헤드 — 도구가 많을수록 에이전트가 헷갈린다, 필요한 서버만 켜라"
    source: "https://github.com/firecrawl/firecrawl-mcp-server"

  - category: ai
    title: "Aider 레포 맵 — 코드베이스 전체를 안 넣고도 LLM에 '뼈대'만 보여주는 법"
    summary: >
      Aider가 다른 터미널 에이전트와 갈리는 핵심 기술이 '레포 맵(repo map)'이다.
      매 요청마다 전체 코드베이스를 다 넣는 대신, 저장소의 파일 목록과 각 파일의 핵심 심볼(클래스·함수의 시그니처와 정의 한 줄)만 추려 컨텍스트로 보낸다.
      tree-sitter로 심볼을 파싱하고, 파일을 노드·참조를 엣지로 한 의존성 그래프에 그래프 랭킹(PageRank류)을 돌려 '가장 많이 참조되는 중요한 심볼'만 골라낸다.
      덕분에 LLM은 코드 전체를 안 봐도 API 형태를 파악하고, 더 봐야 할 파일만 콕 집어 요청한다 — 전부 넣어 비용 폭증/혼란을 막는 컨텍스트 엔지니어링의 실전 예다.
    points:
      - "매 요청에 레포 맵 전송 = 파일 목록 + 핵심 심볼 시그니처(정의 한 줄)만, 전체 소스 아님"
      - "tree-sitter 파싱 → 파일=노드·참조=엣지 그래프에 랭킹 → 토큰 예산 안에서 중요 심볼만 선별"
      - "맵 크기는 `--map-tokens`로 조절(기본 1k 토큰), 채팅에 파일 없으면 자동으로 키움 / 부족하면 `/add`로 파일 직접 추가"
    source: "https://aider.chat/docs/repomap.html"

  - category: ai
    title: "llms.txt — 사이트 문서를 에이전트가 토큰 낭비 없이 읽게 하는 표준"
    summary: >
      llms.txt는 fast.ai·Answer.AI의 Jeremy Howard가 2024년 9월 3일 제안한 표준으로, 사이트 루트(`/llms.txt`)에 두는 마크다운 파일이다.
      사람용 HTML은 내비게이션·CSS·광고가 대부분이라 LLM 컨텍스트 창을 낭비하는데, llms.txt는 핵심 문서로 가는 '큐레이션된 안내문'만 깔끔히 담아 코딩 에이전트(Cursor·Copilot·Claude 등)가 실시간으로 올바른 페이지를 적은 토큰으로 찾게 한다.
      형식이 엄격하다: H1 프로젝트명 1개, 인용블록(`>`)으로 한 줄 요약, 그다음 H2 섹션마다 `[제목](URL): 설명` 형태의 링크 목록.
      `## Optional` 섹션은 컨텍스트가 빠듯할 때 건너뛰어도 되는 링크를 모으는 자리다.
    points:
      - "위치·이름 고정: 도메인 루트의 `/llms.txt`, 소문자, 유효한 마크다운(파일명 없는 URL은 `index.html.md`로 마크다운 버전 제공)"
      - "구조: H1(프로젝트명) → 인용블록 요약 → H2 섹션별 링크 목록 / `## Optional`은 건너뛰어도 되는 링크"
      - "전문(全文)을 한 파일에 담는 `llms-full.txt` 동반 포맷도 있음 — Mintlify·Vercel·Supabase 등 문서 플랫폼이 기본 생성(Anthropic·Cursor 문서도 보유)"
    source: "https://llmstxt.org/"
  - category: ai
    title: "Agent Teams — 서브에이전트와 뭐가 다른가: 서로 대화하고 일을 나눠 갖는 팀"
    summary: >
      Claude Code의 Agent Teams는 여러 Claude 세션을 '팀'으로 묶어 한 세션이 팀 리드가 되어 작업을 배분·종합하는 실험적 기능이다(환경변수 `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`로 활성화).
      서브에이전트와의 핵심 차이는 '협업'이다. 서브에이전트는 각자 독립 컨텍스트에서 일하고 결과만 리드에게 보고하지만, 팀원들은 서로 직접 메시지를 주고받고 공유 작업 목록(shared task list)을 보며 스스로 조율한다.
      그래서 단순히 결과만 필요한 작업엔 서브에이전트가, 토론·상호 반박·조율이 필요한 복잡한 일엔 팀이 적합하다 — 대신 팀원마다 별도 Claude 인스턴스라 토큰 비용이 더 든다.
      팀원은 CLAUDE.md·MCP·스킬 같은 프로젝트 컨텍스트는 자동 로드하지만 리드의 대화 기록은 상속하지 않으므로, 스폰 프롬프트에 작업 세부사항을 직접 담아야 한다.
    points:
