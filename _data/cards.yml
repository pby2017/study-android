  - category: ai
    title: "CrewAI — '역할 가진 에이전트 팀(Crew)'과 '결정적 워크플로(Flow)'를 한 프레임워크에 담은 멀티에이전트 도구(MIT·53.7k★)"
    summary: >
      CrewAI는 여러 AI 에이전트가 협업하도록 오케스트레이션하는 파이썬 프레임워크로,
