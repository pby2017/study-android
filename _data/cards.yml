  - category: ai
    title: "Aider — '아키텍트 모델이 짜고 에디터 모델이 고치는' 2모델 분업 터미널 페어프로그래머(46.3k★)"
    summary: >
      Aider는 터미널에서 로컬 git 저장소를 직접 고치는 Apache-2.0 오픈소스 AI 페어프로그래밍 도구로,
      현재 GitHub 46.3k★다. 특정 모델에 묶이지 않고 Claude 3.7 Sonnet·DeepSeek·OpenAI o1/o3-mini/GPT-4o 등
      거의 모든 LLM(로컬 모델 포함)에 붙는다. 가장 특징적인 건 architect 모드 — 한 모델이 '어떻게 풀지' 계획을 세우고,
      별도 editor 모델이 그 계획을 실제 파일 편집(diff)으로 옮긴다. 추론과 편집을 분리해 품질·비용을 동시에 잡는
