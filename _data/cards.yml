      - "도구 비종속이 핵심 — 스킬 원본을 한 벌 두고 OpenCode·Claude Code·Codex·Cursor 등 67개+ 에이전트 폴더에 심볼릭 링크. SKILL.md 표준을 '설치·배포 레이어'로 묶은 셈(MIT·~22.6k★)"
