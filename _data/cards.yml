  title: ExecuTorch 1.0(Meta) — 온디바이스 LLM 프로덕션 프레임워크, 50KB 런타임·12+ HW 백엔드·Instagram/WhatsApp 사용
  summary: 'ExecuTorch는 Meta가 만든 프로덕션급 온디바이스 추론 프레임워크로 2025년 10월 1.0 GA를 달성했다. PyTorch torch.export 파이프라인으로 학습→모바일 배포 원스텝. 50KB 베이스 런타임으로 마이크로 컨트롤러부터 고급 스마트폰까지 지원. CoreML·Qualcomm QNN·MediaTek·XNNPACK 등 12+ HW 백엔드. Instagram·WhatsApp·Messenger·Facebook에서 수십억 사용자 서빙. llama.cpp(CPU·GGUF·프로토타입) 대비 NPU 가속+HW 최적화+프로덕션 안정성이 차별점.

    '
