  - '포화: MMLU 93%+, GSM8K 99%+, 프론티어 구분 불가'
  - '유의미: SWE-bench·GPQA·HLE·LiveCodeBench'
  - '포트폴리오: 학술+에이전트+선호도 삼각 검증'
  source: https://tokenmix.ai/blog/llm-leaderboard-2026
