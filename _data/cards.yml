- category: ai
  title: GGUF 양자화 가이드 — convert→imatrix→quantize 3단계, Q4_K_M이 2026년 기본 선택
  summary: 'GGUF(GPT-Generated Unified Format)는 llama.cpp의 모델 포맷으로, 가중치·토크나이저·하이퍼파라미터를 단일 바이너리에 번들. 양자화 파이프라인 3단계: 1) convert_hf_to_gguf.py로 HF→GGUF F16 변환, 2) llama-imatrix로 중요도 행렬(imatrix) 생성(4비트 이하 품질 핵심), 3) llama-quantize로 목표 비트폭 압축. Q4_K_M이 기본 선택(8B 모델 ~4.7GB, 6GB RAM), Q5_K_M은 +15% 크기에 추론·코드 품질 향상, Q8_0은 거의 무손실. IQ4_XS는 imatrix 기반 코드북 인코딩으로 Q4_K_M보다 작지만 동등 품질. LoRA 어댑터는 merge_and_unload() 후 변환.

    '
  points:
  - '3단계: convert → imatrix → quantize'
  - 'Q4_K_M: 8B ~4.7GB, 가성비 기본값'
  - 'imatrix: 4비트 이하 품질의 핵심 차이'
  source: https://markaicode.com/gguf-quantization-after-fine-tuning-llama-cpp/
- category: ai
  title: Groq LPU — SRAM 기반 결정론적 추론 칩, Llama 70B 276 tok/s(GPU 대비 3~10배)·TTFT <1초
  summary: 'Groq의 LPU(Language Processing Unit)는 온칩 SRAM 기반 데이터플로우 아키텍처로, DRAM/HBM 병목을 제거해 결정론적 추론 속도를 달성한다. Artificial Analysis 독립 벤치마크(72시간 중앙값): Llama 3.3 70B 276 tok/s(Fireworks 83 tok/s의 3배), Llama 3.1 8B 840 tok/s. TTFT 0.6~0.9초. GroqCloud API 전용(클라우드 온리, 하드웨어 구매 불가). OpenAI 호환 API로 base_url 변경만으로 전환. 2025년 NVIDIA가 Groq 핵심 기술 인수 → Groq 3 LPU가 Vera Rubin 플랫폼의 추론 코프로세서로 통합. 실시간 음성·채팅 등 지연 민감 워크로드에 최적.

    '
  points:
  - '276 tok/s: Llama 70B, GPU 대비 3~10배'
  - 'SRAM 아키텍처: 결정론적 처리량, DRAM 병목 제거'
  - 'API 전용: OpenAI 호환, base_url 변경만으로 전환'
  source: https://chatforest.com/reviews/groq-lpu-inference-speed-leader/
- category: ai
  title: ColPali — OCR 없이 문서 이미지를 직접 검색, VLM+ColBERT MaxSim으로 레이아웃·표·차트 포함 임베딩
  summary: 'ColPali는 VLM(PaliGemma-3B 등)으로 문서 페이지를 이미지 그대로 인덱싱하는 멀티모달 검색 기법이다. OCR·레이아웃 분석·텍스트 추출 파이프라인 불필요. 페이지를 이미지 패치로 분할 → 각 패치를 128차원 멀티벡터 임베딩 → ColBERT late-interaction(MaxSim)으로 쿼리 토큰과 패치 간 세밀한 유사도 계산. ViDoRe 벤치마크에서 텍스트 기반 검색+OCR 파이프라인 상회. Qdrant·Milvus·Vespa 등 벡터DB와 통합. 표·차트·수식·레이아웃이 많은 문서(재무·법률·의료)에서 기존 RAG 대비 검색 품질 획기적 개선.

    '
  points:
  - 'OCR 불필요: 페이지 이미지 직접 임베딩'
  - 'ColBERT MaxSim: 패치↔쿼리 토큰 세밀 매칭'
  - 'ViDoRe 1위: 기존 텍스트+OCR 파이프라인 상회'
  source: https://arxiv.org/html/2407.01449v4
- category: ai
  title: SambaNova Cloud — RDU 기반 초고속 추론, 무료 영구 티어(20RPD·200K TPD)·OpenAI 호환 API
  summary: 'SambaNova Cloud는 자체 설계 RDU(Reconfigurable Dataflow Unit) 칩 기반 추론 클라우드 서비스다. 무료 영구 티어: 신용카드 불필요, 20 RPM/20 RPD/200K TPD. 신규 계정 $5 크레딧(3개월). DeepSeek V3.1·Llama 3.3 70B·gpt-oss-120b·Gemma 4 31B 등 지원. Developer 티어: 결제 연결 시 RPM 60/RPD 12,000/일 20M 토큰으로 확장. OpenAI SDK 호환(base_url: api.sambanova.ai/v1). Groq와 함께 ''전용 추론 칩'' 진영의 양대 축. 프로토타이핑·모델 평가·속도 벤치마킹에 최적.

    '
  points:
  - '무료 영구: 20RPD, 200K TPD, 신용카드 불필요'
  - 'RDU 칩: 전용 추론 하드웨어, 초고속 토큰 생성'
  - 'OpenAI 호환: base_url 변경만으로 SDK 전환'
  source: https://sambanova.ai/blog/sambanova-cloud-developer-tier-is-live
- category: ai
  title: Cohere Command A — 엔터프라이즈 RAG 특화 111B, 할루시네이션 23% 적음·Embed+Rerank 통합 스택
  summary: 'Cohere Command A는 111B 파라미터 엔터프라이즈 LLM으로, RAG·도구 사용·멀티스텝 에이전트에 최적화됐다. 256K 컨텍스트, 23개 언어 지원. A100/H100 2장에 배포 가능(경쟁 모델은 8장 필요). 네이티브 인용 생성으로 그라운딩 정확도 91.3%(GPT-4o 82.4%), 할루시네이션 23% 감소. Embed v3+ Rerank 3.5와 통합 스택(단일 API·SDK·과금)으로 RAG 파이프라인 구축. 일반 벤치마크(MMLU 82.1) 에서는 GPT-4o(88.7)에 뒤지나, RAG 정확도/비용 비율은 2026년 최고. Apache-2.0 웨이트 공개.

    '
  points:
  - 'RAG 91.3%: GPT-4o 82.4% 대비 할루시네이션 23%↓'
  - '2 GPU 배포: A100/H100 2장, 처리량 150% 향상'
  - '통합 스택: Embed v3 + Rerank 3.5, 단일 API'
  source: https://tokenmix.ai/blog/cohere-command-a-review
