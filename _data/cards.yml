  title: Tabby — Rust로 만든 셀프호스팅 코드 자동완성 서버, 팀 전체에 Copilot을 내부망에서 제공(Apache-2.0·~28k★)
  summary: 'Tabby는 Rust로 작성된 셀프호스팅 코드 자동완성 서버다. Docker 한 줄로 배포하면 VS Code·JetBrains·Vim 확장을 통해 팀 전체에 AI 자동완성을 제공한다. 리포지토리 인덱싱으로 코드베이스 패턴을 학습하고, 관리자 대시보드·사용량 분석·LDAP/SSO를 기본 지원해 엔터프라이즈에 적합하다. Continue.dev(25k★)가 개인 개발자 대상 IDE 확장(Ollama 연결)이라면, Tabby는 팀 중앙 서버 아키텍처. 추천 모델은 Qwen2.5-Coder 7B·Codestral 7B.

    '
  points:
  - 'Rust 서버: Docker 한 줄 배포, 리포지토리 전체 인덱싱'
  - '팀 관리: 관리자 대시보드·사용량 분석·LDAP/SSO'
  - VS Code·JetBrains·Vim·Eclipse 확장 지원
  source: https://github.com/TabbyML/tabby
