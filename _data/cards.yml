  title: Dia2(Nari Labs) — 웃음·기침·한숨까지 재현하는 대화 전용 TTS 모델(Apache-2.0·1.6B)
  summary: 'Dia2는 Nari Labs가 만든 1.6B+ 파라미터 대화 전용 TTS 모델로, 멀티스피커 대화에서 웃음·기침·한숨 등 비언어적 요소까지 자연스럽게 생성한다. 팟캐스트·오디오 드라마·게임 대사·대화형 인터페이스에 최적화. Kokoro(82M)가 범용 경량 TTS, Fish Audio S2 Pro(4B)가 감정·프로소디 최강이라면, Dia2는 ''멀티턴 대화 리얼리즘''에 특화. Apache-2.0 라이선스로 상업 사용 가능.

    '
  points:
  - '대화 특화: 멀티스피커 + 비언어적 요소(웃음·기침·한숨) 생성'
  - '1.6B 파라미터: 팟캐스트·게임 대사·대화형 UI에 최적'
  - Apache-2.0, 상업·비상업 모두 무료
  source: https://github.com/nari-labs/dia
