  title: Contextual Retrieval — Anthropic RAG 청크 컨텍스트 보강, 실패율 49~67%↓
  summary: 'Contextual Retrieval(Anthropic, 2024)은 RAG 청킹 시 문맥 손실을 줄이는 2-subtechnique다. Contextual Embeddings: 각 chunk 앞에 LLM(Claude)이 생성한 chunk-specific 설명을 prepend 후 embedding. Contextual BM25: 동일 컨텍스트를 BM25 index에도 적용. 단독 Contextual Embeddings — top-20 retrieval failure 35%↓(5.7%→3.7%), +Contextual BM25 — 49%↓(→2.9%), +reranking — 67%↓(→1.9%). 4-layer stack: contextual embedding(Voyage/Gemini) + contextual BM25 + hybrid + rerank + top-20 chunks. prompt caching으로 비용 90%↓. Late chunking(Jina, embedding 레벨) ·semantic chunking(LlamaIndex)과 역할 분리 — LLM-generated chunk context.'
  points:
  - Contextual Embeddings + BM25 — chunk별 LLM context prepend
  - hybrid + rerank 조합 시 failure 67%↓(Anthropic benchmark)
  - Late chunking·semantic chunking과 역할 분리 — LLM context layer
  source: https://www.anthropic.com/engineering/contextual-retrieval
- category: ai
  title: RAG Chunking Strategies — semantic boundary vs late embedding vs parent-child
  summary: '2026 RAG chunking은 "어떻게 자를 것인가"와 "무엇을 retrieve/generate할 것인가" 두 축으로 나뉜다. Semantic chunking — fixed token 대신 embedding cosine similarity threshold(percentile/stddev)로 topic shift 지점 분할, LangChain SemanticChunker. thematically cohesive chunk→retrieval precision↑(benchmark ~70% lift 사례) but uneven size(80~1400 token). Late Chunking(Jina, arXiv 2409.04701) — long-context model로 full-doc token encode 후 chunk boundary mean pool, embedding architecture 레vel context preservation, jina-embeddings-v3 late_chunking=True 한 줄. Parent-child(small-to-big) — production default: child(200-400 token) embed/index → retrieve 시 child match → parent(1000+ token section/paragraph)를 LLM에 generate context로 전달. LangChain ParentDocumentRetriever ·LlamaIndex auto-merge retriever built-in — "small-chunk recall + large-chunk context"로 precision-context tension 해결. production ladder: recursive baseline→recall low면 parent-child→semantic→late/contextual 조합. Contextual Retrieval(Anthropic LLM prefix) ·RAPTOR(tree)와
    다른 축.'
  points:
  - Semantic — similarity threshold topic boundary, uneven size trade-off
  - Late — full-doc encode→boundary mean pool, embedding-level context
  - Parent-child — child(200-400t) embed→parent(1000+t) generate, production built-in default
  source: https://langcopilot.com/posts/2025-10-11-document-chunking-for-rag-practical-guide
