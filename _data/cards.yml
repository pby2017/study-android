  title: FrontierCode 2.0 — 코딩 에이전트의 완성도와 암묵적 요구 평가
  summary: FrontierCode 2.0은 132개 작업으로 코딩 에이전트가 요구를 구현하는 데 그치지 않고 코드베이스의 관례와 명시되지 않은 제약까지 추론하는지 평가한다. 1.1보다 더 많은 저장소와 보안·성능 작업을 포함하고, 평균 참조 변경 범위도 커졌다. 점수는 가중 rubric 결과이며 blocker 조건을 하나라도 넘지 못하면 0점이다. 따라서 모델 순위만 비교하지 말고 버전, 작업군, reasoning 설정, 비용을 함께 봐야 한다.
  points:
  - 132 tasks — 저장소 범위와 보안·성능 과제를 넓힌 FrontierCode 2.0
  - Thoroughness — 같은 버그가 있는 다른 경로와 호환성 같은 암묵적 조건도 확인
  - Blocker 하나라도 실패하면 점수 0 — 평균 점수와 통과 조건을 분리해 해석
  source: https://cognition.com/blog/frontier-code-2.0
  interview: "코딩 에이전트 벤치마크에서 기능 테스트 통과만으로 실제 PR 품질을 판단하기 어려운 이유는 무엇인가요?"
  answer: "기능 테스트는 지시된 경로의 동작만 볼 수 있다. 실제 변경은 관련 경로 누락, 기존 API 호환성, 회귀, 저장소 관례 위반 같은 문제를 남길 수 있다. FrontierCode 2.0은 이런 철저성·설계 조건을 blocker rubric에 포함하므로, 점수와 함께 통과 조건·작업 범위·평가 버전을 확인해야 한다."
