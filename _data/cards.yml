  summary: Xcode 27(WWDC 2026-06-09·developer beta) — mcpbridge binary translates MCP JSON-RPC over stdio→XPC into Xcode live process. codex mcp add xcode -- xcrun mcpbridge ·claude mcp add --transport stdio xcode -- xcrun mcpbridge. 20 capabilities — build·test·SwiftUI preview·Swift REPL·live diagnostics·symbol resolve·Apple doc query. Intelligence settings Allow external agents toggle·ACP(Agent Client Protocol) governs which agents may connect. vs Android Studio Junie native ·JetBrains debugger MCP — mcpbridge=cross-vendor external agent IDE access without xcodebuild parse.
