- category: ai
  title: Copilot enterprise-managed plugins — VS Code까지 내려오는 조직 표준 에이전트 배포
  summary: GitHub Copilot의 enterprise-managed plugins는 기업 관리자가 플러그인 마켓플레이스, 자동 설치 플러그인, hooks, MCP 설정을 한 번 정의해 Copilot CLI와 VS Code 사용자에게 같이 배포하는 기능이다. VS Code 1.122부터 Copilot CLI에서 시작한 enterprise-managed capability를 지원하며, 설정 파일은 `.github-private/.github/copilot/settings.json` 위치에 둔다. 플러그인은 custom agents와 skills를 자동 설치해 온보딩을 줄이고, 항상 켜야 하는 hook·MCP 구성을 조직 표준으로 밀어 넣을 수 있다. 교훈은 AI 도구 도입이 개인 설정 싸움에서 끝나지 않고, 보안·리뷰·도메인 지식을 중앙 정책으로 배포하는 플랫폼 운영 문제가 된다는 점이다.
