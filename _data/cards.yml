  title: KotlinSyft — Android 모델 중심 연합학습의 초기 설계 사례 (레거시)
  level: "중급"
  summary: 'KotlinSyft는 Android 기기에서 PySyft 모델을 학습하던 OpenMined의 초기 모델 중심 연합학습 worker다. 서버가 모델과 학습 계획을 보내면 기기는 로컬 데이터로 학습하고, 원본 샘플 대신 모델 차분(diff)을 서버에 돌려준다. 원본 데이터 이동을 줄이는 구조이지 업데이트의 정보 유출까지 막는 보안 보장은 아니다. 저장소는 2021년 이후 갱신되지 않았고 예전 PySyft·PyGrid 커밋을 고정해 사용하므로, 현재 도입 대상이 아닌 역사적 아키텍처 사례로 본다.'
  points:
  - '흐름: 서버가 모델·학습 계획 제공 → Android에서 로컬 학습 → 모델 diff를 서버에 보고'
  - '프라이버시 경계: 학습 샘플을 보내지 않아도 gradient/weight update가 정보를 드러낼 수 있음'
  - '옛 README는 secure aggregation·MPC를 진행 중으로 표시; PyGrid도 PySyft monorepo로 이전됐으므로 이 조합을 현재 지원 스택으로 보지 않기'
  source: https://github.com/OpenMined/KotlinSyft
  interview: "KotlinSyft가 학습 샘플 대신 모델 diff만 전송한다면, 개인정보 보호가 보장된다고 할 수 있나요?"
  answer: "아니다. 모델 업데이트도 학습 데이터의 정보를 드러낼 수 있다. 위협 모델에 따라 differential privacy나 secure aggregation 같은 별도 보호가 필요하며, 실제 구현·설정·검증을 확인해야 한다. KotlinSyft의 README는 secure aggregation과 MPC를 진행 중으로 표시했으므로 지원된 기능처럼 간주하지 않는다."
- category: ai
  title: MLC LLM — Android GPU용 모델 컴파일과 실기기 검증
  level: "고급"
  summary: 'MLC LLM은 선택한 모델을 컴파일해 Android 앱용 모델 라이브러리와 런타임·토크나이저를 패키징한다. 저장소는 Adreno·Mali GPU의 OpenCL 경로를 안내하지만, 모델·드라이버별 동작이 같다는 뜻은 아니다. Android 문서는 실제 GPU 검증에 에뮬레이터가 아닌 휴대폰을 요구하며, Adreno에서 `_1` weight layout의 첫 prefill 중 시스템 UI가 멈출 수 있는 알려진 문제와 `_0` 우회안을 적고 있다. 목표 모델과 기기에서 메모리·초기화·응답을 측정한다.'
  points:
  - '`mlc_llm package`는 설정 모델별 바이너리와 Android 런타임·토크나이저를 만든다; weight는 앱에 묶거나 실행 시 내려받을 수 있음'
  - 'OpenCL 지원표(Adreno·Mali)는 출발점일 뿐; 모델 변환·GPU 드라이버·기기 메모리 조합별로 확인'
  - '물리 기기에서 첫 prefill까지 측정; Adreno의 `_1` layout 이슈와 문서의 `_0` 우회안을 확인'
  source: https://github.com/mlc-ai/mlc-llm/blob/main/docs/deploy/android.rst
  interview: "MLC LLM Android 앱이 에뮬레이터에서 실행되지 않거나 Adreno 첫 추론 때 멈춘다면, 무엇을 검증하나요?"
  answer: "가속 성능은 실제 모바일 GPU 기기에서 확인한다. `mlc_llm package`로 목표 모델 라이브러리·런타임·토크나이저를 준비하고, Adreno라면 문서의 `_1` weight-layout 첫 prefill 문제와 `_0` 우회안을 점검한다. 모델 크기·메모리·초기화·첫 토큰 지연과 후속 추론을 기기별로 측정한다."
- category: ai
  title: RunAnywhere Kotlin SDK — Android 로컬 AI 엔진과 모델 연결 흐름
  level: "중급"
  summary: 'RunAnywhere Kotlin SDK는 공통 API 뒤에 llama.cpp·음성 엔진·QHexRT 같은 실행 엔진을 등록하고, 요청한 기능과 기기에 맞는 엔진을 선택한다. Android 흐름은 `LlamaCPP.register()` → `RunAnywhere.initialize()` → 모델 다운로드·로드 → 생성이다. `capabilities()`로 현재 패키지와 기기에서 실제 실행 가능한 기능을 확인한다. Console은 선택 기능이지만 일부 기능은 클라우드 경로를 지원하므로, 로컬 처리를 보장하려면 모델을 미리 준비하고 원격 경로를 끈 뒤 네트워크 차단 상태에서 검증한다.'
  points:
  - '엔진 등록은 기능 제공 가능성을 알린다. 모델 포맷·기기·설치된 백엔드에 따라 실제 지원은 달라진다.'
  - '`capabilities()` 결과를 확인한다. SDK에 enum이 있다는 사실만으로 런타임 지원이 보장되지는 않는다.'
  - 'Android는 API 24 이상, arm64 권장; QHexRT NPU는 Hexagon v75/v79/v81 Snapdragon arm64 대상'
  - '로컬 처리 확인: 모델 사전 다운로드 → 원격 처리 경로 비활성화 → 네트워크 차단 추론 테스트'
  source: https://github.com/RunanywhereAI/runanywhere-sdks
  interview: "Android AI SDK가 ‘오프라인 지원’이라고 할 때 무엇을 확인해야 하나요?"
  answer: "요청 기능을 처리할 엔진과 모델이 현재 기기에서 실제 사용 가능한지 `capabilities()` 등으로 확인한다. enum이나 API 존재만으로는 충분하지 않다. 모델을 미리 내려받고, 클라우드 경로를 쓰는 기능이라면 원격 경로를 끈 뒤 네트워크 차단 상태에서도 추론되는지 검사한다. QHexRT는 지원하는 Hexagon 세대와 arm64 기기인지도 확인한다."
- category: ai
  title: 'Android 음성 AI의 개인정보 경계: SpeechRecognizer 기본 경로는 기기 내 처리 보장이 아니다'
  level: "중급"
  summary: '기본 `SpeechRecognizer.createSpeechRecognizer()`는 시스템 기본 인식 서비스를 선택하며, Android 문서는 이 경로가 오디오를 원격 서버로 보낼 가능성이 있다고 경고한다. 기기 내 경로가 필요하면 API 31 이상에서 `isOnDeviceRecognitionAvailable()`을 확인하고 `createOnDeviceSpeechRecognizer()`를 사용한다. 이 확인은 on-device 서비스의 존재를 뜻할 뿐, 요청한 언어·모델의 지원까지 보장하지 않는다. API 33 이상에서는 `checkRecognitionSupport()`로 요청 조건을 추가 확인한다.'
  points:
  - '기본 서비스의 서버 사용 여부는 서비스 구현에 달려 있다. `SpeechRecognizer` API 자체를 오프라인 보장으로 해석하지 않는다.'
  - 'API 31+: on-device 서비스 가용성 확인 → on-device 전용 팩토리 사용'
  - 'API 33+: `checkRecognitionSupport()`로 요청한 언어·인식 조건의 지원 확인; 필요한 모델 다운로드도 고려'
  - '오프라인 요구사항은 목표 기기·언어·서비스 조합에서 네트워크 차단 테스트로 검증'
  source: https://developer.android.com/reference/android/speech/SpeechRecognizer
  interview: 'Android `SpeechRecognizer`를 사용하면 음성이 항상 기기 안에서 처리된다고 말할 수 있나요?'
  answer: '아니다. 기본 팩토리는 시스템 기본 서비스를 사용하며, Android는 이 API가 오디오를 원격 서버로 보낼 가능성이 있다고 경고한다. API 31 이상에서 on-device 서비스가 있는지 확인하고 전용 팩토리를 사용한다. 다만 서비스 가용성은 요청 언어·모델 지원을 뜻하지 않으므로 API 33 이상의 `checkRecognitionSupport()`와 실제 오프라인 테스트로 확인한다.'
- category: ai
  level: "고급"
  title: 'RecGPT-Mobile V2: 품질을 지킨 뒤 모바일 추론 비용 줄이기'
  summary: 'RecGPT-Mobile-V2는 최근 행동에서 다음 쇼핑 검색어를 예측하는 모바일 추천 연구다. 핵심은 답이 짧은지만 보상하지 않고, 먼저 검색어의 근거·유효성·형식을 평가한 뒤 품질을 통과한 결과에 대해서만 입력별 추론 예산을 최적화하는 것이다. 낮은 신뢰도·복수 의도·예산 초과 요청은 더 강한 서비스로 보낼 수 있어 완전한 오프라인 경로를 뜻하지 않는다.'
  points:
  - '동작: 행동 이력을 근거가 보존된 짧은 입력으로 압축하고, 복잡도·신뢰도에 따라 직접 생성·추가 추론·상위 서비스 경로를 선택'
  - '길이만 벌점으로 주면 짧지만 근거 없는 검색어가 늘 수 있다. 품질 기준 통과 후에만 reasoning 길이를 줄인다.'
  - '저자 통제 실험에서 품질 전용 RL 대비 A6는 Query 품질 73.2%→78.6%, hard failure 3.6%→1.6%, CoT 중앙값 62→14 토큰으로 보고됐다. Android 일반 성능이나 독립 재현 결과는 아니다.'
  sources:
  - label: RecGPT-Mobile-V2 기술 보고서 (2026-08)
    url: https://arxiv.org/html/2608.24295
  - label: RecGPT-Mobile 원 논문, SIGIR 2026
    url: https://doi.org/10.1145/3805712.3808410
  interview: '모바일 LLM의 추론 토큰을 줄일 때 길이 벌점만 사용하면 어떤 문제가 생기며, V2는 이를 어떻게 막나요?'
  answer: '길이 벌점만 최적화하면 모델이 근거와 논리를 생략하고 짧은 답만 내 품질이 떨어질 수 있다. 보고서의 통제 실험에서도 품질 미검증 길이 벌점은 CoT 중앙값을 0으로 만들었지만 Query 품질은 64.8%, hard failure는 10.5%였다. V2는 먼저 근거성·유효성 등 품질 기준을 적용하고, 통과한 후보에서 입력별 추론 예산을 최적화한다. 제시된 수치는 저자 실험이며 외부 재현이나 Android 전체의 성능 보장은 아니다.'
- category: ai
  level: "고급"
  title: 'OD-LLM 논문: 순차 추천 신호를 보존하며 LLM 가중치를 저랭크 압축'
  summary: 'OD-LLM은 사용자 행동 순서로 다음 상품을 예측하도록 미세 조정한 LLaMA-7B 추천 모델을 압축하는 연구다. 입력 활성값의 차원 상관·스케일을 정규화한 뒤 SVD로 가중치 행렬의 rank를 줄이고, 층별 활성값을 점진적으로 보정해 추천 신호 손실을 줄인다. 세 추천 벤치마크에서 모델 크기를 절반으로 줄인 설정은 원본 LC-Rec과 대체로 비슷하거나 일부 지표에서 높았다. 이는 데이터셋 평가이지 Android 실기기 배포 결과는 아니다.'
  points:
  - '압축 순서: 활성값 공분산 정규화 → SVD 저랭크 근사 → 층별 보정'
  - '50% 가중치 압축 결과는 Instruments·Games·Arts 벤치마크에서 비교했다. 압축률과 데이터가 바뀌면 품질도 다시 평가한다.'
  - '압축·학습 설정은 단일 NVIDIA A40 GPU를 사용했지만, 논문은 Android 휴대전화 실측을 제시하지 않는다.'
  sources:
  - label: OD-LLM 논문 (arXiv)
    url: https://arxiv.org/html/2601.09306
  - label: WSDM 2026 논문 DOI
    url: https://doi.org/10.1145/3773966.3777961
  interview: 'OD-LLM에서 SVD 전에 활성값을 정규화하고 압축 후 층별 보정을 하는 이유는 무엇인가요?'
  answer: '정규화는 활성값 차원의 상관과 스케일 차이가 SVD의 저랭크 근사를 좌우하는 문제를 줄이고, 층별 보정은 압축된 앞층의 출력 변화가 뒤층으로 누적되는 것을 완화한다. 논문은 세 추천 벤치마크의 50% 압축 설정에서 결과를 비교했지만, 이것만으로 Android 기기에서의 지연·메모리·전력이나 정확도를 입증하지는 않는다.'
- category: ai
  level: 중급
  title: 'Kotlin AI 라이브러리 도입 전 확인할 것: README의 Android 약속과 실제 Gradle 타깃'
  summary: 'Project KARL은 사용자 행동에 맞춰 기기에서 적응하는 AI 라이브러리라고 소개한다. 그러나 현재 core·KLDL·Room·Compose UI의 Gradle 타깃은 JVM이며, README가 안내하는 실행 예제도 Desktop이다. 반면 시작 가이드는 Android 앱을 가능한 사용처로 들고, Room 모듈은 Room 공통 의존성을 포함한다. 이 문서와 빌드 설정만으로 Android 지원을 확정하지 말고, 배포 artifact·Android 타깃과 source set·실제 앱 빌드/실행 예제를 검증한다. README의 로컬 처리·개인정보 보호 설명도 네트워크와 저장 경로를 코드로 확인하기 전에는 보증으로 취급하지 않는다.'
  points:
    - 'core·KLDL·Room·Compose UI 빌드 파일: `jvm {}` 타깃이며 Android 타깃 선언은 확인되지 않음. Room 공통 의존성만으로 Android 런타임 지원이 증명되지는 않음.'
    - 'README는 `:karl-example-desktop:run`을 실행 예제로 제시한다. 시작 가이드에는 Android 언급이 있지만, Gradle artifact 좌표는 실제 값 대신 예시 placeholder다.'
    - 'GitHub 저장소는 확인 시 11 stars, 최신 공개 릴리스는 v1.0.4(2026-08-13). 인기·성숙한 Android 배포 라이브러리의 근거로 볼 수는 없다.'
    - '도입 전 게이트: Android target/source set, 배포 artifact와 버전, 실제 Android 빌드·실행, 데이터 송수신 경로를 따로 검증한다.'
  source: https://github.com/theaniketraj/project-karl
  interview: 'KMP·Compose·Room을 사용한다고 소개하는 AI 라이브러리의 Android 지원 여부를 어떻게 판정하나요?'
  answer: '소개 문구가 아니라 실제 배포 모듈의 Gradle 타깃과 플랫폼별 구현, 배포 좌표·버전, Android 앱의 빌드 및 실행 예제로 확인한다. 공통 소스나 Room common 의존성은 Android 런타임 지원 자체를 증명하지 않는다. KARL은 시작 가이드에서 Android를 언급하지만 현재 확인한 모듈은 JVM 타깃이고 실행 예제는 Desktop이므로, 별도 검증 전에는 Android-ready로 단정하지 않는다.'
- category: ai
  level: 중급
  title: 'Apple Trust Insights: 기기 신호와 클라우드 모델을 결합한 사기 위험 평가'
  summary: 'Trust Insights는 iOS 27의 Swift framework로, 금융·계정 등 민감한 작업에서 사회공학·강압 위험을 평가하는 신호를 제공한다. Xcode capability/entitlement와 사용자 승인이 필요하고, 평가는 인터넷 연결이 있어야 하며 몇 초 걸릴 수 있다. 기기 신호는 기기 안에서 처리되지만 결과에는 Apple 계정·속도 신호가 더해질 수 있다. `unknown`은 안전 판정이 아니다. 결과는 기존 위험 로직의 보조 신호로 쓰고, 단독 차단 기준으로 삼지 않는다.'
  points:
    - '입력은 상호작용 패턴·타이밍·기본 센서 신호다. Apple은 사진·메시지·메일 콘텐츠는 분석하지 않으며, 기기 유래 신호는 Apple이나 제3자와 공유되지 않는다고 설명한다.'
    - '`unknown / medium / high` 중 `unknown`과 누락값은 저위험으로 간주하지 않는다. 평가 결과만으로 사용자를 차단하지 말고 기존 인증·위험 판단과 결합한다.'
    - '각 평가 결과마다 `reportConsumption`으로 앱의 대응을 보고해야 한다. 누락 시 rate limit 또는 서비스 접근 취소가 발생할 수 있다. 사후 확인된 fraud label 제출은 Apple Business Register를 통한 선택 사항이다.'
  sources:
    - label: Meet Trust Insights — WWDC26
      url: https://developer.apple.com/videos/play/wwdc2026/379/
    - label: iOS & iPadOS 27 Release Notes
      url: https://developer.apple.com/documentation/ios-ipados-release-notes/ios-ipados-27-release-notes
  interview: 'Trust Insights 평가의 `unknown`을 어떻게 처리하고, 결과 피드백은 왜 반드시 보고해야 하나요?'
  answer: '`unknown`은 위험이 낮다는 뜻이 아니므로 안전 판정으로 사용하지 않고 기존 위험 로직에 보수적으로 반영한다. Trust Insights만으로 차단하지 않는다. 각 평가 뒤에는 앱이 결과를 어떻게 사용했는지 `reportConsumption`으로 보고해야 하며, 누락하면 rate limit 또는 접근 취소 위험이 있다. 나중에 사기로 확인된 거래의 오프라인 label은 선택 제출이다.'
- category: ai
  title: 'Locanara Android — minSdk만으로 Gemini Nano 지원을 판단하지 않기'
  level: 중급
  summary: 'Locanara Android artifact의 `minSdk 31`은 이를 쓰는 앱의 설치 하한이지 Gemini Nano 사용 보장이 아니다. Locanara Gradle은 Gemini Nano Prompt API 엔진을 Android 14(API 34)+ 지원 기기로, ExecuTorch 경로를 API 31+로 구분한다. Google Prompt API 가이드의 API 26+는 API 통합 하한이며, Gemini Nano의 실제 사용 가능 여부는 지원 기기와 AICore 상태를 별도로 확인해야 한다. 특히 `UNAVAILABLE`은 기기 미지원뿐 아니라 최신 구성을 아직 받지 못한 경우일 수 있다.'
  points:
    - '`minSdk 31`은 Locanara artifact 기준. Gemini Nano 엔진(API 34+)과 ExecuTorch 엔진(API 31+)의 조건을 분리한다.'
    - 'Google Prompt API의 API 26+는 API 통합 하한이다. 실제 지원은 지원 기기와 `AVAILABLE`·`DOWNLOADABLE`·`DOWNLOADING`·`UNAVAILABLE` 런타임 상태로 판단한다.'
    - '`UNAVAILABLE`은 미지원 기기 또는 최신 AICore 구성을 아직 받지 못한 경우일 수 있다. 진행·실패 상태와 재시도 UX도 처리한다.'
    - '현재 Locanara는 `checkStatus()` 결과를 캐시하고 다운로드 완료 시 캐시를 `Available`로 바꾼다. `clearStatusCache()`로 캐시를 지운 뒤 다시 확인할 수 있다. 배포 artifact의 AGPL-3.0 조건을 검토한다.'
  sources:
    - label: Google Prompt API — Get started
      url: https://developer.android.com/agents/skills/device-ai/ml-kit-genai-prompt-api/references/get-started
    - label: Locanara Android Gradle build
      url: https://github.com/hyodotdev/locanara/blob/main/packages/android/locanara/build.gradle.kts
    - label: Locanara Prompt API status implementation
      url: https://github.com/hyodotdev/locanara/blob/main/packages/android/locanara/src/main/kotlin/com/locanara/mlkit/MLKitPromptClient.kt
  interview: 'Locanara의 `minSdk 31`과 Google Prompt API의 API 26+는 Gemini Nano가 어떤 기기에서 실행되는지를 보장하나요?'
  answer: '아니다. Locanara의 minSdk 31은 앱 설치 하한이고, Google Prompt API의 API 26+는 API 통합 하한이다. Locanara의 Gemini Nano 경로에는 API 34+ 지원 기기가 필요하며, 모델 준비 여부는 런타임 `checkStatus()`로 확인해야 한다. `UNAVAILABLE`은 미지원 기기뿐 아니라 최신 AICore 구성이 아직 오지 않은 경우일 수 있다. 현재 구현은 상태를 캐시하므로 다운로드 뒤 재검증이 필요하면 `clearStatusCache()` 후 다시 확인한다. 다운로드 실패·진행과 fallback UX도 설계한다.'
- category: ai
  title: 'PowerLens — Android 제어 에이전트에서 권한과 실행 경계를 검증하기'
  level: "고급"
  summary: 'PowerLens는 Android 접근성 트리와 시스템 문맥으로 Gemini-2.5-Flash API에 절전 정책을 요청하고, PDL 제약을 확인한 뒤 `su` root 권한으로 설정을 바꾸는 연구 프로토타입이다. 논문은 shell 명령도 LLM이 생성한다고 하지만 저자 사이트는 결정적 테이블 조회라고 설명해 실행 경계가 일치하지 않는다. PII 필터링은 위험을 줄이는 조치이지 온디바이스 처리나 데이터 미전송을 뜻하지 않는다. 저자 보고 성능은 루팅된 OnePlus ACE 5·Android 15 벤치마크 결과이므로 일반 앱이나 기기의 성능으로 일반화하지 않는다.'
  points:
  - '논문 보고치: 38.8% 에너지 절감·81.7% action accuracy·0.6% violation; 주 벤치마크는 rooted OnePlus ACE 5 한 대에서 실행'
  - 'UI 접근성 트리와 문맥을 클라우드 Gemini API로 전송; PII 필터가 오프라인·무전송을 보장하지 않음'
  - '논문과 저자 사이트의 실행 경로 설명이 다르고 공개 코드도 확인되지 않음; 저자 사이트는 심사 중으로 표시'
  sources:
    - label: PowerLens arXiv preprint
      url: https://arxiv.org/html/2603.19584
    - label: PowerLens author project page
      url: https://anonymous-powerlens.github.io/
  interview: 'PowerLens의 배터리 절감 수치만 보고 Android 앱에 적용해도 될까요? 어떤 경계를 먼저 검증해야 하나요?'
  answer: '아니다. 38.8% 절감 등은 저자가 rooted OnePlus ACE 5·Android 15에서 보고한 벤치마크 결과다. 이 시스템은 UI 접근성 트리를 PII 필터링 후 Gemini 클라우드로 보내며 `su` root로 시스템 설정을 바꾼다. 또한 논문은 LLM의 shell 명령 생성을, 저자 사이트는 결정적 테이블 조회를 설명하고 공개 코드가 없어 실행 경계를 독립 검증할 수 없다. 데이터 최소화, root 권한, 허용 명령·결정적 검증·rollback, 대상 기기 재현 실험을 먼저 확인한다.'
- category: ai
  title: 'MNN-AECS — 코어 선택만으로 절전 효과를 보장할 수 없는 이유'
  level: "고급"
  summary: 'MNN-AECS는 메모리 병목인 LLM decode에서 CPU 코어 affinity를 탐색해 에너지를 줄이는 연구 방식이다. 저자는 기기별 코어 구성을 한 번 탐색해 재사용하고, prefill과 decode의 코어 설정을 분리했다. Android의 affinity는 코어를 고를 뿐 주파수를 직접 낮추지 않으므로, 유휴 코어에 대한 OS governor의 동작이 절전량을 바꾼다. 논문은 5대 Android와 2대 iOS에서 원본 MNN 대비 평균 23% 절감을 보고했지만, Meizu 21은 약 10%에 그쳤다. 이는 연구 결과이지 앱이나 모든 기기의 보장치가 아니다.'
  points:
  - 'AECS는 기기별 코어 구성을 한 번 탐색하고 decode에서 재사용; prefill과 decode는 별도 설정'
  - '저자 보고치: 7기기 평균 23% 절감, 기기별 약 10~42%; Meizu 21은 유휴 클러스터 주파수가 내려가지 않아 약 10%'
  - 'dataset 실험에서 Huawei 두 기기는 1%·7% 느렸고 나머지 다섯 기기는 1~20% 빨라짐; 평균만으로 기기 결과를 일반화하지 않기'
  - '현재 MNN upstream에는 수동 `cpuIds`·affinity 설정이 있지만 논문의 자동 탐색·분리 튜닝은 확인되지 않음; 논문은 root 없이 동작한다고 설명'
  sources:
    - label: MNN-AECS arXiv preprint v1
      url: https://arxiv.org/html/2506.19884
    - label: MNN CPUBackend — manual CPU IDs and affinity
      url: https://github.com/alibaba/MNN/blob/da16b74d958314eaa81419b177427811e3b3a145/source/backend/cpu/CPUBackend.cpp
    - label: MNN CPURuntime — sched_setaffinity
      url: https://github.com/alibaba/MNN/blob/da16b74d958314eaa81419b177427811e3b3a145/source/backend/cpu/CPURuntime.cpp
  interview: 'MNN-AECS가 평균 23% 에너지를 줄였다고 해서 내 Android 기기에서도 같은 절감이 보장될까요?'
  answer: '아니다. 이는 논문이 5대 Android와 2대 iOS 기기에서 보고한 평균이다. 코어 affinity는 실행 코어를 제한하지만 주파수를 직접 제어하지 않으며, OS governor의 유휴 클러스터 처리와 기기별 차이가 결과를 바꾼다. 공개 MNN에는 수동 CPU ID 설정과 affinity가 있지만 논문식 기기별 자동 탐색·prefill/decode 분리 튜닝은 확인되지 않았다. 같은 기기·모델·프롬프트에서 에너지와 decode 속도를 함께 측정하고, 결과를 평균으로 뭉개지 않는다.'
- category: ai
  title: 'AgentStop — 로그확률·반복 신호로 로컬 에이전트를 조기 종료하기'
  level: "고급"
  summary: 'AgentStop은 작업 단계마다 토큰 로그확률 하위 10개, 출력 토큰 수, 인접 단계의 토큰 겹침률을 XGBoost 분류기에 넣어 실패 가능성을 예측하고, 계속 실행할지 판단하는 연구다. 분류기는 에이전트·작업·단계별 성공·실패 기록으로 학습한다. Qwen3-30B-A3B 실험에서 FRAMES는 5단계에서 낭비 에너지 22% 감소·task utility 1.6% 하락을 보였고, SimpleQA는 3~4단계에서 25% 감소·utility 하락 5% 미만이었다. SWE-Bench Verified의 Qwen3-Coder-30B-A3B는 5단계에서 18~19% 감소·utility 하락 5% 미만이었다. 이 값은 Apple M1 Max 실험이며 Android 실측이 아니다.'
  points:
  - '신호: 토큰 로그확률 하위값·단계별 출력 길이·인접 단계 간 중복'
  - '저자 보고치: FRAMES 22% 절감·utility 1.6% 하락; SimpleQA 최대 25%·utility 하락 5% 미만; SWE-Bench 18~19%·utility 하락 5% 미만'
  - 'Qwen3-1.7B에서는 분류 성능이 무작위 추측 수준이라 baseline보다 낫지 않았음; 작은 모델에도 효과가 난다고 일반화하지 않기'
  - '학습한 모델·작업·단계에 맞춰 임계값을 검증; 너무 공격적으로 중단하면 성공할 실행도 실패 처리되어 에너지 낭비가 되레 늘 수 있음'
  - '측정은 Apple M1 Max에서 수행; Jetson Orin은 코드 테스트 대상. QA는 Brave Search API를 사용하며, Android 휴대전화 실측은 아님'
  interview: 'AgentStop의 조기 종료기를 다른 모델이나 Android 앱에 바로 적용해도 될까요?'
  answer: '바로 적용하면 안 된다. 논문은 에이전트·작업·단계별 분류기를 학습했고, Qwen3-1.7B에서는 효과가 baseline보다 낫지 않았다. 임계값을 공격적으로 잡으면 성공할 실행까지 중단해 task utility와 에너지 절감이 함께 나빠질 수 있다. 결과는 64GB M1 Max에서 측정했고 24GB급 메모리를 권장하는 Qwen3 30B 계열 실험이므로 Android 실측이나 작은 기기에서의 효과를 입증하지 않는다. QA에는 Brave Search API도 쓰여 모든 데이터 경로가 로컬인 것은 아니다.'
  source: https://arxiv.org/html/2605.15206
- category: ai
  level: "중급"
  title: 'Android Studio Agent Mode — IDE·빌드·실기기를 잇는 개발 루프'
  summary: 'Android Studio Agent Mode는 큰 개발 목표를 계획으로 나누고 여러 파일을 수정한 뒤 빌드 오류를 고치며 반복한다. 허용된 도구로 앱을 연결 기기에 배포하고 화면·스크린샷·Logcat을 확인하거나 `adb shell input`으로 조작할 수도 있다. 코드 문맥 공유는 기본 비활성 상태이며, 활성화하면 프로젝트 일부가 Gemini에 전송될 수 있다. `.aiexclude`로 문맥 대상 파일을 제한하고 계정 유형별 데이터 사용 조건을 확인한다. 파일 diff와 빌드·테스트·기기 결과는 개발자가 검증한다.'
  points:
  - '계획·다중 파일 수정·빌드 반복 후 연결 기기 화면, 스크린샷, Logcat 확인'
  - '권한이 필요한 도구와 `adb` 기기 조작은 목적·대상·부작용을 먼저 검토'
  - '코드 문맥 공유는 기본 비활성; context awareness를 켜면 관련 파일이 전송될 수 있고 `.aiexclude`로 제외 가능'
  - '무료·개인 API key·Enterprise 계정은 데이터 사용 조건이 다름; 민감 코드와 로그를 넣기 전 tier 정책 확인'
  - '변경 diff, 빌드·테스트, 실행 화면을 직접 확인하고 성공 기준을 닫기'
  source: https://developer.android.com/studio/gemini/agent-mode
  interview: 'Agent Mode가 프로젝트 파일을 읽지 않는다고 가정해도 될까요? 어떤 설정과 실행 증거를 확인해야 하나요?'
  answer: '코드 문맥 공유는 기본적으로 꺼져 있지만, context awareness를 켜면 관련 소스가 Gemini에 전달될 수 있다. `.aiexclude`로 제외 파일을 지정하고 무료·개인 API key·Enterprise의 데이터 사용 조건을 구분한다. 기기 배포·입력 도구 권한을 검토하고, 생성된 diff와 빌드·테스트·화면·Logcat 증거를 확인한다. “완료” 응답만으로는 기능이나 데이터 경계가 검증되지 않는다.'
  sources:
    - label: Android Studio Agent Mode and device tools
      url: https://developer.android.com/studio/gemini/agent-mode
    - label: Gemini in Android Studio data and privacy
      url: https://developer.android.com/studio/gemini/data-and-privacy
- category: ai
  level: "중급"
  title: 'Mobile AI Agents — 모바일 코딩 에이전트도 검증 루프를 가져야 한다'
  summary: 'Mobile AI Agents는 Android·iOS·Flutter 등 모바일 프로젝트용 에이전트·스킬·워크플로를 묶은 오픈소스다. 예를 들어 Codex에는 `npx mobile-ai-agents install --tool codex`로 설치한다. 프로젝트 문서는 계획 → 구현 → 코드·보안 점검 → 기기 UI·QA 검증 → 증거 보고의 반복 루프를 제안한다. 핵심은 에이전트 수가 아니라, 테스트나 화면 증거가 없으면 완료로 간주하지 않고 사람이 중요한 변경과 출시를 승인하는 것이다.'
  points:
  - '워크플로: 목표·성공 기준 → 구현 → 코드·보안 점검 → 테스트·기기 UI 확인 → 결과 기록'
  - '체크가 실행되지 않았거나 증거가 없으면 “통과”가 아니라 “미검증”으로 남긴다'
  - '에이전트는 작업을 돕고, 중요한 결정과 출시 승인은 개발자가 맡는다'
  interview: '모바일 코딩 에이전트가 “완료”라고 답하면 바로 출시해도 될까요?'
  answer: '아니다. 변경 diff와 테스트·보안 검사 결과를 확인하고, 필요한 경우 에뮬레이터나 기기에서 UI를 검증한다. 도구가 없거나 증거를 만들지 못한 단계는 통과로 취급하지 않는다. 마지막 승인과 출시 판단은 개발자가 한다.'
  source: https://github.com/salmanashraf/mobile-ai-agents
- category: ai
  level: "중급"
  title: 'Flutter 온디바이스 모더레이션 — 로컬 추론과 네트워크 경계 분리'
  summary: 'Flutter 패키지 `nsfw_detect`는 Android에서 TFLite로 이미지·영상을 기기 안에서 분류한다. 파일·바이트 입력은 로컬 경로지만 `scanUrl`은 원격 미디어 요청이고, 선택 모델은 별도 다운로드가 필요할 수 있다. 선택형 photo picker와 달리 전체 보관함 조회는 Android 버전에 맞는 미디어 권한, 카메라 스캔은 CAMERA 권한이 필요하다. 결과는 확률적 신호다. 이 사례로 추론·미디어 입력·모델 배포·텔레메트리 경로를 각각 점검한다.'
  points:
  - 'TFLite 추론은 로컬; 파일·바이트는 권한 불필요, 선택 photo picker도 전체 보관함 권한을 요구하지 않음'
  - '네트워크 경계: `scanUrl`은 미디어 요청, 대체 모델은 opt-in 다운로드; README에 따르면 기본 모델 약 11MB, 대안은 약 46~152MB'
  - '전체 미디어 보관함은 API 33+ `READ_MEDIA_IMAGES/VIDEO`, API 32 이하는 `READ_EXTERNAL_STORAGE`; 카메라는 CAMERA 권한'
  - '점수는 오탐·미탐 가능한 분류 신호; 신고·사람 검토·정책 규칙으로 보완'
  interview: '온디바이스 모더레이션이라면 앱을 비행기 모드에서도 항상 쓸 수 있나요?'
  answer: '아니다. 로컬 파일·바이트 추론은 네트워크 없이 가능하지만 `scanUrl`은 미디어를 요청하고, 아직 내려받지 않은 모델은 다운로드가 필요하다. picker, 전체 보관함, 카메라 입력은 각각 권한 범위도 다르다. 네트워크 경로와 권한을 API별로 확인하고, 분류 점수는 확정 판정 대신 검토 신호로 다룬다.'
  sources:
    - label: nsfw_detect package, version history, and platform matrix
      url: https://pub.dev/packages/nsfw_detect
    - label: nsfw_detect source and implementation README
      url: https://github.com/nexas105/flutter_nsfw_scaner
- category: ai
  level: "고급"
  title: 'VLM 분류의 확신도 — 생성된 라벨을 확률처럼 쓰지 않기'
  summary: 'SideEye 사례는 VLM에 `Category: N` 형식으로 답하게 한 뒤 텍스트를 파싱해 플래그를 만든다. 앱은 이 이진 판단을 `primaryConfidence = 1.0` 또는 `0.0`으로 저장하지만, 이는 모델 확률이나 보정된 확신도가 아니다. 더 위험한 점은 라벨이 없거나 알 수 없는 값이어도 파싱 결과를 “안전”으로 처리한다는 것이다. 제품에서는 분류 점수와 파싱 상태를 분리하고, 클래스별 정밀도·재현율·오탐·미탐을 검증하며, 불확실하거나 형식이 잘못된 응답은 사람 검토로 보낸다.'
  points:
  - '파서가 `Category: N`을 직접 해석; 누락·미지원 숫자도 “안전” 결과로 처리되어 fail-open 위험이 있음'
  - '`1.0/0.0`은 앱의 이진 결정값이지 모델 확률이나 calibrated confidence가 아님'
  - '라벨 점수와 파싱 오류를 분리; 대표 데이터의 클래스별 precision/recall·오탐·미탐을 측정하고 불확실한 결과는 검토'
  - '이 사례 앱은 Android 9+와 Qualcomm NPU 필요, 모델 약 2.4GB; 라이브러리 권장이 아닌 코드 리뷰 사례'
  interview: 'VLM 결과가 `Category: 2`라 앱이 confidence 1.0을 저장했다면 무엇을 검증해야 하나요?'
  answer: '1.0은 모델의 확률이 아니라 앱이 파싱한 이진 플래그다. 또 현재 사례의 파서는 라벨 누락이나 미지원 숫자를 “안전”으로 처리하므로 malformed output을 성공으로 간주하지 않게 상태를 분리해야 한다. 대표 데이터에서 클래스별 정밀도·재현율과 오탐·미탐을 평가하고, 불확실하거나 파싱할 수 없는 응답은 사람 검토나 재시도로 보낸다.'
  sources:
    - label: SideEye ImageAnalyzer implementation
      url: https://github.com/baseweight/SideEye/blob/main/app/src/main/java/ai/baseweight/sideeye/data/ai/ImageAnalyzer.kt
    - label: SideEye README and device/model requirements
      url: https://github.com/baseweight/SideEye
- category: ai
  level: "중급"
  title: 'YOLO26 Android 배포 — NMS-free와 모바일 속도는 따로 검증'
  summary: 'YOLO26은 객체 감지·분할·깊이·분류·포즈·OBB를 지원하는 비전 모델 패밀리다. Android에서는 LiteRT로 내보낸 `.tflite` 모델을 사용할 수 있다. 단, NMS-free는 선택 기능이다. one-to-one 경로를 쓰는 `nms=False` 내보내기와 달리 기본 one-to-many 경로는 NMS를 쓴다. 자주 인용되는 “최대 43% 빠름”은 YOLO26n과 YOLO11n의 CPU ONNX 비교이며, 측정기는 Intel Xeon이지 휴대전화가 아니다. 실제 앱에서는 목표 기기·LiteRT delegate·입력 크기를 고정해 정확도와 전체 지연을 측정한다.'
  points:
  - 'Android 경로: `model.export(format="litert")` → `.tflite`; 새 내보내기 이름은 LiteRT'
  - 'NMS-free: 선택한 `nms=False` end-to-end 경로에 한정; 기본 경로는 NMS 사용'
  - '43% 수치: YOLO26n vs YOLO11n, CPU ONNX, Intel Xeon; Android 성능 보장 아님'
  - '실측: 전처리·추론·후처리 전체 지연과 기기별 delegate·정확도를 함께 비교'
  interview: 'YOLO26이 CPU에서 최대 43% 빠르다는데, Android에서도 같은 개선을 기대해도 될까요?'
  answer: '아니다. 공식 43% 수치는 YOLO26n과 YOLO11n의 CPU ONNX 비교이며, Intel Xeon에서 측정했다. Android는 `.tflite` LiteRT 모델로 내보낸 뒤 목표 기기에서 실제 delegate와 입력 크기를 고정해 비교해야 한다. 전처리·후처리까지 포함한 지연과 양자화 후 정확도를 확인한다. 또 NMS-free는 `nms=False` 경로에서 선택해야 하며 기본 one-to-many 경로와 같지 않다.'
  source: https://docs.ultralytics.com/models/yolo26
- category: ai
  title: 'MobileLLM-Flash — 스마트폰 실측 지연으로 작은 온디바이스 LLM 구조를 고르는 법'
  summary: '모델 크기나 FLOPs만으로는 휴대전화의 실제 응답 속도를 알기 어렵다. MobileLLM-Flash 연구는 사전학습 모델을 가지치기한 후보를 ExecuTorch로 내보내 Galaxy S25에서 측정하고, 품질과 첫 토큰 지연(TTFT)의 파레토 절충점을 탐색했다. 연구 결과 얕고 넓은 구조와 연속으로 몰리지 않는 attention 생략이 유리했다. 이는 연구진의 모델·기기·런타임 설정 결과이며 모든 Android 기기의 성능 보장은 아니다.

    '
  points:
  - '측정 조건: Galaxy S25, ExecuTorch 1.1/XNNPACK, 4-bit weight·8-bit activation, CPU 4개 스레드'
  - '논문은 LFM2 대비 최대 1.8배 빠른 prefill·1.6배 빠른 decode를 보고; 입력 길이별 수치와 품질도 함께 비교'
  - '35%는 MobileLLM-Pro 사전학습량 대비 continued pretraining 토큰; 후보 탐색은 200×2.6B 토큰, 최종 instruction tuning은 모델당 800B 토큰'
  interview: '온디바이스 LLM을 고를 때 파라미터 수만 보면 충분할까요?'
  answer: '아니다. 논문은 파라미터 수와 FLOPs가 실제 기기 지연을 충분히 설명하지 못한다고 보고, 후보를 목표 런타임으로 내보내 Galaxy S25에서 직접 측정했다. 다만 공개된 비교는 Galaxy S25의 ExecuTorch 1.1/XNNPACK CPU와 양자화 설정에 한정된다. 앱에서는 목표 기기와 delegate, 입력 길이, 양자화 조건을 고정해 TTFT·생성 속도·품질·메모리를 함께 재야 한다. 논문의 “35%”는 원본 MobileLLM-Pro 사전학습 토큰 대비 continued pretraining이며, 후보 탐색 및 instruction tuning 비용까지 포함한 총 학습량 절감률은 아니다.'
  source: https://arxiv.org/html/2603.15954v2
- category: ai
  level: "중급"
  title: 'GenieX (구 NexaSDK) — Snapdragon 기기용 Android 온디바이스 LLM·VLM 런타임'
  summary: 'GenieX는 Snapdragon 전용 온디바이스 생성형 AI 런타임이며 Android SDK는 Kotlin/Java 앱에 연결할 수 있다. GGUF 모델은 llama.cpp 경로로 CPU·GPU·Hexagon을 사용할 수 있고, Qualcomm AI Hub 사전 컴파일 모델은 Qualcomm AI Engine Direct를 통해 NPU에서 실행한다. 따라서 “NPU 우선” 하나로 단순화하기보다 모델 형식에 따라 런타임과 가속 경로가 달라짐을 확인해야 한다. 공식 문서는 현재 개발자 프리뷰로 안내한다.'
  points:
  - 'Android SDK: Kotlin/Java; 공개 예제에선 Gradle 의존성으로 추가'
  - 'GGUF → llama.cpp 경로; AI Hub 모델 번들 → NPU 전용 Qualcomm AI Engine Direct'
  - 'Snapdragon 전용이며 지원 기기·모델 번들·가속 경로를 실제 기기에서 확인'
  interview: 'GenieX에서 모든 모델이 Snapdragon NPU로 실행되나요?'
  answer: '아니다. 문서는 두 경로를 구분한다. GGUF 모델은 llama.cpp를 통해 CPU·GPU·Hexagon에서 실행할 수 있고, Qualcomm AI Hub의 사전 컴파일 모델 번들은 Qualcomm AI Engine Direct를 사용해 NPU에서 실행한다. 모델 형식, 칩셋 지원, 런타임과 기기별 동작을 확인하고, 성능이 중요하면 목표 기기에서 delegate별 지연·메모리·발열을 측정해야 한다. 현재 제품 문서는 개발자 프리뷰라고 표시한다.'
  source: https://github.com/qualcomm/GenieX
- category: ai
  level: "중급"
  title: 'ACE-Step 1.5 — VRAM 예산에 따라 로컬 음악 생성 구성을 고르는 법'
  summary: 'ACE-Step 1.5는 언어 모델(LM)이 곡 구성 정보를 만들고 Diffusion Transformer(DiT)가 오디오를 생성하는 로컬 텍스트-투-뮤직 시스템이다. 모델 크기와 LM 포함 여부에 따라 VRAM 요구량과 기능이 달라진다. 저장소는 6GB 이하 GPU에서 2B Turbo DiT, LM 비활성화, INT8 양자화와 전체 CPU 오프로딩 구성을 권한다. 따라서 “4GB 미만”만으로 같은 품질·속도·기능을 기대하면 안 된다.'
  points:
  - '6GB 이하 구성: 2B Turbo DiT; LM 기본 비활성화, INT8 및 CPU 오프로딩'
  - '저장소 보고치: A100 <2초, RTX 3090 <10초/곡; 생성 모드·확산 단계 등에 따라 달라짐'
  - 'LoRA 예시: 곡 8개, RTX 3090 12GB에서 약 1시간으로 안내; 다른 환경 성능 보장 아님'
  interview: '“4GB VRAM에서 동작”이라는 문구만으로 모델 구성을 선택해도 될까요?'
  answer: '안 된다. 공식 권장표에서 6GB 이하 구성은 2B Turbo DiT를 사용하고 언어 모델을 끄며, INT8과 전체 CPU 오프로딩을 적용한다. 즉 낮은 VRAM 조건에서는 기능과 처리 방식이 달라진다. A100과 RTX 3090의 생성 시간도 저장소가 보고한 값이며 모드와 확산 단계에 따라 달라진다. 목표 하드웨어에서 프로파일링하고 필요한 모델 구성·출력 길이·품질을 함께 확인한다. 프로젝트는 생성물의 저작권 유사성 위험을 안내하므로, 배포 전 결과물과 사용 조건을 검토한다.'
  source: https://github.com/ACE-Step/ACE-Step-1.5
- category: ai
  level: "고급"
  title: 'Cadence — Health Connect 데이터는 어디서 추론되고 로그에 남을까?'
  summary: 'Cadence Android는 Health Connect·GPS 맥락을 문자열로 만들고, LLM HTTP endpoint에서 상태와 곡 파라미터를 추론한 뒤 별도 음악 생성 endpoint를 호출한다. 센서를 기기에서 읽는다고 추론까지 기기 안에서 하는 것은 아니다.'
  points:
  - '기본 Gradle 설정: LLM은 OpenRouter, 음악 생성은 Cadence API; 앱에서 endpoint를 바꿀 수 있음'
  - '`PromptBuilder`는 심박·수면·활동·시간과 소수점 4자리 GPS 좌표를 맥락에 포함'
  - '`MusicRepository`가 맥락 프롬프트를 `Log.d`로 기록하므로 릴리스 logcat에서 제거·마스킹 여부를 검증'
  interview: 'LLM endpoint를 로컬 Ollama로 바꾸면 건강 맥락이 더는 기기 밖으로 나가지 않을까요?'
  answer: '아니다. LLM과 음악 생성은 별도 HTTP endpoint다. LLM만 로컬로 바꾸면 두 번째 endpoint는 여전히 원격일 수 있고, 그곳에는 곡 생성 파라미터가 전달된다. 설정된 두 endpoint와 실제 요청 payload를 확인해야 한다. 또한 코드에 건강 맥락 프롬프트를 `Log.d`에 남기는 경로가 있으므로 릴리스 빌드의 logcat도 점검한다. “식별자가 없다”는 설명만으로 건강·위치 맥락의 민감성이 사라지는 것은 아니다.'
  source: https://github.com/wtgme/cadence

- category: ai
  level: "중급"
  title: 'GitHub MCP issue fields — 이슈 메타데이터 조회·작성·필터'
  summary: 'GitHub MCP Server는 설정된 issue fields를 조회하고, issue write와 검색에서 값을 읽거나 갱신·필터링한다. 에이전트는 라벨·본문에 흩어진 triage 정보를 저장소의 타입이 있는 메타데이터로 다룰 수 있다. 단, 조회 가능한 schema와 쓰기·필터 도구 권한은 별도로 확인해야 한다.'
  points:
  - '`list_issue_fields(owner, repo)`는 저장소에 적용되는 필드를 돌려준다; `repo`를 생략하면 조직 필드 schema를 조회'
  - '`issue_write.issue_fields`는 `field_name`과 값/선택지로 설정하고 `delete: true`로 비운다; repo 쓰기 권한 필요'
  - '`list_issues.field_filters`의 현재 문서화된 타입은 single-select·text·number·date; 노출 도구와 인증 scope를 확인'
  - '개인 소유 저장소는 2026-11-11 GA; 조직 issue fields의 공개 프리뷰 확대와 상태를 혼동하지 않기'
  interview: '`list_issue_fields`가 Priority를 반환하면 에이전트가 곧바로 해당 필드를 쓸 수 있고 모든 issue field 타입으로 검색할 수 있나요?'
  answer: '아니다. 이 도구는 저장소나 조직에 설정된 schema를 조회할 뿐, 호스트가 `issue_write`와 `list_issues`를 허용하는지 또는 인증 scope가 충분한지 증명하지 않는다. MCP 문서에서 field write는 `field_name`과 타입에 맞는 값/선택지 또는 삭제 표기를 요구하고, 필터 타입은 single-select·text·number·date로 적혀 있다. 특히 제품 자체의 multi-select 지원을 MCP 필터 지원으로 추정하지 말고 실제 도구 schema를 확인한다. 이슈 근거와 선택지를 대조한 뒤 필요한 권한만 사용한다.'
  source: https://github.com/github/github-mcp-server

- category: ai
  title: Android AppFunctions 1.0 — 앱 기능을 시스템 에이전트용 로컬 도구로 제공
  level: "중급"
  summary: AppFunctions는 앱 기능을 Android OS에 등록해 권한이 있는 에이전트가 로컬 도구처럼 검색·실행하게 하는 플랫폼 API와 Jetpack 라이브러리다. Jetpack `androidx.appfunctions` 1.0.0은 2026-11-18 stable이지만, 현재 Android 개발자 개요는 AppFunctions 통합을 experimental preview로 표시한다. API/library 안정화와 에이전트 제공자 지원은 별개다. Gemini 테스트·배포에는 Connected Apps 개발자 프리뷰 참여가 필요하며, Android Enterprise 정책은 work profile의 데이터 제공과 agent automation을 제한할 수 있다.
  points:
  - '`@AppFunctionDeclaration`과 KDoc로 기능·매개변수의 의미를 설명해 에이전트가 호출할 도구로 노출'
  - 내 앱 기능은 앱 자체 에이전트가 호출할 수 있지만, 다른 앱 기능 탐색·호출은 시스템 어시스턴트 권한이 필요
  - 기본 실행 스레드는 UI 스레드이므로 오래 걸리는 작업은 suspend 함수와 적절한 dispatcher로 분리
  - 'Jetpack 1.0.0 stable ≠ 전체 AppFunctions 플랫폼 통합 GA; Gemini는 Connected Apps 개발자 프리뷰'
  - 'Android 17 ADB로 등록·실행을 검사하고, 별도로 agent가 올바른 기능을 고르는지 테스트'
  source: https://developer.android.com/ai/appfunctions
  interview: "Jetpack AppFunctions 1.0.0이 stable이라면 Android 앱에서 Gemini 연동도 모두 GA로 쓸 수 있나요?"
  answer: "아니다. Jetpack 라이브러리 버전 안정화는 Android platform API의 preview 상태나 assistant/provider 지원까지 GA가 됐다는 뜻이 아니다. 현재 overview는 AppFunctions integration을 experimental preview라고 안내하고, Gemini 연동·테스트에는 Connected Apps developer preview 신청이 필요하다. 앱 기능은 권한이 있는 caller에만 노출하고, 실제 기기와 agent에서 기능 선택·실행을 검증한다."
- category: ai
  level: "고급"
  title: Android Enterprise AI 경계 — AppFunctions와 Agentic Automation 분리
  summary: "Android 17은 AI 기능을 work profile 데이터 경계와 관리 정책 안에 둔다. Device State for LLMs는 권한이 있는 assistant가 AppFunctions로 기기 데이터를 읽게 하지만 work profile 데이터는 반환하지 않는다. 관리자는 `DevicePolicyManager.setAppFunctionsPolicy(APP_FUNCTIONS_DISABLED)`로 현재 user의 AppFunctions를 끌 수 있다. 별도의 Agentic Automation은 work profile 안에서 자동화를 막고, 완전 관리 기기나 COPE의 personal profile에서는 관리자가 기존 `setNearbyAppStreamingPolicy`로 AI automation을 비활성화할 수 있다. 두 정책은 서로 다른 기능을 제어하므로 하나의 toggle로 오해하지 않는다."
  points:
  - "AppFunctions/LLM context: assistant 권한과 DPM 정책을 확인; work profile 데이터는 제공되지 않음"
  - "`APP_FUNCTIONS_DISABLED`: 현재 user의 AppFunctions 비활성화; cross-profile-only 정책과 구분"
  - "Agentic Automation은 work profile에서 차단; 완전 관리·COPE personal profile의 관리자 차단은 별도 policy 경로"
  source: https://developer.android.com/work/versions/android-17
  interview: "Android 17에서 `APP_FUNCTIONS_DISABLED`를 설정하면 Agentic Automation도 함께 비활성화되나요? work profile 데이터는 assistant에 전달될 수 있나요?"
  answer: "두 기능은 구분한다. `APP_FUNCTIONS_DISABLED`는 현재 user의 AppFunctions operations를 관리 정책으로 끈다. Agentic Automation은 별도의 정책 경로를 사용하며 Android Enterprise 문서는 work profile 내 자동화를 막고 완전 관리 기기·COPE personal profile에서 `setNearbyAppStreamingPolicy`로 끌 수 있다고 설명한다. Device State for LLMs는 work profile 데이터를 반환하지 않으므로 업무 데이터가 personal-profile assistant에 섞이지 않도록 경계를 유지한다."
- category: ai
  title: Android AI Sample Catalog — 클라우드·온디바이스 예제로 배포 경계 읽기
  level: "초급"
  summary: "Android AI Sample Catalog는 Google의 온디바이스·클라우드 생성형 AI 예제를 직접 실행하며 구조를 익히는 학습 앱이다. 하이브리드 예제는 `PREFER_ON_DEVICE`로 기기에서 먼저 추론하고, 기기나 요청이 지원되지 않으면 클라우드로 전환한다. 클라우드 전환은 네트워크·비용·데이터 전송 경계가 바뀐다는 뜻이다. 샘플 코드는 데모용이므로 제품에 복사하기 전에 오류 처리와 개인정보·비용 정책을 다시 설계한다."
  points:
  - "`PREFER_ON_DEVICE`는 로컬 모델을 먼저 시도하고, 사용할 수 없거나 요청이 맞지 않으면 클라우드로 전환"
  - "Firebase AI Logic 클라우드 요청은 유효한 App Check 증명을 요구하며, 2026-11-02부터 프로젝트에 자동 적용됨"
  - "데모 코드는 프로덕션용이 아님: 데이터 전송·클라우드 비용·실패 시 동작을 제품 기준으로 검토"
  source: https://developer.android.com/ai/hybrid
  interview: "AI 샘플을 제품에 적용할 때 클라우드·온디바이스·App Check 경계를 어떻게 확인하나요?"
  answer: "먼저 샘플을 제품 코드로 간주하지 않는다. 모델의 기기 지원 여부와 추론 모드를 확인하고, 클라우드 전환 시 어떤 데이터가 전송되는지·비용이 발생하는지·요청 실패를 어떻게 처리할지 정의한다. Firebase AI Logic 클라우드 요청에는 App Check를 설정한다. 개발에는 등록된 debug provider를, 출시에는 Play Integrity 같은 적합한 증명 공급자를 사용하고 비용 한도와 실패 경로를 검증한다."
- category: ai
  title: Android CLI + Skills — 에이전트에 실행 도구·절차·최신 문서를 결합
  level: "중급"
  summary: Android CLI는 에이전트와 스크립트가 SDK·프로젝트·에뮬레이터·기기·빌드·테스트를 다루는 명령줄 도구다. Android Skills는 최신 Android 권장 패턴과 반복 절차를 에이전트에 제공하고, `android docs`는 공식 Android Knowledge Base에서 문서를 검색·가져온다. CLI는 실행, Skill은 작업 지침, Knowledge Base는 확인할 근거를 맡는다.
  points:
  - '`android init`은 기본 `android-cli` Skill을 탐지된 에이전트 경로에 설치하고, `android skills`는 추가 Skill을 검색·설치·관리'
  - '`android docs search`로 공식 문서의 `kb://` 주소를 찾고 `fetch`로 본문을 가져옴'
  - '`--agent`·`--project`로 설치 범위를 지정; 사용자 정의 Skill은 업데이트 때 덮어쓸 수 있으므로 이름을 바꿔 관리'
  source: https://developer.android.com/tools/agents/android-cli
  interview: "Android CLI·Skills·Knowledge Base를 함께 쓸 때 각 역할과 적용 범위는 어떻게 구분하나요?"
  answer: "CLI는 프로젝트·SDK·기기 작업을 실행하고, Skill은 Android 권장 패턴과 반복 절차를 에이전트에 제공한다. `android docs search`와 `fetch`는 공식 Knowledge Base에서 문서를 찾아 읽는다. `android init`은 기본 CLI Skill을 설정하고 `android skills add`는 추가 Skill을 설치한다. `--agent`·`--project`로 범위를 지정하며, 수정한 Skill은 업데이트로 덮어쓸 수 있으므로 원본과 구분되는 이름을 쓴다."
