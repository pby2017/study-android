  - '`allowed-tools`: 호출한 턴에 승인 없이 사용; 다른 도구를 숨기거나 기본 권한을 바꾸지 않음'
  - '`EndConversation`은 다른 도구가 남아 있으면 제외할 수 없음; 여러 스킬·프롬프트에서 계속 차단하려면 permission deny 사용'
  source: https://code.claude.com/docs/en/skills
