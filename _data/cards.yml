  title: Together AI — 200+ 오픈소스 모델 서버리스 추론, OpenAI 호환 API·배치 50% 할인
  summary: Together AI는 오픈소스 LLM 추론·파인튜닝·GPU 클러스터를 한 플랫폼에 묶은 full-stack AI 인프라다. Serverless Inference는 200+ 모델(Qwen·Kimi·DeepSeek·FLUX 등)을 per-token API로 호출하며 OpenAI SDK와 base_url만 바꿔 drop-in 연동 가능하다. Adaptive speculative decoding으로 GPT-OSS·Qwen 등 고난도 모델에서 최대 2.75× 빠른 서버리스 추론을 주장하고, 비실시간 워크로드는 Batch API로 50% 할인된다. Dedicated Endpoints는 GPU를 분 단위로 예약해 steady traffic·파인�uning 모델 서빙에 쓴다. LangChain·Vercel AI SDK·LlamaIndex·Helicone 등 서드파티 통합 제공.
  points:
  - 'OpenAI 호환: base_url=https://api.together.ai/v1, model만 교체'
  - Serverless(per-token) vs Dedicated(GPU/min) — 트래픽 패턴에 선택
  - Batch 50% 할인·Helicone observability·100+ 모델 카탈로그
  source: https://docs.together.ai/docs/inference/overview
