  - category: ai
    title: "Repomix — 레포 전체를 'AI가 먹기 좋은 단일 파일'로 패킹하는 CLI(26.3k★)"
    summary: >
      Repomix(yamadashy/repomix)는 코드 레포 전체를 Claude·ChatGPT·Gemini 같은 LLM에 통째로
      물려주기 좋게 단일 파일 하나로 묶어주는 MIT 오픈소스 도구로, README 기준 GitHub 스타 26.3k다.
      설치 없이 `npx repomix@latest` 한 줄이면 현재 디렉터리를 패킹해 기본 `repomix-output.xml`을 만들고,
      `--remote yamadashy/repomix`처럼 클론 없이 원격 레포(브랜치·태그·커밋 해시 지정 가능)도 바로 패킹한다.
      `--compress` 옵션은 Tree-sitter로 핵심 코드 요소만 추출해 토큰을 줄여주고, Secretlint로 비밀키 등
