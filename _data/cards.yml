cards:
- category: kotlin
  title: 코틀린이란 — 정적 타입 + 함수형
  summary: '코틀린은 JVM에서 도는 언어로, 자바와의 상호운용성을 중시한다. 핵심은 ''정적 타입 지정''이라 컴파일 시점에 타입이 확정돼 성능·신뢰성·유지보수·도구지원이 좋아진다. 동시에 타입 추론을 제공해 코드는 짧게 유지된다. 함수를 변수처럼 다루는 일급 함수, 불변성, 부수효과 없는 순수 함수 같은 함수형 개념도 지원한다. 자바엔 없는 nullable 타입과 함수 타입이 컴파일 단계에서 NPE 위험을 잡아준다.

    '
  points:
  - 정적 타입 + 타입 추론 = 안전하면서 간결
  - nullable 타입(?)으로 NPE를 컴파일 시점에 차단
  - 일급 함수·불변성·순수 함수 = 함수형 지원
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/1장-코틀린이란_무엇이며_왜_필요한가.md
- category: kotlin
  title: 문(statement)과 식(expression)
  summary: '자바는 if/제어구조가 값을 만들지 않는 ''문''이지만, 코틀린은 루프를 뺀 대부분의 제어구조가 값을 만드는 ''식''이다. 그래서 `return if(cond) A else B`가 가능하다. 함수도 두 종류 — 중괄호로 감싼 ''블록 본문 함수''와 등호로 잇는 ''식 본문 함수''. 식 본문 함수는 타입 추론 덕에 반환형을 생략할 수 있다(블록 본문은 불가). 이 차이가 코틀린 특유의 간결함의 출발점이다.

    '
  points:
  - 코틀린의 if/when은 값을 반환하는 '식'
  - 식 본문 함수 `fun f() = 1` 은 반환형 생략 가능
  - 변수도 타입 추론으로 생략 가능
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/2장-코틀린_기초.md
- category: kotlin
  title: 컬렉션 생성 함수 — setOf/hashSetOf/arrayListOf
  summary: '코틀린은 컬렉션을 만드는 팩토리 함수를 제공한다. setOf·hashSetOf는 내부적으로 LinkedHashSet, arrayListOf는 ArrayList를 돌려준다. 코틀린은 자체 컬렉션을 새로 만들지 않고 자바 표준 컬렉션을 그대로 활용하면서, 정렬·필터 같은 유용한 확장 함수를 얹는 방식이다. `.plus()` 같은 연산은 원본을 바꾸지 않고 새 컬렉션을 반환한다(불변성 지향).

    '
  points:
  - 코틀린 컬렉션 = 자바 컬렉션 + 확장 함수
  - .plus()는 원본 불변, 새 컬렉션 반환
  - 제네릭 원소 모임 + 알고리즘 메서드 제공
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/3장-함수_정의와_호출.md
- category: kotlin
  title: 클래스·인터페이스 — 자바와 무엇이 다른가
  summary: '코틀린 인터페이스는 자바 8의 default 메서드처럼 구현이 있는 메서드를 가질 수 있지만, 상태(필드)는 가질 수 없다. 자바의 extends/implements는 모두 콜론(:)으로 대체되고, 확장 클래스 뒤엔 괄호()를 붙인다. 인터페이스 구현은 개수 제한이 없지만 클래스 확장은 1번만 가능하다. 자바의 @Override는 코틀린에서 `override` 변경자가 된다. 본문 없는 멤버는 추상, default는 키워드 없이 본문만 주면 된다.

    '
  points:
  - 인터페이스에 구현은 OK, 상태(필드)는 불가
  - extends/implements → 콜론(:) 하나로 통일
  - '@Override → override 변경자'
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/4장-클래스,_객체,_인터페이스.md
- category: kotlin
  title: 람다 — 코드 블록을 인자로 넘기기
  summary: '람다는 다른 함수에 넘길 수 있는 작은 코드 조각이다. 자바 8처럼 코드 블록을 함수 인자로 직접 전달할 수 있어, 안드로이드의 setOnClickListener 같은 ''메서드 하나뿐인 익명 객체''를 람다로 대체해 코드를 확 줄인다. 컬렉션에선 maxBy처럼 기준을 람다로 받는 라이브러리 함수가 있어 `list.maxBy { it.age }` 식으로 짧게 쓴다. 멤버 참조(Person::age)로 더 줄일 수도 있다.

    '
  points:
  - 익명 객체 → 람다로 보일러플레이트 제거
  - list.maxBy { it.age } 처럼 기준을 람다로
  - 멤버 참조(::)로 한 번 더 축약
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/5장-람다로_프로그래밍.md
- category: kotlin
  title: '널 가능성 — ?. 와 ?: 로 NPE 방어'
  summary: '코틀린 타입 시스템은 널 가능 여부를 타입에 담아 NPE를 컴파일 시점에 잡는다. 타입 뒤에 ?를 붙이면 null을 담을 수 있는 타입이 된다. 안전한 호출 `?.`는 null 검사와 호출을 한 번에 — `a?.length`는 a가 null이면 그대로 null을 반환한다(결과 타입도 nullable). 엘비스 연산자 `?:`는 null일 때 기본값을 지정한다. 이 조합이 코틀린이 자바보다 NPE에 강한 핵심 이유다.

    '
  points:
  - 타입 뒤 ? = 널 가능 타입
  - ?. = null이면 호출 건너뛰고 null 반환
  - '?: = null일 때 기본값 제공(엘비스)'
  source: https://github.com/pby2017/study-android/blob/master/legacy/kotlin_in_action/6장-코틀린_타입_시스템.md
- category: android
  title: 액티비티 생명주기
  summary: '액티비티는 보통 한 화면을 대표하며 AppCompatActivity를 상속한다. 생명주기 콜백은 쌍으로 관리한다 — onCreate↔onDestroy, onStart↔onStop. onCreate(초기화·뷰 생성), onStart(아직 비표시, 센서·통신 시작), onResume(표시·화면 갱신), onPause(포커스 상실·리소스 해제·저장), onStop(통신 정지), onDestroy(참조 정리). 다른 클래스가 액티비티 인스턴스를 참조하면 폐기 후에도 메모리에 남아 누수가 생긴다.

    '
  points:
  - 콜백은 쌍으로 — onCreate↔onDestroy, onStart↔onStop
  - onPause에서 저장·리소스 해제
  - 외부 참조가 남으면 메모리 누수
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_02(액티비티와프래그먼트).md
- category: android
  title: 화면 회전과 상태 복원 — onSaveInstanceState
  summary: '화면 가로/세로 전환 같은 디바이스 설정 변경이 일어나면 기존 액티비티는 폐기되고 새로 생성된다. 그래서 입력값 등이 사라진다. onSaveInstanceState/onRestoreInstanceState 콜백으로 데이터를 저장·복구할 수 있다. 저장 가능한 자료형은 기본형·문자열·리스트, 그리고 Parcelable을 구현한 인스턴스다. 시스템 임시 영역에 IPC로 주고받기 때문에 전달 규약이 필요하고, 그게 Parcelable 인터페이스다. 단, 뒤로가기로 명시적으로 폐기하면 호출되지 않는다.

    '
  points:
  - 설정 변경 = 액티비티 재생성 → 상태 유실
  - onSaveInstanceState로 저장, Parcelable로 전달
  - 뒤로가기 폐기 시엔 호출 안 됨
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_02(액티비티와프래그먼트).md
- category: android
  title: 레이아웃 선택 — Linear vs Constraint
  summary: 'LinearLayout은 depth가 얕고 순차적으로 뷰를 나열할 때, 단순한 화면에 적합하다. 복잡한 화면엔 RelativeLayout/ConstraintLayout을 쓴다. 사진 주변에 여러 뷰를 배치하는 상황은 예전엔 RelativeLayout이었지만 요즘은 ConstraintLayout이 표준 — 깊어지기 쉬운 계층을 1단계로 평탄화하는 게 장점이다. 속도도 다르다: LinearLayout은 사이즈를 2번 측정해 상대적으로 느리고, ConstraintLayout은 최적화로 1번만 측정해 더 빠르다.

    '
  points:
  - 단순·순차 = Linear, 복잡 = Constraint
  - Constraint는 계층을 평탄화(depth↓)
  - '측정 횟수: Linear 2회 vs Constraint 1회'
  source: https://github.com/pby2017/study-android/blob/master/legacy/QnA/android/layout.md
- category: android
  title: 머티리얼 디자인 — 일관된 시각 언어
  summary: '스큐어모픽(실물 모사)→플랫(평면)을 거쳐, 구글은 ''프로젝트 케네디''로 디자인을 통일했고 그 위에 학습 부담을 줄인 머티리얼 디자인을 내놨다. 핵심은 시각 디자인의 공통 언어와 ''이디엄''(단순 조작을 조합해 의미 있는 조작을 만드는 관용구)으로 사용자가 UI 동작을 예측하게 하는 것. 대표 컴포넌트는 리스트/그리드/카드, 그리고 FAB·Raised·Flat 버튼. 카드엔 정보를 의미 단위로 묶는 ''청킹''을 적용한다.

    '
  points:
  - '케네디 → 머티리얼: 일관성 + 학습부담↓'
  - 이디엄으로 동작을 예측 가능하게
  - 카드·리스트·FAB가 대표 컴포넌트
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_11(머티리얼디자인).md
- category: architecture
  title: 왜 설계 기법을 쓰나 — 액티비티 비대화 방지
  summary: '액티비티는 화면 로직, 사용자 액션 처리, 뷰 데이터 반영 등 너무 많은 역할을 떠안는다. 전부 액티비티에 넣으면 변경이 어렵고 관리가 힘들다. 그래서 역할을 분리해 변경에 강한 코드를 만드는 게 설계 기법의 목적이다. 대표적으로 MVP(Model-View-Presenter)와 MVVM(Model-View-ViewModel)이 있다. 둘 다 ''뷰는 표시, 비즈니스/데이터는 분리''라는 원칙을 공유한다.

    '
  points:
  - '문제: 액티비티가 모든 역할을 떠안음'
  - '해결: 역할 분리로 변경에 강하게'
  - '대표 패턴: MVP, MVVM'
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_05(설계기법과라이브러리활용).md
- category: architecture
  title: MVP 패턴 — 장점과 함정
  summary: 'MVP는 Model(DB·API 접근, UI 로직 없음), View(데이터 표시, 액션은 Presenter에 위임), Presenter(Model·View 중개, 이벤트 처리)로 나눈다. Presenter가 인터페이스로만 접근하게 하면 테스트가 쉬워진다. 장점은 역할 분리로 액티비티가 작아지고 View-Model 의존이 사라지는 것. 단점은 인터페이스 정의로 코드가 길어지고, 데이터를 뷰에 꽂는 로직을 직접 짜야 하며, 표준 프레임워크가 없어 분리 방식을 매번 고민해야 한다는 점이다.

    '
  points:
  - Model/View/Presenter로 역할 3분할
  - 인터페이스 접근 → 테스트 용이
  - '단점: 코드량↑, 표준 프레임워크 부재'
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_05(설계기법과라이브러리활용).md
- category: architecture
  title: 그레이들(Gradle)의 이해
  summary: 'Gradle은 안드로이드의 빌드 시스템으로, 어떤 라이브러리를 쓰고 어떻게 컴파일·패키징할지를 선언한다. 프로젝트 수준과 모듈(app) 수준 build.gradle로 나뉘며, dependencies 블록에 의존성을 적으면 자동으로 받아온다. minSdk/targetSdk로 지원 범위를 정하고, productFlavor로 같은 코드에서 여러 빌드 변형(무료/유료 등)을 만든다. 이 학습 레포의 ProductFlavorApp 예제가 그 실습이다.

    '
  points:
  - 프로젝트/모듈 build.gradle 2단계
  - dependencies로 라이브러리 선언·자동 수신
  - productFlavor로 빌드 변형 생성
  source: https://github.com/pby2017/study-android/blob/master/legacy/levelup/레벨업_06(그레이들의이해).md
- category: ai
  title: diagnose — 디버깅을 규율로 만드는 스킬
  summary: 'mattpocock/skills의 diagnosing-bugs는 어려운 버그를 "재현 가능한 실패 신호"에서 시작하게 만드는 디버깅 루프다. 순서는 재현·최소화 → 3~5개 가설 → 한 변수씩 계측 → 수정 → 회귀 테스트 → 정리로 이어진다. 좋은 점은 버그를 설명하는 말솜씨보다, 같은 명령으로 빨간불과 초록불을 반복해서 볼 수 있는지를 먼저 묻는다는 것이다. 그래서 AI에게 바로 코드를 고치게 하기보다, 실패를 빠르게 보여주는 테스트·스크립트·로그 지점을 먼저 만들고 그 신호 하나로 가설을 줄여 간다.

    '
  points:
  - '출발점: 재현 가능한 red/pass 신호를 먼저 만든다'
  - 가설은 3~5개로 제한하고, 계측은 한 변수씩만 바꾼다
  - 수정 뒤에는 같은 실패 신호를 회귀 테스트로 남긴다
  source: https://github.com/mattpocock/skills
- category: ai
  title: Spec Kit — 명세 주도 개발(SDD)
  summary: 'GitHub Spec Kit은 AI에게 바로 구현을 맡기기 전에, 요구사항과 기술 결정을 파일로 고정하는 Spec-Driven Development 도구다. 흐름은 constitution으로 프로젝트 원칙을 세우고, specify로 "무엇과 왜"를 적은 뒤, plan에서 기술 선택을 붙이고, tasks로 실행 가능한 작업 목록을 만든 다음 implement로 들어간다. `specify init`은 Copilot, Codex, Claude Code, Gemini CLI 등 30개 이상 에이전트 통합을 지원하고, 스킬 모드에서는 `/speckit.*` 명령 대신 `speckit-*` 스킬을 설치할 수 있다. 교훈은 "명세 문서"가 산출물 보관용이 아니라, AI가 추측으로 코드를 시작하지 못하게 하는 실행 경계라는 점이다.

    '
  points:
  - constitution→specify→plan→tasks→implement로 요구사항과 구현을 분리
  - '`specify init`은 30+ 에이전트 통합과 skills 모드 설치를 지원'
  - '핵심 가치: AI 코딩 전에 원칙·요구사항·작업 단위를 버전 관리'
  source: https://github.com/github/spec-kit
- category: ai
  title: Karpathy-inspired CLAUDE.md — 에이전트 행동을 네 규칙으로 좁히기
  summary: 'multica-ai/andrej-karpathy-skills는 Karpathy의 LLM 코딩 실패 관찰에서 출발한 짧은 CLAUDE.md 가이드다. 네 규칙은 ① Think Before Coding(가정·모호함·트레이드오프를 먼저 드러내기), ② Simplicity First(요청 밖 기능과 1회용 추상화 금지), ③ Surgical Changes(요청과 직접 연결된 줄만 바꾸기), ④ Goal-Driven Execution(성공 기준을 정하고 검증될 때까지 반복)이다. 교훈은 특정 도구보다 "에이전트가 어떤 행동을 하지 말아야 하는지"를 작고 검증 가능한 규칙으로 쓰는 것이 결과를 바꾼다는 점이다.

    '
  points:
  - '4규칙: 먼저 이해·최소 코드·수술적 변경·목표 기반 검증'
  - 모호하면 추측하지 않고 가정과 선택지를 드러내게 함
  - 규칙 파일은 작을수록 행동 경계가 선명해진다는 사례
  source: https://github.com/multica-ai/andrej-karpathy-skills
- category: ai
  title: Ouroboros — 모호함을 수치로
  summary: 'Ouroboros는 코딩 에이전트가 막연한 요청에서 바로 구현으로 뛰지 않게 만드는 명세 우선 워크플로 엔진이다. 흐름은 interview로 숨은 가정을 드러내고, seed로 확정된 스펙을 만들고, run/evaluate로 실행과 검증을 반복하는 구조다. 핵심은 인터뷰를 감으로 끝내지 않는 점이다. 목표·제약·성공 기준·기존 코드베이스 이해 같은 차원을 0.0~1.0으로 채점하고, `Ambiguity = 1 - Σ(clarity_i × weight_i)`로 남은 불확실성을 계산한다. Ambiguity가 0.2 이하가 되어야 Seed를 만들 수 있고, 유사도 0.95 이상이면 온톨로지가 수렴했다고 본다. 즉 질문을 오래 하는 도구가 아니라, 구현해도 되는 상태를 수치로 가르는 장치다.

    '
  points:
  - interview→seed→run→evaluate로 질문·명세·실행·검증을 분리
  - 'Seed 생성 임계값: Ambiguity <= 0.2, 수렴 기준: Similarity >= 0.95'
  - Brownfield는 목표·제약·성공 기준에 코드베이스 컨텍스트까지 가중 평가
  source: https://github.com/Q00/ouroboros/blob/main/README.ko.md
- category: ai
  title: 서브에이전트 — 컨텍스트를 지키는 분업
  summary: 'Claude Code의 서브에이전트는 자체 컨텍스트 창, 전용 시스템 프롬프트, 별도 도구 권한을 가진 작업 단위다. 검색·코드 탐색·보안 검토처럼 로그와 파일 내용이 많이 쌓이는 일을 분리하면, 메인 세션에는 결과 요약만 돌아와 컨텍스트를 보존한다. 정의 파일은 프로젝트 `.claude/agents/`나 사용자 `~/.claude/agents/`에 두고, 중복 이름이 있으면 더 가까운 프로젝트 정의가 우선한다. 실무 포인트는 병렬화보다 권한과 비용 라우팅이다. `tools` allowlist, `disallowedTools` denylist, MCP 서버 범위, `model` 필드로 읽기 전용 탐색대·로컬 전용 조사원·저비용 요약 에이전트를 분리해 설계한다.

    '
  points:
  - '정의 위치: 프로젝트 `.claude/agents/`가 사용자 `~/.claude/agents/`보다 우선'
  - '권한 설계: `tools`/`disallowedTools`와 MCP 서버 범위로 읽기·쓰기·외부도구를 제한'
  - '비용 설계: `model` 또는 `CLAUDE_CODE_SUBAGENT_MODEL`로 반복 탐색은 더 빠른 모델에 라우팅'
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: reloadSkills·sessionTitle·/reload-skills — SessionStart 훅·수동 명령으로 스킬·세션 제목 즉시 반영
  summary: Claude Code v2.1.152+는 스킬 탐색을 SessionStart 훅 종료 전 1회만 돌리므로, 훅이 ~/.claude/skills/에 새 SKILL.md를 써도 기본적으로 다음 세션에야 보인다. SessionStart 훅이 hookSpecificOutput.reloadSkills:true를 반환하면 훅 직후 스킬·커맨드 디렉터리를 재스캔해 같은 세션에서 즉시 사용 가능. 수동 경로는 /reload-skills — 대화 컨텍스트를 유지한 채 디렉터리만 재스캔(edit→reload→test 루프). 같은 릴리스에서 hookSpecificOutput.sessionTitle로 startup·resume 시 세션 제목을 프로그래밍 방식으로 설정 가능 — CI·팀 부트스트랩·스킬 authoring loop에 유용.
  points:
  - SessionStart reloadSkills:true — 훅이 스킬 설치 후 같은 세션에 등록
  - /reload-skills — 수동 재스캔, 컨텍스트 유지(edit SKILL.md→reload→test)
  - sessionTitle — startup/resume 시 세션 제목 programmatic set
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: --safe-mode — 커스터마이징 다 끄고 설정 문제 격리
  summary: 'Claude Code(v2.1.169+)의 `--safe-mode`는 모든 커스터마이징을 로드하지 않고 시작하는 플래그다. CLAUDE.md·스킬·플러그인·훅·MCP 서버·커스텀 커맨드/에이전트·출력 스타일·워크플로·커스텀 테마/키바인딩· 상태줄·LSP 서버·자동 메모리가 전부 비활성화된다. 반면 인증·모델 선택·내장 도구·권한은 정상 동작해서, 모든 것을 끄는 `--bare`와는 다르다. 어떤 커스터마이징이 설정을 망가뜨렸는지 이분법으로 좁힐 때 쓴다. 관리(managed) 정책 훅·상태줄·커맨드는 안전 모드에서도 여전히 적용된다.

    '
  points:
  - '끄는 것: CLAUDE.md·스킬·플러그인·훅·MCP·커스텀 커맨드/에이전트·출력스타일·테마·상태줄·자동메모리'
  - '유지: 인증·모델 선택·내장 도구·권한 (그래서 전부 끄는 --bare와 다름)'
  - 관리 정책 항목은 예외로 적용 / 실행 시 CLAUDE_CODE_SAFE_MODE 설정됨
  source: https://code.claude.com/docs/en/cli-reference
- category: ai
  title: /cd — 프롬프트 캐시 깨지 않고 작업 디렉터리 옮기기
  summary: 'Claude Code(v2.1.169+)의 `/cd <path>`는 세션을 통째로 새 작업 디렉터리로 옮긴다. 핵심은 대화의 프롬프트 캐시가 유지된다는 점이다. 시스템 프롬프트를 다시 만드는 대신, 새 디렉터리의 CLAUDE.md를 메시지로 덧붙이는 방식이라 세션 중간에 캐시가 깨지지 않는다. 세션은 새 디렉터리의 프로젝트 저장소로 이동해서 `--resume`/`--continue`도 거기서 찾는다. 처음 가는 디렉터리면 신뢰 여부를 물어본다. 세션 이동 없이 디렉터리 접근만 추가하려면 `/add-dir`를 쓴다.

    '
  points:
  - 세션을 새 작업 디렉터리로 이동 — 프롬프트 캐시 보존(CLAUDE.md를 메시지로 append)
  - 세션이 새 디렉터리 저장소로 옮겨져 --resume/--continue도 거기서 인식
  - 접근만 추가는 /add-dir / Cd 권한 규칙으로 대상 제한 가능 / v2.1.169 미만은 Unknown command
  source: https://code.claude.com/docs/en/commands
- category: ai
  title: 출력 스타일(Output Styles) — Claude의 역할·말투를 시스템 프롬프트째 바꾸기
  summary: '출력 스타일은 Claude가 ''무엇을 아는지''가 아니라 ''어떻게 응답하는지''를 바꾼다. 시스템 프롬프트를 직접 수정해 역할·톤·출력 형식을 매 턴 고정한다. 내장 스타일은 Default 외에 Proactive(즉시 실행), Explanatory(코딩 중 ''Insights'' 설명), Learning(직접 코드 일부를 짜도록 TODO(human) 마커를 남김) 세 가지가 있다. `/config`의 Output style에서 고르며 선택은 .claude/settings.local.json의 outputStyle에 저장된다. 세션 시작 시 한 번 읽으므로 변경은 /clear 후 적용된다. 커스텀 스타일은 .claude/output-styles의 마크다운 파일로 만들고, keep-coding-instructions: true면 코딩 지침을 유지한다.

    '
  points:
  - '내장: Default / Proactive(즉시 실행) / Explanatory(설명) / Learning(TODO(human) 마커로 직접 작성 유도)'
  - CLAUDE.md(프로젝트 컨텍스트)와 달리 시스템 프롬프트 자체를 수정 — 매 응답에 적용, /clear 후 반영
  - '커스텀은 .claude/output-styles 마크다운 / 기본은 코딩 지침 제외, keep-coding-instructions: true로 유지'
  source: https://code.claude.com/docs/en/output-styles
- category: ai
  title: fallbackModel — 기본 모델이 막힐 때 대체 모델로 자동 전환
  summary: 'fallbackModel은 기본 모델이 과부하(overloaded)거나 사용 불가일 때 쓸 백업 모델을 지정하는 설정이다. settings.json에 모델 이름 배열로 적으면 적힌 순서대로 시도하고, 전환되면 알림(notice)을 보여준다. 체인은 최대 3개까지만 적용되고 그 이상은 무시된다. `"default"`는 기본 모델로 확장된다. 이 키는 설정 파일 간 병합되지 않아서, 우선순위가 가장 높은 파일이 체인 전체를 결정한다. 한 세션만 바꾸려면 `--fallback-model` 플래그로 덮어쓸 수 있다.

    '
  points:
  - 기본 모델 과부하·불가 시 배열 순서대로 백업 모델 시도 + 전환 알림 표시
  - 체인 최대 3개(초과 무시) / "default"는 기본 모델로 확장 / 병합 안 됨(최상위 파일이 전체 결정)
  - 단발성 변경은 --fallback-model 플래그로 한 세션만 덮어쓰기
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: Stop 훅 additionalContext — 턴 끝에 컨텍스트 주입해 작업 이어가기
  summary: 'Stop·SubagentStop 훅은 hookSpecificOutput.additionalContext로 문자열을 돌려줄 수 있다. Claude Code는 이 문자열을 시스템 리마인더로 감싸 턴이 끝나는 지점에 끼워 넣고, 대화가 계속되어 Claude가 그 내용을 보고 작업을 이어간다. decision: "block"이 오류 피드백으로 강제 계속시키는 것과 달리, additionalContext는 오류가 아닌 정보성 피드백이다. 한 이벤트에 여러 훅이 값을 돌려주면 Claude는 전부 받고, 한 값이 10,000자를 넘으면 전체 텍스트는 세션 디렉터리 파일로 저장되고 미리보기와 파일 경로만 전달된다.

    '
  points:
  - Stop·SubagentStop은 hookSpecificOutput.additionalContext로 턴 끝에 컨텍스트 주입 가능
  - block(오류 피드백) vs additionalContext(정보성 피드백) — 둘 다 대화를 계속시키지만 성격이 다름
  - 값 10,000자 초과 시 파일로 저장 후 경로+미리보기만 전달 / 여러 훅 값은 모두 수신
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: 상태줄 rate_limits — 5시간·7일 사용량을 항상 눈에 보이게
  summary: '상태줄(statusline) 스크립트는 stdin으로 받는 JSON에 rate_limits 필드를 포함한다. rate_limits.five_hour와 rate_limits.seven_day 각각에 used_percentage(0~100)와 resets_at(Unix epoch 초)가 들어 있어, 5시간·7일 사용 한도를 몇 % 썼고 언제 리셋되는지 바닥에 상시 표시할 수 있다. 단 이 필드는 Claude.ai 구독자(Pro/Max)에게만, 그것도 세션 첫 API 응답 이후에 나타나며 각 윈도우가 독립적으로 없을 수 있어 jq에서 // empty로 부재를 처리해야 한다. 상태줄은 로컬에서 돌고 API 토큰을 쓰지 않으니 한도 추적에 부담이 없다.

    '
  points:
  - rate_limits.five_hour / seven_day → used_percentage(0~100) + resets_at(Unix epoch 초)
  - Pro/Max 구독자 한정, 세션 첫 API 응답 후에만 등장 / 각 윈도우 독립적으로 부재 가능 → jq '// empty'
  - 상태줄은 로컬 실행이라 API 토큰 미소비 / context_window.used_percentage로 컨텍스트 사용량도 함께 표시 가능
  source: https://code.claude.com/docs/en/statusline
- category: ai
  title: disableBundledSkills — 번들 스킬·내장 명령을 모델 눈앞에서 치우기
  summary: 'Claude Code에는 기본 제공되는 번들 스킬·워크플로와 /init 같은 내장 슬래시 명령이 딸려 온다. settings.json에서 disableBundledSkills를 true로 두면 번들 스킬·워크플로는 통째로 제거되고, 내장 슬래시 명령은 여전히 타이핑은 되지만 모델 목록에서는 숨겨진다. 이때 설치한 Skills 플러그인, .claude/skills/, .claude/commands/의 내 스킬·명령은 영향을 받지 않는다. 환경변수 CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1로도 같은 효과를 낼 수 있어, 내 워크플로만 깔끔히 노출하고 싶을 때 쓴다.

    '
  points:
  - true 시 번들 스킬·워크플로는 완전 제거, 내장 슬래시 명령(/init 등)은 타이핑 가능하나 숨김
  - 내 것(플러그인·.claude/skills·.claude/commands)은 영향 없음
  - 환경변수 CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1로 동일 효과
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: 스킬 호출 권한 — disable-model-invocation / user-invocable
  summary: '커스텀 명령이 스킬로 통합되면서, 스킬 프런트매터로 "누가 이 스킬을 부를 수 있는가"를 제어할 수 있다. 기본값은 사용자와 Claude 둘 다 호출 가능이지만, disable-model-invocation을 true로 두면 오직 사용자가 /이름으로만 부를 수 있고 Claude가 자동으로 실행하지 못한다. 배포·커밋·슬랙 전송처럼 부작용이 있거나 타이밍을 직접 잡아야 하는 작업에 쓰면, 코드가 준비돼 보인다고 Claude가 멋대로 배포하는 일을 막는다. 반대로 user-invocable을 false로 두면 / 메뉴에서 숨겨져 Claude만 쓸 수 있어, 명령이 아닌 배경 지식용 스킬(예: 레거시 시스템 설명)에 적합하다.

    '
  points:
  - 'disable-model-invocation: true → 사용자만 /이름으로 호출, Claude 자동 실행 차단(서브에이전트 프리로드도 막음)'
  - 'user-invocable: false → / 메뉴에서 숨김, Claude만 사용(배경 지식용)'
  - 둘 다 기본 false/true → 기본은 양쪽 모두 호출 가능 / 부작용 있는 /deploy·/commit에 disable-model-invocation 권장
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: 스킬 effort 프런트매터 — 명령마다 추론 강도 따로 주기
  summary: '스킬(=통합된 커스텀 슬래시 명령)의 프런트매터에 effort 필드를 두면, 그 스킬이 활성화된 동안만 세션의 추론 강도(effort level)를 덮어쓴다. 값은 low·medium·high·xhigh·max 중 모델이 지원하는 범위에서 고르며, 지정하지 않으면 세션 설정을 그대로 따른다. 가벼운 포맷 정리·로그 한 줄 추가 같은 스킬엔 low를, 아키텍처 설계·보안 점검처럼 깊은 사고가 필요한 스킬엔 high 이상을 박아두면 매번 /model로 바꿀 필요가 없다. 비슷하게 model 필드로 그 스킬이 도는 동안의 모델 자체를 바꿀 수도 있고, 본문에서는 ${CLAUDE_EFFORT}로 현재 강도를 읽어 지시를 분기할 수 있다.

    '
  points:
  - 'effort: low/medium/high/xhigh/max — 스킬 활성 동안만 세션 effort 덮어씀(미지정 시 세션 상속)'
  - model 필드와 짝 — 스킬 도는 동안의 모델까지 바꾸고 턴 끝나면 세션 모델 복귀
  - 본문에서 ${CLAUDE_EFFORT}로 현재 강도 읽어 지시 분기 가능(ultracode는 xhigh로 표시)
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: PreCompact 훅 — 압축 직전, 컨텍스트를 지킬 마지막 기회
  summary: 'PreCompact 훅은 컨텍스트 압축(compaction)이 일어나기 직전에 실행된다. matcher로 무엇이 압축을 일으켰는지 구분할 수 있는데, 사용자가 직접 친 /compact는 manual, 컨텍스트가 차서 자동으로 도는 압축은 auto다. PreCompact는 블로킹 가능한 이벤트라서, 훅이 exit code 2로 끝나거나 JSON으로 decision:"block"을 돌려주면 압축 자체를 막을 수 있다. 그래서 "압축으로 대화 일부가 요약되어 사라지기 전, 중요한 컨텍스트를 파일로 저장하는 마지막 기회"로 쓰는 패턴이 대표적이다. SessionStart 훅과 짝지으면 다음 세션에서 그 컨텍스트를 다시 불러와 이어갈 수 있다.

    '
  points:
  - 압축 직전 실행 / matcher로 manual(/compact 수동) vs auto(컨텍스트 참) 구분
  - 블로킹 가능 — exit 2 또는 decision:"block"으로 압축 자체를 막을 수 있음
  - 압축으로 요약돼 사라질 컨텍스트를 미리 저장하는 '마지막 기회' 패턴 (SessionStart와 짝)
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: 훅 핸들러 5종 — 셸·HTTP·MCP 도구·프롬프트·에이전트로 받기
  summary: 훅 핸들러 type 5종 — command(셸), http(URL POST), mcp_tool(연결된 MCP 서버 도구 직접 호출), prompt(빠른 모델 평가), agent(서브에이전트 평가). v2.1.x에서 mcp_tool은 이미 실행 중인 MCP 연결을 재사용 — 별도 셸 프로세스 spawn 없이 PreToolUse 검증·PostToolUse 집계가 단순해짐. prompt/agent는 $ARGUMENTS에 훅 입력 JSON, model 필드로 평가 모델 지정. /hooks 메뉴는 5종 표시하나 추가·편집은 command·mcp_tool만 — http·prompt·agent는 settings.json 직접 작성.
  points:
  - '5종: command / http / mcp_tool / prompt / agent'
  - mcp_tool — running MCP server 재사용, shell spawn 불필요
  - /hooks 메뉴는 command·mcp_tool만 편집 — 나머지는 settings.json
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: 스킬 disallowed-tools — 활성 동안 도구를 아예 풀에서 빼기
  summary: '스킬 프런트매터의 `allowed-tools`와 `disallowed-tools`는 정반대 일을 한다. `allowed-tools`는 스킬이 활성인 동안 적힌 도구를 승인 없이 쓰게 해주지만 제한은 아니다 — 모든 도구는 여전히 호출 가능하고 권한 설정이 그대로 적용된다. 반면 `disallowed-tools`는 적힌 도구를 활성 동안 모델의 가용 풀에서 통째로 제거한다. 공식 문서가 든 예는 배경 루프에서 `AskUserQuestion`을 못 부르게 막는 것 — 사람이 안 보는 자율 스킬에 유용하다. 단, 이 제한은 다음 메시지를 보내면 풀린다. 모든 스킬·프롬프트에 영구 적용하려면 권한 설정의 deny 규칙을 써야 한다.

    '
  points:
  - 'allowed-tools: 승인 없이 쓰게 허용(제한 아님) / disallowed-tools: 풀에서 제거(진짜 제한)'
  - '예: 자율 배경 루프에서 AskUserQuestion 차단 — 사람 개입 호출 자체를 막음'
  - 제한은 다음 메시지에 해제 / 영구 차단은 권한 설정 deny 규칙
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: StopFailure 훅 — API 에러로 턴이 끝날 때만 잡아내기
  summary: 'Stop 훅은 Claude가 정상적으로 턴을 마칠 때 돌지만, API 에러로 턴이 죽으면 안 돈다. 그 빈틈을 메우는 게 StopFailure 훅이다 — 턴이 API 에러로 끝날 때 발화한다. matcher로 에러 종류를 구분할 수 있어서, rate_limit·overloaded·billing_error·authentication_failed·server_error 등으로 골라 받을 수 있다. 단 이 훅은 출력과 종료 코드가 무시되는 ''사이드 이펙트 전용'' 이벤트라 턴을 막거나 흐름을 바꾸진 못한다. 로깅·알림·정리 용도다.

    '
  points:
  - Stop은 정상 종료에만 발화 / StopFailure는 API 에러로 끝날 때 발화
  - 'matcher로 에러 종류 구분: rate_limit·overloaded·billing_error·server_error 등'
  - 출력·종료 코드 무시 — 막기 불가, 로깅·알림·정리 같은 사이드 이펙트 전용
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: 서브에이전트 중첩 — 서브에이전트가 또 서브에이전트를 띄우기
  summary: 'v2.1.172부터 서브에이전트가 자기만의 서브에이전트를 스폰할 수 있다. 위임한 작업이 다시 병렬 하위작업으로 갈라질 때(예: 발견 항목마다 검증 에이전트를 붙이는 리뷰어) 쓴다. 중간 산출물은 메인 대화에 닿지 않고, 최상위 서브에이전트의 요약만 돌아온다. 포그라운드는 부모를 블로킹하며 사슬처럼 이어져 자기제한적이라 깊이 제한이 없지만, 백그라운드는 깊이 5에서 Agent 도구를 못 받아 더 못 띄운다(고정·설정 불가).

    '
  points:
  - v2.1.172부터 — 서브에이전트가 중첩 서브에이전트 스폰 가능
  - 포그라운드는 깊이 무제한(블로킹·자기제한), 백그라운드는 깊이 5에서 차단
  - '특정 서브에이전트 차단: tools에서 Agent 빼거나 disallowedTools에 추가'
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: subagentStatusLine — 서브에이전트 행마다 표시 내용 직접 그리기
  summary: 'subagentStatusLine은 프롬프트 아래 에이전트 패널에서 각 서브에이전트 행의 본문을 기본 ''name · description · token count'' 대신 내 포맷으로 바꾸는 설정이다. settings.json에 type "command"로 스크립트를 등록하면, 새로고침 틱마다 한 번 실행되며 보이는 모든 서브에이전트 행이 stdin에 단일 JSON으로 들어온다. 입력에는 공통 훅 필드 외에 columns(행 너비)와 tasks 배열(각 항목에 id·name·type·status·description·label·startTime·tokenCount·tokenSamples·cwd)이 담긴다. stdout에 행마다 {"id":..., "content":...} 한 줄씩 출력하면 그 행만 덮어쓴다.

    '
  points:
  - 서브에이전트 패널 행 본문 커스터마이즈 — 기본은 name·description·token count
  - 'stdin: columns + tasks 배열(id·status·tokenCount 등), stdout: {"id","content"} 줄 단위'
  - id 생략 시 기본 렌더 유지, content 빈 문자열이면 행 숨김 / statusLine과 동일한 trust·disableAllHooks 적용
  source: https://code.claude.com/docs/en/statusline
- category: ai
  title: 플러그인 마켓플레이스 — marketplace.json 하나로 팀에 플러그인 배포하기
  summary: '마켓플레이스는 플러그인을 남에게 나눠주는 카탈로그다. 레포 루트의 `.claude-plugin/marketplace.json`에 name·owner·plugins 세 필드를 채우면 되고, 각 plugin 항목은 최소 name과 source(어디서 가져올지)만 있으면 된다. source는 같은 레포의 상대경로(`./plugins/x`)부터 github·url·git-subdir·npm까지 지원하며, github/url 소스는 ref(브랜치·태그)와 sha(정확한 커밋)로 버전을 고정할 수 있다. 쓰는 쪽은 `/plugin marketplace add owner/repo`로 등록하고 `/plugin install <플러그인>@<마켓플레이스>`로 깔며, `/plugin marketplace update`로 갱신한다.

    '
  points:
  - 'marketplace.json 필수 필드: name(kebab-case) · owner · plugins[] / 각 plugin은 name+source'
  - 'source 종류: 상대경로(./) · github · url · git-subdir · npm — github/url은 ref·sha로 핀 고정'
  - 버전 미설정 시 git 커밋 SHA가 버전 — 핀 걸린 plugin.json version은 바꿔야 업데이트 전파
  source: https://code.claude.com/docs/en/plugin-marketplaces
- category: ai
  title: MessageDisplay 훅 — 화면에 보이는 답변 텍스트만 바꿔치기
  summary: 'MessageDisplay는 어시스턴트 메시지 텍스트가 화면에 출력되는 동안 도는 표시 전용(display-only) 훅이다. hookSpecificOutput.displayContent로 문자열을 돌려주면 화면에 보이는 텍스트가 그것으로 교체된다. 단 트랜스크립트와 Claude가 보는 내용은 원본 그대로 유지돼, 모델의 판단에는 영향을 주지 않고 사람 눈에 보이는 것만 손댄다. matcher를 지원하지 않아 매번 발생하고, 기본 타임아웃이 10초로 낮게 잡혀 있으며, 블로킹은 불가(exit 2면 원본이 그대로 표시).

    '
  points:
  - displayContent로 화면 출력 텍스트만 교체 — 트랜스크립트·모델 시야는 원본 유지
  - matcher 미지원, 항상 발생 / 기본 타임아웃 10초로 낮음
  - 블로킹 불가 — exit code 2여도 원본 텍스트가 그대로 표시됨
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: --exclude-dynamic-system-prompt-sections — 프롬프트 캐시 재사용률 높이기
  summary: '이 플래그는 머신마다 달라지는 시스템 프롬프트 조각(작업 디렉터리, 환경 정보, 메모리 경로, git 레포 여부)을 시스템 프롬프트에서 빼서 첫 번째 사용자 메시지로 옮긴다. 시스템 프롬프트가 사용자·머신에 상관없이 동일해지므로, 같은 작업을 여러 사람·여러 머신이 돌릴 때 프롬프트 캐시가 더 잘 재사용된다. 기본 시스템 프롬프트에서만 동작하고 `--system-prompt`/`--system-prompt-file`를 쓰면 무시되며, `-p`(print) 스크립트의 다중 사용자 워크로드에 쓰라고 안내된다.

    '
  points:
  - 머신별 조각(cwd·환경·메모리경로·git여부)을 시스템 프롬프트 → 첫 사용자 메시지로 이동
  - 시스템 프롬프트가 동일해져 사용자·머신 간 프롬프트 캐시 히트율 상승
  - 기본 프롬프트에서만 작동(--system-prompt류 쓰면 무시) / -p 다중사용자 스크립트용
  source: https://code.claude.com/docs/en/cli-reference
- category: ai
  title: Setup 훅 — 세션 시작 전 init·maintenance 준비 작업 자동 실행
  summary: 'Setup은 세션이 시작되기 ''전''에 도는 훅 이벤트로, CLI 플래그로 트리거된다. `claude -p --init`은 matcher가 `init`인 Setup 훅을, `claude -p --maintenance`는 matcher가 `maintenance`인 Setup 훅을 세션 시작 전에 실행한다(둘 다 print 모드 전용). `claude --init-only`는 Setup과 SessionStart 훅만 돌리고 대화는 시작하지 않은 채 종료하므로, 의존성 설치·캐시 워밍 같은 준비 작업을 CI에서 한 번만 돌리기 좋다.

    '
  points:
  - Setup은 세션 시작 전 실행되는 훅 이벤트 / 입력 JSON에 hook_event_name:"Setup", trigger 포함
  - --init → matcher 'init', --maintenance → matcher 'maintenance' (둘 다 -p print 모드 전용)
  - --init-only는 Setup+SessionStart만 돌리고 대화 없이 종료 — CI 준비 단계용
  source: https://code.claude.com/docs/en/hooks
- category: ai
  title: skillOverrides — SKILL.md 안 건드리고 settings에서 스킬 노출 조정하기
  summary: 'skillOverrides는 settings.json에서 스킬 이름별로 노출 방식을 덮어쓰는 설정이다. 각 스킬에 "on", "name-only", "user-invocable-only", "off" 네 값 중 하나를 줄 수 있어서, SKILL.md의 프런트매터를 고치지 않고도 특정 스킬을 완전히 끄거나(off), 이름만 보이게 하거나(name-only), 사용자가 직접 호출할 때만 쓰게(user-invocable-only) 제한할 수 있다. 팀이 받은 플러그인 스킬이 너무 많아 모델이 엉뚱한 걸 자동으로 부를 때, 원본을 수정하지 않고 프로젝트 설정만으로 정리하기 좋다.

    '
  points:
  - 스킬 이름별 노출 오버라이드 — 값은 on / name-only / user-invocable-only / off 네 가지
  - SKILL.md 프런트매터 수정 없이 settings.json만으로 스킬 가시성 조정
  - off=완전 숨김, name-only=이름만, user-invocable-only=수동 호출만 / 단 매니지드 스킬은 예외
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: claudeMdExcludes — 특정 CLAUDE.md를 메모리 로딩에서 빼기
  summary: 'claudeMdExcludes는 settings.json에서 메모리 로딩 시 건너뛸 CLAUDE.md 파일을 글롭 패턴이나 절대경로로 지정하는 설정이다. 패턴은 파일의 절대경로에 매칭되며, 예컨대 ["**/vendor/**/CLAUDE.md"]처럼 적으면 의존성 디렉터리에 딸려 온 CLAUDE.md가 컨텍스트에 안 실린다. 유저·프로젝트·로컬 메모리에만 적용되고, 매니지드 정책 파일은 제외할 수 없다. 서브모듈이나 vendor 트리에 박힌 남의 CLAUDE.md가 컨텍스트 창을 잡아먹을 때, 원본을 지우지 않고 프로젝트 설정만으로 솎아내기 좋다.

    '
  points:
  - 메모리 로딩에서 건너뛸 CLAUDE.md를 글롭/절대경로로 지정 — 패턴은 절대경로에 매칭
  - 유저·프로젝트·로컬 메모리에만 적용 / 매니지드 정책 파일은 제외 불가
  - '예: ["**/vendor/**/CLAUDE.md"] — vendor 트리의 CLAUDE.md를 컨텍스트에서 빼기'
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: Playwright CLI + MCP — Microsoft의 코딩·LLM 에이전트용 브라우저 제어 2종(접근성 트리·토큰 효율)
  summary: Playwright가 테스트 프레임워크를 넘어 에이전트 전용 브라우저 인터페이스 2종을 공식 출시했다. Playwright MCP는 LLM 에이전트용 — 접근성 트리 스냅샷으로 픽셀·비전 모델 없이 클릭·입력·탭·네트워크·콘솔 확인(Apache-2.0·34k★). Playwright CLI는 Claude Code·Copilot 같은 코딩 에이전트용 — MCP 대비 토큰 효율적(대형 도구 스키마·접근성 트리를 컨텍스트에 안 넣음). MCP와 CLI 두 레이어로 에이전트 유형별 브라우저 자동화를 분리한 설계가 핵심.
  points:
  - Playwright MCP = 접근성 트리 스냅샷, 비전 불필요, 클릭·입력·탭·네트워크·콘솔
  - Playwright CLI = 코딩 에이전트용, MCP 대비 토큰 효율적 브라우저 제어
  - 테스트 프레임워크 → 에이전트 인프라로 역할 확장
  source: https://playwright.dev/docs/test-agents
- category: ai
  title: allowManagedHooksOnly — 조직이 승인한 훅만 돌게 잠그기
  summary: 'allowManagedHooksOnly는 settings.json에서 켜면 매니지드 훅, SDK 훅, 그리고 매니지드 설정의 enabledPlugins로 강제 활성화된 플러그인 훅만 로드하는 설정이다. 유저·프로젝트·로컬에 정의된 일반 훅은 전부 차단된다. 훅은 사용자 권한으로 임의 셸 명령을 실행할 수 있어 보안 위험이 큰데, 이 설정으로 개인이 끼워 넣은 훅을 막고 조직이 검수한 훅만 허용하는 화이트리스트를 만든다. 훅을 통째로 끄는 disableAllHooks와 달리, 승인된 훅은 살려 두면서 비승인 훅만 거른다.

    '
  points:
  - 매니지드 훅·SDK 훅·매니지드 enabledPlugins 훅만 로드 / 유저·프로젝트·로컬 훅은 차단
  - 훅은 사용자 권한 셸 실행 — 비승인 훅 차단으로 공급망/내부자 위험 축소
  - disableAllHooks(전부 끄기)와 달리 승인된 훅은 유지하는 화이트리스트 방식
  source: https://code.claude.com/docs/en/settings
- category: ai
  title: MCP 리소스·프롬프트 — 서버를 @멘션과 슬래시 커맨드로 쓰기
  summary: 'MCP 서버는 도구만이 아니라 ''리소스''와 ''프롬프트''도 노출하는데, 둘 다 일상 입력에서 바로 끌어 쓸 수 있다. 리소스는 파일처럼 @멘션으로 참조한다 — 프롬프트에 `@`를 치면 연결된 모든 서버의 리소스가 자동완성에 뜨고, `@server:protocol://resource/path` 형식(예: `@github:issue://123`)으로 적으면 해당 내용이 자동으로 가져와져 첨부된다. 한 프롬프트에서 여러 개를 동시에 참조할 수도 있다. 프롬프트는 슬래시 커맨드가 된다 — `/`를 치면 `/mcp__서버명__프롬프트명` 형태로 나타나고, 인자는 그 뒤에 공백으로 구분해 넘긴다. 둘 다 연결된 서버에서 동적으로 발견되므로 별도 설정이 필요 없다.

    '
  points:
  - '리소스 = @멘션: `@server:protocol://resource/path` (예: @github:issue://123), 참조 시 자동 fetch·첨부'
  - '프롬프트 = 슬래시 커맨드: `/mcp__servername__promptname`, 인자는 뒤에 공백 구분으로 전달'
  - 둘 다 연결된 서버에서 동적 발견 — 설정 불필요, 한 프롬프트에 리소스 여러 개 참조 가능
  source: https://code.claude.com/docs/en/mcp
- category: ai
  title: /btw — 대화 흐름 안 깨고 곁다리 질문 던지기
  summary: '긴 작업 중간에 빠른 질문 하나가 필요한데 본 대화를 어지럽히고 싶지 않을 때 `/btw`를 쓴다. `/btw 그 설정 파일 이름이 뭐였지?`처럼 치면, 현재 대화 전체를 보면서 답하지만 그 질문·답변은 대화 기록에 남지 않고 닫을 수 있는 오버레이로만 뜬다. Claude가 한창 응답 중일 때도 실행 가능하며 메인 턴을 끊지 않고 따로 돈다. 단 곁다리 질문은 도구 접근이 없어 — 파일 읽기·명령 실행·검색을 못 하고 이미 컨텍스트에 있는 것만으로 답한다. 답이 뜨면 `f`로 새 세션으로 포크해 풀 도구 권한으로 이어갈 수 있다. 서브에이전트의 정반대다 — 서브에이전트는 빈 컨텍스트 + 풀 도구, `/btw`는 풀 컨텍스트 + 도구 없음.

    '
  points:
  - 본 대화 기록에 안 남는 일회성 곁다리 질문 — 오버레이로만 표시
  - Claude 작업 중에도 실행 가능, 메인 턴 안 끊고 독립 실행 / 도구 접근은 없음(컨텍스트만으로 답)
  - '`f`로 새 세션 포크해 풀 도구로 이어가기 — 프롬프트 캐시 재사용해 비용 낮음'
  source: https://code.claude.com/docs/en/interactive-mode
- category: ai
  title: claude -p --bare — CI에서 매번 같은 결과 나오게 잠그기
  summary: '`claude -p`(헤드리스)는 기본적으로 대화형 세션과 똑같은 컨텍스트를 읽는다 — 작업 디렉터리나 `~/.claude`의 훅·스킬·플러그인·MCP 서버·자동 메모리·CLAUDE.md를 전부 자동 발견한다. 문제는 CI에서다. 동료의 `~/.claude` 훅이나 프로젝트 `.mcp.json`이 끼면 머신마다 결과가 달라진다. `--bare`를 붙이면 이 자동 발견을 통째로 건너뛰어, 명시적으로 넘긴 플래그만 적용된다. bare 모드에서도 Bash·파일 읽기·편집 도구는 쓸 수 있고, 컨텍스트는 `--append-system-prompt`, `--mcp-config`, `--settings`, `--agents` 같은 플래그로 직접 주입한다. 출력은 `--output-format json`으로 받으면 `result`·`session_id`와 `total_cost_usd`(모델별 비용 분해 포함)가 들어와 스크립트가 결과·지출을 파싱할 수 있다.

    '
  points:
  - '--bare: 훅·스킬·플러그인·MCP·자동 메모리·CLAUDE.md 자동 발견을 모두 건너뜀 — 머신 무관 재현성'
  - bare는 Bash·읽기·편집만 기본 제공, 나머지는 --mcp-config/--settings/--agents/--append-system-prompt로 명시 주입
  - --output-format json → result·session_id·total_cost_usd(모델별 분해)로 결과·비용 추적 / 파이프 stdin은 10MB 상한(v2.1.128)
  source: https://code.claude.com/docs/en/headless
- category: ai
  title: /usage — 플랜 한도가 스킬·서브에이전트·플러그인·MCP 중 어디로 새는지 % 분해
  summary: '`/cost`가 이번 세션의 달러·소요 시간(API 시간·실제 경과 시간) 요약을 보여준다면, `/usage`는 다른 일을 한다. Pro·Max·Team·Enterprise 플랜에서 `/usage`는 최근 사용량이 내 플랜 한도에 얼마나 잡아먹었는지를 보여주는데, 핵심은 그 사용량을 스킬·서브에이전트·플러그인·개별 MCP 서버별로 전체 대비 퍼센트로 쪼개 준다는 점이다. 즉 "한도가 빨리 차는 범인"이 어떤 스킬이나 어떤 MCP 서버인지 눈으로 짚어낼 수 있다. 화면에서 `d`/`w` 키로 최근 24시간과 7일을 전환할 수 있고, 다른 기기나 claude.ai에서 쓴 사용량은 포함되지 않는다. 이 기능은 Claude Code v2.1.174 이상에서 동작한다.

    '
  points:
  - /usage = 플랜 한도 기준 사용량을 스킬·서브에이전트·플러그인·MCP 서버별 % 로 분해 (≠ /cost의 달러·시간 요약)
  - d/w 키로 최근 24시간 ↔ 7일 전환 / 다른 기기·claude.ai 사용량은 미포함
  - Pro·Max·Team·Enterprise 플랜, Claude Code v2.1.174 이상 필요
  source: https://code.claude.com/docs/en/costs
- category: ai
  title: 오토 메모리 — Claude가 스스로 적는 MEMORY.md로 세션 넘어 학습하기
  summary: 'Claude Code 메모리는 두 갈래다. CLAUDE.md는 내가 직접 쓰는 규칙이고, 오토 메모리(auto memory)는 Claude가 내 교정·선호를 보고 스스로 적어 두는 메모다. 빌드 명령, 디버깅에서 알아낸 점, 코드 스타일 선호 같은 걸 "다음 대화에서 쓸모 있겠다" 싶을 때만 저장한다(매 세션 저장하는 게 아님). 저장 위치는 `~/.claude/projects/<project>/memory/`이고, 인덱스 격인 `MEMORY.md`와 주제별 파일들로 나뉜다. 세션 시작 때는 `MEMORY.md`의 앞 200줄(또는 25KB)만 불러오고 나머지 주제 파일은 필요할 때 그때그때 읽는다. 전부 평범한 마크다운이라 `/memory`로 열어 직접 보고 고치거나 지울 수 있다.

    '
  points:
  - CLAUDE.md(내가 씀) vs 오토 메모리(Claude가 씀) — 후자는 기본 on, 끄려면 autoMemoryEnabled:false 또는 CLAUDE_CODE_DISABLE_AUTO_MEMORY=1
  - '저장: ~/.claude/projects/<project>/memory/ (git 레포 기준이라 워크트리·하위폴더가 한 디렉터리 공유, 머신 로컬)'
  - 세션엔 MEMORY.md 앞 200줄/25KB만 로드 — 주제 파일은 온디맨드 / Claude Code v2.1.59 이상 필요
  source: https://code.claude.com/docs/en/memory
- category: ai
  title: 내장 ide MCP 서버 — 외부 터미널 CLI를 /ide로 VS Code에 붙이기
  summary: 'VS Code 확장이 켜져 있으면 로컬 MCP 서버 하나(이름 `ide`)가 돌고, CLI가 여기에 자동으로 붙는다. 이 연결 덕에 CLI가 만든 diff가 VS Code 네이티브 diff 뷰어로 열리고, 지금 에디터에서 선택한 텍스트와 열린 파일 경로가 매 프롬프트에 컨텍스트로 따라붙는다(트랜스크립트에 `⧉ Selected N lines from <file>` 표시). 통합 터미널에서 `claude`를 돌리면 IDE 연동이 자동이지만, 외부 터미널을 쓸 땐 Claude 안에서 `/ide`를 실행해 VS Code에 연결한다. `ide` 서버는 설정할 게 없어 `/mcp` 목록에선 숨겨지고, `127.0.0.1` 랜덤 포트에 바인딩되며 활성화 때마다 새 토큰을 발급한다. 모델에 노출되는 도구는 둘뿐 — 진단을 읽는 `mcp__ide__getDiagnostics`와 주피터 셀을 실행하는 `mcp__ide__executeCode`(실행 전 항상 확인 받음).

    '
  points:
  - 확장 활성 시 로컬 MCP 서버 `ide` 가동 — CLI 자동 연결 / diff는 VS Code 네이티브 뷰어로 열림
  - 외부 터미널이면 Claude 안에서 `/ide` 실행해 연결 / 선택 텍스트·열린 파일이 프롬프트 컨텍스트로 첨부 (.env 등은 Read deny 규칙으로 제외)
  - '모델 노출 도구는 2개뿐: getDiagnostics(읽기), executeCode(주피터, 실행 전 Quick Pick 확인) / 127.0.0.1 랜덤 포트+세션별 토큰'
  source: https://code.claude.com/docs/en/ide-integrations
- category: ai
  title: 동적 컨텍스트 주입 — 슬래시 커맨드에 셸 출력·인자를 미리 끼워 넣기
  summary: '커스텀 슬래시 커맨드(스킬)의 본문에 `!`명령`` 형태를 쓰면, Claude가 그 내용을 보기 전에 Claude Code가 먼저 그 셸 명령을 실행하고 출력으로 자리표시자를 갈아끼운다. 즉 모델은 명령어가 아니라 이미 실행된 ''실제 데이터''를 받는다 — 예를 들어 `- PR diff: !`gh pr diff``라고 적으면 진짜 diff가 프롬프트에 인라인된 채로 도착한다. 인자도 같은 식으로 미리 박힌다: `$ARGUMENTS`는 넘긴 인자 전체로, `$1`·`$2`는 셸식 따옴표 규칙대로 쪼갠 위치 인자로 치환된다(`\$1`로 리터럴 `$` 이스케이프 가능). 치환은 원본 파일에 딱 한 번만 돌아서, 명령 출력 안의 자리표시자는 다시 펼쳐지지 않는다. 또 인라인 `!`는 줄 맨 앞이나 공백 바로 뒤에 있을 때만 인식되고, 여러 줄 명령은 ` ```! ` 펜스 블록으로 감싼다.

    '
  points:
  - '`!`명령``: Claude가 보기 전 셸 실행 → 출력으로 치환 / 모델은 명령이 아닌 실제 데이터를 받음 (예: !`gh pr diff`)'
  - '인자 치환: $ARGUMENTS=인자 전체, $1·$2=따옴표 규칙대로 쪼갠 위치 인자 / \$1로 리터럴 $ 이스케이프'
  - 치환은 원본에 1회만 — 출력 속 자리표시자는 재확장 안 됨 / 인라인 !는 줄 앞·공백 뒤만 인식, 여러 줄은 ```! 블록
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: 이미지로 대화하기 — 스크린샷·목업·다이어그램을 컨텍스트로 넣기
  summary: 'Claude Code는 터미널 CLI지만 이미지를 컨텍스트로 받는다. 넣는 방법은 셋 — 창에 드래그 앤 드롭, `ctrl+v`로 붙여넣기(맥에서도 `cmd+v`가 아니라 `ctrl+v`다), 또는 경로를 직접 주기("이 이미지 분석해줘: /path/to/image.png"). 에러 스크린샷을 던지며 "이거 왜 나는 거야?"라고 묻거나, 디자인 목업을 주고 "이걸 만드는 CSS 짜줘", DB 스키마 다이어그램을 주고 "새 기능에 맞게 어떻게 고칠까?"처럼 텍스트로 설명하기 번거로운 맥락을 그림 하나로 전달할 수 있다. 한 대화에서 이미지 여러 개를 다룰 수 있고, Claude가 답에서 `[Image #1]`처럼 가리키면 그 링크를 맥에서 `Cmd+Click`(윈도·리눅스는 `Ctrl+Click`)해 기본 뷰어로 연다.

    '
  points:
  - '넣는 법 3가지: 드래그 앤 드롭 / ctrl+v 붙여넣기(맥도 cmd+v 아님) / 경로 직접 전달'
  - '용도: 에러 스크린샷·UI 목업·다이어그램·스키마 — 텍스트로 설명하기 번거로운 맥락을 그림으로 / 목업→CSS·HTML 생성도 가능'
  - '한 대화에 이미지 여러 개 / 답의 `[Image #1]` 링크는 Cmd+Click(맥)·Ctrl+Click(윈·리눅스)으로 뷰어에서 열기'
  source: https://code.claude.com/docs/en/common-workflows
- category: ai
  title: /branch — 대화를 통째로 복제해 다른 접근을 따로 시도하기
  summary: '세션 중 다른 방법을 실험하고 싶지만 지금까지의 대화 흐름은 잃고 싶지 않을 때 `/branch`를 쓴다. `/branch try-streaming-approach`처럼 치면 그 시점까지의 대화를 복제한 새 가지로 옮겨 가고, 원본 세션은 그대로 남아 세션 피커에 보존된다. CLI에서는 `claude --continue --fork-session`처럼 `--fork-session`을 붙여 같은 효과를 낸다. `/branch` 확정 시 새 가지와 원본 두 개의 세션 ID가 찍히며, 원본으로 돌아가려면 그 ID나 이름을 `/resume`에 넘긴다. 단 "이 세션 동안 허용"으로 승인한 권한은 새 가지로 넘어가지 않는다. 한편 포크 없이 두 터미널에서 같은 세션을 동시에 이어가면 양쪽 메시지가 한 트랜스크립트에 뒤섞이니 주의. 코드까지 되감는 건 별개의 체크포인트/rewind 기능이다 — `/branch`는 대화 트리를 가르는 쪽이다.

    '
  points:
  - '`/branch [이름]`: 그 시점까지 대화를 복제한 새 가지로 이동, 원본은 피커에 그대로 / CLI는 --fork-session'
  - 포크·rewind·--fork-session으로 만든 가지는 세션 피커에서 root 세션 아래 묶여 표시(→로 펼침)
  - '''이 세션 허용'' 권한은 새 가지로 미승계 / 포크 없이 두 터미널에서 같은 세션 이어가면 트랜스크립트 뒤섞임'
  source: https://code.claude.com/docs/en/sessions
- category: ai
  title: 셸 모드 — 프롬프트 앞에 `!`로 명령 실행하고 출력까지 컨텍스트에 넣기
  summary: '입력 프롬프트 맨 앞에 `!`를 치면 셸 모드로 들어간다. 여기서 친 명령은 Claude가 해석하거나 승인 절차를 거치지 않고 바로 실행되며, 실행한 명령과 그 출력이 둘 다 대화 컨텍스트에 추가된다. 즉 `!npm test` 한 줄이면 결과가 모델 눈앞에 그대로 쌓여, 이어서 "이 실패 고쳐줘"처럼 바로 물어볼 수 있다. 실행 중에는 실시간 진행 출력이 보이고, 오래 걸리는 명령은 `Ctrl+B`로 백그라운드로 돌릴 수 있다. 입력 중 `Tab`을 누르면 과거 명령 기반 자동완성이 뜨고, 셸 모드는 `Escape`·`Backspace`·`Ctrl+U`로 빠져나온다.

    '
  points:
  - 프롬프트 맨 앞 `!` → 셸 모드 / 명령은 Claude 해석·승인 없이 즉시 실행, 명령과 출력이 모두 컨텍스트에 추가
  - 실시간 진행 출력 표시 / 긴 명령은 Ctrl+B로 백그라운드 전환, Tab은 과거 명령 기반 자동완성
  - Escape·Backspace·Ctrl+U로 셸 모드 종료 / 슬래시 커맨드 파일의 `!`명령``(미리 실행해 치환)과는 별개
  source: https://code.claude.com/docs/en/interactive-mode
- category: ai
  title: MCP 설치 스코프 — local·project·user 셋 중 어디에 서버를 둘지
  summary: 'MCP 서버는 세 스코프 중 하나로 설치하고, 스코프가 ''어느 프로젝트에서 뜨는지''와 ''팀과 공유되는지''를 결정한다. 기본값인 local은 추가한 그 프로젝트에서만 뜨고 내게만 보이며 `~/.claude.json`에 저장돼 버전 관리에 안 올라간다 — 개인용·실험용·자격증명 든 서버에 쓴다. project는 프로젝트 루트의 `.mcp.json`에 저장돼 버전 관리로 팀 전체가 같은 도구를 공유하고, user는 `~/.claude.json`에 저장돼 내 모든 프로젝트에서 뜬다. `claude mcp add --transport http <이름> --scope project <url>` 식으로 스코프를 지정한다. 보안상 `.mcp.json`의 project 스코프 서버는 쓰기 전에 승인을 받고, 승인 선택을 초기화하려면 `claude mcp reset-project-choices`를 쓴다.

    '
  points:
  - local(기본·`~/.claude.json`·그 프로젝트만·비공유) / project(`.mcp.json`·버전관리로 팀 공유) / user(`~/.claude.json`·내 모든 프로젝트)
  - '지정: `claude mcp add --transport http <이름> --scope project <url>` / local 스코프는 일반 로컬 설정(.claude/settings.local.json)과 다른 ~/.claude.json에 저장'
  - project 서버는 보안상 쓰기 전 승인 필요 / `claude mcp reset-project-choices`로 승인 선택 초기화
  source: https://code.claude.com/docs/en/mcp
- category: ai
  title: Claude를 정기 실행하는 4가지 — 어디서 도느냐로 고른다
  summary: 'Claude Code로 PR 리뷰·의존성 점검·CI 실패 확인 같은 일을 주기적으로 돌리는 방법은 네 가지이고, 고르는 기준은 ''어디서 도느냐''다. Routines는 Anthropic 관리 인프라에서 돌아 내 컴퓨터가 꺼져 있어도 실행되고, 일정뿐 아니라 API 호출·GitHub 이벤트로도 트리거된다(claude.ai/code/routines에서 설정). Desktop scheduled tasks는 데스크톱 앱이 내 머신에서 돌려서 로컬 파일·커밋 안 된 변경에 직접 접근해야 할 때 쓴다. GitHub Actions는 CI 파이프라인에서 돌아 열린 PR 같은 레포 이벤트나 워크플로 설정 옆에 둘 cron에 맞는다. `/loop`는 지금 열려 있는 CLI 세션 안에서 가볍게 폴링하는 용도로, 새 대화를 시작하면 멈추지만 만료 전이면 `--resume`/`--continue`로 되살아난다.

    '
  points:
  - Routines = Anthropic 인프라(컴퓨터 꺼져도 실행) / 일정·API 호출·GitHub 이벤트 트리거 — claude.ai/code/routines
  - Desktop scheduled tasks = 데스크톱 앱·내 머신(로컬 파일·미커밋 변경 접근) / GitHub Actions = CI 파이프라인(레포 이벤트·cron)
  - '`/loop` = 현재 CLI 세션 폴링 / 새 대화 시작 시 중단, 만료 전이면 --resume·--continue로 복원 / 자동 실행 프롬프트엔 성공 기준·결과 처리를 명시'
  source: https://code.claude.com/docs/en/common-workflows
- category: ai
  title: 커스텀 커맨드 인자 — $ARGUMENTS 한 덩어리 vs 위치 인자로 쪼개 받기
  summary: '커스텀 슬래시 커맨드(이제 스킬과 통합)는 호출할 때 넘긴 인자를 본문에 끼워 넣을 수 있다. `$ARGUMENTS`는 입력 전체를 타이핑한 그대로 한 덩어리로 받는다 — 본문에 `$ARGUMENTS`가 없으면 끝에 `ARGUMENTS: <값>`이 자동으로 붙는다. 여러 인자를 따로 받고 싶으면 `$ARGUMENTS[N]` 또는 짧게 `$N`을 쓰는데, 인덱스는 0부터다 — `$0`이 첫 번째, `$1`이 두 번째다(셸의 $1과 헷갈리기 쉬움). 인덱스 인자는 셸식 따옴표 규칙을 따라서 여러 단어를 한 인자로 넘기려면 `"hello world"`처럼 감싸야 하고, 산문 속 `\$1.00` 같은 리터럴 $는 백슬래시로 이스케이프한다.

    '
  points:
  - '`$ARGUMENTS` = 입력 전체 한 덩어리(타이핑 그대로) / 본문에 없으면 끝에 `ARGUMENTS: <값>` 자동 추가'
  - '`$ARGUMENTS[N]`·`$N` = 위치별 인자, 인덱스 0부터 — `$0`=첫째, `$1`=둘째(셸 $1과 다름) / 프런트매터 `arguments`로 이름 붙은 위치 인자도 선언 가능'
  - 여러 단어 한 인자는 `"..."`로 감싸기 / 산문의 리터럴 `$`는 `\$1.00`처럼 백슬래시로 이스케이프
  source: https://code.claude.com/docs/en/slash-commands
- category: ai
  title: 커스텀 서브에이전트 만들기 — 자주 쓰는 일꾼을 파일로 굳히기
  summary: '같은 지시를 가진 일꾼을 매번 새로 띄우게 된다면, 그걸 커스텀 서브에이전트로 파일에 굳힌다. 서브에이전트는 YAML 프런트매터 + 본문(시스템 프롬프트)으로 된 마크다운 파일이고, `name`과 `description` 둘만 필수다. `tools`(허용 도구 allowlist)·`disallowedTools`(차단 denylist)·`model`로 권한과 모델을 좁히는데, model에 `inherit`을 주면 메인 대화와 같은 모델을 쓴다. Claude는 작업이 들어오면 각 서브에이전트의 `description`을 보고 위임할지 판단하므로, description은 페르소나가 아니라 ''언제 이걸 쓰는지''를 또렷이 적어야 한다. 저장 위치는 프로젝트용 `.claude/agents/`(버전 관리로 팀 공유)와 개인용 `~/.claude/agents/`(내 모든 프로젝트)가 있고, `/agents` 명령으로 가이드 따라 만들고 관리한다.

    '
  points:
  - 마크다운 + YAML 프런트매터, 필수는 `name`·`description`뿐 / 본문이 시스템 프롬프트 / `/agents`로 생성·편집·삭제
  - '도구 좁히기: `tools`(allowlist) 또는 `disallowedTools`(denylist) / `model: inherit`로 메인 대화 모델 따라가기'
  - '위치·우선순위: managed(1·조직) > --agents 플래그(2·세션) > `.claude/agents/`(3·프로젝트, 팀 공유) > `~/.claude/agents/`(4·내 전체) > 플러그인(5)'
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: '@로 파일·디렉터리 참조 — Claude가 읽기를 기다리지 않고 내용을 미리 넣기'
  summary: '프롬프트에 `@`를 쓰면 Claude가 Read 도구로 파일을 찾아 읽기를 기다리지 않고, 그 자리에 내용을 바로 끼워 넣을 수 있다. `@src/utils/auth.js`처럼 파일을 가리키면 그 파일 전체 내용이 대화에 포함되고, `@src/components`처럼 디렉터리를 가리키면 내용이 아니라 그 안의 파일 목록(파일 정보 포함)이 들어온다. 중요한 부가 효과 하나 — `@`로 파일을 참조하면 그 파일이 있는 디렉터리와 상위 디렉터리들의 `CLAUDE.md`도 함께 컨텍스트에 딸려 붙는다(그 하위트리 규칙을 자동으로 끌어옴). 경로는 상대·절대 둘 다 되고, 한 메시지에서 여러 개를 동시에 참조할 수 있다(예: "@file1.js and @file2.js"). 같은 `@` 문법으로 연결된 MCP 서버의 리소스(`@server:resource`)도 끌어올 수 있다.

    '
  points:
  - '`@파일경로` = 파일 전체 내용을 그 자리에 인라인(Read 기다릴 필요 없음) / `@디렉터리` = 내용 아닌 파일 목록(파일 정보 포함)'
  - '부가 효과: `@`로 파일 참조 시 그 파일 디렉터리+상위 디렉터리의 CLAUDE.md도 함께 컨텍스트에 추가'
  - 상대·절대 경로 모두 가능 / 한 메시지에 여러 개(`@file1.js and @file2.js`) / `@server:resource`로 MCP 리소스도 동일 문법으로 참조
  source: https://code.claude.com/docs/en/common-workflows
- category: ai
  title: 원격 MCP 서버 인증 — /mcp로 OAuth 2.0 로그인하기
  summary: 'Sentry·Notion 같은 클라우드 MCP 서버는 대개 인증을 요구하는데, Claude Code는 OAuth 2.0을 지원한다. `claude mcp add --transport http <이름> <url>`로 서버를 붙인 뒤 Claude 안에서 `/mcp`를 실행하면 브라우저가 열려 로그인 흐름이 진행된다. 서버가 `401 Unauthorized`나 `403 Forbidden`을 돌려주면 Claude Code가 그 서버를 ''인증 필요''로 표시하고 `/mcp`에서 OAuth 흐름을 밟게 해준다. 발급된 토큰은 안전하게 저장되고 자동으로 갱신되며, 접근을 끊으려면 `/mcp` 메뉴의 "Clear authentication"을 쓴다. 브라우저 리다이렉트가 연결 오류로 실패하면 주소창의 콜백 URL 전체를 Claude의 URL 프롬프트에 붙여 넣으면 된다.

    '
  points:
  - '흐름: `claude mcp add --transport http <이름> <url>` → Claude 안에서 `/mcp` 실행 → 브라우저 로그인 / 401·403 응답 시 자동으로 ''인증 필요'' 표시'
  - 토큰은 안전 저장·자동 갱신 / 접근 해제는 `/mcp` 메뉴의 "Clear authentication" / OAuth는 HTTP 서버에서 동작
  - 사전 등록 리다이렉트 URI가 필요하면 `--callback-port`로 포트 고정(`http://localhost:PORT/callback`) / DCR 미지원 서버는 `--client-id`·`--client-secret`로 자격증명 직접 제공
  source: https://code.claude.com/docs/en/mcp
- category: ai
  title: claude --from-pr — PR에 묶인 그 작업 세션으로 곧장 되돌아가기
  summary: '`gh pr create`로 PR을 만들면 그때 돌던 세션이 그 PR에 자동으로 연결된다. 나중에 그 PR 작업을 이어가려면 `claude --from-pr <번호>`로 곧장 연결된 세션을 되살리거나, PR URL을 `/resume` 피커 검색창에 붙여 넣어 찾는다. 피커는 GitHub·GitHub Enterprise·GitLab·Bitbucket의 pull/merge request URL을 받아 그에 연결된 세션을 짚어 준다. 디렉터리 단위로 흩어진 여러 세션 중 "어느 게 이 PR 작업이었지?"를 헤매지 않고, PR 하나를 키로 삼아 대화·컨텍스트를 그대로 복원하는 워크플로다.

    '
  points:
  - '`gh pr create`로 PR 생성 시 그 세션이 PR에 자동 연결 — 별도 설정 불필요'
  - '복원: `claude --from-pr <번호>` 또는 `/resume` 피커 검색창에 PR URL 붙여넣기'
  - 피커는 GitHub·GitHub Enterprise·GitLab·Bitbucket의 PR/MR URL을 받아 연결 세션을 찾아줌
  source: https://code.claude.com/docs/en/common-workflows
- category: ai
  title: --json-schema — claude -p 출력을 스키마에 맞춰 받아 스크립트로 바로 파싱
  summary: '`claude -p`를 스크립트에서 쓸 때 자유 텍스트 답을 정규식으로 긁는 대신, 출력 형태를 JSON 스키마로 못박을 수 있다. `--output-format json`에 `--json-schema ''<JSON Schema>''`를 같이 주면, Claude의 구조화된 결과가 응답의 `structured_output` 필드에 그 스키마 형태로 담겨 온다(`result`엔 텍스트, 그 외 session ID·usage 같은 메타데이터도 함께). 예컨대 `{"type":"object","properties":{"functions":{"type":"array","items":{"type":"string"}}},"required":["functions"]}` 스키마를 주고 "auth.py의 함수 이름 뽑아줘"라고 하면, 함수명 배열이 구조화돼 돌아온다. 받은 다음엔 `jq ''.structured_output''`로 그 필드만 꺼내 후속 처리에 넘기면 된다. CI·배치 파이프라인에서 LLM 출력을 안정적으로 소비하기 좋은 방식이다.

    '
  points:
  - '`--output-format json` + `--json-schema ''<스키마>''` → 결과가 응답의 `structured_output` 필드에 스키마 형태로 담김'
  - 응답엔 텍스트(`result`)·session ID·usage 등 메타데이터도 함께 / `jq '.structured_output'`로 해당 필드만 추출
  - 자유 텍스트 파싱(정규식) 대신 형태를 못박아 CI·배치에서 LLM 출력을 안정적으로 소비
  source: https://code.claude.com/docs/en/headless
- category: ai
  title: 멀티에이전트 오케스트레이션 — 리드 에이전트가 서브에이전트에게 일을 쪼개 맡기는 패턴
  summary: 'Anthropic 엔지니어링 블로그가 자사 리서치 기능을 만들며 정리한 ''오케스트레이터-워커'' 패턴이다. 리드 에이전트(LeadResearcher)가 계획을 세워 메모리에 저장하고, 전문 서브에이전트들을 병렬로 띄워 각자 조사하게 한 뒤 결과를 종합하고, 마지막에 CitationAgent가 출처를 붙여 답을 돌려준다. 내부 평가에서 이 멀티에이전트 구성(리드=Opus 4, 서브=Sonnet 4)이 단일 Opus 4 대비 90.2% 더 나은 성능을 냈고, BrowseComp 분석에선 ''토큰 사용량 하나만으로 성능 분산의 80%가 설명''됐다 — 다만 채팅 대비 토큰을 약 15배 더 먹는다. 그래서 만능이 아니라, 병렬화가 잘 되고 단일 컨텍스트를 넘는 정보를 다루며 과제 가치가 높을 때만 값을 한다 — 공유 컨텍스트나 에이전트 간 의존이 많은 일(대부분의 코딩 포함)엔 오히려 안 맞는다고 명시한다.

    '
  points:
  - '구조: 리드가 계획→서브에이전트 병렬 스폰→종합→CitationAgent 출처 부여 / 성능 +90.2%(단일 Opus 4 대비, 내부 평가)'
  - '비용·변수: 채팅 대비 토큰 약 15배 / ''토큰량만으로 성능 분산의 80% 설명'', 토큰+도구호출+모델로 95% 설명'
  - '위임의 핵심: 각 서브에이전트에 목표·출력형식·도구안내·작업경계를 줘야 중복 안 함 / 난이도별 에이전트 수 규칙(단순=1, 비교=2~4, 복잡=10+)'
  - '안 맞는 경우: 공유 컨텍스트·에이전트 간 의존이 많은 일 — 코딩 대부분은 병렬화 가능한 부분이 적어 부적합'
  source: https://www.anthropic.com/engineering/built-multi-agent-research-system
- category: ai
  title: 작성과 리뷰를 분리하라 — 짠 세션 말고 새 세션이 검토해야 하는 이유
  summary: 'Anthropic의 Claude Code 베스트 프랙티스는 ''코드를 짠 맥락''과 ''그 코드를 리뷰하는 맥락''을 일부러 나누라고 권한다. 이유는 편향이다 — 방금 자기가 작성한 코드를 같은 세션이 다시 보면 "맞게 짰다"는 가정에 끌려 결함을 놓치기 쉽다. 그래서 리뷰는 깨끗한 컨텍스트의 별도 서브에이전트에게 맡긴다. 리뷰어는 추론 과정이 아니라 ''결과 diff와 합격 기준''만 보고 판정하므로, 작성자가 못 본 문제를 독립적으로 잡아낸다. 실전에서는 구현 후 "이 변경을 서브에이전트로 리뷰해줘"처럼 별도 패스를 돌리거나, 번들된 `/code-review` 스킬로 현재 diff를 새 서브에이전트가 검토하게 한다 — 무인 실행이 길어질수록 이 독립 검증이 중요해진다.

    '
  points:
  - '원리: 같은 세션은 자기가 쓴 코드에 편향 → 리뷰는 깨끗한 컨텍스트의 별도 서브에이전트로 분리(작성≠검증)'
  - 리뷰어는 추론 말고 '결과 diff + 합격 기준'만 본다 — 그래서 작성자가 놓친 결함을 독립적으로 잡음
  - '실전: `/code-review` 스킬(새 서브에이전트가 현재 diff 검토) 또는 ''PLAN.md 대비 리뷰'' 프롬프트 직접 작성 / 무인 실행일수록 필수'
  source: https://code.claude.com/docs/en/best-practices
- category: ai
  title: Cursor Composer + Claude Code 듀얼 스택 — 도구를 고르지 말고 일로 나눠라
  summary: '2026년 실무에서 굳어진 패턴은 ''Cursor냐 Claude Code냐''가 아니라 둘을 작업 유형으로 라우팅하는 것이다. 두 도구가 스택의 다른 층에 있기 때문이다 — Cursor는 IDE 중심(에디터 안에서 자체 모델 Composer로 빠른 초안·스캐폴딩·리팩터), Claude Code는 터미널/CLI 중심(멀티레포 오케스트레이션, 서브에이전트, CI 자동화, git에 남는 워크플로 산출물). Cursor는 GPT·Claude·Composer를 작업마다 갈아끼우는 ''모델 유연성''을, Claude Code는 단일 최상위 모델에 에이전트 루프를 최적화한 ''깊이''를 준다. 이미 CLAUDE.md·스킬·훅으로 레포에 워크플로를 박아뒀다면 전면 이전 비용이 가장 크다 — 그래서 한쪽으로 갈아타기보다 둘을 함께 쓰는 쪽이 자주 이긴다.

    '
  points:
  - '라우팅: 에디터 안 빠른 초안·스캐폴딩·리팩터 → Cursor / 멀티레포·서브에이전트·CI·git 산출물 → Claude Code'
  - '성격 차이: Cursor는 모델 갈아끼우는 유연성(GPT·Claude·Composer), Claude Code는 단일 모델 깊이(긴 호흡 에이전트 작업)'
  - Composer 2.5 = 2026-05-18 출시, Kimi K2.5 베이스 / CLAUDE.md·스킬·훅 투자분이 있으면 전면 이전 비용이 커 듀얼 스택이 유리
  source: https://cursor.com/blog/composer-2-5
- category: ai
  title: Agent SDK 별도 크레딧 — 2026-06-15부터 claude -p·자동화는 구독 한도와 분리
  summary: '2026년 6월 15일부터 Anthropic은 ''대화형''과 ''프로그래밍 방식'' 사용을 분리한다. Claude Agent SDK, `claude -p`(Claude Code 비대화 모드), Claude Code GitHub Actions, 그리고 구독으로 인증하는 서드파티 앱은 이제 구독 사용 한도가 아니라 ''월별 Agent SDK 크레딧''에서 차감된다 — Pro $20, Max 5x $100, Max 20x $200(전액 API 요금 기준). 반대로 터미널·IDE에서 직접 타이핑하는 ''대화형 Claude Code''는 종전대로 구독 한도를 그대로 쓰며 영향이 없고, API 키로 인증하면 크레딧 없이 기존 종량제가 유지된다. 크레딧이 소진되면 ''사용 크레딧(usage credits)''을 켜둔 경우에만 API 요금으로 계속 돌고, 안 켰으면 다음 주기까지 요청이 멈춘다.

    '
  points:
  - '차감 대상: Agent SDK·`claude -p`·Claude Code GitHub Actions·구독 인증 서드파티 앱 / 월 크레딧 Pro $20·Max 5x $100·Max 20x $200(롤오버 없음, 매월 초기화)'
  - '영향 없음: 대화형 Claude Code(터미널·IDE)는 구독 한도 그대로 / API 키 인증은 종량제 유지(크레딧 미지급)'
  - '소진 후: ''사용 크레딧''을 켰으면 API 요금으로 계속, 안 켰으면 주기 갱신까지 중단 / 크레딧은 1회 신청(opt-in) 후 자동 갱신'
  - '주의: 좌석제 Enterprise의 Standard 좌석은 이 크레딧 신청 불가'
  source: https://support.claude.com/en/articles/15036540-use-the-claude-agent-sdk-with-your-claude-plan
- category: ai
  title: Firecrawl MCP — 에이전트에 '웹 읽기'를 붙이는 가장 인기 있는 MCP 서버
  summary: 'Firecrawl은 자바스크립트 렌더링·페이지네이션·레이트리밋을 대신 처리하고 웹페이지를 깨끗한 마크다운으로 변환해 주는 웹 스크래핑·검색 API다. 공식 MCP 서버(firecrawl-mcp-server, GitHub 6.6k★)를 붙이면 Claude·Cursor·Windsurf 등 MCP 호환 도구에서 에이전트가 직접 웹을 검색하고 긁어올 수 있다. 설치는 별도 빌드 없이 `npx -y firecrawl-mcp` 한 줄에 `FIRECRAWL_API_KEY`만 환경변수로 넣으면 끝 — Claude Desktop은 `claude_desktop_config.json`에 npx 명령으로 등록한다. 단, MCP 서버를 여럿 붙일수록 도구 정의가 컨텍스트를 잡아먹어(데이터DB·파일시스템과 같이 쓰면 7.5만 토큰대) 에이전트 성능이 떨어진다는 점은 감안해야 한다.

    '
  points:
  - '노출 도구: firecrawl_scrape·search·map·crawl·extract와 자율 수집용 firecrawl_agent, 변경 감시용 firecrawl_monitor_* 등'
  - '설치: `env FIRECRAWL_API_KEY=fc-... npx -y firecrawl-mcp` 또는 `npm i -g firecrawl-mcp` — Cursor·Claude Desktop은 npx 명령으로 config 등록'
  - '주의(주장): MCP 도구 정의 자체가 컨텍스트 오버헤드 — 도구가 많을수록 에이전트가 헷갈린다, 필요한 서버만 켜라'
  source: https://github.com/firecrawl/firecrawl-mcp-server
- category: ai
  title: llms.txt — 사이트 문서를 에이전트가 토큰 낭비 없이 읽게 하는 표준
  summary: 'llms.txt는 fast.ai·Answer.AI의 Jeremy Howard가 2024년 9월 3일 제안한 표준으로, 사이트 루트(`/llms.txt`)에 두는 마크다운 파일이다. 사람용 HTML은 내비게이션·CSS·광고가 대부분이라 LLM 컨텍스트 창을 낭비하는데, llms.txt는 핵심 문서로 가는 ''큐레이션된 안내문''만 깔끔히 담아 코딩 에이전트(Cursor·Copilot·Claude 등)가 실시간으로 올바른 페이지를 적은 토큰으로 찾게 한다. 형식이 엄격하다: H1 프로젝트명 1개, 인용블록(`>`)으로 한 줄 요약, 그다음 H2 섹션마다 `[제목](URL): 설명` 형태의 링크 목록. `## Optional` 섹션은 컨텍스트가 빠듯할 때 건너뛰어도 되는 링크를 모으는 자리다.

    '
  points:
  - '위치·이름 고정: 도메인 루트의 `/llms.txt`, 소문자, 유효한 마크다운(파일명 없는 URL은 `index.html.md`로 마크다운 버전 제공)'
  - '구조: H1(프로젝트명) → 인용블록 요약 → H2 섹션별 링크 목록 / `## Optional`은 건너뛰어도 되는 링크'
  - 전문(全文)을 한 파일에 담는 `llms-full.txt` 동반 포맷도 있음 — Mintlify·Vercel·Supabase 등 문서 플랫폼이 기본 생성(Anthropic·Cursor 문서도 보유)
  source: https://llmstxt.org/
- category: ai
  title: 'Agent Teams — 서브에이전트와 뭐가 다른가: 서로 대화하고 일을 나눠 갖는 팀'
  summary: 'Claude Code의 Agent Teams는 여러 Claude 세션을 ''팀''으로 묶어 한 세션이 팀 리드가 되어 작업을 배분·종합하는 실험적 기능이다(환경변수 `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`로 활성화). 서브에이전트와의 핵심 차이는 ''협업''이다. 서브에이전트는 각자 독립 컨텍스트에서 일하고 결과만 리드에게 보고하지만, 팀원들은 서로 직접 메시지를 주고받고 공유 작업 목록(shared task list)을 보며 스스로 조율한다. 그래서 단순히 결과만 필요한 작업엔 서브에이전트가, 토론·상호 반박·조율이 필요한 복잡한 일엔 팀이 적합하다 — 대신 팀원마다 별도 Claude 인스턴스라 토큰 비용이 더 든다. 팀원은 CLAUDE.md·MCP·스킬 같은 프로젝트 컨텍스트는 자동 로드하지만 리드의 대화 기록은 상속하지 않으므로, 스폰 프롬프트에 작업 세부사항을 직접 담아야 한다.

    '
  points:
  - '활성화: `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1` (실험적). 팀원 실행 방식은 `teammateMode`(in-process 등)로 설정, split-pane은 tmux/iTerm2 필요'
  - '고급 운영: 리드가 팀원 계획을 승인/반려하는 plan-approval(''테스트 커버리지 포함한 계획만 승인'' 같은 기준 지정 가능), 파일 충돌은 팀원마다 다른 파일을 맡겨 회피'
  - '활용 패턴: PR 리뷰를 보안·성능·테스트 렌즈로 나눠 동시 검토, 또는 여러 팀원이 서로 가설을 반박하는 ''과학적 토론''식 근본원인 디버깅(앵커링 회피)'
  source: https://code.claude.com/docs/en/agent-teams
- category: ai
  title: Anthropic 내부 팀 활용법 — 코드 안 짜는 팀까지 Claude Code를 쓰는 실전 패턴
  summary: 'Anthropic이 자사 10개 팀(데이터 인프라·보안·제품 엔지니어링·디자인·추론·그로스 마케팅·법무 등)의 Claude Code 실사용 사례를 공개했다. 핵심은 ''코드 생성기''가 아니라 ''사고 파트너''로 쓴다는 것 — 그리고 비개발 직군도 워크플로를 자동화한다. 보안팀은 인시던트 때 스택트레이스+문서를 던져 제어 흐름을 추적해 10~15분 걸리던 이슈를 3배 빠르게 해결하고, 추론팀 비ML 인력은 모델 함수 설명을 받아 리서치 시간을 80% 줄였다. 그로스 마케팅팀은 서브에이전트 2개로 광고 CSV 수백 건을 분류·재생성하는 에이전틱 워크플로를 짰고, 법무팀은 개발 리소스 없이 담당 변호사 라우팅 ''폰 트리''를 프로토타이핑했다.

    '
  points:
  - '범용 패턴: CLAUDE.md로 온보딩 컨텍스트 모으기 / 인시던트에 스택트레이스+문서 투입 / GitHub Actions로 PR 코멘트 코드리뷰 자동화 / write→test→iterate 자율 루프'
  - '검증된 수치(자사 주장): 보안 인시던트 3배 빠른 해결, 추론 리서치 시간 ~80% 단축(1시간→10~20분), 쿠버네티스 장애 진단 20분 절약'
  - 비개발 직군도 사용 — 디자인팀은 Figma 파일을 자율 루프에 넣어 코드·테스트 반복, 마케팅은 광고 변형 최대 100개 자동 생성
  source: https://claude.com/blog/how-anthropic-teams-use-claude-code
- category: ai
  title: Continue(continuedev) — AI Checks 피벗·read-only 보관·CLI 유산(~33.7k★)
  summary: 한때 VS Code·JetBrains·CLI로 성장한 오픈소스 코딩 에이전트 Continue(Apache-2.0·~33.7k★)는 2026년 두 갈래 변화를 겪었다. 첫째, 제품 핵심이 IDE 채팅·자동완성에서 '모든 PR에 AI 검사를 돌리는' AI Checks로 피벗 — `.continue/checks/` 마크다운 하나가 검사 규칙이 되고 GitHub 상태 체크·CI에서 실행된다. 둘째, 메인 레포(continuedev/continue)는 2.0.0 최종 릴리스 후 read-only 보관 — 더 이상 능동 유지보수 없음. CLI(cn)는 모듈형 터미널 에이전트(TUI·헤드리스 `-p`)로 100+ LLM·Ollama 지원했으나 같은 운명. JetBrains는 @continuedev/cli 사용 권장. Roo Code·Zoo Code와 함께 'OSS 에이전트 도입 시 archived 여부'를 PoC 단계에서 확인해야 하는 대표 사례.
  points:
  - AI Checks = `.continue/checks/` 마크다운 → PR마다 자연어 규칙 검사, GitHub 상태 체크·CI 연동
  - 메인 레포 read-only(2.0.0 최종) — 스타·라이선스만 보지 말고 유지보수 상태·포크 경로 확인
  - CLI(cn) = 모듈형 TUI·헤드리스, 100+ LLM·Ollama — 같은 보관 상태, @continuedev/cli 권장
  source: https://docs.continue.dev/
- category: ai
  title: MCP 도구를 코드로 호출하기 — 토큰 150k→2k로 줄인 'Code execution with MCP'
  summary: 'Anthropic이 2025년 11월 공개한 패턴. 에이전트가 MCP 도구를 하나씩 직접 호출하는 대신, MCP 서버를 ''파일시스템 위의 코드 API''로 노출하고 에이전트가 그 API를 호출하는 코드를 직접 작성하게 한다. 도구가 수백~수천 개로 늘면 ① 모든 도구 정의를 미리 로딩하느라 컨텍스트가 터지고 ② 중간 결과가 매번 모델을 거치며 토큰을 잡아먹는데, 이 패턴이 둘 다 해결한다. 도구마다 파일 하나(예: `servers/google-drive/getDocument.ts`)로 두고 에이전트가 필요한 파일만 탐색해 읽는 ''점진적 공개(progressive disclosure)'' 방식이다. 회의록 처리 예시에서 토큰을 150,000 → 2,000으로 줄여 98.7% 절감을 주장한다(Anthropic 측 주장). 단, 에이전트가 생성한 코드를 돌리려면 샌드박스 실행 환경이 필요하다.

    '
  points:
  - MCP 서버를 코드 API로 노출 → 에이전트가 도구를 '호출'이 아니라 '코드로 조합'(루프·조건·에러처리 그대로)
  - 필요한 도구 파일만 읽는 점진적 공개로 컨텍스트 절약 / 중간 결과를 코드 안에서 필터·집계 후 요약만 반환(1만 행 → 5행)
  - 회의록 예시 150k→2k 토큰(98.7% 절감) 주장 / PII를 모델에 안 흘리고 토큰화 가능 / Cloudflare도 'Code Mode'로 동일 결론. 단 샌드박스 실행 환경 필요
  source: https://www.anthropic.com/engineering/code-execution-with-mcp
- category: ai
  title: Claude Code GitHub Action — PR에 @claude 부르면 알아서 고치고 리뷰까지
  summary: 'anthropics/claude-code-action는 Claude Code를 깃허브 액션 안에서 자율 에이전트로 돌리는 공식 액션이다. 이슈나 PR 코멘트에서 `@claude`로 부르면(또는 이슈를 Claude에 배정하면) 코드를 읽고, 변경을 만들고, PR을 올리거나 코멘트로 답한다. 별도 prompt 입력을 주면 멘션 없이도 PR마다 자동 코드리뷰·CI 수정·이슈 분류 같은 워크플로를 돌릴 수 있다. 설치는 Claude Code에서 `/install-github-app`를 실행하면 깃허브 앱과 시크릿까지 안내해 깔아 준다. 에이전트는 사내(자체) 러너에서 실행되고, Anthropic API·Bedrock·Vertex 등 여러 인증 방식을 지원하며 라이선스는 MIT다.

    '
  points:
  - '트리거: PR·이슈에서 @claude 멘션 / 이슈를 Claude에 배정 / prompt 입력으로 자동 실행 — 코드 수정·PR 생성·리뷰 코멘트'
  - '설치: Claude Code에서 /install-github-app 한 줄 — 깃허브 앱과 시크릿 설정까지 안내(레퍼런스 anthropics/claude-code-action@v1)'
  - 자체 GitHub 러너에서 실행, MIT 라이선스(약 8k★). '월 50 PR 기준 API 비용 $5 미만'은 공식 문서의 주장
  source: https://github.com/anthropics/claude-code-action
- category: ai
  title: 멀티에이전트 3-티어 — 인세션·로컬 워크트리·클라우드를 일에 맞게 갈아끼우기
  summary: 'Addy Osmani가 정리한 2026년 멀티에이전트 코딩 도구 지형은 셋업·격리·동시성을 기준으로 3티어로 나뉜다. 티어1은 추가 셋업 없이 한 세션 안에서 도는 Claude Code 서브에이전트·Agent Teams — 상호작용 작업의 출발점. 티어2는 내 머신에서 에이전트마다 별도 git 워크트리를 띄워 충돌 없이 3~10개를 병렬로 굴리는 로컬 오케스트레이션(Conductor·Claude Squad·Vibe Kanban 등). 티어3은 클라우드 VM에서 비동기로 돌려 PR로 받아 보는 도구(Claude Code Web·Copilot Coding Agent·Jules·Codex Web) — 백로그를 밤새 비울 때. 핵심은 ''하나만 고르기''가 아니라 일의 성격에 따라 세 티어를 갈아끼우는 것이며, 동시성은 3~5개가 스위트스폿이고 10개를 넘기면 비용만 늘기 쉽다.

    '
  points:
  - 티어1(제로 셋업)=서브에이전트·Agent Teams / 티어2(로컬 워크트리, 3~10개)=Conductor·Claude Squad·Vibe Kanban / 티어3(클라우드 비동기)=Claude Code Web·Copilot·Jules·Codex Web
  - 격리는 에이전트마다 별도 git 워크트리로 — 머지 충돌 없이 깔끔하게 통합(Conductor 류는 자동 처리)
  - 동시성 스위트스폿 3~5개, 10개 초과는 이득 적고 비용↑ / 품질 게이트(테스트 훅·플랜 승인)와 AGENTS.md로 세션마다 학습 누적
  source: https://addyosmani.com/blog/code-agent-orchestra/
- category: ai
  title: 12-Factor Agents — 믿을 만한 에이전트는 '대부분 그냥 소프트웨어'다
  summary: 'HumanLayer의 Dex(Dexter Horthy)가 정리한, 프로덕션급 LLM 에이전트를 만드는 12가지 원칙(GitHub 23.3k★). 핵심 주장은 "여기 프롬프트, 여기 도구 한 보따리, 목표 칠 때까지 루프"라는 순진한 에이전트 루프는 70~80% 품질에서 막히고, 고객 대면 제품엔 그 80%로는 부족하다는 것 — 잘 도는 에이전트는 사실 ''대부분 결정론적 소프트웨어''에 LLM 단계를 전략적으로 끼워 넣은 형태라고 본다. 그래서 프레임워크에 맡기지 말고 프롬프트·컨텍스트 창·제어 흐름을 직접 소유하고, 실행 상태를 비즈니스 상태와 합쳐 launch/pause/resume 가능한 단순 API로 만들라고 말한다.

    '
  points:
  - '원칙 일부: 프롬프트를 소유하라 / 컨텍스트 창을 소유하라 / 제어 흐름을 소유하라 / 도구는 그냥 ''구조화된 출력''일 뿐'
  - 작고 집중된 에이전트로 쪼개고, 에러는 컨텍스트 창에 압축해 넣고, 사람 호출도 도구 콜로 처리하라
  - 에이전트를 '무상태 리듀서(stateless reducer)'로 만들어 어디서든 트리거·재개 가능하게
  source: https://github.com/humanlayer/12-factor-agents
- category: ai
  title: awesome-claude-code-subagents — 154개 전문 서브에이전트를 플러그인으로 한 번에 까는 컬렉션
  summary: 'VoltAgent가 큐레이션하는 Claude Code 서브에이전트 모음으로, 154개 이상의 특화 에이전트를 10개 카테고리(Core Development, Language Specialists, Infrastructure, Quality 등)로 분류해 둔다. api-designer·backend-developer·typescript-pro·swift-expert처럼 역할별로 시스템 프롬프트가 미리 짜여 있어, 직접 에이전트를 정의하지 않고도 도메인 전문가를 골라 쓸 수 있다. Claude Code 플러그인 마켓플레이스로 카테고리 단위 설치가 되고, 수동으로 .claude/agents/에 파일을 복사해도 된다. GitHub 21.8k★(주장, 2026-06 기준).

    '
  points:
  - '설치: claude plugin marketplace add VoltAgent/awesome-claude-code-subagents 후 voltagent-lang 같은 카테고리 플러그인 install — 또는 에이전트 .md를 ~/.claude/agents/(전역)·.claude/agents/(프로젝트)에 복사'
  - '10개 카테고리·154+ 에이전트: 언어별(typescript-pro/swift-expert), 인프라, 품질, 메타-오케스트레이션 등 — 09-meta의 agent-installer로 ''PHP 에이전트 찾아 설치해줘''식 자연어 설치도 지원'
  - 서브에이전트 = 별도 컨텍스트 창에서 도는 전문 일꾼. 직접 system prompt를 작성하는 대신 검증된 역할 정의를 가져다 쓰는 게 핵심 이점
  source: https://github.com/VoltAgent/awesome-claude-code-subagents
- category: ai
  title: 대형 코드베이스에서 Claude Code — CLAUDE.md를 루트가 아니라 하위 디렉터리에 두라
  summary: 'Anthropic이 모노레포·레거시·마이크로서비스 같은 대형 코드베이스 운영 패턴을 공식 정리했다. Claude Code는 인덱스(RAG/임베딩) 없이 파일을 직접 traverse하고 grep하는 ''에이전틱 검색''으로 도므로, ''어디를 봐야 할지'' 알려 주는 시작 컨텍스트의 품질이 성능을 좌우한다. 가장 실용적인 조언은 CLAUDE.md를 레포 루트에 몰아넣지 말고 하위 디렉터리에 두라는 것 — Claude가 현재 위치에서 디렉터리 트리를 거슬러 올라가며 만나는 모든 CLAUDE.md를 누적해 읽기 때문에 루트 컨텍스트는 사라지지 않는다. 또 모델이 바뀌면 옛 지침이 새 모델을 오히려 방해할 수 있어 주기적으로 설정을 재검토하라고 권한다.

    '
  points:
  - 'CLAUDE.md는 얇게·계층적으로: 루트엔 ''포인터와 치명적 함정''만, 세부 규칙은 하위 디렉터리 CLAUDE.md에. 초기화도 루트가 아니라 하위 디렉터리에서 — 트리를 거슬러 올라가며 누적 로딩되므로 루트 컨텍스트는 유지됨'
  - '탐색을 좁혀라: 테스트·린트 명령은 디렉터리별로 스코프(타임아웃·컨텍스트 낭비 방지), 빌드 산출물·서드파티 코드는 검색에서 제외, 구조가 자명하지 않으면 폴더별 한 줄 설명을 적은 ''코드베이스 맵'' 마크다운을 추가해 에이전틱 검색의 출발점을 만든다'
  - '유지보수: 한 모델용으로 쓴 워크어라운드 지침이 다음 모델을 오히려 제약할 수 있으니 곧 obsolete로 보고 주기적으로 리뷰. 검색·읽기는 read-only 서브에이전트에, 편집은 메인 에이전트에 분리 (출처: Anthropic 블로그, 2026-05-14)'
  source: https://claude.com/blog/how-claude-code-works-in-large-codebases-best-practices-and-where-to-start
- category: ai
  title: SWE-EVO — '단일 이슈'를 넘어 코드베이스를 여러 번 진화시키는 장기 과제 벤치마크
  summary: 'SWE-bench Verified가 최상위 모델들로 포화(Opus 4.8 88%대)되자, 연구자들은 실무에 더 가까운 ''장기(long-horizon) 소프트웨어 진화''를 재는 SWE-EVO를 내놨다. 성숙한 오픈소스 파이썬 프로젝트 7개의 릴리스 노트에서 뽑은 48개 과제로, 과제 하나가 평균 21개 파일에 걸친 다단계 변경을 요구하고 인스턴스당 평균 874개 테스트로 검증된다. 결과는 냉정하다 — OpenHands+GPT-5.4 조합이 25%밖에 못 풀었고, 같은 계열 GPT-5.2가 SWE-bench Verified에서 72.8%를 받던 것과 극명히 대비된다. "이슈 하나→패치 하나"가 아니라 "여러 파일을 조율해 코드베이스를 진화시키기"가 진짜 병목임을 보여 준다.

    '
  points:
  - '구조 차이: SWE-bench는 깃 이슈 1개를 해결해 패치 1개를 내는 격리된 과제. SWE-EVO는 릴리스 노트 기반으로 다파일·다단계 진화를 요구 — 평균 21개 파일 수정, 인스턴스당 ~874개 테스트로 검증'
  - '점수 급락: 같은 기반 모델이라도 SWE-bench Verified 72.8%(GPT-5.2) → SWE-EVO 22.92%로 추락. 최고 성적도 GPT-5.4+OpenHands의 25% 수준 — 장기·복잡 과제에서 현 에이전트의 한계가 그대로 드러남'
  - '시사점: Verified 고득점을 ''실무 준비 완료''로 읽으면 안 된다. 벤치마크 포화는 곧 ''다음 난도''를 만들고, 실제 병목은 단발 버그픽스가 아니라 여러 반복에 걸친 코드베이스 진화 (출처: arXiv 2512.18470, 48 tasks/7 projects)'
  source: https://arxiv.org/abs/2512.18470
- category: ai
  title: 'SuperClaude — /sc: 명령·에이전트·모드를 주입해 Claude Code를 ''개발 플랫폼''으로 바꾸는 프레임워크'
  summary: 'SuperClaude는 Claude Code의 코드를 고치지 않고 행동 지침(behavioral instruction)을 주입해 구조화된 개발 워크플로를 얹는 오픈소스 프레임워크다(현재 기준 GitHub 약 2.3만 ★, MIT, Anthropic 비공식). 핵심은 `/sc:` 접두사로 붙는 슬래시 명령 모음 — 구현·분석·문서화 같은 작업을 명령 하나로 트리거하고, 그에 맞는 전문 에이전트와 ''행동 모드''가 함께 활성화된다. 구성은 30여 개 명령, 20여 개 전문 에이전트, 7개 행동 모드(브레인스토밍·태스크 관리 등), 그리고 Context7·Sequential 등 6~8종 MCP 서버 연동. 설치는 파이썬 쪽 pipx/PyPI(`SuperClaude install`) 또는 npm으로 한다. 같은 ''스킬 묶음'' 계열인 Superpowers와 달리, 명령·에이전트·모드를 하나의 네임스페이스(/sc:)로 패키징한 점이 차별점이다.

    '
  points:
  - '동작 방식: Claude Code 본체 수정 없이 행동 지침을 주입 — `/sc:` 접두 명령으로 작업을 트리거하면 해당 전문 에이전트+행동 모드가 함께 켜짐'
  - '구성(저장소 명시): 명령 ~30개, 전문 에이전트 ~20개, 행동 모드 7개, MCP 서버 6~8종(Context7·Sequential 등) / MIT·Anthropic 비공식'
  - '설치: pipx 또는 PyPI(`SuperClaude install`), npm 경로도 제공 / Superpowers와 차이는 명령·에이전트·모드를 /sc: 네임스페이스로 일괄 패키징한 점 (별 수는 현재 기준·변동)'
  source: https://github.com/SuperClaude-Org/SuperClaude_Framework
- category: ai
  title: SWE-Perf — '버그 수정' 말고 '성능 최적화'를 재는 첫 저장소급 벤치마크
  summary: 'SWE-bench류 벤치마크는 대부분 ''GitHub 이슈를 고쳐 테스트를 통과시키는가''(정확성)를 잰다. SWE-Perf는 결이 다르다 — 실제 코드를 더 빠르게 만드는 능력, 즉 성능 최적화를 잰다. 인기 Python 저장소 9개에서 실제로 실행 속도를 개선한 PR들을 모아 만들었고, 10만 건이 넘는 PR(102,241건)을 필터링해 140개의 검증된 과제로 추렸다. 과제는 ''버그를 안 만들면서 테스트 실행 시간을 줄이는 패치''를 저장소 전체 맥락에서 생성하는 것이다. 결과적으로 현재 최고 AI 모델과 사람 전문가 사이에 성능 개선 격차가 남아 있어, 정확성 벤치마크가 포화돼도 ''빠르게 만들기''는 아직 사람이 앞선다는 신호다.

    '
  points:
  - 정확성(버그 고치기)이 아니라 성능(코드를 더 빠르게)을 재는 첫 저장소급 벤치마크 — 스니펫이 아닌 코드베이스 전체 맥락에서 동작
  - '구성(프로젝트 페이지 주장): Python 저장소 9개, PR 102,241건을 필터링해 140개 인스턴스, 각 인스턴스는 실제 성능 개선 PR 기반'
  - 최고 AI 모델 vs 사람 전문가 사이 성능 개선 격차(약 8.59%p 주장)가 남음 — 정확성은 포화돼도 최적화는 여전히 난제
  source: https://swe-perf.github.io/
- category: ai
  title: Dynamic Workflows(ultracode) — GA·스크립트 오케스트레이션으로 서브에이전트 수백 개
  summary: Dynamic workflow(v2.1.154+·2026-05-28 GA)는 Claude가 작업 설명을 받아 JavaScript 오케스트레이션 스크립트를 짜고 런타임이 백그라운드 실행 — 본 세션은 응답 가능. 서브에이전트/스킬과 달리 루프·분기·중간 결과가 스크립트 변수에, Claude 컨텍스트엔 최종 답만. 핵심 primitive — agent(spawn), parallel(barrier), pipeline(stage stream). 동시 16·런당 1,000 에이전트 상한. 켜는 법 — 프롬프트 ultracode·/effort ultracode(xhigh+자동 workflow)·/workflows 관리. managed settings disableWorkflows로 조직 비활성. Bun Zig→Rust 75만 줄 11일(테스트 99.8%) 공식 사례.
  points:
  - GA v2.1.154+ — agent/parallel/pipeline primitive, 동시 16·런당 1,000
  - /effort ultracode — xhigh+자동 workflow, /workflows pause·resume·slash 재사용
  - disableWorkflows managed gate — 토큰 소비 주의, pilot slice 먼저
  source: https://code.claude.com/docs/en/workflows
- category: ai
  title: /context — 200k 컨텍스트가 어디로 새는지 한눈에 보고 막는 진단 명령
  summary: '에이전트 성능이 떨어지는 흔한 원인은 모델이 아니라 컨텍스트 창이 잡동사니로 꽉 찬 것이다. Claude Code의 `/context`는 시스템 프롬프트·기본 도구·MCP 도구·메모리(CLAUDE.md)·스킬·대화 기록·남은 공간이 각각 토큰을 얼마나 먹는지 분해해서 보여준다. 공식 비용 문서도 "무엇이 공간을 잡아먹는지 보려면 `/context`를 실행하라"고 안내한다. 과거엔 MCP 서버가 컨텍스트의 절반을 먹는다는 사례가 많았는데, 지금은 MCP 도구 정의가 기본적으로 ''지연 로딩''이라 실제로 쓰기 전까진 도구 이름만 들어간다. 그래도 안 쓰는 서버는 `/mcp`로 끄는 게 좋고, 공식 문서는 MCP보다 `gh`·`aws`·`gcloud` 같은 CLI를 쓰면 도구 목록이 컨텍스트에 안 쌓인다고 권한다. 실무 처방은 단순하다. `/context`로 범인을 찾고 → 안 쓰는 MCP를 끄고 → CLAUDE.md는 핵심만 200줄 이내로 → 남은 공간이 줄면 `/compact`나 새 세션으로 정리. 토큰을 아끼는 게 아니라 모델이 집중할 ''깨끗한 작업 공간''을 지키는 일이다.

    '
  points:
  - '`/context`: 시스템·도구·MCP·메모리·대화별 토큰 점유율을 분해 — 공식 비용 문서가 진단 도구로 안내'
  - MCP 도구 정의는 기본 지연 로딩(쓰기 전엔 이름만) — 그래도 안 쓰는 서버는 `/mcp`로 끄고, CLI(gh·aws)는 목록을 안 쌓아 더 가벼움
  - '처방: 범인 찾기→불필요 MCP off→CLAUDE.md 200줄 이내→공간 줄면 /compact·새 세션'
  source: https://code.claude.com/docs/en/costs
- category: ai
  title: UI UX Pro Max — '디자인 안목'을 스킬로 주입해 매번 비슷한 AI 화면을 벗어나기
  summary: 'AI에 UI를 맡기면 어디서 본 듯한 보라색 그라데이션·똑같은 카드 레이아웃이 반복되는 게 흔한 불만이다. UI UX Pro Max는 이 ''디자인 안목 부재''를 메우는 오픈소스(MIT) Claude Code 스킬로, 프로젝트 요구사항을 분석해 제품 유형에 맞는 디자인 시스템(스타일·색·타이포·간격·접근성)을 자동으로 골라준다. README 기준 67가지 UI 스타일(글래스모피즘·브루탈리즘·벤토 그리드 등), 161개 산업별 컬러 팔레트, 57개 폰트 페어링, 25종 차트, 15개 기술 스택(React·Next·Vue·SwiftUI·Flutter 등), 99개 UX 가이드라인, 161개 추론 규칙을 내장한다. 요청이 오면 제품 유형·스타일·팔레트·패턴·타이포를 병렬 검색하고, 업종에 안 맞는 ''안티패턴''을 걸러낸 뒤 코드로 뽑는 식이다. 설치는 Claude Code에서 `/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill` 후 `/plugin install`. 단, 떠도는 스타/설치 수치는 출처마다 8만~19만으로 들쭉날쭉하니 ''인기 지표''는 걸러 보고, 핵심은 검증된 기능 범위로 판단하라.

    '
  points:
  - 제품 유형→스타일·팔레트·폰트·패턴을 병렬 매칭하고 업종 부적합 안티패턴을 걸러 코드 생성 (MIT 오픈소스)
  - 'README 명시: 67 스타일·161 팔레트·57 폰트쌍·25 차트·15 스택·99 UX 규칙·161 추론 규칙'
  - '설치: `/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill` → `/plugin install` · 떠도는 별·설치수는 편차 커서 신뢰 말 것'
  source: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
- category: ai
  title: wshobson/agents — 에이전트·스킬·커맨드를 여러 도구에 한 번에 까는 멀티하네스 마켓플레이스
  summary: 'Claude Code뿐 아니라 Codex CLI·Cursor·OpenCode·GitHub Copilot·Gemini CLI까지 같은 에이전트 구성을 공유하려는 시도가 wshobson/agents다. 도메인 전문가 서브에이전트, 스킬, 슬래시 커맨드를 ''플러그인'' 단위로 묶어, 한 소스에서 여러 하네스로 배포한다. 특정 도구에 종속되지 않고 팀이 쓰는 에이전트 자산을 한곳에서 버전 관리하려는 사람에게 맞는다. README 기준 플러그인 84개, 에이전트 192개, 스킬 156개를 제공하며 라이선스는 MIT다. 작업 난이도에 따라 모델 티어를 갈아끼우는 라우팅도 포함한다.

    '
  points:
  - 1개 소스 → Claude Code·Codex CLI·Cursor·OpenCode·GitHub Copilot·Gemini CLI 6개 하네스로 같은 구성 배포 (MIT)
  - 'README 명시: 플러그인 84개·에이전트 192개·스킬 156개 — 도메인 전문가 단위로 묶어 제공'
  - 작업 난이도별 모델 티어 라우팅 내장 — 도구 락인 없이 팀 에이전트 자산을 한곳에서 버전 관리
  source: https://github.com/wshobson/agents
- category: ai
  title: 공식 MCP 레지스트리 — 흩어진 MCP 서버를 한 API로 찾는 '소스 오브 트루스'
  summary: 'MCP 서버가 폭증하면서 ''어디서 신뢰할 만한 서버를 찾나''가 문제가 됐다. 그 답이 2025-09-08 프리뷰로 공개된 공식 MCP 레지스트리다. registry.modelcontextprotocol.io에서 공개 MCP 서버의 메타데이터(엔드포인트·기능·버전)를 한곳에 모아 REST API로 검색하게 한다. 기존 레지스트리(클라이언트별 마켓플레이스 등)를 대체하지 않고 그 위에 쌓이는 ''업스트림 단일 출처'' 역할이다. 클라이언트는 여기서 받아 자기만의 서브레지스트리로 가공하고, 사내용 비공개 서브레지스트리도 같은 스키마로 운영할 수 있다. MCP 오픈소스 커뮤니티 소유로 Anthropic·GitHub·PulseMCP·Microsoft·Block 등이 참여한다. 단, 아직 GA가 아닌 프리뷰라 데이터 리셋·호환성 깨짐 가능성이 명시돼 있어 프로덕션 의존은 주의해야 한다.

    '
  points:
  - '검색: curl "https://registry.modelcontextprotocol.io/v0/servers?limit=10" — 서버 목록을 REST API로 조회'
  - 기존 레지스트리 대체 아님 — 업스트림 단일 출처, 공개·사내 서브레지스트리가 같은 스키마로 위에 쌓임
  - MCP 커뮤니티 소유(Anthropic·GitHub·PulseMCP·Microsoft·Block 등 참여), 레포 약 6.9k★ — 단 아직 프리뷰(데이터 리셋·breaking change 가능)
  source: https://blog.modelcontextprotocol.io/posts/2025-09-08-mcp-registry-preview/
- category: ai
  title: Zed 1.0 — Rust GPUI 에디터·ACP 에이전트 호스트·Parallel Agents(GPL-3.0·~85k★)
  summary: Zed(zed-industries/zed)는 Atom·Tree-sitter 제작진이 GPUI를 Rust로 바닥부터 짜 5년 만에 만든 GPU 가속 오픈소스 에디터다. 2026-04-29 1.0 GA, GitHub ~85k★·GPL-3.0. 핵심 정체성은 '자체 AI를 강제하지 않고 ACP(Agent Client Protocol)로 외부 코딩 에이전트를 호스트' — Claude Code·Codex·Gemini CLI·OpenCode·goose·Cline을 Agent Panel에 그대로 띄우고, 인증·과금·모델 선택은 각 에이전트가 소유(Zed는 과금 없음). 2026-04-22 Parallel Agents — Threads Sidebar(opt-cmd-j)로 프로젝트별 스레드 묶음, 스레드마다 접근 레포·워크트리 격리·에이전트 교체, 한 스레드가 여러 레포 가로질러 읽기·쓰기. JetBrains도 ACP 채택·양사 공동 에이전트 레지스트리. Cursor(IDE 1위)와 달리 '빠른 에디터=에이전트 공용 작업대'.
  points:
  - GPUI Rust 렌더링 ·2026-04-29 1.0 GA ·mac/Windows/Linux ·~85k★ GPL-3.0
  - ACP Agent Panel — Claude Code·Codex·Gemini CLI·OpenCode·goose·Cline, 인증·과금은 에이전트 소유
  - Parallel Agents — Threads Sidebar·스레드별 레포/워크트리 격리·멀티 에이전트 동시 실행
  source: https://zed.dev/blog/zed-1-0
- category: ai
  title: openskills — Claude Code 스킬을 Cursor·Codex·Aider까지 그대로 쓰게 해주는 범용 로더
  summary: 'openskills는 Anthropic의 SKILL.md 스킬 시스템을 Claude Code 밖의 다른 에이전트에서도 쓰게 해주는 CLI 도구다(Apache 2.0, GitHub 10.4k★, TypeScript). 핵심은 "범용 SKILL.md 설치기" — 스킬을 받아 `AGENTS.md`에 Claude Code와 똑같은 `<available_skills>` XML 포맷으로 박아 넣어, AGENTS.md를 읽는 모든 호환 에이전트가 같은 스킬을 쓰게 만든다. 지원 대상은 Claude Code·Cursor·Windsurf·Aider·Codex 등이고, `npm i -g openskills` 후 `npx openskills install anthropics/skills`로 공식 스킬 모음을 한 번에 깔 수 있다. Claude Code의 점진적 공개(progressive disclosure) 방식을 그대로 따라 평소엔 이름·설명만 로드하고 필요할 때만 본문을 읽으므로, 여러 도구를 오가며 작업하는 팀이 스킬 자산을 한 벌로 공유하기 좋다. Anthropic 비공식 프로젝트다.

    '
  points:
  - SKILL.md를 AGENTS.md의 <available_skills> XML로 변환 — Cursor·Windsurf·Aider·Codex 등 AGENTS.md 읽는 에이전트가 공유
  - '설치: npm i -g openskills → npx openskills install anthropics/skills / npx openskills sync (Apache 2.0, 10.4k★)'
  - 점진적 공개 유지 — 평소 이름·설명만, 필요 시 본문만 로드 / Anthropic 비공식
  source: https://github.com/numman-ali/openskills
- category: ai
  title: Memory Bank — 세션이 바뀌어도 프로젝트 맥락을 잃지 않게 하는 마크다운 메모리 패턴
  summary: 'Memory Bank는 에이전트가 세션·컨텍스트 리셋을 넘어 프로젝트 맥락을 유지하도록, 핵심 정보를 프로젝트 루트의 구조화된 마크다운 파일 묶음으로 외부화하는 패턴이다. 에이전트는 매 세션 시작 때 이 파일들을 먼저 읽어 ''소스 오브 트루스''로 삼아, 불완전한 이해에서 나오는 잘못된 가정을 막는다. RooCode 구현(GreatScottyMac/roo-code-memory-bank)은 `memory-bank/` 디렉터리에 다섯 개 코어 파일을 둔다 — activeContext.md(현재 목표·세션 상태), decisionLog.md(아키텍처 결정과 근거), productContext.md(상위 프로젝트 맥락), progress.md(완료 작업), systemPatterns.md(코딩 패턴). 루트의 projectBrief.md는 초기화 시 즉시 맥락을 준다. Cline·RooCode·KiloCode·Cursor가 비슷한 방식을 쓰며, 핵심은 프롬프트(휘발성)가 아니라 대화 밖에 존재하는 영속 메모리라는 점이다. Claude Code의 MEMORY.md와 같은 계열의 발상이다.

    '
  points:
  - 맥락을 프로젝트 루트 마크다운으로 외부화 → 세션·리셋을 넘어 유지, 매 세션 시작 시 먼저 읽어 가정 오류 방지
  - 'RooCode 코어 5종: activeContext / decisionLog / productContext / progress / systemPatterns + 루트 projectBrief'
  - Cline·RooCode·KiloCode·Cursor 공통 패턴 — 프롬프트(휘발) 아닌 대화 밖 영속 메모리 / Claude Code MEMORY.md와 동류
  source: https://github.com/GreatScottyMac/roo-code-memory-bank
- category: ai
  title: Cursor 규칙(.mdc) — 한 덩어리 지침을 '언제 켤지'로 쪼개 토큰 아끼기
  summary: 'Cursor의 프로젝트 규칙은 `.cursor/rules/*.mdc` 파일로 둔다(확장자가 `.mdc`여야 함 — 프런트매터가 없는 `.md`는 무시됨). 핵심은 AGENTS.md·CLAUDE.md처럼 모든 세션에 통째로 들어가는 게 아니라, 프런트매터 3필드(`description`·`globs`·`alwaysApply`) 조합으로 ''언제 끌어올지''를 규칙마다 따로 정한다는 점이다. 활성 방식은 네 가지: ① Always(`alwaysApply:true`) 매 세션 포함 ② Auto Attached(`globs` 매칭 파일이 컨텍스트에 들어올 때만) ③ Agent Requested(`description` 보고 에이전트가 필요하다 판단하면) ④ Manual(`@규칙명`으로 직접 부를 때만). 덕분에 "테스트 파일 만질 때만 보는 규칙"을 평소 컨텍스트에서 빼둘 수 있어, 거대한 단일 규칙 파일이 매번 토큰을 먹는 문제를 피한다. 우선순위는 Team → Project → User 순으로 병합되며 앞쪽이 충돌 시 이긴다.

    '
  points:
  - '`.cursor/rules/*.mdc`(버전관리), 프런트매터 `description`·`globs`·`alwaysApply` 조합으로 적용 시점 결정 — `.md`는 무시'
  - '4가지: Always / Auto Attached(globs 매칭) / Agent Requested(description 판단) / Manual(@멘션)'
  - globs로 '특정 파일 만질 때만' 켜서 평소 컨텍스트 절약 / 우선순위 Team→Project→User
  source: https://cursor.com/docs/context/rules
- category: ai
  title: Pydantic AI — 'FastAPI 느낌'으로 타입 안전하게 짜는 모델-비종속 에이전트 프레임워크
  summary: 'Pydantic AI는 Pydantic 검증 라이브러리를 만든 팀이 내놓은 파이썬 에이전트 프레임워크다. README는 스스로를 "프로덕션급 GenAI 애플리케이션을 빠르고 자신 있게 짜도록 돕는" 프레임워크라 소개하며, 목표는 웹 개발의 FastAPI가 주던 ''이게 되네'' 하는 개발 경험을 LLM 앱에 가져오는 것이다. 핵심은 타입 안전성이다. 에이전트의 입력·도구·출력을 Pydantic 모델로 정의하면 LLM 응답이 그 스키마에 맞게 검증되고, 안 맞으면 모델에 자동 재요청한다. 덕분에 "문자열 받아서 파싱하다 터지는" 흔한 실패가 컴파일 타임 가까이로 당겨진다. 모델에도 안 묶여서 OpenAI·Anthropic·Gemini·DeepSeek 등을 같은 코드로 갈아끼울 수 있고, 타입 안전한 의존성 주입, MCP/A2A 연동, Logfire(OpenTelemetry) 관측이 기본 제공된다. 코딩 에이전트를 ''쓰는'' 도구가 아니라 ''만드는'' 토대라서, 사내 자동화나 커스텀 에이전트를 직접 구축할 때 LangChain의 대안으로 자주 거론된다. MIT 라이선스, 약 17.8k★.

    '
  points:
  - Pydantic 팀의 파이썬 에이전트 프레임워크 — 입력·도구·출력을 Pydantic 모델로 정의하고 LLM 응답을 스키마 검증(안 맞으면 자동 재요청)
  - '모델 비종속: OpenAI·Anthropic·Gemini·DeepSeek 등을 같은 코드로 교체 / 타입 안전 의존성 주입 + Logfire 관측 기본'
  - 에이전트를 '쓰는' 게 아니라 '만드는' 토대 — MIT, 약 17.8k★ (수치는 레포 주장)
  source: https://github.com/pydantic/pydantic-ai
- category: ai
  title: Backlog.md — 깃 레포를 사람·AI 공용 칸반 보드로 바꾸는 마크다운 태스크 매니저
  summary: 'Backlog.md는 별도 서버나 SaaS 없이, 깃 저장소 안에서 작업(task)을 평범한 마크다운 `.md` 파일로 관리하는 오픈소스 도구다(MIT 라이선스). README에 따르면 모든 이슈가 깃에 커밋되는 .md 파일이라 PR·브랜치·히스토리와 자연스럽게 묶이고, 제로 설정 CLI로 터미널 칸반 보드와 웹 UI를 띄울 수 있다. 핵심은 ''AI 에이전트와 사람이 같은 작업 목록을 공유''한다는 점이다. Claude Code·Gemini CLI·Codex·Kiro 등 MCP/CLI 호환 어시스턴트를 지원하며, MCP 커넥터를 쓰면 이 도구들에 워크플로 지침까지 자동 주입된다. 에이전트가 작업을 To Do→In Progress→Done으로 옮기고 진행 상황을 파일에 남기므로, 세션이 바뀌어도 ''무엇을 하던 중이었나''가 레포에 그대로 남는다. 실무 포인트는 핸드오프다. 사람이 잘게 쪼갠 태스크를 에이전트에 넘기고, 에이전트가 작업하며 상태를 갱신하면, 별도 트래커 없이 깃 하나로 사람-AI 협업의 단일 진실 공급원(source of truth)을 만들 수 있다.

    '
  points:
  - 작업 = 깃에 커밋되는 마크다운 .md 파일 — 서버·SaaS 없이 레포 안에서 칸반·진행 추적(MIT 라이선스)
  - Claude Code·Gemini CLI·Codex·Kiro 등 지원, MCP 커넥터가 에이전트에 워크플로 지침 자동 설정
  - 사람이 태스크 쪼개 핸드오프 → 에이전트가 To Do→In Progress→Done 갱신 → 세션 바뀌어도 맥락이 레포에 남음
  source: https://github.com/MrLesk/Backlog.md
- category: ai
  title: Ralph Wiggum 루프 — '멍청하지만 절대 안 멈추는' 에이전트 bash 패턴
  summary: Geoffrey Huntley가 심pson 캐릭터 이름을 따 정리한 Ralph는 본질적으로 `while :; do cat PROMPT.md | claude-code; done` 한 줄이다. 매 반복마다 새 컨텍스트로 에이전트를 띄워 한 번에 한 가지만 시키고, 상태는 fix_plan.md·AGENT.md·git 히스토리에 두어 컨텍스트 rot를 우회한다. 테스트·타입체커·정적분석을 backpressure로 걸어 잘못된 생성을 거른다. Anthropic은 2025-12 공식 ralph-wiggum 플러그인(/ralph-loop·Stop 훅)으로 채택했고, Continuous Claude는 PR·CI·머지까지 붙인 확장이다.
  points:
  - '순루프: 작업 1개→구현→검증(테스트/타입/린트)→통과 시 커밋→상태 갱신→컨텍스트 리셋→반복'
  - 'stateless 핵심: 진행은 LLM 컨텍스트가 아니라 git·파일에 — 매 반복 새 인스턴스'
  - 공식 ralph-wiggum 플러그인(/ralph-loop), Continuous Claude는 PR·CI·머지까지 확장
  source: https://ghuntley.com/ralph/
- category: ai
  title: GitHub Copilot 코딩 에이전트 — 이슈를 던지면 알아서 PR을 올리는 비동기 에이전트
  summary: '터미널 CLI 에이전트와 달리, GitHub Copilot 코딩 에이전트는 깃허브 안에서 ''비동기''로 도는 자율 에이전트다. 이슈를 `@copilot`에게 할당하거나 Agents 패널에서 작업을 주면, 에이전트가 백그라운드에서 레포를 조사하고 구현 계획을 세운 뒤 브랜치에 코드를 고쳐 초안 PR(draft pull request)을 연다. 실행은 GitHub Actions 위에서 돌아 격리된 환경에서 빌드·테스트를 거치고, 사람은 결과 PR을 리뷰만 하면 된다. 즉 ''내가 옆에서 지켜보며 짜는'' 동기식 페어 프로그래밍이 아니라, ''일을 맡겨두고 다른 일을 하다 PR로 받는'' 워크플로다. VS Code·GitHub.com·이슈 어디서든 `@copilot` 멘션으로 호출할 수 있어, 자잘한 버그·반복 작업을 사람 손에서 떼어내 백로그를 비우는 용도에 맞는다.

    '
  points:
  - 이슈 할당 또는 @copilot 멘션 → 에이전트가 레포 조사·계획·브랜치 수정 후 초안 PR을 자동 생성
  - GitHub Actions 위에서 격리 실행(빌드·테스트), 사람은 PR 리뷰만 — '동기식 페어'가 아닌 '비동기 위임' 워크플로
  - Agents 패널·GitHub.com·VS Code·이슈 등 여러 진입점에서 @copilot으로 호출 가능
  source: https://docs.github.com/en/copilot/concepts/agents/coding-agent/about-coding-agent
- category: ai
  title: skills.sh / npx skills — SKILL.md를 70+ 에이전트에 npm처럼 까는 스킬 패키지 매니저(Vercel·~22.6k★)
  summary: 스킬(SKILL.md)이 쏟아지면서 생긴 문제는 '어떤 걸 어떻게 깔지'다. Vercel Labs의 skills CLI(skills.sh)는 오픈 에이전트 스킬 생태계를 위한 npm식 패키지 매니저(MIT·~22.6k★)다. `npx skills add <owner/repo>` 한 줄로 Claude Code·Codex·Cursor·OpenCode 등 70여 개 에이전트 폴더에 심볼릭 링크 설치. find·use(1회)·list·update·remove·init 서브커맨드, `-g`(전역)·`-a`(대상 에이전트)·`-y`(비대화형) 플래그. GitHub·GitLab·URL·로컬 경로 지원. SKILL.md 표준을 '설치·배포 레이어'로 묶어 도구 비종속 스킬 공유를 가능하게 한다.
  points:
  - '`npx skills add/find/use/update/remove/init` — npm처럼 스킬 검색·설치·갱신(MIT·~22.6k★)'
  - 70+ 에이전트 비종속 — Claude Code·Cursor·Codex·OpenCode 등에 심볼릭 링크로 동일 SKILL.md 공유
  - '`-g` 전역 / 프로젝트 스코프, skills.sh 디렉터리에서 공개 스킬 탐색'
  source: https://github.com/vercel-labs/skills
- category: ai
  title: 코딩 에이전트 프롬프트 인젝션 방어 — Claude Code가 실제로 거는 안전장치
  summary: '프롬프트 인젝션은 공격자가 코드·웹페이지·파일에 악성 지시를 숨겨 에이전트의 원래 명령을 가로채는 기법이다. 코딩 에이전트를 실무에 들일 때 "이거 안전한가"가 첫 관문인데, Claude Code 공식 보안 문서는 마법이 아니라 ''읽을 수 있는 구체적 안전장치''들로 답한다. 핵심은 권한 시스템(민감 작업은 명시적 승인)·컨텍스트 인식 분석(전체 요청을 보고 위험 지시 탐지)·입력 새니타이즈다. 특히 curl·wget 같은 네트워크 명령은 기본 자동승인이 안 되고, 웹 fetch는 별도 컨텍스트 창에서 처리해 악성 프롬프트가 본 세션에 섞이지 않게 격리한다. 그 위에 fail-closed 매칭(매칭 안 된 명령은 기본 수동승인)·명령 인젝션 탐지(이미 허용한 명령도 수상하면 다시 승인)·첫 코드베이스/새 MCP 서버 trust 검증이 더해진다. 단 trust 검증은 -p(헤드리스) 실행 시 비활성화되니 자동화 파이프라인은 그만큼 더 조심해야 한다. 어떤 방어도 100%는 아니므로 신뢰 불가 콘텐츠를 Claude에 직접 파이프하지 말 것을 공식 베스트 프랙티스로 권한다.

    '
  points:
  - 권한 시스템·컨텍스트 인식 분석·입력 새니타이즈가 1차 방어, curl/wget 네트워크 명령은 기본 자동승인 제외
  - 웹 fetch는 '격리된 컨텍스트 창'에서 처리 — 악성 페이지 지시가 메인 세션에 주입되는 걸 차단
  - fail-closed(미매칭 명령 수동승인)·명령 인젝션 탐지·첫 코드베이스/MCP trust 검증. 단 trust 검증은 -p 헤드리스에선 꺼짐
  source: https://code.claude.com/docs/en/security
- category: ai
  title: Devin Desktop(구 Windsurf) — Agent Command Center·Cloud·Cascade Workflows 통합 패밀리
  summary: 2026-06 Cognition이 Windsurf(Codeium IDE)를 Devin Desktop으로 리브랜딩, Devin을 Cloud·Desktop·CLI·Review 하나의 패밀리로 통합했다. Devin Cloud — 샌드박스 VM에서 계획→코드→테스트→PR 비동기(67% PR merge). Devin Desktop — Agent Command Center(Kanban)·Spaces(Git worktree)·ACP로 Codex·Claude Agent·OpenCode 등 서드파티 에이전트도 관리. Cascade Workflows — 반복 멀티스텝을 .md 레시피로 정의해 /슬래시 호출(`.windsurf/workflows/*.md` 팀 공유). Pro $20/월에 Cloud+Desktop+SWE-1.6. Cursor(IDE 1위)와 달리 '에이전트 관리 센터+클라우드 VM' 통합이 차별.
  points:
  - Devin Desktop OTA — Windsurf→Devin Desktop, ACP·Spaces·Kanban·Devin Local(Rust)
  - Cascade Workflows — .md 레시피·/슬래시 호출·워크스페이스 커밋으로 팀 공유
  - Pro $20/월 — Cloud agent+Desktop IDE+SWE-1.6, 67% PR merge(2025 리뷰)
  source: https://devin.ai/desktop/
- category: ai
  title: CodeRabbit — 공개 레포는 무료, PR마다 줄 단위로 달라붙는 AI 리뷰어
  summary: 'CodeRabbit은 GitHub·GitLab에 붙어 PR이 열릴 때마다 자동으로 코드 변경을 분석하고, 변경 라인 옆에 인라인 코멘트와 PR 요약을 달아주는 AI 코드 리뷰 도구다. 가장 큰 미끼는 가격이다. 공식 가격표 기준 ''공개 저장소는 영원히 무료(free reviews forever for public repositories)''라서 오픈소스·사이드 프로젝트에 비용 없이 붙일 수 있다. 유료는 Pro가 연간 결제 시 사용자당 월 24달러, Pro Plus가 48달러이며, 무료 티어도 공개·비공개 저장소 수 제한 없이 PR 요약과 IDE·CLI 리뷰를 제공한다. 즉 ''에이전트가 코드를 짠다''가 아니라 ''에이전트가 사람·AI가 짠 코드를 사람 대신 1차로 리뷰한다''는 쪽이라, 작성과 검토를 다른 주체로 분리하고 싶을 때 들어맞는다.

    '
  points:
  - PR 열릴 때마다 변경 라인 옆에 인라인 코멘트 + PR 요약 자동 생성 (GitHub·GitLab)
  - 공개 저장소는 영원히 무료 — OSS·개인 프로젝트에 비용 0으로 리뷰 봇 추가(공식 가격표 명시)
  - 유료 Pro 연 결제 시 월 $24/인, Pro Plus $48/인; 무료 티어도 공개·비공개 무제한 + IDE·CLI 리뷰 포함
  source: https://www.coderabbit.ai/pricing
- category: ai
  title: Codex CLI — Rust 네이티브 로컬 코딩 에이전트(92k+★)
  summary: 'Codex CLI는 OpenAI가 만든 "내 컴퓨터에서 도는" 터미널 코딩 에이전트다. GitHub 저장소 기준 Apache-2.0 오픈소스이고, 2026-06-23 조회 시 92.8k★·13.7k forks·Rust 96.3%·최신 릴리스 0.142.0(2026-06-22)로 활발히 유지되고 있다. 실무 포인트는 설치 경로보다 운영 경계다. CLI는 셸 설치 스크립트, npm, Homebrew, GitHub Release 바이너리를 제공하고, 인증은 ChatGPT Plus·Pro·Business·Edu·Enterprise 로그인 또는 API 키로 나뉜다. 같은 README가 VS Code·Cursor·Windsurf IDE 통합과 클라우드 Codex Web을 별도 표면으로 안내하므로, 팀은 "로컬 CLI에서 할 일", "IDE에서 리뷰할 일", "클라우드 에이전트에 맡길 일"을 권한과 비용 기준으로 나눠야 한다.

    '
  points:
  - '같은 런 검증: 92.8k★, 13.7k forks, Rust 96.3%, 최신 0.142.0(2026-06-22)'
  - '설치 표면: 셸 스크립트·npm·Homebrew·GitHub Release 바이너리'
  - '운영 경계: ChatGPT 로그인/API 키, IDE 통합, Codex Web을 작업 성격별로 분리'
  source: https://github.com/openai/codex
- category: ai
  title: promptfoo — 프롬프트·모델을 바꿔도 품질이 안 깨졌는지 자동으로 재는 eval 툴
  summary: '코딩 에이전트/LLM 기능을 실무에 넣으면 곧 "프롬프트나 모델을 바꿨는데 결과가 더 나빠지진 않았나"라는 회귀 문제에 부딪힌다. promptfoo는 그 지점을 테스트 주도 개발처럼 다루는 오픈소스 CLI·라이브러리다. 2026-06-23 재검증 기준 GitHub 22,490★·MIT이고, 2026-03-09 OpenAI 인수 발표 뒤에도 오픈소스와 멀티모델 지원을 유지한다고 공지했다. 핵심은 선언적 테스트 케이스로 여러 프롬프트·입력·모델을 한 번에 돌리고, matrix/side-by-side 뷰로 비교하는 것이다. 단순 문자열 일치만이 아니라 metrics와 model-graded 평가로 정답이 하나로 떨어지지 않는 생성 결과도 점수화한다. 자동 레드티밍·펜테스팅은 보안 취약점을 찾고, CLI·라이브러리·CI/CD 통합은 프롬프트 변경을 배포 전 회귀 게이트로 만든다. eval은 로컬에서 실행되고 LLM과 직접 통신하므로, 평가 데이터를 불필요하게 외부 평가 SaaS에 밀어 넣지 않아도 된다.

    '
  points:
  - '같은 런 검증: 22,490★, MIT, OpenAI 인수 뒤에도 오픈소스 유지 공지'
  - 선언적 테스트로 프롬프트·입력·모델을 matrix/side-by-side 비교
  - metrics·model-graded 평가·레드티밍을 CI 회귀 게이트로 연결
  source: https://www.promptfoo.dev/docs/intro/
- category: ai
  title: awesome-agent-skills — 코딩 에이전트 가리지 않고 쓰는 스킬 1400+개 모음(VoltAgent·25k★)
  summary: '스킬(SKILL.md)이 Claude Code·Codex·Cursor·Gemini CLI 등에서 공통 표준이 되면서, "어떤 스킬을 깔지"가 새 고민거리가 됐다. VoltAgent의 awesome-agent-skills는 이 문제를 풀려는 큐레이션 레포다. 2026-06-23 재검증 기준 README 배지는 1497개+ 스킬을 표시하고, GitHub API로 26,182★·2,801 forks·MIT·같은 날 push를 확인했다. 핵심은 특정 에이전트 전용 프롬프트 모음이 아니라는 점이다. README는 Claude Code, Codex, Antigravity, Gemini CLI, Cursor, GitHub Copilot, OpenCode, Windsurf 등과 호환된다고 설명한다. Anthropic, Google Labs, Vercel, Stripe, Cloudflare, Netlify, Trail of Bits, Sentry, Expo, Hugging Face, Figma 같은 조직 발행 스킬과 커뮤니티 스킬을 함께 싣되, 대량 AI 생성물이 아니라 실제 팀이 쓰는 스킬을 손으로 고른다는 기준을 내세운다. 실무 교훈은 에이전트별 설정을 복붙하기보다, 검증된 SKILL.md를 공용 지식 단위로 관리하고 출처·라이선스·호환 도구를 같이 확인하라는 것이다.

    '
  points:
  - '같은 런 검증: README 1497+ skills, GitHub 26,182★·2,801 forks·MIT·2026-06-23 push'
  - Claude Code·Codex·Antigravity·Gemini CLI·Cursor·Copilot·OpenCode·Windsurf 호환 표방
  - 공식 조직 발행 스킬과 커뮤니티 스킬을 함께 싣되, 출처와 라이선스를 보고 골라 쓰는 카탈로그
  source: https://github.com/VoltAgent/awesome-agent-skills
- category: ai
  title: Roo Code 종료 → Zoo Code — 24k★ OSS 에디터 에이전트의 archive·커뮤니티 포크 생존
  summary: Cline에서 갈라진 VS Code 코딩 에이전트 Roo Code(24k★·Apache-2.0)는 Code·Architect·Ask·Debug·Custom 5모드·MCP·자연어 생성·리팩터링을 제공했다. 2026-05-15 v3.54.0을 마지막으로 저장소 archive(read-only) — 메인테이너는 Roomote 등 다른 프로젝트로 이동. 공식 README는 Zoo Code(커뮤니티 포크, 2026-04-23 기존 기여자 인계·v3.54.0 이어받음)와 Cline을 대안으로 안내. export→import로 설정 이주 가능. 계보 Cline→Roo→Zoo는 BYOK+오픈 라이선스+설정 이식성이 포크 생존을 보장하는 실제 사례.
  points:
