  title: 'mods: 셸 파이프라인에 AI를 끼워넣는 CLI'
  summary: '"AI for the command line, built for pipelines" — 표준입력을 읽어 mods 인자의 프롬프트를 앞에 붙여 LLM에 보내고, 응답을 마크다운으로 포맷. 기존 셸 파이프에 AI를 자연스럽게 합류시킨다. MIT.

