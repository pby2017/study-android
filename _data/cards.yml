    url: https://www.promptfoo.dev/about/
  interview: 'promptfoo eval 결과가 통과하면 프롬프트의 전체 품질이 검증됐다고 볼 수 있나요? 실행할 때 데이터는 어디로 전송될 수 있나요?'
  answer: '아니다. 선언한 테스트 사례와 assertion이 검사한 범위만 확인된다. 대표 입력과 실패 사례를 포함하고 핵심 출력은 사람이 검토해야 한다. eval 대상 호출은 설정한 provider로 전송되며, 레드팀 생성·채점은 provider 설정이나 hosted 기능 사용 여부에 따라 Promptfoo 서비스로 전송될 수 있으므로 데이터 처리 설정을 확인한다.'
