  title: Android CLI + Skills — 어떤 코딩 에이전트든 Android 개발 규칙에 맞게 접지
  summary: 'Google은 2026년 4월 Android CLI, Android skills, Android Knowledge Base를 에이전트용 개발 표면으로 공개했다. 핵심은 Android Studio 밖의 Claude Code, Codex, Antigravity 같은 에이전트도 SDK 설치, 프로젝트 생성, 에뮬레이터 생성, 실행 같은 Android 작업을 추측 없이 수행하게 만드는 것이다. 공식 블로그는 내부 실험에서 표준 도구만 쓸 때보다 LLM 토큰 사용을 70% 이상 줄이고 작업을 3배 빠르게 끝냈다고 설명한다. skills는 Navigation 3, edge-to-edge, AGP 9, XML-to-Compose, R8 분석 같은 반복 작업을 SKILL.md 지침으로 제공하고, Knowledge Base는 최신 Android/Firebase/Kotlin 문서를 에이전트 컨텍스트로 가져오게 한다.

    '
  points:
  - 'Android CLI: sdk install, create, emulator, run, update를 에이전트가 터미널에서 호출'
  - '공식 내부 실험: 토큰 사용 70%+ 감소, 작업 3배 빠름'
  - 'Android skills + Knowledge Base: 최신 권장 패턴으로 에이전트 응답 접지'
  source: https://android-developers.googleblog.com/2026/04/build-android-apps-3x-faster-using-any-agent.html
- category: ai
  title: Google AI Studio Android 프로토타이핑 — 프롬프트에서 Compose 앱까지
  summary: 'Google I/O 2026 Android 개발자 요약에서 Google은 AI Studio에서 프롬프트만으로 네이티브 Android 앱을 만들 수 있다고 발표했다. 생성되는 앱은 Jetpack Compose, Kotlin, Google 권장 패턴을 바탕으로 하고, 브라우저 안의 임베디드 에뮬레이터로 반복 테스트한 뒤 실제 기기에 배포할 수 있다. 만든 앱은 Play Console의 internal testing track으로 공유하고, 더 넓은 출시 전에는 Android Studio로 가져가 고급 디버깅, 테스트, UI polish를 이어가는 흐름이다. 실무 포인트는 ''프로덕션 IDE 대체''가 아니라 아이디어 검증과 초기 샘플 생성 시간을 줄이는 프로토타이핑 입구로 보는 것이다.

    '
  points:
  - 프롬프트 → Kotlin/Compose 네이티브 Android 앱 초안 생성
  - AI Studio 내 임베디드 에뮬레이터로 반복 테스트, 실제 기기 배포 가능
  - Play internal testing 공유 후 Android Studio에서 디버깅·테스트·UI polish
  source: https://android-developers.googleblog.com/2026/05/17-things-android-developers-google-io.html
- category: ai
  title: Android Studio Agent Mode 병렬 대화 — 테스트·기획·문서화를 분리해 동시에 진행
  summary: 'Android Studio I/O Edition 도구 업데이트는 Gemini Agent Mode에 병렬 conversation 흐름을 추가했다. 한 대화에서는 테스트를 실행해 기다리고, 다른 대화에서는 새 기능의 planning mode를 돌리며, 또 다른 대화에서는 문서를 작성하는 식으로 작업 맥락을 분리한다. 같은 업데이트는 Agent Mode가 Compose UI에 직접 진입해 프리뷰 생성, 이미지 기반 UI 생성, UI 변환 같은 작업을 돕는 흐름도 강조한다. 이미 Agent Mode 자체는 기존 카드에서 다뤘으므로, 이 카드는 ''에이전트 하나와 긴 채팅 하나''가 아니라 독립 작업을 대화 단위로 쪼개 병렬화하는 운영 패턴에 초점을 둔다.

    '
  points:
  - '병렬 conversations: 테스트 대기 중 기획·문서화 대화를 별도로 진행'
  - 작업별 맥락 분리로 Agent Mode 응답 범위를 좁힘
  - Compose Preview·이미지 기반 UI 생성·UI 변환 등 UI 작업 진입점 확대
  source: https://android-developers.googleblog.com/2026/05/whats-new-android-developer-tools.html
- category: ai
  title: Android XR + Gemini — Geospatial 좌표를 구조화 JSON 투어로 바꾸는 패턴
  summary: '2026년 6월 Android Developers Blog의 XR 예제는 Android XR, ARCore for Jetpack XR의 Geospatial API, Firebase AI Logic의 Gemini API를 묶어 혼합현실 투어 가이드를 만든다. 앱은 디바이스 포즈를 위도·경도와 방향 정확도로 변환하고, 정확도가 충분할 때 Gemini에 현재 좌표를 넘긴다. Gemini 호출에는 Google Maps grounding과 JSON response schema를 함께 설정해, 주변 도보 투어 3개를 title, description, stops 같은 구조화 데이터로 받는다. 학습 포인트는 멀티모달 ''멋진 데모''보다 위치 정확도 게이트와 스키마 기반 출력으로 XR UI가 바로 소비할 수 있는 데이터를 만드는 설계다.

    '
  points:
  - 'ARCore for Jetpack XR Geospatial API: 디바이스 포즈 → 위도·경도·방향 정확도'
  - Firebase AI Logic + Gemini + Google Maps grounding으로 주변 투어 생성
  - responseSchema + application/json으로 XR UI가 바로 쓰는 구조화 결과 수신
  source: https://android-developers.googleblog.com/2026/06/android-xr-geospatial-api-gemini.html
- category: ai
  title: Android 17 AppFunctions Agent Skill — 앱 기능을 에이전트 도구 코드로 생성·검증
  summary: 'Android 17은 AppFunctions를 ''인텔리전스 시스템''의 핵심 앱 통합 지점으로 확장한다. 앱은 @AppFunction을 붙인 Kotlin 함수와 KDoc으로 노트 생성, 장바구니 추가 같은 기능을 선언하고, Android MCP의 온디바이스 도구처럼 에이전트에 노출한다. 새 AppFunctions agent skill은 앱의 핵심 워크플로우를 분석해 필요한 Kotlin 코드를 만들고, LLM tool-calling에 맞게 KDoc을 다듬으며, ADB 테스트·디버깅 명령까지 제안한다. Gemini 통합은 private preview라 바로 배포 기능으로 보면 안 되고, 지금은 함수 경계와 설명 문서를 에이전트가 호출하기 좋게 설계하는 준비 단계로 보는 것이 맞다.

    '
  points:
  - '@AppFunction + KDoc: 앱 기능을 OS/에이전트가 발견할 수 있는 도구로 선언'
  - 'agent skill: Kotlin 코드 생성, KDoc 최적화, ADB 테스트 명령 제안'
  - 'Gemini 통합은 private preview: 프로덕션 전 함수 경계 설계가 핵심'
  source: https://android-developers.googleblog.com/2026/06/Android-17.html
- category: ai
  title: Android 17 NPU 접근 선언 — 온디바이스 AI 앱은 하드웨어 기능을 명시해야 한다
  summary: 'Android 17에서 앱이 NPU에 직접 접근해야 한다면 manifest에 FEATURE_NEURAL_PROCESSING_UNIT을 선언해야 한다. 대상은 LiteRT NPU delegate, 벤더별 NPU SDK, deprecated NNAPI를 쓰는 앱까지 포함된다. 선언이 없으면 target SDK 37 이상 앱은 NPU 접근이 차단될 수 있다. 온디바이스 LLM, 비전 모델, 음성 모델처럼 가속기 의존도가 큰 기능은 단순히 라이브러리만 붙이는 문제가 아니라, 기기 기능 선언·fallback 경로·성능 테스트를 함께 관리해야 한다. AI 기능을 출시할 때 CPU/GPU/NPU 경로를 명확히 나누는 체크리스트가 필요해진다.

    '
  points:
  - 'target SDK 37+: NPU 직접 접근 시 FEATURE_NEURAL_PROCESSING_UNIT 선언 필요'
  - LiteRT NPU delegate·벤더 SDK·NNAPI 사용 앱까지 영향
  - 온디바이스 AI는 manifest, fallback, 성능 테스트를 함께 설계
  source: https://android-developers.googleblog.com/2026/06/Android-17.html
- category: ai
  title: ML Kit GenAI Structured Output — Gemini Nano 결과를 파싱 대신 스키마로 받기
  summary: 'Google I/O 2026 AI on Android 업데이트는 ML Kit GenAI Prompt API의 프로덕션화 방향을 제시했다. Gemini Nano 4는 AICore Developer Preview에서 미리 써보고, production-ready 앱에서는 ML Kit GenAI Prompt API로 전환하는 흐름이다. 새 Structured Output API는 Prompt API 결과를 개발자가 정의한 객체 클래스로 받게 해, 문자열을 직접 파싱하는 불안정한 코드를 줄인다. Prefix Caching은 반복되는 프롬프트 앞부분의 중간 LLM 상태를 재사용해 온디바이스 추론 시간을 줄인다. 핵심은 ''맞춤 프롬프트''를 데모로 끝내지 않고, 스키마·캐시·fallback으로 앱 기능처럼 운영하는 것이다.

    '
  points:
  - 'Structured Output: Prompt API 결과를 정의한 객체 클래스로 수신'
  - 'Prefix Caching: 반복 프롬프트의 중간 LLM 상태 재사용'
  - 'Gemini Nano 4: preview 실험 후 ML Kit GenAI Prompt API로 production 경로 전환'
  source: https://developer.android.com/blog/posts/top-ai-on-android-updates-for-building-intelligent-experiences-from-google-i-o-26
- category: ai
  title: A2A 1년 — MCP가 도구 연결이라면 A2A는 에이전트끼리 업무를 넘기는 규약
  summary: 'Google Developers Blog는 2026년 6월 18일 A2A(Agent-to-Agent) 1주년 업데이트에서 협업형 에이전트 패턴을 정리했다. MCP가 한 에이전트가 도구와 데이터에 접근하는 통로라면, A2A는 서로 다른 에이전트가 능력을 발견하고 업무를 위임하며 결과를 주고받는 통신 계층이다. 실무 포인트는 거대한 단일 에이전트에 모든 컨텍스트를 밀어 넣는 대신, 결제·데이터 분석·DevOps·고객지원처럼 권한과 지식 경계가 다른 작업을 전문 에이전트로 분리하는 것이다. Android 앱도 AppFunctions나 MCP로 앱 내부 도구를 열고, 외부 업무는 A2A 에이전트에 위임하는 구조를 상상할 수 있다.

    '
  points:
  - 'MCP: agent-to-tool, A2A: agent-to-agent 협업 계층'
  - '전문 에이전트에 업무 위임: 컨텍스트 오염과 권한 범위 확대를 줄임'
  - 모바일 앱은 내부 기능은 AppFunctions, 외부 업무는 A2A로 분리 가능
  source: https://developers.googleblog.com/how-a2a-is-building-a-world-of-collaborative-agents/
- category: ai
  title: Android Computer Control — 코드 변경 없이 앱 UI를 에이전트 자동화 대상으로 준비
  summary: 'Android Computer Control은 OEM 선탑재 AI 어시스턴트가 사용자의 허가를 받은 뒤 설치된 앱을 가상 디스플레이에서 실행하고, 스크린샷 분석과 탭·스와이프·텍스트 입력으로 다단계 작업을 수행하는 preview 프레임워크다. target app은 별도 SDK 통합 없이 기존 UI를 자동화 대상으로 둘 수 있지만, 실제 자동화 품질은 적응형 레이아웃, 생명주기 처리, 명확한 화면 상태 같은 기본 앱 품질에 좌우된다. AppFunctions가 명시적 도구 API라면 Computer Control은 UI 자동화 fallback에 가깝다.

    '
  points:
  - OEM 선탑재 assistant + 사용자 권한으로 target app 자동화
  - 가상 디스플레이에서 앱 실행 후 screenshot 분석, tap/swipe/text 입력
  - target app 코드 변경은 없지만 adaptive UI·lifecycle 품질이 자동화 안정성 좌우
  source: https://developer.android.com/ai/computer-control
- category: ai
  title: ML Kit GenAI Speech Recognition — Gemini Nano Advanced 모드로 온디바이스 음성 인식
  summary: 'ML Kit의 GenAI Speech Recognition API는 Android 앱에서 음성을 텍스트로 바꾸는 새 Alpha API다. Basic 모드는 기존 온디바이스 음성 인식 모델을 쓰고, Advanced 모드는 온디바이스 Gemini 모델을 사용해 더 넓은 언어 커버리지와 전반적 품질을 목표로 한다. 문서 기준 Advanced 모드는 Pixel 10 기기에서 제공되고 더 많은 기기가 개발 중이다. 앱은 `genai-speech-recognition:1.0.0-alpha1` 의존성을 추가하고, 모델 상태 확인·다운로드·streaming output 처리를 함께 설계해야 한다.

    '
  points:
  - 'Basic: 기존 온디바이스 speech model, Advanced: Gemini 기반 GenAI model'
  - Advanced 모드는 Pixel 10부터, 더 많은 기기 지원 개발 중
  - 'Alpha API: 모델 상태 확인, 다운로드, Kotlin Flow streaming 출력 처리 필요'
  source: https://developers.google.com/ml-kit/genai/speech-recognition/android
- category: ai
  title: Imagen Android 종료 — Firebase AI Logic 이미지는 Gemini Image(Nano Banana)로 이전
  summary: 'Android Developers 문서는 Imagen 모델이 2026년 6월 24일 종료되며 Gemini Image 모델, 즉 ''Nano Banana'' 계열로 이전하라고 안내한다. 기존 Android 앱은 Firebase AI Logic SDK로 Imagen을 호출해 아바타나 개인화 시각 자산을 만들 수 있었고, Gemini Developer API 또는 Vertex AI provider를 선택했다. 운영 관점의 핵심은 이미지 생성 기능을 단순 모델 교체로 보지 말고, 종료일 전에 모델명, safety/person filter, watermark, output format, prompt 평가 흐름을 함께 점검하는 것이다.

    '
  points:
  - 'Imagen 모델 shutdown: 2026-06-24'
  - '대체 경로: Gemini Image 모델, 문서상 Nano Banana 계열'
  - Firebase AI Logic 앱은 safety·watermark·format·prompt 평가까지 이전 체크
  source: https://developer.android.com/ai/imagen
- category: ai
  title: Kakao Mobility Gemini Nano — 온디바이스 주소 추출로 주문 완료 시간 24% 단축
  summary: 'Kakao Mobility는 ML Kit GenAI Prompt API와 Gemini Nano를 사용해 배달 주문 메시지에서 이름·주소·전화번호를 추출하는 기능을 온디바이스로 구현했다. 전통 ML처럼 대규모 학습 데이터와 전문 모델링을 준비하는 대신, 약 200개의 고품질 평가 예시와 few-shot prompting으로 hallucination을 줄이는 방향으로 튜닝했다. 결과적으로 배달 주문 완료 시간이 24% 줄고, 신규 사용자 전환율은 45%, 기존 사용자 전환율은 6% 증가했다. 피크 시즌에는 AI 기반 주문이 200% 이상 늘었다. 실무 포인트는 온디바이스 AI도 평가셋과 fallback을 갖춰야 production 품질에 가까워진다는 점이다.

    '
  points:
  - ML Kit Prompt API + Gemini Nano로 자연어 주문 메시지 entity extraction
  - 평가 예시 약 200개 + few-shot prompting으로 hallucination 최소화
  - 주문 완료 시간 24% 감소, 신규 전환율 45% 증가, 피크 AI 주문 200%+ 증가
  source: https://developer.android.com/blog/posts/kakao-mobility-uses-gemini-nano-on-device-to-reduce-costs-and-boost-call-conversion-by-45
- category: ai
  title: Firebase AI Logic Hybrid API — Android AI 추론을 온디바이스·클라우드로 라우팅
  summary: 'Firebase AI Logic Hybrid API는 Android 앱에서 Gemini API 호출을 온디바이스와 클라우드 사이에 나누는 단일 인터페이스다. onDeviceConfig의 inference mode로 PREFER_ON_DEVICE, PREFER_IN_CLOUD, ONLY_ON_DEVICE, ONLY_IN_CLOUD를 고를 수 있고, Gemini Nano 같은 온디바이스 모델이 없거나 요청을 지원하지 않을 때 클라우드 fallback을 설계할 수 있다. 공식 문서는 이 기능을 experimental로 표시하므로 SLA나 호환성 보장을 전제하면 안 된다. 실무 포인트는 ''항상 로컬''이 아니라 개인정보·오프라인·비용이 중요한 요청은 로컬 우선, 고성능·범용성이 필요한 요청은 클라우드 우선으로 정책을 명시하는 것이다.

    '
  points:
  - onDeviceConfig로 PREFER/ONLY 온디바이스·클라우드 모드 선택
  - 온디바이스 모델 미지원 시 클라우드 fallback으로 도달 범위 확대
  - 'Experimental 기능: SLA·호환성 변경 가능성을 운영 리스크로 반영'
  source: https://developer.android.com/ai/hybrid
- category: ai
  title: ADK for Android 0.1.0 — 앱 안에서 온디바이스·클라우드 에이전트를 조율
  summary: 'Google은 2026년 5월 ADK for Kotlin과 함께 ADK for Android 0.1.0을 공개했다. Android용 ADK는 앱 내부에서 AI 에이전트를 만들고, Gemini Nano 같은 온디바이스 모델과 클라우드 모델을 함께 쓰는 하이브리드 오케스트레이션을 목표로 한다. 예시 흐름은 클라우드 orchestrator가 사용자 문제를 이해하고, 예약 확인처럼 민감한 로컬 문서 접근이 필요한 작업은 온디바이스 subagent에 위임하는 방식이다. 개발자는 `com.google.adk:google-adk-kotlin-core-android:0.1.0` 의존성으로 시작하며, 핵심은 에이전트가 모든 데이터를 클라우드로 보내지 않도록 역할과 데이터 경계를 먼저 나누는 것이다.

    '
  points:
  - 'ADK for Android: 앱 내부 에이전트 + 온디바이스 최적화'
  - 클라우드 orchestrator가 민감 작업을 로컬 subagent에 위임
  - '시작 의존성: google-adk-kotlin-core-android:0.1.0'
  source: https://developers.googleblog.com/adk-kotlin-android-building-ai-agents/
- category: ai
  title: ML Kit Prefix Caching — 반복 프롬프트를 캐시해 Gemini Nano 지연 줄이기
  summary: 'ML Kit Prompt API의 Prefix Caching은 반복되는 프롬프트 앞부분을 static prefix로 분리하고, 매번 바뀌는 내용만 dynamic suffix로 보내 온디바이스 LLM의 중간 상태를 재사용한다. 문서 기준 Pixel 9 예시에서 300토큰 prefix+50토큰 suffix는 0.82초에서 cache hit 0.45초, 1000토큰 prefix+100토큰 suffix는 2.11초에서 0.5초로 줄었다. 단, 현재 experimental이고 일부 기기에서만 가능하며 text-only 입력만 지원한다. 앱 설계 관점에서는 긴 시스템 지침, 고정 분류 기준, 반복 템플릿을 prefix로 빼고 이미지 입력이나 민감 prefix 저장 정책은 별도로 검토해야 한다.

    '
  points:
  - 반복 promptPrefix + 매번 바뀌는 dynamicSuffix로 중간 LLM 상태 재사용
  - 'Pixel 9 예시: 2.11초 → cache hit 0.5초(1000+100토큰)'
  - Experimental·일부 기기·text-only 제한, 캐시 저장 정책 검토 필요
  source: https://developers.google.com/ml-kit/genai/prompt/android/prefix-caching
- category: ai
  title: GitHub third-party agent security validation — Codex·Claude PR도 CodeQL·의존성·secret 검사
  summary: 'GitHub는 2026년 6월 9일 third-party coding agents 보안 검증을 일반 제공한다고 발표했다. Claude나 OpenAI Codex처럼 저장소에서 직접 기능 구현, 버그 수정, 테스트 보강을 수행하는 에이전트가 만든 코드도 Copilot cloud agent와 같은 자동 보안 검증을 받는다. 검증은 CodeQL 취약점 분석, GitHub Advisory Database 기반 신규 의존성 확인, secret scanning으로 API 키·토큰 노출 탐지를 포함한다. 설정은 기존 Copilot validation 설정을 따르고 Advanced Security 라이선스가 필요 없다고 설명된다. 실무 포인트는 에이전트 산출물을 신뢰하는 대신, PR 완료 전 자동 검증을 기본 안전망으로 두는 것이다.

    '
  points:
  - third-party coding agents 코드도 Copilot cloud agent와 같은 보안 검증 적용
  - CodeQL, GitHub Advisory Database, secret scanning으로 신규 위험 확인
  - Copilot 설정을 따르며 Advanced Security 라이선스 없이 사용 가능
  source: https://github.blog/changelog/2026-06-09-security-validation-for-third-party-coding-agents/
- category: ai
  title: Google Agents CLI — 코딩 에이전트에게 Agent Platform 빌드·평가·배포 명령을 주입
  summary: 'Google은 2026년 4월 Agents CLI in Agent Platform을 공개했다. 이 CLI는 Gemini CLI, Claude Code, Cursor 같은 코딩 에이전트가 Google Cloud Agent Platform, Cloud Run, A2A Integration에 접근할 수 있는 machine-readable 경로를 제공한다. `uvx google-agents-cli setup`으로 bundled skills와 API reference를 주입하고, `agents-cli create`, `eval run`, `eval compare`, `infra`, `deploy`, `publish` 같은 명령으로 에이전트 생성부터 평가와 배포까지 이어간다. 실무 포인트는 에이전트에게 문서를 통째로 읽히는 대신, 검증 가능한 CLI 명령과 평가 하네스를 주어 local-to-cloud 전환을 반복 가능하게 만드는 것이다.

    '
  points:
  - '`uvx google-agents-cli setup`으로 코딩 에이전트용 skills·API reference 주입'
  - '`eval run`·`eval compare`로 배포 전 trajectory와 품질 비교'
  - '`infra`·`deploy`·`publish`로 Agent Runtime/Cloud Run/Gemini Enterprise까지 연결'
  source: https://developers.googleblog.com/agents-cli-in-agent-platform-create-to-production-in-one-cli/
- category: ai
  title: Copilot SDK GA — 에이전트 루프를 제품 안에 심는 여섯 언어 SDK
  summary: 'GitHub Copilot SDK는 2026년 6월 2일 GA가 됐다. Node.js/TypeScript, Python, Go, .NET, Rust, Java 여섯 언어에서 사용할 수 있고, 제품 안에 Copilot 에이전트 세션을 직접 넣는 용도다. 핵심 기능은 에이전트가 자율 호출할 custom tools와 MCP 연결, 시스템 프롬프트 섹션 단위 커스터마이징, OpenTelemetry tracing, GitHub OAuth·GitHub Apps·환경 토큰·BYOK 인증, cloud/remote session, hook system이다. 실무 포인트는 채팅 UI 하나를 붙이는 수준이 아니라, 권한·도구·추적·세션을 제품 아키텍처 일부로 설계해야 한다는 점이다.

    '
  points:
  - 'GA 지원 언어: Node/TS, Python, Go, .NET, Rust, Java'
  - custom tools, MCP, prompt section editing, OpenTelemetry tracing 제공
  - hook system으로 tool use·session·permission request를 가로챔
  source: https://github.blog/changelog/2026-06-02-copilot-sdk-is-now-generally-available/
- category: ai
  title: GitHub MCP Secret Scanning GA — 커밋 전 에이전트에게 노출 키를 찾게 하기
  summary: 'GitHub는 2026년 5월 5일 MCP Server의 secret scanning 기능을 GA로 전환했다. MCP 호환 IDE나 GitHub Copilot CLI 같은 AI coding agent 환경에서 현재 변경분을 검사해 API 키와 토큰 같은 secret이 커밋이나 PR 전에 들어가지 않게 막는 방식이다. GA 버전은 기존 repository나 organization의 push protection customization을 존중해 탐지와 bypass 동작을 일관되게 맞춘다. 실무 포인트는 보안 검사를 CI 마지막 단계로 미루지 말고, 에이전트가 파일을 고치는 같은 루프 안에서 "현재 diff를 secret scanning 해 달라"고 호출하는 것이다.

    '
  points:
  - GitHub MCP Server에서 secret scanning이 GA
  - MCP 호환 IDE·Copilot CLI 에이전트가 커밋 전 현재 변경분 검사
  - 기존 push protection customization을 반영해 탐지·bypass 정책 일관화
  source: https://github.blog/changelog/2026-05-05-secret-scanning-with-github-mcp-server-is-now-generally-available/
- category: ai
  title: Codex Plugins·Sites·Annotations — 코딩 에이전트에서 역할별 업무 에이전트로 확장
  summary: 'OpenAI는 2026년 6월 2일 Codex에 역할별 plugins, Sites, annotations를 추가한다고 발표했다. 역할별 plugin은 앱·스킬·지시문·워크플로우를 묶어 분석가, 디자이너, 영업, 투자, 뱅킹 같은 업무에 맞춘 에이전트 표면을 제공한다. 공개된 6개 plugin 묶음은 62개 앱과 110개 스킬을 포함한다고 설명됐다. Sites는 Codex 결과를 URL로 공유 가능한 interactive website/app 형태로 만들고, annotations는 결과물을 제자리에서 고치게 하는 피드백 표면이다. 실무 포인트는 AI 코딩 도구의 다음 경쟁축이 모델 성능만이 아니라 역할별 컨텍스트 패키징과 결과물 협업 UX라는 점이다.

    '
  points:
  - 'role-specific plugin: apps + skills + instructions + workflows 묶음'
  - 초기 6개 plugin에 62개 앱, 110개 스킬 포함
  - Sites는 URL 공유 결과물, annotations는 결과물 위 직접 피드백
  source: https://openai.com/index/codex-for-every-role-tool-workflow/
- category: ai
  title: Google Colab CLI — 코딩 에이전트에게 GPU 런타임을 빌려주는 터미널 브리지
  summary: 'Google Colab CLI는 로컬 터미널과 원격 Colab 런타임을 잇는 명령줄 도구다. 핵심은 개발자뿐 아니라 터미널 접근이 있는 AI 에이전트가 `colab --gpu T4`, `colab exec`, `colab download`, `colab log` 같은 명령으로 GPU/TPU 런타임을 요청하고, 로컬 파이썬 스크립트를 원격에서 실행하고, 모델·로그·노트북 산출물을 다시 가져올 수 있다는 점이다. Google은 Colab CLI에 에이전트용 skill file도 함께 제공해 Claude Code, Codex, Gemini류 터미널 에이전트가 사용법을 매번 추측하지 않게 한다. 실무 포인트는 파인튜닝·평가처럼 로컬 노트북에는 무겁고 클라우드 IaC에는 과한 작업을 에이전트 루프 안에서 짧게 원격 실행할 수 있다는 것이다.

    '
  points:
  - 로컬 터미널 -> Colab GPU/TPU 런타임을 CLI로 연결
  - '`colab exec`로 로컬 ML 스크립트를 원격 실행, `colab download/log`로 산출물 회수'
  - '에이전트용 skill file 제공: 터미널 AI가 Colab 사용법을 컨텍스트로 받음'
  source: https://developers.googleblog.com/introducing-the-google-colab-cli/
- category: ai
  title: Copilot 1M 컨텍스트·추론 레벨 — 큰 창은 기본값이 아니라 고비용 모드
  summary: 'GitHub Copilot은 2026년 6월 4일 더 큰 컨텍스트 창과 configurable reasoning levels를 공개했다. 100만 토큰 컨텍스트는 큰 코드베이스, 긴 문서, 복잡한 다중 파일 작업을 한 세션에 담기 위한 장치이고, 추론 레벨은 속도와 깊이를 작업 난이도에 맞춰 조절하는 손잡이다. 중요한 반대편은 비용이다. GitHub는 큰 컨텍스트 창이나 높은 추론 레벨을 선택하면 상호작용당 AI credits가 더 많이 든다고 설명하며, 일상 작업에는 기본 컨텍스트와 기본 추론을 권한다. 실무 포인트는 "항상 최대"가 아니라, 아키텍처 변경, 장기 디버깅, 다중 파일 리팩터링처럼 정보 손실 비용이 큰 작업에만 큰 창과 깊은 추론을 켜는 운영 규칙을 정하는 것이다.

    '
  points:
  - '1M 컨텍스트: 큰 코드베이스·긴 문서·복잡한 다중 파일 작업용'
  - 'reasoning level: 속도와 깊이를 작업 난이도에 맞춰 조절'
  - 큰 컨텍스트·높은 추론은 AI credits를 더 쓰므로 기본값으로 쓰지 않기
  source: https://github.blog/changelog/2026-06-04-larger-context-windows-and-configurable-reasoning-levels-for-github-copilot/
- category: ai
  title: Copilot Sandboxes — 에이전트 명령 실행을 로컬·클라우드 격리층에 넣기
  summary: 'GitHub Copilot의 cloud/local sandboxes public preview는 에이전트가 실행하는 셸 명령을 격리된 환경에 넣는 기능이다. 로컬 sandbox는 Copilot CLI 세션 안에서 `/sandbox enable`로 켜고, 파일시스템·네트워크· 시스템 기능 접근을 제한한다. cloud sandbox는 `copilot --cloud`로 GitHub가 호스팅하는 일회성 Linux 환경에서 세션을 시작해 로컬 머신과 다른 세션에서 분리한다. GitHub 문서는 로컬 sandbox 정책을 Intune 같은 MDM으로 중앙 관리할 수 있고, cloud sandbox는 Azure Container Apps Sandboxes 위에 identity, policy, billing layer를 얹는다고 설명한다. 실무 포인트는 에이전트에게 명령 실행 권한을 줄 때 "믿기" 대신 쓰기 경로, 네트워크, 클라우드 실행 위치를 정책으로 좁히는 것이다.

    '
  points:
  - '로컬: `/sandbox enable`로 Copilot CLI 명령 실행을 제한'
  - '클라우드: `copilot --cloud`로 GitHub 호스팅 일회성 Linux sandbox 사용'
  - 파일시스템·네트워크·MDM 정책으로 에이전트 실행 범위를 명시
  source: https://github.blog/changelog/2026-06-02-cloud-and-local-sandboxes-for-github-copilot-now-in-public-preview/
- category: ai
  title: Copilot AI credits API — 에이전트 비용을 사람·팀 단위로 관측하기
  summary: 'GitHub는 2026년 6월 19일 Copilot usage metrics API의 user-level 리포트에 `ai_credits_used` 필드를 추가했다. 하루 또는 28일 단위로 각 사용자의 전체 Copilot 활동이 소비한 AI credits를 볼 수 있지만, GitHub가 설명한 성격은 청구서 원장이 아니라 adoption·budget planning을 위한 운영 지표다. 그래서 이 카드는 기존의 "사람 단위 관측"과 "팀 단위 예산 관리" 카드를 합친다. 중요한 질문은 누가 많이 썼느냐가 아니라, 어떤 팀의 어떤 에이전트 자동화·코드 리뷰·CLI 사용이 비용을 만들고 실제 가치로 이어졌는지다.

    '
  points:
  - '`ai_credits_used`: 사용자별 1일·28일 Copilot AI credits 소비량'
  - enterprise admin·organization owner가 REST API로 조회
  - 청구서가 아니라 채택률·예산 예측·워크플로 가치 판단을 위한 metrics signal
  source: https://github.blog/changelog/2026-06-19-ai-credits-consumed-per-user-now-in-the-copilot-usage-metrics-api/
- category: ai
  title: MAI-Code-1-Flash — Copilot 표면마다 작은 모델을 라우팅하기
  summary: 'GitHub는 Microsoft의 소형 코딩 모델 MAI-Code-1-Flash를 Copilot CLI, Copilot app, GitHub Chat, Visual Studio, GitHub Mobile, JetBrains, Eclipse, Xcode 등 여러 표면으로 확장한다고 공지했다. 기존 두 카드는 같은 공지를 "표면 전반 배치"와 "표면별 라우팅"으로 나눴지만, 실무 결론은 하나다. 짧은 설명, 반복 수정, 가벼운 CLI 질의처럼 대기시간과 비용이 중요한 작업은 경량 코딩 모델에 맡기고, 설계 변경이나 복잡한 디버깅은 강한 reasoning 모델로 올리는 정책을 제품/팀 단위로 정해야 한다.

    '
  points:
  - Microsoft 제공 Copilot용 small-tier coding model
  - CLI·앱·모바일·IDE 등 여러 Copilot 표면으로 확장
  - 가벼운 반복 작업은 경량 모델, 복잡한 판단은 강한 모델로 라우팅
  source: https://github.blog/changelog/2026-06-18-mai-code-1-flash-available-on-more-copilot-surfaces/
- category: ai
  title: Copilot 모델 폐기 일정 — 자동화 프롬프트의 모델명을 운영 자산으로 관리하기
  summary: 'GitHub는 2026년 6월 18일 Opus 4.6 (fast)를 2026년 6월 29일 Copilot 전 표면에서 폐기하고 Opus 4.8 (fast)를 대안으로 쓰라고 공지했다. 앞서 2026년 6월 2일에는 GPT-4.1도 Copilot Chat, inline edits, ask, agent mode, code completions에서 폐기하고 GPT-5.5를 대안으로 제시했다. 이 변경은 단순 릴리스 노트가 아니라 에이전트 운영 리스크다. 스크립트, 사내 문서, AGENTS.md, CI 프롬프트, 팀별 워크플로에 모델명을 하드코딩하면 어느 날 같은 자동화가 실패하거나 다른 품질·비용 특성으로 바뀔 수 있다. 모델명은 설정으로 빼고, 폐기일 전 검증 루틴을 두는 것이 안전하다.

    '
  points:
  - 'Opus 4.6 (fast): 2026-06-29 폐기 예정, 대안은 Opus 4.8 (fast)'
  - 'GPT-4.1: 2026-06-01 Copilot 전 표면에서 폐기, 대안은 GPT-5.5'
  - 모델명 하드코딩 대신 설정화·폐기일 전 검증 루틴 필요
  source: https://github.blog/changelog/2026-06-18-upcoming-deprecation-of-opus-4-6-fast/
- category: ai
  title: ML Kit APO — 온디바이스 Gemini Nano 프롬프트를 서버에서 자동 탐색하기
  summary: 'Android Developers Blog는 ML Kit GenAI Prompt API용 Automated Prompt Optimization(APO)을 소개했다. Android AICore는 공유 시스템 모델을 우선하므로 앱마다 LoRA adapter를 배포하는 방식은 운영 부담이 생길 수 있다. APO는 Vertex AI에서 서버 측 모델을 사용해 오류 패턴을 분석하고, 의미 지시문을 추출하고, 여러 후보 프롬프트를 병렬 테스트해 Gemini Nano v3용 시스템 지시문을 찾는다. 중요한 점은 최종 실행은 Android의 ML Kit GenAI API와 Gemini Nano 쪽에 남기면서, 품질 개선 탐색은 서버에서 자동화한다는 것이다. 온디바이스 AI 앱은 "프롬프트도 빌드 산출물"처럼 평가 데이터와 함께 관리해야 한다.

    '
  points:
  - 'APO: Vertex AI에서 Gemini Nano v3용 프롬프트 후보를 자동 탐색'
  - 오류 분석·semantic instruction distillation·병렬 후보 테스트
  - 온디바이스 실행을 유지하면서 프롬프트 품질 개선 루프를 운영
  source: https://developer.android.com/blog/posts/how-automated-prompt-optimization-unlocks-quality-gains-for-ml-kit-s-gen-ai-prompt-api
- category: ai
  title: ADK 장기 실행 에이전트 — 대화 기록 대신 상태 머신으로 재개하기
  summary: 'Google의 ADK 장기 실행 에이전트 튜토리얼은 며칠 동안 멈췄다 재개되는 업무를 대화 기록에 맡기지 말라고 설명한다. 핵심은 START, WELCOME_SENT, DOCUMENTS_SIGNED 같은 명시적 state machine을 만들고, 시스템 지시문이 현재 단계를 session state에서 읽게 하는 것이다. 각 tool call은 ToolContext.state를 갱신해 자동 checkpoint가 되고, 세션 저장소를 DatabaseSessionService(SQLite 또는 Cloud SQL)로 바꾸면 컨테이너 재시작 뒤에도 같은 단계에서 이어갈 수 있다. AI 에이전트 설계 포인트는 "모델이 기억한다"가 아니라 "워크플로 상태를 코드와 저장소가 소유한다"는 점이다.

    '
  points:
  - 대화 기록이 아니라 명시적 state machine이 진행 상태를 소유
  - ToolContext.state 갱신이 tool call마다 자동 checkpoint 역할
  - DatabaseSessionService로 SQLite/Cloud SQL에 세션을 영속화
  source: https://developers.googleblog.com/build-long-running-ai-agents-that-pause-resume-and-never-lose-context-with-adk/
- category: ai
  title: MCP Enterprise-Managed Auth — 커넥터 권한을 IdP로 중앙 관리하기
  summary: 'Anthropic은 2026년 6월 18일 Claude의 MCP connectors에 enterprise-managed authorization을 공개했다. 이전에는 관리자가 조직 커넥터를 켠 뒤 사용자마다 개별 OAuth 승인이 필요했지만, 새 방식은 관리자가 IdP에서 한 번 권한을 설정하고 사용자는 첫 로그인부터 커넥터 접근을 상속받는다. Okta가 launch identity provider이고 Asana, Atlassian, Canva, Figma, Granola, Linear, Supabase가 시작 MCP provider로 언급됐다. 실무 포인트는 MCP를 편의 기능이 아니라 권한 표면으로 보고, 그룹 스코프·빠른 토큰 만료·퇴사자 회수를 일반 SaaS 권한 관리와 같은 평면에 올리는 것이다.

    '
  points:
  - MCP connector 접근을 사용자별 OAuth가 아니라 IdP 그룹·역할로 provision
  - Okta 지원으로 시작, Asana·Atlassian·Figma·Linear·Supabase 등 provider 참여
  - 토큰 수명 단축과 deprovision 회수를 엔터프라이즈 권한 정책에 통합
  source: https://claude.com/blog/enterprise-managed-auth
- category: ai
  title: Claude WIF GA — 에이전트 자동화에서 정적 API 키 없애기
  summary: 'Claude Platform의 Workload Identity Federation(WIF)은 2026년 6월 17일 GA가 됐다. WIF는 정적 API 키 대신 요청 시점에 짧게 살아 있는 scoped credential을 발급하고, AWS IAM role, GCP/Kubernetes service account, Azure managed identity, GitHub Actions token, Okta 같은 OIDC 호환 identity provider와 연결된다. 적용 범위는 Claude API endpoints, first-party SDK, Claude Code 접근까지 포함된다. 에이전트 자동화에서는 API 키를 저장소·CI 변수·로컬 설정에 오래 보관하지 않고, workload별 service account와 audit log로 호출 주체를 분리할 수 있다는 점이 핵심이다.

    '
  points:
  - 정적 API key 대신 짧게 살아 있는 scoped credential을 요청 시 발급
  - AWS/GCP/Kubernetes/Azure/GitHub Actions/Okta 등 OIDC identity와 연동
  - workload별 service account·role·audit trail로 에이전트 호출 주체 분리
  source: https://claude.com/blog/workload-identity-federation
- category: ai
  title: A2UI + MCP Apps — 에이전트 UI를 iframe과 네이티브 렌더링 사이에서 설계하기
  summary: 'Google Developers Blog의 A2UI + MCP Apps 글은 에이전트 UI가 단순 텍스트를 넘어가면 두 선택지 사이에서 흔들린다고 설명한다. MCP Apps는 iframe 안에서 HTML/CSS/JavaScript로 자유롭게 만들 수 있지만, 호스트와 디자인·스크롤·보안 경계가 어긋날 수 있다. A2UI는 JSON payload로 무엇을 렌더링할지 선언하고 호스트가 네이티브 컴포넌트로 그려 일관성과 보안을 얻지만, 복잡한 클라이언트 로직에는 약하다. 실무 포인트는 "에이전트가 UI를 만든다"가 아니라, 표·폼·차트 같은 구조 데이터는 A2UI, 복잡한 상호작용은 MCP Apps, 혼합 화면은 두 방식을 조합하는 아키텍처 문제로 보는 것이다.

    '
  points:
  - 'MCP Apps: iframe 기반 자유도는 높지만 디자인·성능·보안 경계 비용이 있음'
  - 'A2UI: JSON 선언을 호스트 네이티브 UI로 렌더링해 일관성과 접근성을 얻음'
  - 구조 데이터·복잡한 앱·혼합 화면을 패턴별로 나눠 선택
  source: https://developers.googleblog.com/a2ui-and-mcp-apps/
- category: ai
  title: Jetpack Compose Adaptive Skill — Android 17 대화면 대응을 AI 워크플로로 고정하기
  summary: 'Android 17은 대화면 resizability를 더 강하게 요구하면서, Jetpack Compose adaptive skill을 함께 공개했다. 이 스킬은 일반 Android 레이아웃 팁이 아니라 AI-powered developer workflow다. NavigationSuiteScaffold로 모바일 bottom navigation과 대화면 navigation rail을 전환하고, Navigation 3 Scenes로 list-detail·supporting pane을 구성하며, Compose 1.11의 동적 레이아웃·trackpad/mouse 지원·window state 대응까지 점검하게 한다. AI+Android 관점의 핵심은 에이전트에게 "화면을 예쁘게 바꿔줘"가 아니라, Android 17 적응형 기준을 체크리스트 겸 실행 절차로 주는 것이다.

    '
  points:
  - Android 17의 adaptive-first 요구를 AI-powered developer workflow로 다룸
  - NavigationSuiteScaffold·Navigation 3 Scenes·Compose 1.11 동적 레이아웃을 점검
  - 에이전트 프롬프트를 대화면 기준과 테스트 가능한 작업 목록으로 접지
  source: https://android-developers.googleblog.com/2026/06/Android-17.html
- category: ai
  title: R8 Agent Skill — 난해한 keep rule 정리를 AI에게 맡기되 검증은 사람이 닫기
  summary: 'Android 17 메모리 효율 가이드는 R8 Configuration Analyzer와 함께 R8 Agent Skill을 언급한다. Analyzer는 obfuscation, optimization, shrinking 점수와 broad keep rule, redundant rule, unused rule을 보여주고, R8 Agent Skill은 Android Studio agent나 다른 AI 도구로 misconfiguration을 해결하고 규칙을 다듬는 흐름에 붙는다. 중요한 단서도 같이 있다. AI-driven skill의 insight는 기술 검증이 필요하다. 즉 R8 규칙은 앱 동작과 라이브러리 공개 API를 깨뜨릴 수 있으므로, 에이전트가 후보 패치를 만들고 Configuration Analyzer·릴리즈 빌드· 회귀 테스트가 최종 판정을 내려야 한다.

    '
  points:
  - Configuration Analyzer로 broad/redundant/unused keep rule을 먼저 드러냄
  - R8 Agent Skill은 misconfiguration 해결과 rule refinement 후보를 생성
  - AI 제안은 릴리즈 빌드·회귀 테스트·분석 점수로 반드시 기술 검증
  source: https://android-developers.googleblog.com/2026/06/prioritizing-memory-efficiency-steps-for-android-17.html
- category: ai
  title: Media3 AI Effects — 효과 이름이 아니라 디바이스별 실행 경로를 추상화하기
  summary: 'Google I/O 26 Android premium experiences 글은 Media3 AI Effects library를 예고했다. 목표는 Image & Video Enhance, Magic Eraser, Studio Sound 같은 프리미엄 AI 효과를 앱마다 따로 연결하는 것이 아니라, Media3가 unified interface를 제공하고 디바이스에 맞는 효율적이고 신뢰 가능한 경로 선택을 맡는 것이다. Android 개발자에게 중요한 점은 AI 미디어 기능을 모델 호출 한 번으로 보지 않는 것이다. CameraX 캡처, Media3 AI Effects 처리, Media3 Transformer 합성, CodecDB 기반 인코딩 권장까지 하나의 미디어 파이프라인으로 설계해야 폴더블·태블릿·칩셋 차이에서도 일관된 품질을 낼 수 있다.

    '
  points:
  - Media3 AI Effects는 Image/Video Enhance·Magic Eraser·Studio Sound용 unified interface를 지향
  - 효과 실행 경로 선택을 디바이스별 효율·신뢰성 문제로 추상화
  - CameraX→AI Effects→Transformer→CodecDB를 한 파이프라인으로 설계
  source: https://android-developers.googleblog.com/2026/06/building-premium-android-experiences-google-io-26.html
- category: ai
  title: agent-device — AI 에이전트에게 모바일 앱의 눈과 손을 주기
  summary: 'Callstack의 agent-device는 AI 에이전트가 iOS·Android 앱을 실제 기기, 시뮬레이터, 에뮬레이터에서 검증하도록 만든 CLI다. 핵심은 스크린샷을 매번 비전 모델에 던지는 것이 아니라, 접근성 트리 snapshot에서 `@e2` 같은 안정적인 ref를 얻고 click/fill/scroll/get/replay 명령으로 탐색을 재현 가능한 `.ad` 스크립트로 바꾸는 흐름이다. Android 쪽은 ADB와 Android snapshot helper를 통해 동작한다. 2026-06-21 같은 런에서 GitHub 2,868★, MIT 라이선스, 당일 업데이트를 확인했다. 모바일 AI 테스트의 포인트는 "에이전트가 앱을 봤다"가 아니라, 토큰 적은 구조화 상태와 deterministic replay로 검증 증거를 남기는 것이다.

    '
  points:
  - 접근성 트리 snapshot + semantic refs로 모바일 UI를 토큰 적게 읽음
  - open/click/fill/scroll/get/replay 명령을 `.ad` 스크립트로 재현
  - Android는 ADB + snapshot helper 백엔드로 실제 앱 검증 흐름에 연결
  source: https://github.com/callstack/agent-device
- category: ai
  title: Copilot Code Review MCP·Skills — 리뷰가 diff 밖 컨텍스트를 읽게 하기
  summary: 'GitHub는 Copilot code review에 MCP 서버와 agent skills를 붙여 리뷰가 diff만 보지 않게 하는 흐름을 공개했다. 저장소 설정의 Copilot MCP servers에 JSON 설정과 인증 토큰을 넣고, `.github/skills/code-review` 같은 리뷰 지향 스킬을 두면 PR 설명의 이슈 키·incident ID·내부 규칙 같은 신호를 따라 외부 컨텍스트를 가져올 수 있다. Medium review tier는 더 깊은 분석을 제공하지만 AI Credits를 더 쓴다. 실무 포인트는 "AI 리뷰어에게 더 세게 봐달라"가 아니라, 조직 규칙·운영 도구·비용 등급을 리뷰 입력으로 명시해 반복 질문과 팀별 편차를 줄이는 것이다.

    '
  points:
  - MCP 서버로 이슈·incident·내부 도구 컨텍스트를 리뷰에 연결
  - '`.github/skills/code-review/SKILL.md`로 리뷰 기준을 저장소 안에 둠'
  - Low/Medium review tier를 코드 중요도와 AI Credits 예산에 맞춰 선택
  source: https://github.blog/changelog/2026-06-02-shape-copilot-code-review-around-your-team/
- category: ai
  title: Copilot Auto Mode — 모델 선택을 프롬프트가 아니라 라우터에 맡기기
  summary: 'GitHub Copilot Chat의 auto model selection은 2026년 6월 17일 github.com과 GitHub mobile app에서 모든 Copilot plan에 GA로 열렸다. 사용자가 매번 Claude Sonnet, GPT-5.4 계열, Haiku 같은 모델명을 고르는 대신, Copilot이 요청 복잡도와 실시간 가용성을 보고 모델을 라우팅한다. 응답에 어떤 모델이 쓰였는지 확인할 수 있고, 사용자·관리자 model policy를 존중하며, paid subscriber에게는 auto 사용 토큰이 10% 할인된다. 개발팀 관점의 핵심은 모델명을 자동화 스크립트의 상수처럼 박지 말고, 단순 질의는 auto, 재현 가능한 평가나 규제 워크플로는 고정 모델처럼 운영 모드를 분리하는 것이다.

    '
  points:
  - 요청 복잡도와 실시간 가용성에 따라 모델을 동적으로 라우팅
  - 사용된 모델은 확인 가능하고 관리자 model policy를 존중
  - 일반 채팅은 auto, 평가·회귀 자동화는 고정 모델로 분리
  source: https://github.blog/changelog/2026-06-17-auto-mode-in-copilot-chat-available-for-all-users/
- category: ai
  title: Codex 안전 운영 — 키 파일보다 OS keyring과 워크스페이스 고정
  summary: 'OpenAI의 Codex 안전 운영 글은 코딩 에이전트를 빠르게 쓰는 방법보다, 조직 안에서 누가 어떤 권한으로 실행하는지 고정하는 방법을 강조한다. 예시는 CLI auth와 MCP OAuth credentials를 OS keyring에 저장하고, 로그인 방식을 ChatGPT로 강제하며, 특정 ChatGPT enterprise workspace에 접근을 묶는다. 그러면 Codex 활동이 workspace-level control과 compliance log에 연결된다. 실무 포인트는 Codex를 개인 토큰이 든 로컬 도구로 방치하지 않고, MCP 권한·CLI 로그인·감사 로그를 같은 보안 경계로 묶어 에이전트 실행 주체를 추적 가능하게 만드는 것이다.

    '
  points:
  - '`cli_auth_credentials_store`와 `mcp_oauth_credentials_store`를 keyring으로 설정'
  - '`forced_login_method`와 workspace ID로 조직 계정 경계를 고정'
  - MCP 권한과 Codex 실행 로그를 compliance 관측 대상으로 올림
  source: https://openai.com/index/running-codex-safely/
- category: ai
  title: Agents SDK Sandbox — 에이전트 실행 환경을 코드보다 먼저 설계하기
  summary: 'OpenAI는 2026년 4월 Agents SDK에 native sandbox execution을 추가했다고 설명했다. 핵심은 모델에게 파일·명령·패치 도구를 그냥 주는 것이 아니라, controlled workspace와 Manifest로 입력 디렉터리, 출력 위치, 외부 저장소 마운트를 명시하는 것이다. Blaxel, Cloudflare, Daytona, E2B, Modal, Runloop, Vercel 같은 샌드박스 제공자를 붙일 수 있고, agent state를 외부화하면 컨테이너가 만료돼도 snapshot과 rehydration으로 재개할 수 있다. 실무 포인트는 "에이전트가 코드를 실행한다"가 아니라, credential이 있는 harness와 모델 생성 코드가 도는 compute를 분리해 prompt injection·exfiltration 피해를 줄이는 것이다.

    '
  points:
  - Manifest로 입력·출력·마운트 구조를 선언해 작업공간을 예측 가능하게 만듦
  - built-in sandbox provider와 bring-your-own sandbox를 모두 지원
  - harness와 compute를 분리해 credential 노출과 컨테이너 장애 리스크를 낮춤
  source: https://openai.com/index/the-next-evolution-of-the-agents-sdk/
- category: ai
  title: ChatGPT Enterprise 사용량 분석 — Codex 비용도 운영 지표로 보기
  summary: 'OpenAI는 2026년 6월 18일 ChatGPT Enterprise에 credit usage analytics와 업데이트된 spend controls를 공개했다. Global Admin Console은 ChatGPT와 Codex credit usage를 한 화면에 묶고, 사용자·제품·모델별 credit spend와 usage trend를 보여준다. 같은 데이터를 unified Cost API로 가져가 내부 분석 시스템에 연결할 수도 있다. 관리자는 workspace 기본 한도, 그룹별 한도, 개인별 override를 설정하고, 사용자는 남은 credit과 요청 사유를 함께 볼 수 있다. 에이전트 운영에서 중요한 점은 비용을 사후 청구서가 아니라 adoption, 모델 선택, 자동화 범위 조정에 쓰는 관측 신호로 다루는 것이다.

    '
  points:
  - Global Admin Console에서 ChatGPT·Codex credit usage를 사용자·제품·모델별로 분해
  - unified Cost API로 사내 비용 분석과 연결 가능
  - workspace/group/user 한도를 나눠 에이전트 사용량을 업무 중요도에 맞게 제어
  source: https://openai.com/index/chatgpt-enterprise-spend-controls/
- category: ai
  title: Google Pay & Wallet MCP — 도메인 API 통합을 에이전트 도구로 감싸기
  summary: 'Google Pay & Wallet Developer MCP server는 결제·패스 통합에 필요한 문서, 계정 상태, 검증, 운영 지표를 AI 개발 도구가 직접 조회하게 하는 공식 MCP 사례다. search_documentation 도구는 Google Pay & Wallet 공식 문서에서 RAG로 답과 코드 샘플을 가져오고, 다른 도구는 merchant identifier, pass class 목록, Wallet pass JWT/JSON 검증, 성능 지표와 오류 추세, Google Pay API integration 생성까지 IDE 안에서 다루게 한다. 개발자 카드로 볼 포인트는 "MCP 서버를 하나 더 붙인다"가 아니라, 일반 API 문서 검색과 계정별 실제 상태 확인과 검증기를 한 도메인 서버로 묶어 LLM 답변을 최신 문서와 운영 데이터에 접지하는 것이다.

    '
  points:
  - 문서 RAG, 계정·통합 상태 조회, Wallet pass JWT/JSON 검증을 한 MCP 서버로 제공
  - 성능 지표·오류 추세까지 IDE의 AI assistant가 확인 가능
  - 도메인 API 통합에서 MCP는 문서 검색보다 account-aware 검증 계층에 가까움
  source: https://developers.googleblog.com/supercharge-your-integration-workflow-with-the-google-pay-wallet-developer-mcp-server/
- category: ai
  title: AI Edge Gallery MCP — 온디바이스 모델에 작은 도구 설명만 주기
  summary: 'Google AI Edge Gallery는 Android 앱에서 MCP over Streamable HTTP를 실험 기능으로 지원한다. 사용자가 MCP URL을 등록하면 앱이 tool definition과 resource schema를 온디바이스 모델의 system prompt에 가져오고, Gemma 4가 어떤 도구가 필요한지 로컬에서 판단한 뒤 MCP 서버를 호출한다. Google은 on-device model의 context window가 서버 모델보다 작으므로 MCP tool description은 짧게, 반환 데이터는 긴 본문보다 작은 snippet으로 유지하라고 권한다. AI+Android 설계 포인트는 프라이버시 좋은 로컬 추론과 외부 도구 호출을 같이 쓰려면, 모델 크기보다 tool schema와 응답 payload를 모바일 컨텍스트 예산에 맞춰 설계해야 한다는 점이다.

    '
  points:
  - Android AI Edge Gallery가 MCP over Streamable HTTP를 실험 지원
  - 도구 선택 reasoning은 폰 안의 Gemma 4가 하고, 실행은 MCP 서버가 담당
  - 모바일 온디바이스 모델에는 짧은 tool description과 작은 응답 snippet이 중요
  source: https://developers.googleblog.com/a-smarter-google-ai-edge-gallery-mcp-integration-notifications-and-session-continuity/
- category: ai
  title: Copilot App GA — IDE 밖에서도 같은 에이전트 루프 유지하기
  summary: 'GitHub Copilot app은 2026년 6월 18일 iOS와 Android에서 GA가 되었고, 채팅과 코드 질문, 저장소·이슈·PR 컨텍스트 조회, voice input, image upload, local file attachment를 지원한다. 같은 글은 Copilot Spaces와 GitHub MCP server 연결도 언급해, 모바일 표면이 단순 Q&A 앱이 아니라 개발 컨텍스트를 들고 다니는 에이전트 입구가 됐음을 보여준다. 실무 포인트는 "폰으로 코딩한다"가 아니라, 이동 중 분류·리뷰·질문 같은 낮은 위험 작업은 모바일에서 이어가고, 실제 파일 변경과 검증은 IDE·CI 같은 재현 가능한 환경으로 넘기는 작업 경계를 정하는 것이다.

    '
  points:
  - iOS·Android GA, 채팅·voice input·image upload·file attachment 지원
  - 저장소·이슈·PR 컨텍스트와 Copilot Spaces/MCP 연결을 모바일에서 사용
  - 모바일은 triage·리뷰·질문, 변경·검증은 재현 가능한 개발 환경으로 분리
  source: https://github.blog/changelog/2026-06-18-github-copilot-app-is-generally-available-on-ios-and-android/
- category: ai
  title: Copilot Agent Tasks API — 에이전트 작업을 UI 이벤트가 아니라 리소스로 다루기
  summary: 'GitHub은 2026년 6월 19일 Copilot coding agent tasks용 REST API를 public preview로 공개했다. API는 저장소 안에서 task를 만들고, 진행 중 task 목록과 상태를 조회하며, 결과 PR을 추적하게 해준다. 이것은 코딩 에이전트 실행을 채팅창의 일회성 버튼이 아니라 queue, status, PR output을 가진 운영 리소스로 다루게 만든다. 개발팀 관점의 핵심은 자동화를 붙일 때 에이전트에게 바로 쓰기 권한을 넓히는 것이 아니라, 어떤 task가 언제 생성됐고 어떤 PR로 끝났는지 관측 가능한 API 표면을 먼저 확보하는 것이다.

    '
  points:
  - REST API로 Copilot coding agent task 생성·목록·상태·결과 PR 조회
  - 채팅 이벤트가 아니라 queue와 lifecycle이 있는 작업 리소스로 모델링
  - 자동화 전 관측성·권한 경계·PR 추적을 먼저 설계해야 함
  source: https://github.blog/changelog/2026-06-19-github-copilot-coding-agent-tasks-rest-api-now-available-in-public-preview/
- category: ai
  title: Copilot Automations — 클라우드 에이전트에게 반복 유지보수를 맡기는 법
  summary: 'GitHub은 2026년 6월 20일 Copilot coding agent의 automations public preview를 공개했다. 사용자는 자연어로 예약 작업을 만들 수 있고, Copilot은 GitHub Actions처럼 repository secrets와 hosted runner를 이용해 정해진 주기마다 에이전트 작업을 실행한다. 예시는 매주 TODO comments 정리, dependency update, failing tests 조사처럼 반복 유지보수에 가깝다. 교육적 포인트는 에이전트 자동화가 cron을 대체한다는 뜻이 아니라, 반복 작업을 "명령 실행"이 아닌 issue/PR 산출물과 review gate가 있는 maintenance loop로 설계해야 한다는 점이다.

    '
  points:
  - 자연어로 예약된 Copilot coding agent 작업을 만들 수 있는 public preview
  - repository secrets와 hosted runner를 사용해 GitHub Actions와 비슷한 실행 경계 제공
  - 반복 유지보수는 issue/PR 산출물과 review gate가 있는 루프로 설계
  source: https://github.blog/changelog/2026-06-20-github-copilot-coding-agent-automations-in-public-preview/
- category: ai
  title: VS Code Agents Window — 채팅 패널이 아니라 에이전트 작업대
  summary: 'Visual Studio Code의 2026년 5월 Copilot 릴리스는 Agents Window, plan mode, remote cloud agent sessions, custom instructions, terminal auto-approval controls를 함께 묶어 보여준다. 의미 있는 변화는 AI가 사이드바에서 답만 하는 형태를 넘어, 계획을 세우고 원격 세션에서 작업하며 터미널 명령 승인 정책을 따르는 개발 작업대로 들어온다는 점이다. 실무에서는 "에이전트가 알아서 해준다"가 아니라, plan mode로 변경 의도를 먼저 고정하고 custom instructions와 terminal approval rule로 위험한 실행 경계를 좁힌 뒤 검증 가능한 단위로 결과를 받는 운영 습관이 필요하다.

    '
  points:
  - Agents Window와 plan mode로 에이전트 작업을 별도 표면에서 관리
  - remote cloud agent sessions와 custom instructions로 작업 컨텍스트를 유지
  - terminal auto-approval controls로 명령 실행 경계를 정책화
  source: https://github.blog/changelog/2026-06-12-github-copilot-in-visual-studio-code-may-releases/
- category: ai
  title: Copilot Chronicle — 에이전트 세션 기록을 팀 지식으로 바꾸기
  summary: 'GitHub은 Copilot CLI의 `/chronicle`이 Copilot cloud agent, code review, Copilot app, VS Code, JetBrains 세션까지 더 넓게 읽게 됐다고 밝혔다. Chronicle은 개인 에이전트 세션 기록에서 standup summary, personalized tips, custom instructions를 만들어 이전 작업 맥락을 다시 쓰게 한다. 로컬 세션은 GitHub 계정에 동기화되어 저장소 Agents 탭에서 함께 볼 수 있고, 기본은 개인 비공개이며 필요하면 view-only 형태로 공유할 수 있다. 실무 포인트는 "채팅 로그 저장"이 아니라, 에이전트가 만든 결정·실패·검증 흔적을 다음 세션의 지시문과 팀 공유 자료로 승격시키는 운영 루프를 설계하는 것이다.

    '
  points:
  - '`/chronicle`이 여러 Copilot 표면의 세션 기록을 요약·팁·custom instructions로 변환'
  - 로컬 세션도 GitHub 계정과 저장소 Agents 탭에 동기화 가능
  - 기록은 기본 비공개, 필요할 때 view-only 공유로 팀 맥락 제공
  source: https://github.blog/changelog/2026-06-02-gain-insights-across-your-agent-sessions-with-chronicle/
- category: ai
  title: Copilot BYOK 모델 — 기업 모델 정책을 CLI의 /model 선택지로 내리기
  summary: 'GitHub은 2026년 6월 17일 Copilot CLI가 enterprise bring your own key 모델을 지원한다고 발표했다. 관리자가 외부 제공자 모델을 설정하면 개발자는 CLI의 `/model` picker에서 해당 모델을 고를 수 있고, 별도로 개인 사용자는 클라이언트 쪽에서 로컬 모델이나 외부 모델도 구성할 수 있다. 중요한 변화는 모델 선택이 개인 취향 프롬프트가 아니라 기업 정책·키 관리·비용 구조와 연결된 실행 옵션이 된다는 점이다. 에이전트 운영에서는 모델명을 문서에 박아두기보다, 허용 모델 목록과 업무별 선택 기준을 관리 표면에서 내려보내고 감사 가능한 방식으로 쓰게 해야 한다.

    '
  points:
  - enterprise admin이 설정한 외부 제공자 모델이 Copilot CLI `/model` picker에 노출
  - 개인 사용자는 클라이언트 쪽 로컬 모델·외부 모델도 구성 가능
  - 모델 선택을 프롬프트 상수가 아니라 정책·키·비용 관리 대상으로 다뤄야 함
  source: https://github.blog/changelog/2026-06-17-copilot-cli-supports-enterprise-bring-your-own-key-byok-models/
- category: ai
  title: Copilot Bypass Controls — yolo 모드를 조직 정책으로 끄기
  summary: 'GitHub은 enterprise-managed settings에 첫 governance capability로 `disableBypassPermissionsMode`를 추가했다. 관리자가 enterprise-managed `settings.json`에 이 값을 `disable`로 두면 Copilot CLI와 VS Code가 permission prompt를 자동으로 건너뛰는 auto-approve, 이른바 yolo mode를 막을 수 있다. 설정은 `.github-private` 기반 관리 저장소에서 배포되고, VS Code 1.122 이상은 해당 정책을 따른다. 개발팀 관점의 핵심은 에이전트 속도보다 실행 권한 경계를 먼저 표준화하는 것이다. 자동 명령 승인은 개인 편의 기능이 아니라 보안·감사 정책으로 통제해야 할 운영 리스크다.

    '
  points:
  - '`disableBypassPermissionsMode: disable`로 Copilot CLI·VS Code의 자동 승인 우회를 차단'
  - enterprise-managed settings와 `.github-private` 관리 저장소로 정책 배포
  - 에이전트 명령 실행은 개인 습관이 아니라 조직 governance 설정으로 관리
  source: https://github.blog/changelog/2026-06-17-enterprise-managed-settings-now-support-bypass-permission-controls/
- category: ai
  title: Codex 자기개선 루프 — 운영 피드백을 eval로 바꿔 다시 고치기
  summary: 'OpenAI와 Thrive Holdings는 Tax AI 사례에서 Codex를 이용한 self-improving agent 패턴을 공개했다. 핵심 구조는 전문가 피드백, production traces, Codex-driven eval iteration 세 가지다. Crete 참여 회계법인 네트워크에서 파일럿 동안 7,000건의 세무 신고를 처리했고, 작성 시간을 약 3분의 1 줄이며 최대 97% 정확도와 약 50% 처리량 증가를 보고했다. 더 중요한 교육 포인트는 숫자보다 루프다. 현업 전문가의 수정이 실패 신호가 되고, 제품 trace가 재현 가능한 eval로 바뀌며, Codex가 그 eval을 넘기도록 제품을 고치는 구조를 만들면 배포 후 실패가 수동 티켓이 아니라 지속 개선 재료가 된다.

    '
  points:
  - '구조: practitioner feedback + production traces + Codex-driven eval iteration'
  - '파일럿: 7,000건 세무 신고 처리, 최대 97% 정확도와 약 50% 처리량 증가 보고'
  - 운영 실패를 trace와 eval로 보존해야 에이전트가 안전하게 자기개선할 수 있음
  source: https://openai.com/index/building-self-improving-tax-agents-with-codex/
- category: ai
  title: Ona + Codex — 오래 걸리는 에이전트 작업은 실행 장소가 제품이다
  summary: 'OpenAI는 2026년 6월 11일 Ona 인수 계획을 발표하며, Codex를 단일 노트북·단일 세션에 묶인 도구에서 보안·거버넌스가 있는 지속 실행 환경으로 확장하겠다고 밝혔다. 핵심은 모델 성능만이 아니라 에이전트가 몇 시간 또는 며칠 동안 접근할 도구, 시스템, 컨텍스트, 로그, credential scope를 어디서 통제하느냐다. 개발팀이 배울 점은 "코딩 에이전트를 클라우드에서 돌린다"가 아니라, 장시간 작업을 맡길수록 sandbox, 리뷰 게이트, 활동 로그, 데이터 경계를 먼저 설계해야 한다는 점이다. 에이전트의 생산성은 프롬프트보다 신뢰할 수 있는 작업공간에서 결정된다.

    '
  points:
  - Ona는 Codex에 secure, persistent execution 환경을 붙이는 방향
  - 장시간 에이전트 작업은 도구 접근·로그·credential scope가 핵심 설계 대상
  - 모델 선택보다 먼저 실행 장소와 governance 경계를 정해야 함
  source: https://openai.com/index/openai-to-acquire-ona/
- category: ai
  title: AgentKit 종료 공지 — 시각 빌더보다 코드로 남는 에이전트가 오래간다
  summary: 'OpenAI는 AgentKit 글에 2026년 6월 3일 업데이트를 붙여 Agent Builder와 Evals 제품을 단계적으로 종료한다고 공지했다. 2026년 11월 30일 이후 OpenAI 플랫폼에서 사용할 수 없으며, 코드로 유지해야 하는 워크플로는 Agents SDK를 권장한다. 이 카드는 특정 제품 종료 소식보다 운영 교훈이 중요하다. 에이전트 워크플로가 실험 단계를 지나 반복 운영 자산이 되면, 화면에서 만든 플로우보다 버전 관리되는 코드, 테스트, 배포 파이프라인, 마이그레이션 가능한 추상화가 오래 버틴다. 에이전트 설계도 결국 소프트웨어 수명주기 안에 들어와야 한다.

    '
  points:
  - Agent Builder와 Evals는 2026-11-30 이후 OpenAI 플랫폼에서 제공 중단 예정
  - 코드로 지속해야 하는 워크플로는 Agents SDK로 이전 권장
  - 운영 에이전트는 시각 플로우보다 버전 관리·테스트 가능한 코드 자산이어야 함
  source: https://openai.com/index/introducing-agentkit/
- category: ai
  title: DiffusionGemma — 토큰을 왼쪽부터 쓰지 않는 LLM 서빙
  summary: 'Google의 DiffusionGemma 개발자 가이드는 Gemma 4 기반 실험 모델이 자동회귀식 한 토큰 생성 대신 256-token canvas를 병렬로 정제하는 구조를 설명한다. GPU에서는 메모리 대역폭 병목을 계산 병목으로 옮겨 최대 4배 빠른 token generation을 목표로 하고, 26B MoE 중 inference 때 3.8B 파라미터만 활성화해 quantized 배포를 18GB VRAM 안에 맞추도록 설계됐다. 실무 포인트는 "새 모델이 빠르다"가 아니라, vLLM 같은 서빙 엔진도 autoregressive 전제에서 벗어나 denoising loop와 block 단위 KV cache를 다뤄야 하는 시대가 온다는 점이다.

    '
  points:
  - 256-token canvas를 병렬 denoising으로 정제하는 diffusion-style generation
  - 26B MoE지만 inference 활성 파라미터는 3.8B, quantized 배포는 18GB VRAM 목표
  - vLLM 통합처럼 서빙 엔진이 autoregressive 전제 밖의 루프를 지원해야 함
  source: https://developers.googleblog.com/diffusiongemma-the-developer-guide/
- category: ai
  title: Copilot-authored PR 검색 — 에이전트 산출물도 사람 책임 뷰에 합치기
  summary: 'GitHub은 2026년 6월 18일 `author:` 검색이 Copilot cloud agent가 사용자 지시에 따라 연 PR까지 함께 보여주도록 바뀌었다고 공지했다. `author:@me`와 Created by me 뷰가 사람이 직접 만든 PR과 Copilot이 대신 연 PR을 함께 보여주며, GitHub Mobile과 웹 UI에 먼저 적용되고 REST/GraphQL API는 2026년 7월 16일 rollout 예정이다. 교육 포인트는 에이전트 PR을 별도 봇 산출물로 치워 두지 말라는 것이다. 사람이 시킨 작업이면 검색, 대시보드, 릴리스 노트, 감사 흐름에서 그 사람의 책임 범위로 함께 보여야 review와 ownership이 끊기지 않는다.

    '
  points:
  - '`author:@me`가 human-authored PR과 Copilot-authored PR을 함께 반환'
  - 웹 UI와 GitHub Mobile 먼저 적용, REST/GraphQL API는 2026-07-16 rollout 예정
  - 에이전트 산출물도 요청한 사람의 ownership·review 흐름 안에 보여야 함
  source: https://github.blog/changelog/2026-06-18-copilot-authored-pull-requests-now-included-in-author-searches/
- category: ai
  title: Tensor SDK Beta + LiteRT — Pixel NPU 배포를 하나의 경로로 묶기
  summary: 'Google은 2026년 5월 Tensor ML SDK를 Beta로 올리며 Pixel 10 계열에서 Tensor TPU를 쓰는 온디바이스 AI 개발 경로를 LiteRT와 통합했다. 개발자는 PyTorch 또는 TFLite 모델을 LiteRT Torch로 변환·컴파일하고, Play Feature Delivery와 AI Packs로 런타임·컴파일러·모델 파일을 배포한 뒤 LiteRT Runtime에서 TPU를 우선 사용하고 CPU/GPU fallback을 지정할 수 있다. Android AI 개발에서 배울 점은 "NPU를 직접 호출"이 아니라, 변환·배포·fallback까지 같은 파이프라인에 넣어 기기별 가속 실패를 제품 안정성 문제로 관리하는 것이다.

    '
  points:
  - Tensor ML SDK Beta가 LiteRT와 통합되어 Pixel 10 Tensor TPU 경로 제공
  - 변환·컴파일·Play Feature Delivery·AI Packs·LiteRT Runtime을 하나로 연결
  - TPU 우선 실행 + CPU/GPU fallback을 앱 배포 전략에 포함
  source: https://developers.googleblog.com/google-tensor-sdk-beta-with-litert/
- category: ai
  title: LiteRT + Arm SME2 — 모바일 CPU도 GenAI 가속 경로가 된다
  summary: 'Google AI Edge와 Arm은 LiteRT가 XNNPACK·KleidiAI 통합을 통해 Arm SME2를 런타임에서 자동 활용하는 온디바이스 AI 최적화 흐름을 설명했다. Stable Audio Open Small을 PyTorch에서 LiteRT로 변환하고, Model Explorer와 AI Edge Quantizer로 quantization-safe layer를 확인한 뒤 INT8/FP16 최적화를 적용한다. 결과로 DiT submodel은 약 4배 작아지고, Android SME2 기기에서는 14초 작업이 6.6초로 줄었다. 핵심은 "전용 NPU가 없으면 끝"이 아니라, CPU 경로도 측정·양자화·delegate 자동 선택으로 제품급 fallback이 될 수 있다는 점이다.

    '
  points:
  - LiteRT가 XNNPACK·KleidiAI를 통해 Arm SME2 가속을 자동 활용
  - Model Explorer로 양자화 안전성을 확인하고 AI Edge Quantizer로 INT8 적용
  - Android SME2 기기에서 14초→6.6초, DiT submodel 약 4배 축소 사례
  source: https://developers.googleblog.com/accelerating-on-device-ai-a-look-at-arm-and-google-ai-edge-optimization/
- category: ai
  title: Karrot Firebase AI Logic — 번역 AI는 품질보다 배포 경로가 먼저다
  summary: 'Google Android Developers Blog의 Karrot 사례는 AI+Android 기능 선택의 기준을 잘 보여준다. Karrot은 북미 사용자 중 비영어 기기 언어 사용자가 30%라는 문제를 확인했고, ML Kit Translation과 Gemini Nano를 먼저 시험했지만 품질과 모델 다운로드 장벽 때문에 Firebase AI Logic + Gemini Flash Lite를 선택했다. PoC는 3시간 안에 만들었고, 전용 백엔드 없이 2주 만에 프로덕션 기능으로 전환했다. 결과적으로 번역 배너를 본 비영어 사용자 3명 중 1명이 기능을 사용했고, 번역 기능을 제공받은 구매자는 판매자와 채팅을 시작할 가능성이 2.4배 높았다. 교훈은 모델 이름보다 배포 경로, UX opt-in, 프롬프트 운영을 먼저 검증하라는 점이다.

    '
  points:
  - ML Kit Translation·Gemini Nano를 시험한 뒤 Firebase AI Logic + Gemini Flash Lite 선택
  - PoC 3시간, 전용 백엔드 없이 2주 만에 프로덕션 반영
  - 번역 제공 구매자는 판매자 채팅 시작 가능성이 2.4배 높았다고 보고
  source: https://android-developers.googleblog.com/2026/05/how-karrot-increased-sales-with-gemini-firebase-ai-translation.html
- category: ai
  title: ML Kit GenAI 운영 매트릭스 — 지원 기기·쿼터·Nano 버전을 함께 검증
  summary: 'ML Kit GenAI는 "Android에서 Gemini Nano를 쓴다"로 끝나지 않는다. 기존 세 카드를 합치면 출시 전에 반드시 만들어야 할 운영 매트릭스가 보인다. 첫째, Summarization·Proofreading·Rewriting·Image Description·Prompt API·Speech Recognition은 지원 기기와 Basic/Advanced 모드가 다르다. 둘째, AICore는 앱별 inference quota를 강제하므로 `BUSY`, `PER_APP_BATTERY_USE_QUOTA_EXCEEDED`, `BACKGROUND_USE_BLOCKED` 같은 실패 코드를 retry/backoff와 foreground UX에 반영해야 한다. 셋째, Gemini Nano 버전이 다르면 같은 프롬프트도 다른 결과가 나올 수 있어 `getBaseModelName()` 기반 품질 평가가 필요하다.

    '
  points:
  - 기능별 지원 기기·nano-v2/v3·Speech Basic/Advanced 모드를 분리
  - AICore quota와 foreground 제약을 오류 처리·배터리 예산에 반영
  - '`getBaseModelName()`으로 Nano 버전별 prompt quality evaluation 수행'
  source: https://developers.google.com/ml-kit/genai
- category: ai
  title: RA.Aid — 연구·계획·구현 3단계로 개발 작업을 자율 수행하는 LangGraph 기반 코딩 에이전트
  summary: 'RA.Aid는 "Develop software autonomously"를 표방하는 오픈소스(Apache-2.0) 코딩 에이전트로, LangGraph 위에서 Research(정보·컨텍스트 수집) → Planning(작업 분해·전략) → Implementation(실행) 3단계 아키텍처로 멀티스텝 개발 작업을 거의 자율적으로 처리한다.

    '
  points:
  - '3단계: Research(컨텍스트 수집) → Planning(작업 분해) → Implementation(실행)'
  - 셸·파일·메모리·코드분석 툴셋 + Git 통합 + 자동 명령 실행, 대화형 CLI
  - 웹 리서치(Tavily)·전문가 추론 모델 활용, 선택적 HITL(사람 개입)
  - 모델 비종속(Anthropic·OpenAI·OpenRouter·Gemini 등), aider 통합(--use-aider)
  source: https://github.com/ai-christianson/RA.Aid
- category: ai
  title: Devika — 한 줄 지시를 단계로 쪼개 리서치하고 코드를 작성하는 에이전틱 AI 소프트웨어 엔지니어
  summary: 'Devika는 "Agentic AI Software Engineer"를 표방하는 오픈소스(MIT) 도구로, 고수준 사람 지시를 이해해 단계로 분해하고 관련 정보를 리서치한 뒤 목표 달성 코드를 작성한다. README는 아직 매우 초기·실험 단계라고 밝힌다.

    '
  points:
  - 고급 AI 계획·추론 + 집중 리서치용 문맥 키워드 추출
  - 웹 브라우징으로 정보 수집, 다중 프로그래밍 언어로 코드 작성
  - 동적 에이전트 상태 추적·시각화, 챗 기반 자연어 상호작용, 확장 가능한 아키텍처
  - '모델: Claude 3·GPT-4·Gemini·Mistral·Groq·Ollama 로컬 LLM 지원 / MIT·실험단계'
  source: https://github.com/stitionai/devika
- category: ai
  title: Copilot Custom Agents — 프롬프트가 아니라 역할 파일로 에이전트를 고정하기
  summary: 'GitHub Docs는 Copilot custom agents를 특정 워크플로, 코딩 규칙, use case에 맞춘 Copilot agent 버전으로 설명한다. 핵심 단위는 `.github/agents/*.agent.md` 같은 Markdown agent profile이고, YAML frontmatter에 name, description, target, tools를 두며 본문에는 최대 30,000자 prompt를 넣는다. repository, organization, enterprise 레벨에 둘 수 있고 GitHub.com의 cloud agent, IDE, Copilot CLI에서 선택해 쓸 수 있다. 교육 포인트는 "매번 길게 지시하기"가 아니라, 리뷰어·문서작성자·마이그레이션 담당처럼 반복되는 역할을 파일로 버전 관리하고 도구 권한까지 좁혀서 같은 작업 품질을 재현하는 것이다.

    '
  points:
  - 'agent profile: Markdown + YAML frontmatter + 본문 prompt'
  - tools를 지정하지 않으면 기본적으로 모든 사용 가능 도구에 접근
  - repo/org/enterprise 레벨에 두고 GitHub.com·IDE·CLI에서 선택
  source: https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-custom-agents
- category: ai
  title: Copilot 지시문 매트릭스 — 같은 파일명도 표면마다 다르게 먹힌다
  summary: 'Copilot custom instructions 지원표를 보면 지시문은 하나가 아니다. GitHub.com의 Copilot cloud agent는 `.github/copilot-instructions.md`, `.github/instructions/**/*.instructions.md`, `AGENTS.md`·`CLAUDE.md`·`GEMINI.md`, organization instructions를 읽지만, Copilot code review나 각 IDE는 지원 범위가 다르다. 예를 들어 Xcode의 cloud agent는 repo/path/agent instructions를 지원하지만, Eclipse의 code review custom instructions는 현재 지원되지 않는다. 실무 포인트는 "AGENTS.md 하나면 끝"이 아니라, 실제로 쓰는 표면별 지원표를 기준으로 repo-wide 규칙, path-specific 규칙, agent instruction을 분리해 검증해야 한다는 점이다.

    '
  points:
  - cloud agent는 repo-wide·path-specific·agent·organization instructions를 조합
  - IDE와 code review 표면마다 지원 조합이 다름
  - 지시문 설계는 파일명보다 실행 표면별 지원 여부를 먼저 확인
  source: https://docs.github.com/en/copilot/reference/custom-instructions-support
- category: ai
  title: Copilot Jira 연동 — 티켓 문맥은 PR에 공개될 수 있다
  summary: 'GitHub Copilot for Jira 문서는 Jira work item에서 Copilot cloud agent를 호출해 PR 생성을 맡길 수 있다고 설명한다. 사용자는 Jira 이슈를 Copilot에 assign하거나 댓글에서 멘션하고, 진행 상황을 Jira 댓글에서 확인하며, 같은 work item에서 후속 지시를 이어갈 수 있다. 하지만 중요한 안전 문장이 있다. Jira에서 캡처된 컨텍스트는 pull request에 추가되며, 저장소가 public이면 모두에게 보일 수 있다. 또한 이 경로는 GitHub Actions minutes와 AI credits를 소비한다. 그래서 티켓 기반 에이전트 자동화는 "편한 연결"보다 공개 가능 문맥, 비용, 권한, 기본 custom agent·branch 규칙을 먼저 정해야 한다.

    '
  points:
  - Jira work item assign/mention으로 Copilot cloud agent 세션 시작
  - Jira 컨텍스트가 PR에 들어가 public repo에서는 공개될 수 있음
  - 실행 비용은 GitHub Actions minutes + AI credits로 계산
  source: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/integrate-cloud-agent-with-jira
- category: ai
  title: Copilot MCP 정책 — 도구 발견보다 허용 목록이 먼저다
  summary: 'GitHub Enterprise Cloud 문서는 조직·엔터프라이즈에서 MCP server usage를 정책으로 관리할 수 있다고 설명한다. 관리자는 MCP servers in Copilot로 MCP 사용 자체를 제어하고, MCP Registry URL로 개발자가 발견할 승인 서버 목록을 지정하며, Restrict MCP access to registry servers로 레지스트리에 있는 서버만 허용할 수 있다. Agent Finder처럼 런타임에 MCP 서버·도구·스킬을 찾아 쓰는 흐름이 커질수록, 실무 핵심은 "많이 연결하기"가 아니라 어떤 registry를 신뢰하고 어떤 서버만 조직 표면에 노출할지 정하는 것이다. MCP는 연결 표준인 동시에 권한 표면이다.

    '
  points:
  - MCP servers in Copilot로 조직/엔터프라이즈 MCP 사용을 제어
  - MCP Registry URL로 승인된 서버 발견 경로를 지정
  - registry 서버만 허용해 런타임 도구 연결을 정책 경계 안에 둠
  source: https://docs.github.com/en/enterprise-cloud@latest/copilot/concepts/mcp-management
- category: ai
  title: AutoCodeRover — AST 기반 코드 검색으로 GitHub 이슈를 자동 해결하는 자율 프로그램 개선 시스템
  summary: 'AutoCodeRover(NUS)는 GitHub 이슈(버그 픽스·기능 추가)를 LLM과 프로그램 분석·디버깅으로 자동 해결한다. 문자열이 아닌 AST(프로그램 구조)를 이해하는 코드 검색으로 패치 위치를 우선순위화해 패치를 생성하는 "Autonomous Program Improvement" 접근이다.

    '
  points:
  - '2단계: 컨텍스트 검색(Program Structure Aware한 AST 기반 코드검색 API) + 패치 생성'
  - 테스트 스위트가 있으면 statistical fault localization으로 수리율 향상
  - SWE-bench Verified 46.20% / full 24.89% / lite 30.67%(pass@1), 태스크당 7분 미만·$0.7 미만
  - '논문 ''AutoCodeRover: Autonomous Program Improvement''(arXiv 2404.05427), ISSTA 2024 / 라이선스는 README 미명시'
  source: https://github.com/nus-apr/auto-code-rover
- category: ai
  title: 'PR-Agent (Qodo Merge 오픈소스): AI 코드리뷰 에이전트'
  summary: 'Qodo가 커뮤니티로 유지하는 오픈소스 AI 코드리뷰 에이전트. PR에 명령을 달면 자동 리뷰·설명·개선제안을 수행한다. GitHub·GitLab·BitBucket·Azure DevOps·Gitea를 지원하고 GitHub Action·CLI·Docker·self-hosted·webhook으로 실행한다.

    '
  points:
  - '핵심 명령: /review(리뷰) /describe(PR 설명 생성) /improve(코드 개선제안) /ask(코드 라인 질의)'
  - '각 도구는 단일 LLM 호출(README: ~30초, 저비용)로 동작'
  - '플랫폼 무관: 여러 git 제공자·배포방식·AI 모델(OpenAI GPT, Claude 등) 지원'
  - '실행: GitHub Action(권장)·CLI(로컬)·Docker·self-hosted·webhook'
  source: https://github.com/qodo-ai/pr-agent
- category: ai
  title: 'Agent Zero: Docker 컨테이너에 ''AI 에이전트용 완전한 리눅스 시스템''을 주는 동적 에이전트 프레임워크'
  summary: '"A full Linux system for your AI agent" — 오픈·동적·유기적 에이전트 프레임워크. Docker 컨테이너 하나에 XFCE 데스크톱이 도는 완전한 리눅스 시스템과 플러그인 허브를 담아, 에이전트가 Skills로 스스로 확장한다.

    '
  points:
  - 컨테이너 안에 실제 XFCE 데스크톱 세션이 돌고, 에이전트가 Skills로 기능 확장
  - '멀티에이전트: 모든 에이전트가 하위 에이전트를 만들어 작업을 분해(상위가 지시·보고 수신, 하위는 독립 컨텍스트)'
  - '확장형: prompts/ tools/ 플러그인 직접 수정, 플러그인·MCP·A2A·프로젝트별 설정 지원'
  - '모델: OpenAI Codex 플랜을 OAuth로 연동(Gemini CLI·Claude Code 통합 예고)'
  source: https://github.com/frdel/agent-zero
- category: ai
  title: 'Claude Engineer v3: 대화 도중 스스로 도구를 만들어 핫리로드하는 자기개선형 코딩 어시스턴트'
  summary: '"A powerful self-improving AI Assistant designed for creating and managing AI tools with Claude 3.5." 대화 중 새 도구의 필요를 스스로 식별해 설계·구현하고, 재시작 없이 핫리로드해 쓴다. 쓸수록 능력이 늘어나는 자기개선 구조. CLI(ce3.py)와 웹 UI(app.py) 둘 다 제공.

    '
  points:
  - '자기개선: 자율 도구 식별·생성, 대화 중 동적 능력 확장, 능력 공백 자동 탐지, 기존 도구 자가 최적화'
  - '핵심: 동적 도구 생성·로딩 + 핫리로드(새 도구를 재시작 없이 즉시 사용)'
  - 모델 Claude 3.5 Sonnet, Anthropic 토큰 카운팅 API로 토큰 사용 추적·시각화
  - '실행: uv로 설치 후 웹 UI(uv run app.py, localhost:5000) 또는 CLI(uv run ce3.py)'
