  title: EU AI Act 2026 시행 — 8/2 투명성·GPAI 벌금, 12/27 고위험(Annex III) 의무
  summary: 'EU AI Act는 2024-08-01 발효, 단계적 적용 중이다. 2025-02-02 금지 관행(AI literacy), 2025-08-02 GPAI 모델 의무(문서화·저작권) 이미 시행. 2026-08-02: Article 50 투명성(합성 콘텐츠 라벨링), GPAI 벌금 집행, AI Sandbox 의무. Digital Omnibus(2026-06 EP 승인): 고위험 Annex III는 2027-12-02, Annex I 제품 내장 AI는 2028-08-02로 연기. 2026-12-02: 기존 GenAI 워터마킹·nudifier 앱 금지. 최대 벌금 GPAI 3%/매출, 고위험 35M€ 또는 7%.'
