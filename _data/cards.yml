  answer: '아니다. 도구별로 각각 지원되는 설치 경로를 하나씩 선택하고 기능 차이를 확인해야 한다. ECC는 같은 하네스 안에서 플러그인과 전체 수동 설치를 겹치면 hook·skill·명령 중복이 날 수 있다고 경고하며, Codex hook은 별도 신뢰 승인과 부분 지원 범위를 갖는다.'
