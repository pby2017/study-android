  - "`$ARGUMENTS`는 전체 인자, `$0`은 첫 인자; 인덱스는 0부터 시작"
  - "치환은 원본 본문에서 한 번만 수행; 여러 줄 명령은 ````!` 코드 펜스를 사용"
  source: https://code.claude.com/docs/en/slash-commands
  interview: "스킬 본문에 `!`git diff``가 있으면 권한 확인 없이 실행되나요? `$1`은 첫 번째 인자인가요?"
  answer: "아니다. 삽입 명령도 권한 규칙을 통과해야 하며, 일반 모드에서 허용되지 않으면 스킬 호출이 중단된다. 인자 인덱스는 0부터라 첫 인자는 `$0`이다."
