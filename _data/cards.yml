      - "LangChain 비의존: 자체 구현이라 '가볍고 빠르다(lean, lightning-fast)'를 표방 — 다른 프레임워크 위에 얹힌 래퍼가 아님"
      - "에이전트/태스크를 코드가 아닌 YAML(agents.yaml·tasks.yaml)로 선언 — 별 수는 약 53.7k★, 포크 7.5k 주장(레포 표기 기준)"
    source: "https://github.com/crewAIInc/crewAI"
