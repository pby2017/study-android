  title: Instructor — Pydantic 스키마로 LLM 출력을 '구조화 데이터'로 강제하는 라이브러리(MIT·~12k★·6개 언어)
  summary: 'Instructor는 LLM 호출에 Pydantic 모델을 씌워 구조화된 데이터 추출을 보장하는 라이브러리다. 스키마 검증 실패 시 자동 재시도하고, 15+ 프로바이더(OpenAI·Anthropic·Ollama·DeepSeek)를 지원한다. Python·TypeScript·Go·Ruby· Elixir·Rust 6개 언어 SDK 제공. Outlines(~13k★)가 로컬 모델 logit 마스킹으로 100% 스키마 준수를 보장한다면, Instructor는 클라우드 API에서 간편하게 사용하는 데 최적화. 스트리밍·부분 응답·중첩 객체 지원.

    '
