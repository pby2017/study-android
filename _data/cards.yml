  title: LangSmith — 프레임워크 비종속 LLM·에이전트 옵저버빌리티·평가·프롬프트 관리 플랫폼
  summary: LangSmith는 LangChain 팀의 managed AI agent engineering platform으로, trace 기반 디버깅·평가·모니터링·프롬프트 관리를 통합한다. OpenAI·Anthropic·CrewAI·Vercel AI SDK·Pydantic AI 등 80+ 프레임워크와 OpenTelemetry 연동, LangChain 종속 없이 @traceable 또는 SDK로 계측 가능. Polly AI assistant로 긴 trace 분석, Insights Agent로 usage pattern·failure mode 클러스터링, SmithDB(purpose-built DB)로 nested agent trace 검색. Online eval(LLM-as-judge·code eval)·dashboard·PagerDuty alert. 2025-10 Series B $125M($1.25B valuation), 월 10억+ trace 처리.
