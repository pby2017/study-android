  title: AI 코드 생성량과 리뷰 대기열 — 생산성은 전달 과정까지 봐야 한다
  summary: 'DX의 2026년 3분기 자료는 500곳 이상의 R&D 조직 데이터를 집계했다. AI 작성 코드 비중이 20~40%인 조직의 첫 리뷰 대기 중앙값은 40분, 80% 이상인 조직은 82분이었다. 두 집단의 차이는 연관성을 보여줄 뿐, AI 사용이 대기를 늘렸다는 인과관계를 증명하지는 않는다. 따라서 AI 도구의 효과를 생성 속도만으로 판단하지 말고, 리뷰 대기와 PR 처리량 같은 전달 지표도 함께 살펴야 한다.'
  points:
  - '표본: 500곳 이상 R&D 조직, 첫 리뷰 수치는 2026년 7~9월 자료'
  - 'AI 코드 비중별 첫 리뷰 대기 중앙값: 20~40%는 40분, 80% 이상은 82분'
  - '적용: 도구 도입 전후에 생성량뿐 아니라 리뷰 대기·PR 처리량도 함께 비교'
  source: https://getdx.com/report/state-of-ai-impact-in-engineering-q3-report/
  sources:
  - label: 'DX Q3 2026 보고서 — 표본 범위와 AI 코드 비중별 첫 리뷰 대기'
    url: https://getdx.com/report/state-of-ai-impact-in-engineering-q3-report/
  - label: 'DX 지표 정의 — PR throughput과 복잡도를 반영한 TrueThroughput'
    url: https://docs.getdx.com/reports/pr-throughput/
  interview: 'AI 코드 비중이 높은 팀에서 첫 리뷰 대기가 길다는 벤치마크만으로 AI가 리뷰 지연의 원인이라고 결론 내려도 될까요?'
