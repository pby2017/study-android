  interview: "Android 작업에 역할별 서브에이전트 카탈로그를 쓸 때, 어떤 정의를 고르고 설치·실행 전에 무엇을 확인해야 하나요?"
  answer: "Android 내용을 명시한 Kotlin 역할을 후보로 삼되 프롬프트를 전문가 인증으로 여기지 않는다. 프로젝트 범위에 필요한 정의만 설치하고 도구 권한·플러그인 hooks/MCP를 검토한 뒤 공식 Android 문서와 테스트로 결과를 검증한다."
- category: ai
  level: "중급"
  title: 대형 모노레포의 Claude Code 지침 — 공통 규칙과 모듈 규칙 나누기
  summary: Claude Code는 파일을 읽고 검색해 필요한 코드 맥락을 찾으므로 시작 위치와 지침의 범위가 중요하다. 현재 작업 디렉터리와 상위의 `CLAUDE.md`는 시작할 때 함께 로드되고, 하위 디렉터리 파일은 그 안의 코드를 읽거나 수정할 때 로드된다. 루트에는 공통 지침, 모듈에는 해당 영역의 규칙을 둔다.
  points:
  - "Android 모노레포라면 루트에는 공통 Gradle 명령·아키텍처만 두고, `feature/checkout/` 같은 하위 경로에는 화면·모듈 전용 규칙을 둔다. 그 경로에서 시작하면 상위 지침도 함께 읽힌다."
  - "경로 패턴별 규칙은 `.claude/rules/`의 `paths`로 제한할 수 있다. 테스트·린트 명령도 모듈별로 안내하고, 구조가 낯설면 짧은 코드베이스 맵으로 탐색 시작점을 준다."
  - "각 `CLAUDE.md`는 200줄 미만을 목표로 하고 오래되거나 서로 충돌하는 지침을 정기적으로 감사한다. 지침은 모델의 문맥이지 강제 설정이므로, 반드시 지켜야 할 권한·명령 제약은 permissions나 hooks로 적용한다."
  interview: "Claude Code를 저장소 루트에서 시작했을 때 하위 디렉터리의 `CLAUDE.md`는 언제 로드되나요? 모노레포 규칙을 어떻게 나누고 어떤 요구를 지침만으로 강제하면 안 되나요?"
  answer: "현재 디렉터리와 상위 지침은 시작 시 로드되고, 하위 지침은 그 경로의 파일을 읽거나 수정할 때 로드된다. 공통 규칙은 루트, 모듈 전용 규칙은 하위 경로나 경로 제한 규칙에 두며, 강제할 보안·권한 요구는 설정이나 hook으로 적용한다."
  sources:
  - label: 대형 코드베이스 운영 패턴
    url: https://claude.com/blog/how-claude-code-works-in-large-codebases-best-practices-and-where-to-start
  - label: CLAUDE.md 로딩·경로 규칙
    url: https://code.claude.com/docs/en/memory
- category: ai
  title: SWE-EVO — '단일 이슈'를 넘어 코드베이스를 여러 번 진화시키는 장기 과제 벤치마크
  level: "고급"
  summary: 'SWE-EVO는 코딩 에이전트가 단일 이슈를 고치는 수준을 넘어, 릴리스 단위의 코드베이스 변경을 수행하는지 평가하는 벤치마크다. 7개 Python 오픈소스 프로젝트의 릴리스 전환에서 만든 48개 과제는 평균 20.9개 파일을 수정하고 874개 테스트로 기능 변경과 회귀를 함께 확인한다. 논문에서 GPT-5.4+OpenHands의 해결률은 25%였다. GPT-5.2는 SWE-agent에서 22.92%였지만 SWE-bench Verified의 72.8%는 bash-only 설정 결과이므로 두 점수를 직접 대결처럼 읽으면 안 된다. 핵심 교훈은 단일 이슈 점수만으로 장기 유지보수 역량을 판단할 수 없다는 것이다.'
  points:
  - '입력은 릴리스 요구사항과 시작 시점 코드베이스다. 요구사항은 여러 버그 수정·기능·유지보수를 묶을 수 있어, 정답 패치도 여러 파일에 걸친다.'
  - '48개 과제 중 하나만 더 해결해도 해결률이 2.08%p 변한다. 논문도 작은 점수 차이는 과해석하지 말라고 경고한다.'
  - 'Resolved Rate는 요구 테스트와 회귀 테스트를 모두 통과해야 성공이다. Fix Rate는 회귀가 없을 때 FAIL_TO_PASS 테스트의 부분 진척을 보여주지만 코드 품질 전체를 측정하지는 않는다.'
  source: https://arxiv.org/abs/2512.18470
  sources:
  - label: 논문 최신판(v6)·평가 조건과 한계
    url: https://arxiv.org/abs/2512.18470
  - label: 공개 데이터·실행 코드
    url: https://github.com/SWE-EVO/SWE-EVO
  interview: 'SWE-bench Verified에서 높은 해결률을 보인 코딩 에이전트가 장기 유지보수에도 강하다고 단정하기 어려운 이유는 무엇인가요?'
  answer: 'SWE-bench Verified는 개별 이슈 해결을 평가하지만 SWE-EVO는 릴리스 수준 요구사항에 맞춰 여러 파일을 바꾸고 회귀를 막아야 한다. 두 점수는 과제와 에이전트 설정도 다르며, SWE-EVO는 48개 과제에 기반하므로 작은 점수 차이를 일반화하지 않는다.'
- category: ai
  title: 'SuperClaude — /sc: 명령·에이전트·모드를 주입해 Claude Code를 ''개발 플랫폼''으로 바꾸는 프레임워크'
  level: "중급"
  summary: 'SuperClaude Framework는 Claude Code의 모델이나 엔진을 바꾸는 도구가 아니라, 명령·에이전트·행동 지침 파일을 설치해 작업 흐름을 구성하는 커뮤니티 프로젝트다. 저장소는 v4.3.0의 구성을 슬래시 명령 30개, 에이전트 20개, 모드 7개, MCP 연동 8개로 소개한다. 2026-11-22 확인 시 GitHub 별 23,951개였지만, 별 수는 사용량이나 품질을 보증하지 않는다. 핵심은 `/sc:` 명령을 작업별 진입점으로 삼는 것이며, 지침은 모델의 행동을 유도할 뿐 정확성이나 보안 정책을 강제하지 않는다. 현재 README의 설치 경로는 pipx/PyPI 또는 저장소 설치 스크립트다. 과거 문서의 TypeScript 플러그인 설치 안내는 v5 계획으로 표시되어 있으므로 v4 사용법과 혼동하지 않는다. MIT 라이선스이며 Anthropic과 공식 제휴 관계가 아니다.'
  points:
  - '구성 수치는 프로젝트 README 기준: 명령 30개·에이전트 20개·모드 7개·MCP 연동 8개. 설치된 구성 요소가 늘어날수록 실제로 쓰는 명령·에이전트만 골라 사용한다.'
  - '설치 전 README의 현재 v4 안내를 확인한다. README는 pipx 설치를 권장하며 MCP 서버 설치는 선택 사항이다. 오래된 플러그인 설치 문서와 v5 계획을 현재 안정판 기능으로 오해하지 않는다.'
  - '보안 관점: 프롬프트 지침은 정책 강제 장치가 아니다. MCP 서버 연결 권한·도구 범위를 별도로 검토하고, 생성·수정 결과는 테스트와 코드 리뷰로 확인한다.'
  source: https://github.com/SuperClaude-Org/SuperClaude_Framework
  sources:
  - label: 프로젝트 README·현재 설치 안내
    url: https://github.com/SuperClaude-Org/SuperClaude_Framework
  - label: v4.3.0 릴리스 노트
    url: https://github.com/SuperClaude-Org/SuperClaude_Framework/releases
  interview: 'SuperClaude의 행동 지침이 있는데도 결과를 테스트하고 MCP 권한을 따로 검토해야 하는 이유는 무엇인가요?'
  answer: '행동 지침은 모델의 출력 방향을 유도할 뿐 결정적 정책 집행이나 정확성을 보장하지 않는다. MCP는 외부 도구 권한을 추가하므로 연결 서버와 허용 범위를 따로 검토하고, 결과는 테스트·리뷰로 확인해야 한다.'
- category: ai
  title: 'SWE-Perf — 코드 에이전트의 성능 최적화와 정답성을 함께 따져보기'
  level: "고급"
  summary: 'SWE-Perf는 코딩 모델이 실제 저장소의 코드를 더 빠르게 만들면서 기존 동작도 보존하는지 평가하는 벤치마크다. 저자들은 9개 Python 저장소의 PR 102,241건을 측정·선별해 성능 개선이 재현되는 140개 과제를 만들었다. 각 과제에는 저장소 코드와 성능 테스트가 있지만, 모델에 타깃 함수도 알려준다. 따라서 완전히 제한 없는 저장소 탐색 능력만을 재는 것은 아니다. 논문은 파일 단위의 oracle 조건과 에이전트가 저장소를 다루는 realistic 조건을 구분하고, 정답성 테스트를 통과한 변경의 속도 개선을 평가한다. 주요 교훈은 빠른 코드만 만들면 충분하지 않다는 점이다. 올바른 결과와 반복 가능한 성능 측정을 함께 확인해야 한다.'
  points:
  - '데이터 규모: Python 저장소 9곳의 PR 102,241건을 출발점으로 삼아 140개 과제를 구성했다. 작은 표본과 특정 언어·저장소에 기반하므로 모든 개발 환경으로 일반화하지 않는다.'
  - '평가 경계: 타깃 함수가 주어지며 oracle(관련 파일 제공)과 realistic(저장소 탐색 에이전트) 조건을 나눈다. 각 결과는 정답성 확인과 성능 측정을 함께 해석한다.'
  - '실무 적용: 프로파일링으로 병목을 먼저 찾고, 동등한 테스트·환경에서 기준선과 변경 후 실행 시간을 여러 번 비교한다. 빠르지만 동작이 달라진 패치는 최적화 성공으로 보면 안 된다.'
  source: https://swe-perf.github.io/
  sources:
  - label: SWE-Perf 논문 최신판(v2)·실험 조건과 한계
    url: https://arxiv.org/abs/2507.12415
  - label: 벤치마크 개요
    url: https://swe-perf.github.io/
  - label: 공개 데이터·실행 코드
    url: https://github.com/SWE-Perf/SWE-Perf
  interview: '성능 벤치마크에서 패치가 실행 시간을 줄였다는 결과만으로 최적화가 성공했다고 할 수 없는 이유는 무엇인가요?'
  answer: '성능 개선 전에 정답성 테스트를 통과해야 한다. 동작을 깨뜨린 패치도 빠르게 보일 수 있고, 측정 결과는 같은 테스트와 통제된 환경에서 재현돼야 한다. SWE-Perf도 성능 결과를 정답성과 분리해 해석하는 분석을 제시한다.'
- category: ai
  title: 'Claude Code dynamic workflows — 반복·분기를 스크립트로 맡기기'
  level: "중급"
  summary: 'Claude Code의 dynamic workflow는 작업을 수행하는 JavaScript 오케스트레이션 스크립트다. Claude가 스크립트를 작성하면 런타임이 백그라운드에서 서브에이전트를 실행하고, 스크립트가 반복·분기와 중간 결과를 관리한다. 일반적인 대화형 위임과 달리 중간 결과가 스크립트 안에 남아 세션 컨텍스트를 줄일 수 있고, 여러 파일 점검·대규모 이관·교차 검증 조사처럼 많은 작업을 같은 절차로 처리할 때 유용하다. 단, 에이전트가 늘면 토큰과 사용 한도 소모도 커진다. 문서의 `ultracode` 키워드는 사용자가 입력한 대화형 프롬프트에서만 자동 선택 신호로 작동하며, `claude -p`나 예약 작업 프롬프트에는 적용되지 않는다. 비대화형 실행은 키워드만 넣지 말고 workflow 실행 경로와 권한을 따로 확인한다.'
  points:
  - '핵심 API: `agent()`는 작업자 하나, `parallel()`은 동시 작업 묶음, `pipeline()`은 항목별 순차 단계를 실행한다. 반복과 결과 합치기는 스크립트 로직으로 명시한다.'
  - '대화형 실행: 요청에 workflow를 명시하거나 `ultracode`를 사용한다. `/effort ultracode`는 세션의 실질적인 작업마다 workflow를 고려하지만, 토큰 사용과 응답 시간이 늘 수 있다.'
  - '비용 통제: 작은 범위로 먼저 실행하고 `/workflows`에서 진행·에이전트별 사용량을 확인한다. `workflowSizeGuideline=small`은 목표 규모를 안내하지만 절대 상한은 아니며, `disableWorkflows` 설정으로 기능을 끌 수 있다.'
  source: https://code.claude.com/docs/en/workflows
  interview: '`claude -p` 프롬프트에 `ultracode`만 넣으면 dynamic workflow가 자동 시작된다고 볼 수 없는 이유는 무엇인가요?'
  answer: '공식 문서에서 `ultracode` 키워드는 사용자가 직접 입력한 대화형 프롬프트의 opt-in으로 한정된다. `-p`, 예약 작업, webhook 등 전달된 프롬프트에는 키워드가 실행 신호로 작동하지 않으므로, 비대화형에서는 workflow 호출 경로와 권한 평가를 별도로 설계해야 한다.'
  sources:
  - label: Dynamic workflows 공식 가이드
    url: https://code.claude.com/docs/en/workflows
  - label: Claude Code 설정 키·실행 옵션
    url: https://code.claude.com/docs/en/settings
- category: ai
  title: 'Claude Code `/context` — 무엇이 컨텍스트를 차지하는지 진단하기'
  level: "초급"
  summary: 'Claude Code의 `/context`는 현재 대화에 무엇이 들어와 있는지와 컨텍스트 사용 현황을 시각적으로 확인하는 명령이다. 고정된 “200k 창”만 가정하지 말고 실제 세션의 표시를 기준으로 읽는다. 원인을 확인한 뒤 관련 없는 대화는 `/clear`, 보존할 정보를 지정해 요약하려면 `/compact`를 사용한다. MCP 도구 검색은 기본적으로 도구 설명을 필요할 때 불러와 시작 시 컨텍스트 부담을 줄이지만, 배포 환경에 따라 지원되지 않을 수 있다. CLI도 도구 정의 목록을 미리 넣지 않는 장점은 있지만, 명령 출력은 대화에 들어오므로 필요하고 작은 결과만 요청한다. 진단 없이 메모리나 MCP를 무조건 줄이기보다 실제 점유 항목부터 확인하는 것이 핵심이다.'
  points:
  - '`/context`는 현재 컨텍스트 진단용이고 `/usage`는 토큰·사용량 확인용이다. 둘은 목적이 다르다.'
  - 'MCP tool search는 기본 활성화되어 이름·서버 지침을 먼저 불러오고 도구 정의는 검색 시점에 로드한다. Microsoft Foundry 등 지원되지 않는 배포에서는 도구가 미리 로드될 수 있다.'
  - '적용 순서: 점유 내역 확인 → 불필요한 서버·지침 축소 또는 관련 없는 대화 `/clear` → 이어갈 핵심을 정한 뒤 `/compact`. CLI 출력도 컨텍스트를 쓰므로 범위를 제한한다.'
  source: https://code.claude.com/docs/en/costs
  sources:
  - label: Claude Code 명령 치트시트·/context 정의
    url: https://support.claude.com/en/articles/14553413-claude-code-cheatsheet
  - label: MCP tool search 기본 동작과 예외
    url: https://code.claude.com/docs/en/mcp#scale-with-mcp-tool-search
  - label: 토큰 사용량·컨텍스트 관리
    url: https://code.claude.com/docs/en/costs
  interview: '`/context`와 `/usage`는 무엇이 다르며, 확인 뒤 어떤 기준으로 `/clear`와 `/compact`를 선택하나요?'
  answer: '`/context`는 현재 컨텍스트에 무엇이 로드됐는지 진단하고, `/usage`는 토큰·사용 한도 현황을 확인한다. 무관한 작업이면 `/clear`로 새 세션을 시작하고, 현재 작업을 이어가야 하면 보존할 정보를 정해 `/compact`로 요약한다.'
- category: ai
  title: 'UI UX Pro Max — 디자인 참고 데이터를 AI 코딩 에이전트에 연결하기'
  level: "중급"
  summary: 'UI UX Pro Max는 디자인 지침과 검색 스크립트를 묶어 여러 AI 코딩 도구에 제공하는 오픈소스 스킬이다. 프로젝트 설명에 맞는 스타일·색상·타이포그래피·UX 가이드와 기술 스택별 참고 자료를 검색해, 화면 구현 전에 일관된 디자인 방향을 잡도록 돕는다. README는 80개 검색 스타일(51개 활성), 194개 제품 유형·팔레트, 74개 폰트 조합, 22개 기술 스택, 141개 UX 가이드를 명시하며 Jetpack Compose도 지원 대상으로 든다. 이는 프로젝트 자체의 카탈로그 규모이지, 생성된 UI의 사용성이나 접근성이 검증됐다는 뜻은 아니다. 검색 결과를 출발점으로 삼고 기존 디자인 시스템, 실제 사용자 요구, 접근성·기기 테스트로 확인한다. 저장소는 2026-11-22 조회 시 152,591 stars였으며, 별 수는 품질 보증이 아니다.'
  points:
  - 'Claude Code 플러그인 안내: `/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill` 다음 `/plugin install ui-ux-pro-max@ui-ux-pro-max-skill`. README에는 Codex 등 다른 도구용 설치 경로도 있다.'
  - 'Android 스택은 Jetpack Compose로 명시돼 있다. 색·타이포·레이아웃 제안은 앱의 기존 Material 테마와 접근성 요구에 맞게 검토한다.'
  - 'README 카탈로그 수치는 저장소가 공개한 규모이며 사용성 벤치마크가 아니다. 요구사항에 맞는 검색 결과를 고르고 화면 리더·다양한 크기·실기기에서 검증한다.'
  source: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
  sources:
  - label: 프로젝트 README·현재 기능과 설치 경로
    url: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
  - label: Jetpack Compose 공식 UI 테스트 개요
    url: https://developer.android.com/develop/ui/compose/testing
  - label: Jetpack Compose 접근성 검증
    url: https://developer.android.com/develop/ui/compose/accessibility
  interview: 'UI UX Pro Max가 제공하는 스타일·UX 가이드 수치만으로 생성된 Android 화면이 좋은 UX라고 결론 내릴 수 없는 이유는 무엇인가요?'
  answer: '카탈로그의 크기는 참고 자료의 양이지 화면의 적합성이나 접근성을 검증하는 결과가 아니다. 앱 요구사항과 기존 디자인 시스템에 맞는지 확인하고, Compose UI 테스트·접근성 점검·기기별 검증으로 실제 동작을 평가해야 한다.'
- category: ai
  level: "중급"
  summary: 'wshobson/agents는 전문 에이전트·스킬·명령을 플러그인으로 묶고, 여러 코딩 도구에 맞게 변환하는 MIT 프로젝트다. 2026-11-22 기준 저장소는 93개 플러그인, 로컬 소스 기준 에이전트 199개·스킬 185개·명령 103개를 공개하며, Android용 `mobile-android-design` 스킬도 포함한다. 다만 “한 번 작성하면 모든 도구에서 똑같이 동작”하는 것은 아니다. 도구별 기능·권한·모델 이름이 달라 어댑터가 일부 요소를 변환하거나 생략한다. 예를 들어 Codex의 기본 마켓플레이스 경로는 원본 스킬을 제공하지만 생성 에이전트와 명령은 별도 설치 경로를 사용하고, 스킬 본문에는 8KB 제한이 있다. 도구 간 공유를 원한다면 설치 경로와 기능표를 먼저 확인한다.'
  points:
  - '지원 도구: Claude Code·Codex CLI·Cursor·OpenCode·Antigravity CLI·GitHub Copilot·Pi. 컴포넌트 지원 범위는 도구마다 다르다.'
  - 'README는 93개 플러그인과 199 에이전트·185 스킬·103 명령을 나열한다. 에이전트의 모델 별칭은 도구별 이름으로 매핑되며, 난이도에 따른 자동 모델 라우팅과는 다르다.'
  - 'Android 연계 예: `mobile-android-design`은 Material 3·Compose·적응형 화면 참고를 제공한다. 생성 결과는 공식 Android 문서·테스트로 확인한다.'
  source: https://github.com/wshobson/agents
