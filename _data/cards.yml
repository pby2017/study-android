  summary: NatureBench(arXiv 2606.24530·June 2026) — coding agent가 bug-fix reproduction을 넘어 scientific discovery를 할 수 있는가. 5,500 Nature-family papers(2022–25)에서 build-then-verify pipeline으로 90 containerized task — task brief+dataset+held-out test+evaluator. information firewall removes source method — agent must discover not reproduce. 6 domains(cellular omics·protein·biomedical·physical·molecular·relational). SOTA-normalized relative gap g primary metric + validity judge(output fabrication·feedback gaming). Claude Opus 4.7·GPT-5.5 top but far below published SOTA — understanding≠discovery. PaperBench(understand→code) ·PostTrainBench(engineering opt)와 축 분리.
