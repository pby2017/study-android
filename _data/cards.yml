  title: Modal vs Baseten vs Replicate — GPU 추론·파인튜닝 플랫폼 2026 선택 가이드
  summary: '2026년 AI 모델 서빙 플랫폼은 추상화 수준이 다르다. Replicate(Cloudflare): 5만+ 커뮤니티 모델·Cog 패키징·per-GPU-second 과금 — 프로토타입·이미지/비디오 모델에 최적, H100 $5.49/hr. Modal: Python decorator 서버less·per-second 과금·배치/파인튜닝/멀티스텝 파이프라인 — bursty·고볼륨에 유리, H100 ~$3.95/hr. Baseten: Truss+TensorRT-LLM/SGLang/vLLM·SOC2/HIPAA·per-minute dedicated — steady high-throughput 엔터프라이즈, H100 $6.50/hr.'
