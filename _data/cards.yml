  title: Cursor Auto-review — 권한 프롬프트를 '스위치'가 아니라 위험도 다이얼로 만들기
  summary: Cursor Auto-review는 로컬 코딩 에이전트의 자율성을 전부 허용하거나 전부 묻는 방식 대신, 다음 행동의 위험도를 문맥에서 판단하는 안전장치다. Cursor는 2026-06-11 글에서 파일·자격증명·환경변수·MCP 도구·프로덕션 시스템 가까이에서 도는 로컬 에이전트는 권한 프롬프트가 너무 많아도 위험하다고 설명한다. 반복 승인에 익숙해지면 사용자가 읽지 않고 누르기 때문이다. Auto-review는 부모 에이전트의 도구 호출 직전에 작은 classifier 에이전트를 실행해, 명령 자체뿐 아니라 사용자 의도·결과 위험·필요하면 파일 내용까지 보고 통과·차단·피드백을 정한다. 차단도 곧바로 사용자 팝업이 아니라 부모 에이전트에게 설명을 돌려 더 좁고 안전한 경로로 계속하게 설계했다. 교훈은 에이전트 권한 설계가 allowlist 목록보다 "이 요청에서 이 행동이 정당한가"를 평가하는 런타임 정책 문제라는 점이다.
  points:
  - 로컬 에이전트 안전은 전면 허용/전면 확인이 아니라 행동별 문맥 위험도 판단
  - classifier 에이전트가 도구 호출 전 사용자 의도·결과 위험·파일 맥락을 검토
  - 차단 피드백은 부모 에이전트가 더 안전한 경로를 찾게 하는 제어 신호가 된다
  source: https://cursor.com/blog/agent-autonomy-auto-review
- category: ai
  title: Patch the Planet — AI 보안 발견은 '사람 검증'을 지나야 패치가 된다
  summary: OpenAI의 Patch the Planet은 Daybreak 아래에서 Trail of Bits와 함께 오픈소스 유지관리자를 돕는 AI 보안 패치 프로그램이다. 2026-06-22 공개 글은 핵심을 분명히 한다. AI가 취약점 후보를 더 많이 찾는 것만으로는 사용자를 보호하지 못하고, 이미 바쁜 유지관리자에게 미검증 리포트가 쏟아지면 부담만 늘어난다. 그래서 프로그램은 frontier 모델과 Codex Security로 분석·패치·테스트·문서화를 지원하되, Trail of Bits 보안 엔지니어가 재현, 중복 제거, 심각도 재평가, 프로젝트 문서·위협모델 대조를 거쳐 유지관리자에게 전달한다. 초기 참여 프로젝트는 cURL, NATS Server, pyca/cryptography, Sigstore, aiohttp, Go, freenginx, Python, python.org 등이고, Trail of Bits는 19개 프로젝트에서 수백 건 이슈와 수십 개 패치를 보고했다고 밝혔다. 실무 교훈은 AI 보안 자동화의 병목이 탐지가 아니라 검증·우선순위·패치 수용이라는 점이다.
  points:
  - AI 발견 → 전문가 재현·중복 제거·심각도 재평가 → 유지관리자 승인 순서
  - Codex Security와 frontier 모델은 분석·패치·테스트·문서화 지원 도구로 사용
  - 오픈소스 보안 자동화의 핵심 병목은 더 많은 알림이 아니라 검증된 패치 흐름
  source: https://openai.com/index/patch-the-planet/
