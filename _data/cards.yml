  - '차단: 사용자·프로젝트·로컬 훅과 기타 플러그인 훅; 내장 mod는 유지'
  - 명령 출처 플러그인은 별도 설정이 없으면 비활성화
  source: https://code.claude.com/docs/en/settings-reference#allowmanagedhooksonly
  interview: "allowManagedHooksOnly를 켰을 때 차단되지 않는 항목과 주의할 플러그인 예외는 무엇인가요?"
  answer: "관리 훅, SDK 훅, 관리 설정이 강제로 활성화한 플러그인 훅은 실행되고 내장 mod도 유지된다. 그 밖의 훅은 차단되며, 명령 출처 플러그인은 기본 비활성화된다."
- category: ai
  level: "중급"
  title: MCP 리소스·프롬프트 — URI로 자료를 붙이고 명령으로 작업 재사용
  summary: MCP 서버는 도구 외에도 리소스와 프롬프트를 제공할 수 있다. @server:protocol://resource/path로 리소스를 참조하면 자동으로 가져와 대화에 첨부한다. 서버 프롬프트는 /servername:promptname 또는 /mcp__servername__promptname으로 실행하고, 결과는 대화에 삽입된다.
  points:
  - '리소스: @ 자동완성에서 찾아 URI로 지정하면 자동 첨부'
  - '프롬프트: 서버명·프롬프트명으로 된 슬래시 명령으로 실행'
  - claude -p에서는 리소스 멘션이 일반 텍스트로 남음
  source: https://code.claude.com/docs/en/mcp
  interview: "MCP 리소스와 프롬프트는 Claude Code에서 어떻게 호출되며, claude -p의 리소스 멘션은 어떻게 처리되나요?"
  answer: "리소스는 URI 형식의 @ 멘션으로 참조해 자동 첨부하고, 프롬프트는 슬래시 명령으로 실행한다. 단 claude -p에서는 리소스 멘션이 조회되지 않고 일반 텍스트다."
- category: ai
  level: "초급"
  title: /btw — 대화 흐름을 끊지 않는 곁다리 질문
  summary: /btw는 현재 작업에 대한 질문을 본 대화 기록에 추가하지 않고 답한다. 이미 읽은 파일과 도구 결과 등 대화 컨텍스트만 사용하므로 새 파일을 읽거나 명령·검색을 실행하지 못한다. 작업 중에도 메인 응답을 중단하지 않으며, f를 누르면 질문과 답을 배경 서브에이전트에 넘겨 도구 작업을 이어갈 수 있다.
  points:
  - 질문·답변은 본 대화 기록에 추가되지 않고 터미널 오버레이에 표시
  - 도구 없이 기존 컨텍스트만 사용; 진행 중인 메인 응답은 중단하지 않음
  - f로 배경 서브에이전트에 전달해 도구 사용으로 이어가기
  source: https://code.claude.com/docs/en/interactive-mode
  interview: "/btw가 이미 읽은 파일과 아직 읽지 않은 파일에 대해 답하는 방식은 어떻게 다른가요?"
  answer: "이미 컨텍스트에 있는 내용은 참고하지만 새 파일 읽기, 명령 실행, 검색은 못 한다. 도구가 필요한 후속 작업은 f로 배경 서브에이전트에 넘긴다."
- category: ai
  level: "중급"
  title: claude -p --bare — 자동 탐색을 끄고 필요한 기능만 넘기기
  summary: claude -p는 기본적으로 프로젝트와 사용자 설정에서 훅·스킬·플러그인·MCP·CLAUDE.md 등을 자동 탐색한다. --bare는 이 탐색을 건너뛰어 스크립트가 필요한 입력만 명시하게 한다. 단 settings와 권한 규칙은 여전히 읽지만 훅은 --settings로 전달해도 실행되지 않는다. Anthropic API 사용 시 OAuth나 키체인 대신 API 키 또는 apiKeyHelper가 필요하다.
  points:
  - 자동 탐색 중단: 훅·스킬·명령·에이전트·플러그인·MCP·자동 메모리·CLAUDE.md
  - settings·권한 규칙은 읽지만 훅은 실행하지 않음; MCP와 에이전트는 명시 전달
  - Anthropic API 인증은 API 키 또는 apiKeyHelper; 클라우드 제공자 자격 증명은 별도
  source: https://code.claude.com/docs/en/headless
  interview: "--bare로 실행해도 settings의 권한 규칙과 훅이 모두 무시되나요? Anthropic API 인증은 어떻게 준비해야 하나요?"
  answer: "settings와 권한 규칙은 읽지만 훅은 실행하지 않는다. 자동 발견을 건너뛴 MCP·에이전트 등은 명시적으로 넘기고, Anthropic API는 API 키나 apiKeyHelper를 제공해야 한다."
- category: ai
  level: "중급"
  title: /usage — 플랜 사용량의 기여도와 기간 보기
  summary: /usage는 현재 세션의 토큰·비용뿐 아니라 Pro·Max·Ultra·Team·Enterprise 플랜의 한도 사용량도 보여준다. 계획 사용량 분석은 최근 사용을 스킬·서브에이전트·플러그인·MCP 서버별 비율로 귀속하고 개선 권고를 제공한다. 수치는 이 기기의 최근 세션 기록으로 계산한 근사치이며 다른 기기나 claude.ai 사용량은 포함하지 않는다.
  points:
  - 플랜 한도 사용량을 스킬·서브에이전트·플러그인·MCP 서버별 비율로 표시
  - d/w로 최근 24시간과 7일 전환; MCP 비율은 도구 결과를 소비한 요청만 집계
  - 로컬 세션 기록 기반 근사치 — 다른 기기와 claude.ai 사용량은 제외
  source: https://code.claude.com/docs/en/costs#plan-usage-breakdown
  interview: "/usage의 스킬·MCP 비율은 정확한 청구액인가요? MCP 서버에 한 번 연결하면 이후 모든 사용량이 그 서버에 귀속되나요?"
  answer: "아니다. 기기 로컬 세션 기록으로 계산한 근사 비율이지 청구액이 아니며 다른 기기나 claude.ai 사용량은 포함하지 않는다. MCP 서버 비율도 그 서버 도구 결과를 실제로 소비한 요청만 센다."
- category: ai
  level: "중급"
  title: 오토 메모리 — 지침과 학습한 선호를 세션 사이에 구분하기
  summary: CLAUDE.md는 사용자가 적는 지침이고, 오토 메모리는 Claude가 선호·교정·프로젝트 맥락을 기록하는 메모다. 메모리는 기본적으로 로컬 세션에서 켜지며 Git 저장소 단위의 기기 로컬 디렉터리에 저장된다. 시작할 때는 MEMORY.md 앞 200줄 또는 25KB만 읽고, 주제별 파일은 필요할 때 읽는다.
  points:
  - CLAUDE.md는 행동 규칙, 오토 메모리는 재사용할 학습 내용; 둘 다 강제 설정은 아님
  - 같은 저장소의 worktree는 메모리를 공유하지만 다른 기기·클라우드와 동기화하지 않음
  - /memory에서 확인·수정·삭제; 설정이나 CLAUDE_CODE_DISABLE_AUTO_MEMORY=1로 끄기
  source: https://code.claude.com/docs/en/memory
  interview: "오토 메모리의 주제별 파일이 존재하면 새 세션 시작 때 전부 읽히나요? 같은 Git 저장소의 worktree 사이에서는 메모리를 공유하나요?"
  answer: "아니다. 시작 때 MEMORY.md의 앞 200줄 또는 25KB만 읽고 주제별 파일은 필요할 때 읽는다. 같은 저장소의 worktree는 기기 로컬 메모리 디렉터리를 공유하지만 다른 기기나 클라우드와 동기화하지 않는다."
- category: ai
  level: "중급"
  title: Claude Code IDE 연결 — 선택 문맥과 도구 권한 구분하기
  summary: VS Code 확장이 켜져 있으면 CLI는 내장 `ide` MCP 서버에 자동 연결된다. 서버는 편집기 선택 영역과 열린 파일 경로를 프롬프트에 붙이고, diff를 VS Code에서 연다. 외부 터미널은 `/ide`로 연결한다.
  points:
  - 선택 영역 첨부를 끄거나 `Read` deny 규칙으로 민감 파일의 선택 내용·경로를 제외할 수 있음
  - 모델에 보이는 도구는 진단 조회와 Jupyter 코드 실행; 진단 조회는 읽기 전용
  - Jupyter 실행 도구는 호출 전 VS Code 확인을 요구하며, MCP 도구 allowlist와 별개임
  source: https://code.claude.com/docs/en/ide-integrations
  interview: "`mcp__ide__executeCode`를 MCP allowlist에 넣으면 노트북 코드가 즉시 실행되나요? 민감 파일의 선택 내용은 어떻게 제외하나요?"
  answer: "아니다. VS Code의 Quick Pick 확인을 별도로 통과해야 실행된다. 민감 파일은 `Read` deny 규칙을 설정하면 선택 내용과 열린 파일 경로 모두 컨텍스트에서 제외된다."
- category: ai
  level: "중급"
  title: 스킬 동적 컨텍스트 — 셸 출력을 넣기 전에 권한부터 확인하기
  summary: 스킬 본문에서 줄 시작 또는 공백 뒤의 `!`명령``은 Claude가 본문을 받기 전에 실행되고, 출력이 자리표시자를 대체한다. 따라서 스킬을 호출하는 것만으로 명령이 무조건 실행되는 것은 아니다.
  points:
