  summary: 'Label Studio는 HumanSignal이 만든 가장 널리 사용되는 오픈소스 데이터 라벨링 플랫폼이다. 이미지· 텍스트·오디오·비디오·타임시리즈·멀티모달 데이터를 단일 UI에서 라벨링. ML 백엔드 연동으로 모델 예측→인간 검수 Active Learning 루프 구축 가능. 2026년 LLM/에이전트 평가 기능 추가: RLHF 선호도 라벨링, RAG 검색 QA, 에이전트 트레이스 리뷰. Vibe Code로 커스텀 인터페이스 생성(Enterprise).

    '
  points:
  - '멀티모달: 이미지·텍스트·오디오·비디오·타임시리즈'
  - 'ML 백엔드: Active Learning 루프, 모델 예측→인간 검수'
  - 'LLM 평가: RLHF·RAG QA·에이전트 트레이스 리뷰'
