  title: MobileLLM-Flash(Meta) — 하드웨어 인더 루프 아키텍처 검색으로 모바일 최적 LLM 설계, ExecuTorch 호환
  summary: 'MobileLLM-Flash는 Meta가 모바일 레이턴시에 최적화된 LLM을 설계하기 위해 만든 하드웨어 인더 루프 아키텍처 검색(NAS) 프레임워크다. 사전학습된 백본의 가중치를 상속받아 프루닝 기반 후보를 생성하고, 레이턴시 모델을 학습해 파레토 최적 아키텍처를 찾는다. 얕고 넓은(shallow-and-wide) 구조 + 인터리브드 스킵 어텐션이 모바일 CPU에서 최적. ExecuTorch 호환, 학습 토큰 35%만으로 동등 품질 달성.

    '
  points:
  - '하드웨어 인더 루프 NAS: 레이턴시 모델 학습 → 파레토 최적 검색'
  - '35% 토큰으로 동등 품질: 프루닝 기반 가중치 상속'
  - 'ExecuTorch 호환: shallow-and-wide + 스킵 어텐션'
  source: https://arxiv.org/html/2603.15954v2
