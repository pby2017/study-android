- category: ai
  title: DX 도구별 PR 처리량 벤치마크 — '얼마나 자주 쓰느냐'가 도구 이름보다 크다
  summary: 'DX가 219개 기업·6만4,680명 개발자의 ''실제 머지된 PR'' 데이터를 AI 도구별로 다시 집계했다(2026 Q1, 2026-01-21 갱신). headline은 도구 순위보다 사용 빈도다. 매일 쓰는 개발자의 주당 머지 PR 중앙값은 Cursor 2.8→4.1(46% 증가), Claude 주간·월간 사용자는 4.0 초과, GitHub Copilot 일간 사용자는 2.5→3.61로 올랐다. 반대로 adoption 지표는 생산성 자체가 아니라 ''일상 도구가 됐는지''를 보는 보조 신호다. Copilot은 일간 adoption 9.76%로 가장 끈끈했고, Cursor는 주간 adoption 31.56%, Windsurf는 월간 adoption 35.87%로 패턴이 달랐다. 교훈은 벤더 이름으로 ROI를 단정하지 말고, 일간·주간 cohort별 사용 빈도와 실제 PR 처리량을 같이 봐야 한다는 점이다.

    '
  points:
  - '표본: 219개 기업·64,680명 개발자의 실제 머지 PR, 2026 Q1'
  - '빈번 사용자 주당 PR 중앙값: Cursor 4.1(+46%)·Claude 4.0+·Copilot 3.61'
  - '운영 포인트: seat 수가 아니라 daily/weekly cohort 사용률 + PR 처리량을 함께 추적'
  source: https://getdx.com/blog/ai-tooling-benchmarks-pr-throughput-and-usage-by-tool/
- category: ai
  title: Everything Claude Code(ECC) — 200k★ 넘긴 '에이전트 설정 모음', AgentShield 보안 감사기까지
  summary: 'Affaan Mustafa의 ECC는 "Claude Code 설정 모음"에서 크로스하네스 에이전트 운영 시스템으로 확장된 MIT 프로젝트다. 2026-06-25 같은 런에서 GitHub API 기준 221,207★·33,877 forks·archived=false를 확인했고, README는 Codex·Claude Code·Cursor·OpenCode·Gemini·Zed·Copilot을 지원한다고 설명한다. v2.0.0은 261개 skills, control-pane substrate, worktree lifecycle service, `orch-*` orchestrator 계열을 내세우고, RC 문서에는 66 agents·268 skills·84 legacy command shims 같은 설치 표면 수가 별도로 나온다. 실무 포인트는 숫자를 그대로 베끼는 게 아니라, 플러그인·수동 설치·rules 복사 경로를 섞으면 중복 동작이 생긴다는 README 경고처럼 "에이전트 자산 배포"도 설치 상태와 권한 경계를 관리해야 한다는 점이다. AgentShield는 별도 CLI/GitHub Action/App로 `.claude/` 설정의 secret, permission, hook, MCP, agent prompt injection 위험을 A~F 리포트와 JSON/HTML/evidence pack으로 감사한다.

    '
  points:
  - '같은 런 검증: 221,207★·33,877 forks·MIT·archived=false'
  - 'v2.0.0: 261 skills, control pane, worktree lifecycle, `orch-*` orchestration'
  - 'AgentShield: CLI/Action/App로 secrets·permissions·hooks·MCP·agent prompts 감사'
  source: https://github.com/affaan-m/ECC
- category: ai
  title: Sim — '채팅·비주얼·코드'로 AI 에이전트를 짜는 오픈소스 워크스페이스(28.9k★)
  summary: 'Sim(simstudioai/sim)은 팀이 AI 에이전트를 만들고 배포·운영하는 Apache-2.0 오픈소스 워크스페이스다. 2026-06-25 GitHub API 기준 28,859★·3,674 forks·archived=false이고, README는 "Build conversationally, visually, or with code"를 핵심 흐름으로 설명한다. 대화형 Chat은 워크스페이스를 이해한 뒤 에이전트를 만들고 실행하며, Workflow builder는 블록 캔버스에서 자연어로 블록 생성·변수 연결·오류 수정을 돕는다. 문서/보고서 생성, RAG 지식베이스, 내장 Tables, 1,000개 이상 통합도 같은 워크스페이스에 묶인다. 실무 포인트는 low-code 도구를 "간단한 챗봇 빌더"로만 보지 말고, Chat·캔버스·코드·DB·RAG·실행 환경을 한 팀 작업대로 묶을 때 어떤 권한과 운영 경계가 필요한지 보는 것이다. 로컬 실행은 Docker 기반 `npx simstudio`, 더 깊은 self-host는 PostgreSQL+pgvector와 Bun/Next.js 스택을 요구한다.

    '
  points:
  - '같은 런 검증: 28,859★·3,674 forks·Apache-2.0·archived=false'
  - '구성 3방식: Chat·블록 Workflow builder·코드 / RAG 지식베이스·Tables·문서 생성'
  - 'self-host: `npx simstudio` 빠른 실행, 고급 구성은 PostgreSQL+pgvector·Bun·Next.js'
  source: https://github.com/simstudioai/sim
- category: ai
  title: Sentry Seer — 프로덕션 텔레메트리로 근본원인을 찾아 코딩 에이전트에 넘기는 디버깅 에이전트
  summary: 'Seer는 Sentry의 AI 디버깅 에이전트다. 스택트레이스를 챗봇에 붙여넣는 대신, Sentry가 이미 수집한 에러·트레이스·로그·메트릭·소스코드를 합쳐 "어디서 터졌나"보다 "왜 터졌나"를 추론한다. 2026-01-27 발표로 범위가 프로덕션 RCA에서 로컬 개발과 코드리뷰까지 넓어졌다. 로컬에서는 Sentry MCP 서버가 재현 중 생긴 텔레메트리를 보내고, Seer가 원인 분석 결과를 Claude·Cursor·Copilot 같은 코딩 에이전트의 수정 컨텍스트로 넘긴다. PR에서는 스타일 지적보다 배포 뒤 장애가 될 가능성이 큰 결함을 찾는다. 교훈은 AI 디버깅을 코드 정적 분석만으로 보지 말고, 런타임 텔레메트리와 PR 컨텍스트를 같은 루프에 묶어야 한다는 점이다. 요금은 Seer 연결 저장소에서 월 2개 이상 PR을 만든 active contributor 기준 $40/월이다.

    '
  points:
  - 런타임 텔레메트리(에러·트레이스·로그·메트릭) + 소스코드로 정적 분석이 놓치는 분산·부하·프로덕션 버그 RCA
  - 로컬 재현은 Sentry MCP 서버로 코딩 에이전트에 연결, PR에서는 장애 가능성이 큰 결함 중심 리뷰
  - 요금은 Seer-connected repo에서 월 2개 이상 PR을 만든 active contributor당 $40/월, Seer 사용량은 PAYG와 별도
  source: https://sentry.io/about/press-releases/sentry-expands-seer-ai-debugging-agent
- category: ai
  title: Jules(Google) — plan-first VM agent·CI auto-fix loop·Jules API alpha
  summary: Jules(Google Labs·GA 2025-08)는 GitHub-native async coding agent — task마다 fresh Google Cloud VM clone·setup script·plan approval 후 코드 변경·PR. 2026-03 Gemini 3.1 Pro default(Pro tier)로 reasoning uplift. CI auto-fix loop — PR 생성 후 GitHub Actions 실패 감지→fix commit→resubmit, 사람 개입 없이 CI red→green close. Jules API(v1alpha·developers.google.com/jules/api) — Source·Session·Activity REST, Slack·Linear·GitHub custom workflow embed, requirePlanApproval로 plan gate 선택. AGENTS.md 자동 ingest·등급별 quota(무료 15/day·Pro 100·Ultra 300). vs Claude Code Web ·Codex Cloud ·Jules competitor Devin — Jules=GitHub issue→PR async with built-in CI babysitting.
  points:
  - CI fixer — Actions failure output→patch→push without keyboard
  - Jules API alpha — programmatic session, auto plan approval option
  - Fresh VM per task — secret·setup script review, no private code training
  source: https://developers.google.com/jules/api
- category: ai
  title: /fork — 서브에이전트와 달리 '대화 전체'를 물려받는 분신 띄우기
  summary: '서브에이전트는 정의 파일의 새 컨텍스트에서 시작하지만, fork는 생성 순간의 대화 전체를 그대로 복제해 백그라운드에서 도는 분기 세션이다. 현재 히스토리·시스템 프롬프트·도구·모델을 모두 물려받기 때문에, 같은 맥락을 다시 설명하지 않고 대안 조사나 검증을 맡기기 좋다. 결과는 완료 후 메인 대화에 메시지로 돌아오고, 실행 중에는 별도 패널에서 열어 후속 지시를 줄 수 있다. 핵심 차이는 캐시와 격리다. fork의 첫 요청은 부모와 같은 프롬프트·도구 정의라 부모 프롬프트 캐시를 재사용하지만, 명명된 서브에이전트는 별도 캐시와 전용 시스템 프롬프트를 쓴다. 파일 편집이 섞이면 위험하므로, 독립 작업에는 worktree 격리나 명확한 쓰기 범위를 함께 잡아야 한다.

    '
  points:
  - fork=전체 대화·동일 도구·동일 모델·공유 프롬프트 캐시 / 명명된 서브에이전트=새 컨텍스트·전용 정의·별도 캐시
  - 실행 중 패널에서 fork transcript를 열어 후속 지시 가능, 완료 결과만 메인 대화에 도착
  - fork는 또 다른 fork를 만들 수 없음 / Agent tool 경유 시 worktree 격리로 파일 편집 충돌을 줄일 수 있음
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: Task Master — PRD를 던지면 '의존성 달린 태스크 목록'으로 쪼개주는 에이전트(MIT+CC)
  summary: 'Task Master(eyaltoledano/claude-task-master)는 PRD·spec·GitHub issue를 `parse-prd`로 dependency-aware task graph로 바꿔, 에이전트가 "다음에 뭘 해야 하나"를 추측하지 않게 만드는 태스크 매니저다. MCP로 Cursor·Claude Code·Windsurf·VS Code·Amazon Q CLI에 붙거나 `npm i -g task-master-ai` CLI로 쓸 수 있고, `next`·`list`·`expand`·`analyze-complexity`·`set-status`로 작업 흐름을 관리한다. 핵심은 PRD를 작은 TODO로 쪼개는 데서 끝나지 않고, main/research/fallback 모델 역할과 optional research model, 태스크 의존성·복잡도·workstream tag를 함께 운영 표면으로 만든다는 점이다. 별도 API 키를 쓰거나 Claude Code/Codex CLI OAuth 경로를 쓸 수 있지만, 어떤 경로든 "상세 PRD가 좋아야 좋은 태스크가 나온다"는 제약은 그대로다.

    '
  points:
  - PRD/spec/issue→task graph — dependency edge·priority·complexity·status를 명시
  - MCP+CLI 동시 지원 — editor chat 안에서는 tool, 자동화에서는 `task-master` command
  - GitHub API 기준 27.7k★·archived=false, README 표기는 MIT with Commons Clause
  source: https://github.com/eyaltoledano/claude-task-master
- category: ai
  title: Claude Agent SDK — 'Claude Code를 라이브러리로' 받아 자체 에이전트를 짜는 공식 SDK
  summary: 'Claude Agent SDK는 Claude Code를 구동하는 도구·에이전트 루프·컨텍스트 관리를 Python·TypeScript 라이브러리로 노출하는 Anthropic 공식 SDK다. 핵심은 Messages API처럼 모델 응답만 받는 것이 아니라, Read·Edit·Bash·Grep·WebFetch 같은 내장 도구 실행과 세션 관리를 포함한 에이전트 루프를 `query()`로 프로그램에서 돌린다는 점이다. TypeScript SDK는 네이티브 Claude Code 바이너리를 optional dependency로 묶어 별도 CLI 설치 부담을 줄이고, Python은 3.10 이상을 요구한다. 실무 구분도 명확하다. 대화형 개발·일회성 작업은 CLI가 맞고, CI/CD·커스텀 앱·프로덕션 자동화는 SDK가 맞다. Managed Agents가 Anthropic 호스팅 REST API라면, Agent SDK는 루프를 내 프로세스 안에서 돌려 권한·MCP·훅·세션 저장 방식을 직접 설계해야 한다.

    '
  points:
  - Python/TypeScript에서 Claude Code의 도구 실행·컨텍스트 관리·세션을 `query()`로 호출
  - 내장 도구, Hooks, Subagents, MCP, Permissions, Sessions를 SDK 기능으로 제공
  - CLI=대화형 개발, SDK=CI/CD·커스텀 앱·프로덕션 자동화, Managed Agents=호스팅 REST API
  source: https://code.claude.com/docs/en/agent-sdk/overview
- category: ai
  title: AI 랩이 개발 툴체인을 사들이는 중 — Anthropic→Bun($1B), OpenAI→Astral(FTC 승인)
  summary: 'AI 랩이 코딩 에이전트의 바깥 도구까지 사들이기 시작했다. Anthropic은 2025-12 Bun(JavaScript runtime·bundler·test runner)을 인수 — Claude Code가 Bun executable로 배포되며 "Bun이 깨지면 Claude Code가 깨진다". Claude Code $1B run-rate(6개월) milestone과 동시 발표. OpenAI는 2026-03 Astral(uv·Ruff·ty) 인수 발표, 2026-04 FTC early termination 승인으로 close 진행 — Astral 팀 Codex 합류. uv 126M·Ruff 179M monthly downloads. Bun·Astral 모두 MIT/오픈소스 지속 약속. 실무: Node/pip 대신 Bun/uv가 에이전트 기본 toolchain으로 밀리는 추세 — 소유권·로드맵·포크 가능성을 도구 리스크로 관리.

    '
  points:
  - Anthropic→Bun(2025-12, $1B milestone) — Claude Code native installer·single binary distribution
  - OpenAI→Astral(2026-03 announce, 2026-04 FTC approve) — uv·Ruff·ty→Codex Python lifecycle
  - Strategic asset — install·lint·format·typecheck loop가 에이전트 vendor roadmap에 편입
  source: https://openai.com/index/openai-to-acquire-astral/
- category: ai
  title: ccpi + tonsofskills.com — 플러그인·스킬·에이전트를 키워드로 검색·설치하는 오픈소스 마켓플레이스 CLI
  summary: 'Tons of Skills는 Claude Code용 플러그인·스킬·에이전트를 GitHub marketplace repo와 웹 카탈로그, ccpi CLI로 묶은 오픈소스 배포 표면이다. 현재 README는 432개 플러그인, 2,769개 스킬, 297개 에이전트와 30명 커뮤니티 기여자를 내세우며, `marketplace.extended.json`과 Claude Code CLI가 읽는 `marketplace.json`을 같은 원천으로 둔다고 설명한다. ccpi는 `pnpm add -g @intentsolutionsio/ccpi`로 설치해 검색·설치·목록·업데이트·검증을 맡고, Claude Code 안에서는 `/plugin marketplace add jeremylongshore/claude-code-plugins`로 바로 붙일 수 있다. 실무 포인트는 "좋은 프롬프트 모음"이 아니라, 팀 공용 에이전트 자산을 검증 가능한 패키지와 카탈로그로 배포하는 운영 문제로 보는 것이다.

    '
  points:
  - 현재 README 기준 432 plugins·2,769 skills·297 agents·30 contributors
  - '`marketplace.extended.json`과 Claude Code CLI용 `marketplace.json`을 같은 카탈로그 원천으로 관리'
  - validator와 공개 100점 rubric으로 spec-correct 패키지만 병합하는 구조
  source: https://github.com/jeremylongshore/claude-code-plugins-plus-skills
- category: ai
  title: BMAD-METHOD — '애자일 팀 전체'를 에이전트로 흉내 내는 IDE 비종속 개발 방법론(49.7k★)
  summary: 'BMAD-METHOD(BMad Method)는 코딩 에이전트 하나를 잘 쓰는 팁이 아니라, 기획→분석→아키텍처→구현→테스트를 12+ 전문 에이전트와 34+ 워크플로로 나누는 AI 주도 개발 프레임워크다. V6 기준 `bmad-help`가 다음 단계를 안내하고, Party Mode는 여러 페르소나를 한 세션에 불러 토론하게 하며, 모듈 구조는 BMad Builder·Test Architect·Game Dev Studio 같은 도메인 확장을 붙인다. 실무 포인트는 "바로 코드"가 아니라 웹 번들(Gemini Gems·ChatGPT Custom GPTs)로 브레인스토밍·제품 브리프·PRD·UX·시장조사를 먼저 정리한 뒤, 그 산출물을 IDE 에이전트로 넘겨 구현 컨텍스트 누락을 줄이는 것이다. 2026-06-26 확인 기준 GitHub 49,673★·5,737 forks, 최신 릴리스 v6.9.0(2026-06-22), MIT 라이선스다.

    '
  points:
  - 12+ 전문 에이전트와 34+ 워크플로로 기획·설계·구현·테스트를 단계화
  - 웹 번들로 PRD·UX·시장조사를 먼저 만들고 IDE 에이전트에는 정리된 산출물을 전달
  - '`npx bmad-method install`; Node 20.12+·Python 3.10+·uv 필요, v6.9.0 최신 릴리스'
  source: https://github.com/bmad-code-org/BMAD-METHOD
- category: ai
  title: OpenSpec — Spec Kit보다 가볍게, 코드 짜기 전에 '무엇을 만들지'부터 합의하는 SDD(56.6k★)
  summary: 'OpenSpec은 AI 코딩 에이전트용 명세 주도 개발(SDD) 프레임워크다(MIT, 2026-06-26 확인 기준 56,605★). 이미 다룬 GitHub Spec Kit이 파이썬 설치·엄격한 단계 게이트의 ''무거운'' 쪽이라면, OpenSpec은 ''fluid not rigid, brownfield not just greenfield''를 내세워 더 가볍게 반복하도록 설계됐다. 핵심은 변경(change) 단위 워크플로다. 불확실하면 `/opsx:explore`로 코드와 선택지를 먼저 훑고, `/opsx:propose`로 proposal/specs/design/tasks가 담긴 변경 폴더를 만들고, `/opsx:apply`로 구현한 뒤, `/opsx:archive`로 완료분을 정리하면서 실제 스펙을 갱신한다. Claude Code·Cursor 등 25개 이상 도구와 npm/pnpm/yarn/bun/nix로 붙고, Node 20.19+가 필요하다. 최신 릴리스는 v1.4.1(2026-06-03)이다.

    '
  points:
  - '변경 단위 흐름: /opsx:explore → /opsx:propose → /opsx:apply → /opsx:archive'
  - 'Spec Kit과의 차이: 엄격한 단계 게이트보다 자유로운 산출물 수정과 brownfield 도입을 강조'
  - 25+ 도구 지원, MIT 라이선스, Node 20.19+ 필요, 최신 릴리스 v1.4.1
  source: https://github.com/Fission-AI/OpenSpec
- category: ai
  title: Code Mode(Cloudflare) — MCP 도구를 'TypeScript API'로 바꿔 LLM에게 코드로 호출하게 하기
  summary: Cloudflare Code Mode는 MCP 도구를 LLM에게 직접 tool call로 노출하지 않고, doc 주석 달린 TypeScript API로 바꾼 뒤 LLM이 그 API를 호출하는 코드를 쓰게 하는 패턴이다. 핵심은 "도구 호출을 잘 고르기"보다 "짧은 코드를 써서 search→execute→filter→compose를 샌드박스 안에서 끝내기"다. cloudflare/mcp 서버는 Cloudflare API 2,500+ endpoint를 docs/search/execute 세 도구와 약 1.1k token footprint로 노출한다. codemode=false로 끄면 endpoint별 2,594개 도구가 등록되고 required param만 남겨도 약 244k token이 든다. 실행은 Dynamic Worker Loader의 V8 isolate에서 돌며, 일반 인터넷 접근은 막고 MCP binding만 열어 API key를 LLM 코드에 노출하지 않는다.
  points:
  - cloudflare/mcp — docs/search/execute 3 tools, 2,500+ endpoints, GraphQL Analytics까지 같은 execute 경로
  - Token budget — Code Mode 약 1.1k vs endpoint별 MCP 최소 스키마 약 244k
  - Sandbox — V8 isolate + MCP binding, 일반 인터넷 차단, supervisor가 token 보관
  source: https://github.com/cloudflare/mcp
- category: ai
  title: 에이전트 팀으로 C 컴파일러 짜기(Anthropic) — 병렬 자율 에이전트 '하네스'를 설계하는 실전 교훈
  summary: 'Anthropic 연구원 Nicholas Carlini가 Claude 에이전트 16개를 동시에 돌려, Linux 6.9를 x86·ARM·RISC-V에서 빌드하는 10만 줄짜리 Rust C 컴파일러를 만든 실험 기록이다(약 2,000세션·약 $20,000 소요). 핵심 교훈은 도구 이름이 아니라 ''하네스(작업 환경)''를 어떻게 설계하느냐에 있다. 검증기(verifier)가 거의 완벽해야 하며 그렇지 않으면 "Claude가 엉뚱한 문제를 푼다". 또 Claude는 시간 감각이 없어("can''t tell time") 방치하면 진척 대신 테스트만 몇 시간씩 돌리므로, 1%·10% 무작위 샘플을 도는 --fast 옵션으로 회귀를 빨리 잡게 했다.

    '
  points:
  - 검증기가 곧 목표 — "task verifier가 거의 완벽하지 않으면 Claude는 엉뚱한 문제를 푼다". 기능 추가가 기존 동작을 자주 깨뜨려 결국 CI를 붙임
  - '병렬화: 테스트가 많이 깨질 땐 각 에이전트가 하나씩 집어 쉽지만, 단일 Linux 빌드는 서로 덮어써 충돌 → GCC를 ''known-good 오라클''로 실패 파일 격리'
  - '하네스 위생: 출력 범람 막으려 파일로 로깅·에러는 grep으로 찾게 표시, 작업 점유는 current_tasks/에 파일을 써서 잠금(git이 충돌 시 다른 작업 고르게 강제)'
  source: https://www.anthropic.com/engineering/building-c-compiler
- category: ai
  title: 서브에이전트 4가지 패턴(Philipp Schmid) — '메인 에이전트가 쥔 통제권' 순으로 줄 세우기
  summary: '구글 딥마인드 Philipp Schmid가 2026-05-05에 정리한, 멀티에이전트를 짤 때 고를 수 있는 4가지 패턴이다. 메인 에이전트가 서브에이전트의 생애주기를 얼마나 쥐고 있느냐(통제 수준) 순으로 배열했고, 그에 따라 메인의 역할도 호출자→디스패처→코디네이터→감독자로 바뀐다. 핵심 조언은 "무조건 패턴 1부터 시작하라" — 멀티에이전트처럼 보이는 작업 대부분은 잘 짠 인라인 도구 호출 하나로 끝나며, 위로 올라갈수록 더 센 모델이 필요하다.

    '
  points:
  - '패턴1 인라인 툴: 서브에이전트를 도구 호출 하나로 부르고 결과를 받음 — 리서치·코드리뷰·테스트 생성 같은 자기완결 작업'
  - '패턴2 팬아웃: 여러 서브에이전트를 동시에 띄우고 나중에 결과를 모음 — 서로 의존 없는 독립 작업의 병렬화'
  - '패턴3 에이전트 풀: 장수명 서브에이전트들과 메시지를 주고받으며 다단계 협업 / 패턴4 팀: 서브들끼리 직접 대화하고 메인은 역할만 세팅 후 빠짐 — 조정 로직이 한 에이전트 한계를 넘을 때만'
  source: https://www.philschmid.de/subagent-patterns-2026
- category: ai
  title: 에이전트 코딩의 '80% 문제' — 보이는 80%는 끝내고 안 보이는 20%(인증·DTO·타 레포)를 빼먹는다
  summary: 'Sourcegraph의 Matt Tanner가 2026-05-21에 올린 ''Agentic Coding in 2026'' 글의 핵심은, 에이전트 생산성을 좌우하는 건 모델 성능이 아니라 ''컨텍스트''라는 것이다. 에이전트는 작업의 눈에 보이는 80%는 안정적으로 끝내지만, 인증 미들웨어·API DTO·감사 로그·형제 레포의 통합 테스트 같은 안 보이는 20%를 빼먹는데 — 글은 이를 ''80% 문제''라 부른다. 사이드 프로젝트에선 안 드러나지만 레포 수가 1을 넘는 순간부터 급격히 비용이 커진다. 해법으로 임베딩 기반 근사 검색이 아닌 ''심볼 정확 검색(모든 callsite·구현체)''을 권한다.

    '
  points:
  - '''완료''를 의심하라: 에이전트가 끝났다 하면, 손댄 심볼들을 코드베이스 전체에서 검색해 에이전트가 안 연 파일이 나오면 작업은 미완 — 글이 꼽은 가장 실천적 습관'
  - '권장 운영법: ①과제 블래스트 반경을 레포 전역 검색으로 미리 스코프 ②에이전트 커밋도 사람 커밋과 ''같은 CI''로 게이트 ③에이전트를 외주 계약자처럼 다뤄 diff 리뷰·활동 감사 ④프롬프트가 아니라 ''컨텍스트 레이어''에 투자'
  - 대규모/멀티레포에선 임베딩 근사 검색보다 '결정적·전수(deterministic, exhaustive) 검색'을 권장 — 단 Sourcegraph 자사(코드검색 제품) 글이라 제품 포지셔닝은 감안할 것
  source: https://sourcegraph.com/blog/agentic-coding
- category: ai
  title: chrome-devtools-mcp(Google) — CDP MCP·Codex Developer mode, 브라우저 F12를 에이전트에(44.4k★)
  summary: chrome-devtools-mcp(ChromeDevTools/chrome-devtools-mcp·Apache-2.0·44,438★ live check)는 Chrome DevTools Protocol(CDP)을 MCP로 열어 DOM·console·network·performance trace·Lighthouse를 에이전트 도구로 만든다. 기본 설정은 `npx -y chrome-devtools-mcp@latest`, Codex는 `codex mcp add chrome-devtools -- npx chrome-devtools-mcp@latest`로 붙인다. 가벼운 브라우저 작업은 `--slim --headless`, 동시 에이전트는 `--experimentalPageIdRouting`, 세션별 임시 프로필은 `--isolated`가 안전하다. Codex app Developer mode는 Browser plugin의 @Browser/@Chrome에 full CDP를 주지만, Settings > Browser에서 켜야 하고 사이트별 명시 승인을 요구하며 조직은 `browser_use_full_cdp_access=false`로 끌 수 있다. 핵심은 "스크린샷 보고 추측"이 아니라 실제 콘솔·네트워크·DOM·성능 trace를 읽게 하되, 로그인 세션·쿠키·브라우저 내부 데이터까지 닿는 권한임을 분리·승인으로 통제하는 것이다.
  points:
  - CDP 도구화 — DOM·console·network·performance trace·Lighthouse를 MCP 클라이언트에서 호출
  - 격리 옵션 — `--slim --headless`, `--isolated`, `--experimentalPageIdRouting`으로 CI·동시 세션 위험 축소
  - Codex Developer mode — @Browser/@Chrome full CDP는 사이트별 승인과 enterprise kill switch가 전제
  source: https://developers.openai.com/codex/app/browser
- category: ai
  title: Cipher → ByteRover CLI — 도구가 바뀌어도 따라다니는 '코딩 에이전트용 휴대 메모리 레이어'
  summary: 'Cipher는 이제 ByteRover CLI(brv)로 리브랜딩된 "코딩 에이전트용 영속 메모리" 프로젝트다. README 기준 핵심은 프로젝트 지식을 컨텍스트 트리에 넣고, `brv vc` 명령으로 branch·commit·merge·push/pull을 하며, 클라우드와 동기화해 팀·머신·도구 사이에서 같은 기억을 재사용하는 것이다. Cursor에서 쌓은 맥락을 Claude Code·Windsurf·Cline 같은 다른 에이전트로 옮겨도 처음부터 다시 설명하지 않게 만드는 레이어에 가깝다. 현재 문서는 `brv webui`를 기본 UI로 두고, MCP 서버·20개 LLM 제공사·24개 내장 도구·22개 이상 코딩 에이전트 호환을 내세운다. 단, 성능 수치는 프로젝트 자체 벤치마크이므로 제품 비교 지표가 아니라 "장기 대화 메모리를 어떻게 평가했는가"의 참고값으로 봐야 한다.

    '
  points:
  - '`brv vc`로 컨텍스트 트리를 버전 관리 — legacy `brv push/pull`보다 commit 단위 공유가 핵심'
  - '`brv webui`, MCP 서버, provider/model switch, hub/connectors까지 메모리 운영면을 한 CLI에 묶음'
  - 자체 벤치마크는 LoCoMo 96.1%·LongMemEval-S 92.8%; 2026-06-26 확인 기준 GitHub 4,879★
  source: https://github.com/campfirein/byterover-cli
- category: ai
  title: Kilo Code — VS Code·JetBrains·CLI를 오가는 오픈소스 코딩 에이전트(MIT·24.6k★)
  summary: 'Kilo Code는 VS Code, JetBrains, CLI에서 같은 에이전트 경험을 제공하려는 MIT 오픈소스 코딩 에이전트다. 현재 README는 500개 이상 모델을 고르고 작업 중 모델을 바꿀 수 있으며, provider pricing·zero markup·no API keys required to start를 내세운다. 핵심은 "에이전트 하나"보다 작업 모드 분리다. Code는 기본 구현, Plan은 코드 변경 전 설계, Ask는 파일을 건드리지 않는 코드베이스 질의, Debug는 추적, Review는 성능·보안·스타일·테스트 관점 점검으로 나뉜다. CLI는 `kilo run --auto`로 CI/CD 무인 실행도 가능하지만, 이 모드는 permission prompt를 모두 꺼서 trusted environment에서만 써야 한다.

    '
  points:
  - '표면: VS Code 확장, JetBrains 플러그인, CLI, Cloud Agent, PR code review'
  - '모드 분리: Code·Plan·Ask·Debug·Review + custom agents'
  - 2026-06-26 확인 기준 GitHub 24,646★·2,799 forks·MIT, 최신 릴리스 v7.3.54
  source: https://github.com/Kilo-Org/kilocode
- category: ai
  title: Bumblebee(Perplexity) — MCP·확장·패키지 로컬 노출을 읽기 전용으로 찾는 스캐너(4.6k★)
  summary: '코딩 에이전트를 쓰다 보면 MCP 서버, VS Code·Cursor·Windsurf 확장, npm·PyPI 패키지를 검증 없이 잔뜩 깔게 되는데, 정작 사고가 난 뒤 "어느 개발자 머신에 이 항목이 있나"를 빠르게 답하기 어렵다. Bumblebee는 Perplexity가 공개한 Apache-2.0 스캐너로, SBOM(배포 산출물)이나 EDR(실행·네트워크 흔적)이 놓치기 쉬운 개발자 로컬 상태를 NDJSON 인벤토리로 만든다. 핵심은 읽기 전용 설계다. `npm ls`·`pip show`·`go list` 같은 패키지 매니저를 실행하지 않고 락파일, 설치 메타데이터, 확장 매니페스트, 지원 MCP JSON 설정만 읽는다. 자체 CVE DB로 추측하지도 않는다. 사용자가 준 노출 카탈로그(JSON)와 정확히 일치하는 항목만 finding으로 내므로, "이미 알려진 악성 패키지·확장·MCP 서버가 내 fleet에 있나"를 확인하는 사고 대응 도구에 가깝다.

    '
  points:
  - '스캔 표면: npm·PyPI·Go·RubyGems·Composer·Bun·pnpm·Yarn·Homebrew + MCP JSON 설정·에디터 확장·브라우저 확장·에이전트 스킬'
  - '읽기 전용: 패키지 매니저 실행 없음·소스 파일 안 읽음, MCP env 자격증명 값은 record에 출력하지 않음'
  - 2026-06-26 확인 기준 GitHub 4,635★·416 forks·Apache-2.0, 최신 릴리스 v0.1.2, baseline/project/deep 프로필과 selftest 제공
  source: https://github.com/perplexityai/bumblebee
- category: ai
  title: Deep Agents(LangChain) — harness engineering로 Terminal Bench 2.0 Top 5
  summary: 'Deep Agents는 장기 작업용 LangChain 하네스다. ReAct 루프에 도구만 붙이는 대신 todo 계획, 서브에이전트, 가상 파일시스템, 튜닝된 시스템 프롬프트를 LangGraph 위에 묶는다. LangChain은 deepagents-cli에서 모델을 gpt-5.2-codex로 고정하고 하네스만 바꿔 Terminal Bench 2.0 점수를 52.8→66.5(Top 30→Top 5)로 올렸다고 공개했다. 조정 축은 프롬프트·도구·middleware 세 가지였고, LangSmith trace 분석으로 실패 패턴을 모은 뒤 targeted change를 반복했다. 핵심 개선은 exit 직전 PreCompletionChecklistMiddleware로 task spec 대비 검증을 강제하고, LocalContextMiddleware로 cwd·주변 디렉터리·사용 가능한 도구를 먼저 주입하며, 반복 편집을 감지해 계획 재검토를 유도한 점이다. 2026-06-26 확인 기준 GitHub 25,139★·MIT·최신 릴리스 deepagents==0.6.12.'
  points:
  - Terminal Bench 2.0 52.8→66.5 — model fixed, harness only changed (Top 30→Top 5)
  - Middleware가 verification·local context·loop detection을 주입 — "더 센 모델"보다 하네스 수정
  - LangSmith trace→실패 원인 집계→프롬프트·도구·middleware 변경으로 반복 개선
  source: https://www.langchain.com/blog/improving-deep-agents-with-harness-engineering
- category: ai
  title: Agentic AI Foundation(AAIF) — MCP·goose·AGENTS.md가 리눅스재단 중립 거버넌스로 모이다
  summary: '2025년 12월 9일, 리눅스재단이 Agentic AI Foundation(AAIF)을 출범하며 MCP·goose·AGENTS.md를 한 중립 거버넌스 아래 모았다. MCP는 AI 모델을 도구·데이터·앱에 연결하는 프로토콜, goose는 MCP 기반 로컬 우선 에이전트 프레임워크, AGENTS.md는 레포별 에이전트 지침을 일관되게 주는 마크다운 규약이다. 현재 AAIF 사이트의 프로젝트 목록에는 agentgateway도 추가되어, 단일 도구 묶음보다 "에이전트 인프라의 표준·런타임·지침을 재단 아래에서 키우는 흐름"으로 보는 편이 정확하다. 실무 교훈은 간단하다. 에이전트 스택을 고를 때 기능보다 먼저 거버넌스와 이식성을 봐야 하고, 레포 안의 AGENTS.md 같은 지침 파일은 팀 내부 팁이 아니라 에이전트가 공유하는 인터페이스가 되고 있다.

    '
  points:
  - '초기 기증: MCP(Anthropic)·goose(Block)·AGENTS.md(OpenAI) — 표준·에이전트 런타임·레포 지침을 분리'
  - AAIF 현재 프로젝트 목록은 AGENTS.md·agentgateway·goose·MCP — 에이전트 인프라의 계층이 늘어나는 신호
  - AGENTS.md는 6만+ 오픈소스 프로젝트 채택을 재단이 주장 — 지침 파일을 버전 관리하는 관행이 사실상 인터페이스화
  source: https://www.linuxfoundation.org/press/linux-foundation-announces-the-formation-of-the-agentic-ai-foundation
- category: ai
  title: security-guidance 플러그인 — Claude가 짠 코드의 취약점을 같은 세션에서 잡아 고치게 하기
  summary: 'Anthropic 공식 마켓플레이스 플러그인으로, Claude Code가 코드를 짜는 동안 자기 변경을 스스로 보안 검토해 인젝션·안전하지 않은 역직렬화·DOM 주입 같은 취약점을 PR에 도달하기 전에 같은 세션에서 고치게 한다. 검토는 깊이가 다른 3단계로 돈다 — ①파일 편집마다 모델 호출 없는 정규식 패턴 매치(비용 0), ②턴이 끝날 때 그 턴의 git diff를 백그라운드에서 별도 Claude가 보안 관점으로 리뷰, ③Claude가 git commit·push를 할 때 주변 코드(호출부·새니타이저)까지 읽는 더 깊은 에이전틱 리뷰. 핵심은 코드를 짠 같은 인스턴스가 자기를 채점하지 않는다는 점 — 리뷰는 새 컨텍스트의 독립 Claude 호출이다. `/plugin install security-guidance@claude-plugins-official`로 깐다.

    '
  points:
  - '독립 리뷰어: 짠 Claude가 자기 채점 안 함. 턴 끝·커밋 리뷰는 diff에서 출발하는 별도 Claude 호출(신선한 컨텍스트, ''문제만 찾으라''는 보안 프롬프트). 모델 기본값은 Claude Opus 4.7(SECURITY_REVIEW_MODEL·SG_AGENTIC_MODEL로 교체)'
  - '막지는 않음(공식 명시): 어느 단계도 쓰기·커밋을 차단하지 않는다. 발견은 ''지시''로 Claude에 전달돼 대화 안에서 고쳐지고, 리뷰 모델은 놓칠 수 있음 → 방어선의 한 겹일 뿐, 완전한 보안책 아님. 한도: 턴당 변경 30파일·연속 3회, 커밋 리뷰 시간당 20회'
  - '본인 셸 커밋은 제외: Bash 도구로 Claude가 한 commit·push만 리뷰됨(`!` 셸 이스케이프·직접 셸 커밋은 안 봄). 전부 훅(SessionStart·UserPromptSubmit·Stop·PostToolUse)으로 구현 — 소스가 ''훅에서 별도 모델 호출'' 예제. PR엔 Code Review, CI엔 기존 스캐너로 단계 분담'
  source: https://code.claude.com/docs/en/security-guidance
- category: ai
  title: AGENTS.md 실전 — 'README for agents'를 모노레포에 어떻게 까는가(중첩·우선순위 규칙)
  summary: 'AGENTS.md는 "코딩 에이전트를 안내하는 단순·개방 포맷"으로, 공식 사이트가 "a README for agents"라 부른다. README와 분리해 사람용 문서는 짧게 두고, 빌드·테스트·컨벤션 같은 에이전트용 상세 지침을 에이전트가 확실히 찾는 곳에 둔다는 발상이다. 필수 필드는 없고 "그냥 표준 Markdown"이라, 핵심은 양식이 아니라 ''어디에 두느냐''다. 공식 사이트 기준 Codex·Jules·Cursor·Gemini CLI·Copilot 등 다수 도구가 지원하고 6만+ 오픈소스 프로젝트가 쓴다고 명시한다.

    '
  points:
  - '중첩이 핵심: 패키지마다 AGENTS.md를 따로 두면 에이전트는 ''편집 중인 파일에서 가장 가까운 파일''을 자동으로 읽는다 — 모노레포는 서브프로젝트별 맞춤 지침을 각자 싣는 게 정석(예시로 사이트는 ''OpenAI 메인 레포에 88개 AGENTS.md''라 명시)'
  - '우선순위 규칙(충돌 시): 편집 파일에 가장 가까운 AGENTS.md가 이긴다. 단 ''사용자 채팅 프롬프트가 모든 것을 덮는다(override everything)'' — 즉 직접 지시 > 가까운 파일 > 먼 파일'
  - '테스트 자동 실행: 거기 적힌 테스트 명령을 에이전트가 알아서 돌리고 ''작업 끝내기 전에 관련 프로그래매틱 체크를 실행해 실패를 고치려 시도''한다. AAIF(리눅스재단) 거버넌스로 이관돼 CLAUDE.md와도 사실상 호환되는 공용 표준 위치'
  source: https://agents.md
- category: ai
  title: Factory droid — Terminal-Bench 1위·Mission·Custom Droid로 미는 모델 비종속 엔터프라이즈 코딩 플랫폼
  summary: 'Factory AI의 터미널 코딩 에이전트 droid는 Terminal-Bench core v0.1.1에서 Opus 4.1 조합 58.8%로 1위 — 성능 차이의 핵심은 모델 선택보다 에이전트 설계(계층형 프롬프트·모델별 편집·경로 처리·최소 도구 스키마·환경 부트스트랩). `curl -fsSL https://app.factory.ai/cli | sh` 또는 `npm i -g droid`로 설치. 대화형 `droid`·헤드리스 `droid exec`·다단계 `droid exec --mission`. Custom Droid로 팀 규칙·도구 커스터마이즈. 단일 AI 공급자 락인 없이 작업별 모델 라우팅.

    '
  points:
  - Terminal-Bench 1위(58.8%) — 하네스·도구 스키마·환경 부트스트랩이 모델보다 중요
  - '`droid` 대화형 + `droid exec` 헤드리스 + `--mission` 다단계 워크플로'
  - Custom Droid·모델 비종속 라우팅 — 엔터프라이즈 코딩 플랫폼
  source: https://docs.factory.ai/cli/getting-started/overview
- category: ai
  title: Terminal-Bench 2.1 — 셸 전체가 문제, 에이전트+모델 쌍·Fable 5 83.1% (2026-06)
  summary: Terminal-Bench는 Stanford×Laude Institute가 만든 터미널 환경 코딩 에이전트 벤치마크 — SWE-bench(레포 수정)와 달리 커널 빌드·서버 배포·모델 학습 등 환경 전체가 문제. 2.1 리더보드(tbench.ai)는 '에이전트+모델 쌍' 측정 — Codex CLI+GPT-5.5 83.4% > Claude Code+Fable 5 83.1%(6월 17일 진입, 6/12 정부 지시로 전면 중단) > Claude Code+Opus 4.8 78.9%. 같은 GPT-5.5도 Terminus 2 harness 76.4% vs Codex CLI 83.4%로 7%p 갭 — 하네스가 모델만큼 중요. Harbor tb CLI로 Claude Code·Codex·OpenHands 교체 가능, 2.0은 89개 큐레이션 태스크.
  points:
  - 2.1 June 2026 — Codex CLI+GPT-5.5 83.4% 1위, Fable 5 83.1% 3일 가용 후 중단
  - Harness gap — 동일 GPT-5.5도 Terminus 2 76.4% vs Codex CLI 83.4%, 설정이 경쟁력
  - 환경 전체 문제 — Docker+자동 판정, SWE-bench와 다른 '돌아가는 시스템' 과제
  source: https://www.tbench.ai/leaderboard/terminal-bench/2.1
- category: ai
  title: SWE-bench Multimodal — 스크린샷 보고 'JS UI 버그'를 고치는 능력을 따로 재는 벤치마크
  summary: 'SWE-bench Multimodal(SWE-bench M)은 텍스트·파이썬 위주의 원조 SWE-bench를 "비주얼·사용자 대면 JavaScript 소프트웨어"로 확장한 벤치마크다. 각 과제에는 문제 설명이나 단위테스트에 이미지(버그 스크린샷·목업·다이어그램 등)가 최소 1장씩 들어 있어, 에이전트가 화면을 보고 UI 버그를 고치게 만든다. 핵심은 ''코드를 짤 줄 안다''와 ''화면 문제를 보고 이해한다''가 별개 능력임을 드러낸다는 것 — 논문은 기존 상위 SWE-bench 시스템들이 여기서 크게 고전한다고 보고한다. 도구를 고를 때 ''Verified 점수''만 보면 시각·다언어 일반화 약점이 가려진다.

    '
  points:
  - '구성: 17개 JavaScript 라이브러리(웹 UI·다이어그램·데이터 시각화·구문 강조·인터랙티브 지도 등)에서 모은 617개 과제, 각 과제마다 문제 설명/테스트에 이미지 최소 1장(논문 abs/2410.03859)'
  - '왜 어려운가: 시각 추론 + 언어 일반화 둘 다 요구. 논문은 ''상위 SWE-bench 시스템이 SWE-bench M에서 고전한다''고 명시 — 언어 비종속 설계의 SWE-agent가 12% 해결, 차순위 시스템은 6%에 그쳤다(발표 당시 수치)'
  - '실무 함의: Python 단일 이슈 기준인 Verified와 다른 축을 잰다. 프런트엔드·다언어 코드베이스에 에이전트를 붙일 거면 Verified 점수만으로 판단하지 말 것. 공식 사이트는 paper·GitHub·HuggingFace 데이터셋 링크를 함께 제공'
  source: https://arxiv.org/abs/2410.03859
- category: ai
  title: claude --worktree — 한 레포에서 여러 Claude 세션을 'git 워크트리'로 격리해 동시에 돌리기
  summary: '한 터미널에서 기능을 만들면서 다른 터미널에선 Claude가 버그를 고치게 하되, 편집이 서로 충돌하지 않게 하는 워크플로. `claude --worktree <이름>`을 실행하면 각 워크트리가 자기 브랜치를 가진 별도 체크아웃으로 생성되어 한 작업 트리에서 파일이 엉키지 않는다. 다른 이름으로 같은 명령을 두 번째 터미널에서 돌리면 격리된 병렬 세션이 하나 더 뜬다. 서브에이전트·백그라운드 세션도 같은 방식으로 격리할 수 있어, 오래 걸리는 작업이 메인 브랜치를 막지 않는다.

    '
  points:
  - '기본 동작: `claude --worktree feature-auth`는 `.claude/worktrees/`에 새 브랜치로 워크트리를 만든다. 이름을 비우면 `bright-running-fox` 같은 이름을 자동 생성. baseRef 설정으로 HEAD에서 분기할지 지정 가능'
  - 'PR에서 바로: `claude --worktree "#1234"`는 origin에서 `pull/1234/head`를 받아 `.claude/worktrees/pr-1234`에 워크트리를 만든다. 세션 안에서 ''워크트리에서 작업해''라고 말하면 EnterWorktree로도 생성됨'
  - .worktreeinclude로 .env·secrets 같은 gitignore 파일을 워크트리에 복사(수동 `git worktree add` 경로일 때). git이 아니면 WorktreeCreate/WorktreeRemove 훅으로 SVN·Perforce·Mercurial 지원. 수동 정리는 `git worktree remove <경로>`
  source: https://code.claude.com/docs/en/worktrees
- category: ai
  title: Context Rot(Chroma 연구) — '컨텍스트만 길어져도' 18개 모델 전부 정확도가 무너진다
  summary: 'Chroma가 발표한 독립 벤치마크 연구로, "긴 컨텍스트 윈도우가 곧 안정적인 성능"이라는 가정을 깬다. 과제 난이도는 그대로 두고 입력 길이만 늘렸을 때, Claude·GPT·Gemini·Qwen 등 18개 모델 모두에서 정확도가 길이가 길어질수록 떨어졌다. 핵심은 모델이 컨텍스트를 균일하게 처리하지 않는다는 것 — 토큰이 ''있다''가 아니라 ''어떻게 제시됐는가''가 성능을 가른다. 그래서 결론은 컨텍스트 윈도우를 키우는 게 아니라, 무엇을 어떻게 넣을지 설계하는 ''컨텍스트 엔지니어링''이다.

    '
  points:
  - '확장된 NIAH(바늘 찾기) 실험: 질문과 바늘의 의미 유사도가 낮을수록, distractor(헷갈리는 문장)가 1개만 있어도 성능이 떨어지고 4개면 가중된다. Claude는 환각률이 가장 낮고 불확실하면 답을 보류(abstain)하는 경향, GPT는 환각률이 가장 높았다'
  - '반직관적 결과: 논리적으로 잘 구성된 haystack보다 ''섞어서 뒤죽박죽인'' haystack에서 18개 모델 전부 더 정확했다. LongMemEval에선 11.3만 토큰 전체를 넣을 때보다 핵심 300토큰만 넣을 때 모든 모델이 훨씬 높은 점수'
  - '주장(연구 수치): 총 194,480회 호출 중 거부는 0.035%로 드물었다. 실제 과제는 이 최소 실험보다 복잡하므로 현업에서의 열화는 더 심할 것이라고 저자는 명시. 코드 전체 오픈소스로 재현 가능'
  source: https://www.trychroma.com/research/context-rot
- category: ai
  title: 서브에이전트 모델 라우팅 — 탐색은 Haiku, 리뷰는 Sonnet으로 강제해 비용 천장을 거는 법
  summary: 'Claude Code 서브에이전트는 정의 파일 프런트매터의 model 필드로 각자 다른 모델을 쓸 수 있고, 값은 sonnet·opus·haiku·fable·전체 모델 ID(예: claude-opus-4-8)·inherit이며 생략 시 기본은 inherit(메인 대화와 동일 모델)이다. 공식 문서는 서브에이전트의 핵심 이점 중 하나로 "Haiku 같은 더 빠르고 저렴한 모델로 작업을 라우팅해 비용을 통제"하는 것을 명시한다. 즉 매번 같은 종류의 일(탐색·린트·요약)은 값싼 모델 서브에이전트에 정의 파일로 박아두면, 개발자가 일일이 모델을 고르지 않아도 설정만으로 비용 천장이 걸린다. 서브에이전트가 자체 격리 컨텍스트 창에서 돌아 메인 대화 히스토리를 안 보는 구조라 탐색 같은 토큰 폭증 작업을 메인에서 떼어내는 효과까지 겹친다.

    '
  points:
  - '모델 결정 우선순위(공식 문서): 1) CLAUDE_CODE_SUBAGENT_MODEL 환경변수 → 2) 호출 시 per-invocation model 파라미터 → 3) 서브에이전트 정의의 model 프런트매터 순. 환경변수로 세션 전체 모델을 한 값으로 강제해 조직 비용 천장·컴플라이언스에 쓸 수 있다'
  - 정의 파일에 model을 커밋해 두면 '모두가 제일 비싼 모델로 기본 세팅하는' 사고를 의지가 아니라 설정으로 막는다 — 코드리뷰는 Sonnet, 빠른 작업은 Haiku 식으로 역할별 분리
  - '컨텍스트 격리: 서브에이전트는 fresh·isolated 컨텍스트 창에서 시작해 부모 대화·이미 읽은 파일을 보지 않고 요약 결과만 돌려준다(예외: fork는 전체 대화를 상속). 탐색 같은 대량 토큰 작업을 메인 창 밖으로 빼는 게 비용 절감의 본질'
  source: https://code.claude.com/docs/en/sub-agents
- category: ai
  title: 에이전트 스킬의 '점진적 로딩' — 메타 100토큰만 항상 보이고, 본문은 필요할 때만 끌어오기
  summary: 'Agent Skills는 SKILL.md 한 장(name·description YAML 프런트매터 + 마크다운 본문)에 스크립트·레퍼런스를 묶은 폴더로, 2025-10 Anthropic이 도입해 2025-12 오픈 표준으로 공개했고 지금은 Claude Code·Claude.ai·API·Codex·Cursor 등에서 동작한다. 핵심은 점진적 공개(progressive disclosure)다 — 세션 시작 시 에이전트는 각 스킬의 name·description(스킬당 대략 100토큰)만 본다. 본문(보통 5천 토큰 미만)은 에이전트가 그 스킬이 지금 작업에 필요하다고 판단할 때만 로드된다. 덕분에 스킬을 수십~수백 개 깔아둬도 컨텍스트 창은 거의 비어 있고, 정작 쓸 때만 토큰을 먹는다 — MCP 도구 정의가 항상 컨텍스트를 차지하는 것과 대비된다. 이 메커니즘 때문에 description 한 줄을 어떻게 쓰느냐가 스킬이 제때 발동하느냐를 가른다.

    '
  points:
  - '토큰 회계: 항상 보이는 건 스킬당 약 100토큰(name+description)뿐, 본문(<5k토큰)은 ''관련 있다''고 판단될 때만 로드 → 스킬 수백 개도 컨텍스트 부담이 거의 없다'
  - 발동 트리거는 본문이 아니라 description이 쥔다. 에이전트는 메타데이터만 보고 로드 여부를 정하므로, 언제 써야 하는지를 description에 구체적으로 써야 제때 켜진다
  - '보안 주의: 스킬은 에이전트 환경에서 임의 코드를 실행할 수 있다 — ''믿을 수 있는 출처''에서만 설치하라. 큐레이션 목록 travisvn/awesome-claude-skills(약 13.5k★) 등이 모음집 역할'
  source: https://github.com/travisvn/awesome-claude-skills
- category: ai
  title: Frequent Intentional Compaction — 컨텍스트를 40~60%로 유지하며 리뷰는 코드 아닌 '리서치·플랜'에 거는 워크플로
  summary: 'humanlayer가 공개한 ace-fca 문서(약 1.7k★)는 코딩 에이전트 생산성의 핵심을 "컨텍스트 관리를 개발 워크플로 전체로 끌어올리는 것"으로 본다. 핵심 원칙은 컨텍스트 사용률을 40~60% 구간으로 유지하는 것 — Geoff Huntley의 "약 170k 컨텍스트 창에서, 많이 쓸수록 결과가 나빠진다"는 제약을 전제로 한다. 작업은 리서치 → 플랜 → 구현 3단계로 쪼개고, 구현 단계는 검증된 페이즈마다 진행 상황을 원래 플랜 파일(progress.md)로 다시 compaction해 컨텍스트를 비운다. 가장 큰 통찰은 인간 리뷰의 레버리지다 — 나쁜 코드 한 줄은 그냥 한 줄이지만, 나쁜 플랜 한 줄은 코드 수백 줄을, 나쁜 리서치 한 줄은 수천 줄을 낳는다. 그래서 코드보다 리서치·플랜을 리뷰하는 게 이득이다.

    '
  points:
  - '구체 사례(문서 주장): 30만 LOC Rust 프로젝트(BAML)에서 Rust 초보가 취소+WASM 기능 약 3.5만 LOC를 7시간(리서치·플랜 3h + 구현 4h)에 작업, 팀은 PR당 시니어 3~5일치로 추정. 단 ''마법이 아니다''라며 7시간 깊은 몰입과 코드베이스 전문가 한 명이 필요함을 명시'
  - 'compaction 트리거: 파일 검색·코드 흐름 파악·테스트/빌드 로그·대형 JSON 도구 출력처럼 토큰을 먹는 활동을 progress.md(목표·접근·완료 단계·현재 실패) 같은 구조화 산출물로 증류. 구현만 git worktree로 격리하고 리서치·플랜은 main에서 한다'
  - 서브에이전트는 '역할 흉내'가 아니라 '컨텍스트 제어' 수단 — Glob/Grep/Read 잡동사니를 fresh 컨텍스트에서 돌려 부모 에이전트 창을 깨끗이 유지하는 게 가장 흔한 용도. 팀 비용은 3인 기준 월 약 $12k(Opus), 전환에 약 8주 걸렸다고 밝힘
  source: https://github.com/humanlayer/advanced-context-engineering-for-coding-agents/blob/main/ace-fca.md
- category: ai
  title: claude-code-security-review — PR마다 도는 Anthropic 공식 AI 보안 리뷰 액션(diff 인지·오탐 필터)
  summary: 'Anthropic이 공개한 claude-code-security-review(약 5.3k★, MIT, 주로 파이썬)는 PR이 올라올 때마다 변경 diff를 Claude로 의미 분석해 취약점을 찾고 해당 라인에 코멘트를 다는 GitHub Action이다. 단순 패턴 매칭이 아니라 코드 맥락을 읽어 인젝션(SQL·command·XXE 등), 인증·인가 결함, 비밀정보·PII 노출, 암호화 오용, RCE·역직렬화, XSS, TOCTOU 같은 로직 결함까지 본다. 핵심은 오탐 억제다 — 발견된 항목은 별도 검증 서브태스크가 실제 코드 동작에 비춰 다시 분석하고, 확신도 점수가 낮으면(8점 미만) 버린다. DoS·레이트리밋·입증 안 된 입력검증·대부분의 open-redirect는 기본 제외 카테고리다. 같은 엔진을 Claude Code의 내장 `/security-review` 슬래시 명령으로 개발 중에도 돌릴 수 있고, security-review.md를 `.claude/commands/`에 복사해 분석 기준을 커스텀할 수 있다.

    '
  points:
  - '도입은 워크플로 YAML 한 조각 — `anthropics/claude-code-security-review@main`에 `comment-pr: true`와 API 키를 넘기면 PR head를 체크아웃해 변경분만 검토하고 라인 코멘트를 남긴다'
  - '★보안 경고(공식): 이 액션은 ''프롬프트 인젝션에 하드닝되지 않았다'' — 신뢰할 수 있는 PR에만 쓰고, 외부 기여자 PR은 깃허브 ''Require approval for all external contributors''로 메인테이너 승인 후에만 돌게 막으라고 권고한다'
  - GitHub Action(PR 게이트)과 `/security-review` 슬래시 명령(개발 중 로컬)은 같은 분석을 두 지점에 배치한 것 — '짠 세션 말고 별도 패스가 검토한다'는 원칙을 보안에 적용한 사례다
  source: https://github.com/anthropics/claude-code-security-review
- category: ai
  title: Serena(oraios) — 에이전트에게 IDE급 '심볼 단위' 코드 탐색·편집을 주는 MCP 툴킷(~24k★)
  summary: 'Serena는 독일 Oraios가 만든 오픈소스 MCP 툴킷으로, 스스로를 "에이전트를 위한 IDE"라 부른다(약 24k★, MIT). 핵심은 에이전트가 파일을 통째로 읽는 대신, 언어 서버 프로토콜(LSP)을 백엔드로 써서 함수·클래스 같은 ''심볼'' 단위로 코드를 찾고·읽고·고치게 한다는 점이다. 줄번호나 단순 grep 같은 저수준 방식 대신 코드의 구조와 참조 관계를 따라가므로, 큰 코드베이스에서 더 빠르고 토큰 효율적으로 동작한다. Claude Code·Codex·Gemini CLI·Cursor·Cline·Roo Code 등 MCP를 받는 거의 모든 클라이언트에 붙고, Cursor·Windsurf 같은 유료 어시스턴트의 무료 대안을 표방한다. 기본 LSP 백엔드는 Python·TypeScript·Java·Go·Rust 등 40여 개 언어를 지원한다.

    '
  points:
  - '동작 원리: ''파일을 다 읽지 말고 심볼만 집어라'' — find_symbol / find_referencing_symbols 같은 도구로 정의·호출처를 LSP로 질의해 필요한 조각만 컨텍스트에 올린다. 이게 큰 레포에서 토큰을 아끼는 핵심'
  - '백엔드 2종: 기본은 무료 오픈소스 LSP, 별도로 JetBrains 분석엔진을 쓰는 유료 플러그인이 move·inline 같은 더 깊은 리팩터링을 제공'
  - '★설치 주의(공식): MCP/플러그인 마켓플레이스의 설치 명령은 ''오래되고 부적절''하니 쓰지 말고, PyPI에서 `uv tool install -p 3.13 serena-agent` 후 `serena init`으로 깔라고 메인테이너가 명시한다'
  source: https://github.com/oraios/serena
- category: ai
  title: Agent Client Protocol(ACP) — '에디터'와 '코딩 에이전트'를 분리하는 개방형 표준(Zed·JetBrains)
  summary: 'ACP(Agent Client Protocol)는 Zed가 만들고 JetBrains와 함께 미는 개방형 표준으로, 코딩 에이전트와 그것을 띄우는 에디터(클라이언트) 사이를 표준 JSON-RPC 인터페이스로 갈라놓는다. 목표는 ''LSP가 언어 서버를 에디터에서 떼어낸 것''을 에이전트에도 하는 것 — 에이전트는 한 번만 ACP를 구현하면 ACP를 지원하는 모든 에디터에서 돌고, 에디터는 한 번만 구현하면 어떤 ACP 에이전트든 꽂아 쓴다. 그래서 한 에디터 안에서 어려운 리팩터링은 Claude Code로, 테스트 스윕은 다른 에이전트로 갈아끼우는 식의 ''에이전트 자유 교체''가 가능해진다. 특정 모델·도구에 묶이는 락인을 줄이는 게 핵심이다.

    '
  points:
  - '무엇을 표준화하나: 에이전트↔에디터 간 통신을 JSON-RPC 기반 개방 프로토콜로 고정 → 에이전트는 1회 구현으로 모든 ACP 에디터에서 동작(LSP의 에이전트판)'
  - '주도: Zed가 설계, JetBrains와 협업으로 확장 중. Zed의 Agent Panel이 ACP로 외부 에이전트(예: Claude Code·Gemini CLI 등)를 네이티브로 띄움'
  - '실무 효과: 작업별로 최적 에이전트를 갈아끼우는 ''중립 호스트'' 전략 — VS Code 포크+단일 모델 결합형 락인의 반대 방향'
  source: https://zed.dev/acp
- category: ai
  title: Conductor — 한 화면에서 Claude Code·Codex·Cursor를 '병렬로' 돌리는 맥용 오케스트레이터
  summary: Conductor(conductor.build)는 macOS 데스크톱에서 Claude Code·Codex·Cursor를 git worktree 격리 workspace로 병렬 실행하는 ADE(Agent Development Environment)다. 2026년 Orca(stablyai/orca·MIT·~7k★)가 cross-platform(macOS·Windows·Linux·iOS·Android) ADE로 같은 축을 확장 — 25+ CLI agent·Ghostty-class terminal·`orca worktree create` CLI scriptable·Annotate AI Diff inline review·Computer Use mode. Vibe Kanban(sunsetting) ·Cursor Agents Window과 달리 BYO-subscription·worktree-per-task·human merge gate. Conductor=mac-first, Orca=cross-platform+fleet CLI+mobile companion.
  points:
  - Worktree isolation — task마다 branch·terminal·diff·review path, parallel agent collision 방지
  - Orca 2026 — desktop+mobile ADE, fan-one-prompt-across-5-agents, CLI automation surface
  - Human merge gate — agent cheap, review/integration bottleneck → diff-first workflow
  source: https://www.conductor.build/
- category: ai
  title: MCP Tool Search — MCP 서버 수십 개 붙여도 컨텍스트가 안 터지는 'on-demand 로딩'(Claude Code 기본값)
  summary: 'MCP 서버를 여러 개 붙이면 세션 시작 전에 도구 정의가 컨텍스트를 다 잡아먹는 ''context pollution''이 오래 문제였다(한 개발자는 첫 프롬프트도 치기 전에 6.6만 토큰이 사라졌다고 기록). Claude Code의 MCP Tool Search는 세션 시작 시 도구 이름과 서버 instructions만 올리고, 실제 도구 정의는 Claude가 필요할 때 검색해서 불러온다. Anthropic은 2026-01-14에 이 기능을 공개했고, 공식 문서 기준 현재 기본값으로 켜져 있다. 실무 효과는 ''MCP 서버를 더 붙여도 컨텍스트 영향이 거의 없다''는 것 — 그래서 서버 개수보다 서버 instructions를 잘 써두는 게 중요해진다.

    '
  points:
  - '기본 동작(공식): 세션 시작 땐 도구 이름+서버 instructions만 로드, 정의는 ToolSearch로 필요할 때만 expand. Claude Code는 서버별 도구 수 상한을 두지 않고 ''컨텍스트 예산''이 실질 한계'
  - 'ENABLE_TOOL_SEARCH로 조절: unset/true=전부 지연, auto=정의가 컨텍스트 10% 안에 들면 미리 로드(auto:N으로 % 지정), false=전부 미리 로드. Vertex AI·비1차 ANTHROPIC_BASE_URL 프록시에선 기본 비활성'
  - '제약(공식): tool_reference 블록을 지원하는 모델만 가능 — Haiku는 미지원, Vertex는 Sonnet 4.5·Opus 4.5 이상. 서버 작성자는 instructions를 스킬처럼 ''언제 이 도구를 찾아야 하는지'' 설명하게 쓰는 게 핵심'
  source: https://code.claude.com/docs/en/mcp
