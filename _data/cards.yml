  - "Android 14 이하에서는 서버 측 경로 규칙이 적용되지 않으므로 호환 동작도 확인한다"
  source: https://developer.android.com/training/app-links/add-applinks
  interview: "assetlinks.json에 새 host를 추가하면 앱 매니페스트 변경 없이 그 host도 열 수 있는가?"
  answer: "아니다. 동적 규칙은 매니페스트의 scheme·host 범위를 확장할 수 없다. 새 host를 허용하려면 앱의 정적 intent filter를 업데이트해야 한다."
- category: ai
  level: "중급"
  title: diagnose — 디버깅을 규율로 만드는 스킬
  summary: 'mattpocock/skills의 diagnosing-bugs는 어려운 버그를 "재현 가능한 실패 신호"에서 시작하게 만드는 디버깅 루프다. 순서는 재현·최소화 → 3~5개 가설 → 한 변수씩 계측 → 수정 → 회귀 테스트 → 정리로 이어진다. 좋은 점은 버그를 설명하는 말솜씨보다, 같은 명령으로 빨간불과 초록불을 반복해서 볼 수 있는지를 먼저 묻는다는 것이다. 그래서 AI에게 바로 코드를 고치게 하기보다, 실패를 빠르게 보여주는 테스트·스크립트·로그 지점을 먼저 만들고 그 신호 하나로 가설을 줄여 간다.

    '
  points:
  - '출발점: 재현 가능한 red/pass 신호를 먼저 만든다'
  - 가설은 3~5개로 제한하고, 계측은 한 변수씩만 바꾼다
  - 수정 뒤에는 같은 실패 신호를 회귀 테스트로 남긴다
  source: https://github.com/mattpocock/skills
  interview: "AI가 버그 원인을 추측하며 코드를 바로 수정하려 할 때, diagnose 방식은 어떤 순서로 접근하나요?"
  answer: "먼저 같은 방식으로 반복할 수 있는 실패를 만든다. 입력과 범위를 줄인 뒤 몇 가지 가설을 세우고, 한 번에 한 변수씩 확인한다. 원인을 고쳐도 처음 실패를 잡던 검사를 회귀 테스트로 남긴다."
- category: ai
  level: "중급"
  title: Spec Kit — 명세 주도 개발(SDD)
  summary: 'GitHub Spec Kit은 AI에게 바로 구현을 맡기기 전에, 요구사항과 기술 결정을 파일로 고정하는 Spec-Driven Development 도구다. 흐름은 constitution으로 프로젝트 원칙을 세우고, specify로 "무엇과 왜"를 적은 뒤, plan에서 기술 선택을 붙이고, tasks로 실행 가능한 작업 목록을 만든 다음 implement로 들어간다. `specify init`은 Copilot, Codex, Claude Code, Gemini CLI 등 30개 이상 에이전트 통합을 지원하고, 스킬 모드에서는 `/speckit.*` 명령 대신 `speckit-*` 스킬을 설치할 수 있다. 교훈은 "명세 문서"가 산출물 보관용이 아니라, AI가 추측으로 코드를 시작하지 못하게 하는 실행 경계라는 점이다.

    '
  points:
  - constitution→specify→plan→tasks→implement로 요구사항과 구현을 분리
  - '`specify init`은 30+ 에이전트 통합과 skills 모드 설치를 지원'
  - '핵심 가치: AI 코딩 전에 원칙·요구사항·작업 단위를 버전 관리'
  source: https://github.com/github/spec-kit
  interview: "Spec-Driven Development에서 AI에게 구현을 맡기기 전에 요구사항과 계획을 파일로 남기는 이유는 무엇인가요?"
  answer: "구현 전에 목표와 제약, 기술 선택, 실행 단위를 검토할 수 있고, 에이전트가 빠진 요구사항을 추측해 코드로 고정하는 위험을 줄인다. 명세와 작업 목록은 구현 결과를 확인하는 기준으로도 쓴다."
- category: ai
  level: "초급"
  title: Karpathy-inspired CLAUDE.md — 에이전트 행동을 네 규칙으로 좁히기
  summary: 'multica-ai/andrej-karpathy-skills는 Karpathy의 LLM 코딩 실패 관찰에서 출발한 짧은 CLAUDE.md 가이드다. 네 규칙은 ① Think Before Coding(가정·모호함·트레이드오프를 먼저 드러내기), ② Simplicity First(요청 밖 기능과 1회용 추상화 금지), ③ Surgical Changes(요청과 직접 연결된 줄만 바꾸기), ④ Goal-Driven Execution(성공 기준을 정하고 검증될 때까지 반복)이다. 교훈은 특정 도구보다 "에이전트가 어떤 행동을 하지 말아야 하는지"를 작고 검증 가능한 규칙으로 쓰는 것이 결과를 바꾼다는 점이다.

    '
  points:
  - '4규칙: 먼저 이해·최소 코드·수술적 변경·목표 기반 검증'
  - 모호하면 추측하지 않고 가정과 선택지를 드러내게 함
  - 규칙 파일은 작을수록 행동 경계가 선명해진다는 사례
  source: https://github.com/multica-ai/andrej-karpathy-skills
  interview: "AI 코딩 에이전트에 규칙을 추가할 때 왜 요청과 직접 관련된 작은 규칙부터 시작하는 것이 좋은가요?"
  answer: "짧고 구체적인 규칙은 에이전트가 따라야 할 경계를 쉽게 확인하게 한다. 목표를 먼저 이해하고, 불필요한 변경을 피하며, 성공 기준으로 결과를 검증하도록 안내할 수 있다."
- category: ai
  level: "고급"
  title: Ouroboros — 모호함을 수치로
  summary: 'Ouroboros는 코딩 에이전트가 막연한 요청에서 바로 구현으로 뛰지 않게 만드는 명세 우선 워크플로 엔진이다. 흐름은 interview로 숨은 가정을 드러내고, seed로 확정된 스펙을 만들고, run/evaluate로 실행과 검증을 반복하는 구조다. 핵심은 인터뷰를 감으로 끝내지 않는 점이다. 목표·제약·성공 기준·기존 코드베이스 이해 같은 차원을 0.0~1.0으로 채점하고, `Ambiguity = 1 - Σ(clarity_i × weight_i)`로 남은 불확실성을 계산한다. Ambiguity가 0.2 이하가 되어야 Seed를 만들 수 있고, 유사도 0.95 이상이면 온톨로지가 수렴했다고 본다. 즉 질문을 오래 하는 도구가 아니라, 구현해도 되는 상태를 수치로 가르는 장치다.

    '
  points:
  - interview→seed→run→evaluate로 질문·명세·실행·검증을 분리
  - 'Seed 생성 임계값: Ambiguity <= 0.2, 수렴 기준: Similarity >= 0.95'
  - Brownfield는 목표·제약·성공 기준에 코드베이스 컨텍스트까지 가중 평가
  source: https://github.com/Q00/ouroboros/blob/main/README.ko.md
  interview: "Ouroboros에서 인터뷰 단계의 모호함 점수는 어떤 결정을 돕고, 왜 코드베이스 이해도도 포함하나요?"
  answer: "목표·제약·성공 기준 등에 남은 불확실성을 점수로 드러내 Seed를 만들고 구현을 시작해도 되는지 판단하도록 돕는다. 기존 코드 수정에서는 현재 구조와 제약을 모르면 명세가 맞아도 잘못된 변경을 만들 수 있어 코드베이스 이해도도 평가한다."
- category: ai
  level: "중급"
  title: 서브에이전트 — 컨텍스트를 지키는 분업
  summary: 'Claude Code의 서브에이전트는 자체 컨텍스트 창, 전용 시스템 프롬프트, 별도 도구 권한을 가진 작업 단위다. 검색·코드 탐색·보안 검토처럼 로그와 파일 내용이 많이 쌓이는 일을 분리하면, 메인 세션에는 결과 요약만 돌아와 컨텍스트를 보존한다. 정의 파일은 프로젝트 `.claude/agents/`나 사용자 `~/.claude/agents/`에 두고, 중복 이름이 있으면 더 가까운 프로젝트 정의가 우선한다. 실무 포인트는 병렬화보다 권한과 비용 라우팅이다. `tools` allowlist, `disallowedTools` denylist, MCP 서버 범위, `model` 필드로 읽기 전용 탐색대·로컬 전용 조사원·저비용 요약 에이전트를 분리해 설계한다.

    '
  points:
  - '정의 위치: 프로젝트 `.claude/agents/`가 사용자 `~/.claude/agents/`보다 우선'
  - '권한 설계: `tools`/`disallowedTools`와 MCP 서버 범위로 읽기·쓰기·외부도구를 제한'
  - '비용 설계: `model` 또는 `CLAUDE_CODE_SUBAGENT_MODEL`로 반복 탐색은 더 빠른 모델에 라우팅'
  source: https://code.claude.com/docs/en/sub-agents
  interview: "서브에이전트에 작업을 나눌 때 컨텍스트 절약 외에 어떤 경계를 명시해야 하나요?"
  answer: "작업에 필요한 도구만 허용하고, 파일 수정이나 외부 도구처럼 중요한 권한을 분리한다. 조사처럼 읽기 전용인 역할과 구현 역할을 나누고, 모델도 작업 난이도와 비용에 맞춰 선택한다."
- category: ai
  level: "중급"
  title: Claude Code reloadSkills — SessionStart 훅이 설치한 스킬을 같은 세션에서 읽기
  summary: >-
    Claude Code는 SessionStart 훅이 끝나기 전에 스킬을 탐색할 수 있다. 따라서 이 훅이 새 스킬 파일을 설치해도 첫 프롬프트에서 아직 발견되지 않을 수 있다. 훅 응답에 `hookSpecificOutput.reloadSkills: true`를 반환하면 훅 실행 뒤 스킬·명령 디렉터리를 다시 탐색한다. 세션 중 직접 파일을 수정한 경우에는 `/reload-skills`로 다시 불러올 수 있다. 즉, 이 기능은 모든 스킬 변경에 재시작이 필요하다는 뜻이 아니라 시작 훅과 초기 탐색의 순서 문제를 해결한다.
  points:
  - '상황: SessionStart 훅이 스킬을 설치하지만 초기 탐색은 훅보다 먼저 끝날 수 있음'
  - '해결: JSON 응답에 `hookSpecificOutput.reloadSkills: true`를 포함해 훅 뒤 재탐색'
  - 세션 중 직접 수정한 스킬은 `/reload-skills`로 다시 탐색
  source: https://code.claude.com/docs/en/hooks
  interview: "SessionStart 훅에서 새 스킬을 설치했는데 첫 요청에서 에이전트가 찾지 못한다면 어떻게 해결하나요?"
  answer: "초기 스킬 탐색이 SessionStart 훅보다 먼저 실행될 수 있다. 훅 출력에 `hookSpecificOutput`의 `hookEventName: SessionStart`와 `reloadSkills: true`를 반환해 훅 완료 후 다시 탐색하게 한다. 세션 중 수정은 `/reload-skills`로 반영한다."
- category: ai
  level: "중급"
  title: Claude Code --safe-mode — 설정 문제를 사용자 정의 기능과 분리 진단
  summary: >-
    `claude --safe-mode`는 Claude Code의 사용자 정의 설정이 문제를 일으키는지 확인할 때 쓴다. 실행하면 CLAUDE.md, skills, plugins, hooks, MCP, custom agents/commands 등 사용자 정의 항목을 끄고 실행한다. 이 상태에서도 인증·모델 선택·기본 도구·권한은 유지되므로 `--bare`와 같지 않고, 보안 샌드박스도 아니다. 조직 관리 정책은 일부 적용된다: policy hook·status line·file-suggestion command는 남지만 managed skills·plugins·CLAUDE.md·MCP는 제외된다. 일반 실행과 비교해 문제가 사라지는지 확인하되, 조직 정책 항목은 별도로 고려한다.
  points:
  - '목적: 설정/확장 문제의 원인을 사용자 정의 기능 여부로 좁히기'
  - '유지: 로그인·모델·기본 도구·권한; `--bare` 또는 보안 격리와 다름'
  - '정책 예외: 일부 managed hook/status line은 유지되지만 managed skill/plugin/MCP는 제외'
  source: https://code.claude.com/docs/en/cli-reference
  interview: "Claude Code에서 사용자 설정이나 플러그인이 문제인지 진단할 때 `--safe-mode`는 무엇을 비교하며, 어떤 설정은 계속 적용되나요?"
  answer: "일반 실행과 `claude --safe-mode` 실행을 비교해 사용자 정의 기능을 끈 뒤 문제가 사라지는지 본다. 인증·모델·기본 도구·권한은 유지된다. 또한 조직 정책 훅·상태 표시줄 같은 일부 managed 설정은 계속 적용되므로 safe mode가 모든 사용자 정의나 정책을 제거하는 모드는 아니다."
- category: ai
  level: "중급"
  title: Claude Code /cd — 대화를 유지하며 작업 디렉터리와 프로젝트 설정 이동
  summary: 'Claude Code의 `/cd <path>`는 대화 세션을 유지한 채 기본 작업 디렉터리를 바꾼다. 새 경로에서 세션을 다시 찾을 수 있고, 새 디렉터리의 CLAUDE.md와 프로젝트 설정·훅·MCP·플러그인·스킬·에이전트가 적용된다. 처음 가는 작업공간은 신뢰 확인이 필요하다. `/add-dir`는 기존 작업공간에 파일 접근을 더하는 기능이므로, 그 디렉터리의 전체 프로젝트 설정으로 이동하는 `/cd`와 목적이 다르다. `/cd`는 v2.1.169에 프롬프트 캐시를 깨지 않고 이동하는 기능으로 추가됐으며, 새 디렉터리 설정을 즉시 적용하는 동작은 v2.1.246부터다.'
  points:
  - 세션·프롬프트 캐시를 유지하며 이동; 이전 대화는 새 프로젝트 경로에서 재개
  - 새 작업공간은 신뢰 확인; 프로젝트 훅·MCP·플러그인 설정도 즉시 전환(v2.1.246+)
  - 접근만 추가하려면 `/add-dir`; 허용·차단 경로로 `/cd` 대상을 제한할 수 있음
  source: https://code.claude.com/docs/en/permissions#move-the-session-to-another-directory
  interview: "기존 대화를 유지하면서 다른 프로젝트로 이동할 때 `/cd`와 `/add-dir` 중 무엇을 써야 하며, 신뢰 확인은 왜 필요한가요?"
  answer: "새 디렉터리를 기본 작업공간으로 바꾸고 그 프로젝트 설정을 적용하려면 `/cd`를 쓴다. 현재 작업공간에 파일 접근만 추가하려면 `/add-dir`를 쓴다. 새 프로젝트에는 다른 지침과 훅·도구 설정이 있을 수 있으므로 신뢰 여부를 확인해야 한다."
- category: ai
  level: "초급"
  title: Claude Code 출력 스타일 — 세션 응답의 역할·톤·형식 조정
  summary: '출력 스타일은 한 세션의 모든 응답에 적용되는 지침이다. 기본(Default) 외에 Proactive·Concise·Explanatory·Learning 스타일이 있다. `/output-style <name>`은 v2.1.269부터 쓸 수 있고, `/config` 메뉴도 제공한다. 선택은 다음 메시지부터 적용된다(v2.1.251+). 출력 스타일은 요청 지침이므로 동작을 보장하거나 차단하지 않는다. 프로젝트 지식은 CLAUDE.md, 특정 작업 절차는 Skill, 매번 실행해야 하는 검사는 Hook이나 권한 규칙에 둔다.'
  points:
  - '기본 외 4종: Proactive(바로 시작) / Concise(짧게) / Explanatory(선택 이유) / Learning(직접 작성 연습)'
  - '스타일은 세션 지침이지 강제 정책이 아님; 강제 검사는 Hook·권한 규칙 사용'
  - '커스텀은 .claude/output-styles/*.md; 코딩 지침도 유지하려면 keep-coding-instructions: true'
  source: https://code.claude.com/docs/en/output-styles
  interview: "Claude Code 출력 스타일로 모든 보안 규칙을 강제할 수 있나요? 프로젝트 규칙이나 특정 작업 절차에는 무엇을 써야 하나요?"
  answer: "아니다. 출력 스타일은 매 응답에 적용되는 지침이며 보장된 차단 기능이 아니다. 매번 실행해야 하는 검사는 Hook이나 권한 규칙에 둔다. 프로젝트 구조와 규칙은 CLAUDE.md, 특정 작업 절차는 Skill로 분리한다. 커스텀 스타일에서 코딩을 계속 시킬 때는 `keep-coding-instructions: true`를 설정해 기본 코딩 지침이 빠지지 않게 한다."
- category: ai
  level: "중급"
  title: fallbackModel — 기본 모델이 막힐 때 대체 모델로 자동 전환
  summary: 'Claude Code의 `fallbackModel`은 기본 모델이 과부하·사용 불가 또는 재시도할 수 없는 서버 오류를 반환할 때 대체 모델을 순서대로 시도한다. 전환은 현재 턴에만 적용되고 알림이 표시되며, 다음 메시지는 기본 모델부터 다시 시도한다. 인증·결제·rate-limit·요청 크기·전송 오류와 정책 거부는 fallback 대상이 아니다. 목록은 중복 제거 후 허용된 모델 최대 3개만 사용한다. 설정 파일 간 목록은 병합되지 않으며, 가장 우선순위가 높은 파일의 전체 체인이 적용된다. `--fallback-model`은 해당 세션에서 설정을 덮어쓴다.'
  points:
  - '오류 유형을 구분: 인증·rate-limit·전송·정책 오류는 모델 fallback으로 해결되지 않음'
  - '최대 3개의 허용된 모델을 순서대로 사용; `"default"`는 계정의 기본 모델을 가리킴'
  - '설정 체인은 파일 간 병합하지 않음; `--fallback-model`은 현재 세션에서 우선'
  source: https://code.claude.com/docs/en/settings-reference#fallbackmodel
  interview: "기본 모델 호출이 rate-limit 오류를 반환했는데 fallbackModel을 설정했다면 대체 모델로 전환되나요? 사용자 설정과 프로젝트 설정에 서로 다른 체인을 지정하면 어떻게 되나요?"
  answer: "rate-limit 오류는 fallback 대상이 아니므로 전환되지 않는다. fallback은 과부하, 모델 사용 불가, 비재시도 서버 오류 등에 대응한다. 설정 파일의 체인도 병합하지 않으며, `fallbackModel`을 정의한 파일 중 가장 우선순위가 높은 파일의 전체 목록을 사용한다. 한 세션에서 바꾸려면 `--fallback-model`을 쓴다."
- category: ai
  level: "고급"
  title: Stop 훅 additionalContext — 턴 끝에 컨텍스트 주입해 작업 이어가기
  summary: 'Stop 훅의 `hookSpecificOutput.additionalContext`는 턴 끝에 시스템 리마인더를 추가한다. Claude는 이 피드백을 보고 작업을 이어가므로, 단순 알림이 아니라 중단 지점의 문맥을 보완하는 데 쓴다. `decision: "block"`은 이유를 붙여 중단을 막는 제어 응답이고, `additionalContext`는 오류가 아닌 정보성 피드백이다. 두 방식 모두 연속 8회 제한을 공유하므로 `stop_hook_active`를 확인해 반복 루프를 막는다. `SubagentStop`의 문맥은 서브에이전트에 전달된다. 부모 대화에 주려면 Agent 도구의 `PostToolUse`를 사용한다.'
  points:
  - '같은 이벤트의 여러 훅 문맥은 모두 전달; 각 값이 10,000자를 넘으면 파일 경로와 최대 2,000자 미리보기로 대체'
  - '`stop_hook_active`가 true면 이미 중단 후속 검사를 수행 중; 8회 연속 제한으로 무한 계속을 방지'
  - '`SubagentStop` 문맥은 해당 서브에이전트 대상; 부모 문맥에는 Agent의 `PostToolUse` 사용'
  source: https://code.claude.com/docs/en/hooks#add-context-for-claude
  interview: "SubagentStop 훅이 additionalContext를 반환하면 부모 대화에도 전달되나요? Stop 훅에서 작업을 계속시키면서 반복 루프는 어떻게 방지하나요?"
  answer: "아니다. SubagentStop 문맥은 서브에이전트의 다음 요청에 전달된다. 부모 대화에 문맥을 추가하려면 Agent 도구의 PostToolUse 훅을 사용한다. Stop 훅은 `stop_hook_active`를 검사해 이미 후속 실행 중인지 확인하고, Claude Code의 연속 8회 제한 안에서 조건을 처리해야 한다."
- category: ai
  level: "중급"
  title: 상태줄 rate_limits — 사용 한도와 리셋 시각 표시
  summary: 'Claude Code 상태줄은 stdin으로 받은 JSON의 `rate_limits.five_hour`와 `seven_day`에서 사용 비율(0–100)과 리셋 시각(Unix 초)을 표시할 수 있다. 이 데이터는 Claude.ai Pro·Max·Ultra 구독 또는 사용 한도를 제공하는 Claude 앱 게이트웨이에서, 세션의 첫 API 응답 뒤에 나타난다. 각 창은 별도로 누락될 수 있고 리셋 시각이 지나면 payload에서 제거되므로, 누락을 0%로 오해하지 말고 `// empty` 등으로 처리한다. 상태줄 스크립트는 로컬에서 실행되어 API 토큰을 쓰지 않는다.'
  points:
  - '`five_hour`·`seven_day`: `used_percentage`와 `resets_at`(Unix epoch 초)을 제공'
  - 'Pro·Max·Ultra 또는 spend limit 게이트웨이에서 첫 API 응답 뒤 사용 가능; 창별 부재·리셋 후 제거를 처리'
  - '상태줄은 로컬 실행이라 API 토큰을 쓰지 않음; 컨텍스트 사용량은 별도 `context_window` 필드'
  source: https://code.claude.com/docs/en/statusline
  interview: "상태줄에서 `rate_limits.seven_day`가 없으면 사용량 0%로 표시해도 되나요? 이 필드는 언제 제공되며 리셋 뒤에는 어떻게 되나요?"
  answer: "아니다. rate_limits는 Pro·Max·Ultra 구독이나 한도를 설정한 Claude 앱 게이트웨이에서 첫 API 응답 뒤 제공된다. 각 한도 창은 독립적으로 없을 수 있고, `resets_at`이 지나면 해당 창이 payload에서 제거된다. 부재는 0%와 다르므로 `// empty` 같은 방식으로 구분한다."
- category: ai
  level: "중급"
  title: disableBundledSkills — 번들 스킬·내장 명령을 모델 눈앞에서 치우기
  summary: 'Claude Code에서 `disableBundledSkills: true`를 설정하면 번들 스킬과 워크플로를 제거하고, `/init` 같은 내장 명령을 모델에서 숨긴다. 사용자는 명령을 계속 입력할 수 있다. 플러그인 스킬과 `.claude/skills/`, `.claude/commands/`의 사용자 정의 항목은 영향을 받지 않는다. 한 세션에서는 `CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1`로도 끌 수 있다. 설정이나 환경 변수 중 하나라도 비활성화하면 다른 쪽에서 다시 켤 수 없다.'
  points:
  - '`disableBundledSkills: true`: 번들 스킬·워크플로 제거; 내장 명령은 모델에서 숨기지만 사용자는 입력 가능'
  - '플러그인 스킬과 `.claude/skills/`, `.claude/commands/` 사용자 항목은 유지'
  - '세션 환경 변수 `CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1`도 사용 가능; 어느 쪽이든 끄면 다른 쪽에서 다시 켤 수 없음'
  source: https://code.claude.com/docs/en/settings-reference
  interview: "`disableBundledSkills`를 켜면 프로젝트의 `.claude/skills/`와 플러그인 스킬도 사라지나요? 설정 파일이 false여도 세션 환경 변수가 1이면 번들을 다시 켤 수 있나요?"
  answer: "아니다. 플러그인 스킬과 `.claude/skills/`, `.claude/commands/`의 사용자 항목은 유지된다. 설정 또는 `CLAUDE_CODE_DISABLE_BUNDLED_SKILLS=1` 중 하나가 번들을 끄면 다른 쪽에서 다시 켤 수 없다."
- category: ai
  level: "중급"
  title: 스킬 호출 권한 — 모델 자율 호출과 사용자 호출 분리
  summary: 'Claude Code 스킬은 기본적으로 사용자와 모델 모두 호출할 수 있다. `disable-model-invocation: true`는 모델이 스킬을 스스로 선택하지 못하게 하고, 사용자가 명시적으로 호출할 때만 사용할 수 있게 한다. 메시지 첫머리의 `/deploy`는 직접 실행 요청이다. 문장 중간의 `/deploy`는 호출 허용 신호일 뿐이므로, 모델이 실행할지 판단한다. 반대로 `user-invocable: false`는 `/` 메뉴에서 숨기지만 모델은 계속 사용할 수 있어 배경 지식에 적합하다.'
  points:
  - '`disable-model-invocation: true`: 모델의 자율 선택·호출을 막고 사용자 명시 호출을 요구'
  - '메시지 첫머리 `/name`은 직접 실행; 문장 뒤 `/name`은 실행 허용 신호라 모델이 호출 여부를 판단'
  - '`user-invocable: false`: 사용자 메뉴에서 숨기되 모델은 사용 가능; 기본은 두 호출 모두 허용'
  source: https://code.claude.com/docs/en/skills
  interview: "`disable-model-invocation: true`인 배포 스킬을 문장 뒤에서 `/deploy`라고 언급하면 바로 실행되나요? `user-invocable: false`는 모델의 사용도 막나요?"
  answer: "문장 뒤의 `/deploy`는 실행 허용 신호이며 직접 실행하지 않는다. 모델이 실행할지는 문맥을 보고 결정한다. 자동 호출 자체를 막고 싶으면 메시지 첫머리에서 명시적으로 호출해야 한다. `user-invocable: false`는 사용자 메뉴만 숨기며 모델은 계속 사용할 수 있다."
- category: ai
  level: "중급"
  title: 스킬 effort 프런트매터 — 턴 단위 추론 강도 조절
  summary: 'Claude Code 스킬의 `effort` 프런트매터는 해당 턴의 추론 강도를 정한다. 값은 `low`, `medium`, `high`, `xhigh`, `max`이며 선택 가능 여부는 모델에 따라 다르다. 세션 effort보다 우선하지만 `CLAUDE_CODE_EFFORT_LEVEL` 환경 변수보다 우선하지 않는다. `context: fork` 스킬이면 effort는 분리된 서브에이전트에 적용된다. 본문에서는 `${CLAUDE_EFFORT}`로 현재 값을 읽을 수 있다. `model` 프런트매터도 해당 턴에만 적용되고, 다음 사용자 메시지부터 세션 모델로 돌아간다.'
  points:
  - '`effort`: 해당 턴의 effort를 지정; 모델별 지원 수준에 차이가 있고 환경 변수 설정은 덮어쓰지 못함'
  - '`context: fork`에서는 분리된 서브에이전트의 effort를 설정'
  - '`model`도 턴 단위 override이며 다음 메시지부터 세션 설정으로 복귀; `${CLAUDE_EFFORT}`로 현재 값 참조'
  source: https://code.claude.com/docs/en/skills
  interview: "스킬의 `effort: high`는 세션 전체의 기본값이 되나요? `CLAUDE_CODE_EFFORT_LEVEL`이 따로 설정되어 있거나 스킬이 `context: fork`라면 어떻게 되나요?"
  answer: "아니다. `effort`는 현재 턴에 적용되고 다음 사용자 메시지에서는 세션 설정으로 돌아간다. `CLAUDE_CODE_EFFORT_LEVEL`은 스킬의 effort보다 우선하며, `context: fork`이면 지정한 effort가 분리된 서브에이전트에 적용된다. 모델이 해당 수준을 지원하지 않으면 그 수준은 사용할 수 없다."
- category: ai
  level: "고급"
  title: PreCompact 훅 — 요약 지침과 외부 저장 분리
  summary: 'Claude Code는 `/compact` 또는 자동 압축 전에 `PreCompact` 훅을 실행하고 `trigger`로 `manual`과 `auto`를 구분한다. 훅이 정상 종료하면 stdout은 요약 지침으로 쓰이며, 훅당 10,000자를 넘으면 잘린다. 오래 보존할 내용을 파일에 남기려면 훅이 직접 저장해야 한다. 종료 코드 2 또는 `{"decision":"block"}`은 압축을 막지만, 자동 압축이 이미 컨텍스트 한도 오류를 복구하려는 중이라면 요청이 실패할 수 있다.'
  points:
  - '`trigger`: `manual`(`/compact`) 또는 `auto`(자동·유휴 압축); 성공한 훅의 stdout은 요약 지침'
  - 'stdout은 훅당 10,000자 제한; 다음 요청에도 필요한 외부 상태는 파일 등에 직접 저장'
  - 'exit 2 또는 `decision: "block"`으로 차단 가능; 한도 오류 복구 중 auto 차단은 현재 요청을 실패시킬 수 있음'
  source: https://code.claude.com/docs/en/hooks
  interview: "PreCompact 훅이 stdout으로 JSON 로그를 출력하면 그 내용은 어디에 쓰이나요? 자동 압축을 차단해도 컨텍스트 한도 오류가 이미 발생한 경우 대화가 계속되나요?"
  answer: "stdout은 로그 저장소가 아니라 압축 요약에 반영할 지침으로 사용되며 훅당 10,000자 제한이 있다. 영속적으로 보존하려면 훅이 파일 등 외부 저장소에 직접 기록해야 한다. 이미 한도 오류를 복구하려는 자동 압축을 차단하면 요청이 실패할 수 있다."
- category: ai
  level: "고급"
  title: 설정형 훅 핸들러 5종 — 이벤트별 지원과 검토
  summary: '설정형 Claude Code 훅은 `command`(셸), `http`(POST), `mcp_tool`(설정된 MCP 도구), `prompt`(단일 모델 평가), `agent`(도구를 쓰는 에이전트 검증)로 실행할 수 있다. 단, 모든 이벤트가 5종을 모두 지원하지 않는다. 예를 들어 `PreCompact`는 command/http/mcp_tool만, `Setup`은 command만 지원한다. `agent` 훅은 실험적 기능이다. `/hooks`는 설정을 편집하는 메뉴가 아니라 출처와 내용을 확인하는 읽기 전용 탐색기다. 설정은 settings 파일에서 관리한다.'
  points:
  - '5종: command / http / mcp_tool / prompt / agent; 지원 유형은 이벤트마다 다름'
  - '`prompt`는 입력 JSON을 모델에 보내고, 실험적인 `agent`는 파일·코드를 도구로 조사하는 검증 에이전트를 실행'
  - '`/hooks`는 읽기 전용 브라우저; 훅 추가·수정은 settings 파일에서 수행'
  source: https://code.claude.com/docs/en/hooks
  interview: "`PreCompact`에 agent 훅을 설정하면 실행되나요? `/hooks`에서 직접 수정할 수 있나요? `prompt`와 `agent`는 검증 방식이 어떻게 다른가요?"
  answer: "아니다. `PreCompact`는 command, http, mcp_tool만 지원하므로 agent 훅은 실행되지 않는다. `/hooks`는 읽기 전용이며 설정 파일을 수정해야 한다. prompt는 입력을 단일 LLM 평가로 판단하고, agent는 서브에이전트를 실행해 파일이나 코드를 도구로 조사한다."
- category: ai
  level: "중급"
  title: 스킬 disallowed-tools — 호출 중 도구 가용성 줄이기
  summary: '`disallowed-tools`는 스킬을 실행하는 동안 지정한 도구를 Claude의 사용 가능 목록에서 뺀다. 예를 들어 자율 백그라운드 스킬에서 `AskUserQuestion`을 제외할 수 있다. 제한은 다음 사용자 메시지를 보내면 해제된다. 모든 스킬과 프롬프트에서 계속 차단하려면 권한 설정의 deny 규칙을 사용한다. 반대로 `allowed-tools`는 호출한 턴 동안 지정 도구를 승인 없이 쓰게 할 뿐, 다른 도구를 숨기지는 않으며 기본 권한 규칙도 유지한다.'
