  title: V8V — KMP 크로스플랫폼 음성 오케스트레이션 프레임워크, 음성→로컬 액션·MCP·웹훅(MIT)
  summary: 'V8V는 Kotlin Multiplatform으로 만든 크로스플랫폼 음성 오케스트레이션 프레임워크다. 온디바이스 STT로 음성을 인식하고, 3가지 콜백(Local·MCP·Remote/웹훅)으로 로컬 앱 액션·크로스앱 MCP 명령·원격 워크플로우를 실행한다. Android·iOS·macOS·Web·Flutter·React Native 6개 플랫폼 지원. 오프라인 우선·다국어·프라이버시 보장. Maven Central(Android)·SPM(iOS)·npm(Web) 배포.

