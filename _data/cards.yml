  summary: Codemod는 프레임워크 업그레이드·보안 패치·대규모 리팩터를 자동화하는 AI 네이티브 codemod 플랫폼이다. Codemod CLI(Rust)는 ast-grep·JSSG(TypeScript AST) 변환을 scaffold·test·run하고, workflow.yaml로 matrix strategy·manual approval gate가 있는 멀티스텝 마이그레이션을 오케스트레이션한다. Codemod AI는 before/after 예시 쌍을 넣으면 declarative YAML rule 또는 NAPI imperative script를 생성하고, 3회 refinement iteration으로 registry 57개 샘플 기준 정확도 38.6%→64.9%까지 올린다. Codemod MCP(`npx codemod@latest mcp`)는 dump_ast·run_jssg_tests·jssg-gotchas 같은 도구로 Cursor·Claude Code가 IDE 안에서 codemod package를 작성·검증하게 한다. ast-grep(단일 구조 치환 CLI) ·OpenRewrite(enterprise)와 complement — Codemod=AI authoring + registry + cross-repo workflow.
