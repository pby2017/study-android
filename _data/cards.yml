  - 6개 유형 — 서버 1개/여러 개 × 단일/병렬/순차 도구 호출, 각 100개 질의
  - Outcome judge — self-correction 등 여러 실행 경로를 허용하고 최종 목표 달성으로 평가
  - 60개 표본에서 전문가 다수결과 91.67% 일치(κ=.734) — judge 신뢰도를 과대 일반화하지 않기
  source: https://arxiv.org/abs/2509.09734
  interview: "MCP 에이전트 벤치마크에서 실행 경로를 고정하지 않고 최종 결과를 평가하면 어떤 장점과 주의점이 있나요?"
  answer: "자기 수정이나 여러 유효 경로를 허용해 도구 호출 순서가 달라도 작업 성공을 평가할 수 있다. 반면 결과만 보면 도구 사용이 필요한 요청을 모델의 기억으로 답했는지 놓칠 수 있으므로, 요구된 외부 정보의 근거와 평가자 신뢰도를 별도로 확인해야 한다."
