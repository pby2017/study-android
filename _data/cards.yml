- category: ai
  title: Zed 1.4.2 Agent Skills — SKILL.md replaces rules·global AGENTS.md
  summary: Zed 1.4.2(May 27 2026) — rules library retired, Agent Skills(SKILL.md folder+YAML frontmatter)로 전환. @rule→@skill, scripts/references/assets self-contained·version-controllable·dotfiles sync. built-in /create-skill scaffolds folder+frontmatter. global AGENTS.md at ~/.config/zed/AGENTS.md — first editor with project+global native AGENTS.md(Cursor·Codex·Copilot·Gemini CLI·Aider cross-tool standard). agent catalog sees name+description, skill tool on-demand load·disable-model-invocation for slash-only. external agent(Codex ACP) threads에는 Zed Skills 미적용 — agent-native config separate. vs openskills(AGENTS.md XML inject) ·Cursor rules(.mdc) — Zed=native skill filesystem+global AGENTS.md dual scope.
  points:
  - Rules library deprecated — SKILL.md folder is version-controllable unit
  - Global AGENTS.md ~/.config/zed/ — cross-project instructions without per-repo copy
  - External agents ignore Zed Skills — Codex/Claude keep native skill config
  source: https://zed.dev/docs/ai/skills
- category: ai
  title: Symphony — WORKFLOW.md issue tracker control plane·isolated agent runs
  summary: Symphony(openai/symphony·Apache-2.0·~25k★·SPEC.md) — OpenAI open-source Codex orchestration spec. Linear(etc) board를 control plane — open task마다 isolated workspace+agent run until PR or fail. WORKFLOW.md — tracker kind·prompt_template·workspace manager·agent runner·observability components declarative. Orchestrator state machine Unclaimed→Claimed→Running→Succeeded/Failed/TimedOut, git worktree per ticket, 30s poll. language-agnostic spec — reference Elixir impl, "implement Symphony per SPEC.md"로 any language agent build. harness engineering prerequisite — managing work not supervising agents. vs Jules(plan-first VM) ·Claude Code Routines(cloud schedule) — Symphony=issue tracker native always-on dispatch loop.
  points:
  - SPEC.md only core artifact — implement in language of choice
  - Worktree isolation per ticket — no branch collision across concurrent agents
  - Issue tracker as UI — zero Symphony-specific dashboard, Linear remains source of truth
  source: https://github.com/openai/symphony/blob/main/SPEC.md
