  title: Llama 4 — Scout(10M ctx)·Maverick(128E MoE)·Behemoth(2T teacher), 네이티브 멀티모달 오픈웨이트
  summary: Meta Llama 4(2025-04-05)는 네이티브 멀티모달 MoE 패밀리다. Scout(109B total, 17B active, 16 experts)는 10M 토큰 컨텍스트·단일 H100(Int4) 배포. Maverick(400B total, 128 experts)는 1M ctx·GPT-4o급 범용·코딩. Behemoth(2T total, 288B active)는 STEM 벤치에서 GPT-4.5·Claude 3.7·Gemini 2.0 Pro 상회하나 아직 미공개(teacher distillation용). Early fusion으로 텍스트·이미지 동시 처리, 12개 언어 fine-tune, Hugging Face·llama.com 배포.
