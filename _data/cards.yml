  title: Jamba 2 — AI21 SSM+Transformer 하이브리드, 3B 엣지·52B/12A MoE·256K ctx(Apache-2.0)
  summary: AI21 Labs가 2026-01 공개한 Jamba 2는 Mamba SSM과 Transformer attention을 교차 배치한 하이브리드 오픈웨이트 패밀리다. Jamba2 3B(dense)는 iPhone·Mac에서 돌릴 수 있는 엣지 모델, Jamba2 Mini(52B total·12B active MoE)는 256K 컨텍스트에서 reasoning 모델의 thinking token 오버헤드 없이 enterprise QA·RAG·장문 분석에 최적화됐다. 500B 토큰 mid-training(수학·코드·장문 비중↑) 후 on-policy RL(DPO→verifiable reward)로 instruction-following·grounding 벤치(IFBench·FACTS)에서 동급 Ministral3 14B 대비 통계적으로 유의한 우위를 보인다. Apache-2.0, Hugging Face·AI21 Studio·AWS Bedrock 제공.
  points:
