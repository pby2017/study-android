  - category: ai
    title: "mini-SWE-agent — '도구·설정 다 빼고' 100줄 bash만으로 SWE-bench 74%를 찍은 미니멀 에이전트(SWE-agent 후속)"
    summary: >
      SWE-agent(프린스턴·~19.5k★)를 만든 팀이 내놓은 후속작으로, 에이전트 핵심 로직을 파이썬 약 100줄로 줄인 미니멀 코딩 에이전트다.
      가장 큰 설계 선택은 '도구(tool-calling) 인터페이스를 안 쓴다'는 것 — 커스텀 툴이나 함수 호출 API 없이 오직 bash 명령만으로 동작하고,
      액션은 subprocess.run으로 실행하며 대화 이력도 선형(linear)으로 단순하게 유지한다. 스캐폴드를 깎아내고 LM 자체의 능력에 집중하자는 철학으로,
      그럼에도 SWE-bench에서 74%를 넘는 점수를 주장한다. 라이선스는 MIT, GitHub 스타는 약 5.2k(2026-06 기준).
    points:
      - "100줄·bash-only: 커스텀 도구도, 함수 호출 API도 없음. 모델이 bash 명령을 내면 subprocess.run으로 돌리고 결과를 다시 먹이는 단순 루프 — 어떤 LM에든 꽂기 쉬움"
      - "주장 수치: SWE-bench 74%+ 점수를 README에서 주장(모델·구성에 따라 달라짐). 전작 SWE-agent(~19.5k★)와 별개 레포로, mini 쪽은 ~5.2k★"
      - "도입처: Meta·NVIDIA·IBM·Anyscale·프린스턴·스탠퍼드 등이 SWE-bench 평가용으로 쓴다고 명시. '스캐폴드보다 모델'이라는 벤치마킹 철학의 레퍼런스 구현"
    source: "https://github.com/SWE-agent/mini-swe-agent"
  - category: ai
    title: "Agent Teams(Claude Code 공식·실험) — 서브에이전트와 달리 '동료끼리 직접 대화·반박'하게 만드는 팀 모드"
    summary: >
      서브에이전트는 일을 나눠 병렬로 돌리지만 결과를 리드에게 따로 보고할 뿐, 서로 발견을 공유하거나 가정을 반박하지 못한다.
      Claude Code의 Agent Teams(실험 기능)는 이 한계를 푼다 — 한 세션이 '팀 리드'가 되어 여러 독립 Claude 인스턴스(각자 자기 컨텍스트 창)를 띄우고,
      이들이 공유 태스크 리스트로 스스로 조율하며 서로에게 직접 메시지를 보낸다. 켜는 법은 환경변수 `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`.
      "버그 원인 가설 5개를 동료들이 서로 반증하게 하라" 같은 과학적 토론 구조로, 한 에이전트가 첫 가설에 닻 내리고 멈추는 앵커링을 깨는 게 핵심 용도다.
    points:
      - "서브에이전트 vs 팀: 서브에이전트는 리드에게만 결과 보고(토큰 저렴·결과만 중요할 때), 팀은 동료끼리 직접 메시징+공유 태스크 리스트로 self-coordination(토큰 비쌈·각 동료가 별도 Claude 인스턴스)"
      - "실무 패턴: PR 리뷰를 보안/성능/테스트커버리지 3개 렌즈로 동시에 / 경합 가설 5개를 adversarial하게 서로 반증 / 모듈을 동료별로 나눠 병렬 리팩터(파일 충돌 피하려 각자 다른 파일 소유)"
      - "운영: 동료는 CLAUDE.md·MCP·스킬은 자동 로드하나 리드의 '대화 이력'은 안 물려받음(스폰 프롬프트에 맥락 명시 필요). 플랜 승인 게이트('테스트 포함 plan만 승인') 가능. tmux/iTerm2 split-pane 또는 in-process 모드"
    source: "https://code.claude.com/docs/en/agent-teams"
  - category: ai
    title: "Kiro(AWS) — '코드가 아니라 스펙이 산출물'이라며 요구사항→설계→태스크 세 파일로 강제하는 스펙 주도 에이전트"
    summary: >
      Kiro는 AWS가 내놓은 에이전트형 개발 도구로, IDE·CLI·웹 인터페이스 세 가지 형태로 제공된다. 슬로건은 "에이전트 개발에 엔지니어링 규율을 가져온다(Bring engineering rigor to agentic development)" — 프롬프트 한 줄로 바로 코드를 뽑는 vibe coding 대신, 프로토타입을 프로덕션까지 끌고 가는 걸 목표로 한다.
      핵심은 '스펙(spec)'이다. 기능이나 버그 수정을 세 단계 워크플로로 형식화하는데, 결과물이 추적 가능한 파일로 남는다 — requirements.md(사용자 스토리·수용 기준 또는 버그 분석), design.md(기술 아키텍처·시퀀스 다이어그램·구현 고려사항), tasks.md(추적 가능한 상세 구현 계획). 즉 코드를 짜기 전에 '무엇을·어떻게'를 사람이 리뷰할 수 있는 문서로 먼저 합의하고, 코드는 그 스펙을 컴파일한 산출물로 보는 구조다.
      로그인은 AWS Builder ID나 IAM으로 하며 별도 AWS 계정 없이도 시작할 수 있다. 작은 수정엔 스펙 오버헤드가 과할 수 있으니, 에이전트가 의도를 다르게 해석하면 곤란한 큰 기능에 쓰는 게 실무 권장 패턴이다.
    points:
      - "세 파일 강제: requirements.md(스토리·수용기준) → design.md(아키텍처·시퀀스 다이어그램) → tasks.md(추적 가능한 구현 계획). 각 단계가 사람 리뷰 체크포인트가 되어 에이전트의 의도 드리프트를 막음"
      - "철학: '스펙이 진짜 소스, 코드는 빌드 산출물' — .c가 바이너리로 컴파일되듯 스펙에서 코드가 나온다는 SDD(스펙 주도 개발) 사상의 AWS판 구현. IDE·CLI·웹 3종 제공"
      - "접근: AWS Builder ID/IAM 로그인, AWS 계정 없이도 시작 가능. 단 작은 버그픽스엔 스펙 작성 비용이 과함 — 의도 해석이 갈리면 곤란한 큰 기능에만 쓰는 게 실전 권장"
    source: "https://kiro.dev/docs/specs/"
  - category: ai
    title: "Cline의 Plan/Act 모드 — '생각'과 '실행'을 토글로 분리해 AI가 코드베이스 절반을 갈아엎는 사고를 막는 법"
    summary: >
      Cline은 VS Code(및 JetBrains 등) 사이드바에 붙는 오픈소스 자율 코딩 에이전트로, Apache-2.0 라이선스에 GitHub 스타 약 63k(2026-06 기준).
      바로 코드 생성에 들어가는 도구들과 달리 Cline의 시그니처 설계는 'Plan 모드'와 'Act 모드'를 명시적으로 토글하는 것이다.
      Plan 모드에서는 코드베이스를 읽고 추론하며 모호한 점을 되묻고 전략을 세우기만 하고(쓰기 없음), 사용자가 합의한 뒤 Act 모드로 넘어가야 비로소 파일을 수정하고 명령을 실행한다.
      이 '생각과 실행의 분리'가 핵심 가치다 — 에이전트가 첫 해석에 닻 내린 채 곧장 절반을 갈아엎는 실패 모드를 막고, 액션마다 승인을 받는 감사 추적이 가능해진다.
      모델은 BYOK 방식으로 Anthropic·OpenAI·Gemini·Bedrock·로컬(Ollama) 등 30+ 공급자를 붙일 수 있고 MCP도 지원한다.
    points:
      - "Plan = 읽기·추론·되묻기(쓰기 금지) → 합의 → Act = 액션별 승인 받으며 실행. '먼저 생각, 그다음 실행'을 도구 차원에서 강제해 의도 드리프트와 폭주 편집을 차단"
      - "트레이드오프: 액션마다 승인이 규제·감사 환경엔 이상적이지만 솔로/소규모엔 마찰. BYOK라 Opus·GPT-5 장기 작업 시 정액 구독보다 토큰비가 더 나올 수 있음 — 비용 관리가 최다 지적사항"
      - "생태계 위치: Apache-2.0·~63k★·VS Code 마켓+Open VSX 합산 500만+ 설치로 오픈소스 코딩 에이전트 최대 채택. Roo Code가 이 Cline의 포크. 30+ 공급자·로컬 모델·VPC/온프렘/에어갭 배포 지원"
    source: "https://github.com/cline/cline"
  - category: ai
    title: "Cursor 2.0 — 'git 워크트리'로 에이전트 여러 개를 동시에·충돌 없이 돌리고 '제일 잘한 놈'을 고르는 IDE"
    summary: >
      Cursor 2.0(2025-10-29)은 인터페이스를 '파일 중심'에서 '에이전트 중심'으로 갈아엎고,
      에이전트 여러 개를 동시에 돌리는 멀티 에이전트를 핵심으로 내세웠다.
      여러 에이전트가 서로 충돌하지 않는 비결은 'git 워크트리(또는 원격 머신)'로 작업 공간을 격리하는 것 —
      같은 레포에서 여러 시도가 병렬로 돈다.
      Cursor는 "여러 모델이 같은 문제를 풀게 한 뒤 결과가 제일 좋은 걸 고르면" 특히 어려운 작업의 품질이 크게 오른다는 걸 발견했다고 밝혔다.
      에이전트 사용이 늘며 생긴 새 병목 — 코드 리뷰와 테스트 — 을 위해 변경 검토를 빠르게 하는 UI와, 에이전트가 자기 결과를 직접 테스트하는 네이티브 브라우저 도구도 같이 넣었다.
    points:
      - "병렬 격리 메커니즘: 동시에 도는 에이전트들이 충돌 안 나는 건 'git worktrees 또는 원격 머신'으로 작업 공간을 분리하기 때문 — Conductor·claude --worktree와 같은 발상을 IDE에 기본 내장"
      - "'best-of-N' 패턴: 여러 모델이 같은 문제를 동시에 풀고 그중 최선을 채택 → 어려운 작업일수록 품질↑(Cursor 공식 주장). 자체 모델 Composer는 대부분 턴을 '30초 미만'에 끝내는 저지연 에이전트 코딩용이라고 소개"
      - "새 병목=리뷰+테스트: 에이전트가 짠 코드를 빠르게 검토하는 UI와, 에이전트가 직접 브라우저로 자기 결과를 테스트·반복하는 네이티브 도구를 같이 탑재. 깊은 코드 작업엔 '클래식 IDE'로 토글 가능"
    source: "https://cursor.com/blog/2-0"
  - category: ai
    title: "Amp(Sourcegraph) — '토큰 아끼지 마라'를 철학으로 내건, 스레드·서브에이전트·Oracle로 미는 프런티어 코딩 에이전트"
    summary: >
      Amp는 Sourcegraph가 만든 터미널·에디터용 코딩 에이전트로, "프런티어 모델과 그다음에 올 것을 위해 만든 에이전트"를 표방한다.
      설계 철학이 다른 도구와 갈리는데, 토큰을 아끼려 컨텍스트를 깎기보다 '제약 없이' 쓰는 쪽에 무게를 둔다 — 작업 품질을 위해 토큰 비용을 감수한다는 입장이다.
      작업 단위는 '스레드(Thread)'로, 대화·작업 맥락이 영속 저장돼 살아있는 메모리이자 팀 협업·공유 수단이 된다(스레드 포킹으로 대안 시도도 가능).
      서브에이전트는 전문 작업을 떼어 맡고 메인 스레드에 결과를 보고하며, 읽기·검색·진단 같은 독립 작업은 기본적으로 병렬로 돌린다(같은 파일·공유 계약을 건드리는 쓰기만 직렬화).
      'Oracle'이라는 별도 도구로 더 강한 추론 모델에 어려운 분석을 위임할 수 있고, AGENT.md 파일로 규칙·제약을 코드베이스에 박아 둔다.
    points:
      - "철학적 차별점: 컨텍스트를 깎아 토큰을 아끼는 대신 '제약 없는 토큰 사용'으로 품질을 우선 — 비용보다 결과를 택하는 트레이드오프. CLI 실행 모드 `amp -x`는 유료 크레딧을 쓰고, Amp Free는 대화형에만 적용"
      - "구조: '스레드'가 영속 메모리이자 협업 단위(포킹 지원) + 서브에이전트가 전문 작업을 병렬로 처리하고 메인에 보고. 독립 작업(읽기·검색·진단)은 기본 병렬, 같은 파일·타입·DB스키마·공개 API를 건드리는 쓰기만 직렬화"
      - "도구·환경: 어려운 추론은 'Oracle' 도구로 더 강한 모델에 위임, AGENT.md로 규칙 주입, MCP 지원(`amp mcp add`). macOS·Linux·Windows(WSL)·JetBrains 2025.1+ 지원, `--stream-json`은 `--execute`와 함께 사용"
    source: "https://ampcode.com/manual"
  - category: ai
    title: "opencode(sst→Anomaly) — 'opencode serve' 헤드리스 HTTP 서버로 TUI·데스크톱·IDE가 다 붙는 클라이언트/서버형 오픈소스 코딩 에이전트(MIT·~175k★)"
    summary: >
      opencode는 터미널을 위해 만든 오픈소스 AI 코딩 에이전트로, GitHub ~175k★·MIT 라이선스다(레포 anomalyco/opencode).
      구조가 다른 도구와 갈리는 핵심은 클라이언트/서버 분리다 — `opencode serve`로 헤드리스 HTTP 서버를 띄우면 TUI는 여러 클라이언트 중 하나일 뿐이고, 데스크톱 앱·IDE 확장·SDK가 모두 그 서버에 붙어 작업을 구동한다.
      특정 모델 제공자에 묶이지 않는 provider-agnostic 설계라 API 키만 꽂으면 어떤 LLM 제공자든 쓸 수 있다(추천 묶음 'opencode Zen' 제공).
      Claude Code처럼 두 내장 에이전트를 Tab으로 토글하는데, build는 풀 액세스 개발용, plan은 파일 편집을 막고 bash 실행 전 허락을 받는 읽기 전용 분석/탐색용이다 — 폭주 편집을 구조적으로 차단한다.
    points:
      - "클라이언트/서버: `opencode serve`가 OPENCODE_SERVER_PASSWORD로 보호되는 헤드리스 HTTP 서버를 띄움 → TUI/데스크톱(macOS·Windows·Linux .deb/.rpm/.AppImage)/IDE 확장/SDK가 같은 서버에 붙는 구조. 에디터에 묶이지 않은 코어가 핵심"
      - "plan/build 토글(Tab): plan은 읽기 전용으로 파일 편집을 거부하고 bash 실행 전 허락을 요구하는 분석·탐색 모드, build는 풀 액세스 개발 모드 — '생각'과 '실행'을 갈라 안전 탐색을 강제(Cline의 Plan/Act와 같은 발상)"
      - "provider-agnostic·서브에이전트: API 키만 있으면 임의 LLM 제공자 사용(추천 묶음 opencode Zen), `@general` 서브에이전트로 복잡한 멀티스텝 검색 위임. 설치는 curl 스크립트·npm/bun/pnpm/yarn·brew(anomalyco/tap)·scoop/choco·pacman"
    source: "https://github.com/sst/opencode"
  - category: ai
    title: "Repomix — 레포 전체를 'AI 친화 단일 파일' 하나로 싸서 LLM에 통째로 먹이는 패커(MIT·~26.3k★)"
    summary: >
      Repomix는 코드베이스 전체를 LLM이 소화하기 좋게 단일 파일 하나(repomix-output.xml 등)로 묶어주는 오픈소스 도구로, GitHub ~26.3k★·MIT 라이선스다(yamadashy/repomix).
      에이전트가 도구로 코드를 탐색하지 않는 상황 — ChatGPT·Gemini·Claude 웹/데스크톱에 레포 맥락을 통째로 붙여 넣고 싶을 때 — 이 진가를 발휘한다. `npx repomix`만 치면 현재 디렉터리를 한 파일로 패킹한다.
      수작업 파일 복사·붙여넣기를 없애주고, 버그 조사·보안 감사·구현 계획·서드파티 라이브러리 문서화 같은 '레포 스냅샷이 필요한' 작업에 그대로 쓰인다.
      LLM 친화 출력을 위해 XML/Markdown/플레인 등 포맷을 고르고, 토큰 수를 세어주며, 보안상 민감 정보(시크릿) 탐지·코드 압축으로 토큰을 줄이는 옵션도 제공한다.
    points:
      - "사용법: `npx repomix`로 설치 없이 현재 레포를 단일 파일로 패킹 → 그 파일을 LLM 채팅에 붙여 넣으면 전체 프로젝트 맥락 확보. repomix.com 웹 인터페이스와 GitHub 페이지에 'Pack' 버튼을 다는 크롬 확장도 있음"
      - "AI 친화 출력: XML·Markdown·플레인 등 포맷 선택, 토큰 카운팅으로 컨텍스트 예산 가늠, 코드 압축(주석 제거 등)으로 토큰 절감 — '에이전트가 못 도는' 모델에 레포를 통째로 넣을 때의 비용/한도 문제를 직접 다룸"
      - "안전장치·용도: 시크릿 탐지로 민감 정보 유출 방지, 클론 없이 원격 레포 패킹 지원. 권장 용도는 버그 조사·보안 감사·구현 계획·서드파티 라이브러리 문서화 등 레포 스냅샷이 필요한 작업(JSNation Open Source Awards 2025 'Powered by AI' 후보)"
    source: "https://github.com/yamadashy/repomix"
  - category: ai
    title: "Factory droid — '터미널 에이전트 + Custom Droid + Mission'으로 미는 모델 비종속 엔터프라이즈 코딩 플랫폼"
    summary: >
      Factory는 코딩 에이전트 `droid`를 터미널에 올린 플랫폼으로, 공식 문서는 이를 "Meet `droid` — the power of Factory in your terminal"로 소개한다.
      설치는 `curl -fsSL https://app.factory.ai/cli | sh`(또는 `npm install -g droid`) 한 줄, 프로젝트에서 `droid`만 치면 대화형 세션이 뜬다.
      특정 LLM에 묶이지 않는 'Model flexibility'를 내세워, 작업마다 적합한 모델로 라우팅("route tasks to the best model for each job")한다는 점이 단일 벤더 에이전트와의 핵심 차별점이다.
      CI/CD·자동화용으로 `droid exec` 헤드리스 모드를 제공하고, 다단계 워크플로를 묶은 'Missions'는 `droid exec --mission`으로 사람 없이 돌릴 수 있다.
    points:
      - "설치·실행: `curl -fsSL https://app.factory.ai/cli | sh` / `irm https://app.factory.ai/cli/windows | iex` / `npm install -g droid` 중 택1 → 프로젝트에서 `droid` 입력 시 대화형 세션 시작(공식 docs.factory.ai 기준)"
      - "모델 비종속: 단일 AI 공급자에 'Not locked into'를 명시 — 작업별 최적 모델 라우팅을 내세운 'Model flexibility'가 셀링포인트(구체 모델명은 공식 overview 문서엔 미기재)"
      - "헤드리스·자동화: `droid exec`로 스크립트·CI/CD에서 비대화형 실행, 다단계 워크플로 'Missions'는 `droid exec --mission`으로 헤드리스 구동 — 백그라운드/배치 에이전트 운영에 직접 대응"
    source: "https://docs.factory.ai/cli/getting-started/overview"
  - category: ai
    title: "하네스 엔지니어링(Harness Engineering) — '모델 말고 모델 둘러싼 모든 것'을 설계해 에이전트 실패를 구조로 막기"
    summary: >
      Martin Fowler 사이트(Birgitta Böckeler, 2026-04-02)는 '하네스(harness)'를 "AI 에이전트에서 모델을 뺀 모든 것"으로 정의한다 — 즉 도구·피드백 루프·안전 경계·검증 시스템 전체.
      핵심 발상은 "에이전트가 실수하면 그때그때 고치지 말고, 그 실수를 두 번 다시 못 하게 하는 해법(주로 더 나은 하네스)을 만든다"는 것으로, 같은 모델을 그대로 두고 하네스만 바꿔도 성능이 크게 움직인다.
      실제로 LangChain은 모델이 아니라 하네스를 바꿔 Terminal-Bench 2.0 점수를 52.8%→66.5%로 끌어올렸다(주장).
      Fowler 글은 자기교정 확률을 높이는 'builder harness'와 사람의 개입을 꼭 필요한 곳에만 두는 'user harness'를 구분하고, 환경을 에이전트가 읽고 다루기 쉽게 만드는 'ambient affordances'와 토폴로지를 좁혀 가변성을 줄이는 접근을 제시한다.
    points:
      - "정의: 하네스 = 에이전트에서 '모델을 제외한 전부'(도구 오케스트레이션·검증 루프·컨텍스트/메모리·가드레일·관측성). 'AI 에이전트 성능은 모델이 아니라 하네스가 결정한다'가 2026년의 합의"
      - "핵심 원칙: 에이전트가 실수하면 즉석 수정이 아니라 '다시는 그 실수를 못 하게 하는 해법'을 하네스로 만들어 영구화 — 같은 모델로도 점수가 출렁(LangChain Terminal-Bench 52.8%→66.5%는 하네스만 교체한 결과라는 주장)"
      - "Fowler/Böckeler 프레임: 'builder harness'(자기교정 유도)와 'user harness'(사람 개입을 필요한 지점에만)로 분리, 'ambient affordances'(환경을 에이전트가 읽기 쉽게)·토폴로지 고정으로 가변성 축소 — 좋은 하네스는 사람 입력을 없애는 게 아니라 '중요한 곳으로' 돌린다"
    source: "https://martinfowler.com/articles/harness-engineering.html"
  - category: ai
    title: "Agent Skills(SKILL.md) — Anthropic가 연 'Skill 한 번 만들면 어떤 에이전트서나' 오픈 표준, Cursor·Codex·Gemini CLI까지 채택"
    summary: >
      Agent Skills는 Anthropic이 만들어 오픈 표준으로 공개한, AI 에이전트에 전문 지식·워크플로를 주입하는 경량 포맷이다.
      핵심은 SKILL.md 한 파일을 담은 폴더 — 메타데이터(name·description)와 지침을 적고, 스크립트·참고문서·템플릿을 함께 묶을 수 있다.
      Claude Code 전용이 아니라 Cursor·OpenAI Codex·Gemini CLI·GitHub Copilot·VS Code·OpenHands·Goose·Roo Code 등 수십 개 도구가 같은 포맷을 채택해, "한 번 만들면 어디서나 쓰는" 크로스 제품 재사용이 핵심 가치다.
    points:
      - "구조: 폴더 + 필수 SKILL.md(메타 name·description + 지침), 선택적으로 scripts/·references/·assets/ 번들. 별도 SDK·플러그인 형식이 아니라 마크다운 파일 하나가 진입점"
      - "동작은 '점진적 공개(progressive disclosure)' 3단계 — ①Discovery: 시작 시 name·description만 로드 ②Activation: 작업이 description과 매칭되면 본문 전체를 컨텍스트로 ③Execution: 필요할 때만 번들 코드·참고파일 로드. 그래서 스킬 수십 개를 달아도 컨텍스트 footprint가 작다"
      - "표준 채택 현황(agentskills.io 클라이언트 쇼케이스 기준): Claude Code/Claude·Cursor·OpenAI Codex·Gemini CLI·GitHub Copilot·VS Code·OpenHands·Goose·Roo Code·Amp·Factory·Kiro·Letta 등. openai/skills(Codex용 Skills Catalog)는 22.3k★. Anthropic이 발원해 오픈 표준으로 풀고 생태계가 확장 중"
    source: "https://agentskills.io"
  - category: ai
    title: "skills.sh(Vercel) — 'npx skills add'로 SKILL.md를 70여 개 에이전트에 한 번에 까는 npm식 스킬 패키지 매니저(MIT·22.6k★)"
    summary: >
      Vercel-labs가 만든 skills.sh는 AI 코딩 에이전트용 스킬(SKILL.md)을 npm 패키지처럼 설치·관리하는 오픈소스 CLI다.
      GitHub shorthand·URL·GitLab·로컬 경로에서 스킬을 받아 add·use·list·find·update·remove·init 서브커맨드로 다루며,
      OpenCode·Claude Code·Codex·Cursor를 포함해 70여 개 에이전트에 동시에 설치한다.
      핵심은 스킬을 한 곳에 두고 각 에이전트 디렉터리로 심볼릭 링크를 거는 방식이라, 도구를 바꿔도 같은 스킬을 그대로 쓴다.
      라이선스는 MIT, README 기준 약 22.6k★다.
    points:
      - "설치 한 줄: 'npx skills add <owner/repo>'. 안 깔고 한 번만 돌리는 'use', 키워드 검색 'find', 새 스킬 뼈대 만드는 'init'까지 — 패키지 매니저처럼 add/list/update/remove 풀세트"
      - "스코프 플래그: '-g'는 ~/<agent>/skills/(전역), 기본은 ./<agent>/skills/(프로젝트). '-a'로 대상 에이전트, '-s'로 스킬, '-y'로 비대화형 지정"
      - "도구 비종속이 핵심 — 스킬 원본을 한 벌 두고 OpenCode·Claude Code·Codex·Cursor 등 67개+ 에이전트 폴더에 심볼릭 링크. SKILL.md 표준을 '설치·배포 레이어'로 묶은 셈(MIT·~22.6k★)"
    source: "https://github.com/vercel-labs/skills"
  - category: ai
    title: "OpenHands(All-Hands-AI) — 에이전트의 모든 행동을 'Docker 샌드박스'에서 돌리는 오픈소스 코딩 에이전트(MIT·~77k★)"
    summary: >
      OpenHands(옛 OpenDevin)는 코드를 짜고 수정할 뿐 아니라 명령 실행·웹 브라우징·API 호출까지 사람 개발자처럼 하는
      오픈소스 자율 코딩 에이전트다. 핵심 차별점은 에이전트의 모든 행동을 격리된 Docker 런타임(샌드박스)에서 실행한다는 점 —
      로컬 환경을 직접 건드리지 않고 컨테이너 안에서 셸·파일 편집·브라우저를 돌린다. CLI·웹 GUI·Cloud·Agent SDK 등 여러 형태로 쓰며
      특정 모델에 묶이지 않고 다양한 LLM 공급자를 붙일 수 있다. 라이선스는 MIT(단, enterprise/ 디렉터리는 별도)이며 README 기준 약 77k★다.
    points:
      - "샌드박스 우선 설계 — 에이전트의 bash 실행·파일 편집·브라우징이 격리된 Docker 컨테이너 런타임 안에서 일어나, 자율 에이전트가 호스트를 망칠 위험을 구조로 줄인다(표준 설치도 Docker 기반)"
      - "한 코어, 여러 표면 — 동일 엔진을 CLI(헤드리스 포함)·웹 GUI·OpenHands Cloud·파이썬 Software Agent SDK로 노출. 모델 비종속이라 Claude·GPT 등 원하는 LLM 공급자를 끼운다"
      - "SWE-bench Verified 상위권을 '주장' — 공식은 77.6% 해결(검증된 리더보드 수치라기보다 프로젝트 측 주장으로 받아들일 것). 라이선스 MIT·~77k★, '87% 버그 티켓 당일 해결' 류 마케팅 수치는 검증 안 됨"
    source: "https://github.com/All-Hands-AI/OpenHands"
  - category: ai
    title: "Cursor Bugbot — 'AI가 짠 코드'를 PR 단계에서 잡으려고 만든 전용 코드리뷰 봇(GitHub·GitLab)"
    summary: >
      Bugbot은 Cursor 팀이 만든 PR 전용 AI 코드리뷰 도구다. 새 PR이 열리면 백그라운드에서 자동으로 돌면서
      논리 버그·보안 문제를 잡아 코멘트로 달고, 변경된 줄뿐 아니라 그 변경이 기존 코드와 어떻게 충돌하는지까지 본다.
      공식 페이지는 'Bugbot이 단 플래그의 70% 이상이 머지 전에 해결된다'고 밝힌다. GitHub과 GitLab에 붙으며,
      PR 코멘트나 `bugbot run`으로 수동 트리거할 수 있고, 프런티어 모델과 자체 모델을 섞어 쓴다.
      Anthropic 공식 보안 리뷰 액션이나 Claude Code `/code-review`와 같은 '에이전트 코드리뷰 자동화' 흐름의 상용 버전 격이다.
    points:
      - "PR 자동 리뷰가 핵심 — 새 PR에 자동 작동해 버그·보안 이슈를 코멘트로 남기고, diff뿐 아니라 변경이 코드베이스의 다른 가정과 어떻게 상호작용하는지까지 검사(공식 표현: '가장 어려운 논리 버그를 낮은 오탐률로')"
      - "팀 규칙을 코드로 — `.cursor/BUGBOT.md`에 프로젝트별 코딩 표준을 적어 리뷰 기준을 맞추고, `@cursor remember`로 리뷰 중 배운 규칙을 누적시킨다. GitHub·GitLab 둘 다 지원(공식 docs 기준)"
      - "검증 가능한 수치만 — '머지 전 플래그 70%+ 해결', '발견한 버그의 절반 이상이 수정됨'은 공식 페이지 주장. '월 200만 PR 처리·8개 병렬 패스·90초 리뷰' 류는 2차 보도 수치로, 1차 출처 미확인이니 그대로 인용하지 말 것"
    source: "https://cursor.com/docs/bugbot"
  - category: ai
    title: "android/skills(Google 공식) — Android 개발 베스트프랙티스를 'SKILL.md'로 에이전트에 주입하는 공식 스킬 묶음(Apache-2.0·~5.8k★)"
    summary: >
      Google Android 팀이 직접 내는 공식 에이전트 스킬 저장소다. developer.android.com의 모범 사례를
      Agent Skills 오픈 표준(SKILL.md) 형식으로 묶어, LLM이 약한 Android 작업에서 헛짚지 않도록 '근거'를 깔아 준다.
      Expo의 expo/skills에 대응하는 네이티브 Android판 격으로, 2026-04-20 발표 뒤 빠르게 성장했고
      현재 약 5.8k★·Apache-2.0 라이선스다. CLI가 감지된 모든 에이전트에 스킬을 깔아 주며(기본값 Gemini·Antigravity),
      LLM이 이미 잘하는 영역이 아니라 '평가상 못하는 워크플로'를 골라 채우는 게 설계 방향이다.
    points:
      - "공식·검증된 정보만 — Apache-2.0, 최신 릴리스 v1.0.2(2026-06-11), Agent Skills(SKILL.md) 오픈 표준 사용. 별 수(~5.8k★)는 시점에 따라 변하는 GitHub 수치이니 '주장'으로 볼 것"
      - "실제 수록 스킬 예시 — jetpack-compose, navigation/navigation-3, performance/r8-analyzer, testing/testing-setup, system/edge-to-edge, build/agp/agp-9-upgrade, camera/camera1-to-camerax, wear/jetpack-compose-m3 등 마이그레이션·도구 워크플로 중심"
      - "설계 철학 — 'LLM이 못하는 곳을 메운다'. 이미 잘하는 영역이 아니라 평가에서 underperform하는 use case를 겨냥하고, 외부 공개 기여는 현재 받지 않는다(공식 README 기준)"
    source: "https://github.com/android/skills"
  - category: ai
    title: "Vibe Kanban(BloopAI) — Claude Code·Codex·Gemini CLI 여러 에이전트를 '칸반 보드'로 병렬 돌리는 오케스트레이션 레이어(Apache-2.0·~27k★)"
    summary: >
      여러 코딩 에이전트를 한 칸반 보드 위에서 동시에 굴리는 오픈소스 오케스트레이션 도구다.
      각 작업을 'workspace'로 띄우는데, workspace마다 별도 git 브랜치·터미널·dev 서버가 붙고
      내부적으로 git worktree로 격리돼 에이전트들이 서로의 작업을 침범하지 못한다. 그 위에서 diff 리뷰,
      앱 프리뷰, PR 생성까지 한 화면에서 한다. `npx vibe-kanban` 한 줄로 실행되고 Claude Code·Codex·Gemini CLI·Copilot·
      Amp·Cursor·OpenCode·Droid 등 10여 개 에이전트를 지원한다(공식 README 기준). 다만 README는 현재
      "Vibe Kanban is sunsetting"이라 밝혀, 오픈소스 도구의 운영 지속성을 함께 따져야 하는 사례이기도 하다.
    points:
      - "격리 모델 — workspace = 브랜치+터미널+dev서버 한 묶음, 그 토대가 git worktree. 에이전트가 main을 건드리지 않고 병렬로 돌게 만드는 게 핵심(Cursor 2.0·Conductor와 같은 worktree 계열 패턴)"
      - "도구 비종속 — 한 보드에서 Claude Code·Codex·Gemini CLI·GitHub Copilot·Amp·Cursor·OpenCode·Droid·CCR·Qwen Code 등 '10+ 코딩 에이전트'를 섞어 쓴다. Rust(~50%)+TypeScript(~46%)로 작성"
      - "지속성 주의 — README가 'Vibe Kanban is sunsetting'이라 명시하고 외부 PR도 사전 논의 없이는 받지 않는다. 별 수(~27k★)는 시점에 따라 변하는 GitHub 수치이니 '주장'으로 볼 것"
    source: "https://github.com/BloopAI/vibe-kanban"
  - category: ai
    title: "Pi(earendil-works) — '서브에이전트·플랜모드·MCP 다 빼버린' 미니멀 터미널 코딩 하네스(MIT·~63k★)"
    summary: >
      Pi는 모델에게 read·write·edit·bash 네 가지 도구만 쥐여주는 'minimal terminal coding harness'다.
      철학이 정반대다 — "Adapt pi to your workflows, not the other way around". 기능을 미리 박아 넣는 대신
      '공격적으로 확장 가능(aggressively extensible)'하게 만들어 워크플로를 도구가 강요하지 않게 한다.
      그래서 서브에이전트·플랜모드·MCP·권한 팝업·내장 투두·백그라운드 bash가 기본적으로 '없다'.
      필요하면 TypeScript 확장·Skills·프롬프트 템플릿·테마로 직접 붙이고, 이를 Pi 패키지로 묶어 npm·git으로 공유한다.
    points:
      - "안티-피처가 핵심 — README가 'No sub-agents(필요하면 tmux로 띄워라)', 'No plan mode(계획은 파일에 써라)', 'No MCP', 'No built-in to-dos(They confuse models)', 'No background bash(Use tmux)'를 대놓고 명시. 비대한 하네스의 반대 방향"
      - "확장 = 패키지 — TypeScript 확장·Skills·프롬프트 템플릿·테마를 'Pi 패키지'로 만들어 npm/git으로 공유. 실행은 interactive·print/JSON·RPC·SDK 네 모드라 헤드리스·앱 임베딩까지 커버"
      - "공급자 무관 — pi-ai가 Anthropic·OpenAI·Gemini·Bedrock·Mistral·Groq·xAI·OpenRouter·Ollama 등 한 인터페이스로 묶고 구독(Claude Pro/Max·ChatGPT·Copilot)도 지원. 단 '내장 권한 시스템이 없어' 사용자·프로세스 권한 그대로 돈다는 점은 주의. ~63k★는 시점별 GitHub 수치"
    source: "https://github.com/earendil-works/pi"
  - category: ai
    title: "토스의 'Claude Code를 레이어드 아키텍처처럼' — 팀 지식을 Global/Domain/Local 3계층 플러그인으로 굳히기"
    summary: >
      토스 기술블로그(toss.tech)는 코딩 에이전트를 '개인 생산성 도구'에서 '팀의 일하는 방식'으로 끌어올리는 패턴을 제안한다.
      핵심은 흩어진 규칙·노하우를 Claude Code 플러그인에 담되, 그 지식을 세 계층으로 나누는 것이다 —
      전사 공통(보안·코딩 스타일)은 Global, 결제·정산·회원 같은 도메인 로직은 Domain, 특정 레포의 구현 디테일은 Local.
      이렇게 계층화된 플러그인이 모이면 그 자체로 '살아있는 지식 베이스(Living Knowledge Base)'가 되고,
      나아가 조직의 워크플로(예: /new-feature)를 배포하는 사내 마켓플레이스로 확장한다는 구상이다.
    points:
      - "지식 3계층 — Global(전사 보안·코딩 스타일) / Domain(팀·비즈니스 도메인 로직) / Local(레포별 구현 디테일·프로젝트 규칙). 한 CLAUDE.md에 다 밀어넣지 말고 책임에 따라 쪼개라는 게 요지"
      - "비유의 출처 — '이전 글에서 Claude Code 구조를 레이어드 아키텍처에 비유했듯, 플러그인이 담는 지식도 계층화할 수 있다'. 코드 아키텍처 사고를 '지식 관리'에 그대로 적용"
      - "팀 스케일 — 계층화된 플러그인 묶음 = Living Knowledge Base → 워크플로를 배포하는 '마켓플레이스 1.0'으로 확장. 개인 팁이 아니라 조직 차원 표준화가 목표 (toss.tech 자체 글, 수치 주장 없음)"
    source: "https://toss.tech/article/harness-for-team-productivity"
  - category: ai
    title: "Terminal-Bench 2.0 — '코드 파일'이 아니라 '리눅스 셸 전체'를 문제로 주는 차세대 에이전트 벤치마크(Stanford×Laude·89태스크)"
    summary: >
      Terminal-Bench는 스탠퍼드와 Laude Institute가 만든, 코딩 에이전트를 '실제 터미널 환경'에서 평가하는 벤치마크다.
      SWE-bench가 레포/폴더라는 명확한 경계 안에서 코드를 고치게 한다면, Terminal-Bench는 환경 전체가 문제 공간이다 —
      소스에서 리눅스 커널을 컴파일하거나, 서버를 맨바닥부터 배포하거나, 모델을 학습시키는 식의 end-to-end 시스템 작업을 시킨다.
      각 태스크는 자연어 지시 + Docker 컨테이너 + 검증 테스트 + 정답 예시 + 제한시간으로 구성되고, 성공 여부는 출력 유사도가 아니라 자동 테스트로만 판정한다.
      2.0은 사람이 직접 만들고 검증한 89개 하드 태스크로 추려, 'GUI·단축경로 없이 Bash만으로' 풀게 한다.
    points:
      - "환경 전체가 문제 — SWE-bench는 레포 경계 안 코드 수정이지만, Terminal-Bench는 시스템 탐색·의존성 관리·셸 명령으로 '돌아가는 시스템'을 만들어내야 통과. 예: linux-6.9 커널 소스 빌드, OpenSSL 자체서명 인증서 생성"
      - "Harbor 하네스로 표준 실행 — 태스크는 Harbor 포맷으로 기술되고 tb CLI로 돌린다. Claude Code·Codex CLI·OpenHands·mini-SWE-agent 같은 인기 에이전트를 그대로 붙일 수 있고, 모델 비교용 중립 스캐폴드 Terminus 2도 제공(Apache-2.0)"
      - "큐레이션이 핵심 — 2.0은 커뮤니티가 낸 229개 중 리뷰어 3명이 검수해 89개만 채택, 태스크당 약 3 reviewer-hour 투입. 'Hello World 디버깅' 같은 학술적이지만 경제적 가치 낮은 문제는 제거해 '엔지니어가 실제로 돈 받고 하는 일'에 맞춤"
    source: "https://www.tbench.ai/"
  - category: ai
    title: "Ruflo(전 claude-flow) — Claude Code 위에 'queen 에이전트가 worker 떼를 지휘하는' 멀티에이전트 스웜 하네스(MIT·~59.8k★)"
    summary: >
      Reuven Cohen(ruvnet)이 만든 오픈소스 멀티에이전트 오케스트레이션 레이어로, 2026년 초
      'claude-flow'에서 'Ruflo'로 개명했다(README 기준 ~59.8k★, MIT). 핵심 구조는 queen 에이전트가
      계획·위임하고 다수 worker 에이전트가 병렬 실행하는 hierarchical 스웜이며, mesh·ring·star 등
      토폴로지와 합의 프로토콜을 지원한다. Claude뿐 아니라 GPT·Gemini·Cohere·Ollama로 라우팅되는
      모델 비종속 하네스이고, npm 패키지는 ruflo(구 claude-flow 이름도 호환 유지)로 깐다.
      단, 성능·도구 수치는 프로젝트 자체 주장이며 한 외부 감사는 '주장된 MCP 도구 다수가 실제로는 동작 안 한다'고
      지적했으니 수치는 그대로 믿지 말고 검증해서 쓰는 게 안전하다.
    points:
      - "구조 — queen-led hierarchical 스웜: 한 에이전트가 작업을 쪼개 위임하고 worker들이 병렬 처리, SQLite/임베딩 기반 메모리로 세션 간 컨텍스트를 유지한다고 README가 설명. 100+ 에이전트·다수 플러그인·MCP 도구를 묶어 제공한다고 주장"
      - "모델 비종속 — 이름이 'Claude만'을 함의해 Ruflo로 개명. Claude·GPT·Gemini·Cohere·Ollama를 smart routing으로 갈아끼우며, npx ruflo / npx claude-flow 둘 다 같은 도구를 호출(하위호환)"
      - "수치는 '주장'으로 — 속도·비용 절감·SWE 점수 등은 프로젝트 자체 벤치 주장이고, 2026년 한 독립 감사는 '광고된 MCP 도구·비용절감 수치가 실측과 어긋난다'고 반박. 도입 전 자기 환경에서 직접 측정 권장"
    source: "https://github.com/ruvnet/claude-flow"
  - category: ai
    title: "Crush(Charm/charmbracelet) — Go로 짠 '예쁜 터미널' 코딩 에이전트, 세션 중에 LLM을 갈아끼우는 모델 비종속 TUI(~25.4k★)"
    summary: >
      TUI 라이브러리로 유명한 Charm(charmbracelet)이 만든 터미널 기반 코딩 에이전트로,
      Go로 작성됐고 README 기준 ~25.4k★·라이선스는 FSL-1.1-MIT다. 다른 터미널 에이전트들과 묶이는
      범주(OpenCode·goose·Aider 부류)지만 차별점은 'Charm다운' 글래머러스한 TUI와 모델 비종속성이다.
      Anthropic·OpenAI·Groq·OpenRouter 등 다수 공급자를 지원하고 OpenAI/Anthropic 호환 엔드포인트면
      뭐든 붙으며, 한 세션 안에서 LLM을 바꿔 끼울 수 있다. 프로젝트별로 컨텍스트가 분리되는 세션 기반이고,
      MCP를 http·stdio·sse 세 전송으로 확장한다.
    points:
      - "정체성 — Charm 생태계(Bubble Tea 등 TUI 도구로 유명)가 내놓은 코딩 에이전트. Go 98%대, 라이선스 FSL-1.1-MIT, README상 ~25.4k★, macOS·Linux·Windows·BSD 계열까지 지원"
      - "모델 비종속·세션 중 전환 — Anthropic/OpenAI/Groq/OpenRouter/Vercel AI Gateway 등 여러 공급자 지원, OpenAI·Anthropic 호환이면 연결, '세션 도중 LLM 교체' 가능. 프로젝트별 컨텍스트가 나뉘는 세션 기반"
      - "설치·확장 — brew/npm(@charmland/crush)/winget/Arch/Nix/FreeBSD 등 패키지 다양, 'no configuration'으로도 동작하고 crush.json으로 설정. MCP를 http·stdio·sse로 붙여 도구 확장"
    source: "https://github.com/charmbracelet/crush"
  - category: ai
    title: "Zed 1.0 — Rust로 5년 짠 고성능 에디터가 '에이전트 호스트'로 1.0을 찍다(Atom·Tree-sitter 제작진·~85k★)"
    summary: >
      Atom·Tree-sitter를 만든 Zed Industries가 2026-04-29 에디터 Zed의 1.0을 발표했다.
      Atom 시절의 'Electron 위 JS'를 버리고 GPUI라는 렌더링 프레임워크를 Rust로 바닥부터 새로 짜,
      5년·100만 줄 넘는 코드로 GPU 가속 에디터를 만든 게 핵심이다(GitHub ~85.4k★·주로 GPL-3.0).
      코딩 에이전트 관점의 차별점은 Zed가 '에이전트를 직접 만든 게 아니라 호스트'라는 점이다 —
      자체 표준 ACP(Agent Client Protocol)로 Claude Code·Codex·Gemini CLI·goose 같은 외부 에이전트를
      에디터 안에서 네이티브로 돌리고, Agent Panel에서 여러 에이전트를 병렬로 띄운다.
      즉 '터미널 에이전트 vs IDE'가 아니라, 빠른 에디터를 에이전트들의 공용 작업대로 쓰는 방향이다.
    points:
      - "정체성 — Nathan Sobo(전 Atom 공동제작) 팀의 Zed Industries 작품. 2026-04-29 1.0, Rust 97%대·GPUI를 Rust로 자작, mac·Windows·Linux, GitHub ~85.4k★·라이선스 주로 GPL-3.0"
      - "에이전트 호스트 모델 — 자체 에이전트를 강제하지 않고 ACP로 Claude Code·Codex·Gemini CLI·OpenCode·goose·Cline 등 외부 에이전트를 에디터에 붙여 씀. JetBrains도 ACP 채택, 양사 공동 에이전트 레지스트리"
      - "병렬 에이전트 — Agent Panel에서 여러 에이전트를 한 창에서 동시에 실행(Parallel Agents). 코드 검색·파일 편집·터미널 실행 같은 내장 툴을 에이전트가 호출하는 agentic editing 지원"
    source: "https://zed.dev/blog/zed-1-0"

  - category: ai
    title: "Mastra(전 Gatsby 팀) — '에이전트·워크플로·RAG'를 한 묶음으로 주는 TypeScript-네이티브 AI 프레임워크(Apache-2.0·~25k★)"
    summary: >
      Mastra는 Gatsby를 만든 팀(YC W25)이 내놓은 TypeScript 전용 AI 애플리케이션·에이전트 프레임워크다.
      코딩 에이전트 자체가 아니라 '에이전트를 만드는 토대'로, 자율 에이전트·다단계 워크플로·RAG·툴 호출을
      한 패키지에서 다룬다. 40여 개 모델 공급자(OpenAI·Anthropic·Gemini 등)에 붙는 모델 라우팅,
      `.then()`·`.branch()`·`.parallel()`로 짜는 워크플로, human-in-the-loop, 내장 관측성(observability)을 제공한다.
      Python 중심의 LangChain·Deep Agents 계열과 달리 JS/TS 생태계에서 프로토타입→프로덕션을 노린 점이 차별점이다.
    points:
      - "TypeScript-네이티브 — Python이 아닌 JS/TS 풀스택에서 에이전트·RAG·워크플로를 짤 수 있게 한 프레임워크. Apache-2.0 오픈소스, GitHub ~25k★(시점에 따라 변동)"
      - "구성요소 — 자율 Agents, .then()/.branch()/.parallel() 기반 Workflows, RAG 데이터 검색, Tools 호출, human-in-the-loop, 내장 observability"
      - "모델 비종속 — 40+ 공급자(OpenAI·Anthropic·Gemini 등) 모델 라우팅. Gatsby 제작팀이 만들고 YC W25 출신이라는 점은 프로젝트 측 소개"
    source: "https://github.com/mastra-ai/mastra"
  - category: ai
    title: "'Coding Beyond Your Training'(arXiv 2026) — Claude Code 도입이 개발자의 '쓰는 언어·레포 폭'을 넓힌다는 5,838명 패널 연구"
    summary: >
      이코노미스트 Alexander Quispe가 2026년 5월 arXiv에 올린 워킹페이퍼로, AI 코딩 어시스턴트 도입이
      개발자 개인의 '기술적 프런티어'(다루는 언어·레포·커밋량)를 넓히는지를 GitHub 데이터로 추정한다.
      2025-05~2026-01 사이 Claude Code가 GitHub에 퍼진 staggered rollout을 활용해, 개발자 5,838명을 28개월간
      월 단위로 추적했다. '첫 Claude 공동저자(Co-authored) 커밋' 시점을 도입 기준으로 잡고, 아직 도입 안 한
      개발자를 대조군으로 쓰는 staggered DiD 방식이다. 도입 후 월 커밋 +41개, 기여 레포 +1.5개, 사용 언어 수 +0.83,
      신규 언어 +0.31 등 '양'과 '다양성'이 모두 늘었다고 보고한다.
    points:
      - "데이터 — 개발자 5,838명을 28개월 월 단위 패널로 추적, 처치는 '첫 Claude-co-authored 커밋' 시점으로 정의, not-yet-treated를 대조군으로 쓰는 staggered DiD"
      - "효과(추정치) — 월 커밋 +41, 기여 레포 +1.5, 사용 언어 +0.83, 신규 언어 +0.31. '많이 짠다'를 넘어 '안 쓰던 언어·레포로 폭이 넓어진다'가 핵심"
      - "한계 — 단독 저자 워킹페이퍼(미동료심사)이고 관측 데이터 기반 인과 추정이라 '도입이 원인'이라 단정 말 것. 실무 함의는 '에이전트가 개발자의 기술 반경을 넓힌다'는 가설 정도로"
    source: "https://arxiv.org/abs/2605.25438"
  - category: ai
    title: "superpowers(obra) — 'TDD·브레인스토밍·서브에이전트 리뷰'를 스킬로 강제하는 에이전트 방법론 프레임워크(MIT·~22.9만★)"
    summary: >
      Jesse Vincent(obra)이 만든 '에이전트 스킬 프레임워크이자 소프트웨어 개발 방법론'으로, 깔아두면
      코딩 에이전트가 작업을 시작할 때 자동으로 트리거되는 스킬 묶음을 준다. 핵심은 도구가 아니라 '강제되는 워크플로'다.
      에이전트는 먼저 목표를 캐묻고(brainstorming), 스펙·구현 계획을 만든 뒤, 작업마다 새 서브에이전트를 띄워
      '스펙 준수 → 코드 품질' 2단계 리뷰를 거치며 자율적으로 진행한다. TDD 스킬은 RED-GREEN-REFACTOR를 강제하고
      '테스트 전에 짠 코드는 삭제'한다고까지 명시한다. 특정 도구에 묶이지 않고 Claude Code·Codex·Gemini CLI·
      Factory Droid·OpenCode·Pi 등에 각각 설치해 쓴다. GitHub API 기준 ~229.8k★·MIT, 최신 v6.0.0(2026-06-16).
    points:
      - "강제되는 워크플로 — brainstorming(목표 캐묻고 대안 탐색→스펙), writing-plans, test-driven-development(RED-GREEN-REFACTOR 강제·테스트 전 코드는 삭제), systematic-debugging, requesting/receiving-code-review가 자동 트리거"
      - "서브에이전트 주도 개발 — 작업마다 '새 서브에이전트'를 띄워 '스펙 준수 검토 → 코드 품질 검토' 2단계로 리뷰. 작성 패스와 리뷰 패스를 같은 컨텍스트에서 섞지 않는 게 설계 핵심"
      - "도구 비종속 — Claude Code(/plugin install superpowers@claude-plugins-official)·Codex·Gemini(gemini extensions install)·Antigravity·Factory Droid·OpenCode·Pi 등 하네스별로 따로 설치. 사용자 지시가 항상 스킬보다 우선(CLAUDE.md가 'TDD 쓰지마'면 그게 이긴다)"
    source: "https://github.com/obra/superpowers"
  - category: ai
    title: "claude-code-router(musistudio) — Claude Code 요청을 가로채 '작업 종류별로' 다른·싼 모델로 흘려보내는 라우팅 프록시(MIT)"
    summary: >
      Claude Code를 Anthropic 모델에만 묶지 않고, 로컬 프록시를 끼워 요청을 다른 공급자/모델로
      라우팅하는 오픈소스 도구다. Anthropic ↔ OpenAI 포맷을 변환해주기 때문에 OpenRouter·DeepSeek·
      Ollama·Gemini 등 OpenAI 호환 API면 Claude Code 인터페이스 그대로 붙는다. 핵심은 '한 모델로 다 처리'가
      아니라 작업 성격에 따라 모델을 갈아끼우는 라우팅 규칙이다 — 기본 모델 외에 background(가벼운 백그라운드 작업),
      think(추론), longContext(긴 컨텍스트)처럼 라우터를 나눠, 백그라운드성 작업은 더 싸거나 로컬인 모델로
      흘려보내 비용 천장을 거는 식이다. 세션 중 /model로 즉시 전환할 수도 있다. MIT 라이선스이며 Anthropic
      공식 도구가 아닌 서드파티 프록시다.
    points:
      - "동작 방식 — Claude Code와 모델 사이에 로컬 프록시를 두고 Anthropic↔OpenAI 포맷을 번역. OpenRouter·DeepSeek·Ollama·Gemini 등 OpenAI 호환 API면 무엇이든 백엔드로 붙는다"
      - "작업별 라우팅(비용 최적화 핵심) — default 외에 background·think·longContext 등 라우터를 나눠, 가벼운 백그라운드 작업은 싸거나 로컬인 모델로 보내고 무거운 추론만 비싼 모델에 맡기는 식으로 천장을 건다. /model로 세션 중 즉시 전환도 가능"
      - "주의 — 비공식 서드파티 프록시(MIT). 라우팅 대상에 비(非)Anthropic·로컬 모델을 섞을 수 있다는 게 장점이자, 모델별 출력 품질·포맷 호환은 사용자가 검증해야 한다는 뜻"
    source: "https://github.com/musistudio/claude-code-router"
  - category: ai
    title: "Aider 'architect/editor 모드' — '추론 잘하는 비싼 모델'이 짜고 '편집 잘하는 싼 모델'이 받아쓰게 둘로 나누기"
    summary: >
      Aider의 architect 모드는 한 모델에게 '해결책 제안'과 '정확한 파일 편집 지시'를 둘 다 시키지 않고,
      이 둘을 두 모델로 분리하는 워크플로다. 먼저 메인 모델(architect)에게 "이 코딩 요청을 어떻게 풀지 제안"하게 하고,
      그 제안을 editor 모델에게 넘겨 "구체적인 파일 편집 지시로 바꾸"게 한다. Aider 공식 설명은 LLM이 해결책 제안과
      세밀한 편집 명세를 동시에 잘하지는 못하므로, editor 모델과 짝지으면 단일 code 모드보다 더 나은 결과를 낼 수
      있다고 본다. /architect로 켜며, 비싼 추론 모델은 설계에만 쓰고 편집은 싸거나 빠른 모델에 맡길 수 있어 비용
      최적화 패턴으로도 통한다. (Apache-2.0, Aider 공식 문서)
    points:
      - "동작 — 요청을 architect 모델에 보내 해결책을 제안받고, 그 제안을 editor 모델에 넘겨 실제 파일 편집 지시로 변환. /architect 명령으로 모드를 켜고, architect·editor 모델을 따로 지정"
      - "왜 나누나 — Aider는 'LLM이 제안과 정밀 편집을 동시에 잘 못한다'는 관찰을 근거로, 역할 분리가 단일 code 모드보다 나을 수 있다고 본다. 추론은 비싼 모델, 받아쓰기는 싼·빠른 모델로 돌려 비용 천장을 거는 데도 쓰인다"
      - "주장(검증된 수치, 단 구버전) — Aider 자체 code editing 벤치마크에서 o1-preview(architect)+o1-mini/deepseek(editor)가 85.0%로 당시 SOTA, o1-preview 단독(79.7%)보다 높았다. 다만 2024년·구모델 기준이고 그 SOTA 조합은 'whole' 포맷이라 느려 인터랙티브엔 비실용적이라고 Aider가 직접 단서를 단다"
    source: "https://aider.chat/docs/usage/modes.html"
  - category: ai
    title: "ast-grep — 에이전트의 '찾아 바꾸기'를 텍스트가 아니라 '문법 트리(AST)'로 시키는 구조적 검색·치환 도구(Rust·MIT·~14.5k★)"
    summary: >
      ast-grep(명령어 sg)는 코드를 문자열이 아니라 tree-sitter로 파싱한 AST로 보고, '패턴 매칭'으로
      검색·린트·치환을 하는 Rust CLI다. 패턴은 평범한 코드처럼 쓰되 $MATCH 같은 '$+대문자' 와일드카드로
      임의의 AST 노드 하나를 잡는다. 텍스트 정규식과 달리 언어 문법을 알기 때문에, 함수 호출·인자 구조 같은
      '의미 단위'를 정확히 잡아 대규모로 바꿀 수 있다. 그래서 LLM 에이전트가 'sed로 막 치환하다 줄 어긋나는'
      실수 없이 코드를 안전하게 일괄 수정하게 하는 도구로 쓰인다(공식 agent-skill 저장소도 운영). 멀티코어를
      쓰고 CLI로도 라이브러리로도 동작한다. (MIT, GitHub 기준)
    points:
      - "무엇 — tree-sitter 기반 AST 패턴 매칭 CLI. 패턴을 코드처럼 쓰고 $MATCH/$$$ 같은 와일드카드로 노드를 잡아 search·lint·rewrite. YAML로 린트 규칙도 정의. 멀티코어 활용·jQuery식 AST 순회 API 제공"
      - "왜 에이전트에 좋나 — 정규식/sed는 '텍스트'만 보니 들여쓰기·괄호·동일 이름 변수에서 오작동하기 쉽지만, ast-grep은 언어 문법을 알아 '구조 단위'로 정확히 치환한다. LLM이 대규모 리팩터를 줄 어긋남 없이 시키는 데 적합(ast-grep 공식 agent-skill 저장소 존재)"
      - "한계(공식 명시) — 타입·제어흐름·데이터흐름·테인트 분석 같은 깊은 의미 정보는 없다(그쪽은 Semgrep 영역). 즉 '구문은 정확하지만 의미 추론은 못 한다'. 보안 룰셋이 필요하면 ast-grep만으론 부족"
    source: "https://github.com/ast-grep/ast-grep"

  - category: ai
    title: "컨텍스트 엔지니어링(Anthropic 공식) — '프롬프트 한 줄' 말고 '에이전트가 매 턴 보는 전체 토큰'을 설계하는 법"
    summary: >
      Anthropic 응용AI팀이 2025-09-29에 낸 엔지니어링 글로, 프롬프트 엔지니어링의 다음 단계를
      '컨텍스트 엔지니어링'으로 규정한다. 프롬프트가 '잘 쓴 한 번의 지시'라면, 컨텍스트 엔지니어링은
      추론 매 순간 컨텍스트 창에 무엇을 넣을지 '큐레이션'하는 일이다. 핵심 원칙은 "원하는 결과가 나올
      확률을 최대화하는, 가장 작은 고신호(high-signal) 토큰 집합"을 찾는 것 — LLM의 '주의 예산(attention
      budget)'은 유한하고, 토큰이 많아질수록 성능이 떨어지는 'context rot'이 생기기 때문이다. 길게 돌아가는
      에이전트를 위해 compaction(대화 압축)·note-taking(외부 메모)·멀티에이전트(서브에이전트가 요약만
      반환)·just-in-time 검색을 작업 유형별로 골라 쓰라고 권한다. (Anthropic 엔지니어링 블로그 기준)
    points:
      - "정의 — 프롬프트 엔지니어링은 '한 번의 지시를 잘 쓰기', 컨텍스트 엔지니어링은 '에이전트가 매 턴 보는 컨텍스트 창 전체(시스템 프롬프트·도구 결과·히스토리·검색물)를 매 순간 큐레이션'하기. 시스템 프롬프트는 하드코딩 로직과 모호한 지침 사이 'right altitude(적정 고도)'를 노려라"
      - "핵심 원칙 — '주의 예산'은 유한하고 토큰이 늘면 'context rot'으로 성능이 떨어진다. 그래서 목표는 '원하는 결과 확률을 최대화하는 가장 작은 고신호 토큰 집합'. 데이터는 미리 다 채우지 말고 lightweight identifier(파일경로 등)만 들고 런타임에 끌어오는 just-in-time 방식"
      - "긴 작업용 3패턴 — ① compaction: 왕복 대화는 요약해 다시 채운다 ② note-taking: 마일스톤형 작업은 외부 메모로 기억 ③ 멀티에이전트: 서브에이전트가 수만 토큰을 쓰되 메인엔 1,000~2,000토큰 요약만 반환하고 리드가 종합. 작업 성격에 맞춰 골라 써라"
    source: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"

  - category: ai
    title: "Roo Code의 '코드베이스 인덱싱' — 'grep만 쓰는' 에이전트 시대에 굳이 벡터DB(Qdrant)로 의미 검색을 거는 선택(Apache-2.0·~24.2k★)"
    summary: >
      요즘 Claude Code·Cursor류 에이전트가 벡터DB를 안 띄우고 grep·파일트리·find으로 코드를 찾는
      쪽으로 기울었지만, VS Code용 오픈소스 에이전트 Roo Code(Cline 포크)는 여전히 '코드베이스 인덱싱'으로
      의미 기반(semantic) 검색을 건다. 동작은 ① tree-sitter로 코드를 함수·클래스 같은 의미 블록(100~1000자)으로
      쪼개고 ② 임베딩을 떠서 ③ Qdrant 벡터DB에 저장한 뒤, 에이전트에게 codebase_search 도구를 쥐여 준다.
      그러면 "사용자 인증은 어디서 처리하나" 같은 자연어 질의로 정확한 텍스트 일치가 아니라 '의미'로 코드를 찾는다.
      대형·비공개·낯선 레포에서 grep으로 키워드를 모를 때 유리하다는 게 이 방식의 포지션이다. (GitHub·공식 문서 기준)
    points:
      - "동작 3단계 — tree-sitter로 의미 블록(100~1000자, 미지원 언어는 줄 단위 폴백) 분할 → 임베딩 → Qdrant 벡터DB 저장. 에이전트엔 codebase_search 도구로 노출돼, 텍스트 일치 아닌 '의미'로 관련 코드를 찾게 한다"
      - "임베딩은 8종 선택 — OpenAI·Google Gemini·Ollama·OpenAI Compatible·Mistral·Vercel AI Gateway·Bedrock·OpenRouter. 공식 문서는 '현재 무료'인 Gemini를 권하고, Ollama로는 완전 로컬 임베딩도 가능. Qdrant는 클라우드나 Docker 로컬로 띄운다"
      - "왜 지금 논쟁거리냐 — 다수 프런티어 에이전트(Claude Code·Cursor류)는 벡터RAG 대신 grep/파일트리로 회귀했다는 평가가 많다. Roo Code는 반대로 '키워드를 모르는 대형·비공개 레포'에선 의미 검색이 낫다는 쪽. tree-sitter 기반이라 코드를 '문법 단위'로 잘라 인덱싱한다"
    source: "https://roocodeinc.github.io/Roo-Code/features/codebase-indexing"

  - category: ai
    title: "Cline — VS Code 안에서 'Plan→Act'로 끊어 가는 오픈소스 코딩 에이전트(Apache-2.0·~63k★)"
    summary: >
      Cline은 VS Code·JetBrains 확장이자 CLI/SDK로 동작하는 오픈소스 코딩 에이전트다(라이선스 Apache-2.0,
      GitHub ~63.4k★). 마켓플레이스 ID가 saoudrizwan.claude-dev인 데서 보이듯 초기엔 'Claude Dev'로 출발했고,
      특정 모델에 묶이지 않는 BYOK 멀티프로바이더가 핵심이다. 가장 큰 특징은 'Plan/Act' 2모드 — Plan에서 코드베이스를
      훑고 질문하며 전략을 세운 뒤 Act로 전환해 실행하고, 모든 편집·명령은 기본적으로 사람 승인을 거친다(auto-approve로 풀 수 있음).
    points:
