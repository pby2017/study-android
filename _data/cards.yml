  - category: ai
    title: "ADK for Android 0.1.0 — 앱 안에서 온디바이스·클라우드 에이전트를 조율"
    summary: >
      Google은 2026년 5월 ADK for Kotlin과 함께 ADK for Android 0.1.0을 공개했다. Android용 ADK는
      앱 내부에서 AI 에이전트를 만들고, Gemini Nano 같은 온디바이스 모델과 클라우드 모델을 함께 쓰는
      하이브리드 오케스트레이션을 목표로 한다. 예시 흐름은 클라우드 orchestrator가 사용자 문제를 이해하고,
      예약 확인처럼 민감한 로컬 문서 접근이 필요한 작업은 온디바이스 subagent에 위임하는 방식이다.
      개발자는 `com.google.adk:google-adk-kotlin-core-android:0.1.0` 의존성으로 시작하며, 핵심은
      에이전트가 모든 데이터를 클라우드로 보내지 않도록 역할과 데이터 경계를 먼저 나누는 것이다.
    points:
