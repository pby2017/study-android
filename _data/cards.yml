  title: Project KARL — Kotlin 온디바이스 적응형 AI 라이브러리, 데이터가 디바이스를 절대 안 떠나는 프라이버시 우선(Apache-2.0)
  summary: 'Project KARL은 프라이버시 우선 온디바이스 적응형 AI를 위한 Kotlin 라이브러리다. 모든 학습과 추론이 사용자 디바이스에서만 실행되어 데이터가 절대 외부로 전송되지 않는다(Zero Data Egress). 조합 가능한 컨테이너(Composable Container) 아키텍처로 AI 상태와 로직을 정의된 경계 내에서 관리. 사용자 행동에서 직접 학습해 키보드·생산성·건강·습관 앱 등의 개인화를 구현. Apache-2.0 라이선스.

    '
  points:
  - 'Zero Data Egress: 모든 학습·추론이 디바이스에서만 실행'
  - 'Composable Container: AI 상태·로직을 정의된 경계 내 관리'
  - '온디바이스 적응: 사용자 행동에서 직접 학습, 서버 불필요'
  source: https://github.com/theaniketraj/project-karl
