  title: Prefect + AI — Python 네이티브 durable execution, Pydantic AI 에이전트 상태 복구
  summary: Prefect는 YAML DAG 대신 Python control flow(while·분기·휴먼 승인)를 그대로 따르는 워크플로 오케스트레이터(v3.3·Apache-2.0·~22k★). LLM 에이전트는 rate limit·크래시에서 상태가 유실되는데, PrefectAgent(Pydantic AI 공식 통합)가 LLM 호출·tool call을 task로 기록해 실패 시 완료 task는 캐시에서 skip·실패 지점부터 재개 — redundant LLM API call 방지. Temporal(CQRS durable execution)과 달리 Python 데코레이터(@flow/@task) 한 줄·self-host server·에이전트 state machine(while loop·runtime branching) 네이티브. 2026 AI Teams 솔루션 — Horizon(MCP context serving)과 조합.
  points:
  - PrefectAgent — Pydantic AI agent를 flow/task로 wrap, 실패 시 LLM 재호출 없이 재개
  - Python control flow 네이티브 — precompiled DAG 없이 while·분기·human-in-the-loop
  - Temporal(인프라)과 역할 분리 — Python ML·데이터 팀 친화적 워크플로·에이전트 오케스트레이션
