      Jetpack 라이브러리다. 개발자는 Kotlin 함수에 @AppFunction을 붙여 '노트 생성', '쇼핑리스트 추가' 같은
      작업을 선언하고, OS 레지스트리가 이를 인덱싱한다. 호출자는 EXECUTE_APP_FUNCTIONS 권한으로 기능을
      발견·실행한다. 2026년 5월 기준 Gemini 통합은 trusted tester private preview이고, 기능 자체는
      Android 16 이상에서 실험적 preview다. 지금의 학습 포인트는 UI 버튼이 아니라 에이전트가 호출할
      안정적인 앱 작업 경계를 설계하는 것이다.
    points:
      - "@AppFunction으로 앱 작업을 선언하고 OS가 스키마를 인덱싱"
      - "Android 16+ 실험적 preview, Gemini 통합은 private preview"
      - "서버 MCP가 아니라 앱 상태를 직접 쓰는 온디바이스 도구 모델"
    source: "https://developer.android.com/ai/appfunctions"

