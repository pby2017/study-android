- category: ai
  title: Argilla — LLM 파인튜닝용 데이터를 사람이 검수·큐레이션하는 오픈소스 플랫폼(Apache-2.0·HuggingFace)
  summary: 'Argilla는 AI 엔지니어와 도메인 전문가가 함께 쓰는 데이터 협업 도구로, LLM 파인튜닝·평가에 필요한 instruction·preference 데이터를 검수·라벨링·큐레이션하게 해준다. Dataset·Record·Question·Workspace 중심으로 피드백 형태를 설계하고, suggestions·filters·semantic search로 annotator 작업을 돕는다. distilabel과 붙이면 합성 데이터 생성 → Argilla에서 사람 검수 흐름을 만들 수 있고, Hugging Face Hub나 Docker로 바로 배포해 데이터 소유권을 유지한 채 반복 개선하기 좋다.

    '
  points:
  - 'LLM/RAG/pref-tuning용 피드백 데이터에 맞춘 협업 라벨링'
  - 'Dataset·Record·Question·Workspace + suggestions·semantic search'
  - 'distilabel로 합성 데이터 생성 → 사람 검수 파이프라인'
  source: https://github.com/argilla-io/argilla
- category: ai
  title: Plandex — AI가 만든 변경을 '리뷰 샌드박스'에 격리해 승인 전까지 실제 파일과 분리하는 터미널 코딩 에이전트
  summary: 'Plandex는 큰 코드베이스와 여러 단계의 작업을 다루도록 만든 터미널형 AI 코딩 에이전트다. 핵심은 AI가 만든 변경을 바로 실제 파일에 쓰지 않고 버전 관리되는 누적 diff 리뷰 샌드박스에 먼저 쌓아 두었다가, 검토가 끝난 뒤에만 적용하게 하는 점이다. 공식 문서는 직접 컨텍스트 최대 2M 토큰과 tree-sitter 프로젝트 맵으로 20M 토큰 이상을 인덱싱할 수 있다고 설명하고, self-hosted에서는 custom models/providers/model packs를 모두 지원하며 cloud에서는 BYO API keys 또는 integrated models 조합을 안내한다. 이 흐름 위에 command execution 제어와 git 연동을 얹어 대규모 수정을 안정적으로 돌리게 만든다.

    '
  points:
  - 태그라인 'Open source AI coding agent. Designed for large projects and real world tasks' · MIT · GitHub 15.5k★
  - 변경은 version-controlled cumulative diff sandbox에 먼저 쌓이고, 검토 후 적용
  - 직접 컨텍스트 최대 2M 토큰, tree-sitter 프로젝트 맵으로 20M+ 토큰 인덱싱
  - self-hosted는 custom models/providers/model packs를 모두 지원, cloud는 BYO API keys 또는 integrated models 지원
  - command execution 제어와 git 연동으로 롤백·디버깅을 쉽게 유지
  - 모델 비종속(Anthropic·OpenAI·Google·오픈소스 provider들)
  source: https://github.com/plandex-ai/plandex
- category: ai
  title: SWE-agent — GitHub 이슈를 직접 고치는 ACI 연구용 에이전트
  summary: 'SWE-agent는 GitHub 이슈를 받아 LM이 저장소를 살피고 명령을 실행해 버그 수정을 시도하는 연구용 코딩 에이전트다. 연구의 초점은 모델만이 아니라 저장소 탐색·파일 보기·편집·실행을 LM에 맞게 묶은 Agent-Computer Interface(ACI)에 있다. 공식 문서는 현재 후속 mini-SWE-agent로 안내하며 SWE-agent를 maintenance-only로 분류한다. 따라서 새 도구를 고르기보다 ACI 설계와 이슈 해결 에이전트의 실험 역사를 읽을 때 유용하다.

    '
  points:
  - 태그라인은 GitHub 이슈를 원하는 LM으로 자동 수정 시도한다고 설명 · MIT · GitHub 20,835★(2026-11-22 확인)
  - 핵심: ACI(Agent-Computer Interface) — LM-centric commands와 feedback으로 browse·view·edit·execute를 묶는 설계
  - 현재 docs는 mini-swe-agent를 새 권장안으로 안내하고, SWE-agent는 maintenance-only mode로 둔다
  - 공식 아키텍처 문서는 SWE-ReX 환경, YAML 설정 Agent, ACI 도구, history processor, action parser의 연결을 설명한다
  - 연구용 원조 설계를 읽는 기준점으로는 유효하지만, 새 프로젝트 시작점은 mini-swe-agent가 더 맞다
  source: https://github.com/SWE-agent/SWE-agent
- category: ai
  level: "중급"
  title: llama.cpp + GGUF — 모델 변환과 양자화 순서
  summary: 'llama.cpp에서 모델을 준비하는 기본 순서는 원본 모델을 GGUF로 변환한 뒤 양자화하는 것이다. 양자화는 가중치 정밀도를 낮춰 파일 크기를 줄이고 추론을 빠르게 할 수 있지만, 품질이 떨어질 수 있다. Q4_K_M은 공식 문서의 예시이지 모든 모델·기기의 정답은 아니다. imatrix는 양자화 중 품질 손실을 줄이는 데 쓸 수 있으며, 최종 선택은 목표 기기와 실제 작업에서 비교해야 한다.'
  points:
  - '순서: 원본 모델 → GGUF 변환 → 양자화; 이미 낮은 비트인 모델의 재양자화는 피한다'
  - '양자화는 크기·속도와 품질 사이의 선택; imatrix는 손실을 줄이는 보조 수단'
  - 'Q4_K_M은 예시일 뿐; 실제 모델·기기·작업에서 품질과 지연 시간을 비교한다'
  source: https://github.com/ggml-org/llama.cpp/blob/master/tools/quantize/README.md
  interview: "왜 이미 양자화된 모델을 다시 낮은 비트로 양자화하는 것을 피해야 하나요?"
  answer: "재양자화는 원래의 고정밀 값 대신 이미 손실이 있는 값을 다시 근사하므로 품질을 크게 낮출 수 있다. llama.cpp 문서는 16/32비트 GGUF에서 양자화를 시작하고, 필요하면 imatrix를 사용한 뒤 실제 평가로 품질을 확인하라고 안내한다."
- category: ai
  level: "고급"
  title: KnowU-Bench — Android 에뮬레이터에서 개인화·프로액티브 모바일 에이전트를 재는 벤치마크
  summary: 'KnowU-Bench는 Android 에뮬레이터에서 모바일 AI 에이전트를 평가하는 벤치마크다. 23개 앱의 192개 작업(일반 GUI 42, 개인화 86, 선제 지원 64)을 포함한다. 에이전트에는 사용자 프로필 대신 행동 기록만 제공하고, 가상 사용자와 대화해 선호를 확인하게 한다. 평가는 화면 조작뿐 아니라 선호 추론, 개입 전 동의, 거절 후 멈춤도 본다. 따라서 단순 작업 성공률만으로 개인화 에이전트의 신뢰성을 판단할 수 없다.'
  points:
  - '192개 작업·23개 앱: 일반 GUI 42, 개인화 86, 선제 지원 64'
  - '프로필 대신 행동 기록 제공; 필요하면 대화로 선호를 확인'
  - '화면 실행 + 동의 확인 + 거절 후 중단을 함께 평가'
  - '규칙 기반 검사와 LLM 평가를 결합한 재현 가능한 에뮬레이터 실험'
  source: https://zju-real.github.io/KnowU-Bench/
  interview: "모바일 개인화 에이전트를 GUI 작업 성공률만으로 평가해도 될까요?"
  answer: "부족하다. 이 벤치마크는 행동 기록에서 선호를 추론하는 능력, 불확실할 때 질문하는 능력, 선제 행동 전 동의를 구하는 능력, 거절 뒤 멈추는 능력도 평가한다. 작업을 수행했는지와 함께 언제 행동하지 않아야 하는지도 봐야 한다."
- category: ai
  level: "중급"
  title: KMP 온디바이스 AI — Llamatik의 core·sdk·sdk-agent 모듈 선택
  summary: 'Llamatik은 Kotlin Multiplatform에서 로컬 AI를 연결하는 SDK다. `core`는 llama.cpp·whisper.cpp·Stable Diffusion의 네이티브 추론 API를 제공한다. `sdk`는 채팅·모델 관리·RAG·에이전트 DSL을, `sdk-agent`는 도구 실행·권한 확인·감사 로그가 있는 앱용 런타임을 제공한다. 필요한 계층만 선택해 Maven Central에서 추가한다. Android 최소 지원은 API 26이며, 모듈별 플랫폼 지원과 모델 호환성을 확인해야 한다.'
  points:
  - '`core`: 온디바이스 추론 브리지; 채팅·RAG가 필요하면 `sdk` 추가'
  - '`sdk-agent`: 앱 도구·권한·확인·감사 흐름이 필요할 때 추가'
  - 'Android API 26 이상; 기기별 네이티브·모델 지원은 별도 확인'
  source: https://github.com/llamatik/Llamatik
  interview: "텍스트 생성만 필요한 Android 앱도 `sdk-agent`를 처음부터 추가해야 하나요?"
  answer: "아니다. 낮은 수준의 추론만 필요하면 `core`부터 시작한다. 채팅·모델 관리·RAG·에이전트 DSL은 `sdk`, 앱 도구를 권한 확인 후 실행하고 감사 로그를 남기는 기능은 `sdk-agent`가 필요할 때 추가한다."
- category: ai
  level: "고급"
  title: Qwen3-VL — 비전·언어 모델 계열과 Android 적용 시 확인할 점
  summary: 'Qwen3-VL은 이미지·영상 이해와 GUI 상호작용을 지원하는 오픈웨이트 모델 계열이다. Dense 2B·4B·8B·32B와 MoE 30B-A3B·235B-A22B 체크포인트가 있어 크기와 추론 자원이 다르다. 기본 컨텍스트는 256K이며 1M 확장은 YaRN 설정이 필요하다. OCR은 32개 언어를 지원한다. Android 앱에서 카메라·화면 이해를 시험할 수 있지만, 작은 파라미터 수만으로 기기 내 실행 가능성을 단정하지 말고 런타임·메모리·지연 시간을 실제 기기에서 확인한다.'
  points:
  - '체크포인트: Dense 2B/4B/8B/32B, MoE 30B-A3B/235B-A22B'
  - '256K 기본 컨텍스트; 1M은 YaRN 구성으로 확장'
  - '이미지·영상·GUI 이해, 32개 언어 OCR; Hugging Face·vLLM 지원'
  - 'Android 적용 전: 모델별 런타임 지원·메모리·지연 시간을 실기기에서 측정'
  source: https://github.com/QwenLM/Qwen3-VL
  interview: "Qwen3-VL에 2B 체크포인트와 256K 컨텍스트가 있으면 Android에서 바로 온디바이스 실행할 수 있나요?"
  answer: "그렇게 단정할 수 없다. 파라미터 수와 문맥 길이는 Android 런타임 호환성이나 메모리·지연 시간을 보장하지 않는다. 사용할 체크포인트와 이미지 해상도·토큰 예산을 정한 뒤 목표 기기와 추론 런타임에서 직접 측정해야 한다. 1M 문맥도 기본값이 아니라 YaRN 설정이 필요하다."
- category: ai
  level: "중급"
  title: Kokoro-82M — 경량 TTS의 품질 한계와 Android 통합 체크
  summary: 'Kokoro는 82M 파라미터의 오픈웨이트 TTS 모델이며 가중치는 Apache-2.0이다. v1.0 모델 카드에는 8개 언어와 54개 음성이 기재되어 있다. 공식 예제는 Python 추론 파이프라인과 G2P(문자를 발음 기호로 변환) 의존성을 사용한다. 음성별 학습 데이터와 언어 지원은 같지 않고, 짧거나 긴 입력에서 품질이 낮아질 수 있다. 작은 모델 크기와 라이선스만으로 Android에서 바로 실행할 수 있다고 볼 수 없다.'
  points:
  - 'v1.0: 8개 언어·54개 음성; 언어·음성별 데이터와 품질은 다름'
  - '짧은 발화(10–20 토큰 미만)와 긴 발화(400 토큰 초과)는 품질 저하 가능'
  - '공식 예제는 Python·PyTorch·espeak-ng; Android SDK로 안내하지 않음'
  - 'Android 통합 전 G2P·실행기·모델 크기·지연 시간을 실기기에서 검증'
  source: https://huggingface.co/hexgrad/Kokoro-82M
  interview: "Kokoro 가중치가 Apache-2.0이고 82M 파라미터라면 Android 오프라인 TTS에 바로 쓸 수 있나요?"
  answer: "아니다. 가중치 라이선스와 Android 추론 지원은 별개다. 공식 예제는 Python 추론 파이프라인과 G2P 의존성을 사용하므로, Android에서 쓸 실행기와 발음 변환 경로를 따로 확인해야 한다. 지원 언어별 음질, 메모리, 지연 시간도 실제 기기에서 측정한다."
- category: ai
  level: "중급"
  title: Dia2 — 대화형 TTS의 조기 생성과 실제 스트리밍을 구분하기
  summary: 'Nari Labs의 Dia2는 입력 전체를 기다리지 않고 앞부분부터 음성을 생성하는 대화형 TTS 모델이다. 공개 체크포인트는 1B·2B이며 영어 생성은 최대 2분이다. 저장소의 별도 TTS 서버는 아직 향후 항목이다. 예제는 Python 패키지 실행을 안내하고 CUDA 12.8 이상을 요구하지만, CUDA가 없으면 CPU를 자동 선택한다. 이 CPU 대체 경로도 Android 지원을 뜻하지 않는다. 저장소는 Android SDK를 안내하지 않으며, 제품 도입에는 런타임·메모리·첫 오디오 지연 검증이 필요하다.'
  points:
  - '두 화자 대본은 [S1]/[S2] 태그로 구성하고 오디오 프롬프트로 발화를 조건화할 수 있음'
  - '영어 전용; 생성 길이는 최대 2분이며 음색·품질은 실행마다 달라질 수 있음'
  - '조기 생성과 제품 수준 실시간 스트리밍 서버는 다름; 서버는 향후 항목'
  - 'Apache-2.0 외 제3자 자산의 라이선스도 확인; Android 런타임·메모리·첫 오디오 지연은 별도 검증'
  source: https://github.com/nari-labs/dia2
  interview: "Dia2가 입력 앞부분부터 음성을 만들 수 있다면, Android 앱에서 실시간 스트리밍 TTS를 바로 제공한다고 말할 수 있나요?"
  answer: "아니다. 앞부분부터 생성하는 모델 기능과 네트워크 전송·오디오 버퍼까지 이어지는 제품 수준 스트리밍은 다르다. 저장소의 TTS 서버는 향후 항목이며, CUDA가 없을 때 CPU를 선택하는 Python 경로도 Android 지원을 의미하지 않는다. Android 배포 전에는 호환 런타임, 모델 메모리, 첫 오디오 지연, 재생 버퍼, 제3자 자산 라이선스를 실기기와 제품 구성에서 확인해야 한다."
- category: ai
  level: "중급"
  title: Tabby — 팀 내부에 직접 배포하는 AI 코딩 도우미
  summary: 'Tabby는 서버를 직접 운영하고 IDE 확장과 연결하는 오픈소스 AI 코딩 도우미다. 코드 자동완성뿐 아니라 채팅·코드베이스 문맥 기능도 제공하며, 자체 API로 다른 개발 도구와 연결할 수 있다. 자체 호스팅은 데이터 흐름과 모델 배포를 직접 통제할 수 있지만, 인증·접근 권한·로그·모델 업데이트도 운영자가 책임져야 한다. 저장소는 현재 약 33.9k GitHub stars를 표시한다.'
