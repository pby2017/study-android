  title: MCP 에이전트 테스트 — mock 회귀와 live 통합 평가를 함께 설계하기
  summary: MCP 에이전트는 mock과 실제 통합 테스트를 함께 써야 한다. YAML mock으로 도구 응답·오류를 고정하면 tool 선택·인자·순서의 회귀를 빠르게 확인할 수 있다. 반면 mcp-eval은 실제 에이전트와 MCP 서버를 연결하고 OpenTelemetry trace에서 도구 호출·응답·지연·비용을 검사한다. Mock은 외부 MCP 서버 변동은 격리하지만, 테스트 에이전트가 실제 모델 API를 부르면 토큰 비용과 출력 변동은 남는다. Live 검증은 인증·네트워크·실제 구현의 통합 문제를 찾지만 실행 비용과 변동성이 더 크다.
  points:
  - Mock test — 빠르고 재현 가능한 tool-call/인자/오류 회귀 검사
  - Live integration — 실제 서버 연결과 OTEL trace로 경로·지연·비용 관찰
  - 비용 경계 — mock server와 LLM 호출은 별개; 실제 모델 호출 여부를 확인
  source: https://github.com/lastmile-ai/mcp-eval
  interview: "MCP 에이전트 테스트에서 mock과 live 통합 검증은 무엇을 각각 확인하며, 비용은 어떻게 달라지나요?"
  answer: "Mock은 고정된 도구 응답으로 tool-call 회귀를 빠르게 검사하고 외부 서버 변동을 줄인다. Live 테스트는 실제 서버의 인증·네트워크·응답까지 확인하고 trace로 지연·비용을 관찰한다. 단, mock이어도 에이전트가 실제 LLM API를 호출하면 그 호출 비용은 남는다."
