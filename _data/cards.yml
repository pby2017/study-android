- category: ai
  title: Helicone — LLM 프록시로 per-user 비용·캐시·rate limit, Helicone-User-Id 헤더(Apache-2.0)
  summary: Helicone은 LLM API 앞에 한 줄 baseURL 변경으로 끼우는 관측·비용 프록시다. Helicone-User-Id·Helicone-Session-Id·Helicone-Property-* 헤더로 사용자·세션·티어별 비용 attribution. 300+ 모델 자동 비용 계산, semantic cache(반복 요청 최대 95% 절감), request/token/dollar 기준 rate limit. 2026년 3월 Mintlify 인수 후 maintenance mode — 기존 통합은 유지되나 신규 기능 개발 중단. Langfuse(OTel trace+eval) ·Portkey(gateway routing)와 달리 "프록시 1줄→per-user FinOps"에 특화 — BurnLens·Tokonomics가 hard-cap 대안.
  points:
  - Helicone-User-Id 헤더 → per-user cost histogram, session 그룹핑
  - semantic cache + rate limit(request/token/$), 300+ 모델 pricing DB
  - 2026 Mintlify 인수→maintenance mode, hard-cap 필요 시 BurnLens 검토
  source: https://docs.helicone.ai/getting-started/quick-start
- category: ai
  title: Microsoft Presidio — PII sandwich·agent 4-boundary pipeline·APIM guardrail
  summary: 'Presidio는 Microsoft 오픈소스 PII 탐지·익명화 프레임워크다. Analyzer(NER+regex+checksum+다국어) → Anonymizer(replace/mask/hash/encrypt) → 선택적 Deanonymizer로 LLM sandwich 패턴: 프롬프트 PII 치환→LLM→응답 복원. 에이전트는 user prompt뿐 아니라 tool argument·tool result·final response 4 boundary마다 outbound model call 전 redaction이 필요 — 첫 turn만 치환하면 cross-turn·tool hop에서 PII가 누적된다. Legend(deconvolute-labs)는 4-boundary pseudonymization+Boundary D restore, Philter는 NLP+pattern deterministic proxy. Azure APIM·PII Shield로 엣지 배포. NeMo Guardrails(대화) ·Guardrails AI(validator)와 달리 데이터 residency·provider tenancy 경계.'
  points:
  - 'Sandwich: analyze→anonymize→LLM→deanonymize — agent는 4 outbound hop마다 반복'
  - 'Analyzer: spaCy/ONNX/HuggingFace, LLM redactor 아닌 deterministic detection 권장'
  - Legend/Philter와 역할 분리 — Presidio=framework, Legend=4-boundary agent adapter
  source: https://microsoft.github.io/presidio/
- category: ai
  title: LaunchDarkly AgentControl — AI config·prompt·model을 200ms 런타임 제어, Guarded Rollout
  summary: 'LaunchDarkly AgentControl(2026)은 기존 feature flag 인프라(50T+/day)를 AI 런타임 제어로 확장한다. AI Config SDK로 prompt·model·parameters·tools를 코드 배포 없이 200ms 이내 갱신. Offline Evals(LLM judge·golden dataset) → Guarded Rollout(점진 traffic split·quality/cost/latency gate·auto rollback) → Online Evals(프로덕션 LLM judge). Adaptive Triggers: provider error rate 임계→모델 전환 자동. GrowthBook(DWH 네이티브 A/B) ·Firebase Remote Config(모바일)와 달리 "에이전트 runtime control plane+eval gate"에 특화.'
  points:
  - 'AI Config SDK: prompt/model/tools 런타임, provider 직접 호출(프록시 아님)'
  - 'Guarded Rollout: traffic split→quality gate→auto rollback, Offline+Online eval'
  - GrowthBook/Firebase와 역할 분리 — AgentControl=에이전트 governance+eval
  source: https://launchdarkly.com/docs/home/ai-configs
- category: ai
  title: Statsig AI Evals — Prompt versioning·shadow eval·LLM-as-judge, 코드 배포 없이 A/B
  summary: Statsig AI Evals는 Prompt(=Dynamic Config) + Grader(LLM-as-judge/rule-based) + Online Evals를 통합한다. Prompt Live/Candidate/Draft/Archive 4단계 — Candidate는 사용자에게 노출 안 하고 shadow-run하여 Live와 grade 비교. Node/Python AI SDK로 런타임 prompt fetch, logEvalGrade()로 0-1 score 반환. Critical Grader는 must-pass gate. Braintrust(eval-first CI) ·GrowthBook(feature flag)와 달리 "shadow candidate eval→winner promote" 프로덕션 패턴에 특화.
  points:
  - 'Prompt versioning: Live vs Candidate shadow-run, 사용자 impact zero'
  - 'Grader: rule-based + LLM-as-judge, Critical Grader must-pass gate'
  - Braintrust(CI eval gate)와 달리 Statsig=prod shadow+experiment 통합
  source: https://docs.statsig.com/ai-evals/online-evals
- category: ai
  title: LLM Shadow→Canary Rollout — offline eval→shadow 100%→canary 2-10%→auto rollback gate
  summary: '2026 LLM 모델·프롬프트·RAG 업데이트는 코드 배포와 다른 실패 패턴을 가진다 — schema drift·semantic regression·tail input category. 안전 rollout funnel: (1) offline eval on golden set (2) shadow mode — production traffic duplicate inference, 사용자는 incumbent만 수신 (3) canary — sticky hash(user_id)로 2-10% live candidate (4) gate check — schema conformance·p95 latency·quality score vs 7일 baseline, fail→auto rollback 0%. AI deployment patterns(topology) ·Graceful Degradation(service level)과 달리 "model artifact promotion pipeline"에 특화.'
  points:
  - 'Shadow: 100% duplicate inference, zero user impact, 24-72h tail failure 수집'
  - 'Canary: sticky session key, 2%→10%→50% gate, fail→router repoint <60s'
  - LaunchDarkly Guarded Rollout ·Statsig shadow eval과 연계하는 infra layer
  source: https://futureagi.com/blog/llm-eval-shadow-traffic-canary-2026/
- category: ai
  title: OpenAI Moderation API — omni-moderation-latest, 텍스트+이미지·inline Responses API(무료)
  summary: 'OpenAI Moderation API는 omni-moderation-latest(GPT-4o 기반)로 텍스트·이미지 harmful content를 분류한다. hate·violence·self-harm·sexual 6+ 카테고리, category_scores 0-1 probability. standalone POST /v1/moderations 또는 Chat Completions/Responses API inline moderation(model: omni-moderation-latest) — input+output 동시 score, request ID로 audit trail 통합. 무료(Free 250 RPM). NeMo Guardrails(대화 레일) ·Guardrails AI(validator hub)와 달리 "provider-native toxicity classifier" — Perspective API(2026-12-31 sunset) 마이그레이션 1순위.'
  points:
  - 'omni-moderation-latest: text+image, non-English 정확도 개선, 무료'
  - 'inline moderation: Responses/Chat Completions 1-call, input+output score'
  - Perspective sunset(2026-12-31) → OpenAI Moderation 또는 Azure Content Safety
  source: https://developers.openai.com/api/docs/guides/moderation
- category: ai
  title: Perspective API Sunset — 2026-12-31 서비스 종료, toxicity 마이그레이션 필수
  summary: 'Google Jigsaw Perspective API는 2026년 12월 31일 공식 종료(sunset)된다. 신규 가입·quota 요청은 2026년 2월부터 중단, migration support 없음. TOXICITY·SEVERE_TOXICITY 등 0-1 probability score, Reddit·NYT 등 decade 사용. 한계: 영어 80-85%·비영어 60-75%, AAVE·LGBTQ+ over-flag, fully automated moderation 금지 권고. 2026 마이그레이션 경로: OpenAI omni-moderation(무료) ·Azure AI Content Safety ·Hive ·Tisane — threshold 재캘리브레이션 필수.'
  points:
  - 2026-12-31 hard deadline, extension·migration support 없음
  - 영어 외 정확도·공정성 한계 — 단순 drop-in 아닌 re-benchmark 필요
  - OpenAI Moderation ·Azure Content Safety ·Hive로 대체, HITL 유지 권고
  source: https://perspectiveapi.com/
- category: ai
  title: GDPR + EU AI Act for AI Apps — DPIA+FRIA·prompt-layer PII·audit log by design(2026)
  summary: '2026년 AI 앱은 GDPR과 EU AI Act가 동시 적용된다 — AI Act 고위험 의무 2026-08-02, GDPR은 그 위에 stack. EDPB Opinion 28/2024: 대부분 AI 모델은 anonymous 아님, training lawful basis 엄격. 실무 3층: (1) prompt-layer data minimization — Presidio redaction·pseudonymization before LLM (2) combined DPIA+FRIA — privacy+기본권 impact 단일 문서 (3) per-interaction audit log — model version·redaction rule·tool call, Article 30. Agent HITL Approval ·NeMo Guardrails와 달리 "regulatory architecture+technical control" 프레임워크.'
  points:
  - EU AI Act 2026-08-02 high-risk + GDPR 동시, EDPB 28/2024 lawful basis 엄격
  - Prompt-layer PII redaction = data minimization by design, DPA training 금지
  - DPIA+FRIA 통합, per-interaction audit log(Article 30), agent kill switch
  source: https://www.strac.io/blog/gdpr-for-ai
- category: ai
  title: Datadog Agent Observability — LangGraph·CrewAI·OpenAI Agents SDK span trace+eval
  summary: 'Datadog LLM Observability Agent Monitoring(2026)은 OpenAI Agents SDK·LangGraph·CrewAI에 Python SDK auto-instrumentation. intra/inter-agent span: tool call·LLM call·memory·handoff·retry를 unified trace. APM correlation으로 backend service→agent reasoning→user impact end-to-end. Custom LLM-as-a-judge eval(trace/span/session level), offline experiment+dataset+production monitoring 단일 플랫폼. Langfuse(OTel OSS) ·AgentOps(agent reasoning debug)와 달리 "기존 Datadog APM 위 AI agent layer" — infra+agent+UX correlation.'
  points:
  - 'Auto-instrument: OpenAI Agents·LangGraph·CrewAI, tool/LLM/memory span'
  - 'APM correlation: service issue→agent step→user impact root cause'
  - LLM-as-judge eval trace/span/session, offline experiment→prod 동일 UI
  source: https://docs.datadoghq.com/llm_observability/monitoring/agent_monitoring/
- category: ai
  title: Qualcomm AI Hub — Snapdragon NPU용 LLM export·Genie SDK·ChatApp 레시피
  summary: Qualcomm AI Hub(aihub.qualcomm.com)는 Snapdragon Hexagon NPU에 최적화된 380+ 모델 zoo와 export·compile·deploy 파이프라인을 제공한다. qai-hub-models(PyPI)로 Hugging Face Llama 3.2 3B 등을 device-specific bundle로 export하고, QAIRT SDK(구 QNN)의 Genie SDK로 Android·Windows·Linux에서 on-device LLM을 실행한다. genie-t2t-run CLI 또는 ChatApp(Android Java/C++) 샘플로 Llama-v3.2-3B-Instruct를 Snapdragon 8 Elite Gen 5에서 TTFT·response rate 벤치마크 가능. NexaSDK(앱 SDK)와 달리 Hub는 모델 최적화·compile·reference app까지 end-to-end. 16GB RAM(7B+)·12GB(3B+) 메모리 요구, Android 15+.
  points:
  - qai-hub-models→QAIRT Genie bundle export, genie-t2t-run·ChatApp 배포
  - 380+ 모델 zoo, Llama 3.2 3B on Snapdragon 8 Elite Gen 5 벤치마크
  - NexaSDK(런타임 SDK) vs AI Hub(export+compile+sample app) 역할 분리
  source: https://aihub.qualcomm.com/mobile
- category: ai
  title: MediaTek NeuroPilot + LiteRT Accelerator — Dimensity NPU를 단일 API로
  summary: MediaTek NeuroPilot는 Edge AI용 SDK·converter·compiler 생태계로, 2026년 Google과 협력해 LiteRT NeuroPilot Accelerator를 통합했다. LiteRT 단일 API로 MediaTek NPU를 타겟하고, AOT offline compile·on-device compile·CPU/GPU 자동 fallback을 지원. Gemma 3(270M·1B·3n E2B)·Qwen3 0.6B·EmbeddingGemma 300M 등 open-weight 모델이 Dimensity NPU에서 CPU 대비 최대 12x·GPU 대비 10x 빠른 추론. ExecuTorch(MediaTek delegate) ·Qualcomm AI Hub(Snapdragon Genie)와 달리 Google LiteRT 경로로 Dimensity 칩셋 millions-scale 배포.
  points:
  - 'LiteRT NeuroPilot Accelerator: 단일 API, AOT+on-device compile, auto fallback'
  - Gemma 3·Qwen3 0.6B·EmbeddingGemma, NPU 12x CPU·10x GPU 속도
  - NeuroPilot SDK(converter) + LiteRT(runtime) = code once deploy everywhere
  source: https://www.mediatek.com/tek-talk-blogs/mediatek-npus-neuropilot-and-litert-are-ready-to-bring-power-ai-in-millions-of-devices
- category: ai
  title: Mobile LLM Thermal Throttling — sustained inference는 peak tok/s가 아니다
  summary: '2026년 벤치마크는 모바일 LLM의 binding constraint가 peak compute가 아니라 thermal management임을 보여준다. iPhone 16 Pro는 peak 40 tok/s지만 2회 inference 후 44% degradation, benchmark 65% 시간 throttled 상태. Snapdragon 8 Gen 2는 90–120초 full-speed 후 clock 30–40% drop. 스마트폰 passive cooling은 2–3W sustained만 허용. 프로덕션 대응: duty cycling(추론·idle 2:1), batch size를 thermal pressure에 따라 4→2→1 축소, INT4 양자화로 bandwidth·발열 절감. EnerInfer·CORE(MLSys 2026)는 NPU/DDR frequency를 QoE·thermal comfort에 맞춰 joint control.'
  points:
  - 'Peak≠sustained: iPhone 16 Pro 40→22 tok/s, S24 hard GPU frequency floor'
  - Duty cycling·dynamic batch·INT4 quantization = production thermal strategy
  - 'EnerInfer/CORE: NPU+memory DVFS joint governor, always-on agent에 필수'
  source: https://arxiv.org/html/2603.23640v1
- category: ai
  title: Swift Concurrency + Core AI ComputeStream — 온디바이스 추론을 async로
  summary: Core AI(WWDC26)는 Sendable InferenceFunction·ComputeStream으로 Swift Concurrency와 네이티브 통합한다. AIModel은 lightweight handle, loadFunction(named:)으로 InferenceFunction을 얻고 ComputeStream에 encode하면 Neural Engine/GPU 작업이 async로 직렬화된다. 동일 stream에 encode된 inference는 data dependency 기반 자동 순서 보장, InferenceFunction은 Sendable이라 concurrent task에서 per-caller buffer 자동 할당. SpecializationOptions로 ComputeUnitKind(CPU/GPU/Neural Engine) 명시, coreai-build CLI로 AOT compile해 first-run specialization latency 제거. Foundation Models LanguageModelSession에 CoreAILanguageModel을 plug하면 streaming·@Generable·tool calling 재사용.
  points:
  - ComputeStream + Sendable InferenceFunction = async on-device pipeline
  - coreai-build AOT compile → first-run specialization 시간 대폭 단축
  - 'Core AI overview 카드와 complement: Swift API·concurrency 설계 패턴'
  source: https://developer.apple.com/videos/play/wwdc2026/326/
- category: ai
  title: Offline-First AI App — Room이 source of truth, WorkManager가 sync
  summary: '온디바이스 AI 앱에서 offline-first는 "네트워크 없으면 disabled"가 아니라 local DB가 single source of truth이고 cloud는 sync mechanism이다. Android: Room/Kotlin Flow로 UI 즉시 반영, write는 pending sync 표시 후 WorkManager가 POST/PUT queue. Flutter: docs.flutter.dev offline-first 패턴 — repository가 local remote 병합, pull-to-refresh 또는 background workmanager sync. AI inference boundary는 local-first: embedding·RAG·LLM 생성은 디바이스, cloud는 model update·analytics coordination만. ObjectBox·sqlite-vector 카드(벡터 DB)와 complement: 아키텍처 레이어(데이터·sync·inference 분리).'
  points:
  - Local DB=truth, network=sync — UI는 Flow/ReactiveStream으로 즉시 갱신
  - Write→pending sync→WorkManager/background task guaranteed delivery
  - Inference local-first, cloud=model update·coordination layer only
  source: https://proandroiddev.com/the-complete-guide-to-offline-first-architecture-in-android-490d5e9d27ea
- category: ai
  title: On-Device AI Model Delivery — APK에서 모델 lifecycle 분리·incremental OTA
  summary: '프로덕션 on-device AI는 모델을 APK에 bundling하면 Play 배포·rollback이 app release에 묶인다. 패턴: server-side model registry(버전·호환성·실험군 3-layer) + WiFi+charging+screen-off 조건부 download + incremental patch(BSDiff/tensor delta, patch>50% base면 full download) + staged rollout(1%→100%) + hot rollback. Play Asset Delivery·on-demand pack도 app version에 종속. A/B experiment group별 model binding으로 blast radius 제어. ExecuTorch(.pte)·LiteRT·GGUF 모두 동일 delivery pipeline 적용 가능.'
  points:
  - 'Model registry 3-layer: version·compatibility·experiment group'
  - Incremental patch vs full download threshold, WiFi+charging policy
  - Staged rollout + hot rollback, app release와 model iteration 완전 분리
  source: https://xckevin.com/en/blog/android-on-device-ai-model-delivery-versioning/
- category: ai
  title: Mobile On-Device LLM SDK 2026 — ExecuTorch·MLC·NexaSDK·llama.cpp 선택 가이드
  summary: '2026년 모바일 LLM SDK는 export pipeline·HW delegate·integration complexity 3축으로 갈린다. ExecuTorch(Meta): PyTorch torch.export→.pte, 12+ delegate(QNN·CoreML·XNNPACK), Instagram/WhatsApp 프로덕션 스케일 — PyTorch 팀에 최적. MLC LLM: TVM compile→hardware-native, iOS Metal·Android GPU·WebGPU 크로스플랫폼 — browser deployment unique. NexaSDK(Qualcomm): NPU-first, LLM·VLM·ASR·TTS 올인원, OpenAI 호환 API — Snapdragon NPU 최적·integration simplest. llama.cpp: GGUF·CPU/GPU portable, framework overhead 최소 — 프로토타입·fallback. 온디바이스 ML 3종(Core ML·LiteRT·ExecuTorch) 카드와 complement: LLM-specific SDK 비교.'
  points:
  - ExecuTorch=PyTorch prod scale, MLC=TVM compile+cross-platform+WebGPU
  - NexaSDK=NPU-first multimodal simplest, llama.cpp=GGUF leanest
  - '선택: PyTorch→ExecuTorch, cross-platform+web→MLC, Snapdragon NPU→NexaSDK'
  source: https://cactuscompute.com/compare/mlc-llm-vs-executorch
- category: ai
  title: TinyMLDelta — TFLite Micro 모델 OTA를 binary patch로, flash wear 최소화
  summary: 'TinyMLDelta(felixgalindo/TinyMLDelta)는 embedded/TinyML 디바이스에서 full TFLite Micro model(20–200KB+) 대신 binary patch(수 KB)로 OTA 업데이트한다. PatchGen(off-target)이 tensor-level diff 생성, MCU runtime(on-target)이 flash에 atomic apply + metadata TLV compatibility 검증(opset·arena·signature). Flash wear는 changed byte만 write. Arduino UNO Q thermocouple anomaly demo: on-device train→PC patch gen→OTA push→infer. oxide(ONNX fleet delta) ·Android server-side model delivery와 complement: MCU/IoT scale incremental update.'
  points:
  - PatchGen(off-target)→MCU runtime(on-target), metadata TLV compatibility gate
  - 'Diff not full model: bandwidth·flash wear·update latency 대폭 절감'
  - TFLite Micro embedded 전용, oxide(ONNX fleet)와 스케일 분리
  source: https://github.com/felixgalindo/TinyMLDelta
- category: ai
  title: LiteRT Delegate Patterns — GPU·NPU·NNAPI·CPU fallback 선택과 Android 17 NPU 선언
  summary: 'LiteRT(구 TFLite)는 CompiledModel API가 Interpreter를 대체해 자동 HW 선택·비동기 실행을 제공한다. Delegate 계층: GPU delegate(OpenCL/Vulkan), NNAPI(deprecated but legacy), vendor NPU delegate(Qualcomm·MediaTek via NeuroPilot Accelerator), XNNPACK CPU(+Arm SME2 via KleidiAI). Android 17: FEATURE_NEURAL_PROCESSING_UNIT manifest 선언 없으면 targetSdk 37+ NPU 접근 차단 — LiteRT NPU delegate·벤더 SDK·NNAPI 사용 앱 모두 해당. Fallback chain 설계: NPU→GPU→CPU, 각 경로 latency·accuracy·thermal profile 측정 필수. MediaPipe Tasks(LLM·vision)와 조합 시 delegate 자동 선택.'
  points:
  - 'CompiledModel: auto HW select, GPU/NPU/XNNPACK delegate chain'
  - Android 17 FEATURE_NEURAL_PROCESSING_UNIT manifest 필수(targetSdk 37+)
  - NPU→GPU→CPU fallback + per-path benchmark, NNAPI legacy 주의
  source: https://developer.android.com/develop/ai/on-device
- category: ai
  title: Private AI App Architecture — inference boundary·telemetry 분리·local-first UX
  summary: 'Private/local-first AI 앱은 "모델을 디바이스에 넣었다"로 끝나지 않는다. 3-layer boundary: (1) inference boundary — PII·prompt·embedding·generation이 디바이스를 안 떠남, cloud API는 opt-in fallback only (2) telemetry boundary — diagnostic metadata(model version·latency·error code)와 user content 분리, SideEye·nsfw_detect 패턴 (3) sync boundary — user-generated content만 encrypted sync, model weights는 separate delivery channel. React Native ExecuTorch+RAG·Genkit Dart hybrid·Firebase AI Logic routing 카드와 complement: privacy architecture 프레임워크.'
  points:
  - Inference·telemetry·sync 3-boundary — content vs diagnostic 분리
  - Cloud=opt-in fallback, default on-device; encrypted sync for user data only
  - Model weights separate delivery, PII never in analytics pipeline
  source: https://nearform.com/digital-community/ai-beyond-the-cloud-the-current-and-future-state-of-on-device-generative-ai/
- category: ai
  title: Codex-maxxing — 긴 작업은 프롬프트가 아니라 지속되는 작업 공간으로 설계하기
  summary: OpenAI가 2026-06-22 공개한 Codex-maxxing whitepaper는 Codex를 "한 번 답하는 챗봇"보다 오래가는 작업 공간으로 쓰는 패턴을 정리한다. 핵심은 durable thread다. 중요한 작업은 같은 스레드에 맥락·선호·결정·열린 루프를 쌓고, 필요하면 memory vault에 사람·프로젝트·결정·닫힌 루프를 diff 가능한 기록으로 남긴다. 실행 중에는 steering으로 방향을 바로잡거나 다음 액션을 큐에 넣고, thread automation으로 같은 스레드가 주기적으로 Slack·Gmail·PR·배포 상태를 확인하게 할 수 있다. 단, 자동화의 끝은 사람 승인이다. 강한 goal은 "계획을 구현하라"가 아니라 원래 테스트 통과, 리뷰 기준, 제약, definition of done처럼 Codex가 검증할 수 있는 기준을 준다. 교훈은 장기 에이전트 운영에서 컨텍스트 보존·반복 wake-up·검증 가능한 목표·사람 승인 게이트가 한 묶음이라는 점이다.
  points:
  - Durable thread + memory vault로 맥락·결정·열린 루프를 재사용 가능한 기록으로 유지
  - Steering·thread automation으로 실행 중 방향 수정과 주기적 재개를 같은 스레드 안에서 처리
  - 목표는 테스트·리뷰 기준·제약·완료 정의처럼 에이전트가 검증 가능한 형태로 쓴다
  source: https://openai.com/index/codex-maxxing-long-running-work/
- category: ai
  title: AI BFF Pattern — API key·PII·streaming을 서버 레이어로, 클라이언트는 렌더만
  summary: AI BFF(Backend for Frontend)는 LLM 기능을 클라이언트에 직접 붙이지 않고 서버-side gateway로 프록시하는 2026 enterprise 기본 패턴이다. BFF가 API key 보관·per-user rate limit·PII scrubbing·audit log·cost budget·guardrail을 enforce — 클라이언트는 stream render만. Next.js Route Handler·Server Actions·Hono·FastAPI가 BFF 구현체, Vercel AI SDK streamText·toUIMessageStreamResponse가 de facto streaming primitive. Memory/context manager·session auth·tool orchestration도 BFF에 집중. Portkey/Kong(enterprise gateway) ·Helicone(proxy FinOps)와 달리 "앱별 tailored AI layer" — mobile/web client마다 payload·auth·fallback 다르게.
  points:
  - API key·PII·rate limit·audit — 클라이언트 신뢰 불가 영역을 BFF로
  - Vercel AI SDK streamText + SSE — Next.js/Hono Route Handler 표준
  - Portkey/Kong(범용 gateway) vs BFF(앱별 tailored layer) 역할 분리
  source: https://github.com/stevekinney/stevekinney.net/blob/main/courses/enterprise-ui/ai-integration-patterns.md
- category: ai
  title: Modular Monolith for LLM Apps — microservices보다 먼저 모듈 경계, 필요 시만 extract
  summary: '2026 LLM 앱 아키텍처는 microservices default가 아니라 modular monolith가 출발점이다. 단일 deployable app 내부에 Routes·Services·Domain·Infrastructure 4-layer, AI gateway·RAG·evals를 @ai-blueprint 패키지로 module boundary enforce. microservices는 independent scale·polyglot·team isolation이 필요할 때만 — LLM chain latency·debug complexity·ops overhead가 early-stage에 과도. hybrid: monolith core + inference GPU service만 extract. ai-native-app-blueprint(Fastify modular monolith) ·Dify(visual workflow)와 달리 "코드-first module boundary + selective extraction" ADR. AI deployment patterns(topology) ·BFF(app layer)와 3-tier: monolith structure→BFF→gateway.'
  points:
  - Modular monolith default — microservices는 scale/team isolation 필요 시만
  - AI gateway·RAG·evals module boundary — provider switch = gateway 교체
  - Selective extract — inference GPU·vector DB만 별도 service로 분리
  source: https://github.com/ruchit07/ai-native-app-blueprint
- category: ai
  title: Kafka + Flink Agent Stack — MCP·A2A 위 durable event backbone
  summary: 2026 multi-agent production stack은 MCP(tool access) + A2A(agent delegation) + Kafka(event backbone) + Flink(stream processing) 4-layer로 수렴한다. Kafka — durable·replayable·ordered event log, agent task publish/subscribe, orchestrator-worker·blackboard·fan-out 패턴. Flink — raw event stream을 windowed summary로 변환해 LLM token cost/latency 절감, Flink Agents(FLIP-531)는 agent를 Flink dataflow node로 embed. Celery+Redis(Python inference queue) ·Temporal(durable workflow)와 달리 "high-throughput event-native agent coordination". A2A 1년 카드(MCP complement) ·AI Pipeline Orchestration(Temporal/Prefect)과 역할 분리 — Kafka=event bus, Temporal=workflow state.
  points:
  - Kafka — durable event log, orchestrator-worker·blackboard·fan-out
  - Flink — stream enrich/window before LLM, Flink Agents = agent as dataflow node
  - MCP(tools) + A2A(agents) + Kafka(events) — 2026 agent infra stack
  source: https://thenewstack.io/a2a-mcp-kafka-and-flink-the-new-stack-for-ai-agents/
- category: ai
  title: SSE vs WebSocket for AI Streaming — LLM token은 SSE 기본, bidirectional만 WS
  summary: 'OpenAI·Anthropic·Google Gemini streaming API는 모두 SSE(text/event-stream) over HTTP를 채택했다 — LLM response는 본질적으로 server→client unidirectional. SSE 장점: plain HTTP(proxy/CDN/firewall 통과), EventSource auto-reconnect(Last-Event-ID), HTTP/2 multiplexing(6-connection limit 해소). WebSocket은 mid-stream steering·collaborative editing·real-time chat처럼 client→server concurrent send가 필요할 때만 — infra complexity(load balancer sticky·ping/pong·observability) 부담. production 필수: proxy_buffering off(Nginx), 15-30s heartbeat comment, client disconnect→upstream AbortController cancel(cost 절감). Vercel AI SDK ·OpenAI SDK가 SSE consume 표준.'
  points:
  - LLM token stream = SSE default — OpenAI·Anthropic·Gemini·Vercel AI SDK
  - WebSocket — mid-stream steering·collab edit 등 bidirectional 필요 시만
  - proxy_buffering off + heartbeat + disconnect cancel — prod 3종 세트
  source: https://tianpan.co/blog/2026-04-10-streaming-real-time-agent-uis-sse-backpressure-reconnection
- category: ai
  title: LLM Goodput SLO — uptime이 아니라 latency+cost+quality 동시 충족률
  summary: 'LLM SLO는 HTTP 200 uptime만으로 부족하다 — Goodput은 latency·cost·quality threshold를 동시에 충족하는 request 비율이다. 3-layer SLO: (1) Uptime — API availability·HTTP error (provider SLA 범위) (2) Performance — TTFT P50/P95·structured output parse success rate (3) Quality — faithfulness≥0.80·hallucination rate·refusal rate vs 7일 baseline. 1000 RPS 중 TTFT 위반 15%+quality 위반 8% → Goodput ~780 RPS. burn-rate alert로 point threshold noise 방지. Langfuse/LangSmith(trace) ·Statsig AI Evals(quality gate) ·LLM Shadow→Canary(promotion gate)와 연계하는 SLO design layer.'
  points:
  - Goodput = latency+cost+quality 동시 충족 request 비율
  - '3-layer: uptime(provider SLA) ·performance(parse/TTFT) ·quality(faithfulness/refusal)'
  - burn-rate alert — point threshold 대신 SLO budget 소진율
  source: https://valuestreamai.com/blog/ai-monitoring-in-production-guide-2026
- category: ai
  title: Vendor SLA Gap — 200 OK인데 제품은 broken, functional availability 측정
  summary: 'Frontier LLM provider SLA는 "2xx response within latency bound"만 cover — refusal rate spike·JSON schema drift·capability regression·region failover model heterogeneity는 SLA 밖이다. Azure OpenAI SLA는 endpoint uptime만 commit, output accuracy/relevance는 no commitment. functional availability = "우리 제품 기준으로 working한 request 비율" — provider green이어도 assistant가 routine request refuse·downstream parser broken 가능. 대응: per-feature functional SLO(refusal rate·parse success·task completion), provider SLA를 necessary not sufficient로 treat, multi-provider fallback at gateway. AI BFF(gateway layer) ·Goodput SLO(design) ·Agent Graceful Degradation(fallback) 3-tier reliability.'
  points:
  - Provider SLA = 2xx uptime, product failure = refusal·schema·capability drift
  - Functional availability — "우리 제품 기준 working" 자체 instrumentation
  - Provider green ≠ product healthy — gateway fallback + per-feature SLO
  source: https://tianpan.co/blog/2026-05-13-vendor-sla-gap-uptime-vs-functional-availability
- category: ai
  title: AI Incident Response Runbook — 6-phase·version snapshot·EU AI Act Article 73
  summary: 'LLM incident는 HTTP 500이 아니라 silent behavioral degradation — hallucination spike·retrieval outage·guardrail bypass·latency regression. 6-phase runbook: (1) Detect — quality/refusal/parse rate alert (2) Triage — failure layer 분류(retrieval/quality/performance/safety) (3) Contain — traffic reroute·degraded mode·circuit breaker (4) Mitigate — prompt/model rollback·fallback activate (5) Recover — canary re-promotion (6) Postmortem — version snapshot. contain 60분 이내 executable action 필수 — root cause 전에도. EU AI Act 2026-08-02 high-risk: Article 73 serious incident 15일·very serious 2일 notification. Datadog Agent Observability(trace) ·Human-in-the-Loop(approval gate) ·Graceful Degradation(fallback) 연계.'
  points:
  - '6-phase: detect→triage→contain→mitigate→recover→postmortem'
  - Failure layer 분류 — retrieval/quality/performance/safety 각각 다른 playbook
  - EU AI Act Article 73 — serious 15일·very serious 2일 notification deadline
  source: https://valuestreamai.com/blog/ai-incident-response-2026
- category: ai
  title: AI Postmortem — model·prompt·index version snapshot + eval gap analysis
  summary: 'AI postmortem은 commit SHA만으로 부족 — incident start 시점 full version snapshot 필수: model version·prompt hash·retrieval index version·embedding model·tool schema·guardrail config·eval dataset version. failure layer classification(retrieval vs quality vs performance vs cost vs data), failing trace attachment(rendered prompt·retrieved chunks·generated output). eval gap analysis — "어떤 eval case가 missing? sycophancy test 없었나?" → eval dataset feed-back. blameless 6 questions + action item owner/due date/verification method. traditional SRE postmortem ·AI Incident Runbook(6-phase)과 complement — runbook=response, postmortem=learning loop.'
  points:
  - Version snapshot — model·prompt·index·tool schema·guardrail·eval dataset
  - Trace evidence — rendered prompt·retrieved chunks·output attach
  - Eval gap analysis — missing eval case → dataset enrichment action item
  source: https://tianpan.co/blog/2026-04-19-ai-incident-response-playbook-llm-production
- category: ai
  title: LLM Data Flywheel — production trace→curate→eval gate→fine-tune→promote
  summary: 'Data flywheel는 production traffic을 training signal로 변환하는 closed-loop다. 5-stage: (1) Ingest — OTel trace/log accumulate (2) Curate — filter·deduplicate·LLM-as-judge quality score (3) Experiment — ICL zero-compute vs LoRA SFT candidate (4) Evaluate — teacher model judge·latency·cost·regression set (5) Promote — all gates pass→production replace. tohio/data-flywheel(Celery chain·MongoDB run doc) ·Arize AX(ExportSpansToFineTuningOperator·Airflow DAG) 구현. Pioneer Agent(arXiv 2604) — production failure→taxonomy→corrective curriculum→retrain loop. Distilabel(RLHF synthetic data) ·Continuous Fine-Tuning(contamination guard)와 역할 분리 — flywheel=automated prod→model loop.'
  points:
  - '5-stage: ingest→curate→experiment→evaluate→promote'
  - LLM-as-judge curation — manual label bottleneck 제거
  - Eval gate + regression set — promote only if all dimensions pass
  source: https://github.com/tohio/data-flywheel
- category: ai
  title: Continuous Fine-Tuning Pipeline — eval/train physical separation·replay buffer
  summary: 'User feedback fine-tuning은 eval signal contamination이 최대 리스크 — training data와 eval benchmark가 같은 pipeline을 공유하면 metric이 meaningless. architecture: classification gateway가 interaction을 training vs eval traffic bucket으로 route, eval benchmark는 append-only separate store(access control). MinHash+LSH dedup(5-gram Jaccard≥0.8)으로 held-out eval example이 training에 유입 차단. replay buffer — past high-quality example을 new batch에 mix해 catastrophic forgetting 방지. self-reinforcing error guard — confident wrong answer가 training signal 되면 eval이 specific failure mode test 필요. LLM Data Flywheel(automation) ·Distilabel(synthetic RLHF data) ·Pioneer Agent(production repair)와 complement.'
  points:
  - Physical separation — training pipeline ≠ eval benchmark store
  - MinHash+LSH dedup — eval example training contamination 차단
  - Replay buffer — catastrophic forgetting·self-reinforcing error 방지
  source: https://tianpan.co/blog/2026-04-16-continuous-fine-tuning-data-contamination
- category: ai
  title: Garak vs PyRIT — LLM Red Team 2축, surface scan vs multi-turn campaign
  summary: 'LLM red team은 Garak(NVIDIA·Apache-2.0·~8k★)과 PyRIT(Microsoft·MIT·~4k★) 두 축으로 나뉜다. Garak — nmap/Metasploit식 probe library로 prompt injection·탈옥·데이터 유출·환각·독성을 단일턴·배치 스캔. HuggingFace·OpenAI·Bedrock·LiteLLM·llama.cpp 등 다양한 generator 연결, NeMo Guardrails 통합으로 가드레일 전후 보호율 측정. PyRIT — Target(Azure OpenAI·HTTP·agent)·Orchestrator(Crescendo·TAP multi-turn)·Converter(Base64·Leetspeak)·Scorer(LLM-as-judge)·Memory(forensic log) 5계층. 53+ adversarial dataset·70+ prompt converter·6 attack strategy, Copilot 등 100+ 제품 red team에 사용. 실무 조합: release gate는 Garak surface scan→PyRIT adaptive multi-turn campaign→OWASP LLM/ASI 매핑. OWASP LLM Top 10(위협 모델) ·NeMo Guardrails(런타임 레일)와 역할 분리 — red team=offensive validation layer.'
  points:
  - Garak — probe library surface scan, NeMo Guardrails 보호율 A/B
  - PyRIT — Crescendo/TAP multi-turn, 53+ dataset·70+ converter·CI exit gate
  - Garak→PyRIT pipeline — surface→adaptive campaign, OWASP 매핑
  source: https://github.com/nvidia/garak
- category: ai
  title: Indirect Prompt Injection — Rule of Two·Dual-LLM·tool-output quarantine
  summary: Indirect prompt injection은 이메일·웹페이지·RAG chunk·MCP tool response처럼 "데이터 경로"로 들어와 에이전트 목표를 가로채는 공격이다. OpenAI·Anthropic·Google DeepMind는 2025~2026에 prompt-only 방어로는 구조적으로 완전 해결 불가를 인정했다. Meta Rule of Two — 단일 operation에서 untrusted input 처리·sensitive system 접근·external state 변경 셋 중 최대 2개만 허용. Dual-LLM(Simon Willison 2023→Microsoft Zero Trust 2026 Spotlighting) — privileged planner(도구 결정)와 quarantined reader(비신뢰 바이트만 읽음) 분리, schema-validated channel로 structured extraction만 교환. tool poisoning 방어 — tool output free-text를 planner context에 직접 merge하지 말고 typed field만 통과. 코딩 에이전트 프롬프트 인젝션 방어(Claude Code) ·OWASP LLM01과 축 분리 — indirect=untrusted data plane.
  points:
  - Rule of Two — untrusted input·sensitive access·state change 중 2개까지만
  - Dual-LLM — planner/quarantined reader + schema-validated channel
  - Tool output quarantine — typed field만 planner에, free-text 격리
  source: https://zylos.ai/research/2026-04-12-indirect-prompt-injection-defenses-agents-untrusted-content/
- category: ai
  title: Tool Execution Layer — agent가 도구를 직접 호출하지 않게
  summary: Tool Execution Layer는 LLM의 tool_call proposal과 실제 side effect 사이에 끼는 fail-closed gateway다. 에이전트 runtime은 API를 직접 때리지 않고 tool_call JSON만 제출 → gateway가 existence·allowlist·argument schema·role policy·rate limit·timeout을 검증 후 실행. write/destructive tool은 interrupt() 또는 human approval queue, idempotent read-only만 auto-execute. Joseph Manzambi secure-by-design agent 패턴 — Input Guard(확률적) 위에 Tool Authorizer(결정론적)를 두어 jailbreak와 무관하게 allowlist+schema gate. OWASP ASI02 Tool Misuse ·Human-in-the-Loop Approval과 complement — TEL=모든 tool_call의 단일 enforcement point. MCP per-tool scope(CSA) ·Cursor Auto-review(문맥 위험도)와 역할 분리 — TEL=실행 직전 deterministic gate.
  points:
  - agent→proposal→gateway(validate·authorize·execute)→normalized result
  - deny-by-default allowlist + schema validation + write approval
  - OWASP ASI02/HITL complement — LLM 밖 deterministic enforcement
  source: https://www.agentpatterns.tech/en/architecture/tool-execution-layer
- category: ai
  title: Pickle vs Safetensors — torch.load RCE·picklescan·weights_only 한계
  summary: PyTorch .pt/.pth는 pickle deserialization이라 악성 checkpoint가 torch.load() 시 임의 코드 실행(RCE) 가능 — CWE-502. CVE-2025-32434·CVE-2026-24747처럼 weights_only=True도 parser bug로 bypass 사례가 있어 "플래그=영구 안전"이 아니다. Safetensors(Hugging Face·Apache-2.0) — header+raw tensor bytes만, zero-copy load, 코드 실행 경로 제거. legacy pickle은 isolated network-off 환경에서 picklescan/fickling(Trail of Bits) opcode scan → safetensors 변환 후 promote. secure-torch·model-provenance-guard는 signature+pickle scan+header inspection을 CI gate로 묶는다. CycloneDX ML-BOM(provenance) ·Sigstore signing(identity)과 3-layer — format safety→scan→sign→deploy.
  points:
  - pickle=torch.load RCE sink, weights_only는 완전 해결 아님
  - safetensors — non-executable format, HF Hub 기본 권장
  - picklescan/fickling CI gate → safetensors convert → sign
  source: https://mlcves.com/posts/unsafe-model-deserialization-pickle-cves/
- category: ai
  title: Sigstore Model Signing — OpenSSF model-signing v1.0·HF verify gate
  summary: 'Google·OpenSSF가 2026에 model-signing Python v1.0 stable을 릴리스 — Sigstore OIDC keyless signing으로 ML artifact에 투명성 로그+감사 가능 provenance. 디렉터리 트리 단위 sign/verify CLI — 단일 .safetensors부터 multi-shard model folder까지. Hugging Face Hub upload flow에 verify integration 예정 — split-view·model substitution 방지. modelsign(Ed25519 offline) ·CycloneDX ML-BOM(SBOM metadata)과 complement — Sigstore=enterprise transparency log, modelsign=air-gapped quick sign. model-provenance-guard GitHub Action — SHA-256 hash registry+cosign verify+picklescan before pipeline admit. Patch the Planet(Sigstore participant) ·CycloneDX ML-BOM과 supply chain 3-tier: format→BOM→signature.'
  points:
  - OpenSSF model-signing v1.0 — Sigstore keyless, directory-tree sign
  - HF Hub verify integration — substitution·split-view 방지
  - 'CI gate: hash registry+cosign+picklescan before deploy'
  source: https://blog.google/security/taming-wild-west-of-ml-practical-mode/
- category: ai
  title: Agent Egress Security — capability separation·kernel isolation·DLP proxy
  summary: Agent egress security는 LLM이 active party로 outbound traffic을 날리는 threat model — credential·PII·prompt-injection exfiltration이 HTTP body·URL·DNS·MCP argument로 새는 경로를 통제한다. Capability separation — agent process는 secret 보유 but network 없음, egress proxy는 network 있지만 secret 없음 → 단독으로는 exfil 불가. HTTPS_PROXY env만으로는 부족 — prompt injection이 unset 가능, kernel nftables/iptables·network namespace로 direct connect 차단. Pipelock(Apache-2.0) — 62+ DLP pattern·SSRF CIDR block·DNS rebinding pin·MCP/A2A transport inspect·signed action receipt. AI BFF(server-side key) ·Project KARL(zero device egress)와 축 분리 — egress=agent runtime outbound control plane.
  points:
  - Capability separation — agent=secrets/no-net, proxy=net/no-secrets
  - Kernel enforcement — nftables/namespace, env proxy만으로 불충분
  - DLP+SSRF proxy — content inspect, DNS pin, signed receipt
  source: https://pipelab.org/learn/agent-egress-security/
- category: ai
  title: AI Agent SSRF Defense — metadata blocklist·DNS pinning·scheme allowlist
  summary: 'AI agent SSRF는 poisoned tool description·RAG URL·user-supplied link로 agent가 169.254.169.254(cloud metadata)·10.0.0.0/8(private)·fd00::/8(ULA) 등 internal endpoint를 호출하게 만드는 공격. 3-layer defense: scheme allowlist(http/https only) → URL canonicalization → DNS resolve 후 CIDR blocklist → resolved IP pin(connection lifetime re-resolve 금지). Activepieces egress proxy 패턴 — ssrf-guard(dns.lookup+Socket.connect monkeypatch) + loopback CONNECT proxy(multi A/AAAA record check) + iptables per-UID kernel lockdown. IPv4-mapped IPv6·decimal IP·URL encoding bypass는 canonicalization layer에서 먼저 정규화. Agent Egress Security(DLP) ·MCP tool URL argument와 연계 — MCP fetch tool도 동일 pipeline 통과.'
  points:
  - metadata+private CIDR blocklist after DNS resolve
  - DNS pinning — resolve once, pin IP for request lifetime
  - ssrf-guard+CONNECT proxy+iptables 3-layer stack
  source: https://pipelab.org/learn/preventing-ssrf-in-ai-agents/
- category: ai
  title: HashiCorp Vault AI Secrets — dynamic DB creds·short-lived agent tokens
  summary: AI agent·MCP server·CI pipeline에 API key를 .env·settings.json·prompt에 하드코딩하면 leak blast radius가 전체 key lifetime과 같다. HashiCorp Vault — dynamic secrets engine이 DB·cloud IAM·KV credential을 TTL-bound short-lived token으로 mint, agent는 vault agent sidecar/injector로 runtime fetch. Vault Secrets Operator(K8s) — CRD로 secret sync, pod는 file/env mount만, git에는 placeholder. OpenAI/Anthropic key rotation — static key 대신 Vault KV v2 versioned secret + automatic lease renewal. AI BFF(server-side key custody) ·GitHub MCP Secret Scanning(pre-commit)과 3-tier — never-in-prompt→scan→dynamic lease. Codex safe ops(OS keyring) ·MCP OAuth token storage와 complement — Vault=central policy+audit+rotation.
  points:
  - Dynamic secrets — TTL-bound creds, static API key 금지
  - Vault Agent/Operator — sidecar inject, git에는 placeholder만
  - AI BFF·secret scanning·Vault = custody→detect→rotate
  source: https://developer.hashicorp.com/vault/docs/secrets
- category: ai
  title: OWASP ASI Top 10 + AIUC-1 crosswalk — agentic procurement baseline·SOC2 analog certification
  summary: OWASP Agentic Security Initiative(ASI) Top 10 for Agentic Applications 2026(2025-12, 100+ expert peer review)는 autonomous agent 고유 실패 모드를 10개로 정의한다. ASI01 Goal Hijack ·ASI02 Tool Misuse ·ASI03 Identity/Privilege Abuse ·ASI04 Supply Chain ·ASI05 Unexpected Code Execution ·ASI06 Memory/Context Poisoning ·ASI07 Insecure Inter-Agent Comms ·ASI08 Cascading Failures ·ASI09 Human-Agent Trust Exploitation ·ASI10 Rogue Agents. OWASP LLM Top 10(2025)은 GenAI app risk, ASI는 plan·act·persist·delegate agent risk — procurement·threat modeling에서 병행. least agency principle — minimum autonomy for bounded task가 cross-cutting mitigation. Five Eyes "Careful Adoption of Agentic AI"(2026-05)가 ASI control mapping을 국제 규제 signal로 채택. AIUC-1 crosswalk(2026-05-25) — ASI01~10↔AIUC-1 6 domain bidirectional mapping·8 gap areas(agent identity·runtime containment·supply chain attestation·schema controls 등) — agent 배포 시 threat taxonomy(ASI)와 auditable certification(AIUC-1)을 한 세트로. NSA MCP PP-26-1834(MCP operational)
    ·Microsoft AGT(runtime enforcement)와 compose.
  points:
  - ASI01~10 — goal hijack·tool misuse·privilege·supply chain·RCE·memory poison
  - AIUC-1 crosswalk — SOC2 analog cert, 8 gap areas where cert must expand for ASI
  - least agency + Five Eyes 2026-05 — procurement baseline before runtime toolkit
  source: https://genai.owasp.org/resource/aiuc-1-crosswalks-owasp-top-10-for-agentic-applications/
- category: ai
  title: MCP Tool Poisoning — description drift·Snyk Agent Scan·skill supply-chain·toxic flows
  summary: MCP tool poisoning은 tool description·schema·return example에 hidden directive를 embed해 LLM이 benign tool을 malicious action으로 호출하는 supply chain attack. Snyk Agent Scan(snyk/agent-scan·Invariant mcp-scan 후속)은 Cursor·Claude·Windsurf MCP config auto-discover→server 실행→tools/list 수집→15+ risk scan — tool poisoning·tool shadowing·toxic flows·skill malware payload(E006). skills ecosystem report(2026) — SKILL.md hidden instruction·credential handling·malware payload. pre-commit·CI `--dangerously-run-mcp-servers` gate. Pipelock(runtime proxy) ·Promptfoo redteam mcp plugin과 3-layer — static scan→runtime proxy→adversarial eval.
  points:
  - Snyk Agent Scan — MCP+skills inventory, tool poisoning·shadowing·toxic flows
  - Runtime server execution — tools/list must run server, consent/sandbox required
  - 3-layer defense — Snyk static scan·Pipelock runtime·Promptfoo adversarial CI
  source: https://github.com/snyk/agent-scan
- category: ai
  title: AI Browser Agent Security — Playwright agent·session isolation·origin policy
  summary: 'Browser-using agent(Playwright MCP·Playwright CLI·Computer Use)는 웹의 untrusted DOM·cookie·localStorage·download surface를 agent tool로 노출한다. 핵심 통제: dedicated browser profile per agent session — production SSO cookie·password manager와 분리, task 종료 시 profile delete. navigation allowlist — agent가 arbitrary URL fetch 전 domain policy check, file://·javascript: scheme 차단. download/upload gate — agent-initiated file write는 quarantine dir only, sensitive path symlink traversal block. Same-origin에서 indirect injection — page content를 planner prompt에 raw merge 금지, accessibility tree/snapshot structured field만. Playwright CLI+MCP(도구) ·Indirect Prompt Injection(data plane) ·Agent Egress Security(network)와 3-layer 분리.'
  points:
  - Dedicated ephemeral browser profile — SSO cookie 격리
  - Navigation allowlist + download quarantine dir
  - DOM snapshot structured only — raw HTML prompt merge 금지
  source: https://playwright.dev/agents
- category: ai
  title: Copilot Agent Tasks REST API — 에이전트 작업을 queue·lifecycle·PR 추적 리소스로
  summary: 'GitHub Copilot coding agent task를 REST API로 생성·조회·추적하는 Agent tasks API(public preview, 2026-06). 핵심 엔드포인트: POST/GET /agents/repos/{owner}/{repo}/tasks. body 필수 prompt, 선택 base_ref·model·create_pull_request. 응답 queued/in_progress/waiting_for_user/completed/failed·session_count·PR artifact·head/base ref. 교훈: 채팅 버튼이 아니라 queue·status·PR output을 가진 운영 리소스로 모델링 — 사내 포털·릴리스 스크립트·마이그레이션 팬아웃이 같은 API로 task 생성·상태 추적. 인증: user-to-server token만(GitHub App installation token 불가), fine-grained token에 Agent tasks 권한 필요. 자동화 전 관측성·권한 경계·PR 추적을 먼저 확보 — agent에 바로 write 권한 넓히지 말 것.'
  points:
  - POST/GET /agents/repos/{owner}/{repo}/tasks — prompt 필수, base_ref/model/PR 선택
  - queue·lifecycle·PR artifact — UI 이벤트가 아닌 운영 리소스로 모델링
  - user-to-server token + Agent tasks 권한, public preview 계약 변경 가능
  source: https://docs.github.com/en/rest/agent-tasks/agent-tasks?apiVersion=2026-03-10
- category: ai
  title: LLM Idempotency Keys — orchestrator가 만든 키, LLM이 아닌
  summary: 'Agent idempotency는 tool property가 아니라 orchestration contract다. LLM이 Idempotency-Key를 생성하면 retry 시 paraphrase로 새 키가 나와 dedup이 무력화된다. 실무 패턴: orchestrator가 run_id+step_id+tool_name+business_scope로 deterministic key derive → tool execution layer가 dedup store 확인 후 side effect 실행. Stripe Idempotency-Key header·DB unique constraint(tenant_id, idempotency_key)가 defense in depth. chaos test: runner kill 후 resume 시 downstream write count가 single-attempt baseline과 일치해야 pass. AI Agent Error Handling(idempotent saga) ·Tool Execution Layer(gateway)와 complement — key derivation=orchestrator 책임.'
  points:
  - orchestrator-owned key — run_id+step_id+tool_name+scope, LLM 생성 금지
  - dedup store before side effect — HTTP header 또는 DB unique constraint
  - chaos replay test — kill mid-step 후 resume, write count baseline 일치
  source: https://tianpan.co/blog/2026-04-23-agent-idempotency-orchestration-contract
- category: ai
  title: LLM API Webhook Patterns — 202 Accepted·Standard Webhooks·at-least-once
  summary: 'Long-running LLM job은 sync request-response로 처리하지 않는다. 표준 패턴: POST submit→202 Accepted+job_id 즉시 반환 → queue(BullMQ/SQS) → worker LLM call → webhook POST callback. OpenAI(2025~)·Gemini·Anthropic이 Standard Webhooks(HMAC-SHA256, webhook-id·webhook-timestamp·webhook-signature) 정렬 — generic library로 verify. handler는 verify→enqueue→2xx ms 응답, heavy processing은 async worker. webhook-id=idempotency key로 at-least-once dedup. timestamp 5분 reject(replay attack). polling GET /jobs/{id} fallback 필수(CLI·browser SPA). LLM Batch API(offline bulk) ·SSE(streaming UX)와 역할 분리 — webhook=server-to-server completion notify.'
  points:
  - 202+job_id → queue → webhook callback, Standard Webhooks verify
  - webhook-id dedup ·timestamp 5min reject ·2xx fast ack+async worker
  - GET /jobs/{id} polling fallback — webhook 불가 client용
  source: https://ai.google.dev/gemini-api/docs/interactions/webhooks
- category: ai
  title: Fern vs Mintlify vs ReadMe — AI-native docs 3축 2026
  summary: 'llms.txt 표준 이후 docs platform 선택은 AI discoverability가 핵심이다. Mintlify — AI-native docs, llms.txt·llms-full.txt·skill.md·MCP server 자동 생성, Git/MDX authoring, polished site. Fern — OpenAPI 단일 source→docs+SDK+snippets sync, llms.txt/full 자동, Markdown bot delivery(HTML 대비 90% token↓), content tag로 AI/human visibility 분리, LLM provider별 analytics. ReadMe — interactive developer portal·try-it·API metrics, llms.txt+MCP 생성 있으나 llms-full·granular AI control·bot analytics 약함. 선택: docs site=product surface→Mintlify, OpenAPI=SDK truth→Fern, portal+usage feedback→ReadMe. llms.txt(표준) ·Mintlify(플랫폼) 카드와 complement — 3-way platform bake-off.'
  points:
  - Mintlify — zero-config AI-native, llms.txt+MCP+skill.md 자동
  - Fern — OpenAPI→docs+SDK, bot Markdown·content tag·LLM analytics
  - ReadMe — portal+try-it, llms.txt 기본·AI control/analytics 약함
  source: https://apiscout.dev/guides/mintlify-vs-readme-vs-fern-api-docs-2026
- category: ai
  title: WireMock vs Prism — LLM API mock 2축, stateful fault vs OpenAPI contract
  summary: 'LLM backend 개발·테스트에서 mock server 선택은 contract-first vs chaos engineering 두 축이다. Prism(Stoplight) — OpenAPI spec→zero-config mock+validation proxy, schema example/generate, spec drift 즉시 catch. stateful behavior 미지원 — API-first daily dev에 적합. WireMock — request matching·stateful scenario·fault injection(502/timeout/malformed)·record-playback, agent downtime handling 테스트. 실무 stack: OpenAPI define→Prism daily frontend dev→WireMock edge-case failure suite→FastAPI prototype promote. LLM VCR cassette(응답 replay) ·LiteLLM proxy(routing)와 역할 분리 — mock=pre-backend contract·failure simulation.'
  points:
  - Prism — OpenAPI→mock+validation proxy, zero-config, stateless
  - WireMock — stateful·fault injection·record-playback, chaos QA
  - Prism contract dev → WireMock failure suite → promote prototype
  source: https://statuscodefyi.com/guides/testing-mock-server-guide/
- category: ai
  title: LLM VCR Cassette Testing — promptecho·llmvcr·reel vs VCR.py
  summary: 'LLM 테스트 3대 문제: flaky output·slow network·expensive CI token burn. VCR.py는 raw HTTP intercept → SSE streaming crash·API key plaintext·temperature drift로 cassette miss. LLM-native cassette 도구: promptecho(httpx intercept, SSE stream replay, actionable miss diff) ·llmvcr(SDK layer, YAML cassette, streaming native) ·reel(HTTP proxy, JSONL cassette, pytest --reel-mode replay CI gate) ·vcr-llm(14 provider auto-detect, JSONL). 패턴: record once real API→playback CI free/offline/deterministic. cassette miss=prompt drift signal. promptfoo(eval assertion) ·WireMock(API mock)와 complement — VCR=real response capture replay.'
  points:
  - VCR.py 한계 — SSE crash·key leak·param drift, SDK/proxy layer 필요
  - promptecho/llmvcr/reel — streaming replay·CI replay mode·actionable diff
  - record once→CI playback — cost·flake·latency 제거
  source: https://github.com/shwetank/promptecho
- category: ai
  title: Structured Logging for LLM Apps — event taxonomy·log-trace correlation
  summary: 'LLM 앱 로그는 print/debug가 아니라 incident reconstruction artifact다. 필수 event taxonomy: request.received·context.assembled(prompt/index version hash)·model.started/completed(token·latency)·tool.called/completed(idempotency key·scope)·approval.requested/resolved. structured JSON + OTel log SDK가 trace_id·span_id 자동 inject — span↔log pivot zero effort. prompt/completion은 span attribute가 아닌 span event(크기·PII). OpenTelemetry GenAI Semantic Conventions(gen_ai.* spec) ·Langfuse(trace backend)와 역할 분리 — structured log=what to log design, OTel=how to correlate.'
  points:
  - event taxonomy — context.assembled·tool.called·approval gate audit
  - JSON log + OTel trace_id/span_id auto inject
  - prompt/completion → span event, attribute 아님
  source: https://fieldjournal.ai/blog/what-to-log-for-llm-apps/
- category: ai
  title: PII-Safe LLM Logging — hash·redact·OTel Collector pipeline
  summary: 'LLM 로그에 raw prompt·user_id·email을 넣으면 GDPR·SOC2·내부 audit에서 incident가 된다. 3-layer: (1) application — user_id→SHA-256 hash, email/phone Presidio detect+mask before log emit (2) span — PII in event not attribute, OTel Collector redaction processor (3) retention — prompt full text 7-30d, hash/metadata 1y. tool.called log에 idempotency key+args hash만, raw args redact. Microsoft Presidio(sandwich guardrail) ·GDPR+EU AI Act(prompt-layer PII) ·Structured Logging(event taxonomy)와 complement — PII-safe=logging pipeline design.'
  points:
  - user_id hash ·Presidio mask ·args hash only in tool log
  - PII → span event + Collector redaction processor
  - retention tier — full prompt short, metadata long
  source: https://valuestreamai.com/blog/ai-logging-observability-guide-2026
- category: ai
  title: REST vs GraphQL for LLM Backends — inference REST·app data GraphQL tier 분리
  summary: 'LLM tier와 application data tier는 API style을 분리하는 게 2026 production default다. LLM inference/chat/streaming/tool-calling — OpenAI-compatible REST+SSE가 ecosystem(LiteLLM·SDK·monitoring) 표준. GraphQL streaming·tool-calling integration은 custom·awkward. Application data(agent run history·tool config·dashboard) — GraphQL nested query·schema introspection(agent discoverability·token waste↓). Multi-agent internal — gRPC+bidi stream option. Anti-pattern: LLM+data를 single GraphQL endpoint에 conflate. SSE vs WebSocket(streaming UX) ·AI BFF(server-side key)와 complement — tier separation=protocol choice.'
  points:
  - LLM tier=OpenAI REST+SSE — SDK·LiteLLM·streaming native
  - App data tier=GraphQL — nested query·agent schema introspection
  - LLM+data single GraphQL conflate 금지
  source: https://ai-solutions.wiki/comparisons/rest-vs-graphql-ai/
- category: ai
  title: LLM Debug Mode Ladder — verbose→local trace→production observability
  summary: LLM/agent 디버깅은 단계적 visibility ladder가 효율적이다. L1 verbose(set_verbose) — 30초 setup, thought·tool·observation readable summary. L2 debug(set_debug) — full prompt string·raw LLM I/O, context window bloat catch. L3 local trace(Maida JSONL·llm-devproxy SQLite rewind) — step-through·loop guardrail·rewind branch, cloud 없음. L4 production(Langfuse·OTel trace) — persistent history·team collaboration·cost. AgentOps(time-travel prod) ·Codex Record & Replay(demo→skill)와 역할 분리 — ladder=dev-time 점진 escalation.
  points:
  - L1 verbose → L2 debug → L3 local trace(Maida/devproxy)
  - L4 production OTel/Langfuse — team·persistent
  - local trace rewind — mid-run branch without re-spend
  source: https://github.com/Maida-AI/maida
- category: ai
  title: LLM Correlation IDs — W3C traceparent·multi-agent·subagent propagation
  summary: 'Multi-agent·subagent·MCP tool chain에서 request correlation 없으면 incident debug가 impossible. W3C TraceContext traceparent header — service boundary마다 inject/extract, root span=用户 request, child=LLM call·tool·subagent. OpenTelemetry GenAI: gen_ai.operation.name chat/invoke_agent/execute_tool, tool_call_id explicit propagate(OpenInference message.tool_call_results). Custom correlation: X-Request-ID + X-Agent-Run-ID + X-Step-ID — log·metric·trace 3-signal join. subagent spawn 시 parent trace context inherit 필수 — orphan trace=blind spot. OpenTelemetry GenAI Semantic Conventions(spec) ·Datadog Agent Observability(LangGraph span)와 complement — correlation=propagation design.'
  points:
  - W3C traceparent — boundary inject/extract, parent-child hierarchy
  - tool_call_id propagate — OpenInference result correlation
  - subagent spawn parent context inherit — orphan trace 방지
  source: https://zylos.ai/research/2026-02-28-opentelemetry-ai-agent-observability/
- category: ai
  title: ADK+A2A Cross-Language Agents — LLM은 모호함, Go는 정책 검증
  summary: Google Developers Blog의 2026-06-22 튜토리얼은 Python ADK 에이전트와 Go A2A 서비스를 하나의 계약 컴플라이언스 파이프라인으로 묶는다. Python 쪽은 Gemini/ADK로 계약 내용을 추출하고, Go 쪽은 LLM 없이 HTTP+JSON-RPC A2A 서비스로 결정론적 정책 검증을 수행한다. 연결점은 A2A Agent Card(`/.well-known/agent.json`)와 ADK의 `RemoteA2aAgent`다. ADK는 원격 A2A 서비스를 로컬 sub-agent처럼 감싸고, `ToolContext.state`에 INGESTED·EXTRACTED·COMPLIANCE_PENDING·MANUAL_REVIEW 같은 체크포인트를 남긴다. 교훈은 멀티에이전트가 프롬프트 체인이 아니라 분산 시스템 설계라는 점이다. 애매한 추출은 LLM에게, 감사 가능한 정책 판정은 반복 가능한 코드에게 맡기면 언어·팀·배포 경계를 넘으면서도 테스트와 장애 대응이 쉬워진다.
  points:
  - A2A Agent Card + JSON-RPC로 Python 에이전트와 Go 검증 서비스를 연결
  - '`RemoteA2aAgent`가 원격 A2A 서비스를 ADK sub-agent처럼 래핑'
  - 장애 시 MANUAL_REVIEW 체크포인트로 전환 — 단일 거대 프롬프트보다 감사·복구 쉬움
  source: https://developers.googleblog.com/build-cross-language-multi-agent-team-with-google-agent-development-kit-and-a2a/
- category: ai
  title: Codex on Amazon Bedrock — OPENAI_API_KEY 없이 AWS 경계 안에서 쓰기
  summary: OpenAI는 2026-06-01 OpenAI frontier models와 Codex가 AWS에서 generally available이라고 발표했다. 핵심은 "Codex가 AWS에도 있다"가 아니라 provider path가 바뀐다는 점이다. OpenAI 개발자 문서에 따르면 Codex를 `amazon-bedrock` provider로 설정하면 OpenAI-hosted Responses API가 요청 경로에 없고, Codex가 Amazon Bedrock의 OpenAI-compatible Responses API 구현으로 모델 요청을 보낸다. 인증도 ChatGPT 로그인이나 `OPENAI_API_KEY`가 아니라 Bedrock API key 또는 AWS SDK credential chain(IAM, SSO, federated identity 등)을 쓴다. 그래서 이미 AWS로 보안·조달·감사·리전 관리를 하는 조직은 코딩 에이전트를 별도 SaaS 예외로 두지 않고 기존 클라우드 통제면 안에 넣을 수 있다. 단, 초기 구성은 commercial region의 Bedrock Mantle path만 다루며 GovCloud Mantle endpoint, Fast Mode, 일부 OpenAI-hosted cloud 기능은 지원되지 않는다.
  points:
  - '`model_provider = "amazon-bedrock"` 설정 시 OpenAI-hosted Responses API가 요청 경로에서 빠짐'
  - 인증은 Bedrock API key 또는 AWS SDK credential chain — ChatGPT 로그인/OPENAI_API_KEY 아님
  - '제약: commercial region Mantle path, Fast Mode와 일부 cloud-managed 기능 미지원'
  source: https://developers.openai.com/codex/amazon-bedrock
- category: ai
  title: Jules Eval — proactive coding agent는 '작업 완료'가 아니라 insight policy로 잰다
  summary: Google Labs의 2026-06-22 Jules 평가 글은 코딩 에이전트가 "요청받은 버그를 고쳤나"에서 "묻기 전에 중요한 신호를 찾았나"로 이동할 때 평가도 바뀌어야 한다고 주장한다. SWE-bench류는 좁은 태스크 완료를 재지만, proactive agent는 무엇이 중요한지, 근거가 충분한지, 개발자를 방해할지 말지를 고르는 insight policy를 봐야 한다. Google은 내부 코드베이스의 705개 버그와 1,178개 CL을 묶어 시간적으로 가깝고 의미적으로 유사한 버그 클러스터를 만들고, 각 클러스터를 상위 목표의 ground truth로 삼았다. 에이전트는 pre-fix 상태 코드베이스를 최대 3라운드 탐색한 뒤 insight를 내고, LLM judge가 1~5점과 Hit@K로 채점했다. 한 라운드에서도 평균 4.5/5 신호를 잡았지만, 복잡한 문제는 탐색 예산을 2→3라운드로 늘리자 Hit@5가 33%→57%로 회복됐다. 교훈은 장기 에이전트 평가에서 시간·컨텍스트·탐색 예산을 빼면 실제 개발 가치가 보이지 않는다는 점이다.
  points:
  - 평가 대상은 자율성 자체가 아니라 무엇을 보고·알리고·묻고·침묵할지 고르는 insight policy
  - 705 bugs·1,178 CL로 관련 버그 클러스터를 만들고 pre-fix 상태에서 proactive insight를 채점
  - 탐색 예산 2→3라운드에서 Hit@5 33%→57% — 긴 작업은 추가 조사 예산을 평가 변수로 둬야 함
  source: https://developers.googleblog.com/measuring-what-matters-with-jules/
- category: ai
  title: Multi-Agent Handoff Integration Testing — routing·context·return path 3-point assert
  summary: '멀티에이전트 버그의 대부분은 개별 agent eval이 아니라 handoff seam에서 발생한다 — coordinator가 잘못된 agent에 위임, context payload 누락, sub-agent 결과가 coordinator로 복귀하지 않음, deadlock·runaway loop. per-agent unit test는 이 실패를 보지 못한다. integration test는 delegation마다 3-point assert: (1) Routing — task가 expected agent type으로 갔는가 (2) Context Completeness — payload에 sub-agent가 필요한 필드가 있는가 (3) Return Path — sub-agent result가 coordinator state에 merge됐는가. handoff contract schema(API contract testing analog)로 input/output schema를 정의하고 E2E에서 contract chain 검증. hard wall-clock timeout + max handoff depth(3-5) + consistency test(N회 반복 success rate). agentevals(OTel trace gate) ·Claw-Eval(trajectory) ·Supervisor Agent(orchestration)와 complement — handoff=coordination seam test.'
  points:
  - Routing·Context·Return Path — delegation마다 3-point assert
  - handoff contract schema — microservices API contract testing analog
  - hard timeout + max depth + N-run consistency — stall·loop·flake catch
  source: https://qaskills.sh/blog/multi-agent-system-testing-guide-2026
- category: ai
  title: Agent Chaos Engineering — faultkit·agentfuzz·Khaos SDK boundary fault injection
  summary: LLM agent unit test는 seam이 정상이라고 가정한다 — tool timeout·malformed JSON·429 burst·schema drift·prompt injection은 production에서만 터진다. Agent chaos engineering은 SDK/API boundary에서 fault를 주입해 resilience를 CI 전에 검증한다. faultkit — single-shot CLI, localhost proxy+ephemeral CA, vendor-accurate 429/timeout/streaming cutoff, exit code로 CI gate. agentfuzz(Python) — ToolTimeout·MalformedToolResponse·SchemaDrift·CostSpiral·PromptInjection fault catalog, pass-rate per category 리포트. Khaos SDK — security+resilience eval pack, capability-aware attack selection, `khaos ci --resilience-threshold 70`. WireMock(stateful fault) ·LLM VCR(replay) ·AI Agent Error Handling(circuit breaker)와 역할 분리 — chaos=runtime seam break, mock=pre-backend contract.
  points:
  - faultkit/agentfuzz/Khaos — SDK/API boundary fault, infra chaos 아님
  - pass-rate per fault category — timeout vs JSON vs injection survival
  - CI gate — chaos replay trace로 regression set 축적
  source: https://faultkit.dev/
- category: ai
  title: LLM API Connection Pooling — httpx AsyncClient lifespan·http2·keepalive 120s
  summary: 'LLM API latency의 숨은 killer는 model inference가 아니라 connection churn이다. request마다 httpx.AsyncClient()를 새로 만들면 TCP+TLS handshake가 매 call 반복, file descriptor exhaustion(OSError 24)까지 간다. production 패턴: FastAPI lifespan에서 단일 shared AsyncClient 생성→app.state 또는 DI로 주입→shutdown에서 aclose(). httpx.Limits(max_connections=256, max_keepalive_connections=128, keepalive_expiry=120) — AI burst pattern(30-60s read gap)에 default 5-15s keepalive는 너무 짧다. http2=True — 20 concurrent call이 2-3 socket으로 multiplex. LangChain ChatOpenAI(http_client=shared) — library가 자체 pool 만들지 않게 explicit pass. Celery GPU worker ·LiteLLM proxy ·AI BFF와 complement — pool=client-side connection reuse design.'
  points:
  - request-per-client 금지 — lifespan shared AsyncClient 1개
  - keepalive_expiry=120s+ ·http2=True — burst gap·socket count↓
  - LangChain/LiteLLM에 http_client explicit pass — isolated pool 방지
  source: https://ezaiapi.com/blog/ai-api-connection-pooling-performance
- category: ai
  title: LLM SSE Backpressure — bounded queue·is_disconnected·X-Accel-Buffering no
  summary: 'LLM token SSE streaming은 producer(model)가 consumer(client)보다 빠르면 proxy buffer가 unbounded growth→OOM. backpressure 핵심: producer-consumer 사이 bounded asyncio.Queue(maxsize=32-128). queue full이면 producer가 upstream LLM read를 block→TCP flow control→model generation pause. client disconnect 시 await request.is_disconnected() per token으로 upstream abort — tab close 후에도 token burn 방지. infra: nginx proxy_buffering off + X-Accel-Buffering: no + CDN no-transform. 10K concurrent SSE는 connection당 ~13-15KB budget, 4GB container 8-10K ceiling. slow client는 trySend fail→disconnect rather than unbounded buffer. SSE vs WebSocket(streaming transport) ·AI BFF(streaming custody) ·Token Streaming Proxy(zero-buffer)와 complement — backpressure=memory-bounded fan-out design.'
  points:
  - bounded Queue 32-128 — full이면 upstream read block, end-to-end backpressure
  - is_disconnected() per token — client leave 시 upstream abort, token burn stop
  - proxy_buffering off ·4GB≈8-10K concurrent SSE memory budget
  source: https://mvpfactory.io/blog/streaming-llm-tokens-to-10k-concurrent-users-backpressure-coroutine-channels/
- category: ai
  title: AI Agent Graceful Shutdown — drain→checkpoint→503, terminationGracePeriod+10s
  summary: 'rolling deploy에서 SIGTERM 즉시 kill은 long-running agent turn을 mid-flight drop — user retry·duplicate side effect. 5-phase lifecycle: init→warmup→ready→drain→terminate. SIGTERM 시 readiness probe fail→new turn HTTP 503→in-flight turn은 drain_deadline_seconds까지 complete→deadline 초과 turn은 checkpoint(trace·tool results·memory delta) persist→exit 0. K8s terminationGracePeriodSeconds ≥ drain_deadline + 10s buffer — equality면 SIGKILL이 checkpoint interrupt. idempotency key(run_id+step_id+tool_call_id)로 resume 시 duplicate write 방지. vLLM drain mode(ServiceUnavailableMiddleware reject new) ·Agent Checkpoint spec ·LLM Idempotency Keys와 complement — shutdown=deploy-safe lifecycle contract.'
  points:
  - ready→drain→terminate — 503 new, in-flight bounded complete
  - deadline 초과 checkpoint — trace·tool·memory persist, resume token
  - terminationGracePeriod ≥ drain + 10s ·idempotency key resume safety
  source: https://geodocs.dev/ai-agents/agent-startup-shutdown-spec
- category: ai
  title: LLM Health Check Probes — startup/readiness/liveness 3-probe vLLM pattern
  summary: '/health는 process alive만 확인, model loaded 아님 — GPU page fault 후에도 liveness pass→broken pod에 traffic routing. K8s 3-probe pattern: startupProbe /v1/models (model-aware, 503 while loading, failureThreshold×period=max startup window) ·readinessProbe /v1/models (traffic routing gate) ·livenessProbe /health (process hang/CUDA deadlock detect). 70B model은 initialDelaySeconds 120-180s 필요 — 45s default는 premature restart 유발. vLLM /health/ready — execute_dummy_batch_async 1-token GPU forward pass, silent inference failure catch. LiteLLM proxy — /health/liveliness(container) ·/health/readiness(DB) ·/health(model API call). LLM Goodput SLO(quality+latency) ·AI deployment patterns(cold start) ·Graceful Shutdown(drain)와 complement — probe=traffic routing safety.'
  points:
  - startup+readiness=/v1/models ·liveness=/health — model-aware vs process-alive
  - 70B→120-180s startup window ·/health/ready GPU dummy forward
  - LiteLLM 3-tier — liveliness/readiness/model health 분리
  source: https://github.com/llm-d/llm-d/blob/main/docs/readiness-probes.md
- category: ai
  title: Agent Deadline Propagation — absolute deadline tree, per-step timeout 아님
  summary: 'agent timeout을 step마다 10s fixed로 주면 planner 4s + 3 tool×10s = 34s authorized against 6s user SLO — zombie request·token burn. latency budget은 line이 아니라 tree: critical path=longest root-to-leaf, sibling branch optimize는 zero effect. fix: request entry에서 absolute deadline(wall-clock timestamp, duration 아님) 생성→every LLM call·tool·sub-agent에 remaining budget propagate→node마다 check_or_raise→retry bounded by remaining budget not retry count. gRPC grpc-timeout header model — each hop subtracts elapsed, chain dies together. LangChain asyncio.wait_for·LangGraph env timeout은 local concern, propagation 없음 — custom Deadline context 필요. LLM Correlation IDs(trace join) ·Human-in-the-Loop Approval(timeout) ·AI Agent Error Handling(budget guardrail)와 complement — deadline=distributed time budget design.'
  points:
  - absolute deadline timestamp — duration per-step 금지, tree critical path
  - remaining budget propagate — sub-agent·tool·retry 모두 parent budget 차감
  - LangGraph/LangChain local timeout 한계 — custom Deadline context 필요
  source: https://tianpan.co/blog/2026-04-17-deadline-propagation-agent-chains-slo
- category: ai
  title: LLM Capacity Planning — concurrency-aware Little's Law, per-token naive 17-36× 오차
  summary: 'LLM inference capacity planning에서 per-token cost calculator는 arrival rate λ를 무시해 self-hosted cost를 17-36× underestimate한다 — GPU utilization naive Θmax 가정 vs 실제 arrival-limited idle. Little''s Law: in-flight concurrency L=λ×W(residence time)가 cost dominant term. concurrency-aware model: hardware+model+quantization+λ+SLO→effective cost-per-million-tokens. physics tools: kv-planner — roofline engine, memory waterfall(weights+KV+activations), size_fleet(target_rps, p99), calibrate from live vLLM load. llm-infra-planner — client-side VRAM/throughput/cost, TTFT/TPOT SLO slider. prefill=compute-bound·decode=memory-bandwidth-bound — batching strategy가 capacity curve shape 결정. KEDA autoscaling(queue depth) ·LLM Load Testing(TTFT soak) ·AI deployment patterns(serverless vs dedicated)와 complement — capacity=physics+λ grounded planning.'
  points:
  - per-token naive 17-36× underestimate — λ(concurrency)가 dominant cost term
  - kv-planner roofline — memory waterfall·size_fleet·calibrate from live traffic
  - prefill compute-bound ·decode bandwidth-bound — SLO별 batching curve
  source: https://arxiv.org/html/2606.11690v1
- category: ai
  title: Per-Request GPU Cost Attribution — gpu_time_share·DCGM·minute-bucket slicing
  summary: 'continuous batching GPU에서 per-request cost는 token count×flat rate가 아니다 — shared GPU time·utilization·power를 request별로 split해야 feature-level FinOps·capacity model이 가능. 3-signal join: (1) inference trace OTel span gpu_time_share (2) DCGM/NVML per-GPU utilization+power per minute (3) cloud instance $/GPU-hour. attributed_cost = gpu_time_share × (cost_per_gpu_hour/3600) × avg_utilization adjustment — thin batch idle period는 lower attributed cost. minute-bucket slicing — request가 10:01:45-10:02:30 span이면 각 minute bucket의 actual GPU metrics로 split. feature tag(trace attribute)로 agent step·tool·user tier별 cost rollup. LLM API 비용 최적화(routing·cache 4-layer) ·LLM Goodput SLO(quality+latency+cost) ·LLM Data Flywheel(production trace)와 complement — attribution=shared GPU cost split design.'
  points:
  - gpu_time_share × DCGM utilization × $/hr — continuous batching cost split
  - minute-bucket slicing — cross-minute request correct GPU metrics
  - feature tag rollup — agent step·tool·user tier별 FinOps
  source: https://last9.io/blog/every-token-has-a-price-per-request-gpu-cost-attribution/
- category: ai
  title: Agent Structural Coverage Testing — typed coordination graph 4 criteria, arxiv 2026
  summary: 'agent E2E eval은 output quality만 본다 — declared coordination structure(delegation path·tool-access rule·restricted tool edge)가 test에서 exercise됐는지 증거 없음. structural coverage model: typed multi-agent coordination graph에서 4 criteria — (1) reachable agents (2) allowed tool edges (3) restricted tool edges (4) delegation edges. coverage-driven generation: graph에서 structural witness objective 추출→DSPy로 natural-language scenario synthesize→runtime witness로 obligation covered 확인. OpenAI Agents SDK customer_service workflow benchmark: 54/75 allowed-tool·36/48 delegation obligations witnessed, 23/248 restricted-call violations detected. promptfoo(assertion eval) ·Multi-Agent Handoff Integration(handoff seam) ·Inspect AI(sandbox eval)와 complement — structural=graph adequacy, E2E=semantic quality.'
  points:
  - 4 criteria — agents·allowed tools·restricted tools·delegation edges covered
  - graph→witness objective→scenario — structural meaning fixed, LLM realizes NL
  - restricted-tool violations — misrouting concrete failure separate from output pass
  source: https://arxiv.org/html/2605.26521v1
