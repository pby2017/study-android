  title: DeepSeek-V4 — 1.6T MoE(49B 활성), CSA+HCA로 KV캐시 90% 절감·1M 컨텍스트·FP4 MoE(MIT)
  summary: 'DeepSeek-V4는 2026-04 출시된 차세대 MoE 모델이다. V4-Pro(1.6T/49B 활성)와 V4-Flash(284B/13B 활성) 2종. CSA(Compressed Sparse Attention)+HCA(Heavily Compressed Attention) 하이브리드로 1M 토큰 컨텍스트에서 V3.2 대비 KV캐시 90% 절감, 추론 FLOPs 73% 감소. mHC(Manifold-Constrained Hyper-Connections)로 잔차 연결 개선, Muon 옵티마이저로 32T+ 토큰 학습 안정화. MoE 전문가 FP4+나머지 FP8 혼합 정밀도. Non-think/Think High/Think Max 3단계 추론 모드. GPQA Diamond 94.3%, SWE Verified 80.6%. GB200 NVL72에서 150+ tok/s/user.

    '
