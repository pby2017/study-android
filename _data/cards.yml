  - Project must be open in Xcode — XPC requires live IDE process
  - External agent BYO — Claude Code·Codex·Cursor same MCP surface
  - CI headless — use xcodebuild not mcpbridge, bridge is dev-machine only
  source: https://developer.apple.com/documentation/xcode/giving-external-agents-access-to-xcode
- category: ai
  level: "중급"
  title: Codex Remote — Android 휴대폰은 조종기, 실행은 연결된 컴퓨터에서
  summary: ChatGPT Android 앱의 Codex에서 연결된 Mac·Windows 호스트의 작업을 시작하거나 이어서 지시하고, 변경 사항을 확인하거나 필요한 동작을 승인할 수 있다. 휴대폰은 인터페이스이고 코드·파일·터미널·도구는 연결된 호스트 환경에서 동작한다. 따라서 호스트가 켜져 있고 온라인 상태이며 데스크톱 앱이 실행 중이어야 한다. 절전·앱 종료·네트워크 끊김 시 연결도 중단된다. 이는 휴대폰에서 코드를 직접 실행하는 기능이나 항상 실행되는 클라우드 VM과 다르다.
  points:
  - 최신 ChatGPT 앱에서 호스트가 표시한 QR 코드를 스캔해 휴대폰과 컴퓨터를 연결
  - 연결한 호스트의 프로젝트·자격 증명·플러그인·로컬 도구를 사용하며 기존 sandbox와 승인 규칙은 유지
  - 상시 접속이 필요하면 깨어 있는 전용 컴퓨터나 원격 개발 환경을 호스트로 고려
  source: https://learn.chatgpt.com/docs/remote-connections
  interview: "Codex Remote를 Android 앱에서 사용하면 코드와 명령은 휴대폰과 연결된 컴퓨터 중 어디에서 실행되며, 연결이 끊기는 조건은 무엇인가요?"
  answer: "휴대폰은 요청·승인·결과 확인을 위한 원격 조종기다. 코드와 명령은 연결된 Mac·Windows 호스트 또는 그 호스트가 연결한 원격 개발 환경에서 실행된다. 호스트가 절전 상태가 되거나 네트워크를 잃거나 데스크톱 앱을 닫으면 원격 접속이 멈춘다."
- category: ai
