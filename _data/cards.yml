  title: KAN — Kolmogorov-Arnold Networks, MLP 대신 엣지에 학습 가능 활성함수(ICLR 2025 Oral)
  summary: 'KAN(Liu et al., ICLR 2025 Oral)은 MLP의 고정 노드 활성함수 대신 엣지(가중치)에 스플라인으로 파라미터화된 1D 함수를 배치한다. Kolmogorov-Arnold 표현정리 영감, 동일 정확도에 더 작은 KAN·더 빠른 neural scaling law. 과학 ML·함수 근사·PDE·기호 회귀에서 MLP 대비 우수, 해석 가능성(시각화·인간 협업). 단점: 학습 느림, PolyKAN·G-KAN 등 하드웨어 가속 연구 중. MLP 레이어 drop-in 대체로 CNN·RNN·Transformer에 적용 가능.'
  points:
  - '엣지 활성함수: 선형 weight matrix 없음, 스플라인 1D 함수'
  - 'ICLR 2025 Oral: AI+Science에서 물리·수학 법칙 재발견 사례'
  - '2026 연구: CKAN(Conv+KAN), PDE·시계열·continual learning 확장'
  source: https://arxiv.org/abs/2404.19756
- category: ai
  title: Mixture of Agents(MoA) — 다층 LLM 협업으로 GPT-4o 능가, AlpacaEval 2.0 65.1%(ICLR 2025)
  summary: 'MoA(Wang et al., ICLR 2025)는 추론 시 여러 LLM을 계층(layer)으로 배치해 proposer가 후보 생성→aggregator가 통합하는 프레임워크다. 파인튜닝 없이 프롬프트만으로 동작. 오픈소스만으로 AlpacaEval 2.0 65.1%(GPT-4o 57.5%), Arena-Hard·MT-Bench·FLASK SOTA. MoA-Lite(2층·Qwen-72B aggregator)도 GPT-4o 상회. 2025 후속: Self-MoA(단일 top 모델 다중 샘플이 mixed MoA보다 6.6%p 우수), RMoA(residual+다양성 선택), Attention-MoA(에이전트 간 semantic attention).'
  points:
  - '3층 6-agent: Qwen-110B aggregator + 이종 proposer 혼합'
  - 'Self-MoA: 단일 강력 모델 다중 출력이 이종 혼합보다 나을 수 있음'
  - 'RMoA: ResNet식 residual로 cross-layer 정보 보존, ACL 2025'
  source: https://arxiv.org/abs/2406.04692
- category: ai
  title: RWKV-7 Goose — O(n) 선형시간·KV캐시 없는 RNN, Dynamic State Evolution(ICML 2025)
  summary: 'RWKV-7 "Goose"(2025, ICML)는 generalized delta rule로 벡터값 게이팅·in-context learning rate를 도입한 100% RNN LLM 아키텍처이다. O(n) 시간·O(d²) 상수 메모리(KV캐시 불필요), Transformer급 병렬 학습 가능. Mamba-2(TC0)와 달리 TC0 초월 expressiveness, 3B에서 MMLU 61.2(vs LLaMA-3.2 3B 63.4). 100K+ ctx·엣지 추론·다국어에 강점. BlinkDL/RWKV-LM GitHub, ChatRWKV 데모. v4→v7 진화: WKV→multi-head→data-dependent decay→dynamic state evolution.'
  points:
  - 'KV캐시 제로: 토큰당 일정 메모리, 무한 ctx_len 이론적 가능'
  - 'Mamba-2 대비: 벡터값 decay로 채널별 선택적 상태 업데이트'
  - 'Pile 3B PPL 9.6: Transformer 9.8·RWKV-6 9.9 대비 개선'
  source: https://arxiv.org/abs/2503.14456
- category: ai
  title: Differential Transformer — 두 softmax attention 차분으로 노이즈 제거, Microsoft ICLR 2025
  summary: 'Microsoft Diff Transformer(ICLR 2025)는 Q/K를 두 그룹으로 나눠 두 softmax attention map의 차분을 attention score로 사용한다. 공통모드 노이즈 상쇄(노이즈 캔슬링 헤드폰 유사), sparse attention 유도. 장문 컨텍스트·핵심 정보 검색·할루시네이션 완화·in-context learning 순열 강건성 향상. FlashAttention 호환. Diff V2(2025): GQA 그룹 내 query head 2배, 커스텀 커널 불필요, 디코딩 속도 baseline Transformer 동급, attention sink 제거.'
  points:
  - 'Differential attention: Attn = softmax(Q1K1) − λ·softmax(Q2K2)'
  - '할루시네이션↓: irrelevant context에 대한 over-attention 완화'
  - 'Diff V2: KV head 불변, 디코딩 memory-bound에서 속도 parity'
  source: https://arxiv.org/abs/2410.05258
