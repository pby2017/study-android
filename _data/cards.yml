    points:
      - "프리미엄 리퀘스트 → 토큰 기반 'AI 크레딧' 사용량 과금(2026-06-01)"
      - "구독료는 유지·측정 단위만 변경 → 에이전트 헤비 유저 비용 변동성↑"
      - "신규 'Copilot Max' 티어 추가, 코드 리뷰는 Actions 분도 소모"
    source: "https://github.blog/changelog/2026-06-01-updates-to-github-copilot-billing-and-plans/"
  - category: ai
    title: "Anthropic, '코드의 80%를 Claude가 쓴다' — 그리고 API 에러 800건을 자율로 고친 사례"
    summary: >
      Anthropic은 2026년 5월에 자사가 머지한 코드의 80% 이상을 Claude가 작성했다고 밝혔다. 대표 사례로, 한 엔지니어가 Claude를 붙여 끈질긴 API 에러군에 대해 800건 넘는 수정을 자율로 내보내 에러율을 1,000분의 1로 줄였다(엔지니어는 일감 선택·리뷰·머지 결정으로 루프 안에 남았다). 사양이 처음부터 명확하지 않은 가장 열린 사내 엔지니어링 과제에서의 성공률도 5월 76%로 6개월 만에 50%p 올랐다고 한다. 다만 보도는 '80% 작성·76% 성공'이 곧 '안전·유지보수·머지 가능'을 뜻하진 않는다고 분명히 선을 긋는다.
    points:
      - "2026-05 머지 코드의 80%+를 Claude가 작성(Anthropic 주장)"
      - "엔지니어 1명이 Claude로 API 에러 800+건 자율 수정, 에러율 1/1000"
      - "'작성 비중·성공률'이 코드 품질·머지 적합성을 보장하진 않음(보도 명시)"
    source: "https://winbuzzer.com/2026/06/05/claude-writes-80-of-anthropic-code-raising-review-stakes-xcxwbn/"
  - category: ai
    title: "AGENTS.md는 정말 도움이 되나 — 실제 PR 124건으로 잰 '시간·토큰' 실증 연구(arXiv 2026)"
    summary: >
      에이전트 지침 파일 AGENTS.md를 두면 정말 빨라지는지를 실제 머지된 GitHub PR로 처음 정량 측정한 arXiv 연구다. 10개 레포·124개 PR을 골라 코드를 머지 직전 상태로 되돌린 뒤, AGENTS.md 유무만 다르게 해 OpenAI Codex(gpt-5.2-codex)를 도커에서 동일 조건으로 돌려 비교했다. 결과 AGENTS.md가 있을 때 실행 시간 중앙값이 약 28.6%(98.6s→70.3s) 줄고 출력 토큰 중앙값도 약 16.6% 감소했으며, 둘 다 통계적으로 유의했다. 다만 입력 토큰 중앙값은 거의 그대로였고, 토큰 절감은 '소수의 고비용 실행'에서 주로 나왔다. 정답 여부(정확성)는 50건 샘플로 '비어있지 않은 코드 변경'만 확인했을 뿐 본격 평가는 후속 과제로 남겼다.
    points:
      - "10레포·124 PR을 페어 설계로 비교(AGENTS.md 유무만 차이)"
      - "실행 시간 중앙값 ≈ -28.6%, 출력 토큰 중앙값 ≈ -16.6%(유의)"
      - "절감은 '소수 고비용 실행'에 집중, 정확성 평가는 후속 과제"
    source: "https://arxiv.org/html/2601.20404v2"
  - category: ai
    title: "코딩 에이전트 7종 MCP 클라이언트 보안 비교 — '버그'가 아니라 '구조'가 뚫린다(arXiv 2026)"
    summary: >
      'AI 개발 도구는 프롬프트 인젝션에 면역인가'를 묻는 arXiv 연구가 MCP 클라이언트 7종(Claude Desktop, Claude Code, Cursor, Cline, Continue, Gemini CLI, Langflow)을 적대적으로 비교 테스트했다. Cursor(1.6.45)는 네 가지 공격이 모두 통해 가장 취약했고, Claude Code(2.0.25)는 '낮음~중간' 위험으로 결과가 갈렸다. 핵심 결론은 대부분의 취약점이 구현 버그가 아니라 '신뢰 모델·검증 계층 부재·샌드박싱 부재' 같은 근본 아키텍처 결정에서 나온다는 것 — LLM이 명령과 데이터를 같은 경로로 읽어 둘을 완벽히 구분하지 못하기 때문이다. 따라서 보안은 사후 추가가 아니라 설계 단계부터 넣어야 한다고 못박는다.
    points:
      - "MCP 클라이언트 7종 적대 테스트: Cursor가 4개 공격 모두 통과(최취약)"
