  - 프록시 지원(환경변수 또는 설정파일), provider 목록은 별도 문서 제공
  source: https://github.com/aandrew-me/tgpt
- category: ai
  title: 'Gorilla CLI: 목표를 영어로 말하면 실행할 명령 후보를 제안'
  summary: '"powers your command-line interactions with a user-centric tool" — 하려는 일을 평문으로 적으면 여러 LLM이 후보 명령을 만들어 화살표로 골라 실행. ~1500개 API(Kubernetes·AWS·GCP·Azure·GitHub 등). Apache-2.0.

