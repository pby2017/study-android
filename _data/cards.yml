  title: code2prompt + files-to-prompt — 코드베이스를 LLM 컨텍스트로 포장하는 두 방식
  summary: 'code2prompt와 files-to-prompt는 모두 디렉터리 파일을 LLM에 넣기 좋은 한 덩어리로 만드는 context engineering 도구라 별도 카드로 두기보다 비교 카드가 더 유용하다. code2prompt는 Rust 기반으로 소스트리, Handlebars 템플릿, 토큰 카운트, Git diff/log/브랜치 비교, TUI, MCP 서버까지 제공해 "코드베이스를 분석 가능한 프롬프트 패키지"로 만드는 쪽에 가깝다. files-to-prompt는 Simon Willison의 단순한 Python CLI로 상대경로 헤더와 파일 내용을 이어붙이고 Claude XML/Markdown 출력, 확장자·gitignore·NUL 입력 필터를 제공한다. 큰 저장소 분석은 code2prompt, 빠른 파일 묶음 전달은 files-to-prompt가 맞다.

    '
  points:
  - 'code2prompt: 템플릿·토큰·Git 컨텍스트·MCP까지 포함한 구조화 패키징'
