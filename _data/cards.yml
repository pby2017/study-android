  points:
  - "Routines: Anthropic 관리 클라우드에서 일정·API 요청·GitHub 이벤트로 실행"
  - "Desktop 예약 작업: 데스크톱 앱이 로컬 머신에서 실행 / GitHub Actions: 저장소 CI 이벤트·cron과 통합"
  - "`/loop`: 열린 CLI 세션 안에서 반복 확인; 세션이 종료되거나 클라우드 환경이 만료되면 이어지지 않을 수 있음"
  source: https://code.claude.com/docs/en/common-workflows
  interview: "컴퓨터가 꺼져도 실행되어야 하는 작업과 로컬 미커밋 파일에 접근해야 하는 작업은 각각 어떤 방식이 적합한가요?"
  answer: "컴퓨터가 꺼져도 실행하려면 클라우드 Routines, 로컬 미커밋 파일이 필요하면 내 머신에서 도는 Desktop 예약 작업이 적합하다. `/loop`는 열린 CLI 세션의 반복 작업이다."
- category: ai
  level: "초급"
  title: Claude Code 스킬 인자 — 전체 문자열과 위치별 값 나누기
  summary: "스킬은 호출 뒤의 입력을 `$ARGUMENTS`로 전체 문자열 그대로 받거나, `$0`·`$1` 또는 `$ARGUMENTS[N]`으로 위치별 값으로 받는다. 어떤 인자 자리도 값을 받지 않으면 Claude Code가 `ARGUMENTS: ...`를 본문 끝에 붙인다."
  points:
  - "`$0`은 첫 인자, `$1`은 두 번째; 여러 단어를 한 값으로 전달하려면 따옴표로 감쌈"
  - "`arguments` frontmatter에 이름을 선언하면 `$issue`처럼 이름으로 참조 가능"
  - "위치 인자가 없는 `$2`는 그대로 남지만, 선언된 이름 인자는 값이 없으면 빈 문자열이 됨"
  source: https://code.claude.com/docs/en/slash-commands
  interview: "`$ARGUMENTS`와 `$0`은 어떻게 다르며, 호출에 인자를 전달했는데 템플릿에 인자 자리가 없으면 어떻게 되나요?"
  answer: "`$ARGUMENTS`는 전체 입력 문자열을 받고 `$0`은 첫 번째 위치 인자만 받는다. 어떤 인자 자리도 값을 받지 않으면 Claude Code가 `ARGUMENTS: <입력>`을 본문 끝에 추가한다."
- category: ai
  level: "중급"
  title: Claude Code 서브에이전트 — 반복 지시와 도구 범위를 재사용하기
  summary: 반복해서 맡기는 작업은 `.claude/agents/`의 마크다운 파일로 정의할 수 있다. YAML frontmatter의 `name`과 `description`은 필수이며, 본문은 서브에이전트의 시스템 프롬프트가 된다. 별도 컨텍스트에서 작업하고 요약을 돌려줘 주 대화의 탐색 로그를 줄인다.
  points:
  - 프로젝트 정의는 저장소와 팀에 공유; `~/.claude/agents/` 정의는 내 모든 프로젝트에서 사용
  - "`tools`로 허용 도구를 지정할 수 있음; 생략하면 서브에이전트에서 사용 가능한 도구를 상속"
  - "`description`은 위임 시점을 설명; `/agents`는 현재 가이드이며, 예전 대화형 생성 마법사는 v2.1.197 이하"
  source: https://code.claude.com/docs/en/sub-agents
  interview: "서브에이전트 frontmatter에서 `tools`를 생략하면 도구 권한은 어떻게 되며, `description`은 왜 중요한가요?"
  answer: "생략하면 서브에이전트에 제공되는 도구를 상속한다. Claude는 `description`을 보고 언제 작업을 위임할지 판단하므로, 역할 이름보다 사용 조건을 분명히 적어야 한다."
- category: ai
  level: "중급"
  title: Claude Code `@` 참조 — 컨텍스트 주입과 훅 경계
  summary: 프롬프트에서 `@경로`를 쓰면 파일 내용을 직접 대화에 넣고, 디렉터리는 파일 목록만 넣는다. 파일 전체가 항상 들어오는 것은 아니다. Read 도구 토큰 한도(기본 25,000)와 256KB 텍스트 파일 제한이 적용된다.
  points:
  - "파일 참조는 파일의 디렉터리와 상위 디렉터리의 `CLAUDE.md`도 컨텍스트에 추가한다; 디렉터리 참조는 목록만 보여준다."
  - "`@` 파일 삽입은 도구 호출이 아니므로 `PreToolUse` 훅이 실행되지 않는다. 민감 경로는 `Read` 거부 규칙으로 막거나 file mentions를 비활성화한다."
  - "상대·절대 경로, 여러 파일, MCP 리소스(`@server:resource`)를 참조할 수 있다."
  source: https://code.claude.com/docs/en/common-workflows
  interview: "민감한 파일을 `@경로`로 참조할 때 `PreToolUse` 훅만으로 읽기를 막을 수 있나요?"
  answer: "아니다. `@`가 파일을 직접 컨텍스트에 넣을 때는 도구 호출이 없어 해당 훅이 실행되지 않는다. `Read` 거부 규칙을 사용하거나 `CLAUDE_CODE_DISABLE_FILE_MENTIONS=1`로 직접 포함을 막아야 한다."
- category: ai
  level: "중급"
  title: 원격 MCP OAuth — 로그인 요구와 토큰 폐기를 구분하기
  summary: 원격 HTTP MCP 서버는 OAuth 2.0 로그인을 지원한다. 처음 인증이 필요한 서버가 `401` 또는 `403`을 반환하면 `/mcp`에서 로그인할 수 있지만, 직접 설정한 Authorization 헤더가 거부되면 OAuth 로그인 대신 연결 실패로 표시된다.
  points:
  - "등록은 `claude mcp add --transport http <name> <url>`; OAuth 로그인은 `/mcp` 또는 `claude mcp login <name>`으로 시작한다."
  - "저장된 refresh token이 있으면 만료 시 자동 갱신 후 한 번 재시도한다. 401/403만으로 언제나 OAuth 화면이 뜨는 것은 아니다."
  - "`/mcp`의 Clear authentication은 로컬 자격 증명을 지운다. 서버에서 토큰을 폐기하려면 지원되는 경우 `claude mcp logout <name>`을 먼저 실행한다."
  source: https://code.claude.com/docs/en/mcp
  interview: "MCP 서버를 제거하면 OAuth 토큰도 발급 서버에서 자동 폐기되나요?"
  answer: "아니다. 제거는 Claude Code에 저장된 토큰과 클라이언트 등록을 삭제하지만 발급 서버의 토큰은 폐기하지 않는다. 서버가 지원하면 제거 전에 `claude mcp logout <name>`을 실행한다."
- category: ai
  level: "초급"
  title: Claude Code `--from-pr` — PR에 연결된 세션 다시 찾기
  summary: Claude Code가 만든 PR 또는 작업한 기존 PR과 연결된 세션은 `claude --from-pr <번호>`로 세션 선택기에서 찾을 수 있다. 이 옵션은 PR을 새로 만들거나 병합하지 않고, 연결된 작업 대화를 찾는 진입점이다.
  points:
  - "Claude가 `gh pr create` 또는 `glab mr create`로 PR/MR을 만들거나, 기존 PR 작업을 하면 세션이 연결된다."
  - "`claude --from-pr <번호>`는 해당 PR과 연결된 세션으로 선택기를 필터링한다. PR URL은 `/resume` 검색에도 사용할 수 있다."
  - "백그라운드 세션 상태와 PR 연결을 한 화면에서 보려면 `claude agents`를 사용한다."
  source: https://code.claude.com/docs/en/common-workflows
  interview: "`claude --from-pr 123`은 PR을 생성하거나 곧바로 병합하나요?"
  answer: "아니다. 해당 PR과 연결된 Claude Code 세션을 찾도록 세션 선택기를 필터링한다. PR 생성·병합은 별도 작업이다."
- category: ai
  level: "중급"
  title: Claude Code `--json-schema` — 구조화 출력의 부재도 검사하기
  summary: "`claude -p`에서 `--output-format json --json-schema`를 함께 쓰면 응답의 `structured_output`에 구조화 결과가 담긴다. 단, 거절 등으로 유효한 결과가 없으면 이 필드가 없을 수 있으므로 자동화 코드는 먼저 존재 여부를 확인해야 한다."
  points:
  - "JSON 응답의 `result`와 메타데이터 외에 스키마 결과는 `structured_output`에 들어온다."
  - "잘못된 JSON Schema는 실행 전 오류가 된다. 단, `format` 키워드는 형식 검증을 강제하지 않고 주석으로 취급한다."
  - "소비 코드에서 `structured_output` 존재 여부를 확인하고, 없으면 명시적 실패로 처리한다."
  source: https://code.claude.com/docs/en/headless
  interview: "응답이 유효한 JSON인데 `structured_output`이 없을 수 있나요? 자동화 코드는 어떻게 처리해야 하나요?"
  answer: "그렇다. Claude가 요청을 거절하는 등 유효한 구조화 출력이 없으면 필드 자체가 빠진다. 소비 전에 필드 존재를 확인하고, 없으면 성공 데이터로 취급하지 말아야 한다."
- category: ai
  level: "중급"
  title: 멀티에이전트 리서치 — 병렬화 이득과 토큰 비용을 함께 보기
  summary: 리드 에이전트가 질문을 독립된 조사 과제로 나누고, 서브에이전트가 별도 컨텍스트에서 병렬 탐색한 뒤 결과를 종합하는 오케스트레이터-워커 패턴이다. Anthropic은 내부 리서치 평가에서 이 구성이 단일 Opus 4보다 90.2% 높았다고 보고했지만, 이는 특정 내부 평가의 결과이지 일반적인 성능 보장이 아니다.
  points:
  - "적합: 여러 독립된 방향을 폭넓게 조사하거나 단일 컨텍스트보다 많은 정보를 다룰 때. 에이전트마다 목표·도구·출력 형식·경계를 분명히 나눈다."
  - "비용: Anthropic 보고에서 멀티에이전트는 일반 채팅보다 약 15배의 토큰을 사용했다. 과제 가치가 추가 비용을 정당화하는지 판단한다."
  - "부적합할 수 있음: 같은 맥락을 공유해야 하거나 작업 간 의존이 큰 경우. Anthropic은 대부분의 코딩 작업에서 병렬화할 부분이 적다고 지적한다."
  source: https://www.anthropic.com/research/multi-agent-research-system
  interview: "멀티에이전트가 단일 에이전트보다 항상 좋은가요? 어떤 과제와 비용을 비교해야 하나요?"
  answer: "아니다. 독립된 탐색이 많고 정보량이 큰 과제에서 병렬화가 유리할 수 있지만, 조정 비용과 토큰 사용량이 커진다. 공유 맥락과 의존성이 큰 작업은 단일 에이전트가 더 적합할 수 있다."
- category: ai
  level: "중급"
  title: Claude Code 리뷰 — 작성 맥락을 모르는 검토자에게 기준을 주기
  summary: 구현한 세션이 “완료”라고 말한 것만으로 검증을 끝내지 않는다. `/code-review`는 작성 대화를 보지 않은 새 서브에이전트가 diff를 검토하게 한다. 더 구체적인 검토가 필요하면 요구사항 문서와 경계 사례를 기준으로 지시한다.
  points:
  - "검토자에게 구현 대화의 추론 대신 diff를 독립적으로 보게 하면 작성자의 설명에 끌리지 않는 검토가 가능하다."
  - "요구사항 검토는 spec을 기준으로 누락과 경계 사례를 확인하고, 스타일 지적은 제외하도록 범위를 지정한다."
  - "검토 결과를 모두 자동 수정하지 않는다. 실제 정확성에 영향을 주는 문제인지 확인한 뒤 반영한다."
  source: https://code.claude.com/docs/en/best-practices
  interview: "구현 세션의 자기 검토와 새 서브에이전트 리뷰는 무엇이 다르며, 리뷰 지시에는 무엇을 포함해야 하나요?"
  answer: "새 서브에이전트는 구현 대화를 보지 않아 작성자의 추론에 덜 끌린다. diff와 요구사항·경계 사례를 주고 정확성에 영향을 주는 누락을 보게 하며, 스타일 지적은 제외할 수 있다."
- category: ai
  level: "중급"
  title: Cursor 모델 선택 — 작업 난이도와 과금 경로를 함께 보기
  summary: Cursor Agent는 지침·도구·모델이 함께 동작한다. 모델은 작업의 추론 난이도뿐 아니라 현재 플랜에서의 사용 가능 여부와 비용 경로로 고른다. 간단한 반복 작업에는 빠른 모델을, 복잡한 다중 파일 변경에는 더 강한 모델을 고려하되 실제 사용량과 결과를 확인한다.
  points:
  - "Cursor 모델과 제3자 모델은 사용량 풀이 다르다. 제3자 모델은 지원 플랜에서 API 가격 기준으로 별도 선불 크레딧을 사용한다."
  - "Auto의 Cost·Balance·Intelligence 모드는 라우팅·과금 방식이 다르며 이용 가능한 모드는 플랜에 따라 다르다."
  - "모델 목록·가격·플랜 조건은 바뀔 수 있다. 작업별 품질과 사용량을 확인하고 선택을 갱신한다."
  source: https://cursor.com/docs/models-and-pricing
  interview: "Cursor에서 제3자 모델을 선택하면 Cursor 자체 모델 사용량과 같은 풀에서 차감되나요? 모델 선택 시 무엇을 확인해야 하나요?"
  answer: "아니다. 제3자 모델은 지원 플랜에서 API 가격 기준 크레딧을 사용하고 Cursor 자체 모델 풀과 다르다. 작업 난이도와 플랜별 사용 가능 여부, 현재 과금 경로를 확인한다."
- category: ai
  level: "중급"
  title: Claude Agent SDK 과금 — 로그인 방식에 따라 구독 한도와 API 크레딧 구분
  summary: Anthropic은 2026년 6월 예고한 Agent SDK 과금 변경을 중단했다. Claude 계정으로 로그인해 쓰는 Agent SDK와 `claude -p`는 현재도 구독 한도에서 차감된다. 단, 연결된 Claude Console 조직의 API 키로 직접 실행하면 대상 플랜의 월별 API 크레딧을 쓸 수 있다.
  points:
  - "계정 로그인: SDK와 `claude -p`는 Claude 플랜 한도에 포함된다. API 키 기반 월 크레딧은 적용되지 않는다."
  - "Console API 키: Max·Ultra는 월 $100·$200, Team은 Standard 좌석당 $20·Premium 좌석당 $100(팀 최대 $500) 크레딧을 연결된 조직에서 공유한다."
  - "API 크레딧은 Agent SDK와 직접 실행한 `claude -p`에 적용된다. 대화형 Claude Code, GitHub Action·IDE·Desktop에서 시작한 실행은 적용 대상이 아니다."
  - "구분 기준은 명령의 대화형 여부가 아니라 인증 경로와 실행 주체다. 플랜·자격 조건은 바뀔 수 있으니 실행 전에 공식 안내를 확인한다."
  source: https://support.claude.com/en/articles/15036540-use-the-claude-agent-sdk-with-your-claude-plan
  interview: "Claude 계정 로그인으로 실행한 `claude -p`와 Console API 키로 실행한 경우는 어떤 과금 경로 차이가 있나요?"
  answer: "계정 로그인은 Claude 플랜의 사용 한도에서 차감되며 월별 Console API 크레딧은 쓰지 않는다. 연결된 Console 조직의 API 키로 직접 실행하면 해당 조직의 크레딧이 먼저 적용될 수 있다."
- category: ai
  level: "중급"
  title: Firecrawl MCP — 검색·스크랩·크롤링의 쓰임을 나누기
  summary: Firecrawl MCP는 웹 검색 결과나 URL을 에이전트가 읽기 쉬운 Markdown·구조화 데이터로 가져오는 도구다. 2026-11-22 기준 GitHub 저장소는 약 7.9k★다. 같은 제품군이라도 시작점과 범위에 따라 도구를 고른다.
  points:
  - "검색어에서 시작하면 `firecrawl_search`, URL 하나를 읽으면 `firecrawl_scrape`, 사이트의 URL 목록을 찾으면 `firecrawl_map`을 쓴다."
  - "여러 페이지 내용을 가져올 때는 범위를 제한해 `firecrawl_crawl`을 쓴다. 페이지에 로그인·클릭 등 상호작용이 필요하면 `firecrawl_interact`를 고려한다."
  - "호스팅 키리스는 일일 한도 안에서 Search·Scrape·Parse만 제공한다. OAuth 로그인이나 API 키 연결은 플랜·팀 정책에 따라 전체 도구를 제공한다."
  - "검색 결과 전문을 한 번에 가져오면 결과마다 스크랩 과금이 발생할 수 있다. 먼저 검색하고 필요한 URL만 읽어 비용과 입력량을 통제한다."
  source: https://github.com/firecrawl/firecrawl-mcp-server
  interview: "검색어만 알고 있는 경우와 읽을 URL을 알고 있는 경우, Firecrawl MCP에서 각각 어떤 도구를 고르며 비용은 어떻게 통제하나요?"
  answer: "검색어면 `firecrawl_search`, URL을 알면 `firecrawl_scrape`를 쓴다. 우선 검색 결과만 받은 뒤 필요한 URL만 스크랩하고, 여러 페이지 작업은 크롤 범위를 제한한다."
- category: ai
  level: "중급"
  title: llms.txt — 문서 탐색 제안이지 Google AI 검색 최적화는 아니다
  summary: llms.txt는 웹사이트가 에이전트에 배경 정보와 관련 문서 링크를 제공하자는 Markdown 제안이다. 보편적으로 자동 소비되는 웹 표준은 아니다. Google Search는 일반 검색뿐 아니라 AI 검색에서도 이 파일을 사용하지 않으며, 검색 노출에 도움이나 불이익을 주지 않는다고 명시한다.
  points:
  - "제안된 형식은 H1 제목, 짧은 요약, 추가 설명, H2별 링크 목록이다. 사이트 전체가 아니라 하위 경로를 위한 `/docs/llms.txt`도 둘 수 있다."
  - "`## Optional`은 보조 링크를 모으는 관례일 뿐, v2에서 파서가 생략해야 한다는 특별한 의미는 없다."
  - "Google 검색 노출을 위해 파일을 만들 필요는 없다. 다른 도구가 이를 읽는지는 해당 도구의 지원 여부를 확인한다."
  sources:
  - label: llms.txt 제안 v2
    url: https://llmstxt.org/
  - label: Google AI 검색 안내
    url: https://developers.google.com/search/docs/fundamentals/ai-optimization-guide
  interview: "사이트에 `/llms.txt`를 추가하면 Google AI 검색에서 더 잘 노출되나요? 파일의 `Optional` 섹션은 반드시 생략되나요?"
  answer: "아니다. Google Search는 이를 사용하지 않고 검색 노출에 영향을 주지 않는다. `Optional`은 보조 링크 관례이며 v2에서 기계적으로 생략하라는 의미가 아니다."
- category: ai
  level: "중급"
  title: 'Agent Teams — 서브에이전트와 뭐가 다른가: 서로 대화하고 일을 나눠 갖는 팀'
  summary: Claude Code Agent Teams는 팀 리드와 독립된 Claude Code 팀원이 메시지를 주고받으며 병렬 작업하는 실험 기능이다. 서브에이전트는 결과를 호출자에게 돌려주지만, 팀원은 서로 조율하고 공유 작업 목록(사용 가능한 Task 도구가 있는 세션)을 쓸 수 있다. 조율이 필요한 독립 작업에 유용하지만 토큰을 더 쓴다.
  points:
  - "기본은 꺼져 있다. `CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1`로 켜며, 팀원 생성은 대화형 세션에서만 된다. `claude -p`·Agent SDK는 팀 대신 일반 서브에이전트를 쓴다."
  - "기능을 켜면 이름을 지정해 만든 서브에이전트도 팀원으로 시작할 수 있다. 원치 않는 팀 생성을 피하려면 활성화 범위를 확인한다."
  - "팀원은 프로젝트 지침·도구 설정과 별도 컨텍스트를 받지만 리드의 대화 기록은 받지 않는다. 작업 목표와 필요한 사실을 생성 요청에 넣는다."
  - "계획 승인도 자동이라고 가정하지 않는다. Plan mode 팀원의 계획은 팀원 권한 모드를 따로 바꾸지 않으면 도착 즉시 자동 승인된다. 독립 리뷰·가설 검증에는 팀, 순차 작업이나 짧은 위임에는 서브에이전트가 더 적합하다."
  source: https://code.claude.com/docs/en/agent-teams
  interview: "Agent Teams와 서브에이전트는 작업을 어떻게 나누고, Plan mode에서 팀원 계획이 리드의 수동 검토를 보장하나요?"
  answer: "팀은 팀원 간 메시지와 공유 작업 목록으로 스스로 조율하고 토큰 비용이 더 크다. 서브에이전트는 결과를 호출자에게 보고한다. Plan mode 계획은 팀원 권한 모드를 바꾸지 않으면 자동 승인되므로 수동 검토가 보장되지 않는다."
- category: ai
  level: "초급"
  title: Anthropic 내부 팀 활용법 — 코드 안 짜는 팀까지 Claude Code를 쓰는 실전 패턴
  summary: Anthropic 직원 인터뷰에 따르면 Claude Code는 코드 탐색·테스트·장애 분석뿐 아니라 문서 정리, 시각화, 광고 자동화, 비개발팀의 프로토타입에도 쓰였다. 회사가 소개한 시간 절감 수치는 내부 사례 보고이지, 통제된 실험이나 다른 조직에서도 보장되는 효과는 아니다.
  points:
  - "개발: 익숙하지 않은 코드베이스를 설명하게 하고, 테스트 작성·리뷰와 스택 트레이스 기반 장애 분석에 활용한다."
  - "문서·운영: 여러 문서를 요약해 실행 절차를 만들고, 반복 업무를 작은 스크립트나 프로토타입으로 바꾼다."
  - "비개발팀 사례: 디자인팀의 Figma 프로토타입, 마케팅팀의 광고 CSV 분류·변형, 법무팀의 담당자 연결 도구가 소개됐다."
  - "실무 적용은 작은 반복 업무부터 시작한다. 필요한 코드·문서·오류 맥락을 주고, 결과는 테스트와 사람이 확인한다. 인터뷰에 나온 3배·80% 수치는 사례 보고로만 읽는다."
  source: https://claude.com/blog/how-anthropic-teams-use-claude-code
  interview: "Anthropic이 소개한 Claude Code의 비개발팀 활용 사례는 무엇이며, 시간 절감 수치를 어떻게 해석해야 하나요?"
  answer: "디자인팀은 Figma 기반 프로토타입, 마케팅팀은 광고 CSV 자동화, 법무팀은 담당자 연결 도구를 만들었다. 3배·80% 같은 수치는 회사가 소개한 개별 사례이지 일반 성능을 입증하는 통제 실험이 아니다."
- category: ai
  level: "중급"
  title: Continue — 높은 GitHub 별점도 현재 유지보수를 보장하지 않는다
  summary: Continue는 2026년 Cursor에 합류했다. 공식 GitHub 저장소는 오픈소스 코드가 Apache-2.0으로 남아 있지만, 더 이상 능동적으로 유지보수하지 않는다고 밝힌다. 릴리스 목록에서 VS Code 2.0.0은 최신 정식 릴리스, 2.1.0은 사전 릴리스로 표시되며 둘 다 2026년 6월 19일에 나왔다. CLI 문서가 남아 있어도 현재 지원·보안 업데이트를 보장하지는 않는다.
  points:
  - "GitHub 별 36.5k는 2026-11-22 조회 시점의 관심도다. 현재 릴리스 빈도, 보안 대응, 관리 주체를 별도로 확인한다."
  - "Apache-2.0은 코드를 사용·수정·배포할 권리를 설명할 뿐, 제품 지원이나 취약점 수정을 약속하지 않는다."
  - "`cn` CLI 문서는 여전히 이용 가능하다. 문서·패키지의 존재와 프로젝트가 계속 유지되는지는 다른 신호다."
  - "도입 전 필요한 기능을 고정 버전으로 시험하고, 업데이트 중단 시 포크·대체 도구·마이그레이션 경로를 정한다."
  sources:
  - label: Continue 인수 안내
    url: https://continue.dev/
  - label: 저장소 상태·라이선스
    url: https://github.com/continuedev/continue
  - label: 릴리스 이력
    url: https://github.com/continuedev/continue/releases
  - label: Continue CLI 문서
    url: https://docs.continue.dev/cli/quickstart
  interview: "별이 많은 Apache-2.0 오픈소스 도구를 선택할 때, 별점·라이선스 외에 어떤 위험 신호를 확인해야 하나요?"
  answer: "마지막 릴리스와 커밋, 유지보수 공지, 취약점 대응, 관리 주체를 확인한다. 별점은 과거 관심도이고 Apache-2.0은 재사용 권한이지 지속 지원 약속이 아니다. 업데이트가 멈출 경우를 대비해 핀 고정·포크·대체 경로도 준비한다."
- category: ai
  level: "고급"
  title: MCP 코드 실행 패턴 — 도구 정의와 중간 결과를 컨텍스트 밖에서 처리
  summary: 여러 MCP 서버를 직접 연결하면 도구 설명과 큰 중간 결과가 모델 컨텍스트와 왕복 비용을 늘릴 수 있다. 한 대안은 각 도구를 코드 API로 감싸고, 에이전트가 필요한 정의만 읽어 샌드박스에서 조합·필터링하도록 하는 것이다. 이는 MCP 표준 기능이 아니라 실행 환경을 포함한 아키텍처 패턴이다.
  points:
  - "도구 설명을 파일 기반 래퍼나 검색 가능한 목록으로 제공하면 필요한 정의만 읽는 점진적 공개가 가능하다. 파일 하나당 도구 하나는 한 구현 예이며 필수 규칙은 아니다."
  - "여러 도구를 호출하는 코드에서 필터·집계·조건문을 실행하고 필요한 결과만 모델에 돌려주면 중간 데이터를 반복해서 컨텍스트로 옮기지 않아도 된다."
  - "Anthropic은 Google Drive 회의록→Salesforce 사례에서 150,000→2,000 토큰을 보고했다(자사 예시, 98.7% 절감). 모든 작업의 보장값은 아니다."
  - "개인정보 보호는 자동 보장되지 않는다. 모델 입력 전 토큰화는 별도 구현이 필요하며, 생성 코드는 파일·네트워크·자격 증명을 제한한 샌드박스에서 실행하고 모니터링한다."
  source: https://www.anthropic.com/research/code-execution-with-mcp
  interview: "MCP 도구 실행을 코드 API와 샌드박스로 옮기면 컨텍스트 비용과 개인정보 위험이 어떻게 달라지나요?"
  answer: "필요한 도구 정의만 읽고 중간 데이터를 코드에서 필터링해 반환량을 줄일 수 있다. 하지만 MCP 자체가 개인정보를 가리거나 코드를 격리하지 않는다. 토큰화·권한 제한·리소스 제한이 있는 안전한 실행 환경을 별도로 설계해야 한다."
- category: ai
  level: "중급"
  title: Claude Code GitHub Action — 멘션형과 자동화형 워크플로를 구분하기
  summary: Claude Code GitHub Action은 저장소의 GitHub Actions 워크플로에서 Claude Code를 실행한다. `prompt`가 없으면 기본 `@claude` 멘션을 기다리는 대화형 모드이고, `prompt`가 있으면 이벤트에 따라 자동 실행하는 모드다. 모델 작업은 GitHub 러너에서 실행되며 GitHub Actions 사용량과 모델 인증 비용을 함께 고려해야 한다.
  points:
  - "대화형 모드는 이슈·PR 댓글의 `@claude` 요청에 응답한다. 자동화 모드는 워크플로 이벤트와 `prompt`로 실행하며, 결과는 기본적으로 실행 로그에 남는다."
  - "댓글·이슈 이벤트는 작성자의 저장소 쓰기 권한을 확인하고, 봇 실행은 기본 차단해 자동 호출 루프를 막는다. 워크플로 권한은 필요한 범위만 주고 결과를 검토한다."
  - "비용은 GitHub Actions 러너 시간과 모델 사용량으로 나뉜다. API 키는 API 사용량으로, Claude 구독 OAuth 토큰은 구독 한도 내에서 처리된다. 작업량에 따라 달라지므로 고정 비용을 가정하지 않는다."
  - "설치에는 저장소 관리자 권한과 앱·인증 설정이 필요하다. 빠른 설치는 Anthropic 직접 인증 경로용이며, 클라우드 제공자는 수동 설정 안내를 따른다."
  sources:
  - label: Claude Code GitHub Actions 문서
    url: https://code.claude.com/docs/en/github-actions
  - label: 공식 Action 저장소
    url: https://github.com/anthropics/claude-code-action
  interview: "GitHub Action에서 `prompt` 입력의 유무는 실행 모드와 결과 전달에 어떤 차이를 만들며, 비용·권한은 어떻게 통제하나요?"
  answer: "`prompt`가 없으면 기본적으로 `@claude` 멘션을 기다리고, 있으면 이벤트에서 자동 실행한다. 실행마다 GitHub 러너 시간과 모델 인증 비용이 들 수 있으므로 트리거·권한을 최소화하고 로그와 코드 변경을 검토한다."
- category: ai
  level: "중급"
  title: 멀티에이전트 작업 배치 — 세션·로컬 워크트리·클라우드 선택
  summary: 에이전트 작업은 어디서 실행하고 변경을 어떻게 격리할지로 나눠 생각할 수 있다. 같은 세션의 서브에이전트는 조사·분석을 분리하고, 로컬 워크트리는 병렬 코드 변경을 별도 작업공간에 둔다. 클라우드 에이전트는 준비된 원격 환경에서 작업을 이어갈 수 있다. 이는 제품 표준 분류가 아니라 작업 배치를 위한 실무 모델이다.
  points:
  - "같은 세션의 서브에이전트는 별도 컨텍스트에서 독립 조사하고 요약을 돌려준다. 여러 코드 작업을 병렬 실행한다면 변경 공간도 분리할지 정한다."
  - "Git worktree는 별도 체크아웃에서 작업하도록 격리한다. 같은 파일을 동시에 덮어쓰는 위험은 낮추지만, 나중의 병합 충돌이나 잘못된 변경까지 없애지는 않는다."
  - "클라우드 에이전트는 원격 환경에서 작업을 계속할 수 있다. 실행 환경·저장소 권한·네트워크·요금·결과 보존 방식은 제품마다 다르므로 확인한다."
  - "짧은 피드백 반복은 현재 세션, 로컬 코드 병렬 변경은 워크트리, 명확히 나눌 수 있는 비동기 작업은 클라우드부터 검토한다. 동시성의 정답 수는 없으며 비용과 통합·리뷰 부담도 함께 늘 수 있다."
  sources:
  - label: Claude Code 서브에이전트 문서
    url: https://code.claude.com/docs/en/sub-agents
  - label: GitHub Copilot 클라우드 에이전트
    url: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-on-github
  - label: Codex Cloud 안내
    url: https://help.openai.com/en/articles/20001545-using-codex-cloud
  interview: "Git worktree를 쓰면 병렬 에이전트의 충돌이 사라지나요? 작업 실행 위치를 고를 때 어떤 기준을 함께 봐야 하나요?"
  answer: "worktree는 작업 파일과 브랜치를 분리해 동시 편집을 줄이지만 병합 충돌·의미상 충돌은 남는다. 반복 피드백 필요성, 격리 수준, 비동기성, 접근 권한, 비용과 리뷰 부담을 보고 세션·로컬·클라우드 중 선택한다."
- category: ai
  level: "고급"
  title: 12-Factor Agents — 모델 판단과 애플리케이션 실행을 분리하기
  summary: HumanLayer의 12-Factor Agents는 LLM 제품을 만들 때 참고할 저자의 설계 원칙 모음이다. 핵심은 모델이 다음 행동을 구조화해 제안하고, 애플리케이션 코드가 이를 검증하고 실행하도록 책임을 나누는 것이다. 업계 표준이나 필수 체크리스트는 아니다.
  points:
  - "모델은 도구 호출 같은 구조화된 결과를 만든다. 앱 코드는 결과를 검증하고 권한·비즈니스 규칙에 따라 실제 작업을 수행한다."
  - "프롬프트·컨텍스트·제어 흐름을 앱에서 설계한다. 장기 작업은 실행 상태를 저장하고 pause/resume 경로를 제공하되, 비즈니스 상태와 합칠지는 복잡도와 보안 요구를 보고 정한다."
  - "저자의 '70~80% 품질' 언급은 빌더 인터뷰에서 얻은 경험적 서술이지 통제된 벤치마크 결과가 아니다. 12번째 stateless reducer 원칙도 저자는 'mostly just for fun'이라고 덧붙인다."
  sources:
  - label: 12-Factor Agents 원칙 모음
    url: https://github.com/humanlayer/12-factor-agents
  - label: 도구는 구조화된 출력
    url: https://github.com/humanlayer/12-factor-agents/blob/main/content/factor-04-tools-are-structured-outputs.md
  - label: 실행 상태와 pause/resume
    url: https://github.com/humanlayer/12-factor-agents/blob/main/content/factor-05-unify-execution-state.md
  interview: "에이전트에서 LLM과 애플리케이션 코드는 각각 어떤 책임을 가져야 하나요? 12-Factor의 '70~80%' 수치는 성능 벤치마크인가요?"
  answer: "LLM은 구조화된 다음 행동을 제안하고, 앱 코드는 이를 검증해 권한과 규칙 안에서 실행한다. '70~80%'는 저자의 경험 서술이지 통제된 성능 측정이 아니므로 일반화하면 안 된다."
- category: ai
  level: "중급"
  title: Claude Code 서브에이전트 카탈로그 — 역할 프롬프트를 골라 검증하기
  summary: VoltAgent의 카탈로그는 2026-11-22 조회 시 161개 이상의 Claude Code 서브에이전트를 10개 범주로 제공했고 GitHub 별은 26.7k였다. Kotlin specialist는 Android·Compose 작업을 포함하지만, 이 파일은 검증된 Android 지식이 아니라 편집 가능한 역할 프롬프트다.
  points:
  - "Android용 Kotlin 역할이 필요하면 카탈로그의 `kotlin-specialist`를 살펴본다. `mobile-developer`는 현재 React Native 중심이므로 이름만 보고 Android 네이티브 전문가로 가정하지 않는다."
  - "전체 플러그인 대신 필요한 에이전트 하나를 프로젝트의 `.claude/agents/`에 두고 지침·도구 목록을 수정한다. 역할·도구 권한·모델은 정의 파일의 frontmatter에서 확인한다."
  - "프롬프트는 정확성이나 최신성을 보증하지 않는다. Android API·Gradle 권고는 공식 문서, 프로젝트 버전, 테스트로 확인하고 구체적인 검증 기준을 역할 지침에 넣는다."
  - "플러그인은 사용자 권한으로 코드를 실행할 수 있고 에이전트 설명도 세션 컨텍스트를 차지한다. 설치 전 hooks·MCP·실행 파일과 필요한 권한을 검토하고 쓰지 않는 범주는 설치하지 않는다."
  sources:
