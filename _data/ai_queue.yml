# Future hot AI cards for the 4-hour routine.
# The automation script appends the next unseen entry into _data/cards.yml.

- category: ai
  title: "Claude Code hooks — 세션 시작·중단을 자동화 포인트로 쓰기"
  summary: >
    훅은 세션 시작, 종료, 오류 시점에 자동 작업을 끼워 넣는 가장 강력한 자동화 포인트다.
    설정/정리/검증/메모 저장 같은 반복 작업을 사람이 직접 하지 않아도 되게 해 주며,
    에이전트가 상태를 잃기 쉬운 지점을 보완한다.
  points:
    - "세션 lifecycle 자동화 포인트"
    - "정리·검증·메모 저장에 유용"
    - "상태 유실 보완"
  source: "https://code.claude.com/docs/en/hooks"

- category: ai
  title: "Prompt caching — 컨텍스트 비용을 줄이는 첫 번째 레버"
  summary: >
    프롬프트 캐시는 반복되는 시스템/도구/메시지 블록을 재사용해 토큰 비용을 줄이는 방법이다.
    긴 에이전트 세션에서는 새로 넣는 정보보다 매번 반복되는 정보가 더 비싸질 수 있어,
    캐시 전략이 곧 운영비 절감 전략이 된다.
  points:
    - "반복 블록 재사용"
    - "긴 세션 비용 절감"
    - "운영비 최적화 레버"
  source: "https://platform.claude.com/docs/en/build-with-claude/prompt-caching"

- category: ai
  title: "Agent Teams — 서브에이전트보다 큰 병렬 협업 단위"
  summary: >
    Agent Teams는 각자 일을 맡는 서브에이전트보다 한 단계 큰 협업 구조다. 여러 에이전트가
    서로 대화하며 일을 나눠 갖고, 리드 에이전트가 방향을 잡는다. 복잡한 작업을 병렬화해야 할 때
    팀 단위 구성이 유리하다.
  points:
    - "서로 대화하는 협업 구조"
    - "리드 에이전트가 방향 설정"
    - "복잡한 병렬 작업에 적합"
  source: "https://code.claude.com/docs/en/agent-teams"

- category: ai
  title: "OpenAI GPT-5.4 계열 — 최신 모델 선택이 아니라 운영 전략"
  summary: >
    모델 선택은 단순히 '제일 좋은 것'을 고르는 문제가 아니라, 비용·속도·안정성·도구성 사이의
    운영 전략이다. 최신 고성능 모델은 좋지만, 반복 자동화에서는 속도나 비용이 더 중요한 경우가
    많아 작은 모델과 섞어 쓰는 방식이 실용적이다.
  points:
    - "모델 선택 = 운영 전략"
    - "비용·속도·안정성 균형"
    - "큰 모델 + 작은 모델 혼합이 실전적"
  source: "https://platform.openai.com/docs/models"
